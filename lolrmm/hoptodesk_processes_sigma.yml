note: |
  ### Technical Context
  This detection rule identifies potential unauthorized execution of the HopToDesk remote monitoring and management (RMM) tool. HopToDesk can be misused by attackers to gain access to endpoints and facilitate remote control, typically used for legitimate purposes such as IT support. However, its capabilities can also be exploited by threat actors for executing malicious activities like accessing sensitive data, deploying malware, or conducting lateral movement within a network.

  The likely attacker objectives include maintaining persistence in the environment, exfiltrating data, and performing reconnaissance activities. The detection is related to the MITRE ATT&CK framework under the following tactics and techniques:
  - **Execution (TA0002)**
  - **Remote Services (T1219)**

  The primary data sources for this detection include Windows process creation logs which can illustrate when and how often the HopToDesk application is invoked on a machine, indicating potential suspicious behavior when used outside of normal operational patterns.

  ### Investigation Steps
  - **Review Process Creation Events**: Check process creation logs for instances where `hoptodesk.exe` is invoked with unusual parent processes. Identify the time, user context, and associated command-line parameters for further insights.
  - **Analyze Network Traffic**: Inspect network logs for outbound connections that correlate with the execution of HopToDesk. Look for communication patterns or connections to known malicious IP addresses or domains.
  - **Verify User Accounts**: Confirm whether the user accounts initiating HopToDesk processes have proper authorization. Look into any unusual logins or atypical account usage around the time period of the detected activity.
  - **Check for Persistence Mechanisms**: Evaluate startup folders, scheduled tasks, and associated registry entries to identify any malicious attempts to maintain persistence through HopToDesk.

  ### Prioritization
  The severity of this alert is medium, as while the legitimate use of HopToDesk exists, its misuse may signify a compromised system. Both the potential impact of a remote access tool and the likelihood of exploitation in the enterprise context necessitate prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if processes related to HopToDesk are allowed for legitimate use without sufficient monitoring of usage patterns. The detection logic assumes that `hoptodesk.exe` is not used for benign purposes in certain environments. For this alert to function effectively, it requires enabled process creation logging and a configuration capable of capturing all executed processes on Windows systems within the organization.

