  ### Technical Context

  The Sigma rule detects file activity related to the PDQ Connect Remote Monitoring and Management (RMM) tool by monitoring for changes to the database journal file associated with the PDQConnectAgent. The likely attacker objective is to manipulate, exfiltrate, or compromise systems that utilize this legitimate administrative tool, potentially leading to unauthorized system access or data exfiltration. This behavior maps to the MITRE ATT&CK technique of "Execution" (T1219).

  Primary telemetry sources include Windows file event logs that capture changes to files, specifically monitoring activity on C:\ProgramData\PDQ\PDQConnectAgent\PDQConnectAgent.db-journal. If executed maliciously, this can indicate potential misuse of administrative privileges and compromise the security posture of the affected systems. This detection does NOT confirm that malicious activity occurred on its own; legitimate uses of PDQ Connect can also result in similar file activity.

  ### Investigation Steps

  - **Review file access logs:** Check Windows Security Event ID 4663 for access events to C:\ProgramData\PDQ\PDQConnectAgent\PDQConnectAgent.db-journal. Look for unusual user accounts or processes that are not typically associated with PDQ Connect.

  - **Compare timestamps with administrative tasks:** Cross-reference the timestamps of the file access with logs of legitimate administrative actions, such as PowerShell commands or other management tools logs, to assess whether this file activity matches expected usage patterns.

  - **Identify high-risk user behavior:** Look for users or accounts that are executing the PDQConnectAgent.db-journal file activity outside of standard administrative hours or from unusual workstations, which could indicate malicious intent.

  - **Validate with process creation logs:** Review Sysmon Event ID 1 for process creation events that involved `PDQConnectAgent.exe` or any related executables to ensure that they originate from legitimate, expected sources.

  - **Monitor any file modification events:** Audit Windows event ID 4656 and subsequent modification logs where the journal file is being altered. Unusual patterns or frequent write operations may indicate potential tampering or misconfiguration.

  - **Expected behavior reference:** Note that legitimate usage will typically involve the tool's operational context where `PDQConnectAgent.db-journal` is accessed by known administrative accounts during standard operational hours, often tethered with accompanying updater files or service control events.

  ### Prioritization

  This alert has a medium severity due to potential impacts on system integrity and control. Given the prevalence of RMM tools like PDQ Connect being targeted for compromise, there is a moderate likelihood of malicious abuse that aligns with common tactics utilized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not thoroughly monitored; specific configurations for the Windows file auditing must be enabled to ensure complete visibility. Typical legitimate activities can include routine maintenance and updates executed by IT personnel, which may produce similar log entries. Implementing companion detections around processes related to PDQ Connect, such as monitoring network traffic for anomalies during file access events, may enhance coverage against evasion tactics.

