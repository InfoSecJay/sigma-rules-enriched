  ### Technical Context
  This rule detects potential unauthorized file activity associated with the PDQ Connect Remote Monitoring and Management (RMM) tool. PDQ Connect is a legitimate system management application that can be misused by an attacker to execute malicious actions, such as unauthorized access to systems or manipulating file states without proper authorization. The detection specifically monitors changes to the `PDQConnectAgent.db-journal` file, which is a component of the PDQ Connect tool and may indicate suspicious behavior when accessed under unusual circumstances.

  The threat scenario often involves adversaries leveraging legitimate administrative tools for nefarious purposes, such as maintaining persistence, executing remote commands, or manipulating system configurations to facilitate lateral movement within the network. Given that PDQ Connect is intended for IT management, its misuse could lead to severe security implications, including unauthorized data exposure or modification.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - Execution (TA0002)
  - Command-Line Interface (T1059)
  - Remote Services (T1021)

  The primary data sources for effective detection include file event logs, particularly those monitoring file access and modification that can indicate unauthorized use of tools like PDQ Connect.

  ### Investigation Steps
  - **Review File Event Logs:** Investigate logs that capture file access to the `C:\ProgramData\PDQ\PDQConnectAgent\PDQConnectAgent.db-journal` path, and look for unexpected access by unknown users or processes that do not align with standard operational behavior.

  - **Correlate User Activity:** Analyze user activity logs around the time of the detected access to establish whether valid administrator actions were performed or if an unauthorized user may have abused their access.

  - **Inspect Running Processes:** Check for instances of PDQ Connect running on endpoints in conjunction with the logged file activity. Look for unexpected or unnecessary executions, especially by non-default users, indicating possible misuse.

  - **Analyze Contextual Events:** Gather context from surrounding events, such as other security alerts, recent changes in user privileges, or the execution of commands that may indicate lateral movement or privilege escalation associated with the observed activity.

  ### Prioritization
  The alert is classified as medium severity due to the potential for legitimate tools to be misused by attackers to compromise systems. Although the PDQ Connect tool is widely used for system management, abnormal activity regarding its file operations can signify a security risk that warrants immediate investigation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage may stem from legitimate usage of the PDQ Connect tool, leading to false positives during normal administrative functions. The detection logic assumes that any access to the specified database journal file is indicative of suspicious behavior; however, if legitimate administrative tasks coincide with this access, it might complicate investigations. Additionally, comprehensive logging configurations must be enabled to ensure that all file event data is captured accurately, which may not be the case in all environments.

