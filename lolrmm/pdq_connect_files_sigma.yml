note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the PDQ Connect remote monitoring and management (RMM) tool, specifically interactions with the `PDQConnectAgent.db-journal` file. Attackers leveraging remote management tools may seek to manipulate or exfiltrate data, potentially indicating an ongoing command-and-control (C2) operation or lateral movement within the network. This behavior is relevant to the MITRE ATT&CK tactic “Command and Control” (TA0011) and technique “Remote Access Software” (T1219).

  Primary telemetry sources include Windows file event logs, specifically monitoring changes or access to files in the `C:\ProgramData\PDQ` directory. If this activity is malicious, it could signify unauthorized remote access, data manipulation, or exfiltration. Importantly, this detection alone does NOT confirm malicious intent, as legitimate use of PDQ Connect for system management can trigger the same alert.

  ### Investigation Steps

  - **Review file access logs for PDQ Connect**: Check Windows Event ID 4663 for access to `C:\ProgramData\PDQ\PDQConnectAgent\PDQConnectAgent.db-journal`. Look for processes that accessed this file around the alert time. Legitimate accesses will often correlate with known maintenance windows or authorized system administration actions.

  - **Identify the process initiating the file access**: Cross-reference the Event ID 4688 (process creation) logs around the time of the alert to determine which process accessed the file. Valid entries should show PDQ Connect-related processes (e.g., `PDQConnectAgent.exe`).

  - **Correlate the alert with user activity**: Review authentication logs (Security Event ID 4624) to check for any unusual or unauthorized logins during the time of the file access. Look for accounts not typically associated with PDQ tool usage, especially if there's a pattern of access outside normal business hours.

  - **Check for unusual network connections**: Examine Windows Firewall or network logs for outbound connections to suspicious external IPs by systems running the PDQ tool. Cross-reference these IPs against threat intelligence feeds to identify known malicious actors.

  - **Document and validate expected PDQ usage**: Consult team records or system documentation to validate that the behavior aligns with known usage patterns. Legitimate activity typically shows consistent timing and frequency indicative of standard operation.

  ### Prioritization

  This alert is medium-severity due to the potential for significant impact, including unauthorized access or manipulation of sensitive data. While PDQ Connect is a legitimate tool, its capabilities are often exploited by attackers, making awareness of this activity crucial in the enterprise context.

  ### Blind Spots and Assumptions

  There are detection limitations around the use of PDQ Connect, particularly when legitimate admins might trigger similar logs during standard operations. Analysts must ensure that logging configurations are robust to capture all relevant file events. False positives can arise from routine IT maintenance. A complementing detection for unusual process behavior, such as monitoring for other remote management tool signatures, can help strengthen coverage against malicious usage.

