  ### Technical Context

  This Sigma rule detects network activity associated with the Neturo RMM (Remote Monitoring and Management) tool, specifically targeting connections to the domain `neturo.uplus.co.kr`. The likely objective of an attacker using this tool would be to establish remote access for ongoing control, data exfiltration, or further exploitation of the network environment. This detection falls under the MITRE ATT&CK tactic of Execution and specifically targets technique T1219 (Remote Access Software).

  The primary telemetry source for this detection is Windows network connection logs, particularly monitoring outbound traffic to suspect destinations. If this behavior is confirmed to be malicious, it poses a significant security risk, as it may indicate unwanted remote access to systems, potentially leading to data breaches or system compromises. It is essential to note that this detection does NOT confirm that an attack is in progress—further investigation is required to determine the actual intent behind the connection.

  ---

  ### Investigation Steps

  - **Check outbound connections:** Review Windows Security Event ID 5156 and Firewall logs showing creation or permit rules for outbound connections. Look specifically for connections to `neturo.uplus.co.kr`. Legitimate access will typically involve known administrative IPs or other whitelisted services.

  - **Verify process origin:** Investigate any associated processes initiating these connections using Sysmon Event ID 1 (process creation) to identify whether a legitimate application or a potentially malicious one is responsible. Legitimate processes should originate from known RMM tools and be launched by recognized users or administrators.

  - **Analyze user activity:** Review Windows Security Event ID 4624 (successful logon) and correlate the user accounts with the timestamps of the detected network activity. Ensure that the logged-in users are expected to initiate RMM tools, especially in enterprise environments with strict access control.

  - **Inspect recent changes in configurations:** Review Group Policy logs and local security policy changes to check if any configurations were modified that might allow unauthorized tools or processes to execute. Examine Event ID 4739 (domain policy change) for unusual administrative actions.

  - **Evaluate for additional indicators:** Look in application logs for the presence of Neturo RMM components. Investigate any executable named similar to the Neturo client and verify its integrity against known good hashes.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential for exploitation characteristics inherent in remote access tools. While not all connections indicate malicious intent, the specialized nature of Neturo as a remote management tool increases the likelihood of misappropriation. Therefore, immediate investigation is advised given the risk associated with potential data exfiltration or unauthorized access.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by using VPNs or proxy services to mask connections, which can prevent logs from identifying the true destination. Additionally, legitimate use of the Neturo tool within an enterprise could lead to false positives, necessitating a clear understanding of organizational policies regarding RMM tools. Security teams should also monitor for related detections such as unauthorized remote access tools (e.g., any traffic associated with commonly exploited remote administration protocols) to strengthen overall detection coverage.

