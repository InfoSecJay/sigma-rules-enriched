  ### Technical Context

  This Sigma rule detects network activity associated with the Neturo Remote Monitoring and Management (RMM) tool, specifically connections to the domain "neturo.uplus.co.kr". The likely attacker objective is establishing command-and-control (C2) communication, which can facilitate future exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK framework, specifically under the tactic of Command and Control (TA0011) and the technique T1219 (Remote Access Tools).

  The primary telemetry source is Windows network connection logs, which must capture outbound connection attempts. If malicious, this activity could indicate an adversary gaining foothold within the network and executing remote operations. It's important to note that this detection does NOT confirm malicious activity on its own; legitimate administrative use of the Neturo tool would create similar traffic patterns.

  ### Investigation Steps

  - **Check outbound connections to the Neturo domain:** Review Windows Security Event ID 5156 to find any connections initiated towards destination hostnames ending with "neturo.uplus.co.kr". Validate the source IP and application involved in the connection.

  - **Correlate with recent changes in software deployment:** Assess Change Management records to confirm if Neturo RMM was recently authorized or deployed within the environment. Legitimate recent activity should align with official operation procedures and documentation.

  - **Identify processes associated with the network activity:** Use Sysmon logs (Event ID 3) to identify processes that created outbound connections to the specified domain. Look for high-risk processes (e.g., PowerShell, cmd.exe) typically associated with malicious activity.

  - **Analyze the frequency and volume of network requests:** Use network monitoring tools to quantify the number of connections made to the Neturo domain. High-frequency attempts from unusual internal hosts may indicate malicious behavior.

  - **Review user account activity around the alert time:** Check Windows Security Event ID 4624 (successful logon) and focus on accounts that may not typically initiate this kind of network activity. Look for unscheduled logons outside of normal operational hours.

  ### Prioritization

  This alert is of medium severity due to the potential security impact if an affected system falls under adversarial control. The likelihood of abuse is notable, as remote access tools are commonly weaponized by threat actors to maintain persistence in compromised environments, thus requiring timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by false positives from legitimate use cases of Neturo by SOC personnel or IT administration. To ensure reliable detection, it's crucial to have comprehensive logging for network connections enabled on endpoints. Consider that legitimate software updates or administrative tasks may trigger this alert. A companion detection that strengthens coverage would involve monitoring for abnormal process executions (Sysmon Event ID 1) tied to these network requests, providing context on origin and intent.

