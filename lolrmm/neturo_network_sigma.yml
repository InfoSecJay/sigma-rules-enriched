note: |
  ### Technical Context
  This rule detects potential network activity associated with the Neturo Remote Monitoring and Management (RMM) tool. Neturo RMM is often employed by attackers to enable remote access and control over compromised systems, facilitating various malicious activities including data exfiltration and lateral movement across networks. Given its capabilities, the rule aims to identify any connections from internal systems to the known domain attributed to the Neturo tool, thereby flagging possibly malicious remote access efforts.

  Attackers utilizing Neturo RMM typically aim to maintain prolonged access to a target's environment, execute commands remotely, gather sensitive information, or deploy additional payloads. The detection aligns with the MITRE ATT&CK tactics of **Execution** (TA0002) and the specific technique **Remote Services** (T1219), which highlights the exploitation of remote access tools for command and control purposes.

  Primary data sources for this detection are network connection logs captured by systems like firewalls or endpoint network monitoring solutions, which will reveal outbound connections to the specified suspicious domain.

  ### Investigation Steps
  - **Review Network Connection Logs:** Analyze the network connection logs for outbound traffic to `neturo.uplus.co.kr`. Search for any patterns or unusual spikes in activity to this destination.

  - **Check Endpoint Activity:** Investigate the endpoints that initiated the connections. Look for any unusual processes or applications that typically wouldn't communicate with external services, particularly RMM tools.

  - **Validate Legitimate Use:** Consider context for the connections. Determine if any known operational use of Neturo exists within the organization, including any documented remote management requirements.

  - **Conduct Threat Intelligence Research:** Utilize threat intelligence services to identify if there are known associations or reported incidents involving the Neturo RMM tool that could provide additional context to the alerts generated.

  ### Prioritization
  The alert's severity is considered medium due to the potential impact of unauthorized remote access and control over systems in an enterprise environment. While legitimate uses may exist, the likelihood of malicious activity necessitates prompt investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to encrypted traffic or non-HTTP/S communication protocols that Neturo could use. The detection logic assumes that the outbound connection to the specified domain is malicious without considering context, which might lead to false positives from legitimate use cases of the RMM tool. It is essential for logs such as network connection events to be properly configured and for accurate resolution of domain names to ensure that alerts are effectively triggered by this rule.

