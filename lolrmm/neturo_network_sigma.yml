  ### Technical Context

  This rule detects potential network activity originating from the Neturo RMM (Remote Monitoring and Management) tool, specifically targeting the domain "neturo.uplus.co.kr." The objective of an attacker using this tool would be to maintain remote access, gather information, or execute commands on compromised systems. This detection aligns with the MITRE ATT&CK tactic of Execution and the technique T1219 (Remote Access Tools).

  The primary telemetry source for this detection is Windows network connection logs that capture outbound connection attempts to specific hostnames. If malicious, the security impact could be significant, potentially allowing an adversary to execute commands or exfiltrate sensitive data remotely. However, it's essential to note that the detection of this network activity does NOT confirm malicious intent; legitimate use of Neturo may also trigger this alert.

  ### Investigation Steps

  - **Identify network connection details:**
    Review the Windows Firewall/Network logs for Event ID 5156 for outbound connections to "neturo.uplus.co.kr." Check for the process name and user associated with these connections.

  - **Cross-reference process behavior:**
    Check for related process creation events (Security Event ID 4688 or Sysmon Event ID 1) to see if any unusual or unexpected processes were spawned concurrently with the network connection attempts. Look for known benign applications compared to potential malware indicators.

  - **Assess user context:**
    Validate the legitimacy of the user account initiating the connection. If the user is not a member of the IT administrative group or if this account has not previously accessed the Neturo RMM tool, flag this as suspicious.

  - **Review historical usage:**
    Look for previous network activity to "neturo.uplus.co.kr" within the Windows network logs. Legitimate usage patterns should show consistent scheduling or times of access corresponding with known IT maintenance windows.

  - **Examine system role:**
    Investigate whether the endpoint connecting to the Neturo domain is part of a critical infrastructure or sensitive data system. Assets with higher criticality should be prioritized for deeper investigation if flagged by this alert.

  ### Prioritization

  This alert has medium severity due to the potential for significant impact if a critical system is compromised and used for unauthorized remote access operations. Given that RMM tools like Neturo can be weaponized by adversaries to maintain persistence, the likelihood of malicious abuse is moderate, especially if the affected asset houses sensitive information.

  ### Blind Spots and Assumptions

  Evasion techniques may include using obfuscation or direct IP connection to bypass hostname detection. This rule relies on consistent network logging; any gaps in log retention or failures in device logging configurations could hinder reliable detection. Legitimate system administrators using Neturo and scheduled maintenance activities may frequently trigger this alert. Companion detections, such as monitoring for unusual process creation or suspicious command execution (e.g., PowerShell activity), would strengthen overall detection efficacy.

