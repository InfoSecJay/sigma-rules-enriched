note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the Neturo RMM (Remote Monitoring and Management) service, which is often utilized by attackers for command-and-control (C2) operations. The likely attacker objective is to establish control over compromised systems to execute further malicious activities, such as data exfiltration or reconnaissance. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001) and the technique of Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs, specifically focusing on Network Connection events that capture outgoing traffic. If confirmed to be malicious, the security impact could be significant, allowing an adversary to infiltrate and control targeted systems. It is crucial to note that this detection does NOT confirm that the activity is malicious on its own, as organizations may legitimately utilize Neturo for remote management.

  ### Investigation Steps

  - **Inspect outbound connections to Neturo domains:** Review Windows Firewall logs (Event ID 5140 or 5156) for connections to `*.neturo.uplus.co.kr`. Compare the timestamp of these events against usage patterns of legitimate network connections within your organization.

  - **Correlate with active remote management tools:** Check for known legitimate instances of Neturo in your environment, including authorized deployment logs or other management software showing expected operational use. Look for administrative users accessing the service during business hours.

  - **Identify high-confidence malicious indicators:** Search for any unusual spikes in traffic to `neturo.uplus.co.kr` that occur outside normal operational hours, especially if accompanied by suspicious process executions (Sysmon Event ID 1) initiating outbound connections.

  - **Review user permissions on the affected host:** Analyze the permissions of the user account initiating the connection. Elevated access or anomaly, such as a non-administrative user connecting to Neturo without context, may indicate malicious activity.

  - **Analyze network traffic for follow-up actions:** If connection logs are present, examine associated TCP packets for dark traffic indicative of RMM tool activities, such as unexpected command responses or payload transfers, utilizing tools like Wireshark.

  ### Prioritization

  This alert is rated medium severity due to the potential impact of an RMM tool on critical systems and the risk of malicious use. While RMM tools are commonly weaponized for external control, their legitimate use must be verified against trusted user activity to reduce false positives.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that some legitimate uses of Neturo might trigger the alert, leading to false positives without careful context analysis. Reliable detection necessitates proper logging configurations for network connections on within Windows environments. Legitimate administrative actions, such as scheduled maintenance windows remotely via Neturo, may also trigger alerts. A companion detection to consider is monitoring for abnormal process creation patterns (Sysmon Event ID 1) that might coincide with outbound connections to further assess malicious indicators.

