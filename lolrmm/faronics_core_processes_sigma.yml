note: |
  ### Technical Context

  This rule detects instances of process activity originating from the Faronics Core RMM tool, specifically focused on the executable files `FaronicsCoreAgent.exe` and `CoreAgentService.exe`. The likely attacker objective is to leverage these remote management tools for unauthorized access, command execution, or data exfiltration on enterprise systems. This behavior aligns with the MITRE ATT&CK tactic for **Command and Control (T1071)**, specifically technique **Application Layer Protocol (T1219)**.

  The primary telemetry sources for this detection are Windows process creation logs, which can be acquired from Security Event ID 4688 and/or Sysmon Event ID 1. If malicious, the security impact could include unauthorized access and control over internal resources. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate usage of Faronics Core RMM tools in the environment may trigger similar alerts.

  ### Investigation Steps

  - **Verify process parent-child relationships:** Cross-reference Security Event ID 4688 logs to identify the parent process of `FaronicsCoreAgent.exe` and `CoreAgentService.exe`. Legitimate initiators typically include known system administration tools or user account actions; malicious activity may show unexpected parent processes.

  - **Check user accounts:** Analyze the user context under which these processes were initiated. Review fields such as `NewProcessName`, `SubjectUserName`, and `ProcessId` to identify if the execution occurred under a common service account versus unusual or inactive accounts.

  - **Inspect the command line arguments:** Review any command line arguments associated with the detected process occurrences. Legitimate actions will often include standard maintenance options, while malicious indicators may contain obfuscation or unusual flags indicating intent to hide activity.

  - **Correlate with remote management activity:** Cross-check with network logs that capture traffic from the machine where the processes are detected. Look for connections to external IPs or unexpected internal endpoints, particularly those that may signal outbound command and control attempts.

  - **Identify installation artifacts:** Confirm the presence of the installation artifacts (like service registrations or configuration files) typically associated with legitimate installations of Faronics Core. Check registry keys or file paths that correspond to known usage locations for Faronics tools.

  ### Prioritization

  The alert indicates medium severity based on its potential impact on critical systems managed by the Faronics Core tool. The likelihood of malicious abuse is moderate, as compromised environments or inattentive admins could unwittingly allow unauthorized use of legitimate tools. Additionally, this behavior has been weaponized in targeted attacks leveraging remote management tools for lateral movement.

  ### Blind Spots and Assumptions

  Detection limitations include adversaries potentially renaming Faronics executables, which could evade this rule. A requirement for reliable detection includes having Sysmon deployed for comprehensive logging of process creation events. Legitimate IT administrative maintenance and patch management actions may also trigger this alert, thus careful contextual investigation is necessary. A related detection to strengthen coverage would be monitoring network traffic for anomalous communication patterns indicative of command and control operations.

