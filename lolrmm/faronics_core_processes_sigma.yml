note: |
  ### Technical Context

  This Sigma rule detects process activities associated with the Faronics Core RMM tool, specifically the execution of processes like `FaronicsCoreAgent.exe` and `CoreAgentService.exe`. The likely attacker objective may involve using the RMM tool for remote access, configuration management, or potentially malicious script execution on targeted systems. The relevant MITRE ATT&CK tactic is **Execution** (TA0002), with technique ID **T1219** (Remote Access Software).

  The primary telemetry source for this detection is Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, which capture details of newly created processes and their parent-child relationships. If observed in a malicious context, this activity could facilitate unauthorized access or control over systems. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative use of the Faronics Core RMM tool can trigger similar alerts.

  ### Investigation Steps

  - **Check process details:** Review Event ID 4688 or Sysmon Event ID 1 for the process command line. Legitimate instances typically include clear parameters for known maintenance tasks conducted via the Faronics agent.

  - **Correlate parent-child relationships:** Examine the parent process listed in logs. Legitimate usage usually originates from known management applications or administrative users, while anomalous lineage can indicate misuse.

  - **Verify process execution timing:** Analyze the timing of the alerts. Unexpected or off-hours execution of `FaronicsCoreAgent.exe` or `CoreAgentService.exe` could signal malicious intent, especially if associated with non-admin accounts.

  - **Identify high-confidence malicious indicators:** Look for unusual process attributes, such as unexpected command-line arguments or execution from non-standard directories. For example, `C:\Windows\Temp\` is uncommon for this tool.

  - **Inspect user and asset roles:** Determine the user account executing the process. Administrative accounts performing consistent and approved RMM activities are expected. Non-admin accounts or unusual system role contexts are red flags.

  - **Review system logs for related activities:** Check for any accompanying log entries related to system changes or network activities. Look for relevant entries in Windows Application logs or network monitoring that correlate with unusual process behavior.

  ### Prioritization

  This alert has a medium severity due to the potential impact on critical systems where Faronics Core RMM is used for management. While the tool itself is legitimate, it is also capable of being weaponized by adversaries to gain unauthorized access, necessitating careful context around each alert.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of Faronics Core, resulting in false positives. Reliable detection requires proper deployment and configuration of endpoint logging, specifically the capture of process creation events. Activities such as legitimate remote management tasks can trigger this alert, hence the necessity for contextual analysis. A related detection to strengthen coverage could involve monitoring unusual network connections initiated by these processes, providing insights into potential data exfiltration.

