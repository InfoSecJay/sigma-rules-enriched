note: |
  ### Technical Context

  This Sigma rule detects modifications to specific registry entries associated with the VIZOR Remote Monitoring and Management (RMM) tool. The likely objective of an attacker utilizing VIZOR would be to gain persistent access or control over a system for the purposes of managing software deployment or performing malicious activities. The relevant MITRE ATT&CK tactics and techniques include Command and Control (Tactic ID: TA0011) and T1219 (Remote Access Tools).

  The primary telemetry source for this detection is Windows registry event logs, specifically targeting changes to uninstall keys that indicate potential installation or alteration of the VIZOR RMM tool. If the behavior is malicious, it could lead to unauthorized access to systems and data exfiltration. However, this detection does NOT confirm that the registry modifications are inherently malicious without additional contextual evidence or corroborative alerts.

  ### Investigation Steps

  - **Identify affected systems:** Determine the host(s) from the alert notifications that logged registry changes. Review Event ID 4657 for registry modifications.

  - **Review registry modification details:** Check the registry event log entries (Event ID 13) associated with the detected keys. Look for fields indicating the time, user, and process responsible for the modification.

  - **Validate legitimate VIZOR usage:** Assess if the changes correspond to recent authorized use of the VIZOR tool based on system management requests or typical scheduled tasks in logs. Compare timestamps and users with known operational activity.

  - **Search for signs of abuse:** Investigate the presence of additional artifacts, such as Event ID 4688 showing the execution of VIZOR processes. Look for unusual command-line arguments that deviate from standard operating procedures.

  - **Look for accompanying C2 artifacts:** Examine network logs (firewall or proxy logs) for outbound connections to known C2 IPs or domains associated with VIZOR. This could indicate malicious remote access.

  - **Cross-reference threat intelligence:** Utilize threat intelligence databases to see if the specified registry keys have been classified as malicious or if there is evidence of active exploitation related to VIZOR.

  ### Prioritization

  This alert has a medium severity rating due to the potential impact of unauthorized RMM tool installation on sensitive systems. The likelihood of malicious abuse is moderate, as attackers may employ similar tactics to gain footholds in networks. Although not pervasive, behavior involving RMM tools is increasingly weaponized by threat actors seeking persistence.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using custom tools or by altering the registry without triggering the specific keys monitored. Reliable detection requires sufficient logging configurations for all registry accesses, including enabling detailed audit logging for the Windows registry. Legitimate activity may include authorized IT management tasks using the VIZOR RMM tool. A companion detection to enhance coverage could involve monitoring User Account Control (UAC) events to detect unauthorized privilege escalation attempts related to RMM tools.

