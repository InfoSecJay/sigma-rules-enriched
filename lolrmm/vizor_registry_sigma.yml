note: |
  ### Technical Context

  This detection rule identifies potential unauthorized registry activity related to the VIZOR Remote Monitoring and Management (RMM) tool on Windows systems. Such behavior may be indicative of attackers attempting to deploy or manipulate remote management solutions for persistence or information exfiltration. The likely attacker objective is to maintain control over a compromised machine while evading detection through legitimate tooling.

  Relevant MITRE ATT&CK technique includes Execution (T1203), specifically related to launching malicious software through executable programs or utilities. The primary telemetry source is Windows registry event logs that capture changes to installed applications or services. If malicious, this behavior can lead to unauthorized access, system manipulation, or data breaches. This detection does NOT confirm that the VIZOR tool is being used maliciously, as it may be part of legitimate administrative operations.

  ### Investigation Steps

  - **Check Registry Changes:**
    Investigate Windows Registry Event ID 4663 for modifications to keys containing `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{04821777-1FD1-4C1A-AC4D-BF5D4D53C34C}` or `HKLM\SOFTWARE\Metaquest`. Compare timestamps and user context to identify unexpected changes.

  - **Correlate with Process Creation Events:**
    Review Security Event ID 4688 and Sysmon Event ID 1 for any process creation events that occurred immediately before or after the registry changes. Look for processes that may be associated with the VIZOR tool and identify their parent process, focusing on unusual execution paths.

  - **Identify Legitimate Usage Patterns:**
    Verify if the registry changes correspond to known legitimate VIZOR installations within your organization. Check asset inventory to confirm deployment.

  - **Examine User Activity:**
    Analyze user activity associated with the changes by inspecting Security Event ID 4624 for logon events. Identify whether the user was authorized and had a legitimate reason to access the system during the registry modifications.

  - **Assess Impact on Critical Assets:**
    Prioritize investigation if the registry activity occurs on critical servers or endpoints, such as domain controllers or systems with sensitive data. Assess potential risk levels based on asset significance.

  - **Look for Malicious Indicators:**
    Validate additional indicators of compromise (IOCs) such as unexpected network traffic patterns directed to known attack servers or unusual outbound connections from the affected systems after the registry modifications.

  ### Prioritization

  The alert severity is medium due to the potential impact on enterprise security from unauthorized remote management tool usage. The likelihood of malicious abuse is moderate, given that such tools are known for both legitimate administrative purposes and exploitation by attackers. This behavior is less common but can be weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include evasion techniques where attackers may use legitimate tools or modify their signatures to blend in. Required log sources for reliable detection include Windows registry event logs and process creation logs from Sysmon. Legitimate activities could involve IT personnel deploying or updating VIZOR RMM tools. A related detection that strengthens coverage is monitoring network connections for anomalies associated with VIZOR communications.

