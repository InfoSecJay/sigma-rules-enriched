note: |
  ### Technical Context
  This detection rule identifies potential activities of the Pandora RC (eHorus) Remote Monitoring and Management (RMM) tool on Windows systems. RMM tools like eHorus are often utilized by IT administrators for remote support and system management. However, they can also be exploited by malicious actors to gain unauthorized access and control over systems, potentially leading to data breaches, malware deployment, or ongoing command-and-control (C2) operations. The likely attacker objective could involve lateral movement within the network, unauthorized data access, or the execution of malicious payloads disguised as legitimate administrative activities.

  The relevant MITRE ATT&CK tactics for this detection include **Execution (TA0002)**, specifically the technique **Remote System Execution (T1219)**, which involves executing commands on remote systems. By monitoring for specific process creation events associated with eHorus, this rule aims to surface suspicious use cases that may indicate nefarious intentions behind what could appear to be legitimate administrative tasks.

  Primary data sources for detecting this activity include **process creation logs**, which capture details about processes initiated on Windows systems. This logging is crucial for analyzing any unusual or unauthorized execution of remote management tools.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze process creation logs for instances of `ehorus standalone.exe` and `ehorus_agent.exe`. Pay close attention to the parent process to determine the context of the execution.

  - **Correlate with User Activity:** Identify the user accounts associated with the detected processes. Look for any anomalies in user behavior, such as remote access or elevated privileges that deviate from the user's typical access patterns.

  - **Investigate Network Connections:** Examine outbound connections from the affected systems for any suspicious communication patterns, particularly to known C2 addresses or unusual external IPs that may signal unauthorized remote access.

  - **Conduct Asset Inventory:** Ensure that legitimate use of eHorus is documented within your organization. Cross-reference detected processes against accepted tools used for IT management to reduce false positives.

  ### Prioritization
  This alert carries a medium severity level in an enterprise environment due to the potential for misuse of RMM tools such as eHorus. While the legitimate administrative use of this software exists, the likelihood of exploitation in the current threat landscape necessitates prompt investigation to mitigate risks.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on specific process names, which may change or be obfuscated by adversaries; thus, this detection may not capture all variants of the tool. The detection logic assumes that the process naming conventions remain constant, and may not account for renamed or custom versions of the tool. Adequate logging of process creation events must be enabled and maintained on Windows systems for this alert to function effectively.

