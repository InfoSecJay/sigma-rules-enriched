note: |
  ### Technical Context

  This rule detects the launch of processes associated with the Pandora RC (eHorus) Remote Monitoring and Management (RMM) tool, specifically `ehorus standalone.exe` and `ehorus_agent.exe`. The likely attacker objective is to remotely control and monitor compromised systems for data exfiltration or further exploitation. This behavior correlates with the MITRE ATT&CK tactic of Command and Control (ID: TA0011) and the technique of Application Layer Protocol (ID: T1219).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If detected as malicious, this activity could indicate a significant security breach where an adversary has gained unauthorized access to system resources. It’s essential to note that this detection alone does not confirm malicious activity, as the legitimate use of Pandora RC (eHorus) for IT management could trigger these alerts.

  ### Investigation Steps

  - **Review process creation details: ** Check Security Event ID 4688 or Sysmon Event ID 1 for the process creation records. Focus on identifying the parent and child process relationships to understand the execution context.

  - **Verify legitimate usage: ** Ensure that the identified process execution is within the context of approved IT management strategies, such as remote administration. Look for expected patterns in organizational use, such as execution from known IT management accounts.

  - **Identify high-confidence malicious indicators: ** Examine the command line arguments or execution paths associated with the detected processes. Look for unusual flags or execution from non-standard directories which may indicate misuse.

  - **Correlate time of execution: ** Match the timestamp of the alert with other security events such as failed login attempts or unusual network traffic (e.g., outbound connections to unknown IP addresses on non-standard ports).

  - **Assess asset criticality: ** Determine the role of the asset where the alert was triggered (e.g., server, user endpoint). An alert on a critical server should be treated with higher priority than one on a testing environment.

  ### Prioritization

  This alert holds medium severity as it may indicate potential malicious activity involving remote monitoring or control, particularly if observed on sensitive systems. The likelihood of abuse is notable, as RMM tools can be weaponized by adversaries for persistence and lateral movement within a network. However, given its legitimate uses, careful validation is essential before escalating.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include renaming the executable or executing the RMM tool from an unmonitored directory. Reliance on specific Windows logs is necessary; configurations must ensure that Sysmon and security auditing are correctly enabled to capture the relevant details. Legitimate administrative activities could also trigger this alert, especially if the organization's IT staff uses Pandora RC (eHorus) for routine maintenance. A related detection to consider is monitoring for outbound connections from the RMM tool to external IP addresses, enhancing visibility into potential command and control indicators.

