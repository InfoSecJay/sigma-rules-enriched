note: |
  ### Technical Context

  This rule detects the execution of processes associated with the eHorus Remote Control (Pandora RC) tool, specifically `ehorus standalone.exe` and `ehorus_agent.exe`. The likely attacker objective could be remote access or control over compromised systems to establish persistence and perform lateral movements. The relevant MITRE ATT&CK tactic is "Execution" (ID T1203) for the execution of malicious processes.

  Primary telemetry sources for this detection include Windows Security Event ID 4688, which logs process creation events. If malicious, the security impact is significant, as this could enable unauthorized access, data exfiltration, or further compromise of the network. Importantly, this detection does NOT confirm whether the behavior is malicious, as valid use cases for this tool exist in managed environments.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 for logs related to `ehorus standalone.exe` or `ehorus_agent.exe`. Look for the process creation time and user context to assess whether it matches known configurations.

  - **Assess parent process context:** Verify the parent process of the detected artifact using the Event ID 4688 logs. A legitimate parent process is a known management application like “Task Scheduler” or an authorized administrative tool. An unexpected parent process may indicate malicious usage.

  - **Correlate with user activity:** Examine user activity around the time of the detected process. Check for any unusual login attempts or access rights changes in Event ID 4624 (Logon) or Event ID 4634 (Logoff) that could suggest unauthorized entry.

  - **Investigate network connections:** Review related inbound and outbound network traffic for connections to command and control servers or unusual external endpoints using firewall or IDS logs. Look for activities such as unusual DNS queries in logs that would indicate exfiltration or remote control attempts.

  - **Identify unique artifacts:** Check for creation or modification timestamps of configuration files or logs associated with the eHorus tool. For instance, `C:\Program Data\ehorus\` should have stress test logs, and any anomalous timestamps may indicate suspicious activity.

  - **Legitimate behavior validation:** Confirm if the tool is being used by any authorized personnel or applications within your organization. This can include checking service accounts that have permissions to run remote administration tools.

  ### Prioritization

  This alert should be considered medium severity, as the processes in question are tools often leveraged by both legitimate remote management and potential adversaries. Given the operational context and risk of unauthorized access, prompt investigation is warranted, especially in sensitive environments. The likelihood of attack usage increases as these tools are frequently weaponized for persistence in compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the availability of logs, as it relies on Event ID 4688, which could be disabled in some environments. Attackers may also employ evasion techniques like renaming the executable or using exploit kits to bypass detection. Legitimate usage of the eHorus tool by IT administrators could trigger false positives. A companion detection focused on unusual network activity or abnormal user privilege escalation can strengthen overall situational awareness.

