  ---

  ### Technical Context

  This Sigma rule detects the execution of the Pandora RC (eHorus) remote management tool processes, specifically “ehorus_standalone.exe” and “ehorus_agent.exe.” The likely objective of an attacker utilizing this tool is to gain remote control over systems in the environment for reconnaissance or exploitation purposes. This behavior can align with the MITRE ATT&CK technique **T1219 - Remote Access Software**. The primary telemetry source is Windows process creation logs, particularly focusing on Event ID 4688, which records newly created processes. If this activity is malicious, it can lead to unauthorized access, data exfiltration, or lateral movement within the network. This detection does NOT confirm malicious intent by itself; legitimate usage of this tool for remote management may occur within the enterprise.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 for instances where the images “ehorus_standalone.exe” or “ehorus_agent.exe” are invoked. Focus on the account associated with the process initiation to assess legitimacy.

  - **Inspect parent process details:** Investigate the parent image associated with the detected processes. If the parent process is not a legitimate IT management tool, this may indicate suspicious activity.

  - **Determine the execution context:** Evaluate whether the execution is occurring under an administrative or service account typically used for remote management versus a standard user account, which would be more suspicious.

  - **Validate legitimate usage:** Cross-reference reported occurrences against internal documentation or ticketing systems to see if the use of Pandora RC is authorized for IT support tasks within the organization.

  - **Check for network connections:** Analyze network traffic logs (e.g., proxy logs or Windows Firewall Event ID 5156) following the execution of the identified processes to see if they establish outbound connections, especially to known malicious IPs or suspicious domains.

  - **Monitor for file artifacts:** Look for any file creation or modification events related to a remote access tool (e.g., new executables or scripts created by the tools) in logs such as Sysmon Event ID 11 or Windows Event ID 4663.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential for significant impact on security if the affected system is exploited. The likelihood of malicious abuse is moderate, given that remote management tools can be weaponized. Additionally, legitimate usage within the enterprise must be carefully discerned to avoid false positives.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as renaming the executable or obfuscation methods that may prevent the alert from triggering. Required log sources include detailed process creation logs, and the execution context must be clearly defined in operational procedures. Legitimate activities, such as authorized IT support using Pandora RC, may trigger the alert. A related detection that strengthens coverage is monitoring for unauthorized changes in common administrative tools or unauthorized installations of remote access software.

