note: |
  ### Technical Context

  This rule detects network activity indicative of the use of Ammyy Admin, a remote management tool often exploited by adversaries for unauthorized access and control over target systems. The likely attacker objective includes evasion of detection while establishing a foothold or exfiltrating sensitive information. This behavior is categorized under the MITRE ATT&CK tactic of Execution (TA0002) and the technique of Remote Access Tools (T1219).

  Primary telemetry sources involve Windows network connection logs that capture outbound traffic to specific known Ammyy Admin domains and IP addresses. If this activity is determined to be malicious, it could enable extensive data compromise or a pivot point for further attacks. Notably, this detection does NOT confirm malicious activity on its own, as legitimate use of Ammyy Admin also generates similar network traffic.

  ### Investigation Steps

  - **Identify network connections to Ammyy Admin domains:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections targeting 'ammyy.com' or specific IPs (136.243.104.235, 136.243.104.242, 136.243.18.122). Look for process names and parent processes initiating these connections to assess their legitimacy.

  - **Correlate process activity:** Check for Security Event ID 4688 to identify whether the connection corresponds to a running process like "Ammyy Admin.exe." If present, further investigate the process hierarchy and any unusual parent processes, indicating potential malicious intentions.

  - **Review relevant firewall logs:** Analyze firewall event logs for outbound connections tagged with Ammyy Admin-related domains or IPs to cross-validate against other network security telemetry.

  - **Assess asset role clarity:** Confirm the role of the affected host; if it's a sensitive or critical system (e.g., domain controller, financial server), the alert requires immediate escalation. Legitimate Ammyy Admin usage would typically be isolated to IT support personnel on non-critical systems with appropriate logging enabled.

  - **Check for exfiltration indicators:** Validate file operations (Event ID 4663) during the time of detected network activity. Look for unusual file access patterns or transfers occurring after establishing the connection with Ammyy Admin, which would indicate potential malicious exfiltration.

  ### Prioritization

  The alert has a medium severity due to the potential compromise of critical systems or sensitive data through unauthorized remote access. The likelihood of abuse is moderate, as Ammyy Admin is widely recognized as a tool leveraged for malicious purposes. However, it is also used legitimately in certain environments, which can dilute the prioritization.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of logging for outbound connections to other similar remote access tools or if ports used are usually considered benign (such as default RDP ports). Legitimate remote support operations may trigger the alert, complicating investigations. A related detection encompassing unauthorized use of other remote access tools (like TeamViewer or AnyDesk) could enhance coverage and context during investigations.

