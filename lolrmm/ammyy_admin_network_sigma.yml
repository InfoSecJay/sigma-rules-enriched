note: |
  ### Technical Context

  This Sigma rule detects network activity related to the Ammyy Admin remote management tool, commonly used for remote support and administration. Attackers may leverage this tool for unauthorized access to systems, often with the objective of data exfiltration or lateral movement within the network. This behavior falls under the MITRE ATT&CK tactic for Command and Control (T1071) and the technique for Remote Access Tools (RAT) (T1219).

  The primary telemetry sources are Windows network connection logs, specifically monitoring for outbound connections to hosts associated with Ammyy Admin. If this activity is unauthorized, it poses significant risk, enabling attackers to manipulate systems or steal sensitive information. It is important to note that this detection does NOT confirm malicious intent or compromise without further investigation; legitimate administrative use of the Ammyy Admin tool exists.

  ### Investigation Steps

  - **Check network logs for outbound connections:** Identify instances of connections to `*.ammyy.com`. Review Windows Event ID 5156 (Windows Filtering Platform) or network visibility logs (e.g., firewall logs) for destination IPs and user context.

  - **Examine process execution:** Investigate the process tree related to the connections. Look for the parent process of `AmmyyAdmin.exe` using Sysmon Event ID 1, noting whether it was executed by a known administrative account or service.

  - **Identify user activity patterns:** Review user activity around the time of the connection. Utilize logs from User and Entity Behavior Analytics (UEBA) to establish a baseline for typical remote access activities versus anomalous behavior.

  - **Verify known administrative use:** Determine if the use of Ammyy Admin is allowed in your environment. Engage with the relevant teams to confirm if any authorized personnel were performing legitimate support using this tool.

  - **Collect file artifacts:** Look for file creation of Ammyy Admin artifacts in typical directories (`C:\Program Files\Ammyy Admin\` or `C:\Users\<User>\AppData\Local\Temp\`). Assess the file hashes against known safe or malicious indicators.

  ### Prioritization

  This alert should be considered medium in severity due to the potential impact of unauthorized access on sensitive systems. While Ammyy Admin can be benignly used for legitimate purposes, its known use in malicious scenarios elevates the need for careful investigation. The behavior is weaponized in certain contexts, making prompt action necessary upon verification of malicious activity.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if Ammyy Admin is used in a portable manner or if its execution is obfuscated. Ensure that remote access software logs are actively collected and that filtering is configured correctly to capture this traffic. Legitimate administrator use of Ammyy Admin for support tasks could trigger this alert. Companion detections for related remote access tools or anomalous user behavior (e.g., T1071, T1219) can enhance coverage and context for investigations.

