note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the Ammyy Admin remote management tool, which could indicate unauthorized remote access to systems within the enterprise. The primary motivation for an adversary using Ammyy Admin would typically be to establish remote control over compromised systems, facilitating further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Remote Access (TA0009), specifically under the technique of Remote Access Software (T1219).

  The primary telemetry sources required for this detection are Windows network connection logs, focusing on the destination hostname or IP addresses associated with Ammyy Admin. If detected, this behavior could imply a serious security risk, allowing malicious actors full control over the affected devices without proper authorization. It's important to note that the detection of this activity does NOT, on its own, confirm malicious behavior, as there may be legitimate instances of Ammyy Admin usage within the organization.

  ### Investigation Steps

  - **Check network connection logs:** Search Windows network connection logs (Event ID 5156) for connections to the destination hostnames `ammyy.com`, or the specified IPs (e.g., `136.243.104.235`). Malicious activity would show unexpected outbound connections from critical systems without prior approval.

  - **Review user accounts involved:** Inspect Windows logs for account activities (Event ID 4624). Analyze which user accounts initiated the Ammyy Admin connections. Unexpected accounts or service accounts without legitimate remote access privileges are indicators of potential compromise.

  - **Identify legitimate usage patterns:** Compare identified connections to established remote access policies or logs of authorized use. Legitimate use typically involves specific user accounts during business hours and may be documented through IT ticketing or scheduling logs.

  - **Validate system roles:** Assess the roles of affected systems through asset management tools. Desktop or server systems hosting sensitive data should not be using Ammyy Admin. Unauthorized setups can indicate a greater security concern.

  - **Search for recent changes or installations:** Query for recent installations of Ammyy Admin (e.g., using Event ID 4688 for process creation). Unauthorized installations on devices may suggest prior compromise events that need investigation.

  - **Monitor for lateral movement activities:** Check for any indication of lateral movement from systems showing Ammyy Admin activity (Event ID 4625 for failed login attempts). This could identify attempts to connect to other systems based on the initial remote access point.

  ### Prioritization

  This alert is of medium severity due to the potential impact on systems, as unauthorized access through tools like Ammyy Admin can expose sensitive information or create backdoors. The likelihood of being weaponized is moderate; while this tool is known for legitimate use cases, its misuse by adversaries is well-documented.

  ### Blind Spots and Assumptions

  Detection may be limited by the inability to distinguish between legitimate usage and it being exploited, particularly if awareness of approved usage is not clear. Required log sources include detailed network connection logs to ensure comprehensive visibility of remote access tools. False positives may occur if internal teams utilize Ammyy Admin for support tasks. Related detections should include general remote access software activity beyond just Ammyy Admin to enhance coverage, such as checks for TeamViewer or AnyDesk connections.

