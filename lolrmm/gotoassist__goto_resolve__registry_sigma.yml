note: |
  ### Technical Context

  This rule detects registry activity associated with the GoToAssist (now GoTo Resolve), a remote management tool often used for remote support and administration. Attackers may use unauthorized instances of GoTo Resolve to gain persistent remote access to compromised systems, aligning with the MITRE ATT&CK tactic of Command and Control (T1071.001). The primary telemetry source is Windows registry event logs that document changes to specific registry paths related to GoTo Resolve's configuration.

  If this activity is malicious, it implies that an adversary may have established an unauthorized means to control the system remotely, potentially leading to substantial data breaches or further exploitation. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative use may trigger the alert.

  ### Investigation Steps

  - **Review registry key modifications:** Check for recent changes in `HKLM\SOFTWARE\GoTo Resolve Unattended` using Windows Event ID 4657 (Registry Value Modified). Look for modifications made outside of regular maintenance windows or by accounts not typically associated with system management.

  - **Identify user accounts associated with changes:** Cross-reference the username and account privileges associated with the registry change (Event ID 4657) to determine if they match legitimate service accounts or administrative users. High-risk accounts making these changes could raise suspicion.

  - **Correlate with remote access records:** Validate if any remote sessions were initiated via GoTo Resolve during the timeframe of the registry change by reviewing related remote access logs or firewall logs for unusual ingress activity (e.g., unusual ports, IP addresses).

  - **Assess historical use of GoTo Resolve:** Look for previous legitimate usage patterns for GoTo Resolve within your organization. If the tool has not been formally acknowledged or installed, this may indicate malicious use.

  - **Examine for known malicious indicators:** Search for signatures or file names associated with documented malware that targets remote management tools, particularly if the event correlates with other suspicious activities or alerts.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized remote access on assets critical for operations. The likelihood of malicious abuse is elevated given that remote management tools like GoTo Resolve are often targeted by adversaries. This behavior is commonly weaponized, especially in attacks targeting remote work scenarios.

  ### Blind Spots and Assumptions

  Detection is limited if the logs for changes to the registry are not enabled on all endpoints or if user activity goes unmonitored. Legitimate administrative activities may generate similar alerts when GoTo Resolve is used for authorized support tasks. A companion detection that enhances coverage could involve monitoring for anomalous remote login attempts or unusual outbound traffic to known remote management service IPs.

