  ### Technical Context

  This rule detects registry modifications related to the GoToAssist (GoTo Resolve) remote monitoring and management (RMM) tool. Attackers could leverage this tool to establish unauthorized remote access to compromised systems, enabling further actions such as exfiltration of data or lateral movement within the network. The relevant MITRE ATT&CK technique for this behavior is "Application Layer Protocol: Command and Control" (T1219).

  The primary telemetry source for this detection includes Windows registry event logs, specifically targeting changes to the registry path "HKLM\SOFTWARE\GoTo Resolve Unattended\". If malicious, the security impact is significant, as unauthorized use of RMM tools can result in extensive data breaches or system takeovers. It is important to note that this detection alone does not confirm malicious intent, as legitimate use of the GoToAssist tool can trigger it.

  ### Investigation Steps

  - **Check event details for registry activity: Event ID 4657:** Review Windows Security Event Log for Event ID 4657, focusing on modifications to objects within the registry path "HKLM\SOFTWARE\GoTo Resolve Unattended\" for timestamps corresponding to the alert.

  - **Assess the source of changes: Sysmon Event ID 13:** Examine Sysmon logs for Event ID 13 capturing registry changes. Look for the process that made the modification and analyze its integrity (e.g., legitimate system processes vs. suspicious executables).

  - **Identify benign usage contexts:** Look for organizational policies or ticketing systems that authorize the use of GoToAssist. Confirm if processes like `GotoAssist.exe` or similar were legitimately executed during business hours for authorized support tasks.

  - **Correlate with known adversary workflows:** Investigate if the registry change corresponds with known tactics of adversaries utilizing RMM tools for lateral movement or persistence (e.g., check if it follows abnormal login attempts or exploits).

  - **Look for additional related behavior:** Examine global telemetry for signs of unusual outbound network connections or remote session logs that align with the registry activity, specifically through protocols typically used by RMM tools.

  ### Prioritization

  The alert carries a medium severity due to the potential risks associated with unauthorized remote access capabilities facilitated by RMM tools. The likelihood of misuse is moderate, as these tools are often weaponized in targeted attacks. However, given the legitimate use cases in enterprise environments, further investigation is crucial before escalating.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate activities to trigger the alert, particularly if the organization uses GoToAssist for support. Reliable detection requires monitoring of Windows registry event logs and Sysmon events. Additionally, benign administrative activities may cause this alert, such as authorized personnel configuring remote access for IT support. Related detections may include monitoring for anomalous process creation associated with RMM tools to strengthen coverage.

