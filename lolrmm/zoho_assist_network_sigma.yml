note: |
  ### Technical Context

  This rule detects outbound network connections to various domains associated with the Zoho Assist Remote Monitoring and Management (RMM) tool. The behavior indicates possible remote access to a system, which could imply that an attacker is leveraging legitimate RMM software for unauthorized administrative access. The likely attacker objective could include system compromise, data exfiltration, or lateral movement within the network.

  This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and the technique of Remote Access Software (T1219). Primary telemetry sources for this rule include Windows network connection logs, specifically tracking DestinationHostname attributes. If malicious, this could allow adversaries to maintain control over a system or exfiltrate sensitive information. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate usage of Zoho Assist for support and maintenance is common in enterprise environments.

  ### Investigation Steps

  - **Verify the nature of the outbound connection: ** Check network logs (e.g., Windows Event ID 5156) to observe the process making the connection. Note the command line arguments or parent process; a legitimate program should have recognizable identifiers like 'zohoassist.exe'.

  - **Examine the connected hostname: ** Cross-reference the DestinationHostname field in the logs against the known domains associated with Zoho Assist. If the connection is to a legitimate domain (e.g., assist.zoho.com), further context is needed to determine benign behavior.

  - **Identify process behavior: ** Investigate the process creating the connection using Sysmon Event ID 10 for network connections. Note if the process shows unusual behavior, like high CPU usage or attempts to access other system resources.

  - **Check associated user accounts: ** Review user activity logs (Windows Security Event ID 4624) to determine if the connection was initiated by a service account or authorized personnel. Unusual login times or from unexpected locations can indicate malicious access.

  - **Assess host role and criticality: ** Determine the criticality of the affected host. Connections from servers handling sensitive data should be prioritized for deeper investigation, particularly if they exhibit external connections to Zoho Assist.

  - **Look for file transfer artifacts: ** Check for file creation or transfers related to Zoho Assist (Sysmon Event ID 11 for file creation, especially .exe or .dll files). Malicious activity may involve file transfers that are not signatured by expected software updates or maintenance logs.

  ### Prioritization

  The severity of this alert is medium, as it reflects potential remote administrative access on systems that could hold sensitive data. While there is a moderate likelihood of malicious use, the presence of Zoho Assist is common in many enterprise environments, which necessitates careful contextual review before escalation.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of VPNs or encrypted tunnels that mask the originating traffic, which could hinder visibility into remote management software activities. Requirements for reliable detection include comprehensive logging of outbound network connections and proper endpoint monitoring to catch unusual behaviors. Legitimate internal support functions or RMM activities can trigger alerts, emphasizing the importance of context. Companion detections like anomalous user logins (T1078) can help strengthen overall security posture by identifying unusual access patterns alongside RMM activity.

