note: |
  ### Technical Context

  This Sigma rule detects network connections directed towards Zoho Assist, a remote monitoring and management (RMM) tool. Attackers may leverage this tool to gain unauthorized access to systems, facilitating remote control, data exfiltration, or further internal compromise. The relevant MITRE ATT&CK tactic is Remote Access (TA0011) and the technique involved is Remote Management Tools (T1219).

  Primary telemetry sources include Windows network connection logs, particularly those capturing DNS requests and outbound connections, which help identify interactions with Zoho's infrastructure. If used maliciously, it could result in significant operational disruption or data leakage. It is important to note that this detection alone does NOT confirm malicious intent; legitimate use of the Zoho Assist tool can trigger this alert.

  ### Investigation Steps

  - **Check outbound connections to Zoho domains**: Review network logs for Event ID 5156 (Windows Filtering Platform) to identify connections to `*.assist.zoho.com`, `*.zohoassist.com`, or similar domains. High volumes of connections may indicate suspicious activity.

  - **Validate user context of connections**: Investigate the Windows process creating the network connection using Event ID 4688 (process creation). Determine whether the process is related to legitimate business activities or appears anomalous.

  - **Identify frequency of access attempts**: Analyze timestamps of connections to the identified domains. Frequent connections in a short duration or connections outside business hours could indicate potential misuse.

  - **Correlate with user roles and responsibilities**: Determine if the user account associated with the network activity is authorized to use Zoho Assist. Legitimate activity would typically involve scheduled support tasks or defined IT support workflows.

  - **Review for additional indicators of compromise**: Look for other signs of remote access tools in the environment such as additional network destinations or unusual administrative activity, supported by Sysmon logs (Event ID 3 for network connections).

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive systems and information. While the likelihood of malicious exploitation may be moderate, the use of legitimate RMM tools like Zoho Assist is common, making contextual analysis critical in determining whether the behavior is abnormal.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not properly configured, particularly if firewall logs do not capture outbound traffic effectively. Legitimate tasks involving IT support can trigger this alert, often leading to false positives. Companion detections related to remote access or administrative activities, such as unexpected use of RDP or PowerShell commands (T1059.001), can strengthen monitoring and coverage against potential abuse.

