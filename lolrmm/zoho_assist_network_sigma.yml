note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Zoho Assist remote management tool. The behavior indicates potential usage of software that can facilitate remote desktop support, which might be exploited by attackers for unauthorized access to systems. The Likely attacker objective is to gain remote control of an internal asset for further exploitation or data exfiltration. The relevant MITRE ATT&CK tactic is Execution, and the technique ID is T1219 (Remote Access Software).

  The primary telemetry source is Windows network connection logs, focusing on specific Event IDs related to network activity and DNS queries. If executed maliciously, there is a high security risk as attackers can potentially access sensitive data or compromise the integrity of the affected systems. However, this detection does NOT on its own confirm malicious intent, as legitimate use of Zoho Assist by authorized personnel can trigger this alert.

  ### Investigation Steps

  - **Check recent outbound connection logs**: Review Windows firewall logs for outbound connections to the domains detected (e.g., `*.zoho.com`, `assist.zoho.com`) via Event ID 5156 or Windows Filtering Platform logs. This includes examining the `DestinationIpAddress`, `DestinationPort`, and `ApplicationName` fields.

  - **Verify user account activity**: Check the user account associated with the outbound connection. Use Security Event ID 4624 to determine if the associated user has a legitimate reason to use remote support software, like remote maintenance or troubleshooting.

  - **Assess host role and usage**: Evaluate whether the affected host is designated for IT support or administrative functions. Legitimate users also commonly access tools like Zoho Assist for remote troubleshooting; identify if this aligns with the host's intended role.

  - **Inspect for unusual process creation**: Cross-reference with Sysmon Event ID 1 to identify if any unexpected processes were initiated around the time of the connection, which can indicate a malicious use of the tool. Look specifically for processes spawned by known remote access tools.

  - **Review DNS logs for connection patterns**: Analyze DNS query logs for repeated or excessive queries to Zoho domains (Event ID 3008 on Windows DNS logs). A spike in such queries could hint at malicious automation or a compromised system.

  - **Capture file transfers**: If applicable, monitor for any associated file downloads or uploads to and from the detected domains, particularly using Event ID 4688 for process execution of file transfer utilities (e.g., `powershell.exe`, `curl`, or `wget`). The presence of tool binaries related to remote access in unexpected locations can reinforce suspicions of compromise.

  ### Prioritization

  This alert is of medium severity due to the potential risks posed by unauthorized remote access capabilities enabled through tools like Zoho Assist. The likelihood of malicious abuse is significant, especially in enterprise environments where these tools might not be sanctioned. Additionally, the usage of such RMM tools is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  The detection may be circumvented by using benign-looking applications or legitimate traffic masquerading as remote management. It is critical to have logging from firewalls and outbound network monitoring in place to ensure comprehensive coverage. Legitimate activities, such as IT support teams using Zoho Assist for maintenance, may trigger the alert. A related detection for lateral movement or usage of remote access software (e.g., MS Remote Desktop Protocol events) could provide added context and strengthen overall detection efforts.

