note: |
  ### Technical Context

  This rule detects network connections to various Zoho Assist endpoints, which are often used for remote management and support services. The likely attacker objective is to establish a communication channel for remote access, potentially indicating a compromised system or misuse of legitimate tools for malicious intent. The relevant MITRE ATT&CK tactic is **Command and Control (TA0011)** and the technique is **Application Layer Protocol (T1219)**.

  Primary telemetry sources include Windows network connection logs with details on the destination hostname and associated processes. If this activity is malicious, it could lead to unauthorized remote access and control over critical systems. However, this detection does NOT confirm that the connection is malicious on its own, as legitimate use of Zoho Assist may trigger the same alert.

  ### Investigation Steps

  - **Check active connections: ** Use PowerShell or netstat to review active connections on the host. Look for any connections to the identified Zoho Assist domains, particularly connections with unusually long durations or established by non-administrative accounts.

  - **Review related event logs: ** Examine Security Event ID 4624 (Logon) and Event ID 4688 (Process Creation) for any related logon events or process executions that match the timeframe of the network activity. Identify any unusual parent process relationships, indicating potential misuse of legitimate applications.

  - **Correlate with anomaly detection: ** Use SIEM tools to correlate this activity with other suspicious behaviors or alerts in the environment, such as abnormal login patterns or credential misuse, to assess the likelihood of malicious intent.

  - **Identify legitimate activity: ** Review known business processes or work schedules that would validate legitimate use of Zoho Assist within the organization. Check with teams who may use this tool for remote support to confirm appropriate usage.

  - **Verify user accounts: ** Analyze user account activity by reviewing Event ID 4720 (User Account Created) and Event ID 4726 (User Account Deleted) within the past week. Determine if the account making the connection has been recently created or has elevated privileges.

  ### Prioritization

  This alert should be considered medium severity as it may indicate an active remote access attempt through legitimate software. The impact depends on the asset’s role in the organization, where administrative systems would raise higher concerns. The likelihood of malicious abuse exists since attackers commonly weaponize Remote Management Tools (RMM) to bypass security controls.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may use legitimate credentials to access Zoho Assist. Reliable detection requires comprehensive network logging configurations to capture all outbound connections adequately. Legitimate activities, such as authorized remote support sessions by IT staff, may trigger the alert. A related detection to strengthen coverage would be monitoring for unusual account behavior or logon events that would complement this network activity analysis.

