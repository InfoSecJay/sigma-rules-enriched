note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Nezha Remote Management Tool (RMM), specifically looking for instances where the processes `nezha-agent.exe` or `dashboard-windows-amd64.exe` are spawned. The likely attacker objective is to establish remote access or control over compromised systems, facilitating further malicious actions such as data exfiltration or lateral movement within the network. This detection aligns with the MITRE ATT&CK tactic of Execution (TA0002) and the technique Remote Services (T1219).

  The primary telemetry source for this rule is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If the detected behavior is malicious, it poses a significant security risk to the organization, as attackers can leverage these tools to fully control critical systems or data. However, it is important to note that the detection of these processes alone does not confirm malicious intent; legitimate administrative use of Nezha for system management can also trigger this alert.

  ### Investigation Steps

  - **Review process tree hierarchy:** Utilize Security Event ID 4688 or Sysmon Event ID 1 to extract the parent process ID (PID) of the detected processes. Confirm if the parent process suggests normal behavior, such as legitimate administrative tools or scripts.

  - **Check execution context:** Verify the user account that initiated the `nezha-agent.exe` or `dashboard-windows-amd64.exe`. Legitimate execution typically involves administrative accounts; suspicious activity may arise from service accounts or non-admin users.

  - **Assess network activity:** Analyze network logs for outbound connections associated with `nezha-agent.exe` or `dashboard-windows-amd64.exe`. Look for unusual IP addresses or ports, especially those associated with command and control (C2) servers.

  - **Validate file presence:** Forensic examination of the file paths from which the Nezha processes are executed. Confirm that the binaries (`nezha-agent.exe`, `dashboard-windows-amd64.exe`) reside in expected locations, such as install directories. Suspicious locations (e.g., user temp directories) may indicate malicious activity.

  - **Identify scheduled tasks:** Investigate if there are any scheduled tasks or startup items that spawn `nezha-agent.exe`. Legitimate use cases generally will not involve atypical persistence mechanisms.

  ### Prioritization

  This alert is considered medium severity due to the potential impact on critical systems if compromised through unauthorized remote access. The likelihood of malicious abuse is moderate, given that Nezha can be used both for legitimate system management and by threat actors for intrusion. The presence of such tools is increasingly weaponized, further justifying a careful investigation.

  ### Blind Spots and Assumptions

  The detection may not capture obfuscated or renamed versions of Nezha or similar remote management tools. Reliance on process creation logs necessitates accurate Sysmon or Windows Security configuration to ensure full coverage. Legitimate organizational use of Nezha may trigger this alert, such as system maintenance by IT support teams. A companion detection includes monitoring for related lateral movement techniques (e.g., using PsExec, T1047) that may indicate a broader compromise.

