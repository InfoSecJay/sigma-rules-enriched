note: |
  ### Technical Context

  This rule detects instances where processes associated with the Nezha Remote Monitoring and Management (RMM) tool are executed on Windows systems. The likely attacker objective is to establish remote control over the target system, enabling data exfiltration, lateral movement, or the deployment of further payloads. This behavior aligns with the MITRE ATT&CK framework under the Command and Control tactic (T1071) and the technique for Remote Access Tools (T1219).

  The primary telemetry sources include Windows Security Event ID 4688 for process creation and Sysmon Event ID 1. If malicious, the security impact could range from data breaches to total system compromise. It is important to note that this detection does NOT confirm malicious activity on its own; Nezha may legitimately be used for remote management.

  ### Investigation Steps

  - **Check process hierarchy:** Investigate the parent process of the detected instances (Event ID 4688, fields: ParentImage, Image). Look for expected benign parent processes, such as legitimate system maintenance tasks or known management software, as opposed to suspicious parent processes that could indicate misuse.

  - **Validate executable paths:** Review the full paths of the detected executables (Event ID 4688, field: Image). This should typically be located in C:\Program Files\ or C:\Program Files (x86)\. Alert if the executable is found in unusual or temporary directories, which could indicate malicious usage.

  - **Correlate with user context:** Identify the user account associated with the process (Event ID 4688, field: NewProcessId). Determine if this account has legitimate administrative privileges and analyze recent login events (Event ID 4624) to ascertain if the user has been recently authenticated.

  - **Review Sysmon logs:** If Sysmon is deployed, examine Sysmon Event ID 1 for detailed process creation logs. Look specifically for command line arguments or unusual parameters that accompany the Nezha binaries, which might signify malicious intent.

  - **Check for lateral movement:** If the system has any remote access logging configured, review logs for indicative behavior, such as connections initiated to other internal systems (Windows Event ID 5156 for Windows Filtering Platform logs). No prior network traffic or unusual outbound connections may indicate administrative actions versus potential malicious access.

  - **Identify known good instances:** Search internal documentation or systems for instances where Nezha is legitimately deployed (e.g., internal IT management systems). Validate against recent changes in IT infrastructure that justify its presence.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on critical systems if the Nezha RMM tool is exploited. The likelihood of malicious abuse is elevated, given the common use of RMM tools by adversaries for remote access. This behavior is known to be weaponized in various attacks, thus warranting timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited for systems that do not log process creation deeply, such as those without Sysmon configured. Legitimate activities could involve IT administrators managing multiple endpoints, which may inadvertently trigger the alert. Companion detections might include monitoring for unusual outbound traffic patterns from systems where Nezha was detected, or correlating with attempts to enumerate user sessions.

