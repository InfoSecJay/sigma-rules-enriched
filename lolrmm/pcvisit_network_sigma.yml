note: |
  ### Technical Context

  This Sigma rule detects network connections to the Pcvisit Remote Management and Monitoring (RMM) tool domains, specifically those ending with “*.pcvisit.de” or “pcvisit.de.” The behavior indicates potential remote access or remote management activities, which can be leveraged by attackers for unauthorized command and control. This activity is associated with the MITRE ATT&CK tactic "Execution" and technique "Remote Services" (T1219).

  The primary telemetry sources for this detection include Windows network connection logs, specifically monitoring the Event IDs related to outbound TCP/IP connections. If malicious, this activity can result in unauthorized access, data exfiltration, and persistent network intrusion. Notably, this detection does not confirm that any malicious activities have occurred without further validation of context and intent.

  ### Investigation Steps

  - **Review network connection logs:** Check for Event ID 5156 in Windows Security logs to identify outbound connections to "pcvisit.de" domains. Compare source IP addresses with known rogue IPs or investigate the legitimacy of the sources.

  - **Validate associated processes:** Use Sysmon Event ID 3 to examine which processes initiated the connections. Identify whether these processes are known system applications or potentially unauthorized executables.

  - **Investigate user activity:** Cross-reference the identified connections with Windows Security Event ID 4624 (logon events) to determine if the user account correlating with the activity is legitimate or abnormal.

  - **Identify legitimate usages:** Confirm if there are known business operations or support agreements involving the usage of Pcvisit RMM. Document such legitimate cases to rule out false positives effectively.

  - **Check for anomalous behavior:** Look for several outbound connections to Pcvisit domains within a short time frame, indicating suspicious activity. High volumes may correlate with a command-and-control infrastructure.

  - **Examine data movement:** Monitor file creation or modification events related to remote access tools. Use Sysmon Event ID 1 to isolate any executable files that may have been downloaded or executed in conjunction with the network activity.

  ### Prioritization

  The severity of this alert is medium, as it pertains to potential remote access capabilities that could permit an attacker significant control over a system. Depending on the asset's criticality, the likelihood of abuse can be high if misconfigurations or unauthorized use is identified. This behavior is relatively common in remote management yet raises concern if occurring without proper authorization.

  ### Blind Spots and Assumptions

  This detection may miss connections if the adversary uses encrypted tunnels or legitimate credentials to bypass detection. It assumes that necessary logging configurations, such as enabling Windows Firewall with logging enabled and Sysmon, are in place for visibility. Legitimate uses of remote access tools, like corporate IT support engagements, may trigger this alert. A companion detection to consider is monitoring for unusual logon patterns (e.g., MITRE ATT&CK technique T1078 - Valid Accounts) to strengthen coverage on compromised accounts.

