note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the Pcvisit Remote Management Tool (RMM) via specific domain names associated with the service (*.pcvisit.de, pcvisit.de). The likely attacker objective is remote control or access to a target system using this tool, which has legitimate remote support functionalities but can be abused for malicious purposes. This detection aligns with the MITRE ATT&CK tactics and techniques "Command and Control" (TA0011) and "Remote Access Tools" (T1219).

  The primary telemetry required for this detection includes network connection logs on Windows systems capturing destination hostnames and IP addresses. If executed maliciously, such connections could facilitate unauthorized access and control. However, this alert does NOT confirm malicious intent on its own, as the tool might be used for legitimate remote support by authorized personnel.

  ### Investigation Steps

  - **Confirm the activity source:** Check for network connection logs that include Event ID 5156 (Windows Filtering Platform - Network Action) to identify connections to destination hostnames ending in '.pcvisit.de'.

  - **Identify recent use of Pcvisit:** Look for newly installed applications or processes related to Pcvisit on endpoints (use Event ID 4688 for process creation) to determine if there is legitimate use.

  - **Examine associated user activity:** Review logs for user account activity (Event ID 4624) and verify if the user executing the connection has legitimate permissions to use remote management tools.

  - **Correlate additional network data:** Verify network flow data or logs for suspicious inbound/outbound patterns that coincide with the Pcvisit connections, indicating potential lateral movement or data exfiltration.

  - **Look for indicators of compromise:** Focus on any related unauthorized usage of credentials or unusual access patterns in the same timeframe as the detected connections, indicating possible credential misuse.

  - **Review the role of the asset:** Determine if the endpoint showing this network activity is critical (e.g., server role) and assess risk exposure if compromised.

  ### Prioritization

  The alert severity is medium due to its potential impact on critical infrastructure by enabling unauthorized remote access. The likelihood of abuse is moderate, as while the Pcvisit tool is often legitimate, adversaries can exploit it for remote control purposes. This behavior can be weaponized, particularly against sensitive targets.

  ### Blind Spots and Assumptions

  This detection may have limitations if network logging is not comprehensive enough to cover all outbound traffic, or if users may have legitimate needs to use Pcvisit without detection. A thorough review of firewall configurations and settings is necessary for reliable detection. Legitimate administrative tasks may trigger this alert, particularly from IT support personnel. A related detection could be the monitoring of other remote access tools (e.g., TeamViewer or AnyDesk) for further risk coverage and threat intelligence on remote management activity.

