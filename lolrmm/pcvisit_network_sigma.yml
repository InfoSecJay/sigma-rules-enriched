  ---

  ### Technical Context

  This Sigma rule detects outbound network connections to the Pcvisit Remote Management Tool (RMM), which is commonly associated with remote administration and support. Attackers may leverage such tools to maintain persistence, conduct reconnaissance, or control compromised systems remotely. This behavior is classified under the MITRE ATT&CK tactic "Execution" with the technique ID T1219.

  Primary telemetry sources include Windows network connection logs, specifically those showing Traffic Destinations that resolve to domains ending in ".pcvisit.de". If malicious, this activity could indicate an attacker utilizing legitimate RMM software to exert control over a target system. It is important to note that this detection does NOT confirm malicious activity on its own, as it can also occur through legitimate use of the Pcvisit tool.

  ---

  ### Investigation Steps

  - **Review outbound network connections**: Check the Windows Network Connection log for Event ID 5156 to identify connections to “*.pcvisit.de” or “pcvisit.de”. Note the process ID and initiating user account.

  - **Identify process details**: Use Sysmon Event ID 3 to ascertain the parent process of any executables establishing connections to the identifiers above. Look for typical RMM process names like 'pcvisit.exe'.

  - **Check for unusual user behavior**: Evaluate user account activity (Event ID 4624) for any anomalous login times or locations tied to the system making the connections, comparing them against expected user access patterns.

  - **Correlate with asset role**: Determine the role of the affected system (e.g., critical server vs. standard workstation). Focus on alerts triggered from critical assets such as servers handling sensitive data.

  - **Assess recent installation or updates**: Review Application logs for any recent installations (Event ID 1033) of Pcvisit. If the application was recently installed or updated, corroborate with documentation or user requests.

  - **Look for known malicious indicators**: Examine if any IP addresses associated with the connections are listed in threat intelligence feeds for RMM abuse, specifically those indicating recent malicious activity.

  ---

  ### Prioritization

  This alert is of medium severity, as the Pcvisit RMM tool can be both legitimate and malicious. Its use in a high-value or critical asset context increases the likelihood of potential abuse. Additionally, RMM tools are often weaponized in targeted attacks, warranting thorough investigation when detected.

  ---

  ### Blind Spots and Assumptions

  This detection may not capture cases where attackers use custom or less recognized RMM tools that do not resolve to the specified domains. Ensuring the logging of network connection events (e.g., Windows Filtering Platform logs) is critical for effective detection. Legitimate activities, such as authorized support sessions, may trigger this alert, underscoring the need for contextual analysis. Companion detection mechanisms, such as monitoring for unusual process creation events related to remote access tools (Sysmon Event ID 1), can aid in providing better coverage against malicious usage.

