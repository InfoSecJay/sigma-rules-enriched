note: |
  ### Technical Context

  This Sigma rule detects network connections made by the Pcvisit Remote Maintenance Management (RMM) tool, specifically targeting destinations ending with `*.pcvisit.de`. The likely attacker objective is to establish a remote control session on affected systems, potentially for data exfiltration, lateral movement, or system compromise. This behavior is associated with the MITRE ATT&CK technique "Remote Access Software" (T1219), indicating the use of remote administration tools to gain unauthorized access.

  The primary telemetry sources are Windows network connection logs, particularly focusing on DNS queries or connection attempts to relevant hostnames. If malicious, this behavior can allow adversaries to remotely manipulate or steal sensitive data from compromised hosts. It’s critical to note that this detection does NOT confirm malicious activity on its own, as legitimate use of Pcvisit for remote support may trigger this alert.

  ---

  ### Investigation Steps

  - **Check network connections: ** Review Windows network connection logs (Event ID 5156) for outgoing connections to `*.pcvisit.de`. Validate if the connection is unusual for the host in question and investigate if it aligns with expected business operations.

  - **Identify processes tied to the activity: ** Correlate process creation logs (Event ID 4688 or Sysmon Event ID 1) for any instances that initiated connections to Pcvisit domains. Look for unusual or custom processes that may indicate malicious intent.

  - **Examine user activity around the event: ** Investigate security logs (Event ID 4624) for user login activity related to the time of the connection. Determine if the user correlating with the connection has legitimate authorization to use Pcvisit.

  - **Review known legitimate activity: ** Confirm that authorized personnel are using the Pcvisit tool as part of established remote support protocols. Compare timestamps and connection patterns to standard operating procedures for remote access tools.

  - **Evaluate host security posture: ** Check for any indicators of compromise (IoCs) on the host, such as unexpected open ports or unusual service behavior that may have allowed the tool to be leveraged for malicious actions.

  ---

  ### Prioritization

  This alert should be treated with medium severity as it indicates the potential use of remote access tools, which can lead to significant security risks. The impact is higher when the affected system is critical, and the likelihood of malicious use increases if there are no known legitimate reasons for Pcvisit activity.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by incomplete logging or if Pcvisit is used legitimately in the environment, which could trigger false positives. Ensure network monitoring is configured to capture all outgoing traffic to avoid missing relevant events. An effective companion detection would involve monitoring for unusual process creation or command and control indicators (e.g., outbound connections to known malicious IPs) to strengthen overall security coverage.

