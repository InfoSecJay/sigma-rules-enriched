note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the NoteOn desktop sharing remote management tool. Attackers may use this tool to gain unauthorized remote access to a system, allowing for potential data exfiltration or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001: Application Layer Protocol) and the technique of Remote Services (T1219).

  The primary telemetry source for this detection is Windows process creation events, specifically monitoring process paths for variants of NoteOn executables. If malicious, the impact could include unauthorized access to sensitive information or control over the affected system. However, this detection does NOT confirm malicious intent on its own, as NoteOn can be used legitimately for support and remote access.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 for process creation events where the `NewProcessName` field indicates NoteOn executable paths (e.g., `C:\Program Files\NoteOn\nateon.exe`). This may help identify if standard support personnel initiated the process or if it is anomalous.

  - **Analyze parent process relationships**: Examine logs for related process trees where the `ParentImage` is also an executable associated with common remote management actions (e.g., TeamViewer, AnyDesk) to determine the context for execution. Look for unusual parent-child relationships.

  - **Correlate user activity**: Check for user logon events (Event ID 4624) in conjunction with the creation of NoteOn processes to determine if the user was authorized to initiate a remote session at the time of execution. An unusual account or time could indicate compromise.

  - **Identify unusual network activity**: Cross-reference with firewall and network logs for any outbound connections from NoteOn to unrecognized IP addresses or domains. Typical usage involves connections to known support servers.

  - **Examine for scheduled tasks or startup entries**: Investigate if the NoteOn executables were initiated as part of an automated script or scheduled task (Event IDs 4698 or 106). Legitimate instances will often have records in Task Scheduler consistent with authorized IT support activities.

  ### Prioritization

  This alert carries a medium severity level. If an affected system has critical business functions, the potential for unauthorized access increases, as does the likelihood of malicious use. While use of NoteOn for remote management is not uncommon, its presence should be verified for legitimacy, especially in sensitive environments.

  ### Blind Spots and Assumptions

  Detection may be circumvented if an attacker manually renames or modifies the executable file paths. Assumptions about benign activity based solely on process execution must be cautious, as legitimate note-taking or desktop sharing tools could trigger similar alerts. Active monitoring of other remote access tools (such as AnyDesk or TeamViewer) would complement the detection of NoteOn-related activities, providing a broader security posture against remote access abuses.

