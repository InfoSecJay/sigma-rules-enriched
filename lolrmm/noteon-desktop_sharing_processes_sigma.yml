note: |
  ### Technical Context

  This detection rule identifies the execution of processes associated with the NoteOn desktop sharing tool, which is often used for remote management and collaboration. Attackers may leverage this tool for lateral movement or remote access within corporate environments, aiming to exfiltrate data or compromise additional systems undetected.

  The relevant MITRE ATT&CK tactic is Execution, specifically technique T1219: Remote Access Software. Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process execution details. If exploited maliciously, the use of NoteOn can lead to unauthorized remote access to sensitive systems. This detection does NOT confirm malicious intent or compromise on its own, as NoteOn may be used legitimately in authorized scenarios.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 or Sysmon Event ID 1 that show executed processes ending in "nateon*.exe". Look for unusual parent processes that do not align with expected usage patterns.

  - **Identify valid user sessions:** Correlate the process creation times with user logon events in the Windows Security logs (Event ID 4624) to determine if the NoteOn processes are executed by authorized users and during expected hours of operation.

  - **Validate legitimate activity:** Observe instances of NoteOn processes connected to remote access. Legitimate usage typically involves known users connecting to remote systems during standard operational hours without unusual network spikes.

  - **Monitor network activity:** Analyze network logs (e.g., firewall or proxy logs) for unusual outbound connections from systems running NoteOn, such as connections to external IPs that are not part of the organization’s business purpose.

  - **Check for known malicious indicators:** Look for patterns of behavior related to NoteOn processes that include data exfiltration or commands typically abused by attackers, such as unauthorized file transfers or execution of further suspicious commands.

  ### Prioritization

  The alert is of medium severity, as the presence of NoteOn may indicate potential for serious impact depending on the system affected and its role (e.g., domain controllers, sensitive servers). The likelihood of this tool being weaponized can vary based on specific context but it is known to be utilized in remote support and could easily be misused.

  ### Blind Spots and Assumptions

  Detection effectiveness may vary if process creation logging is not properly configured or if logging is disabled or incomplete. Legitimate administrative functions may trigger this alert, particularly during remote support operations. Companion detection rules that check for unexpected remote connections or lateral movement could enhance the overall security posture and coverage against misuse of remote access tools.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
