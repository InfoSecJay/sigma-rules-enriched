  ---

  ### Technical Context

  This Sigma rule detects outbound network connections to hostnames ending with datto.com, indicating potential usage of the Datto Remote Monitoring and Management (RMM) tool. The likely attacker objective would be to leverage remote management functionalities to maintain persistence or conduct further attacks on compromised systems. This behavior aligns with the MITRE ATT&CK technique Execution / Remote System Discovery (T1219).

  The primary telemetry source is Windows network connection logs. Specifically, Windows Event ID 5156 will capture these outbound connections. If utilized maliciously, escaping defenses using a legitimate tool like Datto RMM can facilitate lateral movement or data exfiltration. Importantly, this detection does NOT confirm malicious activity on its own, as it may also indicate legitimate use cases for remote management.

  ---

  ### Investigation Steps

  - **Review connection details for unusual activity:** Check Windows Event ID 5156 for connections to datto.com. Look for anomalies such as connections initiated from non-admin accounts or unusual hours.

  - **Identify expected legitimate usage:** Validate if the asset (e.g., a server or remote workstation) is listed in an organizational inventory for using Datto RMM. Ensure typical connection patterns align with scheduled maintenance or updates.

  - **Assess user accounts involved:** Examine logins associated with these connections via Security Event ID 4624. Flag any high-risk user accounts or connections that do not match expected user behavior.

  - **Seek unusual endpoint behaviors:** Investigate running processes that might correlate with the detected connections by checking Sysmon Event ID 1 for process creation. Look for suspicious processes launching via powershell.exe or cmd.exe targeting the Datto RMM executable.

  - **Gather additional logs for context:** If accessible, review firewall logs for outbound traffic to datto.com, examining fields such as dest_ip and dest_port to discern if they align with known Datto services.

  ---

  ### Prioritization

  This alert has medium severity within an enterprise context, given that Datto RMM is commonly used for legitimate IT operations. However, the ease of misuse for reconnaissance or exploitation raises the potential impact, particularly on critical systems where administrative access might be leveraged by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the fact that legitimate uses of Datto RMM can generate similar alerts, leading to false positives. Full coverage requires ensuring Windows Firewall logging is enabled to capture outbound connection attempts accurately. Additionally, the alert may be triggered by legitimate remote management activities under standard operational procedures. A companion detection to strengthen coverage includes monitoring internal process creation related to remote management tools, ensuring visibility into their usage across the network.

