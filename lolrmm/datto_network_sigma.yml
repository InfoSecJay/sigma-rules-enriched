  ### Technical Context
  This rule detects potential network activity associated with the Datto Remote Monitoring and Management (RMM) tool. Datto RMM is commonly used by IT service providers to manage and monitor client systems remotely. Malicious actors might leverage this tool for unauthorized access to systems, allowing them to control, exfiltrate data, or deploy further payloads, ultimately aiming to compromise sensitive information or gain persistent access.

  The relevant MITRE ATT&CK tactics/techniques associated with this detection include **Execution (TA0002)** and **Remote Services (T1219)**. Attackers may utilize Remote Monitoring tools like Datto RMM to facilitate their actions without raising suspicion, allowing them to blend in with regular administrative traffic within an organization.

  The primary data sources for capturing this activity include network connection logs from firewalls, proxy logs, and possibly endpoints if the tool is running locally. These logs provide insights into outbound connections to Datto's infrastructure and help establish whether such connections were legitimate or indicative of attempted malicious activity.

  ### Investigation Steps
  - **Review Network Connection Logs**: Check the network connection logs to identify any outbound connections to the **datto.com** domain, specifically looking for connections initiated from unusual or unauthorized IP addresses.

  - **Correlate with Endpoint Activity**: Analyze endpoint telemetry for instances of Datto RMM binaries or processes. Check for unusual process execution that may correlate with detected network activities.

  - **Examine User Activity Logs**: Investigate user account activities for potential anomalies, particularly for privileged accounts. Check for unexpected logins or usage of Datto RMM that deviates from standard operation patterns.

  - **Validate Organization’s Use of Datto**: Confirm whether this activity aligns with documented usage of Datto RMM within the organization, reaching out to IT teams if necessary to discern legitimate versus suspicious usage patterns.

  ### Prioritization
  This alert is medium severity due to the potential risk that unauthorized use of a remote management tool can pose to sensitive environments. The likelihood of impact increases as attackers can achieve significant control over compromised systems using such tools.

  ### Blind Spots and Assumptions
  This detection rule is limited in scope and may miss instances where attackers use alternative methods to access or manipulate systems without leveraging the Datto RMM tool directly. The logic assumes that only suspicious outbound connections to **datto.com** are significant, which could overlook other related indicators of compromise. Additionally, correct logging of network connections must be configured to ensure comprehensive coverage relevant to this detection.

