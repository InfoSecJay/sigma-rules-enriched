  ---

  ### Technical Context

  This Sigma rule detects outbound network connections to hosts ending in "datto.com," indicative of potential usage of the Datto Remote Monitoring and Management (RMM) tool. The primary objective for an attacker may include remote control of compromised systems or exfiltration of sensitive data under the guise of legitimate system management. This behavior aligns with the MITRE ATT&CK tactic **Execution** and technique **Remote System Control** (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically looking for connection attempts to external domains associated with Datto. If this network activity is malicious, it could lead to unauthorized access and management of systems, potentially compromising corporate environments. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate use of Datto tools for remote management can occur within the organization.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Check Windows Event ID 5156 (Windows Filtering Platform) for outbound connections where `DestinationHostname` contains "datto.com." Compare connection timestamps to user activity to establish context.

  - **Identify legitimate usage:** Confirm whether Datto RMM tools are authorized for use within your enterprise. Review organizational policies or internal documentation to verify if the connections align with standard operations.

  - **Correlate with user activity:** Analyze Event ID 4624 (successful logon) to cross-reference user accounts that triggered the connection. Identify any anomalous accounts (e.g., service accounts) initiating these connections.

  - **Validate potential compromise indicators:** Look for related suspicious network behaviors, such as sudden spikes in data transmission to Datto endpoints, which may indicate data exfiltration attempts. Review outbound traffic logs for these anomalies.

  - **Monitor asset criticality:** Check if the affected hosts are critical infrastructure or key assets within your organization, which may elevate the risk associated with unauthorized RMM tool usage.

  - **Investigate system modifications:** Review executed commands or changes in Event ID 4688 (process creation) to determine if a process associated with Datto RMM is invoked in an unexpected context, indicating possible exploitation.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact on critical assets if unauthorized remote management is employed by an adversary. While the likelihood of malicious use is moderate, since Datto RMM is commonly employed for legitimate purposes, it's crucial to assess context and user behavior around the detected activity.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as an adversary using domain fronting to mask connections or using similar domains for legitimate purposes. Regularly ensure that Windows filtering logs are enabled to capture relevant network connections for thorough detection. Additionally, legitimate system administrative activities may trigger this alert, particularly if Datto tools are in sanctioned use. For strengthened coverage, consider implementing companion detections for other RMM tools or unusual process behaviors that may indicate broader remote management exploitation.

