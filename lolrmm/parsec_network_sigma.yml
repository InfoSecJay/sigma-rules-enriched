  ---

  ### Technical Context

  This rule detects network connections to domains associated with the Parsec Remote Management and Monitoring (RMM) tool, such as `parsec.app` and `parsec.gg`. The likely attacker objective is to remotely control or manage systems in the environment, potentially leading to unauthorized access or data breaches. The relevant MITRE ATT&CK tactic is **Execution** (TA0002), and the technique is **Remote Access Tools** (T1219).

  Primary telemetry sources include Windows network connection logs, specifically focusing on events that record outbound connections, such as those within the Windows Security Event IDs and Sysmon logs. If malicious, this behavior can lead to significant security risks, including data theft and system compromise. However, this detection does NOT confirm malicious activity on its own, as legitimate use of Parsec for remote administration is common in some environments.

  ---

  ### Investigation Steps

  - **Review connection logs for Parsec domains:** Examine Windows Event ID 5156 (Windows Filtering Platform) for outbound connections specifically to `parsec.app` or `parsec.gg`. Note the source and destination IPs to identify legitimate users versus unauthorized access attempts.

  - **Correlate with user activity:** Check logs for user accounts initiating these connections, specifically under Sysmon Event ID 3 (Network connection), to determine if the behavior aligns with authorized personnel using Parsec for legitimate administrative tasks.

  - **Identify high-confidence indicators:** Look for anomalous behavior, such as repeated connections from unusual internal IP ranges or accounts that typically do not use remote management tools. Investigate the context of these connections, especially during non-business hours.

  - **Validate system roles:** Confirm if the affected systems are designated as administrative workstations. Outbound connections to the Parsec domains from end-user workstations could indicate possible exploitation.

  - **Document legitimate usage patterns:** Record normal business operations involving Parsec, including times and user accounts typically associated with this tool to establish a baseline for expected behavior.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact on sensitive systems and data from unauthorized remote access. The likelihood of malicious abuse exists, particularly in environments where Parsec is not officially sanctioned. While not frequently weaponized, the use of RMM tools by adversaries can indicate serious risk.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques, such as an adversary using domain fronting to disguise malicious activity. Reliable detections require the logging of all outbound network connections and monitoring for unexpected domain contacts. Legitimate remote management tools may be used regularly in the environment, so context is critical. Companion detections, such as monitoring for other known RMM tools or unusual process executions, can enhance overall coverage against remote access threats.

