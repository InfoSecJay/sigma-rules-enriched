note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the domains associated with the Parsec Remote Management Tool (RMM), specifically targeting requests to `parsec.app` and `parsec.gg`. The likely objective of an attacker leveraging Parsec is to establish remote access to a compromised system or to manage assets without detection, aligning with the MITRE ATT&CK technique Remote Management Tools (T1219).

  The primary telemetry sources for this detection are Windows network connection logs, specifically focusing on events capturing outbound connections and their destination hostnames. If malicious, successful exploitation via Parsec on enterprise assets can lead to unauthorized access and potential data exfiltration. This detection does not confirm malicious activity on its own, as legitimate administration may also use Parsec for remote support.

  ### Investigation Steps

  - **Verify outbound connections to Parsec domains**: Check network connection logs for Event ID 5156 indicating outbound connections to any `parsec.app` or `parsec.gg`. Benign connections will typically show expected hostnames relevant to authorized business operations.

  - **Inspect user context of the connection**: Analyze the Windows Security Event ID 4624 for the user account initiating the connections. Connections initiated by non-administrative or unknown accounts may indicate suspicious behavior.

  - **Correlate with recent user activity**: Examine event logs for recent logins (Event ID 4624) and process creations (Event ID 4688) around the time of the connection to verify whether the user recently authorized the activity. Legitimate users would likely have recent attendance or scheduled tasks justifying remote access.

  - **Review process execution context**: Utilize Sysmon Event ID 1 to examine if processes initiating the connections are legitimate system processes or notably suspicious executables not typically associated with RMM tools. Look for unusual command line arguments in these processes.

  - **Analyze Firewall or Proxy logs**: If utilizing a firewall or proxy, review the respective logs for HTTP requests to the aforementioned Parsec domains. Pay attention to the HTTP methods used and the presence of unusual headers which may suggest obfuscation techniques.

  ### Prioritization

  This alert carries a medium severity due to the potential impact on critical systems through unauthorized remote access. The likelihood of abuse is moderate, as Parsec is often misused in attacks for control and exfiltration, making it a commonly weaponized tool in certain threat landscapes.

  ### Blind Spots and Assumptions

  Detection may miss instances where Parsec is executed over less common communication channels or if the traffic is obfuscated. Reliable detection requires that outbound connection logging and Sysmon be appropriately configured, as any gaps in logging will reduce visibility. Legitimate uses include IT support and user collaboration sessions, which may trigger this alert. Companion detections to consider include monitoring for unusual login patterns or abnormal process creation, which can offer contextual clues about potential misuse.

