note: |
  ### Technical Context

  This rule detects network activity directed towards Parsec RMM (Remote Monitoring and Management) domains, indicating potential use of the tool for remote access. An attacker utilizing Parsec may aim to maintain persistence within the environment, exfiltrate data, or establish command and control over compromised hosts. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011) with the technique **Application Layer Protocol** (T1219). The primary telemetry sources for this detection are Windows network connection logs, specifically focusing on DNS queries or TCP connection logs that reference Parsec domains. If this is indeed malicious, it could facilitate unauthorized access or data theft. However, this detection alone does NOT confirm malicious intent, as Parsec may be used for legitimate administrative functions.

  ### Investigation Steps

  - **Review network connections**: Check logs for Event ID 5156 and 5158 from Windows Firewall on affected assets showing outbound connections to *.parsec.app or *.parsec.gg. Note any user context associated with these connections.

  - **Validate user role**: Determine whether the user initiating the connection has legitimate business needs for remote access tools, especially for Parsec. This can be done by reviewing user account roles and responsibilities.

  - **Cross-reference application installs**: Confirm if the Parsec application is installed on the endpoint by checking for executable presence (e.g., `C:\Program Files\Parsec`) or using System Inventory logs (Event ID Installed Application, using fields like `DisplayName`).

  - **Assess for anomalous consumption**: Look for high bandwidth or data consumption from outbound connections to Parsec domains; use traffic logs that may capture volume metrics, helping distinguish benign remote management versus potential data exfiltration.

  - **Identify high-confidence malicious indicators**: Check for multiple failed authentication events (Event ID 4625) coinciding with the Parsec activity, which could indicate brute force attempts or unauthorized access.

  ### Prioritization

  The severity of this alert is medium, given that the exposure of systems to potential remote access tools poses a significant risk, especially if sensitive data is accessible. The likelihood of malicious abuse is moderate since Parsec can be weaponized but is also used legitimately, requiring further context to assess risk accurately.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of encrypted connections, which could evade visibility into true payload organization. Reliable detection hinges on the consistent logging of network activity and proper firewall configurations to capture relevant DNS requests. Legitimate IT support activities may trigger this alert, potentially leading to false positives. Related detections, like monitoring for unusual access patterns to sensitive systems when Parsec activity is observed, can enhance coverage and risk assessment.

