  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Parsec Remote Management Tool (RMM), which may indicate unauthorized remote access attempts or management activity. The likely attacker objective is to establish remote control over compromised systems, facilitating data exfiltration or lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique for Remote Services (T1219).

  The primary telemetry sources are Windows network connection logs (often captured via Sysmon or native Windows event logs). If this activity is malicious, it has the potential to undermine security by allowing attackers full access to the affected devices. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate usage of Parsec for remote management may also trigger the rule.

  ---

  ### Investigation Steps

  - **Check outbound connections to Parsec domains:** Review network connection logs (Event ID 5156 for Windows Filtering Platform or Sysmon Event ID 3). Look for connections to `parsec.app` or `parsec.gg`. Legitimate traffic will typically originate from IT support staff's machines or known management consoles during defined maintenance windows.

  - **Identify the process initiating the connection:** Cross-reference Event ID 4688 (Process Creation) with the corresponding network connection logs to find the parent process of the connection. Malicious indicators may include processes with unfamiliar paths or names that do not correlate with known Parsec installations.

  - **Assess connection frequency and patterns:** Analyze the timestamps and frequency of the connections to parsec domains. High frequency or consistent usage outside of expected hours could indicate malicious activity, especially if large data transfers are observed.

  - **Investigate user accounts associated with connections:** Check the account making the network connection to determine if it is a legitimate user or an anomalous account. Unexpected accounts initiating connections to Parsec may indicate credential compromise.

  - **Look for associated file transfers:** Review Windows Event ID 4688 for commands or processes initiated with file transfer tools or scripts related to Parsec. Malicious activity may involve unusual file manipulation or deletion patterns shortly following network connections.

  ---

  ### Prioritization

  This alert is of medium severity due to its potential impact on systems facilitating remote access. The likelihood of malicious abuse is moderate, as while Parsec is a legitimate tool, it is also favored by attackers to bypass security controls. Such behavior can be weaponized for unauthorized access, warranting immediate investigation, especially in sensitive environments.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative use of Parsec, which can result in false positives if not contextualized correctly. For reliable detection, ensure that logging for all outbound connections is enabled and properly configured, particularly for Windows Filtering Platform logs. Legitimate activities that may trigger this alert could include remote technical support sessions. A related detection to consider is monitoring for non-standard remote management tools usage across the organization to bolster coverage.

