note: |
  ### Technical Context

  This rule detects network activity associated with the Parsec remote management tool, commonly used for remote desktop access. If an adversary employs Parsec for command and control or lateral movement, their objective is likely to maintain persistence and control over compromised systems through backdoor access. This behavior is aligned with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry source is Windows network connection logs, specifically monitoring connections to hostnames ending in "parsec.app" or "parsec.gg". If malicious, this could facilitate unauthorized access to sensitive systems and data. However, this detection does NOT confirm a breach on its own since legitimate use of Parsec for remote administration exists.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to "parsec.app" or "parsec.gg." Compare against expected connections for known remote administration scenarios within your environment.

  - **Assess registered applications:** Validate whether Parsec is installed on the host by checking the installed programs list (Control Panel or via PowerShell). Unexpected instances may indicate unauthorized installations.

  - **Review endpoint security logs:** Investigate EDR telemetry for Sysmon Event ID 3 (Network Connection) indicating processes initiating connections to Parsec domains. Malicious indicators include unusual process names attempting outbound connections.

  - **Identify user activity:** Correlate Windows Event ID 4624 (Logon) with timestamps of the detected connections to confirm who initiated the session. Look for unusual accounts or times of access that deviate from normal behavior.

  - **Examine DNS queries:** Inspect DNS logs for queries made to "parsec.app" or "parsec.gg." Frequent or unusual queries from non-administrative hosts may signify evasion or stealthy operations.

  ### Prioritization

  This alert has a medium severity due to the possible impact on systems if exploited for unauthorized access. While Parsec may not be commonly weaponized, its use by adversaries for remote access is plausible, necessitating careful investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Parsec within the organization, potentially leading to false positives. Comprehensive logging, including DNS and network filtering logs, is essential for reliable detection. Additionally, legitimate employees using Parsec for remote work can trigger these alerts, complicating investigations. A related detection to monitor is for unusual internal lateral movement (T1021) that could accompany suspected Parsec usage.

