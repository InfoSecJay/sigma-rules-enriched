note: |
  ### Technical Context

  This Sigma rule detects potential registry activity associated with the Sentinel RMM (Remote Monitoring and Management) tool, specifically monitoring changes within the registry path associated with scheduled tasks for the SentinelAgent. The likely attacker objective is to establish persistence and remote access through an RMM tool that is often used for legitimate administrative purposes, thereby enabling unauthorized control over the affected systems. This behavior is relevant to the MITRE ATT&CK technique "Remote Access Tools" (T1219).

  Primary telemetry sources include Windows Registry Event logs, particularly focusing on changes to the specified registry path (`HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\SentinelAgent`). If malicious, this activity could lead to unauthorized system access and control. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate usage of the Sentinel RMM tool may trigger similar alerts.

  ### Investigation Steps

  - **Verify Registry Change Context:** Review the Windows Registry Event logs for Event ID 13 (Registry Value Change) indicating access to `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\SentinelAgent`. Confirm the user account responsible for the change and any preceding events (including Event ID 4688) that may indicate process creation.

  - **Check Scheduled Tasks Activity:** Look at the Task Scheduler on the affected machine for any scheduled tasks related to Sentinel RMM. Identify task execution times and the users associated with them, as legitimate tasks should be scheduled by system administrators.

  - **Identify High-Confidence Malicious Indicators:** Investigate any additional processes spawned from the execution of tasks related to Sentinel RMM. Cross-reference with Sysmon Event ID 1 logs to check for unusual parent-child process relationships or unexpected command line arguments.

  - **Analyze Recent RMM Access Logs:** If Sentinel RMM is used legitimately, check the access logs to validate if the registry modifications align with known maintenance periods or administrative activities. Document permissible IP addresses and users associated with routine maintenance.

  - **Observe Host Role Implications:** Consider the criticality of the affected asset. Actions on a server hosting sensitive data or services could suggest a higher risk if unauthorized RMM usage is confirmed compared to non-critical assets.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on system integrity and unauthorized access. The likelihood of malicious actors abusing RMM tools for nefarious purposes is moderate, given the tool's functionality and common use in the enterprise environment. Such behaviors are increasingly weaponized by adversaries seeking to exploit misconfigured or poorly monitored RMM solutions.

  ### Blind Spots and Assumptions

  Detection limitations may arise if the RMM tool is configured or disguised under different registry paths, leading to false negatives. The reliability of detection relies on well-configured Windows Registry Event logging. Legitimate activities that may trigger the alert include standard administrative installations or updates of Sentinel RMM. A companion detection rule for monitoring unusual outbound connections from the Sentinel RMM processes would enhance overall visibility and coverage.

