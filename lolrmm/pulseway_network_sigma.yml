  ### Technical Context

  This rule detects outbound network connections to Pulseway's infrastructure (e.g., `*.pulseway.com`), potentially indicating the use of the Pulseway Remote Monitoring and Management (RMM) tool, which can be used for legitimate remote administration or could be exploited by an adversary for unauthorized access and command execution. The likely attacker objective is to remotely manage and control compromised systems while bypassing traditional security controls.

  The relevant MITRE ATT&CK tactics are Execution (TA0002) and Remote Services (T1219). The primary telemetry source required for this detection is Windows network connection logs. If malicious, this activity could lead to unauthorized remote access and persistence on the impacted hosts. Importantly, this detection does NOT confirm malicious intent on its own, as it may result from legitimate use of the Pulseway tool.

  ### Investigation Steps

  - **Review network connection logs:** Check for Event ID 5156 in Windows security logs or equivalent network logs showing outbound connections to `*.pulseway.com` within application logs, noting the source IP and process identifiers.

  - **Identify associated processes:** Cross-reference Event ID 4688 for new process creations during the timeframe of the detected network activity to correlate process IDs with known Pulseway executables.

  - **Evaluate asset role:** Determine if the affected systems are critical servers or users that should not have the Pulseway application installed, based on company policy.

  - **Check for benign usage:** Establish a baseline by reviewing previous connections to Pulseway’s infrastructure by known administrators or valid IT support personnel. Confirm legitimate usage through ticketing systems or IT asset management tools.

  - **Search for malicious indicators:** Look for known IoCs or TTPs associated with Pulseway misuse, such as the use of unauthorized accounts or unusual command execution patterns, through analysis of PowerShell logs (Event ID 4104).

  ### Prioritization

  This alert is of medium severity due to the potential impact on sensitive or critical systems and the likelihood of malicious abuse, particularly if adversaries exploit legitimate RMM tools. The use of such tools has been weaponized in various attack scenarios for lateral movement and remote command execution.

  ### Blind Spots and Assumptions

  This detection may be evaded if adversaries implement encryption or employ techniques to mask legitimate Pulseway traffic. Reliable detection requires configuration of Windows network connection logging to capture outbound requests accurately. Legitimate helpdesk tools or IT administrative activities could trigger this alert, necessitating context verification. Companion detections for process creation and unusual login patterns would enhance coverage and efficacy in identifying malicious usage of remote management tools.

