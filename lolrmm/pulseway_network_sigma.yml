note: |
  ### Technical Context

  This rule detects potential network activity related to the Pulseway Remote Monitoring and Management (RMM) tool by monitoring connections to hosts ending with "pulseway.com." The likely attacker objective could be to establish a command-and-control (C2) channel to remotely manage or exfiltrate data from compromised systems. This behavior aligns with the MITRE ATT&CK technique for Command and Control (T1219).

  Primary telemetry sources include Windows network connection logs (specifically monitoring outbound connections). If malicious, this activity could lead to unauthorized remote access or system manipulation. This detection does NOT confirm a system compromise on its own, as legitimate Pulseway usage might trigger similar alerts.

  ### Investigation Steps

  - **Verify connection context: ** Check for Security Event ID 5156 (Windows Filtering Platform) to identify the specific process initiating the network connection. Note the mapped process to determine if it’s expected for managing systems.

  - **Analyze host role: ** Confirm if the host is authorized to use Pulseway by reviewing asset inventory and user permissions. Legitimate use typically involves specific IT personnel on designated management systems.

  - **Investigate outbound traffic: ** Review network flow logs for any unusual traffic patterns or additional connections to non-Pulseway domains. Look for connections on atypical ports (outside of the expected).

  - **Identify malicious indicators: ** Look for signs of suspicious command execution or unusual process behavior tied to the network connection, such as abnormal spikes in outbound traffic volumes or concurrent connections from unusual hosts (using Sysmon Event ID 3 for network connections).

  - **Assess endpoint security software alerts: ** Review logs from endpoint protection solutions for any flagged behavior related to the Pulseway process during the time of the alert, indicating potentially abnormal or malicious activity.

  ### Prioritization

  The alert should be considered of medium severity due to the potential risk of remote administrative control by an attacker if the behavior is malicious. The likelihood of abuse is moderate since the Pulseway tool can be weaponized by adversaries for unauthorized access, particularly in environments rich in sensitive data.

  ### Blind Spots and Assumptions

  Detection may miss legitimate Pulseway usage, resulting in false positives if authorized personnel utilize the tool. Evasion techniques could include disguising malicious traffic to pulseway.com by encoding payloads or using alternative C2 infrastructure. Relevant logs include Windows Filtering Platform for detection reliability. Companion detections, like process creation events for Pulseway components (e.g., Sysmon Event ID 1), can enhance overall visibility into potentially unauthorized activities.

