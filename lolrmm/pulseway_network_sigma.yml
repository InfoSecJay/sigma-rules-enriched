note: |
  ### Technical Context
  This detection rule identifies potential network activity related to the Pulseway Remote Monitoring and Management (RMM) tool. The Pulseway RMM tool allows system administrators to monitor and manage systems remotely. However, malicious actors may exploit legitimate tools like Pulseway to maintain persistence, conduct reconnaissance, or perform unauthorized management activities on compromised systems. By detecting unusual connections to Pulseway domains, this rule helps identify potentially malicious usage of the tool.

  The likely attacker objectives include gaining unauthorized access to systems, exfiltrating sensitive data, or deploying malicious software while maintaining the ability to monitor system status undetected. Attackers may leverage these remote management capabilities to pivot from one compromised machine to another within an enterprise environment.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Execution** (TA0002)
  - **Remote Services** (T1219)

  Primary data sources include network connection logs, which record outbound connections to various domains, and potentially include remote desktop protocol (RDP) or other remote management logs, depending on the environment's configuration.

  ### Investigation Steps
  - **Check Network Connection Logs:** Review the network connection logs for any recent connections to domains ending with "pulseway.com." Pay special attention to unusual times or frequency of connections that deviate from the normal operational patterns of your network.

  - **Analyze Endpoint Activity:** Investigate the endpoints associated with the detected connections. Look for processes or services created by Pulseway, unauthorized installations, or any configuration changes that could indicate malicious use.

  - **Review User Activity:** Examine user accounts that initiated the Pulseway connections for unusual behavior, such as the creation of new accounts, privilege escalation, or access to critical systems that the user typically wouldn't need.

  - **Correlate with Other Logs:** Cross-reference findings with logs from EDR solutions to identify any associated malicious activity. Look for typical behaviors of attackers or unusual persistence mechanisms linked to known tool usage.

  ### Prioritization
  The alert's severity is considered medium due to the potential for legitimate administrative activity being misused in a compromising manner. However, the impact of unauthorized tool usage can be significant if an attacker gains persistent access and control over critical systems.

  ### Blind Spots and Assumptions
  This detection rule assumes that network connection logs are comprehensive and properly configured to capture all outbound traffic. A potential gap in detection coverage includes legitimate uses of Pulseway that may result in false positives, as certain administrative activities could appear similar to malicious behavior. Additionally, the detection may miss cases where the attacker uses alternative methods to access remote management tools outside of the expected domain. For effective alerting, ensure that your environment collects sufficient network logs and that the EDR solution is configured to analyze Pulseway activities.

