note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to Pulseway's domain, which is commonly used for remote monitoring and management (RMM) tools. The likely attacker objective is to establish command and control (C2) communication with compromised systems utilizing the Pulseway platform. This behavior aligns with the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1219). The primary telemetry source is Windows network connection logs that monitor outbound traffic.

  If adversaries are using Pulseway for malicious purposes, it can lead to unauthorized access and control over systems, potentially compromising sensitive data or infrastructure. However, this detection does NOT confirm that the connection is malicious on its own, as legitimate users may also connect to the Pulseway service for valid administrative purposes.

  ### Investigation Steps

  - **Review network connection logs:** Inspect Windows Event ID 5156 from the Windows Filtering Platform for connections to any hostname containing "pulseway.com." Look for timestamps and originating IP addresses to aid in identifying suspected malicious activity.

  - **Validate the asset's role:** Determine if the device initiating the connection is part of your organization's IT infrastructure and evaluate if it is permitted to use Pulseway for administration. Compare asset roles against expected behavior for RMM tool usage.

  - **Correlate user activity:** Check if the user account initiating the request has legitimate privileges to perform remote management activities. Monitor event logs (Event ID 4624 - logon) for any suspicious logon patterns linked to the same time frame as the Pulseway connection.

  - **Analyze Security Event Auditing:** Evaluate Security Event 4688 to identify process creation linked to Pulseway. Specifically, investigate any new or unusual Pulseway-related executables initiated by processes that do not align with expected application use.

  - **Identify high-confidence indicators:** Look for unusual volume, frequency, or timing of outbound connections to Pulseway. Multiple connections over a short duration from an unexpected host may indicate malicious use.

  - **Monitor for file transfers:** If the Pulseway tool is suspected to be used for data exfiltration or malicious file transfer, review for file access events (like Event ID 4663) pertaining to unusual file modifications or transfers to external networks.

  ### Prioritization

  This alert has medium severity due to the importance of affected systems likely being critical for system management. The likelihood of malicious abuse is moderate since attack vectors using legitimate administration tools are common in modern attacks. RMM tools like Pulseway are frequently weaponized for persistence and lateral movement.

  ### Blind Spots and Assumptions

  Detection may be evaded if adversaries use encryption, obfuscation, or legitimate tools without raising alerts. Reliable detection depends on properly configured logging for outbound network traffic and Windows security events. Legitimate administrative activities that may trigger this alert include routine RMM tasks by IT staff, thus context from the asset's usual behavior is critical. A companion detection to strengthen coverage would include alerts on anomalies in process creation linked to known RMM software.

