note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the UltraVNC Remote Management Tool (RMM). Attackers may use UltraVNC to establish remote access for malicious purposes, such as executing commands or exfiltrating sensitive data. The relevant MITRE ATT&CK tactic is Command and Control (T1071) and the technique is Application Layer Protocol (T1219). Primary telemetry sources include Windows network connection logs that capture DNS queries or outbound traffic to UltraVNC domains. If this activity is malicious, it may allow attackers persistent access or control over affected systems. It is important to note that this detection alone does not confirm that an intrusion has occurred; legitimate usage of UltraVNC can trigger the alert.

  ### Investigation Steps

  - **Check recent network connections:** Review Windows Event ID 5156 (Windows Filtering Platform) logs for connections to domains like '*.ultravnc.com'. Note connections initiated after hours or from unusual hosts as higher risk.

  - **Identify legitimate UltraVNC usage:** Verify whether UltraVNC is an approved tool within the organization. Check for any IT documentation or communication indicating authorized use, especially from specific user roles like IT Support.

  - **Review for concurrent suspicious activities:** Correlate the detected UltraVNC network activity with Windows Event ID 4624 (Logon events) and 4688 (Process creation) to identify unusually timed logins or process creation by the same user or machine.

  - **Confirm intra-company communication:** Analyze internal network flow logs to determine if communication to ultraVNC domains is part of legitimate remote support activities, looking for expected patterns and confirmations from authorized teams.

  - **Monitor for high-confidence malicious indicators:** Look for additional indicators of compromise (IOCs), such as known malicious hashes for UltraVNC or unusual outbound connections that do not match documented usage patterns, focusing on anomalous user agents or unexpected authentication methods.

  ### Prioritization

  This alert should be treated with medium severity in an enterprise context, as it indicates potential misuse of remote management tools. The impact of the affected system varies, but the likelihood of malicious abuse is concerning given that UltraVNC can facilitate unauthorized access. Remote access tools are frequently weaponized by various threat actors.

  ### Blind Spots and Assumptions

  This detection may be limited by the potential for legitimate UltraVNC usage to trigger alerts, leading to false positives. Reliable detection requires accurate logging of outbound network connections, which may not always be enabled. Additionally, situations where employees use UltraVNC for remote support from unmonitored devices can generate similar alerts. A companion detection of file transfer activity (e.g., file creation through Event ID 4663) can help strengthen coverage against misuse of remote access tools.

