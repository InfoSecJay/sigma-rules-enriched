note: |
  ### Technical Context

  This rule detects processes related to the WebRDP Remote Management Tool (RMM), which may indicate unauthorized remote access or system management by an adversary. The likely attacker objective is to leverage this tool for remote command execution, unauthorized access, or network reconnaissance within the target environment. The relevant MITRE ATT&CK technique is "Remote Services: Remote Desktop Protocol (RDP) - T1219." Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the presence of this tool can indicate an ongoing compromise or administrative-level access by an adversary. This detection does not confirm that the activity is malicious on its own, as WebRDP may also be used for legitimate purposes.

  ### Investigation Steps

  - **Review process creation logs for WebRDP activity:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for processes where the `Image` or `ParentImage` ends with `webrdp.exe`. Validate the process creation context and timeline.

  - **Identify the user context:** Examine the `NewProcessName`, `UserName`, and `LogonType` fields to determine if a legitimate administrative user executed WebRDP. Benign usage typically involves known admin accounts during working hours.

  - **Match with network activity logs:** Review any outbound connections associated with the process (e.g., Event ID 5156 for Windows Filtering Platform) and validate against expected management IP addresses. Malicious activity may include unusual ports or IP addresses corresponding to external entities.

  - **Check for abnormal parent processes:** Analyze the `ParentImage` field and correlate any suspicious parent processes (e.g., `cmd.exe`, `powershell.exe`) that initiated `webrdp.exe`. This may indicate a malicious chain of execution.

  - **Correlate with threat intel and community reports:** Review recent reports or alerts from threat intelligence sources or community channels regarding the use of WebRDP for malicious activities. Track any known IOCs associated with the detected process.

  ### Prioritization

  The alert has medium severity, as WebRDP is a legitimate tool but is frequently weaponized by attackers for unauthorized access. The impact can be significant if used maliciously, particularly on critical assets within the network. The likelihood of abuse is moderate, given the nature of its functionality.

  ### Blind Spots and Assumptions

  Detection may be limited due to benign legitimate use of WebRDP in network management and maintenance tasks. Required log sources include comprehensive process creation logs and network monitoring to catch all instances. Legitimate IT management activities during regular maintenance windows may trigger this alert. A related detection that strengthens coverage would be monitoring for unusual user behavior patterns or anomalous login activity during the WebRDP process execution.

