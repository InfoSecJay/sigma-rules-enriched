note: |
  ### Technical Context

  This rule detects the execution of processes associated with the WebRDP remote management tool, which is often exploited by adversaries for remote access and control in compromised environments. The likely attacker objective includes maintaining persistence and conducting lateral movement or data exfiltration without detection. This behavior falls under the MITRE ATT&CK tactic of Command and Control (T1071.001) and the technique for Remote Access Tools (T1219). Primary telemetry sources include Windows Process Creation logs, specifically events like Security Event ID 4688. If malicious, the security impact can be severe, potentially leading to full system compromise and data leakage. However, this detection does NOT confirm malicious intent by itself; legitimate uses of WebRDP may trigger alerts.

  ### Investigation Steps

  - **Identify the process origin:** Review Security Event ID 4688 logs for the parent process of `webrdp.exe`. Check if the ParentImage indicates legitimate usage (e.g., your organization's management tools) or suspicious activity from non-standard applications.

  - **Examine execution context:** Look for information in the logs, such as CommandLine arguments and User fields. A CommandLine containing obfuscated scripts or unusual arguments may indicate malicious activity, whereas straightforward parameters may suggest legitimate use.

  - **Correlate with known assets:** Identify if the asset running `webrdp.exe` is a known authorized administrative or support machine. If the asset is critical to operations and aligns with your asset inventory, consider it a benign indicator.

  - **Check for lateral movement behavior:** Investigate other related process creation events following the execution of `webrdp.exe` on the same asset. High-frequency process creation or child processes spawned shortly after could indicate unauthorized use.

  - **Verify network connections:** Check firewall or network logs for outbound connections to unrecognized IP addresses following the execution of `webrdp.exe`. Such connections are high-confidence indicators of potential remote control activity.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive systems if WebRDP is misused. Given the tool's association with remote access and control, there is a moderate likelihood of malicious abuse, particularly in targeted internal attacks. Usage of such tools by attackers is common, requiring timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate WebRDP usage is frequent, leading to potential false positives. It is crucial to ensure process creation logging is enabled and properly configured for comprehensive detection. Additionally, authorized administrative activities could trigger this alert, such as legitimate support sessions. A companion detection to consider includes monitoring for unusual external connections following any remote management tool executions to strengthen coverage against misuse.

