  ### Technical Context

  This Sigma rule detects outbound network connections to the GetScreen remote management tool, which can indicate unauthorized remote access to a system. The likely objective of an attacker using this tool would be to gain control over the compromised host for data exfiltration or lateral movement. This activity is associated with the MITRE ATT&CK technique Remote Management Software (T1219). The primary telemetry source is Windows network connection logs, specifically capturing connections to domains ending with "getscreen.me".

  If malicious, this behavior could lead to significant security impacts, including unauthorized access to sensitive systems and data manipulation. However, it is important to note that this detection does NOT confirm malicious activity on its own, as legitimate users may utilize the GetScreen tool for permitted remote access.

  ### Investigation Steps

  - **Check outbound connections to specific domains**: Review Windows Security Event ID 5156 to identify any outbound connections to network destinations ending with ".getscreen.me". Malicious indicators include unusual connections to these domains from non-admin accounts or during off-hours.

  - **Correlate with process execution events**: Examine Sysmon Event ID 1 to check if there are processes associated with this network activity, specifically verifying if any unknown or unauthorized applications initiated these connections.

  - **Identify host role and context**: Validate the asset type and function—if the destination is a production server, this behavior is more concerning. Confirm whether the GetScreen tool is expected per the asset role, or if this is an anomaly.

  - **Examine for lateral movement by related tools**: Use network logs (Event ID 5140 - File Share Access) to identify any file access anomalies or lateral movement patterns consistent with unauthorized remote access, such as RDP or SMB file sharing leading to sensitive directories.

  - **Look for legitimate usage patterns**: Gather context by identifying if legitimate users access GetScreen during regular hours with documented business need. Compare execution timestamps against user login logs (Event ID 4624) to rule out manual use.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact of compromising system integrity via remote access. However, the likelihood of malicious abuse depends significantly on the environment's typical user behavior regarding RMM tools. These types of tools are increasingly weaponized by attackers to gain footholds in networks, particularly against remote work setups.

  ### Blind Spots and Assumptions

  The main detection limitation lies in the fact that many organizations may use GetScreen legitimately, leading to potential false positives. To ensure reliable detection, all necessary Windows network logging must be enabled, particularly for outbound connections. Legitimate activities that may trigger the alert include IT support teams performing authorized remote tasks. A related detection that strengthens coverage would be monitoring logs for the execution of remote management software (e.g., RDP or other RMM tools), which could indicate parallel threat vectors.

