note: |
  ### Technical Context

  This rule detects network connections to domains associated with the GetScreen Remote Management and Monitoring (RMM) tool. Attackers may leverage such tools for unauthorized remote access to systems, enabling activities such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique of Remote Services (T1219).

  The primary telemetry sources for this detection include Windows network connection logs, specifically those detailing outbound connections. If malicious, the security impact could be significant, allowing for potential compromise and control over affected systems. This detection does NOT confirm that the tool is being used for malicious purposes, as legitimate usage of GetScreen may also trigger this alert.

  ### Investigation Steps

  - **Inspect network connections: ** Review Windows network connection logs for Event ID 5156. Look for outbound connections to any of the following domains: `getscreen.me`, `go.getscreen.me`, or any subdomains. Legitimate organizational activities may include remote assistance tools from verified vendors; ensure the originating process aligns with known software.

  - **Identify source processes: ** Cross-reference network connections with Event ID 4688 (Process Creation logs) to determine which process initiated the connection. Evaluate if common remote access tools or suspicious executables are involved in the connections.

  - **Check for repeated access: ** Analyze the frequency and duration of connections to the GetScreen domains within a specific timeframe. Multiple instances of access within a short period can indicate suspicious behavior as legitimate uses would likely be sporadic.

  - **Evaluate user context: ** Review user activity associated with the connections by checking user logon events (Event ID 4624). Determine if the account making the connection has a legitimate reason for using GetScreen or if it appears compromised.

  - **Correlate with other logs: ** Search for additional signs of potential malicious behavior, including unexpected file transfers or modifications, in Windows Event ID 4663 (File Access logs). Pay special attention to any transfers to or from the detected domains.

  ### Prioritization

  The alert severity is medium due to the impacts of a compromised system, especially if it involves sensitive data or critical infrastructure. While the use of RMM tools can be legitimate, the likelihood of malicious abuse in environments lacking transparent monitoring is notable, making this a higher-risk behavior.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate users may also utilize GetScreen, leading to false positives. Reliable detection requires proper logging of outbound connections, and missing or misconfigured logs can hinder alert efficacy. Additionally, organizations employing RMM tools should ensure that their use is well documented. A related detection might include monitoring for common process names associated with remote management tools, thus increasing coverage on potential misuse.

