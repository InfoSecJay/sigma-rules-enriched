note: |
  ### Technical Context

  This rule detects network connections to the domains associated with the GetScreen RMM tool, which is often used for remote management and support. The likely attacker objective is to establish remote access and control over compromised systems, which can facilitate further lateral movement or data exfiltration. This activity aligns with the MITRE ATT&CK tactic for Command and Control (T1071.001 - Application Layer Protocol: Web Protocols).

  The primary telemetry sources for this detection are Windows event logs focusing on network connections, specifically the DestinationHostname associated with GetScreen domains. If malicious, this could lead to significant risks such as unauthorized access to sensitive data and persistence mechanisms on endpoints. Importantly, this detection does NOT confirm that an adversary is present; legitimate use of the GetScreen tool could trigger the alert.

  ### Investigation Steps

  - **Identify the source process making the connection:** Review Windows Security Event ID 4688 logs for process creation events and correlate with network connection activity to determine if a known and trusted application initiated the connection.

  - **Check for other related activities:** Analyze recent connections or activities around the alert time frame using Sysmon Event ID 3 (Network Connection) to identify unusual outbound connections or known bad processes attempting similar connections. Look for patterns in behavior.

  - **Review legitimate use cases:** Confirm if the target system is known to utilize the GetScreen tool for remote support. Check organizational asset inventory and documented use cases for approved remote access.

  - **Correlate with User Activity Logs:** Investigate any recent logins or administrative actions made by users on the affected system to see if these correlate with incidents of unauthorized access and assess if the user should have launched GetScreen activities.

  - **Identify high-confidence malicious indicators:** Look for signs of exploitation or manipulation in Windows Event logs tied to the process parent-child relationship. If the GetScreen process follows an unusual process chain, mark it for further review.

  - **Check for file artifacts:** If GetScreen was installed, validate the presence of installation directories or files on the system (e.g., C:\Program Files\GetScreen). Use file system auditing to check for new or altered files related to GetScreen around the alert trigger time.

  ### Prioritization

  This alert is of medium severity in an enterprise context, given that remote access tools are commonly exploited by adversaries for governance and data theft. The likelihood of malicious abuse is moderate, especially if the environment does not typically use this tool. While the behavior can be legitimate, it may be weaponized and should be thoroughly investigated.

  ### Blind Spots and Assumptions

  Detection may be bypassed if the adversary uses IP address spoofing or employs VPN services to mask the traffic. Reliable detection requires correct logging configurations for network traffic, and the presence of extensive logging can be critical. Legitimate IT support activities, such as authorized remote assistance, can also trigger this alert. A related detection for better coverage could involve monitoring for anomalies in remote desktop services alongside this rule for a more comprehensive view of possible remote access configurations.

