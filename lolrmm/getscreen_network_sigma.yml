note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with the GetScreen Remote Management Tool (RMM), including 'getscreen.me' and its subdomains. Attackers may utilize this tool for remote access, conducting reconnaissance, or deploying malware on compromised systems. This behavior typically aligns with the MITRE ATT&CK tactic of Command and Control (T1105) and technique of Remote Access Tools (T1219).

  Primary telemetry sources include network connection logs detailing outbound traffic and DNS queries. If malicious, the use of GetScreen can facilitate persistent access to systems, leading to data exfiltration or further exploitation. This detection does NOT confirm that malicious activity is occurring; legitimate users may also employ GetScreen for remote support tasks.

  ### Investigation Steps

  - **Check outbound connections: ** Review network connection logs for Event IDs 5156 (Windows Filtering Platform) that show outbound connections to 'getscreen.me' domains. Determine whether the traffic corresponds to expected behavior or atypical patterns for the user or host.

  - **Inspect process creation history: ** Investigate Sysmon Event ID 1 to identify any processes spawning connections to GetScreen domains. Look for unusual or unexpected parent processes that may indicate malicious usage (e.g., svchost.exe initiating connections).

  - **Validate legitimate use: ** Confirm if known users or IT support staff typically use GetScreen for remote access. If legitimate activity is noted, cross-check session times with user schedules and activity logs to categorize as benign.

  - **Analyze DNS resolution logs: ** Review logs for DNS queries to 'getscreen.me' captured by your DNS logging solution (e.g., Event ID 8 in DNS Server logs). Look for frequent or unusual queries that may indicate an attempt to establish persistent connections.

  - **Identify high-confidence malicious signage: ** Look for multiple connection attempts to GetScreen during a short timeframe or connections from non-standard locations (e.g., unauthorized IP addresses, public networks) which may indicate abuse.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on enterprise security from unauthorized remote access. The likelihood of malicious abuse is moderate, as the GetScreen RMM tool can be weaponized by attackers. This behavior has been observed in various post-compromise scenarios, making it a relevant threat.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate use of GetScreen may produce similar logs, creating potential false positives. Reliable detection depends on proper logging of all outbound network connections and visibility into DNS queries. Regular legitimate activity may include IT support sessions that utilize GetScreen for service tasks. To bolster coverage, consider companion detections for other known remote access tools or anomalous traffic patterns indicative of command and control attempts.

