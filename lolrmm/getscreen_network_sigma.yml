  ---

  ### Technical Context

  This Sigma rule detects network activity associated with the GetScreen Remote Monitoring and Management (RMM) tool by identifying outgoing connections to domains associated with the tool (getscreen.me). Attackers may utilize RMM tools like GetScreen for various malicious objectives, such as gaining unauthorized access to systems, persistence, and executing commands remotely. This activity is pertinent to the MITRE ATT&CK framework under the tactic "Execution" and technique "Remote Services" (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically focusing on destination hostnames. If this behavior is confirmed as malicious, it could lead to unauthorized access, data exfiltration, or system compromise. Importantly, this detection does NOT confirm malicious intent on its own; legitimate usage of GetScreen for remote management purposes can also trigger this alert.

  ---

  ### Investigation Steps

  - **Review outgoing connections**: Check for network connection logs (Windows Event ID 5156 or Sysmon Event ID 3) with `DestinationHostname` matching `getscreen.me` or its variants. Look for unusual access patterns from non-approved hosts.

  - **Confirm legitimate usage**: Identify users or administrative accounts that typically use remote management tools. Check user roles and systems (e.g., workstations with user access to GetScreen) associated with these connections.

  - **Correlate with process execution**: Look for related process logs (Event ID 4688) around the same time as network activity, focusing on processes that may utilize remote desktop functionality. Check for `getscreen.exe` or similar execution paths.

  - **Analyze connection frequency and ports**: Assess the frequency of connections to GetScreen domains, ensuring to check the usage of non-standard ports. A higher than typical volume may indicate potential abuse.

  - **Monitor for additional malicious indicators**: Investigate any other suspicious activities or indicators on the host from which the GetScreen connections were made, such as odd administrative actions or file modifications.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact on system integrity if malicious use is confirmed. RMM tools are frequently abused by adversaries for lateral movement and persistent access, making this behavior a relevant concern. The likelihood of malicious activity is increased if connections originate from hosts not typically associated with authorized support personnel.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that an attacker could spoof or disguise their traffic to evade detection. Enabling full Windows Firewall logs is necessary for reliable connection monitoring. Legitimate activities that may trigger this alert include IT support teams using GetScreen for remote assistance. A related detection to consider is monitoring the use of other remote access tools (e.g., AnyDesk or TeamViewer) to provide comprehensive coverage against potential RMM abuse scenarios.

