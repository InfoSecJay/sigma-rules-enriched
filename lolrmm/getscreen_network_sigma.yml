note: |
  ### Technical Context
  This rule detects potential network activity associated with the GetScreen Remote Monitoring and Management (RMM) tool, which is commonly used for remote access and support by IT administrators. However, its usage can be abused by threat actors to gain unauthorized access to systems, potentially leading to data exfiltration or further compromise. The presence of connections to domains associated with GetScreen could indicate either legitimate administrative tasks or potential nefarious activities.

  Threat actors may leverage tools like GetScreen to remotely control and manipulate victims' devices, usually with objectives like data theft, system exploitation, or lateral movement within the network. The primary MITRE ATT&CK tactics that apply here include **Execution** (T1203 – Exploitation for Client Execution) and **Remote Access Tools** (T1219), given that the tool enables execution of remote commands or access.

  The primary data sources for this detection are network connection logs from Windows systems. This telemetry will provide visibility into external connections made to the specified GetScreen domains, allowing security teams to differentiate between legitimate administrative use and potential malicious activity.

  ### Investigation Steps
  - **Review Network Connection Logs:** Analyze network connection logs for external connections to `getscreen.me` and its variants. Focus on the source IP addresses, destination IPs, and associated timestamps.
  - **Correlate with User Activity:** Identify the user accounts and processes associated with the connections to determine if the activity aligns with known administrative tasks or diverges from normal behavior.
  - **Check for Defense Evasion Techniques:** Investigate any obfuscation or anomalies around the use of GetScreen, such as unusual authentication methods or the presence of other suspicious tools in conjunction with its usage.
  - **Verify with Endpoint Data:** Cross-reference endpoint data from tools like EDR to check for any active sessions or processes related to GetScreen, ensuring that no unauthorized installations or executions have occurred.

  ### Prioritization
  This alert is marked as medium severity due to the likelihood of legitimate administrative activity using GetScreen; however, it poses a risk if unauthorized use occurs. Prompt investigation is necessary to ensure that no unauthorized remote access or escalation is taking place.

  ### Blind Spots and Assumptions
  This detection may not fully account for legitimate administrative use of GetScreen by trusted personnel, potentially leading to false positives. The detection can miss connections initiated from private or less common domains that are also utilized by malicious actors for similar purposes. For the alert to function effectively, it is assumed that network connection logs are being captured consistently and that there is baseline knowledge of legitimate usage patterns with the GetScreen tool in the environment.

