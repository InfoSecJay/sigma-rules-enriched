detection:
  selection:
    TargetObject|contains:
    - HKLM\SOFTWARE\Clients\Media\AnyDesk
    - HKLM\SYSTEM\CurrentControlSet\Services\AnyDesk
    - HKLM\SOFTWARE\Classes\.anydesk\shell\open\command
    - HKLM\SOFTWARE\Classes\AnyDesk\shell\open\command
    - HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Print\Printers\AnyDesk 
      Printer\*
    - HKLM\DRIVERS\DriverDatabase\DeviceIds\USBPRINT\AnyDesk
    - HKLM\DRIVERS\DriverDatabase\DeviceIds\WSDPRINT\AnyDesk
    - HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\AnyDesk
  condition: selection
falsepositives:
- Legitimate use of AnyDesk
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects registry activity associated with the AnyDesk remote management tool, specifically targeting Windows registry paths indicative of its presence and configuration settings. Attackers may use AnyDesk for remote access or control of compromised systems, intending to exfiltrate data or further entrench their presence within the environment without raising immediate suspicion.

  The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and the technique is **Remote Access Software** (T1219). Primary telemetry sources include Windows Registry event logs, specifically monitoring entries under the specified keys, which may confirm the installation or invocation of the AnyDesk application. If this activity is malicious, it could lead to unauthorized access, data breaches, or lateral movement within the network. Notably, this detection does NOT confirm unauthorized remote access on its own; legitimate use of AnyDesk by authorized personnel may also trigger this alert.

  ---

  ### Investigation Steps

  - **Review registry modifications:** Check for Event ID 4663 (Registry Object Access) to see who accessed or modified the specified AnyDesk registry keys, noting the user account and access time. Look for entries from unexpected users or unusual timestamps indicating potential malicious usage.

  - **Correlate with remote connectivity logs:** Analyze Network Monitor logs or firewall logs for any outbound connections (e.g., TCP/UDP traffic to AnyDesk IP addresses) made by the system in question post-registry activity, indicating live remote sessions. High-volume traffic to these destinations without legitimate cause is a strong indication of malicious activity.

  - **Identify authorized use cases:** Confirm whether AnyDesk is a sanctioned tool within your organization by checking the software inventory against enterprise policy. If the tool is in approved use, note the personnel allowed to utilize it and any scheduled support sessions that correlate with the registry modifications observed.

  - **Investigate application execution:** Look for Event ID 4688 (Process Creation) logs to verify if AnyDesk was executed. Specifically, search for the path that includes AnyDesk in the command line. Legitimate instances typically originate from known install locations or authorized user accounts.

  - **Examine print driver modifications:** Check for changes in Event ID 4101 (Driver Loaded) or printer logs if AnyDesk Printer entries are present in the registry. Refer to the system's printer configuration to determine if the presence of AnyDesk Printer aligns with normal operations.

  - **Assess persistence mechanisms:** Check for evidence of persistence techniques such as scheduled tasks or service installations via Event ID 4697 (Service Installation) that reference AnyDesk.  Discovery of such configuration may indicate a malicious intent to maintain access even after user sessions expire.

  ---

  ### Prioritization

  This alert warrants medium severity given the potential for significant impact on system integrity and confidentiality if malicious use is confirmed. While legitimate usage of AnyDesk exists, the tool is frequently abused in remote access scenarios, making it crucial to validate the context surrounding its registration and usage.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by using custom or renamed remote access software, which may not generate similar registry entries. Principal telemetry must include complete event logs for registry access; ensure that such logging is enabled as a part of security best practices. Legitimate authorized personnel using AnyDesk for remote support may trigger this rule without malicious behavior. A companion detection to consider is monitoring for unusual network traffic patterns to identify illicit command and control communications following registry modifications.

