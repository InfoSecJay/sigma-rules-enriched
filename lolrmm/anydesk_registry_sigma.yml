logsource:
  product: windows
  category: registry_event
detection:
  selection:
    TargetObject|contains:
    - 'HKLM\SOFTWARE\Clients\Media\AnyDesk'
    - 'HKLM\SYSTEM\CurrentControlSet\Services\AnyDesk'
    - 'HKLM\SOFTWARE\Classes\.anydesk\shell\open\command'
    - 'HKLM\SOFTWARE\Classes\AnyDesk\shell\open\command'
    - 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Print\Printers\AnyDesk Printer\*'
    - 'HKLM\DRIVERS\DriverDatabase\DeviceIds\USBPRINT\AnyDesk'
    - 'HKLM\DRIVERS\DriverDatabase\DeviceIds\WSDPRINT\AnyDesk'
    - 'HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\AnyDesk'
  condition: selection
falsepositives:
- Legitimate use of AnyDesk
level: medium
note: |
  ### Technical Context

  This Sigma rule detects registry activity indicative of the installation or configuration of the AnyDesk remote management tool. The primary objective of an attacker utilizing AnyDesk may involve establishing a command-and-control (C2) channel or facilitating unauthorized access to a compromised system. Related to MITRE ATT&CK tactics, this aligns with Command and Control (TA0011) and specifically technique T1219 (Remote Access Tools). The primary telemetry source includes Windows registry event logs, specifically changes to keys associated with AnyDesk installations. If malicious, this behavior enables an attacker to remotely control systems, posing a significant security threat. It is crucial to note that this detection alone does not confirm that AnyDesk is being used maliciously; legitimate use cases exist.

  ### Investigation Steps

  - **Review registry changes**: Check for Event IDs associated with registry modifications (e.g., Event ID 4657) focusing on the paths: `HKLM\SOFTWARE\Clients\Media\AnyDesk`, `HKLM\SYSTEM\CurrentControlSet\Services\AnyDesk`, and other specified AnyDesk registry locations for changes made recently.

  - **Identify legitimate installations**: Assess if AnyDesk entries were created or modified through official software management processes, such as verified system configuration or a known software deployment tool, indicating acceptable use.

  - **Correlate with user activity**: Examine User Logon (Event ID 4624) records around the time of the registry changes to verify whether the user logged into the system has a legitimate reason to install AnyDesk or if it aligns with any identified abuse patterns.

  - **Look for suspicious command execution**: Investigate for Sysmon Event ID 1 (Process Creation) to see if AnyDesk was launched shortly after registry changes, particularly looking for unusual command-line parameters that may indicate malicious use.

  - **Monitor outbound connections**: Check for network activity (e.g., firewall or network logs) that correlates with AnyDesk usage, especially connections to known AnyDesk endpoints using logs or telemetry that captures the destination IPs and ports (TCP port 6568).

  - **Identify anomalous user roles**: Specifically examine the asset's role within the network context; if AnyDesk was found on critical infrastructure assets or sensitive systems, this should elevate investigation diligence regardless of user permissions.

  ### Prioritization

  The severity of this alert is medium based on the potential impact of a compromised system if AnyDesk is used for unauthorized remote access. Given the tool's common association with both legitimate IT management and malicious activity, the likelihood of abuse remains significant, especially in environments where remote access policies are either lax or unmonitored.

  ### Blind Spots and Assumptions

  Detection may be evaded if the attacker uninstalls AnyDesk or alters registry entries to cover their tracks. Reliable detection requires configured logging for registry events and comprehensive monitoring of both system and network activities. Legitimate administrative actions, such as IT support troubleshooting or maintenance using AnyDesk, could trigger these alerts. To enhance detection capabilities, consider implementing companion detections for unexpected outbound connections or anomalous user behavior linked to remote access tools.

