logsource:
  product: windows
  category: registry_event
detection:
  selection:
    TargetObject|contains:
    - 'HKLM\SOFTWARE\Clients\Media\AnyDesk'
    - 'HKLM\SOFTWARE\Clients\Media\AnyDesk-*'
    - 'HKLM\SYSTEM\CurrentControlSet\Services\AnyDesk'
    - 'HKLM\SYSTEM\CurrentControlSet\Services\AnyDesk-*'
    - 'HKLM\SOFTWARE\Classes\.anydesk\shell\open\command'
    - 'HKLM\SOFTWARE\Classes\AnyDesk\shell\open\command'
    - 'HKLM\SOFTWARE\Classes\AnyDesk-*\shell\open\command'
    - 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Print\Printers\AnyDesk Printer\*'
    - 'HKLM\DRIVERS\DriverDatabase\DeviceIds\USBPRINT\AnyDesk'
    - 'HKLM\DRIVERS\DriverDatabase\DeviceIds\WSDPRINT\AnyDesk'
    - 'HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\AnyDesk'
    - 'HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\AnyDesk-*'
  condition: selection
falsepositives:
- Legitimate use of AnyDesk
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious registry activity pertaining to the AnyDesk remote management tool. Attackers may leverage AnyDesk to establish unauthorized remote access to systems, facilitating data exfiltration or lateral movement within the environment. The relevant MITRE ATT&CK techniques include Command and Control (T1071) and Remote Access Software (T1219). The primary telemetry source for this detection is the Windows Registry change logs, specifically targeting certain registry paths associated with AnyDesk.

  If the detected activity is malicious, it could lead to unauthorized access, data theft, and potential compromise of critical systems. However, this detection alone does not confirm malicious activity, as AnyDesk may be legitimately installed and used within the organization.

  ### Investigation Steps

  - **Check for legitimate AnyDesk usage:** Review user activity logs to confirm accepted use cases for AnyDesk in the organization. Ensure any recorded usage corresponds to known and approved personnel.

  - **Correlate detected registry changes:** Examine Windows Security Event ID 4657 and Security Event ID 4902 to identify recent modifications to the registry entries linked to AnyDesk. Pay attention to values changed and timestamps to correlate with user activity.

  - **Compare device list against expected systems:** Cross-reference affected systems against your asset inventory. Determine if AnyDesk is installed on non-approved machines or critical systems that should not have remote access software.

  - **Identify high-confidence malicious indicators:** Look for recent process creation events associated with `AnyDesk.exe` (Security Event ID 4688) or related executable paths. Malicious installations will often show abnormal activity patterns not typical for legitimate usage, such as high-frequency connections or access to sensitive data.

  - **Review network traffic for anomalies:** Analyze logs from your network security solutions for any unexpected ingress or egress traffic involving AnyDesk, particularly connections to unfamiliar external IPs. This will help identify potential command and control communications.

  - **Document system configuration and operational context:** Ensure any forensic evidence related to the findings is well-documented, including timestamps of registry changes and network traffic activity, to support further analysis and incident response.

  ### Prioritization

  This alert carries medium severity due to the potential risk of unauthorized remote access on affected systems. The likelihood of exploitation can vary based on the organization’s operational policies regarding remote support tools, but AnyDesk is commonly weaponized for unauthorized access by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate AnyDesk installations across the network, potentially leading to false positives. Ensure logging for Windows Registry activities is enabled to capture relevant data. Legitimate administrative activities or help desk support sessions can trigger this alert frequently. A companion detection to consider might involve monitoring for unusual outbound connections to IPs associated with AnyDesk services as an additional layer of threat detection.

