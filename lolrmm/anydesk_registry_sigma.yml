title: Potential AnyDesk RMM Tool Registry Activity
id: 3313d179-78b1-41d3-afe0-40dfc5dc794f
status: experimental
description: |
  Detects potential registry activity of AnyDesk RMM tool
references:
- https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
tags:
- attack.execution
- attack.t1219
logsource:
  product: windows
  category: registry_event
detection:
  selection:
    TargetObject|contains:
    - HKLM\SOFTWARE\Clients\Media\AnyDesk
    - HKLM\SYSTEM\CurrentControlSet\Services\AnyDesk
    - HKLM\SOFTWARE\Classes\.anydesk\shell\open\command
    - HKLM\SOFTWARE\Classes\AnyDesk\shell\open\command
    - HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Print\Printers\AnyDesk Printer\*
    - HKLM\DRIVERS\DriverDatabase\DeviceIds\USBPRINT\AnyDesk
    - HKLM\DRIVERS\DriverDatabase\DeviceIds\WSDPRINT\AnyDesk
    - HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\AnyDesk
  condition: selection
falsepositives:
- Legitimate use of AnyDesk
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential registry activities associated with the AnyDesk remote management tool. AnyDesk is often used legitimately for remote support and administration, but it can also be leveraged by attackers for unauthorized remote access, facilitating data exfiltration or lateral movement within a network. By monitoring registry modifications related to AnyDesk, security teams can uncover potential abuse of this tool, particularly in environments where its use is not authorized or expected.

  Attackers may exploit AnyDesk to gain control over target systems, allowing them to monitor user activities, access sensitive data, or use the compromised machine as a pivot point to infiltrate additional systems. This behavior aligns with the MITRE ATT&CK framework, specifically the **Execution** tactic, with the technique ID [T1219](https://attack.mitre.org/techniques/T1219/), which encompasses the use of remote access tools (RATs). The primary data source relevant for this detection is Windows registry event logs, specifically those that capture changes to relevant HKLM registry paths associated with AnyDesk.

  ### Investigation Steps
  - **Review Registry Changes:** Examine the specific Windows registry paths indicated in the detection rule for unusual entries or modifications associated with AnyDesk.
  - **Correlate with Process Creation Events:** Investigate recent process creation logs for instances where AnyDesk was executed or initiated, especially if it coincides with the registry changes detected.
  - **Analyze Network Traffic:** Monitor network logs for AnyDesk-related traffic, looking for unusual patterns such as connections to unrecognized IP addresses or geographic locations inconsistent with normal business operations.
  - **Check User Accounts:** Verify the legitimacy of user accounts that have accessed AnyDesk instances. Investigate any unfamiliar users or anomalies in their access times and activities.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of unauthorized access using AnyDesk, which could compromise sensitive systems and data. The likelihood of detection is heightened in environments where AnyDesk is not commonly used or explicitly permitted.

  ### Blind Spots and Assumptions
  This detection may not cover all potential use cases of AnyDesk, particularly in organizations where it is explicitly approved and used legitimately. The detection logic assumes that any registry changes related to AnyDesk are abnormal in the context of the organization's usage policies. Effective detection requires comprehensive logging of Windows registry events, which may not be enabled in all environments, representing a possible gap in visibility regarding remote access tool activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
