note: |
  ### Technical Context

  This rule detects potential process activity associated with the Jump Desktop RMM tool, which is commonly used for remote access and support. Attackers may leverage this tool to maintain persistence in a compromised network or to facilitate lateral movement within environments. This activity is relevant to the MITRE ATT&CK framework under the tactic “Execution” (TA0002) and the technique “Remote Access Software” (T1219).

  The primary telemetry sources required are Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1. If this detection results from suspicious behavior, it may indicate a significant security risk, as an adversary could be exploiting unauthorized access to manipulate or extract sensitive data. However, it is essential to note that this detection alone does not confirm malicious intent; legitimate uses of Jump Desktop can trigger similar alerts.

  ### Investigation Steps

  - **Review related process creation logs:** Query Windows Event Logs for Event ID 4688 or Sysmon Event ID 1, focusing on the creation of processes with images matching `jumpclient.exe`, `jumpdesktop.exe`, `jumpservice.exe`, `jumpconnect.exe`, or `jumpupdater.exe`.

  - **Check parent process relationships:** Investigate the ParentImage field for processes initiated by legitimate admin tools or services. The usage of related processes such as `explorer.exe` or legitimate management tools indicates benign activity, while unexpected parent processes may indicate malicious behavior.

  - **Correlate with user activity reports:** Verify user access logs to confirm whether documented administrative actions or supported sessions used Jump Desktop. Check fields such as UserName and UserDomain for inconsistencies.

  - **Identify installation or execution times:** Review installation logs or action timestamps in the environment to assess if the deployment of Jump Desktop was documented during routine procedures or recently introduced without appropriate approval.

  - **Assess asset criticality:** Determine the asset's role. Jump Desktop use on critical servers or sensitive workstations increases the urgency of response; ensure proactive monitoring if these assets are involved.

  - **Look for signs of data exfiltration:** Validate any spawned processes for file creation or network connections that may indicate unauthorized data access (such as outbound connections on unusual ports). Check for unexpected file writes or file transfers in the associated directories.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact of unauthorized remote access on critical systems. The likelihood of malicious abuse is moderate, especially if the usage is not well-documented or unexpected in the context of the organization. While the Jump Desktop tool has legitimate applications, its common use in remote administration makes it an attractive target for adversaries.

  ### Blind Spots and Assumptions

  Detection limitations may arise if logs are not consistently collected or if Jump Desktop is disguised by legitimate processes, making it challenging to determine intent. Required log sources include properly configured Windows event logs (Security and Sysmon). Legitimate administrative tasks using Jump Desktop may trigger this alert, necessitating contextual analysis. A related detection could include alerts for unauthorized installations of remote access tools, enhancing overall monitoring for remote access anomalies.

