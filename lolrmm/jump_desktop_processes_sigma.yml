note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Jump Desktop Remote Management Tool (RMM). The primary behavior it identifies involves the spawning of established Jump Desktop components that could indicate unauthorized access or remote control by an adversary. The likely attacker objective is to establish a command-and-control (C2) channel to a compromised system, allowing them to perform arbitrary actions remotely.

  This detection is relevant to the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Remote Access Software" (T1219). The primary telemetry sources are Windows process creation logs, including Security Event ID 4688 and Sysmon Event ID 1, which capture process creation events along with details on the parent and child processes involved in the execution chain. If malicious, this activity could facilitate significant data breaches, unauthorized system access, or lateral movement within the enterprise network. Importantly, this detection does NOT confirm that the activity is malicious by itself, as legitimate use of Jump Desktop for remote administration may trigger the rule.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for processes related to Jump Desktop, focusing on the Image and ParentImage fields for suspicious parent-child relationships, such as `jumpclient.exe`. Legitimate usage typically shows non-malicious parent processes like `explorer.exe`.

  - **Correlate user activity:** Investigate user account activity that spawned the Jump Desktop processes using the "Account Name" field in the logs. Unexpected or anomalous accounts launching these processes may indicate compromise.

  - **Check for unusual command line arguments:** Validate command line arguments used in conjunction with the Jump Desktop processes by reviewing Sysmon Event ID 1 data. Legitimate commands usually lack obfuscation or unusual flags that are commonly utilized by attackers.

  - **Assess system context:** Identify the role of the affected system (e.g., server, workstation) by referencing asset management databases. Unexpected use of Jump Desktop on sensitive or critical systems underscores higher risk.

  - **Search for persistence artifacts:** Investigate for persistence mechanisms related to Jump Desktop by reviewing Startup items and scheduled tasks. Malicious installations may create additional entries that don’t align with normal administrative practices.

  - **Collect network traffic:** If safe, capture and analyze network traffic to detect any outbound connections to known Jump Desktop IPs or domains associated with unauthorized C2. Look for anomalies in expected communication patterns.

  ### Prioritization

  This alert is classified as medium severity due to the potential risk of unauthorized remote access to systems, particularly if it occurs on critical infrastructure. Although the likelihood of malicious abuse is moderate since Jump Desktop is a legitimate RMM tool, it is commonly weaponized in targeted attacks, warranting attention from analysts.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using obfuscation techniques or legitimate credentials to run Jump Desktop. Key log sources must be properly configured to capture process creation events, including Security and Sysmon logs. Legitimate corporate remote access scenarios may trigger this alert, necessitating careful context evaluation. Companion detections to consider include unauthorized network connections or file activities linked with RMM tools, enhancing overall detection capability.

