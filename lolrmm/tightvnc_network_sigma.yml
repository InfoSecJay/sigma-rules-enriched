note: |
  ### Technical Context

  This rule detects network activity potentially related to the TightVNC remote management tool, which connects to domains associated with TightVNC. The primary objective of an attacker using TightVNC would typically be remote access to compromised systems for reconnaissance, data theft, or lateral movement. This behavior aligns with the MITRE ATT&CK techniques for Command and Control (T1219).

  The primary telemetry source is Windows network connection logs that capture outgoing connections to the specified TightVNC domains. If malicious, this activity could indicate unauthorized remote access or control over active systems, compromising confidentiality and integrity. It's important to note that this detection does NOT confirm malicious intent on its own, as legitimate usage of TightVNC can also cause similar network traffic.

  ### Investigation Steps

  - **Review network connection logs**: Examine Windows Event ID 5156 for outgoing connections to `tightvnc.com` domains. Look for connections initiated by unusual users or processes not typically seen in your environment.

  - **Identify expected usage patterns**: Confirm if TightVNC is an authorized remote access tool in your organization. Legitimate traffic should originate from known administrative accounts or managed devices.

  - **Assess process activity**: Check for processes launching on the same hosts as network connections. Use Event ID 4688 or Sysmon Event ID 1 to identify if TightVNC executables (e.g., `tvnserver.exe`) are running on the system.

  - **Monitor for unusual behaviors**: Evaluate any simultaneous creation of unusual outbound connections on other ports that deviate from normal TightVNC usage (typically on TCP port 5900), indicative of evasion tactics.

  - **Correlate with authentication logs**: Review Windows Security Event ID 4624 to check for any abnormal login patterns coinciding with TightVNC usage, focusing on unexpected logins during non-business hours.

  ### Prioritization

  This alert should be considered medium severity due to its potential impact on systems facilitating remote access and the likelihood of misuse by adversaries. While TightVNC can be used legitimately, its known association with unauthorized access makes this behavior a common target for malicious exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where TightVNC is a legitimate application; in such cases, understanding authorized usage is crucial to reduce false positives. Additionally, if network logs are not properly configured to capture all outgoing connections, detection may fail. Legitimate administrative tools and user behavior may trigger this alert, emphasizing the need for contextual evaluation. A related detection to consider is monitoring for file creation events through TightVNC installations (e.g., checking for the installation path in Windows Event IDs 1033 for installation events) for deeper visibility.

