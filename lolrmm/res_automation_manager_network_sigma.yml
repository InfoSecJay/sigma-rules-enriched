  ### Technical Context

  This Sigma rule detects outbound network connections initiated by the RES Automation Manager RMM tool, specifically to hosts ending with "user_managed" or "ivanti.com". The likely attacker objective could include either lateral movement within a corporate network or command and control (C2) communications leveraging this management tool for malicious exploitation. This corresponds to MITRE ATT&CK tactic "Execution" (TA0002) and the technique "System Owner/User Execution" (T1219).

  Primary telemetry sources include Windows network connection logs which detail events related to outbound connections. The security impact, if malicious, could entail unauthorized access and potential pivoting to sensitive systems through compromised management tools. However, this detection does NOT confirm malicious intent on its own—legitimate network activity may trigger the same connections.

  ---

  ### Investigation Steps

  - **Investigate network connections:**
    Review outbound connections from the affected host using Windows Firewall logs (Event ID 5156) or Sysmon Event ID 3. Check for connections to "user_managed" or "ivanti.com" domains. Look for patterns of frequent connections not typical for user activities.

  - **Correlate with known usage:**
    Verify if the RES Automation Manager is an authorized application in your environment. Check software inventory or management tools to confirm legitimate deployment and use cases.

  - **Identify unusual processes:**
    Review process creation logs (Security Event ID 4688 and Sysmon Event ID 1) for any unusual processes that initiate network connections to the detected domains. Pay attention to processes not typically associated with RES Automation Manager.

  - **Check for patterns of abuse:**
    Look for repeated connection attempts in a short timeframe from a single host, which may indicate scripted automation by an adversary rather than normal administrative use.

  - **Analyze asset criticality:**
    Determine the criticality of the affected asset. If it serves key functions or has access to sensitive data, prioritize further investigation or remediation actions.

  - **Validate file activity:**
    Review for any file writes or modified artifacts associated with the RES Automation Manager on the affected host (e.g., log files or configuration updates), which might suggest unauthorized changes or data exfiltration.

  ---

  ### Prioritization

  This alert has medium severity due to its potential impact if a critical asset is compromised and the associated risk of lateral movement or C2 operations through a management tool. While the RES Automation Manager is used legitimately, its features may be weaponized, thus warranting prompt investigation.

  ---

  ### Blind Spots and Assumptions

  This detection could be evaded by using DNS tunneling or by port-hopping techniques to obscure the outbound traffic. Reliable detection requires comprehensive logging configurations, including extensive logging of network connections and process creation events. Legitimate activities, such as regular administrative tasks, may also trigger this alert. A related detection, such as monitoring for unexpected use of administrative tools (e.g., PowerShell scripts), could enhance coverage on this potential threat landscape.

