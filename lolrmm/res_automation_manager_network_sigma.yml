note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the RES Automation Manager (RMM), a tool often used for remote management and automation of processes within enterprise environments. The likely attacker objective is to leverage this legitimate tool for unauthorized access or control of target systems. This behavior aligns with the MITRE ATT&CK Execution tactic, specifically technique T1219 (Remote Access Tools).

  The primary telemetry source for this detection is Windows network connection logs, specifically monitoring outbound connections to hosts ending with 'user_managed' or 'ivanti.com'. If malicious, this activity could indicate an unauthorized attempt to use RMM capabilities against sensitive systems. It’s important to note that this detection does NOT confirm malicious intent on its own, as the RES Automation Manager may also be used in legitimate administrative contexts.

  ### Investigation Steps

  - **Identify Network Traffic:** Review network connection logs for Event ID 5156 (Windows Filtering Platform) to find outbound connections to 'user_managed' or 'ivanti.com' hosts. Look for unusual destinations or multiple connections within a short time frame.

  - **Verify Client Systems:** Cross-reference the source IP addresses with known asset inventories to determine if the initiating system is authorized to use RMM tools. Legitimate use should typically originate from administrative or management servers in your environment.

  - **Behavioral Analysis:** Analyze the timing and frequency of connections. Legitimate RMM usage is typically periodic and aligns with maintenance schedules. High-frequency connections or unusual hours can indicate suspicious behavior.

  - **Review Process Details:** Examine Event ID 4688 (Process Creation) to identify any processes related to RES Automation Manager on affected systems. Look specifically for instances where automation scripts may invoke RMM functionalities improperly.

  - **Assess User Accounts:** Check the account used to initiate RMM connections in logs, looking for anomalies. Administrative accounts should be consistent with normal operational practices and not exhibiting unusual behaviors or locations.

  ### Prioritization

  This alert carries a medium severity level due to the potential for an attacker exploiting legitimate remote management tools to facilitate persistent access or control over critical systems. The likelihood of malicious abuse is moderate given the increasing use of RMM tools by attackers in modern environments. While the framework is commonly weaponized, actual exploitation hinges on the specific context of the observed behavior.

  ### Blind Spots and Assumptions

  Detection may be bypassed if the attacker uses obfuscation techniques or authorized users inadvertently trigger alerts due to legitimate activities. Reliable detection requires properly configured logging for network connections and filtering events from Event ID 5156. Additionally, legitimate administrative access and scheduled tasks may inadvertently create similar network patterns. A related detection worth implementing is monitoring for unusual process creation events linking to administrative tools, which can provide further insight into potential abuse scenarios.

