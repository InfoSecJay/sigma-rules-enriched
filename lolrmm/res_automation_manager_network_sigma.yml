note: |
  ### Technical Context

  This rule detects network activity associated with the RES Automation Manager, specifically communication with Ivanti domains. Attackers could use this tool for remote command execution to establish persistence or to facilitate lateral movement within the network. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), with the related technique being **Ingress Tool Transfer** (T1219). The primary telemetry source is Windows network connection logs, focusing on `DestinationHostname` where connections are made to domains ending in `ivanti.com`. If exploited maliciously, this behavior could enable unauthorized administrative access or control over the network. However, this detection does not confirm malicious intent on its own, as it could be part of legitimate operations authorized within the organization.

  ### Investigation Steps

  - **Verify Source of Connection:** Check Windows Event ID 5156 for allowed network connections involving `DestinationHostname` related to Ivanti. Legitimate entries will show expected behavior from recognized hosts within the organization.

  - **Analyze Process Association:** Review Windows Security Event ID 4688 to identify the process that initiated the connection to Ivanti domains. Look for known legitimate applications associated with RES Automation Manager. Any unexpected parent processes may indicate malicious behavior.

  - **Check Active Connections:** Use Windows PowerShell to run `Get-NetTCPConnection` and identify any active connections to Ivanti domains. Determine whether these connections originate from unapproved machines or user accounts.

  - **Inspect for Anomalies in user activities:** Correlate user activity logs with Security Event ID 4624 (successful logon) and look for unusual or unauthorized accounts accessing the RES Automation Manager. Any logons outside of expected hours or from unusual IPs should be scrutinized.

  - **Validate File Creation or Modification:** Investigate any file creation events linked to RES Automation Manager by checking Sysmon Event ID 11. Confirm if files are modified or created unexpectedly or from unauthorized paths.

  ### Prioritization

  The alert has medium severity due to the potential impact on systems leveraging RES Automation Manager for automation tasks. The likelihood of malicious abuse is moderate, especially if the tool is exploited for unauthorized remote access. This behavior is not commonly weaponized but could pose significant risks when misused.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the legitimate use of RES Automation Manager by authorized personnel and potential misconfigurations or lack of visibility into outbound traffic. Reliable detection requires logging and monitoring of all network connections, including proper configuration of firewall rules. Legitimate administrative access to Ivanti domains may trigger this alert, especially during scheduled maintenance periods or updates. A companion detection could include monitoring for abnormal process behavior related to PowerShell or remote management tools to strengthen coverage against misuse.

