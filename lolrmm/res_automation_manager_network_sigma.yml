note: |
  ### Technical Context

  This rule detects potential network activity initiated by the RES Automation Manager RMM tool based on the destination hostname. The attacker objective may include unauthorized access or manipulation of systems leveraging the capabilities of the RMM tool for lateral movement, persistence, or command and control (C2) operations. This behavior corresponds with the MITRE ATT&CK technique for execution (T1219).

  The primary telemetry source is Windows network connection logs, specifically those tracking outbound connections. If this activity is malicious, it could imply that an adversary is utilizing the RMM tool to control or exploit victim machines. Importantly, this detection does not confirm malicious intent on its own; legitimate usage of the RES Automation Manager for remote administration is a common occurrence.

  ### Investigation Steps

  - **Check outbound connections to suspicious hostnames:**
    Review Windows security event logs (Event ID 5156) for any outbound connections made to hostnames ending with "user_managed" or "ivanti.com", which are indicative of the RMM tool. Legitimate instances should correlate with authorized IT personnel activities.

  - **Identify recent RMM tool usage:**
    Cross-reference recent activity logs of the RES Automation Manager. Expected legitimate activity might show regular connection attempts to known endpoints for maintenance or updates.

  - **Monitor for multiple unauthorized connections:**
    Look for repeated connection attempts to the detected hostnames in a short time span. Multiple rapid connections could indicate automated reconnaissance or an ongoing attack attempt.

  - **Assess alert context using Asset Inventory:**
    Verify asset criticality by checking if the affected system is part of high-value target groups, such as domain controllers or sensitive data repositories. Unauthorized access attempts here are more concerning.

  - **Determine user account activity:**
    Review user activity logs (Event ID 4624) for logins associated with the times of detected RMM tool communications. Check if these logins correlate with administrative accounts or unusual activity patterns.

  ### Prioritization

  This alert is medium severity due to the potential impact on sensitive systems that might lead to wider compromise. The likelihood of misuse is moderate, as RMM tools are often exploited for unauthorized activities when credentials are obtained. While not commonly weaponized, the behavior can be indicative of a broader attack strategy if linked to other suspicious activities.

  ### Blind Spots and Assumptions

  This detection may be limited by false positives generated from legitimate administrative use of the RMM tool, which is commonplace in enterprise environments. To ensure reliable detection, ensure that logging configurations capture all outbound network connections for Windows systems. Additionally, other legitimate activity, such as automated system updates, may trigger similar alerts. Companion detections for remote access tools (e.g., T1069) should be implemented for enhanced coverage.

