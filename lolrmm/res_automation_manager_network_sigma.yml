note: |
  ### Technical Context

  This Sigma rule detects network activity related to the RES Automation Manager, specifically targeting connections to hosts with the domain suffixes 'user_managed' or 'ivanti.com'. The likely objective of an attacker employing this activity could be to establish command-and-control (C2) capabilities, leverage automated management tools for lateral movement, or exfiltrate sensitive data. This behavior aligns with the MITRE ATT&CK framework under the "Command and Control" tactic (TA0011) and the technique "Exploitation of Remote Services" (T1219).

  The primary telemetry sources include Windows network connection logs with relevant Event ID 5156 (Windows Filtering Platform) or Sysmon Event ID 3 for network connections. If malicious, the impact could include unauthorized access to resources and data leakage. It's important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of the RES Automation Manager may also trigger the rule.

  ### Investigation Steps

  - **Review network connections:** Check for Event ID 5156 and Sysmon Event ID 3 for connections made to 'user_managed' or 'ivanti.com'. Look for unusual source hosts or processes that shouldn’t be communicating with these domains.

  - **Validate authorized tool usage:** Confirm if the RES Automation Manager is used within the organization. Review configuration management documentation or consult with the IT operations team for legitimate instances of the tool’s deployment.

  - **Investigate process lineage:** For any flagged connection, trace back the originating process using Sysmon Event ID 1 (Process Creation) to assess if it's a known legitimate application or potentially malicious software masquerading as RES Automation Manager.

  - **Assess asset criticality:** Ensure the system making the connection is not an internet-facing service or critical infrastructure. Connections from high-value assets warrant deeper investigation.

  - **Correlate with additional alerts:** Look for other related alerts or logs that may indicate compromised activity, such as any unusual logons or privilege escalations during the same time frame.

  ### Prioritization

  The alert is of medium severity due to the potential impact on systems managed by the RES Automation Manager. While the tool is commonly used for legitimate administrative activities, its misuse for command-and-control purposes is a known tactic among attackers, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the fact that legitimate use of the RES Automation Manager can generate similar alerts, leading to false positives. Reliable detection requires proper configuration of logging for Windows Filtering Platform and Sysmon. Corporate environments may have regular usage patterns for the tool that could trigger these alerts, thus normal operational behavior should be taken into consideration. Companion detections, such as monitoring for anomalous user behaviors or privilege elevations (T1078), can enhance the overall security posture.

