note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to known Gorelo RMM (Remote Monitoring and Management) tool domains, indicating the potential use of this software for remote administration or management. The likely attacker objective is to establish command and control (C2) channels for unauthorized access and remotely control compromised endpoints. This detection falls under the MITRE ATT&CK tactic "Command and Control" (TA0011), specifically technique "Application Layer Protocol" (T1219).

  The primary telemetry source for this detection is Windows network connection logs, focusing on events that capture internet connections made by processes. If malicious, this activity can lead to a complete compromise of the affected system, allowing an attacker to execute further malicious actions undetected. However, this detection does NOT confirm that the activity is malicious on its own; legitimate users may also use Gorelo RMM for administrative purposes.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to monitored domains such as `app.gorelo.io` or `gorelo-rmm.azurewebsites.net` to establish if the alert is triggered.

  - **Examine process information:** Utilize Sysmon Event ID 3 to identify processes that initiated the connections, looking for unusual or suspicious executables that are not typically associated with legitimate RMM usage.

  - **Validate the source of the connections:** Investigate the local IP addresses and ports involved in the connections. Cross-reference with established baselines to determine if connections are from known administrative users or tools.

  - **Identify benign usage patterns:** Check existing user roles and responsibilities; legitimate use of Gorelo RMM should align with documented IT administrative policies and procedures. Expect connections during scheduled maintenance windows by known IT personnel.

  - **Look for high-confidence malicious indicators:** Assess if any of the initiating processes have been flagged in threat intelligence sources or match known patterns of malicious behavior linked to remote access tools.

  - **Correlate with other detections:** Cross-reference with endpoint detection logs or IDS alerts that may indicate lateral movement or privilege escalation around the same timeframe to provide context around the Gorelo tool usage.

  ### Prioritization

  This alert has medium severity due to the potential risk associated with unauthorized remote access to a system that could lead to an enterprise-wide security breach. The prevalence of remote access tools in modern attacks elevates the likelihood of malicious use, given that such tools are often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  The detection may have limitations as legitimate administrative activities could generate similar traffic, creating false positives. Reliable detection relies on comprehensive logging and proper configuration of Windows Filtering Platform events. Additionally, legitimate software updates or maintenance activities can trigger this alert. A related detection strategy could include monitoring for unusual user account activity in conjunction with this indicator to provide better context and coverage.

