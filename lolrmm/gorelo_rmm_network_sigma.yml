note: |
  ### Technical Context

  This detection rule identifies outbound network connections to domains associated with Gorelo RMM, a remote management and monitoring tool. The likely attacker objective is to use this tool for unwanted remote access or administration of compromised systems, leveraging its capabilities for persistent control. This behavior can be linked to the MITRE ATT&CK technique T1219 (Remote Access Tools).

  The primary telemetry source includes Windows network connection logs, which capture connections made from the endpoint to the specified Gorelo RMM domains. If these connections are made by an unauthorized actor, the security impact could include data theft, system manipulation, or lateral movement within the network. However, it is important to note that this detection does NOT confirm malicious activity on its own, as legitimate administrators may also use Gorelo RMM for remote management.

  ### Investigation Steps

  - **Identify connection logs**: Review Windows Security Event ID 5156 (Windows Filtering Platform) for outbound connections to domains like '*.app.gorelo.io' or '*.rmm.pod1.usw.gorelo.tech'. Check the `DestinationIp` and `DestinationHostname` fields for matches.

  - **Verify endpoint role**: Determine if the system initiating the connection role (e.g., server, workstation) typically utilizes remote management tools. Look for existing authorized use cases, such as support or IT management activities.

  - **Examine time of occurrence**: Correlate the connection time with user activity logs using Event ID 4688 (Process Creation) to find any unusual scheduled tasks or background processes that align with the network activity.

  - **Look for repeated connections**: Assess the frequency and pattern of requests to Gorelo domains. Multiple connections in a short time frame, especially after hours, may indicate malicious intent as opposed to legitimate administrative use.

  - **Expand the investigation scope**: Query endpoint telemetry for associated malicious indicators, such as other event logs (e.g., Sysmon Event ID 7) or specific command-line arguments commonly used in remote access scenarios.

  - **Consult user or asset classification**: If the connection originates from a sensitive system (e.g., a domain controller), prioritize this alert for immediate action, as potential compromise could have significant ramifications.

  ### Prioritization

  This alert holds medium severity because the endpoints involved may be critical systems. The likelihood of malicious abuse is moderate since attackers may use Gorelo RMM for unauthorized access, but legitimate use within the enterprise may also occur. The behavior is associated with remote access tactics, which are commonly exploited by adversaries.

  ### Blind Spots and Assumptions

  This detection might not identify highly sophisticated evasion tactics, such as DNS tunneling or misuse of encrypted connections. Ensuring proper log configurations and completeness of firewall logs is necessary for reliable detection. Legitimate administrative tasks, such as scheduled maintenance or software support, may trigger this alert. A companion detection rule monitoring other remote access tool behaviors (like T1059.001: Command-Line Interface) can help strengthen overall threat coverage.

