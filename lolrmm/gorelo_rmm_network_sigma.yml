note: |
  ### Technical Context

  This rule detects network activity targeting known Gorelo RMM endpoints, indicating potential use of the remote monitoring and management (RMM) tool. The likely attacker objective is to manage or control systems within the network, typically to execute unauthorized commands or exfiltrate data. This behavior corresponds to the MITRE ATT&CK tactic "Execution" (T1203) and technique "Remote Access Tools" (T1219).

  The primary telemetry source for this detection includes Windows network connection logs, specifically looking for outbound connections to domains associated with Gorelo RMM. If malicious, this activity could lead to unauthorized administrative access and control of affected systems. However, this detection alone does not confirm malicious intent, as legitimate administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Review Outbound Network Connections:** Check for Event ID 5156 in Windows Firewall logs for blocked or allowed outbound connections to Gorelo RMM domains. Legitimate business operations may involve connections to app.gorelo.io or similar endpoints during authorized support sessions.

  - **Examine Process Details:** Investigate the creation of processes associated with Gorelo RMM. Use Sysmon Event ID 1 to identify any unusual process executions that reference Gorelo executables or scripts in context with the detected network connections.

  - **Cross-reference Domain Queries:** Utilize DNS logs to track the frequency and context of DNS queries made to Gorelo domains. Unusual spikes in queries may indicate a potential compromise, as legitimate users would typically generate fewer requests.

  - **Check User Context and Permissions:** Review the user account used for the connection in Security Event ID 4624. Assess whether the account has appropriate permissions for RMM operations. Unusual account activity from non-admin users should be flagged for further investigation.

  - **Look for Additional Compromised Indicators:** Examine for other suspicious behaviors linked to the same host, such as abnormal file access patterns or unauthorized software installations, using telemetry from Event ID 4663 (File Access).

  - **Validate Legitimate Use Cases:** Gather context around any legitimate use of the Gorelo RMM tool. Verify if there are documented procedures for using RMM in your organization or connections from expected IP ranges associated with authorized support vendors.

  ### Prioritization

  This alert is classified as medium severity due to the potential impact of unauthorized access to managed systems. The likelihood of malicious abuse is moderate, particularly if internal policy prohibits unapproved RMM tools. This technique is weaponized in various environments, especially those lacking robust endpoint protection.

  ### Blind Spots and Assumptions

  Detection is limited since legitimate administrative actions may also trigger the rule, potentially resulting in false positives. Reliable detection requires the proper configuration of Windows logs and DNS query logs. Routine use of managed RMM solutions could lead to frequent alerts, suggesting a need for contextual analysis. For enhanced security coverage, consider deploying complementary detections for other remote administration tools commonly abused in enterprise environments.

