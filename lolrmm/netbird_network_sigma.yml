note: |
  ### Technical Context

  This rule detects potential network activity related to the NetBird Remote Management and Monitoring (RMM) tool. The likely attacker objective is to establish remote access to compromised systems for management, surveillance, or control, typical of post-exploitation phases within the attack lifecycle. Relevant MITRE ATT&CK tactics and techniques include Execution (TA0002) and Application Layer Protocol (T1219). The primary telemetry sources include Windows network connection logs, specifically monitoring outbound connections to specified domains and IP addresses associated with NetBird services.

  If malicious, this activity could indicate unauthorized access or control over an environment, potentially leading to data exfiltration or further lateral movement. However, this detection does NOT confirm that a compromise has occurred on its own, as legitimate usage of NetBird may trigger similar alerts.

  ### Investigation Steps

  - **Check network connections:** Review outbound connections in Windows Security Event ID 5156 (Windows Filtering Platform) for any links to the domains listed in the rule, particularly focusing on unusual or unauthorized asset connections.

  - **Identify legitimate usage:** Confirm whether the organization uses NetBird for legitimate administrative purposes by cross-referencing noted outbound connections with asset or endpoint records, especially for roles identified as requiring remote management capabilities.

  - **Correlate with process execution:** Look for corresponding Security Event ID 4688 (Process Creation) that show processes initiating outbound connections to these NetBird domains, especially from non-standard applications or user accounts.

  - **Check firewall logs:** Investigate firewall logs for events related to connections to the specified IP addresses (192.3.95.152 and 198.46.178.135) or domains, noting any unusual patterns or rules that differ from standard configurations.

  - **Search for additional indicators:** Review logs that capture DNS queries (e.g., from an internal DNS server) to assess the frequency and nature of queries to the targeted domains, which can help uncover automated or scripted connections associated with potential compromise.

  ### Prioritization

  This alert holds medium severity due to the potential impact on critical systems accessible via remote management tools. The likelihood of malicious abuse is noteworthy, as unauthorized use of such tools can lead to unauthorized access and control over sensitive environments, which is a common tactic in modern attacks.

  ### Blind Spots and Assumptions

  Detection is limited by the fact that legitimate utilization of NetBird may generate false positives. It assumes adequate logging of network activity, specifically outbound connections, is enabled and configured correctly across all critical assets. Additionally, benign situations, such as authorized IT personnel using NetBird for remote support, may trigger alerts. Companion detections such as process monitoring for abnormal behavior associated with remote tools would enhance overall security coverage and reduce confirmation time for potential threats.

