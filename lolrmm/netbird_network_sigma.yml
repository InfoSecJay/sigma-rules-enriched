note: |
  ### Technical Context

  This rule detects outgoing network connections to domains associated with the NetBird Remote Management and Monitoring (RMM) tool. Malicious actors might exploit NetBird for command-and-control (C2) purposes to maintain persistence or exfiltrate data. This behavior primarily aligns with the MITRE ATT&CK tactic **Command and Control** (TA0011) and the technique **Application Layer Protocol** (T1219).

  The main telemetry source for this detection is Windows network connection logs, which should include details about destination hostnames and potentially the process initiating the connections. If the activity is deemed malicious, it can lead to unauthorized access and data exfiltration. However, detecting this network activity does not confirm that the NetBird tool is used maliciously, as it may be employed legitimately within the organization.

  ### Investigation Steps

  - **Check network connection logs**: Investigate logs for Event ID 5156 from Windows Firewall with Advanced Security, focusing on connections to any of the listed NetBird domains (e.g., `api.netbird.io`, `app.netbird.io`), specifically noting connection attempts to unusual services or times of access.

  - **Identify initiating processes**: Review Event ID 4688 (Process Creation) to determine which processes initiated the connections to the NetBird domains. A legitimate process might typically be a known application or service associated with managed services, while unknown or suspicious executable paths could indicate malicious activity.

  - **Verify known usage of NetBird**: Cross-reference with asset inventory. Legitimate instances of NetBird should match registered servers or devices. Any unrecognized assets attempting access may warrant further scrutiny.

  - **Analyze firewall logs**: Use Windows event logs (Event ID 5154) to assess outbound firewall rules triggered by established connections. Determine if the traffic matches common legitimate patterns or protocols (e.g., HTTP/S) versus deviations that could indicate misuse.

  - **Examine DNS logs**: Review DNS query logs for resolution requests to identified NetBird domains. Look for patterns such as high query rates or queries coming from multiple hosts, which may indicate use beyond legitimate administration.

  - **Check for data exfiltration**: Monitor for significant data transfers related to the identified connections using Event ID 4663 (Access to Object) and ensure there are no unexpected uploads or downloads linked to these domains, focusing on sensitive data types.

  ### Prioritization

  This alert has medium severity given that a compromise of the affected system could enable persistent access, manipulation of data, or information theft. The scenarios involving RMM tools like NetBird can be commonly weaponized by adversaries to maintain control over breached systems, emphasizing the need for thorough investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if legitimate users are misconfigured to use the NetBird tool, leading to false positives. The logs from Windows Firewall (Event ID 5156) and process creation (Event ID 4688) must be enabled and properly configured for reliable detection. Additionally, legitimate network management activities, such as remote support sessions, may trigger this alert, requiring contextual understanding. A companion detection method could include monitoring for unusual patterns of lateral movement indicative of a compromised system leveraging an RMM tool.

