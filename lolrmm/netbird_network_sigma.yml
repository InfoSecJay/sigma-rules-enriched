note: |
  ### Technical Context

  This detection rule identifies network activity indicative of the NetBird Remote Management (RMM) tool contacting specific domains associated with its infrastructure. The likely attacker objective is establishing a Command and Control (C2) channel for remote access and management of compromised systems. This behavior aligns with the MITRE ATT&CK tactics of Command and Control (T1071) and Ingress Tool Transfer (T1219). Primary telemetry sources include Windows network connection logs, specifically focusing on DNS resolution activities and outbound connection attempts. If malicious, this activity may enable attackers to exert control over a system, exfiltrate data, or deploy additional malicious payloads. Importantly, this detection alone does not confirm malicious intent as legitimate use of the NetBird tool can trigger these alerts.

  ### Investigation Steps

  - **Review specific outbound connections:** Examine Windows Firewall logs (Event ID 5156) for outbound connections to the identified domains, including 'netbird.io' and associated IP addresses (e.g., 192.3.95.152). Look for unusual timestamps or initiated connections by non-administrative users.

  - **Analyze process creation events:** Check Sysmon Event ID 1 for any processes that may have initiated connections to NetBird domains. Look specifically for unusual parent processes such as cmd.exe or PowerShell.exe, which may indicate potentially malicious use.

  - **Identify legitimate use cases:** Confirm whether the impacted asset is known to employ NetBird for remote management. If so, verify that the connections are conducted during expected operational hours and involve recognized management activities.

  - **Determine user behavior patterns:** Check user activity logs (Event ID 4624) for logon events corresponding to the detected network activity, ensuring actions align with normal operational patterns and authorized usage of remote management tools.

  - **Monitor for additional behaviors:** If suspicious connections are confirmed, further investigate whether any file transfers or additional port communications occurred (analyze Event ID 4663 for file access indications) as this may hint at data exfiltration or abnormal file manipulation.

  ### Prioritization

  The alert has moderate severity due to the potential for significant impact if a system is compromised and used for malicious activities. The likelihood of abuse is reasonable given the nature of remote management tools, which can be weaponized for unauthorized access. However, the commonality of legitimate use mitigates immediate response urgency.

  ### Blind Spots and Assumptions

  Detection may be limited if the environment does not log outgoing network connections adequately or if legitimate NetBird use is widespread and unmonitored. False positives may arise from legitimate administrative tasks or scheduled maintenance. A companion detection covering anomalous login attempts (e.g., unusual token usage or geographical anomalies within logon events) can enhance overall visibility and context related to this tool's use.

