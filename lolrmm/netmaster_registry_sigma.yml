note: |
  ### Technical Context

  This Sigma rule detects potential registry modifications associated with the NetMaster remote monitoring and management (RMM) tool by monitoring specific entries under the Windows registry path `HKLM\SYSTEM\CurrentControlSet\Services\netmaster`. The attacker’s objective is likely to establish persistence or control over a compromised system through the installation of RMM tools, facilitating ongoing access and management of the endpoint.

  The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), and the corresponding technique is **Application Layer Protocol** (T1219). The primary telemetry source involves Windows registry event logs, specifically capturing registry modifications. If malicious, such behavior may allow an attacker to maintain control over the affected system and execute further actions undetected. Importantly, this detection does not confirm malicious intent on its own, as legitimate installations of NetMaster can trigger similar alert conditions.

  ### Investigation Steps

  - **Examine the registry path:** Navigate to `HKLM\SYSTEM\CurrentControlSet\Services\netmaster` to verify if there are any recent changes that coincide with the alert timeline. Legitimate instances will often have administrative install logs.

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for any processes created shortly before or after the registry modification. Look for suspicious process names that are not typical of legitimate NetMaster use.

  - **Correlate with remote access logs:** Investigate any Remote Desktop Protocol (RDP) logs (Event ID 4624) for unusual login attempts or sessions initiated around the time of registry activity. Note any external IP addresses that do not align with known administrative access.

  - **Assess related service behavior:** Analyze the state of the NetMaster service indicated by the registry change (using `Get-Service` in PowerShell or Windows Services panel). Confirm if the service is running with appropriate credentials and correlating timestamps to assess legitimacy.

  - **Validate user actions:** Review Windows Event Logs for user activity around the incident's timestamp (Event ID 4624 - Logon). Identify if the user accounts involved have a history of legitimate access to RMM functionalities.

  - **Monitor network traffic:** If possible, capture network traffic to check for any communication patterns associated with the NetMaster tool. Look for traffic utilizing application layer protocols indicative of remote management commands.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of unauthorized access to critical systems through RMM tools. The likelihood of malicious abuse is moderate, as RMMs like NetMaster can be weaponized by attackers for lateral movement and surveillance. However, the prevalence of legitimate use means further investigation is essential before escalating.

  ### Blind Spots and Assumptions

  Detection limitations may include unaudited or missing registry logs if certain GPO settings are not enforced. Legitimate administrative activities involving NetMaster usage may inadvertently trigger this detection, complicating the investigation. A companion detection focused on specific outbound connections (e.g., monitoring for unusual HTTP/S requests) can enhance coverage against potential command and control activities.

