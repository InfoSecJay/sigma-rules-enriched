detection:
  selection:
    TargetObject|contains:
    - 'HKLM\SOFTWARE\TeamViewer\*'
    - 'HKU\<SID>\SOFTWARE\TeamViewer\*'
    - 'HKLM\SYSTEM\CurrentControlSet\Services\TeamViewer\*'
    - 'HKLM\SOFTWARE\TeamViewer\ConnectionHistory'
    - 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TeamViewer\*'
    - 'HKU\SID\SOFTWARE\TeamViewer\MainWindowHandle'
    - 'HKU\SID\SOFTWARE\TeamViewer\DesktopWallpaperSingleImage'
    - 'HKU\SID\SOFTWARE\TeamViewer\DesktopWallpaperSingleImagePath'
    - 'HKU\SID\SOFTWARE\TeamViewer\DesktopWallpaperSingleImagePosition'
    - 'HKU\SID\SOFTWARE\TeamViewer\MinimizeToTray'
    - 'HKU\SID\SOFTWARE\TeamViewer\MultiMedia\AudioUserSelectedCapturingEndpoint'
    - 'HKU\SID\SOFTWARE\TeamViewer\MultiMedia\AudioSendingVolumeV2'
    - 'HKU\SID\SOFTWARE\TeamViewer\MultiMedia\AudioUserSelectedRenderingEndpoint'
    - 'HKU\SID\SOFTWARE\TeamViewer\ClientWindow_Mode'
    - 'HKU\SID\SOFTWARE\TeamViewer\ClientWindowPositions'
  condition: selection
falsepositives:
- Legitimate use of TeamViewer
level: medium
note: |
  ### Technical Context

  This Sigma rule detects registry changes associated with the TeamViewer Remote Management (RMM) tool, specifically looking for modifications in various TeamViewer-related registry paths. The likely attacker objective could involve unauthorized remote access or establishing control over a compromised system, potentially facilitating further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK technique for Remote Management Tools (T1219).

  The primary telemetry sources include Windows Registry event logs which capture these changes. If malicious, the impact could be significant, allowing an adversary to establish persistence or exfiltrate sensitive data remotely. However, it is important to note that this detection does NOT confirm malicious behavior by itself, as TeamViewer can be legitimately used for remote support and administration.

  ### Investigation Steps

  - **Review registry event logs**: Determine if entries for the following paths exist: `HKLM\SOFTWARE\TeamViewer\*`, `HKU\<SID>\SOFTWARE\TeamViewer\*`. Look for Event IDs related to registry changes (Event ID 4657).

  - **Uninstall checks**: Check the uninstall registry path: `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TeamViewer\*`. A legitimate entry should be present if TeamViewer is installed; absence could indicate potential removal attempts.

  - **Document legitimate TeamViewer usage**: Verify whether TeamViewer is used for legitimate business purposes by checking documentation or authorized software lists. This may include confirming installations via endpoint management tools or asset management databases.

  - **Identify malicious indicators**: Look for any registry paths that are modified unexpectedly, especially those indicating altered remote management settings. For instance, changes reflecting unauthorized configuration might include `HKU\<SID>\SOFTWARE\TeamViewer\MinimizeToTray`, which could signify an attacker trying to hide their actions.

  - **Monitor for associated process behaviors**: Correlate registry changes with running processes to spot unusual behavior. For instance, check for `TeamViewer.exe` related processes (Event ID 4688) spawned shortly after registry modifications.

  - **Check for context and frequency**: Assess whether these registry changes occur in unusual patterns or from unexpected hosts. Frequent alterations from machines that shouldn't be using TeamViewer could indicate malicious activity.

  ### Prioritization

  This alert should be treated as medium severity in an enterprise context. The potential impact on critical systems can be high if unauthorized access is gained. The likelihood of malicious abuse is moderate, given that TeamViewer is often leveraged in various remote support scenarios, but its misuse is notable in compromised environments.

  ### Blind Spots and Assumptions

  This rule may miss instances where TeamViewer is invoked using non-standard registry paths or through direct process execution without prior registry modifications. Reliable detections require thorough monitoring of Windows Registry logs and system process activities. Additionally, legitimate usage of TeamViewer across several departments or users may trigger this alert, necessitating clearer identification of authorized use. Related detections include monitoring for suspicious remote connections (e.g., RDP logon events - Event ID 4624) to provide broader context on potential exploitation techniques related to remote tools.

