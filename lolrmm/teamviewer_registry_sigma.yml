title: Potential TeamViewer RMM Tool Registry Activity
id: 6673bb39-482d-4b90-8ab2-a3ad594eb5eb
status: experimental
description: |
  Detects potential registry activity of TeamViewer RMM tool
references:
- https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
tags:
- attack.execution
- attack.t1219
logsource:
  product: windows
  category: registry_event
detection:
  selection:
    TargetObject|contains:
    - HKLM\SOFTWARE\TeamViewer\*
    - HKU\<SID>\SOFTWARE\TeamViewer\*
    - HKLM\SYSTEM\CurrentControlSet\Services\TeamViewer\*
    - HKLM\SOFTWARE\TeamViewer\ConnectionHistory
    - HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TeamViewer\*
    - HKU\SID\SOFTWARE\TeamViewer\MainWindowHandle
    - HKU\SID\SOFTWARE\TeamViewer\DesktopWallpaperSingleImage
    - HKU\SID\SOFTWARE\TeamViewer\DesktopWallpaperSingleImagePath
    - HKU\SID\SOFTWARE\TeamViewer\DesktopWallpaperSingleImagePosition
    - HKU\SID\SOFTWARE\TeamViewer\MinimizeToTray
    - HKU\SID\SOFTWARE\TeamViewer\MultiMedia\AudioUserSelectedCapturingEndpoint
    - HKU\SID\SOFTWARE\TeamViewer\MultiMedia\AudioSendingVolumeV2
    - HKU\SID\SOFTWARE\TeamViewer\MultiMedia\AudioUserSelectedRenderingEndpoint
    - HKLM\SOFTWARE\TeamViewer\ConnectionHistory
    - HKU\SID\SOFTWARE\TeamViewer\ClientWindow_Mode
    - HKU\SID\SOFTWARE\TeamViewer\ClientWindowPositions
  condition: selection
falsepositives:
- Legitimate use of TeamViewer
level: medium
note: |
  ### Technical Context

  This Sigma rule detects registry activity associated with the TeamViewer Remote Management Tool (RMM). The likely attacker objective is to establish persistent remote access through unauthorized installation or manipulation of TeamViewer settings. This behavior fits into the MITRE ATT&CK framework under the tactic of "Execution" and the technique T1219 (Remote Access Software). The primary telemetry sources are Windows registry event logs that capture modifications to keys associated with TeamViewer. If malicious, such activity could lead to unauthorized control of affected systems. This detection does NOT confirm whether TeamViewer usage is legitimate or malicious on its own.

  ### Investigation Steps

  - **Review affected registry keys:** Examine registry changes to the keys listed in the alert. Check for unexpected values or newly created keys under `HKLM\SOFTWARE\TeamViewer\*` or `HKU\<SID>\SOFTWARE\TeamViewer\*` that do not align with organizational baseline settings.

  - **Correlate event IDs for context:** Look for Security Event ID 4688 (Process Creation) logs that correlate with registry activity, specifically processes initiated around the same timestamps that reference TeamViewer components, indicating possible installation or misuse.

  - **Validate legitimate use of TeamViewer:** Identify and review the normal baselines of TeamViewer usage in the organization. Verify with users if the TeamViewer installation is expected, especially if any historic or recent tickets or requests for remote support were logged.

  - **Extract TeamViewer installation artifacts:** Check system logs or files in `C:\Program Files\TeamViewer\` for installation timestamps or altered configuration files. Confirm the presence of files consistent with legitimate installation processes.

  - **Assess user account activity:** Check User Activity Logs (Event ID 4624 - Logon) for associated user behaviors around the alert timeframe to determine if the user typically utilizes remote access software, helping differentiate between malicious and benign actions.

  - **Identify high-confidence malicious indicators:** If registry changes are found without corresponding legitimate activity or user knowledge, flag any newly created or suspicious keys as strong indicators of malicious intent and escalate for further review.

  ### Prioritization

  This alert is of medium severity due to the potential security impact, as TeamViewer could allow remote control of critical systems if used maliciously. The likelihood of its abuse is moderate since Remote Management Tools are common targets for attackers attempting to exploit misconfigurations or gain unauthorized access.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive registry logging or filtering of legitimate TeamViewer use, resulting in potential false positives. Legitimate operations, such as system administration tasks or IT support using TeamViewer, may trigger this alert. Companion detections like process creation events for TeamViewer executables (e.g., `TeamViewer.exe`) provide additional coverage and context for this activity.

