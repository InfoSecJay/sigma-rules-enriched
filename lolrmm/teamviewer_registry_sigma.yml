note: |
  ### Technical Context

  This rule detects modifications in registry keys associated with the TeamViewer remote monitoring and management (RMM) tool. The likely attacker objective could be to establish remote access, control an environment, or exfiltrate data without detection, leveraging TeamViewer as a backdoor. The relevant MITRE ATT&CK tactics include **Command and Control (TA0011)** and the technique **Application Layer Protocol (T1219)**.

  Primary telemetry sources include Windows registry event logs, specifically looking for registry key interactions under `HKLM\SOFTWARE\TeamViewer\` and user-specific keys. If malicious, the security impact includes unauthorized access to systems, potential data breaches, and persistent remote access capabilities. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate usage of TeamViewer in a managed IT environment can trigger similar registry activities.

  ### Investigation Steps

  - **Review registry access events:** Examine Windows Event ID 4657 for changes to TeamViewer-related registry keys such as `HKLM\SOFTWARE\TeamViewer\` to identify unauthorized modifications.

  - **Check process creation logs:** Look at Sysmon Event ID 1 and Windows Event ID 4688 for instances of `TeamViewer.exe` or associated binaries being executed, indicating potential unauthorized application launches.

  - **Identify high-confidence indicators:** Look for patterns of registry key access during unusual hours (e.g., late night or weekends) which may indicate unauthorized access attempts.

  - **Document expected behavior:** Confirm legitimate usage for asset roles, such as IT support teams using TeamViewer during business hours, and ensure that authorized TeamViewer processes align with normal operational hours.

  - **Investigate user context:** Analyze additional user activity for anomalies against typical usage patterns, including reviewing `HKU\SID\SOFTWARE\TeamViewer\` entries to see if multiple user accounts exhibit changes that are not standard for your environment.

  ### Prioritization

  This alert carries medium severity. If a critical system is involved, the impact of any unauthorized registry modifications could facilitate extensive exploitation. The likelihood of malicious use is elevated, especially if there is historical context of abuse involving remote access tools in the organization.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of TeamViewer, which can generate similar registry changes. Required log sources include detailed Windows registry event logging, which must be correctly configured. Additionally, benign activities such as conducted IT support sessions may inadvertently trigger this alert. A companion detection that enhances coverage would involve monitoring network traffic for TeamViewer connections on port 5938 (or relevant ports), indicating active remote sessions.

