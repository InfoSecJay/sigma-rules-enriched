note: |
  ### Technical Context

  This rule detects potential registry activity associated with the HopToDesk remote management tool. An attacker may leverage this tool to establish persistence or gain remote control over a compromised system, with the objective of unauthorized access or lateral movement within the network. The relevant MITRE ATT&CK tactic is **Command and Control** (Tactic ID: TA0011) and the specific technique is **Remote Access Tools** (Technique ID: T1219).

  The primary telemetry sources are Windows registry event logs, particularly focusing on the specified registry keys that indicate the installation and command configurations for the HopToDesk tool. If exploited maliciously, this could lead to significant security impacts such as unauthorized access to sensitive information or complete control over the workstation. However, this detection alone does not confirm malicious intent or activity, as legitimate usage of HopToDesk can occur in corporate environments.

  ### Investigation Steps

  - **Review Registry Access Logs**: Check Windows Event ID 4663 for access to the registry keys: **HKEY_CURRENT_USER\Software\Classes\HopToDesk\shell\open\command** and **HKEY_LOCAL_MACHINE\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\HopToDesk** to determine the timestamp and user initiating the changes.

  - **Identify User Context**: Validate the user context by correlating with Event ID 4672 (Special privileges assigned to new logon) to identify if the changes were made by an account with administrative privileges, which is a higher indicator of potential malicious use.

  - **Analyze Installed Software**: Confirm legitimate installation of HopToDesk under **Control Panel → Programs and Features**. Existence without prior authorization may indicate unauthorized software deployment.

  - **Check Running Processes**: Look for associated processes using Sysmon Event ID 1 to identify if the HopToDesk executable is actively running on the host. Confirm any command-line arguments that could indicate malicious use.

  - **Monitor Network Activity**: Utilize network logs to detect outbound connections to known IP addresses or domains associated with HopToDesk, using tools like firewall logs or IDS/IPS alerts to identify unauthorized C2 communication.

  - **Review Account Activity**: Examine user account activity logs for unusual patterns or failed login attempts that could correlate with the timing of the registry modifications, possibly indicating a compromised account.

  ### Prioritization

  Given the potential for HopToDesk to enable remote control and the sensitivity of systems where it is detected, this alert carries medium severity. The likelihood of malicious abuse increases as remote access tools are common targets for exploitation. Organizations frequently see weaponization attempts involving remote access tools during adversary campaigns.

  ### Blind Spots and Assumptions

  Detection can be limited by legitimate administrative use of the HopToDesk tool, which may result in valid alerts. Ensure comprehensive Windows registry logging is enabled for reliable detection of all registry access events. This alert may be triggered during legitimate remote support sessions that utilize HopToDesk, which could lead to false positives. A related detection to consider is monitoring for other common remote access tools, such as TeamViewer or AnyDesk, to enhance overall monitoring of potential unauthorized remote access activities.

