note: |
  ### Technical Context

  This Sigma rule detects potential registry modifications associated with the HopToDesk remote management tool. Such activity is often indicative of an attacker attempting to establish remote access to compromise a target system or to maintain persistence within an environment. The relevant MITRE ATT&CK technique is T1219 (Remote Access Software).

  The primary telemetry sources for this detection are Windows Registry events, specifically focusing on actions targeting the registry paths associated with HopToDesk's installation and execution commands. If malicious, the consequence could include unauthorized remote control of systems, leading to further data breaches or lateral movement. Importantly, this detection alone does not confirm malicious intent, as legitimate users may utilize HopToDesk for remote support.

  ### Investigation Steps

  - **Identify registry changes:** Query Windows Security Event ID 4657 (Registry Value Changed) for alterations to `HKEY_CURRENT_USER\Software\Classes\HopToDesk\shell\open\command` and `HKEY_LOCAL_MACHINE\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\HopToDesk`. Look for unusual timestamps or changes corresponding to non-admin user activity.

  - **Examine process creation logs:** Review Sysmon Event ID 1 (Process Creation) to verify if the HopToDesk executable is spawned after the registry change. Look for the command line arguments indicating unusual usage patterns or suspicious paths.

  - **Check for historical usage:** Investigate the presence of HopToDesk in the software inventory on the affected asset. Regular, documented use may indicate benign activity, whereas its unrecognized presence could signal possible compromise.

  - **Analyze network connections:** Review network logs (e.g., for proxy or firewall) for outbound connections to known HopToDesk servers or unusual traffic consistent with remote access software usage. Examine URLs, destination IPs, and user-agent strings for abnormalities.

  - **Verify user activity:** Cross-reference access logs to ensure that the user associated with the modification has legitimate reasons for using HopToDesk. Look for multiple logins from different geographical locations, indicating potential abuse.

  ### Prioritization

  This alert should be treated with moderate priority given its potential impact on system security. The likelihood of malicious use is credible, especially in environments where remote access tools are not standard practice, and HopToDesk is rarely seen. Adversaries often weaponize remote access software for persistence and further attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by users employing legitimate usages of HopToDesk or similar RMM tools that are not recorded in security logs. Ensure proper registry logging is configured to capture relevant alterations. Legitimate instances of remote support by IT personnel could also trigger this alert. A related detection to consider is monitoring for lateral movement activities indicative of remote access exploitation, such as unusual remote desktop protocol (RDP) connections.

