note: |
  ### Technical Context

  This Sigma rule detects potential registry modifications related to the installation or configuration of the HopToDesk Remote Management Tool (RMM). The likely attacker objective is to deploy or leverage this tool for remote access and system control, facilitating lateral movement within a network. This behavior aligns with the MITRE ATT&CK technique "Remote System Access" (T1219).

  The primary telemetry sources are Windows registry event logs, specifically targeting modifications to objects under `HKEY_USERS\*_Classes\HopToDesk\*`. If malicious, the use of HopToDesk could enable unauthorized access to systems, potentially leading to data exfiltration or further compromise. However, it is crucial to note that this detection does NOT confirm that a compromise has occurred; it merely indicates the presence of registry activity associated with a potentially unwanted application.

  ### Investigation Steps

  - **Verify registry activity:** Look for registry event logs (Event ID 13) associated with `HKEY_USERS\*_Classes\HopToDesk\*` that indicate changes. Check for timestamps and user accounts associated with these modifications.

  - **Cross-reference installed applications:** Review the list of installed applications on the affected endpoint (Control Panel → Programs and Features or `Get-WmiObject -Class Win32_Product`) to see if HopToDesk is legitimately installed or was introduced without authorization.

  - **Assess user behavior:** Review user activity logs (Event ID 4624 for logon events) to determine whether the account has a valid business reason to install and use HopToDesk, especially if timed around the detected registry activity.

  - **Identify common paths for remote tools:** Investigate other known remote management tools (such as AnyDesk, TeamViewer) using their respective registry paths or folders to understand potential benign usage patterns and legitimate administrative activities.

  - **Look for high-confidence malicious indicators:** If registry modifications coincide with unauthorized external network connections (Firewall logs or Sysmon Event ID 3), this may indicate misuse of HopToDesk for malicious purposes.

  ### Prioritization

  This alert has a medium severity level due to the potential criticality of the affected systems. The likelihood that HopToDesk is exploited for malicious purposes increases if detected alongside unusual network traffic patterns. While the behavior is not commonly weaponized, its presence often suggests either an unauthorized usage scenario or a potential initial access method for further exploitation.

  ### Blind Spots and Assumptions

  Detection can be limited by the absence of full registry logging configuration that captures all relevant modifications. Legitimate remote support scenarios may trigger this alert, especially in organizations that use HopToDesk for authorized purposes. It would be beneficial to correlate findings with other detections; for example, alerting on anomalous outbound connections to unknown IPs could strengthen the coverage against potential abuse of tools like HopToDesk.

