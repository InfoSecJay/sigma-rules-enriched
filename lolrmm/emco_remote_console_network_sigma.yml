note: |
  ### Technical Context

  This rule detects outbound network activity to EMCO Remote Console domains, indicating potential use of remote management tools. Attackers often leverage such tools for remote control, data exfiltration, or lateral movement within a network. The relevant MITRE ATT&CK tactic is Command and Control (T1071) and technique is Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs. If this activity is malicious, it could signify unauthorized access or an insider threat compromising sensitive systems. However, this detection does NOT confirm malicious intent on its own, as legitimate use of EMCO Remote Console may trigger the alert.

  ### Investigation Steps

  - **Assess destination hostnames for legitimacy**: Verify if the network connections are directed to `*.emcosoftware.com`. If legitimate uses are found, document the associated user or system making the connection.

  - **Review process creation logs**: Check for corresponding process creation events (Security Event ID 4688 or Sysmon Event ID 1) around the time of the detected network activity to identify the parent process initiating the connection. Legitimate EMCO activity may have recognizable system processes, such as `emco.exe`.

  - **Evaluate user activity**: Investigate recent user logins or administrative actions from the initiating system to determine if this aligns with expected usage patterns, especially for user accounts assigned to IT personnel.

  - **Check for any unusual activity**: Analyze for high-confidence malicious indicators such as unusually timed or excessive connections from the same IP to EMCO domains, which could indicate automation of malicious activities.

  - **Identify asset criticality**: Determine the role of the machine making the outbound connection (e.g., a server vs. a user workstation). High-value assets should prompt a more urgent investigation.

  ### Prioritization

  This alert has medium severity due to the potential risk of a compromised system being used for remote access. Given the use of legitimate tools for administration, the likelihood of misuse can vary. However, remote management tools are often weaponized by attackers, warranting timely investigation.

  ### Blind Spots and Assumptions

  This detection may miss connections to similar but less common remote management tools if not configured to monitor those domains. Ensure that appropriate logging is enabled for all outbound network connections to capture reliable data. Legitimate business activities by IT staff using EMCO can also generate this alert. Companion detections may include general outbound connections on unusual ports to further substantiate any findings.

