note: |
  ### Technical Context

  This Sigma rule detects outbound network connections associated with the EMCO Remote Console, a remote management tool. The likely attacker objective is to establish a command-and-control (C2) session or manage compromised systems through this tool. Relevant MITRE ATT&CK tactics and techniques include "Command and Control" (TA0011) and "Application Layer Protocol" (T1219). The primary telemetry sources are Windows network connection logs, including Event IDs for outbound connections.

  If malicious, the impact could include unauthorized remote access to systems, data exfiltration, or lateral movement within the infrastructure. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate use of the EMCO Remote Console for remote management may trigger similar alerts.

  ### Investigation Steps

  - **Review network connection logs:** Analyze network connection logs (Windows Event ID 5156 for Windows Filtering Platform) for connections to domains like `user_managed` or `emcosoftware.com`. Look for unusual outbound traffic originating from sensitive systems or servers.

  - **Validate asset roles:** Confirm if the source IP address belongs to a device with an expected role for remote management (e.g., IT support machines). Notebook or server usage of EMCO Remote Console is benign, while unexpected endpoints (like user desktops) may indicate malicious activity.

  - **Identify high-confidence malicious indicators:** Look for repeated connection attempts to the specified domains across multiple endpoints in a short timeframe. This may indicate automated scripts or tools being used for exploitation.

  - **Cross-reference with authorized use cases:** Check internal records of software deployment to verify if EMCO Remote Console is an approved tool within the organization. Documenting team communication regarding its use can help rule out false positives.

  - **Monitor for unusual behavior during sessions:** Investigate sessions initiated by the detected connections for high-risk activities, including file transfers or command executions that do not align with normal operational patterns.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for unauthorized remote management on sensitive systems. The likelihood of malicious abuse is moderate, as this tool is used by both legitimate administrators and adversaries looking to gain control. While not the most common tool for exploitation, its presence could indicate a focused attack.

  ### Blind Spots and Assumptions

  Detection may miss internal rogue use of the EMCO Remote Console if the logs are not fully collected or if necessary Windows Filtering Platform logs are disabled. False positives can arise from legitimate IT activity involving remote management. Additional detection that could enhance coverage includes monitoring for specific command executions related to remote access or investigation of anomalous network behaviors consistent with C2 activity over common application layer protocols.

