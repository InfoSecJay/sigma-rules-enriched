note: |
  ### Technical Context
  This rule detects potential network activity associated with the EMCO Remote Console, a Remote Management and Monitoring (RMM) tool widely used for managing systems remotely. Attackers may exploit this legitimate software to gain unauthorized access to networks or to facilitate lateral movement within an enterprise environment. Given that RMM tools can perform various administrative functions, a compromised RMM could allow attackers to execute malicious actions on managed devices, including running scripts or deploying malware.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002)
  - **Remote Services** (T1219), which outlines how attackers might use remote services to maintain persistence and control over compromised systems.

  Primary data sources for detecting this behavior are network connection logs generated by network devices monitoring outbound and inbound traffic. These logs will show connections to specific hostnames associated with the EMCO Remote Console and help identify unexpected network activity.

  ### Investigation Steps
  - **Review Network Connection Logs:** Analyze logs for any outgoing connections to hostnames ending in "user_managed" or "emcosoftware.com" which might indicate potential misuse of the RMM tool.
  - **Check Related Process Activity:** Investigate process creation logs on the systems that initiated a connection. Look for processes associated with EMCO Remote Console or any unusual processes attempting to interact with the network.
  - **Correlate with User Activity:** Examine user activity logs to see if there are corresponding legitimate administrative activities or any signs of unusual login behavior around the same time as the detected network activity.
  - **Contextualize the Environment:** Determine if the use of the EMCO Remote Console is approved within your enterprise. Understanding typical usage patterns can help differentiate between legitimate and suspicious activity.

  ### Prioritization
  This alert is marked as medium severity due to the potential impact of unauthorized access via RMM tools, which can lead to broader system compromise if an attacker gains control. Given their legitimate use in enterprises, distinguishing between authorized and unauthorized activities is crucial, but the likelihood of exploitation makes it a significant concern.

  ### Blind Spots and Assumptions
  One gap in detection coverage includes legitimate use cases of EMCO Remote Console, which may not be easily distinguished from malicious activity based solely on the destination hostname. The detection logic assumes that any connection to the identified domains from within the enterprise is suspicious, although legitimate administrative actions could also trigger the alert. This rule relies on comprehensive network connection logs; therefore, ensuring these logs are collected and properly configured on network devices is critical for effective detection.

