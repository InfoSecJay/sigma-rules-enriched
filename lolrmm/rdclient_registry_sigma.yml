  ### Technical Context

  This Sigma rule detects registry activity related to the Remote Desktop Client (RdClient), particularly modifications to keys under 'HKLM\SOFTWARE\RdClient'. Such behavior often indicates an adversary's attempt to establish or maintain persistence or remote access capabilities on a compromised system. The likely attacker objective is to facilitate command and control (C2) operations or manipulate remote access settings for exploitation. This corresponds to MITRE ATT&CK Tactic: Persistence, Technique: Remote Service: RDP (T1219).

  The primary telemetry source for this detection is Windows Registry Event logs, specifically looking for changes to the specified registry path. If such behavior is confirmed as malicious, the impact could include unauthorized access to systems and potential lateral movement within the network. However, this detection does NOT confirm that the activity is malicious on its own, as legitimate usage of the RdClient application may trigger similar alerts.

  ### Investigation Steps

  - **Examine registry event details:** Review registry event logs for Event ID 4557 related to changes in 'HKLM\SOFTWARE\RdClient'. Look for timestamps and user accounts associated with the changes to identify anomalous activity.

  - **Check for known tool artifacts:** Correlate alerts with known attributes of the RdClient tool, such as its hash values or file names found in endpoint detection solutions. Known hashes associated with malicious RdClient versions should be tagged as high-confidence indicators.

  - **Identify legitimate usage patterns:** Search for legitimate processes creating or modifying registry keys under 'HKLM\SOFTWARE\RdClient'. Expected behavior often includes specific user-related processes on authorized systems during business hours.

  - **Analyze user behavior:** Review user account activity during the time of the alert. Investigate the context around the user account making these changes (Event ID 4624) to check for signs of account compromise or unusual administrator access.

  - **Assess potential C2 indicators:** Look for outgoing network connections to unusual external IPs or domains (via firewall or proxy logs) that could indicate C2 communication coinciding with the registry changes.

  ### Prioritization

  The severity of this alert is moderate due to the critical role of remote access tools in potential breaches. Compromised systems can serve as launchpads for further attacks, and behaviors associated with RdClient are often re-used by threat actors. While some benign uses exist, its association with ongoing malicious activity increases the necessity for thorough investigation.

  ### Blind Spots and Assumptions

  There are potential limitations in detection regarding legitimate uses of RdClient that may cause false positives. Reliably capturing registry modifications requires appropriate logging configurations in place. Standard administrative tasks or legitimate remote support activities may trigger the alert, which could lead to confusion. Companion detections such as monitoring for unusual logon events (Event ID 4624) or network anomalies may strengthen coverage and contextual understanding of the alert.

