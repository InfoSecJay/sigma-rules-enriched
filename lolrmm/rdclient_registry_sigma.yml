note: |
  ### Technical Context

  This Sigma rule detects registry activity associated with the RdClient remote management tool, specifically targeting registry modifications under `HKLM\SOFTWARE\RdClient`. The likely attacker objective is to establish remote access or control over a Windows host for further exploitation or reconnaissance. This behavior aligns with the MITRE ATT&CK tactic of **Execution** and technique **T1219: Remote Access Software**. The primary telemetry source for this detection is Windows Registry events, particularly focusing on changes to the specified registry path. If malicious, it could indicate unauthorized remote access or persistence mechanisms being established by an attacker. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of the RdClient tool can trigger the same registry modifications.

  ### Investigation Steps

  - **Check registry modification history:** Review Windows Registry Event logs (Event ID 4657) for changes to `HKLM\SOFTWARE\RdClient` within the last hour. Look for unexpected or abnormal timestamps that deviate from normal administrative behavior.

  - **Identify user initiating changes:** Cross-reference the registry change with Security Event IDs 4624 (logon events) to determine if the modifying user account has a legitimate role. Ensure that the user account is not tied to a known administrator or system service.

  - **Verify legitimate usage scenarios:** Investigate typical usage patterns for the RdClient tool within your environment. Document and compare if scheduled administrative tasks or remote support sessions match the detected registry activities.

  - **Review associated process creation:** Analyze Sysmon Event ID 1 for processes spawned by any registered instances of RdClient. Look for authoritative or unusual process command lines that indicate non-standard usage.

  - **Correlate with network activity:** Examine firewall or proxy logs for outbound connections related to RdClient (e.g., connections over TCP port 3389 for RDP). Check for unusual external IP addresses which may indicate potential data exfiltration or command and control.

  - **Investigate asset criticality:** If the affected system hosts sensitive data or critical applications, escalate to a Tier 2 or 3 analyst immediately for deeper forensic analysis. High-value assets are prime targets for remote management abuse.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems that handle sensitive data or services. The likelihood of malicious abuse is moderate, given that remote access tools are frequently weaponized by adversaries. However, the detection may also trigger due to legitimate administrative activities.

  ### Blind Spots and Assumptions

  Detection is limited by legitimate administrative use of RdClient, which could generate false positives. Ensure proper logging configurations for accurate Windows Registry event collection. Other remote access tools such as TeamViewer or AnyDesk may also be used, which may not be covered by this detection. Companions include monitoring processes related to remote access software, such as Windows Event ID 4648 (a logon attempt using explicit credentials) for comprehensive coverage.

