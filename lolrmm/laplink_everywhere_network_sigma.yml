note: |
  ### Technical Context

  This rule detects outbound network connections to known Laplink Everywhere RMM tool domains, indicating potential remote management tool usage. An attacker may utilize these tools to maintain persistent access and conduct remote interactions on compromised systems, aiming to gather sensitive data or manipulate system operations. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), and the specific technique is **Application Layer Protocol** (T1219).

  The primary telemetry sources for this rule are Windows network connection logs. Key log types include traditional Windows Firewall logs or security event logs, specifically focusing on fields such as `DestinationHostname` and `DestinationPort`. If the detected activity is malicious, it could lead to unauthorized access, data exfiltration, or lateral movement within the network. Importantly, this detection does not confirm that malicious activity is occurring — it merely indicates a connection to suspicious domains.

  ### Investigation Steps

  - **Review network connection events:** Examine Security Event ID 5156 or Windows Firewall logs for outbound connections to domains like `*.everywhere.laplink.com` or any specified subdomains. Validate if the connection is legitimate or indicative of misuse.

  - **Analyze active processes:** Utilize Sysmon Event ID 1 to identify processes initiating connections to the listed domains. Focus on any unexpected or non-standard application behavior, especially from processes typically associated with internal tools.

  - **Cross-reference asset role:** Determine the host's role and criticality. If the asset is a server or workstation with sensitive applications, prioritize the investigation. Confirm typical application usage patterns for that host.

  - **Identify legitimate use cases:** Check with the relevant team or asset owner if the use of Laplink Everywhere is authorized. If users are expected to access these domains, compare network logs against standard user activity patterns.

  - **Alert on suspicious patterns:** Look for repeated connection attempts or multiple connections from different hosts to these domains in a short time frame. Such patterns may indicate an automated bot or script being used maliciously.

  - **Check for associated artifacts:** In cases of malicious activity, look for file transfers or modifications correlated with the connections. Inspect for any creations or changes of files indicating remote manipulation, possibly using file integrity monitoring solutions.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive systems if Laplink Everywhere is exploited maliciously. The likelihood of abuse is moderate, particularly if adversaries seek to use such tools for remote access. The use of RMM tools is weaponized against poorly defended organizations, highlighting the need for timely investigations.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate use of Laplink Everywhere may trigger the alert, confusing potential false positives. The reliability of detection hinges on comprehensive logging of outbound network requests, which must include all relevant domains. Be aware that authorized IT support activities could generate similar alerts. A companion detection to enhance coverage could involve monitoring for logins to machines using known remote desktop protocols tied to the same domains.

