note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the MeshCentral Remote Monitoring and Management (RMM) tool. An adversary may use this tool for remote access or management of compromised systems, potentially enabling them to control devices within the enterprise. The relevant MITRE ATT&CK tactics and techniques include *Command and Control* (TA0011) and *Application Layer Protocol* (T1219).

  Primary telemetry sources include Windows network connection logs that capture outgoing connections and DNS queries. If this activity is malicious, it may facilitate unauthorized access, data exfiltration, or lateral movement within the network. However, this detection does not confirm that the activity is malicious on its own, as it may also be generated by legitimate administration and management uses of MeshCentral.

  ### Investigation Steps

  - **Identify the network connections:** Review the Windows network connection logs (Event ID 5156) for connections to `*.meshcentral.com` or `user_managed` endpoints. Correlate these with other activities on the host to see if additional suspicious behavior is present.

  - **Check process execution:** Examine Event ID 4688 (Process Creation) and ensure there are no unauthorized processes spawning that reference MeshCentral. Look for unusual parent-child process relationships indicating potential misuse.

  - **Validate legitimate activity:** Cross-reference the user accounts initiating connections to MeshCentral with known IT personnel. Check if there are scheduled maintenance activities or legitimate RMM sessions in progress that might explain the traffic.

  - **Collect DNS query logs:** Investigate DNS logs at the DNS server or on the endpoint for lookups for `meshcentral.com`. Required fields include `Query Name`, `Response Code`, and any associated timestamps to monitor access patterns.

  - **Assess the asset criticality:** Determine if the affected system is a critical asset or has access to sensitive data. The impact of a compromised machine here can significantly affect operations, increasing the urgency of the investigation.

  - **Identify malicious indicators:** If there is a correlation to administrative actions being denied or unusual outbound connections to IPs associated with previously known malicious activities, escalate the alert to a higher priority.

  ### Prioritization

  This alert carries medium severity due to the potential for unauthorized remote access within the enterprise. The likelihood of malicious use is moderate, given that the MeshCentral tool is legitimate but known to be co-opted for nefarious purposes. Historical usage patterns indicate that this behavior could be weaponized during targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative use of MeshCentral, which could trigger this alert. Monitoring mechanisms must ensure that the specific logging configuration for network connections is enabled to capture relevant events reliably. Legitimate remote support activities may frequently generate similar traffic, and companion detections could include abnormal user behavior analytics surrounding the device involved in the connections.

