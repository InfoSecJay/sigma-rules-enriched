note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the MeshCentral Remote Management Tool (RMM). The potential attacker objective is to establish a command-and-control (C2) channel using legitimate remote management tools, which could facilitate unauthorized access and command execution on compromised machines. The relevant MITRE ATT&CK tactics and techniques are Command and Control (T1071) and Remote Access Tools (T1219). The primary telemetry sources include Windows networking logs that capture network connection events, and specifically, event types related to outbound connections to the MeshCentral hostname pattern.

  If malicious, this behavior indicates an active compromise where an attacker is leveraging MeshCentral for remote access, potentially leading to data exfiltration or lateral movement within the network. However, it is critical to note that this detection alone does not confirm malicious intent, as legitimate use of MeshCentral by authorized personnel can produce similar network activity.

  ### Investigation Steps

  - **Review outbound connection logs**: Investigate network connections for repeated outbound attempts to *.meshcentral.com using Windows Security Event ID 5156 (Windows Filtering Platform). Note the remote IP and whether it matches known MeshCentral infrastructure.

  - **Check for authorized MeshCentral instances**: Confirm whether any network devices or endpoints truly utilize MeshCentral by reviewing operational documentation or policy files to identify expected applications and their authorized use contexts.

  - **Analyze user accounts associated with the connections**: Look into the account details initiating the connections by cross-referencing Security Event ID 4624 (Logon) with IP addresses noted in connection logs. Identify if any account shows abnormal logon patterns or if the originating user is not typically associated with remote management tasks.

  - **Correlate with process execution logs**: Validate the presence of network activity with process creation logs, such as Sysmon Event ID 1 or Windows Event ID 4688, to see if MeshCentral-related executables were launched around the same timeframe. Confirm legitimate processes versus potential indicators of compromise.

  - **Identify recurring patterns**: Note any persistence indicators by analyzing connection attempts across multiple days or from different hosts. Legitimate use is usually sporadic and well-documented, while malicious activity may show consistent patterns with high frequency.

  ### Prioritization

  This alert has a medium severity due to the potential risk of unauthorized remote access and control over critical systems. The likelihood of malicious abuse is high, particularly in environments where RMM tools are either misconfigured or poorly monitored. Additionally, misuse of legitimate tools like MeshCentral is an increasingly weaponized tactic among adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate administrative users may trigger this alert when utilizing MeshCentral for routine tasks. Required log sources include both outbound connection logs and process execution logs to ensure comprehensive detection. Absent configurations or lack of visibility into legitimate RMM usage can lead to false positives. A related detection rule for unauthorized RMM software may help strengthen overall coverage.

