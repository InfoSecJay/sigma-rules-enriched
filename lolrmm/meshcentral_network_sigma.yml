note: |
  ### Technical Context

  This rule detects network activity linked to the MeshCentral Remote Management and Monitoring (RMM) tool. Attackers may leverage MeshCentral for remote access into target systems, often for conducting reconnaissance, lateral movement, or data exfiltration. Relevant MITRE ATT&CK tactics include Execution and the technique Remote Services (T1219). Primary telemetry sources required for analysis include network connection logs, specifically looking for endpoints making connections to hostnames that end with "user_managed" or "meshcentral.com". If this detection is confirmed malicious, it could indicate unauthorized access and control of a system. Importantly, this detection does NOT provide confirmation of malicious activity on its own, as legitimate use cases of MeshCentral exist.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) to identify outbound connections to "user_managed" or "meshcentral.com". Note any connections during non-business hours or from unusual endpoints for potential indicators of compromise.

  - **Verify host role:** Determine if the affected asset is designated for administrative tasks or should not have RMM tools. Administrative assets may legitimately use MeshCentral, unlike typical user workstations.

  - **Assess process creation logs:** Examine Security Event ID 4688 and Sysmon Event ID 1 to confirm processes spawned associated with the detected connections, such as the MeshCentral agent executable. Malicious indicators include unexpected process names or arguments.

  - **Review DNS query logs:** Look for recent DNS queries for "meshcentral.com". Frequent or anomalous queries could suggest malicious use; typical benign behavior might show occasional lookups from known asset IPs.

  - **Check for installed software:** Run a software inventory check for any installed MeshCentral components on affected hosts. It is essential to note if legitimate software matches the detected activity.

  ### Prioritization

  This alert carries medium severity due to the potential for significant impact if a compromised system enables unauthorized access or lateral movement within the network. The likelihood of exploitation is moderate, especially within environments where RMM tools like MeshCentral may be misused or where they’re commonly found in use.

  ### Blind Spots and Assumptions

  Detection may be limited if legitimate instances of MeshCentral are actively used within the organization, potentially leading to false positives. Reliable detection requires comprehensive logging of network connections and DNS queries for accurate context. Legitimate user support scenarios may trigger these alerts if MeshCentral is employed for remote assistance. Complementary detections could include monitoring for known command and control (C2) traffic as part of behavioral analysis.

