note: |
  ### Technical Context

  This rule detects network activity involving connections to Fortra RMM (Remote Monitoring and Management) tool domains. The likely objective of an attacker using this tool would be to gain remote control of compromised systems for persistence, data exfiltration, or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique for Application Layer Protocol (T1219).

  The primary telemetry source is Windows network connection logs, specifically monitoring outbound connections to domains ending in "*.fortra.com". If this detection is triggered by an unauthorized access attempt, it could indicate a significant security impact, such as unauthorized control or data theft. However, this detection alone does not confirm malicious intent, as legitimate activities involving the Fortra RMM tool may yield similar logs.

  ### Investigation Steps

  - **Verify connection logs for suspicious activity:** Check the Windows Firewall log (Event ID 5156) or Sysmon logs (Event ID 3) for outbound connections to any of the listed Fortra domains. Look for unusual destination IPs or high volumes of connections from unexpected internal systems.

  - **Assess application context:** Review the list of applications and services running on connecting systems. For expected behavior, legitimate monitoring software or IT management consoles might be initiating these connections; analyze the process IDs and parent process details using Sysmon Event ID 1.

  - **Identify malicious indicators:** Look for connections from user accounts not typically associated with system management or IT roles. Cross-reference against secure configuration baselines to detect non-compliant user behaviors initiating connections to the specified domains.

  - **Investigate potential data exfiltration:** Monitor data transfer logs and inspect large outbound data volumes associated with connections to the Fortra domains. Check for abnormal file transfers or process activity coinciding with the detected network connections (e.g., using Event ID 4663 for object access).

  - **Evaluate asset criticality:** Identify if the system triggering the alert is a critical server or workstation. Connections from high-value or sensitive asset types (like domain controllers or cloud management interfaces) should escalate the investigation’s urgency.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems when using RMM tools. While the likelihood of malicious abuse exists, especially if unapproved tools are used, this behavior can also represent benign IT management activities. Weapons utilizing Fortra tools have been seen; thus, careful investigation is warranted.

  ### Blind Spots and Assumptions

  Detection is limited as attackers may use DNS tunneling or other encrypted methods to bypass network monitoring tools. It requires reliable logging configurations for Windows Firewall or Sysmon to effectively capture the relevant logs. Legitimate IT staff using Fortra for troubleshooting could trigger this alert, complicating investigations. A related detection to strengthen coverage would be monitoring for process execution (Event ID 4688) associated with Fortra binaries, which may provide further context around the alert.

