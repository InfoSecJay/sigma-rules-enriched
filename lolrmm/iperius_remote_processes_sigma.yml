note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Iperius Remote Management and Monitoring (RMM) tool, specifically processes named "iperius.exe" or "iperiusremote.exe". The typical objective of an attacker using this tool would be to gain remote access and control over systems to facilitate further malicious activities such as data exfiltration or lateral movement. This aligns with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry sources for this detection are Windows process creation logs. Specifically, Security Event ID 4688 (Process Creation) and Sysmon Event ID 1 may provide the necessary information regarding process execution and parent-child relationships. If malicious, this behavior poses a significant risk, as it indicates potential unauthorized remote access to critical systems. However, it is crucial to note that this detection does not confirm malicious intent on its own, as legitimate usage of the Iperius Remote tool is common in many organizations.

  ### Investigation Steps

  - **Check Process Creation Events:** Review Security Event ID 4688 and Sysmon Event ID 1 for process creation details. Look for entries where the process name ends with "iperius.exe" or "iperiusremote.exe" along with their parent processes.

  - **Verify Parent Process Correlation:** Investigate the parent process of any flagged instances of "iperius.exe" or "iperiusremote.exe." If the parent process is also Iperius-related, it may indicate legitimate use; however, consider the surrounding context (e.g., administrative or unauthorized access).

  - **Review Authentication Logs:** Analyze Windows Security Event IDs 4624 (Logon) and 4625 (Logon Failure) to determine if there were any unusual sign-on attempts preceding the remote tool execution, indicating possible credential theft or misuse.

  - **Examine File Creation Events:** Check for any file creation events related to suspicious activity, particularly in folders commonly accessed by the remote tool. Use Sysmon Event ID 11 to identify newly created files that might involve uploads or downloads.

  - **Identify Legitimate Usage Patterns:** Understand normal usage of Iperius Remote in your environment by profiling typical process execution patterns by trusted users or admins. Evaluate if flagged activities align with known maintenance or IT support tasks.

  - **Correlation with Network Traffic:** Search for any outbound connection attempts related to Iperius on port 443 or 3389, which may indicate communication with a remote server. Network logs should provide relevant context for possible Command and Control (C2) activity.

  ### Prioritization

  This alert is considered medium severity, given that it can indicate potential unauthorized access to systems that are typically critical for business operations. While the likelihood of malicious abuse exists, especially in environments where remote access is tightly controlled, Iperius Remote usage is often legitimate, necessitating careful investigation.

  ### Blind Spots and Assumptions

  Detection can be circumvented if the attacker disguises the Iperius processes or uses custom filenames. Reliable detection requires that Sysmon be configured to log process creation and that Security Event Auditing is enabled. Legitimate usage, especially by IT staff or remote support teams, may frequently trigger this alert. A companion detection to enhance coverage would be monitoring for outbound connections from devices running Iperius to known C2 addresses or malicious IPs.

