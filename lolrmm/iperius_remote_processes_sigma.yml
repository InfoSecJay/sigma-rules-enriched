note: |
  ### Technical Context
  This detection rule is designed to identify potential unauthorized or malicious activity associated with the Iperius Remote RMM (Remote Monitoring and Management) tool. Iperius Remote is a legitimate software used for remote access and management of systems, but its capabilities could also be exploited by malicious actors to control systems in a compromised environment. Detecting processes related to this tool is critical in scenarios where an attacker may be using it to maintain persistence, exfiltrate data, or execute commands within the target network.

  The threat scenario revolves around an attacker gaining access to a system and leveraging the Iperius Remote tool to facilitate remote monitoring or management tasks without proper authorization. The attacker’s objective is likely to establish a foothold within the network, maintain remote access, and potentially move laterally to other systems. This behavior falls under MITRE ATT&CK techniques such as "Execution" (TA0002) and "Remote Services" (T1219), where an attacker exploits remote communication tools for malicious purposes.

  The primary data sources for effective detection of such activity include Windows process creation logs that can provide insights into which processes are being initiated and from which parent processes they spawn. Monitoring these logs will help identify unauthorized execution of Iperius Remote binaries, indicating potential misuse.

  ### Investigation Steps
  - **Review Process Creation Events:** Investigate recent processes originating from Iperius Remote executables (`iperius.exe`, `iperiusremote.exe`). Check the `ParentImage` to determine if they were invoked by legitimate users or systems.
  - **Analyze Parent-Child Relationships:** Focus on the parent processes to understand the context of the execution. Look for any anomalies or unexpected behavior in the chain of processes leading to the execution of the Iperius Remote tool.
  - **Check User Activity Logs:** Correlate the timing of process creation with user login activity. Identify whether the user who executed the Iperius Remote tool had appropriate permissions and if their login patterns align with normal business operations.
  - **Investigate Network Activity:** Conduct a review of outbound network traffic that may indicate remote connections initiated by the Iperius Remote tool. Look for unusual connections to external IP addresses during or immediately following the execution of these processes.

  ### Prioritization
  This alert is considered medium priority due to the potential risk associated with unauthorized remote access and command execution capabilities provided by the Iperius Remote tool. The likelihood of legitimate usage must be weighed against the possible exploitation by attackers aiming to control systems within the enterprise network.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection rule is the legitimate use of the Iperius Remote tool in the environment, which may lead to false positives if not appropriately contextualized. The detection logic assumes that any execution of the Iperius processes is suspicious without correlating with normal user behavior or operational patterns. Effective logging and configurations of process creation events must be validated and enabled across all endpoint systems to ensure comprehensive detection coverage.

