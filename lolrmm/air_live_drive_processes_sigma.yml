  ---

  ### Technical Context

  This rule detects the execution of the Air Live Drive Remote Management Tool (RMM) process from a parent process named `AirLiveDrive.exe`. The likely attacker objective is to remotely manage or exfiltrate data from compromised hosts by leveraging this tool, which is often used in administrative or malicious contexts. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and technique of User Execution (T1219).

  Primary telemetry comes from Windows process creation logs, specifically tracking Security Event ID 4688 or Sysmon Event ID 1, which detail process execution events. If malicious, the use of this tool can lead to unauthorized access to sensitive data and manipulation of the system's resources. However, this detection does NOT confirm malicious intent on its own, as Air Live Drive may be used legitimately by authorized personnel.

  ---

  ### Investigation Steps

  - **Check process parentage:** Review Windows Security Event ID 4688 for the parent process of `AirLiveDrive.exe`. Ensure it originates from a legitimate administrative tool or user context.

  - **Verify user access:** Look up the user account associated with the process execution. If the user is unauthorized or lacks administrative privileges, this raises suspicion of malicious activity.

  - **Analyze process command line:** Examine the command line arguments used during the execution of `AirLiveDrive.exe`. Legitimate usage typically contains configuration flags relevant to its operation; anomalies or unusual parameter combinations may indicate malicious use.

  - **Assess recent network activity:** Review outbound connections made by `AirLiveDrive.exe`, focusing on the domains or IPs accessed. Legitimate activity generally targets known administrative dashboards or services, whereas connections to unknown locations may indicate data exfiltration.

  - **Identify known malicious instances:** Check against threat intelligence feeds for any known malicious hashes or signatures associated with `AirLiveDrive.exe`. If the hash does not match known clean versions but is flagged, it indicates a high-confidence potential compromise.

  ---

  ### Prioritization

  This alert should be considered medium-severity due to the potential for sensitive data exposure and system manipulation. The likelihood of malicious abuse is moderate, as RMM tools can be weaponized by adversaries, but they are also legitimate administrative tools, necessitating further validation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Air Live Drive RMM in the environment, which can generate false positives. Ensuring comprehensive monitoring requires availability of real-time process creation logs with proper SIEM configurations. Additionally, administrative users may trigger this alert during routine tasks, providing a context where operations could be benign. A related detection worth considering is the monitoring of unusual outbound connections to enhance incident response capabilities.

