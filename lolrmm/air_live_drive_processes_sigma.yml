  ---

  ### Technical Context

  This Sigma rule detects the execution of processes spawned from the Air Live Drive application, specifically when processes are created with `AirLiveDrive.exe` as the parent image. Attackers may leverage RMM tools like Air Live Drive for remote management, which allows file manipulation and potentially unauthorized data exfiltration. This behavior falls under the MITRE ATT&CK framework's Execution tactic, specifically technique T1219 (Remote Access Software). The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1. If malicious, this could lead to unauthorized access or manipulation of sensitive files. Importantly, this detection does NOT confirm malicious intent on its own; legitimate uses of Air Live Drive are common and should be considered.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 and Sysmon Event ID 1. Look for processes spawned by `AirLiveDrive.exe` to identify suspicious patterns.

  - **Validate the context of execution:** Determine if the process was initiated by a trusted administrative account or if it was initiated unexpectedly or by a non-privileged user. Check the Subject User Name and Account Domain fields in the logs.

  - **Assess parent-child relationships:** Use Sysmon Event ID 1 to trace the process tree and confirm if other malicious processes parented by `AirLiveDrive.exe` exist. Identify if known malicious hashes are associated with siblings.

  - **Identify typical usage patterns:** Establish baseline behavior for Air Live Drive in your environment. Confirm whether its execution aligns with legitimate operational activities such as scheduled backups or configuration changes.

  - **Check for file manipulation:** Investigate any recent file creation, deletion, or modification events associated with Air Live Drive by reviewing Windows Event ID 4663. Look for signs of data exfiltration.

  - **Investigate network activity:** Use network logs to identify if Air Live Drive has communicated with unusual external hosts or IPs, which could indicate an active exfiltration attempt. Review DNS logs and egress traffic.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of unauthorized access to sensitive data managed by RMM tools. Given that remote management tools are often targeted in network breaches, there is a significant likelihood of adversary abuse. The use of Air Live Drive by malicious actors is a known vector, underscoring the need for heightened scrutiny.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded by disabling logging or manipulating the Air Live Drive executable. Reliable detection requires proper logging configuration for both Sysmon and Windows Event logs. Legitimate administrative activities using Air Live Drive could generate similar alerts. A relevant companion detection might involve monitoring for unusual outbound connections associated with remote access software, which helps to strengthen coverage against potential exfiltration or lateral movement attempts.

