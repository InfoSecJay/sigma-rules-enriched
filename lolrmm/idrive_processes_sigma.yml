note: |
  ### Technical Context

  This rule detects the execution of iDrive RMM tool processes, specifically targeting parental and child processes associated with iDrive installations (IDriveWinSetup.exe, IDriveEClassic.exe, id_tray.exe). The likely attacker objective involves establishing remote access to a system, potentially to conduct unauthorized actions such as data exfiltration or network compromise. This behavior aligns with the MITRE ATT&CK technique for Remote Access Software (T1219). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity may enable adversaries to maintain persistence or facilitate lateral movement within the network. Importantly, this detection does NOT confirm malicious intent on its own, as iDrive can be legitimately used for remote management.

  ### Investigation Steps

  - **Assess parent and child process relationships:** Review process creation logs for Security Event ID 4688 and Sysmon Event ID 1. Look for instances where the parent process is one of the following: `IDriveWinSetup.exe`, `IDriveEClassic.exe`, or `id_tray.exe`. Legitimate activity may show these processes spawned by a known user account, while anomalies could reflect unauthorized usage.

  - **Verify execution source:** Check the file paths of processes in the related logs (e.g., `Image` field in Sysmon logs) for legitimate installations of iDrive (e.g., `C:\Program Files\IDrive`). Any instances running from unexpected directories (e.g., temporary folders) are high-confidence indicators of potential misuse.

  - **Correlate with user account activity:** Examine user login logs (Event ID 4624) to determine if the account associated with the process execution has a valid purpose and history. A suspicious account or an external account, particularly if logging in from uncommon locations, may indicate malicious activity.

  - **Monitor network outbound connections:** Review firewall logs or network connection logs for any abnormal outbound connections initiated by detected iDrive processes. Look for unusual destinations or ports that do not align with normal iDrive usage patterns.

  - **Identify legitimate expected behavior:** Note that regular enterprise activity may include scheduled tasks or support services that involve IDrive processes, typically initiated during maintenance windows or IT support interactions.

  ### Prioritization

  This alert is of medium severity due to the potential impact on sensitive systems if the iDrive tool is misused. The likelihood of malicious abuse exists, as iDrive can be weaponized for remote access by unauthorized users, yet it is also commonly utilized for legitimate enterprise management tasks.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques such as legitimate use of the tool in a compromised environment or the use of fileless execution methods. Required log sources primarily include process creation events; absence of Sysmon or insufficient logging may hinder reliable detection. Legitimate processes that could trigger this alert include authorized IT support sessions. Companion detections might include monitoring for abnormal logon activity or unusual network traffic patterns that could provide further context for these alerts.

