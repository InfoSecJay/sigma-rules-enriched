note: |
  ### Technical Context

  This rule detects outbound network connections to the LocalXpose service, which is often used to expose local servers to the internet remotely. The potential attacker objective is to create a reverse shell or to facilitate exfiltration of data from compromised systems, leveraging the LocalXpose Remote Management and Monitoring (RMM) tool. This activity fits within the MITRE ATT&CK framework under the "Execution" tactic (ID: T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically tracking connections targeting domain names associated with LocalXpose (e.g., `localxpose.io`). If malicious, this behavior could indicate unauthorized access and potential data leakage or system compromise. However, it's important to note that this detection alone does not confirm that malicious activity has occurred; legitimate usage of the LocalXpose service can trigger this alert.

  ### Investigation Steps

  - **Check network connections: ** Review Security Event Logs (Event ID 5156) for outbound connections to `*.localxpose.io`. Look for unusual source IPs or processes initiating these connections.

  - **Cross-reference process activities: ** Use Sysmon Event ID 1 to check what processes initiated these connections. Ensure that no suspicious or unknown executables are associated with these outbound connections.

  - **Validate legitimate usage: ** Confirm if LocalXpose has been authorized for use within the organization. Review user access logs to verify if the employees listed as using LocalXpose are within expected roles and functions.

  - **Identify known malicious indicators: ** Look for known malicious user-agents or URLs (202/205) in conjunction with the outbound connections. Cross-reference with threat intelligence feeds to identify any flagged indicators associated with LocalXpose from your sourcing.

  - **Monitor data exfiltration attempts: ** Analyze logs for any unusual data transfer sizes or patterns using tools like Windows Event ID 4663, focusing on large outbound transfers concurrent with the detected LocalXpose activity.

  ### Prioritization

  This alert is of medium severity, as the affected systems are likely critical if involved in remote access activities. The probability of malicious abuse is moderate since LocalXpose can be weaponized for data exfiltration or command-and-control communication. Though this behavior is not widely weaponized, its existence suggests potential compromise.

  ### Blind Spots and Assumptions

  There are detection limitations due to the potential for legitimate business use of LocalXpose, which can lead to false positives. Required log sources include both network connection logs and Sysmon logs for comprehensive visibility. Legitimate activities that could trigger this alert include authorized remote management tasks for development or IT purposes. Companion detections could include monitoring for known remote access tools (RATs) to strengthen coverage against unauthorized remote access attempts.

