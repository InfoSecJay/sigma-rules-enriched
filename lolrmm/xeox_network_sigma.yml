note: |
  ### Technical Context

  This Sigma rule detects network connections to the Xeox RMM (Remote Monitoring and Management) tool, specifically any connections directed to domains ending with `.xeox.com`. Xeox RMM is often used by attackers for remote access, management, and potential manipulations of compromised systems. The primary MITRE ATT&CK tactic applicable here is Command and Control (T1071.001) and the technique is Application Layer Protocol (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically monitoring for outbound connections to specified Xeox domains (including `xeox.com`). If these connections are associated with malicious activity, they could indicate compromised systems being controlled or exploited. However, this detection alone does not prove malicious intent, as legitimate remote administration or monitoring might also result in similar connections.

  ### Investigation Steps

  - **Identify network logs for connections to Xeox domains:** Review Windows Firewall logs for outbound connections (Event ID 5156) where `DestinationHostname` matches `*.xeox.com` or `xeox.com`. Pay attention to timestamps and the process making the connection.

  - **Verify the originating process:** Check Security Event ID 4688 to identify the process initiator for these connections. Look for legitimate system processes (e.g., `svchost.exe`) versus unfamiliar or suspicious executables that may indicate compromise.

  - **Investigate historic activity:** Query Windows Event Logs for any prior connections to Xeox domains over a defined period (use Event ID 5156) and assess whether these occurrences align with legitimate business operations or unusual patterns indicative of malicious activity.

  - **Assess asset role and context:** Determine if the source system is a server or endpoint used for administrative tasks. Systems that should not have RMM tools installed (e.g., point of sale or client workstations) warrant higher scrutiny.

  - **Look for known malicious indicators:** Identify any associated file artifacts on the system, such as executable files for Xeox RMM, which could indicate prior installation. Check for files in common locations (`C:\Program Files\`, user profile directories) related to Xeox.

  - **Perform a threat intelligence cross-check:** Validate the IP addresses or domains involved against threat intelligence feeds to check if any are known to be malicious or associated with past compromises.

  ### Prioritization

  The alert exhibits medium severity due to the potential impact it poses, especially if the network activity originates from critical systems such as administrative servers. The likelihood of malicious abuse is moderate, as RMM tools are frequently weaponized by attackers for lateral movements or data exfiltration. This behavior is not common in most enterprise environments without appropriate controls or documented use.

  ### Blind Spots and Assumptions

  The primary detection limitation relates to the potential for evasion, such as attackers using obfuscation techniques (e.g., VPNs) to hide their C2 activity. Reliable detection requires that network logs are properly configured and retained for sufficient time. Additionally, legitimate IT administration using Xeox may generate alerts and should be accounted for during triage. A companion detection to strengthen coverage would be monitoring for unusual process creations triggering outbound connections to unrecognized domains (e.g., using Sysmon Event ID 1).

