note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the Xeox RMM (Remote Monitoring and Management) tool, specifically to any subdomain or the primary domain (xeox.com). Attackers may leverage RMM tools like Xeox for remote access, system administration, or exploitation of compromised systems. The relevant MITRE ATT&CK tactic is **Execution**, and the technique is **User Execution (T1219)**.

  The primary telemetry source is Windows network connection logs that capture DNS queries or network flows to the specified domain. If detected activity is malicious, it could indicate an attacker is gaining unauthorized remote access to an organization's systems. Importantly, this detection alone does NOT confirm malicious intent, as Xi'ox RMM can be legitimately used by IT personnel.

  ### Investigation Steps

  - **Identify network connections to suspicious domains:** Query Windows network logs (Event ID 5156) for connections to 'xeox.com' or '*.xeox.com'. Review timestamps and associated processes to establish context.

  - **Check process creation associated with detected connections:** Verify if any processes related to the detected network connections have been created (e.g., Event ID 4688 or Sysmon Event ID 1). Look for administrative tools commonly used for legitimate system management.

  - **Assess user roles and asset criticality:** Determine if the traffic originates from a critical asset or a high-privilege user account, which may escalate the severity of the alert.

  - **Validate legitimate Xeox usage:** Cross-reference detected connections with known schedules or records of IT teams using Xeox for support or monitoring tasks. Legitimate use may show patterns of activity during work hours without anomalous behavior.

  - **Correlate with additional telemetry:** Look for related alerts or logs (e.g., detailed traffic analysis with packet captures) that can confirm remote management activity, session initiation, or file transfers indicative of RMM usage.

  - **Identify behavioral anomalies:** Look for unusual outbound connection attempts, such as frequency and timing, to differentiate between benign and malicious connections to Xeox.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact on systems if malicious use is confirmed, particularly if exploitable vulnerabilities are present. Although legitimately used for system administration, the tool's functionality may be weaponized by attackers, thus necessitating thorough investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations, which are required for network connections and related process events. Evasion techniques could include the use of whitelisting or tunneling through legitimate traffic. Legitimate system management activities by IT staff could trigger this alert, leading to false positives. A companion detection for remote administration tools would enhance coverage, such as alerts for other known RMM services that may demonstrate similar outbound activity.

