note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with the Xeox Remote Monitoring and Management (RMM) tool. The likely attacker objective is to execute remote administration tasks or maintain persistence on compromised systems using RMM capabilities. This activity fits into the MITRE ATT&CK framework under the tactic **Execution** and technique **Remote Services** (T1219).

  The primary telemetry source is network traffic logs capturing destination hostnames and IP addresses. If this behavior is malicious, it could potentially allow an adversary to control endpoints, exfiltrate data, or deploy additional malware. This detection does NOT confirm malicious activity on its own since legitimate use of the Xeox RMM tool may also result in similar network connections.

  ### Investigation Steps

  - **Review network connection logs**: Check Windows network connection logs (Event ID: 5156) for outgoing connections to `*.xeox.com` or `xeox.com` to identify suspicious endpoints.

  - **Validate host activity**: Analyze the host activity to ensure no unauthorized Xeox RMM installation or usage. Legitimate usage would typically involve recognized user agents and business hours.

  - **Conduct endpoint checks**: Use Sysinternals tools (e.g., Procmon) to identify if the Xeox agent or other related processes are running on the host. Look for unusual behavior or processes not aligned with known software.

  - **Inspect known user activity**: Review user access logs (Event ID: 4624) for unusual logins or behavior patterns around the time of detected activity. Unfamiliar or unexpected logins may indicate compromise.

  - **Identify high-confidence malicious indicators**: Check for unusual executable file creation (Event ID: 4688/Sysmon Event ID: 1) that coincide with network connection times to Xeox domains, especially if executables are being run from temporary or system directories.

  ### Prioritization

  The alert is categorized as medium severity due to the potential for high impact on sensitive systems if exploited. The likelihood of malicious usage exists since RMM tools can be weaponized for persistence and control. This behavior is commonly leveraged in sophisticated attacks, particularly in targeted environments.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging or filtering of network traffic to obscure legitimate Xeox usage. Legitimate remote management solutions may trigger this alert if improperly configured. A related detection mechanism could involve monitoring for modifications to firewall rules, which may indicate an attempt to create persistent remote access configurations.

