  ---

  ### Technical Context

  This rule detects network connections initiated by the Xeox Remote Monitoring and Management (RMM) tool, which is commonly associated with remote administrative tasks. An attacker may use this tool to establish control over a compromised system to facilitate further exploitation, data exfiltration, or lateral movement. The relevant MITRE ATT&CK tactic is **Execution** (TA0002), and the technique is **Remote Services: Remote Access Tools** (T1219).

  Primary telemetry sources include Windows network connection logs, specifically monitoring for outgoing connections to the Xeox domains (*.xeox.com). If malicious, the impact could range from unauthorized access to critical systems to data compromise. However, detecting this network activity does NOT confirm that the tool is being used maliciously, as Xeox may also be employed legitimately by system administrators.

  ---

  ### Investigation Steps

  - **Verify outbound connection details:** Review Windows Security Event ID **5156** to identify the specific process responsible for the network connection, including the associated source IP address and DestinationHostname field.

  - **Assess process legitimacy:** Check for the process initiating the connection using Sysmon Event ID **1**. Validate if it correlates to known legitimate applications (e.g., operational tools, IT support applications).

  - **Cross-check with existing asset inventory:** Identify the host's role by reviewing asset management data to confirm if Xeox RMM is authorized for use on that particular system. Any unlisted system using Xeox may indicate potential compromise.

  - **Identify high-confidence malicious behavior:** Look for abnormal traffic patterns, such as repeated connections to multiple Xeox hosts within a short time span or connections initiated from unknown or non-IT related user accounts.

  - **Review logs for user activity:** Examine Windows Event ID **4624** to correlate user logins with the timing of Xeox connections. Ensure that the users associated with these connections have a legitimate reason to utilize RMM tools.

  - **Document expected behavior:** Confirm that there are historical instances of Xeox usage in your environment for the affected host(s) by referencing change management or IT support ticketing systems as documentation of authorized operational use.

  ---

  ### Prioritization

  The alert is of medium severity due to the potential impact of unauthorized remote access tools targeting sensitive environments. Malicious use of RMM tools is increasingly common in attacks, thus necessitating a closer look. However, organizational policies allowing legitimate use must be accounted for in triage.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if outbound traffic to Xeox domains is blocked or not logged properly. Legitimate uses of Xeox RMM can trigger these alerts, complicating investigations. Monitoring established practices for remote management tools, along with detecting known privilege escalation activities, can strengthen detection capabilities against potential misuse.

