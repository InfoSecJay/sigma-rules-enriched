note: |
  ### Technical Context

  This rule detects network activity associated with the Ericom AccessNow Remote Monitoring Management (RMM) tool, which could indicate unauthorized remote access attempts. The likely attacker objective is to gain remote control over a target system for information theft, system manipulation, or other malicious activities. This detection specifically relates to the MITRE ATT&CK tactic of “Execution” (T1219), which includes remote command execution techniques.

  Primary telemetry sources are Windows event logs related to network connections, particularly focusing on log artifacts that capture the destination hostnames. If this behavior is confirmed as malicious, it could lead to significant security impacts like data breaches, lateral movement, and the deployment of additional payloads. Importantly, this detection alone does not confirm malicious intent, as the Ericom AccessNow tool can also be used legitimately within an organization.

  ### Investigation Steps

  - **Examine Network Connections: **Review Windows Event Logs (Event ID 5156) for connections to `ericom.com` or hosts ending with `user_managed`. Verify timestamps and the originating user's account for suspicious activity.

  - **Analyze Process Creation Events:** Check for process creation linked to Ericom AccessNow via Sysmon Event ID 1. Legitimate processes may include `EricomAccessNow.exe`, while unexpected executions from unusual directories (e.g., `C:\Temp\`) could indicate malicious use.

  - **Verify User Context:** Assess whether the account initiating the remote connection has elevated privileges or a history of unusual behavior. Legitimate users typically have well-defined roles and usage patterns.

  - **Look for Anomalous User Behavior:** Query User Authentication logs for logon patterns (Event IDs 4624 and 4625) correlated with elevated access times. Multiple failed logon attempts followed by a successful logon may indicate compromise.

  - **Correlate with EDR Signals:** If using Endpoint Detection and Response (EDR), confirm that there are related alerts for unauthorized access patterns, suspicious file creations, or user behavior anomalies.

  ### Prioritization

  This alert is of medium priority due to the potential impact on critical assets if unauthorized remote access is confirmed. While not excessively common in weaponization, the use of remote management tools in an improper context poses a substantial risk to network integrity.

  ### Blind Spots and Assumptions

  Limitations of this detection include the potential for legitimate administrative use of Ericom AccessNow, which could generate false positives. Ensuring comprehensive log coverage from Windows Firewall and system event logs is necessary for reliable detection. Furthermore, awareness of administrative roles that appropriately use this tool is critical to avoid misinterpretation of benign activity. Companion detections for suspicious registry changes (related to remote tool configurations) could strengthen overall coverage against misuse.

