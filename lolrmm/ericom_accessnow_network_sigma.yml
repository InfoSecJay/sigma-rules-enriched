note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the Ericom AccessNow Remote Monitoring and Management (RMM) tool. The objective of the attacker using this tool typically involves remote access to and control over compromised endpoints, which is often used for lateral movement or to deploy additional payloads within a network. This behavior correlates with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry sources required for this detection include Windows network connection logs, specifically monitoring for events targeting hosts with destination names ending in 'user_managed' or 'ericom.com'. If malicious, this activity can lead to unauthorized access and control over sensitive information and services. However, this detection alone does not confirm malicious intent, as legitimate usage scenarios for the Ericom AccessNow tool also exist.

  ### Investigation Steps

  - **Review network logs for activity:** Look for Event ID 5156 in the Windows Security logs to identify any outbound connections to domains ending in 'ericom.com'. Compare timestamps with known user activity.

  - **Check for unusual process execution:** Monitor for Sysmon Event ID 1 to identify any unexpected launching of network-related processes that initiate connections to the identified domains, particularly on endpoints not typical for remote access software.

  - **Identify user context:** Determine the user associated with the network activity by reviewing the relevant Event ID 4624 (Logon) entries. Expected behavior may include administrative accounts or known support staff using the tool.

  - **Inspect endpoint configuration:** Validate whether the Ericom AccessNow tool is officially installed and sanctioned on the endpoint by checking installed programs. If not, this can indicate suspicious activity.

  - **Search for recently created files:** Investigate temporary folders (e.g., `C:\Users\<username>\AppData\Local\Temp`) for files created or modified around the same time as the detected network activity. Unexpected executable files may indicate malicious intent.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on critical systems that might be accessed using the RMM tool. While RMM tools such as Ericom AccessNow are commonly leveraged in administrative tasks, their misuse for unauthorized access is increasingly weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate Ericom AccessNow usage triggering alerts, which can lead to false positives. Effective detection requires consistent logging of network connections and Sysmon events, as the absence of these may prevent accurate identification. Legitimate administrative functions may also resemble this behavior. A related detection to strengthen coverage includes monitoring for unusual user logon patterns via Event ID 4624, especially from devices not typically associated with remote access.

