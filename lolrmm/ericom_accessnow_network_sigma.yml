note: |
  ### Technical Context

  This Sigma rule detects network connections made to domains associated with the Ericom AccessNow Remote Management Tool (RMM). The likely attacker objective is to establish remote access and control over compromised systems, which may facilitate additional malicious activities, including data exfiltration and lateral movement. This detection aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001: Application Layer Protocol) and may also involve Remote Services (T1219).

  The primary telemetry source for this rule is network connection logs, specifically looking for DNS queries or established connections to the domain patterns matching `*.ericom.com`. If the detected activity is malicious, it represents a significant security risk, allowing adversaries potential visibility and control over systems within the network. However, the detection does NOT confirm that malicious activity is occurring on its own, as legitimate use of the Ericom AccessNow tool can also trigger the alert.

  ### Investigation Steps

  - **Investigate network connection logs**: Review Windows Firewall logs (Event ID 5156) for outbound connections to `*.ericom.com`. Checking the `DestinationIP` and `DestinationPort` can help verify if the activity is authorized or part of expected operations.

  - **Examine user activity**: Analyze user activity logs (Windows Security Event ID 4624) to determine if the user initiating the connection has a legitimate reason for using Ericom AccessNow. Look for a pattern of remote management usage or other related activity.

  - **Check application install logs**: Validate if the Ericom AccessNow application is installed on the device (Windows Event ID 1030 or via installed applications list). If it's absent, further investigation into the connection may be warranted.

  - **Identify high-confidence malicious indicators**: Look for repeated and unauthorized DNS requests to `ericom.com` without corresponding legitimate application usage. Frequent connections from unfamiliar or unapproved hostnames suggest potential malicious intent.

  - **Document benign connections**: Record any legitimate connections to `ericom.com` made during scheduled maintenance or remote support sessions. Cross-reference with the organization’s policies to identify typical usage patterns and workflows.

  ### Prioritization

  This alert is medium severity due to the potential impact on critical systems that could be leveraged for unauthorized remote control. The likelihood of malicious abuse is moderately high, considering the popularity of RMM tools among attackers. While not universally weaponized, the nature of remote access tools makes them attractive targets for exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into encrypted traffic, which can hide malicious command-and-control communications. The rule assumes that security configurations enabling logging of all outbound connections to the relevant domains are in place. Legitimate uses, such as IT support teams utilizing Ericom AccessNow for system management, will generate similar alerts. A related detection could include monitoring for unusual authentication events (Event ID 4625) coming from the same time frame, enhancing coverage around potential unauthorized access attempts.

