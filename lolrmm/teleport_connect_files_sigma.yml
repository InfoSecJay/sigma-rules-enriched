note: |
  ### Technical Context

  This Sigma rule detects file activity related to the Teleport Connect Remote Management Tool, which can be misused by adversaries for remote command and control (C2) or lateral movement within a network. The likely attacker objective is to leverage this tool to gain remote access to endpoints and conduct unauthorized activities without detection. The relevant MITRE ATT&CK tactic is Command and Control (T1071) utilizing the tool for remote management (T1219). Primary telemetry sources include Windows File Event logs for Windows systems and file access logs on macOS and Linux. If malicious, the security impact may encompass unauthorized system access and potential data exfiltration. However, this detection alone does NOT confirm that malicious activity is occurring, as legitimate use of Teleport Connect can also trigger the rule.

  ### Investigation Steps

  - **Review file access logs:** Check Windows Event ID 4663 or Sysmon Event ID 11 for access to Teleport Connect files (e.g., `C:\Program Files\Teleport Connect\Teleport Connect.exe`). Look for unusual timestamps or users that do not typically access these files.

  - **Analyze user behavior:** Validate the context of user accounts accessing Teleport Connect files. Confirm whether the account is legitimate and if there are patterns of access consistent with typical user workflows.

  - **Examine process creation events:** Look at Windows Security Event ID 4688 or Sysmon Event ID 1 for any new process creation involving Teleport Connect executables. Malicious indicator: sudden creation of `Teleport Connect.exe` by non-admin users without prior history.

  - **Confirm expected legitimate use:** Identify common usage patterns for Teleport Connect in your environment, such as access by IT staff for system maintenance. Log activity during this time frame should reflect this accepted usage with usual IP addresses or user agents.

  - **Monitor for anomalous network activity:** Use network monitoring tools to detect hidden network requests or command execution linked to Teleport Connect. Investigate for any geo-location anomalies in connection attempts or data exfiltration patterns.

  ### Prioritization

  This alert carries a medium severity level due to the potential security impact on the affected system, particularly if critical infrastructure or sensitive data is involved. The likelihood of malicious misuse is present, as tools like Teleport Connect can be weaponized for unauthorized access. While not common in routine operations, such tools are often employed by sophisticated adversaries for lateral movement.

  ### Blind Spots and Assumptions

  Detection limitations may arise from users legitimately utilizing Teleport Connect, leading to potential false positives. Accurate log sources include file access logs, and proper configuration is essential to capture such events effectively. Legitimate DevOps or IT personnel may trigger this alert during routine operations, necessitating careful context review. An associated detection for stronger coverage could include monitoring for known lateral movement activities, such as unusual RDP connections or file share access patterns.

