note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Teleport Connect Remote Monitoring and Management (RMM) tool. The behavior indicates potential unauthorized use or installation of the tool, which could allow an attacker to gain remote access to systems covertly. The likely attacker objective includes establishing persistence or facilitating data exfiltration. This aligns with the MITRE ATT&CK tactic of Execution (T1203) and the technique of Remote Access Software (T1219). The primary telemetry sources for detection include file event logs from Windows (Event ID 4663 for file access) and relevant log entries from macOS/Linux systems. If the activity is malicious, it could lead to unauthorized control over affected machines. This detection does NOT confirm that Teleport Connect is being used legitimately or maliciously without further context.

  ### Investigation Steps

  - **Check file access events:** Review Windows Security Event ID 4663, focusing on the mentioned Teleport Connect file paths (e.g., C:\Program Files\Teleport Connect\Teleport Connect.exe). Look for access by non-admin accounts or unusual timestamps.

  - **Identify execution context:** Analyze process creation logs (e.g., Sysmon Event ID 1) to determine if Teleport Connect is being executed. Confirm if it was initiated from a legitimate user’s context or if it indicates possible misuse.

  - **Examine file modifications:** Verify any changes to app_state.json and app_config.json in both user and program directories to identify potential alterations indicative of remote access configurations.

  - **Distinguish legitimate usage:** Compare current activity against established baselines of applications in your environment. Legitimate installations should correspond with IT departmental deployment logs or inventory records.

  - **Confirm critical role of the asset:** Assess the configuration and role of systems flagged by the alert. High-value assets (e.g., servers, workstations handling sensitive data) should be prioritized for investigation.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems if malicious use of Teleport Connect occurs. The likelihood of abuse is significant as tools in the RMM category are often weaponized for remote access by attackers. Organizations should remain vigilant and assess alerts, particularly on sensitive or high-value assets.

  ### Blind Spots and Assumptions

  Detection limitations might include environmental factors where legitimate Teleport Connect usage exists, potentially generating false positives. Required log sources include accurate file access logging on Windows and macOS/Linux systems. Legitimate use cases include IT support activities, which may trigger this rule. A related detection for enhanced coverage could involve monitoring for network traffic patterns associated with Teleport Connect cloud service API communications.

