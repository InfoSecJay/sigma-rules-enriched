note: |
  ### Technical Context

  This Sigma rule detects file activities associated with the Teleport Connect Remote Management Tool (RMM), including executable files and configuration artifacts. The likely objective of an attacker using this tool could be to establish command-and-control (C2) communication, enabling unauthorized access or management of affected systems. This aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique T1219 (Remote Access Software).

  The primary telemetry sources for this detection include Windows File Events specific to the aforementioned file paths. If malicious, this activity could lead to unauthorized access and remote manipulation of the system, significantly impacting security posture. It is crucial to note that this detection does NOT confirm malicious intent or compromise on its own, as legitimate use of Teleport Connect may trigger the same alerts.

  ### Investigation Steps

  - **Check Teleport Connect executable access:** Review Security Event ID 4663 for file access monitoring around `C:\Program Files\Teleport Connect\Teleport Connect.exe`. Look for suspicious user accounts or unexpected access patterns, indicating potential abuse.

  - **Identify configuration changes:** Examine file modification timestamps for `app_config.json` and `app_state.json` located in `C:\Users\*\AppData\Roaming\Teleport Connect\`. Abnormal values or changes made by non-admin accounts could suggest unauthorized modifications.

  - **Verify legitimate usage:** Confirm the presence of known users or service accounts with a legitimate business need to interact with Teleport Connect. Document expected usage patterns, including scheduled tasks or remote management sessions, to aid in identifying anomalies.

  - **Analyze log activity:** Investigate the `logs` directory at `C:\Users\*\AppData\Roaming\Teleport Connect\logs\*` for high-frequency or unusual log entries that could indicate automated processes or unauthorized access attempts.

  - **Evaluate updater artifacts:** Review files under `C:\ProgramData\TeleportConnectUpdater\*` for unexpected creations or modifications. Malicious actors may attempt to manipulate updater mechanisms for persistence or further exploitation.

  ### Prioritization

  This alert should be treated with medium severity due to the nature of the affected system, which could potentially allow remote control by an attacker. The likelihood of malicious exploitation of such RMM tools is notable, as similar tools are commonly weaponized in other attack vectors.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming or relocating the associated files which can prevent detection. Reliable alerts require monitoring for changes in Windows file events, necessitating properly configured logging settings. Legitimate applications of Teleport Connect, such as operational remote support, might trigger alerts similarly to malicious use, complicating investigations. Companion detections based on abnormal network traffic patterns (e.g., unexpected outbound connections to known IPs associated with these tools) can enhance context for better incident analysis.

