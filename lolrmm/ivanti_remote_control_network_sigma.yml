note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the Ivanti Remote Control (RMM) tool, specifically targeting actions that may indicate command-and-control (C2) activity. The attacker objective here is likely to exploit RMM tools for remote access to systems, potentially leading to data exfiltration or lateral movement within the network. This behavior aligns with MITRE ATT&CK tactic: Command and Control (TA0011), specifically technique: Application Layer Protocol (T1219).

  The primary telemetry source involves Windows network connection logs capturing information about destination hostnames. If malicious, this behavior could grant attackers remote administrative access, presenting significant risks to the compromised host and network. It is crucial to note that this detection does NOT confirm malicious activity on its own, as legitimate use of Ivanti RMM tools may also generate similar connections.

  ### Investigation Steps

  - **Check Network Connections: **Review Windows Event ID 5156 (Windows Filtering Platform) to determine if the connection was outbound to a known Ivanti domain (*.ivanticloud.com). Look for non-standard times or unusual user accounts initiating these requests as potential indicators of compromise.

  - **Correlate with System Roles: **Identify if the host is a critical system (such as a server or high-value asset) using asset management tools. RMM tools are more concerning on critical assets, increasing the priority of investigation.

  - **Validate User Activities: **Investigate recent user activity logs (e.g., Security Event ID 4624 for user logons) to check if the originating user account has recently accessed the Ivanti RMM tool legitimately. Legitimate connections will often correlate with expected maintenance or support activities.

  - **Review for Additional Artifacts: **Examine any RMM-related logs or associated Windows Event IDs for unusual actions prior to the detected network activity, like Event ID 4688 (Process Creation to identify if the Ivanti tool was executed unexpectedly).

  - **Extract DNS Lookup Details: **Analyze DNS query logs to determine if there are any anomalous queries leading up to or following the detected activity to the Ivanti domains. Look for unscheduled lookups or volumes, which may indicate automated exfiltration attempts.

  ### Prioritization

  This alert is medium severity given the potential access to critical systems via the Ivanti RMM tool, which may be leveraged by malicious actors for unauthorized remote access. The likelihood of malicious abuse is high if this behavior is not aligned with documented incident response or maintenance procedures.

  ### Blind Spots and Assumptions

  Detection limits exist because legitimate administrative use of Ivanti RMM tools can trigger these alerts. If network logging (especially for outbound traffic) is not configured properly, connections might not be captured. Additionally, users might employ legitimate access that coincides with malicious behavior, complicating investigations. A related detection to consider is monitoring for process creation (Event ID 4688) involving Ivanti software, which could provide complementary context to the observed network activity.

