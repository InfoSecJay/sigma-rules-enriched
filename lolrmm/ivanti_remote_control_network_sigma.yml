note: |
  ### Technical Context

  This Sigma rule detects network activity involving Ivanti Remote Control RMM tool, specifically connections to hostnames ending in `.ivanticloud.com`. The likely attacker objective is remote access and control over compromised systems, which is often utilized for exfiltration of data or system manipulation. This relates to the MITRE ATT&CK tactic of Command and Control and the technique T1219 (Remote Access Tools). The primary telemetry sources for this detection are Windows network connection logs, specifically those indicating outbound connections.

  If this activity is malicious, it could result in loss of sensitive information or unauthorized system changes. However, this detection does NOT confirm that the Ivanti Remote Control tool is being used maliciously; legitimate administrative or support activities may also trigger this alert.

  ### Investigation Steps

  - **Verify network connections to Ivanti domains:** Review network connection logs (Event ID 5156) for indications of outbound connections to any `*.ivanticloud.com` hostnames. Document timestamps and source IP addresses.

  - **Identify legitimate usage patterns:** Check for documented allowed uses of Ivanti Remote Control within your organization. Consult with your IT or support team to assess if the timestamps of the connections correspond to scheduled maintenance or support actions.

  - **Assess process creation events:** Review Security Event ID 4688 on affected endpoints for process creation events related to Ivanti software during the same timeframe as the network activity. Look for unusual command-line arguments or parent processes that are not aligned with expected behavior.

  - **Review session activity:** Check for any unusual remote session records (e.g., RDP or VNC logs) on affected systems during the same timeframes. Malicious activity may lack valid user credentials or show unexpected user accounts.

  - **Correlate with endpoint logs:** Analyze any relevant Sysmon logs (Event ID 3) for unusual network activity patterns from legitimate processes that could indicate abuse of the Ivanti tool.

  ### Prioritization

  The alert has medium severity due to the potential impact of unauthorized remote access, which can lead to significant data breaches. The likelihood of malicious abuse exists, especially in environments where RMM tools are used, as they can be exploited by threat actors. While use of Ivanti Remote Control may be legitimate, this behavior is commonly weaponized in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by organizations that do not fully log outbound network connections or have restrictive firewall rules that block RMM tool communications. The legitimate use of Ivanti Remote Control by authorized personnel can trigger alerts. A related detection to strengthen coverage is monitoring for unusual login attempts or authentication failures associated with remote access during the same timeframe.

