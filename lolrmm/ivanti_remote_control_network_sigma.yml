note: |
  ### Technical Context
  This rule detects potential network activity associated with the Ivanti Remote Control tool, which is often utilized for remote management within enterprise environments. Attackers may seek to exploit this legitimate remote control software for malicious purposes, such as unauthorized access to sensitive systems, data exfiltration, or lateral movement within the network. The use of a legitimate remote access tool by an attacker can often bypass typical security defenses, leading to undetected operations that aim to disrupt services or extract valuable information.

  Relevant MITRE ATT&CK tactics include **Execution (T1203)**, which covers the execution of unwanted programs, and **Command and Control (T1219)**, which pertains to the use of cloud services to communicate with compromised systems. These techniques highlight the dual-use nature of remote management tools like Ivanti Remote Control, emphasizing the need for stringent monitoring and detection of unauthorized uses.

  The primary data sources for this detection include network connection logs from Windows endpoints, which capture outbound connections, particularly those directed at domains associated with Ivanti, such as `ivanticloud.com`. Monitoring these logs can provide insights into potential misuse of the remote management tools.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine logs for connections to `*.ivanticloud.com` and assess the source IP addresses and user identities to determine legitimacy.
  - **Correlate User Activity:** Investigate the activities performed by users connecting to the Ivanti Remote Control service; look for unusual patterns or behaviors inconsistent with user roles.
  - **Check for Privileged Access:** Assess if the accounts initiating the Ivanti connections possess administrative privileges that could allow for expansive access across the network and raise concerns if unused accounts are involved.
  - **Monitor for Secondary Usage:** Investigate subsequent network activity following the use of Ivanti, such as data transfers, access to sensitive systems, or connections to unfamiliar endpoints that may indicate further malicious intent.

  ### Prioritization
  The alert is considered medium severity given that while Ivanti is a legitimate tool, its misuse poses significant risks in the context of unauthorized system access and potential data breaches. The likelihood of exploitation increases when used without appropriate controls or monitoring.

  ### Blind Spots and Assumptions
  The detection coverage may be limited by the presence of legitimate use of the Ivanti Remote Control tool, leading to potential false positives. The logic assumes that any outbound connection to the specified domain is potentially malicious, which may not account for authorized remote support activities. Ensuring appropriate logging configurations for network connections is crucial; thus, any gaps in log retention or monitoring could hinder the effectiveness of this alert.

