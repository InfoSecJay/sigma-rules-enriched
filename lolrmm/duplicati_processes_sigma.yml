note: |
  ### Technical Context

  This Sigma rule detects process activity related to the Duplicati RMM (Remote Management and Monitoring) tool, particularly instances where new processes are spawned by or are associated with `Duplicati.Server.exe`. The attacker objective may involve using the Duplicati tool to facilitate data backups or remote management of systems, potentially leveraging its functionality for malicious purposes such as unauthorized data access or exfiltration. This behavior maps to the MITRE ATT&CK technique **Command and Control** (T1219) under the tactic of **Execution**.

  Primary telemetry sources include **Windows process creation logs**, specifically **Security Event ID 4688** and/or **Sysmon Event ID 1**, which capture details about the process being launched. If malicious, the misuse of Duplicati can lead to unauthorized data access or network reconnaissance. It is essential to note that this detection does NOT confirm malicious intent on its own; legitimate use of Duplicati for backup and management tasks can trigger the same alert.

  ### Investigation Steps

  - **Check process details:** Review Security Event ID 4688 or Sysmon Event ID 1 logs for processes created that have `Duplicati.Server.exe` as their parent image. Note the command line arguments used; compare with typical benign usage of Duplicati, which usually includes parameters for backup paths and schedules.

  - **Assess parent processes:** Identify the originating parent processes of the detected instances of `Duplicati.Server.exe`. Legitimate instances are often spawned by known administrative tools, while unexpected parent processes (e.g., `cmd.exe` or PowerShell) may indicate suspicious activity.

  - **Verify execution paths:** Validate that the path for the `Duplicati.Server.exe` is legitimate (e.g., `C:\Program Files\Duplicati 2\`) by cross-referencing against expected installation directories. Unexpected paths may indicate a malicious installation.

  - **Analyze network activity:** Examine network logs (e.g., Firewall or proxy logs) related to the timestamps of the detected process activities. Look for unusual outbound connections initiated by processes associated with Duplicati that may indicate data exfiltration or command and control communication.

  - **Determine asset criticality:** Evaluate the role of the affected host system in your infrastructure. If it hosts sensitive applications or data, prioritize the investigation accordingly, as the potential impact of abnormal Duplicati behavior escalates with critical assets.

  - **Correlate with additional detections:** Review related detections for other suspicious behavior on the same host, such as unusual file changes or unauthorized remote management access attempts, to build a comprehensive understanding of any potential incidents.

  ### Prioritization

  The alert is categorized as medium severity due to the potential for misuse of the Duplicati tool, particularly in critical systems where unauthorized access could lead to significant data breaches. The likelihood of malicious exploitation is moderate, as the tool is commonly utilized in administrative contexts, but its functionalities can also be weaponized by adversaries.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques such as renaming the Duplicati executable or running it from non-standard locations. Reliable detection requires proper logging configurations for process creation and potentially file creation logs to capture any data being backed up or transferred. Legitimate administrative activities, such as scheduled backups, can trigger the alert. A related detection to strengthen coverage would be alerts on unusual outbound connections from administrative tools, indicating potential data exfiltration attempts.

