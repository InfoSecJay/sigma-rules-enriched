note: |
  ### Technical Context

  This Sigma rule detects the execution of processes potentially associated with the Duplicati RMM tool, specifically monitoring for activity where `Duplicati.Server.exe` is the parent or the executed image. The likely attacker objective is to utilize this tool for remote management and monitoring in an unauthorized manner, which can facilitate command-and-control operations or data exfiltration. This behavior aligns with the MITRE ATT&CK tactics of Command and Control (T1071.001) and Application Layer Protocol (T1219).

  The primary telemetry sources required are Windows process creation logs, specifically Security Event ID 4688, which records process initiation, and Sysmon Event ID 1, which captures detailed process creation information. If malicious, the security impact could involve unauthorized monitoring or remote management capabilities being leveraged to access sensitive data. Notably, this detection does not confirm that the activity is inherently malicious; legitimate use of Duplicati by IT staff is a common scenario that could trigger this alert.

  ### Investigation Steps

  - **Check process details**: Review Event ID 4688 or Sysmon Event ID 1 logs for entries where `Image` or `ParentImage` ends with `\\Duplicati.Server.exe`. Validate process arguments for any signs of misuse not typically associated with legitimate RMM practices.

  - **Analyze user context**: Identify the user account associated with the detected processes. Legitimate Duplicati usage typically involves service accounts of IT personnel; unusual user accounts (e.g., accounts with no history of RMM tool use) may indicate malicious activity.

  - **Inspect network connections**: Review relevant network telemetry, such as Firewall logs or Netstat outputs, for connections initiated by processes related to Duplicati. Look for unexpected outbound connections to suspicious IP addresses or unusual ports, which may signify command-and-control activity.

  - **Validate scheduled tasks**: Check for any scheduled tasks linked to `Duplicati.Server.exe` using Task Scheduler logs (Event ID 106) or any associated registry changes. Legitimate installations will typically have defined, documented schedules; anomalies may suggest unauthorized access.

  - **Correlate with existing incidents**: Cross-reference the findings with previous security incidents or alerts involving unauthorized tool usage. Establish if this is part of a wider trend or campaign affecting similar systems or components.

  ### Prioritization

  This alert is medium severity due to the potential for high impact if Duplicati is utilized in a malicious manner, particularly in environments sensitive to unauthorized remote access. As Duplicati has legitimate functions, false positives are possible, making context and surrounding telemetry crucial for accurate assessment. The use of RMM tools by adversaries is increasingly common, warranting prompt attention.

  ### Blind Spots and Assumptions

  Detection may be limited by users disabling logging or employing tampering techniques to obscure RMM tool activity. It requires accurate logging configurations in place for reliable coverage of process creations and network connections. Legitimate IT administrators may trigger this alert during normal operations, particularly when managing backups or system monitoring tasks. A related detection strategy could include monitoring for modifications in Task Scheduler or any outbound traffic patterns that deviate from established baselines to enhance detection efficacy.

