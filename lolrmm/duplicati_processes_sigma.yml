note: |
  ### Technical Context
  This detection rule identifies potential process activity related to the Duplicati Remote Management and Monitoring (RMM) tool. Duplicati is a backup software that can also be misused by threat actors to facilitate remote access and management of compromised systems, thereby aiding in data exfiltration or persistent access to the environment. The rule focuses on instances where processes associated with Duplicati are spawned, potentially indicating misuse as part of lateral movement or operational security evasion.

  The likely attacker objectives of deploying the Duplicati RMM tool include establishing remote control over the environment, facilitating data backup and transfer to remote locations, and executing commands on compromised machines without the knowledge of legitimate users. This aligns with various techniques outlined in the MITRE ATT&CK framework, primarily focusing on Execution (T1203) where adversaries might execute malicious payloads or management software.

  Primary data sources for detecting these activities will primarily include process creation events on Windows devices, where the execution of "Duplicati.Server.exe" will be logged, providing insight into legitimate versus suspicious behavior related to this software.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine detailed process creation events for instances of "Duplicati.Server.exe" being executed. Check the parent-child relationships to see if these processes originate from legitimate sources.

  - **Analyze User Context:** Investigate the user accounts associated with the Duplicati processes. Look for anomalous behavior such as execution outside of expected operational hours or by unexpected users that may indicate compromise.

  - **Correlate with Network Activity:** Check for outbound connections initiated by Duplicati processes. Evaluate whether these connections are being made to known malicious IP addresses or domains that raise red flags within the enterprise environment.

  - **Review Configuration Files:** If possible, obtain and analyze the configuration files of Duplicati to identify any unusual settings or configs that could point to misuse or unauthorized backups being made.

  ### Prioritization
  The alert is rated as medium severity due to the potential for significant impact if Duplicati is misused by an adversary for unauthorized data access or exfiltration. Given that Duplicati is used in legitimate backup scenarios, there exists a moderate likelihood for false positives, necessitating careful investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage may arise from instances of Duplicati being used legitimately, which could lead to false positives that obscure actual malicious activity. The detection logic assumes that the environment has consistent logging enabled for process creation events. If logging configurations are not properly set or if the Duplicati tool is executed with obfuscation techniques (e.g., renamed executables), the detection may fail to identify suspicious activity. Proper logging configurations are essential for ensuring the effectiveness of this rule.

