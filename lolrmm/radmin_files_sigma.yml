note: |
  ### Technical Context
  This detection rule is designed to identify file activity associated with the RAdmin Remote Management (RMM) tool, which is often used for legitimate remote management but can also be exploited by attackers for unauthorized access and remote control of systems. The focus is on specific log files that RAdmin generates, including log files found in various system directories and user document folders.

  Attackers targeting a system using RAdmin might aim to maintain persistence, exfiltrate sensitive information, or manipulate files and applications without detection. The presence of RAdmin files, especially when unexpected, can indicate potential malicious activity, particularly if these files are altered or accessed by unauthorized users.

  Relevant MITRE ATT&CK techniques include:
  - Remote Access Tools (T1219)
  - Execution (T1203), as the tool is used for remote access and might involve executing malicious commands.

  Primary data sources for this detection include:
  - Windows file event logs that provide visibility into file access and modifications, especially in system and user directories where RAdmin logs are located.

  ### Investigation Steps
  - **Review File Access Logs:** Check Windows file event logs for access to the identified RAdmin log files, looking for unusual users or processes accessing these files outside of normal usage patterns.

  - **Analyze User Behavior:** Investigate the user accounts that accessed or modified these files. Look for any account that shows signs of abnormal behavior or does not typically engage with RAdmin.

  - **Correlate with Session Activity:** Cross-reference identified file activity with user session logs to determine if there are any corresponding remote access sessions associated with the detected file activity.

  - **Investigate Process Execution:** Look for process creation events that may correspond to RAdmin usage, particularly any unexpected or unfamiliar processes that interact with the log files.

  ### Prioritization
  The alert is rated as medium severity since the presence of RAdmin file activity could indicate potential malicious behavior, particularly in environments where RAdmin is not commonly used. The likelihood of exploitation increases if the access patterns deviate from established norms.

  ### Blind Spots and Assumptions
  The detection logic may miss legitimate uses of RAdmin, leading to potential false positives, especially in environments where the tool is used for administrative purposes. It assumes that all RAdmin-related file access should be monitored, and may not account for other legitimate administrative tools that perform similar tasks. Furthermore, this rule requires that Windows file event logging is properly configured and enabled for accurate detection, which could be a gap in some environments.

