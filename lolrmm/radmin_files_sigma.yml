note: |
  ### Technical Context

  This rule detects file activity associated with the RAdmin Remote Management (RMM) tool by monitoring the creation or modification of specific log files, such as Radm_log.htm and CHATLOGS in common RAdmin directories. The likely attacker objective is to gain remote access to systems, facilitate unauthorized actions, or maintain persistence. The relevant MITRE ATT&CK tactics and techniques are Execution (T1203) and Remote Access Tools (T1219).

  Primary telemetry sources include Windows file event logs, specifically targeting paths associated with the RAdmin tool. If malicious, the presence of unauthorized log file activity may indicate exploitation of RAdmin for remote control or data exfiltration. It is important to note that this detection does NOT confirm malicious intent as legitimate use of RAdmin by authorized personnel could generate similar logs.

  ### Investigation Steps

  - **Check Log Creation**: Review Windows Security Event ID 4663 logs for Create File or Write permissions involving `C:\Windows\SysWOW64\rserver30\Radm_log.htm`. Presence of such logs without prior security approvals indicates potential misuse.

  - **Identify File Changes**: Analyze file change logs for `C:\Windows\System32\rserver30\CHATLOGS\*.htm` to see if suspicious timestamps align with known user activity. Legitimate modifications should align with expected maintenance windows.

  - **Correlate User Behavior**: Query username fields in Event ID 4663 to ensure that files are modified by known administrative users or services. Modifications by non-admin accounts or unexpected service accounts could indicate malicious activity.

  - **Verify Process Execution**: Investigate Windows Process Creation Event ID 4688 for any processes related to RAdmin in conjunction with file changes. Look for unexpected spawnings of `rserver.exe`, which may signal unauthorized operations.

  - **Assess File Context and Contents**: Review the contents of the associated files for suspicious commands or connections. Legitimate logs typically include standard operational activities; any anomalies should be escalated.

  - **Check for Companion Tools**: Look for other remote access tool indicators, such as entries in Event ID 4688 that may indicate tools like TeamViewer or AnyDesk are also being used. Cross-referencing can reveal broader threats within the environment.

  ### Prioritization

  This alert carries medium severity due to the potential impact on sensitive systems if RAdmin usage is unauthorized. The likelihood of malicious abuse is moderate, as RAdmin is a known tool for remote access exploitation, and its behavioral patterns could commonly be weaponized by adversaries.

  ### Blind Spots and Assumptions

  The rule has limitations in detecting legitimate RAdmin activity if used by authorized users, leading to potential false positives. Required log sources must include Windows file event logs and security event logging at the proper configuration to ensure all relevant actions are captured. Legitimate administrative tasks may trigger this alert, particularly during system maintenance or support activities. A related detection for execution of known remote access tools could enhance overall network visibility and security posture.

