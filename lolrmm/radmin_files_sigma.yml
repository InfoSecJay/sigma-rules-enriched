note: |
  ### Technical Context

  This Sigma rule detects file activities related to the RAdmin Remote Management (RMM) tool, specifically targeting log files that are generated as part of its operations. The likely attacker objective may include maintaining an active presence on a compromised machine or conducting surveillance through logging chats and sessions. The relevant MITRE ATT&CK tactics include **Command and Control (T1071)** and **Exfiltration Over Command and Control Channel (T1219)**. The primary telemetry sources are Windows file event logs, particularly focusing on changes or accesses to specific HTM files tied to the RAdmin tool. If malicious, the presence of these logs indicates unauthorized remote access and activity on the system. Importantly, this detection does NOT confirm that RAdmin is being used maliciously, as it could be part of legitimate administrative or remote support tasks.

  ### Investigation Steps

  - **Check file modification timestamps:** Review the modification dates of files located in `C:\Windows\SysWOW64\rserver30\` and `C:\Users\*\Documents\ChatLogs\`. Recent changes (within the last 24 hours) may indicate suspicious activity, especially if the system is not typically used for remote management.

  - **Identify user accounts accessing log files:** Filter Windows Security Event ID 4663 to find which user accounts accessed or modified the detected files. Look for accounts that are not associated with support or administrative roles, which could indicate unauthorized access.

  - **Validate expected RAdmin usage:** Confirm whether RAdmin is actively used in the environment by consulting documentation or IT policies. Legitimate use should have corresponding user access controls and documented use cases.

  - **Examine historical behavior:** Analyze Sysmon Event ID 10 (FileCreate) and ID 11 (FileCreateStream) to look for unusual activity patterns around when the logs were accessed or modified. Legitimate activities should show a clear history of user activity on the host.

  - **Correlate network communications:** Review network logs, especially for outbound attempts to unusual or unauthorized IP addresses, which could indicate command-and-control communication originating from the RAdmin tool.

  ### Prioritization

  This alert has medium severity due to the potential impact on compromised systems and the likelihood of exploitation through unauthorized remote access. The fact that RAdmin is sometimes weaponized in an adversarial context underscores the need for swift investigation. However, it is important to recognize legitimate administrative uses that could trigger false positives.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of RAdmin in the environment, creating potential false positives. Evasion techniques may include altering log file locations or names. Effective monitoring requires adequate logging configurations for file access and modifications, particularly in sensitive directories. A related detection to strengthen coverage would involve monitoring for unauthorized remote connection attempts (e.g., unusual RDP sessions or other remote access tools).

