note: |
  ### Technical Context

  This Sigma rule detects network activity related to the HeartbeatRM Remote Monitoring and Management (RMM) tool by identifying connections to destination hostnames ending with *.heartbeatrm.com. The likely attacker objective could be unauthorized access or management of systems through the HeartbeatRM tool, which can facilitate persistent access or lateral movement in the environment. This detection aligns with the MITRE ATT&CK technique "Remote Management Software" (T1219).

  Primary telemetry sources include Windows network connection logs and corresponding fields that log the destination hostname. If this behavior is malicious, it may lead to unauthorized system management, data theft, or malware propagation. Importantly, this detection does NOT confirm malicious intent; the HeartbeatRM tool may also be used legitimately within the organization.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) for any connections to *.heartbeatrm.com. Expect to see timestamps and process identifiers related to known administrative tools if usage is legitimate.

  - **Validate source of network activity:** Investigate the host initiating the connection (use Event ID 4624 for user logons on that machine). Compare against asset inventory to verify if this host is authorized to utilize HeartbeatRM.

  - **Review associated processes:** Use Sysmon Event ID 3 (Network Connections) to identify the parent process of the connection to *.heartbeatrm.com. Legitimate processes like remote management applications may indicate allowed use versus unauthorized use.

  - **Identify high-confidence malicious indicators:** Look for signs of unauthorized usage within Event ID 4688 (Process Creation) and check for unusual or unrecognized process names associated with the HeartbeatRM activity.

  - **Correlate with system logs:** Cross-reference system event logs (Event ID 7036 for service state changes) to identify any new or modified services related to HeartbeatRM on critical servers, indicating potential exploitation.

  ### Prioritization

  This alert carries medium severity due to the potential impact on managed endpoints and the likelihood of malicious activity, especially if HeartbeatRM is not explicitly approved for use in the organization. Such behavior can be weaponized by adversaries to maintain persistence or conduct further attacks.

  ### Blind Spots and Assumptions

  Detection limitations may arise due to legitimate usage of HeartbeatRM in the organization, which can produce false positives. Reliable detection requires proper logging configuration for Windows Filtering Platform events and Sysmon for enhanced visibility. Additionally, legitimate administrative activities like IT support using RMM tools may trigger the alert. A related detection to consider is "Unauthorized Execution of Remote Management Software" which can provide broader context for investigations.

