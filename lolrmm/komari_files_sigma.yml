note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Komari Remote Monitoring and Management (RMM) tool, specifically the executable files `komari-agent.exe` and `nssm.exe`, across multiple operating systems. Komari RMM can be utilized for legitimate system management, but it can also be leveraged by adversaries to establish persistence, execute commands, and control compromised systems remotely. The relevant MITRE ATT&CK technique is Command and Control (T1219).

  Primary telemetry sources include Windows file event logs and Linux file access logs showing file creation, modification, or execution events. If malicious, the impact can be significant, as the presence of unauthorized RMM tools indicates potential system compromise and loss of control over endpoints. However, this detection alone does not confirm malicious intent, as Komari may be used legitimately by IT administrators for remote management tasks.

  ### Investigation Steps

  - **Verify file execution logs**: Review file event logs (Windows Security Event ID 4663 or Sysmon Event ID 10) for the execution of any detected Komari executables. Focus on creation or modification times to correlate against known user or admin activity.

  - **Investigate system services**: On Linux, check for running services related to Komari using `systemctl status komari-agent.service` or by reviewing logs in `/var/log/syslog` for entries indicating service start or restart. Legitimate behavior shows these services tied to expected management sessions.

  - **Analyze parent-child process relationships**: Use Sysmon Event ID 1 logs to determine the parent processes of `komari-agent.exe` or `nssm.exe`. Legitimate launches typically originate from known system management or admin tools, while unexpected origins (e.g., `cmd.exe` or `powershell.exe`) may indicate malicious use.

  - **Correlate with remote connections**: Check firewall logs for outbound connection attempts to uncommon or suspicious IP addresses from the affected host following the execution of the Komari executables (e.g., examining log fields for Destination IP and Ports).

  - **Check for file changes**: Monitor for any unexpected creation or modification of configuration files or scripts within the Komari folder (`C:\Program Files\Komari\` on Windows or `/opt/komari/` on Linux) that do not match the expected policy or previous baselines.

  ### Prioritization

  The alert is considered medium severity based on its potential impact, as unauthorized use of an RMM tool could lead to significant data compromise or further escalation. The likelihood of malicious abuse is credible since attackers often exploit legitimate administrative tools to maintain access on compromised systems. This behavior has been weaponized in previous attacks, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited due to legitimate use cases of the Komari tool by IT personnel, which could generate false positives. It is critical that endpoint logging configurations include comprehensive monitoring of file access events. Additionally, non-standard behavior or unauthorized modifications in the expected use of the Komari tool should be reviewed further. A companion detection that can strengthen coverage is monitoring for C2 communications (e.g., beaconing patterns) in tandem with file activity.

