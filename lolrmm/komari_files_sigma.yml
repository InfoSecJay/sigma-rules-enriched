note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Komari Remote Monitoring and Management (RMM) tool. This behavior may indicate potential unauthorized remote administration, which could be leveraged by attackers to maintain persistence, execute commands, or exfiltrate data. The relevant MITRE ATT&CK tactic involved is **Command and Control (T1071)** and technique **Application Layer Protocol (T1219)**.

  The primary telemetry sources include Windows file event logs, specifically monitoring file creations or modifications targeting executable components of the Komari RMM tool, such as `komari-agent.exe` and `nssm.exe`. If exploited maliciously, this could lead to significant security risks, including unauthorized remote control over systems and access to sensitive data. It's critical to note that this detection does NOT confirm that malicious activity has occurred without additional context about user and system behavior.

  ### Investigation Steps

  - **Review logged file activities**: Check Windows file event logs (Event ID 4663) for modifications to `C:\Program Files\Komari\komari-agent.exe` and `C:\Program Files\Komari\nssm.exe`. Look for abnormal timestamps or patterns indicating atypical usage.

  - **Cross-reference execution context**: Analyze the associated process creation events (Event ID 4688) linked to these file actions. Verify if users launching these processes typically engage with Komari RMM in normal business operations. Legitimate users should exhibit consistent behaviors aligned with RMM tool usage.

  - **Identify user credentials**: Look into the user accounts associated with file modifications noted in the logs. Accounts displaying unauthorized access levels or unfamiliarity with the environment should raise red flags for potential misuse.

  - **Check for persistence mechanisms**: Investigate if Scheduled Tasks or Windows Services have been created or modified to launch Komari components. Use Event ID 4698 for task creation and review service logs for unusual configurations that enable persistence.

  - **Audit network connections**: Examine network traffic logs (e.g., using firewall logs, IDS/IPS data) for suspicious outbound connections attempting to contact known command-and-control (C2) servers. Watch for outgoing traffic patterns that coincide with the execution of `komari-agent.exe`.

  - **Validate against threat intelligence**: Cross-reference detected behaviors against threat intelligence sources and logs to see if the Komari tool version in use has known vulnerabilities or if it has been reported in past incidents of misuse.

  ### Prioritization

  This alert should be taken seriously, as the use of the Komari RMM tool can pose a significant risk if exploited by an adversary. The likelihood of malicious use is moderate, considering that RMM tools are often exploited for unauthorized access and control over endpoints. Given that remote administration tools can be weaponized, quick and thorough investigation is warranted.

  ### Blind Spots and Assumptions

  The primary limitation is that legitimate use of the Komari RMM tool can trigger this alert, potentially leading to false positives. Detection relies on accurate logging configurations for file events and process creation. This rule may miss instances where RMM tools are executed from non-standard directories or modified binaries. A companion detection to enhance coverage is monitoring network connectivity from these applications to potentially harmful external IP addresses or domains.

