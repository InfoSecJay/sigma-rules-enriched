note: |
  ### Technical Context

  This Sigma rule detects file activity related to the Komari RMM (Remote Monitoring and Management) tool, specifically monitoring for the execution of its executables. The likely attacker objective may involve unauthorized system access or management, potentially leading to data exfiltration or further exploitation of the target system. This detection is aligned with the MITRE ATT&CK technique for Remote Desktop Protocol (T1219).

  The primary telemetry sources include Windows file event logs and Unix/Linux file events for the respective Komari paths. If the activity is malicious, it could lead to unauthorized system control or compromise. Importantly, this detection does NOT confirm malicious intent on its own, as Komari may be legitimately used by IT personnel for system management.

  ### Investigation Steps

  - **Correlate File Activity with Executable Names:**
    Check for instance of `C:\Program Files\Komari\komari-agent.exe`, `nssm.exe`, or similar paths (Linux versions) in file event logs. Review Windows Security Event ID 4688 (process creation) or Linux logs for execution patterns.

  - **Identify User Context:**
    Determine the user account under which the Komari executables were run. Look for legitimate admin users or service accounts that typically use RMM tools vs. potentially compromised or unexpected accounts in system logs.

  - **Review Execution Timing:**
    Analyze timestamps of the file events; compare the execution time of Komari executables against routine maintenance windows. Legitimate use might typically cluster around scheduled maintenance periods.

  - **Examine Command-Line Arguments:**
    Investigate command-line arguments used with the Komari tool by checking Event ID 4688 for Windows or relevant process logs on Unix/Linux. Suspicious flags or actions outside of standard operational parameters may indicate malicious activity.

  - **Check for Anomalous Network Activity:**
    Monitor for outbound connections correlating with Komari activity, specifically looking for anomalous IPs or unexpected protocols in firewall logs to identify potential data exfiltration.

  - **Analyze Associated Service Entries:**
    For Linux systems, check for entries in `/etc/systemd/system/` related to `komari-agent.service`. Unexpected or modified service files can indicate compromise or unauthorized use of the RMM tool.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems with administrative control granted by tools like Komari. There is a medium likelihood of malicious abuse, especially if the tool is invoked by suspicious accounts outside expected operational usage. This behavior can be weaponized for lateral movement or unauthorized access within the organization's infrastructure.

  ### Blind Spots and Assumptions

  The detection may have limitations if logs for the execution of Komari are not properly configured. An adversary could evade detection by using renamed executables or by executing commands through legitimate user accounts. Legitimate administrative activities may also trigger this alert when authorized IT personnel use Komari for routine maintenance. Companion detections such as monitoring unusual task schedules or elevated privilege activity could strengthen overall coverage against misuse of remote management tools.

