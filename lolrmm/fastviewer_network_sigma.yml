note: |
  ### Technical Context

  This rule detects network connections to the FastViewer RMM (Remote Management and Monitoring) tool, which is commonly used for remote support and administration. The likely attacker objective is to gain unauthorized access to systems by leveraging the RMM tool for remote control, potentially allowing for lateral movement, data exfiltration, or installation of additional malware. This detection corresponds to the MITRE ATT&CK technique "Trusted Relationship" (T1219), which focuses on exploiting existing remote management tools.

  The primary telemetry source for this rule is Windows network connection logs, specifically monitoring outbound connection attempts. If detected as malicious, it could indicate a compromise, leading to unauthorized access and potential data loss. It’s important to note that this detection does not confirm malicious activity on its own; legitimate use of the FastViewer tool may also trigger this alert.

  ### Investigation Steps

  - **Examine outbound connections to FastViewer domains**: Check for security logs related to outbound network connections, specifically looking for connections to `*.fastviewer.com`. Relevant logs include Windows Security Event ID 5156 (Windows Filtering Platform) and network connection logs.

  - **Identify the initiating processes**: Review Sysmon Event ID 3 to identify the process that initiated the connection to FastViewer. Look for processes outside of known legitimate ones (e.g., `fastviewer.exe`), which may indicate suspicious activity.

  - **Correlate with user activity**: Query user interaction logs to see if there’s legitimate activity (e.g., support sessions) correlating with the connection times. Legitimate activity should show expected user behavior, such as applications for customer support or IT maintenance.

  - **Assess host role and criticality**: Determine the importance of the affected asset. If the connection originates from a sensitive system (e.g., server or domain controller), prioritize accordingly.

  - **Look for additional indicators of compromise**: Monitor for other suspicious activities related to the time of the FastViewer connection, such as unusual file access or changes in service behavior (Sysmon Event ID 22).

  ### Prioritization

  This alert is of medium severity due to the risk of unauthorized administrative access through RMM tools, which are frequently exploited by attackers. The likelihood of malicious abuse is notable, as attackers often use such tools when they gain initial access. Remote management tools like FastViewer are commonly weaponized, making this alert a potential indicator of compromise.

  ### Blind Spots and Assumptions

  Detection limits include potential evasion by adversaries who may obfuscate their use of RMM tools or utilize legitimate accounts and practices. Reliable detection requires complete logging of network activities and filtering configuration to capture all outbound connections. Legitimate business activity, particularly during IT support or maintenance periods, may also trigger this alert. A related detection to enhance coverage is monitoring for abnormal internal connections initiated by legitimate RMM tools, as this can help distinguish between benign and malicious use.

