  ---

  ### Technical Context

  This rule detects network activity targeting FastViewer's Remote Management and Monitoring (RMM) service. Attackers may leverage such tools for unauthorized remote access to systems, often aiming to maintain control or exfiltrate data. This behavior fits into the MITRE ATT&CK framework under the tactic of Execution and technique T1219 (Remote Access Software).

  The primary telemetry sources include network connection logs from Windows systems that can provide details on outbound connections made to FastViewer's domains. If the detected activity is malicious, it may indicate that an adversary is attempting remote access or management of the endpoint without authorization. This detection alone does not confirm that malicious intent exists; legitimate usage of FastViewer within the organization can trigger the alert.

  ---

  ### Investigation Steps

  - **Verify destination hostname**: Check for connections to domains matching `*.fastviewer.com` or `fastviewer.com`. Use Windows Security Event ID 5156 (Windows Filtering Platform) or network logs to confirm. Look for the process responsible for the connection.

  - **Examine process details**: Identify the process that initiated the connection. Use Sysmon Event ID 1 for process creation. Benign usage typically involves known, internally approved applications; investigate any unknown or uncommon processes.

  - **Cross-reference user activity**: Review user activity for unusual behavior related to FastViewer access, such as remote sessions initiated outside of normal business hours or from unexpected locations. Reference Windows Security Event ID 4624 (Logon events).

  - **Check for established connections**: Look into previous successful connections to FastViewer within a short time frame. Use Windows Event ID 517 (Connection established logs) and compare against user roles and typical behavior.

  - **Review related security policies**: Confirm if FastViewer usage aligns with existing security policies and if there are any exceptions for remote access tools. Document these justifications for the sake of clarity.

  - **Identify additional artifacts**: If applicable, determine if any files or directories were created or modified during the time of connection, suggesting potential malicious file transfer. Validate with file system logs (e.g., Sysmon Event ID 11 for file creation).

  ---

  ### Prioritization

  The severity of this alert is medium due to its potential impact on secure systems, particularly if critical assets are affected. The likelihood of malicious usage is moderate, especially in environments where unauthorized remote access tools may be weaponized by attackers. FastViewer is common in remote support scenarios, making context essential in triage.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of FastViewer within the organization, potentially leading to false positives. It is crucial to ensure that relevant network logging is enabled and that all necessary domains are monitored appropriately. Activities such as remote support from IT personnel may trigger this alert legitimately. Strengthening coverage could involve complementary detection of unauthorized outbound connections through comprehensive network monitoring tools.

