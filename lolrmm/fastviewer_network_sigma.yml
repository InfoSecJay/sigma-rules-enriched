  ### Technical Context

  This rule detects network activity associated with the FastViewer remote management and monitoring (RMM) tool. Attackers may use legitimate remote access software for either ongoing remote control of compromised systems or for lateral movement within a network. The relevant MITRE ATT&CK tactic is "Execution," and the technique is "Remote Services: Remote Access Software (T1219)." The primary telemetry sources include network connection logs detailing DNS requests and outbound connections, specifically focusing on any traffic directed to FastViewer's domains. If detected as malicious, this activity could indicate unauthorized access or control over endpoints. This detection does NOT confirm malicious intent on its own, as legitimate usage of FastViewer may also trigger it.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Examine logs for outbound connections to `*.fastviewer.com` or `fastviewer.com` (Event ID: 5156 for Windows Filtering Platform logs). Note legitimate traffic from known IT support personnel versus unexpected internal systems.

  - **Analyze the host activity:** Check recent process creation logs (Sysmon Event ID 1 or Security Event ID 4688) on the endpoint for any unusual processes related to FastViewer, such as `FastViewer.exe` or other non-standard process names running concurrently.

  - **Check for user account activity:** Query for recent logins or session activity associated with user accounts that show FastViewer usage, focusing on Event ID 4624 (successful logon). Validate if the logged-in user has a legitimate business case for using this remote access tool.

  - **Identify highlighted indicators of compromise (IOC):** Look for signs of user account privilege escalation or abnormal logon times from unusual source IPs that coincide with FastViewer usage. Patterns from Event ID 4625 (failed logon) may indicate brute force attempts prior to legitimate access.

  - **Assess prior organizational controls:** Review existing documentation or policies around the use of remote access tools like FastViewer. Cross-validate logs against approved usage to better distinguish between legitimate and suspicious activity.

  - **Examine DNS query logs:** Investigate DNS requests to determine if there was a resolution to FastViewer’s domains. An unexpected connection attempt from critical systems (servers, domain controllers) could indicate misuse.

  ---

  ### Prioritization

  This alert is considered medium severity due to the potential risk of unauthorized access to sensitive systems. The likelihood of malicious use increases if the traffic is found from systems that typically do not use FastViewer for remote management. Given that RMM tools are often weaponized by attackers, close attention is warranted on suspicious behaviors surrounding these alerts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed logging for legitimate FastViewer activities or misconfigured network settings. There could be false positives from authorized IT operations leveraging the tool for support. Organizations need to ensure full network logging is enabled to detect a broader range of remote software tools, thereby correlating events across multiple detections, such as unusual user behavior in conjunction with the use of remote desktop protocol (RDP) (T1076).

