note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the FastViewer remote management tool, which can indicate command-and-control (C2) communication or unauthorized remote access. The likely attacker objective is to maintain persistence and control over compromised systems, allowing for potential data exfiltration or lateral movement. This behavior corresponds to the MITRE ATT&CK tactic of Command and Control (TA0011) and specifically techniques T1219 (Remote Access Software).

  The primary telemetry sources for this detection are Windows network connection logs, particularly focusing on connections to domains associated with FastViewer (e.g., `*.fastviewer.com`). If malicious, the potential security impact includes unauthorized system access and data compromise. However, the detection of such connections does NOT confirm malicious activity on its own, as legitimate instances of FastViewer usage may trigger this alert.

  ### Investigation Steps

  - **Check network connection logs:**
    Review Windows network event logs (Event ID 5156) for outbound connections to FastViewer domains. Identify the source IPs and associated processes to ascertain if they belong to known trusted applications.

  - **Identify the process generating connections:**
    Examine the process responsible for establishing the connection. Look for Event ID 4688 (Process Creation) to track the creation of any unexpected processes that might be associated with the network activity.

  - **Review other simultaneous connections:**
    Investigate for other network connections initiated from the same host around the same timeframe to determine if they are linked to other high-risk domains or IP addresses previously identified in malicious activity.

  - **Determine legitimacy of FastViewer usage:**
    Confirm whether the use of FastViewer aligns with organizational policies. Authorized users may also provide documentation or justification for remote access tool usage.

  - **Monitor for abnormal traffic patterns:**
    Analyze bandwidth utilization to FastViewer domains. Unusual spikes in traffic or connections from non-administrative user accounts may indicate malicious intent.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact of remote access on critical systems and operations. The likelihood of malicious abuse is significant, as remote access tools can be weaponized for various attack vectors. Moreover, while legitimate connections can occur, they must be scrutinized to mitigate risks.

  ### Blind Spots and Assumptions

  This detection may have limitations, as sophisticated adversaries could use encryption or other methods to obfuscate their connections to FastViewer. Required log sources include comprehensive Winsock logs and firewall logs retaining destination address details. Legitimate activities, such as IT support using FastViewer, may trigger alerts if not properly whitelisted. An associated detection to consider is monitoring for unauthorized execution of remote access tools or other anomalies on the network, enhancing overall threat visibility.

