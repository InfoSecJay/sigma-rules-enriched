note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the FastViewer Remote Monitoring and Management (RMM) tool. FastViewer is often employed for remote access and administration tasks; however, malicious actors may use it for unauthorized access, persistence, and lateral movement within a network. The detection focuses on any outbound connections to FastViewer-related domains, which may indicate that attackers are leveraging this software for nefarious purposes.

  Given that FastViewer can facilitate remote desktop access, the likely objectives of an attacker utilizing this tool include evading detection, maintaining persistence within the network, or managing compromised devices. The relevant MITRE ATT&CK tactics include `Execution` (T1203: Exploitation for Client Execution) through the use of malicious remote utilities and potential `Command and Control` (T1219: Remote Access Tools) tactics, as they may rely on FastViewer for remote management of compromised systems.

  To effectively monitor for this activity, primary data sources should include network connection logs that capture outbound traffic, specifically logging any connections to FastViewer-related hostnames. This telemetry can provide critical insights into unauthorized usage patterns.

  ### Investigation Steps
  - **Review Network Connection Logs**: Examine logs for any connections to `*.fastviewer.com` or `fastviewer.com`. Identify the source IPs, destination ports, and timestamps of these connections.

  - **Correlate with User Activity**: Investigate the accounts or systems initiating these connections. Look for unusual access patterns or users who typically should not be using remote administration tools.

  - **Identify Remote Desktop Sessions**: Check for other indicators of remote access activity, such as Remote Desktop Protocol (RDP) logs or VPN connections that align with the times of the FastViewer detections.

  - **Analyze Endpoint Behavioral Logs**: Review logs from endpoint detection and response (EDR) solutions for any associated behaviors, such as process creation events linked to FastViewer or similar remote management applications.

  ### Prioritization
  This alert is assigned a medium severity due to the potential impact of unauthorized remote access, which could lead to data breaches or system compromise. The likelihood of this alert being a true positive is moderate, given the prevalence of legitimate FastViewer usage for remote support.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage lies in legitimate uses of FastViewer by authorized personnel, which may generate numerous false positives. The detection logic assumes that any connection attempt to FastViewer domains is suspicious, potentially overlooking benign administrative access. Furthermore, the rule relies on comprehensive logging of network connections, which must be correctly configured to capture outbound traffic to recognize these events effectively.

