note: |
  ### Technical Context

  This Sigma rule detects network activity related to the FastViewer Remote Management and Monitoring (RMM) tool by monitoring DNS resolution or connection attempts to FastViewer-owned domains. Attackers may utilize this tool to gain unauthorized access to systems, primarily aiming to control and manipulate endpoints for data exfiltration or lateral movement. This detection corresponds to the MITRE ATT&CK technique T1219: Remote Access Software.

  The primary telemetry source is Windows network connection logs, specifically looking for DNS requests or outbound connections to domains ending in `*.fastviewer.com`. If malicious, the use of this tool can lead to severe breaches, allowing attackers to remotely control affected devices. However, this detection does NOT confirm malicious intent on its own, as FastViewer could be used legitimately for remote support operations.

  ### Investigation Steps

  - **Check for DNS resolution logs:** Review Windows Event ID 4688 for processes that have resolved FastViewer domains. Analyze the `ProcessName`, `CommandLine`, and `ParentProcessId` fields to identify if the connection correlates with known FastViewer processes.

  - **Monitor outbound connection activity:** Inspect the network connection logs for native Windows Event ID 5156 to check if an outbound connection matches `fastviewer.com`. Compare timestamps with other suspicious activity on the affected host.

  - **Identify process legitimacy:** Validate if known legitimate FastViewer processes (e.g., `FastViewer.exe`) are running. Cross-reference with Process Monitor logs or Sysinternals tools to differentiate between expected FastViewer usage and potential unauthorized instances.

  - **Compare traffic patterns:** Review your network traffic flow monitoring (e.g., NetFlow or Windows Event ID 51504) to assess the volume and frequency of connections made to FastViewer domains. Unusual spikes or unauthorized systems may indicate malicious use.

  - **Search for user context:** Correlate the event with user activity logs, such as Event ID 4624 (successful logon events), to establish whether the user initiating the connection has an appropriate business need or history.

  ### Prioritization

  The alert severity is medium due to the potential for unauthorized remote access to critical systems. The likelihood of abuse is significant, especially if attackers leverage publicly accessible RMM tools. FastViewer is commonly weaponized for quick remote access and command execution in compromised environments.

  ### Blind Spots and Assumptions

  This detection might miss malicious usage if an attacker disguises their activity under legitimate network traffic or employs TLS/SSL encryption to obscure communication. Reliable detection requires ensuring that logs for outbound connections and DNS resolutions are correctly configured and collected. Legitimate remote support activities, such as administrative access via FastViewer, may generate similar alerts and require careful context analysis. A related detection, such as monitoring for known remote access tools more broadly (e.g., T1219), can strengthen coverage against malicious remote access attempts.

