note: |
  ### Technical Context
  This detection rule identifies potential activities related to the Sorillus Remote Monitoring and Management (RMM) tool on Windows systems. The Sorillus RMM tool, used by IT professionals for system management, can also pose a threat when leveraged by adversaries for unauthorized access and control of systems within an enterprise environment. Attackers may utilize Sorillus to execute commands, harvest credentials, or perform lateral movement, ultimately aiming to establish persistence, exfiltrate data, or maintain a foothold within the network.

  The relevant MITRE ATT&CK tactics for this rule include **Execution (TA0002)**, which focuses on how adversaries run their malicious code on a system, and **Command and Control (TA0011)** when the tool is used for remote manipulation of compromised machines. The technique associated with this tool is **Indicator Removal on Host (T1219)**, as it may attempt to mask its activities to avoid detection.

  The primary data sources useful for this detection include **process creation logs** from Windows Event Log (Event ID 4688), which record process-related activities including executable paths, parent-child relationships between processes, and the command-line arguments. This information is critical for identifying suspicious execution patterns associated with Sorillus.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for Windows Event ID 4688 to identify instances where "Sorillus-Launcher*.exe" or "Sorillus Launcher.exe" are executed. Focus on the parent-child relationships to determine if the execution originates from legitimate processes or other suspicious activities.

  - **Correlate with User Activity:** Check the user context under which the Sorillus processes run. Look for anomalies such as unauthorized admin accounts or unusual times of execution that deviate from normal operational patterns.

  - **Assess Network Connections:** Analyze any outbound network connections initiated by Sorillus processes to identify potential command and control (C2) communications. This can include reviewing firewall logs or proxy logs for unusual destination IPs or domains.

  - **Identify Similar Artifacts:** Search for other indicators of compromise associated with Sorillus usage, such as associated configuration files, scheduled tasks, or modifications to system files that could indicate an installation or ongoing use of the tool.

  ### Prioritization
  The alert is categorized as medium severity due to the potential for significant impact on enterprise environments, especially if Sorillus is used by malicious actors to gain control over systems. Additionally, the likelihood of encountering this threat increases in environments where RMM tools are used, necessitating vigilant monitoring.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to the legitimate use of the Sorillus tool by internal administrators, which can generate false positives. The detection logic assumes that the tool is being used outside of normal operational procedures, and might not capture instances where processes are executed in legitimate scenarios. Furthermore, proper logging settings must be enabled for process creation events to ensure that relevant data is captured, and any changes to the tool’s naming conventions may lead to detection failures.

