note: |
  ### Technical Context

  This Sigma rule detects process creation related to the Sorillus RMM tool, specifically targeting files named either "Sorillus-Launcher" or "Sorillus Launcher." The primary attacker objective in utilizing the Sorillus RMM tool typically involves remote management of compromised devices as part of a broader command and control (C2) strategy. This detection aligns with the MITRE ATT&CK tactic of "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1219).

  The primary telemetry sources include Windows Security Event ID 4688, which logs process creation events, and potentially Sysmon Event ID 1 if deployed. If this behavior is malicious, it could indicate unauthorized remote access and control over systems, posing a significant risk to the integrity and confidentiality of enterprise data. This detection does NOT confirm compromise on its own; further investigation is required to determine the context of the Sorillus usage.

  ### Investigation Steps

  - **Check Security Event Logs:** Review Windows Security Event ID 4688 for process creation entries involving "Sorillus-Launcher*.exe." Note the user account associated with these processes; legitimate usage may include administrative accounts performing maintenance tasks.

  - **Verify Parent-Child Process Relationships:** Examine logs for the parent process name associated with the Sorillus RMM tool execution. If the parent process is a known remote management tool in legitimate use (e.g., a widely-used IT management application), it may indicate benign activity.

  - **Assess Process Execution Location:** Validate the execution path for the identified Sorillus RMM processes. Legitimate installations often reside within 'C:\Program Files' or similar directories; execution from unusual directories (e.g., user profile folders or temporary directories) may signify malicious intent.

  - **Cross-reference with Recent Activity:** Look for any recent logins or administrative activity on the affected system that corresponds to the process creation times. A sudden spike in use may indicate an unauthorized user is exploiting the tool.

  - **Review File Integrity on Affected Assets:** Inspect for additional artifacts or related file creations in the same directory as Sorillus. Unexpected registry entries or abnormal network connections initiated by the executable can be higher confidence indicators of malicious use.

  ### Prioritization

  The severity of this alert is considered medium due to the potential impact on sensitive systems managed with Sorillus. Although this tool may serve legitimate purposes in remote management, its common misuse by adversaries drives the need for careful analysis of the triggered alerts. Close monitoring is warranted, given that such remote access methods are frequently weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  Detection may be limited in environments lacking Sysmon or where Windows event logs are not sufficiently preserved. Legitimate operations may trigger this alert, particularly during scheduled maintenance or authorized remote management sessions. A companion rule analyzing unusual network traffic patterns emanating from the system could provide additional context to verify the legitimacy of the detected process activity.

