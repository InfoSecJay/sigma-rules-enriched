note: |
  ### Technical Context

  This Sigma rule detects process creation initiated by the Sorillus RMM (Remote Monitoring and Management) tool, particularly instances where processes have a parent-child relationship with the Sorillus Launcher executable. The likely objective is for an attacker to gain remote access to and control over systems under the guise of legitimate RMM operations. This activity aligns with the MITRE ATT&CK technique T1219 - Remote Access Software.

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 for process creations. The potential security impact of malicious use includes unauthorized access to sensitive systems and data exfiltration. However, this detection does NOT confirm malicious intent without further context or supporting evidence of compromise.

  ### Investigation Steps

  - **Identify System Context**: Check the role of the affected host (e.g., server, workstation). Legitimate RMM tools have expected usage on support or system administrator desktops.

  - **Review Process Creation Events**: Analyze Security Event ID 4688 for instances where process creation events show 'Image' fields containing 'Sorillus-Launcher*.exe'. Ensure to document the ParentImage field for context.

  - **Examine Process Arguments**: For the identified Sorillus processes, review the command line arguments used by analyzing the Process command line (if available) to ensure they do not indicate unusual activity, such as unexpected remote connections.

  - **Query for Historical Data**: Check for previous occurrences involving Sorillus-related processes within the last 30 days. This may highlight patterns consistent with legitimate administrative use or potential abuse.

  - **Audit Source Trustworthiness**: Validate the legitimacy of the source of 'Sorillus-Launcher*.exe' through hash checks against known good signatures or verified software repositories.

  - **Correlate with Network Traffic**: Look for associated outbound connections (e.g., to known C2 domains) initiated by the processes related to Sorillus RMM to identify potential malicious activity.

  ### Prioritization

  The alert is of medium severity in an enterprise context due to the potential impact of an RMM tool being exploited for unauthorized access. Given that RMM tools are commonly weaponized by adversaries for lateral movement and data access, the likelihood of malicious abuse is significant, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection is limited if logging for process creation (Event ID 4688) is not enabled across all endpoints. Adversaries may also use file-based evasion techniques to disguise their activity. Furthermore, legitimate uses of Sorillus RMM may trigger this alert, complicating investigations. Related detections to consider include monitoring for unusual outbound traffic patterns from devices potentially utilizing Sorillus RMM functionalities.

