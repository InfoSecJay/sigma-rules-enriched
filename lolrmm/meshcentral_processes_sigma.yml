note: |
  ### Technical Context
  This detection rule identifies potential process activity related to the MeshCentral remote management tool, which can be utilized for legitimate system administration as well as for malicious purposes by an attacker. This behavior may signify unauthorized remote control over systems within an enterprise environment, potentially leading to data exfiltration, system manipulation, or lateral movement within the network. The likely objectives of an attacker using MeshCentral include establishing persistence, maintaining access to compromised systems, or facilitating further attacks.

  Relevant MITRE ATT&CK tactics include **Execution (TA0002)**, as the rule observes process creation events associated with the tool. The technique associated with this behavior is **Remote Services: Remote Desktop Protocol (T1219)**, indicating a usage of remote management capabilities. The detection is primarily based on monitoring Windows process creation logs, which are essential for identifying the execution of potentially unauthorized processes.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine process creation logs for instances where `meshcentral*.exe` or `meshagent*.exe` is executed, noting the parent processes and the user accounts associated with these activities.
  - **Correlate with Legitimate Usage:** Check if the detected processes correspond with known legitimate use cases within your organization; addressing the context of the login and other related activities may help in validating or disproving the legitimacy.
  - **Analyze Network Communications:** Monitor network traffic for unusual connections that may indicate unauthorized MeshCentral analytics, focusing on outbound connections that could suggest remote control or command and control (C2) activity.
  - **Investigate User Behavior and Access:** Look for any anomalous user behavior, such as logins from unusual devices or locations, especially focused on accounts that may have initiated the MeshCentral processes.

  ### Prioritization
  This alert is categorized as medium severity due to the potential threat represented by unauthorized use of remote management tools. The risk posed by an attacker utilizing such tools can significantly impact the integrity, confidentiality, and availability of sensitive enterprise systems.

  ### Blind Spots and Assumptions
  Gaps in detection may include environments that do not log process creation events effectively or scenarios where legitimate uses of MeshCentral obscure malicious activity. The detection logic assumes that any execution of the specified executables is suspicious; however, legitimate administrative functionality could result in false positives if not properly contextualized. For the alert to function correctly, comprehensive logging of process creation events must be enabled within the Windows security configuration.

