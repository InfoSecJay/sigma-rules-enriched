note: |
  ### Technical Context

  This rule detects the creation of processes associated with the MeshCentral Remote Management Tool (RMM), specifically looking for processes with names that start with "meshcentral" or "meshagent." The likely objective of an attacker using MeshCentral is to remotely control or manage systems within an enterprise network, often for malicious purposes such as exfiltration, lateral movement, or establishing a foothold. This behavior aligns with the MITRE ATT&CK technique for "Remote Service Session Hijacking" (T1219) under the Execution tactic.

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture detailed information about newly created processes. If observed in a malicious context, this behavior can severely impact the security posture of an organization, enabling unauthorized access and control over endpoint systems. Importantly, this detection does NOT confirm malicious intent on its own, as MeshCentral can also be utilized legitimately.

  ### Investigation Steps

  - **Review process details**: Examine Security Event ID 4688 or Sysmon Event ID 1 logs for the creation of any process with names ending in "meshcentral.exe" or "meshagent.exe." Note the parent process to assess the context of execution.

  - **Validate parent process**: Identify the parent process of any detected MeshCentral executables. If the parent process is an unusual system process or unrelated third-party tool, it may indicate potential misuse.

  - **Check user context**: Investigate the user account that triggered the process creation. If the user has a known administrative role or belongs to a group responsible for remote management, confirm the legitimacy of their actions.

  - **Identify network connections**: Review network connection logs, such as Windows Firewall logs or Sysmon Event ID 3, for outbound connections from MeshCentral processes to external IPs. Be wary of connections to unknown or suspicious addresses, especially if initiated by user accounts not typically engaging in RMM activities.

  - **Cross-reference with asset inventory**: Compare the device ownership and role against your asset inventory to assess whether legitimate administrative activities align with the detected behavior. Legitimate use should correlate with known authorized asset management practices.

  - **Look for file creation artifacts**: Check for any file creation or changes associated with MeshCentral, particularly in temp directories or user profile directories. Files created by unexpected or unauthorized users may signify malicious intent.

  ### Prioritization

  This alert warrants medium severity due to its potential for malicious abuse by adversaries leveraging remote management tools. Systems affected, especially those with high administrative privileges, pose a more significant risk if compromised. Although this behavior can be legitimate, the rising trend of using RMM tools for exploitation increases the urgency of investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if MeshCentral is uninstalled or its processes renamed as part of obfuscation techniques by adversaries. It is critical to ensure that appropriate logging for process creation and network activity is enabled to maintain coverage. Legitimate uses may arise from trusted IT departments conducting remote administration. Companion detections, such as monitoring for changes in Group Policy or unauthorized software installations, can strengthen overall security posture against this threat vector.

