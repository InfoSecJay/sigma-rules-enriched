note: |
  ### Technical Context

  This rule detects process activity attributed to the Freshservice RMM tool, including specific executables that may indicate remote monitoring or management activities. The likely attacker objective may involve unauthorized system access or data exfiltration via the Freshservice platform. The relevant MITRE ATT&CK tactics and techniques include "Command and Control" (TA0011) and "Remote System Discovery" (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, which logs new process invocations. If malicious, the security impact could be significant, as it suggests potential unauthorized monitoring or management of endpoints. However, this detection does not confirm malicious intent on its own, as legitimate operations of the Freshservice tool could trigger the alert.

  ### Investigation Steps

  - **Check the process lineage**: Review the parent process of any triggering events (Event ID 4688). Look for legitimate parent processes like `Freshservice.DiscoveryProbe.ScanService.exe` or `FSAgentService.exe`. Malicious activity may show unusual or unauthorized parent processes, which are not part of expected Freshservice operations.

  - **Examine running services**: Use Windows Service Management (services.msc) to identify the status of Freshservice services like `FSAgentService` or `FSAgentAutoUpdate.exe`. Ensure only authorized services are running; unrecognized or stopped services may indicate tampering.

  - **Inspect network connections**: Review TCP connections involving the detected processes using netstat -ano or Sysinternals' TCPView. Check for unexpected external IP addresses or domains, indicating potential command and control activity.

  - **Identify scheduled tasks**: Look for any scheduled tasks associated with the detected processes using Task Scheduler. Legitimate Freshservice usage may showcase tasks for regular update checks, while unauthorized tasks might have irregular execution patterns or schedules.

  - **Correlate additional logs**: Search for recent logins and user activity in Security Event IDs 4624 (Logon) and 4625 (Failed logon) to see if suspicious accounts are involved during the time of the alert. Identify any accounts that do not align with authorized personnel.

  ### Prioritization

  Based on the impact of the affected system and the potential for malicious abuse of RMM capabilities, this alert is considered of medium severity. The Freshservice tool is frequently used in enterprises, making it a relevant target for exploitation by adversaries, indicating it should be prioritized for review.

  ### Blind Spots and Assumptions

  This detection may have limitations in identifying legitimate administrative activities that involve Freshservice. Evasion techniques could involve obfuscation of the process names or redirection through other legitimate services. Reliable detection requires comprehensive logging, including process creation events and service monitoring. A related detection that strengthens coverage is the monitoring of unusual remote logins or RMM tool usage across multiple devices.

