note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Freshservice Remote Monitoring and Management (RMM) tool. The behavior indicates potential administrative or automated system management activities, possibly aimed at system enumeration or maintenance, aligning with the attack execution tactic (MITRE ATT&CK Tactic: Execution, Technique: Remote Service Session Enumeration - T1219). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture process execution, parent-child relationships, and command-line arguments.

  If an adversary is manipulating these processes, the security impact could include unauthorized access to managed systems, data exfiltration, or malicious software deployment under the guise of legitimate management tasks. However, this detection alone does not conclusively indicate malicious intent; legitimate usage of Freshservice by authorized personnel may trigger similar alerts.

  ### Investigation Steps

  - **Verify process origin**: Examine the process creation logs (Event ID 4688) for the detected processes (e.g., `FSAgentService.exe`, `plink.exe`). Confirm that the parent process is a legitimate Freshservice component like `Freshservice.DiscoveryProbe.ScanService.exe` or `Freshservice.DiscoveryProbe.Window.exe`.

  - **Check for unusual command-line arguments**: Review the command-line fields associated with the detected processes for indicators of misuse (e.g., the presence of obfuscation, unexpected arguments). Legitimate use typically has recognizable and standard parameters.

  - **Correlate with user activity logs**: Investigate user logins (Event ID 4624) around the time of the alert to assess if the process executions correspond with authorized administrative access. Unfamiliar or unauthorized users executing these processes may indicate potential misuse.

  - **Review scheduled tasks and services**: Examine the Task Scheduler and Services console (`services.msc`) for scheduled tasks or services related to Freshservice. Verify if these are expected in the environment, noting that unauthorized tasks could signal malicious activity.

  - **Look for accompanying network activity**: If available, analyze network traffic logs (such as proxy, firewall, or IDS logs) for connections to unusual external IPs following process execution. Regular RMM activity generally connects to designated management endpoints.

  - **Identify recent software updates**: Check logs for any recent updates or installations of Freshservice components that may flag new legitimate usage, which can explain recent alerts without indicating malicious behavior.

  ### Prioritization

  This alert has medium severity due to the potential for system compromise if malicious activity is confirmed. The affected systems likely have critical functions in IT operations. While legitimate use exists, the processes associated with Freshservice can be weaponized for system manipulation and unauthorized access.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that also leverage the Freshservice tool, potentially leading to false positives. Comprehensive monitoring requires proper log collection configurations, including Security Event logs and Sysmon. This rule is strengthened by companion detections for other process execution behaviors associated with RMM tools, which can provide additional context for investigation. Specific network traffic anomalies or patterns should also be monitored to aid in identifying malicious use.

