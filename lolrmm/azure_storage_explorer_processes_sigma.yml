note: |
  ### Technical Context
  This detection rule identifies potential malicious activity associated with the Azure Storage Explorer application, particularly when its process is initiated under unexpected circumstances. Azure Storage Explorer is often used for legitimate activities involving Azure cloud data storage, but it can be leveraged by attackers for Remote Monitoring and Management (RMM) purposes to exfiltrate or manipulate data stealthily. In organization contexts, an attacker may utilize Azure Storage Explorer to access sensitive data, create unauthorized backups, or manage cloud resources without triggering traditional alerts.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection include **Execution** (TA0002) and **Remote Services** (T1219), which outline ways attackers might execute their payloads or remotely manage systems. The primary data source for this detection will be process creation events logged by Windows, which capture details about process invocations and their parent-child relationships, aiding in the identification of potentially suspicious activity stemming from legitimate tools.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation events to identify any instances where the Azure Storage Explorer (`StorageExplorer.exe`) is launched unexpectedly, especially from atypical parent processes.
  - **Analyze Parent Process Relationships**: Investigate the parent process data for the instances detected by this rule, focusing on any unusual or unauthorized applications initiating Azure Storage Explorer.
  - **Collect User Activity Logs**: Gather logs from user activity on affected machines, looking for any anomalous interactive sessions or scheduled tasks that could suggest misuse of Azure Storage Explorer for RMM purposes.
  - **Cross-reference with Access Logs**: Compare the identified process activity with Azure Activity Logs or other cloud access logs to check for unauthorized access attempts or modifications to storage resources during the detected process activity.

  ### Prioritization
  The severity of this alert is considered medium due to the potential for significant data compromise and the frequency of legitimate Azure Storage Explorer usage in enterprise environments, which raises the likelihood of false positives. However, the risk associated with unauthorized access to cloud resources necessitates timely investigation.

  ### Blind Spots and Assumptions
  This detection rule may miss instances where Azure Storage Explorer is executed legitimately or in benign contexts, given its common use for cloud management tasks. It assumes that the telemetry available includes adequate logging of process creation events and parent-child process relationships. If process creation logging is not adequately configured, this rule could lead to gaps in detection coverage. Additionally, the detection logic does not account for renamed or packed versions of the Azure Storage Explorer executable that may be used by attackers.

