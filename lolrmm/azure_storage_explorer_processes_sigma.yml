  ---

  ### Technical Context

  This rule detects instances where processes are spawned with the parent image named "StorageExplorer.exe," indicating potential usage of the Azure Storage Explorer as a remote management tool. Attackers may leverage this tool to interact with Azure resources without raising immediate suspicion from security monitoring systems, potentially aiming to exfiltrate, modify, or delete sensitive data within Azure storage accounts. The associated MITRE ATT&CK technique is **T1219: Remote Access Software**.

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on security Event ID 4688, which records details about newly created processes, including their parent-child relationships. If malicious, the security impact includes unauthorized access to Azure resources, which could lead to data breaches or loss of confidentiality and integrity. However, this detection alone does not confirm malicious activity, as legitimate use of Azure Storage Explorer is common among IT and development teams.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Examine Windows Security Event ID 4688 logs for processes initiated from `StorageExplorer.exe`. Validate the command line arguments for flags that indicate anomalous behavior, such as connections to unknown Azure accounts or regions not typically accessed.

  - **Correlate with Azure Activity Logs**: Check Azure activity logs to identify if any suspicious actions (e.g., unusual data access, modifications, or deletions) coincided with the process creation events. Look for operations performed around the same timestamp as the detected process activity.

  - **Validate user context**: Identify the user account associated with the detected process and assess its typical activities. Review potential deviations from normal behavior, such as access to systems or resources the user typically does not handle.

  - **Identify legitimate usage**: Confirm if the usage of Azure Storage Explorer is documented within your organization’s processes for allowed users and roles. Check if proper authorization and user training are in place for Azure Resource access.

  - **Look for common evasion patterns**: Investigate if the detected process was part of a known legitimate Azure Storage Explorer client or if it appears to deviate from expected file paths or signatures that indicate a possible tampered version.

  - **Check for sensitive file manipulation**: Monitor for any file-handling actions linked to the execution of Storage Explorer, using Event ID 4663 for object access (e.g., file deletions, modifications, or creations) that could indicate unauthorized data handling.

  ---

  ### Prioritization

  This alert should be classified as medium severity due to the potential risk to sensitive Azure resources tied to process activities. The likelihood of malicious abuse is moderate, as legitimate use cases do exist, but attackers may commonly exploit such tools as part of advanced persistent threats, making close inspection critical.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by users unintentionally triggering alerts due to legitimate use of Azure Storage Explorer, especially if organizations lack strict usage policies. Ensure logging of all relevant Windows events is enabled, particularly around process creation and Object Access logs. Related detections could include alerts for abnormal Azure AD logins or unusual cloud activity that complements this detection, such as unauthorized modifications in resource groups.

