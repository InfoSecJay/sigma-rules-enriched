note: |
  ### Technical Context

  This rule detects file activity associated with the Level RMM tool, specifically targeting file interactions with executables and log files. Attackers may use this tool to establish remote access and manipulate systems, making their objective potentially malicious if used without authorization. The relevant MITRE ATT&CK tactic is **Execution**, with the technique ID being **T1219: Remote Access Software**. The primary telemetry sources include Windows file events, particularly changes or access events logged for specific files. If malicious, this behavior can lead to unauthorized system control and data exfiltration. It is important to note that this detection does NOT confirm unauthorized use on its own, as legitimate operations of the Level RMM tool on managed systems may produce similar activity.

  ### Investigation Steps

  - **Review recent file access events:** Examine Security Event ID 4663 for accesses to `C:\Program Files\Level\level.exe`, `C:\Program Files\Level\osqueryi.exe`, and `C:\Program Files\Level\level.log`. Focus on successful access by non-administrative users during unusual hours, which may indicate malicious use.

  - **Validate process creation events:** Check Sysmon Event ID 1 for new instance creation of `level.exe` or `osqueryi.exe`. Look for indications of unusual parent processes, such as `cmd.exe` or `powershell.exe`, which are often seen in malicious workflows.

  - **Analyze network connections:** Use Network Event Logs or Windows Firewall logs to identify any outbound connections initiated by `level.exe`. Unexpected IP addresses or connections on uncommon ports can signal potential exfiltration attempts.

  - **Identify legitimate use cases:** Confirm if the Level RMM tool is installed and expected in environment. Review known scheduling tasks or operational documentation which illustrate expected file access patterns.

  - **Monitor log file changes:** Check Event ID 4656 to verify any modification events for `level.log`. Legitimate uses will usually involve recent timestamps that align with scheduled maintenance or specific administrative tasks.

  - **Correlate with other detection mechanisms:** Ensure this detection aligns with additional telemetry related to screen sharing or remote control applications. Coverage from endpoint detection systems can help identify simultaneous behaviors typical of an intrusion attempt.

  ### Prioritization

  This alert has medium severity since it relates to a tool that can be abused for remote access and operations that can compromise system integrity. The likelihood of malicious use increases if the affected system is critical or if the activity occurs outside of normal operational parameters, making it a significant concern.

  ### Blind Spots and Assumptions

  The detection may have blind spots due to legitimate uses of the Level RMM tool that might trigger the alert without malicious intent. Reliable detection requires comprehensive logging configurations to capture all necessary file activity. Additionally, legitimate administrative tasks may also invoke this rule, necessitating contextual analysis. A related detection to enhance coverage would include monitoring for suspicious remote access software installations or modifications across the enterprise environment.

