  ---

  ### Technical Context

  This rule detects potential file activity associated with the Level Remote Monitoring and Management (RMM) tool, specifically targeting executables and log files typical of remote management operations. The likely attacker objective is to utilize compromised RMM tools to perform unauthorized activities, such as remote control and system manipulation. This detection aligns with the MITRE ATT&CK technique Execution (T1219).

  Primary telemetry sources include Windows file event logs, specifically looking for events related to access or modifications of the targeted filenames: `level.exe`, `osqueryi.exe`, and `level.log`. The security impact is significant; malicious use of RMM tools can lead to wider network compromise and data exfiltration. However, it is crucial to note that this detection does NOT confirm malicious activity on its own since the presence of these files can also be legitimate, indicating standard operations of the Level tool.

  ---

  ### Investigation Steps

  - **Verify file activity on target paths:** Check Windows Security Event ID 4663 for access to `C:\Program Files\Level\level.exe`, `osqueryi.exe`, or `level.log`. Legitimate activity might show regular access patterns associated with authorized IT operations.

  - **Analyze process creation events:** Review Sysmon Event ID 1 to see if the Level executables were spawned with unusual parameters or unusual parent processes. Malicious indicators include unexpected parent-child relationships or the use of command-line arguments typically associated with exploitation.

  - **Correlate network connections:** Inspect Security Event ID 5156 or Windows Filtering Platform logs for outbound connections initiated by `level.exe` or `osqueryi.exe`. Legitimate behavior may involve connections to known IPs for management tasks; suspicious connections, especially to unfamiliar or geographic locations, warrant further analysis.

  - **Check for unauthorized logins:** Review Security Event ID 4624 for logins associated with the execution time of the Level tool. High-risk behavior includes logins from unexpected user accounts or during unusual hours, which could indicate misuse of the RMM tool.

  - **Assess file modifications:** Monitor for any significant changes to `level.log`, particularly unexpected entries indicating unauthorized configurations or access attempts. Malicious actors may manipulate this log to cover their tracks.

  ---

  ### Prioritization

  This alert carries medium severity, as the affected system's criticality depends on its role in the environment; RMM tools are often deployed across multiple endpoints. The likelihood of malicious abuse is moderate to high given that compromised RMM access can lead to broader network threats. The behavior is not commonly weaponized but does pose a significant risk if weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative activities triggering the alert when authorized personnel use the RMM tool. Required log sources for reliable detection must include comprehensive file access and security event logging. Additionally, legitimate software updates or legitimate remote support sessions may trigger the detection, causing false positives. Companion detections related to abnormal network behavior or credential accesses, such as suspicious logins (T1078), would enhance overall threat coverage.

