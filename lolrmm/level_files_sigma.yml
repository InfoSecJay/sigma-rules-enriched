note: |
  ### Technical Context

  This Sigma rule detects file activity associated with Level RMM, a remote monitoring and management tool that can be used by both legitimate system administrators and malicious actors. The likely attacker objective includes using this tool to maintain persistence, exfiltrate data, or manipulate systems within the network after initial foothold is established. This relates to the MITRE ATT&CK tactic of Command and Control (ID: T1219).

  Primary telemetry sources include Windows file access events, specifically for the executables and log files associated with Level RMM. If exploited maliciously, this tool can facilitate unauthorized remote access or manipulation of systems. However, this detection does NOT confirm malicious activity by itself; legitimate administrative use of the tool may also generate the same alerts.

  ### Investigation Steps

  - **Review file access logs for Level RMM executables:** Check Security Event ID 4663 for access to `C:\Program Files\Level\level.exe`, `osqueryi.exe`, and `level.log`. Confirm if the user accessing these files has a legitimate administrative role or if there's an unusual pattern.

  - **Investigate the timing of access events:** Look at the timestamps of the file access events. Legitimate administrative access is generally tied to regular business hours. Any access during off-hours or in tandem with other suspicious activities could indicate malicious intent.

  - **Identify unusual processes spawning from Level RMM files:** Examine Security Event ID 4688 for process creation logs associated with `level.exe`. Malicious instances may spawn unusual parent processes not typically associated with administrative tasks.

  - **Check for abnormal network activity:** Monitor network activity related to Level RMM using Windows Firewall logs for unusual outbound connections, particularly to unfamiliar IPs or domains that could indicate data exfiltration or command and control.

  - **Validate with user roles:** Cross-reference alerts with the user access level to ensure that only authorized personnel are using Level RMM. Analyze logs for any unexpected accounts accessing Level RMM files.

  ### Prioritization

  This alert should be considered medium severity due to the impact on critical systems managed by administrative tools. The likelihood of malicious abuse is moderate, given that this tool is commonly leveraged in both legitimate and nefarious contexts. Weaponization by attackers is plausible given its capabilities for remote manipulation.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate administrative activities to trigger alerts, leading to false positives. Required log sources must be enabled for complete visibility, including security event logs and detailed file access logs. Legitimate system updates or maintenance may also generate similar activity patterns. Companion detection rules that monitor network traffic for related command and control patterns can enhance overall detection efficacy.

