note: |
  ### Technical Context
  This detection rule identifies potential file activity related to the Level RMM (Remote Monitoring and Management) tool, which is often used for remote administration of systems. The rule focuses on specific file events associated with executable files and logs generated by this tool. Attackers may leverage legitimate RMM tools like Level to establish persistence, conduct reconnaissance, or execute commands on compromised systems, presenting a risk to network security and system integrity.

  The relevant MITRE ATT&CK tactics/techniques for this detection include **Execution (TA0002)**, which pertains to the execution of malicious code, particularly through the use of legitimate tools. The specific technique that aligns with this rule is **T1219: Remote Access Software**. Attackers utilizing these tools aim to manipulate systems stealthily, potentially leading to data exfiltration or lateral movement within the network.

  Primary data sources for detection include file event logs from Windows systems. These logs can provide insights into unauthorized or suspicious execution of the Level RMM executable files, as well as any modifications to associated log files that could indicate malicious activity.

  ### Investigation Steps
  - **Review File Events:** Examine the file event logs for the execution of `level.exe`, `osqueryi.exe`, and any modifications to `level.log`. Look for patterns indicating unusual usage or unexpected execution times.
  - **Correlate with User Activity:** Analyze the associated user accounts that triggered these file events. Investigate whether these accounts typically require the use of RMM tools, as anomalies may suggest unauthorized use.
  - **Check System Configuration:** Ensure that the Level RMM tool is configured correctly and not being abused. Look for any deviations from the standard configuration that could indicate compromise.
  - **Analyze Network Traffic:** If available, review network logs to identify any connections initiated by the Level RMM tool, especially those that communicate with external or untrusted IP addresses.

  ### Prioritization
  This alert is assigned a medium severity level because while the use of Level RMM tools can be legitimate, unauthorized or unexpected file activity poses a significant risk. It can signify a compromised system being used for malicious purposes, warranting prompt investigation.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include environments where Level RMM is not commonly used, which could lead to an increased number of false positives. The detection logic assumes that the listed files are indicators of unauthorized access; however, legitimate administrative tasks could also trigger these alerts. For the alert to function effectively, comprehensive logging must be enabled for file events on Windows systems, ensuring that all relevant activities are captured.

