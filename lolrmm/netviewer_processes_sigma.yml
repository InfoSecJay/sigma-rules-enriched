note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Netviewer Remote Management (RMM) tool. Typically, attackers may leverage RMM tools like Netviewer to gain unauthorized remote access or control over systems in a network, with the objective of data exfiltration, lateral movement, or executing further attacks. The relevant MITRE ATT&CK technique is Remote Access Software (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture the execution of processes. If malicious, this activity can enable an attacker to monitor, manipulate, or take control of affected systems, bypassing traditional security measures. Importantly, the detection of this activity does not confirm malicious intent on its own, as legitimate use of the Netviewer tool for remote support exists.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 logs for process creation timestamps and related parent process IDs. Look specifically for instances of `netviewer.exe` or any variations. Verify if the parent process is expected.

  - **Validate command line arguments:** Examine the command line details in the event log. Legitimate use often includes recognizable parameters related to remote support sessions. Unusual or obfuscated command lines may indicate malicious use.

  - **Correlate with user activity:** Look for user account activity around the time of the alert. User log-ins or actions preceding the event can provide context. Legitimate activity typically occurs during scheduled support hours.

  - **Identify potential persistence mechanisms:** Investigate the system for startup entries related to Netviewer, checking Registry keys (e.g., HKLM\Software\Microsoft\Windows\CurrentVersion\Run) to see if the application is set to launch on boot, which could indicate malicious intent.

  - **Search for network communication:** Analyze network logs for unusual outbound traffic from the system where the tool is detected, particularly to unknown or suspicious IP addresses, which may indicate data exfiltration or command-and-control activity.

  - **Check for known bad indicators:** Utilize threat intelligence feeds to identify if any of the observed IPs or domains are associated with known malicious actors or campaigns leveraging remote access software.

  ### Prioritization

  The severity of this alert is medium, due to potential data exposure and system compromise if Netviewer is misused. The likelihood of malicious abuse is moderate; while legitimate users may use RMM tools, their functionalities are often weaponized in adversarial scenarios.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers disguising the remote access tool as a legitimate process. Oversight in logs from non-standard installation paths can lead to missed detections. Legitimate IT support activities may generate similar alerts if remote support is common in the organization. A related detection to improve coverage would include monitoring for known remote access tools beyond just Netviewer, such as TeamViewer or AnyDesk, to capture broader RMM tool usage.

