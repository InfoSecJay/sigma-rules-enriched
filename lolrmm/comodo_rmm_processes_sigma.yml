note: |
  ### Technical Context

  This Sigma rule detects potential process activity associated with the Comodo Remote Management and Monitoring (RMM) tool, specifically the processes `itsmagent.exe` and `rviewer.exe`. The likely attacker objective could be to gain unauthorized remote access or control over a system, facilitating malicious actions such as data exfiltration or lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique for Remote Access Tools (T1219).

  Primary telemetry sources include Windows process creation logs, specifically utilizing Event ID 4688 or Sysmon Event ID 1 to capture process invocation details. If malicious, this activity could compromise the integrity and confidentiality of sensitive data and critical systems. However, it is important to note that this detection does NOT confirm malicious intent on its own, as `itsmagent.exe` and `rviewer.exe` are legitimate components of the Comodo RMM used for remote management.

  ### Investigation Steps

  - **Validate process parentage:** Check for Event ID 4688 in the Security log or Sysmon Event ID 1 to confirm whether `itsmagent.exe` or `rviewer.exe` was launched by a legitimate parent process, specifically monitoring for its invocation by trusted processes. This helps differentiate between benign and suspicious activity.

  - **Inspect process invocation time:** Analyze the creation time of the processes against typical usage hours (especially during off-hours) to identify anomalies. Legitimate use might occur during regular business hours, while alerts outside this window may warrant deeper investigation.

  - **Cross-reference system installations:** Query installed applications on the host using Windows Management Instrumentation (WMI) or PowerShell commands (e.g., `Get-WmiObject -Class Win32_Product`). Confirm if Comodo RMM should be installed and actively used on the system.

  - **Review network connections:** Utilize firewall logs or network monitoring tools to identify outbound connections initiated by the detected processes. Look for external communication patterns that are unusual for the organization's expected use of RMM tools (e.g., connections to untrusted IPs).

  - **Correlate with user activity:** Examine user activity logs (such as Event ID 4624 for logon events) to determine if there is a legitimate user session correlated with the process creations. Unusual logins or activity patterns may indicate compromised credentials.

  - **Identify known malicious indicators:** Establish if the detected processes are communicating with known indicators of compromise (IOCs) by cross-referencing with threat intelligence feeds. Malicious versions of Comodo RMM may exhibit unusual DNS queries or IP addresses.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential risk of remote access and control over critical systems. Given that the Comodo RMM tool is commonly used for legitimate activities, there is a moderate likelihood of abuse by adversaries using remote access for malicious purposes.

  ### Blind Spots and Assumptions

  Detection limitations may include evasion techniques where attackers could rename or modify legitimate binaries to evade detection. Reliable detection requires comprehensive logging of process creations and should include Sysmon deployment for enhanced visibility. Additionally, legitimate IT operations using Comodo RMM during maintenance windows or for support tasks may trigger this alert. Companion detections, such as monitoring for unusual network traffic patterns associated with remote management tools, can strengthen overall coverage against this threat.

