note: |
  ### Technical Context

  This Sigma rule detects the process activity of Comodo RMM (Remote Monitoring and Management) tools, specifically the execution of `itsmagent.exe` and `rviewer.exe`. The likely objective of an attacker utilizing these tools would be to facilitate remote access or control over compromised systems. This behavior aligns with the MITRE ATT&CK tactic for Command and Control (TA0011), particularly technique T1219 - Remote Access Tools.

  The primary telemetry source is process creation logs from Windows, specifically Audit Event ID 4688 (for process creation) which includes details like the executable image path and parent process. If malicious, the impact could facilitate unauthorized remote access, allowing attackers to exfiltrate data, deploy further malware, or conduct lateral movement within the network. This detection does NOT confirm that malicious intent is present; legitimate administrative usage of Comodo RMM may trigger this alert.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 for instances where `itsmagent.exe` or `rviewer.exe` are executed. Confirm whether these processes are spawned by legitimate parent processes (i.e., expected IT management workflows).

  - **Identify instances of previous remote access**: Look for patterns in logs (e.g., Event ID 4624 for successful logon) that indicate that the identified process was invoked by legitimate administrators during authorized sessions.

  - **Check for unusual execution times**: Identify if `itsmagent.exe` or `rviewer.exe` are executed during non-business hours or outside of typical maintenance windows, which may indicate unauthorized access.

  - **Correlate with network traffic logs**: Analyze firewall logs and network flow data for any outgoing connections made by the IP address associated with the affected system a few minutes before or after the process execution, looking for anomalies that may suggest data exfiltration.

  - **Monitor for process execution frequency**: Assess how frequently the software is invoked. Excessive usage or execution from unfamiliar endpoints (non-admin workstations) can indicate a malicious actor leveraging the RMM tool.

  ### Prioritization

  The alert severity is medium due to the potential impact of unauthorized remote access through the RMM tool. While the likelihood of misuse exists, Comodo RMM is also commonly used for legitimate IT management roles across enterprises, hence necessitating careful context evaluation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion where threat actors may rename these executables or utilize process hollowing techniques to execute them without triggering alerts. Reliable detection relies on comprehensive log collection from Group Policy settings to ensure all event types are recorded. Legitimate administrative activities may also trigger alerts, especially during scheduled IT maintenance. To strengthen coverage, consider integrating other detections for unauthorized remote access mechanisms, such as monitoring for unusual VPN connections (Tunneling via VPN: T1133).

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
