note: |
  ### Technical Context
  This detection rule identifies network activity associated with the Mikogo Remote Management and Monitoring (RMM) tool, which is used for remote desktop sharing and technical support. Attackers may exploit legitimate tools like Mikogo to gain unauthorized access to systems, facilitate command and control (C2) operations, or exfiltrate sensitive information unnoticed, thereby avoiding detection by conventional security measures.

  The rule aligns with the MITRE ATT&CK framework, particularly under the **Execution** tactic and the **T1219** technique, which relates to "Remote Access Tools." Understanding and monitoring potential usage of these tools is crucial as they can be used both for legitimate administrative tasks and by malicious actors for nefarious purposes.

  Primary data sources for this detection include network connection logs, which can reveal outbound communications to suspicious domains associated with Mikogo. Detecting these connections can help analysts identify unauthorized use of the tool within the enterprise environment.

  ### Investigation Steps
  - **Review Network Connections:** Examine network connection logs for any outbound connections to domains ending with `*.mikogo.com`, `*.real-time-collaboration.com`, or similar hosts, timestamped around the alert trigger.
  - **Analyze Process Creation Logs:** Check for any process creation events associated with known Mikogo executables or scripts initiating connections to the identified domains.
  - **Conduct User Activity Checks:** Investigate user accounts that initiated these connections to determine if they have legitimate reasons for using the Mikogo tool, including reviewing associated session logs from remote access systems.
  - **Evaluate Endpoint Logs:** Gather logs from endpoint detection and response (EDR) tools to identify any evidence of Mikogo being executed on endpoints, particularly looking for signs of unauthorized RMM activity.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of unauthorized remote access that could lead to data breaches, system compromise, or lateral movement within the network. The likelihood is elevated given the common use of RMM tools by both legitimate operators and threat actors.

  ### Blind Spots and Assumptions
  The detection rule may not cover instances where Mikogo is used legitimately for remote support, leading to possible false positives. Additionally, it assumes that the monitored environment does not employ domain or host name variations that are not captured within the detection criteria. It also relies on complete network connection logs and may miss instances of network activity where logging is not fully operational or where VPN configurations obscure the source of traffic.

