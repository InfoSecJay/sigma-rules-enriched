note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the Mikogo Remote Management and Monitoring (RMM) tool, which is often used for remote access and support functions. Attackers may utilize this tool for unauthorized remote access to systems, data exfiltration, or lateral movement within a network. The relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071) and Remote Access Tools (T1219). Primary telemetry sources include Windows network connection logs that capture outbound connections to specific Mikogo domain names.

  If exploited maliciously, the Mikogo RMM tool can enable an adversary to gain persistent remote access to devices, conduct surveillance, and manipulate systems, leading to significant security breaches. This detection does NOT confirm that the activity is indeed malicious, as it may include legitimate usage of the Mikogo RMM tool within the organization.

  ### Investigation Steps

  - **Check Network Connection Logs:** Review Windows Security Event ID 5156 (Windows Filtering Platform) and networking logs for connections to *.mikogo.com or *.real-time-collaboration.com. Identify any connections made by unauthorized users or from unexpected endpoints.

  - **Verify Endpoint Role:** Validate if the device making the connection is intended to have remote support capabilities. Legitimate devices typically belong to IT personnel or support teams and should have a recorded usage history of Mikogo.

  - **Correlate User Activity:** Examine user account activity related to the device identified in the previous step. Check Windows Security Event ID 4624 for successful logins and confirm if the accounts are known to perform administrative functions.

  - **Identify Malicious Indicators:** Look for any surrounding processes (e.g., unusual processes running alongside Mikogo, such as command-line tools or file transfers) in Sysmon Event ID 1 (process creation) and Event ID 10 (process exit) that indicate possible unauthorized usage.

  - **Review Application Logs:** Assess whether the Mikogo application was legitimately installed and configured on the system. Applications logs or installation entries should be found in Windows Event IDs 11724 (MSI installation) or relevant application logs.

  ### Prioritization

  This alert has medium severity due to the potential risk of unauthorized remote access to critical assets. While Mikogo can be legitimately used for support, its detection is notable in environments where unauthorized remote access attempts are common or gaining traction in attacks, raising the potential for malicious use.

  ### Blind Spots and Assumptions

  Detection may miss cases where adversaries use encryption or obfuscation methods on network connections to Mikogo. Log sources must correctly capture network connection events, and insufficient monitoring or lack of tools may lead to missed indicators. Legitimate remote support actions by authorized personnel could trigger this alert, especially within teams that use Mikogo regularly. A related detection rule may include monitoring for connections to other known RMM tools to enhance coverage against unauthorized remote access threats.

