note: |
  ### Technical Context

  This rule detects network connections to domains associated with Mikogo, a remote management and collaboration tool. Attackers may utilize Mikogo for unauthorized remote access to compromised systems, allowing them to control endpoints and exfiltrate data. The relevant MITRE ATT&CK tactic is “Execution” and the specific technique is “Remote Access Software” (T1219). The primary telemetry source is Windows network connection logs that identify outbound connections to domains like '*.real-time-collaboration.com' and '*.mikogo.com'. If malicious, this behavior can lead to severe security incidents such as data breaches or unauthorized access to sensitive information. This detection alone does NOT confirm malicious intent, as the Mikogo tool can be used legitimately by users in the organization.

  ### Investigation Steps

  - **Validate destination connections**: Check for outbound connections to domains such as '*.mikogo.com' using Windows Event ID 5156 (Windows Filtering Platform), looking specifically at the DestinationHostname field.

  - **Assess user context**: Identify the user account associated with the connections and determine if the user is known to use remote access or collaboration tools. Review User Logon Events (Event ID 4624) for activity patterns.

  - **Identify high-risk endpoints**: Focus on endpoints hosting sensitive data or critical applications that should not be accessed remotely without proper authorization. Review Recent Logon events to assess authorized remote access usage.

  - **Analyze concurrent sessions**: Check if there are multiple simultaneous connections from the same user to different Mikogo-related destinations, which may indicate malicious activity. Inspect network logs for authentication attempts or connections across multiple endpoints.

  - **Review legitimate usage**: Identify if Mikogo has been explicitly authorized for your organization. Gather user reports or documentation relating to company policy on remote support tools. Legitimate usage would involve known and approved connection attempts during standard working hours.

  ### Prioritization

  This alert is of medium severity due to the potential impact on sensitive systems should adversaries use Mikogo for malicious purposes. The likelihood of abuse is moderate, as Mikogo is a known legitimate tool but also favored by threat actors for its remote access capabilities. This behavior, while not the most common attack vector, is increasingly weaponized in targeted compromise scenarios.

  ### Blind Spots and Assumptions

  This detection may miss legitimate network activity from authorized Mikogo usage, potentially leading to false positives, especially if the tool is commonly used by support staff. It assumes that all relevant logs for network connections are enabled and correctly configured. Connection attempts may also trigger from other legitimate remote access software, so additional evidence may be required for context. A companion detection could involve monitoring for unusual user behavior patterns or unexpected process executions related to remote access tools (e.g., monitoring for process creation events like Sysmon Event ID 1 for known Mikogo application binaries).

