note: |
  ### Technical Context

  This rule detects potential network activity associated with the Mikogo remote management tool, which may indicate unauthorized remote access or control of an endpoint. The likely attacker objective is to gain remote control over a victim's system, facilitating data exfiltration, lateral movement, or other malicious activities. This behavior fits within the MITRE ATT&CK framework under the tactic "Execution" and the technique "Remote System Control" (T1219).

  The primary telemetry sources required for this detection are Windows network connection logs, specifically focusing on connection attempts to domains associated with Mikogo. If malicious, the security impact could include unauthorized access, data breaches, or further compromise of the network. Notably, this detection does NOT confirm that the activity is malicious on its own, as legitimate use of Mikogo may occur.

  ### Investigation Steps

  - **Check connection logs:**
    Review Windows network connection logs (Event ID 5156) for outbound connections to domains ending in `.real-time-collaboration.com`, `.mikogo4.com`, or `mikogo.com`. Track timestamps of connections for further analysis.

  - **Identify process invocation:**
    Correlate potential Mikogo connections with Process Creation events (Security Event ID 4688 or Sysmon Event ID 1). Check for processes that may invoke Mikogo-related executables, such as `Mikogo.exe`, providing an indicator of possible misuse.

  - **Assess user behavior:**
    Investigate user activities around the time of the detected connections. Compare against typical workflows: legitimate users may invoke these services for remote meetings or technical support but should demonstrate a pattern consistent with normal operations.

  - **Cross-reference with known users:**
    Check internal user accounts or groups that have legitimate business purposes for using Mikogo. Potential malicious activity would involve accounts not typically associated with remote access solutions.

  - **Review network traffic:**
    Analyze any generated network traffic for unusual patterns or synchronous activity indicative of an attacker using Mikogo for remote control. Look for excessive data transfer to and from the identified Mikogo domains.

  ### Prioritization

  This alert is of medium severity as it indicates possible remote access activity that could lead to significant impact on information integrity and confidentiality. The likelihood of malicious abuse is moderate, especially if the tool is identified on devices without legitimate use cases. As RMM tools like Mikogo are commonly weaponized in attacks, timely investigation is essential.

  ### Blind Spots and Assumptions

  Detection may be limited by reliance on network logs of outbound traffic, which could omit inbound connections or be susceptible to encryption tactics. Systems must be properly configured to capture relevant network activities. Legitimate business communications and technical support may trigger these alerts if Mikogo is in use. A related detection to consider is monitoring for known remote access software installations, such as TeamViewer or AnyDesk, as they may indicate broader remote access activity patterns.

