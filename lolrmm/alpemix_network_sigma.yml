note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Alpemix Remote Management Tool (RMM). These connections could indicate potential remote administration or control by an adversary leveraging Alpemix for persistent access to compromised systems. The likely attacker objective is to maintain control over affected hosts for data exfiltration or further exploitation. This detection aligns with MITRE ATT&CK technique T1219: Remote Access Software.

  The primary telemetry source comes from Windows network connection logs that capture DNS resolutions and outbound connections. If this activity is confirmed as malicious, it poses a significant security risk, as it may facilitate unauthorized access to sensitive systems and data. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative use of Alpemix can trigger the same alerts.

  ### Investigation Steps

  - **Review connection logs for suspicious activity**: Check Windows Security Event ID 5156 (Windows Filtering Platform) for outbound connections to the domains '*.alpemix.com' and '*.teknopars.com'. Identify source IP addresses and correlate with known assets for unusual behavior.

  - **Identify processes initiating connections**: Use Sysmon Event ID 3 to identify which processes are associated with the outbound connections to Alpemix domains. Look for unexpected processes, especially those with no legitimate business justification.

  - **Examine user accounts**: Cross-reference the user accounts initiating these connections. Verify the legitimacy of the user actions, focusing on any non-admin users that could exploit Alpemix for unauthorized remote access.

  - **Validate expected usage patterns**: Assess legitimate connections to Alpemix by reviewing previous network logs. Determine if any authorized remote support teams typically use the tool and document their regular access to the domains.

  - **Inspect network traffic for indicators of compromise**: Analyze packet captures for command and control (C2) patterns or unusual data exfiltration activity correlating with Alpemix sessions. Confirm the creation or transfer of files too.

  ### Prioritization

  This alert should be treated with medium severity due to its potential impact on sensitive systems. The likelihood of malicious abuse is moderate, given that Alpemix is often weaponized by adversaries for remote access. Although less common than other RMM tools, its detection is critical in environments where sensitive assets are present.

  ### Blind Spots and Assumptions

  Detection may miss modified domains or obfuscated requests if attackers use alternative infrastructure. Reliable detection requires proper logging configurations for Windows network events and might involve legitimate activities by support teams using Alpemix for maintenance. A related detection to strengthen coverage would be alerting on unusual patterns of remote desktop protocol (RDP) and other RMM tools, which might indicate an escalation of privileges or additional remote connections.

