note: |
  ### Technical Context

  This rule detects network activity related to the Alpemix RMM (Remote Monitoring and Management) tool, which is often associated with unauthorized access and remote administration by adversaries. The likely attacker objective includes establishing a command-and-control (C2) channel to perform remote access or management tasks on compromised machines. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the specific technique of Remote Access Tools (RATs) (T1219).

  The primary telemetry sources include Windows network connection logs, specifically monitoring for outbound connections to hostnames ending with '*.alpemix.com' or '*.teknopars.com'. If malicious, this activity could enable an attacker to control and exfiltrate data from the affected environment. However, this detection alone does not confirm that the observed activity is malicious, as Alpemix may also be used for legitimate remote support purposes.

  ### Investigation Steps

  - **Identify network connections:** Review outbound connections to IPs associated with Alpemix RMM by examining Windows Security Event ID 5156 (Windows Filtering Platform) and filtering for destination hostnames '*.alpemix.com' or '*.teknopars.com'.

  - **Check process associations:** Investigate running processes associated with the detected network activity using Sysmon Event ID 1 (Process Creation) to identify if the Alpemix tool is actively running on the host.

  - **Review user context:** Analyze the user account associated with the outbound connections in the network logs (Event ID 5156), checking for anomalies such as administrative accounts or unusual login times that might indicate malicious access.

  - **Correlate with legitimate usage:** Document any known legitimate business use of Alpemix in your organization. If verified, monitor for associated documentation detailing approved usage patterns and scheduled support sessions.

  - **Analyze for high-confidence indicators:** Look for high-volume communication attempts to Alpemix domains that are unusual for the environment. Flag any anomalous traffic spikes or repeated connection attempts, which could suggest adversarial activity such as data exfiltration or lateral movement.

  - **Validate file creation artifacts:** If a connection is made, examine file access and creation logs to confirm whether the Alpemix software installation occurred as expected. Use Sysmon Event ID 11 (File Creation) to detect files associated with Alpemix being created, modified, or transferred.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized remote access, especially on critical systems where sensitive data resides. The likelihood of malicious abuse is moderate, considering the increasing trend of using remote access tools for exploitation. Additionally, Alpemix is commonly weaponized in various threat actor toolkits, increasing the urgency of follow-up investigations.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for evasion techniques, such as the use of VPNs or proxy servers to mask Alpemix traffic. Reliable detection requires proper logging configurations for Microsoft Defender Firewall and event logging on the affected hosts. Legitimate activities, such as IT support sessions using Alpemix, may trigger this alert. Companion detections, such as monitoring for file creation associated with Alpemix or tracking user account behavior patterns, can further strengthen coverage and contextual understanding of the activity.

