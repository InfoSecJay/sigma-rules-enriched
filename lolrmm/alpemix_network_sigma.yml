note: |
  ### Technical Context

  This Sigma rule detects network connections to Alpemix RMM tool domains, which may indicate potential unauthorized remote management activity. The likely objective of an attacker using Alpemix is to establish remote access for the purpose of system manipulation, data extraction, or further network compromise. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and specifically the technique of Application Layer Protocols (T1219).

  The primary telemetry sources include Windows network connection logs capturing outbound traffic, specifically those detailing attempted connections to the specified Alpemix domains. If malicious, this activity could lead to unauthorized access and control over affected systems. Importantly, this detection does NOT confirm whether the Alpemix tool is being used legitimately or illicitly; further investigation is necessary to contextualize the alert.

  ### Investigation Steps

  - **Check network connection logs:**
    Review Windows Event ID 5156 (Windows Filtering Platform) for allowed outbound connections to any *.alpemix.com or *.teknopars.com domains. Note any unusual patterns in requesting users or timings.

  - **Identify process associations:**
    Inspect relevant Security Event ID 4688 and/or Sysmon Event ID 1 for process creation events linked to the Alpemix outbound connections. Look for unusual executables or parents linked to legitimate user processes.

  - **Validate legitimate use:**
    Consider whether the affected workstation is part of the IT support or maintenance team. If so, collect contextual data confirming intended use of Alpemix RMM, such as documented procedures or prior ticket alerts.

  - **Look for lateral movement attempts:**
    Examine Event ID 4624 (Logon) and Event ID 4625 (Failed Logon) across your environment for unusual login patterns (e.g., from the workstation where the connection to Alpemix was identified). This can indicate further unauthorized access attempts.

  - **Capture any file operation artifacts:**
    Investigate file access patterns related to remote executions, focusing on created or modified files using Sysmon Event ID 11 (FileCreate) for any executable or script files during the connection period.

  ### Prioritization

  The alert holds a medium severity due to the potential impact on systems with critical assets if Alpemix is misused by an attacker. Given that remote management tools like Alpemix are commonly weaponized for malicious purposes, the likelihood of abuse is elevated, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate usage scenarios where Alpemix is employed by IT personnel, leading to false positives. Required log sources include active monitoring of outbound network connections and appropriate configurations to capture Windows filtering platform events reliably. Legitimate activities, such as maintenance or remote troubleshooting by IT support, could trigger this alert. A companion detection to consider is monitoring for abnormal user behavior or credential misuse (e.g., suspicious account logins related to the same asset).

