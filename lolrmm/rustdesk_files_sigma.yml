  ### Technical Context

  This rule detects file activity associated with the RustDesk remote management tool, specifically targeting files located in the local service profile's AppData directory. The likely objective of the attacker is to leverage this RMM tool for remote access and potential exploitation of the system. This behavior relates to the MITRE ATT&CK technique for remote access tools, specifically T1219 (Remote Access Software). The primary telemetry sources include Windows file system events that log file modifications and access patterns. If malicious, the security impact could include unauthorized access, data exfiltration, or system compromise. It is important to note that this detection does NOT confirm malicious intent by itself, as RustDesk may also be used legitimately within the organization.

  ### Investigation Steps

  - **Check file creation events:** Review Windows Security Event ID 4663 for activities where `TargetFilename` ends with `C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\*`. Malicious indicators may include unusual timestamps or a high frequency of file access over a short period.

  - **Validate process execution:** Examine Sysmon Event ID 1 for any process that initiates or interacts with RustDesk files. Look for processes that are not normally associated with legitimate use, such as unexpected parent processes.

  - **Identify user accounts:** Analyze the Windows Security Event ID 4624 to see which user accounts accessed the RustDesk files. Confirm whether the accessing account is legitimate for operations related to remote support, and investigate any suspicious user accounts.

  - **Look for unusual network connections:** Check for associated outbound connections to known RustDesk command and control (C2) servers by reviewing firewall or proxy logs for connections matching RustDesk network behavior. Malicious indicators would include connections to IP addresses or domains not recognized in the organization.

  - **Document legitimate usage patterns:** Review internal documentation or policies regarding the usage of RustDesk. Expected behavior typically includes file access under a managed user account during regular business hours rather than outside of standard operating hours.

  - **Monitor for unusual file modifications:** Identify any unusually frequent or recent modifications to files within the RustDesk directory using Windows PowerShell file system commands to track changes that could suggest tampering or abnormal usage.

  ### Prioritization

  This alert is deemed medium severity due to the potential impact of the targeted system, particularly if it serves critical functions within the organization. The likelihood of abuse is moderate, given the increasing popularity of remote management tools for malicious activities. However, legitimate use cases exist, which require careful analysis to differentiate between benign and malicious actions.

  ### Blind Spots and Assumptions

  Detection limitations may stem from threat actors using alternative methods to obfuscate or mask their file activity, such as using legitimate user accounts. Reliable detection requires Windows File Auditing enabled for the affected directories and comprehensive logs from file system events. Additionally, legitimate remote access solutions could trigger the alert, especially if users are allowed to operate RustDesk for valid support purposes. Companion detections could include monitoring for other behaviors indicative of remote access tool activity or unauthorized software installations.

