  ### Technical Context
  This rule detects file activity associated with the RustDesk Remote Management Tool (RMM). RustDesk is a remote desktop application that allows users to connect to machines over the internet and is often used for legitimate purposes, such as remote support. However, attackers may misuse such tools to establish remote access to compromised systems, enabling them to maintain persistence, exfiltrate data, or facilitate lateral movement within an enterprise network.

  The primary MITRE ATT&CK tactics relevant here are **Execution** (TA0002), as the execution of the RustDesk application represents an attacker’s ability to execute code on a victim's machine without their consent. The specific technique identified is **Remote Access Software** (T1219), highlighting the use of remote access software for maintaining control over compromised endpoints. Monitoring file activity within the RustDesk directory can help identify unauthorized or suspicious use of this tool.

  The best evidence for this detection can be gathered from **Windows file event logs**, specifically targeting activity in the user's profile directories. In particular, logs detailing access to C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\* will provide insight into whether there is any unusual file manipulation or creation that could indicate malicious intent.

  ### Investigation Steps
  - **Review File Events:** Examine file event logs for suspicious creations, modifications, or deletions in the RustDesk directory. Look for any files that should not be present or familiar file types being used out of expected context.
  - **Analyze Process Creation Logs:** Investigate related process creation events for RustDesk. Identify any processes that initiated from unusual parent processes which may suggest exploitation or malicious use.
  - **Correlate with User Accounts:** Cross-reference the activity in the RustDesk directory with user account logs to determine whether the account accessing RustDesk has a history of suspicious behavior or if it's an account that should not have access to remote management tools.
  - **Conduct Network Traffic Analysis:** Look for outbound network connections that correspond with RustDesk activity. Analyze traffic patterns, IP connections, and any communications that could indicate data exfiltration or unauthorized access attempts.

  ### Prioritization
  This alert is considered medium severity, as while RustDesk can be used for legitimate remote access, its presence on a system without appropriate authorization can indicate a potential breach. The likelihood of threat activity is moderate, depending on the broader context of system behavior and intelligence about ongoing incidents.

  ### Blind Spots and Assumptions
  A significant blind spot in this detection is the potential for legitimate use of RustDesk, which can lead to false positives. The detection logic assumes that any file activity discovered in the RustDesk directory is suspect without additional context, which may not hold true if the tool is in legitimate use by IT staff. Moreover, the alert requires robust logging of file events within Windows, specifically for the designated application path, meaning environments where this logging is not adequately set up may miss crucial indicators.

