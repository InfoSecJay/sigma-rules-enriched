note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the RustDesk remote management tool. The primary objective of an attacker utilizing RustDesk would typically be to establish remote control over an affected system, facilitating data exfiltration or further malicious actions. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001) and the technique of Application Layer Protocol (T1219). The primary telemetry sources involved are Windows file event logs that monitor specific directory actions, particularly targeting user and service profile paths relevant to RustDesk. If confirmed malicious, this could lead to unauthorized system access or data breaches. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate usage of RustDesk may also trigger the alert.

  ### Investigation Steps

  - **Check file creation events:** Review Windows Security Event ID 4663 for any file creation related to 'C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\*' and 'C:\Users\*\AppData\Roaming\RustDesk\config\RustDesk.toml'. A significant number of such events may indicate suspicious activity.

  - **Analyze logs for unusual file modifications:** Inspect file event logs for modifications to RustDesk configuration files (e.g., 'RustDesk2.toml'). Look for timestamps and user accounts. Frequent changes by non-administrative users may suggest malicious use.

  - **Review Startup folder entries:** Examine the presence of 'RustDesk Tray.lnk' in 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\'. Verify if the process has been initiated by a non-standard account which may indicate potential compromise.

  - **Identify legitimate usage patterns:** Confirm legitimate installations or usage of RustDesk within your organization. In environments where RustDesk is approved, it is common for active users to have predictable patterns of activity, such as frequent log entries without unusual time gaps.

  - **Correlate with network activity:** Use network logs to check for connections made by RustDesk’s executables. Look for unusual outbound connections or connections to known malicious IP addresses during RustDesk operation times.

  - **Flag external execution attempts:** Investigate if any external processes attempt to invoke RustDesk directly (e.g., running executables from temp directories or unusual file shares). External triggering of rustdesk.exe warrants further scrutiny.

  ### Prioritization

  This alert should be considered medium severity due to the potential for significant impact on system integrity and the likelihood of RustDesk being weaponized for unauthorized remote access. However, its severity may vary based on the criticality of the affected systems and prior knowledge of RustDesk being used within the organization.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate enterprise use of RustDesk, potentially leading to false positives. Ensure logging from Windows file events is enabled and properly configured to capture the necessary artifacts. The rule may also trigger during tasks performed by authorized users who use RustDesk for remote support. A related detection for outbound network connections (e.g., PowerShell or executable network behaviors) could enhance coverage against unauthorized use of RustDesk or similar tools.

