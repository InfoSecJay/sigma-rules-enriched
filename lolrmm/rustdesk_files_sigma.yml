note: |
  ### Technical Context

  This rule detects file activities associated with RustDesk, a remote management tool that may be misused by adversaries for command and control (C2) purposes. The likely attacker objective is to establish and maintain persistent remote access to a compromised system, allowing for covert operations. This activity aligns with the MITRE ATT&CK tactic of Command and Control (ID: TA0011) and technique of Application Layer Protocol (ID: T1219). The primary telemetry source is Windows file event logs, specifically monitoring the activity in the path `C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\`. If malicious, this indicates unauthorized remote access potentially leading to further exploitation or data exfiltration. It is critical to note that this detection does NOT confirm malicious intent on its own, as RustDesk can also be legitimately used for remote support.

  ### Investigation Steps

  - **Review file creation events**: Inspect Windows Event ID 4663 in the Security log for file creation events targeting `C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\`. Check for unusual file names or extensions that could indicate malicious activity.

  - **Check process execution**: Validate any processes that access the specified RustDesk path by reviewing Windows Sysmon Event ID 1 or Security Event ID 4688. Look for processes not typically associated with legitimate remote management tools.

  - **Correlate with user activity**: Analyze the logged user activity via Security Event ID 4624 (logon events) to determine if accounts accessing RustDesk files have abnormal activity patterns (e.g., unusual times or from different geographic locations).

  - **Identify known malicious indicators**: Look for file hashes of known malicious RustDesk binaries against threat intelligence feeds. A match with a known hash would indicate high confidence in adversarial use.

  - **Examine network traffic**: Check for outbound connections from systems with RustDesk activity in your environment using firewall logs or network traffic analysis tools. Look for connections to suspicious or unrecognized IP addresses that may indicate C2 communication.

  - **Assess legitimate use cases**: Identify if legitimate business operations involve RustDesk in your environment by consulting asset inventories. Ensure documented use cases for remote support align with detected activity.

  ### Prioritization

  The alert has a medium severity due to the potential security implications of unauthorized remote access. While the impact can be significant, especially if the affected system holds sensitive data, the likelihood of abuse depends on the organization's use of RustDesk. Such behavior is weaponized in targeted attacks but may also reflect benign activity if proper governance is not in place.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate RustDesk usage within the environment, which can create false positives. This detection requires monitoring of specific file path activity; without proper logging configurations, such detections may be incomplete. Legitimate IT support activities can inadvertently trigger this alert. Related detections include monitoring for unusual network connections (e.g., Command and Control communication), which can enhance context around RustDesk usage.

