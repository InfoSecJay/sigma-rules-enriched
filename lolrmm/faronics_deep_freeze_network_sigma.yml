note: |
  ### Technical Context

  This detection rule identifies potential network activity associated with the Faronics Deep Freeze Remote Monitoring and Management (RMM) tool, which is used for endpoint management and recovery solutions. Attackers may use this tool to maintain persistent access and control over compromised systems within an organization, suggesting an objective of reconnaissance, lateral movement, or persistence. The relevant MITRE ATT&CK tactics include Command and Control (TA0011) and Remote Services (T1219).

  Primary telemetry sources include network connection logs from Windows systems, specifically focusing on outbound connections to domains associated with Faronics services. If malicious, the security impact includes unauthorized control over endpoint devices, leading to potential data breaches or exploitation of further vulnerabilities. However, this detection does NOT confirm that the observed traffic is solely malicious, as legitimate administrative activities may also generate similar indicators.

  ### Investigation Steps

  - **Identify network connections:** Review network connection logs from Event ID 5156 (Windows Filtering Platform) for outbound traffic to domains ending in "deepfreeze.com" or "faronics.com." Validate connections; any unusual volume or frequency may indicate potential exploitation.

  - **Examine process activity:** Investigate processes using Sysmon Event ID 1 (Process Creation) to identify any associated applications or scripts initiating connections to Faronics domains. Verify legitimate endpoint management activities tied to the organization’s IT protocols.

  - **Assess user accounts involved:** Check account activity in Security Event ID 4768 (Kerberos Authentication) targeting external Faronics domains. Confirm whether the user has legitimate access rights or if there is suspicious authentication activity, indicating potential compromise.

  - **Review proxy logs for patterns:** Analyze proxy logs for HTTP requests to Faronics domains. Look for unusual HTTP methods (e.g., POST requests) or user agent strings that deviate from standard operation, which may suggest automated tools being used for malicious purposes.

  - **Collect additional forensic evidence:** Correlate findings with DNS query logs for resolutions to Faronics domains. Check for anomalous DNS request patterns that could signify command and control server communication.

  ### Prioritization

  The severity of this alert is medium, given that affected systems may include critical endpoints used for management and recovery. The likelihood of malicious use is moderate, as adversaries may exploit tools like Faronics Deep Freeze for maintaining access, but legitimate instances will also occur within enterprises that use this software for system recovery and maintenance.

  ### Blind Spots and Assumptions

  This detection may be evaded if adversaries employ domain fronting or utilize alternate domains not covered by the detection rules. Reliable detection requires that network connection logs and Sysmon logs are properly configured and collected. Legitimate use cases include authorized IT personnel performing remote management tasks on endpoints. Companion detections, such as those monitoring unauthorized process creations or unusual user behavior involving remote management applications, can enhance overall visibility and response capabilities.

