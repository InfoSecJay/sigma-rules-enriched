note: |
  ### Technical Context

  This detection identifies outbound network connections to specific Faronics Deep Freeze RMM services, which are typically used for remote management and system restoration. The likely attacker objective could be to misuse these legitimate services for unauthorized remote access or system management to achieve persistence or control over targeted systems. This behavior aligns with the MITRE ATT&CK framework's "Execution" tactic, particularly under technique T1219 (Remote Access Software).

  The primary telemetry source for this detection includes Windows network connection logs that capture outbound traffic details, particularly the destination hostnames specified. If malicious, this behavior could lead to unauthorized access to systems, potentially compromising sensitive data or availability. It is important to note that this detection alone does not confirm malicious activity, as legitimate use of Faronics Deep Freeze may also generate similar traffic patterns.

  ### Investigation Steps

  - **Examine network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to the specified domains. Focus on `DestinationHostname` and `SourceAddress` to identify the originating system.

  - **Identify the responsible process:** For hosts generating connections, query Sysmon Event ID 3 (Network Connection) to check which process initiated the connection. Look for unusual or unexpected processes that may indicate malicious exploitation.

  - **Correlate with installation records:** Verify if Faronics Deep Freeze is legitimately installed on the system using installed software inventories. Legitimate behaviors typically include documented usage of the software in the enterprise.

  - **Look for anomalous connection patterns:** Assess connection frequency and volume to the specified domains to gauge unusual activity. Malicious indicators may include repeated attempts in a short time frame, especially if originating from non-administrative accounts.

  - **Review relevant user activity logs:** Investigate user activity logs to see if anyone initiated remote management tasks aligned with the detected traffic. Check for associated actions like session start commands or administrative tasks.

  ### Prioritization

  This alert is medium severity as it indicates potential misuse of legitimate software that could lead to unauthorized control over systems. The risk of malicious use is moderate, especially if the affected system has high criticality within the infrastructure. As remote access tools are often targeted by attackers, this detection should be prioritized for further investigation.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited if outbound traffic is encrypted or if the logging configuration does not capture all relevant network events. Legitimate usage of Faronics Deep Freeze for system management may frequently trigger this alert, leading to false positives. A related detection to strengthen coverage would involve monitoring for unusual process creations or modifications associated with remote access tools, particularly those not normally present in the environment.

