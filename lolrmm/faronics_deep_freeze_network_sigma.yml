note: |
  ### Technical Context

  This rule detects network activity from the Faronics Deep Freeze remote monitoring and management (RMM) tool, specifically connections to its associated cloud domains. The likely attacker objective is to leverage this often-overlooked tool for unauthorized remote access or control of systems under the guise of legitimate administration. The relevant MITRE ATT&CK tactic is Command and Control (T1071), while the technique is Application Layer Protocol (T1219). Primary telemetry sources include Windows network connection logs that capture the DestinationHostname field. If malicious, this could lead to unauthorized system modifications or data exfiltration. This detection does NOT confirm malicious intent on its own, as legitimate activities associated with Faronics Deep Freeze may yield similar traffic.

  ### Investigation Steps

  - **Check network logs for recent connections:** Review network connection logs for Event ID 5156, focusing on DestinationHostname fields that match any Faronics-related domains (e.g., `cloud.faronics.com`, `deepfreeze.com`). Look for unusual connection patterns consistent with potential adversarial activity, or cross-reference with known legitimate use cases.

  - **Validate host role and usage:** Assess whether the contacting host has a legitimate Faronics Deep Freeze installation. Check application logs or audit logs for installations, configurations, or updates related to Faronics, which may indicate expected behavior. Hosts with this application would normally have scheduled maintenance windows instead of continuous connections.

  - **Analyze associated process activity:** Correlate this network activity with process creation logs (Security Event ID 4688 or Sysmon Event ID 1) to identify if any suspicious processes initiated this network connection. Look for anomalous child processes spawned by typical administrative tools that commonly pair with Deep Freeze.

  - **Review user activity and permissions:** Check user account activity in Event ID 4624 (logon events) on the affected host. Ensure that only authorized users with administrative access are initiating communications with Deep Freeze services, especially during off-peak hours.

  - **Identify indicators of compromise (IoCs):** Look for specific known malicious indicators that may coincide with legitimate Deep Freeze network activity. High-confidence malicious indicators may include unexpected communication patterns or the presence of unusual outbound connections to these domains without a corresponding administrative purpose.

  ### Prioritization

  The alert has medium severity as it indicates a potential avenue for unauthorized remote access that could compromise critical systems. Recognizing frequent connections to cloud-based management services can indicate malicious use, especially in environments where such use is uncommon. Network activities from tools like Faronics are sometimes weaponized by adversaries to persist within a network unnoticed.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of network logging and the use of DNS over HTTPS (DoH), which could obscure suspicious network connections. Reliable detection requires the capture of all outbound HTTP/S traffic, as legitimate Faronics activities can frequently trigger the alert. Understanding regular organizational use cases for Faronics is crucial; however, benign admin activities might still generate alerts. Related detection rules for anomalous authentication attempts or process creation can strengthen overall coverage against misuse of RMM tools.

