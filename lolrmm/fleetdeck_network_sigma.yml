  ---

  ### Technical Context

  This rule detects outbound network connections to domains associated with the FleetDeck Remote Monitoring and Management (RMM) tool, specifically looking for connections that end with "fleetdeck.io". The likely attacker objective is to establish command and control (C2) or utilize RMM capabilities for remote management and potential adversarial actions. This correlates with the MITRE ATT&CK tactic of Execution and the technique T1219 (Remote Access Software).

  The primary telemetry sources are Windows network connection logs, specifically monitoring DNS requests and outbound connections. If malicious, this behavior could indicate unauthorized remote access or exploitation of system resources by an attacker using FleetDeck as part of their toolkit. It's important to note that this detection does NOT confirm malicious activity on its own, as legitimate use of FleetDeck may also generate such network activity.

  ---

  ### Investigation Steps

  - **Review outbound connection logs:** Investigate network connection logs (Windows Event ID 5156) for connections to "fleetdeck.io". Note the process name and user context to determine if legitimate software is initiating these connections.

  - **Identify the initiating process:** Determine which application is making the connection. Look for suspicious or unusual applications in conjunction with the event, filtering by Process Name field from Event ID 4688 or Sysmon Event ID 1.

  - **Check for concurrent activity:** Look for other indicative behaviors in the logs around the time of the connection, such as unusual account logins (Event ID 4624) or process creations that might indicate lateral movement or exploitation associated with the identified connection.

  - **Validate legitimate activity:** Cross-reference the affected systems with asset inventory to identify expected users or services that may legitimately use FleetDeck. Note any deviations in user behavior or accessing non-standard times.

  - **Collect additional context:** Search for recent changes made to the system that might relate to legitimate FleetDeck installations or configurations. Review logs for software installation events (Event ID 1033 or relevant MSI logs) to confirm authorized usage.

  - **Identify high-confidence malicious indicators:** If the source process is known to be associated with previous incidents or if it shows signs of obfuscation, such as randomization or suspicious command-line arguments in Process Creation logs, flag these as high-confidence indicators of compromise.

  ---

  ### Prioritization

  This alert should be treated with medium priority based on the impact of identified systems, such as servers, that may be exploited further. The likelihood of malicious activity is elevated due to the nature of RMM tools being commonly weaponized for C2 purposes. This sort of behavior is less common in standard enterprise operations, warranting closer scrutiny.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by proper log source configurations; if Windows Firewall logging is not enabled, outbound connections may go undetected. Legitimate use of FleetDeck within enterprise environments could lead to false positives for this alert, especially among IT support teams managing multiple endpoints. A related detection to consider is monitoring for authorized software installations (e.g., Event ID 1033) to establish baseline expected behavior associated with FleetDeck.

