note: |
  ### Technical Context

  This Sigma rule detects network connections to the domain `fleetdeck.io`, indicative of potential activity by the FleetDeck Remote Monitoring and Management (RMM) tool. The likely attacker objective could include unauthorized remote access or management of systems through the FleetDeck platform. This activity corresponds to the MITRE ATT&CK tactic "Execution" (TA0002) and technique "Remote Management Software" (T1219). The primary telemetry sources include Windows network connection logs, specifically focusing on the `DestinationHostname` field to identify connections to the specified domain. If malicious, this behavior could enable an adversary to manipulate and control affected systems. Important to note, this detection does NOT confirm malicious activity on its own, as legitimate use of the FleetDeck tool could generate similar network connections.

  ### Investigation Steps

  - **Review connection logs:** Check Windows Event ID 5156 (Windows Filtering Platform - Allow) for outbound connections to `fleetdeck.io`. Determine the user initiating the connection and the duration/timing of the session.

  - **Validate host role:** Identify the asset performing the network connection. If it’s a sensitive system, such as a server or admin workstation, prioritize further investigation.

  - **Collect process information:** Use Sysmon Event ID 3 (Network Connections) to examine which process initiated the connection to `fleetdeck.io` and check if the process is known and legitimate (e.g., inspect for `fleetdeck.exe`).

  - **Identify benign activity patterns:** Legitimate use of FleetDeck typically includes administrative access occurring during defined maintenance windows. Confirm if the connection aligns with scheduled operations.

  - **Look for known malicious indicators:** Check for unusual dependencies by examining the command line used when the connection was established. A command line containing unusual parameters or arguments may indicate malicious activity.

  - **Search for related logs:** Review system logs or endpoint detection logs to identify any other unusual activities, such as multiple connections to non-standard ports or excessive failed attempts to connect prior to the successful connection.

  ### Prioritization

  This alert is of medium severity due to the potential impact on sensitive systems through remote management tools. While not all activity related to FleetDeck is malicious, the likelihood of malicious abuse is moderate given the tool's capabilities, and similar tools are commonly weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection relies on the presence of logs for outbound network connections to effectively identify potential malicious activity. Evasion techniques may include the use of legitimate credentials, or attackers may obfuscate their activity by using VPNs or other secure tunnels. Legitimate administrative activities during maintenance windows could trigger this alert. A related detection to enhance coverage would be monitoring for local installations of known RMM tools, combined with network activity.

