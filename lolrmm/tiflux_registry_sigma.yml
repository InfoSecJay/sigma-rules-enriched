note: |
  ### Technical Context

  This Sigma rule detects unauthorized or suspicious registry activity associated with the TiFLUX Remote Management Tool (RMM). The likely attacker objective is remote management and control of compromised systems, which could facilitate data exfiltration, lateral movement, or further exploitation. The relevant MITRE ATT&CK tactics include Command and Control (TA0011) and the specific technique of Application Layer Protocol (T1219).

  The primary telemetry sources for this detection are Windows registry event logs, specifically focusing on changes to certain key paths that indicate the presence or modification of TiFLUX components. If malicious, this activity poses a significant security risk as it can allow attackers persistent access to the environment. However, this detection does NOT confirm an active intrusion without additional context, such as confirmed malicious behavior or other indicators of compromise (IOCs).

  ### Investigation Steps

  - **Identify registry changes:** Review Windows Registry Event logs (Event ID 4657) for any modifications under `HKLM\SYSTEM\CurrentControlSet\Services\TiService` or `HKLM\SOFTWARE\TiFLUX`. Look for non-standard modification timestamps or unexpected user accounts making changes.

  - **Cross-examine ImagePath values:** Check the `ImagePath` value within `HKLM\SYSTEM\CurrentControlSet\Services\TiService\ImagePath`. If it points to non-standard executables or paths, this is a strong indicator of malicious activity.

  - **Correlate associated user activity:** Examine event logs for user logins (Event ID 4624) during the time of registry changes. Legitimate administrative actions will typically be executed during regular business hours and by expected accounts.

  - **Assess legitimate installations:** Validate if TiFLUX is actively used within your enterprise by checking for documented deployments or configurations. Review internal asset registers and compare against findings to identify discrepancies.

  - **Identify launched processes:** Look for Sysmon Event ID 1 to find processes launched that may reference TiFLUX components, such as `TiAgent`. Verify against known-good baselines to distinguish between legitimate and suspicious execution.

  ### Prioritization

  The alert has medium severity due to the nature of the affected registry keys associated with persistent remote management tools. The likelihood of malicious abuse is moderate, as similar tools are often leveraged for unauthorized access. TiFLUX is not among the most commonly weaponized tools, but its detection is essential for proactive defense.

  ### Blind Spots and Assumptions

  Consider the possible evasion techniques, such as legitimate use of TiFLUX being present in the environment, which could lead to false positives. Reliable detection necessitates comprehensive logging of Windows registry events; without it, coverage may be limited. Additionally, other legitimate remote management activities or administrator actions could trigger this alert. A related detection, such as monitoring for C2 connections or suspicious outbound traffic (e.g., DNS queries to known malicious domains), could help corroborate findings and provide a fuller picture of potential compromise.

