note: |
  ### Technical Context

  This Sigma rule detects unauthorized or suspicious registry activity related to the TiFLUX Remote Monitoring and Management (RMM) tool, which might be used by attackers for remote access and control over compromised systems. The likely attacker objective is to establish persistence and facilitate remote exploitation, data exfiltration, or lateral movement. This behavior aligns with the MITRE ATT&CK technique for Remote Service Control (T1219).

  Primary telemetry sources include Windows registry event logs, specifically focusing on targeted keys associated with the TiFLUX tool. If this activity is malicious, it could lead to unauthorized system control, data breaches, and overall network compromise. This detection does NOT confirm malicious intent on its own and requires context from additional logs to validate suspicious activity.

  ### Investigation Steps

  - **Review registry access events:** Check Windows Security Event ID 4657 for changes to registry keys `HKLM\SYSTEM\CurrentControlSet\Services\TiService` and related paths. Compare these changes with expected configurations for legitimate applications.

  - **Correlate with process creation:** Look for related Windows process creation events (Event ID 4688) to identify instances of `TiAgent` or similar executables. Malicious indicators include unusual CPU usage or processes running from paths not typically associated with legitimate software.

  - **Check for abnormal service configurations:** Validate the service configuration for `TiService` via `Get-Service` or relevant PowerShell commands. Legitimate configurations often feature specific startup types, while unexpected startup types (e.g., "Automatic" for services that should be on "Manual") may indicate malicious alteration.

  - **Examine scheduled tasks:** Investigate Task Scheduler entries (Event ID 4698) for jobs that reference `TiFLUX` components. Legitimate tasks will often feature familiar user accounts and expected run times while suspicious tasks might use misleading names or run at unusual hours.

  - **Monitor for user activity:** Check user account logs for administrative actions around the time of the registry changes (Event ID 4624). Any unusual logon patterns or unfamiliar accounts accessing sensitive areas could correlate with malicious actions.

  - **Validate system image paths:** Analyze the ImagePath values in the registry for the `TiService`. Legitimate services typically have standard file paths (e.g., system32). Deviations or obfuscated paths could indicate exploitation.

  ### Prioritization

  This alert should be considered medium severity due to the potential risk associated with unauthorized remote management tools. The impact on critical systems could be significant if exploitation occurs. Additionally, while this behavior can be weaponized, not all registry modifications signal malicious activity without further corroboration.

  ### Blind Spots and Assumptions

  Detection may be evaded through legitimate use of the TiFLUX tool by authorized personnel, leading to false positives. Reliable detection requires proper logging configurations for Windows registry events and adequate monitoring of registry access patterns. Legitimate software installations or third-party management tools may trigger this alert; these activities should be closely reviewed. A related detection to strengthen coverage could involve monitoring elevated user account access (Event ID 4672) to grasp the context of administrative changes.

