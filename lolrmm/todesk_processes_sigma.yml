note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the ToDesk remote management tool, specifically targeting processes like `todesk.exe`, `ToDesk_Service.exe`, and `ToDesk_Setup.exe`. The likely attacker objective is to gain unauthorized remote access to systems, allowing for data exfiltration, surveillance, or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic of Execution (T1203) and the technique of Remote Access Tools (T1219). The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide details on process execution.

  If malicious, the use of ToDesk can lead to significant security impacts, including unauthorized data access and potential system compromise. It is crucial to note that this detection does NOT confirm malicious intent on its own; legitimate uses of ToDesk may exist within the organization, particularly for IT remote support.

  ---

  ### Investigation Steps

  - **Review recent process logs:** Check for Security Event ID 4688 for process creation events with the `Image` field containing `todesk.exe`, `ToDesk_Service.exe`, or `ToDesk_Setup.exe`. Indicator of compromise: a process launched from a non-standard directory (e.g., not from `C:\Program Files`).

  - **Identify parent process:** Investigate the `ParentImage` field in the corresponding process creation events. Malicious indicators include a suspicious parent process like `cmd.exe` or `powershell.exe`, which hint at possible script execution.

  - **Correlate user activity:** Examine the `SubjectUserName` or `InitiatingProcessId` fields to identify the user associated with the ToDesk execution. Compare against normal operational patterns to evaluate if the user is authorized to invoke such remote tools.

  - **Validate known good usage:** Assess if legitimate remote access activity has been logged by your team's IT or support teams. Check against expected behavioral patterns to distinguish between authorized usage (e.g., timestamps aligned with known support tasks) and potential abuses.

  - **Search for lateral movement indicators:** Investigate during the period of the alert for any additional suspicious logs, such as failed login attempts or unusual network connections, which may suggest the tool is being leveraged for further exploitation.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact of the affected system, particularly if it involves sensitive data or critical infrastructure. The likelihood of malicious abuse is moderate, as tools like ToDesk are often weaponized in remote access attacks. However, the prevalence of legitimate use cases exists, requiring further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate ToDesk uses within the organization; misconfiguration of logging may also hinder accurate event capture. Users may legitimately invoke ToDesk for remote support, which can trigger this alert. A related detection to consider would be the monitoring of unauthorized outbound network connections, particularly to unfamiliar IP addresses, enhancing visibility around potential malicious use of remote access tools.

