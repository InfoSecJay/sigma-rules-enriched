  ### Technical Context

  This rule detects process activity associated with the ToDesk Remote Management Tool (RMM). The behavior indicates potential command-and-control (C2) activity, as attackers may utilize ToDesk for remote access or control over compromised hosts. This detection aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the related technique of Remote Management Software (T1219). The primary telemetry source is Windows process creation logs, specifically the Security Event ID 4688 and Sysmon Event ID 1, capturing the creation of processes by ToDesk components.

  If malicious, the presence of this tool on a system can lead to unauthorized remote access and potential data exfiltration. However, this detection does NOT confirm malicious intent on its own, as ToDesk may be used legitimately in corporate environments.

  ### Investigation Steps

  - **Identify the process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 for new instances of processes named `ToDesk.exe`, `ToDesk_Service.exe`, or `ToDesk_Setup.exe`. Focus on timestamps that correspond to the alert.

  - **Check parent process relationships:** Examine the parent process for these entries to determine if they were spawned by known administrative tools or user logins, which may indicate legitimate use (e.g., spawned by `cmd.exe` or an authorized management tool).

  - **Analyze user accounts:** Cross-reference the user account associated with the ToDesk processes. Look for accounts that typically do not have administrative privileges executing these processes, which may suggest malicious activity.

  - **Review outbound network connections:** Utilize firewall logs or network traffic captures to check for outbound connections from the system running ToDesk. Look for unusual IP addresses or domains, indicating possible C2 communication.

  - **Validate asset criticality:** Assess the affected system's role within the organization (e.g., server vs. workstations). Highlight if the system has critical data or functionality tied to organizational operations.

  - **Identify other RMM tools:** Investigate for the presence of similar remote management tools that may indicate a broader exploitation attempt. Cross-reference with telemetry sources like Software Inventory reports or additional process logs.

  ### Prioritization

  This alert carries medium severity due to the classification of behaviors associated with remote management tools, often weaponized for unauthorized remote access. The impact level is considerable if the affected system holds sensitive data or critical applications, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of ToDesk in corporate environments. Variances in logging configurations can result in missed detections; ensure appropriate logging is enabled across all endpoints. Legitimate administrative activities might trigger this alert. A related detection includes monitoring for unexpected administrative logins or the use of other remote administration tools, enhancing overall coverage against potential exploitation.

