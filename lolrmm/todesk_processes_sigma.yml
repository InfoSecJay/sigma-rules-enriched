note: |
  ### Technical Context
  This detection rule identifies potential process activity related to the ToDesk Remote Management Tool (RMM), which can be utilized for legitimate purposes as well as for unauthorized remote access by attackers. The rule targets specific executable files associated with ToDesk, namely `todesk.exe`, `ToDesk_Service.exe`, and `ToDesk_Setup.exe`, often found during remote access sessions. Attackers may use such tools to gain and maintain access to compromised machines, thus facilitating lateral movement, data exfiltration, or further exploitation.

  The relevant MITRE ATT&CK techniques for this rule include **T1219: Remote Access Tools** which encapsulates the use of RMM software like ToDesk for establishing connections to target systems. The primary objective of attackers would be to manipulate systems stealthily, conduct reconnaissance, or deploy additional malicious payloads while maintaining persistence within the environment.

  The best data sources for detecting this activity are **process creation logs** from Windows systems, as these logs contain critical information about application launches and their associated parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine process creation logs for instances of `todesk.exe`, `ToDesk_Service.exe`, or `ToDesk_Setup.exe` along with their parent processes to identify potentially unauthorized usage.
  - **Investigate Parent Process Relationships:** Look into the parent processes that initiated ToDesk-related executables to determine if they stem from legitimate user activity or suspicious origins.
  - **Check for Network Connections:** Analyze any outbound network connections from systems running ToDesk to identify communication with known command-and-control (C2) servers or other untrusted IP addresses.
  - **Correlate with User Activity:** Assess user activity logs around the time of the process creation to correlate legitimate use versus potential misuse, such as unusual access patterns or logins from unexpected locations.

  ### Prioritization
  This alert is classified as medium severity due to the potential for misuse of remote access tools like ToDesk, which can lead to unauthorized access and exploitation of sensitive data in enterprise environments. The presence of such tools may indicate malicious intent, especially if accompanied by other suspicious activities.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate usage of ToDesk, as this rule could generate false positives in scenarios of authorized remote support or administrative access. The alert assumes that all installations of ToDesk on the network are unauthorized or suspect, which may not be the case. Additionally, proper logging configurations must be in place to capture detailed process creation events for this detection rule to function effectively.

