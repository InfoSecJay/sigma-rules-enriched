note: |
  ### Technical Context

  This Sigma rule detects network connections to LiteManager RMM tool domains, specifically targeting domains associated with remote management and control functionalities. The likely attacker objective is to gain unauthorized access to or control over a target system, often to facilitate lateral movement, data exfiltration, or installation of additional payloads. This behavior maps to the MITRE ATT&CK technique "Remote File Copy" (T1219).

  The primary telemetry source for this detection is Windows network connection logs, particularly entries indicating outbound connections. Malicious use of LiteManager can lead to significant security impacts, including unauthorized access to sensitive data and potential system compromise. However, this detection does NOT confirm malicious intent on its own, as LiteManager may also be used for legitimate purposes within the organization.

  ### Investigation Steps

  - **Identify network connection logs:** Review the Security Event ID 5156 (Windows Filtering Platform) to find outbound connections. Filter logs by destination hostnames ending with '.litemanager.ru' or '.litemanager.com'.

  - **Correlate logged connections with asset roles:** Confirm if the system making these connections is intended to use remote management tools. Check asset inventory for any known uses of LiteManager on that host.

  - **Examine process associations:** Check for associated processes using Sysmon Event ID 1 for the connections to see if there are suspicious command-line arguments or parent processes indicating malicious activity.

  - **Review user activity:** Analyze user activity logs (e.g., Windows Security Event ID 4624) around the time of the detected connection. Determine if the user is authorized to initiate such connections.

  - **Assess target system impact:** Determine the criticality of the affected system based on its role within the enterprise (e.g., high-criticality if a server handling sensitive data).

  - **Look for additional exfiltration artifacts:** Validate if any file transfer activity is reported around the time of connection, using file system logs (e.g., Windows Security Event ID 4663).

  ### Prioritization

  The alert has medium severity due to the potential impact on critical systems if exploited by an adversary. The likelihood of malicious abuse is plausible since remote management tools like LiteManager are often weaponized for unauthorized access. It is essential to prioritize investigations involving sensitive or critical assets.

  ### Blind Spots and Assumptions

  This detection may be limited by the legitimate use of LiteManager in the environment, potentially leading to false positives. Reliable detection requires comprehensive logging configurations for both network activity and process creation. Additionally, the detection may not capture internal traffic if LiteManager is being used in a trusted capacity. Companion detections for tools traditionally abused for remote access would strengthen security posture against misuse.

