note: |
  ### Technical Context

  This rule detects potential network connections to LiteManager remote management tool domains, specifically targeting *.litemanager.com and *.litemanager.ru. The likely objective of an attacker utilizing LiteManager is to establish unauthorized remote control of a compromised system, which can facilitate further exploitation, data exfiltration, or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic of **Command and Control** (TA0011) and technique **Application Layer Protocol** (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically those capturing outbound DNS queries or HTTP/HTTPS traffic. If the activity is malicious, it may lead to unauthorized access, data leakage, or system compromise. Notably, this detection does NOT confirm malicious intent on its own, as legitimate administrative use of LiteManager can also trigger the alert.

  ### Investigation Steps

  - **Check network logs for outbound connections to LiteManager domains:** Review Windows Security Event IDs 5156 (Windows Filtering Platform) and 5158 (Filtered Connection) to confirm connections to *.litemanager.com or *.litemanager.ru.

  - **Identify the initiating process:** Investigate the process responsible for the network connection using Sysmon Event ID 3 (Network Connection) to ascertain if it is a known legitimate application or an unexpected binary.

  - **Review user accounts associated with the connection:** Determine if the connection was made by an authorized administrative user or a non-privileged account engaging in suspicious behavior that may indicate compromise.

  - **Compare against normal operational behavior:** Assess typical remote management tools that are sanctioned and used in the environment to distinguish between legitimate use and potential abuse.

  - **Correlate with other security alerts:** Check for additional alerts or logs indicating suspicious behavior from the same host, such as abnormal login attempts or processes attempting to launch commands indicative of remote access tool usage.

  ### Prioritization

  This alert has a medium severity as it stems from a potentially high-risk remote management tool commonly abused by attackers. The impact can be significant, especially in environments where unauthorized access could lead to data breaches or destruction of critical infrastructure. Given that LiteManager is recognized for its capabilities in remote administration, the likelihood of malicious intent is moderate, especially if there’s no documented business need for its use.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of VPNs or proxies to obscure traffic to LiteManager domains. Additionally, if network logs are not retained long enough or if certain types of traffic are filtered, detections could be missed. Legitimate remote management activities, such as those performed by IT support staff, may inadvertently trigger this alert. A companion detection, such as monitoring for unauthorized installation of remote management applications, can strengthen coverage and support more comprehensive assessments of remote access threats.

