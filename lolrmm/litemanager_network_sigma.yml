note: |
  ### Technical Context

  This Sigma rule detects network activity associated with LiteManager Remote Management Tool (RMM), which may indicate unauthorized remote access attempts. Attackers often use RMM tools to control compromised systems, facilitating lateral movement and data exfiltration. The relevant MITRE ATT&CK technique is Remote Services (T1219). Primary telemetry sources include Windows network connection logs, specifically targeting outbound connections to hosts ending with `*.litemanager.ru` and `*.litemanager.com`. If these connections are malicious, they pose a risk of unauthorized remote access, potential data theft, or exploitation of internal systems. However, this detection does NOT confirm malicious intent on its own, as legitimate usage of LiteManager may occur within the environment.

  ### Investigation Steps

  - **Identify outbound connections to LiteManager domains:** Review Windows Event ID 5156 (Windows Filtering Platform) logs for connections to `*.litemanager.ru` and `*.litemanager.com`. Confirm the connection timestamps against user activity logs to determine if it aligns with legitimate usage.

  - **Check for associated processes:** Use Sysmon Event ID 3 (Network Connection) to identify the process initiating connections to LiteManager domains. Malicious indicators include processes running under unexpected user accounts or those that do not correspond to known applications.

  - **Examine user account activity:** Query Windows Security Event IDs 4624 and 4625 for logon attempts. Review login patterns around the timeframe of the LiteManager activity to determine if unusual or unauthorized accounts are involved.

  - **Correlate with other remote access alerts:** Cross-reference with other detection rules related to Remote Access Tools (RATs). Multiple simultaneous detections or related alerts can increase confidence in malicious behavior.

  - **Assess legitimate context for LiteManager use:** Review asset inventory for any authorized use cases of LiteManager within your environment. Establish brokered user permissions and required operational processes to differentiate benign from malicious use.

  ### Prioritization

  This alert is medium severity due to the potential impact on critical systems and the likelihood of misuse by adversaries who may leverage remote RMM tools for noise-free access. Detection of LiteManager activity warrants prompt investigation, as such tools are commonly weaponized for exploitation and persistence.

  ### Blind Spots and Assumptions

  Detection may be limited if the adversary employs encrypted communication to obfuscate their activities. Ensure proper logging configurations are in place for Windows Filtering Platform events to maintain visibility. Legitimate administrative use of LiteManager may trigger similar alerts, necessitating careful investigation. Companion detections, such as alerts for uncommon remote desktop connections (RDP) or other remote access services, can strengthen the overall security posture against the use of unauthorized RMM tools.

