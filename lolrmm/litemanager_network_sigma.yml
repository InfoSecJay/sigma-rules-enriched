note: |
  ### Technical Context

  This rule detects network activity directed at known domains associated with the LiteManager Remote Management Tool (RMM). The primary behavior monitored is connection attempts to domains ending with `*.litemanager.ru` and `*.litemanager.com`, which are indicative of potential remote administration activity by an adversary. The likely attacker objective could include unauthorized remote access or control over affected systems. This detection aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique T1219 (Remote Access Tools).

  The primary telemetry sources involved in this detection include network connection logs from Windows systems. Specifically, Event ID 5156 (Windows Filtering Platform) details the allowed connections, while Event ID 5158 identifies connection failures. If malicious, this activity may lead to widespread data compromise or unauthorized access to critical systems. It’s important to note that this detection does NOT confirm malicious activity on its own, as legitimate use of the LiteManager tool can trigger the alert.

  ### Investigation Steps

  - **Review network connection logs:** Look for Event ID 5156 for allowed connections and Event ID 5158 for failures related to the domains ending with `.litemanager.ru` or `.litemanager.com`. Compare connection timestamps against known legitimate usage patterns of LiteManager.

  - **Verify process activity:** Investigate associated process creation using Sysmon Event ID 1. Look for processes like `LiteManager.exe` or similar that align with the detected network connections, with an emphasis on unusual parent-child relationships indicating possible malicious execution.

  - **Check for repeated connections:** Inspect for repeated or unusual connection attempts within a short time frame to LiteManager domains, which may indicate automated malicious behavior rather than regular administrative tasks.

  - **Correlate with asset inventory:** Confirm the role and criticality of the affected assets. Determine if these systems are typically managed remotely or if there's any unexpected operating environment for LiteManager usage.

  - **Analyze DNS logs for resolution:** Inspect DNS query logs that may reveal requests made to the LiteManager domains, looking specifically for unexpected resolutions from internal systems or clusters instead of approved DNS servers.

  ### Prioritization

  The alert severity is medium due to the potential for significant impact on critical systems if exploited for unauthorized remote access. As LiteManager is known to be abused for malicious purposes, the likelihood of malicious abuse remains moderate, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  This detection may face limitations due to potential evasion via custom domain names or encrypted traffic. Dependencies on accurate and comprehensive network logging mean that systems not logging the relevant events may produce gaps in visibility. Legitimate remote support activities may also trigger this alert, particularly in organizations that utilize LiteManager for legitimate purposes. A related detection to enhance coverage would be monitoring for process creation involving known remote access tools or unusual patterns of remote management.

