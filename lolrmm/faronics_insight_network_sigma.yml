note: |
  ### Technical Context

  This rule detects outbound network connections to various Faronics domains, which may indicate the use of the Faronics Insight RMM tool. The likely attacker objective could involve remote management or data exfiltration efforts during an active intrusion. This activity is related to the ATT&CK technique: **Command and Control (T1071)** and **Remote System Administration (T1219)**. Primary telemetry sources include network connection logs from Windows, specifically logs tracking external connections to identified Faronics domains. If the detected activity is malicious, the security impact could involve unauthorized access to or manipulation of systems under administrative control. However, it is important to note that this detection alone does not confirm malicious intent, as the tool may also be in legitimate use.

  ### Investigation Steps

  - **Check network connection logs for outbound traffic:**
    Review Windows network connection logs (typically Security Event ID 5156) for connections to identified Faronics domains. Look for unusual timing or volume that deviates from typical behavior.

  - **Identify the host making the connection:**
    Determine the originating host and user account associated with the connections. Assess if the system is part of a management or administrative group or if it's a non-standard machine.

  - **Establish baseline traffic:**
    Compare current logs against historical data. Legitimate use of the Faronics Insight tool would typically manifest during routine IT maintenance windows.

  - **Review process details:**
    Investigate the associated process(es) making the network calls, capturing the process ID and parent process. Check for known legitimate parent processes related to RMM activities, such as administrative consoles.

  - **Validate with additional malware signatures:**
    Use endpoint detection tools to cross-reference the processes and network connections against threat intelligence for known malicious behavior associated with Faronics Insight or similar RMM tools.

  ### Prioritization

  This alert should be treated with medium severity. The impact can vary depending on the role of the affected systems, especially if administratively privileged machines are involved. Given the legitimate use cases for this software, it is essential to validate the context to assess potential malicious abuse accurately.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not configured to capture all outbound connections or if network filtering obscures some legitimate activity. Legitimate uses of the Faronics Insight tool during preset maintenance could trigger alerts. A companion detection to consider would be monitoring for endpoint process creations related to Faronics applications, strengthening overall coverage for potential misuse or abuse scenarios.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
