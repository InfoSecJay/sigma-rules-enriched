note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to the Windows registry, specifically targeting the Alpemix RMM tool. The likely attacker objective is to establish a remote management presence on compromised systems, facilitating additional operations such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique for Remote Services: Remote Desktop Protocol (T1219). The primary telemetry source is Windows registry event logs, with a focus on changes to the keys associated with the Alpemix service.

  If this activity is indeed malicious, it could lead to unauthorized access to sensitive systems and data compromise. However, it is important to note that this detection does NOT confirm malicious activity on its own, as legitimate administrative use of Alpemix could trigger the same alerts.

  ### Investigation Steps

  - **Check registry modification timestamps**: Review the registry event logs (Event ID 4657 or Sysmon Event ID 13) for changes to `HKLM\SYSTEM\CurrentControlSet\Services\AlpemixSrvcx` around the alert timestamp to determine if the modification coincided with anomalous user activity.

  - **Identify user accounts making changes**: Look for the `SubjectUserName` and `SubjectDomainName` fields in the registry logs to see which user account made the changes. Compare to baselined user activity to identify unauthorized access.

  - **Review process creation events**: Investigate Security Event ID 4688 to find if any processes were created that reference Alpemix or associated binaries around the same time as the registry modification. Look for unusual parent-child process relationships.

  - **Correlate with network traffic**: Monitor for outbound connections to known Alpemix or other RMM IP addresses using firewall or proxy logs. Any connections within a short period after registry changes warrant a deeper investigation.

  - **Outline legitimate use cases for Alpemix**: Document and compare with expected behavior for your organization. If Alpemix is an authorized tool, verify that it was executed by known administrators within the guidelines of usage policy.

  - **Look for additional persistence mechanisms**: Examine startup folder entries or scheduled tasks that might be created alongside the registry modification, which could indicate a broader scope of malicious activity.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on the affected system if used maliciously. Given that RMM tools like Alpemix can facilitate remote access, there is a significant risk of abuse by attackers. While not the most common vector, similar tools are frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions triggering this alert, particularly in environments where Alpemix is authorized for use. Reliable detection relies on having registry event logging sufficiently configured and actively monitored. It is also important to note that other remote management tools may exhibit similar registry activity, which could lead to false positives. Companion detections, such as monitoring for remote desktop connections (T1076), enhance the overall visibility of remote access activity.

