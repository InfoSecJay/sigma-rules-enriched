note: |
  ### Technical Context

  This Sigma rule detects attempts to access or modify registry keys associated with the RdViewer Remote Monitoring and Management (RMM) tool, specifically targeting the service configuration located at `HKLM\SYSTEM\CurrentControlSet\Services\Rd_Service`. The behavior typically indicates that an attacker may be trying to deploy, configure, or manipulate the RMM tool to achieve unauthorized remote access or maintain persistence within the environment.

  The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically under Technique T1219 (Remote Access Tools). The primary telemetry source for this detection comes from Windows registry event logs, capturing any modifications or access to specified registry keys. If this behavior is malicious, it poses a significant security risk by enabling remote management capabilities that could lead to data exfiltration or lateral movement. However, this detection alone does not confirm malicious intent, as legitimate use of RdViewer by authorized personnel could trigger this alert.

  ### Investigation Steps

  - **Check recent registry changes:** Examine Windows Registry Event logs (Event ID 13) for any activity related to `HKLM\SYSTEM\CurrentControlSet\Services\Rd_Service` within the past 24 hours. Legitimate activity would typically involve changes by system administrators around scheduled maintenance, with timestamps aligning with known operational hours.

  - **Correlate with user activities:** Review the User Activity logs in conjunction with the registry event to identify the user or account that triggered the registry change. Look for accounts that typically access the RMM tool within the organization and assess their recent activity patterns.

  - **Identify high-confidence malicious indicators:** Check for unusual remote access sessions or connections to external IP addresses in conjunction with modifications to the RdViewer service. Look for any associated System Event IDs (for remote connection events) or Security Event ID 4624 (logon events) that could indicate unauthorized access.

  - **Validate historical usage:** Search for past Event IDs 13 related to `Rd_Service` to determine the baseline of normal operations. A sudden spike in registry changes or access in a short time frame could indicate an attacker's escalation.

  - **Monitor for additional lateral movement:** Assess other logs for network activity indicative of lateral movement, such as SMB traffic patterns or unusual DNS requests linking back to known RMM capabilities used in attacks (e.g., TCP/UDP connections on ports used by RDP or RMM tools).

  ### Prioritization

  This alert is medium severity due to the potential impact of exposed systems capable of remote management. While regex activity could be legitimate, the capability of RMM tools to facilitate attacks makes this behavior significant, especially if observed on critical systems. Malicious exploitation of such tools is commonly observed in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by log configurations not capturing all relevant registry events, particularly on systems that do not have auditing enabled. Legitimate system maintenance or updates by IT staff can inadvertently trigger this alert as well. A related detection could include monitoring for remote access tool installations or configurations, which provides additional context for suspicious activity surrounding RMM tools.

