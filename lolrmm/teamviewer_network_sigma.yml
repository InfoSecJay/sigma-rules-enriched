note: |
  ### Technical Context

  This Sigma rule detects network connections to TeamViewer RMM tool endpoints, specifically targeting domains associated with TeamViewer services. The likely attacker objective is remote access to systems for malicious activities, including data exfiltration, lateral movement, or post-exploitation actions. This detection corresponds with the MITRE ATT&CK tactic "Execution" (TA0002) and technique "Remote Access Software" (T1219).

  The primary telemetry sources are Windows network connection logs, particularly focusing on connection attempts to domains like `*.teamviewer.com`. If malicious, such activity could lead to unauthorized access to sensitive systems or data loss. Notably, this detection alone does not confirm that the activity is malicious; legitimate use of TeamViewer for support or remote management may also trigger this rule.

  ### Investigation Steps

  - **Verify connection details: ** Check Windows Security Event ID 5156 (Windows Filtering Platform) for the `DestinationHostname` and associated user/context to identify the initiator of the connection.

  - **Check endpoint role and usage: ** Identify if the endpoint is designated for remote support tasks. Legitimate users might establish connections to TeamViewer for authorized remote management; confirm if this aligns with business operations.

  - **Analyze process ID and parent process: ** Investigate associated processes using Sysmon Event ID 1 to determine if a known application or service initiated the TeamViewer connection. A process with a parent path of a remote access tool is suspicious.

  - **Monitor for patterns in connection frequency: ** Review Event ID 5156 over the past week to analyze for unusual connection patterns to `teamviewer.com`, noting any rapid reconnections that suggest unauthorized use.

  - **Review user behavior: ** Check user activity logs (Event ID 4624) for the account initiating the connection. Assess if the associated user is authorized to use TeamViewer and their activity aligns with legitimate business needs.

  ### Prioritization

  The alert is categorized as medium severity due to the potential security impact of unauthorized remote access applications. The likelihood of malicious abuse is moderate, especially in environments where remote support tools are strictly regulated. Such behavior can be weaponized during an active compromise, making timely investigation critical.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of logs not capturing DNS queries or encrypted traffic that bypasses traditional network monitoring tools. Legitimate organizational use of TeamViewer can produce false positives, particularly if remote support is common. A related detection that could strengthen coverage is monitoring for unusual patterns of access or configuration changes via legitimate remote desktop solutions.

