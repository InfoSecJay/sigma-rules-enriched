  ---

  ### Technical Context

  This rule detects outbound network connections to TeamViewer domains, indicating potential use of the TeamViewer Remote Management Tool (RMM) for remote access or management. Adversaries may leverage TeamViewer to establish unauthorized remote connections, facilitating data exfiltration, lateral movement, or initial access to systems. The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and the technique is **Remote Services** (T1219). The primary telemetry sources include Windows network connection logs that capture outbound traffic to specific domains.

  If malicious, the security impact could be severe, enabling unauthorized access to sensitive systems. However, this detection does not confirm malicious intent on its own, as legitimate business use of TeamViewer is common and can trigger this alert.

  ---

  ### Investigation Steps

  - **Review outbound network connections**: Check network connection logs for Event ID 5156 (Windows Filtering Platform) showing connections to TeamViewer domains like `*.teamviewer.com`. Look for multiple connections from sensitive roles (e.g., servers) which is unusual.

  - **Identify the process associated with the connection**: Use Sysmon Event ID 3 to correlate outbound connections with the associated process. Focus on unknown or uncommon processes initiating these connections, which might indicate malicious use.

  - **Analyze the timing and frequency of connections**: Investigate the connection timestamps to identify if the usage aligns with regular business hours or if it occurs during off-hours, which may suggest suspicious activity.

  - **Verify legitimate usage**: Check for known legitimate use of TeamViewer within the organization. Confirm whether the detected hosts have been registered for approved IT support or maintenance tasks. Document any prior authorized access.

  - **Check for associated suspicious activity**: Correlate with other alerts or logs (e.g., Windows Event ID 4624 for logon events) to identify if there were recent logins or unusual account activity for the user or machine making the connection.

  - **Assess asset criticality**: Pay special attention to connections from sensitive or high-value assets, such as domain controllers or financial servers, which may have a higher impact if compromised.

  ---

  ### Prioritization

  This alert has a medium severity due to the potential risk posed by unauthorized remote access tools like TeamViewer. The impact of a successful breach can be significant, particularly for critical systems, and the likelihood of misuse aligns with known adversary techniques that exploit remote management tools.

  ---

  ### Blind Spots and Assumptions

  Detection may not capture traffic encrypted by SSL/TLS; therefore, ensure logging at the network perimeter is configured to capture all outbound traffic. Legitimate activities, such as IT support using TeamViewer, may trigger this alert and must be investigated. Companion detections include monitoring for unusual user behavior around logins and unauthorized access attempts (Event ID 4625) to strengthen coverage against potential misuse.

