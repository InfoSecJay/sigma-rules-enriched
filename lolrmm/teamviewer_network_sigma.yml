note: |
  ### Technical Context
  This detection rule is intended to identify potential network activity associated with the TeamViewer Remote Management and Monitoring (RMM) tool. TeamViewer is commonly used for remote access and operations management, which can be legitimate for IT support purposes. However, malicious actors may exploit such tools for unauthorized access, lateral movement, or data exfiltration.

  In this context, attackers might aim to maintain persistence, control compromised systems, or conduct reconnaissance on an enterprise environment using TeamViewer. The relevant MITRE ATT&CK tactics and techniques include "Execution" (TA0002) and "Remote Services" (T1219), which highlight the use of remote desktop tools to enable further invasion and operations within a target network.

  Telemetry and log sources that will contain the best evidence of this activity include network connection logs from Windows machines. Specifically, logs that capture outgoing connections to TeamViewer-related domains will be crucial for identifying potentially malicious TeamViewer usage.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine network connection logs for established connections to TeamViewer domains. Pay close attention to the timestamps, source machines, and destination domains to understand the context of the activity.

  - **Correlate with End-User Activity:** Check for any end-user documentation or ticketing systems related to the use of TeamViewer. Identify if the connections align with legitimate remote support sessions or if they are out of character for the user.

  - **Identify Anomalous Spawning Processes:** Investigate the process creation logs on the source systems to see if any unusual processes were initiated around the same time as the network connections. This can help correlate the event with unauthorized use.

  - **Assess Internal Network Security Posture:** Evaluate firewall rules and configurations for any allowances made for TeamViewer traffic. Ensure that only trusted and necessary endpoints can communicate with TeamViewer services, reducing the likelihood of abuse.

  ### Prioritization
  This alert has a medium severity due to the critical nature of remote access tools like TeamViewer, which can facilitate unauthorized control over machines in an enterprise. While users may have legitimate reasons for using TeamViewer, any unexpected or unexplained connections should be promptly investigated due to the potential for escalation and compromise.

  ### Blind Spots and Assumptions
  One potential blind spot in the detection coverage is the legitimate usage of TeamViewer, which may generate false positives without contextual awareness of established protocols within the organization. The detection logic assumes that any connection attempts to specified TeamViewer domains are unauthorized unless documented otherwise. For the alert to function effectively, robust logging settings must be configured on endpoints to capture and retain detailed network connection logs, and network monitoring must be employed to observe outlier behaviors related to remote access tools.

