note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to TeamViewer-related domains, indicating potential use of the TeamViewer Remote Management (RMM) tool. Attackers may utilize TeamViewer for remote access, lateral movement, or exfiltration of data. The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and the technique is **Remote Access Software** (T1219). The primary telemetry sources include Windows network connection logs that capture DNS queries and established outbound connections.

  If the detected activity is malicious, it could lead to unauthorized access to sensitive data, credential harvesting, or further exploitation of network resources. However, this detection does NOT confirm malicious intent by itself, as legitimate TeamViewer usage may also trigger the alert.

  ### Investigation Steps

  - **Check logged connections to TeamViewer domains:** Review network connection logs (Windows Event ID 5156 for filtered connections, or Sysmon Event ID 3 for network connections) for outbound connections to known TeamViewer domains such as `*.teamviewer.com` or `router15.teamviewer.com`. Consider instances with unusual endpoint or user behavior as more suspicious.

  - **Identify legitimate TeamViewer use:** Verify asset inventories and maintenance schedules for endpoints that are known to use TeamViewer. Check if the connection timing aligns with expected remote support sessions or IT management activities.

  - **Correlate with user accounts:** Analyze user accounts initiating connections (Event ID 4768 and Event ID 4624). Highlight any accounts that are not typical for using TeamViewer or exhibit unusual access patterns, especially on critical systems.

  - **Review historical connection patterns:** Look for anomalous usage patterns by comparing previous outbound connections logged for the same endpoints over the last month to determine if the current behavior significantly deviates from the baseline.

  - **Investigate related security alerts:** Check for additional security alerts within the sim toolkit that may signal compromised credentials or unauthorized access. Correlate findings with alerts related to suspicious user account activity or remote logins.

  ### Prioritization

  The alert is of **medium severity** in an enterprise context, as it could indicate a compromised system if TeamViewer is being used maliciously. The likelihood of abuse is moderate since TeamViewer is a widely known RMM tool that is commonly utilized in both legitimate and illegitimate contexts.

  ### Blind Spots and Assumptions

  Detection may be limited by the misconfiguration of logging; specifically, if network connections are not logged correctly, important indicators may be missed. Frequent legitimate use of TeamViewer for remote support can cause false positives, requiring careful user behavior analysis to discern intent. A related detection to enhance coverage would be monitoring for **service installations or updates** that incorporate remote access tools, which could signal unauthorized software deployment.

