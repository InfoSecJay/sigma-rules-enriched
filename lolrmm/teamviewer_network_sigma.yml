note: |
  ### Technical Context

  This rule detects network connections to various TeamViewer domains, which are commonly associated with remote management and support activities. The likely objective behind these connections is the establishment of remote access for administrative or technical support or, potentially, malicious access. This activity aligns with the MITRE ATT&CK tactic for Command and Control (T1071.001) and the technique of Application Layer Protocol - Web Protocols (T1219).

  The primary telemetry sources are Windows network connection logs, which can typically be generated via System Event Log (Event ID 5156 - Windows Filtering Platform) and Sysmon (Event ID 3 - Network Connection). If this activity is malicious, it could lead to unauthorized access and data exfiltration. However, this detection does NOT confirm that the access is unauthorized or malicious on its own, as legitimate uses of TeamViewer exist.

  ### Investigation Steps

  - **Review network connection logs:** Check for Event ID 5156 or Sysmon Event ID 3 logs for the time of the alert. Examine the Process Name field for expected applications; connections from unauthorized executables (e.g., non-TeamViewer binaries) should be flagged as suspicious.

  - **Determine asset role:** Identify the host making the connection. If it is a server or high-value asset (such as a Domain Controller or sensitive database), the alert should be prioritized for deeper investigation as the risk is elevated.

  - **Correlate with known good:** Investigate previously documented legitimate use cases of TeamViewer within the organization. Catalog any authorized TeamViewer instances or users to distinguish between normal and adversarial behavior effectively.

  - **Analyze connection details:** Collect network artifact details like the DestinationHostname and associated DNS queries. Pay particular attention to unusual domain requests (e.g., patterns that differ from known good usage), which may indicate malicious intent.

  - **Identify recurring behavior:** Check for multiple connections over a short period to any TeamViewer domains in conjunction with known malicious indicators, such as high CPU usage or irregular process timelines, signaling potential exploitation.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of unauthorized remote access on critical systems. While legitimate use of TeamViewer is common, the likelihood of malicious abuse exists, particularly in targeted attacks. This behavior can be weaponized, particularly in environments with elevated privileges.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate TeamViewer usage, which can lead to false positives. Ensure that all required log sources, such as DNS logs and detailed network traffic data, are correctly configured to improve visibility into this activity. Legitimate administrative actions may trigger alerts if TeamViewer is used regularly in the organization. Complementary detections, such as monitoring for unusual authentication attempts or remote desktop sessions, could provide additional coverage to catch misuse.

