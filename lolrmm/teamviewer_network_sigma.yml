note: |
  ### Technical Context

  This Sigma rule detects network connections to TeamViewer-related domains, indicating potential unauthorized use of the TeamViewer remote management tool. The attacker objective may be to establish remote access for control or data exfiltration, aligning with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Remote Access Software (T1219). The primary telemetry source is the Windows network connection logs, specifically monitoring outbound connections to known TeamViewer domains. If the activity is malicious, it may facilitate unauthorized access to sensitive systems or data. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of TeamViewer is common in business environments.

  ### Investigation Steps

  - **Identify network connections:** Review Windows Security Event ID 5156 (Windows Filtering Platform) logs for outbound connections to *.teamviewer.com domains. Check the "Destination Address" and ensure it’s not part of expected legitimate usage.

  - **Analyze process activity:** Examine Sysmon Event ID 1 (process creation) to identify processes making connections to TeamViewer domains. Focus on parent process relationships to see if these connections stem from administrative or system processes indicative of standard operational behavior.

  - **Review DNS query logs:** Cross-verify DNS queries (Event ID dnsQuery) for requests to TeamViewer domains. Legitimate activity might include queries from known IT support systems, whereas anomalous frequent requests may indicate malicious usage.

  - **Establish asset role:** Investigate the context of the host making these connections. Determine if it's a critical asset (e.g., a domain controller or sensitive workstation) and assess the risk if compromised.

  - **Correlate with remote access logs:** Cross-check with any existing logs or alerts indicating remote desktop protocol (RDP) activity or other remote access tools used on the same asset, which could signify operational context versus potential compromise.

  ### Prioritization

  This alert should be considered of medium severity due to the potential impact of unauthorized remote access on critical systems. Given that TeamViewer is a commonly abused tool for remote access by malicious actors, the likelihood of abuse warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate traffic from authorized TeamViewer users, which could generate false positives. Required log sources include comprehensive network connection logs and DNS queries, which must be configured to ensure thorough monitoring. Common legitimate activities that may trigger this alert include remote desktop support sessions initiated by internal IT staff. A related detection to consider is monitoring for outbound connections to known command and control IP addresses, which can strengthen overall security posture in the event of a more coordinated attack.

