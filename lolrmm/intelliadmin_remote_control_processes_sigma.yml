note: |
  ### Technical Context

  The Sigma rule detects the creation of processes associated with the IntelliAdmin Remote Control (RMM) tool, which can be utilized for legitimate remote administration but also poses a risk for unauthorized access and control over systems. The likely attacker objective is to establish remote access for malicious activities such as data exfiltration or lateral movement within the network. This behavior correlates with the MITRE ATT&CK technique for Remote Access Software (T1219).

  Primary telemetry sources include Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If executed maliciously, this rule could indicate active adversary presence and control over compromised resources. However, it is important to note that this detection does NOT confirm malicious intent on its own, as the tool may be used legitimately by system administrators.

  ### Investigation Steps

  - **Review Process Creation Events:** Examine Security Event ID 4688 or Sysmon Event ID 1 for any created process with names ending in 'iadmin.exe', 'intelliadmin.exe', 'agent32.exe', 'agent64.exe', or 'agent_setup_5.exe'. Malicious activity may involve these processes executed with unusual parent processes.

  - **Analyze Parent Process:** Investigate the parent process for context regarding the creation of the remote control processes. Look for legitimate parent processes like 'powershell.exe' or 'cmd.exe', but be wary of unexpected executables indicating potential misuse.

  - **Check Execution Context:** Confirm the user account that initiated the process creation, looking for unexpected user accounts or administrative privileges being used to launch these processes. This can indicate unauthorized access.

  - **Identify Installed RMM Tools:** Perform inventory of installed software on affected systems, specifically checking for legitimate installations of IntelliAdmin and its configuration. If these tools were not installed via established protocols, further investigation is warranted.

  - **Log and Update Network Activity:** Review network logs for any connections made by the detected processes to external IP addresses. Investigate any unusual or foreign destinations contacted by processes with high-risk names.

  - **Benchmark Against Legitimate Traffic:** Validate expected behavior by referencing legitimate remote access sessions and typical usage patterns for IntelliAdmin within your environment. This helps establish a baseline for detection efficacy.

  ### Prioritization

  The alert severity is medium due to the potential impact on sensitive systems and the likelihood of malicious abuse if the remote control tool is utilized without proper authorization. Basic functionality of remote administration tools is often weaponized by adversaries to gain unauthorized access, making it crucial to evaluate each alert seriously.

  ### Blind Spots and Assumptions

  Detection might be limited by system configuration or logging level settings; ensure that Windows event logging and Sysmon are configured properly to capture all relevant events. Legitimate administrative activities might also trigger this alert, particularly during remote support tasks. A related detection to strengthen coverage would be monitoring network connections from these process names, as it could indicate further malicious activities or communication with command and control servers.

