note: |
  ### Technical Context
  This rule detects the execution of processes associated with the IntelliAdmin Remote Control tool, which is often utilized as an RMM (Remote Monitoring and Management) solution. While it can be used for legitimate remote administration, the tool's capabilities also make it attractive to threat actors for unauthorized access and control over systems within an enterprise network. Attackers may use this tool to establish persistence, execute commands remotely, or exfiltrate data.

  In the context of MITRE ATT&CK, the relevant tactics and techniques associated with this detection include **Execution** (TA0002) and **Remote Services** (T1219), where adversaries may leverage tools to remotely execute commands or manage affected systems. The primary data source for this detection will be Windows process creation events, which log the initiation of processes on the operating system.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for instances of `iadmin.exe`, `intelliadmin.exe`, `agent32.exe`, or `agent64.exe`. Check for any unusual parent processes that initiated these executables.
  - **Correlate with User Activity**: Look into user account activity around the time the remote control processes were initiated. Determine if the processes were executed by authorized personnel or accounts that have been compromised.
  - **Examine Network Connections**: Investigate any network traffic related to the detected processes, focusing on remote connections that might indicate unauthorized access or data exfiltration attempts.
  - **Assess Installed Software**: Validate if the execution of these processes correlates with legitimate business activities. Confirm whether IntelliAdmin Remote Control is listed among the approved software and understand its intended use within the organization to filter true positives from potential threats.

  ### Prioritization
  The alert is classified as medium severity due to the potential for unauthorized remote access and control by attackers, which can lead to significant compromise of sensitive data and overall network integrity. The behavior can be indicative of both legitimate administrative actions and malicious activity, warranting thorough investigation.

  ### Blind Spots and Assumptions
  This detection relies on the assumption that all process creation events are adequately logged and available for review. A potential blind spot could arise if the IntelliAdmin tool or its components are installed and run in a manner that does not generate standard process creation logs, such as executing from a non-standard environment or through obfuscation techniques. Additionally, this rule may not capture instances of privileged access misuse if legitimate users compromise their account credentials to misuse the RMM tool. Adequate logging configurations in the Windows environment are essential for this alert to function effectively.

