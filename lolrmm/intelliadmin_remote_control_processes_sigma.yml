note: |
  ### Technical Context

  This Sigma rule detects process execution associated with the IntelliAdmin Remote Control (RMM) tool, specifically monitoring for processes such as `iadmin.exe`, `intelliadmin.exe`, `agent32.exe`, `agent64.exe`, and `agent_setup_5.exe`. The likely attacker objective is to establish remote control over a target system without authorization, enabling further exploitation, data exfiltration, or lateral movement within the environment. This behavior aligns with the MITRE ATT&CK framework's Command and Control tactic (TA0011) and the technique Remote Access Tools (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing details about process initiation. If malicious, use of this tool can lead to unauthorized access and control of critical systems. However, this detection does not confirm actual malicious intent on its own, as legitimate use of IntelliAdmin by authorized personnel could trigger these alerts.

  ### Investigation Steps

  - **Check process execution:**
    Review Security Event ID 4688 and Sysmon Event ID 1 for any occurrences of `iadmin.exe`, `intelliadmin.exe`, `agent32.exe`, `agent64.exe`, or `agent_setup_5.exe`. Investigate the context of the process (such as user account and command line) to determine if it is part of a legitimate business operation.

  - **Correlate with authorized personnel:**
    Verify if the user account running the detected process has legitimate access rights to use IntelliAdmin, comparing it against personnel records or access logs. Unauthorized accounts executing this remote control software suggest potential compromise.

  - **Analyze parent processes:**
    Identify and review parent processes that spawned the detected executable via the `ParentImage` field in the relevant logs. Legitimate executions will typically originate from known administration tools or secure scripts; unexpected parent processes may indicate malicious activity.

  - **Validate against remote access policies:**
    Assess organizational policies on remote access tools to determine if the detected process matches any authorized tools. This includes reviewing configuration management or endpoint security systems for approved software lists.

  - **Investigate network connections:**
    Use firewall or network monitoring logs to assess outbound connections initiated by the detected process. Look for suspicious destination IPs or domains that do not align with expected operational traffic or require immediate scrutiny.

  ### Prioritization

  This alert is of medium severity, as it could indicate potential misuse of legitimate remote administration tools. The impact on critical systems can be significant if an unauthorized user gains control. While such tools may be necessary for IT operations, they can also be abused by adversaries, making this an important alert for triage.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of IntelliAdmin by authorized personnel, leading to false positives. Reliable detection depends on having comprehensive logging configured for process creation events and potentially monitoring outbound network connections. Additionally, similar remote access activities may occur with other tools (e.g., TeamViewer, AnyDesk), so it is beneficial to have companion detections for those tools to strengthen coverage.

