  ### Technical Context
  This detection rule identifies process creation events involving potential Remote Monitoring and Management (RMM) tool activities specifically linked to the Access Remote PC software, which may indicate unauthorized remote access attempts. Attackers may leverage RMM tools like Access Remote PC to gain control over systems within an enterprise, allowing for activities such as reconnaissance, lateral movement, or exfiltration of sensitive data. The primary objectives for attackers utilizing such tools typically include maintaining persistence, evading detection, and manipulating legitimate user sessions.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic: Execution**
    - **Technique: User Execution (T1219)**: Attackers may trick users into executing malicious files related to RMM tools.

  The primary data sources that will yield the most pertinent evidence of this behavior are process creation logs from Windows endpoints, which document the execution of programs, their parent-child relationships, and timestamps.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation entries on targeted endpoints for instances where `rpcgrab.exe` or `rpcsetup.exe` are spawned. Correlate these with additional contextual information.
  - **Analyze Parent Process Relationships:** Investigate the parent processes of the identified suspicious RMM tool processes. Look for unknown or atypical executables that launched `rpcgrab.exe` or `rpcsetup.exe`.
  - **Check Network Connections:** Query logs from network security tools (NDR, NGFW) for outbound connections that may indicate remote access, particularly focusing on unusual remote sessions initiated by IP addresses associated with the Access Remote PC tool.
  - **Identify User Activity:** Monitor user activity logs for any accounts that may have interacted with RMM tools recently. Validate whether these user actions were legitimate or indicative of potential credentials compromise.

  ### Prioritization
  The medium severity level is justified by the potential for significant impact should an attacker successfully leverage RMM tools for unauthorized remote access, combined with the moderate likelihood of such tools being used in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection logic may not cover all legitimate uses of Access Remote PC, leading to potential false positives if these tools are employed legitimately by IT staff. It assumes that logs from the endpoint's process creation events are properly configured and collected. Additionally, if the tool is renamed or modified, detection may be bypassed. Therefore, ensuring comprehensive log retention and appropriate monitoring configurations is critical for effective detection.

