  ---

  ### Technical Context

  This rule detects the execution of processes associated with Access Remote PC, specifically looking for child processes spawned by either `rpcgrab.exe` or `rpcsetup.exe`. The likely attacker objective is to gain unauthorized remote access and control over targeted systems for data exfiltration or lateral movement. This activity aligns with the MITRE ATT&CK technique for Remote Desktop Protocol (RDP) using Remote Management Tools (T1219).

  The primary telemetry sources include Windows process creation logs (Event ID 4688 or Sysmon Event ID 1) that detail the spawning of processes and their parent-child relationships. If malicious, this behavior poses significant risks, including unauthorized access to sensitive information and potential compromise of internal resources. Importantly, this detection does NOT confirm malicious activity by itself, as legitimate use of Access Remote PC is common in managed environments.

  ---

  ### Investigation Steps

  - **Identify parent processes**: Review Process Creation logs (Event ID 4688) for any occurrences where `rpcgrab.exe` or `rpcsetup.exe` are listed as parent processes. Look for unusual child processes created subsequently, such as unattended access tools.

  - **Correlate timestamps**: Check timestamps of the detected process creation against other security events in the same timeframe. If the events coincide with known user behavior (such as after-hours logins), it may indicate suspicious activity.

  - **Examine user context**: Analyze the user account associated with the process creation (Event ID 4688, fields: `NewProcessName`, `SubjectUserName`). Look for anomalous accounts or roles that do not typically engage with remote access tools, suspecting unauthorized use.

  - **Assess historical behavior**: Look for historical logs of legitimate usage of Access Remote PC by the reported user account or device, confirming whether this instance deviates from known operational patterns.

  - **Monitor network connections**: Investigate network logs for outbound connections from the IP address associated with the detected process. Check for traffic to known suspicious or untrusted IPs related to remote access.

  - **Evaluate system role**: Consider the asset’s role within the environment (e.g., server, workstation). High-privilege assets experiencing this activity warrant immediate escalation due to the increased risk of credential theft and lateral movement.

  ---

  ### Prioritization

  This alert should be treated with medium priority. The impact on affected systems could be severe if the processes lead to unauthorized access, especially on critical infrastructure. The likelihood of malicious use is moderate, given the legitimate presence of Access Remote PC, but this tool is not uncommon for attacker exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss attempts to obfuscate the process name or execute malicious behavior without invoking `rpcgrab.exe` or `rpcsetup.exe`. Reliable detection requires proper logging configuration for process creation on all endpoints, ensuring event integrity. Additionally, legitimate administrative activity using Access Remote PC may frequently trigger this alert. A companion detection to consider is monitoring for anomalous logins through RDP, which could provide further context for suspicious activity.

