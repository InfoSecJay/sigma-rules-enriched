note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Syncro RMM tool, a remote monitoring and management solution. The likely attacker objective is to establish command and control (C2) channels or perform reconnaissance on compromised systems while using legitimate tools to blend in. This behavior maps to the MITRE ATT&CK tactic "Execution" and technique "Remote Access Software" (T1219).

  The primary telemetry sources are Windows network connection logs, specifically looking for outbound traffic to specified domains. If malicious, the security impact could involve unauthorized remote access to systems, potentially leading to data breaches or lateral movement within the network. Importantly, this detection does NOT confirm that all connections to these domains are malicious, as legitimate administrative activities can also trigger the alert.

  ### Investigation Steps

  - **Check network connection logs for matches:** Review Windows Security logs (Event ID 5156) for outbound connections to 'kabuto.io' or any listed Syncro domains. Note timestamps for user activity and correlate with other logs.

  - **Analyze preceding activities:** Review Windows Event ID 4688 (Process Creation) to identify processes that generated these network connections. Look for unusual processes that deviate from normal operations on the host.

  - **Identify asset usage patterns:** Determine if the device is an expected endpoint for using Syncro RMM (e.g., support teams' assets). Regular usage may indicate benign behavior if documented in the organization's approved software list.

  - **Validate unauthorized remote access:** Look for additional indicators of compromise, such as Event ID 7045 (Service Created) that may show persistence mechanisms for remote access. A new service created and configured to use the Syncro domains is a high-confidence malicious indicator.

  - **Monitor the behavioral footprint:** Gather context from Windows logs (Event ID 4648 and 4624) to see if there are any flagging user logins or elevated privileges that support the utilization of RMM software.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of remote access on critical systems. The likelihood of malicious abuse is moderate, as adversaries often leverage legitimate tools for nefarious purposes. While Syncro RMM can be used for legitimate administrative tasks, its network activity should be closely monitored for signs of misuse.

  ### Blind Spots and Assumptions

  Detection may miss malicious use of legitimate Syncro RMM connections due to the tool’s trusted nature. It’s essential to have proper log sources configured, such as detailed network connection logging, to ensure reliable detection. Legitimate internal support teams may trigger this alert during standard operations. Companion detections like unusual service creations or unexpected administrator logins can provide broader context and improve overall coverage.

