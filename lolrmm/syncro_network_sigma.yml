note: |
  ### Technical Context

  This rule detects network activity targeting specific domains associated with the Syncro Remote Monitoring and Management (RMM) tool. Attackers may leverage Syncro RMM for command and control (C2) operations, potentially guiding remote unauthorized actions on the host machine. The relevant MITRE ATT&CK tactic is Command and Control (ID: TA0011), with technique T1219 (Remote Access Software).

  Primary telemetry sources include Windows network connection logs capturing outgoing traffic to defined malicious or suspicious domains. Malicious activity could indicate a breach or unauthorized use of resources, leading to potential data exfiltration. However, it is crucial to note that detection of network connections to these domains alone does not confirm that they are malicious, as they may also represent legitimate usage by authorized personnel.

  ### Investigation Steps

  - **Check network connection logs:**
    Review Windows network connection logs (Event ID 5156) for traffic to domains like `*.syncromsp.com` or `*.kabutoservices.com`. Identify the source IP, destination IP, and timestamp for correlation with potential illicit activity.

  - **Validate process origin:**
    Analyze the processes making outbound connections using Sysmon Event ID 3. Confirm whether the connecting process is a legitimate Syncro service or a potentially malicious file masquerading as such.

  - **Identify connections from critical assets:**
    Focus on critical servers or endpoints (e.g., domain controllers, file servers) that should not be using Syncro RMM. High-volume outbound connections to detected domains from these assets warrant immediate escalation.

  - **Review user access and permissions:**
    Verify whether the user account responsible for the activity has legitimate access to use Syncro. Cross-reference user roles against company policies regarding RMM tools and document any discrepancies.

  - **Correlate with endpoint telemetry:**
    Gather file system events related to Syncro (Sysmon Event ID 11 for file creation) and check recent installations or modifications to the Syncro RMM client, which may indicate unauthorized software deployment.

  ### Prioritization

  This alert is of medium severity as it could indicate potential misuse of an RMM tool on highly critical systems, especially if coupled with other anomalous activities. Given the nature of remote access tools, they are often targeted by adversaries for exploiting secure environments, making this detection relevant in identifying potential threats.

  ### Blind Spots and Assumptions

  Potential detection limitations include attackers using domain fronting or legitimate tools for malicious purposes, which could evade detection. Valid log sources must be properly collected and configured, particularly Windows Event Logs and Sysmon data, for accurate telemetry. Legitimate company activities, such as authorized IT personnel using Syncro RMM for maintenance, may falsely trigger the alert. Companion detections, such as monitoring for suspicious user account behavior or unusual lateral movement patterns (ID: T1075), can enhance the overall detection effectiveness and context around this rule.

