note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with RustDesk, a remote desktop management tool that could be misused for unauthorized access or control of systems. The primary objective of an attacker utilizing RustDesk would be to establish command and control over compromised systems for data exfiltration or further malicious activity. This behavior is associated with the MITRE ATT&CK technique: **Remote Access Tools (T1219)**.

  The primary telemetry sources are Windows process creation logs, typically collected as Security Event ID 4688 or Sysmon Event ID 1. If malicious, the use of RustDesk could allow an attacker to manipulate and access sensitive information on the affected system. Importantly, the detection of this activity does NOT confirm compromise; legitimate use of the RustDesk tool may also generate similar alerts.

  ### Investigation Steps

  - **Review Process Creation Events:** Analyze Security Event ID 4688 or Sysmon Event ID 1 for process creation events with **Image** or **ParentImage** fields containing `rustdesk.exe`. Note timestamps and user accounts for context.

  - **Identify Parent Process:** Investigate the **ParentImage** to determine what process initiated RustDesk. A legitimate process would typically originate from a known IT management application, whereas unexpected parent processes may suggest malicious behavior.

  - **Check for Established Network Connections:** Review firewall or network logs (e.g., Windows Firewall logs, network device logs) for outbound connections to unusual IP addresses or domains originating from systems running RustDesk. High confidence in malicious activity may be indicated by connections to known C2 infrastructures.

  - **Assess User Context:** Evaluate user account activity from the Security logs (Event ID 4624) around the same time RustDesk was executed. Look for any unauthorized access or anomalies in expected user behavior patterns. Legitimate administrative access might be evident if the tool was used in an expected manner.

  - **Search for Additional Artifacts:** Investigate for file creations or modifications in known RustDesk installation directories. Look for files typically created at launch that may indicate non-legitimate usage or an improper setup.

  - **Document System Role and Impact:** When investigating alerts, note the criticality of the asset involved. RustDesk's presence on a high-privilege system may warrant higher urgency compared to a less critical endpoint.

  ### Prioritization

  This alert has medium severity as RustDesk, while sometimes used legitimately, carries risks when employed improperly. The likelihood of abuse is moderate due to its remote access capabilities and its potential association with threat actor tactics. Instances of RustDesk being weaponized for malicious activities are rising, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if process logging is not adequately configured, or if RustDesk is executed from non-standard locations that evade monitoring. Legitimate use cases, such as IT support sessions, could trigger alerts without malicious intent. Complementary detections, such as alerts for other remote access tools or unusual remote access sessions, can enhance overall coverage and context.

