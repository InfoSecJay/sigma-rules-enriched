note: |
  ### Technical Context

  This Sigma rule detects the execution of RustDesk remote desktop management (RMM) tool processes, indicated by parent and child process names associated with `rustdesk.exe`. An attacker may use RustDesk to establish remote connections for various purposes, including data exfiltration or system control, fitting the MITRE ATT&CK technique of Remote Access Software (T1219).

  Primary telemetry sources include Windows process creation events, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If malicious, the use of RustDesk could facilitate unauthorized access to sensitive information or systems. This detection does NOT confirm whether the remote access is benign or malicious, as legitimate use of RustDesk is common in various organizations.

  ### Investigation Steps

  - **Check for process origin:** Review the `ParentImage` field in Security Event ID 4688 or Sysmon Event ID 1 logs for indicators of execution from known legitimate software. For example, if the parent process is a system tool or application, further investigation may be less urgent.

  - **Identify unusual execution locations:** Analyze the `Image` path of the detected `rustdesk.exe` process for non-standard directories (e.g., user profile directories). Legitimate installations typically reside in `C:\Program Files` or `C:\Program Files (x86)`.

  - **Confirm networking activity:** Review network logs (e.g., Windows Firewall logs or NetSh commands) for outbound connections made by the `rustdesk.exe` process to external IP addresses or unusual ports, particularly if these connections occur during or after execution.

  - **Correlate with user behavior:** Cross-reference the execution timestamps with user account activity and login events (e.g., Security Event ID 4624) to establish if the user had legitimate access and intended to run remote access tools.

  - **Look for persistence mechanisms:** Investigate if RustDesk attempts to establish autostart mechanisms, such as registry keys under `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`, indicating potential persistence beyond initial execution.

  ### Prioritization

  This alert has a medium severity due to the potential impact of unauthorized remote access and the likelihood that such tools are commonly weaponized in malicious campaigns. Although RustDesk can serve legitimate purposes, its detection warrants investigation in sensitive environments with critical assets.

  ### Blind Spots and Assumptions

  There may be evasion techniques, such as renaming the RustDesk binary or execution from a trusted parent process, which can mask malicious intent. Reliable detection requires proper logging configurations to capture process creation signals. Legitimate remote access operations, such as IT support sessions, may trigger this alert. Related detections for remote access tools or unauthorized process execution could complement this coverage and allow for stronger detection relationships, such as monitoring for TeamViewer or AnyDesk usage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
