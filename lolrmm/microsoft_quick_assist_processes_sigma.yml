  ---

  ### Technical Context

  This rule detects the launch of processes that either spawn from or execute Microsoft Quick Assist, a remote management tool that allows assistance through screen sharing and control. The likely attacker objective could be to exploit this tool to gain unauthorized access or control over a victim's machine during an attack. This behavior aligns with the MITRE ATT&CK technique **Remote Desktop Protocol (T1219)**, typically used for lateral movement or command-and-control activities.

  The primary telemetry source for detection comes from Windows process creation logs, specifically focusing on the process execution of `quickassist.exe` and any instances where its parent process is involved. The security impact of this behavior could be significant, as it may indicate unauthorized access to a user's environment. However, it's important to note that this detection does NOT confirm malicious activity on its own, as legitimate support scenarios involving Quick Assist can also trigger this alert.

  ---

  ### Investigation Steps

  - **Review recent process executions: ** Check for Windows Security Event ID 4688 logs for `quickassist.exe` process creation. Focus on the user and system context initiating the process to distinguish between interactive user support sessions and potential abuse.

  - **Identify parent process: ** Examine the ParentImage field in the Event ID 4688 logs. If the parent process is from a known management or remote support tool, this might indicate legitimate behavior; however, if it originates from a suspicious or unexpected process, it could signal malicious activity.

  - **Verify user permissions and roles: ** Determine if the initiating user has legitimate reasons to use Quick Assist. Check user groups and permissions, especially for privileged accounts, to assess if this action aligns with typical job functions.

  - **Correlate with other telemetry: ** Cross-reference with Sysmon Event ID 1 to see the command-line arguments used when `quickassist.exe` was invoked. Anomalous commands or unusual execution contexts may suggest nefarious intent, such as attempts to escalate privileges.

  - **Benign usage scenarios: ** Document regular instances of Quick Assist usage within the organization. Confirm with the help desk or IT support teams about authorized usage patterns to reduce false positives and refine alert tuning.

  - **Track network connections: ** Review network logs for any unusual outbound connections initiated by systems executing Quick Assist. Look for established sessions to external IP addresses that do not match known IT support infrastructure.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact on systems if exploited for unauthorized access. The likelihood of abuse is moderate, as Remote Management tools can be weaponized in a compromised infrastructure. However, genuine support operations can trigger similar alerts, necessitating thorough investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging or lack of process tracking configurations. Attackers might use legitimate credentials or alter the process names to blend in, employing evasion techniques. Additionally, legitimate support activities could also raise alerts if teams use Quick Assist frequently. A related detection rule for monitoring use of administrative tools like `mstsc.exe` or `PsExec` could enhance overall coverage against remote access threats.

