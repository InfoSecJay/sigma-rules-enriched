note: |
  ### Technical Context

  This rule detects the execution of the Microsoft Quick Assist remote management tool, which may indicate unauthorized use of Remote Desktop capabilities. The likely attacker objective is to gain control over an endpoint, providing potential access to sensitive data or enabling further exploitation of the network. The relevant MITRE ATT&CK tactics and techniques include "Remote Access Software" (TA0001) and "Remote Management Software" (T1219). Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688. If malicious, this behavior can lead to unauthorized access and data compromise. This detection does NOT confirm malicious intent on its own, as Quick Assist may be used legitimately for remote support.

  ### Investigation Steps

  - **Verify Process Creation: **Check Windows Security Event ID 4688 for process creation of `quickassist.exe`. Look for the `New Process Name` field indicating paths that end with `C:\Windows\System32\quickassist.exe`. Benign instances will likely have a user account associated with known support personnel.

  - **Review Parent Process Context: **Examine the `ParentImage` field in Event ID 4688 for instances of Quick Assist being launched by trusted processes, such as `explorer.exe` or `msra.exe`. Legitimate occurrences will most often be initiated directly by user action from a known support scenario.

  - **Audit User Impact: **Identify the user accounts running Quick Assist by correlating logs with the `Account Name` field. Legitimate uses may be tied to service accounts or specific IT staff during support hours, while unfamiliar user accounts may indicate compromise.

  - **Correlate with Network Activity: **Look at recent network traffic logs that include connections to non-standard internal or external IP addresses during the Quick Assist activity. Malicious indicators might show unusual traffic patterns or attempts to connect to other systems, which could suggest lateral movement.

  - **Analyze Session Properties: **Review the Windows Event Logs for any `User Name` modifications or non-standard Remote Desktop Protocol (RDP) connections during the timeframe when Quick Assist is running. Frequent or unusual updates to user session states could point to unauthorized access attempts.

  ### Prioritization

  This alert is rated medium severity due to its indication of potential unauthorized remote access. The impact may be significant if it involves sensitive systems or data. Remote administrative tools are commonly weaponized by threat actors to exploit vulnerabilities within an enterprise environment, making timely investigation crucial.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using approved management tools under legitimate access through compromised user accounts. Reliable detection depends on correct configuration of process creation logging and continuous monitoring of system activity. Legitimate use cases include official support calls and organizational training scenarios. Companion detections, such as those monitoring for anomalous user behavior or suspicious network traffic, can provide enhanced coverage and context for this alert.

