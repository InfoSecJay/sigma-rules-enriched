  ### Technical Context

  This Sigma rule detects the execution of processes related to the ZeroTier remote monitoring and management (RMM) tool, specifically any child processes spawned by `zerotier*.exe` or `zero-powershell.exe`. The likely attacker objective includes establishing persistence and control over a compromised system, facilitating unauthorized access to network resources, or exfiltrating data. This behavior is relevant to the MITRE ATT&CK tactic of **Execution (T1203)** and the technique of **Remote Services (T1219)**.

  The primary telemetry sources for this rule are Windows process creation logs, particularly Security Event ID 4688 and Sysmon Event ID 1. If malicious, the use of ZeroTier could result in a serious security incident due to its capability to create secure virtual networks that allow attackers to bypass traditional network segmentation controls. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of ZeroTier is possible in many enterprise environments.

  ---

  ### Investigation Steps

  - **Review Process Creation Logs:** Examine Security Event ID 4688 and Sysmon Event ID 1 for the creation of processes ending with `zerotier*.exe` or `zero-powershell.exe`. Malicious instances will show unusual parent processes not originating from trusted applications.

  - **Correlate Parent Process Activity:** Identify the parent process for any instances of ZeroTier. Legitimate usage typically comes from known and authorized applications, while unexpected origins may indicate malicious activity.

  - **Investigate Command Line Arguments:** Check the process command line arguments for `zerotier*.exe` in the process creation logs. Malicious usage may include unusual or obfuscated parameters that deviate from standard operational use.

  - **Evaluate Network Activity:** Cross-reference captured network logs (e.g., firewall logs) to determine if ZeroTier is establishing unexpected outbound connections. Look for unusual IP addresses or traffic patterns indicative of potential exfiltration.

  - **Check for Service Installation:** Review Windows Service configuration logs (e.g., Service Control Manager logs) for any new or modified services related to ZeroTier. Unauthorized service modifications can indicate persistence mechanisms set by an attacker.

  - **Assess System Role and Functionality:** Determine if the system hosting ZeroTier is intended for RMM tools. Legitimate systems performing remote management typically operate securely and have documented uses within enterprise policies.

  ---

  ### Prioritization

  This alert holds a medium severity level due to the potential impact on sensitive systems if a legitimate RMM tool is abused for attack purposes. The likelihood of malicious use is moderate, given that RMM tools like ZeroTier can be leveraged by attackers to compromise and control assets. However, the frequency of legitimate uses in enterprise environments mitigates a higher priority at initial detection.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations if ZeroTier is improperly configured to avoid logging or if logs are missing due to retention policies. Evasion techniques could include renaming executable files or executing binaries with different command-line arguments. Legitimate activities, such as authorized remote access maintenance, may trigger this alert. Additionally, companion detections involving unauthorized remote access through other tunneling tools can enhance overall detection capabilities.

