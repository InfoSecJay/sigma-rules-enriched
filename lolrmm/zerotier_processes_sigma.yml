note: |
  ### Technical Context
  This rule detects the potential activity of processes related to the ZeroTier Remote Management and Monitoring (RMM) tool. ZeroTier is often used for creating secure virtual networks, but it can also be misused by attackers for unauthorized remote access to systems. The primary concern is that an attacker might exploit ZeroTier's capabilities to establish persistence, lateral movement, or data extraction within an enterprise environment. Such activities are typically aimed at gaining control over targeted systems or exfiltrating sensitive data.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Execution (TA0002)**, specifically **Remote Services (T1219)**, as the ZeroTier tool facilitates remote management capabilities. This detection is particularly crucial in identifying potential threats involving the exploitation of remote access tools that bypass traditional security mechanisms.

  The primary data source for this detection includes **process creation events** on Windows systems, specifically focusing on the creation of processes with names ending in "zerotier.exe" or "zero-powershell.exe." These event logs can reveal unauthorized use of remote access tools and assist in identifying indicators of compromise within the organization's network.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation logs to identify instances of `zerotier*.exe` and `zero-powershell.exe`. Look for patterns of execution, including parent-child process relationships that might indicate how the processes were initiated.

  - **Examine Network Connections:** Inspect network logs for unusual outbound connections initiated by ZeroTier processes. Pay attention to any unfamiliar or unauthorized destinations that could indicate potential data exfiltration or command-and-control callbacks.

  - **Analyze User Accounts and Permissions:** Investigate the user accounts invoking the ZeroTier processes. Determine whether these accounts have the appropriate permissions and if there are any indicators of privilege escalation or misuse.

  - **Conduct a Historical Review:** Look into historical execution patterns of the ZeroTier processes across the environment. Identify any anomalies or trends that may suggest a consistent use of the application for malicious purposes.

  ### Prioritization
  This alert is classified with medium severity due to the risk posed by the potential misuse of remote management tools like ZeroTier. While not inherently malicious, unauthorized activity can severely impact security by enabling attackers to maintain persistence and control over compromised systems.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection is the legitimate use of ZeroTier within the enterprise, which could lead to false positives if not properly contextualized. The detection logic assumes that any processes initiated from the specified parent processes are suspicious, which may not account for legitimate administrative actions. For the alert to function effectively, it is essential that process creation events are actively logged and collected from Windows systems across the enterprise network. Additionally, an understanding of what constitutes normal usage of ZeroTier within the organization will enhance the accuracy of this detection.

