note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the ZeroTier Remote Monitoring and Management (RMM) tool on Windows systems. The primary objective for an attacker using this tool is often to establish a command-and-control (C2) channel for remote access or to facilitate lateral movement within the network. Relevant MITRE ATT&CK tactics and techniques include **Command and Control** (TA0011) and **Application Layer Protocol** (T1219).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688, which captures new process instances. If this behavior is malicious, it could lead to unauthorized access, data exfiltration, or further compromise of the network environment. Importantly, this detection does NOT confirm whether the process activity is malicious on its own, as ZeroTier may be legitimately used for remote management purposes.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 for new process creation of `zerotier*.exe` or `zero-powershell.exe`. Look for timestamps and associated User IDs to identify context around when and by whom these processes were initiated.

  - **Correlate with parent process:** Identify the parent process for the detected ZeroTier executions through Event ID 4688. If the parent process is a known legitimate management tool, this may indicate benign usage.

  - **Examine network connections:** Utilize network monitoring tools to inspect outbound connections initiated by the ZeroTier processes. Look for anomalies such as connections to unusual external IP addresses or abnormal port utilization that could indicate malicious intent.

  - **Investigate user behavior:** Analyze the user account activity associated with the execution of the ZeroTier processes. Unusual login times or logins from unfamiliar hosts may indicate compromised credentials or inappropriate access.

  - **Validate installation and configuration:** Check for the presence of ZeroTier in authorized applications and configurations. Legitimate deployments should match asset inventories and company policies for remote management tools.

  - **Identify high-confidence malicious indicators:** Look for signs of obfuscation or unusual command-line arguments for the detected executables, which may indicate an attempt to hide malicious usage of the ZeroTier tool.

  ### Prioritization

  This alert has medium severity due to the potential for exploitation and the critical role that remote access tools can play in network intrusions. The likelihood of malicious use is heightened since ZeroTier can facilitate unauthorized remote access if misconfigured. However, if legitimate use is identified, it may not require immediate remediation, but further monitoring is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the usage of similar legitimate tools, which could generate false positives. Additional log sources may be necessary for reliable detection, including network traffic logs that capture specific ZeroTier-related activity. Legitimate activities that may trigger this alert include IT support teams using ZeroTier for remote troubleshooting. Companion detections include examining high-risk user behaviors related to process creation and network traffic analysis to enhance overall threat detection capabilities.

