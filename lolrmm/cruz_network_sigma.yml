  ---

  ### Technical Context

  This rule detects outbound network connections to `resources.doradosoftware.com/cruz-rmm`, which is associated with the Cruz Remote Monitoring and Management (RMM) tool. Attackers may leverage Cruz RMM for unauthorized remote access, malware deployment, or to maintain persistence in compromised environments. This behavior aligns with MITRE ATT&CK tactic "Execution" (TA0002) and the technique "Remote Services" (T1219).

  The primary telemetry source for detection is Windows network connection logs, specifically Event ID 5156 from the Windows Firewall or other network traffic logs correlating with connectivity to the specified hostname. Malicious activity suggests unauthorized remote sessions, which may lead to data exfiltration or system manipulation. This detection does not confirm whether the usage is legitimate or indicative of a compromise without further context.

  ---

  ### Investigation Steps

  - **Review connection logs: ** Check Windows Security Event ID 5156 for network connection events targeting `resources.doradosoftware.com/cruz-rmm`. Look for unusual timestamps that diverge from standard operational hours.

  - **Validate authorized usage: ** Determine if the Cruz RMM tool is expected in your environment. Cross-reference the hostname with asset inventories to identify any legitimate deployments or registered usage.

  - **Identify malicious indicators: ** Analyze source IP addresses initiating the connection. Check for known malicious IP reputation using threat intelligence feeds or tools to classify them as high-confidence malicious indicators.

  - **Check application logs: ** Review related application logs (such as Sysmon Event ID 3) for process creation associated with the Cruz RMM tool; focus on processes that deviate from expected behavior, such as unexpected CMD or PowerShell invocations.

  - **Evaluate role and criticality: ** Assess the impacted system's role and criticality (e.g., is it a server or user workstation). Elevated privileges combined with this connection could indicate higher risk.

  ---

  ### Prioritization

  The medium severity of this alert is based on the potential for significant impact if Cruz RMM is misused, especially on critical assets. Although the tool is often utilized legitimately, the likelihood of it being weaponized for unauthorized remote access remains a concern, warranting prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the potential use of encrypted connections or tunneling, which could obscure legitimate traffic. It is essential that firewall logs and network monitoring configurations include the relevant sources to ensure reliability. Legitimate activities might include IT administrative tasks or managed service provider engagements. A related detection could involve monitoring for known command-and-control traffic to strengthen overall coverage against unauthorized RMM activity.

