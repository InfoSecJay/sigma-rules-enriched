note: |
  ### Technical Context

  This Sigma rule detects file activity related to the Go Mini RMM (Remote Monitoring and Management) tool, specifically the creation or modification of the `agent.exe` and `config.json` files located in `C:\rmm\`. The likely attacker objective is to establish a persistent foothold in the environment for remote control, often indicative of lateral movement or command-and-control (C2) operations. This behavior is classified under the MITRE ATT&CK tactic "Command and Control" (TA0011) with the technique ID T1219.

  The primary telemetry source is Windows file event logs, which capture file modifications related to specific paths monitored by the intrusion detection system (IDS). If malicious, the presence of these files could allow unauthorized remote access and control over the affected endpoint. However, this detection does NOT confirm malicious intent on its own, as the Go Mini RMM tool may be used legitimately for systems management.

  ### Investigation Steps

  - **Check file existence and creation times**: Validate the presence of `C:\rmm\agent.exe` and `C:\rmm\config.json` using File System Event Logs (Event ID 4663). Note the creation and modification timestamps. Legitimate installations will usually have timestamps aligned with official deployment windows.

  - **Review file signatures**: Inspect the digital signatures of the `agent.exe` file to confirm the source. Legitimate files will have verified signatures, while malicious variants may lack signatures or have unrecognized publishers.

  - **Analyze process activity**: Use Process Monitor or a similar tool to check for active processes associated with `agent.exe`. Specific activity like creating outbound connections could indicate malicious use. Look for anomalies like unexpected parent processes.

  - **Evaluate network connections**: Review firewall logs or process-related network activity (e.g., Connections from `agent.exe`) to external IP addresses. A high volume or connection to known malicious endpoints may indicate nefarious use.

  - **Examine endpoint role and usage**: Identify if the affected system is a user workstation or a server. Legitimate RMM tools may be present on administrative or management endpoints; however, detection on user devices could indicate unauthorized installations.

  ### Prioritization

  This alert has medium severity due to the potential impact of the affected systems if compromised, particularly in environments where RMM tools are not expected or authorized. The likelihood of malicious abuse is moderate, as adversaries might weaponize similar tools to conduct operations surreptitiously. Although the specific activity may not be commonly weaponized, it is important to recognize the associated risks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for adversaries to modify file names or locations to evade detection. Reliability depends on correctly configured file monitoring for Windows systems, as logs may not be fully collected if event logging is misconfigured. Legitimate administrative activities may trigger these alerts, such as authorized deployments of the Go Mini RMM tool. A related detection rule for monitoring unusual outbound connections (e.g., to external IPs from RMM processes) would strengthen coverage and context awareness.

