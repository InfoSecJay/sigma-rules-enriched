note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the Level.io Remote Monitoring and Management (RMM) tool. Level.io is a platform that may allow attackers to establish remote access to compromised systems, facilitating the execution of malicious actions such as data exfiltration, lateral movement, or system control. The rule signals the presence of connections made to Level.io domains which can indicate an attacker using this tool for recon or control over victim machines.

  In the context of cybersecurity, such activity can represent various threats including unauthorized access or system compromise by threat actors. Attackers may be looking to exploit weaknesses in network defenses, gain persistent access to systems, or perform reconnaissance operations for further exploitation. The key MITRE ATT&CK tactics relevant to this detection include `Execution` (Attack ID: T1203) and `Remote Services` (Attack ID: T1219), as they signify how attackers could leverage remote management tools to execute commands on victim endpoints.

  To effectively monitor for these activities, the primary telemetry sources would include network connection logs from Windows systems, which track outbound network traffic and provide insights into connections made to potentially malicious external domains.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine Windows network connection logs for potential connections to Level.io or similar domains. Focus on outbound traffic and analyze timestamps and the destinations accessed.

  - **Analyze Endpoint Activity:** Investigate endpoint activity around the time of detected connections. Look for unusual processes or suspicious software related to remote access tools that may indicate misuse of legitimate software.

  - **Correlate with Existing Incidents:** Check against your SIEM or incident database to correlate these events with any existing incidents involving remote access tools. Understanding the context can help determine if this is high-risk behavior or just legitimate use.

  - **Engage with IT Teams:** If an instance of the Level.io tool is found to be legitimate, collaborate with IT teams to understand its usage, configuration, and scope of deployment across the organization.

  ### Prioritization
  The severity of this alert is classified as medium due to the potential for compromising sensitive systems through the use of RMM tools. The likelihood of misuse exists, especially in environments where such tools are not sanctioned or where unauthorized actors could gain access.

  ### Blind Spots and Assumptions
  This detection rule assumes that all activity from Level.io domains is malicious, potentially leading to false positives when legitimate administrative activities occur. Gaps in detection coverage may include misconfigurations in logging that fail to capture certain outbound traffic or connections. Additionally, this alert requires active monitoring of network connection logs to function effectively; without such logs, the detection will not provide accurate insights into the actual usage of remote management tools in the environment.

