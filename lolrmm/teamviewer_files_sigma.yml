note: |
  ### Technical Context
  This detection rule identifies file activities associated with the TeamViewer Remote Monitoring and Management (RMM) tool. TeamViewer is commonly used for remote access to systems, and attackers may leverage its capabilities to maintain persistence, execute malicious commands, or exfiltrate data. By tracking file creations and modifications related to TeamViewer, this rule aims to uncover potentially unauthorized remote access activities which could indicate a compromise or misuse of legitimate administrative tools.

  The threat scenario primarily involves either an external adversary exploiting TeamViewer to gain unauthorized access, or a malicious insider leveraging the tool for nefarious purposes. Common adversary objectives may include remote control of systems for data exfiltration, lateral movement within the environment, or establishing a foothold for further exploitation.

  Relevant MITRE ATT&CK techniques include:
  - **T1219**: Remote Access Software, which covers the use of legitimate remote access software for unauthorized actions.

  The primary data sources for this detection are Windows file event logs that capture changes to specific files and directories associated with TeamViewer operations, as well as process creation events that may indicate the launching of TeamViewer applications.

  ### Investigation Steps
  - **Review File Events**: Examine logs for any file creation, modification, or deletion events related to TeamViewer files, particularly in the specified paths. Focus on timestamps that align with user activity to reveal suspicious behavior.

  - **Analyze Process Activity**: Investigate any instances of executable files associated with TeamViewer (e.g., teamviewer.exe, tv_w32.exe) in process creation logs. Correlate these events with user login records to detect potentially unauthorized remote access.

  - **Check User Activity Context**: Identify the user accounts that performed actions on TeamViewer files. Verify if these actions were in line with their roles and responsibilities, especially for accounts with elevated privileges.

  - **Scrutinize Network Connections**: Look for outbound network connections initiated by TeamViewer applications during unusual hours or from unexpected hosts. Analyze destination IP addresses and domains for any indicators of compromise.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of unauthorized remote access and the relatively moderate likelihood of occurrence. Given the popularity of TeamViewer in legitimate support scenarios, its presence within the environment requires careful monitoring to differentiate between expected and malicious use.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for unauthorized use of TeamViewer if proper auditing settings for file changes are not enabled or if the tool is utilized in ways that don't generate files in the specified paths. The detection logic assumes that all file activities within the designated directories are noteworthy, which might lead to false positives in environments where TeamViewer is used legitimately. Thus, having comprehensive logging and monitoring specifically for remote access tools is crucial for accurate detection.

