note: |
  ### Technical Context

  This rule detects file activity associated with the TeamViewer Remote Management and Monitoring (RMM) tool, particularly the creation and modification of specific log files and executables. Attackers may leverage TeamViewer as a remote access tool (RAT) to control compromised systems, pivot within networks, or exfiltrate data discreetly. This behavior corresponds to the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique for Remote Access Tools (T1219).

  Primary telemetry sources include Windows file event logs that record changes to files in specific directories associated with TeamViewer. The security impact if malicious involves unauthorized remote access and control over affected systems, potentially leading to data theft or further lateral movement within the network. It's important to note that this detection alone does not confirm malicious activity; the presence of these files may also result from legitimate, authorized use of TeamViewer within the organization.

  ### Investigation Steps

  - **Check for unauthorized TeamViewer installation:** Review Security Event ID 4688 from the Windows Security logs to identify process creation for `teamviewer.exe`, `tv_w32.exe`, or similar filenames. Verify if these processes were initiated by unexpected user accounts or during off-hours.

  - **Examine file creation timestamps:** Analyze the timestamps and authorship of files created or modified in paths like `C:\Users\<username>\AppData\Local\Temp\TeamViewer\`. Legitimate installations typically exhibit predictable patterns, such as being logged during known support sessions.

  - **Correlate log file access with user activity:** For any detected access to `C:\Program Files\TeamViewer\Connections_incoming.txt`, cross-reference with user activity logs to verify normal operational usage. Unexpected modifications may indicate unauthorized access.

  - **Identify abnormal TeamViewer log patterns:** Review the contents of `TV15Install.log` or `TVNetwork.log` for unusual entries or anomalies. Legitimate activity usually involves clear success messages for authorized support sessions rather than repeated errors or suspicious entries.

  - **Review for lateral movement indicators:** Check other endpoints for similar log file activity and correlating user credentials, particularly in critical systems or sensitive data environments, using Centralized Logging Solutions if applicable.

  - **Investigate file artifacts for exfiltration:** Monitor events related to file creation or alterations in `%LOCALAPPDATA%\TeamViewer\Database\tvchatfilecache.db` for signs of data exfiltration or unapproved changes. Compare against baselines of legitimate access patterns to identify suspicious modifications.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for unauthorized remote access to systems that may contain sensitive data. The likelihood of malicious use of TeamViewer is significant, given its common exploitation in attacker workflows, particularly for persistent access or reconnaissance.

  ### Blind Spots and Assumptions

  Detection may be limited if TeamViewer logs are cleared or if file access is via legitimate use of the application, potentially leading to false positives. Required logs include Windows file event logs capturing changes in specified directories. Additionally, legitimate support activities may naturally trigger these alerts, creating noise. Companion detections focusing on remote access tools or unusual network connections would strengthen overall monitoring capabilities against malicious usage.

