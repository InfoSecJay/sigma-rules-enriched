note: |
  ### Technical Context

  This detection targets file activity associated with the TeamViewer Remote Management (RMM) tool, including log files and executable activity. The likely attacker objective involves gaining remote access or controlling a compromised system using legitimate software that is often abused for malicious purposes. Relevant MITRE ATT&CK tactic and technique include Command and Control (T1071) and Remote Services (T1219). Primary telemetry sources include Windows file event logs specifically monitoring for specific file paths and file modifications related to TeamViewer executables and logs. If malicious, the impact could include unauthorized remote access to sensitive data or systems. It is crucial to note that this detection does NOT confirm malicious intent on its own; legitimate TeamViewer usage will trigger similar alerts.

  ### Investigation Steps

  - **Review file creation activities:** Check for Event ID 4663 entries indicating access or modifications to TeamViewer log files (e.g., `C:\Program Files\TeamViewer\Connections_incoming.txt`). Look for unexpected timestamps indicating possible unauthorized access.

  - **Identify abnormal TeamViewer process execution:** Analyze Event ID 4688 to detect the launch of TeamViewer executables (e.g., `teamviewer.exe`, `tv_w32.exe`). Note the parent process and execution context, distinguishing benign analyst-initiated usage from potential malicious activity.

  - **Cross-reference user account activities:** Access Windows Security Event ID 4624 to identify which user account initiated the TeamViewer processes. Legitimate access should align with known support or remote access operations during expected hours.

  - **Assess related network traffic:** Leverage network traffic logs (firewall or proxy) to analyze outbound connections initiated by TeamViewer processes. Malicious indicators may include unusual external IP addresses or connections not matching known, trusted endpoints.

  - **Investigate affected host role:** If alerts are raised on critical assets (e.g., domain controllers, servers), prioritize investigation due to the high risk associated with remote access tools facilitating lateral movement or data exfiltration.

  ### Prioritization

  This alert carries medium severity due to the elevated risk of unauthorized remote access on the affected systems, particularly if it occurs on sensitive assets. The use of TeamViewer is a well-documented tactic for attackers and can easily be weaponized to perform actions undetected.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as renaming TeamViewer executables or using legitimate accounts to operate the tool. Reliable detection requires comprehensive coverage of file event monitoring, ensuring that file paths for all TeamViewer instances are logged. Legitimate administrative tasks that involve TeamViewer can trigger this alert, such as authorized remote support sessions. A related detection that strengthens coverage is monitoring for unusual remote access software installations or executions (e.g., any other known RMM tools).

