note: |
  ### Technical Context

  This Sigma rule detects file activities associated with the TeamViewer Remote Management and Monitoring (RMM) tool, specifically targeting logs and installation files. The likely attacker objective is to maintain remote access or control over compromised systems via TeamViewer, which may facilitate unauthorized activities such as data exfiltration or lateral movement. Relevant MITRE ATT&CK technique associated with this behavior is Remote Access Software (T1219).

  Primary telemetry sources include Windows file event logs demonstrating access and modification to specific TeamViewer directories and files. The security impact could be significant if malicious, as it indicates potential unauthorized remote access to systems. This detection does not confirm active exploitation or compromise by itself, as legitimate use of TeamViewer can also trigger alerts.

  ### Investigation Steps

  - **Check log file modifications**: Review Windows Security Event ID 4663 for attempts to access or modify the following files: `C:\Users\<username>\AppData\Local\Temp\TeamViewer\TV15Install.log` and `C:\Program Files\TeamViewer\Connections_incoming.txt`. Legitimate access typically involves system administrators managing remote sessions.

  - **Investigate execution logs**: Look for Process Creation events (Security Event ID 4688) for processes like `teamviewer.exe`, `tv_w32.exe`, or `tv_x64.exe`. High confidence indicators of malicious activity include unexpected execution of these processes, especially from unusual user accounts or during off-hours.

  - **Analyze file creation events**: Review Sysmon Event ID 11 for new files created under the `C:\Program Files\TeamViewer\` directory. Malicious behavior may indicate suspicious file creations not typical for the environment, such as unauthorized log files or databases.

  - **Validate connections**: Analyze Windows Firewall logs (Event ID 2004) for outbound connections related to TeamViewer IP addresses. Document any connections made outside of known organizational policies as potential threats.

  - **Assess legitimate usage**: Confirm whether affected users have legitimate business reasons to use TeamViewer access. Legitimate usage may include users with designated roles in IT support or remote administration.

  ### Prioritization

  The alert severity is medium due to the possibility of influential systems being affected, such as servers or workstations that host sensitive data. The likelihood of malicious abuse is moderate, considering that RMM tools like TeamViewer are often targeted for unauthorized access when misconfigured or poorly monitored. This behavior can be weaponized if adversaries leverage legitimate tools for nefarious purposes.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques through renaming TeamViewer executables or manipulating logging configurations. Ensuring the proper logging of file activities and security context is required for reliable detection. Moreover, legitimate remote support usage or system maintenance might trigger these alerts. A related detection to consider is the monitoring of unusual login attempts to TeamViewer accounts, as these could indicate credential theft or abuse.

