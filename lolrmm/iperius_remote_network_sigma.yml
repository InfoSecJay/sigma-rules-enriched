note: |
  ### Technical Context

  This Sigma rule detects network activity involving Iperius Remote, a remote management and monitoring tool primarily used for IT support and system administration. The likely objective of an attacker utilizing this tool would be to gain remote access to a system for purposes of data exfiltration, lateral movement, or control over an infected machine. This activity aligns with the MITRE ATT&CK framework tactic of Execution (TA0002) and specifically the technique of Remote Services (T1219).

  The primary telemetry sources are Windows network connection logs that capture outbound connections to the specified Iperius Remote domains. If this rule triggers and the network activity is malicious, it suggests that an adversary may be attempting to manipulate or gain unauthorized access to the affected system. Importantly, this detection does NOT confirm that the activity is malicious on its own, as legitimate use of Iperius Remote for remote support could generate similar traffic.

  ### Investigation Steps

  - **Review network connection logs:** Check Windows Event ID 5156 for logs indicating outbound connections to the Iperius Remote domains (e.g., `*.iperiusremote.com`, `*.iperius.com`). Validate against expected business use cases to distinguish benign from malicious traffic.

  - **Identify active Iperius sessions:** Inspect any existing documentation or communication regarding remote support engagements using Iperius. Legitimate activity will often correlate with prior approvals or scheduled support windows.

  - **Correlate with process creation events:** Look for corresponding process events (Security Event ID 4688 or Sysmon Event ID 1) that indicate the Iperius Remote executable initiated connections. Focus on parental processes to determine if the invocation was legitimate.

  - **Check for anomalous user behavior:** Review user activity in conjunction with the remote connections, including login times and account permissions. Malicious use may appear when elevated privileges are involved or if access occurs outside regular business hours.

  - **Assess the asset's role:** Identify the role and criticality of the affected host. A server hosting sensitive data or critical applications is of higher concern if used for Iperius Remote connections than a standard user workstation.

  ### Prioritization

  The alert is of medium severity due to the possible impact on sensitive systems and the potential for malicious use of remote access tools. Iperius Remote can facilitate adversary activities such as lateral movement and data exfiltration, making it important to investigate. However, the likelihood of benign use in a managed IT environment influences its overall priority.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Iperius Remote, as authorized personnel may generate similar network activity. Strong detection requires proper logging configurations for outbound network connections and process creation events. Implementations of legitimate third-party remote access solutions could trigger similar alerts, necessitating clear documentation of their use. A companion detection could include monitoring for unauthorized changes in user rights or access levels that typically precede malicious use of remote services.

