note: |
  ### Technical Context
  This rule detects potential network activity associated with the Iperius Remote Management and Monitoring Tool (RMM). Iperius is often used by IT support and managed service providers for remote desktop access, system administration, and service monitoring. However, unauthorized use of Iperius can indicate malicious intent, such as an attacker using it to gain persistent remote access to a compromised system or to exfiltrate data. In this scenario, the threat actor typically aims to maintain control over the target systems while performing reconnaissance or conducting data theft.

  Relevant MITRE ATT&CK tactics associated with this detection include **Execution** (TA0002) and the specific technique **Remote Access Software** (T1219). These categories encompass the use of legitimate remote access tools, which may be exploited by attackers for unauthorized access to targets.

  Primary data sources for detecting this activity include logs of network connections, which will provide evidence of outbound traffic to known Iperius domains. System monitoring tools on workstations or servers can also capture anomalous behaviors that accompany the use of unauthorized remote access software.

  ### Investigation Steps
  - **Review Network Connection Logs**: Collect and analyze logs from firewalls and network monitoring tools for outbound connections targeting Iperius domains, such as `*.iperiusremote.com` and `*.iperius.com`.
  - **Examine Process Activity**: Investigate any instances of Iperius or related applications running on endpoints. Pay attention to process creation logs to look for unusual command line arguments or execution paths.
  - **Correlate with User Activity**: Verify the legitimacy of user accounts that initiated connections to Iperius domains by cross-referencing activity logs, checking for any unauthorized access patterns or deviations from normal behavior.
  - **Conduct Reverse DNS Lookups**: For any suspicious connections identified, perform reverse DNS lookups to determine if the IP addresses are related to known Iperius servers or if they belong to other malicious actors.

  ### Prioritization
  The severity of this alert is considered medium because, while Iperius is a legitimate tool, its unauthorized usage can signify a potential security breach. Given the tool's ability to provide remote access, suspicious activity warrants immediate investigation to prevent possible exploitation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of the rule missing variations of Iperius usage, such as using non-standard hostnames or encapsulated within encrypted tunnels, which might not resolve to the detected endpoints. The detection logic assumes that abnormal connections to known Iperius domains are indeed indicators of compromise. Required logs for optimal effectiveness include comprehensive network connection logs, both inbound and outbound, as well as detailed endpoint process activity logs.

