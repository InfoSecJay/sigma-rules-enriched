note: |
  ### Technical Context

  This Sigma rule detects the modification of specific Windows registry keys associated with the Komari Remote Monitoring and Management (RMM) tool, which is often abused by adversaries to maintain persistence or execute remote commands. The likely attack objective includes unauthorized access to systems and manipulation of software for malicious purposes. Relevant MITRE ATT&CK tactics and techniques include Execution (TA0002) and Remote Services (T1219). The primary telemetry sources are Windows registry events that monitor changes to `HKLM\System\CurrentControlSet\Services\komari-agent` and `HKLM\System\CurrentControlSet\Services\Windows Update Service`. If malicious, compromised systems may allow attackers to escalate privileges or control machines. Note that this detection does NOT confirm malicious activity on its own, as legitimate use of Komari for support and maintenance may trigger similar alerts.

  ### Investigation Steps

  - **Confirm registry activity:** Review Windows Security Event ID 4663 for Registry Key Access to determine the user and process modifying the registry paths outlined in the rule. Look for unusual `Account Name` values outside of normal admin users.

  - **Investigate process lineage:** Check Sysmon Event ID 10 on the affected host to see if the registry modification was initiated by a suspicious or untrusted process, particularly one that is not part of the usual Komari operation.

  - **Compare with known good behavior:** Validate expected operations by cross-referencing with documented usage of the Komari tool within your enterprise. Legitimate actions typically occur within a specific time frame and are associated with service accounts employed for RMM tasks.

  - **Identify high-confidence malicious indicators:** Look for atypical command line arguments in Sysmon Event ID 1 relating to the `komari-agent`, such as unusual execution paths or the presence of obfuscation techniques. These elements may suggest malicious exploitation of the tool rather than legitimate use.

  - **Assess related Windows services:** Examine the Windows Service configuration through PowerShell (`Get-Service | Where-Object {$_.DisplayName -like "*Komari*"}`) and verify if other unexplained service changes correspond with the registry modifications.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems managed by RMM tools like Komari. While there is a risk of malicious use, this activity is less frequently weaponized compared to more common attack vectors. Analysts should consider the criticality of the affected assets when assessing the urgency of the investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of benign misconfigurations or legitimate update processes triggering the alert. Comprehensive monitoring requires enabling Windows registry auditing and ensuring proper logging configuration for effective capture. Additionally, legitimate IT management activities, especially those involving third-party RMM tools, may lead to similar alerts. A related companion detection could involve monitoring for anomalous network connections to discovered Komari RMM IP addresses, enhancing coverage for potential RMM abuses.

