note: |
  ### Technical Context

  This Sigma rule detects registry activity potentially associated with the Komari Remote Monitoring and Management (RMM) tool. The primary goal of an adversary using this tool would be to maintain control over compromised systems for remote administration, likely leveraging it for persistent access or to deploy further malicious activities. This behavior corresponds to the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry source for this detection is Windows registry events, specifically focusing on modifications under the keys related to the Komari agent and potentially legitimate Windows services. If confirmed malicious, this activity can compromise an organization’s security by facilitating unauthorized access and remote system control. However, it is important to note that this detection does NOT, on its own, confirm that the Komari tool is being used for malicious intent, as legitimate configurations may also trigger similar registry activity.

  ### Investigation Steps

  - **Review registry activity for suspicious values:** Examine Windows registry event logs, specifically Event ID 4650, for changes to `HKLM\System\CurrentControlSet\Services\komari-agent` and `HKLM\System\CurrentControlSet\Services\Windows Update Service` for any unusual modifications or additions.

  - **Identify the source of registry changes:** Check the Event ID 4663 for audit logs detailing the user and process responsible for the registry modifications. Legitimate changes are often made by trusted administrator accounts; look for signs of unauthorized user activity.

  - **Assess historical activity around the registry changes:** Query SIEM logs for previous registry modifications associated with the same user or process that modified the Komari keys. Repeated changes in a short timeframe could indicate malicious usage.

  - **Correlate with other telemetry sources:** Look for associated network activity via firewall or proxy logs to identify outbound connections to known Command-and-Control (C2) IP addresses. Consider checking for unusual outbound traffic patterns to URLs or IPs linked to RMM services.

  - **Check installed software and processes:** Validate installed applications and running processes using Task Manager or tools like Sysinternals. Confirm if the Komari agent is legitimately installed and running as expected. Look for discrepancies in installed software under `%ProgramFiles%`.

  ### Prioritization

  This alert has medium severity due to the potential impact of remote access misuse, particularly if the affected systems hold sensitive data or critical functions. The likelihood of malicious exploitation is moderate, especially as RMM tools are commonly weaponized in targeted attacks against enterprises.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate use of Komari that may trigger the rule, resulting in false positives. To ensure reliable detection, all relevant Windows registry auditing settings must be enabled. Furthermore, other legitimate administrative tools may trigger similar activity, such as software deployment scripts. Companion detections to consider include alerts for unusual outbound connections or the deployment of unauthorized software, which can reinforce the investigation of potential malicious activity.

