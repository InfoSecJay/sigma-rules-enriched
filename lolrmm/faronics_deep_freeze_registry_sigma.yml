note: |
  ### Technical Context

  This Sigma rule detects modifications to registry keys associated with the Faronics Deep Freeze RMM tool, particularly within paths like `HKLM\SOFTWARE\Faronics` and its service entries. The behavior suggests potential unauthorized access or manipulation of the Deep Freeze application, which could be indicative of an adversary attempting to bypass security controls or gain persistence within a compromised system.

  The likely attacker objective may include establishing a foothold (using registry manipulation) or altering system configurations to integrate malicious actions or commands within the established remote management framework. This activity aligns with the MITRE ATT&CK technique for Exploitation for Client Execution (T1219) and may relate to Command and Control tactics.

  The primary telemetry sources for this rule are Windows Registry Event logs, specifically focusing on modifications to the registry at the specified paths. If these behaviors are malicious, they can compromise system integrity and user data by allowing unauthorized alterations. However, this detection does NOT confirm malicious intent on its own, as legitimate use of Faronics Deep Freeze by administrators may trigger similar alerts.

  ### Investigation Steps

  - **Review related registry modifications:** Examine Windows Registry Event logs for Event ID 4657, focusing on any modifications to keys under `HKLM\SOFTWARE\Faronics` and `HKLM\SYSTEM\CurrentControlSet\Services\DFServ`. Look for timestamps correlating with alert times.

  - **Identify unauthorized services:** Check if the Faronics Deep Freeze service (`DFServ`) is running by querying the service status via PowerShell or using the Windows Services console. Legitimate Deep Freeze operations should show this service running as expected.

  - **Correlate network activity:** Analyze network traffic for unusual outbound connections using tools like Windows Firewall logs or Network Traffic Analysis. Monitor for connections to known malicious IPs or anomalous ports, indicating potential command and control activity.

  - **Determine user actions leading to modification:** Cross-reference local security logs (Event ID 4624 - Logon) with registry modification times to identify any user accounts that accessed the system around the time of the alert, highlighting any accounts that engaging in suspicious activities.

  - **Collect file system artifacts:** Check for the presence of new or modified files in the installation directories of Faronics Deep Freeze. Interfaces like Sysinternals' Process Monitor may be used to validate file creation actions associated with the registry changes.

  - **Assess system role and policy compliance:** Determine if the affected system should have Faronics Deep Freeze installed based on organizational policy. Unapproved installations or modifications could indicate a security incident.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems utilizing Faronics Deep Freeze for security and data integrity. The likelihood of malicious behavior is elevated in cases of unexpected registry modifications, especially if they are not aligned with authorized IT procedures. Given that registry manipulations are a common attack vector to facilitate further exploitation, timely investigation is critical.

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate administrative activities that also modify these registry keys, necessitating simple user's understanding and correct use of Faronics. Required log sources include Registry Event logs, which must be enabled and sufficiently detailed. Furthermore, legitimate update activities from Faronics may trigger this alert but should be distinguishable by timestamps and user accountability. Related detections that can reinforce security posture include monitoring of process creation events associated with untrusted software or indicators of persistence used by malware.

