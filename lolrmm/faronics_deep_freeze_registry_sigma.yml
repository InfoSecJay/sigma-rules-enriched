note: |
  ### Technical Context

  This Sigma rule detects registry activity related to the Faronics Deep Freeze tool, specifically targeting changes or queries in registry paths associated with its configuration and services. The likely attacker objective is to deploy or manipulate endpoint lockdown capabilities to achieve persistence and mitigate detection. This detection aligns with the MITRE ATT&CK techniques related to Execution (T1219) as attackers may exploit legitimate administrative tools or services to maintain a presence on compromised systems.

  The primary telemetry source is Windows Registry Events, focusing on specific changes in the registry paths: `HKLM\SOFTWARE\Faronics\Deep Freeze`, `HKLM\SOFTWARE\Faronics`, and `HKLM\SYSTEM\CurrentControlSet\Services\DFServ`. If malicious, an attacker could use this tool to prevent changes to a system, thus maintaining control over the environment. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of Faronics Deep Freeze exists within the administration of secured environments.

  ### Investigation Steps

  - **Identify the triggering event:** Check Registry Event IDs 4657 and 4663 for changes to `HKLM\SOFTWARE\Faronics\Deep Freeze` and related paths. Look for specific values or modifications that indicate unauthorized changes rather than routine updates.

  - **Evaluate user context:** Review the user account associated with the registry changes in Windows Event ID 4624 (logon events). Ensure that the user has legitimate administrative privileges. Look for accounts that are atypical for system maintenance roles.

  - **Verify process activity:** Cross-reference with Sysmon Event ID 1 to identify if any processes executed actions associated with the Deep Freeze tool after registry changes. Check for unusual parent-child process relationships indicating potential abuse.

  - **Assess operational legitimacy:** Confirm if Deep Freeze is part of the organization's approved software stack. If found in authorized deployments, document its configuration and standard operational behavior to differentiate between benign and malicious activity.

  - **Correlate with security incidents:** Investigate if there have been prior alerts related to Faronics Deep Freeze on the same host or user. Look for patterns in multiple registry read/writes in a short timeframe, as this may indicate tool abuse or misconfiguration.

  - **Identify file signatures:** Confirm any newly created or modified files associated with Faronics using File Creation Events (Sysmon Event ID 11). Look for unexpected file paths or timestamps consistent with the registrar activity.

  ### Prioritization

  This alert is of medium severity due to the potential of Faronics Deep Freeze being weaponized in an enterprise environment, particularly if misused to malconfigure endpoint security. The impact varies based on the criticality of the affected system—especially if it is a sensitive or high-privilege machine. While the behavior is not commonly weaponized, careful scrutiny is warranted given potential risks with unauthorized use.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques such as direct registry modifications that do not log events or by attackers deleting registry keys after manipulation. Reliably detecting this activity requires appropriate security event logging configuration with real-time monitoring of registry events. Legitimate administrative activities can trigger alerts, including routine software updates or maintenance. A related detection to strengthen coverage would be monitoring system calls for unauthorized execution of established administrative tools, such as tracking PowerShell scripts or batch files that apply system configurations.

