  ---

  ### Technical Context

  This Sigma rule detects the execution of processes spawned by the Air Explorer remote management (RMM) tool. Attackers may use this tool for remote access and control over compromised systems, possibly to exfiltrate data or deploy additional malware. This activity aligns with the MITRE ATT&CK technique T1219: Remote Access Software. The primary sources of telemetry include process creation logs, specifically Security Event ID 4688 for Windows environments.

  If the detected behavior is malicious, it could indicate unauthorized access to sensitive systems, leading to potential data breaches or lateral movement within the network. It is essential to understand that this detection does NOT confirm malicious intent on its own, as Air Explorer is a legitimate tool that may be used appropriately within an organization's infrastructure.

  ---

  ### Investigation Steps

  - **Review process details: **Check the process creation logs for Event ID 4688. Look for unusual parent-child process relationships, especially where the parent process is an executable associated with legitimate system management or remote access tools.

  - **Identify asset role: **Determine the role of the affected host based on IP addresses or hostnames. If it is a mission-critical system or an endpoint, further prioritization is warranted for immediate investigation.

  - **Analyze execution context: **Correlate the timestamp of the executable's launch with user logins (Security Event ID 4624) to identify if the process was invoked under a valid session or if it appears to be running outside standard operating hours for that user.

  - **Look for high-confidence malicious indicators: **Search for additional indicators that may accompany Air Explorer activity, such as unexpected file downloads (e.g., exfiltration or malware payloads) logged via Security Event ID 4663 (Access to an object) or any unusual outbound network connections from the host.

  - **Assess legitimate usage: **Consider legitimate use cases for Air Explorer within your organization. Validate any existing documented instances of its use to differentiate from potential misuse.

  - **Correlate with network traffic: **Examine network traffic logs (Firewall or Network Flow logs) to identify any unusual external connections initiated by the affected host around the time of Air Explorer execution, focusing on unusual SNI or destinations.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential risks associated with unauthorized RMM activity on sensitive systems. The likelihood of abuse increases if Air Explorer is found on endpoints that do not require remote administration. While it is a legitimate tool, it has been weaponized in past incidents, warranting further scrutiny.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations if logs for process creation (Security Event ID 4688) are not retained adequately, or if telemetry for outbound network connections is unavailable. Legitimate administration and support use of Air Explorer could trigger this alert, necessitating validation against established organizational practices. A related detection to consider would be event logging for abnormal user behavior or logon patterns that could indicate compromised accounts.

