note: |
  ### Technical Context
  This detection rule identifies the execution of processes associated with the Air Explorer RMM (Remote Monitoring and Management) tool, specifically looking for activity related to the executable `airexplorer.exe`. The use of RMM tools like Air Explorer often indicates that attackers may be attempting to gain remote control over devices within the environment, potentially compromising sensitive data or maintaining persistence in an enterprise network. Attackers may utilize this tool for lateral movement, data collection, and maintaining control over compromised systems.

  Relevant MITRE ATT&CK tactics include:
  - Execution (T1203): This rule detects the execution of a specific application that is commonly used for remote access.
  - Remote Services (T1219): The use of RMM tools can also indicate an attempt to access devices remotely, which aligns with this technique.

  The primary data sources for this detection include Windows process creation logs, which capture details of applications executed on endpoints. Analyzing this data can help security teams identify unauthorized use of remote management tools that may signal a security breach.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs for instances of `airexplorer.exe`, focusing on the context in which it was executed, such as the user's account and the parent process.
  - **Examine Parent Processes**: Investigate the parent processes from which `airexplorer.exe` was spawned to determine if they were executed legitimately or as part of suspicious activity.
  - **Assess User Behavior**: Check user accounts associated with the process execution. Look for anomalous behavior, such as unusual logins or logouts, which could indicate credential compromise or insider threats.
  - **Correlate with Network Activity**: Gather evidence from network logs to identify any unusual remote connections or data exfiltration attempts occurring concurrently with the detection of the Air Explorer RMM tool being executed.

  ### Prioritization
  This alert is considered medium severity due to the potential for significant impact if an RMM tool like Air Explorer is misused. While legitimate use cases exist, unauthorized activity can indicate a compromise, making it important to investigate swiftly.

  ### Blind Spots and Assumptions
  The detection logic assumes that the execution of `airexplorer.exe` without proper context is malicious; however, legitimate administrative tasks may also invoke this tool. There may be gaps in detection if the process is executed under a different name or if logs are not appropriately configured to capture process creation details. To ensure this alert functions effectively, Windows process creation logging must be enabled, and any network traffic associated with Air Explorer should also be monitored for comprehensive visibility.

