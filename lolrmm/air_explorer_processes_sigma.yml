note: |
  ### Technical Context

  This Sigma rule detects processes initiated by the Air Explorer remote management tool, specifically when launched by the `airexplorer.exe` parent process. The likely attacker objective in this case is to facilitate unauthorized remote access or control over target systems, which would be consistent with tactics employed during lateral movement or post-exploitation phases of an attack. The relevant MITRE ATT&CK technique is Remote Services: RDP (T1219).

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on Event ID 4688. If this activity is malicious, it poses a significant security risk as it could allow an adversary to execute arbitrary commands on the affected system, exfiltrate data, or maintain persistence. It should be noted that this detection alone does not confirm malicious activity; legitimate use of Air Explorer by authorized personnel can trigger the same rule.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 for instances where `airexplorer.exe` is the parent image. Analyze the command line arguments for any suspicious parameters or behavior indicating unauthorized use.

  - **Inspect user account activity**: Validate the account initiating the process against your organization's user directory (Event ID 4720 for account creation or 4726 for account deletion). Confirm if the user has legitimate access rights to use Air Explorer.

  - **Analyze network connections**: Check for outbound connections associated with `airexplorer.exe` using Windows Firewall logs (Event ID 5156). Look for unusual destination IP addresses or ports that deviate from expected behavior for Air Explorer.

  - **Identify legitimate Air Explorer use**: Confirm with your IT team any known scheduled use of Air Explorer in the affected environment, including expected users and times. Validate that this activity aligns with documented business processes.

  - **Check for additional malicious indicators**: Correlate this activity with other known behaviors, such as the use of other remote execution tools (e.g., TeamViewer, AnyDesk) or scripts (PowerShell, PSExec) that may suggest a broader attack strategy.

  ### Prioritization

  This alert should be treated with medium severity given the potential impact of the affected system, especially if it contains sensitive information or has administrative privileges. The likelihood of malicious use exists due to the tool's nature, which is commonly weaponized in targeted attacks for remote administration and data exfiltration.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate administrative activities may not differentiate clearly from malicious use, potentially leading to false positives. It's important to ensure that Windows Audit Policy is adequately configured to log process creation events. Additionally, benign applications that utilize similar process names may trigger this alert. A complementary detection for enhanced coverage could involve monitoring for unusual authentication activity (Event ID 4624 for logon events) in conjunction with the use of remote management tools.

