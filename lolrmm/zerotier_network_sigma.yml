note: |
  ### Technical Context

  This rule detects network connections to ZeroTier-related domains, indicating potential use of the ZeroTier remote monitoring and management (RMM) tool, which could signify unauthorized access or malicious command and control (C2) activity. The primary objective of an attacker using such tools would be to establish persistent access to a target system for further exploitation or lateral movement within the network. This activity fits within the MITRE ATT&CK framework under the tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1071.001).

  The primary telemetry sources include Windows network connection events, specifically the security logs capturing connection attempts (Event ID 5156 - Windows Filtering Platform Filter Allowed Connection). The security impact is significant as unauthorized use of ZeroTier can facilitate data exfiltration, remote system control, and may lead to broader compromise incidents. However, this detection on its own does not confirm malicious intent, as legitimate uses of ZeroTier exist in some operational contexts.

  ### Investigation Steps

  - **Check connection history:** Review network connection logs for Event ID 5156 or similar events. Confirm the source IP addresses and compare them to known safe addresses within your organization to rule out benign use of ZeroTier.

  - **Identify process context:** Verify the process initiating the network connection by examining Event ID 4688 (Process Creation). Look for unexpected or non-standard applications using ZeroTier domains. Legitimate processes typically relate to IT management tools or legitimate user activity.

  - **Review user accounts involved:** Investigate the user account executing the process. Analyze User Account logs (Event ID 4624) to ensure the account is legitimate and not exhibiting suspicious behavior (e.g., connections outside normal working hours).

  - **Assess potential data exfiltration:** If suspicious activity is confirmed, look for file creation or transfer artifacts using Windows Event ID 4663 (File Access). Check for unusual file access patterns or large outbound transfers coinciding with the identified connections.

  - **Monitor for other related connections:** Conduct a search for other DNS queries to ZeroTier domains (by checking DNS logs). A legitimate use can show isolated instances, while multiple instances or patterns suggest potentially malicious intent.

  - **Consider host role and asset criticality:** Identify the role of the host system making the connection. If it's a critical or sensitive system (e.g., a server or endpoint with privileged data), prioritize further investigation.

  ### Prioritization

  This alert should be considered medium severity due to the potential for significant impact if ZeroTier is being misused for remote access or data exfiltration. The likelihood of malicious abuse is moderate, as many organizations may use ZeroTier legitimately, but the tool's capabilities can also be exploited by attackers in various scenarios, making it a potential vector for compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where ZeroTier is legitimately deployed, leading to potential false positives. High confidence may be challenged if the organization's network policies allow connections to ZeroTier. The alert may also trigger during routine administrative tasks or remote management activities. A related detection to strengthen coverage would be monitoring for abnormal outbound traffic patterns or connections to other known C2 domains, which can indicate a coordinated attack strategy.

