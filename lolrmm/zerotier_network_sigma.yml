note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to ZeroTier domains, which may indicate the use of the ZeroTier Remote Management Module (RMM), potentially employed for remote access or lateral movement within a compromised network. The attacker objective is often to establish covert communication channels or manage compromised assets. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and the associated technique of Remote Services (T1219).

  The primary telemetry source is Windows network connection logs, focusing on outbound connections to hostnames ending in "zerotier.com". A successful exploit can enable unauthorized remote access or control over internal systems, potentially leading to data exfiltration or further lateral movement. Importantly, this detection does NOT confirm malicious intent; legitimate use cases exist for ZeroTier within enterprise environments.

  ### Investigation Steps

  - **Review outbound connections:** Investigate recent network connection logs (Windows Event ID 5156) for outgoing connections to "zerotier.com" and "*.zerotier.com". Confirm if the source IP is associated with an authorized user or device.

  - **Check system roles and installed software:** Verify the host's role and installed applications. Legitimate endpoints might include managed devices with ZeroTier installed for remote access. Look for DLLs or executables related to ZeroTier on the file system.

  - **Analyze user activity logs:** Explore authentication logs (Event ID 4624) for the user accounts associated with the outbound connections. Multiple, unusual remote access attempts by non-admin users suggest potential malicious exploitation.

  - **Identify high-confidence malicious indicators:** Note any instances where the outbound connections occur at unusual hours or from unexpected systems, particularly if combined with alternate indicators such as failed login attempts or abnormal process creation events (Sysmon Event ID 1).

  - **Assess potential data exfiltration:** Examine network logs for data volume and patterns sent to ZeroTier. Excessive or compressed file transfers during these connections can indicate potential data exfiltration activities.

  ### Prioritization

  This alert should be treated with medium priority due to the potential compromise of systems enabling unauthorized remote access. Given the increasing use of tools like ZeroTier in both legitimate and malicious context, there is a notable risk of abuse, particularly in environments lacking tight security controls or awareness of such remote management tools.

  ### Blind Spots and Assumptions

  Detection may be evaded by attackers using legitimate configurations or by those who use VPNs to obscure connections, complicating detection of ZeroTier activity. The absence of DNS log data can hinder confirmation of benign use versus malicious intent. Furthermore, other remote management tools may yield similar network behaviors, making companion detections for well-known RMM tools necessary for stronger coverage.

