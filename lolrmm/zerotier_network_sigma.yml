note: |
  ### Technical Context

  This rule detects network activity involving ZeroTier, a remote management tool used for creating virtual networks. Attackers may utilize this tool for command-and-control (C2) purposes or to establish unauthorized remote access to compromised systems. The relevant MITRE ATT&CK technique is "Application Layer Protocol" (T1219), which describes how adversaries may abuse legitimate applications to disguise their activity.

  Primary telemetry sources for this detection include Windows network connection logs, specifically watchlisted domain resolution to "zerotier.com" or its subdomains. If exploited, the impact could include unauthorized system access, data exfiltration, or lateral movement within the network. Importantly, this detection alone does not confirm malicious intent since ZeroTier can be used legitimately within organizations.

  ### Investigation Steps

  - **Identify network connection details:** Check for network connection logs (Event ID 5156 on Windows) that document connections to "zerotier.com" or "*.zerotier.com". Review the SourceIPAddress and DestinationIPAddress fields. Connections from known IT assets may be benign, while connections from user workstations during off-hours could indicate malicious use.

  - **Review application activity:** Investigate process creation logs (Sysmon Event ID 1) for processes creating network connections to ZeroTier. Look for unusual parental relationships or execution from suspect locations (e.g., temporary folders) that deviate from expected behavior.

  - **Validate legitimate use cases:** Determine if ZeroTier is an approved application within your environment. If discovered in a user space or by non-IT roles, it's essential to verify if it aligns with organizational policies or is documented for legitimate business purposes.

  - **Correlate with established baselines:** Compare the alert against established baselines of network activity for the affected asset. Review historical data for patterns of access to ZeroTier to distinguish between normal usage and potential abuse.

  - **Examine associated cloud resources:** If applicable, investigate any connections from cloud assets. Look for public or unprotected resources that may be exploited with these types of tools, correlating logs from cloud provider activity to provide context.

  ### Prioritization

  This alert is of medium severity as it indicates potential use of a tool commonly associated with remote access, which can be misused by adversaries. The likelihood of malicious abuse is real, especially in environments unaware of ZeroTier's presence. This behavior can be weaponized in scenarios aiming to bypass network defenses.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers using custom domains for C2 or by encapsulating traffic to avoid detection. Reliable detection necessitates sufficient logging configurations for network connections and process monitoring. Legitimate activities may include authorized IT personnel using ZeroTier for remote support. A companion detection to strengthen coverage would include monitoring for unusual authentication attempts correlating with ZeroTier traffic.

