note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to ZeroTier domains, which could indicate the use of the ZeroTier remote management and monitoring (RMM) tool. An attacker may leverage ZeroTier for command and control (C2) or lateral movement within a network, aiming to bypass traditional security controls while maintaining persistence. The relevant MITRE ATT&CK tactic is “Execution” (TA0002), with technique "Remote Services" (T1219).

  The primary telemetry source comprises Windows network connection logs, particularly related to destination hostname resolution. If the behavior is malicious, it could lead to unauthorized access and manipulation of systems. Importantly, this detection does NOT confirm that the connection is malicious in nature, as legitimate users may also utilize ZeroTier for remote access.

  ### Investigation Steps

  - **Check recent network connections to ZeroTier domains:** Review Windows Security Event Log (Event ID 5156) for network connections where DestinationHostname contains 'zerotier.com' or '*.zerotier.com' in the past 24 hours. Look for connections made by non-administrative users on workstations with no clear business justification.

  - **Verify process execution related to detected connections:** Identify if executables associated with the detected network activity match known ZeroTier processes (e.g., ZeroTier One service or its executables). Use Sysmon logs (Event ID 1) to locate any suspicious parent-child process relationships.

  - **Investigate the asset's role and user behavior:** Examine the role of the host (e.g., server vs. workstation) and review user activity around the time of the connection using Windows Security Event Log (Event ID 4624). Legitimate activity typically includes documented RMM tool usage, whereas unexpected connections from critical servers might suggest abuse.

  - **Analyze the content of outbound connections:** If possible, capture and analyze packet data using a tool like Wireshark to determine the purpose of the outbound connections. Legitimate ZeroTier traffic will appear as encrypted traffic to ZeroTier IPs.

  - **Assess historical usage patterns of ZeroTier:** Check for prior legitimate usage of ZeroTier services in the environment. Look for established documentation or approvals allowing its use amongst IT personnel. Frequent, unexpected attempts might indicate malicious intent.

  ### Prioritization

  The severity of this alert is medium. While network connections to ZeroTier can be legitimate, their usage on critical systems, especially in high-security environments, poses a risk for unauthorized access or data exfiltration. The likelihood of malicious abuse is moderate, as adversaries increasingly adopt legitimate tools for persistence and evasion.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for adversaries to camouflaging legitimate activity or disguising malicious traffic to appear benign. Continuous log collection from network monitoring tools is critical to ensure coverage. Legitimate use cases of ZeroTier by IT or support teams can trigger this alert, potentially leading to false positives. A related detection rule targeting unusual login patterns or privilege escalation events may enhance overall security posture regarding ZeroTier's implementation in the environment.

