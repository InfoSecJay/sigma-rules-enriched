note: |
  ### Technical Context

  This rule detects file activity related to the MeshCentral Remote Monitoring and Management (RMM) tool, specifically targeting executable files typical of remote access. Attackers may use tools like MeshCentral to gain unauthorized access and control over endpoints, potentially exfiltrating data or delivering payloads. This behavior falls under the MITRE ATT&CK framework, specifically under the Command and Control tactic (TA0011) and the RMM technique (T1219).

  Primary telemetry sources include Windows file event logs that capture file creation or modification events. If the detected activity is malicious, it poses a high security risk due to the potential for unauthorized access and control over systems. This detection primarily indicates file interactions with the MeshCentral agent but does NOT confirm actual malicious intent or unauthorized access on its own.

  ### Investigation Steps

  - **Identify file event details:** Review Windows Security logs for Event ID 4663, focusing on target filenames such as `C:\Program Files\Mesh Agent\MeshAgent.exe` or `C:\Program Files\Mesh Agent\MeshAgent.msh`. Check for operations like CreateFile or WriteFile.

  - **Check for context of execution:** Investigate Process Creation events (Event ID 4688) related to `MeshAgent.exe`. Confirm whether it was initiated by a legitimate user process or escalated privileges indicating potential misuse.

  - **Review user account activity:** Examine User Account logon events (Event ID 4624) for accounts associated with the file activities. Validate if the account has legitimate access or shows signs of unusual behavior, such as logins from non-standard locations.

  - **Analyze MeshCentral communication:** If possible, capture network traffic logs to validate outbound connections made by the MeshAgent process. Focus on unusual external IP addresses or domains, particularly those not associated with known infrastructure.

  - **Confirm legitimate usage patterns:** Understand normal operations of MeshCentral workflows. Compare timestamps and operation frequencies against documented usage in the environment to identify anomalies.

  - **Track potential data exfiltration artifacts:** Look for any log entries indicative of file transfers or unusual network activity that coincides with the timestamps of detected MeshCentral file activities to assess potential data compromise.

  ### Prioritization

  This alert should be treated with medium severity. It indicates potential misuse of RMM tools that could lead to significant impacts on critical systems. The likelihood of malicious abuse is concerning due to the growing use of such tools in targeted attacks, coupled with their capability for lateral movement and data access.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of configuration settings for detailed logging of file events or by an adversary's use of file name obfuscation or process masquerading. Legitimate activities, such as authorized IT support or administrator tasks, might trigger this alert. Related detections could include monitoring for outbound network connections from the MeshCentral agent or correlating with authentication failures indicating potential unauthorized attempts to use the tool.

