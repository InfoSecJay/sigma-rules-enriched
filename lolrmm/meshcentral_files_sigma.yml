note: |
  ### Technical Context
  This detection rule is designed to identify potential file activity related to the MeshCentral remote monitoring and management (RMM) tool. It specifically looks for file interactions with the MeshAgent executable and its associated files, potentially indicating unauthorized or suspicious use of this tool within the environment. Attackers may exploit legitimate applications like MeshCentral to maintain access, execute commands, or conduct reconnaissance on targeted systems without being detected.

  The threat scenario typically involves a malicious actor compromising a device and using MeshCentral to establish remote control, exfiltrating data or executing harmful payloads. This lowers visibility and provides a covert channel for the attacker to perform their objectives while blending in with legitimate administrative tasks. Such behavior aligns with the MITRE ATT&CK technique for Remote Services (T1219) and falls under the execution tactic, signifying adversaries leveraging existing tools to perform their operations.

  Primary data sources for this detection include Windows file event logs, which provide insights into file creation, modification, and access attempts, serving as strong indicators of unauthorized activity related to MeshCentral.

  ### Investigation Steps
  - **Review File Event Logs:** Examine Windows file event logs for access or modification events concerning files associated with the MeshAgent. Look for unusual patterns or timestamps that don't align with authorized usage.
  - **Correlate with User Activity:** Identify the user accounts interacting with the MeshCentral files. Investigate their history for any signs of unusual or unauthorized activities that may indicate compromise.
  - **Check Network Connections:** Monitor network logs for outbound connections to known MeshCentral servers or unusual IP addresses during the times of flagged file activity. This could reveal data exfiltration or command and control communication.
  - **Audit Admin Privileges:** Verify the administrative accounts that have access to the MeshCentral tool. Ensure that only necessary personnel have permission to utilize the tool, as unauthorized access could enable adversaries to exploit its capabilities.

  ### Prioritization
  This alert should be prioritized as medium severity, as unauthorized file access associated with a remote management tool can be indicative of a significant security risk, leading to potential data exfiltration or further compromise if left unaddressed.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to other remote management or administration tools that could be used by attackers similarly to MeshCentral. The detection logic assumes that all relevant file activity will be captured in the file event logs, which may not be the case if logging is misconfigured or if the files are accessed in a manner that does not generate logs. Ensuring that detailed file auditing is enabled on systems where MeshCentral is installed is essential for this alert to function effectively.

