note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the MeshCentral Remote Monitoring and Management (RMM) tool. The behavior of interest includes the creation or modification of specific files linked to the MeshAgent executable and its configuration files. The likely attacker objective includes establishing remote access and control over compromised systems, often for data exfiltration or lateral movement.

  This detection is relevant to the MITRE ATT&CK framework, specifically the **Command and Control Tactic** (TA0011) and the **Remote Services** technique (T1219). Primary telemetry sources include Windows file event logs detailing file path changes, particularly targeting key executable and configuration files typical of remote management frameworks. The security impact of malicious activity could range from unauthorized access to complete system compromise. Importantly, this detection does NOT confirm malicious intent without further contextual evidence or analysis.

  ### Investigation Steps

  - **Check for file creation events:** Review Windows Event ID 4663 (An attempt was made to access an object) and identify if any of the following filenames appear: `MeshAgent.exe`, `MeshAgent.msh`, `meshagent`, and `meshagent.db`. Benign behavior should show these files being accessed by legitimate user accounts, ideally during administrative updates.

  - **Verify the parent process:** Investigate the process creation event (Event ID 4688) for `MeshAgent.exe`. Confirm if it was spawned by a recognized application or process. A parent process originating from unusual or unknown applications may indicate malicious behavior.

  - **Analyze user account activity:** Inspect user activity logs focusing on the timestamps leading to the file event to determine if the user account has a history of accessing similar files. Frequent access by unrecognized users or during non-business hours may indicate compromise.

  - **Cross-reference network activity:** Review firewall logs for outbound connections initiated by MeshAgent to identify potential command and control communications. Look for connections to known malicious IPs or unusual external endpoints.

  - **Assess installation status:** Use security event logs (Event ID 7045) to see if the MeshAgent service was installed or modified recently. Legitimate installations should be documented and approved within the organization's asset management system.

  ### Prioritization

  Given its ability to facilitate unauthorized access and potential data breaches, this alert carries medium severity. The impact may escalate if sensitive systems or data are under control of malicious operators. Remote management tools like MeshCentral are frequently abused for nefarious purposes, making this behavior a common target for attackers.

  ### Blind Spots and Assumptions

  Detection limitations may arise due to legitimate use cases for MeshCentral in automated environments and remote support scenarios, which can lead to false positives. Organizations must ensure they have comprehensive file and process logging enabled for all endpoints. Additionally, this rule can be complemented by monitoring lateral movement attempts (T1075 - Pass the Hash), which often accompany the deployment of RMM tools like MeshCentral.

