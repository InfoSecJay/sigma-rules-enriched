  ### Technical Context

  This Sigma rule detects file interactions involving the MeshCentral remote management tool, specifically targeting executable files and configuration scripts associated with MeshAgent on both Windows and Linux platforms. The likely attacker objective involves unauthorized remote access or management of systems, potentially enabling malicious activities such as lateral movement or data exfiltration. This detection aligns with the MITRE ATT&CK techniques for execution, specifically T1219 (Remote Access Software).

  The primary telemetry sources include Windows file event logs and Linux file system events that track file access, modifications, and creations. If malicious, the security impact could include unauthorized control over an endpoint, leading to data breaches or system compromise. However, this detection alone does not confirm malicious intent, as legitimate use by administrators or authorized personnel of MeshCentral may trigger the rule.

  ---

  ### Investigation Steps

  - **Validate the file paths:** Review events for `TargetFilename` ending with `MeshAgent.exe`, `meshagent`, or `meshagent.msh` (Windows) and `usr/local/mesh_services/meshagent/` paths (Linux) in Windows Event ID 4663 and Linux audit logs (e.g., `auid`, `inode`).

  - **Assess process parentage:** Investigate the creation of MeshAgent processes utilizing Sysmon Event ID 1. Analyze the parent process to understand if the execution originated from an expected administrative process or an anomalous context.

  - **Determine the system role:** Confirm whether the affected asset is a workstation, server, or endpoint typically allowed to run MeshCentral. Compare findings against asset management records for expected software installations.

  - **Check for known good activity:** Identify legitimate usage patterns of MeshCentral in the environment, such as routine remote support sessions by IT staff. Document user account activity and see if it corresponds with typical administrative tasks.

  - **Identify unauthorized file modifications:** Look for suspicious file changes, especially modifications to `meshagent.db` or `meshagent.msh`, in Windows Event ID 4663 and Linux audit logs. Unauthorized access or unexpected modifications are high-confidence malicious indicators.

  - **Capture event correlation:** Analyze network traffic logs or firewall logs around the time of the file activity for connections to known MeshCentral control servers or anomalous external IP addresses.

  ---

  ### Prioritization

  This alert should be treated with medium severity, particularly for endpoints with access to sensitive data or critical infrastructure. The likelihood of malicious abuse is moderate due to the common use of RMM tools for both legitimate IT tasks and potentially harmful actor activities. Given that tools like MeshCentral can be weaponized, especially in targeted environments, prompt investigation is essential.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for adversaries to use legitimate MeshCentral functionality for malicious purposes, equating normal operations with malicious actions. Continuous logging of file events for both Windows and Linux is crucial for reliable detection. Additionally, legitimate IT operations involving remote access may unintentionally trigger this alert, particularly during help desk support. Companion detections, such as those monitoring unusual remote connections or administrative credentials usage, can help corroborate findings and improve coverage.

