  ### Technical Context

  This Sigma rule detects potential network activity associated with the Royal TS Remote Monitoring and Management (RMM) tool, specifically connections to domains ending in 'royalapps.com'. The likely attacker objective is to establish command-and-control (C2) communications using this RMM tool, which could provide unauthorized access to managed devices within the corporate network. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique of Application Layer Protocol (T1219).

  The primary telemetry sources include Windows network connection logs (specifically, Event IDs 5156 for Windows Firewall and 5158 for connection events). If malicious, this activity could lead to significant security impact by providing threat actors control over systems. However, it is important to clarify that this detection does NOT confirm malicious activity on its own, as legitimate usage of the Royal TS tool within authorized personnel can trigger similar alerts.

  ### Investigation Steps

  - **Check the source of the connection attempt:** Review Windows Event ID 5156 (Windows Firewall log) for connection details: ensure the source IP and user match known good entities, especially if connecting to the Royal TS domain.

  - **Identify frequency of connections:** Analyze Event ID 5158 for connection attempts to 'royalapps.com'. Frequent and repeated attempts can indicate potential C2 activity, unlike legitimate usage, which tends to occur sporadically or during set maintenance windows.

  - **Review user account activity:** Investigate associated user accounts for unusual behavior patterns. Review Event ID 4624 (Logon events) to check for logons from atypical devices or at odd hours.

  - **Validate legitimate activity:** Confirm whether known administrators or support personnel utilize Royal TS for legitimate purposes. Document their approved activities and cross-reference timestamps with alerts triggered by this detection.

  - **Correlate with endpoint security logs:** Evaluate any related security events from EDR solutions that indicate exploitation behaviors, such as unauthorized schemas or installation logs correlating with the timeframe of the network activity.

  ### Prioritization

  This alert holds medium severity in an enterprise context due to the potential impact on sensitive systems managed by RMM tools. Given that RMM tools are frequently targeted in attacks, the likelihood of malicious abuse from identified activities is of considerable concern.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate Royal TS use within the organization, which can trigger false positives. The effective monitoring of this alert requires up-to-date firewall logs and proper filtering to distinguish between benign and hostile activity. Legitimate IT operations, such as routine maintenance from authorized partners, may replicate this behavior. A related detection rule for other RMM tools or abnormal process creations can enhance coverage and response capabilities.

