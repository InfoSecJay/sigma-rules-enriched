note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with the Royal TS Remote Management and Monitoring (RMM) tool, indicating potential usage of this software. An attacker may utilize Royal TS to maintain access to systems, manage remote connections, or execute commands as part of a compromise or lateral movement within the environment. This behavior is linked to the MITRE ATT&CK technique: **Remote Services (T1219)**.

  The primary telemetry source is Windows network connection logs that capture attempts to contact the `royalapps.com` domain. If malicious, this activity could suggest unauthorized access or activities being carried out through a remote management tool that could facilitate exfiltration or command execution. Importantly, this detection does NOT confirm malicious activity on its own; legitimate administrative use of Royal TS could also trigger this alert.

  ### Investigation Steps

  - **Check network connection logs**: Review Windows Event ID 5156 (Windows Filtering Platform) logs for outbound connections to `royalapps.com`. Look for other destination IP addresses that resolve to known infrastructure used by this tool for any connections.

  - **Identify user context**: Analyze the user account or system context initiating the connection to `royalapps.com`. Verify if the user has legitimate administrative rights or if this behavior is unexpected based on their role.

  - **Review legitimate usage patterns**: Confirm typical usage of Royal TS within your environment. Note that legitimate connections would generally be initiated during specific maintenance windows or by known system administrators.

  - **Examine related process activity**: Cross-reference with Sysmon Event ID 1 (Process Creation) to identify any suspicious or unexpected process creation related to Royal TS or similar remote management tools during the same time period as the detected network activity.

  - **Search for exfiltration or anomalous files**: Investigate any file transfer logs or indicators of compromise (IoCs) related to tool usage. Pay attention to unusual file access or transfers that coincide with connection attempts to the Royal TS domain.

  ### Prioritization

  The alert has medium severity due to potential unauthorized remote access across critical systems. The likelihood of exploitation is moderate, especially in environments where remote management tools may not be thoroughly monitored or controlled. The use of remote access tools like Royal TS is commonly weaponized, underscoring the importance of thorough investigation.

  ### Blind Spots and Assumptions

  Detection might miss connections to other similar RMM services or encrypted traffic. There is a need for comprehensive logging of outbound connections to ensure all related activities are captured effectively. Additionally, well-documented administrative work may sometimes trigger this rule. A related detection, such as monitoring abnormal usage patterns of common remote access tools, can help strengthen behavioral coverage and reduce false positives.

