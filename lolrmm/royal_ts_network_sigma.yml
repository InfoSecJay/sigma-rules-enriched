note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the Royal TS remote management tool, specifically connections to the `royalapps.com` domain. Successful exploitation or misuse of this tool can allow an attacker to establish command and control over compromised systems. This activity is aligned with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique for Remote Access Tools (T1219). The primary telemetry source includes Windows network connection events, particularly monitoring for connections to the specified hostnames. If malicious, this activity poses high risk as it could indicate an active remote session with compromised systems. It's important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative use of Royal TS may trigger the alert.

  ### Investigation Steps

  - **Check network connection events:** Review Security Event ID 5156 (Windows Filtering Platform) to see if there are other unusual outbound connections to hosts beyond `royalapps.com`. A significant number of such connections could indicate malicious behavior.

  - **Review process creation logs:** Look at Security Event ID 4688 and Sysmon Event ID 1 for any processes linked to the Royal TS tool, such as `RoyalTS.exe`. Legitimate usage will typically show expected admin usernames and known application paths.

  - **Investigate user behavior:** Assess the user account behavior in relation to the connection. If the user typically does not engage in remote management or has unusual activity patterns, this could indicate compromise.

  - **Scrutinize session logs:** Verify connection timestamps and session durations in the network logs. Abnormal connection times (e.g., during non-working hours) may suggest unauthorized access attempts.

  - **Analyze DNS logs:** Check DNS query logs for resolution of `royalapps.com` to look for any anomalies, such as high-frequency requests or queries from unexpected hosts.

  ### Prioritization

  This alert is of medium severity in an enterprise context due to the potential impact of unauthorized remote access on sensitive systems. While legitimate usage exists, the likelihood of malicious abuse through remote management tools is significant, particularly in compromised environments. The nature of remote management makes this behavior a common target for attackers aiming for persistence.

  ### Blind Spots and Assumptions

  Possible evasion techniques include using VPNs or legitimate credentials as cover for malicious activity, effectively masking the source of connections. Reliable detection requires comprehensive logging of network connections and process creations, specifically the enabling of Security Event IDs and Sysmon configurations. Legitimate system administrators using Royal TS for remote management may trigger this alert, complicating investigation efforts. A related detection to enhance coverage could involve monitoring for unusual patterns of remote desktop protocol (RDP) sessions, as both are commonly used in remote access scenarios.

