note: |
  ### Technical Context
  This detection rule aims to identify potential usage of the Royal TS remote management tool, which is often leveraged by attackers for remote administration and control within compromised environments. The expected threat scenario includes attackers using Royal TS to establish connections to command and control (C2) servers or compromised systems, possibly to execute commands or exfiltrate data. The main objective would typically involve maintaining persistence and operational control over a target system after initial infiltration.

  Relevant MITRE ATT&CK tactics include **Execution (TA0002)** and **Remote Services (T1219)**. These techniques encompass various means of executing commands and establishing remote connections to systems. In enterprise environments, detecting unauthorized or suspicious usage of remote management tools like Royal TS is critical since they can facilitate deep access into systems and networks, increasing the risk of further breaches and data exposure.

  Primary data sources relevant to this detection include **network connection logs** from Windows devices, which will provide insight into the destination addresses being connected to, as well as any anomalies that may indicate abuse of the Royal TS tool.

  ### Investigation Steps
  - **Review Network Logs**: Examine the network connection logs for any outgoing connections to the hostname that ends with "royalapps.com." Look for unusual patterns or connections from workstations that typically should not use remote management tools.

  - **Correlate with User Activity**: Check user activity logs to correlate access times and activities of users who may have used Royal TS. Identify if the connections align with legitimate user behavior or if they indicate potential malicious activity.

  - **Audit Installed Applications**: Investigate the installed applications on systems where suspicious connections were detected. Confirm whether Royal TS is present and if it is used legitimately or without appropriate access controls.

  - **Monitor for Command Execution**: Look for records of command execution or script calls that might indicate the use of Royal TS for remote command execution. This could involve correlating process creation events or script execution logs with the network activity to assess the context of the remote connections.

  ### Prioritization
  This alert holds medium severity due to the potential for significant impact if Royal TS is used maliciously, as it can facilitate unauthorized remote access and control over systems. The likelihood of such alerts stemming from genuine user activity should also be considered, as legitimate business operations may incorporate Royal TS for administration.

  ### Blind Spots and Assumptions
  This detection rule may not cover all potential usages of Royal TS, particularly if attackers use alternatives or if legitimate usage patterns mimic anomalous behaviors. The logic assumes that connections to royalapps.com without legitimate justification are suspicious, potentially leading to false positives during normal operations. For the alert to function effectively, comprehensive logging of network connections and accurate timestamping must be enabled on all relevant Windows assets.

