note: |
  ### Technical Context

  This rule detects registry modifications associated with the GoToMyPC remote management tool, specifically focusing on specific registry keys that the application uses for functionality. An attacker may use GoToMyPC to gain unauthorized remote access to systems, leveraging it for command and control (C2) purposes. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), and the technique is Application Layer Protocol (T1219).

  Primary telemetry sources include Windows Registry events, specifically those assigned with Event ID 4657 indicating a registry value was modified. If these activities are malicious, they can significantly impact the security posture by allowing unauthorized access to the system and potentially facilitating lateral movement or data exfiltration. It is essential to note that detection of these registry changes does NOT confirm malicious intent on its own, as legitimate use of GoToMyPC exists.

  ### Investigation Steps

  - **Review registry modifications: ** Check for Event ID 4657 in the Security log focusing on registry paths containing `HKEY_LOCAL_MACHINE\WOW6432Node\Citrix\GoToMyPc` or `HKEY_CURRENT_USER\SOFTWARE\Citrix\GoToMyPc\FileTransfer\history`. Document the specific values that were modified.

  - **Identify user context:** Determine the user account associated with the registry changes by correlating timestamps with other events such as Interactive User Logon (Event ID 4624) or Process Creation (Event ID 4688). Investigate whether the user has legitimate business reasons to use GoToMyPC.

  - **Monitor for related commands:** Cross-reference with process execution logs (Event ID 4688) to check for the presence of GoToMyPC executable (`GoToMyPC.exe`) or other executables commonly associated with remote management tools, noting unusual execution patterns or timing.

  - **Assess host role and criticality:** Identify if the host is a critical asset (e.g., a server managing sensitive data). Increased scrutiny is warranted on high-value targets in the organization.

  - **Verify legitimate activity:** Confirm expected behavior by identifying users who have a documented need for remote access via GoToMyPC. Check for prior authorization or training records that support its legitimate use.

  ### Prioritization

  This alert is of medium severity. The potential impact on sensitive systems is high if exploited for malicious purposes, given the tool’s capability to facilitate unmonitored remote access. While the use of GoToMyPC can be legitimate, its history of being weaponized raises the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection might be limited by obfuscation techniques, such as using undeclared applications or modifying registry keys not commonly associated with GoToMyPC. Reliable detection requires comprehensive logging of registry events. Legitimate usage of GoToMyPC by remote support teams or during scheduled maintenance may trigger alerts alongside this detection. A companion detection to consider is monitoring outbound network traffic for connections to GoToMyPC’s infrastructure, further validating malicious activity.

