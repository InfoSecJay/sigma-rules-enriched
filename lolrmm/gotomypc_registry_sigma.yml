note: |
  ### Technical Context

  The Sigma rule detects suspicious registry activity associated with the GoToMyPC remote management tool, specifically targeting keys likely related to its configuration and file transfer functionalities. Attackers may leverage this tool to establish remote access, facilitate unauthorized data transfer, or pivot within the network for nefarious purposes. This activity aligns with the MITRE ATT&CK technique "Remote Access Tools" (T1219).

  The primary telemetry sources include Windows registry event logs reporting changes to specific keys under Citrix's GoToMyPC namespace. The security impact could be significant, as malicious use of GoToMyPC may enable unauthorized access to sensitive systems or data exfiltration. This detection does NOT confirm malicious intent on its own; legitimate use of GoToMyPC can result in similar registry changes.

  ### Investigation Steps

  - **Check registry change timestamps:** Review registry event logs (Event ID 4657) to identify when changes to `HKEY_LOCAL_MACHINE\WOW6432Node\Citrix\GoToMyPc` occurred. Compare timestamps against user activity logs for discrepancies.

  - **Validate user access rights:** Investigate the accounts that modified these registry entries. Any changes made by non-admin users or at unusual hours may indicate malicious behavior.

  - **Identify legitimate usage patterns:** Determine if GoToMyPC is used legitimately within the organization. Common usage patterns include set intervals for remote support sessions or updates from IT staff.

  - **Correlate with network activity:** Review firewall logs for connections to known GoToMyPC IP addresses or domains (e.g., *.gotomypc.com) around the time of registry changes. Look for outbound connections that are anomalous relative to normal usage.

  - **Search for related malicious artifacts:** Check for additional indicators of compromise, such as the presence of unusual executables or scripts that reference GoToMyPC file transfer history, particularly in directories like `%TEMP%` or `%APPDATA%`.

  ### Prioritization

  This alert has a medium severity due to the potential impact of the affected systems, particularly if the registry changes correlate with unauthorized remote access. The likelihood of malicious abuse is moderate, as the legitimate use of GoToMyPC is common; however, it is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion tactics where adversaries may modify or delete registry keys to obscure their activity. Reliable detection requires that registry logging is enabled, and monitoring tools are properly configured to capture these events. Additionally, legitimate administrative tasks performed by IT personnel may trigger this alert, necessitating thorough context-based investigations. A companion detection to reinforce coverage could involve monitoring for unusual remote access tool installations or executions across endpoints.

