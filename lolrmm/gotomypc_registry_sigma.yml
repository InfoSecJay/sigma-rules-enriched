note: |
  ### Technical Context

  This rule detects unauthorized registry activity associated with the GoToMyPC remote management tool. Adversaries may use GoToMyPC for remote access to compromised systems, aiming to exfiltrate data or maintain persistence within an environment. The relevant MITRE ATT&CK tactic is "Execution" (TA0002) with the technique "Remote System Access" (T1219). Primary telemetry sources include Windows Registry Event logs, specifically targeting changes to certain registry keys related to GoToMyPC. If malicious, this detection could indicate unauthorized access and potential data exfiltration attempts. This alert does NOT confirm that compromised activity has occurred—it only signals potential activity that warrants further investigation.

  ### Investigation Steps

  - **Verify affected registry keys:** Examine Registry Event logs (Event ID 4657) for modifications in `HKEY_LOCAL_MACHINE\WOW6432Node\Citrix\GoToMyPc`, `HKEY_CURRENT_USER\SOFTWARE\Citrix\GoToMyPc\FileTransfer\history`, or user-wise keys under `HKEY_USERS\<SID>`. Analyze the timestamps and user accounts associated.

  - **Check process creation logs:** Inspect Security Event ID 4688 for new process creation that coincided with the registry changes. Focus on processes launching GoToMyPC-related executables and check command-line arguments for unusual switches.

  - **Correlate with network activity:** Review outbound network connections logged by your firewall or endpoint security solutions to identify connections to known GoToMyPC IPs or domains. Legitimate connections should reflect expected business hours and known users.

  - **Identify baseline user behavior:** Compare the activity against expected patterns of legitimate GoToMyPC usage within the organization by reviewing historical logs. Identify authorized user accounts typically utilizing the RMM tool, note any anomalies.

  - **Assess for prior incidents:** Check for related alerts in the previous 30 days that involved registry manipulations or unusual external access patterns—this could indicate a trend or ongoing malicious behavior.

  ### Prioritization

  This alert is of **medium severity** due to the potential impact of unauthorized remote access on critical systems. The likelihood of malicious abuse is moderate, as GoToMyPC is often used for legitimate purposes but can be exploited by adversaries. The behavior described is weaponized in specific targeting scenarios but requires context for assessment.

  ### Blind Spots and Assumptions

  Detection of GoToMyPC-related activity may be limited by its legitimate use, which can generate false positives. Ensure Registry Auditing is enabled and logs are retained to support reliable alerting. Legitimate administrators may trigger these alerts during standard support activities. A companion detection to consider is tracking remote desktop session initiation to strengthen coverage against unauthorized access attempts.

