note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the ToDesk remote management tool, specifically monitoring outbound connections to hostnames ending with "todesk.com." The behavior indicates a potential adversary attempting to establish a command-and-control (C2) channel using RMM (Remote Monitoring and Management) tools. This activity aligns with MITRE ATT&CK tactic: Command and Control (TA0011) and technique: Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs that capture specific outbound connections (e.g., Event ID 5156 or firewall logs). The security impact of this behavior can be significant, as an adversary using ToDesk could gain interactive access to the environment, enabling further actions like data exfiltration or lateral movement. Importantly, this detection does NOT confirm nefarious intent on its own; legitimate activity may also trigger the alert.

  ### Investigation Steps

  - **Check outbound network connections**: Review Windows Firewall logs (Event ID 5156) for outbound connections to "todesk.com" or "*.todesk.com". Note the source IP and associated user/process context to determine if the activity is expected or unusual.

  - **Identify the process initiating the connection**: Use Sysmon Event ID 3 to identify the process that initiated the network connection to ToDesk. Look for processes not typically associated with RMM tools (e.g., legitimate software or system processes).

  - **Review running processes for ToDesk**: Search for the ToDesk executable (e.g., ToDesk.exe) in Process Explorer or via Task Manager. Legitimate installations may exist, but if found at unexpected locations or executed by non-administrative accounts, it could be malicious.

  - **Examine user context**: Check who is logged in or which account initiated the connection (Windows Event ID 4624). If the user does not have a valid business reason to use ToDesk or if it’s an unknown account, classify it as suspicious.

  - **Gather additional telemetry**: Look for logs indicating installation or execution (e.g., Windows Event ID 4688 for process creation) related to ToDesk prior to the network connection. This may indicate malicious use or deployment.

  - **Correlate with other alerts**: Investigate for correlation with other related detections (e.g., unauthorized software installations or suspicious login patterns). Anomalies in user behavior combined with ToDesk connections can strengthen the case for malicious intent.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of compromised systems using ToDesk for remote access. The likelihood of malicious abuse is moderate as RMM tools are commonly weaponized by attackers for persistence and lateral movement. It is important to prioritize triage based on the criticality of affected assets.

  ### Blind Spots and Assumptions

  This detection may be limited by environments where ToDesk is used legitimately, leading to possible false positives. Reliably detecting this activity requires robust logging for network connections and process creation events. Legitimate IT support or administrative tasks may also trigger this alert. Companion detections related to unusual account activity (e.g., Windows Event ID 4625 for failed logins) can strengthen coverage against potential abuse.

