note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the ToDesk remote management tool by monitoring outgoing connections to specific ToDesk domains (e.g., `*.todesk.com`). The likely attacker objective is to establish remote control over an endpoint, enabling unauthorized access, data theft, or lateral movement within a network. This activity corresponds to the MITRE ATT&CK tactic for Command and Control (T1071) and the technique for Application Layer Protocol (T1219).

  The primary telemetry sources include Windows network connection logs (Event ID 5156) and potentially endpoint detection logs capturing outbound connections. If the detected activity is malicious, it may lead to severe consequences, including unauthorized system access and data exfiltration. Importantly, this detection does not confirm unauthorized access on its own; legitimate use of the ToDesk tool may trigger similar alerts.

  ### Investigation Steps

  - **Check Network Log Details**: Review Windows Security logs (Event ID 5156) for outbound connections to `*.todesk.com`. Look for the Source IP address, Destination Port (typically port 443), and Process Name to identify potential malicious activity.

  - **Identify Host Processes**: Validate the process associated with the outbound connection. A legitimate ToDesk process may be running (e.g., `ToDesk.exe`); however, watch for unusual parent processes that may indicate misuse or compromise.

  - **Verify User Context**: Correlate the alert with the user context (user logs) and their expected activities. If a non-administrative user is attempting to connect to ToDesk from critical systems, this could signify malicious intent.

  - **Determine Network Role Impact**: Assess the criticality of the host making the connection. If a server or sensitive endpoint shows this activity, prioritize further investigation compared to lower-risk assets.

  - **Audit for Multiple Connections**: Look for patterns of repeated connections to ToDesk within a short timeframe. Legitimate usage is generally sporadic; a series of connections from the same host could indicate automated or scripted abuse.

  - **Cross-reference with Threat Intelligence**: Consult threat intelligence feeds for known malicious ToDesk distribution patterns, connections, or indicators related to ongoing campaigns.

  ### Prioritization

  The alert is classified as medium severity due to the potential impact on sensitive systems and the likelihood of malicious abuse, especially in environments where remote management tools are not authorized. This behavior has been observed in various attack scenarios targeting enterprise networks, making it a priority for investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate business use of ToDesk, which may generate false positives. Effective detection relies on correct configurations of Windows event logging to capture both successful and failed connection attempts. Additionally, script-based or automated uses of ToDesk may evade detection if not properly monitored. A related detection includes monitoring for unrecognized remote management tools installed on endpoints, which can reinforce the context of unauthorized access attempts.

