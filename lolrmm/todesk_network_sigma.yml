note: |
  ### Technical Context
  This detection rule targets the potential use of the ToDesk Remote Management Tool (RMM) by monitoring network activity that connects to known ToDesk domains. The primary objective of this rule is to identify unauthorized use of ToDesk, which could indicate potential malicious activity such as remote access to corporate systems by an attacker. This is especially pertinent in environments where such tools are not formally sanctioned for use, as attackers may exploit RMM tools like ToDesk for data exfiltration, lateral movement, or system control without authorization.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and specifically technique **Remote Services** (T1219). The detection logic relies on network connection logs, reflecting the attempted connection to specific ToDesk domains. This activity may signify compromise or unauthorized administrative access, requiring further investigation.

  Primary data sources include:
  - Windows network connection logs, which provide evidence of outbound connections.
  - Firewall logs from network security devices that can capture and log the destination of external network traffic.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine Windows network connection logs for entries that show connections to the noted ToDesk domains. Pay attention to the timestamps and originating IP addresses to identify potential suspicious patterns.

  - **Cross-reference User Activity:** Check user activity logs to see if there are legitimate business justifications for connections to ToDesk domains. Look for unusual login times or unusual accounts initiating connections.

  - **Analyze Firewall and Proxy Logs:** Inspect firewall and proxy logs for blocked or allowed attempts to access ToDesk domains. This can help determine whether there are multiple attempts to connect that may indicate automated attempts or irregular user behavior.

  - **Investigate System Processes:** If ToDesk connections are confirmed, investigate the processes running on the systems making these connections. Look for unique processes associated with remote access tools that may require further scrutiny.

  ### Prioritization
  The alert has a medium severity rating due to the potential significant impact of unauthorized remote access tools in an enterprise environment. Given that RMM tools like ToDesk can facilitate unauthorized access and control over critical assets, it is essential to investigate such alerts promptly to mitigate risks.

  ### Blind Spots and Assumptions
  This detection rule may not thoroughly capture legitimate usage of ToDesk within the organization, leading to potential false positives when these tools are used legitimately. The detection logic assumes that all connections to ToDesk domains are unauthorized and does not account for sanctioned use cases by legitimate IT staff. Furthermore, effective detection requires comprehensive logging of network connections, which must be enabled and configured correctly on all relevant Windows systems for the alert to function accurately.

