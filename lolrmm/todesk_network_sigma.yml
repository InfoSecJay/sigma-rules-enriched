note: |
  ### Technical Context

  This rule detects network activity associated with the ToDesk remote monitoring and management (RMM) tool, specifically targeting connections to its known domains (e.g., `todesk.com`). The likely attacker objective is to establish remote control over compromised systems for purposes such as data exfiltration, system manipulation, or lateral movement. This activity aligns with the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry sources include Windows network connection logs, specifically monitoring for outbound connections to ToDesk-related domains. If malicious, the presence of this activity indicates potential misuse of the RMM tool for unauthorized access. It is important to note that this detection does NOT confirm malicious intent on its own, as ToDesk may be used legitimately within the organization.

  ### Investigation Steps

  - **Review network connection logs:** Check for Security Event ID 5156 (Windows Filtering Platform) to identify outbound connections to domains ending with `todesk.com`. Compare timestamps with known operational hours to filter legitimate usage.

  - **Validate the endpoint activity:** Confirm the presence and usage of ToDesk on the machine, including checking process execution logs (Event ID 4688/Sysmon Event ID 1) to establish if ToDesk was actively running during the detected connections.

  - **Identify known legitimate usage:** Determine if ToDesk is listed in approved software or used during IT support operations. Check relevant ticketing system logs for requests for remote support within the same timeframe.

  - **Correlate with user behavior:** Analyze the user account associated with the connections. Review login logs (Event ID 4624) for unusual logins or access outside normal working hours or from atypical locations.

  - **Detect high-confidence malicious indicators:** Look for neighboring suspicious network traffic patterns or connections to known malicious IP addresses (e.g., using threat intelligence feeds). Focus specifically on encrypted connections or unusual port usage.

  - **Validate file creation or exfiltration artifacts:** Check for recent file transfers or downloads linked to the detected ToDesk activity. Look for potential data staging (e.g., newly created files) in temporary directories that may indicate data exfiltration.

  ### Prioritization

  This alert holds a medium severity level, as it involves potentially sensitive systems being accessed through remote management tools. There is a moderate likelihood of malicious abuse, especially if the environment lacks proper oversight on RMM tool usage. This behavior is recognized as a common method for attackers attempting to control compromised systems.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of ToDesk, as approved IT support teams may trigger this alert during standard operations. Accurate detection relies on comprehensive access to network connection logs and may be hindered if logging configurations are deficient. Legitimate activities that could trigger this alert include authorized IT troubleshooting sessions. A related detection to consider is monitoring for unusual remote desktop protocol (RDP) connections, which may help contextualize this RMM tool’s usage.

