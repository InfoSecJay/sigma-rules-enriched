note: |
  ### Technical Context

  This Sigma rule detects network connections made to the ToDesk remote management tool, which is commonly used for remote access and support. The likely attacker objective is to leverage this tool for unauthorized access or control over compromised systems. This activity fits within the MITRE ATT&CK framework under the “Execution” tactic, specifically technique T1219: Remote Access Software.

  The primary telemetry source for this alert is Windows network connection logs, specifically focusing on fields related to destination hostnames. If malicious, the security impact is significant since attackers can gain remote access, perform data exfiltration, or execute additional payloads. This detection does NOT confirm malicious intent on its own, as ToDesk may be used legitimately within the organization.

  ### Investigation Steps

  - **Validate network connections to ToDesk domains:** Review network logs (Windows Event ID 5156) for outbound connections to `todesk.com` or subdomains. Confirm all destination hostnames match the suspicious patterns.

  - **Check for ToDesk client presence:** Lookup local installations on affected systems. Investigate file paths and registry keys associated with ToDesk (e.g., `%ProgramFiles%\ToDesk\` or registry entries under `HKEY_CURRENT_USER\Software\ToDesk`).

  - **Examine process creation events:** Review Security Event ID 4688 or Sysmon Event ID 1 to identify processes invoking ToDesk binaries. Compare process execution times and parent processes; legitimate usage typically shows a clear chain of user-initiated activity.

  - **Assess user account activity:** Inspect user logon events (Security Event IDs 4624 and 4625) around the time of the connection. A legitimate user may use ToDesk to provide support, while unusual access patterns may indicate misuse.

  - **Monitor for data exfiltration:** Look for recent large outbound data transfers following the ToDesk connection using network flow logs or Windows Firewall logs (Event ID 5157). Uncommon data volumes may indicate compromise.

  ### Prioritization

  The alert has medium severity due to its potential impact on systems where remote access is utilized, which can lead to unauthorized administrative control. While ToDesk is a legitimate tool, its common use as a vector for remote administration makes it a realistic target for adversary exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through domain spoofing or use of non-standard ports. Ensure that log sources for Windows Firewall and network connections are properly configured to capture all outbound traffic. Legitimate support activities using ToDesk may trigger these alerts, complicating analysis. Related detections, such as detecting additional remote access tools or unauthorized administrative actions, may strengthen coverage and context.

