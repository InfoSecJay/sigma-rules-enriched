note: |
  ### Technical Context

  This rule detects network connections to the domain 'demo.controlr.app', which is associated with the ControlR Remote Monitoring and Management (RMM) tool. The likely attacker objective is to establish a command and control (C2) channel, enabling remote administration, exploitation, or lateral movement within the network. The relevant MITRE ATT&CK tactic is “Command and Control” (TA0011) and the associated technique is “Application Layer Protocol” (T1219).

  The primary telemetry source is Windows network connection logs, which should include relevant information about outgoing connections, particularly the destination hostnames. If this activity is indeed malicious, it can signify unauthorized remote access, potentially leading to data exfiltration or further compromise. Importantly, this detection alone does not confirm that malicious activity is taking place; legitimate use of the ControlR tool can trigger this alert.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows network connection logs (Event ID 5156) for instances of connections made to 'demo.controlr.app'. Note timestamps and associated user accounts for further context.

  - **Identify the asset role:** Determine if the affected asset is a server or endpoint. If it is a sensitive server (e.g., web application server), prioritize this investigation due to potentially higher impact.

  - **Analyze related processes:** Investigate if any unusual processes (Event ID 4688) initiated connections to the ControlR domain. Legitimate connections typically involve known IT or support staff processes without abnormal parent-child relationships.

  - **Correlate with user behavior:** Check user activity (Event ID 4624) to assess if the connections align with expected user behavior. Legitimate accesses often correlate with administrative tasks or IT support scenarios.

  - **Monitor for exfiltration artifacts:** If suspicious activity is confirmed, check for file creation or transfers that may indicate data exfiltration via RMM tools. Look for unusual outbound file transfer events (e.g., -134-exe processes communicating with external IP addresses).

  ### Prioritization

  The alert severity is medium due to the potential risk of exfiltration or internal compromise via remote access tools. Given the rising trend of RMM tool misuse in attacks, likelihood of malicious exploitation is significant, particularly if the affected asset has critical data.

  ### Blind Spots and Assumptions

  This detection may miss instances if the destination hostname is altered or if the RMM tool employs encrypted traffic to obscure its activity. A reliable detection requires ensuring network logging is enabled on all endpoints. Legitimate administrative activities may trigger this alert, particularly by IT support using ControlR for remote assistance. Companion detections such as outbound traffic analysis to other known RMM tools can help strengthen coverage.

