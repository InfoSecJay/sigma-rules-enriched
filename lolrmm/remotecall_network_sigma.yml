note: |
  ### Technical Context

  This Sigma rule detects network activity that indicates potential use of the RemoteCall Remote Monitoring and Management (RMM) tool. Attackers may use RMM tools for unauthorized access, remote control, or to deploy malicious payloads with the intent of maintaining a foothold in a compromised network environment. Relevant MITRE ATT&CK tactics include Command and Control (T1071) and Remote Services (T1219).

  The primary telemetry sources for this detection are Windows network connection logs, specifically monitoring DNS requests and outbound network connections. A successful exploitation using RMM tools could facilitate data exfiltration, lateral movement, or system compromise. This detection does not independently confirm malicious intent; RemoteCall can also be used legitimately within enterprise environments.

  ### Investigation Steps

  - **Verify network connections:** Review Windows Event Logs for network connection events (Event ID 5156) where the DestinationHostname matches any of the specified RemoteCall domains (e.g., *.remotecall.com, *.startsupport.com). Look for connections occurring outside of scheduled maintenance windows.

  - **Identify legitimate usage:** Check for organizational documentation or inventory of authorized remote management tools. Validate that any identified activity is associated with known system administrators or authorized users performing expected remote support on assets.

  - **Correlate with user accounts:** Cross-reference any identified events with user account activity (Security Event ID 4624) to ensure the connection was initiated by an authorized user account. Alert if there are discrepancies, such as connections made by inactive or unexpected user accounts.

  - **Check for scheduled tasks:** Inspect Windows Task Scheduler (Task Scheduler logs, Event IDs 106, 140) to identify any legitimate use of remote management tools that may align with the detected network activity. Scheduler entries that invoke RemoteCall externally may need further investigation.

  - **Monitor for follow-up indicators:** Look for additional suspicious indicators of compromise such as unusual outbound traffic patterns or file transfers (Windows Event ID 5145 on file share access). Enhanced logging should capture transfers or modifications to sensitive data following any RMM tool detection.

  ### Prioritization

  The alert is medium severity due to the potential impact on affected systems and the likelihood of exploitation of RMM tools for malicious purposes. While legitimate use exists, the activity can be a precursor to further malicious behavior, particularly in environments lacking stringent access controls or visibility.

  ### Blind Spots and Assumptions

  There are limitations in detecting misuse of RemoteCall, as legitimate activities may generate similar network traffic and pre-existing partnerships with system administrators can obscure malicious intent. Reliable detection relies on comprehensive logging of network events and DNS requests. Other similar services (e.g., TeamViewer, AnyDesk) may trigger false positives, requiring companion rules for detection of those tools for enhanced security posture and visibility across remote management activity.

