note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the RemoteCall remote management tool. Such behavior typically indicates an adversarial attempt to establish control over a compromised system, potentially facilitating further malicious actions such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique for Remote Access Software (T1219).

  Primary telemetry sources include Windows network connection logs, specifically monitoring outbound connections to domains ending with `*.remotecall.com` and `*.startsupport.com`. If malicious, this network activity could signal an unauthorized remote administration session. It’s important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of the RemoteCall tool may also trigger this alert.

  ### Investigation Steps

  - **Check outbound connections:** Review Windows Event ID 5156 for detailed logs regarding the connection events to `*.remotecall.com` or `*.startsupport.com`. Look for any unusual processes initiating these connections, especially from unexpected user accounts.

  - **Identify the initiating process:** Investigate the parent process of the outbound connection using Sysmon Event ID 3. A legitimate process (e.g., `RemoteCall.exe`) may indicate authorized usage, while unexpected processes may signify malicious activity.

  - **Correlate with user activity:** Examine user login events (Windows Event ID 4624) around the time of the outbound connection to verify if it aligns with expected user behavior. Anomalies in user activity may indicate compromise.

  - **Review for service installation:** Search for Windows Event ID 7036 to check if any services related to RemoteCall are installed or running. Unexpected installations may point to unauthorized usage or installation.

  - **Analyze related network activity:** Utilize network monitoring tools to assess traffic patterns. Look for unusual traffic volume to the RemoteCall domains that may indicate mass data exfiltration or ongoing command and control (C2) activity.

  ### Prioritization

  This alert is of medium severity due to the potential for malicious use of remote access software. The affected systems may have been compromised, and the likelihood of using RemoteCall for inauthentic purposes is moderate, as this software can be used for legitimate and illegitimate remote support services.

  ### Blind Spots and Assumptions

  Detection may be limited if network traffic is encrypted or if logging is misconfigured. Legitimate usage by internal support teams may trigger the alert, complicating investigations. It is recommended to correlate with alerts for unauthorized software installations or abnormal user behavior. Additionally, monitor network logs for related suspicious behaviors, such as frequent connections to known malicious IP addresses or unexpected domain lookups.

