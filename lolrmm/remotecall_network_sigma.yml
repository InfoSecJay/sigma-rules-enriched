note: |
  ### Technical Context

  The rule detects outbound network activity to domains associated with the RemoteCall Remote Management Module (RMM) tool, indicating the potential use of remote desktop functionality or management tooling by an unauthorized actor. The likely attacker objective is to gain remote control over a compromised system for exploitation or lateral movement within the network. This behavior relates to the MITRE ATT&CK tactic of Command and Control (T1071) and technique T1219 (Remote Access Tools). The primary telemetry source for this detection is Windows network connection logs, specifically focusing on the destination hostnames being contacted. If malicious, this could lead to unauthorized access, data exfiltration, or system compromise. Importantly, this detection alone does not confirm malicious intent, as RemoteCall can be used legitimately for remote support.

  ### Investigation Steps

  - **Check connection logs**: Review network connection logs for Event ID 5156, focusing on the "DestinationHostname" field for any connections to *.remotecall.com or *.startsupport.com.
  - **Identify user actions**: Correlate timestamps of detected connections with user activity logs (e.g., Event ID 4624) to assess if an authorized user initiated the remote access session.
  - **Look for unusual execution**: Examine for local process creation events (Security Event ID 4688, Sysmon Event ID 1) just prior to the network connection, specifically processes launching from unusual paths or with suspicious command-line arguments.
  - **Evaluate system roles**: Determine the role of the affected host within your environment—endpoint systems should not exhibit behavior connecting to RemoteCall without valid business justification or documented use cases.
  - **Investigate traffic patterns**: Analyze packet captures if available, focusing on captured payload content to identify any malicious commands being sent over the connection, which would indicate potential exploitation attempts.
  - **Review legitimate use cases**: Document instances where internal support teams use RemoteCall legitimately, comparing connection patterns against this for baseline behavior, ensuring no dedicated support personnel were performing valid actions at the time.

  ### Prioritization

  The alert is of medium severity due to the potential for remote access associated with compromised systems, which could lead to significant unauthorized actions. While RemoteCall usage is not universally malicious, its use in an unapproved context or outside of established business processes raises concern about adversary tactics.

  ### Blind Spots and Assumptions

  Detection may miss instances where the malicious actor uses alternative remote management tools or employs domain generation algorithms to avoid detection. Reliable detection relies on consistent logging configurations for Windows network connection events and may produce false positives during legitimate RemoteCall activity. A related companion detection could involve monitoring for lateral movement tactics (e.g., via RDP or other remote access protocols) to strengthen coverage against unauthorized access efforts.

