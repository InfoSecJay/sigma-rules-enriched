note: |
  ### Technical Context

  This rule detects network connections to domains associated with the RemoteCall Remote Management and Monitoring (RMM) tool, primarily targeting its related services such as `remotecall.com` and `startsupport.com`. Attackers may utilize such tools for remote access, support, or control of compromised systems with the intention of data theft or lateral movement within a network.

  Relevant MITRE ATT&CK tactics include **Execution** (T1203) and **Remote Services** (T1219). The primary telemetry sources are Windows Security logs for network connections and potentially Sysmon logs detailing process execution linked to network activities. If malicious, this activity can lead to unauthorized access and data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of RemoteCall can also trigger this alert.

  ### Investigation Steps

  - **Review network connection logs:** Examine Windows Firewall logs (Event ID 5156) for outbound connections to `*.remotecall.com` or `*.startsupport.com`. Valid connections may correlate with known administrative functions or support scenarios.

  - **Check Sysmon process creation logs:** Look at Sysmon Event ID 1 for any processes that connect to the detected domains. Verify whether these processes are associated with legitimate administrative tools or unexpected behavior.

  - **Validate associated user accounts:** Inspect the Windows Security Event ID 4624 (logon event) to see if the connection was initiated by a known administrative account or an unauthorized user. Malicious indicators include logins from unusual geographic locations.

  - **Correlate with endpoint activity:** Analyze EDR logs to determine if the process initiating the connection exhibits indicators of compromise, such as unusual command line arguments or elevated privileges not typical for the account being used.

  - **Investigate for additional indicators:** Check for other potential RMM activities, such as file transfers, in Windows Event ID 4663 or command executions that are indicative of remote sessions.

  ### Prioritization

  This alert warrants medium priority due to the potential for serious impact on compromised systems. The likelihood of malicious misuse is heightened when detected from unexpected IPs or accounts, and the RemoteCall tool is known to be weaponized for unauthorized access.

  ### Blind Spots and Assumptions

  This detection may fail against configured evasion measures, such as the use of VPNs that obscure original source IP addresses. Reliable detection necessitates appropriate logging for both network connections and process executions from remote tools. Legitimate support sessions from trusted IT teams could trigger similar alerts. A companion detection method includes monitoring for other known RMM tools' signatures or behaviors, which enhances overall malicious activity coverage.

