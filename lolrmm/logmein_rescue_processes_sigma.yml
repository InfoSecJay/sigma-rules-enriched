note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the LogMeIn Rescue remote management tool. Such behavior typically indicates that an attacker may be using this tool to gain unauthorized access to systems, control user sessions, and facilitate other malicious activities. The most relevant MITRE ATT&CK tactics and techniques for this rule are Execution (TA0002) and Remote Software Deployment (T1219).

  The primary telemetry sources include Windows Process Creation events, particularly focusing on Event ID 4688 in the Security log and Sysmon Event ID 1. If the detected process is malicious, it can lead to data exfiltration, system compromise, or further lateral movement within the network. However, this detection does not itself confirm malicious intent, as the LogMeIn Rescue tool may be used legitimately for remote support.

  ### Investigation Steps

  - **Identify the parent process:** Check Event ID 4688 for parent process names ending with 'support-logmeinrescue*.exe', 'lmi_rescue.exe', or 'lmi_rescue_srv.exe' to determine if the execution is initiated from a known legitimate process or by a potentially malicious actor.

  - **Review for unusual execution context:** Examine the command line for all logged executions. Look for suspicious parameters or execution from unexpected directories, focusing on the `CommandLine` field in Event ID 4688.

  - **Correlate with user accounts:** Identify if the process was executed by high-privileged accounts or unusual user accounts. This can be done by checking the `SubjectUserName` and `SubjectDomainName` fields in the Security log.

  - **Establish baseline legitimate use:** Verify if the organization regularly uses LogMeIn Rescue for remote support. If so, compare execution patterns against last-known good behavior to distinguish between legitimate and anomalous activity.

  - **Analyze network traffic:** Review related network traffic logs for connections originating from the identified process to unknown external IP addresses or domains, which may indicate data exfiltration attempts. Use firewall logs or proxy logs focusing on HTTP/S request patterns.

  ### Prioritization

  This alert should be treated with medium priority. Systems hosting remote management tools like LogMeIn Rescue are critical for operational support. The likelihood of malicious abuse exists, particularly in targeted environments. Such behavior can be weaponized by adversaries to establish persistent access or conduct data theft.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of LogMeIn Rescue, which may trigger false positives. Ensuring comprehensive logging of Windows process creation (Event ID 4688 and Sysmon) is crucial for reliable detection. Additionally, benign activities may include IT support sessions using the same tool. Related detections include unauthorized remote access tools, which can bolster the overall monitoring strategy.

