note: |
  ### Technical Context

  This rule detects the execution of the LogMeIn Rescue remote management (RMM) tool, particularly focusing on processes spawned by its executables (e.g., `support-logmeinrescue.exe`, `lmi_rescue.exe`). The likely attacker objective is remote access and control over a system, which can facilitate other malicious activities like data exfiltration or deployment of additional payloads. This behavior is associated with the MITRE ATT&CK technique for Remote Access Software (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If this detection is confirmed as malicious, it could lead to unauthorized access and potential compromise of sensitive data and network integrity. It is important to note that the detection of these processes does NOT confirm malicious intent on its own; the use of LogMeIn can also occur for legitimate remote support activities.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 for the `Image` field containing `support-logmeinrescue*.exe` or `lmi_rescue.exe`. Dates and times of execution should be correlated with the user context to assess legitimacy.

  - **Review parent process context:** Investigate the `ParentImage` field in Security logs for the same Event IDs to identify the process that initiated the LogMeIn executables. Legitimate instances should originate from known administrative tools or support personnel, while unexpected parent processes may indicate malicious use.

  - **Identify user account activity:** Verify the `AccountName` and `Domain` fields in the process logs to ensure the executing user is a recognized IT support representative or administrator. Access by non-privileged accounts is atypical and may indicate potential exploitation.

  - **Check for unusual network activity:** Review network logs and outbound connections related to the timestamp of the LogMeIn processes to identify any suspicious IP addresses or unusual traffic patterns. This may reveal remote connections initiated without proper authorization.

  - **Monitor for recent software installations:** Look for log entries in the application logs (Event ID 1033) indicating installation of the LogMeIn tool. Recent, unexpected installations can be an indicator of unauthorized access and should raise concern.

  - **Assess known valid usages:** Document legitimate instances of LogMeIn usage in the environment. Compare against current logs to determine if the detected processes align with known support sessions.

  ### Prioritization

  Alert severity is medium due to the potential risk of unauthorized access to sensitive systems and data. The likelihood of malicious abuse exists, especially with tools like LogMeIn commonly targeted for malicious remote access. Although the tool can be used legitimately, its presence warrants investigation to confirm authorized activity.

  ### Blind Spots and Assumptions

  Detection may miss instances where LogMeIn tools are renamed or executed under different import names. Logging configurations must ensure comprehensive process creation logs are captured for reliable detection. Legitimate IT support activities may trigger the alert, particularly in an environment where remote support is standard practice. Related detections could include unexpected remote sessions or anomalies in user activity that enhance overall visibility of potential threats.

