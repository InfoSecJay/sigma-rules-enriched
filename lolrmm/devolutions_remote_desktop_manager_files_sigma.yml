note: |
  ### Technical Context

  This Sigma rule detects file activity from the Devolutions Remote Desktop Manager (RMM) tool, specifically monitoring access and modifications to its log and configuration files. The likely attacker objective is to either manipulate remote desktop connections or covertly track internal activities using legitimate tools within a compromised environment. The relevant MITRE ATT&CK tactic is Execution, specifically Technique T1219 - Remote Access Tools. The primary telemetry source is Windows file event logs (File System Access) and relevant log types include file creation, modification, and access events. If this malicious activity occurs, it could lead to unauthorized access to sensitive systems or data exfiltration. Importantly, this detection alone does not confirm malicious intent, as legitimate users may also generate these file activities.

  ### Investigation Steps

  - **Check recent file access patterns**: Review Windows Security Event ID 4663 for modifications or accesses to '%localappdata%\Devolutions\RemoteDesktopManager\Connections.log' and '%localappdata%\Devolutions\RemoteDesktopManager\Connections.db' to identify unusual user activity.

  - **Validate file integrity**: Cross-reference any log modifications against normal business hours and typical user behavior to differentiate between standard operations and potential compromise.

  - **Identify user behavior**: Investigate the user account accessing these files, focusing on its role. Determine if the account has legitimate need and recent activity relating to RMM product usage to assess the legitimacy of access.

  - **Look for anomalous connections**: Review Windows logs for initiations of remote desktop sessions around the same timeframe as file activity, specifically looking for Event ID 4624 (logon) with associated RDP session or Event ID 7045 (service installation) that may indicate remote access tools being deployed.

  - **Document expected behaviors**: Note that legitimate use of the Devolutions RMM tool typically involves scheduled tasks or known operational patterns. Compare current findings against these baselines to assess abnormal activity.

  ### Prioritization

  This alert is of medium severity due to the operational impact of possible unauthorized access to remote desktop tools. The likelihood of malicious abuse is moderate, given that RMM tools can be weaponized for lateral movement or credential harvesting. Such behavior is not rare, especially if the detected files exhibit unexpected access where no legitimate user activity is present.

  ### Blind Spots and Assumptions

  This detection may miss attempts to obfuscate or evade by legitimate users manipulating the RMM tool for unauthorized access. Required log sources include proper configuration of file activity logging for accurate monitoring of relevant areas. Legitimate activities, such as a user reviewing their connection history or managing credentials, may trigger this alert. Companion detections, such as monitoring of unusual logon patterns or network traffic related to remote access, would strengthen overall coverage against potential misuse.

