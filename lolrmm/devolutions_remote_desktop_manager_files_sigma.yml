title: Potential Devolutions Remote Desktop Manager RMM Tool File Activity
id: 19ed3ecc-024f-4afe-bc9c-5c61e581846f
status: experimental
description: |
  Detects potential files activity of Devolutions Remote Desktop Manager RMM tool
references:
- https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
tags:
- attack.execution
- attack.t1219
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith:
    - '*\Devolutions\RemoteDesktopManager\Connections.log'
    - '*\Devolutions\RemoteDesktopManager[GUID]\Mru.xml'
    - '*\Devolutions\RemoteDesktopManager\Connections.db'
  condition: selection
falsepositives:
- Legitimate use of Devolutions Remote Desktop Manager
level: medium
note: |
  ### Technical Context
  This rule detects potential file activity associated with the Devolutions Remote Desktop Manager (RDM) tool. Specifically, it focuses on monitoring file changes to critical components of the tool, such as `Connections.log`, `Mru.xml`, and `Connections.db`. These files may contain sensitive information regarding remote connections and credentials stored by users, making them a potential target for attackers seeking unauthorized access.

  In the context of a cyber threat scenario, an attacker may leverage the RDM tool to gain unauthorized access to systems by extracting stored credentials or connection details. The likely objective would be lateral movement within the network or the exfiltration of sensitive information. The relevant MITRE ATT&CK tactics/techniques include:

  - **Execution** (T1203): Exploiting vulnerabilities in legitimate applications to execute code.
  - **Credential Access** (T1212 - Exploiting Credentials): Gaining access to credential stores.

  Primary data sources for this detection rule include Windows file event logs that capture file modifications, enabling analysts to track and respond to suspicious RDM tool file accesses.

  ### Investigation Steps
  - **Review File Event Logs**: Examine file event logs to identify changes to the specified Devolutions RDM files. Look for any unauthorized modifications or access patterns that deviate from normal user behaviors.
  - **Correlate User Activities**: Analyze the log-off/log-on events tied to RDM file access. Are these files being modified by users with the appropriate privileges, or is there suspicious activity indicating potential misuse?
  - **Assess Recent Connections**: Investigate the contents of the `Connections.log` and `Mru.xml` files to identify any unexpected or unauthorized remote connections recorded by RDM. Check for unusual source IPs or connection times.
  - **Onboarding Policies Check**: Confirm that user accounts with access to RDM are following proper onboarding and security protocols, including appropriate privileges and MFA configurations.

  ### Prioritization
  The alert's severity is medium due to the potential risk of credential exposure and unauthorized access that the misuse of RDM can pose in an enterprise environment. The likelihood of an attack using RDM for lateral movement underscores the need for timely investigation.

  ### Blind Spots and Assumptions
  Potential blind spots include environments where Devolutions RDM is not in active use, raising the risk of false positives if the detection rule is overly broad. The detection logic assumes that the specified file paths are consistently used and logged; however, environmental variations or different installation paths could lead to undetected activities. Additionally, required logs such as Windows file event logs must be enabled and properly configured to ensure effective detection of these file access events.

