note: |
  ### Technical Context

  This rule detects file activity related to the Devolutions Remote Desktop Manager (RDM), which is often used for managing remote connections. The expected behavior includes the creation, modification, or access of specific log or configuration files associated with this application. An attacker may utilize RDM to facilitate unauthorized remote access or to exfiltrate sensitive configuration data, representing an insider attack or compromised environment.

  The relevant MITRE ATT&CK tactic is **Command and Control**, with technique ID **T1219** (Remote Access Software). The primary telemetry sources include file system events specifically targeting files within the Devolutions RDM directories on Windows systems. If malicious, this could enable attackers to execute unauthorized remote access or lateral movement within the network. This detection does NOT confirm that the activity is inherently malicious but highlights potential misuse of a legitimate tool.

  ### Investigation Steps

  - **Check file activity timestamps:** Review the modification or creation timestamps of `Connections.log`, `Mru.xml`, and `Connections.db` files, noting any activity outside normal operational hours (e.g., after hours or weekends).

  - **Analyze user behavior:** Validate the user associated with the detected event. Confirm expected usage patterns for the identified user. Users in administrative roles frequently access RDM, whereas a low-privilege user interacting with these files may raise flags.

  - **Correlate with remote access logs:** Cross-reference file events with Remote Desktop Protocol (RDP) access logs. Security Event ID 4624 (Successful logon) can identify any remote logins around the same timestamps.

  - **Assess environment threats:** Determine if the affected system is critical (e.g., management workstations, servers hosting sensitive data). Investigate the surroundings for any known vulnerabilities that could be exploited via RDM.

  - **Identify high-confidence indicators:** Look for unusual file access patterns such as recurrent writes to `Connections.db` by non-admin users. This could indicate an ongoing attempt to leverage RDM for unauthorized connections.

  - **Examine RDM configurations:** Inspect the contents of `Mru.xml` for connections to unusual IP addresses or domains. Validate whether these match known trusted hostnames or if they represent external entities.

  ### Prioritization

  This alert warrants medium severity due to the file activity linked to a legitimate remote access tool that may be exploited. The risk is elevated if the affected system contains privileged credentials or sensitive data, increasing the likelihood of compromise through unauthorized remote access. Similar file activities have a potential for being weaponized by adversaries during targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if file event logging is incomplete or improperly configured. Adversaries might employ evasion techniques such as altering file timestamps or using legitimate user accounts to perform the actions. Legitimate use cases for RDM may trigger this alert, particularly in environments where remote management is common. A related detection could be monitoring for unusual RDP session activity, enhancing overall surveillance of remote access tools.

