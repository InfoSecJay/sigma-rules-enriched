note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Devolutions Remote Desktop Manager (RDM), specifically targeting log files and database connections related to remote sessions. Attackers may leverage RDM to remotely control systems or access sensitive information for malicious purposes. The relevant MITRE ATT&CK tactic and technique for this detection are "Execution" (TA0002) and "Remote Services" (T1219). Primary telemetry sources include Windows file event logs and any associated application logs. If malicious, it could lead to unauthorized access or manipulation of sensitive systems. This detection does NOT confirm malicious intent by itself, as legitimate use of this tool is common in enterprise environments.

  ### Investigation Steps

  - **Check file access logs for suspicious activity**: Review Windows file event logs (Event ID 4663) for access to `Connections.log`, `Mru.xml`, or `Connections.db` around the alert timestamp. Look for unusual timestamps or access patterns inconsistent with normal usage.

  - **Identify user behavior**: Examine the user account associated with the file access. Normal behavior for remote desktop connections typically shows usage patterns from specific personnel or IT staff. Compare it against expected user roles and typical access times.

  - **Review recent changes in systems**: Investigate any recent installations or usage of Devolutions RDM on the host or network. Look for installation logs (Event ID 11724) or application logs indicating new configurations or user onboarding.

  - **Evaluate the data being accessed**: For potential malicious indicators, ensure the `Connections.db` and `Mru.xml` files do not contain unexpected IP addresses or connection strings that could indicate compromise. Focus on entries that show connections to high-risk systems or external IPs.

  - **Review application logs for anomalies**: Analyze logs from Devolutions RDM if accessible, specifically looking for unusual connection attempts or failed logins that could indicate brute force or credential harvesting activities.

  ### Prioritization

  This alert is of medium severity due to the potential risk of unauthorized access linked with legitimate administrative tools. The likelihood of malicious behavior increases if the observed activity comes from unauthorized accounts or outside regular operational hours. Remote administration tools like RDM are frequently weaponized by attackers for lateral movement and persistence.

  ### Blind Spots and Assumptions

  The detection may miss evasion techniques like renaming or modifying the application’s logging paths. Consistent logging from file systems must be set up to ensure comprehensive visibility. Legitimate activities that could trigger the alert include authorized IT personnel accessing the logs for support or configuration purposes. A related detection would involve monitoring for unusual login attempts through Remote Desktop Protocol (RDP), enhancing the overall detection capability for remote access scenarios.

