note: |
  ### Technical Context

  This rule detects network connections to domains associated with the Remote Utilities Remote Monitoring and Management (RMM) tool, which may indicate unauthorized remote access attempts. Attackers could leverage the tool to gain control over endpoints, exfiltrate data, or establish persistence. This behavior correlates with the MITRE ATT&CK tactic of Command and Control (T1071) and technique of Application Layer Protocol (T1219).

  The primary telemetry source is Windows network connection logs, specifically targeting events where connections are established to the domain patterns '*.internetid.ru' and '*.internetid.ru.'. If the connections are not authorized, the security impact could involve data breaches or system compromise. The detection does NOT confirm malicious intent independently; legitimate use of the Remote Utilities tool can produce similar network activity.

  ### Investigation Steps

  - **Check current endpoint applications**: Review the installed programs on the affected system (using PowerShell command `Get-InstalledProgram` or Software Inventory). Verify if Remote Utilities is a legitimate tool for your organization.

  - **Review network connections**: Analyze Windows Event ID 5156 in the Windows Security log for detailed information regarding connections to the relevant domains. Look for connections made to `*.internetid.ru` by non-standard or critical assets. Legitimate connections will generally be from known managed IT workstations.

  - **Inspect Process Activity**: Evaluate Security Event ID 4688 and Sysmon Event ID 1 for process creation events around the time of the network connection. Look for unusual execution of the Remote Utilities client or associated binaries, which may indicate malicious use.

  - **Check Firewall Logs for Outbound Connections**: Examine firewall logs for allowed or denied traffic related to outbound connections to the suspicious domains. Review log fields for destination IPs and timestamps. Legitimate activity may show connections during business hours from authorized IPs.

  - **Correlate with User Audits**: Cross-reference user account activity in the Windows Security logs (Event ID 4624) to check if unauthorized users have accessed systems using Remote Utilities. Look for unusual login patterns or use of administrative accounts.

  ### Prioritization

  This alert should be considered medium severity based on the impact of potentially compromised endpoints within the organization, the likelihood of misuse of such remote access tools, and the increasing prevalence of similar tactics in active exploit techniques.

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate users employing Remote Utilities, generating false positives. Ensure logging is configured correctly for network connections, particularly around DNS resolutions and outbound traffic. Common activities, such as authorized IT management or remote support sessions, could trigger this alert. Related detections involving unexpected remote access tools or anomalous user logins can enhance overall coverage against unauthorized access.

