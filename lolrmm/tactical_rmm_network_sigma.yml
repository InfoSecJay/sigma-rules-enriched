note: |
  ### Technical Context

  This Sigma rule detects network connections to specific hostnames associated with the Tactical RMM tool, which is an open-source remote monitoring and management software. The likely attacker objective is to leverage this tool for remote access and control over compromised systems. The relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071) and Remote Access Software (T1219). The primary telemetry sources required for this detection are network connection logs, particularly focusing on DNS queries and outbound connections. If malicious, the use of Tactical RMM could allow an adversary to take control of systems, exfiltrate data, or deploy further payloads. Importantly, this detection does not confirm malicious activity on its own, as legitimate use of Tactical RMM by authorized personnel may generate similar alerts.

  ### Investigation Steps

  - **Review network connection logs:** Investigate the source IP addresses in network connection logs (Windows Event ID 5156 or comparable) for unusual outbound traffic directed to `login.tailscale.com` or `docs.tacticalrmm.com`. Note any unexpected usage outside authorized hours.

  - **Correlate with endpoint activity:** Check for any related Sysmon Event ID 3 (network connections). Identify if the source process is executing from unusual locations, such as temporary folders which may indicate malicious intent.

  - **Identify legitimate use cases:** Confirm whether any organizational IT or support staff have legitimate credentials or prior authorization to use Tactical RMM. Review asset inventories and user access permissions accordingly.

  - **Examine firewall logs:** Analyze firewall logs for outbound traffic profiles, looking for anomalies or patterns associated with Tactical RMM traffic, such as excessive connection attempts or behaviors not characteristic of authorized users.

  - **Check for other C2 indicators:** Investigate other logs for signs of Command and Control (C2) activity, such as multiple failed logins or unusual authentication attempts (Windows Event ID 4625) coinciding with the remote connection alerts.

  - **Validate against asset criticality:** Prioritize investigation of these alerts on critical infrastructure or sensitive data hosts. Consider the potential impact of unauthorized access to these assets.

  ### Prioritization

  The severity of this alert is medium. While targeting a legitimate remote management tool, Tactical RMM could be weaponized by adversaries for nefarious purposes. The likelihood of malicious abuse increases significantly on systems containing sensitive information or critical infrastructure.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where adversaries may manipulate DNS traffic or utilize encrypted channels to obfuscate their presence. Reliable detection depends on comprehensive logging from network devices and endpoints to capture all relevant traffic. Legitimate activities may include scheduled maintenance or support requests that trigger alerts during authorized use. A related detection to consider is any alert for unusual authentication activity (such as multiple failed logins) from the same host that could indicate compromised credentials, strengthening overall coverage against RMM exploitation.

