note: |
  ### Technical Context

  This Sigma rule detects network connections to Tactical RMM domains, a tool often used for remote management in IT environments. The likely attacker objective involves establishing a command-and-control (C2) relationship via Tactical RMM, typically employed in IT support scenarios but potentially used maliciously. This detection aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Remote Services (T1219). The primary telemetry sources are Windows network connection logs capturing events related to outbound connections. If exploited, this could allow adversaries to control compromised systems, exfiltrate sensitive data, or deploy additional payloads. Importantly, this detection does not confirm malicious intent without further analysis, as legitimate usage of Tactical RMM exists.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 to identify all outbound connections to the identified Tactical RMM and Tailscale domains (e.g., `docs.tacticalrmm.com`, `login.tailscale.com`). Verify legitimacy based on known scheduled maintenance windows or specific IT team activities.

  - **Identify connected user accounts:** Examine the fields in Event ID 5156 to correlate user accounts involved in these connections. Legitimate administrative users performing system updates or support activity may show regular connections that align with operational schedules.

  - **Correlate processes with connections:** Assess Process Creation logs (Windows Security Event ID 4688) to determine which processes initiated connections to these domains. Look for unusual or unauthorized processes rather than standard RMM tool binaries (e.g., RMM.exe or its legitimate variants).

  - **Inspect device role and criticality:** Determine if the affected systems are critical infrastructure or endpoints. Events from servers or key administrative workstations raise the alert's severity. Expect heightened scrutiny for connections from sensitive roles.

  - **Look for unusual communication patterns:** Use network traffic analysis tools to examine the volume and frequency of traffic to these domains. Malicious tactics may involve irregular, continuous data transfer patterns that should look anomalous compared to baseline legitimate use.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on systems if compromised and the growing trend of adversaries leveraging legitimate remote management tools for nefarious purposes. While the procedural nature of Tactical RMM usage can correlate with legitimate activities, establishing a connection must be thoroughly validated to rule out misuse.

  ### Blind Spots and Assumptions

  Detection relies on the proper configuration of logging for network activity and may miss encrypted or atypical traffic patterns employed by sophisticated adversaries. Legitimate activities might include IT maintenance or troubleshooting sessions, which can trigger alerts when using Tactical RMM. A companion detection to consider is monitoring for suspicious PowerShell usage which may configure or interact with RMM tools, further strengthening threat visibility.

