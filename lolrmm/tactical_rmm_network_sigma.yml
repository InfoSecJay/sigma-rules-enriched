note: |
  ### Technical Context
  This rule detects potential network activity associated with the Tactical RMM (Remote Monitoring and Management) tool, which could indicate either authorized administration activity or potentially malicious behavior, depending on the context. Tactical RMM is commonly used by IT professionals to manage and monitor devices within an organization. However, its utilization can also be a target for attackers seeking to exploit remote management capabilities for unauthorized access or lateral movement within a network.

  The threat scenario involves an attacker leveraging Tactical RMM to remotely control compromised systems, exfiltrate data, or conduct malicious activities under the guise of legitimate administration. The relevant MITRE ATT&CK tactics include **Execution** (TA0002) as it encompasses the use of tools to facilitate code execution on systems. Specific techniques such as **Remote Services** (T1219) highlight the usage of remote management services as potential attack vectors.

  Primary data sources that will contain the best evidence for detection include network connection logs from Windows systems, which will capture any outbound connections to known Tactical RMM server domains like `login.tailscale.com` or `docs.tacticalrmm.com`.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine outbound connections to `login.tailscale.com` and `docs.tacticalrmm.com` from internal systems. Look for unusual source IPs or unexpected timing of these connections.

  - **Analyze Process Creation Events:** Check for any processes spawned around the same timeframe as the detected network connections, focusing on instances of `powershell.exe`, `cmd.exe`, or any unusual executables that could indicate exploitation.

  - **Inspect User Activity:** Investigate user accounts that initiated these connections for anomalies, such as accesses from non-administrative accounts or modifications to critical system configurations.

  - **Correlate with Additional Intel:** Cross-reference findings with known threat intelligence relating to Tactical RMM abuse or misuse to determine if the behavior aligns with recognized attack patterns or if it can be attributed to legitimate organizational use.

  ### Prioritization
  The alert's severity is rated as medium due to the dual nature of the Tactical RMM tool, which can be used legitimately by IT staff but also represents an opportunity for attackers. The occurrence of this type of activity warrants further investigation to rule out malicious misuse, given the increasing prevalence of remote management tools in targeted attacks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to the use of encrypted communication, which could prevent logging of specific payloads or commands executed via RMM tools. The detection logic assumes that any outbound connection to the specified Tactical RMM domains is suspicious, but legitimate administrative access could raise false positives. Proper logging of network connections and processes is essential for this alert to function effectively; without it, the risk of missing true malicious activity increases.

