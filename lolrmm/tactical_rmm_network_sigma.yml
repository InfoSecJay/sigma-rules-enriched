note: |
  ### Technical Context

  This rule detects network connections made by the Tactical RMM (Remote Monitoring and Management) tool, which is used for managing Windows systems remotely. The likely attacker objective is to utilize Tactical RMM to gain unauthorized access to and control over target systems within the enterprise environment. This behavior aligns with the MITRE ATT&CK framework under the tactic "Execution" and technique "Remote Services" (T1219).

  The primary telemetry source is Windows network connection logs, specifically looking for outbound connections to known Tactical RMM endpoints (e.g., login.tailscale.com, docs.tacticalrmm.com). If malicious, such activity could indicate a threat actor leveraging remote management tools to facilitate system compromise or lateral movement. Importantly, this detection does NOT confirm malicious activity in isolation, as legitimate uses of Tactical RMM exist.

  ### Investigation Steps

  - **Verify the source of the connection**: Review Windows Firewall logs (Event ID 5140) for the originating process and its parent process. Ensure processes initiating the connection are authorized and correspond to known management tools.

  - **Check asset classification**: Identify the role of the asset making the outbound connection. Critical assets (e.g., Domain Controllers, servers) should have heightened scrutiny, while non-critical assets may exhibit more benign RMM usage.

  - **Review connection timestamps**: Analyze the connection timestamps and correlate with specific maintenance windows or known administrative activities. Look for patterns indicating unusual access outside normal operational hours.

  - **Identify suspicious user accounts**: Check the user account initiating the network connection. Confirm it matches known administrative accounts. Unauthorized accounts or ephemeral user accounts may signal compromised access.

  - **Monitor for multiple connections**: Identify multiple instances of the same external destination (e.g., login.tailscale.com) within a short timeframe in the network logs. Repeated connections can suggest scripted or automated malicious behavior.

  - **Assess legitimate activity**: Investigate typical usage patterns for Tactical RMM within your enterprise. Expect legitimate connections during planned maintenance and from specific administrative users, which can serve as a baseline for determining anomalies.

  ### Prioritization

  The severity of this alert is medium because, while Tactical RMM can support legitimate remote management activities, its misuse poses a significant security risk. The impact can be heightened if the activity involves critical systems, and the likelihood of abuse is moderate due to increasing reports of remote management tool exploitation in breaches.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for malicious actors to obfuscate their use of Tactical RMM or use custom tools that mimic its signatures. Reliable detection requires comprehensive logging configurations that capture outbound network connections, including proper network logging at the host and firewall levels. Legitimate usage, such as scheduled remote maintenance tasks or help desk support, may trigger this alert. A related detection to consider is monitoring for abnormal access attempts to administrative consoles, which may complement the visibility into unauthorized RMM tool use.

