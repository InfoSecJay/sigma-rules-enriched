note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the Tactical RMM (Remote Monitoring and Management) tool, specifically targeting connections to known domains such as `login.tailscale.com` and `docs.tacticalrmm.com`. Tactical RMM is typically used for systems management, enabling monitoring, remote support, and automated management tasks, which can be leveraged maliciously for unauthorized access or lateral movement within a network.

  The relevant MITRE ATT&CK tactic is **Execution (TA0002)**, with technique **T1219: Function, Operation, or Command Execution**. Primary telemetry sources include Windows network connection logs detailing outbound connections. Should this activity be malicious, it can indicate a threat actor using remote management tools to control or exploit systems.

  However, it is crucial to note that this detection rule alone does not confirm the malicious intent of the connection; legitimate administrative use of Tactical RMM tools can also trigger the alert.

  ### Investigation Steps

  - **Identify the hostname and destination:** Review the network connection logs for Event ID 5156 (Windows Filtering Platform) to see if connections were made to `login.tailscale.com` or `docs.tacticalrmm.com`. Note any similar connections to unrecognized domains.

  - **Examine process execution:** Look at Event ID 4688 to see what processes were initiated around the same time as the network activity. Confirm if the process paths include known Tactical RMM executables. Legitimate processes may include `tacticalrmm.exe`.

  - **Correlate user activity:** Investigate user account activity within the logs (Event ID 4624) to check for any unauthorized logins concurrent with the detected connections, particularly for accounts with administrative privileges.

  - **Historical log context:** Check historical connectivity to the Tactical RMM URLs using relevant logs to establish a baseline; if similar connections are common for automated administrative tasks, they may be benign.

  - **Check for credential theft indicators:** Review logs for suspicious authentication attempts or failed logins (Event ID 4625). High volumes or patterns can suggest that an attacker is attempting to gain unauthorized access via stolen credentials.

  ### Prioritization

  This alert is of **medium severity** due to the potential risk associated with unauthorized use of a remote management tool, which can lead to significant system compromise. While Tactical RMM is used legitimately, its nature makes it a target for attackers seeking to exploit privileged access or control systems.

  ### Blind Spots and Assumptions

  This detection has limitations, as legitimate administrative actions may trigger the alert, making context crucial. If logging for network connections is not enabled or structured improperly, vital data may be missed. Additionally, attackers may use obfuscation techniques or alternative remote management tools that do not trigger this rule. A companion detection to consider is monitoring for unauthorized administrative task executions, which strengthens coverage on suspicious use of RMM tools.

