note: |
  ### Technical Context

  This rule detects the creation or modification of files associated with the PiTunnel RMM tool, which is indicative of potential remote management tool (RMM) usage or misuse. An attacker may leverage PiTunnel to establish command and control (C2) channels or execute remote tasks, which could lead to the exfiltration of data or lateral movement within a network. The relevant MITRE ATT&CK tactics and techniques include *Command and Control (TA0011)* and *Remote Access Tools (T1219)*.

  The primary telemetry source for this detection is the Windows file events that capture file activities, specifically filtering for paths related to PiTunnel. If malicious, the presence of this tool may indicate unauthorised access or malicious administration of systems. However, detection of these specific file activities does NOT inherently prove malicious intent; legitimate use cases may exist for this tool.

  ### Investigation Steps

  - **Review file activity on the target system:** Check for Event ID 4663 in the Security log to identify access attempts on `/usr/local/bin/pitunnel` and `/etc/systemd/system/pitunnel.service`. Look for unexpected modifications or creation timestamps.

  - **Identify user accounts associated with file changes:** Query Event ID 4624 for logon events to determine if the user account involved in the file change is recognized and authorized. Legitimate changes will often be associated with administrative or service accounts.

  - **Confirm service behavior:** Review the status of the `pitunnel.service` using `systemctl status pitunnel.service` on the affected host to ascertain if it is actively running and if it has any known legitimate use cases in your environment.

  - **Validate network communication:** Inspect the network logs for outbound connections from the host to any unusual IP addresses or domains that may indicate C2 activity. Monitor for connections using specific ports typically associated with RMM tools (e.g., 443 or 8443).

  - **Check for other related artifacts:** Investigate associated log entries for process creation (Event ID 4688) around the same time stamps as file activities. Look for any unusual processes spawned by `pitunnel` that do not align with expected operational procedures.

  - **Document legitimate usage patterns:** Establish a baseline of what legitimate PiTunnel usage looks like in your environment (e.g., specific scheduled tasks, administrative access patterns) to differentiate between authorized and suspicious use.

  ### Prioritization

  This alert is of medium severity, as it can indicate unauthorized access or potential compromise of a system. The likelihood of malicious abuse is significant due to the notable use of remote management tools by adversaries during the operational phase of an attack. Such behavior is becoming increasingly weaponized within targeted environments.

  ### Blind Spots and Assumptions

  There are limitations with this detection, such as potential evasion through the renaming of file paths or usage of other remote management tools. Reliable detection requires comprehensive logging from Windows file events and potentially other system activity logs. Legitimate IT management or administrative activities may trigger this alert, especially in organizations that utilize PiTunnel for legitimate purposes. Companion detections focusing on inbound or outbound network communications (such as unexpected C2 behavior) would further strengthen coverage against related threats.

