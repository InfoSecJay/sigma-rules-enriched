note: |
  ### Technical Context

  This Sigma rule detects the execution of processes related to the Veyon Remote Management and Monitoring (RMM) tool, specifically monitoring for instances of `veyon-wcli.exe`, `veyon-worker.exe`, `veyon-server.exe`, `veyon-service.exe`, and `veyon-master.exe`. The likely objective of a malicious actor utilizing Veyon would be to gain remote access to or control over compromised machines, potentially for exfiltration, lateral movement, or data manipulation. This behavior aligns with the MITRE ATT&CK tactic of Execution (T1203) and the technique of Remote Services (T1219).

  Primary telemetry sources include Windows process creation logs, specifically focusing on Event ID 4688 (process creation events). If observed in a malicious context, the execution of this software can lead to serious security implications such as unauthorized access or system compromise. It is crucial to note that this detection alone does not confirm malicious intent, as Veyon may be used for legitimate remote management purposes.

  ### Investigation Steps

  - **Review process creation events:** Look for Windows Security Event ID 4688 for instances of `veyon-wcli.exe`, `veyon-worker.exe`, `veyon-server.exe`, `veyon-service.exe`, and `veyon-master.exe`. Cross-reference the process creation time with other activity on the same system to identify unusual patterns.

  - **Analyze parent process relationships:** Check for the parent processes of detected Veyon activity to determine if they are legitimate administrative tools or malicious in nature. Legitimate usage might show common administrative tools like `powershell.exe` running parent commands.

  - **Correlate with user account activity:** Examine logs for the corresponding user account executing Veyon processes. If the user account is not known for legitimate administrative tasks, flag this as a potential malicious indicator. Look for anomalous login times or geographic locations in User Account logs.

  - **Verify file presence and modifications:** Utilize file system monitoring to confirm the presence of Veyon executable files. Check for any unauthorized modifications (e.g., timestamps or file hashing) which may indicate tampering. This could be assessed via Sysmon Event ID 11 to identify file creation or modification events.

  - **Evaluate system roles and asset criticality:** Identify the asset on which Veyon is active. If it's a critical infrastructure server or data repository, prioritize investigation efforts, as certain users should not have remote monitoring tools on such sensitive systems.

  - **Investigate network traffic generated by Veyon:** Check for outbound connections initiated by Veyon processes through network monitoring solutions (e.g., firewall logs) or by analyzing DNS queries. Look for unusual external IP addresses that may suggest command and control or unauthorized data exfiltration.

  ### Prioritization

  The alert has a medium severity due to the potential risk associated with Veyon being misused for remote access to sensitive systems. While it is sometimes weaponized in targeted attacks, legitimate administrative access can create a challenging context for differentiation.

  ### Blind Spots and Assumptions

  Detection may be limited if Veyon is executed from unmonitored or shadow IT systems not logging process creation. Additionally, legitimate use cases such as remote support by internal IT teams may trigger this alert. To enhance coverage, consider implementing detection for other remote management tools (e.g., AnyDesk, TeamViewer) to capture broader potential misuse.

