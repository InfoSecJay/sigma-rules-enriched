note: |
  ### Technical Context

  This rule detects the creation of processes associated with the Veyon Remote Maintenance Tool (RMM), which includes components like `veyon-wcli.exe`, `veyon-worker.exe`, `veyon-server.exe`, `veyon-service.exe`, and `veyon-master.exe`. The likely attacker objective could involve unauthorized remote access to systems for control and management, potentially leading to data exfiltration or further infiltration. This detection aligns with the MITRE ATT&CK tactics of Command and Control (ID: T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide insights into process execution. If the detected processes are malicious, they can pose significant security risks, including unauthorized remote control over affected systems. However, this detection does not inherently confirm malicious intent, as Veyon can be used legitimately within organizations for remote management purposes.

  ### Investigation Steps

  - **Check process origin:**
    Validate the parent process in Security Event ID 4688 logs. Look for parent processes relevant to legitimate IT management tools (e.g., RMM platforms) to differentiate benign use from potentially malicious execution.

  - **Identify user context:**
    Review the account name associated with the process in Event ID 4688. Recognize if the execution is from a privileged account that may indicate misuse or compromise, especially if not associated with IT activities.

  - **Review execution timestamp:**
    Analyze timestamps in the logs corresponding to the RMM process execution. Compare with known maintenance windows for the organization; executions outside these times may warrant further scrutiny.

  - **Assess network connections:**
    Look for outbound connections initiated by the detected Veyon processes, particularly unusual IP addresses or ports noted in firewall logs. Connections to external, unknown addresses could indicate a potential compromise.

  - **Correlate with known baselines:**
    Review your environment's allowed applications and expected usage patterns for Veyon in Sysmon logs. Flag any executions that deviate from established norms, such as unexpected process parameters.

  - **Perform a file integrity check:**
    Verify file creation or modification timestamps for Veyon-related executables. Unexpected changes in file attributes could indicate malicious activity or tampering. Check for possible exfiltration artifacts, particularly if any temp files are created during suspicious executions.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on systems used for remote access, which attackers frequently exploit. The likelihood of abuse is moderate, as unauthorized Veyon usage can facilitate wider attacks, but its legitimate use makes careful investigation crucial.

  ### Blind Spots and Assumptions

  This detection may not identify evasion techniques whereby attackers utilize less common remote management tools or obscure their activities through legitimate Veyon channels. Reliable detection requires proper Sysmon and Event logging configurations. Legitimate administrative activities could inadvertently trigger alerts, particularly during scheduled maintenance. A related detection to consider would be unauthorized execution of other remote access tools to create comprehensive visibility into RMM usage.

