note: |
  ### Technical Context
  This rule is designed to detect potential activity related to the Zabbix Agent RMM tool, specifically when instances of `zabbix_agent*.exe` are spawned as child processes. Zabbix is generally used for network monitoring and management, but the detection of its agent processes as RMM tools could indicate unauthorized remote management or surveillance activities by an adversary. In scenarios where an attacker gains access to a target network, they may utilize tools like Zabbix Agent to maintain persistence or exfiltrate data while remaining undetected.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) as it pertains to executing malicious software to accomplish their objectives. The specific technique implicated is **Remote Management Tools** (T1219), where attackers use legitimate tools to blend in with normal network activity, thus complicating detection efforts. The primary data source for this detection is process creation logs, which capture details about processes initiated on Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances where `zabbix_agent*.exe` is executed to identify unusual contexts or parent processes that may suggest malicious activity.
  - **Analyze Parent Processes**: Investigate the parent processes of the detected Zabbix agent instances. Look for suspicious or uncommon executables that may indicate the use of Zabbix as a tool for threat actor objectives.
  - **Correlate with User Activity**: Check user access and activity logs to determine if the execution of the Zabbix agent aligns with legitimate administrative actions; discrepancies may warrant further investigation.
  - **Collect Network Traffic Data**: Assess traffic logs for unusual network connections initiated by the Zabbix agent, particularly to external IP addresses that may not correspond with normal operational patterns.

  ### Prioritization
  This alert is deemed medium severity due to the potential impact of unauthorized remote management capabilities within the environment. If exploited, such tools can enable attackers to execute commands, access sensitive information, or manipulate system configurations, making it crucial to address and investigate these alerts promptly.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if the Zabbix agent is used legitimately within the organization, leading to potential false positives. The detection logic assumes that any execution of the Zabbix agent outside normal patterns warrants investigation. For the alert to function effectively, comprehensive process creation logging must be enabled on Windows endpoints to capture the relevant details necessary for analysis.

