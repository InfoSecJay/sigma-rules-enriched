  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Zabbix Agent, a legitimate remote monitoring tool commonly used in IT environments. An attacker may utilize this tool to maintain persistence and conduct reconnaissance within a target network, potentially leveraging the agent for malicious command and control activities. The relevant MITRE ATT&CK tactic is **Execution** and technique **User Execution (T1219)**.

  The primary telemetry source is Windows process creation logs, specifically monitoring for any instances where the Zabbix Agent process is initiated. Malicious security impact arises if an attacker uses the legitimate Zabbix Agent for nefarious purposes, such as data exfiltration or lateral movement. Importantly, this detection alone does not confirm malicious activity, as the Zabbix Agent may be used legitimately within the environment.

  ---

  ### Investigation Steps

  - **Check the process creation logs:**
    Review Windows Security Event ID 4688 for process creation related to `zabbix_agent*.exe`. Note the user context; if it involves administrative accounts, this may require further scrutiny.

  - **Analyze parent-child relationships:**
    Investigate the `ParentImage` field in Security Event ID 4688 to confirm if the Zabbix Agent was spawned from another known malicious process. A legitimate context would typically involve a user or system process rather than a suspicious application.

  - **Examine the execution context:**
    Validate the user account under which the `zabbix_agent*.exe` is running. Legitimate executions typically originate from service accounts or administrative users implementing authorized monitoring.

  - **Review task schedules and services:**
    Check for Windows Task Scheduler jobs or legitimate service entries pointing to `zabbix_agent*`. Use PowerShell commands (e.g., `Get-ScheduledTask`) to identify potentially unauthorized tasks that could indicate misuse.

  - **Correlate with network activity:**
    Investigate any outbound connections made by the `zabbix_agent*.exe` (e.g., through Windows Firewall logs or network monitoring solutions) to determine if any data transmission aligns with suspicious activity.

  ---

  ### Prioritization

  The alert severity is medium due to the ability of Zabbix Agent processes to facilitate unauthorized monitoring or data exfiltration activities. While these processes have legitimate use cases, the likelihood of malicious abuse rises in high-value environments with sensitive information, making quick analysis critical.

  ---

  ### Blind Spots and Assumptions

  Detection can be evaded by disabling logging or if the Zabbix Agent is used without sufficient monitoring configurations in place. Additionally, legitimate tool usage may inadvertently trigger this alert during maintenance activities or legitimate monitoring operations. A related detection to consider is monitoring for anomalous connections or commands executed by the Zabbix Agent, enhancing overall visibility of its activity.

