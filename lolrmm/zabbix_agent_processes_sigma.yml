note: |
  ### Technical Context

  This Sigma rule detects potential malicious or unauthorized use of the Zabbix Agent Remote Monitoring and Management (RMM) tool on Windows systems. An attacker may use this software for reconnaissance or manipulation, potentially gaining access to system metrics and performing illicit operations on compromised hosts. The relevant MITRE ATT&CK tactic is Command and Control (T1071) and the technique is Application Layer Protocol (T1219).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and possibly Sysmon Event ID 1. If malicious, the presence of Zabbix Agent activity could imply an attacker has established control over the environment. Importantly, this detection does NOT confirm if the activity is malicious without further contextual evidence, as the Zabbix Agent is often used legitimately for monitoring purposes.

  ### Investigation Steps

  - **Review process creation logs:** Validate all instances of Security Event ID 4688 where the Process Name or Parent Image ends with `\zabbix_agent*.exe`. Check fields like `NewProcessName` and `ProcessId` for unusual or suspicious parent processes indicating potential unauthorized execution.

  - **Identify parent process behavior:** Determine the Parent Image associated with the Zabbix Agent process. Legitimate instances typically initiate from expected system management tools or monitoring processes; anything else could be indicative of exploitation.

  - **Analyze command-line arguments:** Examine the command line used for the Zabbix Agent process. Look for suspicious parameters or commands that do not conform to standard operational practices, as malicious use may include irregular flags.

  - **Correlate with user activity:** Inspect user logins and recent actions around the time of the alert. Focus on any unusual administrative actions or logins, particularly from accounts that typically do not interact with system monitoring tools.

  - **Identify file creation or modification:** Check system directories for unexpected file creation or modification related to Zabbix Agent use, specifically looking for logs or scripts that indicate data exfiltration or malicious command execution.

  ### Prioritization

  This alert should be treated with medium severity due to the potential sensitivity of the affected systems and the risk of exploitation through remote management tools. While the Zabbix Agent is often deployed for legitimate purposes, its misuse is a common vector for attackers looking to maintain persistence and achieve reconnaissance.

  ### Blind Spots and Assumptions

  The detection may be limited by standard operational usage of the Zabbix Agent, potentially leading to false positives. Reliable detection requires complete visibility into process creation logs, so ensure that both Security Event ID 4688 and Sysmon logs are enabled. Legitimate activities may include scheduled maintenance or monitoring tasks that could trigger this alert. Consider the deployment of additional detections for abnormal network traffic patterns to and from the managed assets for enhanced coverage.

