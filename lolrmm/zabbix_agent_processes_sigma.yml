note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Zabbix Agent Remote Monitoring Management (RMM) tool, specifically identifying instances of `zabbix_agent*.exe` being run. The likely attacker objective is to utilize the Zabbix Agent for unauthorized system monitoring or remote execution of commands, potentially as part of lateral movement or persistence strategies. This behavior aligns with the MITRE ATT&CK technique for **Remote File Copy (T1219)**.

  The primary telemetry source is Windows process creation logs, particularly Security Event ID 4688, which contains crucial details about the created process and its parent process. If this activity is malicious, it could lead to unauthorized data access or system compromise. However, it’s important to note that this detection does NOT confirm malicious intent on its own; legitimate use of the Zabbix Agent for system monitoring can trigger the same alert.

  ### Investigation Steps

  - **Verify parent process context:** Check the parent process of detected `zabbix_agent*.exe` instances via Windows Event ID 4688. Look for known legitimate parent processes (e.g., `powershell.exe`, or other management tools) versus suspicious processes that may indicate misuse.

  - **Assess the execution context:** Review the command line arguments associated with the Zabbix Agent process in Event ID 4688 logs. Legitimate commands will typically include flags specific to monitoring usage; suspicious commands may show execution of scripts or commands unrelated to typical Zabbix operations.

  - **Analyze associated network activity:** Retrieve network connection logs (Firewall Event IDs 5156/5158, or appropriate network logging). Investigate outbound connections made by the Zabbix Agent process for atypical destinations or unusual ports, which could indicate exfiltration or unauthorized access attempts.

  - **Check historical activity:** Look for recent instances of `zabbix_agent*.exe` on the host, referencing Sysmon Event ID 1 for a broader behavioral history. A pattern of rapid execution or creation could indicate unauthorized or malicious usage.

  - **Identify asset criticality:** Confirm the role of the affected system to determine impact severity (e.g., is it a server or a workstation). Assess criticality against historical usage of Zabbix for that asset, as legitimate environments may frequently run the agent for monitoring.

  ### Prioritization

  The alert is considered medium severity due to the potential impact on monitored systems. While the likelihood of malicious abuse exists, especially in environments where RMM tools can be weaponized, it might also represent legitimate administrative oversight activities, necessitating contextual investigation.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming the executable or modifying the command line significantly to blend in with legitimate processes. Reliable detection requires comprehensive logging of process creation events, specifically the configuration of Windows Event Auditing for the relevant Event IDs. Legitimate activities, such as authorized maintenance or updates by IT staff, may also trigger this alert. A related detection could include monitoring for unusual network behavior by legitimate RMM tools, providing complementary context.

