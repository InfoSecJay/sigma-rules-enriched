note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Mini RMM Agent, a remote monitoring and management (RMM) tool. The likely attacker objective is to use this agent for command and control (C2) purposes, leveraging it to maintain persistence or facilitate unauthorized remote access. The relevant MITRE ATT&CK tactics include "Command and Control" (TA0011) and the technique "Remote Access Tools" (T1219). Primary telemetry sources include Windows file event logs detailing access to specific executable and script files. If malicious, the activity can lead to unauthorized control over the affected systems and potential data exfiltration. It is important to note that this detection does NOT confirm malicious intent or compromise on its own, as legitimate use of Mini RMM may trigger this rule.

  ### Investigation Steps

  - **Identify accessed files:** Check Windows file event logs (Event ID 4663) for access to `C:\Program Files\MiniRMM\MiniRmmAgent.exe`, `C:\ProgramData\MiniRMM\SmartScreenTest.ps1`, and `C:\ProgramData\MiniRMM\Invoke-AVExclusions.ps1`. Malicious indicators include unauthorized or unexpected file access by non-admin users.

  - **Review execution logs:** Investigate Process Creation logs (Event ID 4688) for instances of `MiniRmmAgent.exe` being launched. Unexpected execution with unusual parent processes may indicate malicious activity.

  - **Validate authorized use:** Cross-reference the identified activity against documented use cases for the Mini RMM tool within your organization. Legitimate use should show consistent file access by known administrators or authorized IT staff.

  - **Analyze network connections:** Examine outbound connections in network logs (e.g., Firewall or Proxy logs) correlating with the timestamps of file accesses. Look for established connections to known malicious IPs or unusual external domains that could indicate C2 communications.

  - **Check for lateral movement attempts:** Review Remote Desktop Protocol (RDP) logs (Event ID 4624 for logon events) for any anomalous login attempts from unexpected sources following Mini RMM activity, which could suggest a broader compromise.

  ### Prioritization

  This alert is of medium severity due to the potential misuse of the Mini RMM tool for unauthorized access within significant systems. While the detection of this specific file activity may indicate malicious behavior, it must be investigated in context, as legitimate use may correlate with the activity. However, the capabilities of RMM tools often make them attractive targets for adversaries.

  ### Blind Spots and Assumptions

  The detection may have limitations if logging for file events is not properly configured or if there are evasion techniques, such as renaming the associated executable. Additionally, legitimate administrative activities might trigger this alert, especially in environments using Mini RMM for support. A related detection, such as monitoring for abnormal network activity from RMM tools, would strengthen coverage against misuse.

