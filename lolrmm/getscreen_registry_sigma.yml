note: |
  ### Technical Context

  This rule detects registry activity associated with the GetScreen Remote Monitoring and Management (RMM) tool. The likely objective of this tool in an adversarial context is to maintain persistent access to a compromised system, enabling remote control or surveillance without the user's knowledge. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and specifically targets the technique of Remote Services (T1219).

  The primary telemetry source is Windows registry events, focusing on specific keys commonly manipulated by the GetScreen tool. A successful detection indicates potential malicious activity that could facilitate unauthorized remote access, posing a significant security risk. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate usage of GetScreen may occur in administrative contexts.

  ### Investigation Steps

  - **Review registry keys accessed:**
    Examine Windows registry events (Event ID 4657) for modifications to `HKU\{SID}\Software\GetScreen`, `HKU\{SID}\Software\GetScreen\Getscreen.me`, and `HKLM\System\CurrentControlSet\Services\GetscreenSV`. Look for unusual access patterns indicating unauthorized use.

  - **Correlate system and user behavior:**
    Identify the user account associated with the registry change. If the changes occurred under a non-administrative account during non-working hours, this may indicate suspicious activity contrasting with expected behavior patterns of known admin accounts.

  - **Check running processes for GetScreen:**
    Use Sysinternals tools (e.g., Process Explorer) to find any instance of the GetScreen process running (ex: `Getscreen.exe`). Confirm whether any unrecognized process attempts to initiate connections or accesses sensitive areas of the file system.

  - **Identify recent installations:**
    Investigate software installation logs (Event ID 1033 in MSI Installer logs) to establish if GetScreen was legitimately installed. Note the installer path and timestamp; unexpected installations outside of normal procedures should raise flags.

  - **Analyze system communications:**
    Inspect network firewall logs to identify outbound connections to known GetScreen IP addresses or domains. Look for connections over unusual ports typically used by remote management software, such as TCP 443, which might indicate active skimming.

  - **Benchmark against legitimate activity:**
    Compare against known legitimate instances of GetScreen use, such as authorized IT maintenance logs or company policy documents. Ensure any detected changes align with pre-established organizational use cases for the software.

  ### Prioritization

  The alert severity is medium due to the potential impact on sensitive systems, as the RMM tool could enable extensive remote access for an attacker. The likelihood of malicious abuse is notable, as RMM tools are frequently weaponized in targeted attacks. However, there is a legitimate administrative use case requiring context for accurate assessment.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques such as code obfuscation or tampering with the registry keys to hide activity. Reliable detection relies on comprehensive logging for Windows registry changes, and any gaps may lead to undetected activity. Legitimate administrative operations may trigger the alert, particularly during legitimate remote support tasks. For improved detection, companion rules monitoring endpoint process creation related to remote access tools should also be considered to strengthen overall coverage.

