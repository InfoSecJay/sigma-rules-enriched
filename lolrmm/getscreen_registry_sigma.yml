note: |
  ### Technical Context

  This rule detects potential registry modifications associated with the GetScreen remote desktop management (RMM) tool, specifically targeting entries that suggest the installation or configuration of the service on Windows systems. Adversaries may utilize tools like GetScreen for command and control (C2) purposes to maintain remote access to compromised environments, often leveraging these tools to facilitate lateral movement or data exfiltration.

  The relevant MITRE ATT&CK technique is **Command and Control: Remote Access Tools (T1219)**, which encompasses the use of RMM applications to control target machines. The primary telemetry source is the Windows Registry Event logs, particularly focusing on registry key modifications in user-specific and system-wide locations. If exploited, this detection could allow an adversary persistent access and control over the affected system. However, this detection does NOT confirm malicious intent or activity by itself, as legitimate usage of GetScreen is not uncommon in environments that utilize remote management tools.

  ### Investigation Steps

  - **Check registry entries for GetScreen activity**: Review the Windows Registry for entries under `HKU\{SID}\Software\GetScreen` and `HKLM\System\CurrentControlSet\Services\GetscreenSV`. Benign installations often include vendor-specific keys or installation paths which can be used for verification.

  - **Validate Event IDs related to registry changes**: Look for Windows Security Event ID 4657 (Registry value modified) and identify corresponding User and Process IDs to determine the origin of the modification. High-confidence malicious indicators include unexpected modifications from non-administrative accounts.

  - **Analyze recent process activity**: Inspect Process Creation events (Security Event ID 4688 and Sysmon Event ID 1) that correlate with the GetScreen registry changes. Legitimate use typically reflects Windows processes like `GetScreen.exe` spawned by known administrative users with appropriate context.

  - **Review network traffic for remote access patterns**: Investigate outbound connections from the affected system using network logs (e.g., firewall logs, proxy logs) for patterns indicative of RMM tool usage, such as connections to known GetScreen domains or IP addresses.

  - **Assess user account activity**: Analyze user activity logs for unusual login times or failed logins targeting the affected systems. Legitimate admin account activity should be timestamped during regular operational hours.

  ### Prioritization

  The alert is of medium severity, primarily due to the potential impact on critical systems if GetScreen is leveraged by a malicious actor. The likelihood of malicious use is moderate, given that RMM tools are increasingly weaponized in cyberattacks as they facilitate persistent remote access. Awareness of such behavior is vital to maintaining security posture.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate use of GetScreen may trigger alerts, leading to false positives. Required log sources should be configured correctly to capture registry changes effectively. Legitimate activities that could trigger the alert include system administration tasks performed by IT personnel using GetScreen for maintenance. A related detection to strengthen coverage would include monitoring for C2 communications to known RMM services, enhancing the understanding of potential abuse cases.

