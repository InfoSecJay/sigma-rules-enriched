note: |
  ### Technical Context

  This rule detects file activity associated with the BreezeRMM remote monitoring and management (RMM) tool, which may be indicative of unauthorized use or a security incident. Attackers may leverage BreezeRMM to facilitate command and control, maintain persistence, or move laterally within a network. This behavior aligns with the MITRE ATT&CK tactic of "Command and Control" (TA0011), specifically technique "Exploitation of Remote Management Tools" (T1219).

  Primary telemetry sources include Windows file event logs that track file accesses, modifications, or creations in specified directories and files related to BreezeRMM. If malicious, this activity can lead to unauthorized access or data exposure. It is important to note that this detection does NOT confirm malicious intent or an active exploit on its own; legitimate administrators may also use BreezeRMM.

  ### Investigation Steps

  - **Review file modification timestamps:** Check the modification timestamps of detected files (e.g., `C:\ProgramData\Breeze\agent.env`, `C:\ProgramData\Breeze\logs\agent.log`) for recent changes. Legitimate activity may show regular updates according to a predefined schedule, while unusual timing could indicate malicious activity.

  - **Authenticate user activity:** Verify the user account responsible for the file access using Security Event ID 4663 (File Access Auditing). Suspicious activity often includes access from non-administrative accounts or accounts that are not employed for remote management tasks.

  - **Examine file content for anomalies:** Investigate the contents of `secrets.yaml` and `agent.env` for any credentials or configuration changes that are unexpected. Identifying unauthorized changes or sensitive information may indicate malicious use.

  - **Cross-reference with other logs:** Use Sysmon Event ID 11 to track process creation associated with the detected file activities. Look for unusual parent-child relationships that do not fit typical BreezeRMM usage patterns.

  - **Monitor network traffic:** Analyze outbound network connections generated by the detected process to identify communication with known command and control servers or suspicious IP addresses in DNS logs.

  - **Identify legitimate occurrences:** Review the organization's use of BreezeRMM, including authorized schedules or service agreements. Confirm usage policies to distinguish between expected management activities versus potential unauthorized exploitation.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive systems and the likelihood of malicious use if BreezeRMM is employed without authorization. While the tool itself is legitimate, its abuse by an attacker to gain unauthorized access makes this behavior noteworthy. The use of RMM tools in targeted attacks is becoming increasingly common, raising concerns over their exploitation.

  ### Blind Spots and Assumptions

  This detection may miss variants of the BreezeRMM tool or other similar remote management tools that do not match the specified filenames. Log sources must be properly configured to ensure comprehensive monitoring of file events; otherwise, legitimate use may trigger the alert without malicious intent. Activities such as scheduled maintenance or legitimate administrative actions using BreezeRMM could also lead to false positives. Related detections include monitoring for unusual process execution patterns in conjunction with Zoom log telemetry to further enforce detection of unauthorized RMM tool usage.

