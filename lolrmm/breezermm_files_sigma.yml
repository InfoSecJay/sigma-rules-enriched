note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the BreezeRMM remote monitoring and management (RMM) tool. The probable attacker objective is to exploit the BreezeRMM application for unauthorized access or control over targeted systems, facilitating post-exploitation actions such as file exfiltration or system manipulation. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001: Application Layer Protocol) and Data Exfiltration (T1041).

  The primary telemetry sources for this detection are Windows file event logs, specifically tracking file access for executable and script files associated with the BreezeRMM tool. If malicious, this activity could enable an adversary to maintain persistence or exfiltrate sensitive information. It is important to note that this detection alone does not confirm malicious intent; legitimate use of BreezeRMM for IT management can trigger the same alerts.

  ### Investigation Steps

  - **Check for specific file access events:** Review Windows Security Event ID 4663 logs for access to files such as `C:\Program Files\Breeze\breeze-agent.exe` and `C:\ProgramData\Breeze\secrets.yaml`. Look for access patterns indicating unauthorized manipulation, particularly from non-admin accounts.

  - **Identify legitimate BreezeRMM runs:** Validate expected processes by checking for normal execution times and user contexts that typically engage with BreezeRMM. For example, if the `breeze-agent.exe` process is initiated by a legitimate IT administrator during routine maintenance, this may indicate benign activity.

  - **Correlate with user activity:** Analyze user and system logs to determine if the file access correlates with known scheduling or maintenance tasks by authorized personnel, which could indicate legitimate operations using the RMM tool.

  - **Evaluate external access:** Investigate network traffic associated with the BreezeRMM tool; check for unusual external communication attempts within Firewall logs or Network Intrusion Detection Systems (NIDS), especially if outbound connections to unfamiliar IP addresses or domains occur.

  - **Identify high-confidence malicious indicators:** Look for timestamps and patterns in the access logs indicating multiple access attempts to sensitive files, particularly if observed outside of business hours or from unexpected locations.

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact on sensitive systems being managed by BreezeRMM. While the likelihood of malicious abuse exists, legitimate administrative use is common, necessitating careful investigation before escalation.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of BreezeRMM in the environment, which can trigger similar alerts. Additionally, if the logging of file events is not fully enabled on Windows, activity may go undetected. Legitimate administrative access to RMM assets can also result in similar file access patterns, complicating the investigation. A related detection to strengthen coverage would involve monitoring for unusual network connections initiated by BreezeRMM executables, helping to detect potential command and control activities.

