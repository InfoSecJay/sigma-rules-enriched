note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to destinations associated with the HelpU remote monitoring and management (RMM) tool, specifically those ending in 'helpu.co.kr'. The presence of such connections may indicate unauthorized remote access by an adversary aiming to control or exfiltrate data from compromised systems. Relevant MITRE ATT&CK tactics include Execution (T1203) and Remote Services (T1219).

  The primary telemetry sources are Windows network connection logs, detailing attempts to connect to specific domain names. If malicious, these activities could allow an adversary to manipulate a compromised system or siphon sensitive data. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate uses of HelpU may trigger similar alerts.

  ### Investigation Steps

  - **Check active network connections:**
    Review Windows Event ID 5156 (Windows Filtering Platform) for logged network connections to 'helpu.co.kr' or its subdomains. Evaluate the process name responsible for these connections.

  - **Identify process execution:**
    Correlate identified network connections with Security Event ID 4688 or Sysmon Event ID 1 to determine if the process was recently created. Look for unusual process names or command-line arguments.

  - **Examine asset context:**
    Determine the role of the affected host (e.g., server, endpoint) and its criticality to the organization. Regular users should not be connecting to HelpU-associated domains.

  - **Assess historical usage:**
    Review historical network connection data over the past 30 days for any recurring behavior. Frequent connections may indicate sustained activity or established backdoors.

  - **Look for known command and control (C2) indicators:**
    Cross-reference any IP addresses involved with threat intelligence sources to determine if they are known C2 endpoints associated with HelpU RMM or other malicious activity.

  - **Document legitimate usage patterns:**
    Identify legitimate use cases of HelpU within the organization and note the expected behavior. Users typically rely on specific access permissions and a known set of operational times.

  ### Prioritization

  This alert has a medium severity based on potential impact, as affected systems could be critical endpoints. The likelihood of malicious abuse is moderate, given that RMM tools can be frequently weaponized for unauthorized access. Monitoring such behavior is essential, especially in environments where HelpU use is not standardized.

  ### Blind Spots and Assumptions

  There are limitations in detecting this behavior, as legitimate users may also require HelpU usage for system administration. Reliable detection necessitates comprehensive logging of outbound network connections and deviations in expected user behavior. Additionally, similar outbound connections by legitimate applications could trigger false positives, particularly in managed services scenarios. Companion detections for other common RMM tools (e.g., AnyDesk, TeamViewer) could provide stronger contextual awareness and enhance overall coverage.

