note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to HelpU RMM tool domains (helpu.co.kr and its subdomains), commonly associated with remote management and administration tool activities. The likely attacker objective is to gain control over the target system or facilitate unauthorized access, which aligns with the MITRE ATT&CK technique Remote Administration Tools (T1219). The primary telemetry sources for this detection include Windows firewall and network connection logs that capture outbound connection attempts. If malicious, this behavior could lead to system compromise and unauthorized data access. However, this detection does NOT confirm active exploitation or successful control on its own.

  ### Investigation Steps

  - **Review outbound connections:** Check Windows Security Logs (Event ID 5156) to identify blocked or allowed connections to the HelpU domain. Look for Source Address and Destination Address fields to confirm unauthorized access attempts.

  - **Correlate with user activity:** Analyze user logs to determine whether legitimate administrative actions occurred around the time of the detection. Look for patterns in Event ID 4624 (Logon) and Account Name to differentiate between authorized and suspicious activity.

  - **Evaluate process execution:** Examine Process Create events (Sysmon Event ID 1) within the timeframe of the network activity. Investigate any unusual command line arguments that may indicate malicious use of the HelpU tool.

  - **Investigate high-confidence indicators:** Identify any recent installations or updates of the HelpU RMM tool on endpoints via file system checking (e.g., looking for specific paths associated with the tool).

  - **Document legitimate tool usage:** Confirm with asset inventory if the HelpU RMM tool is approved and regularly used for administrative purposes. Check for routine connection patterns to help differentiate benign behavior.

  ### Prioritization

  This alert should be treated as medium severity due to its potential impact on systems accessible via remote management tools. The risk lies in the high likelihood of adversarial use of such tools for exploitation. Although HelpU may be used legitimately within the organization, its malicious use is consistently tracked within various attack vectors.

  ### Blind Spots and Assumptions

  This detection may miss traffic if outbound connections are encrypted or if the HelpU tool is used in a stealthy manner. It requires that the appropriate network logs are enabled and that DNS queries for the domains are functioning as expected. Legitimate administrative activity, such as routine remote management sessions, may trigger this alert, necessitating context-specific analysis. A relevant companion detection includes monitoring for unauthorized software installations (e.g., Application whitelisting logs) to strengthen oversight.

