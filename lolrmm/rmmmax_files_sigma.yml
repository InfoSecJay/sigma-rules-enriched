note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the RMMmax remote management and monitoring (RMM) tool across various operating systems. The main goal of an attacker utilizing RMMmax would likely be to gain persistent access to systems or manage them for malicious activities, such as unauthorized monitoring or data exfiltration. The relevant MITRE ATT&CK tactic is **Command and Control (TA0011)** and the technique is **Application Layer Protocol (T1219)**.

  Primary telemetry sources include Windows file event logs and Unix/Linux file system logs that track access to specific executables and configuration files used by RMMmax. The security impact of malicious use may include unauthorized remote access, system compromise, and potential lateral movement within the network. This detection does NOT confirm that malicious activity is occurring; legitimate usage of the RMMmax tool may trigger this alert.

  ### Investigation Steps

  - **Check recent file access events:** Review file access logs for `%ProgramData%\rmmmax\AgentService\activity.log` (Windows) or `/var/rmmmax/agentservice/activity.log` (Linux). Look for unusual access patterns or modifications outside of regular operational times.

  - **Validate the presence of RMMmax executables:** Confirm creation or access of `RMMmaxAgentService.exe` or similar files listed in the detection. Authentic installations should have defined timestamps that match deployment schedules, while unexpected timestamps may indicate malicious installation.

  - **Review active services:** For Windows systems, check the state of services using `Get-Service` PowerShell cmdlet for any `rmmmax-agent` services. For Linux, check active services with `systemctl status rmmmax-agent`. Both should correspond to expected configurations.

  - **Analyze network traffic:** Monitor outbound connections from hosts running RMMmax for unusual traffic patterns or connections to known malicious IPs/domains. Use flow logs or packet captures.

  - **Investigate logs for context:** In cases where `activity.log` shows actions like disabling security tools or creating unauthorized user accounts, classify these as high-confidence malicious indicators.

  - **Compare with known legitimate use:** Verify whether RMMmax activity logs align with known procedures or scheduled maintenance activities by IT. Documenting normal operational behavior helps identify anomalies quickly.

  ### Prioritization

  This alert is of medium severity, given that while RMMmax can be utilized for legitimate purposes, its detection on a high-value asset could indicate potential exploitation or misuse. The risk of malicious abuse is notable, especially if the system is critical for operational continuity and integrity.

  ### Blind Spots and Assumptions

  This detection may be limited if proper logging is not configured or if RMMmax is installed in non-standard directories. Legitimate administrative access or scheduled maintenance activity may trigger the alert. A related detection to consider is monitoring for unauthorized script executions (`ps1` file activity) that could indicate misuse of PowerShell for malicious purposes, strengthening overall coverage.

