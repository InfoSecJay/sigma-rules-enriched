note: |
  ### Technical Context

  This Sigma rule detects the execution of processes related to the UniSystem RMM remote management tool (RMM), specifically where the parent process is identified as `UniRMM.exe`. The likely attacker objective is remote management or control of compromised systems without proper authorization, which could lead to significant security incidents such as data exfiltration or lateral movement. This activity aligns with the MITRE ATT&CK tactic of "Command and Control" and the technique "Remote Management Tools" (T1219).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which provide data on process creations and their hierarchies. If malicious, this activity can indicate unauthorized access to critical systems potentially leading to a breach. However, this detection does NOT confirm that malicious activity is occurring on its own, as the tool may be used legitimately within the organization.

  ### Investigation Steps

  - **Review process creation logs**: Examine Security Event ID 4688 or Sysmon Event ID 1 logs for entries where the `ParentImage` ends with `\UniRMM.exe`. Identify the user account and time of execution for any unauthorized access patterns.

  - **Identify parent process context**: Ensure that the existence of `UniRMM.exe` as a parent is not from legitimate administrative activities. If it appears under non-administrative user accounts, escalate for further investigation.

  - **Correlate with Windows Defender logs**: Check Windows Defender or any endpoint detection solution logs for alerts related to `UniRMM.exe` to confirm its legitimacy based on recent detections or active threats.

  - **Verify legitimate usage**: Obtain a list of approved tools and processes used by IT staff for RMM purposes. Cross-check detected instances of `UniRMM.exe` against this list to determine if the activity is expected.

  - **Search for indicators of compromise**: Look for unusual outbound connections or network behavior corresponding with the time `UniRMM.exe` was active, such as unusual traffic patterns to external IPs that are not part of regular business operations.

  - **Assess system criticality**: Identify the role of the affected system (e.g., a domain controller, file server) to evaluate the potential impact of any unauthorized use of the remote management tool.

  ### Prioritization

  This alert has a medium severity status as it involves potential remote management activities which could lead to advanced threats if exploited. The impact is contingent on the criticality of the system involved, with a notable risk for systems typically targeted by adversaries. While the tool can be weaponized, it’s also necessary to differentiate between legitimate administrative use and malicious exploitation.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate administrative activity may trigger alerts for `UniRMM.exe`, leading to potential false positives. Moreover, without comprehensive logging configurations, detection may miss key context to validate the activity. The presence of `UniRMM.exe` may also be part of a broader remote management strategy that can evade detection if obscured by legitimate traffic. An important companion detection to consider is monitoring for unrecognized outbound connections which typically accompany unauthorized remote tool usage.

