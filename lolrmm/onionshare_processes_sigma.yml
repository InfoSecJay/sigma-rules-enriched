note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Onionshare Remote Monitoring and Management (RMM) tool, which can be used by attackers to establish remote access and control over compromised systems. The likely objective of an adversary using this tool is to maintain persistence and reach a foothold within the environment, enabling unauthorized access to sensitive data or systems. This activity falls under the MITRE ATT&CK tactic "Command and Control" (T1071) and the technique "Application Layer Protocol" (T1219).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on the creation of any processes where the image path ends with 'onionshare*.exe'. If malicious, such activities could imply an attacker is leveraging an RMM tool to control or surveil the environment. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate instances of Onionshare may exist.

  ### Investigation Steps

  - **Check process creation logs: ** Review Windows Security Event ID 4688 for any creation of processes ending in 'onionshare*.exe'. Record the user account associated with the process start for context.

  - **Evaluate parent process integrity: ** Identify the parent process of any detected Onionshare activity. Look for legitimate parent process IDs, noting that a suspicious parent process may indicate malicious activity.

  - **Examine network activity: ** Analyze firewall logs for outbound connections from the Onionshare processes. Look specifically for any connections to unusual IP addresses or ranges, particularly those known for command-and-control (C2) behaviors.

  - **Identify expected usage: ** Understand and document legitimate use cases for Onionshare within your organization. This context is crucial for differentiating between benign and malicious activity.

  - **Recover and assess file artifacts: ** Look for file artifacts related to the Onionshare application in the execution context. Typical locations might include 'C:\Program Files\Onionshare' or user appdata folders; legitimate use should create identifiable directories and logs.

  - **Check for prior alerts: ** Look for related alerts or detections tied to processes communicating over HTTP or similar protocols which may reveal an ongoing active command-and-control session.

  ### Prioritization

  This alert should be treated as medium severity due to the potential risk associated with systems running remote access tools, especially in environments where such activities are not expected. The likelihood of malicious abuse is moderate, as tools like Onionshare can often be weaponized. Additionally, this type of behavior is increasingly common in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of advanced adversaries utilizing process name obfuscation or renaming to evade detection. Reliable detection relies on the proper logging of process creation events and maintaining comprehensive monitoring of network behavior. Legitimate activities that may trigger this alert include authorized use of Onionshare for business purposes. A companion detection that enhances coverage is monitoring for any outbound traffic resembling command-and-control patterns, such as irregular access to external network services.

