note: |
  ### Technical Context

  This rule detects the execution of processes associated with the SimpleHelp Remote Management and Monitoring (RMM) tool, specifically targeting instances where these processes are spawned by related parent processes. The likely attacker objective is to establish remote access to the compromised system for further exploitation or lateral movement within the network. This detection primarily relates to the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process initiation details. If malicious, this activity can enable unauthorized remote access, data exfiltration, or persistent footholds on the target system. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate use of the SimpleHelp tool is common in IT support scenarios.

  ### Investigation Steps

  - **Identify the spawning parent process**: Check for Security Event ID 4688 or Sysmon Event ID 1 logs where `ParentImage` ends with one of the following: `\\simplehelpcustomer.exe`, `\\simpleservice.exe`, `\\simplegatewayservice.exe`, `\\remote access.exe`, `\\windowslauncher.exe`, or `\\spsrv.exe`. Look for chains of processes that indicate unusual parent-child relationships that are not part of regular operations.

  - **Verify the legitimacy of the SimpleHelp installation**: Confirm that SimpleHelp is a known and authorized software solution in your organization. Check management records or software inventories to ascertain if the versions seen in logs are expected (i.e., installed and configured).

  - **Look for unexpected execution context**: Investigate the user account associated with the process creation events and note if they deviate from expected norms (e.g., a low-privileged account executing remote access tools). Review logs in the Security event log for Event ID 4624 (Logon) alongside Event ID 4688 to cross-reference account privileges.

  - **Check for network connections**: Examine network activity tied to the identified SimpleHelp processes, focusing on Traffic Logs or Firewall Logs for unusual outbound connections, especially to public IPs or unknown domains that could indicate data exfiltration.

  - **Assess for remediation actions**: Document any corrective actions taken in response to identified suspicious activities. This includes process termination, network isolation, or further forensic investigation on the involved endpoints.

  ### Prioritization

  This alert is of medium severity, as it may indicate unauthorized remote access, which can lead to data compromise or further infiltration by an attacker. While legitimate use of SimpleHelp exists, its capabilities are often abused in malicious scenarios; hence it warrants attentive analysis by SOC analysts.

  ### Blind Spots and Assumptions

  Detection may be limited due to potential legitimate SimpleHelp usage in IT environments, thus increasing the likelihood of false positives. Analysts should confirm that appropriate logging configurations for process creation events are enabled, particularly Sysmon and Windows security logging. Legitimate remote management tasks may trigger this alert, particularly during scheduled maintenance windows. Companion detections, such as suspicious network connections made by identified processes, can enhance overall visibility and context around this activity.

