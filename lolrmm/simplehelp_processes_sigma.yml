note: |
  ### Technical Context

  This rule detects process activity from the SimpleHelp Remote Monitoring and Management (RMM) tool, specifically when processes are spawned by its executable files. The behavior is indicative of remote access capabilities often exploited by attackers to maintain persistence, exfiltrate data, or execute commands remotely. The relevant MITRE ATT&CK techniques include Remote Access Tools (T1219), which encompasses the use of legitimate software for unauthorized purposes.

  Primary telemetry sources include Windows Process Creation logs such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, the exploitation of this tool could allow an adversary to control systems covertly and execute further attacks. This detection, however, does NOT confirm malicious intent on its own since SimpleHelp can be used legitimately for remote management.

  ### Investigation Steps

  - **Review Process Creation Events:** Examine Security Event ID 4688 or Sysmon Event ID 1 for process creation details. Look for parent processes (e.g., `simplehelpcustomer.exe`, `simpleservice.exe`) and created processes of similar names. Legitimate use typically features expected timestamps and user accounts correlated to IT staff.

  - **Identify Parent Processes:** Validate the parent-child relationship of processes created under the SimpleHelp executables. Unusual parent processes (e.g., `cmd.exe` or `powershell.exe`), can indicate malicious usage.

  - **Cross-verify User Accounts:** Check if the user accounts triggering these processes are associated with legitimate administrative activities. Use logon events (Security Event ID 4624) to confirm account legitimacy.

  - **Analyze System Context:** Consider the asset's criticality; systems that are part of sensitive infrastructure should be prioritized. Review if these processes operate on endpoints known for restricted access or have been altered recently.

  - **Inspect Network Connections:** Check for outbound network connections associated with SimpleHelp processes. Validate if they’re communicating with known benign IP addresses or domains. Malicious usage may result in unexpected remote connections.

  ### Prioritization

  The severity of this alert is medium due to the potential for SimpleHelp to be abused for unauthorized remote access. Its presence on enterprise systems can lead to high-impact incidents, particularly if utilized by threat actors to establish persistent access. SimpleHelp is a legitimate tool but is commonly weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection may miss malicious activity if adversaries rename executables or manipulate logging configurations. Reliable detection requires Windows Process Creation logs to be enabled and monitored closely. Legitimate internal support or remote assistance activities may trigger alerts, necessitating further investigation to validate intent. Companion detections could include mouse and keyboard input logs to recognize anomalous user interactions associated with the SimpleHelp processes.

