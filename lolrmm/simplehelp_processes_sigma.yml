note: |
  ### Technical Context

  The Sigma rule detects the execution of processes associated with the SimpleHelp Remote Management and Monitoring (RMM) tool. This tool is often used for remote access, support, and management of systems, and its presence on a system can indicate a legitimate administrative action or a potential security risk if misused. The likely attacker objective could be unauthorized access to systems or data exfiltration, often aligning with the MITRE ATT&CK tactic of "Command and Control" (TA0011) and technique "Remote Access Tools" (T1219).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If this activity is malicious, it can allow attackers to maintain persistence and control over compromised machines. This detection does NOT confirm malicious intent on its own; the usage of SimpleHelp could also indicate legitimate administrative functions.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for events where the Process Name ends with `simplehelpcustomer.exe`, `simpleservice.exe`, `simplegatewayservice.exe`, etc. Assess the User and Parent Process to understand the context of execution.

  - **Analyze the parent process:** Investigate the ParentImage field from the logs. An unexpected ParentImage, particularly from non-administrative or unknown executables, may indicate malicious use of SimpleHelp.

  - **Check for established Remote Sessions:** Look for additional connections via RDP or other remote tools in network logs or traffic captures (specifically TCP connections on port 6502, the default for SimpleHelp). This can confirm unauthorized remote access.

  - **Identify legitimate usage patterns:** Validate against known asset baselines. If SimpleHelp is expected in your environment for legitimate administrative tasks, ensure it is being executed by authorized personnel during expected hours.

  - **Capture evidence of data exfiltration:** Look for file operations during or after SimpleHelp execution that indicate possible data transfer actions, such as unusual file creations or modifications (Windows Event IDs 4663, 5145) when accessing shared resources.

  ### Prioritization

  This alert is medium severity due to its potential impact on sensitive systems. While SimpleHelp is legitimate in certain environments, its use can frequently resemble malicious activity, making it important to assess the context. It is a tool often weaponized for unauthorized access, so rapid investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of SimpleHelp, which can lead to false positives if not corroborated by additional context. Log sources for reliable detection include ensuring Sysmon is deployed and configured for process creation logging. This rule may also trigger on similar remote access tools like AnyDesk or TeamViewer, making it beneficial to include related detections for broader coverage.

