note: |
  ### Technical Context

  This rule detects potential network activity associated with the Pandora RC (eHorus) Remote Monitoring and Management (RMM) tool by monitoring for connections to its portal domains. The likely attacker objective is to establish command and control, allowing them to remotely manage, monitor, or potentially compromise a system or network. This behavior aligns with the MITRE ATT&CK framework, specifically under the tactic of Command and Control (T1071.001) for application-layer protocol.

  The primary telemetry sources include Windows network connection logs capturing DestinationHostname fields relevant to eHorus domains. If malicious, this activity could lead to unauthorized access and control over networked systems. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of Pandora RC (eHorus) may also generate similar network activity.

  ### Investigation Steps

  - **Verify the Destination Hostname:** Check network connection logs for Event ID 5156 (Windows Filtering Platform) to identify any traffic directed towards ‘*.portal.ehorus.com’. Ensure the connection originates from known assets within the environment.

  - **Assess User Context:** Identify the user associated with the event using Event ID 4624 (Logon). This helps determine if the connection is made by a legitimate administrative account or a potentially compromised user account.

  - **Check for Pending Certificates:** Analyze for unauthorized certificates via Certificate Services logs (Event ID 82 or 86) that could tie to the eHorus portal, as attackers may employ certificates to evade detection.

  - **Analyze Concurrent Network Activity:** Review for unusual concurrent outbound connections related to other known RMM tools or anomalous data transfers, especially from critical assets, using network flow logs or IDS alerts.

  - **Inspect Application Installation:** Validate that the Pandora RC (eHorus) client is installed by reviewing applications via Event IDs 1033 and 1034 (Windows Installer) to differentiate between legitimate and potentially malicious installations.

  - **Document Baseline Network Behavior:** Note the expected normal behavior for remote management activities in your organization to contrast suspicious activity against established patterns.

  ### Prioritization

  The alert should be classified as medium severity due to the potential impact of a compromised system, given that RMM tools can allow full access to internal systems. The likelihood of malicious abuse is concerning, as RMM tools are often weaponized by adversaries for lateral movement. Monitoring for this specific behavior is crucial due to its association with both legitimate administrative tasks and unauthorized access.

  ### Blind Spots and Assumptions

  This detection could be evaded through the use of encryption or tunneling protocols, obscuring the connection to the eHorus domains. Ensure comprehensive logging for Windows Filtering Platform and application-related events to mitigate gaps in visibility. Legitimate administrative workgroups may trigger this alert during routine RMM activities. Companion detections, such as monitoring for process creation (Event ID 4688) of known RMM executables, can enhance detection fidelity.

