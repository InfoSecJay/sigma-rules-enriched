note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the use of the Pandora RC (eHorus) Remote Monitoring and Management (RMM) tool by monitoring connections to the domain 'portal.ehorus.com'. The behavior likely indicates unauthorized remote access to IT assets by an adversary seeking to maintain persistent control over compromised systems. This activity aligns with the MITRE ATT&CK technique for Remote Access Tools (RAT) identified as T1219.

  The primary telemetry source for this detection is network connection logs that capture outbound connections from Windows hosts. If malicious, this behavior could facilitate data exfiltration or further compromise within the enterprise environment. It is crucial to note that this detection only indicates potential use of the eHorus RMM tool and does not confirm that malicious activity is occurring without additional context or corroborating evidence.

  ### Investigation Steps

  - **Check for active network connections**: Inspect Windows event logs (Security Event ID 5156) for processes establishing outbound connections to 'portal.ehorus.com'. Look for connections originating from unusual processes or user accounts.

  - **Review process creation events**: Analyze Sysmon Event ID 1 for process creation logs, particularly focusing on processes that initiate connections to eHorus. Confirm whether the parent processes are legitimate (e.g., expected system management tasks) or exhibit signs of unusual behavior.

  - **Validate the legitimacy of the eHorus tool**: If the organization utilizes Pandora RC (eHorus) for legitimate purposes, confirm that the use aligns with approved IT asset management practices and that proper controls are in place.

  - **Assess for signs of lateral movement**: Use Windows Event ID 4624 (Logon) to identify any unusual logon patterns or accounts accessing the eHorus RMM tool, especially if accounts typically remain dormant or do not have administrative rights.

  - **Correlate additional telemetry**: Check for related network logs indicating connections to other known malicious command and control (C2) infrastructures. Use firewall logs to see if multi-hop connections or traffic patterns indicate further compromise.

  ### Prioritization

  This alert carries a medium severity due to the frequent malicious use of unauthorized RMM tools for compromise and persistence. Given that RMM tools can facilitate extensive access to an organization's systems, any identified activity should be treated with urgency.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of the Pandora RC (eHorus) tool within the organization, which could lead to false positives. Ensure proper logging levels are enforced to capture outbound traffic and keep an eye on organizations that might have been compromised while using this tool legally. Additional detection rules focusing on abnormal user account behaviors or associated C2 infrastructure can strengthen the overall visibility and context surrounding these alerts.

