note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the Pandora Remote Control (RC) or eHorus Remote Management Tool (RMM). The tool is commonly used for legitimate remote administration purposes, but it can be exploited by attackers to maintain persistent access to compromised systems. By monitoring for outbound connections to known eHorus domains, such as `portal.ehorus.com`, we can catch unusual or unauthorized use that may indicate malicious intent.

  In a typical attack scenario, an adversary might deploy the Pandora RC tool post-exploitation to establish control over a compromised machine, allowing for remote access, data exfiltration, or lateral movement within the enterprise network. The primary MITRE ATT&CK tactics involved are **Execution** (TA0002) and the technique **External Remote Services** (T1219), which refers to the exploitation of legitimate remote access tools for accessing and controlling devices remotely.

  The best sources of evidence for this detection come from **network connection logs** generated by Windows devices, which capture outbound network traffic, including destination hostnames and connection attempts.

  ### Investigation Steps
  - **Review Network Connections**: Check outbound network connection logs for any attempts to connect to `portal.ehorus.com`. Look for unusual or unexpected source IP addresses or times that deviate from regular usage patterns.

  - **Identify Responsible Hosts**: Correlate the detected connections with process creation logs on the originating hosts. This may provide insight into what user or application initiated the connection to the eHorus domain.

  - **Examine User Activity**: Investigate the context of the detected activity by reviewing user account activity logs. Look for accounts that may not typically use RMM tools or that exhibit behavioral anomalies around the same time as the detected connections.

  - **Check for Related Alerts**: Look for other security alerts or incidents that occurred around the same timeframe. This can help determine if the connection to the eHorus domain is part of a larger incident involving potential compromise.

  ### Prioritization
  This alert is categorized with medium severity due to the potential for eHorus to be used for unauthorized remote access and control, which poses significant risk to enterprise assets. While legitimate use is possible, any unexpected activity warrants prompt investigation to mitigate potential threats.

  ### Blind Spots and Assumptions
  The detection logic is reliant on the identification of specific outbound connections to the eHorus domain, which may not capture all potential scenarios of misuse if the tool is utilized in a more covert manner or with different command and control domains. There may be gaps in logs if network devices or endpoint logs that support eHorus activity monitoring are not properly configured or enabled. Assumptions include that the monitoring is comprehensive and covers all relevant network traffic, including proxies, which are critical for inspecting outbound connections.

