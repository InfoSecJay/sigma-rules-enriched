note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the domain `portal.ehorus.com`, which is associated with the Pandora RC (eHorus) remote management tool. Attackers may leverage this tool to gain unauthorized remote access to systems, allowing them to execute commands or exfiltrate data. The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Resource Development (T1219).

  The primary telemetry source is Windows network connection logs, specifically tracking Domain Name System (DNS) queries and outbound connections. If malicious, such activity could indicate a compromise, facilitating further exploitation or lateral movement within the network. It is essential to note that this detection alone does NOT confirm malicious intent, as legitimate users may also utilize the tool for remote management purposes.

  ### Investigation Steps

  - **Check outbound connections:** Review network traffic logs for Event ID 5156 (Windows Filtering Platform) to identify connections to `portal.ehorus.com`. Confirm if the connections are initiated from known asset roles (e.g., admin stations or management servers).

  - **Identify process associations:** Investigate corresponding Security Event ID 4688 logs to pinpoint which processes are initiating connections to the eHorus domain. Look for evidence of unusual or unexpected processes, such as scripts or executables that should not be running.

  - **Evaluate DNS queries:** Examine DNS query logs for requests to `portal.ehorus.com` to identify if multiple requests are made from various internal hosts. Increased volume from business-critical systems might indicate potential misuse.

  - **Review legitimate usage:** Confirm configurations for legitimate use of Pandora RC (eHorus) within the organization. Consult change management records or documentation to determine if such connectivity is authorized.

  - **Correlate with user activity:** Check logs for user account activity (Event IDs 4624 and 4634) around the time of the connection. Look for unusual logon patterns, such as logins from atypical geographical locations or outside normal working hours.

  ### Prioritization

  This alert is of medium severity due to the potential for significant access and control over systems by an adversary. While the likelihood of malicious abuse exists, routine administrative tasks using eHorus may lead to false positives. The rule detects behavior that can be weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by environments not logging all outbound network connections or by configurations that do not capture related process execution events. Legitimate activities that could trigger this alert include authorized administrative use of the Pandora RC tool. A companion detection might involve monitoring for other remote management tool signatures or activities to expand visibility into related threats.

