note: |
  ### Technical Context

  This rule detects potential process activity related to the ScreenMeet Remote Management and Monitoring (RMM) tool, which may indicate unauthorized remote control or management of a system. The likely attacker objective is to maintain persistence or establish a command-and-control channel while having the ability to manipulate system configurations, access sensitive data, or perform other malicious activities. This detection maps to the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Non-Application Layer Protocol" (T1219).

  Primary telemetry sources include process creation logs from Windows, specifically Security Event ID 4688 or Sysmon Event ID 1. If the use of ScreenMeet is malicious, it could lead to unauthorized access and data exfiltration, compromising the confidentiality and integrity of the organization's assets. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate uses of ScreenMeet for support may also trigger this alert.

  ### Investigation Steps

  - **Check process creation logs for ScreenMeet activity:** Review Security Event ID 4688 or Sysmon Event ID 1 for process creation paths ending in `ScreenMeetSupport.exe` or `ScreenMeet.Support.exe`. Analyze the parent process to determine if it was initiated by a legitimate application (e.g., Windows Explorer) or an unexpected source.

  - **Assess the user account associated with the activity:** Examine the account (UserName field) that initiated the ScreenMeet process. Look for any anomalies, such as the use of administrative accounts or unusual login times not typical for support personnel.

  - **Verify the legitimacy of the ScreenMeet tool usage:** Investigate if the execution of ScreenMeet aligns with known support schedules or prior incident reports. Cross-reference with any IT support tickets indicating planned use of ScreenMeet.

  - **Identify high-confidence malicious indicators:** Look for launching patterns where processes are created in rapid succession or accompanied by other suspicious executables. Cross-check with known indicators of compromise associated with RMM tool misuse, such as unexpected outbound connections to external IPs.

  - **Evaluate network activity post-setup:** Check for any unusual outbound connections that may occur following the process creation. Analyze firewall or proxy logs for any connections to unknown or suspicious IP addresses, especially outside of regular working hours.

  ### Prioritization

  This alert carries medium severity due to the potential for significant impact if a legitimate remote management tool is exploited by an attacker. The likelihood of abuse is moderate, given that RMM tools like ScreenMeet are often used by malicious actors to gain unauthorized access. While such tools can be misused, the presence of this activity does not equate to confirmation of a security incident.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through obfuscation or renaming of the executable files related to ScreenMeet. This rule relies on proper logging configurations being enabled on endpoints. Legitimate support sessions initiated by IT personnel can trigger this alert, making context crucial for accurate assessments. A related detection that strengthens coverage would be monitoring for other known RMM tool processes, enhancing the overall visibility of remote administration activities within the environment.

