note: |
  ### Technical Context
  This detection rule identifies the execution of processes related to the ScreenMeet Remote Monitoring and Management (RMM) tool by monitoring process creation events on Windows systems. Specifically, it looks for parent and child processes that end with "ScreenMeetSupport.exe" as well as variations in the naming, indicating potential unauthorized access or malicious activity leveraging the tool.

  In a threat scenario, an adversary may use ScreenMeet RMM to gain remote control over an organization's systems, living off the land with legitimate tools to avoid detection. The likely objectives of such attackers include data exfiltration, lateral movement within the network, or establishing persistence on compromised systems. Given the tool's remote management capabilities, it poses a considerable risk if misused within the environment.

  This rule applies to the MITRE ATT&CK framework, specifically the Execution tactic (T1203) and the technique "RMM Tool" (T1219). The essential telemetry for this detection comes from process creation events, which can provide insights into unauthorized application usage or anomalous behavior.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for instances of "ScreenMeetSupport.exe" in process creation logs. Pay attention to the parent-child process relationships to identify any abnormal execution patterns.
  - **Analyze User Context:** Investigate the user accounts executing the ScreenMeet process to ascertain whether they have legitimate access to use this tool and if their activity aligns with normal behavior.
  - **Examine Network Activity:** Monitor outbound connections associated with the ScreenMeet process to identify any communications to external IPs that may indicate data exfiltration or command-and-control activity.
  - **Inspect System Changes:** Look for changes made to system files or configurations that coincide with the execution of the ScreenMeet tool, which could suggest further malicious activity or lateral movement attempts.

  ### Prioritization
  Given the potential for significant operational disruption and data loss associated with unauthorized use of remote management tools, this alert is considered a medium-level threat. The high likelihood of exploitation by malicious actors further underscores the need for prompt investigation and response.

  ### Blind Spots and Assumptions
  This detection rule may miss legitimate use of the ScreenMeet RMM tool by authorized personnel, leading to potential false positives. The effectiveness of the rule is predicated on having comprehensive logs of process creation events and accurate configurations to capture parent-child relationships. Environments where process logging is not adequately enabled may lack the necessary telemetry for detection, resulting in blind spots in monitoring for unauthorized use of the tool.

