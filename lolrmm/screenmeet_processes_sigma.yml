note: |
  ### Technical Context

  The detection rule identifies processes created by the ScreenMeet Remote Management and Monitoring (RMM) tool. This tool is often used by support teams for unattended access and remote system management. An attacker could leverage ScreenMeet for unauthorized access to systems to facilitate data exfiltration or lateral movement while impersonating legitimate support staff.

  This behavior aligns with the MITRE ATT&CK technique for Remote Access Software (T1219). The primary telemetry source for this detection is the Windows process creation logs, specifically focusing on the creation of executable files related to ScreenMeet. If unauthorized, this activity could allow an attacker to take control of a target system, posing a significant security risk. This detection does NOT confirm malicious activity without additional context, as legitimate use of ScreenMeet by authorized personnel is possible.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 for process creation events involving `ScreenMeetSupport.exe` or `ScreenMeet.Support.exe`. Check the `NewProcessName` field for exact matches to these executable names.

  - **Identify parent process:** Confirm the presence of the parent process in Event ID 4688. The `ParentImage` field must indicate that the parent process is also `ScreenMeetSupport.exe` or `ScreenMeet.Support.exe`. A legitimate usage path will typically originate from a trusted support application rather than an unexpected process.

  - **Check execution context:** Verify the `UserName` field in the process creation logs. Look for accounts that have a history of legitimate support activity. Unknown or unexpected accounts executing this RMM tool should raise suspicion.

  - **Investigate associated network activity:** Monitor for any suspicious outbound connections initiated by `ScreenMeetSupport.exe` by analyzing network logs (e.g., firewall logs). Look for connections to unusual IP addresses or domains, indicating potential command and control activity.

  - **Examine other logs for context:** Cross-reference with Sysmon Event ID 1 logs for detailed process creation history. Investigate any unusual child processes spawned from the ScreenMeet executables to identify potential suspicious activities.

  - **Document legitimate activities:** Recognize that legitimate support teams may run ScreenMeet for remote assistance. Be prepared to document and verify expected usage patterns during investigations to differentiate between malicious and approved uses.

  ### Prioritization

  This alert holds medium severity due to the potential for significant impact from unauthorized remote access to enterprise systems. The likelihood of malicious abuse is moderate, particularly in environments where RMM tools may be exploited by adversaries. Since this behavior can be weaponized, prompt investigation is crucial.

  ### Blind Spots and Assumptions

  Detection may be bypassed if ScreenMeet is executed from a different directory or renamed by an attacker. Reliable detection requires comprehensive logging configurations across all endpoints using RMM tools. Legitimate internal support activities may trigger this alert, so thorough verification of the context is necessary. A complementary detection could involve monitoring for related remote access tools or known malicious usage patterns, such as abnormal behavior following legitimate RMM tool usage.

