note: |
  ### Technical Context

  This detection targets network activity associated with Manage Engine's Desktop Central, a remote monitoring and management (RMM) tool. The behavior detected involves establishing outbound connections to specified hosts associated with Desktop Central, which attackers might leverage to gain remote access or control of compromised systems. The relevant MITRE ATT&CK technique is **Remote Services (T1219)**.

  The primary telemetry sources are Windows network connection logs, specifically monitoring for connections to domains related to Manage Engine. If malicious, unauthorized use of this tool could enable adversaries to manipulate systems without user consent. This detection does NOT confirm malicious intent solely by its presence; legitimate usage of Desktop Central for IT management could also trigger alerts.

  ### Investigation Steps

  - **Check outbound connections:** Review Windows network connection logs (Event ID 5156) for connections to `desktopcentral.manageengine.com`, `*.dms.zoho.com`, etc. Document the process IDs (PIDs) and applications making these connections.
  - **Identify legitimate usage:** Determine if the alerts correlate with known asset management processes. Confirm if Desktop Central is supposed to be used within the environment and if it has a valid source IP or application in use.
  - **Review process creation details:** Examine Security Event ID 4688 for process creation events tied to the processes connecting to the Desktop Central hosts. Confirm process legitimacy (e.g., actual ManageEngine processes vs. impersonating processes).
  - **Evaluate user context:** Correlate the connections with user accounts. Check if the initiating identities align with IT personnel authorized to use RMM tools and flag any suspicious accounts.
  - **Analyze frequency of occurrences:** Look for patterns or unusual spikes in connections to Manage Engine domains over short periods, which may indicate automated or malicious attempts to compromise systems.
  - **Trace additional artifacts:** If malicious use is suspected, collect evidence of further lateral movement or command escalation through related processes (e.g., PowerShell commands or scripts that exploit Desktop Central features).

  ### Prioritization

  This alert has medium severity due to the potential impact of compromised systems using the Desktop Central tool for unauthorized access. While legitimate abuse may occur, the frequency and context of such connections should be closely monitored to evaluate the likelihood of malicious exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of Desktop Central, leading to false positives. Ensure that logging is enabled for all relevant network connections and process creations to maintain comprehensive coverage. This alert could also be triggered by other RMM tools similarly utilizing these domains. A related detection to consider is monitoring for unusual administrative logins to systems managed by RMM tools, which would provide additional context to this rule's findings.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
