note: |
  ### Technical Context

  This Sigma rule detects process activity associated with Mikogo, a remote management tool often used for remote access or support, which can be exploited by threat actors for unauthorized remote control of systems. An adversary could use Mikogo to control targets undetected, facilitating lateral movement, data exfiltration, or persistence. This detection aligns with the MITRE ATT&CK technique for Remote Access Tools (T1219).

  The primary telemetry sources are Windows process creation logs (Security Event ID 4688) and Sysmon Event ID 1, both crucial for monitoring process execution in real time. If malicious, the security impact may include unauthorized access to sensitive systems, leading to data breaches or direct compromises. This detection does NOT confirm malicious activity but indicates potential misuse of the Mikogo tool that requires further investigation.

  ### Investigation Steps

  - **Review process creation events:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1, detailing process startups involving Mikogo executables. Look for unusual parent processes that suggest malicious activity.

  - **Identify parent process information:** Analyze the ParentImage field of detected events to determine if the Mikogo process was launched by a legitimate application (e.g., legitimate services or user-initiated applications) versus potentially malicious ones.

  - **Correlate with user activity:** Check user login events (Windows Security Event ID 4624) and other user behavior logs to validate whether the usage corresponds with known legitimate users or scheduled activities.

  - **Analyze unexpected network connections:** Cross-reference with network logs (e.g., firewall logs or NetFlow data) for outgoing connections initiated by the Mikogo processes. Pay attention to connections to unusual external IPs or domains.

  - **Examine scheduled tasks and services:** Check for evidence of automated executions or persistence mechanisms related to Mikogo by querying Windows Task Scheduler and Services for any tasks or services associated with it.

  - **Review the asset classification of involved systems:** Ensure affected systems are being monitored appropriately, focusing on critical infrastructure components where unauthorized remote access could have severe implications.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems, as Mikogo can enable an attacker to gain unauthorized access or control. While this tool can be used legitimately, its presence within unexpected contexts raises significant concern about possible malicious abuse.

  ### Blind Spots and Assumptions

  Detection may have limitations if Mikogo's executable names are altered or if the tool is disguised within legitimate applications. Reliable detection requires comprehensive logging of process creation events; any absence of such logs could hinder investigations. Legitimate usage scenarios by IT support staff or management tools may trigger the alert. Companion detections include monitoring for unusual process injection methods (e.g., reflective DLL injection), which can indicate advanced persistence techniques used by an adversary.

