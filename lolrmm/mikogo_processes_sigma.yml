note: |
  ### Technical Context
  This detection rule identifies potential unauthorized activity related to the Mikogo Remote Management and Monitoring (RMM) tool. Mikogo is a legitimate software used for remote desktop sharing and support, however, attackers may exploit it to gain unauthorized access to systems and maintain control over compromised endpoints. The detection focuses on processes initiated or spawned by the Mikogo application family (e.g., mikogo.exe and its variations), suggesting that an attacker could be utilizing this tool for a remote session or administrative functions.

  The threat scenario involves an attacker leveraging the Mikogo RMM tool to engage in remote system manipulation or data exfiltration, either as a means of initial access or lateral movement within a network. The goal is likely to gather sensitive information or execute payloads without detection. This behavior correlates with MITRE ATT&CK techniques, particularly **T1219 - Remote Access Software**, which covers the use of third-party tools for remote access.

  Primary data sources for this detection include **process creation events** from Windows systems, which log details about executed binaries and their parent processes. Monitoring these logs is crucial for identifying any suspicious usage of the Mikogo software suite.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for instances where Mikogo-related executables are initiated, particularly looking at their parent processes to determine if they were spawned from suspicious or unauthorized applications.

  - **Analyze Network Traffic**: Investigate network traffic for connections initiated by Mikogo-related processes to detect unusual outbound connections to unknown or suspicious IP addresses, which could indicate data exfiltration efforts.

  - **Assess User Activity**: Check the user accounts associated with the execution of the Mikogo processes. Validate whether the account has legitimate access rights and if their behavior aligns with established baseline activities.

  - **Correlate with Other Security Alerts**: Look for additional alerts or logs that might indicate lateral movement or other account compromise activities within the same timeframe to understand the breadth of the potential intrusion.

  ### Prioritization
  The alert is considered to be of **medium severity** due to the potential misuse of legitimate remote access software, which can lead to significant data breaches or unauthorized activities in the enterprise environment. Quick identification and response are necessary to mitigate these risks.

  ### Blind Spots and Assumptions
  The detection logic assumes that the Mikogo processes will be executed on systems where they are not authorized. Legitimate uses of Mikogo in the environment may lead to false positives. Additionally, if process creation logging is not adequately configured, or if the Mikogo tool is clandestinely installed without proper monitoring, some unauthorized usages may go undetected. Coverage gaps may exist if other remote access tools or variations of the Mikogo tool are employed without detection capabilities in place.

