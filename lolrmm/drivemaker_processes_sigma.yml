  ---

  ### Technical Context

  This Sigma rule detects process creation events where the parent process is identified as DriveMaker.exe, which is commonly associated with Remote Monitoring and Management (RMM) tools. The likely attacker objective is to leverage legitimate RMM applications for reconnaissance, persistence, or lateral movement within the network. This detection relates to the MITRE ATT&CK technique for Remote Services (T1219).

  The primary telemetry source for this detection is Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1. Should malicious use occur, the impact can include unauthorized access, data exfiltration, or execution of additional payloads. It's important to note that this detection does NOT confirm malicious activity on its own; it merely indicates that an instance of DriveMaker.exe was executed under another process' context.

  ---

  ### Investigation Steps

  - **Review the parent process context:** Check Security Event ID 4688 and Sysmon Event ID 1 for the process creation of DriveMaker.exe. Assess the parent process and its behavior. Legitimate processes typically have expected parent-child relationships, e.g., execution under trusted system processes.

  - **Validate user and execution context:** Identify the user account that initiated the DriveMaker.exe process. Review whether the account has legitimate reasons to be running RMM tools, checking against your organization’s asset management records.

  - **Check execution parameters:** Inspect command line arguments related to the new process for unexpected usage. In Security Event ID 4688, look for suspicious patterns like the use of flags for remote connections that are not typical for legitimate usage.

  - **Audit file system changes:** Validate file system activity during the timeframe around the event, focusing on the creation or modification of system files or execution of additional binaries that could indicate lateral movement or payloads being dropped.

  - **Assess historical behavior of the asset:** Review prior logs (Event IDs 4688 and Sysmon Event ID 1) related to the same host to identify any patterns, such as repeated executions or deviations from normal operational behavior that might indicate misconfiguration or misuse.

  ---

  ### Prioritization

  This alert holds medium severity due to the fact that DriveMaker is a legitimate RMM tool with both positive and nefarious potential usage. Its deployment can indicate possible misuse, especially if detected where such tools are not expected or in combination with other suspicious activities.

  ---

  ### Blind Spots and Assumptions

  Detection is limited as legitimate use of RMM tools could trigger the alert. It's crucial to have complete log source activation for Security Event ID 4688 and Sysmon to ensure reliable detection. Legitimate admin or IT operations may utilize DriveMaker in authorized contexts, thereby necessitating thorough examination of activity logs. Companion detections such as unusual network communications (potential lateral movement) or login anomalies (failed logins post an RMM connection) can enhance investigation robustness.

