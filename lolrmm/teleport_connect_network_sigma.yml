note: |
  ### Technical Context

  This Sigma rule detects network connection activities originating from the Teleport Connect remote monitoring and management (RMM) tool to specific subdomains associated with Teleport services (e.g., `cdn.teleport.dev`, `reporting-connect.teleportinfra.sh`). The likely attacker objective involves utilizing Teleport Connect as a command-and-control (C2) mechanism to maintain persistence, gather sensitive data, or execute remote commands. This detection correlates with the MITRE ATT&CK tactic of Command and Control (TA0011) and specifically employs technique T1219, which refers to the use of legitimate remote access tools for communications.

  The primary telemetry source is Windows network connection logs that should capture the target host's outbound connections. A successful connection to one of the specified Teleport subdomains may indicate malicious behavior. However, this detection does not confirm malintent on its own, as these domains could also be utilized legitimately in organizational contexts, particularly if the organization officially employs Teleport services.

  ### Investigation Steps

  - **Review network connection logs for relevant events:** Inspect Windows Event IDs 5156 (Windows Filtering Platform) and track outbound connection attempts to subdomains related to Teleport. Identify the process name initiating the connection to establish context.

  - **Confirm legitimate use cases:** Determine if the asset is part of a known inventory utilizing Teleport Connect, such as remote management of infrastructure. Check for any recent installations or legitimate user activity indicating authorized use.

  - **Identify potential indicators of compromise:** Look specifically for connections initiated by uncommon processes, such as `teleport.exe`, which would be suspicious if not linked to known legitimate activities.

  - **Examine related accounts and user behavior:** Investigate recent logins and actions performed by the user associated with the detected connections, focusing on any unusual patterns, such as numerous connection attempts to the Teleport subdomains outside of normal operating hours.

  - **Cross-reference with EDR or antivirus logs:** Look for any alerts or detections related to known malicious behaviors associated with the presence of Teleport RMM tool on endpoints. This could include suspicious file creations or registry changes.

  ### Prioritization

  This alert has a medium-severity level due to the potential impact on sensitive systems and the likelihood of adversaries exploiting legitimate remote management protocols for malicious purposes. While Teleport Connect could be benign, abuse of such tools is increasingly weaponized in specific threat landscapes, necessitating timely investigation.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers modifying the behavior of Teleport Connect to mask its activities or using other tools impersonating legitimate connections. Reliable detection depends on having comprehensive logging of network activities and ensuring that Windows Filtering Platform (WFP) logs are enabled. Additionally, legitimate activities may trigger this alert if Teleport Connect is utilized within the organization's normal operations. A related detection for lateral movement through remote desktop protocols could provide stronger coverage against potential misuses involving Teleport.

