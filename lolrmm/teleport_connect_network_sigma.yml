note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the Teleport Connect Remote Monitoring and Management (RMM) tool. Attackers may leverage Teleport Connect to gain remote access, control devices, or exfiltrate data while remaining stealthy. Relevant MITRE ATT&CK tactic is Execution, with technique ID T1219 – Remote Access Software. The primary telemetry sources are Windows network connection logs that report flow and destination hostname information. If the behavior is malicious, it may lead to unauthorized data access or lateral movement within the network. However, this detection alone does not confirm that the activity is malicious due to the legitimate uses of Teleport Connect.

  ### Investigation Steps

  - **Review recent network connections:** Analyze Windows Event ID 5156 logs for outbound connections to the specified domains (`cdn.teleport.dev`, `reporting-connect.teleportinfra.sh`, etc.). Look for unusual timing or hosts initiating these connections.

  - **Validate expected behavior:** Confirm whether the device that generated the alert is known to use Teleport Connect legitimately. Review asset inventory to ascertain expected installations.

  - **Identify suspicious user accounts:** Check Event ID 4624 for logon events concurrent with the network traffic. Focus on newly created or rarely used accounts initiating connections to the specified domains.

  - **Examine file creation artifacts:** Investigate for any file creation activities related to Teleport Connect in Windows Event ID 4688. Look specifically for process creation involving `teleport.exe` or related executables.

  - **Corroborate with EDR telemetry:** Utilize Endpoint Detection and Response (EDR) logs to identify any alerting behaviors between hosts. Focus on detecting process injection or unusual scripting commands executed alongside.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on systems that could be compromised, particularly if they host sensitive data. The likelihood of malicious abuse is moderate as Teleport Connect can be weaponized for unauthorized access, but it is also employed legitimately in managed environments.

  ### Blind Spots and Assumptions

  Detection may be limited if network logs are not appropriately configured or if the tool's traffic is obfuscated. Legitimate usage of Teleport Connect by administrative users may trigger this alert without malicious intent. A companion detection, such as alerting on unusual internal host communications or other remote access tools, would strengthen coverage and situational awareness.

