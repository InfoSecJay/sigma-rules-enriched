note: |
  ### Technical Context

  This rule detects network connections made to specific Teleport Connect RMM (Remote Monitoring and Management) service endpoints, suggesting the potential use of a tool commonly associated with remote administration and management functions. An attacker may exploit Teleport Connect for unauthorized access to networks, potentially leading to system compromise and data exfiltration. This behavior aligns with the MITRE ATT&CK Framework under the tactic of Command and Control (T1071) and the technique for Application Layer Protocols (T1219).

  The primary telemetry source is Windows network connection logs that track outbound connections to the specified DNS names. If malicious, the use of Teleport Connect can facilitate persistence and lateral movement within the network. It is essential to note that detection of this network activity does NOT confirm that malicious actions have occurred; legitimate instances may arise from authorized use of the Teleport Connect tool by IT personnel.

  ### Investigation Steps

  - **Review network connection logs**: Examine Windows event logs associated with network activity (Event ID 5156) for outbound connections to the specified Teleport endpoints (e.g., `*.cdn.teleport.dev`, `*.reporting-connect.teleportinfra.sh`).

  - **Identify legitimate use cases**: Confirm that authorized personnel are using Teleport Connect in a controlled manner or for remote support tasks; check for organizational policies or documentation on its use.

  - **Cross-reference user accounts**: Investigate the accounts initiating these connections; ensure they are part of approved RMM users or legitimate administrative roles within the enterprise.

  - **Monitor for abnormal volume**: Analyze the frequency and volume of outbound connections. Multiple connections within a short time frame to the Teleport endpoints could indicate misuse or an orchestrated attack.

  - **Determine remote host activities**: Verify if any unexpected or unauthorized actions are associated with systems making connections (e.g., creation of new user accounts, changes in configurations) using Event IDs 4740 (Account Lockout) or 4672 (Special Logon).

  - **Collect DNS resolution records**: Verify the DNS queries related to these endpoints (e.g., using DNS logs) to correlate each connection attempt to a specific user or asset for broader context.

  ### Prioritization

  The alert prioritization is medium, as the detection points to potentially unauthorized administrative access activity via the Teleport Connect tool. The systems targeted may be critical, and the likelihood of abuse is moderate given that such tools can be weaponized by adversaries for stealthy remote control. However, established legitimate use reduces total risk.

  ### Blind Spots and Assumptions

  Detection may miss instances where legitimate remote access occurs using Shadow IT approaches or off-network communication. Teleport Connect could be typically implemented by IT teams for legitimate reasons, thus producing false positives. Ensuring proper logging from DNS and network interface levels is essential for reliable detection. Companion detections for endpoint activity, like the use of PowerShell or unusual process creation involving Teleport Connect, could provide additional insights into potential misuse.

