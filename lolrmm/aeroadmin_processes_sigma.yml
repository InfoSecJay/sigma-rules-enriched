note: |
  ### Technical Context

  This Sigma rule detects the execution of the AeroAdmin remote management tool, which may indicate unauthorized access or control over targets within an enterprise. Attackers may use such tools to establish a foothold for command and control (C2), potentially aiming to exfiltrate sensitive data or further infiltrate the network. The relevant MITRE ATT&CK tactics include Command and Control (TA0011) and the specific technique Application Layer Protocol (T1219).

  The primary telemetry source is Windows process creation logs, specifically capturing executions of "aeroadmin.exe." If this behavior is malicious, it can lead to severe security implications, including data breaches and unauthorized access to systems. This detection does NOT confirm malicious intent solely on its own, as legitimate business operations may also utilize AeroAdmin for remote access.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Event ID 4688 for any instances of "aeroadmin.exe" being executed. Note the parent process for context; if the parent is a legitimate remote desktop tool or system management application, it may indicate benign activity.

  - **Analyze user context:** Identify the user account associated with the AeroAdmin process. Check for any abnormal or high-risk users, particularly those with elevated privileges. Legitimate admin tasks typically correlate with known, authorized users during regular business hours.

  - **Correlate network activity:** Look at related network connections through Windows Event ID 5156 (Windows Filtering Platform) for anomalies, especially connections to unusual or external IP addresses. Malicious activity might show unexpected outbound traffic patterns associated with AeroAdmin.

  - **Check for persistence mechanisms:** Investigate the system for any scheduled tasks or startup entries that reference AeroAdmin or its executable path, indicating potential persistence for unauthorized access.

  - **Cross-reference with threat intelligence:** Confirm if the presence of AeroAdmin aligns with known adversary tactics documented in threat intelligence reports. If associated with a known threat actor, consider escalating the incident.

  - **Validate legitimate use cases:** Investigate scheduled remote sessions or prior approvals for the use of AeroAdmin. Any confirmed legitimate scheduling should be documented, while unapproved instances should be flagged for security review.

  ### Prioritization

  The alert severity is medium due to the potential for sensitive data exposure via unauthorized remote access. While the likelihood of malicious abuse is moderate, the usage of such tools is increasingly common among attackers, warranting prompt investigation to prevent exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion if attackers modify process names or utilize less common remote administration tools. Reliable detection requires proper logging configurations for process creation events. Additionally, legitimate IT operations may trigger the alert, particularly during remote support tasks. A companion detection to strengthen coverage could involve monitoring for unusual network traffic patterns associated with common remote access tools.

