note: |
  ### Technical Context
  This detection rule identifies potential unauthorized activity associated with the AeroAdmin Remote Management Tool (RMM). AeroAdmin is a remote desktop application that allows users to remotely control computers, which can be misused by threat actors for malicious purposes such as unauthorized access, lateral movement, or deploying additional malware. The detection logic targets instances where processes related to AeroAdmin are launched, especially under suspicious circumstances.

  The likely threat scenario involves an attacker leveraging AeroAdmin to maintain remote control over an environment, potentially circumventing traditional defense mechanisms. The attacker may aim to exfiltrate data, install additional malicious tools, or conduct further reconnaissance. This ties into the MITRE ATT&CK framework, particularly the Execution tactics (ID: TA0002) and the specific technique of Remote Services (ID: T1219).

  Primary data sources for this detection include Windows process creation logs, which can provide insights into when and where AeroAdmin processes are initiated, as well as the associated parent processes that may indicate suspicious user activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation logs for instances of AeroAdmin.exe being executed, paying attention to the context in which these processes were started.
  - **Check Parent Process Relationships**: Examine the parent processes for AeroAdmin instances to identify any potentially malicious or unusual process chains that could indicate unauthorized use.
  - **Correlate with User Activity**: Investigate the user accounts associated with the AeroAdmin executions, looking for anomalous login times or locations that may suggest compromise.
  - **Assess Network Connections**: Monitor network traffic for connections established by AeroAdmin processes to identify any external communications that could indicate data exfiltration or command and control activity.

  ### Prioritization
  Given the potential for misuse of remote management tools like AeroAdmin, which can facilitate unauthorized access and data exfiltration, alerts generated by this rule should be treated with medium urgency. The potential impact on the enterprise is significant, especially if sensitive information is compromised or if the tool is used to facilitate further malicious activities.

  ### Blind Spots and Assumptions
  This detection may not capture legitimate use of AeroAdmin by authorized personnel, leading to potential false positives. Additionally, the detection logic assumes that the AeroAdmin tool will always be called by its standard process names, which may not be the case if an attacker modifies the file or employs obfuscation techniques. For this alert to function effectively, process creation logging must be enabled on all managed Windows systems, and the logs must be forwarded to a centralized logging system for analysis.

