note: |
  ### Technical Context

  This rule detects the execution of the AeroAdmin Remote Management and Monitoring (RMM) tool on Windows systems. The likely intent behind the use of AeroAdmin could range from legitimate remote support activities to malicious actions such as unauthorized access or data exfiltration. The relevant MITRE ATT&CK tactic for this behavior is "Execution" (TA0002) and the technique is "Remote Access Software" (T1219). Primary telemetry sources include Windows Security Event ID 4688 (process creation events) and potentially Sysmon Event ID 1 for enhanced details on the process execution context.

  If exploited maliciously, AeroAdmin can enable adversaries to control systems, intercept user credentials, or manipulate data remotely. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate uses of AeroAdmin within a support framework may also trigger this alert.

  ### Investigation Steps

  - **Review the process creation events**: Investigate Windows Security Event ID 4688 for processes starting with "aeroadmin.exe" or "AeroAdmin.exe". Note the users who initiated this activity; if it is executed by non-administrative users without legitimate support processes, it may be suspicious.

  - **Analyze parent processes**: Check for the parent process of the detected AeroAdmin instance using Event ID 4688 or Sysmon Event ID 1. An unexpected parent process (e.g., not from a known IT support team member) is a high-confidence malicious indicator.

  - **Cross-reference user activity**: Look at the timestamps and user accounts linked to the AeroAdmin activity against your ticketing system. If the timing is outside normal user access or if the user is not authorized for remote support, this could indicate misuse.

  - **Identify network connections**: Inspect network logs for any outbound connections initiated by AeroAdmin. Utilize firewall logs or EDR telemetry to identify unusual connection patterns or connections to unknown IP addresses that could signify malicious actions.

  - **Evaluate legitimate use**: Determine if AeroAdmin usage aligns with documented IT support protocols. For example, if a support ticket was raised prior to AeroAdmin execution, it might indicate legitimate use. Conversely, lack of documentation is a red flag.

  - **Check for file activity**: If AeroAdmin is used, verify any file creation or modification logs related to sensitive data. Analyze file system logs or Sysmon Event ID 11 (file creation) for unusual file operations linked to AeroAdmin.

  ### Prioritization

  This alert has a medium severity rating in an enterprise context due to its potential for unauthorized remote access, which could lead to significant security incidents. The likelihood of malicious abuse is moderate, given that RMM tools are also used legitimately but can be weaponized if misappropriated.

  ### Blind Spots and Assumptions

  Detection may be limited if AeroAdmin is obfuscated or renamed, and proper logging configurations must be in place to capture all relevant events. Legitimate administrative activities, such as authorized IT support work, can also trigger this alert, making contextual awareness critical. An associated detection to consider is monitoring for other known RMM tools (e.g., TeamViewer or AnyDesk) to enhance detection coverage.

