  ### Technical Context

  This rule detects potential network activity originating from the AweRay remote monitoring and management (RMM) tool, specifically targeting domains associated with AweRay services (asapi*.aweray.net and client-api.aweray.com). The likely objective of an attacker using AweRay would be to establish remote access to compromised systems, facilitating data exfiltration or lateral movement within a network. This activity aligns with the MITRE ATT&CK framework, specifically under the Execution tactic, technique T1219 (Remote Access Software).

  The primary telemetry sources include network connection logs from Windows systems which record outbound traffic and their destinations. If malicious, this activity could allow unauthorized access and control over organization systems, thereby increasing the risk of data breaches or further exploitation. It’s important to note that this detection does NOT confirm malicious intent or actor presence on its own, as legitimate instances of AweRay may exist within the environment.

  ---

  ### Investigation Steps

  - **Check network connections:** Review Windows network connection logs (Event ID 5156) for outbound connections to domains ending in "aweray.net" and "aweray.com". Document any connections made during unusual hours or not aligned with business operations.

  - **Identify installed software:** Use PowerShell to execute `Get-WmiObject -Class Win32_Product | Where-Object { $_.Name -like "*AweRay*" }` on affected hosts. Legitimate instances may show as installed software, while absence on unexpected hosts warrants further scrutiny.

  - **Review running processes:** Look for suspicious processes associated with AweRay by checking for parent-child process relationships using Sysinternals or PowerShell (Get-Process). Focus on processes active during the timeframe of the alert.

  - **Network flow analysis:** Utilize IDS/IPS logs to identify repeated connections to AweRay domains. Malicious indicators include excessive connection attempts or data transfer volumes that deviate from known baselines.

  - **Assess asset criticality:** Evaluate the role of affected systems—are they critical servers or user workstations? Identify if the systems have sensitive data that could be exploited if compromised.

  ---

  ### Prioritization

  This alert has a medium severity level, as it indicates potential unauthorized access through a known remote management tool. While AweRay is a legitimate product, its misuse can lead to severe breaches, making vigilance necessary. The likelihood of exploitation is moderate, as many adversaries utilize legitimate RMM tools in their operations.

  ---

  ### Blind Spots and Assumptions

  Detection of AWS or other proxy configurations may obscure legitimate use of AweRay, leading to false positives. Required log sources must include Windows firewall logs and DNS logs to capture attempts to reach the identified domains. Legitimate activities that may trigger the alert include authorized IT support sessions using AweRay for troubleshooting. Companion detections, such as monitoring for suspicious PowerShell activity (T1059.001), could enhance the efficacy of monitoring against potential misuse.

