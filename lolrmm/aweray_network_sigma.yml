note: |
  ### Technical Context

  This Sigma rule detects network connections to known AweRay RMM (Remote Monitoring and Management) domains, particularly those ending with specific patterns that indicate malicious use. Attackers may utilize AweRay RMM to establish remote access as part of a broader command-and-control (C2) strategy, typically following the initial compromise of a target system. The relevant MITRE ATT&CK tactic is **Command and Control** (T1071) with the technique **Remote Management Tools** (T1219).

  Primary telemetry sources include Windows network connection logs, specifically those related to outgoing connections. If utilized maliciously, an attacker could manipulate AweRay RMM for exfiltration of sensitive data or further compromise of additional systems. Importantly, this detection alone does not prove an ongoing attack; it merely indicates potential connection to a domain used by RMM tools, which may be legitimate in certain contexts.

  ### Investigation Steps

  - **Verify network connections to specified domains**: Check Windows Security Event ID 5156 or Sysmon Event ID 3 for outbound connections to domains ending with "aweray.net" or "client-api.aweray.com." Look for patterns of repeated attempts that may indicate unauthorized use.

  - **Analyze related processes on the endpoint**: Review running processes using Sysmon Event ID 1. Confirm if any executable associated with AweRay is present and whether it is signed by a legitimate source or shows signs of suspicious behavior.

  - **Check for legitimate use**: If the system in question is used for IT management, confirm any prior authorization for AweRay RMM. Establish a baseline of normal activity, such as the legitimate use of RMM tools in controlled environments.

  - **Examine for lateral movement**: Monitor for other suspicious outbound connections or internal lateral movement attempts via Event IDs such as 4624 (logon) and 7045 (service creation). This helps identify if the connection was part of a broader attack scenario.

  - **Correlate with other telemetry**: Investigate user activity logs (such as from Windows Event ID 4624) to determine if the user initiated the connection or if it corresponds with known attacker behavior patterns.

  ### Prioritization

  This alert is of medium severity, as it signals a possible unauthorized use of RMM tools which could lead to system compromise. Given that malicious actors frequently leverage these types of tools for C2 operations, swift investigation is warranted to ascertain whether this connection was legitimate or indicative of network compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of AweRay RMM tools within the enterprise, which could lead to false positives. A key assumption is that all required logs (such as Windows Firewall, Security, and Sysmon) are enabled and properly configured. Normal remote administration activities could trigger this alert. Implementing companion detections, such as monitoring for unauthorized UI interactions with RMM software, could enhance visibility of potential misuse.

