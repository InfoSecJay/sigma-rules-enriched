note: |
  ### Technical Context
  This detection rule identifies network connections made by the AweRay Remote Monitoring and Management (RMM) tool. AweRay is often used by attackers to gain unauthorized access to a victim's environment, enabling remote control, data exfiltration, and persistent access. The detection logic focuses on unusual DNS resolution patterns, specifically looking for connections to known AweRay-related domains.

  The likely threat scenario involves an attacker using AweRay as a means to infiltrate a network, pivot to critical resources, or maintain a foothold within the enterprise infrastructure. Common objectives may include reconnaissance, data theft, and lateral movement.

  This rule ties into the MITRE ATT&CK framework, particularly under the tactics of Execution (T1203) and Command and Control (T1219). The main data source to monitor for this activity includes network connection logs, which can reveal suspicious outbound traffic patterns.

  ### Investigation Steps
  - **Review Network Logs:** Examine network connection logs for other connections to AweRay domains, specifically focusing on unusual or unexpected source hosts communicating with these endpoints.
  - **Analyze DNS Queries:** Obtain and review recent DNS query logs to identify any resolutions to AweRay domains from internal hosts, which may indicate covert operations by an attacker.
  - **Inspect Process Activity:** Investigate process creation logs to detect any unauthorized or unusual instances of RMM-related executables running on the network or frequently associated IP addresses.
  - **Audit Endpoint Connections:** Use EDR tools to further investigate endpoints that show connections to AweRay domains, checking for other indicators of compromise (IoCs) such as unusual logins, file changes, or other network traffic anomalies.

  ### Prioritization
  The alert has a medium severity level considering AweRay's potential usage as both a legitimate administrative tool and a possible vector for unauthorized access. The threat impact can be significant if misused by an attacker, elevating the risk to sensitive data and critical assets.

  ### Blind Spots and Assumptions
  While the detection focuses on domain endpoints specific to AweRay, there may be false negatives if attackers utilize custom domains or modify their toolsets. The rule assumes all instances of communicating with these domains indicate malicious activity, which may not account for legitimate AweRay usage. Proper logging settings and retention policies must be implemented on network devices to ensure comprehensive visibility for the rule to function effectively.

