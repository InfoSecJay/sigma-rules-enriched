  ### Technical Context

  This Sigma rule detects the execution of the Solar-PuTTY process, which is often used by attackers for remote management and control (RMM) to establish unauthorized access to systems. The likely attacker objective is to maintain persistent access and manage compromised systems covertly. This behavior maps to the MITRE ATT&CK technique **Remote Services: Remote Management Tools (T1219)**.

  The primary telemetry sources for this detection are Windows process creation events, specifically focusing on process creation logs where the `Image` or `ParentImage` fields contain the string "Solar-PuTTY.exe." If malicious, the impact could be significant, facilitating unauthorized actions across the environment. However, this detection does NOT confirm malicious intent on its own, as the tool could also be legitimately used for remote management.

  ---

  ### Investigation Steps

  - **Identify relevant process logs:** Review Windows Security Event ID 4688 logs for process creation events where `New Process Name` contains "Solar-PuTTY.exe." Compare against expected execution paths for authorized use.

  - **Check parent process relationships:** Investigate parent process IDs to determine if the Solar-PuTTY process was spawned by legitimate tools (e.g., administrative scripts) versus suspicious processes, especially those with unusual execution timelines.

  - **Assess running instances:** Verify the number of Solar-PuTTY instances running on critical assets. Multiple concurrent instances may indicate malicious activity, especially if combined with evidence of lateral movement.

  - **Determine usage patterns:** Identify any personnel or systems that regularly utilize Solar-PuTTY. Compare the identified users or systems against the time of execution in relation to their operational schedules to highlight anomalies.

  - **Inspect command-line arguments:** Examine the command line of the Solar-PuTTY process for unusual flags or inputs, which may indicate that an attacker is attempting to establish reverse shells or execute commands remotely.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential for the affected system to have significant administrative capabilities. The likelihood of malicious abuse is notable, as Solar-PuTTY can be weaponized for unauthorized control. This behavior is not commonly observed in benign usage scenarios, making it critical for prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if the Solar-PuTTY executable is renamed or if its parent process is masked under legitimate processes. Required log sources must be configured correctly to ensure comprehensive monitoring of process creation. Legitimate IT administrative activities may trigger the alert, necessitating careful contextual analysis. Companion detections for similar RMM tools or scripts can enhance overall threat coverage.

