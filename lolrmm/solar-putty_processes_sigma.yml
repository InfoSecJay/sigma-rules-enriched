note: |
  ### Technical Context

  This rule detects process activity related to the Solar-PuTTY remote management tool, specifically processes created with the parent image of Solar-PuTTY itself. Attackers may use this tool to establish remote control over compromised systems, facilitating further actions such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK tactic **Command and Control (TA0011)** and technique **Application Layer Protocol (T1219)**.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide details on running processes. If malicious, the use of Solar-PuTTY indicates potential unauthorized access to systems. It is important to note that while this detection flags activity, it does NOT confirm malicious intent as Solar-PuTTY can also be used legitimately by administrators for remote management tasks.

  ### Investigation Steps

  - **Inspect process creation logs:** Review Windows Security Event ID 4688 for logs indicating creation of `Solar-PuTTY.exe`. Look for unusual process hierarchies or execution from unexpected directories.

  - **Identify parent process analysis:** Check for the parent process of `Solar-PuTTY.exe` to ascertain the context of its execution. A legitimate use may show typical administrative tools, while suspicious activity may show processes like `cmd.exe` or `powershell.exe`.

  - **Correlate with Sysmon logs:** Analyze Sysmon Event ID 1 for `Solar-PuTTY.exe` executions. Note the command-line arguments used; unexpected flags may indicate malicious usage.

  - **Assess asset criticality:** Determine the role of the hosting system. For example, if it's a server hosting sensitive data, the alert should be prioritized accordingly.

  - **Search for network activity:** Investigate network logs for connections initiated by `Solar-PuTTY.exe`. Identify any external IP addresses or domains associated with known malicious infrastructure.

  - **Review user activity:** Check for recent user interactions or account activity on the system. A legitimate administrative account using Solar-PuTTY during off-hours may warrant further scrutiny.

  ### Prioritization

  This alert should be treated with medium severity due to the potential risks involved with remote access tools. The likelihood of malicious abuse is reasonable, especially in environments where systems contain sensitive data. The behavior of Solar-PuTTY usage can be common in targeted attacks, reinforcing the need for timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of common administrative tools by legitimate users which mimic the signature of this rule. Consistent log retention and configuration of Sysmon are required for reliable detection. Furthermore, tools like SSH clients may trigger similar alerts. A related detection for remote access tools would strengthen overall coverage for anomalous behaviors.

