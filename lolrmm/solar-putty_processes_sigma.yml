note: |
  ### Technical Context

  This Sigma rule detects the execution of the Solar-PuTTY Remote Monitoring and Management (RMM) tool, which is commonly associated with unauthorized remote access and potential lateral movement within a network. The likely attacker objective is to maintain persistent access to compromised systems for reconnaissance or data exfiltration. This detection is related to the MITRE ATT&CK techniques "Remote Access Software" (T1219).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 for process creation and potentially Sysmon Event ID 1 for detailed process information. If malicious, the use of Solar-PuTTY could indicate that an adversary is conducting post-exploitation activities. Importantly, this detection does not confirm malicious intent on its own, as Solar-PuTTY can also be used legitimately for remote access by authorized personnel.

  ### Investigation Steps

  - **Verify process creation events**: Check Security Event ID 4688 logs for the creation of processes with the Image field containing "Solar-PuTTY.exe". Cross-reference the User field with known user accounts to determine if the process was initiated by legitimate personnel.

  - **Examine parent process details**: Look for parent process information in Security Event ID 4688 logs and Sysmon Event ID 1 logs. Ensure the ParentImage ends with "Solar-PuTTY.exe" to confirm that the rule's condition is met. Repeated instances from unauthorized users may indicate potential malicious activity.

  - **Identify network activity**: Analyze network logs for unusual outbound connections originating from the host running Solar-PuTTY. Look for connections to suspicious IPs or domains that are not typically accessed by legitimate users, which may indicate data exfiltration or command-and-control communication.

  - **Cross-reference administrative accounts**: Check whether the identified Solar-PuTTY process is being executed under administrative or privileged accounts (e.g., User Rights Assignment for administrators). Legitimate use usually involves standard or known administrative accounts without unusual spikes in activity.

  - **Review file creation timestamps**: For systems running Solar-PuTTY, verify any related file creation in user directories. Check for timestamps that correlate with abnormal or unauthorized access times indicating potential abuse or use outside of regular operational hours.

  ### Prioritization

  This alert holds medium severity due to the potential impact of compromised systems allowing unauthorized remote access. The likelihood of malicious abuse is elevated, as Solar-PuTTY is often weaponized by adversaries for post-exploitation tasks. However, it is also used legitimately, necessitating careful investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate Solar-PuTTY usage in the environment; therefore, users of this tool must be well-identified. Additionally, if process logging is disabled or improperly configured, detection accuracy may decline. Legitimate administrative tasks may inadvertently trigger this alert, contingent on user behavior patterns. Companion detections involving abnormal network traffic or account access logs can provide enhanced context for identifying malicious activities related to this threat.

