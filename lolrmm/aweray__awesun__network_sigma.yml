  ---

  ### Technical Context

  This Sigma rule detects network connections to the AweRay (AweSun) Remote Monitoring and Management (RMM) tool, which can be exploited by adversaries for remote access, system control, and lateral movement within an enterprise network. The likely attacker objective in utilizing such tools is to gain persistent access to target systems while maintaining stealth during reconnaissance, exploitation, and execution phases of the attack lifecycle.

  The relevant MITRE ATT&CK tactics and techniques include "Execution" (TA0002) and "Remote Services" (T1219). The primary telemetry sources involve Windows event logs, specifically focusing on network connection activity (Event ID 5156 for Windows Filtering Platform and associated logging). If malicious, this behavior may lead to compromised systems acting as launchpads for further attacks or data exfiltration. However, it should be noted that this detection does NOT confirm malicious intent on its own, as the AweRay (AweSun) tool can be used for legitimate administrative purposes.

  ---

  ### Investigation Steps

  - **Review network connections to AweRay**: Check for network connection attempts to endpoints such as asapi-us.aweray.net and asapi.aweray.net by reviewing Windows filtering platform logs (Event ID 5156). Look for unusual internal hosts initiating connections.

  - **Correlate with process activity**: Examine the process creation logs (Security Event ID 4688 or Sysmon Event ID 1) for any processes related to AweRay. Focus on processes initiated from atypical or sensitive locations, as this could indicate malicious behavior.

  - **Analyze system usage patterns**: Identify legitimate usage of AweRay by checking against known administrative workflows. Validate that connections correspond to scheduled maintenance or support activities and not unauthorized remote access.

  - **Inspect user accounts making the connection**: Cross-reference the accounts initiating the connections with user roles. If the user accounts are external or have non-administrative privileges, this can indicate potential misuse.

  - **Review outbound traffic characteristics**: Observe the duration and frequency of connections to AweRay. Anomalous or repeated connections, especially during off-hours, may suggest adversarial use rather than legitimate maintenance activities.

  - **Search for file artifacts related to exfiltration**: Check for any file creations or modifications (such as suspicious executables) that may be associated with AweRay activity. Cross-reference file logs in conjunction with connection events to determine if files were sent to or received from the RMM tool.

  ---

  ### Prioritization

  This alert has medium severity primarily due to the potential impact on critical systems if malicious activity is confirmed. The use of RMM tools like AweRay is sometimes weaponized by attackers for remote access and lateral movement, increasing the likelihood of malicious abuse, especially when unexpected connections are detected.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for adversaries to obfuscate their use of legitimate tools by employing proxy servers or altering behavior based on historical normalcy. High-quality logging configurations, particularly for connection events, are essential for reliable detection. Legitimate support activities may trigger the alert, especially in environments utilizing AweRay for administrative tasks. A related detection to consider is the monitoring of administrative access logs to identify unauthorized changes or behaviors that reinforce potential misuse.

