note: |
  ### Technical Context

  This Sigma rule detects potential network activity related to the Guacamole Remote Management Tool (RMM). The likely attacker objective is to establish a remote session for system administration or exploit that access to manipulate or exfiltrate data. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071 - Application Layer Protocol) as well as the technique T1219, which refers to Remote Access Software.

  Primary telemetry sources include Windows network connection logs, specifically monitoring outbound traffic to destination hostnames that resemble legitimate Guacamole endpoints. If this activity is malicious, it can lead to unauthorized access, data exfiltration, or system compromise. However, this detection does NOT confirm malicious intent or actions by itself, as legitimate use of the Guacamole RMM tool can generate similar network traffic.

  ### Investigation Steps

  - **Check outbound connections:** Review Windows network connection logs (Event ID 5156) for connections to `*.guacamole.apache.org` or similar domains. Identify whether any unauthorized or atypical IP addresses are seen.

  - **Validate user activity:** Correlate detected connections with user activity logs (Event ID 4624) to determine if the sessions align with known, legitimate user behaviors or maintenance schedules.

  - **Identify high-confidence indicators:** Look for processes related to Guacamole, such as `guacamole.war`, through process creation logs (Sysmon Event ID 1) or service installation logs (Event ID 7036) that match typical RMM behavior.

  - **Review configuration scripts:** Examine any administrative scripts or configuration files that might invoke the Guacamole service, ensuring they originate from expected paths and schedules.

  - **Assess asset criticality:** Prioritize investigation based on the impact of the affected asset. If affected systems are part of a critical infrastructure (e.g., domain controllers, sensitive file servers), escalate accordingly.

  - **Look for file transfer activity:** Check for unusual file transfer activity (Event ID 5145) that could indicate subsequent exfiltration attempts after an RMM session has been established.

  ### Prioritization

  This alert has medium severity due to the potential impact on affected systems, particularly if they are critical infrastructure. While Guacamole is legitimate software, its use can be abused for remote access, making this behavior a target for attackers.

  ### Blind Spots and Assumptions

  Detection relies heavily on the correct configuration of network logging; if not properly enabled, the alerts may miss genuine remote access attempts. Legitimate users may trigger this alert when utilizing Guacamole for remote support. A related detection to consider is monitoring for administrative logins and session times, which can help provide context around the alert.

