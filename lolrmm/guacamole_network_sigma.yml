note: |
  ### Technical Context

  This rule detects outbound network connections to the Guacamole RMM tool, which is often used for remote access and management. Attackers may utilize this tool to gain unauthorized access to systems, allowing them to control remote devices as part of a broader compromise. The relevant MITRE ATT&CK tactics and techniques are Command and Control (TA0011) and Application Layer Protocol (T1219). The primary telemetry source includes Windows network connection logs, specifically monitoring for DNS queries resolved to domains associated with Guacamole.

  If these connections are malicious, the impact could include data exfiltration or system compromise. However, this detection does NOT confirm malicious activity on its own, as it may also denote legitimate use of the Guacamole tool by authorized personnel.

  ### Investigation Steps

  - **Check outbound connections:** Review the Windows Security Event ID 5156 logs to identify connections initiated to `*.guacamole.apache.org`. Focus on the process ID and user account associated with the connections.

  - **Investigate source process:** Examine the parent process of the outbound connection using Sysmon Event ID 1. A typical benign process might be a known IT management tool, while unexpected processes should raise suspicion.

  - **Review user account activity:** Correlate the user account performing the connection with known asset inventory. Significant discrepancies might suggest malicious intent, especially if the account is not associated with IT operations.

  - **Validate network traffic:** Analyze network traffic to `*.guacamole.apache.org` using firewall or proxy logs. Look for anomalous connections outside of standard work hours, large data transfers, or connections from IPs not associated with company assets.

  - **Confirm Guacamole service usage:** For legitimate activity, ensure that there are corresponding entries in the IT asset management records where the Guacamole tool's use is documented and that the associated user has proper permissions.

  ### Prioritization

  The severity of this alert is medium. While the affected systems may host critical data, the likelihood of malicious abuse depends on the context of the connections. Usage of RMM tools like Guacamole is increasingly weaponized for lateral movement and remote exploitation, warranting timely investigation.

  ### Blind Spots and Assumptions

  This detection may miss cases where adversaries employ domain generation algorithms or use similar domains to avoid detection. Reliable detection requires complete logging from network appliances and active monitoring of DNS requests. Legitimate activities, such as IT support accessing remote systems, may trigger this alert. Companion detections that enhance coverage include monitoring for unusual user account logins and abnormal process behavior associated with remote tool executions.

