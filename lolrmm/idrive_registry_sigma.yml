note: |
  ### Technical Context

  This rule detects modifications or queries made to the Windows Registry under the iDrive key, indicative of potential use of the iDrive Remote Management (RMM) tool, which can facilitate unauthorized access and management of systems. The likely attacker objective is to gain control over and manage compromised systems without detection. This activity maps to MITRE ATT&CK technique T1219 (Remote Access Software). Primary telemetry sources are Windows registry event logs, specifically focusing on operations targeting `HKEY_LOCAL_MACHINE\SOFTWARE\IDrive\*` and `HKEY_CURRENT_USER\SOFTWARE\IDrive\*`. If confirmed malicious, this activity could enable an adversary to control devices for unauthorized purposes. Importantly, this detection does not prove that iDrive RMM is malicious, as legitimate usage of the tool occurs in organizations that utilize it for IT management.

  ### Investigation Steps

  - **Check Registry Modifications:** Review Windows registry event logs (Event ID 13) to confirm unauthorized changes to `HKEY_LOCAL_MACHINE\SOFTWARE\IDrive\*` or `HKEY_CURRENT_USER\SOFTWARE\IDrive\*`. Note the user context and timestamps to identify any anomalies.

  - **Analyze Process Creation Events:** Investigate the process creation logs (Security Event ID 4688 and Sysmon Event ID 1). Look for processes initiated around the same timestamp as registry changes that may relate to iDrive, such as `iDrive.exe` or other related executables.

  - **Validate User Behavior:** Determine if the user associated with the registry modification normally uses iDrive. Compare against historical user activity logs to identify any irregular access patterns or unusual hours of operation.

  - **Identify Presence of Legitimate iDrive Usage:** Confirm any documented use of the iDrive tool within the organization by reviewing asset inventory. Cross-reference usage logs or support tickets that indicate legitimate remote management activity.

  - **Review Network Connections:** Examine network logs (Firewalls or proxy logs) for outbound connections to iDrive servers, particularly any connections matching iDrive's known IP range during the same timeframe of registry activity.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems using iDrive which can be abused for unauthorized access. The likelihood of malicious use is moderate, particularly in organizations not utilizing iDrive, considering common tactics by adversaries to install remote management tools covertly. This behavior is commonly weaponized by threat actors looking to maintain persistence on compromised systems.

  ### Blind Spots and Assumptions

  Detection may be limited due to legitimate use cases of iDrive by authorized personnel which could trigger false positives. Required log sources include Windows Security and Sysmon logs for comprehensive detection coverage. Additionally, standard administrative tasks in IT environments could result in similar registry modifications. A companion detection worth considering would be monitoring for suspicious process executions from the iDrive directory to strengthen overall visibility into potential abuse.

