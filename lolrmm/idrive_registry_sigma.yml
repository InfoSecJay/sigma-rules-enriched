note: |
  ### Technical Context

  This Sigma rule detects registry activity related to the iDrive Remote Monitoring and Management (RMM) tool, which is often used for system administration and monitoring. Attackers may use tools like iDrive to establish persistence or for command and control (C2) communications, potentially facilitating unauthorized access and management of systems. This behavior is classified under the MITRE ATT&CK tactic of Command and Control (T1071) and technique for Application Layer Protocol (T1219).

  The primary telemetry sources needed to monitor this activity are Windows registry event logs. Specifically, look for registry changes in 'HKEY_LOCAL_MACHINE\SOFTWARE\IDrive\*' and 'HKEY_CURRENT_USER\SOFTWARE\IDrive\*'. If malicious, this behavior could indicate that an attacker is leveraging iDrive for unauthorized access or management, compromising system integrity. However, this detection does NOT confirm malicious intent on its own, as administrators may legitimately utilize iDrive for system maintenance.

  ### Investigation Steps

  - **Check registry keys for anomalies:** Look for unusual timestamps or suspicious modifications in the registry paths 'HKEY_LOCAL_MACHINE\SOFTWARE\IDrive\*' and 'HKEY_CURRENT_USER\SOFTWARE\IDrive\*'. Expected behavior might involve timestamp patterns that align with routine administrative tasks.

  - **Validate user account activity:** Review corresponding Security Event ID 4624 (Logon) to determine if a known administrative account is linked to the registry changes, confirming legitimate access. Discrepancies, such as changes by non-administrative accounts, increase suspicion.

  - **Identify process execution:** Examine Sysmon Event ID 1 (Process Creation) and correlate any processes created around the same time as the registry modification. Pay attention to commands that involve iDrive paths, particularly those executed by unusual or unexpected users.

  - **Detect network connections:** Use Firewall logs or Sysmon Event ID 3 (Network Connection) to identify any outbound traffic to known malicious IPs or domains following the registry modifications. Reliable indicators here might include traffic to suspicious URLs not typically associated with iDrive usage.

  - **Evaluate file creation events:** Check for any file creation activities associated with the iDrive directory by reviewing Sysmon Event ID 11 (File Creation). There should be legitimate administratively-created files, but unexpected executables or scripts warrant further investigation.

  ### Prioritization

  This alert holds medium severity due to the potential impact on critical systems using iDrive for administration. The likelihood of malicious use is moderate, particularly for attackers seeking to exploit remote management capabilities. While iDrive can be utilized for legitimate purposes, it is often weaponized in targeting enterprise environments.

  ### Blind Spots and Assumptions

  This detection may be bypassed by attackers using alternate registry keys or tools with similar functionality that do not include iDrive. Reliable detections require Windows registry auditing enabled for both HKEY_LOCAL_MACHINE and HKEY_CURRENT_USER. Additionally, legitimate administrators may trigger this alert during maintenance processes. A related detection would include monitoring for unusual network connections (Sysmon Event ID 3) to identify unauthorized C2 attempts linked to any registry-based remote management tools.

