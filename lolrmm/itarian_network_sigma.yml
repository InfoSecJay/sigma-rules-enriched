note: |
  ### Technical Context

  This rule detects outbound network connections to specific domains associated with the Itarian Remote Monitoring and Management (RMM) tool. Such activities are often indicative of remote access software usage by malicious actors aiming to gain unauthorized control over victim systems or exfiltrate data. This detection aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001) and the technique of Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs that capture DNS resolution and outbound traffic. If malicious, the detection implies compromised systems facilitating external control, which could lead to data breach or lateral movement. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of the Itarian tool can also generate similar traffic.

  ### Investigation Steps

  - **Review connection logs:** Inspect network connection events, focusing on Event ID 5156 (Windows Filtering Platform) for outbound connections to domains such as `*.remoteaccess.itarian.com` and `*.servicedesk.itarian.com`. Verify if the connections are originated from known endpoints.

  - **Identify legitimate usage patterns:** Establish baseline network activity for identified hosts. Confirm the business justification for the use of Itarian RMM by cross-referencing asset records with user access logs to legitimate tools.

  - **Check process creation logs:** Look for related process execution tied to network connections using Sysmon Event ID 1. Correlate with the identified outbound connections to ensure they stem from expected applications (e.g., Itarian service).

  - **Evaluate source system context:** Determine the role and criticality of systems making the connection. For example, connections from non-admin workstations may indicate unauthorized software usage, while connections from IT admin systems may warrant further validation of legitimate activity.

  - **Verify DNS resolution logs:** Analyze DNS queries (Event ID dns query logs) leading up to the detected network connections. Look for any anomalies, such as high query rates or unusual domains not matching organizational assets.

  - **Document and escalate malicious indicators:** If the investigation reveals connections to multiple Itarian domains without corresponding user activity, escalate to Tier 2 analysts. A lack of legitimate access logs paired with the detected behavior raises the likelihood of compromise.

  ### Prioritization

  The alert is of medium severity due to potential data exfiltration and system compromise from unauthorized remote access. While the likelihood of malicious abuse exists, it may be contextually specific to environments utilizing the Itarian RMM tool. This behavior is not widely weaponized; however, it warrants prompt investigation, especially in sensitive areas of the network.

  ### Blind Spots and Assumptions

  Detection may be evaded by legitimate use of Itarian or network segmentation practices limiting visibility. Reliable detection requires comprehensive monitoring of DNS resolution and appropriate log source configurations, such as Windows Filtering Platform logs. Common scenarios include legitimate system management operations from IT teams that could trigger this alert. A related detection to consider is monitoring for abnormal user behaviors or elevated privileges in conjunction with this network activity to enhance detection confidence.

