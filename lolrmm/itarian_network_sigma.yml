note: |
  ### Technical Context

  This rule detects network connections to known domains associated with the Itarian Remote Monitoring and Management (RMM) tool, specifically designed for IT service management and remote support. The likely attacker objective could be unauthorized access to enterprise systems or data aggregation through a malicious use of legitimate tools. This activity relates to the MITRE ATT&CK technique "Remote Template Injection" (T1219).

  The primary telemetry source is Windows network connection logs that capture outbound connections, specifically tracking DNS queries or IP addresses connected to the Itarian domains. If malicious, this behavior could enable an adversary to exploit the RMM tool for persistence or lateral movement within the network. This detection does not confirm that a malicious action is occurring; it merely indicates potential usage of an RMM tool that could be either benign or malicious.

  ### Investigation Steps

  - **Identify network connection logs:** Check for Security Event ID 5156 to locate allowed network connections on Windows hosts. Look for connections to 'mdmsupport.comodo.com' or 'remoteaccess.itarian.com'.

  - **Review outgoing traffic behavior:** Analyze the volume and frequency of connections to the identified domains. Benign connections may show regular patterns related to legitimate maintenance tasks, while sudden spikes could indicate malicious activity.

  - **Verify process associations:** Use Sysmon Event ID 3 to correlate process creation with the network connections identified. Ensure the process (e.g., Itarian executable) is expected for the environment. Malicious indicators could be unusual paths or obfuscated file names.

  - **Examine system role relevance:** Assess if the host engaging with RMM domains is a support or administrative system. Legitimate IT support desks and workstations may regularly interact with these domains, whereas unexpected devices should raise suspicion.

  - **Check for endpoint logging:** Validate file activities or remote access sessions using Event ID 4688 (process creation) or tools like Sysmon. Create a baseline of what normal RMM usage looks like within your organization to compare against flagged activity.

  ### Prioritization

  This alert is of medium severity due to the potential impact on systems that might be critical for operations such as IT administration or support. The likelihood of malicious abuse is moderate, given that legitimate use exists; however, attackers frequently leverage RMM tools for nefarious purposes.

  ### Blind Spots and Assumptions

  Detection can be limited by the lack of network logging on non-standard or less monitored ports if the RMM tool uses alternate channels. Required log sources must encompass full DNS and network connection monitoring to provide reliable detection of both legitimate and questionable traffic. Legitimate activities like scheduled remote updates or maintenance tasks may trigger this alert. A related detection could include monitoring for unusual process behavior associated with the RMM software, such as unauthorized access attempts or unusual command executions.

