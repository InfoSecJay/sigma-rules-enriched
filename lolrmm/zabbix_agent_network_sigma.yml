note: |
  ### Technical Context

  This Sigma rule detects network connections initiated by the Zabbix Agent Remote Monitoring and Management (RMM) tool, which may be leveraged by adversaries for remote control and system monitoring. The likely attacker objective is to maintain presence and control over compromised systems or to exfiltrate data. This behavior aligns with MITRE ATT&CK techniques for remote system control, specifically "Remote Services" (T1219).

  The primary telemetry sources for this detection include Windows network connection logs that capture the destination hostnames. Malicious exploitation using this tool could lead to unauthorized access and data breach. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of Zabbix Agent may also trigger this rule.

  ### Investigation Steps

  - **Review connection logs for destination hosts**: Check for connections in network logs (Event ID 5156) that target domains ending in "user_managed" or "zabbix.com". Connections to known legitimate hosts should not be flagged.

  - **Validate active Zabbix Agent installations**: Check if Zabbix Agent is installed and properly configured on monitored assets. Validate using PowerShell command to list services: `Get-Service -Name ZabbixAgent` (check for status 'Running').

  - **Identify unusual connection patterns**: Look for atypical outbound connections from critical assets (e.g., Domain Controllers, DB servers) in firewall logs (Event IDs 5158 or 5157) to "user_managed" or "zabbix.com".

  - **Correlate with system events**: Cross-reference connection attempts with Windows Security Event ID 4688 for process creation to identify if processes associated with Zabbix Agent are initiating unauthorized connections.

  - **Check for abnormal authentication events**: Investigate authentication logs (Event ID 4624) for anomalies where credentials of unprivileged users are used to initiate connections to aforementioned domains.

  ### Prioritization

  This alert is of medium severity. The impact may vary based on the asset's role; a compromised network management server or a critical system raises the risk significantly. The likelihood of malicious usage is moderate, as Zabbix tools can be weaponized by adversaries, particularly in environments where monitoring tools are prevalent.

  ### Blind Spots and Assumptions

  Detection may have limitations if legitimate administrative actions trigger similar alerts. Continuous monitoring is essential; therefore, ensuring Windows Firewall logs and Security logs are enabled is crucial for reliable detection. Legitimate usage of Zabbix Agent for IT management might trigger the alert, complicating identification. Deploying companion rules for monitoring related remote access tools can enhance overall coverage against RMM threats.

