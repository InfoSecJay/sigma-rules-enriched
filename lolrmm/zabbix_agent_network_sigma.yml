note: |
  ### Technical Context

  This Sigma rule detects outbound network connections utilizing the Zabbix Agent Remoting Management Tool (RMM). The behavior signals potential attempts to communicate with unauthorized or unconventional endpoints, which may indicate reconnaissance activities or command-and-control traffic by an adversary. Likely objectives of such activity include data exfiltration or establishing a backdoor. This detection maps to MITRE ATT&CK Tactic: Command and Control (TA0011) and Technique: Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs, identifying connections to hostname patterns such as 'user_managed' or 'zabbix.com'. If malicious, successful use of this tool can lead to unauthorized monitoring or control over systems. However, this detection alone does NOT confirm malicious intent, as legitimate uses of the Zabbix Agent may trigger similar alerts.

  ### Investigation Steps

  - **Identify the connection details:** Review Windows Security Event ID 5156 for network connection events associated with the Zabbix agent. Look for destination IP addresses corresponding to 'zabbix.com' or similar patterns. Confirm if the connection is outbound.

  - **Inspect the process tree:** Check Sysmon Event ID 1 (Process Creation) for any spawn processes related to the Zabbix agent around the time of the alert. Validate if the parent process initiated by a legitimate monitoring tool or user.

  - **Analyze user behavior:** Investigate the user account initiating the connection through Windows Security Event ID 4624 (Logon) to verify if this user regularly interacts with Zabbix in a legitimate capacity. Compare access patterns with a baseline of legitimate use.

  - **Correlate with system roles:** Determine the host role of the system generating the alert. Servers or workstations with no expected Zabbix activity should raise the investigation priority. Look for management servers or critical infrastructure that should not have Zabbix interactions.

  ### Prioritization

  This alert should be treated with medium priority due to its ability to signal potential command-and-control communication. Systems engaging in unexpected external communications could indicate hostile activity. The nature of the Zabbix tool means this behavior could be weaponized by adversaries looking to maintain communication with compromised assets.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion via the use of encrypted channels, which may obscure actual payloads. Reliable detection depends on the full deployment of Windows logs capturing network activity. Legitimate internal monitoring might trigger this alert if Zabbix is in authorized use cases, especially in environments where agent configurations are common. Companion detection could include monitoring for anomalous file creation patterns related to RMM tools (e.g., Event ID 4656 for access attempts on sensitive files).

