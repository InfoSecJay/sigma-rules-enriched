note: |
  ### Technical Context

  This Sigma rule detects outbound network activity to Zabbix domains, which can indicate the use of the Zabbix Agent for Remote Monitoring Management (RMM) as an alternative to legitimate administrative tools. Attackers may leverage this tool for persistence, data exfiltration, or command-and-control (C2) communication, aiming to maintain access to compromised systems. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), with technique **Application Layer Protocol** (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically monitoring the destination hostname for any requests directed to Zabbix domains. If the detected network activity is malicious, it could signify an unauthorized attempt to communicate with an external C2 infrastructure. However, this detection does NOT confirm that the activity is malicious on its own, as legitimate system management using Zabbix may also generate similar traffic.

  ### Investigation Steps

  - **Identify Zabbix traffic: ** Examine Windows network connection logs for Event ID 5156 in Windows Firewall logs or filtered Sysmon Event ID 3 entries showing outbound connections to *.zabbix.com. Confirm the time and frequency of requests.

  - **Correlate with process execution: ** Review process creation logs, focusing on Event ID 4688 or Sysmon Event ID 1, to identify any processes associated with legitimate or malicious Zabbix activity. Check whether the initiating process is part of an authorized Zabbix Agent installation.

  - **Analyze the destination behavior: ** Validate the external IP addresses and associated hostnames in the connections to ensure they match legitimate Zabbix infrastructure. Investigate whether there has been a recent change to network configurations that may include new or unapproved Zabbix Agent deployments.

  - **Assess legitimate usage patterns: ** Search for documentation on authorized use of the Zabbix Agent within your environment. Confirm any existing legitimate communication with Zabbix servers by cross-referencing connection logs against expected schedules or maintenance procedures.

  - **Check endpoint role and context: ** Determine the asset's role and criticality within the environment. For example, outbound connections from management servers or administrative workstations to Zabbix domains could indicate legitimate activity, while unexpected connections from user workstations warrant further investigation.

  ### Prioritization

  This alert has medium severity due to the potential security implications of unauthorized system management or data exfiltration. Systems configured with Zabbix Agent are often key operational assets, making any anomalous network activity a significant concern. However, the likelihood of malicious abuse depends on whether the destination usage deviates from established norms.

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion through obscuring outbound connections using VPNs or proxies that do not utilize Zabbix domains. Reliable detection requires configured logging for both network connection events and process creation events. Legitimate activities may also trigger this alert during scheduled maintenance or monitoring events. A related detection could involve monitoring unusual internal traffic patterns towards the Zabbix Agent, reinforcing awareness of unauthorized tool usage.

