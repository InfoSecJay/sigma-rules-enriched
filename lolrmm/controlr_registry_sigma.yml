note: |
  ### Technical Context

  This Sigma rule detects suspicious registry activity related to the installation or modification of the ControlR Remote Monitoring and Management (RMM) tool. The likely attacker objective includes maintaining persistence within an environment, facilitating remote access, or evading detection. The detection maps to the MITRE ATT&CK framework under the Command and Control tactic (TA0011) and the technique T1219 (Remote Access Software).

  The primary telemetry source is Windows registry event logs, specifically targeting changes to the Uninstall registry key entries for ControlR. If malicious, the security impact includes unauthorized remote access to systems, potential data exfiltration, and persistence mechanisms established by an attacker. It is important to note that this detection does NOT confirm that an incident is occurring on its own; further investigation is necessary to determine the nature of the activity.

  ### Investigation Steps

  - **Review registry activity logs**: Check Windows Event Log for registry change events (Event ID 4657) containing paths related to 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ControlR' to confirm the modification details, specifically looking for unusual timestamps or user accounts.

  - **Correlate user logins**: Verify user account activity around the same time as the registry modifications by reviewing Security Event ID 4624 to check if an unfamiliar or unauthorized account executed the changes.

  - **Assess host role**: Identify if the affected host is a critical asset (e.g., server or workstation) that would typically not require the ControlR tool for legitimate business processes. Legitimate installations should be documented and approved.

  - **Identify additional software indicators**: Look for processes related to ControlR (e.g., 'ControlR.exe') in the process creation logs (Sysmon Event ID 1) to assess if it's actively running and being utilized inappropriately.

  - **Investigate network communications**: Analyze outbound traffic logs (from firewall or proxy data) for connections to known ControlR IP addresses or domains. Suspicious traffic patterns may indicate that the tool is being used for unauthorized remote access.

  ### Prioritization

  This alert has a medium severity level, as the presence of ControlR on non-administrative systems can indicate potential misuse by an adversary to establish ongoing access. Given that RMM tools like ControlR are often weaponized in intrusions, the likelihood of malicious abuse necessitates timely investigation.

  ### Blind Spots and Assumptions

  Limitations of detection include the potential for evasion techniques such as legitimate use of ControlR software by authorized personnel, which could trigger the same alert. Reliable detection requires ensuring that appropriate logging is enabled for registry events and that potential benign uses of ControlR are well-documented. Companion detections, such as monitoring for abnormal outbound connections (e.g., unusual DNS requests or proxy logs), can enhance coverage and help assess the legitimacy of the observed registry changes.

