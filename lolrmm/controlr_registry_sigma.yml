note: |
  ### Technical Context

  This Sigma rule detects changes to specific registry keys related to the ControlR Remote Monitoring and Management (RMM) tool on Windows devices. An attacker may use this tool to gain remote access for purposes such as data exfiltration, lateral movement, or establishing persistent access within a compromised environment. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **T1219: Remote Access Software**.

  The primary telemetry source is Windows Registry Event logs, specifically monitoring for changes to the Uninstall key related to ControlR. If malicious, such behavior indicates an unauthorized application installation or configuration change that could facilitate further exploitation of the network. It is important to note that this detection does NOT necessarily confirm malicious activity on its own, as legitimate use of the ControlR tool may trigger similar alerts.

  ### Investigation Steps

  - **Check Registry Key Changes:** Review Windows Registry Event logs for Event ID 4657. Look for modifications to the key paths `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ControlR` and `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\ControlR (*)`. Legitimate changes should come from known admin users or processes.

  - **Verify User Context:** Identify the user account making the registry change by cross-referencing Event ID 4688 (Process Create) with the logged user context. Look for processes initiated by legitimate system administrators versus suspicious or unknown user accounts.

  - **Determine Process Offending:** Capture and analyze related process creation events (Event ID 4688) and ensure they spawned from expected applications. Malicious indicators may include instances where unexpected executables such as `ControlR.exe` are run from temporary directories or user profiles.

  - **Assess System Roles:** Evaluate the asset's role within the enterprise; critical systems such as servers should have stricter monitoring and usage policies for RMM tools. Document any instances of ControlR running on non-administrative devices.

  - **Identify Historical Usage:** Query the device’s installation history to confirm if ControlR was previously installed. Check Windows Installer logs or Event ID 11707 for related installations which could indicate authorized deployment versus a potential breach.

  ### Prioritization

  This alert is of medium severity due to the potential impact of unauthorized remote access on critical systems. While ControlR could be used legitimately, its function is often abused by adversaries for remote management, making it a common target in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection efficacy is limited if logs for registry changes are not configured appropriately or stored long-term. Legitimate IT activity that could trigger this alert includes authorized installations or updates of ControlR by sysadmins. A related detection to consider is tracking unauthorized installation of other RMM tools, enhancing overall visibility of potentially malicious remote access activity.

