note: |
  ### Technical Context

  This Sigma rule detects potential activities associated with the SysAid Remote Monitoring and Management (RMM) tool, specifically processes that are initiated by its executable (`IliAS.exe`). The likely attacker objective is that adversaries could leverage this tool for remote administration or lateral movement within a network. This behavior aligns with the MITRE ATT&CK tactic of **Command and Control** (TA0011) and technique **Remote Access Tools (T1219)**.

  The primary telemetry source for this detection is Windows process creation events, specifically capturing instances where the `IliAS.exe` executable is the parent or the image being executed. If malicious, this activity may allow an adversary to control the infected system remotely, making it a critical risk. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of SysAid may exhibit the same process behavior.

  ### Investigation Steps

  - **Check event logs for process creation:** Review Security Event ID 4688 for process creation events noting `IliAS.exe` as the ParentImage or Image. Compare timestamps and context to known SysAid operations.

  - **Assess process parentage:** Investigate other processes spawned from `IliAS.exe` to identify any suspicious child processes (e.g., unexpected executables launched for remote access). Gather evidence from Sysmon Event ID 1.

  - **Identify legitimate SysAid usage:** Confirm whether `IliAS.exe` execution matches known maintenance windows or procedures for SysAid use. Review IT logs or ticketing systems for planned maintenance related to SysAid.

  - **Evaluate unusual network activity:** Analyze network logs for outliers, such as unexpected connections emanating from the device hosting `IliAS.exe`. Cross-reference with firewall logs to identify foreign IP connections.

  - **Correlate with user activity:** Review user activity logs from the affected endpoint for recent logins or administrative activities that correspond with the process execution times.

  - **Document high-confidence malicious indicators:** Flag any instances where `IliAS.exe` is associated with abnormal network behavior or child processes that are known to be malicious, such as known hacking tools or malware payloads.

  ### Prioritization

  This alert carries a medium severity as the affected system could be integral to the environment and capable of remote access. While legitimate use of SysAid is common in enterprise settings, the tool can also be weaponized by attackers for covert operations.

  ### Blind Spots and Assumptions

  The detection may be evaded if the attacker renames the malicious executable or utilizes other legitimate RMM tools. Required log sources include complete Windows Event logs for process tracking and Sysmon configurations to ensure comprehensive process visibility. Legitimate administrative tasks may trigger this alert, especially during regular maintenance activities. A companion detection for anomalous lateral movement will bolster coverage against misuse of RMM tools.

