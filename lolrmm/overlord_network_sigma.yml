note: |
  ### Technical Context

  This rule detects network connections targeting the Overlord RMM (Remote Management and Monitoring) tool via specific domains associated with Ngrok and certain malicious sites. Such behavior indicates an attacker may be using the Overlord RMM tool to establish remote access for control over compromised systems. The relevant MITRE ATT&CK tactic is Command and Control (T1219), which encompasses remote access tools used for maintaining persistent access covertly.

  The primary telemetry sources are Windows network connection logs, particularly those reflecting outgoing connections to suspicious hostnames. If the detected activity is malicious, it could lead to unauthorized access, data exfiltration, or lateral movement within the network. This detection does NOT confirm that the Overlord tool is malicious on its own, nor does it indicate that the network activity is inherently dangerous without further contextual review.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) to identify outbound connections to matching domains, specifically observe Source IP, Destination IP, and Timestamp for anomalies.

  - **Validate legitimate usage:** Cross-reference detected connections against known business roles or usage of the Overlord RMM tool. Confirm if users or teams associated with IT support or remote administration are expected to access these domains.

  - **Identify high-confidence malicious indicators:** Look for any associated executable files or script execution related to Overlord RMM on the endpoint. Monitor for signs of unusual behavior in Process ID (PID) or potential parent processes tied to legitimate tools.

  - **Examine other outbound connection anomalies:** Investigate any other unusual outbound connections within the same time frame. Analyze the frequency and volume of traffic to these domains and check endpoint logs for simultaneous connections.

  - **Check host role impact:** Assess the criticality of the impacted asset. Investigate if sensitive data could be at risk if the alert is confirmed as malicious, particularly focusing on servers or endpoints handling sensitive operations.

  ### Prioritization

  This alert holds a medium severity due to the potential security impact on critical systems. The likelihood of malicious use is moderate, especially given the nature of the detected tool being designed for remote access. While not all instances of Overlord RMM indicate malicious intent, the specificity of the domains signals possible weaponization by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate tools for remote access, which can cause false positives. Full coverage requires comprehensive logging of outbound network traffic from Windows hosts. Legitimate scenarios include authorized IT personnel using Overlord for system maintenance. Additional detections of established connections to other known Command and Control frameworks could bolster coverage and reduce inconsistencies.

