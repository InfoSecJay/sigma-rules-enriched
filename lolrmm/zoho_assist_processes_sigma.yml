note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Zoho Assist remote management tool, specifically those that may be manipulated by an adversary for command and control or remote access purposes. The likely objective of an attacker utilizing Zoho Assist would be to gain unauthorized access to systems for data exfiltration or lateral movement within the environment. This detection aligns with the MITRE ATT&CK tactic of "Command and Control" (T1071) and technique T1219, which focuses on remote access tools.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the use of these processes would indicate unauthorized remote access, potentially compromising sensitive data or system integrity. It is important to note that this detection does not confirm malicious intent on its own, as legitimate administrative tasks may also trigger these alerts.

  ### Investigation Steps

  - **Check process creation logs for alerts:** Use Security Event ID 4688 and Sysmon Event ID 1 to identify instances of the detected Zoho processes, including `toolsiq.exe` and `zaservice.exe`. This will help confirm if they were executed and by which user.

  - **Analyze parent process relationships:** Identify the parent process associated with any alerts found. For instance, legitimate `powershell.exe` usage may be benign, while unexpected parent processes may indicate suspicious behavior.

  - **Review user account behavior:** Look for alerts triggered by unusual user accounts executing these applications. Investigate if these accounts have admin privileges or unusual login patterns.

  - **Validate legitimate usage:** Familiarize yourself with normal operational practices within your organization regarding Zoho Assist usage. If a helpdesk or support team commonly uses it, their expected activity can provide context for legitimate alerts.

  - **Identify high-confidence malicious indicators:** Focus on any alerts where `ZA_Access.exe` or `connect.exe` show signs of unusual activity (e.g., executing parameters associated with unauthorized remote access) or are executed by atypical or compromised user accounts.

  - **Correlate with network traffic:** Review firewall and proxy logs for outbound connections related to Zoho Assist, such as `*.zoho.com`. Look for unusual SNI or HTTP methods indicating data exfiltration attempts.

  ### Prioritization

  The alert severity is medium as it indicates potential unauthorized remote access, which could lead to significant data breaches if exploited. However, the likelihood of false positives exists due to legitimate administrative use of Zoho Assist in enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not capture all process creation events or by the omission of Sysmon logging. Possible evasion techniques include renaming legitimate executables or executing processes from non-standard paths. Legitimate uses, such as technical support or admin functions, may trigger this alert, leading to false alarms. Companion detections focusing on unusual remote access tool usage (e.g., TeamViewer, AnyDesk) can help strengthen coverage and contextual understanding of remote access activity.

