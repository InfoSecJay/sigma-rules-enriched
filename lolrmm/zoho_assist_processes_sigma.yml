note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Zoho Assist remote management tool. The behavior indicative of potential misuse includes unusual spawning of these processes, potentially signaling unauthorized remote access or system manipulation by an adversary. The likely attacker objective could be to exploit remote desktop or administration capabilities to compromise system integrity or exfiltrate sensitive information. This detection corresponds with the MITRE ATT&CK technique "Remote Services: RDP" (T1219).

  Primary telemetry sources include Process Creation logs, specifically Windows Event ID 4688 and Sysmon Event ID 1, which capture new process creation events along with their attributes. If malicious, this activity can lead to unauthorized access and control over the targeted endpoint. However, this detection does NOT confirm the presence of malicious intent solely based on execution; legitimate usage of Zoho Assist could trigger similar alerts.

  ### Investigation Steps

  - **Identify process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for the presence of processes like 'toolsiq.exe', 'ZA_Access.exe', or similar listed in the Sigma rule. Any new instances of these processes should be scrutinized for context.

  - **Assess parent-child process relationships:** Check for any processes spawned by 'toolsiq.exe', 'zaservice.exe', or other related executables. Malicious activity often involves unusual parent-child relationships that may not follow typical patterns.

  - **Evaluate execution context:** Look for credentials or user account tags associated with the process. Events triggered by non-administrative user accounts or from unusual hosts may indicate an attempted attack.

  - **Review user activity logs:** Correlate user activity leading up to the process creation, including logon events (Event ID 4624). A legitimate administrative account may trigger this process, but any anomalies (e.g., time of day, location) warrant further investigation.

  - **Check for unusual network connections:** Inspect for outbound connections from the processes to unknown IP addresses or domains, particularly with tools like 'Sysmon' (Event ID 3). Legitimate sessions would typically direct to known internal resources.

  ### Prioritization

  This alert should be treated with medium priority. The severity is heightened if the affected system is critical (e.g., a server hosting sensitive applications) and if there is a high likelihood of adversaries exploiting remote management tools. Since abuse of RMM tools is commonly weaponized in attacks, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  This detection could be evaded if an attacker uses different remote management tools not covered in the rule or employs legitimate accounts to initiate processes, leading to false negatives. Reliable detection requires sufficient logging from Windows Security and Sysmon. Legitimate corporate remote administration activities may also trigger the alert. A companion detection to monitor for attempted logins or credential requests leading to the execution of these processes could provide complementary context for the assessment.

