note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Zoho Assist remote monitoring and management (RMM) tool, such as `toolsiq.exe`, `zaservice.exe`, and `ZMAgent.exe`. The likely attacker objective is to gain remote access or maintain persistence on compromised systems. This behavior primarily falls under the MITRE ATT&CK tactic of "Execution" and the technique ID T1219 (Remote Access Software). The primary telemetry sources are Windows process creation logs, particularly Event ID 4688 and Sysmon Event ID 1. If this activity is malicious, the impact could include unauthorized remote access to sensitive systems and data. It is important to note that the detection of these processes does NOT confirm malicious use on its own, as they can be utilized for legitimate purposes within an organization.

  ### Investigation Steps

  - **Verify process origins**: Check the file path of detected processes using `Image` field data in Event ID 4688. Legitimate installations of Zoho Assist typically reside in `C:\Program Files\Zoho\`. Any instances found outside this path should be treated as suspicious.

  - **Correlate with user activity**: Review Windows Security Event ID 4624 (Logon) for concurrent logins by the user executing the detected processes. Check for unusual login patterns or logins from unexpected locations/devices.

  - **Evaluate process parentage**: Identify the parent process of the detected processes using Event ID 4688's `ParentImage` field. Confirm if it is initiated by a known legitimate service or user process, or if it appears to be stemming from a suspicious source such as `cmd.exe` or PowerShell.

  - **Identify high-confidence malicious indicators**: Look for multiple instances of process execution under potentially abusive conditions, such as execution of both `ZMAgent.exe` and `toolsiq.exe` in rapid succession within a brief timeframe, which may suggest automated or scripted activity.

  - **Review network telemetry**: Check firewall or proxy logs for outbound network connections initiated by detected processes, especially for communications to unknown external IPs or domain names which could indicate data exfiltration or remote control.

  - **Assess legitimate use scenarios**: Determine if the Zoho Assist tool is widely used within the organization for authorized remote support. Review asset inventory or internal policies to confirm expected operational use cases.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on systems where the Zoho Assist tool is misused. The likelihood of abuse is moderate, especially in environments where remote access tools are implemented. This behavior is not commonly weaponized but can be leveraged for persistent access by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of Zoho Assist, leading to false positives. Ensuring comprehensive logging and monitoring configurations for process creations and remote access tool logs is essential for reliable detection. Legitimate use of RMM tools in managed IT environments may trigger this alert. A related detection that enhances coverage is monitoring for abnormal lateral movement patterns that correspond with the execution of remote access tools.

