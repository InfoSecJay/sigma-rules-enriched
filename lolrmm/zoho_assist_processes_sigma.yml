  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Zoho Assist Remote Monitoring and Management (RMM) tool. The likely attacker objective involves using Zoho Assist for unauthorized remote access or control over compromised systems, thereby facilitating data exfiltration or further exploitation. This behavior corresponds with the MITRE ATT&CK technique for Remote Services (T1219).

  The primary telemetry source is Windows process creation logs, particularly focusing on events such as Security Event ID 4688 or Sysmon Event ID 1 for process execution details. If malicious, the use of Zoho Assist can lead to significant security impacts, including unauthorized access to sensitive data. It’s important to note that this detection does NOT confirm malicious intent solely based on the presence of the specified processes, as these tools can be used legitimately.

  ---

  ### Investigation Steps

  - **Check for unusual process execution:** Review Security Event ID 4688 logs for any processes launching from known paths of Zoho Assist executable files (e.g., `C:\Program Files\Zoho\`, `C:\Users\<User>\AppData\Local\Zoho\`). Note any unexpected user accounts launching these processes.

  - **Identify parent process relationships:** Use Sysmon Event ID 1 to identify the parent process for instances of Zoho-related executables. Legitimate activity typically involves known administrative or support personnel as parents. Malicious activity may show unusual parent-child execution paths, indicating potentially harmful chaining.

  - **Correlate with user activity:** Investigate user logon history matching the execution timestamps of the detected processes in Windows Security Event ID 4624. Unscheduled remote support or access incidents outside standard operating hours may indicate problematic usage.

  - **Assess network connections:** Examine network traffic logs for outgoing connections to external IPs during the execution of the detected Zoho processes. Look for unexpected communication patterns, especially towards known malicious or unfamiliar domains.

  - **Review for suspicious remote sessions:** Investigate any active remote desktop sessions or connections initiated from systems running the Zoho Assist tool. Use remote connection logs (Event ID 20 and 21 in Remote Desktop Services) to find any unauthorized access attempts.

  - **Document any high-confidence malicious indicators:** If any file properties of the executable show signs of modification (e.g., timestamps in the future or mismatched publisher) or if external IP connections are to known C2 servers, document these as high-confidence indicators of compromise (IOCs).

  ---

  ### Prioritization

  The alert's severity is medium due to the potential risks associated with RMM tools like Zoho Assist being misused for unauthorized access. The likelihood of exploitation is moderate, as attackers often weaponize such tools for remote access following an initial compromise. However, the alert may also trigger due to legitimate support activities within enterprise environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the use of obfuscated process names or renamed executable files by attackers seeking to evade detection. Effective detection requires that Sysmon and Security logs are correctly configured to capture all necessary events. Additionally, legitimate remote support tools and services (e.g., IT support teams using Zoho Assist for authorized remote management) may inadvertently trigger this alert. A companion detection to consider is monitoring for remote access tool installations via Windows Event ID Install/Uninstall events, which can reinforce overall visibility of such activities.

