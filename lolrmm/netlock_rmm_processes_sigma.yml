note: |
  ### Technical Context

  This rule detects process activities from the NetLock RMM (Remote Monitoring and Management) tool, specifically when spawned from known parent processes associated with its installation or user execution. The likely attacker objective may include unauthorized system management or access through the use of potentially compromised RMM tools, which could facilitate lateral movement or remote control. This behavior aligns with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry sources include Windows process creation logs, particularly those captured via Security Event ID 4688 or Sysmon Event ID 1. If malicious, the security impact could include unauthorized access or control over a system, leading to data breaches or system manipulation. Importantly, this detection does NOT confirm malicious activity on its own, as NetLock RMM may be legitimately used in the environment.

  ### Investigation Steps

  - **Verify process family and parentage:** Check for Windows Process Creation logs (Event IDs 4688 or Sysmon ID 1) for processes like `NetLock_RMM_User_Process.exe`. A legitimate parent process is expected to be one of the known installers or user executables mentioned above.

  - **Audit recent installations of software:** Review installation logs in the application event log to determine if NetLock RMM was legitimately installed recently. Valid deployments might include a service desk ticket or documentation.

  - **Check for remote connections:** Inspect for active remote sessions initiated by `NetLock_RMM_User_Process.exe` or related binaries. Look for unusual network connections in Windows Firewall logs or through network traffic analysis tools that could indicate misuse (e.g., unusual outbound connections).

  - **Look for user context:** Determine the user account context under which the process is running. Examine security logs (Event ID 4624) to assess whether the account is privileged or if there’s an alignment with expected administrative use.

  - **Search for suspicious command-line arguments:** Analyze command-line arguments associated with the detected processes in Sysmon logs. Look for anomalies, such as unusual flags or parameters that deviate from standard operational patterns.

  ### Prioritization

  The alert severity is assessed as medium, as NetLock RMM tools can be abused for malicious purposes. The impact could be significant if an attacker gains unauthorized remote access. However, because this tool may be legitimately used by IT departments for maintenance, context is crucial in evaluating the threat.

  ### Blind Spots and Assumptions

  Detection limitations may arise if an attacker modifies the NetLock RMM binaries or runs them under a different name to evade detection. Reliable detection requires appropriate logging configurations for process creation events and may also need comprehensive monitoring of network communications. Additionally, legitimate remote support activities could trigger this alert, such as a scheduled maintenance window. A related detection to strengthen coverage would be monitoring for unusual outbound connections from known RMM IP addresses, which could indicate unauthorized use.

