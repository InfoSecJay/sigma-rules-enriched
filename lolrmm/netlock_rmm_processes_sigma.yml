  ### Technical Context
  This detection rule identifies potential process activity associated with the NetLock Remote Monitoring and Management (RMM) tool by monitoring the creation of specific processes commonly associated with the tool. The primary objective of rules like this is to highlight unauthorized or suspicious use of the RMM software, which could indicate that an attacker is leveraging legitimate administrative tools to maintain persistence or to conduct malicious activities within the network.

  Attackers often seek to exploit legitimate tools such as NetLock RMM for remote administration, as they can facilitate unauthorized access, data exfiltration, or lateral movement within an enterprise environment. By using tools familiar to IT administrators, attackers can reduce the chances of detection by blending in with normal operational activities. The relevant MITRE ATT&CK tactics include **Execution (TA0002)** and **System Services (T1219)**, which describe how attackers may use legitimate software for malicious purposes.

  Primary data sources for detecting this activity include Windows process creation events, which provide insights into software execution on endpoints. Monitoring these events allows security teams to identify potentially unauthorized installations or executions of RMM tools.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the logs for any instances of the processes `NetLock_RMM_Agent_Installer.exe`, `NetLock_RMM_User_Process.exe`, and `NetLock_RMM_User_UAC.exe`. Look for suspicious timestamps, user accounts, or unusual process parent-child relationships.

  - **Correlate with User Activities:** Determine whether the creation of these processes aligns with expected administrative activities. Validate whether the user account associated with the process creation has legitimate reasons to use the NetLock RMM tools.

  - **Analyze Network Traffic:** Monitor for any outbound connections or unusual network activities linked to the machine running these processes. Pay close attention to connections to remote hosts that may indicate unauthorized access or data exfiltration attempts.

  - **Inspect Endpoint Security Alerts:** Check if the EDR or antivirus solution flagged any of the identified processes as malicious or suspicious. This can provide additional context and help to determine if the activity was legitimate or part of a compromise.

  ### Prioritization
  The severity of this alert is considered medium due to the potential risks posed by unauthorized use of RMM tools, which can lead to significant breaches of confidentiality and integrity within the organization. While the tool can be used legitimately, the likelihood of its misuse in a compromise scenario warrants close attention from security teams.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the environment does not adequately log or monitor process creation events on all endpoints, particularly those where unauthorized RMM tools might be installed. This rule assumes that processes related to the NetLock RMM tool are not particularly common in the environment; if they are widely used for legitimate purposes, the rule may generate false positives. Proper logging configurations and access control measures are needed to ensure that endpoint activity is reliably captured for effective monitoring.

