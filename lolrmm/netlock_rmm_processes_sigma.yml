note: |
  ### Technical Context

  This rule detects the execution of processes associated with the NetLock RMM Remote Monitoring and Management tool, specifically looking for instances where these processes are initiated by related installer or user processes. The likely attacker objective may include establishing persistent access or managing compromised systems covertly using RMM functionality. The relevant MITRE ATT&CK tactics include **Command and Control (TA0011)**, specifically the technique **Remote Access Software (T1219)**. The primary telemetry sources are Windows process creation logs (Security Event ID 4688) and Sysmon Event ID 1, which capture information on process execution. If malicious, this activity could indicate unauthorized remote management that bypasses typical security measures. However, this detection does NOT confirm malicious intent or compromise on its own without further evidentiary context.

  ### Investigation Steps

  - **Check process execution logs:** Review Windows Security Event ID 4688 for instances of `NetLock_RMM_Agent_Installer.exe`, `NetLock_RMM_User_Process.exe`, or `NetLock_RMM_User_UAC.exe`. Note the parent process to identify if it belongs to a legitimate source (e.g., IT support instance) or an unusual parent.

  - **Validate expected behavior:** Confirm legitimate use cases for NetLock RMM processes. Typical activities may involve admin users executing the RMM tool for maintenance tasks, which should be tracked and reported via an internal ticketing system.

  - **Examine Network Connections:** Use network logs (e.g., Windows Firewall or network monitoring tools) to identify if these processes are establishing outbound connections to known malicious IP addresses or unusual domains. Look for traffic associated with RMM command and control.

  - **Identify malicious indicators:** Search for unusual command line arguments in the process logs associated with the detected executables, particularly those including obfuscation or suspicious flags that deviate from normal usage.

  - **Analyze file creation artifacts:** If the RMM tool downloaded or created any files (e.g., temporary files, logs), confirm their locations and timestamps. Investigate any anomalies that deviate from standard file creation patterns regarding NetLock.

  - **Review system access controls:** Check Active Directory or system policies for unexpected users operating RMM tools or processes. Investigate accounts that are not tied to IT functions or third-party support to help identify potential unauthorized access.

  ### Prioritization

  The alert is of medium severity due to the potential for unauthorized access to critical systems through RMM capabilities. While legitimate use exists, the likelihood of abuse, particularly in environments lacking strict user access controls, warrants prompt investigation due to its narrow focus on established RMM tooling, which is often weaponized in sophisticated attacks.

  ### Blind Spots and Assumptions

  Detection may be limited due to legitimate administrative usage of the NetLock RMM tool, leading to false positives. It is crucial to ensure that logging is appropriately configured for process creation events with adequate coverage for Windows event logging. The alert could also be triggered by other legitimate remote support tools that might utilize similar nomenclature. Companion detections, such as monitoring for suspicious outbound connections initiated by RMM tools, could provide supplementary evidence of anomalous behavior.

