note: |
  ### Technical Context

  This rule detects the execution of the Beacon agent, a tool often associated with Remote Monitoring and Management (RMM) solutions that can be misused for command-and-control purposes by malicious actors. The primary objective of an attacker using this tool is to establish remote access to a compromised system, enabling further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK technique for Remote Access Tools (T1219).

  The primary telemetry source for this alert is Windows process creation logs, particularly focusing on events that track the initiation of processes. A malicious execution of the Beacon agent could lead to significant security impacts, including unauthorized access and control over systems within the network. However, this detection does NOT confirm malicious intent or activity by itself, as the Beacon agent could also be part of legitimate maintenance operations.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 and Sysmon Event ID 1 for process creations involving `beacon-agent.exe`. Look for parent process relationships indicating user-initiated actions vs. automated tasks.

  - **Validate legitimate usage:** Identify if `beacon-agent.exe` is in use as part of business operations. Check the company’s software inventory for documented usage of the Synertek RMM tool, which may indicate legitimate activity.

  - **Review process parent-child relationship:** Investigate the parent process of `beacon-agent.exe`. If the parent is an unusual or unexpected process, such as a command line script that doesn't fit typical operational patterns, it may indicate malicious behavior.

  - **Analyze network traffic:** Check recent network connections associated with `beacon-agent.exe` using Windows Firewall logs or network traffic analysis tools. Look for suspicious outgoing traffic patterns to uncommon IP addresses that may indicate C2 communications.

  - **Inspect file system and registry changes:** Monitor for any unusual file creations or modifications in directories typically used by RMM tools (e.g., Program Files) or registry entries related to `beacon-agent.exe`. Malicious activity may include unexpected persistence methods.

  ### Prioritization

  This alert should be considered medium severity due to the potential for significant impacts if the RMM tool is being misused for unauthorized access. The likelihood of malicious usage is moderate, as adversaries frequently weaponize legitimate remote management tools for exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate instances of Beacon, potentially resulting in false positives. Ensuring comprehensive logging, including process creation and network traffic to and from management tools, is essential for reliable detection. Legitimate administrative tasks could trigger this alert if they involve authorized RMM workflows. Companion detections, such as outbound connections to known malicious IP addresses, can strengthen validation against false positives.

