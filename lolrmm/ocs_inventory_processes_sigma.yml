note: |
  ### Technical Context
  This detection rule is designed to identify potential malicious activity associated with the OCS Inventory RMM (Remote Monitoring and Management) tool. The OCS Inventory tool is primarily used for software inventory management and device monitoring in enterprise environments. However, its legitimate use can be abused by attackers seeking to facilitate unauthorized access or reconnaissance within a network. The detection focuses on specific process creation events pertaining to `ocsinventory.exe` and `ocsservice.exe`, which could indicate that the RMM tool is being misused.

  The likely attacker objectives include gathering data about the network, executing unwanted scripts, or deploying malware across multiple devices. These actions fall under several MITRE ATT&CK tactics, particularly **Execution** (T1203) as they involve running potentially harmful processes. Understanding the use of RMM tools like OCS is essential, as attackers often leverage them to maintain persistence and control over compromised environments.

  The primary data sources for this detection include Windows process creation events, which provide insights into the execution of various applications, along with parent-child process relationships. Monitoring these logs can assist in identifying suspicious usage patterns of the OCS Inventory tool.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze Windows process creation logs for instances of `ocsinventory.exe` and `ocsservice.exe`, paying attention to their parent processes to detect unusual invocation patterns.

  - **Examine Parent Processes:** Investigate the parent processes that led to the creation of OCS Inventory executables; legitimate processes should typically be known management and administrative tools.

  - **Check For Network Activity:** Look for outbound connections initiated by the OCS Inventory tool to identify any data exfiltration or communication with unauthorized external IPs.

  - **Validate System Inventory Changes:** Compare system inventory changes logged by OCS with expected changes in the environment. Suspicious entries may indicate unauthorized usage.

  ### Prioritization
  Given the medium severity level of this alert, it is important to evaluate the context of OCS Inventory usage within the enterprise. Although legitimate usage exists, the potential risk of an attacker manipulating this tool to exploit vulnerabilities warrants prompt investigation.

  ### Blind Spots and Assumptions
  This detection rule may not account for modified or renamed versions of `ocsinventory.exe` and `ocsservice.exe`, thereby creating a gap in detection coverage. Additionally, the rule assumes that if these processes are executed, they are likely nefarious activity without considering context. Required configurations include enabling comprehensive process creation logging on Windows systems to ensure that these events are captured and available for analysis.

