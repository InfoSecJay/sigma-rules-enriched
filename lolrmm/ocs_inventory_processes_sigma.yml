note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with OCS Inventory RMM tools, specifically `ocsinventory.exe` and `ocsservice.exe`. Attackers may leverage these tools for reconnaissance, asset inventory, or unauthorized remote management, often as part of a broader lateral movement strategy. This behavior maps to MITRE ATT&CK technique: *Remote System Discovery (T1219)*.

  The primary telemetry source for this detection is Windows process creation events, particularly Event ID 4688 from the Security log and Event ID 1 from Sysmon, capturing details about process execution. If malicious, the use of these processes could indicate an attempt to inventory systems for further exploitation or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own, as `ocsinventory.exe` and `ocsservice.exe` are legitimate tools used in enterprise environments.

  ### Investigation Steps

  - **Identify running processes:** Check the process list for instances of `ocsinventory.exe` or `ocsservice.exe` using Task Manager (or appropriate tooling) for Event ID 4688. Validate legitimate usage, indicating normal asset management operations.

  - **Examine parent process relationships:** Review process creation events to confirm which processes initiated `ocsinventory.exe` or `ocsservice.exe` (check ParentImage field in Event ID 4688). Look for suspicious or known malicious parent processes that indicate potential exploitation.

  - **Correlate with established baselines:** Compare detected process execution times against known scheduled tasks or operational activity (review the Task Scheduler for OCS-related jobs). Alert times that deviate significantly may warrant further investigation.

  - **Check for unusual command-line parameters:** Inspect command-line arguments in the process creation logs (Event ID 4688) for unusual or obfuscated parameters that may indicate adversarial intent, applying heuristics based on documented legitimate use cases.

  - **Identify network connections:** Assess for outbound or intra-network connections established by `ocsinventory.exe` or `ocsservice.exe` using network logs. Look for any unexpected IP addresses or ports that do not align with known OCS server communications.

  ### Prioritization

  This alert has medium severity due to the potential impact on enterprise asset management and the likelihood of misuse by adversaries seeking to enumerate systems for exploitation. Although OCS tools can serve legitimate purposes, their behavior is commonly utilized by threat actors for discovery and lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of monitoring for legitimate administrative actions or interactions with OCS tools. Notably, OCS Inventory’s normal operational use may trigger the rule, leading to false positives. A common companion detection is monitoring for unusual outbound connections (e.g., using firewall or endpoint telemetry), which can provide additional context to the process activity and strengthen overall visibility.

