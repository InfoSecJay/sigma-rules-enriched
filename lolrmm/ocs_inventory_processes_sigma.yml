  ---

  ### Technical Context

  This Sigma rule detects the execution of processes associated with the OCS Inventory RMM tool, specifically `ocsinventory.exe` and `ocsservice.exe`. The likely attacker objective may involve reconnaissance or system enumeration within the network, potentially to harvest inventory details or give threat actors unauthorized access. This detection aligns with the MITRE ATT&CK technique "System Information Discovery" (T1219).

  The primary telemetry sources for this detection are Windows process creation logs, specifically looking for Security Event ID 4688. If the activity is malicious, it could lead to unauthorized inventory collection and heightened exposure of internal systems. Importantly, this detection does NOT confirm that the OCS tool is being misused or has been compromised; it only identifies its execution.

  ---

  ### Investigation Steps

  - **Check for Process Context: ** Review the parent process of the detected activities: Look for well-known legitimate parent processes like `cmd.exe` or `powershell.exe`. Malicious activity may show unusual chaining, e.g., spawning from unintended binaries.

  - **Review Recent Activity: ** Examine related Windows Event ID 4688 logs for other process creations within the same timeframe. Look for unusual patterns such as rapid re-execution or multiple instances which could indicate malicious automation.

  - **Validate Legitimate Usage: ** Confirm if OCS Inventory is expected to be in use on the affected system. Compare logs against an asset inventory to see if the tool is deployed as part of approved IT operations.

  - **Correlate Activity with User Accounts: ** Analyze the associated user account in Event ID 4688 to determine if it's a legitimate administrator or an anomalous account. Malicious activity often uses compromised or low-privilege accounts for stealth.

  - **Assess Impact of Affected System: ** Determine the criticality of the host running the process, as inventory tools on sensitive systems may indicate a higher threat level if exploited.

  - **Collect Artifacts of Data Gathering: ** Check for any file artifacts created by the OCS tool in common output directories. Look for logs or data dumps that may indicate successful inventory enumeration.

  ---

  ### Prioritization

  The alert severity is medium as the execution of the OCS Inventory tool could indicate potential misuse, especially if found on critical assets. The likelihood of malicious abuse is moderate since it could serve as a reconnaissance step during an attack, but this behavior may also occur as a part of normal operations.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations due to possible evasion techniques where attackers modify process names or leverage misconfigured legitimate applications. Reliable detection requires complete visibility of process creation logs, and if logging is not properly configured, the detection may miss critical indicators. Additionally, legitimate IT usage of OCS Inventory could trigger this alert, underscoring the need for context. A companion detection to strengthen coverage would be monitoring unusual outbound network connections from systems running OCS Inventory as a potential exfiltration vector.

