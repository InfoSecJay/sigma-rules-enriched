note: |
  ### Technical Context

  This Sigma rule detects potential process creation activities tied to the OCS Inventory RMM tool, specifically when processes like `ocsinventory.exe` or `ocsservice.exe` are initiated. The likely attacker objective is to utilize these legitimate administrative tools for malicious purposes, such as data exfiltration or command and control (C2) activities. This behavior aligns with the MITRE ATT&CK tactic of "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1219).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, this activity can indicate unauthorized access and administration of systems, jeopardizing the integrity of assets and potentially leading to data breaches. Importantly, this detection does not confirm malicious intent on its own, as legitimate use of the OCS Inventory tool within an organization is common.

  ### Investigation Steps

  - **Check process origin:** Review the creation of `ocsinventory.exe` or `ocsservice.exe` by checking Security Event ID 4688. Look for instances that originate from unexpected parent processes, such as `cmd.exe` or `powershell.exe`, which may indicate malicious use.

  - **Identify parent-child relationships:** Investigate the process tree in Sysmon logs (Event ID 1) to confirm the exact lineage of the detected processes. Legitimate usage typically originates from controlled service accounts, whereas malicious activity often involves unexpected or administrative accounts.

  - **Validate access permissions:** Ensure the executing user has appropriate permissions and validate whether the user account is on a watchlist. Suspicious accounts, especially those with administrative privileges exhibiting such activity, can indicate a potential compromise.

  - **Correlate with network activity:** Cross-reference with firewall or network logs (e.g., flow logs, proxy logs) to check for lateral movement or communication to known malicious C2 addresses related to the OCS processes. Look for unusual outbound connections initiated by those processes.

  - **Assess system role:** Determine the function and criticality of the affected system. If it’s a high-value asset (e.g., a server hosting sensitive data) and initiating these processes, it warrants further scrutiny.

  ### Prioritization

  This alert should be classified as medium severity due to the potential risk posed by the OCS Inventory tools facilitating unauthorized access or data exfiltration. The likelihood of malicious exploitation is moderate, particularly if the activities are observed outside normal maintenance windows, making this behavior of interest for SOC analysts.

  ### Blind Spots and Assumptions

  This detection may be limited by false positives resulting from legitimate OCS Inventory tool usage, especially in environments where it's commonly used for system monitoring. Detecting the processes depends on relevant configurations for logging process creations, and any misconfigurations could hinder accurate detection. Again, legitimate administrative activities may trigger the alert, necessitating context consideration. A companion detection, such as monitoring for unusual network traffic from the relevant systems, can enhance coverage and provide additional assurance against false positives.

