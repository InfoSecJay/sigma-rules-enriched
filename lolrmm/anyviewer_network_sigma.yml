note: |
  ### Technical Context

  This Sigma rule detects network connections to AnyViewer Remote Management and Monitoring (RMM) tool domains, specifically *.anyviewer.com and *.aomeisoftware.com. The likely attacker objective is to gain unauthorized remote access to a targeted system for control or data exfiltration, aligning with the MITRE ATT&CK tactic of Execution (TA0002) and technique of Remote Services (T1219). Primary telemetry sources include network connection logs from Windows event logs, specifically looking for specific domain resolutions.

  If this activity is malicious, the impact could be significant, allowing attackers to execute commands remotely and extract sensitive information. Notably, this detection alone does not confirm that malicious activity is occurring since legitimate use of AnyViewer may trigger the alert. Analysts must verify the context and usage of the tool within their network.

  ### Investigation Steps

  - **Review network connection logs:** Search for Windows Security Auditing Event ID 5156 logs that show outbound connections to anyviewer.com or aomeisoftware.com. Confirm connection times align with the alert's timestamp.

  - **Identify legitimate use cases:** Determine if AnyViewer is officially used in your organization. Check asset inventories or discuss with IT teams. Legitimate connections typically involve organizational authorization and documented purposes.

  - **Analyze user behavior on connected hosts:** Review logon events (Security Event ID 4624) correlating with the timestamp of AnyViewer activity. Legitimate usage should include recognized usernames performing expected tasks, in line with your organizational policies.

  - **Check for abnormal process execution:** Look for suspicious processes related to AnyViewer by reviewing Sysmon Event ID 1. If AnyViewer executables (e.g., AnyViewer.exe) appear among unauthorized processes, this may indicate malicious activity on affected systems.

  - **Correlate with additional telemetry:** Gather logs from endpoint protection tools for known indicators of compromise associated with AnyViewer usage. Look for alerts indicative of initial access or lateral movement attempts on the network.

  ### Prioritization

  This alert has medium severity due to its potential impact, as any unauthorized use of RMM tools can lead to significant breaches. The likelihood of abuse is moderate since these tools are commonly weaponized by adversaries for Remote Access Trojan (RAT) behaviors. Continuous monitoring for this activity is essential to detect and mitigate threats effectively.

  ### Blind Spots and Assumptions

  The detection may miss connections to AnyViewer if the tool is already whitelisted or if malicious users utilize tunneling techniques to obscure their traffic. Ensure that DNS logs are collected to maintain holistic visibility of related network activity. Legitimate usage may include IT support teams utilizing AnyViewer for remote assistance. Companion detections may include monitoring for unusual machine behavior or command execution logs suggesting unauthorized administrative access.

