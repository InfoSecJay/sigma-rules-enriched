note: |
  ### Technical Context

  This rule detects network traffic directed to AnyViewer RMM domains (e.g., `*.anyviewer.com` and `*.aomeisoftware.com`), indicating potential use of the remote management tool. Attackers may utilize AnyViewer for persistence, command and control (C2) communications, or lateral movement within a network. The relevant MITRE ATT&CK tactic for this rule is *Command and Control* (TA0011), specifically technique *Application Layer Protocol* (T1071).

  Primary telemetry sources for this detection include Windows Network Connection logs, which detail outbound connection attempts to suspicious destinations. If confirmed to be malicious, this behavior can facilitate unauthorized access to systems and sensitive data exfiltration. However, this detection does NOT confirm malicious activity on its own since legitimate users may access AnyViewer for legitimate support purposes.

  ### Investigation Steps

  - **Verify the destination of the network connection:** Check Windows Event ID 5156 (Windows Filtering Platform: Allow packet) or equivalent network logs to confirm traffic to AnyViewer domains. Determine if the traffic is outbound to legitimate AnyViewer services during working hours.

  - **Examine the process initiating the connection:** Use Sysmon Event ID 3 (Network connection) to identify the process that initiated the connection to AnyViewer. Malicious connection attempts often originate from unusual or unexpected processes (e.g., non-administrative user accounts or uncommon applications).

  - **Investigate the user account making the connection:** Review Windows logon events (Security Event ID 4624) linked to the connection attempts. Legitimate access to AnyViewer typically involves authorized support personnel or identified business needs, while unexpected logins can indicate potential compromise.

  - **Check for file creation or installation of AnyViewer:** Look for file system changes indicating AnyViewer installation (e.g., files created in `C:\Program Files\AnyViewer`). Review installation logs or software inventory to distinguish legitimate installations from unauthorized setups.

  - **Evaluate related network activity:** Review logs for any other unusual connections or patterns that might suggest a larger attack (e.g., multiple outbound connections to suspicious sites or unusual spikes in traffic).

  ### Prioritization

  This alert is considered medium severity. An affected system's readiness is compromised, as AnyViewer can allow remote access if exploited. The tool is sometimes weaponized by attackers seeking persistent access, making its detection essential.

  ### Blind Spots and Assumptions

  Detection may be limited by incorrect log configurations or the presence of legitimate traffic to AnyViewer for remote support, which can trigger false positives. Comprehensive coverage requires monitoring of DNS logs and network connections. Related detection for other remote management tools or C2 communications can enhance monitoring for suspicious behaviors.

