note: |
  ### Technical Context

  This rule detects network connections made to AnyViewer RMM tool services, highlighting potential misuse of remote management software. Threat actors may utilize such tools to gain unauthorized access to systems, performing various tasks such as data exfiltration or lateral movement. The relevant MITRE ATT&CK techniques include Remote Access Software (T1219) under the Command and Control tactic.

  Primary telemetry sources include Windows network connection logs, specifically Event ID 5156 (Windows Filtering Platform) or similar logs capturing outbound connection attempts. If malicious, this behavior can lead to significant security incidents, such as unauthorized access or data breaches. However, it should be noted that this detection does NOT confirm malicious intent on its own, as legitimate use of AnyViewer exists.

  ### Investigation Steps

  - **Check for event logs involving network connections:** Review Windows Filtering Platform logs (e.g., Event ID 5156) for any outbound connections to domains ending with `.anyviewer.com` or `.aomeisoftware.com`. Note legitimate administrative tasks by observing scheduled tasks or known user activity patterns.

  - **Identify recent installations or use of AnyViewer:** Look for file creation events (Sysmon Event ID 11) that indicate AnyViewer was recently installed or executed on affected systems. Identify installation paths (e.g., `C:\Program Files\AnyViewer\`) and correlate with the asset owner.

  - **Assess the context of the connections:** Determine the user account associated with the connections from logs (e.g., Security Event ID 4624). Investigate if the user accounts involved have legitimate reasons to utilize remote access tools, comparing against baseline user activity.

  - **Evaluate network traffic volume and pattern:** Analyze network traffic volume related to outbound connections to AnyViewer domains, using network-level telemetry. High volume may indicate suspicious activity, contrasting with expected behavior from legitimate administrative usage.

  - **Correlate with other remote access detections:** Check for alerts related to other remote access tools that are similar in nature, such as TeamViewer or AnyDesk. Utilize comprehensive logs from EDR solutions if available to identify a pattern of remote access tool usage.

  ### Prioritization

  The alert has medium severity due to the potential impact on compromised systems, particularly if critical infrastructure is involved. The likelihood of abuse is moderate given that this behavior is indicative of remote management tool usage, which is often weaponized by attackers to access sensitive systems.

  ### Blind Spots and Assumptions

  Detection may be limited by user behavior where legitimate use of AnyViewer might generate false positives, particularly among IT support teams. Reliance on proper log source configuration (e.g., Windows Filtering Platform logs) is crucial for accurate detection. Additionally, normal activities such as remote support sessions may trigger alerts and should be considered when reviewing incidents. Companion detections include monitoring for installation of suspicious applications or unusual outbound connections to other known remote management tools, enhancing overall threat visibility.

