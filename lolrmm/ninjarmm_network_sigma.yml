note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the NinjaRMM remote monitoring and management (RMM) tool. Typical attacker objectives may include establishing command and control (C2) communications or leveraging unauthorized management capabilities to control systems within the environment. The relevant MITRE ATT&CK techniques are T1219 (Remote Access Software) and T1071 (Application Layer Protocol).

  Primary telemetry sources include Windows network connection logs, which capture destination hostnames and associated events. If malicious, the security impact includes unauthorized access to systems and potential data exfiltration. This detection does NOT confirm malicious intent by itself, as NinjaRMM could be legitimately used for remote management.

  ### Investigation Steps

  - **Verify active NinjaRMM usage:** Check asset inventory and management documentation to confirm whether NinjaRMM is authorized and deployed in the organization. Compare against the logs for recent activity to indicate legitimate usage.

  - **Identify network connection logs:** Review Windows Security Event ID 5156 or network logs indicating outbound connections to domains ending with "*.ninjarmm.com". Look for connections initiated during unusual hours or from systems not on the typical asset list.

  - **Evaluate process context:** Examine the process tree associated with network connections, focusing on Sysmon Event ID 1 for any suspicious process creating the connection to NinjaRMM domains. Look for any unusual parent processes that deviate from typical operations.

  - **Cross-reference user activity:** Assess user logins and activity in conjunction with the detected connections. Analyze Security Event IDs 4624 (successful logon) and 4625 (failed logon) to confirm if the accounts making the connections are authorized or show signs of compromise.

  - **Determine indicators of compromise (IOCs):** Look for any other network activity involving known malicious domains or atypical patterns such as repeated connections to the same NinjaRMM-hosted sites from multiple endpoints or on unusual ports.

  ### Prioritization

  This alert should be considered medium severity due to the potential for personal and sensitive data exposure if exploited by an adversary using legitimate RMM tools for malicious purposes. The likelihood of malicious use is moderate, as these tools can be weaponized by attackers seeking to gain access to systems.

  ### Blind Spots and Assumptions

  This detection may not capture if the RMM tool is used legitimately, or if an adversary is using it in a stealthy manner under an altered configuration. Required log sources include complete Windows Event logs and Sysmon installation for comprehensive visibility. Legitimate organizational activities, such as scheduled remote management tasks, may trigger this alert. A companion detection would be monitoring for unusual process creations associated with NinjaRMM executables or any anomalous behavior by legitimate users.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
