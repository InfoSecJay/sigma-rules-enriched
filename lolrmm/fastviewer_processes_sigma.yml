note: |
  ### Technical Context

  This rule detects the execution of processes associated with the FastViewer Remote Monitoring and Management (RMM) tool, specifically `fastclient.exe`, `fastmaster.exe`, and `FastViewer.exe`. The likely attacker objective is to utilize the FastViewer tool for unauthorized remote access or monitoring of systems, potentially exfiltrating data or maintaining persistence within the environment. This behavior aligns with the MITRE ATT&CK framework's Command and Control tactic (TA0011) and the RMM-focused technique, Process Injection (T1219).

  Primary telemetry sources include Windows event logs related to process creation (Event ID 4688) and Sysmon logs if installed (Event ID 1). If malicious, the use of this tool can allow an adversary to monitor user activity and manipulate the system without detection. It is crucial to note that this detection does NOT confirm the intention behind the action, as FastViewer may be used legitimately for remote support.

  ### Investigation Steps

  - **Review process creation logs:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 for execution of `fastclient.exe`, `fastmaster.exe`, or `FastViewer.exe`. Focus on the AccountName and CommandLine fields to understand the context of execution.

  - **Examine parent process relationships:** Identify parent processes for the detected FastViewer executions. Investigate if they were spawned by known administrative tools or suspicious applications. Normal parent processes might include system management or remote support software.

  - **Validate legitimate use:** Cross-reference any detected instances against your organization's inventory of authorized software and remote access tools. Confirm whether the processes were initiated by IT support or known administrative users.

  - **Search for unusual network connections:** Look for outbound connections (using NetSec logs or network monitoring tools) made from the affected host that correspond with FastViewer activity. Investigate any connections to unknown or suspicious IPs, as legitimate usage typically connects to identified support infrastructure.

  - **Identify high-confidence indicators:** Determine if any detected FastViewer processes are associated with known malicious actor TTPs, such as Internet connections to flagged IPs or DNS entries. This might include checking threat intelligence feeds.

  ### Prioritization

  The severity of this alert is medium. The impact could be significant if the affected system is critical, enabling unauthorized access or data exfiltration. The likelihood of malicious abuse is moderate, as FastViewer is a legitimate tool frequently misused in targeted attacks, meaning this behavior is an area of concern for potential exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of relevant process monitoring setups or if the logs from security tools like Sysmon are not being collected. Legitimate activities that could trigger this alert include authorized IT support sessions using FastViewer, making investigation critical. A related detection to consider is monitoring for unusual process injection behavior into valid processes, which further strengthens coverage against misuse of remote monitoring tools.

