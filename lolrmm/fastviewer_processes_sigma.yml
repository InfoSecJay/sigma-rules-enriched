  ---

  ### Technical Context

  This rule detects potentially unauthorized executions of the FastViewer Remote Management Tool (RMM), specifically monitoring for processes initiated by or spawning from FastViewer's main executables. Attackers might leverage legitimate RMM tools like FastViewer to maintain access to compromised systems, enabling them to execute commands or transfer files without raising immediate suspicion.

  Relevant MITRE ATT&CK tactics include Execution (TA0002) and the technique Remote Services (T1219). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If the behavior is malicious, it poses a risk of system compromise and data exfiltration. It is important to note that this detection alone does not confirm malicious intent; legitimate use of FastViewer in a corporate environment can trigger this alert.

  ---

  ### Investigation Steps

  - **Review the process details:** Check for process creation logs (Security Event ID 4688, Sysmon Event ID 1) with the Image field containing `fastclient.exe`, `fastmaster.exe`, or `FastViewer.exe`. Confirm if the User field reflects a known administrative account or an unexpected user.

  - **Identify parent process context:** Analyze the ParentImage for fastclient.exe or fastmaster.exe. Evaluate whether the parent process is legitimate (e.g., admin tools) or indicative of misuse (e.g., uncommon user behaviors).

  - **Validate installation locations:** Confirm that activities originate from standard directories (e.g., `C:\Program Files\FastViewer`). Log entries indicating execution from unusual paths may suggest malicious activity.

  - **Cross-reference with user activity:** Verify expected use cases of FastViewer through historical ticketing or support logs. Legitimate use should correlate with scheduled maintenance or remote assistance requests.

  - **Monitor network connections:** Check for outgoing network connections initiated by detected FastViewer processes using logs from the relevant firewall/event sources. Look for unusual targets, such as IPs outside the organizational range.

  ---

  ### Prioritization

  This alert has medium severity due to the potential for unauthorized system access and management through a legitimate tool. Given that RMM tools are commonly targeted for abuse in attacks against enterprises, prompt investigation is necessary to determine the legitimacy of the detected activity.

  ---

  ### Blind Spots and Assumptions

  Detection may be hindered by legitimate administrative use of FastViewer, leading to potential false positives. Ensuring all endpoint devices are logging the required process activity is vital for reliable detection. Activities such as remote IT support sessions may trigger the alert. A related detection to consider is monitoring for anomalous network activity correlating with FastViewer process execution to enhance context and response capabilities.

