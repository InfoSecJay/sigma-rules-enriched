note: |
  ### Technical Context

  This Sigma rule detects processes spawned by FastViewer RMM tools, particularly focusing on `fastclient.exe`, `fastmaster.exe`, and `FastViewer.exe`. The likely attacker objective is remote system management or exploitation through unauthorized access to a target system. This activity correlates with the MITRE ATT&CK technique "Remote System Management" (T1219), which is commonly used by attackers to maintain persistence or execute further malicious actions on compromised systems.

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688. If the detected FastViewer processes are not part of legitimate remote management activities, they may indicate a significant security risk, as malicious actors could utilize these tools for unauthorized access or control. Importantly, this detection does NOT confirm malicious intent on its own, as FastViewer can be used legitimately in managed environments.

  ### Investigation Steps

  - **Review the process origin and creation details:** Check Security Event ID 4688 for the `fastclient.exe`, `fastmaster.exe`, and `FastViewer.exe` process families. Focus on the `NewProcessName` and `CreatorProcessId` fields. Legitimate usage might correlate with known administrative activities or IT support personnel.

  - **Correlate with user logins and remote access records:** Verify that the user context executing the process aligns with authorized personnel. Use Security Event ID 4624 to review recent logon attempts (successful logins) around the same timeframe as the detected process activity.

  - **Analyze network connections initiated by detected processes:** Utilize Windows Firewall logs (Event ID 5156) or network traffic monitoring to evaluate outbound connections from these processes. Suspicious external connections, especially to unknown IPs or ports, indicate potential malicious activity.

  - **Assess process parentage and arguments:** Investigate the parent processes of the FastViewer tools in the process tree. Events revealing unusual parent-child relationships or strange command-line arguments suggest nefarious use (e.g., `cmd.exe` or `powershell.exe` as parent processes).

  - **Check against known FastViewer legitimate use cases:** Determine if the system is part of a recognized IT support structure. Refer to internal documentation on FastViewer's deployment specifics, including any associated IP ranges or known legitimate user accounts.

  - **Identify any anomalies in system behavior:** Look for additional indicators such as unusual file modifications or new services starting within a short window post-detection. This can be done using Sysmon Logs (Event ID 11 for file creation) or Windows Services logs to validate suspicious changes.

  ### Prioritization

  This alert is of medium severity due to the potential security impact on affected systems. The likelihood of malicious use is moderate, as FastViewer is sometimes exploited by threat actors for unauthorized remote access. The behavior detected is typically weaponized in targeted attacks against organizations, especially in environments where remote management tools are present.

  ### Blind Spots and Assumptions

  Detection may be limited by environments that use FastViewer legitimately, resulting in false positives if not contextualized properly. Required log sources include extensive process creation logs and potentially remote desktop service logs for accurate insight. Legitimate activity can include IT support sessions using FastViewer without malicious intent. Companion detections could include monitoring for other remote management tools such as TeamViewer or AnyDesk, which would strengthen overall coverage against unauthorized access.

