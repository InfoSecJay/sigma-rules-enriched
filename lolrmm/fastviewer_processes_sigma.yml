note: |
  ### Technical Context
  This rule is designed to detect activity related to the FastViewer Remote Management Tool (RMM), particularly when the tool's processes are initiated from suspicious or unexpected parent processes. FastViewer can be used for legitimate remote access and support; however, attackers may exploit it to maintain persistence, exfiltrate data, or control compromised systems remotely. The detection aims to identify unauthorized usage, which could indicate a lateral movement tactic or a means to interact with a compromised host surreptitiously.

  The relevant MITRE ATT&CK tactics associated with this detection include **Execution** (TA0002) and **Remote Services** (T1219), as the usage of FastViewer is tied to remote access capabilities. Effective threat actors may utilize such remote tools to gain control over a networked environment.

  Primary data sources for detection include **process creation events**, focusing on monitoring specific applications related to FastViewer for any anomalous behavior or unusual invocation scenarios that do not align with established operating patterns.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for any instances where FastViewer-related processes were spawned. Look for unusual or unexpected parent processes initiating these applications.
  - **Correlate with User Activity:** Check the user accounts associated with the detected processes. Validate whether the account has a legitimate reason to utilize FastViewer, such as being a support technician.
  - **Examine Network Connections:** Investigate network logs for any outbound connections initiated by FastViewer processes that target external IP addresses not typically associated with internal support functions.
  - **Analyze Historical Context:** Look into historical usage patterns of FastViewer within the environment. Compare recent events against this baseline to identify any deviations that could indicate malicious intent.

  ### Prioritization
  The severity of this alert is assessed as medium. While FastViewer can be used legitimately, its detection in atypical contexts poses a risk of unauthorized access or lateral movement by threat actors, necessitating prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if FastViewer is used in a legitimate capacity by various support teams, leading to potential false positives. The detection logic assumes that malicious processes launched by FastViewer will not typically run under normal circumstances and that sufficient logging of process creation events is enabled. Additionally, organizations must ensure configurations are in place to monitor network traffic to and from processes associated with FastViewer for comprehensive visibility.

