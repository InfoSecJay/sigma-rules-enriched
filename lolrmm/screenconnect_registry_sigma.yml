note: |
  ### Technical Context

  This detection rule identifies registry activity associated with the ScreenConnect remote management tool. Attackers may use ScreenConnect to establish remote access, facilitate command and control, or exfiltrate data. The behavior can fit into the MITRE ATT&CK framework under the tactic of Command and Control (TA0011) and the technique of Remote Access Tools (T1219). Primary telemetry sources include Windows Registry Event logs, specifically monitoring changes to paths related to ScreenConnect Client service configurations. If malicious, this activity may indicate unauthorized remote access to systems, potentially leading to data breaches or further network compromise. It is important to note that this detection does not confirm that the tool is being used maliciously, as legitimate usages do exist.

  ### Investigation Steps

  - **Verify registry modifications:** Check for any recent changes to registry paths: `HKLM\System\CurrentControlSet\Services\ScreenConnect Client (*)\ImagePath`, `HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Authentication Packages`, and `HKLM\SOFTWARE\Classes\CLSID\{6FF59A85-BC37-4CD4-C175-070CC4814204}`. Legitimate activity will generally not result in unauthorized changes here.

  - **Identify processes associated with ScreenConnect:** Cross-reference process creation logs (Event ID 4688) for any instances where the ScreenConnect Client is being executed. Legitimate instances should correlate with known user activities and acceptance of remote access.

  - **Review authentication logs for context:** Analyze the Security Event logs (Event ID 4624) for successful logons related to the same timeframe to discern if remote access was initiated. Look for unusual logon types (e.g., from a non-corporate IP).

  - **Correlate with network traffic logs:** Check for outbound connections to known ScreenConnect IP addresses or domain names in firewall logs. Malicious connections often generate unexpected traffic patterns, unlike typical authorized remote access connections.

  - **Assess system role and significance:** Identify whether the affected system is critical, such as a domain controller or server hosting sensitive data. High-value assets will warrant a more thorough investigation for unauthorized access.

  ### Prioritization

  The severity of this alert is medium, as the impact of a compromise can be significant if a critical system is infiltrated. Given that remote access tools are frequently abused for malicious purposes, proactive investigation is warranted, especially in environments with high security sensitivity.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of ScreenConnect, which can mask malicious activity. Required logs to ensure reliable detection include comprehensive Registry Event logs and security logs for process execution. Activities such as authorized remote support sessions may inadvertently trigger this alert. A related detection to consider is monitoring for unusual outbound connections to remote access tool domains or IP addresses to strengthen coverage against misuse.

