note: |
  ### Technical Context

  This rule detects potential execution of processes associated with the IT Agent Remote Monitoring Management (RMM) tool. The likely attacker objective could involve maintaining persistence or control over compromised systems by leveraging legitimate RMM tools for reconnaissance or lateral movement. It is associated with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Application Layer Protocol (T1219). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior may enable an adversary to manage and exploit endpoints undetected. However, this detection alone does not confirm that an endpoint is indeed compromised, as the identified processes could be part of legitimate IT management activities.

  ### Investigation Steps

  - **Confirm process execution:**
    Verify if Security Event ID 4688 or Sysmon Event ID 1 indicates the execution of `ITAgentRMMSender.exe`, `ITAgentRMMSenderSL.exe`, or `ITAgentRMMSenderUpdater.exe`. Check the `NewProcessName` field for these exact matches.

  - **Analyze parent process context:**
    Validate the `ParentImage` field in the data captured. If the parent process ends with `ITAgentRMMSender.exe`, classify it as suspicious and prioritize it for deeper investigation.

  - **Review execution timing and frequency:**
    Check for any unusual execution patterns, such as multiple instances of these processes running in quick succession or at odd times (e.g., during non-working hours), as they could indicate anomalous behavior.

  - **Monitor for sign of exfiltration:**
    Verify any outbound connections originating from the RMM processes by correlating with network logs. Look for connections to known malicious IPs or unusual endpoints, focusing on traffic that may show anomalies in protocols used (e.g., HTTP or DNS).

  - **Identify legitimate usage:**
    Investigate documented usage of IT Agent within your organization. If such tools are part of standard operations, contextualize the alert with users or systems that routinely execute these processes without a history of security incidents.

  - **Cross-reference with controlled inventories:**
    Validate that the identified process executables match the organization's authorized software inventory. Discrepancies may indicate unauthorized installation or usage of IT Agent, requiring immediate attention.

  ### Prioritization

  This alert should be treated with medium severity. While the affected system may be critical to operations, the presence of legitimate RMM tools may often lead to false positives. However, the nature of such tools makes them commonly weaponizable for attackers seeking covert access to managed networks.

  ### Blind Spots and Assumptions

  Detection may be limited if process logging is disabled on endpoints or if processes have been renamed. Legitimate IT support staff may trigger these alerts as they use authorized RMM tools. Companion detection to enhance coverage includes monitoring for anomalous network traffic typically associated with these processes, which may reveal misuse.

