note: |
  ### Technical Context

  This rule detects registry access related to the GLPI Agent RMM (Remote Monitoring and Management) tool, specifically targeting various keys present in the Windows registry. These keys could indicate potential unauthorized use or compromise of the GLPI Agent, which may be leveraged by attackers to maintain persistence or execute remote commands. The likely attacker objective would be to establish command and control over compromised systems using GLPI’s infrastructure as a cover for malicious activity.

  This behavior relates to the MITRE ATT&CK tactic of Command and Control (T1071) and the specific technique of Application Layer Protocol (T1219). The primary telemetry sources are Windows Registry events, particularly changes to specific registry keys associated with the GLPI Agent. If malicious, this activity could allow attackers to control systems or exfiltrate data under the guise of legitimate remote management operations. It's critical to note that detecting access to these registry keys does not confirm malicious activity on its own, as legitimate use of the GLPI Agent may reflect similar registry interactions.

  ### Investigation Steps

  - **Identify registry event details**: Review Windows Event ID 4657 (Registry value was modified) to obtain involved registry key paths, timestamp, and user context, focusing on changes to `HKLM\SOFTWARE\GLPI-Agent\*`. Look for unexpected modification patterns.

  - **Correlate user activity**: Cross-reference the user account modifying these registry keys against known administrative access policies. Legitimate activity would typically show regular updates performed by authorized administrative accounts rather than anomalous accounts at odd hours.

  - **Assess installation origins**: Investigate the GLPI Agent installation path by checking Event ID 4688 (Process Creation) for the command line used to start GLPI processes. Track if these commands were executed from common directories versus temporary or user profile locations, which may suggest unauthorized installations.

  - **Collect associated telemetry**: Gather Sysmon Event ID 1 to monitor for related process creation tied back to the GLPI Agent, such as `glpi-agent.exe`. Look for signs of unusual child processes that may indicate exploitation beyond legitimate RMM operations.

  - **Analyze network connections**: Check for outbound connections associated with the GLPI Agent using Windows Firewall logs (Event ID 5156) or network monitoring tools. Malicious instances may exhibit unusual external connections not tied to standard GLPI operations.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of compromised RMM tools on internal systems. While GLPI Agent is often weaponized or abused in corporate environments, the likelihood of actual malicious use may vary based on system activity and user context. Continuous legitimate use can mask potential threats, making careful analysis essential.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where GLPI Agent is legitimately used or poorly monitored. Notably, accurate identification of this alert's cause requires reliable logging of Windows Registry access events, which may not be configured in all environments. Additionally, benign administrative actions may trigger similar alerts, such as scheduled maintenance or planned updates of the GLPI Agent. Related detection rules focusing on process creation or abnormal network activity can enhance overall visibility and response capabilities.

