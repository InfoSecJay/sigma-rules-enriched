note: |
  ### Technical Context

  This Sigma rule detects modifications to specific registry keys associated with the GLPI Agent RMM tool, primarily focusing on installation and configuration activity. An attacker's objective may include unauthorized access or persistence via this remote monitoring tool, which can provide substantial control over target systems. The relevant MITRE ATT&CK tactic here is **Execution** (TA0002) with the technique **Application Layer Protocol** (T1219).

  The primary telemetry sources are Windows Registry Event logs, particularly those that track access or changes to the keys related to GLPI Agent. If malicious, such activity could lead to remote exploitation of system resources. However, this alert does NOT confirm that malicious activity has occurred; it only indicates potential GLPI Agent-related modifications that warrant further investigation.

  ### Investigation Steps

  - **Check Event IDs for Registry Access:** Review Windows Security Event ID 4663 for object access specifically targeting the keys related to `HKLM\SOFTWARE\GLPI-Agent`. Look for Read or Write permissions that deviate from normal usage patterns.

  - **Identify Owner and Last Modified User:** Examine the registry modification events for the `TargetObject` fields, specifically noting the `SubjectUserSid` to identify if the modification was made by a legitimate administrator or an unauthorized account.

  - **Look for GLPI Agent Documentation:** Verify if the registry changes align with the expected GLPI Agent deployment practices through documentation or change control records. Legitimate installations should show expected key configurations without abnormal alterations.

  - **Correlate with Remote Connections:** Cross-reference network logs, specifically looking for outbound connections to known GLPI server IPs or unusual traffic to unapproved IPs after the registry change occurred, which may indicate unauthorized use of the Agent (e.g., see Firewall Event Logs or Windows Security logs for outbound connection attempts).

  - **Assess System Role and Context:** Consider the criticality of the host affected. If the system is a server in a production environment, any GLPI Agent-related registry change should raise higher suspicion compared to changes on non-critical systems.

  ### Prioritization

  The severity of this alert is medium due to the critical role GLPI Agent plays in managing systems remotely. While it can facilitate legitimate administrative tasks, its presence could also indicate exploitation or malicious persistence, making the likelihood of abuse significant. The use of such tools is not uncommon in targeted operations by threat actors.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative usage of the GLPI Agent that can trigger the alert without malicious intent. The reliability of detection is contingent upon having comprehensive logging enabled for registry modifications, specifically for sensitive keys. Additionally, similar alerts can be informed by other detection rules focusing on unusual administrative access or system monitoring tools to enhance overall coverage against misuse.

