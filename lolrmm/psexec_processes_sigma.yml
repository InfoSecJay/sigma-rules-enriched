note: |
  ### Technical Context
  This rule detects the execution of the PSEXEC tool, which is commonly used for remote system management and command execution on Windows environments. PSEXEC can be leveraged by both system administrators for legitimate purposes and malicious actors seeking to execute unauthorized commands across multiple systems. The primary objective for an attacker using PSEXEC might include lateral movement within a network, executing payloads remotely, or establishing a foothold in an environment by accessing sensitive systems unnoticed.

  The relevant MITRE ATT&CK tactics include **Execution (TA0002)** and **Remote Services (T1219)**. Execution focuses on the ways adversaries execute malicious code on a target system, while Remote Services encompasses the use of tools like PSEXEC to gain command and control over remote machines. The primary data source for this detection will be **process creation events**, specifically focusing on the ParentImage and Image fields to identify instances of psexec.exe and psexecsvc.exe initiating processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs for instances where PSEXEC or PSEXEC service processes are spawned, particularly looking for parent-child relationships that may indicate unusual activity.

  - **Check Command-Line Arguments**: Analyze the command-line arguments used with PSEXEC. Look for unusual flags or paths that deviate from typical administrative usage, as they may indicate malicious intent.

  - **Correlate with Network Logs**: Investigate if the use of PSEXEC correlates with any unusual network traffic, such as connections to multiple systems in a short amount of time, which could signify an attacker leveraging the tool for lateral movement.

  - **Assess User Authorization**: Verify the user accounts executing PSEXEC to ensure they align with legitimate administrative roles. Unusual accounts or systems initiated by non-administrative users may warrant further scrutiny.

  ### Prioritization
  The severity of this alert is considered medium due to the potential risk associated with the misuse of a legitimate administrative tool like PSEXEC, which can enable attackers to spread laterally within the network and execute malicious commands, thereby compromising secure environments.

  ### Blind Spots and Assumptions
  This detection logic may not cover legitimate uses of PSEXEC, potentially leading to false positives. It assumes that process creation logs are enabled and comprehensive, capturing all relevant instances of PSEXEC usage. Additionally, without monitoring user privileges and network traffic concurrently, there's a risk of overlooking coordinated attacks that may blend in with normal administrative activities.

