note: |
  ### Technical Context

  This Sigma rule detects the execution of PSEXEC, which is commonly used for remote management tasks, including executing commands on remote systems. The likely attacker objective is to gain unauthorized access or execute commands on target machines, often for lateral movement or to establish persistence. This behavior corresponds to the MITRE ATT&CK technique "Remote Service Session Hijacking" (T1219). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process invocation details. If malicious, this activity can lead to significant compromise across a network, enabling attackers to control systems remotely. However, this alert alone does not confirm malicious activity without additional context, such as the legitimacy of the user account running PSEXEC.

  ### Investigation Steps

  - **Check process invocation details**: Review Security Event ID 4688 or Sysmon Event ID 1 for processes with "ParentImage" containing 'psexec.exe', 'psexec64.exe', or 'psexecsvc.exe'. Validate the user and the context of execution.

  - **Identify user account legitimacy**: Determine if the executing user has a legitimate reason for using PSEXEC. Unexpected user accounts or accounts with high privileges executing PSEXEC should be flagged.

  - **Analyze command executed via PSEXEC**: Look for command lines associated with the executed PSEXEC process. Record the "CommandLine" field from Event ID 4688 or Sysmon logs to assess suspicious activity patterns, such as connecting to remote machines or executing sensitive commands.

  - **Compare with known legitimate usage**: Validate the environment for legitimate PSEXEC usage, such as authorized IT administrative tasks. Frequently documented tasks should be reviewed against the alert.

  - **Evaluate system role and exposure**: Ascertain the role of the affected system. Critical systems (e.g., domain controllers, database servers) being accessed without proper authorization require immediate attention.

  - **Correlate with other security events**: Check for related events that may indicate compromise, such as failed logins (Event ID 4625) shortly before PSEXEC activity or unusual network connections during process execution.

  ### Prioritization

  This alert should be treated with medium severity due to the potential risks it presents, particularly on critical systems where PSEXEC is not typically utilized. The likelihood of malicious use is moderate, as PSEXEC is a legitimate tool often abused in environments lacking strict controls. The technique is commonly weaponized by attackers for lateral movement.

  ### Blind Spots and Assumptions

  Detection may miss instances if logging is not properly configured, particularly if Sysmon is not deployed or if relevant event logging is disabled. Legitimate IT administration tasks using PSEXEC could trigger this alert, necessitating careful investigation to differentiate between valid and malicious activity. A companion detection rule that monitors for unexpected network connections from PSEXEC execution would enhance coverage and provide more context to this detection.

