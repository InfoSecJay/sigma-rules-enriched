  ### Technical Context

  This rule detects outbound network connections towards specific domains associated with the OCS Inventory Remote Management Tool (RMM), indicating potential usage or misconfiguration of this tool. Attackers may exploit OCS Inventory for unauthorized asset enumeration or remote control, which could allow them to identify and manipulate systems within a network. The relevant MITRE ATT&CK tactics are Execution and Discovery, specifically technique T1219 (Remote Access Software).

  The primary telemetry source is Windows network connection logs, particularly monitoring DNS queries and connection attempts for events targeting the domains 'user_managed' and 'ocsinventory-ng.org'. If malicious, this behavior could indicate reconnaissance or exfiltration efforts. However, it is important to clarify that this detection alone does not confirm malicious intent; legitimate network operations may also trigger this alert.

  ---

  ### Investigation Steps

  - **Verify destination connections:** Check logs for any outbound connections to 'user_managed' and 'ocsinventory-ng.org' using Windows Security Event ID 5156 (Windows Filtering Platform) or similar network logs for connection attempts. Look for established connections without prior benign activity as a potential indicator of compromise.

  - **Cross-reference with known asset inventory:** Review the organization's authorized tools and systems inventory to validate whether OCS Inventory is expected to be used within your environment. Legitimate behavior may include regular network communication to these domains by designated IT assets.

  - **Examine process origins:** Investigate the process initiating the outbound connection. Windows Security Event ID 4688 can be referenced to identify the parent process and its command line arguments, determining if it relates to known legitimate use cases or a suspicious execution context.

  - **Assess historical behavior:** Review previous connection logs to determine if there is a pattern of access or unusual spikes in activity. Common benign connections will often follow a predictable pattern aligned with IT workflows, while anomalies (e.g., sudden high-frequency calls) may warrant further scrutiny.

  - **Look for additional threat indicators:** Use EDR or SIEM data to correlate the detected activity with other potential indicators of compromise (IOCs), such as suspicious user accounts or unauthorized administrative access attempts.

  ---

  ### Prioritization

  The alert has medium severity due to the potential impact on sensitive assets within the organization. The likelihood of malicious abuse is moderate, particularly if the environment does not regularly utilize OCS Inventory. Although this behavior is not commonly weaponized, it may serve as a precursor to more impactful compromise when combined with other indicators.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as usage of encrypted tunnels or alternative communication channels not monitored by standard logging practices. Reliable detection requires continuous monitoring of the configured Windows Filtering Platform and DNS resolution logs. Legitimate administrative operations could mistakenly trigger this alert if OCS Inventory is part of the organization's toolset. One related detection to consider is monitoring for unauthorized software installations or configurations that may misuse the OCS tool, enhancing overall security posture against such misuse.

