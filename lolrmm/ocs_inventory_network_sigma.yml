note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the OCS Inventory RMM tool, specifically targeting traffic to `*.ocsinventory-ng.org`. The likely objective of an attacker using this tool would be to gain unauthorized remote management or surveillance over compromised systems. This behavior aligns with the MITRE ATT&CK framework under the command-and-control tactic (TA0022) and technique ID T1219 (Remote Access Tools).

  Primary telemetry sources include Windows network connection logs, specifically focusing on destination hostnames and connection attempts. If the detected behavior is malicious, it could indicate unauthorized access or control of systems within the environment. Importantly, this detection does NOT confirm that the tool's use is malicious by itself, as there are legitimate scenarios where OCS Inventory tools are deployed for asset management.

  ### Investigation Steps

  - **Review network connection logs:** Check for Security Event ID 5156 (Windows Filtering Platform) to identify outbound connections to `*.ocsinventory-ng.org`. Note whether there are multiple connections in a short time frame, which may indicate malicious intent.

  - **Verify the legitimacy of the application:** Investigate the presence of OCS Inventory RMM on affected hosts. Check file paths (e.g., C:\Program Files\OCS Inventory NG\) and installation timestamps indicating legitimate deployment versus unexpected installation.

  - **Cross-reference user activity:** Examine related logins (Security Event ID 4624) during the same timeframe as the detected network activity. Confirm whether the users are authorized to access OCS Inventory and are using it for legitimate purposes.

  - **Analyze external communications:** Use network traffic analysis tools to filter for DNS queries related to `*.ocsinventory-ng.org`. If found, evaluate the frequency and volume of these queries as typical legitimate usage will exhibit consistent, low-frequency requests rather than abrupt surges.

  - **Identify recognized malicious indicators:** Look for unusual behavior in the application logs if the OCS agent is present, such as unexpected configuration changes or installations around the same time as the network connections (log fields: timestamp, action types, source IP).

  ### Prioritization

  This alert should be treated with medium severity given the potential impact of unauthorized remote management tools on enterprise systems. The likelihood of abuse is moderate, as OCS Inventory tools can be both legitimate and malicious, but malicious usage scenarios exist. While this behavior is not highly prevalent, remote management tools are often weaponized during lateral movement in environments.

  ### Blind Spots and Assumptions

  Detection could be bypassed if an adversary uses encryption or other domains not associated with OCS Inventory. Reliable detection requires ensuring that network traffic logs are being captured and are adequately monitored for external outbound connections. Legitimate administrative activities such as scheduled asset inventory scans may trigger this alert, potentially leading to false positives. An important companion detection would be monitoring other remote access tool communications to identify potential phishing or unauthorized access attempts.

