note: |
  ### Technical Context

  This rule detects potential network activity originating from the OCS Inventory RMM tool by monitoring connections to specific domain names like 'user_managed' and 'ocsinventory-ng.org'. The likely attacker objective may involve leveraging this tool for remote command execution or data exfiltration, as it can provide system inventory details. This behavior falls under the MITRE ATT&CK tactic of Command and Control (T1071) and technique of Application Layer Protocol (T1219). The primary telemetry sources include Windows network connection logs, specifically looking for outbound connections to the specified hostnames. If malicious, this activity could enable an attacker to maintain persistence, gather sensitive data, or manipulate endpoint operations. However, this detection does not confirm that the tool is being used maliciously on its own, as OCS Inventory may also be employed legitimately in an environment.

  ### Investigation Steps

  - **Check Network Connections:** Review Windows network connection logs (Event ID 5156) for outgoing connections to 'user_managed' or 'ocsinventory-ng.org'. Observe connection timestamps and source IP addresses for anomalies.

  - **Evaluate User Activity:** Monitor recent user account activity via Event ID 4624 (logon events) to confirm if legitimate administrators are linked to the detected connections. Expect to see admin accounts associated with scheduled inventory scans.

  - **Verify Tool Installation:** Investigate the presence of OCS Inventory Agent on endpoints, checking for installation paths or common registry entries that indicate legitimate deployment (e.g., `HKLM\Software\OCS Inventory\`). If found, document versions for comparison.

  - **Analyze Contextual Traffic:** Capture and analyze full packet capture (PCAP) around the time of the alert to determine the nature of the traffic (e.g., data flow types, payload contents). Look for any sensitive data being transmitted that could indicate misuse.

  - **Identify High-Confidence Malicious Indicators:** Look for unexpected outbound connections during off-hours or from non-administrative accounts that connect to the flagged domains, particularly if IPV4 or IPV6 addresses are reused across different endpoints without expected authorization.

  ### Prioritization

  The severity of this alert is medium as it indicates potential misuse of a legitimate system administration tool. Given the criticality of affected systems typically associated with remote management, there is a moderate likelihood of malicious exploitation. While the OCS Inventory tool can be weaponized for malicious purposes, it is also regularly used in enterprise environments, necessitating careful consideration during triage.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques such as IP whitelisting or domain fronting that could mask malicious activity. Reliable detection requires the inclusion of Windows firewall logs to capture all outbound connection attempts effectively. Legitimate activities such as scheduled inventory updates from the OCS tool may trigger these alerts, making contextual analysis vital. Companion detections valuable for strengthening coverage may include alerts for unusual scheduled task creation (T1053.005) that correspond with the OCS Inventory tool usage patterns.

