note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Supremo Remote Management Tool (RMM), such as `supremosystem.exe`, `supremo.exe`, `supremohelper.exe`, and `supremoservice.exe`. An attacker may utilize Supremo to gain unauthorized remote access to target systems, often with the intent to exfiltrate data or conduct further malicious activities. The relevant MITRE ATT&CK tactic is "Execution" and the technique is "Remote Services" (T1219).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which detail executable processes launched on a system. If malicious, the use of Supremo could result in the unauthorized control of systems, data breaches, or lateral movement within the network. However, this detection alone does not confirm malicious intent, as Supremo may also be used legitimately for remote administration tasks.

  ### Investigation Steps

  - **Identify the process execution:** Review Security Event ID 4688 or Sysmon Event ID 1 for process launch events tied to any of the detected Supremo binaries, focusing on the `NewProcessName` field.

  - **Check parent process details:** Cross-reference the `ParentImage` field in the process creation logs. If the parent process is a known administrative tool or legitimate software in your environment, this may indicate benign activity.

  - **Search for remote connections:** Inspect networking logs for outbound connections from the detected processes to any unusual IP addresses or domains, using tools like Windows Firewall or network monitoring logs (e.g., Event ID 5156) to identify suspicious contact points.

  - **Review asset criticality:** Assess the role of the affected system. If it’s a critical server or contains sensitive data, prioritize this alert for immediate investigation due to the higher risk associated with potential compromise.

  - **Evaluate legitimate usage patterns:** Identify any documented use of Supremo in your environment. Consult team members responsible for remote access tools to confirm if recent usage aligns with normal operational patterns.

  - **Correlate with incident history:** Look for any prior incidents or alerts related to the execution of remote access tools on the compromised system within your SIEM, ensuring a comprehensive understanding of potential persistence mechanisms.

  ### Prioritization

  This alert has a medium severity due to the potential impact of the affected system and a moderate likelihood of abuse by malicious actors. Remote access tools like Supremo are commonly weaponized for unauthorized control, especially in targeted environments, necessitating prompt analysis to mitigate the risk.

  ### Blind Spots and Assumptions

  Detection may be limited if processes use alternate names or if file paths are obfuscated. Additionally, the presence of these executables does not confirm malicious activity as legitimate users may employ Supremo for valid administrative tasks. Ensure proper logging for process creation and remote access tool usage to improve detection efficacy. Companion detections, such as alerts for known remote access connections or unusual login patterns, can augment coverage and context for investigations.

