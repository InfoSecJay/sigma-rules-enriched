note: |
  ### Technical Context
  This rule detects the execution of processes associated with the Supremo Remote Management Tool (RMM). Supremo is legitimate remote desktop software that may also be used by threat actors to facilitate unauthorized access, manage compromised systems, or perform malicious activities in a target environment. Attackers may leverage Supremo to bypass traditional security controls and thus maintain persistence on infected systems or conduct lateral movement across networks.

  The relevant MITRE ATT&CK tactics here include **Execution** (TA0002), where attackers run malicious programs or scripts, and specifically the technique **Remote Services: Remote Desktop Protocol** (T1219), which encompasses the use of legitimate remote access tools like Supremo. Evidence for these activities can primarily be found in process creation logs collected from Windows systems.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze logs for instances of processes with names ending in `supremo.exe`, `supremoservice.exe`, `supremosystem.exe`, or `supremohelper.exe`. Pay attention to the parent-child relationships to gauge whether these processes were initiated by a suspicious parent process.

  - **Check for Legitimate Usage:** Investigate internal documentation or speak with relevant personnel to determine if there is an authorized use case for Supremo in your environment. This may include checking against known allowed applications lists.

  - **Correlate with User Activity:** Look up the user accounts that initiated the Supremo processes. Cross-reference this information with sign-in logs to identify any anomalous or unauthorized user behaviors that coincide with the timing of the detected activity.

  - **Examine Network Connections:** Monitor outbound connections from the system running Supremo to identify any unusual IP addresses or domains being accessed, as these could indicate additional malicious actions or other compromised systems.

  ### Prioritization
  The severity level of this alert is set to medium due to the potential misuse of Supremo as a remote management tool, which can facilitate unauthorized access and control over systems. In an enterprise environment, the likelihood of exploitation increases, particularly where employees may use such tools without proper oversight or where attackers exploit these tools for malicious purposes.

  ### Blind Spots and Assumptions
  This detection rule may not capture every instance of Supremo usage, especially if the tool is explicitly whitelisted or if its executable names are altered by an attacker to evade detection. Additionally, the detection logic assumes that the responsible user and process relationships remain intact, which might not be the case in environments with wide-ranging privilege escalation or where processes are obfuscated. To ensure effectiveness, complete and accurate process creation logs must be retained and configured appropriately across all endpoints.

