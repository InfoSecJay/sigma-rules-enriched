note: |
  ### Technical Context

  This Sigma rule detects registry activity associated with the SimpleHelp Remote Management and Monitoring (RMM) tool. The likely attacker objective includes establishing remote access or persistence on compromised systems by leveraging SimpleHelp, which can provide a means for control and exfiltration of data. This behavior aligns with the MITRE ATT&CK tactic **Command and Control** (TA0011) and technique **Application Layer Protocol** (T1219).

  The primary telemetry source involves Windows Registry events, specifically monitoring actions targeting the uninstall key of the SimpleHelp software. If malicious, the security impact could be substantial, as it may indicate unauthorized remote access. However, this detection does NOT confirm malicious intent or activity on its own, as legitimate installations of SimpleHelp can occur in a corporate environment.

  ### Investigation Steps

  - **Check for Registry Activity**: Review Windows Registry event logs (Event ID 4663) for access to the key `HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\SimpleSetup`. Document who accessed it and the time of access.

  - **Correlate with Process Activity**: Look for process creation events (Sysmon Event ID 1) that correspond to the registry access. Pay attention to processes such as `SimpleHelp.exe` and any associated scripting or command shells that may indicate automation.

  - **Validate Legitimate Uses**: Verify if the SimpleHelp RMM tool is known and sanctioned within the organization. Cross-reference asset inventory and documentation to confirm expected installations.

  - **Examine Network Connections**: Inspect outbound network connections (Firewall logs, Event ID 5156) from the host for any protocols (e.g., TCP to ports typically used by SimpleHelp) that could be indicative of command and control behavior.

  - **Review User Activity**: Analyze user actions (Event ID 4648) around the time of registry access. Check for unusual logins, specifically from non-administrative accounts that may indicate lateral movement or abuse of privileges.

  - **Identify Malicious Indicators**: Look for anomalies such as registry value creation or modification indicating tampering (Event ID 4661) on the target key that don’t align with scheduled jobs or known administrative activities.

  ### Prioritization

  This alert is of medium severity due to the potential for SimpleHelp to be weaponized for unauthorized remote access. While the tool may be routinely used in legitimate settings, the context of usage and the system role greatly influence the likelihood of malicious activity. If a critical system is involved, this alert warrants prompt escalation and investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of SimpleHelp within the environment, which can create noise in alerts. Missing or improperly configured registry monitoring can hinder effective detection. Additionally, benign administrative actions or legitimate remote support could trigger this alert. A companion detection for monitoring unauthorized software installations through software inventory or change logs would enhance coverage and context for this detection.

