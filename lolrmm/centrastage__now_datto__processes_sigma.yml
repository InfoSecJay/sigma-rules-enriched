note: |
  ### Technical Context

  This rule detects process activity related to CentraStage (now known as Datto), particularly the execution of `CagService.exe` and `AEMAgent.exe`. The likely attacker objective is to establish persistent remote access to the system, leveraging these Remote Monitoring and Management (RMM) tools for malicious purposes like data exfiltration or lateral movement. This activity aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1219).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. The security impact of malicious use can include unauthorized access, system compromise, and potential data breaches. This detection does NOT confirm whether the processes were executed for legitimate or malicious purposes without further investigation into the context and associated activities.

  ### Investigation Steps

  - **Identify process details: **Review Security Event ID 4688 and Sysmon Event ID 1 for `CagService.exe` and `AEMAgent.exe`. Look for the `Image` and `ParentImage` fields for match cases. Confirm the creation time and user context to assess potential malicious origins.

  - **Analyze parent process: **Focus on the ParentImage field. If the parent process is unrelated to legitimate RMM usage (e.g., not part of an expected management framework), it indicates a higher likelihood of malicious intent.

  - **Correlate with network activity: **Examine related outbound connections in Windows Firewall logs or network telemetry, focusing on unusual or unauthorized IP addresses or domains associated with the related processes. Check for common C2 protocols used during such commands.

  - **Review legitimate use cases: **Identify scheduled tasks or known IT management events involving Datto in your environment. Normal usage might show predictable times or patterns, which can help differentiate from potential threats.

  - **Check for anomalous behavior: **Investigate if multiple instances or excessively frequent invocations of either process occur within a short time frame, indicating a potential attack scenario. Look for unusual command-line arguments or high resource usage patterns.

  - **Document asset criticality: **Verify if the affected system is part of a critical infrastructure or sensitive environment. Assess potential impacts and prioritize investigations accordingly to understand the risk level better.

  ### Prioritization

  Alerts generated from this detection should be considered medium severity. This is due to the moderate impact of the affected system if used maliciously, the reasonably high likelihood of abuse by adversaries familiar with using RMM tools, and the recognition that similar behaviors are regularly weaponized in cyberattacks.

  ### Blind Spots and Assumptions

  This detection is limited by the potential for evasion through legitimate use of Datto, making contextual understanding essential. It requires active logging of process creation events and Sysmon configurations to be effective. Activities such as legitimate RMM sessions initiated by IT staff may trigger the alert. Complementary detections, such as monitoring for unusual outbound network connections or discrepancies in process creation timestamps, will strengthen overall coverage and reduce false positives.

