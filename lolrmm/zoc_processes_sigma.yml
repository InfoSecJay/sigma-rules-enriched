note: |
  ### Technical Context
  This rule detects the execution of processes associated with the ZOC RMM tool, specifically instances where the process `zoc.exe` is either launched directly or is the child of another process that has `zoc.exe` as a parent. The presence of ZOC RMM tool activity may indicate remote management or monitoring actions that could be legitimate or malicious depending on the context of usage. Attackers may leverage such tools to maintain access to a compromised environment, perform lateral movement, or conduct reconnaissance.

  The suspected tactic is **Execution**, specifically applicable to the MITRE ATT&CK technique **T1219: Remote Access Tools**. Detecting this activity is critical in environments where such tools may be used for legitimate remote administration, but also raise the potential for misuse by threat actors aiming to exploit remote capabilities.

  The primary data source for this detection is process creation logs, which can provide insights into which processes are starting, their parent-child relationships, and the associated executable paths that can help differentiate between legitimate administrative actions and potentially suspicious ones.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze Windows process creation logs for `zoc.exe` instances and their parent processes. Pay attention to unusual invocation patterns or execution from non-standard user accounts.
  - **Correlate with Remote Session Logs**: Check Remote Desktop Protocol (RDP) logs or connections to remote management systems to see if `zoc.exe` usage aligns with unusual remote access patterns.
  - **Assess User Activity**: Investigate the user accounts initiating these processes; confirm whether they have a legitimate reason to be using the ZOC tool and assess their activity leading up to the execution.
  - **Analyze Network Traffic**: Examine network connections initiated by `zoc.exe` for any unusual external communications that may indicate data exfiltration or command and control (C2) activity.

  ### Prioritization
  This alert holds medium severity due to the dual nature of the ZOC RMM tool as both a legitimate administrative tool and a potential vector for unauthorized access. The likelihood of encountering malicious use is moderate, especially in environments with increased remote access practices.

  ### Blind Spots and Assumptions
  This detection logic assumes that the presence of the `zoc.exe` process is of interest, but does not account for legitimate administrative use cases that may lead to false positives. There may be gaps in detection if logs related to parent processes are not available or are filtered out before analysis. Additionally, organizations need to ensure that process creation logging is enabled and configured correctly across all endpoints for this detection to function effectively.

