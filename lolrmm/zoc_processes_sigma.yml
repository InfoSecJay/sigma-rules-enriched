note: |
  ### Technical Context

  This Sigma rule detects the execution of the ZOC RMM (Remote Monitoring and Management) tool, with a focus on its processes being spawned either directly or as a result of the parent process `zoc.exe`. The likely attacker objective is to use ZOC as part of a remote access operation, potentially allowing unauthorized control over systems for further exploitation. This behavior falls under the MITRE ATT&CK tactic **Command and Control** (T1071) and technique **Application Layer Protocol** (T1219). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing process execution details.

  If malicious, this activity can lead to unauthorized system access and data exfiltration. However, the detection of `zoc.exe` on its own does NOT confirm malicious activity, as it could represent legitimate administrative or remote support tasks.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for `zoc.exe`. Look for the command line used during the execution to identify parameters that may indicate malicious intention (e.g., unusual flags or queries).

  - **Identify parent process**: Analyze the parent process of `zoc.exe`. If the parent is also from a trusted application or known administrative tools, this may indicate legitimate usage. Note any unusual parent processes.

  - **Verify user context**: Check the account associated with the process creation. Legitimate administrative accounts may justify usage, while obscured or low-level accounts can suggest potential compromise, especially in non-administrative roles.

  - **Monitor network activity**: Analyze network logs for any outbound connections made by the ZOC process, specifically for connections to unusual IP addresses or domains, which would indicate potential data exfiltration or C2 communication.

  - **Cross-reference other detections**: Look for indicators of other malicious behavior in close temporal proximity, such as failed login attempts or other uncommon process executions, which can suggest a coordinated attack.

  ### Prioritization

  This alert should be treated as medium severity. The impact of affected systems can be significant, particularly if the ZOC RMM tool is used maliciously. The detection indicates behaviors commonly weaponized by adversaries using RMM tools for nefarious access, but it also requires context to prevent overreaction to legitimate administrative activities.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using legitimate credentials or non-standard paths to execute ZOC. Reliable detection requires logs from all endpoints, configured to capture process creation accurately. Legitimate administrative activities, such as authorized remote support sessions, may trigger this alert. Companion detections like monitoring for abnormal network traffic or other remote access tools can provide valuable context and strengthen coverage.

