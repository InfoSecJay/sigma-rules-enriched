note: |
  ### Technical Context

  This Sigma rule detects the execution of the ZOC Remote Monitoring and Management (RMM) tool, specifically identifying processes related to `zoc.exe`. The likely attacker objective is to gain unauthorized remote access or management capabilities over compromised systems or networks. This behavior fits within the MITRE ATT&CK framework under the tactic of "Execution" and the technique "Remote Services" (T1219).

  Primary telemetry sources for this detection include Windows process creation logs, specifically focusing on Event ID 4688 from Windows Security logs or Sysmon Event ID 1. The security impact is significant if malicious, as ZOC can facilitate remote control and exploitation of system resources. However, this detection does NOT confirm that malicious activity is occurring on its own, as ZOC may also be used legitimately by IT support teams.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security logs for Event ID 4688 or Sysmon Event ID 1 for any instances where the `Image` or `ParentImage` fields end with `zoc.exe`.

  - **Identify related parent processes**: Investigate the parent process of `zoc.exe` to determine if it was launched by a known and benign application, which may indicate legitimate use.

  - **Verify execution context**: Examine the user context under which `zoc.exe` was executed, looking for unusual user accounts or elevated privileges in the "SubjectUserName" field of Event ID 4688.

  - **Search for additional artifacts**: Look for any associated files or registry entries related to ZOC, such as installation logs or configuration files, to confirm its intended purpose. Check paths referenced in Event ID 4688.

  - **Document system role and criticality**: Assess the asset involved in the alert; a critical server running ZOC without valid justification may indicate a higher risk than the same process running on a non-critical device.

  - **Look for command line arguments**: Review the "NewProcessName" field in logs for arguments passed to `zoc.exe`, which may indicate whether it was used for legitimate remote support or for malicious activity.

  ### Prioritization

  This alert has medium severity as the ZOC tool can be used legitimately by IT administrators for remote support, but it may also be exploited by attackers for unauthorized access. The risk is heightened if the execution occurs on critical assets within the enterprise.

  ### Blind Spots and Assumptions

  There are limitations in detecting legitimate use of ZOC versus malicious use, especially if the tool is used for valid IT management activities. Essential log sources include both Windows Security and Sysmon to provide a full picture of the process lifecycle. Legitimate remote support activities may trigger this alert, particularly in environments where ZOC is commonly employed for employee support. A related detection rule for monitoring unusual remote access behaviors would strengthen coverage against potential misuse.

