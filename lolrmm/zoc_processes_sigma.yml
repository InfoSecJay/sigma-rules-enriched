  ---

  ### Technical Context

  This Sigma rule detects potential activity from the ZOC Remote Management and Monitoring (RMM) tool by identifying processes initiated by or related to `zoc.exe`. The likely attacker objective is to maintain persistent remote access to systems, allowing for administrative control, data harvesting, or further compromise within the network. This activity is associated with the ATT&CK technique for Exchange of Information (Tactic: Execution, Technique: T1219).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, an advanced adversary could exploit ZOC for lateral movement or command execution on targeted machines. Importantly, this detection does NOT confirm malicious activity on its own; it only indicates the presence of the ZOC tool, which may also be used legitimately.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for events where `ParentImage` ends with `zoc.exe` and `Image` is `zoc.exe`. Analyze the creation time and user context for any abnormal activity.

  - **Identify network activity:** Inspect network logs for unusual connections (e.g., unusual IP addresses or ports accessed) initiated by the zoc.exe process. Look for outbound connections that deviate from normal patterns for the affected host.

  - **Review legitimate use cases:** Validate the context of ZOC usage by confirming whether this software is approved and regularly used within your organization, particularly by remote support teams or IT personnel.

  - **Search for high-confidence indicators:** Look for unusual command-line arguments in the process creation logs related to `zoc.exe`, such as parameters that suggest configuration changes or remote execution capabilities that are not typical for standard operations.

  - **Correlate with asset criticality:** Identify the role of the host running `zoc.exe`, especially if it is a critical asset. Priority should be given to alerts on servers or endpoints with sensitive information or elevated privileges.

  ---

  ### Prioritization

  This alert is categorized with medium severity due to the potential impact on critical systems and the increased likelihood of malicious use by adversaries leveraging remote access tools. The behavior is associated with known exploitation techniques and is increasingly weaponized in various attack scenarios, thus requiring prompt investigation and remediation.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include legitimate activities, such as authorized ZOC usage by IT staff, which can generate false positives. Reliable detection requires ensuring comprehensive logging configurations for process creation events and monitoring network traffic associated with RMM tools. A related detection could involve monitoring for unusual remote connection attempts (e.g., RDP or SSH logs), enhancing overall visibility into remote access activities.

