note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the Visual Studio Dev Tunnel Remote Monitoring and Management (RMM) tool. The attacker objective may involve using legitimate tools for nefarious purposes, such as creating covert remote access channels to compromised systems. This activity relates to the MITRE ATT&CK framework tactic of "Execution" (TA0002) and the technique "Remote Services" (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically focusing on destination hostnames resolved to Visual Studio relay tunnels. The security impact of such malicious activity could range from unauthorized remote access to potential persistence on the affected system. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate users may also utilize the Visual Studio Dev Tunnel tool.

  ### Investigation Steps

  - **Check outbound traffic logs: ** Review Windows network connection logs (Event ID 5156) for connections to `global.rel.tunnels.api.visualstudio.com`, `*.rel.tunnels.api.visualstudio.com`, and `*.devtunnels.ms`. Note that legitimate connections should correlate with documented use cases of Visual Studio by known developers.

  - **Validate the process making connections: ** Investigate the process IDs associated with these network connections using Sysmon Event ID 3. Look for unusual processes or parent-child relationships, such as command-line arguments that deviate from legitimate development activities.

  - **Cross-reference user accounts: ** Establish the user accounts initiating these connections through security logs (Event ID 4624). Flag any anomalous accounts not associated with development tasks, especially those with elevated privileges that are not typically used in Visual Studio operations.

  - **Look for additional indicators of compromise: ** Review for elevated system privileges or the creation of unexpected scheduled tasks or services following the use of Dev Tunnel connections (Sysmon Event ID 1 and 22). Presence of such alterations may indicate malicious behavior.

  - **Identify connectivity patterns: ** Analyze if similar connections are occurring across multiple hosts in the environment, especially in high-value asset areas. Consistent occurrences may suggest a coordinated campaign against the organization.

  ### Prioritization

  This alert carries a medium severity level due to the potential impact of remote access tools being used within the network, particularly on production systems. The likelihood of malicious abuse is notable, considering adversaries commonly leverage legitimate tools for persistence and lateral movement, making it crucial to identify unauthorized usage swiftly.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for evasion techniques such as tunneling over encrypted protocols, which might go undetected. Ensure proper logging configurations for network connections are enabled on monitored endpoints to capture all traffic. Legitimate activity may include standard use of the Visual Studio Dev Tunnel by authorized developers, highlighting the importance of contextual understanding. Related detections to consider include alerts for unusual user behavior through account activity logs, which can strengthen overall monitoring and incident response efforts.

