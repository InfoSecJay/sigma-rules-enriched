note: |
  ### Technical Context

  This rule detects network connections targeting the Visual Studio Dev Tunnel service, which may indicate the use of a remote management tool disguised as legitimate activity. The likely attacker objective would be to establish command and control (C2) or exploit remote management capabilities. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique T1219 for Remote Access Software.

  The primary telemetry source is Windows network connection logs, specifically capturing connections to known Visual Studio Dev Tunnel endpoints. If malicious, this activity could facilitate unauthorized access to systems or data exfiltration. It is important to note that this detection does NOT confirm that the activity is malicious in nature, as legitimate use of the Visual Studio Dev Tunnel may also trigger this alert.

  ### Investigation Steps

  - **Check network connections:**
    Review Windows Security Event ID 5156 logs for outbound TCP connections to "global.rel.tunnels.api.visualstudio.com" or "*.devtunnels.ms". Look for high-frequency connections or unusual hosts that are not part of typical development workflows.

  - **Identify calling processes:**
    Cross-reference Event ID 4688 (Process creation) to identify any processes that initiated connections to the flagged domains. Legitimate instances should primarily involve software development tools, with common parent processes being Visual Studio or similar IDEs.

  - **Investigate recent installations:**
    Examine installed software lists through PowerShell or software inventory tools for any recent installations or updates pertaining to Visual Studio or RMM tools. Unexpected installations may indicate malicious activity.

  - **Look for user behavior anomalies:**
    Analyze user login activity (Event ID 4624) around the time of the network activity. Check for any unfamiliar accounts or access from atypical workstations, particularly for sensitive roles.

  - **Monitor data transfer volume:**
    Investigate network traffic logs (using tools such as NetFlow or full packet capture) associated with the connections. High data transfer volumes to the detected endpoints could indicate data exfiltration attempts.

  ### Prioritization

  This alert is of medium severity as it may indicate malicious behavior such as C2 or unauthorized remote access, particularly on sensitive or critical infrastructure. Given that remote management tools can be weaponized, any activity involving these connections warrants immediate investigation to rule out misuse.

  ### Blind Spots and Assumptions

  This detection may be bypassed if the malicious actor uses alternate domain names or encrypted channels to communicate with a C2 server. Reliable detection requires the housing of all relevant network logs and proper configurations ensuring visibility into outbound connections. Legitimate activities could include authorized dev teams using Visual Studio's tunneling features, making context important. Monitoring for related activity, such as unexpected PowerShell command execution, can enhance detection capabilities.

