note: |
  ### Technical Context

  This Sigma rule detects potential network activity generated by the Visual Studio Dev Tunnel RMM tool, specifically when connecting to designated Visual Studio tunnel API endpoints. Attackers may employ this tool to facilitate remote maintenance, potentially leading to unauthorized access or exfiltration of sensitive data. This detection corresponds to the MITRE ATT&CK technique "Remote Services" (T1219).

  The primary telemetry sources for this detection include Windows network connection logs. If malicious, the security implications could involve unauthorized remote access facilitating lateral movement or data theft. Notably, this detection does NOT independently confirm malicious intent; legitimate use of Visual Studio Dev Tunnel is a common scenario that could trigger this alert.

  ### Investigation Steps

  - **Check network connection logs:** Query Windows network connection logs (Event ID 5156) for outbound connections to domains ending with 'global.rel.tunnels.api.visualstudio.com', '*.rel.tunnels.api.visualstudio.com', or '*.devtunnels.ms'.

  - **Identify the process:** Inspect the process associated with the outbound connection by correlating to Event ID 4688 to determine if it originated from a legitimate, expected application context (e.g., Visual Studio IDE) or an unexpected process.

  - **Validate usage patterns:** Assess whether the endpoint user has recently engaged in activities associated with Visual Studio development, such as recent console sessions or code compilation tasks that would warrant the use of the Dev Tunnel.

  - **Determine frequency and timing:** Pattern analysis of connections over time; unusual spikes or connections during off-hours may indicate potentially malicious activity compared to expected legitimate patterns.

  - **Investigate endpoint security logs:** Review antivirus or endpoint detection and response (EDR) logs for any blocks or alerts related to Visual Studio applications, which could indicate abnormal usage of the Dev Tunnel.

  ### Prioritization

  The alert severity is medium due to the potential impact of remote access tools on sensitive systems if misused. The likelihood of malicious abuse exists, particularly if the endpoint/system is critical or contains sensitive data. While this behavior is not commonly weaponized, it signifies an avenue for attackers if they can leverage trusted development tools for nefarious purposes.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate Visual Studio Dev Tunnel activity can easily trigger the rule, leading to false positives. Additionally, specific logging configurations may be necessary to capture all relevant network connections comprehensively. It's important to note that developers using Remote Management practices can generate similar network patterns. A related detection to consider is monitoring for API calls to local development environments that would indicate anomalous tunnel usage (e.g., unusual API activity on localhost).

