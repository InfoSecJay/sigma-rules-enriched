note: |
  ### Technical Context

  This Sigma rule detects network connections established to specific Visual Studio Dev Tunnel hostnames, which may indicate the use of Remote Management and Monitoring (RMM) tools. Adversaries may utilize RMM tools for remote access to compromised systems, allowing them to execute commands, steal data, or install additional malware. This behavior aligns with the MITRE ATT&CK tactic "Command and Control" (T1071) and technique "Application Layer Protocol" (T1219).

  The primary telemetry source for this detection involves Windows network connection logs. The presence of outbound connections to the observed devtunnels domains suggests potential misuse or malicious activity. However, this detection does NOT on its own confirm malicious intent, as there are legitimate use cases for Visual Studio Dev Tunnel in software development.

  ### Investigation Steps

  - **Check active network connections:** Review Windows Security Event ID 5156 to list active outbound connections. Look for connections to `*.devtunnels.ms` and `*.visualstudio.com`. Legitimate connections typically originate from user-initiated development activities.

  - **Examine process details:** Cross-reference the connections with Security Event ID 4688 to identify the parent process. A typical process should be tied to known development tools (e.g., Visual Studio). Look for unexpected processes or indicators of command-line parameters that do not fit legitimate use.

  - **Review related user activity:** Analyze Windows Event ID 4624 to assess which user was active at the time of the connection. High-risk indicators are user accounts that do not normally engage with development tools but are initiating these connections.

  - **Inspect for command execution:** Use Windows Sysmon Event ID 1 and Event ID 23 to correlate any command-line arguments and the presence of suspicious executables using RMM tools. Malicious indicators may include executables from unexpected directories or unusual command structure.

  - **Validate tools and application usage:** Verify installation paths and timestamps from Windows Event ID 1033 (Application Installed). Legitimate use should show expected patterns for Visual Studio Dev Tunnel installations. Anomalies may suggest unwanted software deployment.

  ### Prioritization

  This alert has a medium severity due to the potential impact of compromised systems through remote management tools. The likelihood of malicious abuse is moderate, considering the common use of such tools in both development and malicious contexts. The behavior has been weaponized, which raises concerns regarding unauthorized access.

  ### Blind Spots and Assumptions

  The main detection limitation lies in potential evasion techniques, such as adversaries using less common domains or encrypted tunnels that bypass standard monitoring. Reliable detection requires comprehensive logging configurations for all network connections, including DNS queries. Legitimate activities may frequently trigger this alert when developers are actively using Visual Studio Dev Tunnel for project work. A related detection to strengthen coverage would be monitoring DNS queries for the mentioned domains to catch early signs of malicious activity before a connection is established.

