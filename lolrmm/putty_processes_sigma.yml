note: |
  ### Technical Context

  This rule detects instances of the PuTTY Remote Management and Monitoring (RMM) tool being invoked either as a standalone process or spawned by another instance of PuTTY. The primary objective of the attacker may be to establish a command-and-control (C2) channel, allowing them to manipulate or exfiltrate data from compromised systems. This behavior aligns with the MITRE ATT&CK framework under the tactic of Command and Control (T1071.001 – Application Layer Protocol: Web Protocols).

  Primary telemetry sources include Windows process creation logs (Security Event ID 4688 or Sysmon Event ID 1), which capture process invocation details, such as the parent and child processes involved. If malicious, this activity could lead to unauthorized access or control over target systems. However, this detection does NOT confirm malicious intent since PuTTY is often used legitimately for remote administration purposes.

  ### Investigation Steps

  - **Review process creation logs**: Search for Security Event ID 4688 and Sysmon Event ID 1. Look for processes created with "Image" or "ParentImage" fields containing '\putty.exe'. Analyze timestamps and associated user accounts for context.

  - **Identify parent process behavior**: If PuTTY is spawned from another legitimate administration tool (e.g., a remote desktop management application), it could be benign. Document normal usage patterns of PuTTY from known administrators.

  - **Check execution context for anomalies**: Look for unusual user accounts executing PuTTY, especially if the user typically doesn’t require remote access. Review the "CommandLine" field for any arguments that suggest unconventional behavior.

  - **Verify network activity**: Inspect outbound connections made by the detected instances of PuTTY. Look for unusual destinations or unexpected ports (e.g., not typical workstation targets) in network logs.

  - **Cross-check for indicators of compromise (IoCs)**: Validate any associated artifacts (e.g., script files or configuration changes) that may have been leveraged by the RMM tool, especially related to credential dumps or lateral movement.

  - **Assess system criticality**: If detected on a system categorized as high-value or critical infrastructure, prioritize immediate review and potential containment measures to prevent unauthorized access.

  ### Prioritization

  This alert has medium severity due to its potential impact on sensitive systems and the likelihood of malicious use. Given that PuTTY is a commonly exploited tool for establishing persistence and C2, the detection warrants timely investigation.

  ### Blind Spots and Assumptions

  This detection may miss instances where PuTTY is legitimately used for remote administration; additional logs (like user activity monitoring) may be needed to distinguish operational use from malicious actions. Attackers may employ various evasion techniques such as renaming PuTTY or using encrypted communication channels. A related detection could involve monitoring for unexpected use of Windows Task Scheduler to launch PuTTY, enhancing visibility into potentially malicious automation.

