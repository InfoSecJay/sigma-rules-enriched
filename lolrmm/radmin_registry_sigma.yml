note: |
  ### Technical Context

  This rule detects modifications to the Windows registry, specifically targeting the RAdmin Remote Monitoring Management (RMM) tool settings under the key `HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin Security`. This behavior may indicate an attacker is attempting to manipulate remote access settings to enable stealthy access to the system. The relevant MITRE ATT&CK tactic is "Execution" with the technique ID T1219.

  The primary telemetry source for this alert is Windows Registry Event Logs, specifically logs that capture changes to registry keys. If the behavior is malicious, it can provide adversaries with unauthorized remote access, enabling further exploitation. However, this detection does not confirm active malicious behavior on its own; further investigation is required to establish intent.

  ### Investigation Steps

  - **Review registry modification events:** Check for Registry Event ID 4657 to see if unauthorized changes were made to the RAdmin key. Note the user context and timestamp to understand the modification scope.

  - **Identify the user account involved:** Use the Security Event ID 4624 to correlate the user account with the registry changes. Legitimate use may involve administrative accounts, while anomalous accounts could indicate malicious intent.

  - **Examine related security logs:** Look at Windows Security log Event ID 4688 for process creation events around the same time as the registry modification. Check for associated PowerShell (Event ID 4104) or cmd.exe activity to identify potential malicious workflows.

  - **Confirm RAdmin usage in the environment:** Validate the organization's known use of RAdmin by reviewing system inventory or deployment documentation. If present, expected registry keys or values should match documented configurations.

  - **Check for remote connections:** Look at Firewall logs or Event ID 5156 to determine if remote connections were made to the RAdmin service after registry changes. Legitimate use cases would show consistent connection patterns from known IP addresses.

  ### Prioritization

  The severity of this alert is medium, as it targets registry changes that could facilitate unauthorized remote access. Given that RAdmin is a known administrative tool, the likelihood of malicious abuse increases when the detection is triggered on systems that are not recognized for its normal use. This behavior is often weaponized by attackers for persistence and lateral movement strategies.

  ### Blind Spots and Assumptions

  The detection may be limited by the possibility of users leveraging RAdmin legitimately, resulting in false positives. Reliable detection necessitates comprehensive logging of registry modifications and process creations, as well as contextual awareness of authorized RAdmin deployments. Additionally, the use of remote desktop software or legitimate IT support queries may trigger this alert. A related detection to strengthen coverage could include monitoring for unauthorized software installations or configurations indicative of remote access tools.

