note: |
  ### Technical Context

  This Sigma rule detects activity related to the RAdmin Remote Management Tool, specifically monitoring for registry changes within the path `HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin Security`. The likely attacker objective is to establish unauthorized remote control over a compromised machine, enabling further exploitation or data exfiltration. The relevant MITRE ATT&CK techniques include Command and Control (T1071 – Application Layer Protocol) and Remote Access Tools (T1219).

  Primary telemetry sources include Windows registry event logs, specifically focusing on registry modifications. If malicious, such behavior could allow an attacker to gain persistent access or exfiltrate sensitive information from the target system. It is important to note that detection of these registry modifications does NOT necessarily confirm an attack; legitimate use of RAdmin may trigger the same alert.

  ### Investigation Steps

  - **Verify registry change existence**: Use Windows Event ID 4657 to confirm the modification of the registry value located at `HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin Security`.
  - **Cross-reference user actions**: Check Security Event ID 4688 for any process launches that may indicate the legitimate use of RAdmin by authorized personnel. Review associated user accounts to assess whether their activity aligns with expected usage patterns.
  - **Identify unauthorized users**: Investigate PowerShell logs (Event ID 4104) for indication of script execution that might correlate with manipulating the RAdmin registry values by unauthorized users.
  - **Evaluate system impact**: Analyze the target asset (e.g., Windows Server 2019) for critical roles. Confirm if it's part of sensitive infrastructure or holds critical data to prioritize investigation further.
  - **Collect evidence of exfiltration**: Review Windows Firewall logs for unusual outbound connections or Traffic to known C2 servers often associated with RAdmin usage to strengthen the case for compromise.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems managed by RAdmin, coupled with the likelihood of unauthorized remote access. Such behavior, while not overly common, can be an initial step in an attack chain and is frequently weaponized against organizations lacking remote access defenses.

  ### Blind Spots and Assumptions

  Detection may be limited if the appropriate registry logging is not enabled or if RAdmin is regularly used in the environment, leading to false positives. Legitimate activities, such as IT support using RAdmin for maintenance, may trigger this alert. A related detection for broader command and control activity (e.g., monitoring for unusual network communications) would enhance coverage and help differentiate between benign and malicious use cases.

