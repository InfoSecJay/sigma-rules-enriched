  ### Technical Context

  This Sigma rule detects potential registry modifications pertaining to the RAdmin Remote Management Tool, specifically targeting security parameters in the Windows Registry. The likely attacker objective is to manipulate RAdmin's settings to facilitate unauthorized remote access and control of a compromised system. This behavior aligns with the MITRE ATT&CK tactic of *Execution* (T1203) and the technique of *Remote Access Software* (T1219).

  The primary telemetry source for this detection comes from Windows Registry Event logs, specifically those capturing changes to the HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin Security path. If malicious, this could enable an attacker to maintain persistent access to the system and execute further attacks. It is critical to note that this rule alone does not confirm a successful compromise; it merely indicates that changes were made to a registry key associated with RAdmin.

  ---

  ### Investigation Steps

  - **Identify registry change events:** Check Windows Registry Event logs for Event ID 4657, which indicates a registry key was modified. Focus on changes to HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Radmin\v3.0\Server\Parameters\Radmin Security.

  - **Correlate with user activity:** Review Security Event ID 4688 for any process creation events around the same timeframe. Look for processes related to RAdmin (e.g., Radmin.exe), especially if initiated by suspicious user accounts.

  - **Analyze previous use of RAdmin:** Determine if RAdmin has been used in the environment by legitimate administrators. Cross-reference against IT change logs to see if any recent RAdmin activity was authorized.

  - **Assess modification context:** Investigate the author of the modification by examining the registry event logs for the 'SubjectUserName' field. Legitimate modifications will often correlate with known administrative accounts.

  - **Identify anomalies:** Look for associated network connections (using Sysmon Event ID 3) to any external IP addresses created by RAdmin post-registry modification. Suspicious connections could indicate malicious usage.

  - **Examine for evasion techniques:** If using a cleaner or a legitimate-looking process to manipulate the registry, assess for any obfuscation of command line arguments in Event ID 4688 that could suggest attempts to evade detection.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of unauthorized remote access on critical systems. The likelihood of malicious abuse exists since RAdmin is often exploited by attackers for persistent access. While RAdmin can be used legitimately, its detection is commonly associated with adversarial behavior.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of legitimate RAdmin usage within the organization, potentially triggering false positives. Required log sources include Registry Event logs, and collection settings must ensure registry modifications are captured. Expect legitimate administrative tasks involving RAdmin, but consistent alerts may indicate improper use. A related detection strategy could involve monitoring for unusual network activity on common RAdmin communication ports.

