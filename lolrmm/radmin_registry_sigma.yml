note: |
  ### Technical Context
  This detection rule focuses on identifying unauthorized or unusual registry activity related to the RAdmin Remote Management (RMM) tool. RAdmin is a legitimate remote access tool often used by IT professionals for remote support, but it can also be exploited by attackers to gain control over systems covertly. The rule monitors for registry modifications indicating the potential adjustment of RAdmin security parameters, which could signal an attacker trying to establish persistence or escalate privileges on compromised systems.

  The threat scenario involving RAdmin usually revolves around attackers who seek to maintain long-term access to a network. They may manipulate settings within the RAdmin registry to ensure that their remote access remains undetected, allowing them to conduct further malicious activities while remaining hidden from standard monitoring efforts. These behaviors are primarily associated with the MITRE ATT&CK technique for Lifecycle Management under Execution (T1219).

  Primary telemetry sources that would be relevant for identifying this activity include Windows registry event logs, which capture changes to the registry and can reveal both legitimate changes made by administrators and suspicious modifications made by potential threat actors.

  ### Investigation Steps
  - **Review Registry Event Logs:** Examine logs specifically from HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Radmin\v3.0\Server\Parameters for any recent changes. Look for unusual timestamps or unrecognized user accounts making modifications.
  - **Correlate with Process Creation Events:** Analyze associated process creation logs around the same timeframe as the registry modifications to check for unusual executions of the RAdmin service or any related binaries.
  - **Contextualize with User Behavior:** Look into the user accounts that accessed or modified the RAdmin registry settings, checking for anomalies in user behavior, including logins from unusual locations or times.
  - **Investigate Network Connections:** Gather network traffic logs to monitor outbound connections to known RAdmin command and control servers, especially following registry changes, to confirm if the tool is being used for remote access.

  ### Prioritization
  This alert has medium severity due to the potential for RAdmin to be exploited by attackers to establish persistent access to systems. The likelihood of exploitation is significant given the tool's capabilities and the prevalence of remote access solutions in operational environments.

  ### Blind Spots and Assumptions
  While this detection rule is effective for identifying specific registry activity related to RAdmin, it does not cover other potential registry changes made by similar remote access tools that may not be logged in the same manner. The detection logic assumes that any modifications to the specified registry keys are unauthorized; however, legitimate administrative actions could also trigger the alert. The effectiveness of this detection relies on having comprehensive Windows registry logging enabled and may miss activities occurring in real time if those logs are not monitored diligently.

