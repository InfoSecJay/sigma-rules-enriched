note: |
  ### Technical Context

  This Sigma rule detects network connections to LogMeIn RMM tool domains, an activity that can indicate potential remote access or management by an unauthorized actor. Attackers may leverage LogMeIn's capabilities to maintain access to compromised systems, facilitate lateral movement, or perform malicious actions without direct visibility. The relevant MITRE ATT&CK tactics and techniques are **Command and Control** (TA0011) and **Application Layer Protocol** (T1203).

  The primary telemetry sources are Windows network connection logs, which capture information about outbound connections. Key log fields include `DestinationHostname`, `SourceIPAddress`, and `DestinationPort`. If confirmed malicious, such activity could indicate a compromised system being used as a pivot point in a larger attack. However, this detection does NOT confirm malicious activity on its own, as it may also capture legitimate use of LogMeIn tools based on the organization's remote access practices.

  ### Investigation Steps

  - **Check connection logs:** Review Windows event logs (Event ID 5156) for network connections to domains such as `logmein-gateway.com` or similar. Benign traffic will include known users with documented access to these services.

  - **Identify source machines:** Cross-reference the `SourceIPAddress` associated with the detected connections against asset inventories to determine if the device is authorized for remote management tasks. Legitimate hosts will typically belong to IT management or support teams.

  - **Analyze user activity:** Examine user activity logs (Event ID 4663) for any suspicious file or process interactions around the time of the connection. Look for unusual patterns or unfamiliar user accounts triggering LogMeIn connections.

  - **Correlate with other detections:** Check for other indicators of compromise (IoCs) on the same host—such as unauthorized software installations or anomalies in system performance—that may suggest malicious intent beyond mere remote management.

  - **Document legitimate use cases:** Identify internal documentation on the use of LogMeIn within your organization to differentiate between legitimate and questionable access patterns.

  ### Prioritization

  The alert severity is medium, as the affected systems could be critical depending on their role (e.g., servers vs. user workstations). The likelihood of abuse is moderate because attackers frequently exploit remote access tools, which are commonly weaponized for remote management.

  ### Blind Spots and Assumptions

  Potential evasion exists if attackers utilize domain fronting or obfuscate their traffic. Reliable detection requires proper configurations of network logging and monitoring tools to capture all outbound connection attempts. Legitimate activities may include routine remote support from IT personnel using approved tools. A related detection to bolster coverage includes monitoring for suspicious spikes in outbound traffic, especially during off-hours, which could indicate unauthorized access attempts.

