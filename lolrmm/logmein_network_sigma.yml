note: |
  ### Technical Context

  This Sigma rule detects network connections made to LogMeIn domains, which could indicate the use of the LogMeIn remote management tool. Attackers may leverage LogMeIn to establish remote access to compromised systems for further exploitation or data exfiltration. Relevant MITRE ATT&CK techniques include Remote Access Tools (T1219) under the Command and Control (C2) tactic. Primary telemetry sources consist of Windows network connection logs, specifically monitoring events indicating destination hostnames. If malicious, this activity poses a significant risk by allowing unauthorized remote access and control over systems. Importantly, this detection does not, on its own, confirm malicious intent, as LogMeIn is also used for legitimate remote administrative purposes.

  ### Investigation Steps

  - **Check for outgoing connections to LogMeIn domains:** Review Windows network connection logs (Event ID 5156) for connections to `logmein-gateway.com` and related domains during suspicious times, particularly on endpoints not known to utilize remote desktop services.

  - **Identify the user context:** Determine which user account initiated the connection. Compare this against typical user behavior; legitimate access for remote support might be expected from known IT personnel, while unknown users warrant further scrutiny.

  - **Assess recent software installations or updates:** Investigate if any LogMeIn-related software was installed on the host (check Event ID Installed Software for indicators of the software). Legitimate installations often have documentation or prior alerts.

  - **Look for additional C2 behavior:** Correlate the detected activity with other potential indicators of compromise (IoCs), such as unusual outbound traffic patterns or authentication attempts from unfamiliar locations. Verify if multiple connections to LogMeIn domains occur consecutively or rapidly, signaling potential scripted or automated exploitation.

  - **Analyze endpoint security logs:** Review System or Application logs for signs of privilege escalation or unusual process creation related to LogMeIn executable files (e.g., Event ID 4688 for process creation). A high-confidence malicious indicator is the execution of LogMeIn tools on systems without prior authorization.

  ### Prioritization

  This alert should be treated with medium severity due to the significant risk associated with unauthorized remote access, especially if it occurs on critical systems. Although LogMeIn can be used legitimately, its exploitation in the enterprise network is common among threat actors and should be closely monitored.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for evasion techniques, such as masking the destination hostname or using custom domains. Reliable detection requires comprehensive logging configurations to capture all relevant connection attempts. Legitimate activities, such as scheduled maintenance by IT, may generate similar alerts when using LogMeIn. A related detection would be monitoring for unusual process activity associated with remote access tools to build stronger contextual awareness of potential threats.

