note: |
  ### Technical Context

  This Sigma rule detects network activity related to the LogMeIn Remote Management and Monitoring (RMM) tool, specifically targeting connections to associated domains such as logmein-gateway.com and others. The likely attacker objective is to establish remote access for potential unauthorized surveillance, data exfiltration, or manipulation of target systems. This behavior aligns with the MITRE ATT&CK technique for Remote File Copy (T1219) under the Execution tactic.

  The primary telemetry sources include Windows network connection logs, specifically filtering for DNS queries or connection attempts to designated LogMeIn service domains. If this activity is malicious, it could indicate compromised credentials or unauthorized access to internal systems. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of LogMeIn exists in many enterprise environments.

  ### Investigation Steps

  - **Review active network connections:** Check current connections using `Get-NetTCPConnection` or similar PowerShell commands for Event ID 5156 to identify processes establishing network connections to logmein* domains. Note which user accounts are linked to these connections.

  - **Correlate with user logs:** Analyze Security Event ID 4624 to identify successful logins around the time of detected activity. Pay attention to logins from unusual machines or times which could indicate malicious activity.

  - **Identify expected usage:** Verify whether there is a legitimate business case for using LogMeIn within the organization. This might be supported by a company policy or documented use case existing in IT procedures.

  - **Inspect remote software installation:** Utilize Sysmon Event ID 1 to check for the execution of the LogMeIn software or related installation logs. Legitimate installations can help differentiate between authorized and unauthorized use.

  - **Examine data transfer logs:** Review Windows Event ID 5140 for file share access on systems using LogMeIn; check for irregular file access patterns that may indicate data exfiltration as part of a potential attack.

  - **Cross-reference with EDR data:** If available, use EDR capabilities to identify any suspicious behavior linked to processes associated with LogMeIn, including anomalous CPU usage or unusual outbound connections during the alert timeframe.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on sensitive data and systems, alongside the increasing likelihood of abuse of remote access tools by adversaries. This type of behavior is often weaponized to facilitate lateral movement and persistent access within environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the existence of benign LogMeIn usage; legitimate business operations can frequently trigger this alert. Comprehensive logging from network connections and DNS resolution is essential for reliable detection. Other legitimate services may also route through similar domains, potentially leading to false positives. A related detection to strengthen coverage includes monitoring for abnormal user account behavior, such as failed login attempts or unusual credentials being used alongside the LogMeIn connections.

