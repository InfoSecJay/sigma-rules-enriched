note: |
  ### Technical Context

  This rule detects network connections to LogMeIn RMM (Remote Monitoring and Management) servers, which are used for remote access and support. An attacker may leverage LogMeIn to maintain persistence, exfiltrate data, or conduct unauthorized remote access to compromised hosts. The relevant MITRE ATT&CK tactic is Execution, and the technique is Remote Services (T1219).

  Primary telemetry sources include network connection logs from Windows (e.g., Windows Firewall logs or Sysmon network connection events). If malicious, the use of LogMeIn could enable an adversary to gain control over sensitive assets. It is important to note that this detection does NOT confirm malicious activity on its own, as LogMeIn may be used legitimately by support teams.

  ### Investigation Steps

  - **Check connection logs for the specific domains**: Review network connection logs for Event ID 5156 (Windows Filtering Platform) and Sysmon Event ID 3 for outbound connections to 'logmein-gateway.com' or other listed LogMeIn domains. Legitimate use will typically show connections from known support stations during regular business hours.

  - **Correlate with user activity**: Investigate user activity around the timestamp of the detected connection, focusing on Event ID 4624 (logon) and 4634 (logoff) to determine whether the user is authorized to access LogMeIn services.

  - **Identify unexpected hosts**: Analyze the host initiating the connection—expect to find known IT support assets. Connections from non-IT assets, especially those that typically do not require remote access, could indicate potential compromise.

  - **Review authentication methods**: Look for usage of non-standard credentials through Event ID 4672 (special logon). Unusual login attempts or failures associated with the IP or host may indicate malicious intent.

  - **Examine for additional artifacts**: Validate if any associated files suggest malware behavior, particularly logging into LogMeIn during odd hours or redirected traffic to these domains. Check for potential file creation in temporary paths often exploited by malware or unauthorized scripts.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for abuse in accessing sensitive environments. The likelihood of malicious use is moderate, as LogMeIn is commonly known, but can also be weaponized in targeted attacks or penetration tests.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use, as administrative personnel often utilize LogMeIn for support; this could generate false positives. Reliable detection requires correct network logging configurations, including the reporting of outbound traffic to ensure visibility. Companion detections include monitoring for unusual user access patterns and tracking failed authentication attempts to complement this alert.

