note: |
  ### Technical Context
  This detection rule identifies processes associated with the Weezo Remote Management and Monitoring (RMM) tool. The Weezo tool is often misused by attackers to gain persistent remote access to compromised systems, allowing them to execute commands, transfer files, and manipulate system settings. The likely objectives of an attacker utilizing Weezo include unauthorized persistence on a system, remote control of compromised environments, and potential lateral movement within a network.

  The relevant MITRE ATT&CK tactics and techniques linked to this detection include Executing arbitrary code (T1219) and other execution methods that enable attackers to establish footholds by running arbitrary software on targeted systems. By detecting the presence of certain process signatures associated with Weezo, the rule helps to mitigate the risk of unauthorized access and malicious actions within a secure environment.

  The primary data source for this detection is Windows Process Creation logs, which provide critical details about executables triggered on the system, including the parent-child relationship between processes which can help pinpoint malicious executions effectively.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation events in the system log for instances of `weezohttpd.exe`, `weezo.exe`, or `weezo setup*.exe`. Focus on the timestamps and parent processes to detect unexpected executions.
  - **Analyze Network Traffic:** Investigate outgoing and incoming network traffic associated with the identified Weezo processes. Look for unusual connection patterns, especially towards external IP addresses that are not part of the organization's normal operational environment.
  - **Inspect User Activity:** Verify user account activity related to the execution of Weezo processes. Check if unexpected user accounts or service accounts are running these processes and whether they are operating outside of normal business hours.
  - **Perform File Integrity Checks:** Conduct checks on the file system for unauthorized modifications or installations related to Weezo. Assess the integrity of the executables, their paths, and any associated configuration files.

  ### Prioritization
  This alert is assigned a medium severity level as the presence of the Weezo tool can indicate a potential compromise, especially in an enterprise setting. If used maliciously, the tool can facilitate sustained unauthorized access and lateral movements, contributing to a higher risk against corporate assets.

  ### Blind Spots and Assumptions
  One notable blind spot in the detection logic is the potential for deviations in the naming conventions of the processes if an attacker chooses to obfuscate the tool or rename the executable files. The detection assumes that the specific filenames will remain consistent and does not account for variations that might occur with legitimate usage of the software. Furthermore, adequate logging must be enabled on Windows systems to ensure process creation events are captured for this alert to function effectively, as this relies heavily on the availability and configuration of Windows Event Logs.

