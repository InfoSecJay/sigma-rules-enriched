note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the CentraStage (now Datto) Remote Monitoring and Management (RMM) tool. Attackers may leverage this tool as a command-and-control (C2) mechanism after gaining initial access to a system to manage or further infiltrate the network. The relevant MITRE ATT&CK technique is Command and Control via Remote Services (T1219).

  Primary telemetry sources include Windows network connection logs, particularly focusing on the logs capturing DNS queries and connection attempts to specific external domains. The security impact of this activity could signify a compromised machine being controlled remotely, potentially leading to exfiltration or further network compromise. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of CentraStage (Now Datto) may trigger the same alerts.

  ### Investigation Steps

  - **Review outbound connection logs to suspicious domains**: Examine Windows Event IDs 5156 (Windows Filtering Platform, connection allowed) and 5158 (connection resolved), focusing on connections to '*.rmm.datto.com' or 'cc.centrastage.net'. Look for the timestamp and process ID that initiated these connections.

  - **Check for running CentraStage processes**: Investigate running processes using Sysinternals tools or Task Manager to confirm if CentraStage components (e.g., CentraStage.exe) are running on the system in question. Legitimate installations should be expected in managed environments.

  - **Cross-reference active connections with user activity**: Correlate the timestamps of outbound connections with logged user activity and application data. Trusted user activity may include legitimate remote support sessions that align with the organization's IT support policies.

  - **Identify high-confidence malicious indicators**: Look for unusual patterns such as multiple simultaneous connections to different Datto domains or suspicious process execution related to the outbound activity that doesn’t align with the organization’s use of CentraStage.

  - **Examine logs for additional anomalous behavior**: Search for Security Event ID 4624 (successful logon) and other relevant security logs that coincide with the network activity. Unusual logons or access attempts could indicate lateral movement or credential compromise.

  ### Prioritization

  The alert severity is medium due to the potential impact of an infected system providing adversarial access to sensitive environments. While legitimate use can occur, the likelihood of abuse is significant, as C2 communications associated with RMM tools are often exploited by threat actors for unauthorized access and control.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers using obfuscation techniques or custom domains not detected by the rule. Reliable detection relies on proper logging configurations for Windows networking and the timely monitoring of outbound connections. Legitimate IT support activities may inadvertently trigger this alert, complicating triage. A companion detection to consider is monitoring for unexpected file transfers or scripts executed by the RMM tool that could indicate malicious behavior.

