note: |
  ### Technical Context

  This rule detects the execution of the NetMaster RMM (Remote Monitoring and Management) tool on Windows systems, identified by the process name `NetMaster_Client.exe`. The likely attacker objective is to establish a command-and-control channel or perform remote management of the compromised system, potentially facilitating further exploitative actions. This behavior maps to the MITRE ATT&CK technique for Remote Management Tools (T1219).

  The primary telemetry sources are Windows process creation events, specifically focusing on Security Event ID 4688. If the NetMaster tool is being used maliciously, it could allow attackers to maintain persistent access to the network and perform unauthorized activities. It is important to note that merely detecting this process does NOT confirm malicious intent, as NetMaster may be used legitimately in managed IT environments.

  ### Investigation Steps

  - **Check process creation events**: Review Security Event ID 4688 for event logs indicating process creation with `Image` containing `\\NetMaster_Client.exe`. Validate the process initiation time and account associated with the execution.

  - **Examine parent processes**: Analyze the `ParentImage` field for parent processes ending with `\\NetMaster_Client.exe`. Legitimate usage often comes from known administrative tools or scripts initiated by IT personnel.

  - **Correlate with user activity logs**: Look for any related user actions in logs that involve legitimate administrative tasks, such as remote assistance requests or updates performed by IT staff. These may help differentiate between benign and malicious activity.

  - **Identify any abnormal network connections**: Investigate any outgoing network connections initiated by the `NetMaster_Client.exe` process, particularly to unusual or unauthorized IP addresses or domains that could indicate command-and-control communication.

  - **Check host role and criticality**: Assess the system role where the process is detected (e.g., server, endpoint, etc.). Critical servers with this process running demand higher scrutiny due to their potential impact on the organization.

  - **Document previous instances of this process**: Cross-reference historical data to assess if there is a pattern of legitimate use based on its occurrence in similar environments or operations.

  ### Prioritization

  This alert has medium severity as the presence of `NetMaster_Client.exe` on critical systems could allow for unauthorized control, depending on the context of its use. The likelihood of malicious exploitation is moderate, especially if this tool is neither commonly found in the environment nor makes sense within the operational framework of the organization.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers utilizing renamed binaries or custom versions of remote management tools. Reliable detection requires the collection of process creation logs and the appropriate configuration of security auditing on endpoints. Legitimate remote management operations might trigger this alert, particularly within outsourced IT services. A related detection to consider for strengthened coverage is monitoring for unusual network traffic patterns associated with executable invocation.

