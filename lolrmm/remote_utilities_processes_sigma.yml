note: |
  ### Technical Context
  This detection rule identifies potential activity from the Remote Utilities Remote Management Tool (RMM), specifically looking for processes that are spawned from the main executables, `rutview.exe` (the viewer) and `rutserv.exe` (the service). Remote Utilities is often used for legitimate remote desktop access but can also be exploited by threat actors to control systems covertly. Attackers may leverage this tool to establish persistence or execute commands on compromised machines, especially considering its remote access capabilities.

  The rule aligns with several MITRE ATT&CK techniques, particularly under the **Execution** tactic, specifically T1219: “Remote Services,” which includes the use of remote management tools to execute malicious payloads or facilitate unauthorized access. In an enterprise environment, the presence of these processes may indicate either legitimate administrative actions or malicious activities, making accurate detection critical.

  The primary data sources for detecting this activity are Windows process creation logs, which capture the details of processes being executed on endpoints, including the parent-child relationship necessary to identify the specific invocation of the Remote Utilities tools.

  ### Investigation Steps
  - **Review Process Creation Events**: Collect and analyze Windows process creation logs to identify instances of `rutview.exe` and `rutserv.exe`. Focus on attributes such as process ID and parent process ID to establish context around these executions.

  - **Analyze Parent Process Activity**: Investigate the parent processes of `rutview.exe` and `rutserv.exe` to determine how these processes were initiated. Look for unusual parent processes that could indicate unauthorized activity.

  - **Correlate Network Activity**: Check network logs for unexpected outbound connections initiated by the identified processes. Remote access tools often communicate with external command-and-control servers or remote endpoints, which could signal malicious use.

  - **Evaluate User and System Context**: Look into the user accounts and system information tied to the process executions. Verify whether the execution aligns with normal operational behavior based on user roles, times of operation, and access permissions.

  ### Prioritization
  This alert should be classified as medium severity due to the potential for legitimate administrative use of Remote Utilities. However, the associated risks of misuse in an enterprise environment warrant prompt investigation, as such activity can indicate unauthorized access or compromised endpoints.

  ### Blind Spots and Assumptions
  The detection logic may not capture instances of Remote Utilities that are initiated through means other than direct process creation, such as scripts or scheduled tasks. Additionally, the rule assumes that the executable names (`rutview.exe` and `rutserv.exe`) are not modified by attackers attempting to obfuscate their use. For this alert to function effectively, it is essential that Windows process creation logs are enabled and properly configured to capture the necessary details.

