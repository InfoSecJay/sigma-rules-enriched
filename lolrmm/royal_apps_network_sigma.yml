  ### Technical Context

  This Sigma rule detects network activity associated with the Royal Apps Remote Monitoring and Management (RMM) tool by identifying connections to hosts with a hostname ending in "user_managed." The likely objective of adversaries leveraging this tool is unauthorized access and control over victim machines, leading to data exfiltration or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and technique Remote Services (T1219). The primary telemetry sources involved in this detection include Windows Security Event logs and network connection logs specifically monitoring DNS resolution and outbound connections.

  If detected, the security impact could be significant, as it may indicate a compromise where an attacker is using RMM tools to maintain persistent access and carry out further attacks. However, this detection alone does NOT confirm malicious intent, as legitimate use of the Royal Apps tool by authorized personnel may also trigger alerts.

  ### Investigation Steps

  - **Check for malicious hostname connections**: Review network connection logs (Event ID 5156) for any connections to hostnames ending with "user_managed." Identify IP addresses and look for known malicious IPs or anomalies in destination traffic patterns.

  - **Validate expected operational use**: Determine if the RMM tool is used within your organization by consulting with the IT operations team. Identify legitimate hostnames or IP addresses associated with authorized operations. Timing and frequency of connections to user_managed hosts should be consistent with authorized use.

  - **Identify unauthorized installation**: Check for Event ID 4688 (Process Creation) to see if the Royal Apps RMM executable or similar processes are being started without explicit authorization. Investigate unexpected execution paths or parent process relationships.

  - **Assess lateral movement signs**: Look for abnormal outbound network activity (Event ID 5157) from crucial servers or endpoints, especially if those machines are not typically associated with RMM tools or remote access software. Note significant data transfer to user_managed hosts that exceeds typical operational thresholds.

  - **Correlate network activity with endpoint detections**: Utilize Endpoint Detection and Response (EDR) logs to see if any alerts correlate with the network activity detected by Sigma. Search for unusual login attempts or RMM tool usage patterns (e.g., access attempts to sensitive directories).

  ### Prioritization

  This alert should be classified as medium severity due to the potential control an adversary may gain through the RMM tool and the risk it poses if exploited on critical systems. The likelihood of malicious use is elevated because RMM software is commonly weaponized in attack scenarios.

  ### Blind Spots and Assumptions

  Evasion techniques might include custom RMM tools or obfuscation of legitimate network activity to avoid detection. The effectiveness of detection is contingent on having complete logging enabled for network activities and security events. Legitimate use cases may involve third-party IT support or internal helpdesk staff accessing user endpoints. A related detection to bolster coverage would be logging and monitoring unusual spikes in RMM-related process executions, enabling correlation of actions taken around network connection alerts.

