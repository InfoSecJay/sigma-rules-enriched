note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Ericom Connect Remote Management Tool, specifically focusing on processes like `EricomConnectRemoteHost*.exe` and `ericomconnnectconfigurationtool.exe`. The likely attacker objective is to establish remote control over a compromised system, allowing for unauthorized access and manipulation of resources. This activity aligns with the MITRE ATT&CK tactic of Execution (T1203) and specifically technique Remote Services (T1219).

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on Security Event ID 4688 and Sysmon Event ID 1. If detected, the security impact could be significant, resulting in potential data breaches or further lateral movement within the network. It is important to note that this detection does not confirm malicious intent on its own, as it may also indicate legitimate use of the Ericom Connect tool.

  ### Investigation Steps

  - **Review process creation logs**: Examine Security Event ID 4688 or Sysmon Event ID 1 for instances where the process names match `EricomConnectRemoteHost*.exe` or `ericomconnnectconfigurationtool.exe`. Look for anomalies in the execution paths or parent processes that indicate unusual activity.

  - **Check parent process**: Identify the parent process of any detected instances to determine if they were initiated by trusted software or scripts. Legitimate usage often involves a known administrator tool or management software as the parent, while suspicious executions may originate from unknown or system processes.

  - **Investigate command-line arguments**: Review the command-line arguments associated with the detected processes. Malicious executions may include additional flags for remote access or unknown parameters that deviate from standard usage patterns.

  - **Correlate with user activity**: Identify user accounts associated with the executed processes by checking logged-in users at the time of execution. Legitimate use is commonly by IT staff performing maintenance tasks, whereas unauthorized access may involve unusual accounts or those lacking administrative privileges.

  - **Evaluate system changes**: Assess if any file modifications, network connections, or other changes occurred simultaneously with the detected process executions. Look for unusual outbound connections that could indicate data exfiltration or command-and-control behavior.

  ### Prioritization

  This alert is medium priority due to the potential risk associated with remote management tools. The likelihood of malicious abuse is moderate, as such tools are commonly exploited in targeted attacks. While the use of Ericom Connect can be legitimate, its presence should be closely evaluated within the broader context of system activity.

  ### Blind Spots and Assumptions

  Detection may be limited if log sources are misconfigured or if there are custom deployments of Ericom Connect that are not captured by default monitoring. Legitimate administrative use of the RMM tool could trigger alerts, particularly during routine maintenance tasks. Companion detections, such as monitoring for unusual network traffic to the same endpoint, would strengthen coverage of potential misuse of this tool.

