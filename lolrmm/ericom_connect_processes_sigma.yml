note: |
  ### Technical Context
  This rule detects processes associated with the Ericom Connect Remote Management and Monitoring (RMM) tool, frequently used for remote access and management of systems. The detection logic targets specific executable filenames, indicating that the tool may be leveraged to gain unauthorized access to or control over systems within the enterprise environment. An attacker could potentially exploit Ericom Connect for lateral movement, data exfiltration, or establishing backdoors, thereby posing a significant risk to network security.

  The relevant MITRE ATT&CK tactics associated with this detection include **Execution** (TA0002) as the attacker engages with the system using the RMM tool, and **Command and Control** (TA0011) if the tool is used to maintain remote control over compromised assets. The technique specifically applicable is **Remote Services** (T1219), which focuses on the usage of remote connectivity tools like RMM software for malicious activity.

  Primary data sources for this detection include **process creation events** on Windows systems, which can provide insights into when and how the Ericom Connect tool is being executed, helping to identify whether its usage is legitimate or malicious.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the Windows process creation events for instances of `EricomConnectRemoteHost*.exe` and `ericomconnnectconfigurationtool.exe` to identify unauthorized executions or unusual patterns in their use.

  - **Check Parent Process Relationships:** Investigate the parent processes of detected Ericom Connect activities to determine if they originate from suspicious or malformed processes that may indicate a malicious context.

  - **Monitor Network Connection Logs:** Look for unusual outbound connections originating from systems where the Ericom Connect tool has been detected, which may indicate potential data exfiltration or command and control activity.

  - **Correlate with User Activity:** Compare detected process activity with standard user behavior to identify any anomalies, focusing on users known to possess privileges to use RMM tools and any unauthorized access attempts.

  ### Prioritization
  The severity of this alert is considered medium because while the legitimate use of Ericom Connect may exist, its potential misuse for unauthorized access or control cannot be overlooked. The likelihood of misuse in compromised environments makes timely investigation critical.

  ### Blind Spots and Assumptions
  This detection logic may not cover all variations of the Ericom Connect process names, potentially missing some malicious activities if attackers modify the executable filenames. Additionally, the effectiveness of this detection relies on the consistent logging of process creation events, which must be properly configured on monitored systems. Assumptions include that the tool is not being utilized within compliant, secure contexts, and that any detected processes represent potential threats unless proven otherwise.

