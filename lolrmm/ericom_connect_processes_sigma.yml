note: |
  ### Technical Context

  This Sigma rule detects the execution of potentially unauthorized or malicious processes associated with the Ericom Connect Remote Management Tool (RMM). Attackers may utilize this tool to establish remote control over compromised systems, facilitating further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK technique for Remote File Copy (T1219) within the Command and Control tactic.

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log process creation events. If the detected activity is indeed malicious, there is a significant security impact as it could lead to unauthorized access, data leakage, or lateral movement within the enterprise environment. This detection alone does NOT confirm malicious intent, as there may be legitimate use cases for the Ericom Connect tool within the organization's infrastructure.

  ### Investigation Steps

  - **Review the event details in Windows Security Event ID 4688:** Check the 'New Process Name' field for entries ending in '\\EricomConnectRemoteHost*.exe' or '\\ericomconnectconfigurationtool.exe' to confirm detection.

  - **Examine the parent process:** Determine the 'Parent Image' associated with the detected process. Legitimate executions will likely originate from known administrative tools or services, rather than unusual origins.

  - **Correlate with asset inventory:** Identify the asset on which the process is detected. Review its role—if it’s a user workstation, the presence of RMM tools could be suspicious compared to a server where such tools may be expected.

  - **Check for abnormal network activity:** Investigate associated network connections or outbound calls made by the process using network monitoring logs. Look for connections to unusual or unauthorized IP addresses or FQDNs.

  - **Validate user behavior:** Review logon activity in conjunction with the detected processes. Users with no known authorization to use Ericom Connect should trigger further scrutiny.

  - **Look for indicators of compromise (IoCs):** Assess for high-confidence malicious indicators such as related registry changes or anomalies in the execution time to establish potential backdoor activity.

  ### Prioritization

  This alert is of medium severity due to the potential impact of the affected system, especially if it is used for administrative purposes or critical applications. The likelihood of this behavior being exploited by adversaries is moderate, particularly in targeted attacks, as remote control tools are frequently weaponized in breaches.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative activity utilizing Ericom Connect, potentially leading to false positives. It requires comprehensive logs from process creation events and adequate monitoring of system permissions to ensure reliability. Routine remote management activities can trigger this alert, particularly if employees are using the tool for sanctioned support tasks. Further detection capabilities should focus on related behaviors, such as concurrent suspicious command-and-control network traffic, to enhance overall security posture.

