note: |
  ### Technical Context

  This rule detects activity involving files associated with the Level.io RMM tool, specifically the execution of `level.exe`, `osqueryi.exe`, and interaction with `level.log`. The likely attacker objective may include reconnaissance, system manipulation, or persistence through remote management capability. This behavior fits into the MITRE ATT&CK framework under the tactic **Command and Control** (TA0011) and the technique **Remote Management Tools** (T1219). The primary telemetry is sourced from Windows file events relating to process execution and file modification.

  If malicious, the security impact could be significant, as remote management tools can provide attackers with control over systems, facilitate lateral movement, or exfiltrate data. It is important to note that triggering this detection does NOT confirm malicious intent on its own, given that Level.io could be employed for legitimate administrative purposes.

  ### Investigation Steps

  - **Check for process execution:** Analyze Security Event ID 4688 for instances of `level.exe` or `osqueryi.exe` to determine if they were executed recently. Compare timestamps and user context to establish legitimacy.

  - **Evaluate file modifications:** Review Windows file event logs for alterations to `level.log`. Identify any unexpected changes or access patterns which deviate from normal use, typically under controlled administrative access.

  - **Identify scheduled tasks:** Investigate Task Scheduler for any tasks associated with Level.io, specifically those that may signify persistence. Expected behavior would be infrequent manual execution by system administrators.

  - **Validate user context:** Check the user accounts linked to the execution of the detected processes. Legitimate administrative activity will often occur under known, authorized accounts, while unusual accounts may warrant further scrutiny.

  - **Monitor network connections:** Inspect outbound network traffic for connections to known malicious IPs or domains during the same timeframe as the detected file activities. A common malicious indicator would be network communication with unfamiliar or suspicious external addresses.

  - **Correlate with known tools:** Look for other indicators of compromise, such as the usage of other RMM tools or administrative scripts around the same time. Legitimate use will often align with a well-documented maintenance schedule.

  ### Prioritization

  This alert carries medium severity due to its potential impact, especially if the affected system is critical in the organization. The likelihood of malicious abuse is moderate, considering that while RMM tools are legitimate, they are frequently weaponized by adversaries for unauthorized access and control.

  ### Blind Spots and Assumptions

  Detection can be limited by the presence of legitimate Level.io usage, which may generate similar alerts. Reliable detection requires that logging for process creation and file events is enabled and properly configured. Furthermore, administrative activity for known maintenance tasks could trigger this alert without malicious intent. Companion detections for lateral movement or remote access tools would strengthen overall coverage and context for an accurate response.

