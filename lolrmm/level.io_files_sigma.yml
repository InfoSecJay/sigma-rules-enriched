note: |
  ### Technical Context

  This rule detects file activity associated with the Level.io RMM tool, specifically focusing on file operations involving the Level.exe, osqueryi.exe, and level.log files. The likely attacker objective is to leverage this remote monitoring and management tool for unauthorized access or control over systems. This behavior falls under the MITRE ATT&CK tactic of Execution (TA0002) with the technique Remote Services (T1219). The primary telemetry source is Windows file event logs, specifically monitoring file create, delete, or modify operations associated with the specified file paths. If malicious, this activity may allow an adversary to manipulate or exfiltrate information from compromised systems. However, this detection does NOT confirm malicious activity on its own, as Level.io may be legitimately utilized in some environments.

  ### Investigation Steps

  - **Confirm file activity logs:** Review Windows Event IDs 4663 (File Access) for operations on `C:\Program Files\Level\level.exe`, `osqueryi.exe`, and `level.log`. Check for unusual access patterns or operations not typical for the user or process involved.

  - **Identify user origins:** Cross-reference the Event ID 4663 logs to identify the user and process that executed these file operations. Look for accounts with unusual permission levels accessing these files or executing Level.io processes.

  - **Evaluate process execution:** Monitor Windows Event ID 4688 (Process Creation) to determine if `level.exe` or `osqueryi.exe` was executed unexpectedly outside of a regular administrative job. This could indicate exploitation of the tool capabilities.

  - **Assess legitimate usage:** Investigate if the usage of Level.io binaries corresponds to legitimate administrative tasks or scheduled jobs. Consult with the IT team to validate if these tools have been recently used as intended during system admin activities.

  - **Check for anomalous log entries:** Look for entries indicating anomalous logging behavior in `level.log`, such as frequency and context. Frequent logging or unexpected log content may be a red flag.

  - **Cross-reference with other detections:** Identify related alerts from other detection rules indicating unauthorized remote access attempts, such as suspicious RDP or VPN activity, to see if they correlate with the file activity detected.

  ### Prioritization

  This alert carries medium severity given that Level.io can be exploited for unauthorized system control. The impact can be significant if sensitive data or administrative tasks are manipulated. The likelihood of abuse is moderate as RMM tools, when misused, can facilitate lateral movement and persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Level.io, leading to false positives from authorized administrative actions. Ensuring that file monitoring is correctly configured for all environments is essential for reliable detection. Legitimate administrative tasks, such as scheduled scans or routine maintenance using Level.io, may trigger this alert. A related detection could monitor user authentication activities, providing additional context regarding user legitimacy during Level.io usage.

