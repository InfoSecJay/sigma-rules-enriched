note: |
  ### Technical Context
  This detection rule identifies potentially suspicious file activities associated with the Level.io Remote Monitoring and Management (RMM) tool. The rule specifically focuses on detecting accesses or changes to key files typically associated with the Level.io installation, which could indicate improper usage of the tool or its exploitation by malicious actors. Attackers may leverage legitimate RMM tools like Level.io for various objectives, such as maintaining persistence, executing commands remotely, or exfiltrating sensitive information, particularly in targeted attacks against enterprise environments.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Execution (TA0002) – T1219: Remote Access Tools (RATs)
  By observing behaviors indicative of RMM tools, the rule aims to ensure that legitimate use is not masking unauthorized remote access or control by threat actors.

  Primary data sources for this detection include:
  - File event logs on Windows systems, which will give insights into the access patterns and changes to the defined target files associated with Level.io.

  ### Investigation Steps
  - **Review File Access Logs:** Examine file event logs for any access or modifications to `C:\Program Files\Level\level.exe`, `osqueryi.exe`, and `level.log`. Look for anomalous timestamps or patterns inconsistent with normal operations.

  - **Analyze Process Creation Events:** Track process creation events that involve the Level.io executables. Investigate the parent processes to determine if they were spawned by legitimate management tasks or through potentially malicious actions.

  - **Check for Unusual Network Activity:** Analyze any outbound network connections related to Level.io. This includes reviewing logs from firewalls or network detection systems for traffic patterns that may indicate data exfiltration or unauthorized access attempts.

  - **Correlate User Activity:** Identify the user accounts that accessed the Level.io files. Check for any associated logins or administrative tasks—especially if these user accounts are not typically involved in system administration.

  ### Prioritization
  The severity of this alert is classified as medium due to the potential impact of unauthorized access via legitimate RMM tools, which could allow an attacker to maintain control over compromised systems. The likelihood of misuse is elevated in environments that employ such tools for remote management.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise from environments where Level.io is legitimately used, as false positives can occur during normal operational activities. The detection logic assumes that any access to the specified Level.io files is suspicious unless verified otherwise. Effective logging of file access and process creation events is essential for this alert to function; any misconfiguration or absence of such logs could limit detection capabilities.

