note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the FleetDeck.io remote monitoring and management (RMM) tool. FleetDeck.io is often used by legitimate IT service providers for managing multiple devices remotely. However, attackers may also exploit such tools to maintain persistence, control compromised systems, and conduct further malicious activities. This rule can help identify unauthorized or suspicious use of this tool in an enterprise environment, potentially indicating an attempted compromise or exploitation.

  The primary attacker objective may include establishing a foothold in the network, collecting sensitive data, or executing post-exploitation actions like lateral movement. The relevant MITRE ATT&CK tactics include Execution (TA0002), as the tool aids in running commands on compromised systems, and potentially Credential Access (TA0006) if it’s used to harvest credentials from managed systems. The technique applicable here is Remote Desktop Protocol (T1219), which covers the remote access methods that can be used for malicious intent.

  Primary data sources for this detection include Windows network connection logs that track outgoing connections, particularly those that attempt to communicate with known FleetDeck.io domains or AWS resources associated with it.

  ### Investigation Steps
  - **Review Network Connection Logs:** Analyze the Windows network connection logs for entries connecting to `*.fleetdeck.io` or `cognito-idp.us-west-2.amazonaws.com`. Pay attention to the time of the connections and compare them against normal operational patterns.

  - **Correlate with Endpoint Activity:** Check endpoint detection and response (EDR) logs for any associated activities, particularly process executions that may coincide with the network connections made to FleetDeck.io domains.

  - **Examine User Behavior Analytics:** Investigate user behavior for the accounts initiating these connections. Check if users typically engage with FleetDeck.io for legitimate purposes; unusual patterns may indicate unauthorized access or compromised credentials.

  - **Assess Environment for Legitimate Use:** Confirm whether any legitimate roles or scheduled tasks may interact with FleetDeck.io. Conduct interviews with IT staff to determine if there are scheduled maintenance or support tasks associated with the detected activity.

  ### Prioritization
  This alert is of medium severity as it indicates potential unauthorized access to remote management tools. In an enterprise environment, misuse of RMM tools can lead to severe security breaches if attackers gain control of critical systems, thereby elevating their privileges and access to sensitive information.

  ### Blind Spots and Assumptions
  One limitation of this detection is that it may produce false positives for legitimate administrative activities, particularly in environments where FleetDeck.io is a commonly used tool. Additionally, the detection logic assumes that the network logs are comprehensive and correctly configured to capture all relevant connections to affiliated domains. If logging levels are insufficient or if certain network segments are not monitored, critical evidence may be missed. Analysts should ensure that network connection logging is enabled and adequately covers all endpoints within the environment.

