note: |
  ### Technical Context

  This rule detects potential network activity associated with the FleetDeck.io remote monitoring and management (RMM) tool. Attackers may use this tool to establish a command and control (C2) channel for managing compromised systems or facilitating lateral movement within a network. The rule corresponds to the MITRE ATT&CK tactic of Command and Control (T1071) and technique of Application Layer Protocol (T1219). Primary telemetry sources include Windows network connection logs, particularly those detailing outbound HTTP/S traffic.

  If malicious, the use of FleetDeck.io could enable an adversary to remotely manage infected endpoints, leading to data exfiltration or further compromise of the network. However, this detection does NOT confirm malicious intent, as legitimate organizations may also use FleetDeck.io for support or automation purposes.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows network connection logs (Event ID 5156) for outbound connections to any hostnames ending with '*.fleetdeck.io' or 'checkip.zmazonaws.com'. This indicates potential use of FleetDeck.io.

  - **Verify process origin:** Inspect the process initiating the network connection using Sysmon Event ID 1. Legitimate connections should typically originate from known management software or authorized processes, not unexpected or unfamiliar executables.

  - **Cross-reference with DNS queries:** Query DNS logs for recent requests to FleetDeck.io domains. Incidents involving high levels of DNS query activity, especially from unusual endpoints, may indicate malicious behavior.

  - **Identify abnormal command execution:** Analyze command-line parameters of processes identified from event logs. Look for signs of obfuscation or attempts to disguise the usage of FleetDeck.io.

  - **Establish expected behavior:** Determine normal operational traffic patterns for your organization. Regularly validate that authorized endpoints have legitimate reasons for connecting to FleetDeck.io.

  - **Monitor for suspicious user activity:** Review user account activity (Event ID 4624) around connection timestamps. Unusual login times or from unexpected users may indicate compromised accounts or insider threats.

  ### Prioritization

  This alert has medium severity due to its potential to indicate unauthorized remote access to systems, especially if sensitive environments are affected. The likelihood of malicious activity is moderate; while FleetDeck.io can be legitimate, it is commonly targeted for exploitation in attacks resembling remote management and persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by encrypted traffic to FleetDeck.io, which could avoid capture in summary logs. Ensure logging is configured to capture all outbound network connections effectively. Additionally, legitimate operations involving FleetDeck.io could yield false positives, particularly in environments using this tool for support. Related rules for identifying lateral movement (like RDP connections or process creation anomalies) can reinforce the detection strategy.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
