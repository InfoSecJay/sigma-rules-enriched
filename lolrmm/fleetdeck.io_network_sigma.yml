note: |
  ### Technical Context

  This Sigma rule detects potentially unauthorized network activity associated with the FleetDeck.io Remote Monitoring and Management (RMM) tool. The typical attacker objective would be to establish remote control over compromised systems, allowing for tasks such as data exfiltration, lateral movement, or deployment of additional payloads. This detection aligns with the MITRE ATT&CK technique for Remote Management Tools (T1219).

  The primary telemetry source is Windows network connection logs, specifically monitoring connections made to the domain "*.fleetdeck.io" and "cognito-idp.us-west-2.amazonaws.com." If the activity is indeed malicious, it could facilitate significant unauthorized access to sensitive systems and data. This detection does NOT confirm that a compromise has occurred; legitimate use of FleetDeck.io by authorized personnel may trigger this alert.

  ### Investigation Steps

  - **Verify the source of connections:**
    Check for Event ID 5156 in Windows Security logs to confirm if outbound connections to FleetDeck.io are established from unauthorized hosts.

  - **Identify legitimate users:**
    Review user account activity against known asset owners. Access the Windows Security Event logs (Event ID 4624) to correlate the account activity with expected roles to identify who may legitimately use FleetDeck.io.

  - **Analyze network traffic patterns:**
    Utilize network analysis tools to review traffic flows to "cognito-idp.us-west-2.amazonaws.com" and "*.fleetdeck.io," looking for deviations in expected communication patterns.

  - **Correlate with established baselines:**
    Review historical logs to understand normal traffic behavior for assets. Unexpected spikes in outbound traffic to fleetdeck.io domains may indicate suspicious activity.

  - **Seek high-confidence malicious IOCs:**
    Investigate any associated processes using Sysmon Event ID 1 to identify the parent process launching the network connection to these domains. Known malicious processes or unusual parent-child relationships should raise alerts.

  - **Inspect for file activity:**
    Review local filesystem changes or file creation events, especially in temporary folders, for suspicious files that may have been downloaded as part of the RMM tool workflow. Focus on artifacts like Event ID 4663 in Security logs.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized remote access on critical infrastructure and the likelihood of abuse by malicious actors using RMM tools like FleetDeck.io. Activity associated with RMM tools is commonly exploited in emerging threats and may indicate broader lateral movement within the network.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers could obfuscate their traffic or utilize legitimate credentials to access FleetDeck.io without raising alarms. Reliable detection depends on the configuration of comprehensive logging on endpoint devices to capture network connections accurately. Legitimate management activities from trusted IT personnel using FleetDeck.io may generate false positives. A related detection to consider is monitoring for anomalous behavior in established remote desktop sessions, which could further validate potential threats.

