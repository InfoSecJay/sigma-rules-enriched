note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the FleetDeck.io remote monitoring and management (RMM) tool, which can be exploited by malicious actors for command and control (C2) or unauthorized access to systems. The attacker's goal may include managing devices without authorization or facilitating lateral movement within a network. This behavior aligns with the MITRE ATT&CK technique "Remote Management Tools" (T1219).

  The primary telemetry sources include network connection logs, specifically event logs capturing DNS resolutions and outbound connections. The security impact is significant if malicious, as it could indicate unauthorized remote management of endpoints, leading to data exfiltration or additional compromise. This detection does NOT confirm that malicious activity is occurring; legitimate usage of FleetDeck.io may trigger this alert without nefarious intent.

  ### Investigation Steps

  - **Verify network connection logs:** Inspect Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to domains ending in 'fleetdeck.io' or 'checkip.zmazonaws.com'. Note if connections originated from sensitive or critical assets like domain controllers or servers.

  - **Identify the process creating the connection:** Review Sysmon Event ID 3 (Process Create) to determine which process initiated the outbound connection. Look for familiar system processes versus unexpected executables to assess legitimacy.

  - **Analyze DNS requests:** Query DNS logs or use tools like `Get-DnsClient` to check for recent resolutions of domains related to FleetDeck.io. Confirm whether the DNS resolution matches the timing of the network connections. Legitimate resolutions should correlate with known software installations.

  - **Check for known FleetDeck.io usage:** Validate whether the host has any authorized FleetDeck.io software installed or is part of a managed environment using this tool. Cross-reference with the asset inventory for benign behavior.

  - **Review user activity logs:** Examine User Activity Monitoring logs (if available) for user-initiated actions correlating to the times of detected connections. Look for evidence of legitimate RMM tool usage versus suspicious behavior.

  - **Monitor for exfiltration artifacts:** If malicious activity is suspected, check for unusual file write operations to network shares or cloud storage services. Look for patterns indicating data exfiltration, such as unusual file types being transferred.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized remote access associated with the FleetDeck.io tool. The likelihood of malicious use is moderate, especially in environments where RMM tools are not expected. Such behavior can be weaponized for both initial access and lateral movement within networks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of context around legitimate FleetDeck.io usage, which could lead to false positives. Network logs must be comprehensive and adequately configured to capture all related events for reliable detection. Legitimate administrative activities may trigger this alert, especially in environments where FleetDeck.io is authorized. A related detection to enhance coverage would be monitoring for the use of known remote management command-line utilities or PowerShell scripts that could indicate similar malicious intent.

