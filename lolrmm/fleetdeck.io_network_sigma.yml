note: |
  ### Technical Context

  This rule detects network connections to known domains associated with the FleetDeck.io remote monitoring and management (RMM) tool. Adversaries may leverage RMM tools like FleetDeck.io to maintain control over compromised systems, gather information, or execute commands. This behavior aligns with the Command and Control (C2) tactic under the MITRE ATT&CK framework (T1219). The primary telemetry source for this detection is Windows network connection logs, specifically monitoring connections to the destination hostnames linked to FleetDeck.io. If this activity is malicious, it could enable an attacker to exploit system vulnerabilities or escalate privileges. Importantly, this detection does not confirm the presence of malicious activity on its own; legitimate use of FleetDeck.io for remote administration can trigger this alert.

  ### Investigation Steps

  - **Check active network connections:** Review Windows Security Event ID 5156 (Windows Filtering Platform) to identify processes making outbound connections to `*.agentmqtt.fleetdeck.io` or `*.checkip.zmazonaws.com`. Compare the processes against known applications and authorized services.

  - **Validate host activity:** Cross-check the endpoint's recent activity logs (e.g., Event ID 4688 for process creation) to identify if the activity correlates with legitimate administrative tasks or if there is unexpected behavior indicative of compromise.

  - **Identify unusual user behavior:** Confirm the user account initiating the connection. If the account is not typically associated with administrative tasks or shows high-frequency access patterns, this could indicate malicious intent.

  - **Search for known IOCs:** Reference threat intelligence sources to check for previously reported malicious indicators tied to FleetDeck.io usage. Look for additional behavior, such as unusual traffic patterns or connections to unrelated domains.

  - **Review installed applications:** Inspect for legitimate FleetDeck.io agent installations by checking for the presence of the software's executable located in `C:\Program Files\FleetDeck`. Presence of the software does not confirm compromise, but its absence with alert presence warrants deeper investigation.

  - **Correlate with additional detections:** Implement queries to identify any alerts for privilege escalation or reconnaissance attempts (e.g., Event IDs 4672, 4624) to identify any related suspicious activities on the same endpoint, enhancing context for the alert.

  ### Prioritization

  This alert is of medium severity due to the impact on systems potentially used for administrative access. The likelihood of malicious exploitation is moderate, as RMM tools can be legitimate yet misused for unauthorized access. While the detection is specific to known C2 communications, the general use of such frameworks by adverse actors emphasizes the need for careful review.

  ### Blind Spots and Assumptions

  Evasion techniques may include disguising malicious traffic to appear like legitimate RMM usage, potentially bypassing detection. Reliable detection depends on exhaustive logging of network activities and configurations to capture unexpected external connections. Legitimate administrative tasks, such as remote management by IT personnel using FleetDeck.io, may trigger this alert. For additional detection capabilities, combining this with rules that monitor for lateral movement or privilege escalation will improve threat visibility and response.

