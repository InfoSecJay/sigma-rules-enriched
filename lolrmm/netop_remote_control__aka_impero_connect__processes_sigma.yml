note: |
  ### Technical Context

  This Sigma rule detects process creation activities associated with the Netop Remote Control (Impero Connect) tool, which can be indicative of unauthorized remote access or control conducted by an attacker. The likely attacker objective may include gaining persistent access to a compromised system, facilitating lateral movement, or exfiltrating data. The relevant MITRE ATT&CK techniques include Remote Scheduled Tasks (T1053.001) and Remote Access Software (T1219). Primary telemetry sources are Windows process creation events, specifically focusing on Event ID 4688 and Sysmon Event ID 1, with an emphasis on process parent and image names. If malicious, this behavior could enable an attacker to maintain control over the system, leading to significant data breaches or network compromise. However, this detection does NOT confirm malicious intent on its own, as it can also capture legitimate administrative actions.

  ### Investigation Steps

  - **Identify process details from logs:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 to extract process creation details, focusing on `Image` and `ParentImage` fields. Look specifically for instances where `nhostsvc.exe`, `nhstw32.exe`, `nldrw32.exe`, or `rmserverconsolemediator.exe` appear.

  - **Review process parentage:** Examine the parent processes of detected instances for investigative context. Benign operations typically show trusted administrative tools or user-initiated processes as parent processes, rather than unexpected or suspicious applications.

  - **Check for unusual execution patterns:** Analyze timestamps and execution frequency to identify anomalies. Frequent or automated executions of the detected tools outside regular operational hours can indicate potential misuse.

  - **Correlate with remote access logs:** Look for any related remote connection logs or activity recorded in network logs (e.g., VPN connections or RDP sessions) to validate if the detected tools were used in conjunction with unauthorized access.

  - **Investigate associated network traffic:** Use network telemetry to find any outbound connections made by these processes. Specifically, investigate the destination IPs, URLs, or protocols used, as unexpected connections may indicate malicious activity.

  - **Assess endpoint role and criticality:** Consider the role of the affected endpoint. If the device is part of a sensitive environment or handles critical data, escalate the investigation with urgency, irrespective of the initial findings' nature.

  ### Prioritization

  The severity of this alert is medium. An affected system's impact varies depending on its role and the data it holds, while the use of remote control tools is a common tactic employed by attackers. Since such software may be exploited for malicious purposes, the likelihood of abuse is significant, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may miss if the attacker uses renamed binaries or employs techniques to mask their presence, like running from alternate locations. Reliable detection relies on proper logging and configuration of Windows security auditing. Legitimate remote support activities from IT staff may trigger the alert, necessitating further context to assess intent. Companion detections, such as monitoring for unusual network traffic patterns or other remote access indicators, can strengthen investigative coverage.

