note: |
  ### Technical Context
  This rule detects the execution of processes associated with the Netop Remote Control (commonly referred to as Impero Connect), a remote management and monitoring (RMM) tool frequently used in IT administration. While this software has legitimate applications for providing support, attackers may leverage it to control endpoints covertly, harvest credentials, or deploy malware. The rule focuses on the specific process names tied to this tool when run under unusual or unauthorized conditions, which could indicate malicious use.

  The relevant MITRE ATT&CK tactics for this detection include **Execution** (TA0002) and the technique **Remote System Manipulation** (T1219). Attackers aiming to maintain access to a compromised system or conduct post-exploitation activities may utilize such tools to interact with remote devices and systems without detection.

  Primary data sources for this detection include **process creation events** from Windows, which capture information about when and how processes execute, alongside associated metadata such as the parent process name and command-line arguments. Investigating these logs helps establish context around the execution of these processes, aiding analysts in identifying potentially malicious activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation logs to identify any instances of the specified executables (nhostsvc.exe, nhstw32.exe, nldrw32.exe, rmserverconsolemediator.exe) and their parent processes. Look for unauthorized execution patterns or suspicious command-line arguments.

  - **Analyze Parent Process Context:** Investigate the parent processes of the detected RMM tool executions to determine if they originate from legitimate administrative tasks or benign applications. Unusual parent processes could indicate a compromise.

  - **Check User and Session Data:** Identify the user accounts and sessions from which these processes were executed. Pay attention to accounts that have escalated privileges or are typically not connected to IT administration functions.

  - **Correlate with Network Activity:** Review network logs to find any communication attempts to remote sources associated with the RMM tools, particularly any unusual outbound connections that could suggest malicious use.

  ### Prioritization
  This alert holds medium severity as the presence of the Netop Remote Control tool can indicate both legitimate administration activity and potential malicious behavior. Given the dual-use nature of RMM tools, distinguishing between benign and malicious usage is crucial, especially in environments where sensitive data is handled.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of malicious use since it relies solely on specific process names, which could be masked or renamed by attackers. The assumption is made that the process execution occurs without legitimate administrative oversight. Additionally, appropriate logging of process creation is required for this rule to function effectively, which may not be enabled in all environments. If the logging level is insufficient, there may be gaps in detecting unauthorized usage of the RMM tool.

