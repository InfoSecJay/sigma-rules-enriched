note: |
  ### Technical Context

  The Sigma rule detects outbound network connections to domains associated with the TrustConnect RMM tool, specifically `trustconnectsoftware.com` and `networkservice.cyou`. The likely attacker objective involves establishing command-and-control (C2) communications to manage compromised systems remotely or execute further malicious activities. This behavior aligns with the MITRE ATT&CK tactic "Command and Control" (TA0011) and the technique "Exploitation for Client Execution" (T1219).

  The primary telemetry sources are Windows network connection logs, capturing outbound connections via Security Event ID 5156 (Windows Filtering Platform), which records network traffic allowed or blocked by the firewall. If the communication is malicious, it may lead to significant data exfiltration or further compromise within the network. It is crucial to note that this detection does NOT confirm whether the remote connection is benign or malicious without further context.

  ### Investigation Steps

  - **Review outbound connections:** Analyze Windows Filtering Platform (WFP) logs for Event ID 5156. Look for any new connections to `trustconnectsoftware.com` or `networkservice.cyou`. Compare timestamps with recent security incidents or known system maintenance schedules.

  - **Inspect application behavior:** Check which processes initiated the network requests through Sysmon Event ID 3 (Network Connection). Malicious activity may involve unexpected or non-whitelisted processes interacting with these domains.

  - **Confirm legitimate use cases:** If the alert corresponds with known scheduled maintenance or legitimate usage of TrustConnect, document the reason for access and adjust any monitoring rules accordingly to minimize false positives.

  - **Identify high-confidence malicious indicators:** Look for multiple outbound connection attempts to the suspicious domains in rapid succession, which could indicate automated scripts or malware attempting to communicate. Note any unusual user agent strings or payload sizes in the connections.

  - **Evaluate asset criticality:** Assess the affected host's role within the organization. Key systems (e.g., domain controllers, financial databases) should trigger heightened scrutiny if anomalous behavior is detected.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of remote management tools being abused for malicious purposes. The likelihood of adversary misuse is significant, as gaining access to RMM capabilities can facilitate lateral movement and unauthorized access. TrustConnect usage may be legitimate within certain organizational contexts, thus requiring thorough investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques, such as encrypted communication or the use of legitimate applications masquerading as TrustConnect. Reliable detection necessitates comprehensive log collection from all endpoints, including Sysmon for process tracking. Legitimate administrative activities, such as approved IT maintenance sessions, may inadvertently trigger the alert. Complementary tools, such as endpoint detection and response (EDR) systems, can enhance visibility and context around anomalous behaviors linked to this rule.

