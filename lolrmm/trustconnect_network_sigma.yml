note: |
  ### Technical Context

  This rule detects potential network activity associated with the TrustConnect Remote Monitoring and Management (RMM) tool. Attackers may use RMM tools like TrustConnect to maintain persistent access and control over compromised systems, often for the objectives of data theft or lateral movement within the network. This activity fits within the MITRE ATT&CK framework under the Command and Control tactic (TA0011) and the technique of Application Layer Protocol (T1071).

  The primary telemetry sources include Windows network connection logs that capture outbound connections, specifically monitoring the DestinationHostname for connections to known TrustConnect domains. If confirmed malicious, this could indicate unauthorized access attempts or exploitation of the RMM functionality for nefarious purposes. It is vital to note that this detection does NOT confirm that an attack is ongoing; it merely indicates the potential use of a tool that could facilitate attack activities.

  ### Investigation Steps

  - **Check outbound connections:**
     Review network connection logs for Event ID 5156 (Windows Filtering Platform) or Sysmon Event ID 3 for outbound connections to any of the specified TrustConnect domains. Look for high volume or unusual patterns.

  - **Validate process origins:**
     Determine the parent process of any detected connections using Sysmon Event ID 1. Investigate processes originating from unexpected or suspicious applications that could indicate malicious use of the RMM tool.

  - **Identify legitimate activity patterns:**
     Cross-reference the connections against known legitimate usage scenarios in your environment, such as connections initiated by IT support or system administrators for maintenance using TrustConnect.

  - **Review communication encryptions:**
     Inspect SSL/TLS certificates and handshake details associated with the traffic. Look for anomalous certificate issuers that differ from corporate norms, suggesting impersonation or alternative malicious use.

  - **Correlate with user activity:**
     Analyze user activity logs (Windows Security Event ID 4624) for any logins or operations performed by accounts associated with the TrustConnect tool, particularly during unusual hours or from atypical locations.

  - **Track unusual persistence mechanisms:**
     Investigate if there are any startup entries or services related to TrustConnect (check Registry keys under HKLM\Software) that may have been added or modified recently, indicating potential unauthorized persistence.

  ### Prioritization

  This alert has medium severity in an enterprise context. The impact of the affected system can be significant if truly compromised, particularly if sensitive data is involved. The likelihood of this specific RMM tool being abused is moderate, as these tools have known legitimate uses, but they are also frequently exploited by adversaries.

  ### Blind Spots and Assumptions

  Detection is limited if certain log sources, such as Windows Filtering Platform logs or Sysmon events, are not properly configured to capture relevant telemetry. Legitimate uses of TrustConnect will trigger this alert, which can lead to false positives if system administration routines are not well understood. Companion detections that could strengthen coverage include monitoring for unusual behavior related to known RMM processes or tracking changes in user privileges associated with administrative attempts on managed systems.

