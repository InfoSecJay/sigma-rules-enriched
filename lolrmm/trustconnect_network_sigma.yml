note: |
  ### Technical Context

  This rule detects network communication attempts towards domains associated with the TrustConnect RMM (Remote Monitoring and Management) tool, specifically targeting endpoints where the software may not be authorized or expected. Malicious actors may leverage RMM tools to maintain control over compromised systems, facilitate lateral movement, or exfiltrate sensitive data covertly.

  The relevant MITRE ATT&CK tactic is **Execution**, specifically technique **T1219: Remote Access Software**. Primary telemetry sources include Windows network connection logs, which would capture relevant destination hostnames and IP addresses. If the detected activity is indeed malicious, it could lead to unauthorized access to systems, data breaches, or prolonged persistence within the network.

  This detection, however, does NOT confirm unauthorized access or misuse on its own, as legitimate use of TrustConnect RMM may also generate similar network communications.

  ### Investigation Steps

  - **Review destination hostnames:** Verify the connection to `trustconnectsoftware.com` or `networkservice.cyou`. Legitimate traffic should be tied to known assets or specific approved use cases. Compare against internal documentation of allowed RMM tools.

  - **Analyze network logs for anomalies:** Check Windows Event ID 5156 (Windows Filtering Platform), focusing on connection events with the aforementioned domains. Look for unusual outbound connections not typically associated with user activity or specific use cases.

  - **Cross-reference with approval records:** Investigate whether the use of TrustConnect RMM is documented and approved within your organization. If unapproved, escalate for further investigation as it may indicate malicious intent.

  - **Identify high-confidence indicators of compromise:** Focus on repeated and excessive connections to the domains within a short time frame. Look for patterns in User-Agent strings, possibly indicating automated or scripted access.

  - **Evaluate related process activity:** Check for processes on hosts initiating these connections. Specifically, review the Windows Security Event ID 4688 for process creation tied to the RMM tool. Look for parent processes that appear suspicious or unexpected.

  - **Confirm legitimate activity:** Document any ongoing, authorized use of TrustConnect RMM, including specific user activity that corresponds with expected operational patterns on the network.

  ### Prioritization

  This alert should be considered medium priority due to the potential impact on compromised systems where unauthorized RMM tools can facilitate access or control. The likelihood of malicious abuse is moderate, especially in environments where RMM tools are prohibited or not actively managed. This behavior is not commonly weaponized but should still be monitored closely to mitigate risk.

  ### Blind Spots and Assumptions

  Detection may be limited by hardware firewall rules or VPN configurations that could mask outbound connections to the detected domains. Legitimate activities, such as managed service provider engagements, could falsely trigger the alert. To strengthen coverage, consider additional detections for abnormal usage patterns of RMM tools in conjunction with logging user authentication events (e.g., Event ID 4624 for logon events).

