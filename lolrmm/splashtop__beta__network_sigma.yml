  ### Technical Context

  This rule detects network connections to the domain "splashtop.com," which indicates potential usage of the Splashtop Remote Management Tool (RMM). Attackers may use this tool to gain unauthorized access to systems, facilitating remote control and data exfiltration. The relevant MITRE ATT&CK tactic is **Execution**, specifically technique **T1219: Remote Access Software**.

  Primary telemetry sources include Windows network connection logs, specifically looking for outbound connections to the specified hostname. If malicious, the security impact could involve unauthorized access or control over critical systems, leading to data breaches or further lateral movement within the network. Notably, this detection does NOT confirm malicious intent on its own; legitimate usage of the Splashtop tool can trigger it as well.

  ### Investigation Steps

  - **Check network activity:** Validate outbound connections to **splashtop.com** (Event ID: 5156 from Windows Firewall logs), noting any connections from sensitive systems or critical infrastructure.

  - **Review process initiators:** Look for Windows Process Creation logs (Security Event ID: 4688 or Sysmon Event ID: 1) that show which processes initiated outbound requests to **splashtop.com**. Ensure the processes are recognized as legitimate.

  - **Compare timestamps with known usage:** Match the connection timestamps against legitimate maintenance windows or scheduled remote access activities, establishing if the usage aligns with expected behavior.

  - **Identify high-confidence malicious indicators:** Determine if there are unusual login patterns or connections occurring outside normal business hours, particularly from unattended systems.

  - **Examine user behavior:** Review user accounts associated with the detected activity. Look for anomalous behavior like excessive remote connections or activity stemming from accounts not usually associated with remote access.

  - **Document legitimate use cases:** Understand normal operational use of Splashtop within your organization. Confirm that identified users have been trained and approved for utilizing RMM tools.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized remote access on critical systems and the likelihood of the tool being weaponized for malicious purposes. While the tool can be leveraged for legitimate activities, its potential for abuse warrants timely investigation.

  ### Blind Spots and Assumptions

  The detection may be limited by false positives from legitimate Splashtop usage within the organization. Reliable detection requires thorough logging of outbound network connections to catch relevant traffic. Additionally, legitimate activities like IT support or remote work can trigger this alert. A related detection to consider is the monitoring of anomalous process creation logs, which could provide further context on potential misuse of remote access tools.

