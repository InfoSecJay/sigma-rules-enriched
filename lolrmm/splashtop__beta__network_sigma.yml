note: |
  ### Technical Context

  This Sigma rule detects network connections made to Splashtop (Beta) domains, which are associated with the Splashtop Remote Management Tool (RMM). Attackers may leverage such tools for remote access and control over compromised systems, aiming to facilitate lateral movement or exfiltration. This activity aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and the related technique Remote Access Software (T1219).

  The primary telemetry source for this detection will be Windows network connection logs, specifically monitoring outbound connections to specified Splashtop domains. If malicious, this behavior could indicate unauthorized remote access to corporate systems. It is crucial to note that this detection does NOT confirm malicious intent by itself; legitimate use of the Splashtop tool within an organization may trigger this alert.

  ### Investigation Steps

  - **Validate network connections: ** Look for Event IDs related to network connections (e.g., Security Event ID 5156 - Windows Filtering Platform) that show access to the detected Splashtop domains.

  - **Assess system roles: ** Identify the asset making the connection. Ensure it correlates with endpoints that should not have remote management tools installed, focusing on high-criticality servers or sensitive data repositories.

  - **Check for authorized usage: ** Review documentation or asset inventory to confirm if Splashtop (Beta) is sanctioned for use on the system in question. Legitimate use usually involves specific user accounts with business context.

  - **Correlate with other telemetry: ** Examine endpoint logs (e.g., Sysmon Event ID 3) to check for executed processes that may indicate Splashtop activity. Look for the process path related to Splashtop executables to assess if the behavior aligns with standard operations.

  - **Search for high-confidence indicates of compromise: ** Look for any signs of unusual behavior, such as unexpected credentials being used to log into the Splashtop tool or connections made outside standard working hours.

  ### Prioritization

  This alert has medium severity due to the potential for unauthorized access to systems. The risk is elevated when the affected system is critical and may contain sensitive information. The use of remote access tools for nefarious purposes is a known tactic among attackers, making prompt investigation crucial.

  ### Blind Spots and Assumptions

  There are limitations in detecting legitimate use since the alert could be triggered by authorized activity. Variants of Splashtop or other remote access tools may evade detection if their domains are not included in the rule. High legitimate usage scenarios could include IT support interactions or within development environments. A related detection to consider is monitoring for unusual outbound network traffic patterns, which could indicate exploitation or lateral movement attempts.

