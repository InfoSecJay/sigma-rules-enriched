note: |
  ### Technical Context
  This rule detects network activity potentially associated with the Splashtop Remote Management (RMM) tool, specifically looking for connections to domains ending in `splashtop.com`. The presence of Splashtop in an environment might indicate unauthorized remote access, which can compromise sensitive systems and data. Attackers may exploit such tools to gain persistent access to victim networks, often bypassing traditional security measures. The primary objective for attackers using RMM tools is typically to maintain control over the compromised systems, execute commands remotely, and transfer data without detection.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Execution (TA0002)**: Refers to the execution of any command or file.
  - **Remote Services (T1219)**: Involves using remote access services, which can be leveraged for unauthorized control of systems.

  The primary data sources for effective detection are network connection logs that capture outbound traffic from endpoints, focusing on specific domains associated with the Splashtop service.

  ### Investigation Steps
  - **Analyze Network Connections**: Review network connection logs for any outgoing connections to `*.splashtop.com`. Validate whether these connections are part of legitimate operations or indications of unauthorized access.
  - **Review Endpoint Activity**: Check for any recent installations, updates, or executions of the Splashtop application on endpoints. This may involve examining process creation logs and application events.
  - **Consult User Activity Logs**: Investigate user accounts for unusual login patterns coinciding with the detected Splashtop activity, particularly from unfamiliar IP addresses or geo-locations.
  - **Cross-reference with Asset Inventory**: Confirm whether any authorized personnel or devices are known to utilize Splashtop for remote management, thus verifying if the detected activity is legitimate or potentially malicious.

  ### Prioritization
  This alert should be considered medium-severity due to its potential impact on the organization’s security posture; while the use of Splashtop is not inherently malicious, its presence can indicate unauthorized access scenarios that warrant further investigation.

  ### Blind Spots and Assumptions
  A gap in detection coverage may exist for environments that do not log outbound network connections, making it difficult to identify instances of Splashtop being used maliciously. Additionally, the detection logic assumes that all outgoing connections to `splashtop.com` are worth investigating, but there can be legitimate uses of this tool within the enterprise. For this alert to function effectively, comprehensive logging of network connections must be enabled, including full DNS query logs and endpoint telemetry related to application execution.

