note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with the Splashtop Remote Management Tool (RMM), specifically targeting traffic directed at `splashtop.com`. The likely attacker objective is to establish a command-and-control (C2) channel or remote access to the host system, potentially via unauthorized use of this third-party tool. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), and the technique is "Application Layer Protocol" (T1219).

  Primary telemetry sources for this detection include Windows network connection logs that capture outbound traffic with specific hostname queries. If exploited maliciously, this could facilitate unauthorized remote access, leading to data exfiltration or system compromise. Importantly, this detection does not confirm malicious intent on its own; legitimate usage of the Splashtop tool in the organization could trigger these alerts.

  ### Investigation Steps

  - **Check network connection logs:** Verify event details in Windows Event ID 5156 (Windows Filtering Platform Network Connection) for the destination hostname `splashtop.com`. Look for connections initiated by non-admin accounts as potential indicators of misuse.

  - **Identify user and asset context:** Review the user accounts tied to the alerts for any unauthorized or unexpected activity. Cross-reference this with known asset roles; for example, ensure that only authorized IT staff have access to RMM tools.

  - **Compare with known legitimate use:** Investigate previous alerts and legitimate usage patterns of Splashtop within the enterprise. Confirm whether the originating processes are typical for authorized remote support activities.

  - **Search for related execution context:** Use Sysmon Event ID 23 to check for associated process creation events from the host that initiated the connection. High-confidence malicious indicators include unauthorized applications or scripts leading to connections with the domain.

  - **Look for multiple connection attempts:** Examine frequency and timing of connections to `splashtop.com`. Anomalies, such as a surge in connections in a short time frame or connections outside normal business hours, may indicate compromise or misuse.

  ### Prioritization

  This alert has medium severity due to its context-dependent nature. The impact of affected systems could vary significantly based on their roles; unauthorized remote access tools pose a risk of data breaches or lateral movement. However, it is essential to acknowledge that this could also indicate a legitimate use case for remote support.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of the Splashtop tool, which could lead to false positives. It requires configuration of Windows Filtering Platform logging for comprehensive coverage. Additionally, other legitimate remote management software or administrative tasks could potentially trigger this alert. Companion detections, such as monitoring for unauthorized installations of software with similar network behavior, could strengthen overall coverage against remote access abuse.

