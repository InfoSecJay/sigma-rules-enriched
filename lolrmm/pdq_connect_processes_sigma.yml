note: |
  ### Technical Context

  This rule detects the execution of processes related to the PDQ Connect remote management tool, identified by the presence of the executable files ending in `pdq-connect*.exe`. The likely objective for an attacker using PDQ Connect would be to manage systems remotely, facilitate lateral movement, or establish persistence. This detection aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Remote Access Software (T1219).

  The primary telemetry sources are Windows process creation logs, particularly focusing on Event ID 4688 from the Windows security logs or Sysmon Event ID 1. If the usage of PDQ Connect is malicious, it could allow an adversary to manipulate system settings or deploy malware across multiple endpoints. However, it is important to note that this detection does NOT confirm malicious intent on its own, as it could also indicate legitimate use of the PDQ Connect tool by authorized personnel.

  ### Investigation Steps

  - **Review process creation logs**: Check for Event ID 4688 or Sysmon Event ID 1 for processes being created that include images ending with `pdq-connect*.exe`. Verify the parent process for context (e.g., ensure legitimate processes are initiating PDQ Connect).

  - **Identify authorized users**: Validate that the user account running PDQ Connect is known and has legitimate reasons for remote management tool usage. Look for accounts within the administrative or IT staff categories.

  - **Examine the execution context**: Cross-reference the execution time of the detected `pdq-connect*.exe` activity against the scheduled maintenance windows or prior authorized changes. Legitimate activity typically aligns with these periods.

  - **Correlate with network activity**: Analyze network logs for connections initiated by the detected `pdq-connect*.exe` process. Check typical ports used for remote management (e.g., TCP 80, 443) and ensure they align with normal business operations.

  - **Investigate ancillary actions**: Look for actions taken by the `pdq-connect*.exe` process, such as file creations or modifications using Event ID 4663 (File Access) to determine if unauthorized file access or manipulation occurred.

  ### Prioritization

  This alert should be considered medium severity in an enterprise context. The affected systems may be critical for operations, making them desirable targets for malicious actors. While there is a likelihood of abuse during adversarial activities, the use of PDQ Connect can also be part of benign administrative tasks, which complicates threat assessment.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers manipulate legitimate tools through evasion techniques such as renaming executables or using alternative remote access methods not covered by this rule. Reliable detection requires proper logging configuration, including enabling process creation logging (Event ID 4688) and Sysmon drivers to accurately capture relevant telemetry. Legitimate administrative use of PDQ Connect by IT personnel could trigger the alert, necessitating a thorough investigation. A companion detection to strengthen coverage would involve monitoring for suspicious network traffic patterns consistent with known remote access tool usage, such as contiguous high traffic volumes or unapproved ports used after the execution of `pdq-connect*.exe`.

