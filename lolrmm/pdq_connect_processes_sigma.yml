  ---

  ### Technical Context

  This detection rule identifies the execution of processes related to the PDQ Connect Remote Monitoring and Management (RMM) tool, indicated by processes that start with the `pdq-connect` executable name. The likely objective of an attacker deploying this tool may include unauthorized system management or data exfiltration under the guise of legitimate administrative activities.

  This activity relates to the MITRE ATT&CK technique T1219 (Remote Access Software). The primary telemetry source is the Windows process creation logs, specifically Security Event ID 4688. If used maliciously, this tool could enable an adversary to maintain persistence or gain unauthorized access to sensitive information. However, this detection does NOT confirm malicious intent on its own, as the PDQ Connect RMM tool can be used legitimately by administrators.

  ---

  ### Investigation Steps

  - **Check process details:** Review Windows Security Event ID 4688 logs for any `pdq-connect*.exe` process creation. Investigate command-line arguments for indicators of misuse (unusual switches or scripts that don’t align with typical administrative tasks).

  - **Review parent processes:** Analyze the parent process of `pdq-connect*.exe` start events. A legitimate parent process might consist of standard administrative tools, while unusual parent processes (e.g., cmd.exe with suspicious command arguments) could indicate malicious activity.

  - **Assess the asset role:** Determine the criticality and role of the host initiating `pdq-connect*.exe`. If the host is a sensitive server or workstation, heightened scrutiny is warranted, and malicious use is more impactful.

  - **Cross-reference with legitimate usage:** Validate with recent change management records or scheduled maintenance tasks. Expected legitimate usage would show regular scheduled deploys or administrative actions likely documented in ticketing systems.

  - **Identify high-confidence indicators:** Look for behavior consistent with attacker objectives, such as attempted command execution through the RMM tool that targets sensitive system areas, indicated by created threads or injection attempts in memory within critical processes.

  - **Audit for file artifacts:** Check for unusual file creation or modification associated with `pdq-connect*.exe`, such as unexpected changes in system configuration files or the creation of remote scripts (`*.bat` or `*.ps1`) that could lead to further exploitation.

  ---

  ### Prioritization

  The alert warrants medium severity because the presence of the PDQ Connect tool could facilitate both administrative tasks and malicious activities, particularly in critical environments. Given that RMM tools can be weaponized for remote exploitation and lateral movement, this detection should be prioritized based on the asset's role and environment monitoring guidelines.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if the attacker renames the executable or uses a different RMM tool not covered by the rule. It requires that the process creation logs are properly configured and collected; if these logs are disabled, detection capabilities will be diminished. Legitimate administrative activities, like remote management during server maintenance, may falsely trigger this alert. A companion detection could include monitoring for unusual network traffic associated with PDQ Connect, enhancing visibility into potential misuse.

