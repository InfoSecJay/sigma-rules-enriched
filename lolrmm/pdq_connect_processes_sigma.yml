note: |
  ### Technical Context

  This rule detects the execution of processes associated with the PDQ Connect Remote Monitoring and Management (RMM) tool, specifically those processes whose names end with "pdq-connect*.exe". The likely attacker objective is to use PDQ Connect for administrative tasks, which could be leveraged to facilitate lateral movement, execute unauthorized commands, or manage compromised endpoints. The relevant MITRE ATT&CK tactic is Execution with technique ID T1219.

  The primary telemetry source for this detection is Windows process creation logs. Specific log types include Security Event ID 4688 and Sysmon Event ID 1, which capture process creation metadata. If used maliciously, this behavior could result in unauthorized access control or system compromise. It is essential to note that this detection does not confirm malicious activity on its own, as legitimate use of PDQ Connect for IT management purposes exists.

  ### Investigation Steps

  - **Check for PDQ Connect usage history:** Review Security Event ID 4688 and Sysmon Event ID 1 for logs related to "pdq-connect*.exe" creation. Compare timestamps and user accounts to confirm if this aligns with known administrative activity.

  - **Examine parent process information:** Identify the parent process for instances of "pdq-connect*.exe" using Sysmon Event ID 1. Legitimate usage typically originates from IT management tools or console applications. Look for legitimate parent processes like "powershell.exe" or "cmd.exe".

  - **Validate execution context:** Cross-reference the triggering user account with a list of known administrators or operators. Legitimate activities should correlate with designated IT personnel. Any unexpected users triggering this process are suspicious.

  - **Capture command line arguments:** Review the command line arguments in Sysmon Event ID 1 for "pdq-connect*.exe". Malicious indicators may include unusual flags or parameters that deviate from expected usage patterns, such as unauthorized access attempts.

  - **Assess application behavior:** If PDQ Connect is part of the organization’s toolkit, monitor for concurrent activities such as user permissions changes or unexpected script executions linked to its service. Any discrepancies lead to further scrutiny.

  ### Prioritization

  This alert is medium severity due to the potential impact on system integrity and user permissions. The likelihood of malicious abuse is noteworthy as adversaries may exploit legitimate RMM tools for lateral movement or unauthorized access. Such behavior is increasingly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate usage of PDQ Connect in the environment, leading to false positives. Ensure comprehensive logging for Sysmon, specifically process creation events, is correctly configured to capture all necessary details. Additionally, legitimate administrative tasks that involve executing “pdq-connect*.exe” may trigger this alert. A related detection, monitoring for unusual command line behavior associated with RMM tools, strengthens coverage by identifying broader indicators of compromise.

