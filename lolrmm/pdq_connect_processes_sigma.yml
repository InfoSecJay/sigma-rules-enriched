note: |
  ### Technical Context
  This detection rule identifies potential instances of the PDQ Connect Remote Monitoring and Management (RMM) tool being executed on Windows systems. PDQ Connect is often utilized by system administrators for managing endpoints, but it can also be exploited by malicious actors to maintain persistence, execute commands, or manipulate systems without authorization. The capability to run this tool can indicate either legitimate administrative activity or malicious actions, especially if conducted by unauthorized users.

  Attackers may use PDQ Connect to remotely access and control systems, potentially executing unauthorized software or scripts for lateral movement within an organization. This could allow them to escalate privileges, exfiltrate sensitive data, or install further payloads. Relevant MITRE ATT&CK techniques for this activity include **Remote Services (T1219)**, which covers tools for managing remote devices, indicating the use of remote management software in an environment.

  Primary data sources that will provide insight into this alert include **process creation events**, which track the launching of executables and can reveal questionable use of administrative tools, along with any potential abuses of remote management functionalities that may indicate a critical security breach.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation events related to `pdq-connect*.exe`, monitoring for any unauthorized executions that deviate from established administrative usage practices.
  - **Analyze Parent Process Information:** Check the parent process of any detected instances to identify the context in which PDQ Connect was executed, assessing whether it correlates with known administrative workflows or anomalous behavior.
  - **Correlate with User Activity:** Investigate user accounts associated with the execution of PDQ Connect, particularly focusing on any service or non-interactive accounts that may indicate misuse of the tool for nefarious purposes.
  - **Inspect Network Traffic:** Look for any outbound connections made by the PDQ Connect process to identify potential data exfiltration or communications with known malicious infrastructure.

  ### Prioritization
  This alert is rated as medium severity due to the legitimate administrative use of PDQ Connect, which increases the potential for false positives. However, any unexpected execution of the tool, especially from untrusted sources or unusual accounts, poses a risk that could indicate a security compromise or misuse.

  ### Blind Spots and Assumptions
  There may be gaps in detection for environments where PDQ Connect is not thoroughly regulated or where administrative practices are poorly documented, leading to potential legitimate actions being falsely identified as threats. The detection logic assumes that the presence of `pdq-connect*.exe` is suspicious unless justified by established administrative procedures. Proper logging of process creation events must be enabled, and any process monitoring configurations must be appropriately set to successfully detect this activity.

