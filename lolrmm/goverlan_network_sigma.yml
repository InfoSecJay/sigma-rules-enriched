note: |
  ### Technical Context

  This Sigma rule detects network connections to the Goverlan RMM tool's servers, primarily targeting domains that end with `goverlan.com`. The likely attacker objective is to establish remote management capabilities on a compromised system, which can facilitate further exploitation or data exfiltration. The relevant MITRE ATT&CK tactic is Command and Control (TA0011) with the technique ID T1219 (Remote Access Software). The primary telemetry sources are Windows network connection logs, specifically monitoring for connections to specified Goverlan domains. If malicious, unauthorized usage could lead to severe data breaches or system manipulation. However, this detection does NOT confirm that an attack is in progress; it simply identifies potentially suspicious activity that requires further investigation.

  ### Investigation Steps

  - **Verify active network connections:** Check for outgoing connections to `goverlan.com` domains using Windows Firewall logs or PowerShell commands. Look for Event ID 5156 (Windows Filtering Platform) indicating allowed connections; legitimate use may include IPs associated with known internal IT management.

  - **Examine process associations:** Cross-reference the detected network activity with active processes using Sysmon Event ID 1. Identify if the network connection is initiated by processes associated with legitimate remote management tools.

  - **Assess for known malicious indicators:** Investigate any connection to non-whitelisted IP addresses or unusual user accounts associated with the connection to Goverlan. This may indicate unauthorized access; compare with MITRE ATT&CK techniques for similar behavior.

  - **Check system activity logs:** Review logs for Event ID 4688 (process creation) around the same timestamp as detected connections. Look for unexpected executables or scripts originating from user directories that may correspond with Goverlan connections.

  - **Correlation with user behavior:** Identify any recent significant changes in user activities that correspond to the Goverlan connection timestamps. Legitimate IT management activity may include scheduled remote support, while synchronous connections to multiple user endpoints could indicate malicious intent.

  ### Prioritization

  This alert should be considered of medium severity, as it could indicate potentially unauthorized use of remote management tools which, while not routinely weaponized, can lead to exploitation if used inappropriately. The impact escalates if the affected system is critical to business operations or contains sensitive data.

  ### Blind Spots and Assumptions

  Detection may have limitations due to encrypted traffic to Goverlan servers, potentially obscuring malicious activities. Reliable detection requires full logging capabilities on Windows network connections and appropriate configurations for Sysmon to capture process creation events. Legitimate IT operatives might trigger this alert when conducting routine administrative tasks or remote support sessions. A related detection could include establishing alerts for unusual login patterns or account usage in conjunction with established network activity logs to enhance coverage and context.

