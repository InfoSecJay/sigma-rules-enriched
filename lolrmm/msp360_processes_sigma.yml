note: |
  ### Technical Context

  This Sigma rule detects the process creation activities associated with MSP360 RMM (Remote Monitoring and Management) tool, which is commonly used for remote administration and backup tasks. Attackers may leverage this tool to maintain persistence and control over compromised systems, potentially facilitating lateral movement within the network. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), with the technique being **Input Data from External Sources** (T1219).

  The primary telemetry source is Windows process creation logs, specifically focusing on event IDs such as 4688 for process creation. If the detected processes are maliciously invoked, they can compromise system integrity and lead to data theft or unauthorized access. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of the MSP360 RMM tool is common in enterprise environments.

  ### Investigation Steps

  - **Verify process creation details:** Check Windows Security Event ID 4688 for the suspicious processes. Look for specific parent-child relationships indicating abnormal execution chains, such as MSP360 processes spawned by non-standard parent images.

  - **Identify legitimate usage patterns:** Review the organizational policy on MSP360 RMM tool usage, including times and locations of legitimate remote access. Expected behavior usually shows MSP360 processes initiated during business hours by specific user accounts, typically tied to IT support roles.

  - **Inspect command-line arguments:** Analyze command line fields in the process creation logs for unusual parameters that could indicate misuse. Malicious instances might utilize arguments associated with unauthorized backups or remote access functions not normally used in your environment.

  - **Cross-reference with other logs:** Check for related activity in Windows Sysmon logs (Event ID 11 - File Creation) that may show file creation or modification linked to the detected processes. Look for unusual files generated or modified at the same time as process creation.

  - **Review network traffic for command and control:** Use network logs to assess outbound connections made by these processes. Focus on non-standard ports or connections to known malicious IPs that could indicate command-and-control traffic.

  - **Document any anomalies:** Log any findings, especially indications of processes executing outside of the expected owner or context, as these could signify a compromised state needing further escalation.

  ### Prioritization

  The alert poses a medium severity in an enterprise context. While MSP360 RMM is a legitimate tool for IT operations, its misuse can lead to significant security incidents. The likelihood of malicious use exists, given that this behavior can be weaponized by adversaries to establish persistent access.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion techniques that could bypass standard process logging, such as custom scripts or malware that obfuscates its presence. Reliable detection requires proper configuration of Windows event logging and the deployment of Sysmon for detailed process tracking. Legitimate activities may involve IT staff using MSP360 for scheduled backups or remote management tasks. Related detections might involve monitoring for unusual task scheduler activities or unauthorized software installations to strengthen coverage against potential misuse.

