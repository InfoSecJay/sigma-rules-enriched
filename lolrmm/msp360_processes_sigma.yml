note: |
  ### Technical Context

  This Sigma rule detects potential process activity associated with the MSP360 Remote Monitoring and Management (RMM) tool. The behavior being monitored includes the execution of processes that have been associated with legitimate remote backup and management operations. The likely attacker objective would be to utilize these tools covertly to exfiltrate data or maintain persistence on the network without authorization.

  The relevant MITRE ATT&CK tactic is **Execution** with technique ID **T1219**, which covers the execution of remote management tools to facilitate malicious activities. Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which would provide details of the processes initiated. If malicious, this behavior could indicate unauthorized access or manipulation of backup processes, leading to data theft or system compromise. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate MSP360 tool usage can trigger this alert.

  ### Investigation Steps

  - **Review process execution events:** Check Security Event ID 4688 and Sysmon Event ID 1 for any processes initiated by the specific MSP360 executables (e.g., `Online Backup.exe`, `CBBackupPlan.exe`). Compare timestamps with user logon events to identify anomalies.

  - **Assess the parent-child relationship:** Investigate the command lines and parent processes of detected MSP360-related processes to see if they were started by legitimate applications or saved tasks (e.g., `Online Backup.exe` started by `Remote Desktop.exe`).

  - **Monitor for unusual network activity:** Analyze network connections from hosts running these processes (Firewall logs, NetFlow) for any unexpected external connections or data exfiltration attempts during active use of the MSP360 tools.

  - **Identify legitimate behavior patterns:** Reference the normal operational hours and known workflows for MSP360 usage within your organization. Typical use includes scheduled backups or remote management during defined maintenance windows.

  - **Evaluate associated user permissions:** Verify the accounts that executed these processes against expected roles. Check if they possess administrative rights which may indicate a higher risk if misused.

  - **Correlate with threat intelligence:** Cross-reference the observed behavior and endpoints with threat intelligence sources to determine if any indicators of compromise related to MSP360 have been reported recently.

  ### Prioritization

  This alert is of medium severity given that it can relate to both benign MSP360 operations and malicious activity. The impact may vary based on the criticality of the host systems involved, and the likelihood of abuse could be moderate due to the nature of RMM tools being commonly weaponized by adversaries during lateral movement or data breach activities.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate MSP360 usage to trigger alerts, leading to false positives. Additionally, monitoring configurations must ensure that both Security Event ID 4688 and Sysmon Event ID 1 are enabled for comprehensive visibility. Activities like unauthorized remote access or system administration using these tools may not always be captured under this rule. A related detection for common adversary methods would include monitoring for scheduling tasks related to RMM tools, correlating with this alert for enhanced context on potential misuse.

