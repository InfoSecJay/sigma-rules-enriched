note: |
  ### Technical Context

  This detection rule captures potential process activity associated with the MSP360 Remote Monitoring and Management (RMM) tool, which is often leveraged for IT support and backup services. The likely attacker objective would be to use this tool for remote access to conduct post-exploitation actions, such as data exfiltration or further lateral movement within the network. Relevant MITRE ATT&CK techniques include Remote Services (T1219) under the Execution tactic.

  Primary telemetry sources for this detection are the Windows process creation logs, specifically focusing on events such as Security Event ID 4688, which logs process creation details. If malicious, the use of MSP360 could facilitate unauthorized access or control over systems. Importantly, this detection does NOT confirm that malicious activity is taking place on its own; the presence of MSP360-related processes needs to be evaluated alongside additional context and evidence.

  ### Investigation Steps

  - **Examine process details**: Review Security Event ID 4688 logs for process creation events. Look for the parent image names indicative of MSP360 processes (e.g., 'Online Backup.exe', 'RMM.Agent.exe'). Compare with a baseline of known legitimate usage.

  - **Identify execution context**: Investigate the command line arguments associated with these processes. Legitimate uses may show standard configurations for backups, while command lines with suspicious flags or scripts warrant further scrutiny.

  - **Check process hierarchy**: Utilize Sysinternals Process Explorer to analyze process trees, determining whether these MSP360 processes are executed by known benign applications or services, or if they are being spawned by unusual or unauthorized parent processes.

  - **Validate user account activity**: Review Event ID 4624 to check user logon information correlated to the times of the detected activity. Legitimate MSP360 use should correspond to known support staff or scheduled tasks, whereas unknown user accounts may indicate suspicious activity.

  - **Assess network connections**: Check for outbound connections from these processes using Windows Firewall or endpoint security logs (e.g., Windows Event ID 5156). Look for unusual external IP addresses or connection patterns that might suggest data exfiltration.

  - **Document asset criticality**: For systems running MSP360, evaluate their criticality within the enterprise. Prioritize investigation on high-value or sensitive systems where unauthorized access could have significant security impacts.

  ### Prioritization

  Given the potential impact of unauthorized remote access via MSP360 on sensitive systems, this alert holds medium severity in an enterprise context. The likelihood of malicious abuse is moderate, especially as this tool can be weaponized for unauthorized control or data exfiltration.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of MSP360 in daily operations, which could generate false positives. Reliable detection requires that all systems utilizing MSP360 have appropriate logging configurations enabled, particularly focused on process creation and network connections. The alert might be triggered by common administrative activities or scheduled backups. Related detections that can enhance coverage include monitoring for unauthorized remote desktop connections (T1076) or unusual network traffic patterns indicative of potential data exfiltration.

