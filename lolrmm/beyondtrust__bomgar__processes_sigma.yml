note: |
  ### Technical Context

  This rule detects the execution of potential BeyondTrust (Bomgar) Remote Monitoring and Management (RMM) tool processes. The behavior indicates that an adversary may be leveraging legitimate remote management software to gain unauthorized access to systems, potentially aiming to execute malicious commands, exfiltrate data, or maintain persistence within the environment. This activity fits within the MITRE ATT&CK framework under the Execution tactic, specifically technique T1219 (Remote Access Software).

  The primary telemetry sources include Windows Event Logs pertaining to process creation (Event ID 4688) and Sysmon log entries related to process events. If malicious, this behavior can enable attackers to control and manipulate systems remotely, posing a significant security risk. Notably, this detection does not confirm any actual compromise or malicious intent on its own; it merely indicates the presence of the specified processes operating under monitor.

  ### Investigation Steps

  - **Review process creation events**: Look for Security Event ID 4688 logs or Sysmon Event ID 1 entries that show the execution of processes ending with 'bomgar-scc.exe', 'bomgar-pac.exe', or 'bomgar-rdp.exe'. Investigate whether these processes were initiated by legitimate parent processes or if they originated from potentially malicious sources.

  - **Identify associated user accounts**: Check the account executing the suspicious processes, specifically in Event ID 4624 for successful logons. Confirming that the user account matches expected roles (e.g., IT support personnel) can help differentiate benign usage from potential abuse.

  - **Evaluate process command line parameters**: In Sysmon logs, investigate the command line used in conjunction with process creation to identify any unusual flags or interactions that may signify malicious intent, such as redirection to unknown URLs or odd parameters.

  - **Distinguish legitimate from malicious usage**: Confirm that the identified processes were executed during expected operational hours and patterns typical for IT support teams. Compare against historical benign behavior to help ascertain legitimacy.

  - **Check for outbound connections**: Investigate network connections initiated by these processes through Windows Firewall logs or other network monitoring tools, looking for unusual or unauthorized external communications typically associated with remote administration tools.

  - **Look for additional indicators on the host**: Verify the existence and integrity of any associated files or services related to BeyondTrust on the host system (Path: C:\Program Files\BeyondTrust). Ensure that they fall within expected versions and no unauthorized modifications were made.

  ### Prioritization

  This alert should be treated with medium priority in an enterprise context. While the presence of BeyondTrust processes alone does not confirm malicious activity, their legitimate use in RMM can often be weaponized by attackers to gain control over critical systems or data, requiring prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if the adversary employs techniques to obscure process creation or uses alternative methods of remote access. The alert relies heavily on having Windows Process Creation logging enabled (including Sysmon); thus, any gaps in configuration may hinder visibility. Legitimate administrative use of BeyondTrust tools may trigger the alert during routine support activities. A related detection to consider is monitoring for unusual credential use or lateral movement patterns in conjunction with these processes to enhance overall coverage.

