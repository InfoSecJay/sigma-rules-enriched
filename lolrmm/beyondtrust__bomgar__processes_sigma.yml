note: |
  ### Technical Context
  This detection rule identifies the execution of processes associated with the BeyondTrust Remote Management and Monitoring (RMM) tool, commonly known as Bomgar. The intent behind monitoring these processes is to discern potentially unauthorized actions taken by malicious actors using this tool, which could enable them to gain remote access to systems within the enterprise. An attacker leveraging Bomgar could aim to exfiltrate sensitive data, manipulate system configurations, or establish persistence within the environment.

  Potential scenarios might involve an insider threat or an external breach, where adversaries leverage legitimate remote access software for nefarious purposes. The relevant MITRE ATT&CK tactics and techniques include **Execution** (TA0002) and **Application Layer Protocol** (T1219), which describes the use of legitimate tools to manipulate systems without detection. Primary data sources supporting this detection include process creation events from Windows logs, which record the execution of processes across systems and provide vital evidence of any abnormal activity involving remote management tools.

  ### Investigation Steps
  - **Review Process Logs**: Analyze recent process creation logs to identify instances where Bomgar-related executables (e.g., `bomgar-scc.exe`, `bomgar-pac.exe`, `bomgar-rdp.exe`) were spawned. Look for unusual parent-child relationships that deviate from normal operational behavior.
  - **Check User Context**: Investigate the user accounts associated with the detected Bomgar processes. Assess whether the accounts have legitimate access or if they appear anomalous based on role or recent activity patterns.
  - **Examine Network Traffic**: Assess outbound network connections initiated by the detected Bomgar processes. Look for unusual destinations or traffic patterns that suggest malicious data exfiltration or command-and-control (C2) communications.
  - **Correlate with Authentication Events**: Evaluate any related authentication events, especially logins or privilege escalations, that coincide with the timing of Bomgar process executions. This can help identify whether the tool was used in a legitimate context or as part of an unauthorized access attempt.

  ### Prioritization
  This alert is classified as medium severity, as the use of remote management tools in enterprise environments carries both legitimate administrative functions and significant risks if exploited by attackers. The likelihood of encountering such abuse is moderate, particularly in organizations that employ remote support solutions.

  ### Blind Spots and Assumptions
  One blind spot in this detection logic is the potential for legitimate use of Bomgar by IT support teams, which may generate false positives and complicate investigations. The detection logic assumes that all instances of the identified process executions are suspicious, which may not account for authorized administrative use in controlled environments. Additionally, the effectiveness of this detection relies on the proper configuration and availability of process creation logs in the monitored systems. If logging is not enabled correctly, the detection may fail to capture relevant indicators of compromise (IoCs).

