note: |
  ### Technical Context

  This rule detects processes initiated by the BeyondTrust (Bomgar) Remote Management Tool, specifically those related to remote access and control, which can be exploited by an attacker to gain unauthorized access to a system. The likely attacker objective is to establish persistence and conduct further reconnaissance or lateral movement within the network. This detection is associated with the MITRE ATT&CK tactic "Command and Control" (TA0011) and the technique "Application Layer Protocol" (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide detailed information about process launches. If malicious, this activity could allow an attacker to manipulate systems invisibly or extract sensitive data. However, this detection does NOT confirm that malicious activity is occurring on its own, as legitimate use of the Bomgar tool may also trigger the alert.

  ### Investigation Steps

  - **Review process creation logs**: Analyze Security Event ID 4688 for process creation events involving BeyondTrust executables (e.g., 'bomgar-scc.exe', 'bomgar-pac.exe') during off-hours or unusual times as legitimate use typically aligns with known support hours.

  - **Validate parent-child relationship**: Check that the processes detected are children of the ParentImage 'bomgar-scc-*' or similar executables. Legitimate instances should have identifiable parent processes related to authorized IT support or admin activities.

  - **Check command-line arguments**: Examine the command-line arguments used during the process creation. Malicious instances may include suspicious flags or parameters not normally associated with standard remote support operations.

  - **Identify anomalous execution paths**: Analyze the execution paths shown in Sysmon Event ID 1 for any deviations from standard directories (e.g., C:\Program Files\BeyondTrust\), as legitimate activity typically resides within expected folders.

  - **Cross-reference user accounts**: Inspect the user accounts triggering these processes. Unauthorized or unknown accounts or process instances initiated by non-privileged accounts may indicate a security issue.

  - **Evaluate network activity**: Look for outbound connections initiated by these processes in the firewall logs or EDR solutions. Malicious behavior commonly involves unexpected external communications or connections to known bad IP addresses.

  ### Prioritization

  The severity of this alert is medium, as BeyondTrust is a legitimate remote support tool. However, its misuse can lead to significant security risks if an adversary exploits it to control or exfiltrate data from critical systems. Due to its potential for abuse, particularly in environments where sensitive data is accessed, the likelihood of malicious activity warrants attention.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate Bomgar software, leading to false positives. Evasion techniques could include renaming or modifying exe files. Ensure that logging is configured to capture full process command-line arguments for reliable detection. Legitimate administrative processes, routine support tasks, or authorized remote access sessions may trigger alerts. A companion detection, such as monitoring for anomalous user logins or unexpected remote connections, can provide additional coverage and context for the alert.

