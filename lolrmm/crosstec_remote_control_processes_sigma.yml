note: |
  ### Technical Context

  This rule detects process activity associated with the CrossTec Remote Control RMM tool, specifically targeting parent and child processes that include executables like PCIVIDEO.EXE and supporttool.exe. The likely attacker objective is to gain unauthorized access to remote systems, allowing them to perform actions such as data exfiltration, system control, or surveillance. This behavior is categorized under the MITRE ATT&CK technique for remote control tools (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing details about process execution and parent-child relationships. If malicious, the impact can be significant, potentially leading to data breaches or unauthorized control of sensitive systems. It is important to note that this detection alone does not confirm malicious intent, as the CrossTec tool may be legitimately used within the environment.

  ### Investigation Steps

  - **Verify process relationships:** Investigate the parent process of detected instances (PCIVIDEO.EXE or supporttool.exe) via Security Event ID 4688 logs. Ensure that the parent process aligns with expected legitimate activity; benign parent processes should typically be benign maintenance tools or scheduled tasks.

  - **Review command-line parameters:** Analyze parameters passed to the detected processes in Sysmon Event ID 1. Malicious commands often include unusual flags or connections to unrecognized addresses, while legitimate uses may include standard administrative parameters.

  - **Check execution times:** Look for the timestamps of execution within the detected logs. Processes initiated outside of normal business hours (e.g., after hours or during weekends) within critical environments may signal suspicious activity.

  - **Assess system role relevance:** Determine the affected host's role (e.g., domain controller, application server). Critical assets experiencing this activity warrant higher investigation priority due to their sensitivity.

  - **Correlate with network activity:** Check for outbound connections initiated by the detected process using firewall logs or Azure/Windows Defender ATP network telemetry. Unusual or unauthorized external IP addresses should be flagged for further investigation.

  ### Prioritization

  The alert is of medium severity due to the potential sensitivity of systems involved and the likelihood of malicious use of remote control tools, which are commonly weaponized by attackers. While not all instances indicate compromise, they necessitate further scrutiny to prevent potential unauthorized access.

  ### Blind Spots and Assumptions

  The detection may be limited by potential evasion techniques such as process renaming or hiding using rootkits. Ensure that logging of Windows process creation is enabled for reliable detection; without logs, the efficacy drops significantly. Legitimate use of the CrossTec Remote Control tool by IT support could trigger this alert, necessitating context evaluation. A related detection for monitoring unusual parent process execution (e.g., other RMM tools or similar software) can strengthen coverage against misuse.

