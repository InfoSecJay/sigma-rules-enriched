note: |
  ### Technical Context

  This rule detects the process creation of CrossTec Remote Control RMM tool components, specifically `PCIVIDEO.EXE` and `supporttool.exe`, which can be used for remote access to systems. The likely attacker objective is to establish a command and control (C2) channel, allowing unauthorized access or manipulation of the affected system, aligning with the MITRE ATT&CK tactic of Command and Control (T1071) and technique of Application Layer Protocol (T1219).

  The primary telemetry sources are Windows process creation logs, specifically Event ID 4688 or Sysmon Event ID 1, which capture process execution details. If malicious, this activity could enable an adversary to control and exploit the system effectively. However, detecting these processes does NOT confirm malicious intent on its own, as CrossTec may be used legitimately in managed IT environments.

  ### Investigation Steps

  - **Review the process creation logs:** Check for Event ID 4688 or Sysmon Event ID 1. Look for instances of `PCIVIDEO.EXE` or `supporttool.exe` being executed. Document the parent process and its legitimate use context.

  - **Analyze the parent process:** Identify the parent process field `ParentImage` to see if the execution originated from a legitimate application or service. Legitimate uses often stem from known support tools or administrative management consoles.

  - **Document execution context:** Assess the command-line arguments provided. Malicious instances may include unusual flags or parameters that aren't typical for legitimate operational use.

  - **Investigate user account activity:** Examine the `Security` logs for the user accounts that executed these processes. Evaluate whether they are service accounts or user accounts engaged in authorized IT support activities.

  - **Corroborate with asset inventory:** Confirm the system's role and criticality by matching asset tags. High-risk systems (e.g., servers, RDP endpoints) executing these processes warrant immediate attention.

  - **Identify known malicious indicators:** Look for instances where these processes connect to external IPs or exhibit unusual network activity like excessive outbound connections, which may indicate a successful exploitation attempt or ongoing C2 communication.

  ### Prioritization

  This alert has a medium severity due to the potential impact of unauthorized remote access on enterprise assets. The likelihood of malicious abuse from this tool is moderate, as RMM tools are frequently exploited in targeted attacks. While legitimate use exists, the misuse of administrative tools makes this behavior a focal point in enterprise security monitoring.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of the CrossTec tool, which can generate false positives. Ensure logging for process creation is enabled across all endpoints to maintain visibility. Additionally, the presence of similar remote access tools in the environment could trigger these alerts. A related detection rule for verifying unexpected outbound network connections from these processes could enhance coverage and provide more context in investigations.

