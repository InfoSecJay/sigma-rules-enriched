note: |
  ### Technical Context

  This rule detects potentially malicious registry activity associated with the TrustConnect Remote Monitoring and Management (RMM) tool. Adversaries may use this tool for remote administration, establishing a foothold in a target network to control systems or manage installed software covertly. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), and the technique is Application Layer Protocol (T1219).

  Primary telemetry includes Windows Registry Event logs, especially regarding specified keys linked to TrustConnect. If malicious, this behavior compromises system integrity and may allow unauthorized remote access to sensitive information. Importantly, this detection does NOT confirm active exploitation or successful compromise on its own; it merely indicates unauthorized or unexpected interactions with the specified registry entries.

  ### Investigation Steps

  - **Check for legitimate TrustConnect usage:** Review the organization's approved software list; if TrustConnect is authorized, further escalation may be needed. Determine the asset role, as authorized systems may routinely use the tool.

  - **Validate registry changes:** Examine Windows Registry Event IDs 1001 and 1002. Look for modifications to 'HKLM\SYSTEM\CurrentControlSet\Services\TrustConnect Agent', which would indicate the installation or modification of the service.

  - **Assess process creation logs:** Look for associated process creation (Event ID 4688, Sysmon Event ID 1) where 'TrustConnectAgent.exe' appears. Identify the parent process to ascertain the execution context for any suspicious activity.

  - **Investigate user behavior:** Review related user access logs (Event ID 4624) for accounts interacting with TrustConnect; correlate login times and geographical locations with known operational hours to identify anomalies.

  - **Identify high-confidence malicious indicators:** Monitor for unusual patterns with the 'TrustConnectAgent_*' registry keys, such as rapid modifications or attempts to alter delete permissions, which can indicate exploitation.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems managed by TrustConnect. While its use may be legitimate in specific environments, the tool has a history of being misused by attackers for remote control and persistence. Such behavior is increasingly weaponized, warranting timely investigation.

  ### Blind Spots and Assumptions

  Detection of this activity could be evaded by legitimate installations of TrustConnect, leading to false positives. Reliable detection requires comprehensive logging of registry events, which may not always be enabled in all environments. Additionally, expected legitimate software updates or configuration changes may trigger the alert. A related detection to consider involves monitoring outbound connections to known Command and Control (C2) servers, providing a broader context of network behavior associated with possible TrustConnect misuse.

