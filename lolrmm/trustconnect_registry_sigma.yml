note: |
  ### Technical Context

  This Sigma rule detects registry activity associated with the TrustConnect Remote Monitoring and Management (RMM) tool. The primary behavior being monitored involves modifications to specific registry keys that may be indicative of the tool being used in a potentially unauthorized or malicious context, such as establishing persistence or performing unauthorized administrative functions. The likely attacker objective could be to gain and maintain access to systems for the purpose of remote management, often leading to data theft or exploitation.

  This activity fits within the MITRE ATT&CK framework under the tactic of Execution (ID: TA0002) and specifically targets the technique of Windows Command Shell (ID: T1219). Primary telemetry sources include Windows Registry Event logs that capture changes to key values associated with the TrustConnect Agent. If malicious, the security impact could include unauthorized access to sensitive systems or data, potentially compromising system integrity. It is important to note that this detection does not confirm malicious intent on its own, as legitimate use of the TrustConnect tool may also trigger these alerts.

  ### Investigation Steps

  - **Identify registry modifications**: Review Windows Registry Event logs (Event ID 4657) for changes to keys relevant to TrustConnect. Focus on modifications to `HKLM\SYSTEM\CurrentControlSet\Services\TrustConnect Agent`, `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TrustConnect Agent`, and `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\TrustConnectAgent_*`.

  - **Determine user context**: Check the user and process account initiating the registry changes; use Security Event ID 4624 to identify user logins. Look for unexpected accounts performing these actions, as typical use would involve administrative accounts with a known business justification.

  - **Validate expected behaviors**: Compare the detected registry activity against known legitimate usage patterns, which may include authorized IT personnel accessing the tool during scheduled maintenance. Note if these actions occur outside of normal business hours, which may indicate abuse.

  - **Cross-reference legacy installations**: Check the installation logs or audit logs for the TrustConnect tool. This can be found in Application logs (e.g., Event ID 11707); confirm there is an appropriate business case for its installation and use.

  - **Search for additional indicators**: Use Sysmon logs (Event ID 1) to identify if `TrustConnectAgent.exe` was executed and identify parent processes that may indicate how it was launched. Look for signs of unusual execution paths or command-line arguments.

  ### Prioritization

  The alert should be treated with medium severity due to the risk posed by the TrustConnect RMM tool, particularly if detected on critical systems. The likelihood of malicious abuse is moderate, especially if the tool is unauthorized in the environment. This behavior is increasingly weaponized by adversaries for network exploitation, warranting close attention from SOC analysts.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where TrustConnect is legitimately used, leading to false positives. Ensure Windows Registry logging is enabled, as absence could hinder reliable detection. Legitimate administrative activities, such as routine maintenance and support by IT staff, might trigger the alert. A related detection for remote access software usage (e.g., TeamViewer or AnyDesk detection) would provide stronger coverage against unauthorized remote management tools.

