note: |
  ### Technical Context
  This rule detects potential network activity related to the DeskShare Remote Monitoring and Management (RMM) tool. DeskShare RMM is commonly used by IT support teams but can also be exploited by attackers for unauthorized remote access and management of systems within the enterprise. If an attacker is leveraging DeskShare RMM, their objectives may include exfiltrating sensitive information, manipulating system operations, and moving laterally across the network.

  Relevant MITRE ATT&CK tactics and techniques associated with this behavior include:
  - **Execution (TA0002)**: Using the DeskShare tool for unauthorized access can represent an execution tactic.
  - **Remote Services (T1219)**: The network connections noted in the detection relate to remote service exploitation, enabling attackers to control devices remotely.

  Primary data sources that will contain evidence for this detection include network connection logs, particularly those from Windows systems, which can identify unusual connections to known RMM hostnames or user-managed endpoints.

  ### Investigation Steps
  - **Review Network Connection Logs**: Examine the network connection logs for any entries with DestinationHostnames ending in 'user_managed' to identify potential DeskShare RMM tool usage.
  - **Analyze Source IP Addresses**: Investigate the source IPs engaging in the observed connections to determine if they belong to known legitimate users or systems.
  - **Cross-reference with Endpoint Logs**: Check endpoint logs for associated process creation events around the times of detected network activity to see if DeskShare RMM processes were initiated.
  - **Check User Behavior**: Look for unusual user activities that correlate with the RMM tool connections, such as atypical logins, especially from remote locations.

  ### Prioritization
  The alert is deemed medium severity due to the potential for misuse by attackers for malicious activities, coupled with the legitimate use of DeskShare within enterprise environments, which could lead to false positives.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for other RMM tools not captured by the specified hostname pattern or if the connections occur over unmonitored ports or protocols. Additionally, this detection logic assumes that network connections are accurately logged and that any legitimate use of DeskShare does not match the observed patterns. Required logging configurations must ensure that network connection data is preserved and that destination hostnames can be resolved accurately.

