  ### Technical Context

  This rule detects network activity associated with the DeskShare Remote Management and Monitoring (RMM) tool, specifically when connections are made to destinations that end with "user_managed." The primary objective of an attacker leveraging DeskShare RMM would be to gain unauthorized access to target machines, enabling them to perform reconnaissance, exfiltrate data, or deploy additional malware. This behavior fits within the MITRE ATT&CK framework under the tactic of Execution and the technique of Remote Services (T1219).

  The primary telemetry sources for this detection are Windows network connection logs, including details such as DestinationHostname and its attributes. If this activity is malicious, it can lead to significant data breaches, unauthorized access to sensitive systems, or persistent footholds within the network. It's essential to note that the detection of this activity does NOT confirm malicious intent on its own, as DeskShare might be used legitimately by authorized personnel.

  ---

  ### Investigation Steps

  - **Check network connections for user-managed hosts:** Review Windows Event ID 5156 (Windows Filtering Platform Connection) to identify any outgoing connections to hosts with names ending in "user_managed." Determine if the context supports legitimate DeskShare usage.

  - **Validate expected DeskShare usage:** Confirm if authorized personnel or systems are utilizing DeskShare for legitimate remote access. Refer to internal documentation or account management systems to verify users and devices associated with the tool.

  - **Examine associated process execution:** Inspect Security Event ID 4688 for process creation logs associated with DeskShare. Review parent process IDs for any suspicious pattern indicating lateral movement, such as unexpected execution from scripts or scheduled tasks.

  - **Identify recent changes to network configurations:** Investigate Event ID 6100 in Windows Security logs for any recent firewall rule changes that may have facilitated unauthorized DeskShare connections.

  - **Look for repeated or unusual connections:** Analyze the frequency of connections to "user_managed" hosts in the system. A high volume of such traffic may indicate potential abuse, in contrast to typical usage patterns which should follow predictable timing regarding authorized employees.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential risk associated with RMM tools which can be weaponized for unauthorized access. The impact on critical systems can be significant, particularly if the tool is misused by an adversary for lateral movement or data exfiltration. While legitimate activity exists, the tools are less commonly used, increasing the need to confirm valid usage.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by improper logging configuration or if DeskShare is used in a non-standard manner, causing missed connections. There is a possibility that legitimate DeskShare activity, such as routine administrative tasks, could trigger this detection. A companion detection such as monitoring for unusual or unexpected login patterns (e.g., Event ID 4624) can enhance visibility into potentially malicious behavior associated with RMM tools like DeskShare.

