note: |
  ### Technical Context

  This Sigma rule detects registry changes specifically targeting the FleetDeck.io Remote Management and Monitoring (RMM) tool service. Typically, an attacker may utilize such tools for remote access to compromised systems, potentially to perform lateral movement or establish persistence. This behavior fits into the MITRE ATT&CK framework under the tactic of "Execution" and specifically the technique T1219 (Remote Access Software).

  The primary telemetry source for this detection is Windows registry event logs, monitoring changes in the registry path `HKLM\SYSTEM\CurrentControlSet\Services\FleetDeck Agent Service`. If this behavior is deemed malicious, it represents a significant security risk as attackers could control systems remotely, deploy malware, or steal sensitive data. Importantly, this detection does NOT confirm malicious intent on its own; legitimate use of FleetDeck.io could trigger the same alert.

  ### Investigation Steps

  - **Verify registry changes**: Check Windows Security Event ID Registry and filter for changes involving `HKLM\SYSTEM\CurrentControlSet\Services\FleetDeck Agent Service`. Look for timestamps and user accounts associated with these modifications.

  - **Contextualize the behavior**: Confirm if FleetDeck.io is an authorized RMM tool within your organization by checking asset inventories or ongoing management strategies. Legitimate changes might include updates or routine maintenance logged by IT personnel.

  - **Investigate user behavior**: Review the activity of user accounts making the registry changes. Analyze logins and command-line behavior around the same timestamps using Security Event ID 4624 (Logon) and Sysmon Event ID 4688 (Process Creation) for anomalies.

  - **Identify high-risk indicators**: Look for unexpected process creation associated with the FleetDeck service using Sysmon Event ID 1. Specifically, check if suspicious executables are running under the context of the FleetDeck Agent.

  - **Examine network communications**: Review outbound network traffic related to the FleetDeck service using firewall logs or network monitoring tools. Focus on unusual destinations or high-volume connections that may indicate command and control communications.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of the affected systems if exploited by an attacker. Given the nature of RMM tools, there is a moderate likelihood of abuse, especially in environments where such tools are not rigorously controlled. Additionally, tactics used by threat actors often involve weaponizing remote access tools for lateral movement and data exfiltration.

  ### Blind Spots and Assumptions

  The detection may miss cases where the attacker employs evasion techniques, such as renaming the service or hiding it among legitimate applications. Reliable detection relies on the availability of appropriate Windows registry logging configurations. Legitimate administrative use may inadvertently trigger this alert. A companion detection that could strengthen coverage includes monitoring for unusual process creation or scheduled tasks that spawn behavior consistent with known RMM tools like FleetDeck.io.

