note: |
  ### Technical Context

  This rule detects potential registry modifications associated with the FleetDeck.io Remote Monitoring and Management (RMM) tool, targeting the specific service entry for the FleetDeck Agent Service. The likely attacker objective is the establishment of persistence or control over system resources via unauthorized registry changes using this tool. Relevant MITRE ATT&CK techniques include Command and Control (T1071) and Registry Run Keys / Startup Folder (T1219).

  The primary telemetry sources are Windows Registry Event logs that capture modifications to registry keys, specifically looking for entries in `HKLM\SYSTEM\CurrentControlSet\Services`. If malicious, the modification may allow an adversary to control devices remotely, potentially leading to broader network compromise. This detection does not confirm whether the modification is legitimate or malicious without further contextual investigation.

  ### Investigation Steps

  - **Check recent registry modifications:** Review Security Event ID 4657 or Registry Event logs for changes to `HKLM\SYSTEM\CurrentControlSet\Services\FleetDeck Agent Service`. Validate timestamp and user context around changes to determine legitimacy.

  - **Identify legitimate FleetDeck usage:** Verify if the organization uses FleetDeck.io, checking internal asset inventories or consulting with the IT department. If the alert is benign, relevant logs may include normal service status updates or legitimate installation logs.

  - **Correlate with process activity:** Utilize Sysmon Event ID 1 for process creation events that correspond to `FleetDeck Agent Service`. Look for unusual parent processes that could indicate malicious execution or exploitation.

  - **Monitor network communications:** Check for outbound connections to known FleetDeck.io IP addresses or domains as recorded in firewall or proxy logs. Indicators may include HTTP requests to unusual ports or untrusted networks.

  - **Analyze user actions:** Investigate user accounts that made the modifications. Look for signs of credential misuse, such as concurrent logons or unusual activity (e.g., Event ID 4624) that deviate from established user behavior patterns.

  ### Prioritization

  Given the potential security impact of running an RMM tool in an unauthorized manner, this alert is classified as medium priority. The threat posed by malicious use of the FleetDeck.io tool is significant, as it may allow an adversary to maintain control over systems. The behavior detected has been associated with common command-and-control operations.

  ### Blind Spots and Assumptions

  Possible evasion techniques include legitimate use of FleetDeck.io in environments where it is permitted, leading to false positives. Effective detection requires that Windows Registry logs are enabled and properly configured. Additionally, benign administrative activities, such as IT technicians performing routine maintenance, may inadvertently trigger this alert. A related detection could involve monitoring anomalous behavior from processes with known FleetDeck activity, strengthening detection capabilities against potential misuse.

