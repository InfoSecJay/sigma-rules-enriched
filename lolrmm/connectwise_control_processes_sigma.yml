note: |
  ### Technical Context

  This Sigma rule detects process creation activity related to ConnectWise Control, a Remote Monitoring and Management (RMM) tool. The likely attacker objective involves using this tool to establish remote access into a victim's system to facilitate lateral movement or data exfiltration. Relevant MITRE ATT&CK framework tactics include "Execution" (TA0002) and the technique "Remote System Access" (T1219). The primary telemetry sources for this detection include Windows process creation logs, specifically Windows Event ID 4688.

  If malicious, this activity could enable extensive control over compromised systems, allowing adversaries to bypass traditional security measures. This detection does NOT confirm that the activity is inherently malicious, as it may also indicate legitimate administrative use of ConnectWise Control.

  ### Investigation Steps

  - **Check for process creation events:** Review Windows Security Event ID 4688 logs for parent processes related to `connectwisechat-customer.exe`, `connectwisecontrol.client.exe`, or `screenconnect.windowsclient.exe`. Focus on timestamps correlating with the alert.

  - **Identify legitimate usage:** Verify if the triggering systems are authorized to use ConnectWise Control by checking asset inventories or change management records. Legitimate connections should align with known maintenance windows.

  - **Analyze surrounding process trees:** Investigate the parent processes of suspicious instances in Sysmon Event ID 1 logs to identify any unusual processes spawned immediately before or after the ConnectWise Control activity.

  - **Validate account usage:** Examine the account associated with the process creation by checking Event ID 4624 (logon) and 4625 (failed logon) for unusual login patterns or times, especially if accounts are non-administrative.

  - **Monitor for data exfiltration:** Review network traffic logs for connections initiated by the identified processes that may indicate data exfiltration. Look into DNS queries, outbound connections, or any unusual spikes in traffic volume.

  ### Prioritization

  This alert has medium severity due to the potential for severe impact on critical systems if misused. While ConnectWise Control is a legitimate tool, its nature makes it a target for exploitation. The likelihood of malicious abuse increases if it is detected on systems where it is not expected or lacks approval for use.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of evasion techniques that mask the use of remote management tools, such as renaming executables. Reliable detection requires complete logging of process creation events and regular monitoring of authorized software. Legitimate activities may trigger this alert, particularly in environments where administrative tasks frequently use RMM tools. A companion detection to consider is monitoring for unusual outbound network connections to identify unauthorized access attempts or data exfiltration.

