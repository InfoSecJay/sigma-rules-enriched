note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the ConnectWise Control Remote Monitoring and Management (RMM) tool, specifically the executables `connectwisechat-customer.exe`, `connectwisecontrol.client.exe`, and `screenconnect.windowsclient.exe`. These tools can be exploited by attackers aiming to establish remote access to compromised systems for data exfiltration or further lateral movement.

  The relevant MITRE ATT&CK tactics include **Command and Control** (TA0011) and the technique **Application Layer Protocol** (T1219). The primary telemetry sources are Windows process creation events, specifically Event ID 4688 in Security logs and Sysmon Event ID 1 for enhanced visibility. If malicious, the use of ConnectWise Control could enable an adversary to fully interact with the target system, posing significant security risks. However, this detection alone does not confirm that the activity is malicious since the identified processes may also be used legitimately in managed environments.

  ### Investigation Steps

  - **Check process execution context:** Verify the `ParentImage` for the detected processes (Event ID 4688 or Sysmon ID 1) to ascertain if they were spawned by a legitimate parent process (e.g., a remote desktop software). Legitimate usage typically involves processes initiated from IT support tools rather than suspicious or unauthorized applications.

  - **Review execution source:** Validate the file path of the detected executable. For legitimate operations, the path should ideally be a trusted directory, such as `C:\Program Files\ConnectWise\`. Any discrepancies (e.g., unusual paths or altered filenames) should raise red flags.

  - **Assess user account activity:** Correlate the user account executing the detected processes with previous logs. High-risk indicators include usage by non-administrative, unfamiliar, or service accounts at abnormal hours, suggesting unauthorized access.

  - **Monitor network connections:** Examine network logs for outbound connections initiated by the detected processes. Look for unusual destinations or protocols, especially connections to non-standard IPs or domains that do not belong to known support services.

  - **Identify elevated permissions:** Check for associated log entries that indicate the processes were executed with elevated privileges (Event ID 4672). This might indicate malicious intent if executed outside expected operational norms.

  - **Cross-reference with threat intelligence:** Leverage threat intelligence feeds to determine if any of the observed processes have been flagged recently for malicious activity or association with known campaigns.

  ### Prioritization

  This alert has a medium severity rating due to the potential impact of unauthorized remote access on sensitive systems and data. Given that tools like ConnectWise Control are commonly weaponized for remote exploitation, the likelihood of malicious abuse in environments where they are not routinely used remains notable.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may rename or modify ConnectWise Control binaries to avoid detection. Reliable detection requires correct logging of process creation events and ensuring both Security and Sysmon logs are enabled. Legitimate employees may trigger this alert during routine use for tech support purposes. Related detections, such as monitoring for unusual outbound connections (e.g., through firewalls or proxies), would enhance coverage and context around this behavior.

