note: |
  ### Technical Context

  This Sigma rule detects network connections to known domains associated with the RemotePC remote management tool, which facilitates remote desktop access. The likely attacker objective is to leverage this RMM tool for unauthorized access to systems, enabling them to execute commands, extract data, or maintain persistence. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and the technique Remote Desktop Protocol (T1219).

  The primary telemetry sources include Windows network connection logs that capture connection attempts to specific destination hostnames. If malicious, the security impact can be significant, as unauthorized remote access could lead to data breaches or system compromises. This detection does NOT confirm malicious activity on its own; legitimate use of RemotePC within the organization may also trigger this alert.

  ### Investigation Steps

  - **Check network connection logs**: Review Windows event logs for Network Connection events (Event ID 5156) related to connections made to *.remotedesktop.com or *.remotepc.com. Evaluate the originating process and user account for legitimacy.

  - **Validate legitimate use**: Investigate if the alert correlates with known business operations or scheduled remote support sessions. Confirm the context of the connection, such as the user, time, and required permissions.

  - **Identify high-confidence malicious indicators**: Look for unusual process creation events (Security Event ID 4688 and Sysmon Event ID 1) for processes like `RemotePC.exe` being executed by non-admin users outside business hours.

  - **Analyze source systems**: Assess the host initiating the connection for any signs of compromise, such as unauthorized software installations or modifications. This includes checking for installed applications and running services.

  - **Investigate endpoint roles**: Determine the criticality of the affected systems. Servers or admin workstations are of higher concern if they show this network activity; prioritize them for deeper analysis or forensic investigation.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact on sensitive systems if exploited by an adversary. While the use of RemotePC is a legitimate scenario, the likelihood of malicious usage exists, particularly in environments where remote access tools are not commonly utilized or monitored closely.

  ### Blind Spots and Assumptions

  The detection may suffer from evasion tactics where attackers use custom or anonymized domains for remote access, which would not match the specified patterns. Reliable detection requires thorough logging of network connections and application usage across endpoints as well as monitoring for potential misuse by legitimate users. A related detection to enhance coverage is monitoring for anomalous RDP session logs (Event ID 4624), as concurrent foreign logins may indicate credential misuse linked to the RemotePC access.

