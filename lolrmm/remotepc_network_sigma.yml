note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the RemotePC remote management tool. Attackers may use RemotePC for unauthorized access to systems, potentially facilitating lateral movement, data exfiltration, or unauthorized actions within the network. This behavior primarily aligns with the MITRE ATT&CK technique "Command and Control" (T1219).

  The primary telemetry sources for this detection include Windows network connection logs, specifically entries related to DNS resolutions and outbound connections. If malicious, it may allow an attacker to maintain persistence and administer compromised systems remotely. It’s important to note that this detection does NOT confirm malicious activity on its own, as legitimate users may also utilize RemotePC.

  ### Investigation Steps

  - **Review network connection logs:** Check for `Event ID 5156` and analyze logs for outbound connections to the following domains: `*.remotedesktop.com` and `*.remotepc.com`. Determine if the traffic is coming from known user machines or unauthorized systems.

  - **Identify user activity around the time of the alert:** Cross-reference the timestamps of the logs with user activity logs (e.g., authentication events `Event ID 4624`) to see if remote desktop tools were actively utilized by legitimate users.

  - **Check for anomalous execution of RemotePC binaries:** Look for the execution of RemotePC related processes (e.g., `RemotePC.exe`) via `Event ID 4688`. Investigate if these processes were executed outside of normal business hours or from atypical systems.

  - **Determine criticality of affected hosts:** Assess the importance of the machines connecting to the RemotePC domains. Is the asset involved critical to business operations, or is it a non-essential device?

  - **Search for DNS query logs:** Analyze DNS logs for queries made to RemotePC-related domains, identifying patterns of use that may indicate unwarranted access.

  ### Prioritization

  The alert is medium severity due to the potential for significant impact on the affected systems, especially if they are critical assets. The likelihood of malicious abuse exists, as attackers commonly exploit remote management tools for unauthorized access. While this tool's usage may appear legitimate, careful investigation is warranted to rule out malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited by lack of complete network visibility, as legitimate users may trigger the alert when using RemotePC. Proper logging for DNS queries and network connections must be enabled for reliable detection. Additionally, legitimate remote support activities may potentially produce similar logs. Companion detection, such as monitoring for abnormal process creation related to remote access tools (e.g., `Event ID 4688` for `TeamViewer.exe` or `AnyDesk.exe`), can enhance coverage of suspicious activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
