note: |
  ### Technical Context

  This rule detects file activity associated with the HeartbeatRM remote monitoring and management (RMM) tool, focusing on executable files and agents that may be deployed to manipulate or control systems. The primary objective of an attacker using HeartbeatRM would be to gain illicit access to systems for data exfiltration, unauthorized monitoring, or further lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique Remote Management Tools (T1219).

  The primary telemetry source for this rule is Windows file event logs, specifically monitoring for changes or accesses to files within the HeartbeatRM installation directories. If this activity is malicious, it could lead to significant risks, including unauthorized access to sensitive information and control over compromised systems. It is important to note that this detection alone does not confirm malicious intent, as HeartbeatRM may be legitimately used by authorized personnel for system management.

  ### Investigation Steps

  - **Check for process execution from HeartbeatRM directories:** Review Security Event ID 4688 or Sysmon Event ID 1 to identify if a process was created from either `C:\Program Files (x86)\HeartbeatRM\` or `C:\Program Files\HeartbeatRM\`. Legitimate use will typically involve administrative or IT user accounts executing specific tasks during scheduled maintenance windows.

  - **Correlate file access timestamps with user activity:** Review Windows Security logs correlating file accesses (event type 4663) with user logon events (event type 4624). Look for unusual patterns such as unexpected file changes outside of maintenance hours or from unknown accounts, which may indicate unauthorized activity.

  - **Identify unusual file modifications or creations:** Search for created (`Created` field) or modified (`Modified` field) events on `*\agent-installer-any.exe` in file event logs. Malicious activity may show high-frequency modifications or installations without corresponding user-initiated actions.

  - **Monitor for network connections from HeartbeatRM-related processes:** Use Windows Filtering Platform logs or Sysmon Event ID 3 to track network connections generated by HeartbeatRM-related processes. Look for connections to known malicious IP addresses or unusual geographic locations that could indicate Command and Control communications.

  - **Assess the system's role in the environment:** Determine the criticality of the affected system. If it is a server hosting sensitive applications or data, escalate your investigation due to the higher potential impact of a compromise.

  ### Prioritization

  The alert severity is medium due to the potential impact of affected systems being leveraged for unauthorized monitoring or control. While HeartbeatRM can be legitimately used, the likelihood of malicious abuse exists due to its capability for lateral movement, making it a tool that can be weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative use of HeartbeatRM, which could generate false positives. Reliable detection requires comprehensive logging configurations across Windows systems to capture detailed file activity and process execution. Legitimate maintenance tasks may trigger this alert during normal operation. Companion detections such as monitoring Windows Event IDs for logons (4624) or process creation (4688) can strengthen your visibility on suspicious activity related to remote management tools.

