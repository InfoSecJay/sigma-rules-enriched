note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the HeartbeatRM remote management tool, specifically focusing on its installation or execution artifacts. The likely attacker objective could be establishing persistence or performing reconnaissance through the use of this RMM tool. This behavior aligns with the MITRE ATT&CK technique for Remote Management Software (T1219), under the execution tactic.

  Primary telemetry sources include Windows file event logs indicating file creations or modifications within specific directories associated with HeartbeatRM installations. If the behavior is malicious, it may lead to unauthorized management access or data exfiltration. However, it is crucial to note that this detection does NOT confirm malicious intent by itself, as legitimate use of HeartbeatRM may trigger similar alerts.

  ### Investigation Steps

  - **Check file creation timestamps in the specified directories:** Review Windows Event ID 4663 (Access Attempt) and File event logs for file creation or modification times in `C:\Program Files (x86)\HeartbeatRM\` or `C:\Program Files\HeartbeatRM\`. Legitimate installations will typically occur during scheduled maintenance windows.

  - **Verify parent process execution:** Examine Sysmon Event ID 1 for parent processes that initiated any file activity in the HeartbeatRM directories. Look for known benign processes (e.g., `msiexec.exe` for installers) or unexpected parent processes indicative of potential credential misuse.

  - **Review specific filenames and versions:** Identify any file names and versions of `agent-installer-any.exe` that are created or modified. Use Event ID 4663 logs to correlate versions with known malicious indicators; legitimate activities may have version strings that match those documented by the vendor.

  - **Check for network traffic to known malicious IPs:** Analyze network logs (firewall logs, proxy logs) for outbound connections initiated after HeartbeatRM files were accessed. Look for high-confidence indicators such as connections to IPs associated with malware or untrusted RMM tool services.

  - **Assess user account activity around the event time:** Review Security Event ID 4624 (Logon) to determine what user accounts were active during the file activity. High-privilege accounts executing these files in unusual contexts could indicate malicious use.

  ### Prioritization

  This alert warrants medium severity due to the potential impact on any affected system capable of remote management. Given the growing prevalence of RMM tools in attacks, the likelihood of malicious abuse is plausible, especially in environments that do not have robust monitoring for such tools.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of HeartbeatRM in the environment, which could mask malicious activities if not monitored closely. Required log sources include up-to-date file event logs and adequate configurations to capture Sysmon events effectively. Common legitimate activities that may trigger the alert include standard administrative operations for software deployment and maintenance. Consider related detections for newly recognized Remote Access Tools (RATs) to enhance contextual visibility into potential misuse.

