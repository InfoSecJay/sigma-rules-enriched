note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the Encapto Remote Management and Monitoring (RMM) tool, which is typically used for remote access and management of systems. The likely objective of an attacker utilizing this tool would be to establish a foothold within a compromised environment, manage compromised systems, or exfiltrate data. The relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071) and Remote Services (T1219).

  The primary telemetry sources are Windows network connection logs, specifically tracking connections to the hostnames related to Encapto. If malicious, the activity could indicate unauthorized access, control over endpoints, or data exfiltration. This detection does NOT, on its own, confirm malicious intent, as the Encapto tool may also be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Identify network connections to Encapto domains:** Check for connections in Windows Security Event ID 5156 (Windows Filtering Platform) or the equivalent logs indicating outbound traffic to `*.encapto.com`. Look for unusual source IP addresses or an increased volume of connections.

  - **Review process initiation:** Correlate Event ID 4688 (Process Creation) with the outbound connection events to identify if known remote management tools were initiated. Expect legitimate processes like `powershell.exe` or `mstsc.exe` for administrative tasks, versus processes that are atypical or are spawned shortly before an outbound connection.

  - **Examine user accounts:** Investigate the account initiating the connection. Check for any user accounts that were recently disabled or have excessive privileges for remote management. Look at Event ID 4720 (User Account Created) for newly created accounts that may correlate timings with Encapto activity.

  - **Cross-reference with known threats:** Utilize threat intelligence sources to cross-reference the identified IPs or file hashes against known malicious indicators. If the destination IPs are flagged in threat intelligence feeds, consider it a high-confidence malicious indicator.

  - **Monitor for anomalous behavior:** Document any significant variations in behavior of connected devices, such as unexpected system modifications or changes in application profiling occurring within a short time frame after the detection.

  ### Prioritization

  The alert severity is medium due to the potential impact of the affected systems, particularly if they are critical infrastructure or contain sensitive data. The likelihood of malicious abuse is moderate, as the Encapto tool is commonly associated with both legitimate and illegitimate remote management activities, which can lead to confusion in assessment.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate users utilizing Encapto for authorized activities, thus generating false positives. Reliable detection requires proper logging of all outbound connections and may need configurations that ensure complete visibility of network traffic. Additionally, other remote management tools that use similar network patterns could trigger this alert, which indicates a need for companion detections focused on those tools to enhance overall coverage.

