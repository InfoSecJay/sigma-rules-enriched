note: |
  ### Technical Context

  This Sigma rule detects network connections initiated to Encapto RMM's domain (`encapto.com`), which is associated with remote management tools. The likely adversary objective is to use legitimate remote management functionality for malicious purposes, such as unauthorized access or control over compromised systems. This behavior falls under the MITRE ATT&CK tactic of "Command and Control" (TA0011), specifically leveraging the technique of "Application Layer Protocol" (T1219). The primary telemetry sources include Windows network connection logs, particularly those that capture outbound request details.

  If this behavior is malicious, it could lead to significant security risks, including data breaches or exploitation of the environment for further attacks. It is essential to note that this detection does NOT confirm malicious intent on its own; legitimate remote management activities may trigger this rule.

  ### Investigation Steps

  - **Review outbound connections:** Examine network connections logged as `DestinationHostname` containing `encapto.com` in Windows network logs (Event ID 5156) for the user and system involved to identify context. Verify if this connection aligns with known legitimate uses.

  - **Identify process initiation details:** Check for related process creation events (Sysmon Event ID 1) that correspond to the time of the detected network activity. Correlate any observed processes with their parent process to understand the initiation context.

  - **Validate legitimate usage:** Cross-reference connections to `encapto.com` with asset inventory. Confirm if the affected host is configured to use Encapto for legitimate remote management. If so, establish the nature of legitimate user access.

  - **Assess impacted system criticality:** Identify the role of the affected system within the network, especially if it's a critical server or system managing sensitive information, to gauge the potential impact of this alert on the enterprise.

  - **Look for high-confidence malicious indicators:** Investigate for signs of anomalous behavior associated with this connection, such as unusual data exfiltration attempts or requests to known malicious IPs, potentially through reviewing DNS query logs (Event ID 4688).

  ### Prioritization

  This alert is categorized as medium priority due to the potential impact on security and the likelihood of malicious abuse, especially within environments where Encapto is not a validated or commonly utilized tool. While the behavior is used in legitimate contexts, it may also signal more sophisticated attempts to establish command-and-control channels.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques such as using alternative domains or tactics to disguise malicious activity. Reliable detection requires comprehensive logging of outbound network traffic and may depend on the collection of additional details surrounding process execution. Legitimate administrative tasks using the Encapto tool can also trigger this alert, complicating straightforward triage. A related detection could include monitoring for network activity associated with other known remote management tools to enhance visibility and coverage against adversarial techniques.

