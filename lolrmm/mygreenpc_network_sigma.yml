  ### Technical Context

  This Sigma rule detects network activity associated with the MyGreenPC Remote Monitoring and Management (RMM) tool. The likely attacker objective is unauthorized remote access or control over targeted systems, potentially allowing data exfiltration or lateral movement. This detection aligns with the MITRE ATT&CK tactic of Execution and the technique T1219 (Remote Access Software).

  The primary telemetry sources for this detection are Windows network connection logs that capture DNS requests and outgoing connections. If this activity is malicious, it can compromise network integrity and lead to unauthorized operations on critical systems. However, this detection does NOT confirm that the activity is malicious on its own, as the legitimate use of MyGreenPC can trigger the same alert.

  ---

  ### Investigation Steps

  - **Check connection logs for MyGreenPC traffic:** Examine Windows network connection logs (Event ID 5156) for outbound connections to `*.mygreenpc.com` to confirm instances of the detected activity.

  - **Verify active RMM tools usage:** Consult asset inventory and valid change management records to validate if MyGreenPC is authorized for use on the affected system. Legitimate usage may include monitoring, helpdesk functions, or authorized maintenance routines.

  - **Review DNS query logs:** Inspect DNS logs for requests to `*.mygreenpc.com`, focusing on timestamps and associated user accounts to establish context for the remote connections.

  - **Identify high-confidence malicious indicators:** Look for anomalous outbound connections to `*.mygreenpc.com` from unexpected hosts or during unusual times, particularly systems that should not have RMM tools installed.

  - **Analyze process activity related to RMM invocation:** Check for execute events (Event ID 4688) to identify any processes spawned in relation to MyGreenPC during the detected connection periods, which might indicate unauthorized usage.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential impact on critical systems managed remotely by MyGreenPC. The likelihood of malicious abuse exists, particularly if the tool is misused to access sensitive enterprise resources or for unauthorized administration. While some users may rely on such tools, continuous monitoring is warranted, given the risk of exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by benign uses of the MyGreenPC tool, leading to false positives. It assumes all network traffic is adequately logged for detection to be effective. Legitimate activities, such as authorized remote support sessions, can trigger this alert, potentially causing confusion. A related detection to strengthen coverage could involve monitoring for additional RMM tools or remote access utilities globally within the network.

