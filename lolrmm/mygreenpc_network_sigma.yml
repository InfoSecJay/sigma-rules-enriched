note: |
  ### Technical Context

  This rule detects network activity directed towards hosts associated with MyGreenPC, a Remote Monitoring and Management (RMM) tool. An attacker might use this tool to gain remote access, facilitate lateral movement, or manage compromised systems as part of a larger campaign. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **Rogue Remote Management Tools (T1219)**. The primary telemetry sources required for detection include Windows network connection logs that capture destination hostnames and connection activities.

  If such behavior is identified as malicious, the security impact could be significant, potentially leading to unauthorized access, data exfiltration, or further malicious actions on the network. Importantly, this detection does NOT confirm malicious intent on its own, as MyGreenPC may also be used legitimately within the organization for IT management.

  ### Investigation Steps

  - **Check network connection logs for confirmations**: Review Windows Event ID 5156 (Security Filtering) to confirm outbound connections to any domains ending with `mygreenpc.com`. Validate the source IP address and associated user account.

  - **Correlate with known assets**: Identify if the flagged communication aligns with known controlled instances of MyGreenPC in your organization. Verify device roles and assignments to avoid false positives.

  - **Analyze process execution**: Look at Windows Event ID 4688 to track any instances of the MyGreenPC executable being run. Confirm whether the process is invoked under abnormal user contexts or by suspected users.

  - **Inspect DNS resolution**: Check DNS query logs for lookups on `*.mygreenpc.com`. Identify any queries from atypical hosts or users that rarely communicate with external RMM services.

  - **Identify unusual implications**: Look for common post-compromise behaviors associated with RMM use, such as unexpected software downloads or installation activity using Windows Event ID 11707 (MsiInstaller).

  ### Prioritization

  Alerts for MyGreenPC activity should be treated with medium priority. While MyGreenPC tools may be employed legitimately by IT departments, the likelihood of an adversary misusing these tools for unauthorized access is moderate, especially if they have established a foothold within the network. Given that RMM tools are commonly exploited by attackers, swift investigation is vital.

  ### Blind Spots and Assumptions

  Detection may not capture all instances due to the potential for adversaries to obfuscate RMM traffic or use alternative domains. Ensure all relevant logs are enabled, including firewall logs for outbound connections. Legitimate IT operations may generate similar network patterns, necessitating contextual analysis of user behavior. Companion detections, such as identifying abnormal use of legitimate administrative tools (e.g., Event ID 4688 for various administrative utilities), can enhance overall situational awareness.

