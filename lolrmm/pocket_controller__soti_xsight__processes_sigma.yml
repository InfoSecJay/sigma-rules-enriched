  ### Technical Context

  This rule detects the execution of processes associated with the Pocket Controller (Soti Xsight) remote monitoring and management (RMM) tool. Attackers may leverage this tool to maintain persistence, execute scripts, or manage devices remotely with the objective of exfiltrating data or deploying further malware. This detection corresponds to the MITRE ATT&CK technique Execution (T1203).

  The primary telemetry source involves Windows process creation events, specifically focusing on processes launched with certain parent images indicating possible unauthorized use of the RMM tool. The security impact is significant if malicious, as it may indicate unauthorized remote access. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate usage of Soti Xsight may also trigger the alert.

  ---

  ### Investigation Steps

  - **Review Process Creation Events:** Examine Windows Security Event ID 4688 for any instance of `pocketcontroller.exe`, `wysebrowser.exe`, or `XSightService.exe`. Note legitimate usage patterns, such as regular monitoring activities from the IT team.

  - **Check Parent Process Relationships:** Inspect the parent process of the detected processes in Event ID 4688 or Sysmon Event ID 1. Malicious executions will often exhibit unusual parent processes, possibly from non-administrative contexts.

  - **Identify User Accounts Used:** Analyze the `IntegrityLevel` and `SubjectUserName` fields within the process creation logs. Logs showing execution by standard user accounts instead of expected administrative accounts might indicate abuse.

  - **Correlate Network Activity:** Look for network connections (using logs from Windows Firewall or proxy logs) from the processes identified. If detected as `pocketcontroller.exe`, review the destination IPs for known malicious signatures.

  - **Check for Known Bad Hashes:** Confirm if the process hash matches known malicious hashes using a threat intelligence database. This step should identify high-confidence malicious indicators associated with the tool.

  - **Extract Creation or Exfiltration Artifacts:** Review recent file system modifications or network activity around the time of detection. Look for signs of file transfers originating from the monitored systems in the Windows Security Audit logs (Event ID 4663).

  ---

  ### Prioritization

  This alert warrants medium severity due to the potential impact on sensitive systems, particularly if the RMM tool is used without authorization. The likelihood of misuse is plausible, as such tools are often exploited by attackers for persistence and control. Additionally, the behavior described is known to be weaponized in targeted attacks against organizations.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of process name spoofing and the potential for legitimate administrative use of the tool, which may lead to false positives. Reliable detection depends on proper logging and monitoring configurations, specifically ensuring process creation records are enabled. Legitimate administrative workflows might involve periodic use of the Soti Xsight tool for device management. A companion detection rule focusing on suspicious network connections initiated by these processes would enhance coverage.

