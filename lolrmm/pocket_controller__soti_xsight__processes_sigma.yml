note: |
  ### Technical Context

  This Sigma rule detects potential process activity associated with the Pocket Controller (Soti Xsight) remote management tool. The likely attacker objective is to establish remote control over compromised endpoints, potentially leading to data exfiltration or lateral movement within the network. This detection maps to the MITRE ATT&CK technique “Remote Access Software” (T1219). The primary telemetry sources include Windows process creation events captured via Security Event ID 4688 or Sysmon Event ID 1. If malicious, this behavior poses significant security risks as it could enable unauthorized access to sensitive data and administrative capabilities on impacted systems. Importantly, this detection does NOT confirm malicious intent on its own; legitimate use of the Pocket Controller is common in enterprise environments.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event ID 4688 logs for instances where the process paths end with `\pocketcontroller.exe`, `\wysebrowser.exe`, or `\XSightService.exe`. Compare timestamps with log entries for legitimate uses of the application.

  - **Identify parent processes:** Look for instances with parent images of `\pocketcontroller.exe`, `\wysebrowser.exe`, or `\XSightService.exe`. Event ID 4688 will help identify potential misuse, specifically if originating from unexpected processes or locations.

  - **Correlate with user activity:** Cross-reference the process creation events with user activity logs (e.g., Event ID 4624 for successful logons) to ensure that the processes were initiated by authorized users during expected periods.

  - **Check for command and control indicators:** Investigate any network activity originating from the endpoint that may correspond with the detected processes. Look for unusual outbound connections or communications with known malicious IPs.

  - **Verify legitimate use cases:** Confirm whether the detected processes are part of scheduled tasks or maintenance activities typical in your environment, particularly for IT management workflows.

  - **Assess incident impact:** Determine the criticality of the system hosting the detections. If it holds sensitive information or is a key asset for network administration, escalate the alert as it could indicate higher-risk activity.

  ### Prioritization

  This alert is classified as medium severity due to the potential impact on systems where the Pocket Controller is deployed, commonly used for remote management. While it indicates possible malicious activities, not all instances of this tool are harmful, necessitating further investigation to ascertain intent.

  ### Blind Spots and Assumptions

  Detection is limited by the presence of legitimate Pocket Controller usage in the environment which can lead to false positives. The necessary log sources must be reliably configured, including enabling Sysmon or ensuring Security Event logs capture process creation events accurately. Additionally, observations of legitimate use during maintenance windows could trigger the alert, highlighting the need for contextual awareness. Companion detections related to common user and admin behaviors would strengthen investigative coverage and help reduce false positives.

