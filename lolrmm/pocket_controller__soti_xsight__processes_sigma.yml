  ### Technical Context

  This rule detects executions of processes associated with the Pocket Controller (Soti Xsight) remote management tool. Attackers may use this tool to execute unauthorized actions on managed devices, as it can provide remote access to systems, leaving room for potential exploitation. The relevant MITRE ATT&CK tactics are Execution (TA0002) and Remote Services (T1219). The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688 (Process Creation) and Sysmon Event ID 1. If malicious, an unauthorized or rogue use of this tool could lead to privacy breaches, data exfiltration, or persistent access to compromised systems. However, this detection does NOT confirm malicious intent on its own since the tool may be employed legitimately in managed environments.

  ---

  ### Investigation Steps

  - **Verify the process origin:** Review Event ID 4688 logs for `Image` fields indicating paths for `pocketcontroller.exe`, `wysebrowser.exe`, or `XSightService.exe`. Legitimate instances should come from known software deployment paths (e.g., `C:\Program Files\Soti\Pocket Controller`).

  - **Check parent process relationships:** Examine the `ParentImage` field to see if the detected processes are spawned from intended parent processes (e.g., `explorer.exe`, or legitimate management consoles). Unauthorized parent-child relationships may indicate malicious activity.

  - **Identify anomalous execution times:** Look for execution of these processes outside of regular business hours, which could indicate suspected unauthorized access. Any alerts generated at odd hours could warrant further investigation.

  - **Review managed device inventory:** Cross-reference the host executing the detected processes against the system inventory to confirm it is registered for management under Soti Xsight. If the host is unregistered, escalating the alert is necessary.

  - **Correlate with network activity:** Check firewall logs or other network telemetry for suspicious outbound traffic tied to the execution of the processes. Look for exfiltration patterns, such as large data transfers or connections to known malicious IPs.

  - **Assess for multiple process launches:** If multiple instances of these processes launch in rapid succession (as captured in event logs), treat this as a heightened risk scenario indicating possible exploitation attempts or lateral movement within the network.

  ---

  ### Prioritization

  Severity for this alert should be considered medium due to the impact on potentially sensitive systems managed by Pocket Controller, the likelihood of unauthorized access use, and because this tool can be weaponized by adversaries for various attacks. Continuous monitoring is warranted due to its dual-use nature.

  ---

  ### Blind Spots and Assumptions

  The detection rule may miss evasion attempts from malicious actors who modify the process names or use alternative remote management tools. Reliable detection requires appropriate configurations for logging process creation with Windows and Sysmon. Legitimate administrative tasks involving Soti Xsight may also trigger this alert, necessitating careful scrutiny of context. A related detection to consider is tracking external connections to known malicious IP addresses following the execution of these management processes to strengthen the overall security posture.

