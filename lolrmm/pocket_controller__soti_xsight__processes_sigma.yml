  ### Technical Context
  This detection rule focuses on monitoring processes associated with the Pocket Controller (Soti Xsight), a remote management tool that can potentially be misused by attackers for unauthorized access or control over devices within an enterprise environment. The primary objective for an attacker utilizing this tool would be to gain persistent control over endpoints, allowing them to execute commands, deploy malware, or exfiltrate sensitive data without detection.

  The relevant MITRE ATT&CK tactics include **Execution (TA0002)**, specifically **User Execution (T1203)**, which indicates methods whereby malicious actors execute arbitrary code on target systems. This tool's presence could indicate either legitimate administrative activity or malicious intent, particularly if observed outside of expected operational contexts.

  The primary data source for this detection will be **process creation events** on Windows systems, which yield necessary information about processes being executed and their parent processes, enabling identification of potentially malicious use of Pocket Controller.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for any instances of `pocketcontroller.exe`, `wysebrowser.exe`, or `XSightService.exe`. Pay special attention to the parent process for context on how these executables were initiated.
  - **Analyze Command Line Arguments:** Investigate the command line arguments associated with the detected processes to identify unusual or suspicious parameters that may indicate malicious use of the Pocket Controller tool.
  - **Check for Unusual Execution Contexts:** Look for occurrences of these processes being executed outside of normal working hours or from non-administrative accounts, which could suggest abuse of the tool.
  - **Identify Network Connections:** Track any unusual outbound network connections from the processes to see if they facilitate unauthorized data exfiltration or remote access.

  ### Prioritization
  The alert is classified as medium priority due to the potential for misuse of the Pocket Controller tool, which can lead to significant impacts such as data breaches or unauthorized system control. However, legitimate administrative use also exists, necessitating further investigation.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if the tool operates in a stealth mode or is renamed to evade detection. The logic assumes that the presence of the specified processes, particularly with certain parent processes, signifies potential malicious behavior. For effective detection, proper logging configurations must be in place to capture detailed process creation events on endpoint systems. Additionally, environments without Soti Xsight in use might falsely trigger alerts if not adequately tuned.

