note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Komari Remote Management Tool (RMM). Malicious actors may utilize this tool for remote access and control, often to exfiltrate data or manage compromised systems without detection. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1219).

  Primary telemetry sources include Windows event logs related to network connections, specifically focusing on DNS queries and outbound connection logs. The security impact could be significant if Komari RMM is employed maliciously, as it may indicate an attacker establishing persistent access to compromised systems. It is essential to note that this detection does NOT confirm that the executed behavior is malicious without further context and corroborative evidence.

  ### Investigation Steps

  - **Identify outbound connections to suspicious domains:** Review network connection logs (Windows Event ID 5156, Windows Firewall logs) for any connections to the specified domains (e.g., komari-document.pages.dev). Anomalous patterns without prior legitimate connections should raise alerts.

  - **Check for legitimate business use:** Verify the asset in question (e.g., an administrative workstation) for any approved use of Komari RMM, such as an authorized IT team utilizing the tool for remote support. Cross-reference with asset inventories.

  - **Examine process creation events:** Look at Windows Security Event ID 4688 or Sysmon Event ID 1 to identify any processes that were initiated before or after the network connection to Komari domains. Check parameters and parent-child relationships for known RMM processes.

  - **Monitor DNS query logs:** Analyze DNS logs for resolutions to the detected domains, focusing on unusual query volumes from internal assets. This may indicate automated or suspicious behavior rather than typical lookups.

  - **Look for signs of lateral movement:** Review logs for Command and Control behaviors, such as multiple quick connections across different hosts to Komari domains (indicative of lateral movement) using logs from Windows Event ID 5157.

  ### Prioritization

  The severity of alerts generated by this rule is medium, as connections to Komari RMM domains could indicate a compromised system within the enterprise. The likelihood of malicious abuse is moderate due to the common use of RMM tools by attackers for maintaining access. Given that such tools are often weaponized in targeted attacks, quick investigation and response are critical.

  ### Blind Spots and Assumptions

  This detection can be evaded by using alternative means of command and control or by obfuscating RMM tool behaviors. Reliable detection relies on the proper configuration of DNS logging and network connection monitoring. Legitimate activities might occur if the Komari tool is sanctioned for use within the organization, potentially leading to false positives. Related detections include monitoring for abnormal traffic patterns or the execution of known RMM processes to strengthen overall coverage and investigation.

