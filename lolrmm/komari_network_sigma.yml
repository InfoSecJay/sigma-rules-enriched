note: |
  ### Technical Context

  This Sigma rule detects network activity that may involve the Komari Remote Monitoring and Management (RMM) tool, which connects to specific destination hostnames associated with Komari services. The likely attacker objective is to facilitate remote access, management, or exploitation of systems, potentially extracting sensitive information or maintaining persistence within the network. Relevant MITRE ATT&CK tactics include "Execution" and the technique "Remote Services" (T1219).

  The primary telemetry sources for this detection are Windows network connection logs, specifically focusing on logs that capture outbound connections. If malicious, the use of the Komari RMM tool can lead to unauthorized remote control and data exfiltration. It's important to note that this detection does NOT confirm malicious use of Komari RMM on its own, as legitimate activity may also trigger the rule, depending on the environment and usage policies.

  ### Investigation Steps

  - **Review network connection logs:** Examine Windows Event ID 5156 (Windows Filtering Platform) to identify outbound connections. Focus on connections to `github.com`, `raw.githubusercontent.com`, or `ghcr.io` during unusual hours or from unexpected systems.

  - **Identify asset criticality:** Determine if the host generating the alert is classified as high-risk or has access to sensitive data. This includes assessing whether it is a server or a high-privilege user endpoint.

  - **Validate expected behavior:** Confirm legitimate use cases of Komari RMM in the organization, such as authorized IT management tasks. Check internal documentation or consult with the IT team to clarify this.

  - **Look for high-confidence indicators:** Investigate recent file creations or modifications related to Komari by reviewing Windows Event ID 4688 for process creation events. Identify if the `komari.exe` process is being initiated outside of known legitimate contexts or hosts.

  - **Check for concurrent suspicious activity:** Cross-reference any detection with other alerts related to privilege escalation or unusual lateral movement, which can indicate a more comprehensive attack attempt.

  ### Prioritization

  The severity of this alert is medium due to the possibility of unauthorized access facilitated by the Komari RMM tool. If engaged by an adversary, it could lead to significant security breaches, especially if executed on critical systems. Moreover, the usage of this tool is not uncommon, which warrants careful investigation before concluding malicious intent.

  ### Blind Spots and Assumptions

  Limitations include the high rate of legitimate use of Komari RMM, which may reduce the signal-to-noise ratio of alerts. Reliable detection depends on proper logging configuration for network connection events, and those without comprehensive network logs may miss relevant traffic. Legitimate IT support teams may trigger this alert if using Komari for maintenance tasks. To enhance detection coverage, consider companion rules that monitor for subsequent suspicious file transfers or remote management activities post-connection.

