note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the Komari Remote Management and Monitoring (RMM) tool, which may indicate potential malicious command-and-control (C2) communications. The likely attacker objective is to maintain persistent access or exert control over compromised systems through the RMM, often for deploying further malicious payloads or data exfiltration. The technique corresponds to the MITRE ATT&CK tactic of Command and Control, specifically technique T1219 (Remote Access Software).

  The primary telemetry source is network connection logs from Windows systems, specifically looking for entries that indicate connections to known domains related to Komari. If this activity is confirmed as malicious, the security impact could include unauthorized access to sensitive data, system control, and further network compromise. Notably, this detection does NOT confirm that the Komari tool is definitively malicious, as it might be legitimately used by administrators for remote management.

  ### Investigation Steps

  - **Check network traffic logs:** Review Windows network connection logs (Event ID 5156) for outbound connections to `github.com`, `raw.githubusercontent.com`, `ghcr.io`, or `komari-document.pages.dev`. Look for unusual timestamps or frequencies indicative of suspicious behavior.

  - **Identify user context:** Determine the user account initiating the connections to the Komari domains. Legitimate administrative activity generally originates from known asset management user accounts during standard operational hours.

  - **Investigate process associations:** Use Sysmon event logs (Event ID 3) to correlate the network connections with parent processes. Legitimate use will typically have known management tools (like PowerShell or RMM clients) as parent processes, while suspicious connections may show unexpected or unmanaged executables.

  - **Analyze DNS queries:** Review DNS logs (e.g., Windows DNS Client Event ID 3004) for unusual queries related to the Komari domains. Check for multiple queries originating from the same host in a short time span, which may indicate scanning or tunneling attempts.

  - **Correlate with authentication logs:** Cross-reference with Windows Security Event ID 4624 (successful logon events) to ensure the user connected to the Komari domain is indeed expected to have administrative privileges. Unaccounted administrative logons can indicate a potential security compromise.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact of remote access tools on critical systems, the notable likelihood of their malicious use by external threats, and the frequency with which similar tool behaviors are weaponized in cyber-attacks. The context of the affected system, such as being part of critical infrastructure, can elevate the urgency of the investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if outbound traffic to the identified domains is blocked or if the RMM tool is used through encryption, potentially masking its true nature. It assumes that logs from necessary telemetry sources (e.g., network connection logs) are fully enabled and correctly configured. Legitimate administrative use of the Komari tool may trigger the alert, necessitating clear guidelines on acceptable use. A related detection to consider is monitoring for unusual administrative credential usage (MITRE T1078), which may provide context for authentication anomalies linked to this activity.

