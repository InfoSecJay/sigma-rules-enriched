note: |
  ### Technical Context

  This Sigma rule detects process creation activities associated with the FleetDeck.io Remote Monitoring and Management (RMM) tool on Windows systems. The likely attacker objective may involve unauthorized monitoring or management of systems within the enterprise, potentially facilitating lateral movement or data exfiltration. This activity aligns with the MITRE ATT&CK technique for Remote Services (T1219).

  The primary telemetry sources are Windows Event Logs, specifically focusing on Security Event ID 4688 (Process Creation) and Sysmon Event ID 1. Malicious implications of this activity include unauthorized access to critical infrastructure, data manipulation, or system compromise. Importantly, this detection does not confirm that an adversary is actively exploiting the system, as legitimate FleetDeck.io usage may trigger similar alerts.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for processes with the following images: `fleetdeck_agent_svc.exe`, `fleetdeck_agent.exe`, `fleetdeck_commander_svc.exe`, etc. Identify the process creation time and the user account initiating it.

  - **Identify parent-child relationships:** Use Sysmon Event ID 1 data to investigate parent processes of detected FleetDeck.io binaries, confirming if they are launched from legitimate management applications or unusual contexts, such as unexpected user accounts or external scripts.

  - **Examine service installations:** Look for additional artifacts related to FleetDeck.io within service management (e.g., `sc query` output) to see if unauthorized installations have occurred. This can be done by checking for services named `FleetDeck*`.

  - **Assess legitimate activity:** Confirm legitimate organizational usage of the FleetDeck.io tool by consulting with the IT team or related stakeholders regarding scheduled maintenance or remote administration activities involving these binaries.

  - **Check for unauthorized user activity:** Analyze related user accounts for signs of unauthorized access, such as creation or usage of accounts that do not align with your organization's administrative policies. Review logs for anomalous login attempts or timeframes when FleetDeck processes were initiated.

  - **Investigate file creation or transfer:** Validate if any files created or altered by the detected processes match indicators of compromise (IoCs) or involve unauthorized access to sensitive data. Check for unusual file creations in user profiles or temp directories commonly manipulated by unauthorized tools.

  ### Prioritization

  Given the potential security impact of RMM tools in operational environments, alerts related to FleetDeck.io processes should be treated with medium severity. The likelihood of malicious abuse is moderate, as legitimate installations may be present. However, as RMM tools are commonly weaponized in attacks, this behavior warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if FleetDeck.io logging isn't configured properly or if antivirus solutions incorrectly flag it as benign. Legitimate IT activities, such as authorized remote support sessions, may trigger this alert. A related detection utilizing network traffic logs for unusual IP communications associated with FleetDeck.io could strengthen monitoring capabilities.

