  ---

  ### Technical Context

  This Sigma rule detects process creation associated with the FleetDeck.io Remote Monitoring and Management (RMM) tool. Attackers may use this tool to establish persistent access, manage systems remotely, or deploy malware under the guise of legitimate administrative activities. This behavior primarily aligns with the MITRE ATT&CK technique for Remote Management Tools (T1219).

  The primary telemetry source comes from Windows process creation events, specifically Security Event ID 4688 and/or Sysmon Event ID 1. If malicious, the security impact could be severe, as it may allow an adversary to control or manipulate compromised systems. However, this detection alone does not confirm malicious intent; legitimate use of FleetDeck.io by authorized personnel can trigger the alert.

  ---

  ### Investigation Steps

  - **Identify process initiation source:** Examine the logs for Security Event ID 4688 or Sysmon Event ID 1 to determine the user and the process that created the FleetDeck.io processes. Compare the user to known administrative personnel to assess legitimacy.

  - **Correlate process activity with network traffic:** Review network logs to check for outbound connections made by the FleetDeck processes to external IP addresses. Malicious instances may connect to known command and control (C2) servers, while legitimate usage typically connects to internal management servers.

  - **Review installed software:** Assess whether FleetDeck.io components (e.g., fleetdeck_agent_svc.exe) are present in the environment intentionally. Check for documentation or deployment records, especially on critical servers, to validate legitimate installation.

  - **Examine parent process details:** Investigate the parent process information in the logs to determine if any unusual or unauthorized software initiated the FleetDeck processes. A legitimate parent process might be a known administrative tool or script executed by an in-scope user.

  - **Check for unusual execution times:** Analyze the timestamps of the detected process activities. Legitimate administrative tasks typically occur during business hours, whereas malicious behavior may be observed after hours or during maintenance windows without proper authorization.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential of unauthorized remote access to critical systems. While the likelihood of abuse is significant for environments using RMM tools, legitimate administrative activities can trigger the alert, necessitating thorough investigation before assuming malicious intent.

  ---

  ### Blind Spots and Assumptions

  There are limitations in detecting this behavior due to possible evasion techniques, such as renaming or modifying the FleetDeck binaries. Reliable detection necessitates proper logging configurations for both Security Event ID 4688 and Sysmon logs. Legitimate administrative activities, such as scheduled maintenance or troubleshooting, might trigger this alert. As a companion detection, monitoring for unusual network behavior from known legitimate software can enhance overall security coverage.

