note: |
  ### Technical Context

  This rule detects network activity associated with the SkyFex Remote Management Tool (RMM), which could indicate unauthorized remote access attempts by an attacker. The likely objective of an adversary using this tool is to gain remote control over a compromised system for purposes such as data theft, system manipulation, or lateral movement within the network. Relevant MITRE ATT&CK tactics include Command and Control (TA0011) and Remote Services (T1219).

  The primary telemetry sources for this detection are network connection logs, specifically looking for outbound connections to known SkyFex domains. If the activity is malicious, an unauthorized user may be exploiting the SkyFex platform to bypass traditional security measures. Importantly, this detection does not confirm that the activity is malicious—it could be legitimate usage by authorized personnel.

  ### Investigation Steps

  - **Check network connection logs**: Review Windows network connection logs (Event ID 5156) for any outbound connections to `skyfex.com` or `deskroll.com`. Look for connections from untrusted internal hosts.

  - **Identify authenticated users**: Verify the user account associated with the network connection. This can be done by correlating Event ID 4624 (Logon) for the timestamp of the connection attempt. Legitimate use typically involves known users associated with IT support roles.

  - **Assess incoming connection reports**: Investigate related Event ID 7045 (Service Installation) on endpoints for new or unusual services that might indicate a legitimate installation of remote management software.

  - **Examine firewall logs**: Review firewall logs for any unusually high volume of outbound connections to the SkyFex domains. This could indicate automated scripts or malware attempting to exfiltrate data.

  - **Check for companion activity**: Search for Sysmon Event ID 3 (Network connection detected) in conjunction with this rule. Multiple connections to SkyFex domains shortly after a process creation event may indicate harmful behavior.

  ### Prioritization

  This alert should be classified as medium severity due to the potential for significant impact if unauthorized remote access is confirmed. There is a reasonable likelihood of malicious exploitation, especially if the SkyFex domains are not typical for your organization's operations or if the originating host role is critical.

  ### Blind Spots and Assumptions

  One limitation is that legitimate SkyFex usage may trigger this alert, leading to potential false positives. Proper log sourcing, including accurate network connection monitoring, is crucial for reliable detection. Activities such as remote access software updates or legitimate IT management could also trigger this rule. Companion detections, such as monitoring for unusual user activity (e.g., lateral movement), would enhance coverage and assist in confirming the legitimacy of the alerts.

