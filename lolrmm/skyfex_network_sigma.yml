  ---

  ### Technical Context

  This Sigma rule detects outbound network traffic to domains associated with the SkyFex Remote Management Tool (RMM), indicating a potential use of remote access software that can facilitate unauthorized access to systems. The likely attacker objective is to leverage such tools for remote control, data exfiltration, or lateral movement within a network, potentially following initial access. This behavior aligns with the MITRE ATT&CK technique for Remote Access Software (T1219). Primary telemetry sources include Windows network connection logs, specifically monitoring for connections containing "skyfex.com" or "deskroll.com". If exploited maliciously, this could permit an adversary to maintain persistence within an environment or exfiltrate sensitive data. It is essential to note that detection of network activity alone does not confirm malicious intent as legitimate administrative use may occur.

  ---

  ### Investigation Steps

  - **Verify network connection logs:**
    Check Windows network connection logs (Event ID 5156) for outbound connections to any of the listed domains (skyfex.com, deskroll.com, *.deskroll.com). Observe the timestamps and originating user accounts.

  - **Examine process execution:**
    Cross-reference with process creation logs (Sysmon Event ID 1) to identify if any processes initiated connections to these domains, particularly looking for unauthorized or suspicious executables tied to the activity.

  - **Identify legitimate use cases:**
    Confirm if any users or systems in your environment have documented usage of SkyFex or Deskroll for legitimate activities. Review your organization’s remote access policy to ensure compliance.

  - **Look for associated network artifacts:**
    Validate any file transfers associated with the connections by checking log types such as Windows File Audit logs. Look for unusual file creation or modification timestamps corresponding to the network activity of interest.

  - **Establish user behavior patterns:**
    Analyze login history (Event ID 4624) for the account initiating these network connections to validate if this behavior aligns with historical data and expected user patterns.

  - **Assess asset criticality:**
    Determine the sensitivity of the asset involved in the connection, especially if it is part of a critical infrastructure or contains sensitive information, which elevates the urgency of the investigation.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential for sensitive systems being accessed unless the behavior can be verified as legitimate. The likelihood of malicious abuse is moderate, especially in environments without strict policies governing remote access tools. Such tools are often weaponized in targeted attacks for control.

  ---

  ### Blind Spots and Assumptions

  This detection may miss instances where the remote management tool is obscured by domain generation algorithms or custom domains not included in the rule. Monitoring must ensure comprehensive coverage of network logs, including any proxies that might obscure true destination addresses. Legitimate administrative activity may trigger this alert, especially if used by IT teams for maintenance tasks. Companion detections that monitor for suspicious process executions and account anomalies could strengthen coverage against unauthorized tool usage.

