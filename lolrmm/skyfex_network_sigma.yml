note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the SkyFex Remote Management Tool (RMM), which is utilized for providing remote assistance and system management capabilities. SkyFex RMM is effective for legitimate administrative purposes; however, attackers may exploit such tools to gain unauthorized access, conduct reconnaissance, or maintain persistence on compromised systems. Hence, monitoring its use is critical for detecting potential nefarious activities within an environment.

  In terms of MITRE ATT&CK, the relevant tactics include **Execution** (TA0002), as the use of RMM tools typically allows execution of commands on a remote host. The specific technique applicable here is **T1219: Remote Access Tools**, which highlights remote access solutions that could facilitate both legitimate operations or malicious behaviors depending on the context of their use.

  Data sources that provide the best evidence for this detection include Windows network connection logs. These logs can capture outbound connections to the specific domains associated with SkyFex, thereby providing insights into whether the tool is being used appropriately or as part of a more sinister intent.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine logs for outbound connections to `skyfex.com`, `deskroll.com`, and subdomains to determine if the request aligns with known legitimate usage patterns.
  - **Analyze Application Activity:** Investigate any processes that initiated connections to the identified domains to see if any unusual or unauthorized applications are at play.
  - **Assess User Context:** Identify the user account associated with the connections. Ensure that the actions taken by the user are in line with their expected behavior and job responsibilities.
  - **Check for Compromised Credentials:** Since RMM tools can be exploited through stolen credentials, review logs for any previous suspicious logins or access patterns that may indicate credential theft or misuse.

  ### Prioritization
  The severity of this alert is medium due to the dual nature of remote management tools that can serve both legitimate administrative functions and potential malicious purposes. The likelihood of exploitation in an enterprise environment underscores the necessity for timely investigation while minimizing false positives from legitimate usage.

  ### Blind Spots and Assumptions
  One significant blind spot in this detection is that it may not catch other similar remote management tools not specifically associated with the domains listed. Additionally, the assumption is made that outbound connection logs are adequately logged and retained within the network environments. Required configurations include active logging of all outbound network activity, as well as ensuring that there is clarity on what constitutes normal usage of RMM tools within the organization.

