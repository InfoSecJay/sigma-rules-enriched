  ### Technical Context

  This Sigma rule detects potential network activity associated with the SkyFex Remote Management and Monitoring (RMM) tool by identifying connections to specific domains such as skyfex.com and deskroll.com. Attackers may use this tool for remote access to compromised systems, enabling them to perform various malicious activities, including data exfiltration or lateral movement within an enterprise environment. This detection aligns with the MITRE ATT&CK technique for Remote Access Software (T1219).

  The primary telemetry sources include Windows network connection logs, particularly focusing on outbound network connections. If malicious, the impact could include unauthorized access, data theft, and persistent threat actors within the environment. It is important to note that this detection does NOT confirm malicious activity on its own, as SkyFex may also be used legitimately within some organizations.

  ### Investigation Steps

  - **Identify outbound connections to suspicious domains:** Check Windows Security Event ID 5156 (Windows Filtering Platform) for outbound connections to skyfex.com or deskroll.com. Determine if the connection was initiated from an unusual host or an asset not designated for remote access.

  - **Examine recent process executions:** Review Sysmon Event ID 1 (Process Creation) for any processes that may have established the network connections. Look specifically for entries where legitimate applications are launching unexpected connections to the identified SkyFex domains.

  - **Verify legitimate SkyFex usage:** Confirm with IT asset inventories and user access logs whether the identified host is expected to use SkyFex. Cross-reference known administrative roles with user activity during the alert timeframe.

  - **Assess network traffic patterns:** Utilize network flow logs (or similar telemetry) to determine if the volume and frequency of connections to the flagged domains are consistent with legitimate use cases. Note any spikes in traffic or access attempts from non-expected devices.

  - **Correlate with other behaviors:** Investigate if other alerting detections coincide with these network connections, such as lateral movement indications or suspicious PowerShell activity (e.g., T1086), which may reinforce suspicion of malicious actor activity.

  ### Prioritization

  The severity of this alert is medium, as it may indicate potential misuse of remote access software, which is often exploited by adversaries. The affected systems' criticality can elevate the alert’s priority, especially if they involve sensitive data or critical infrastructures. This behavior may be weaponized by adversaries for a variety of attacks, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detecting SkyFex activity can be limited by false positives arising from legitimate remote access usage. Reliable detection requires properly configured logging for network connections (Windows Filtering Platform logs). Legitimate administration and remote support tasks may also trigger this alert, thus careful investigation is imperative. A related detection to consider is monitoring for other remote access software communications (e.g., AnyDesk or TeamViewer), which can provide additional context and coverage against unauthorized remote access attempts.

