note: |
  ### Technical Context

  This Sigma rule detects network connections to SkyFex RMM tool domains, which are commonly associated with remote administration and management capabilities. The likely attacker objective is to establish a remote access channel to a compromised system, facilitating data exfiltration or lateral movement within the network. Relevant MITRE ATT&CK tactics include Command and Control (TA0011) and Remote Services (T1219).

  Primary telemetry sources include Windows network connection logs, specifically looking for connections to domains such as `*.deskroll.com` and `*.skyfex.com`. If malicious in nature, this behavior could result in unauthorized access to sensitive data or control over the affected systems. It is important to note that while this detection indicates potential misuse, it does NOT confirm that the activity is inherently malicious without further context.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 logs for outbound connections to `*.deskroll.com` or `*.skyfex.com` to identify any unauthorized activity. This may indicate a potential compromise or misuse of remote access tools.

  - **Validate process associations:** Investigate associated processes using Sysmon Event ID 1; look for suspicious parent-child process relationships where known administrative tools invoke connections to these SkyFex domains.

  - **Assess legitimate usage:** Identify whether legitimate remote management activities are taking place. This can be confirmed by cross-referencing approved remote administration tools listed in asset management against observed network connections.

  - **Review user account activity:** Analyze logs from Active Directory (Event ID 4624) to confirm if the connections are made by authorized users during their expected working hours. Legitimate use should correlate with approved accounts’ typical activity patterns and schedules.

  - **Identify malicious indicators:** Look for processes running under accounts with unusual privileges that connect to SkyFex domains, or connections originating from unexpected locations. These are high-confidence indicators of malicious intent.

  - **Check for file artifacts:** Investigate for any new or modified executables in the `C:\Program Files` directory that correlate with SkyFex functionality, which could indicate lateral movement or unauthorized installation.

  ### Prioritization

  The severity of this alert is medium due to the potential high impact on sensitive systems if malicious access is confirmed. The likelihood of abuse is significant given that remote access tools are commonly weaponized in attacks. Rapid review and containment are advised to mitigate risks from unauthorized remote access.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate use of SkyFex occurs or by lack of comprehensive network visibility to capture all related activities. There is a possibility that users may trigger the alert for valid remote administration purposes. Related detections could include logging for other remote access tools like TeamViewer or AnyDesk, which help strengthen overall remote access coverage in the network.

