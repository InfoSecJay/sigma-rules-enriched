note: |
  ### Technical Context

  This rule detects network activity directed toward the domains associated with the SkyFex RMM tool (i.e., skyfex.com, deskroll.com). The likely attacker objective is to establish remote access to compromised systems or perform unauthorized administrative operations, leveraging remote management capabilities to maintain persistence or conduct additional exploits. This behavior maps to the MITRE ATT&CK technique Remote Management Software (T1219).

  Primary telemetry sources include network connection logs identifying traffic destined for these domains. If the activity is malicious, it could allow unauthorized remote access to systems, potentially leading to data exfiltration, system manipulation, or lateral movement. It's important to note that detection of this traffic does NOT confirm that a security breach has occurred, as it may also reflect legitimate use of the SkyFex tool by authorized users.

  ### Investigation Steps

  - **Check network connection logs:** Review logs for network traffic using Windows Event ID 5156 (Windows Filtering Platform) or similar logs indicating outbound connections to skyfex.com or deskroll.com. Look for user accounts associated with this traffic.

  - **Identify legitimate users:** Confirm if known administrators or support staff have legitimate reasons for using SkyFex. Review user activity and expected use cases, such as remote support sessions.

  - **Analyze process creation events:** Look for associated process creation logs (Event ID 4688 or Sysmon Event ID 1) for processes that may indicate unauthorized use of remote management tools initiated from affected hosts.

  - **Examine outgoing connection details:** Check details of the destination connections (e.g., hostname, IP ownership) and analyze response times or payload sizes to determine if the communication appears consistent with remote management activities.

  - **Look for unusual lateral movement patterns:** Review for any follow-up activities or connections from the same host to internal resources suggesting further exploitation (e.g., Event ID 4624 for unexpected logins from the same machine).

  ### Prioritization

  This alert is of medium severity due to the potential impact on sensitive systems if the SkyFex RMM tool is misused. The likelihood of malicious use is moderate, as RMM tools can be weaponized, particularly in environments lacking robust access controls. However, legitimate administrative activities may also trigger this alert.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of SkyFex RMM in the environment, leading to false positives. Logs from firewalls or proxy servers must be properly configured to ensure comprehensive visibility into outbound traffic. Additionally, other tools with similar functionality may exist, and their use may not be captured under this detection rule. Companion detections may include alerts for unexpected process execution correlating with network connections to known RMM domains.

