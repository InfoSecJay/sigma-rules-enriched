note: |
  ### Technical Context

  This Sigma rule detects the creation of processes associated with the Splashtop (Beta) Remote Management Tool. The likely attacker objective is to leverage Splashtop for remote access to compromised systems, which can facilitate unauthorized control, data exfiltration, or further lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique for command and control (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing the creation of suspicious processes. If malicious, this activity may provide the attacker with stealthy and persistent access to target systems. However, this detection does NOT prove that an adversary is present or executing malicious actions alone; legitimate use of the Splashtop tool may generate similar alerts.

  ### Investigation Steps

  - **Review process details:** Check for Security Event ID 4688 or Sysmon Event ID 1 to analyze process creation. Confirm if the process initiated by legitimate users matches known paths for Splashtop binaries.

  - **Identify parent processes:** Review the ParentImage field in logs to find processes such as "\\SRServer.exe" or "\\SplashtopSOS.exe." Legitimate activity often originates from trusted management applications; unexpected parent processes suggest malign intent.

  - **Analyze user accounts involved:** Examine the account associated with process creation  for anomalous logins or contexts (e.g., Event ID 4624). Legitimate accounts should have expected user roles. Look for process creation by accounts that shouldn't have access to this tool.

  - **Validate process behavior:** Cross-reference the detected process activity with known benign behavior of Splashtop, such as user-initiated remote sessions. Suspicious execution times, especially during off-hours, may indicate malicious use.

  - **Check for exfiltration activities:** Monitor for any network connections initiated by detected Splashtop processes (e.g., utilizing firewall logs). Look for outbound traffic that may indicate data leakage or command and control.

  ### Prioritization

  The alert severity is medium, as it targets a tool commonly used for remote management, which can be abused by adversaries for malicious purposes. Given that Splashtop can be misused for unauthorized access, it is crucial to assess the context of usage closely.

  ### Blind Spots and Assumptions

  Detection is limited by configurations that may not log every use case of Splashtop, resulting in missed benign sessions. Legitimate IT support activity may trigger these alerts, complicating prioritization. Companion detections such as monitoring for unusual network communications associated with Splashtop processes would enhance coverage surrounding potential misuse.

