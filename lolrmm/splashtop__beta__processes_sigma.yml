  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Splashtop (Beta) RMM tool, which can be used for remote management and support purposes. The likely attacker objective could be unauthorized remote access to systems, allowing for data exfiltration, lateral movement, or further compromise of the environment. This behavior aligns with the MITRE ATT&CK techniques for Remote Access Software (T1219). The primary telemetry sources are Windows process creation logs, notably Security Event ID 4688 or Sysmon Event ID 1, capturing details about process execution.

  If the alert is triggered by malicious activity, the security impact could be significant, as an adversary could exploit remote management capabilities to gain control over systems. However, this detection does NOT confirm malicious activity on its own, as legitimate users might also run these processes for rightful purposes.

  ---

  ### Investigation Steps

  - **Identify executed processes**: Investigate the process creation logs (Event ID 4688) for the potentially suspicious processes (`SRServer.exe`, `SplashtopSOS.exe`, `Splashtop_Streamer_Windows*.exe`, `SRManager.exe`). Pay attention to unusual execution times or parent-child relationships.

  - **Check parent process**: Review the parent process of the detected activities. Legitimate Splashtop sessions typically initiate from trusted management tools; if the parent process is unrelated or suspicious (e.g., cmd.exe or PowerShell), this increases the likelihood of malicious intent.

  - **Review user accounts**: Correlate the process execution with user account activity. Analyze if the process was initiated by privileged accounts or service accounts not typically associated with Splashtop usage. Check user logs against Security Event IDs 4624 for logon events.

  - **Assess running instances**: Confirm whether multiple instances of the detected processes are running simultaneously. Legitimate use cases often involve one instance per user session; multiple instances could indicate misuse or exploitation.

  - **Evaluate endpoint context**: Determine the role and criticality of the affected endpoint. If the alert is triggered on sensitive systems (e.g., domain controllers, servers with critical data), escalate the investigation’s urgency.

  - **Investigate network calls**: Review network logs for any outbound connections initiated by these processes. Look for unusual patterns (e.g., connections to unrecognized external IP addresses or domain names) that may suggest data exfiltration or command-and-control activity.

  ---

  ### Prioritization

  The alert warrants medium severity due to the potential impact on critical systems if unauthorized access is confirmed. While the identified processes can be used legitimately, their presence can also indicate malicious intent, particularly if they stem from unusual user accounts or contexts. The likelihood of malicious abuse is significant, especially within targeted environments.

  ---

  ### Blind Spots and Assumptions

  The detection may miss instances where the Splashtop tool is modified or renamed to evade detection. Reliable detection requires monitoring from endpoints configured to log process creations; otherwise, relevant activity could be overlooked. Legitimate administrative activities could trigger alerts, especially for support staff using authorized remote access tools. A companion detection involving the examination of unusual network connections initiated by these processes can enhance overall security posture.

