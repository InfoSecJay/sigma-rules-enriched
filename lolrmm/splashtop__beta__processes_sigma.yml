note: |
  ### Technical Context
  This rule detects processes associated with the Splashtop (Beta) Remote Management Tool (RMM), which can potentially be misused for remote administrative access by unauthorized actors. The suspected threat scenario entails an attacker utilizing Splashtop to gain control over systems within an enterprise network, potentially leading to data exfiltration, lateral movement, or persistence. Attackers may leverage legitimate remote access tools (RATs) like Splashtop to obscure their activity, as they are often less scrutinized compared to traditional hacking tools.

  The relevant MITRE ATT&CK tactics and techniques applicable in this detection context include:
  - Execution (TA0002) - Utilized to execute malicious software or scripts.
  - Remote Services (T1219) - Involves using remote services to execute commands or gain access to systems remotely.

  The primary data sources for detecting this activity consist of Windows process creation logs, which capture the details of processes spawned on systems, revealing any unauthorized applications running in the environment.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate Windows process creation logs for instances of Splashtop-related executables (e.g., SRServer.exe, SplashtopSOS.exe) to identify if they were initiated by unexpected user accounts or from unusual locations.

  - **Examine Parent Processes**: Check the parent process hierarchy associated with detected Splashtop processes to determine if they were initiated by potentially malicious parent processes, such as suspicious scripts or other known indicators of compromise.

  - **Check for Legitimate Usage**: Investigate whether the use of Splashtop is authorized within your organization by consulting with IT departments or reviewing documented use cases to differentiate between legitimate IT support activities and potential abuse.

  - **Assess Network Activity**: Analyze outgoing network connections generated by Splashtop processes to identify any abnormal connections to untrusted or external IP addresses, which may indicate data exfiltration or command-and-control communication.

  ### Prioritization
  The alert is assigned a medium severity due to the potential risk posed by unauthorized remote access tools, which can be exploited to compromise sensitive data and systems. Although Splashtop may be used legitimately, its capability for remote administration warrants careful scrutiny.

  ### Blind Spots and Assumptions
  This detection is predicated on the presence of process creation logs and their proper configuration. A key gap in detection coverage is the legitimate use of Splashtop for administrative purposes, which may generate false positives. Assumptions are made that no other obscure techniques are employed to disguise malicious activity while leveraging Splashtop. Therefore, ensuring comprehensive logging and monitoring of both internal network activities and process hierarchies is crucial for improved accuracy in detection.

