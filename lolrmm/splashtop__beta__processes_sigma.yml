  ### Technical Context

  This Sigma rule detects the execution of processes related to the Splashtop (Beta) Remote Management Tool (RMM), specifically monitoring for process creation events of applications such as SRServer.exe, SplashtopSOS.exe, and SRManager.exe. Attackers may utilize these tools for remote access with the intent of carrying out post-exploitation activities or lateral movement within the network. The relevant MITRE ATT&CK technique is Remote Management Software Application (T1219).

  The primary telemetry source for this detection is Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, capturing process execution details. If malicious, the use of these tools could facilitate unauthorized access to systems, leading to data exfiltration or further compromise. It’s important to note that this detection does NOT confirm malicious intent on its own, as legitimate uses of the Splashtop tool exist.

  ### Investigation Steps

  - **Review process creation logs:** Analyze Windows Security Event ID 4688 and Sysmon Event ID 1 for instances of process creation. Look for process names ending with SRServer.exe, SplashtopSOS.exe, or SRManager.exe. Compare the timestamps with known legitimate usage patterns.

  - **Check parent processes:** Investigate the parent processes associated with detected Splashtop activity. Confirm if they are legitimate management processes like the specified Splashtop services (e.g., SRServer.exe). Malicious use may have non-standard parent processes.

  - **Analyze user accounts:** Validate the user accounts executing these processes. Legitimate processes typically run under administrative accounts or those assigned to IT management roles. Any anomalous execution by non-privileged users should be flagged.

  - **Assess network connections:** Examine outbound network connections associated with the detected Splashtop processes using Event ID 5156 or Sysmon Event ID 3. Look for unusual IP addresses or domains that do not align with normal operational patterns.

  - **Identify benign usage:** Confirm known legitimate uses of Splashtop within your organization. If business units utilize this software, document expected process execution timelines and authorized users to better contextualize alerts.

  - **Monitor for lateral movement:** Alert on the subsequent execution of additional remote access tools after initial Splashtop detections. Establish a baseline of process interactions to distinguish normal remote access use from potential malicious escalation activities.

  ### Prioritization

  This alert carries medium severity as the impact involves potential unauthorized remote access on potentially critical systems, which could lead to broader network compromise. While the likelihood of malicious use exists, it is somewhat mitigated by the legitimate use of Splashtop in many organizations.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through renaming or modifying legitimate Splashtop executables. Reliable detection requires complete logging of process creation events; ensure Sysmon is properly configured. Legitimate activities, such as regular IT management tasks, may trigger this alert. Consider companion detections focused on anomalous network behavior or other remote access tool usages to enhance investigative accuracy.

