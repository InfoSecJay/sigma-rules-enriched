note: |
  ### Technical Context

  This Sigma rule detects potential registry activity related to the OpsBridge Agent Remote Monitoring and Management (RMM) tool. The behavior identified includes the creation or modification of specific registry keys associated with the OpsBridge Agent, which could indicate an adversary attempting to establish persistence or perform reconnaissance via this management tool. The likely attacker objective is to manipulate or exploit the RMM tool for unauthorized management of endpoints within the network.

  Relevant MITRE ATT&CK tactics and techniques include Command and Control (TA0011) and Communication through Removable Media (T1219). The primary telemetry source is Windows registry events, specifically monitoring changes in the Registry key paths: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\OpsBridgeAgent' and 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\OpsBridge Agent'. If the activity is malicious, it can result in unauthorized access to critical systems or data compromise.

  This detection does NOT confirm that malicious activity is occurring on its own; legitimate use of the OpsBridge Agent by IT or support teams may trigger the same registry activity.

  ### Investigation Steps

  - **Review registry keys for recent modifications**: Check Event ID 4663 or registry event logs for recent changes to 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\OpsBridgeAgent' and 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\OpsBridge Agent'. Compare timestamps against known good usage windows.

  - **Identify the process making the registry changes**: Utilize Sysmon Event ID 10 to view the processes that accessed the registry keys. Look for any unusual parent processes or processes executing from non-standard locations, indicating potential malicious activity.

  - **Verify legitimate OpsBridge Agent usage**: Query the asset inventory to confirm that the presence of the OpsBridge Agent is expected on the affected systems. Check for corresponding legitimate operations around the time of the alert to contextualize the event.

  - **Check for other related registry activity**: Look for additional suspicious registry modifications in close temporal proximity to further identify malicious behavior. Review other likely Presence keys under 'HKLM\SYSTEM\CurrentControlSet\Services\OpsBridgeAgent' for unauthorized changes.

  - **Cross-reference network communication**: Review network connection logs (e.g., Windows Firewall log or Netsh logs) for outbound connections made by the OpsBridge Agent app or relevant associated processes. Pay attention to communications on atypical ports or addressing suspicious external hosts.

  ### Prioritization

  This alert is of medium severity due to the potential impact on the affected system, as misuse of RMM tools can lead to extensive unauthorized remote access. The likelihood of malicious abuse is considerable, given the tool's functionalities, and this behavior is a known method used by threat actors to facilitate command and control capabilities.

  ### Blind Spots and Assumptions

  Detection may be limited by the fact that legitimate operations of the OpsBridge Agent can trigger this alert. Required logs include comprehensive registry logging and an auditing policy configured to capture registry modifications reliably. There might be benign activities, such as official updates or maintenance by IT personnel, that could trigger this alert. A companion detection to consider is monitoring for unusual network connections from the OpsBridge Agent process, which would provide additional context to the registry changes being detected.

