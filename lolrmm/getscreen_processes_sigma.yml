note: |
  ### Technical Context

  This Sigma rule detects process creation associated with the GetScreen Remote Monitoring and Management (RMM) tool by identifying instances where either the process itself or its parent process is consistently named "GetScreen.exe". The potential objective of an adversary using this tool could be remote management of compromised systems, allowing them to conduct ongoing surveillance, data exfiltration, or system manipulation.

  This behavior fits within the MITRE ATT&CK framework under the tactic of Execution, specifically technique T1219, indicating that the active exploitation involves running remote management tools to maintain persistence or control over victim systems. Primary telemetry sources include Windows Security Event ID 4688 (Process Creation), logging the image name and process hierarchy. If used maliciously, this tool could facilitate unauthorized remote access, leading to significant security compromises. Importantly, this detection does NOT confirm malicious activity on its own, as GetScreen may be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Check process creation logs:**
    Review Windows Security Event ID 4688 logs for instances where "GetScreen.exe" appears. Look for the creation of the process and the parent process. A legitimate instance would generally originate from an administrative account with usage patterns consistent to remote support.

  - **Assess process parent-child relationships:**
    Examine the relationship between "GetScreen.exe" and its parent processes. Malicious instances are often initiated by unconventional parent processes. For example, unusual parent processes like "cmd.exe" or "powershell.exe" could indicate a nefarious context.

  - **Correlate user activity:**
    Investigate user account activity around the timing of the event. Unexpected execution by non-administrative users or outside of standard working hours might indicate a compromised account. Review account logs in Event ID 4624 (Successful Logon) for context.

  - **Review network connections:**
    Analyze network logs (e.g., firewall, IDS/IPS) for outbound connections initiated by the "GetScreen.exe" process. Legitimate tools typically communicate over known ports or protocols (like RDP); unexpected IP destinations could indicate a risk.

  - **Check installed applications:**
    Validate the context of "GetScreen.exe" by reviewing installed applications on relevant hosts. If the tool is absent but executions are logged, it could imply a potential shadow or unauthorized instance that warrants further investigation.

  ### Prioritization

  The alert is of medium severity due to the potential impact of the affected system, especially if it pertains to critical infrastructure. The likelihood of malicious abuse exists as remote management tools are commonly weaponized for unauthorized access. Therefore, prompt investigation is crucial to rule out or confirm compromise.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of evasion techniques such as renaming malicious executables or using other benign remote management tools that can resemble GetScreen in function. Comprehensive coverage requires accurate log configurations to capture all relevant process creation events. Legitimate use cases for GetScreen may trigger this alert in administrative environments, emphasizing the need for contextual analysis. A related detection worth implementing for greater coverage is monitoring for PowerShell commands related to process invocation, as PowerShell can be used to execute "GetScreen.exe" under suspicious contexts.

