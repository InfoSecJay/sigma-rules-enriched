note: |
  ### Technical Context

  This Sigma rule detects the execution of the GetScreen Remote Monitoring and Management (RMM) tool. The detection captures behavior where processes initiated by or related to GetScreen may indicate unauthorized access or management of endpoints. An attacker may use this tool to maintain persistent access or to remotely manage compromised systems, aligning with MITRE ATT&CK technique T1219 (Remote Access Software). The primary telemetry source for this alert is Windows process creation logs, particularly Event ID 4688 or Sysmon Event ID 1. If the activity is malicious, it may facilitate lateral movement or data exfiltration. Importantly, this detection does NOT confirm that the activity is malicious on its own, as GetScreen could be used legitimately in managed environments.

  ### Investigation Steps

  - **Check process parentage:** Review Event ID 4688 logs to identify the parent processes associated with `getscreen-x86.exe` or `getscreen.upd.exe`. Malicious use may come from unusual parent processes or in unexpected user contexts.

  - **Identify user context:** Verify the user account executing the GetScreen processes by checking Event ID 4688 details or Sysmon logs. Actions initiated by non-admin users on critical servers may be suspicious.

  - **Evaluate process creation times:** Cross-reference timestamps of the GetScreen execution against other activity on the system to identify unusual patterns or spikes in usage. Legitimate operations may follow predefined schedules or expected usage patterns.

  - **Analyze network activity:** Investigate correlated network logs, such as firewall logs or DNS requests, for connections to known GetScreen command and control IPs or domains. Look for unusual outbound traffic patterns that coincide with process execution.

  - **Check for related artifacts:** Validate the presence of associated files or registry keys indicative of GetScreen functionality. Create a hash of any suspicious binaries that may have been executed and compare them against known bad indicators.

  ### Prioritization

  The alert is of medium severity due to its potential impact on sensitive systems that may be compromised by an unauthorized RMM tool. The likelihood of malicious use is heightened, given that RMM tools like GetScreen are often weaponized to facilitate remote access during targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include reliance on process logging, which could be evaded by attackers using obfuscation or renaming techniques. Reliable detection requires that the logging of process creation be enabled on all endpoints. Legitimate administrative activities involving GetScreen may trigger this alert, particularly in environments set up for remote management. Complementary detections for RMM tool behavior, such as identifying connections to unmanaged or suspicious IPs during these process executions, can enhance coverage.

