note: |
  ### Technical Context
  This detection rule identifies potential malicious activity involving the GetScreen Remote Monitoring and Management (RMM) tool. GetScreen is often employed for legitimate administrative purposes; however, it can also be misused by threat actors to manage compromised systems remotely, conduct reconnaissance, or execute unauthorized actions. The detection focuses on processes initiated by the GetScreen executable, as these may indicate unauthorized remote access sessions being established without proper oversight.

  Attackers exploiting remote management software typically aim to maintain persistence within an environment, execute lateral movement, or exfiltrate sensitive information. By analyzing the behavior associated with GetScreen, defenders can correlate raised alerts with potentially unauthorized access attempts or abnormal command execution patterns within corporate networks.

  Relevant MITRE ATT&CK tactics include:
  - **Execution (TA0002)** - The attacker executes malicious commands using legitimate tools.
  - **Remote Services (T1219)** - The utilization of remote tools for unauthorized access or control.

  Primary data sources include:
  - Process creation events from Windows logs, providing context on which executables are running and their parent processes.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine Windows event logs for any instances of process creation linked to `GetScreen.exe`. Look for patterns such as unusual times of day or multiple instances across different endpoints.
  - **Analyze Parent Process Information:** Investigate the parent processes that spawned GetScreen instances to determine whether they relate to administrative tasks or if they appear suspicious.
  - **Check for Unusual Network Activity:** Examine network logs for outbound connections originating from systems running GetScreen, especially to uncommon or external IP addresses that could indicate data exfiltration or command-and-control communication.
  - **Verify User Context:** Validate whether the user account associated with the processes has legitimate access to execute GetScreen. Investigate any abnormal access requests or privilege escalation attempts tied to that account.

  ### Prioritization
  The severity of this alert is medium due to the potential for GetScreen to facilitate unauthorized remote access, making it essential for enterprise defenses. While its legitimate use exists, unusual patterns of activity warrant immediate investigation to mitigate potential breaches.

  ### Blind Spots and Assumptions
  There may be gaps in coverage if organizations do not have comprehensive process creation logging enabled, as undetected use of GetScreen could go unnoticed. The detection logic assumes that any execution of GetScreen associated with a non-administrative user should be considered suspicious. The alert relies on accurate process logging from Windows systems, which must be properly configured to capture relevant data for the detection to function effectively.

