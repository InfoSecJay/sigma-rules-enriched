note: |
  ### Technical Context

  This Sigma rule detects potential process activity associated with the GetScreen Remote Management Tool (RMM). The likely attacker objective includes unauthorized access or remote manipulation of compromised systems using this software, often employed in remote support scenarios by adversaries. This behavior falls under the MITRE ATT&CK tactic of Command and Control (T1071) with a technique related to application-layer protocols (T1219). Primary telemetry sources are Windows process creation logs, particularly focusing on Security Event ID 4688 and Sysmon Event ID 1, capturing process execution details. If malicious, this activity could lead to data exfiltration, system manipulation, or credential theft. However, the detection does NOT confirm malicious intent on its own, as GetScreen can be legitimately used for remote support.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 logs for the execution of processes ending with `getscreen-x86.exe` or `getscreen.upd.exe`. Investigate timestamp and user account associated with the process to establish context.

  - **Identify process parents**: Verify the ParentImage field in the logs to determine the origin of the processes. Legitimate usage typically involves well-known system administration tools; malicious activity may show unexpected or suspicious parent processes originating from non-admin accounts.

  - **Cross-reference user accounts**: Analyze the user account tied to the execution of GetScreen. Authorized personnel generally use this tool in specific business contexts; highlight any accounts that are not typically associated with IT support roles.

  - **Review network activity**: Inspect outbound connections corresponding to the timestamps of the detected processes using firewall or EDR logs. Look for unusual TCP/UDP traffic to non-standard ports that could indicate C2 communication.

  - **Examine process behavior**: Utilize Sysinternals tools or EDR solutions to monitor the behavior of the running GetScreen processes. Look for uncommon actions, such as file manipulations or unusual registry modifications that indicate suspicious activity.

  - **Assess asset criticality**: Determine if the affected system is a critical asset, such as hosting sensitive data or applications. This evaluation helps define the impact of the potential compromise and informs response actions.

  ### Prioritization

  This alert is medium severity due to the potential impact on critical systems if misused. While GetScreen can be legitimately employed for remote assistance, its usage by unauthorized personnel can indicate a compromise. The behavior is not commonly weaponized, but it aligns with adversary tactics for remote access.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete event logging, particularly if process creation logs aren't fully enabled across all endpoints. Legitimate remote support activities may trigger this alert, especially in organizations employing GetScreen for administration. Implementing companion detections, such as monitoring for abnormal PowerShell activities (T1086), can strengthen security posture against potential misuse.

