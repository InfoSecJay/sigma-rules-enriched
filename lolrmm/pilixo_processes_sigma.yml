note: |
  ### Technical Context

  This Sigma rule detects suspicious process activity associated with the Pilixo Remote Management and Monitoring (RMM) tool, which could indicate potential command-and-control (C2) behavior. An adversary may leverage this tool to maintain persistence and remotely manage compromised systems, typically resulting in unauthorized access to sensitive data or critical infrastructure. This aligns with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry source is Windows process creation logs, specifically Process Creation events (Security Event ID 4688 or Sysmon Event ID 1). If malicious, the detection could allow adversaries to control endpoints or coordinate attacks across the network. However, it is crucial to understand that this alert does not confirm malicious intent on its own, as legitimate use of the Pilixo tool can trigger this detection.

  ### Investigation Steps

  - **Examine process creation events:** Investigate Security Event ID 4688 or Sysmon Event ID 1. Look for processes with the image path ending in `\rdp.exe` or `\Pilixo_Installer*.exe`. Benign indicators typically show known software with a valid path and timestamp.

  - **Validate parent-child process relationships:** Check the `ParentImage` field in the event logs. A legitimate use will typically show common remote access tools in the parent process, while processes with unusual parent-child hierarchies may indicate malicious usage.

  - **Correlate with user activity logs:** Review user activity from the Security logs (Event ID 4624) around the time of the suspected process execution, looking for authenticated access via RDP or unusual logins that do not match typical user behavior.

  - **Verify asset criticality:** Identify if the affected system is classified as critical within your organization. Compromise of critical assets via RMM tools can have a significant impact.

  - **Check for file creation artifacts:** Monitor the file system for any recent artifacts associated with Pilixo, such as installation logs or configuration files, which might provide additional context on the application's legitimate use versus potential exploitation.

  - **Assess network traffic related to remote access:** Investigate network logs for connections corresponding with the times the Pilixo processes were initiated, checking for unusual external IP addresses or connections on non-standard ports that might suggest malicious C2 communication.

  ### Prioritization

  This alert carries a medium severity rating due to the risk of unauthorized remote access to critical systems via the Pilixo tool, which has the potential for significant impact if abused. The likelihood of exploitation is moderate, as tools like Pilixo can be weaponized by adversaries, making it essential to swiftly investigate alerts related to its activity.

  ### Blind Spots and Assumptions

  There are limitations to this detection, particularly as legitimate activity involving Pilixo can generate false positives. It also assumes proper logging configurations are in place to capture process creation events and network activity relevant to remote access. Legitimate administrative actions by IT personnel may unintentionally trigger this alert. Consider implementing companion detections for known remote access tools or anomalous RDP login patterns to enhance coverage.

