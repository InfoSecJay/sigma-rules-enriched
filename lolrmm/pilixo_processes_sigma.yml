note: |
  ### Technical Context
  This detection rule identifies potential process activity associated with the Pilixo Remote Monitoring and Management (RMM) tool. The primary objective behind monitoring for Pilixo activity stems from its misuse in unauthorized remote access scenarios, where threat actors leverage such tools to compromise systems and gather sensitive information. Detecting legitimate installations or instances of the Pilixo RMM being utilized under malicious pretenses is crucial in preventing unauthorized activities that could lead to larger breaches.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (TA0002)**: This tactic focuses on how adversaries execute their malicious activities.
  - **User Execution (T1203)**: This technique involves users inadvertently executing malicious content.

  The primary data sources for this detection include Windows process creation events, which record information about processes that are started, including their parent-child relationships. This allows analysts to identify the context in which the Pilixo RMM is being executed.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation logs for instances of `Pilixo_Installer*.exe` or `rdp.exe` being executed. Pay special attention to parent-child relationships, noting any suspicious origins.
  - **Analyze Remote Desktop Sessions**: Investigate concurrent Remote Desktop Protocol (RDP) sessions and confirm the legitimacy of users accessing the system. Verify if the sessions correlate with the detected processes.
  - **Check for Anomalous Behavior**: Look for unusual behavior associated with the detected processes, such as unauthorized access to sensitive files or network activity indicative of data exfiltration.
  - **Validate Installer Sources**: Assess the sources from which `Pilixo_Installer*.exe` was executed. Ensure they originate from trusted locations to rule out potential malicious installations.

  ### Prioritization
  Given the medium severity level assigned to this alert, it is essential to prioritize it in an enterprise environment. The potential for remote access tools like Pilixo to facilitate unauthorized control over systems amplifies the threat's impact and highlights the importance of swift investigation and mitigation.

  ### Blind Spots and Assumptions
  While this rule aims to detect Pilixo RMM activity through process creation, there is a risk of false negatives, particularly if attackers employ alternative methods or rename executables. The logic assumes typical parent processes involved in legitimate use cases. Additionally, the detection relies on appropriate logging configurations for Windows processes to be enabled, as any gaps in logging or misconfigurations could hinder detection efficacy.

