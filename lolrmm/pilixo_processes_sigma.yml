note: |
  ### Technical Context

  This rule detects instances of the Pilixo Remote Monitoring and Management (RMM) tool, which can be used for both legitimate administrative purposes and malicious actions by attackers. The likely objective of the attacker using this tool would be to gain unauthorized remote access or control over systems, facilitating lateral movement or data exfiltration. This detection relates to the MITRE ATT&CK technique for Remote System Access (T1219).

  The primary telemetry sources include Windows process creation logs indicating the execution of certain processes, specifically `rdp.exe` and `Pilixo_Installer*.exe`. If discovered in a malicious context, this activity could enable significant security risks, such as unauthorized data access and system control. However, it is critical to note that the detection of these processes does NOT inherently confirm malicious activity without further context or investigation.

  ### Investigation Steps

  - **Examine process creation events**: Check Windows Security Event ID 4688 for recent process creation. Look for `Image` field entries such as `rdp.exe` or `Pilixo_Installer*.exe`. Confirm if the parent process aligns with the RMM usage.

  - **Identify unusual parent-child relationships**: Review the parent process behavior in the same logs. Legitimate scenarios may involve expected administrative strings or remote control tools initiated by users, while unexpected parents (e.g., `cmd.exe`) could indicate suspicious activity.

  - **Assess network connections**: Analyze Windows Firewall logs for outbound connections initiated by `rdp.exe` or Pilixo-related binaries. Monitor for unusual IP addresses and domains accessed during their execution.

  - **Review historical context**: Validate the installation history of the Pilixo tool, focusing on `Application` log types for any installation or configuration events. Legitimate installations will often show up in standard change-control communications.

  - **Correlate with other security alerts**: Check SIEM for additional alerts or logs that indicate suspicious user behavior or repeated access attempts from the same user accounts as the detected processes. Consolidate findings to support or negate malicious activity.

  ### Prioritization

  This alert is considered medium severity due to its potential impact on secure systems, especially if the detected processes relate to unauthorized access attempts. The likelihood of malicious use is moderate, given that RMM tools like Pilixo can be exploited by attackers for persistence and remote control. While not universally weaponized, the misuse of RMM tools is a growing trend in cyber threats.

  ### Blind Spots and Assumptions

  This detection may not capture all instances of Pilixo use, especially if log sources are improperly configured or if the tool has been renamed. Legitimate administrative tasks or software deployments using Pilixo may result in similar alerts. It would be beneficial to pair this detection with ingress/egress firewall logs that identify unusual external connections to enhance coverage.

