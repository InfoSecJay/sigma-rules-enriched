note: |
  ### Technical Context

  This rule detects potential process activity associated with the RemoteCall RMM (Remote Monitoring and Management) tool. Adversaries may use RMM tools for remote access and control of compromised systems, often aiming to exfiltrate data or deploy additional malicious payloads. The relevant MITRE ATT&CK techniques include **Execution** and **Remote Services (T1219)**, as the detected processes are often leveraged for remote control.

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on event ID 4688 in Security logs and Sysmon event ID 1. If this activity is confirmed malicious, it can indicate significant security risks, including unauthorized access and potential data breaches. However, detection of this rule alone does not confirm an active compromise; legitimate use of the RemoteCall RMM tool can trigger the alert.

  ### Investigation Steps

  - **Review process creation events:** Examine Windows Security Event ID 4688 and Sysmon Event ID 1 logs for any instances of the process creating events. Focus on the creation of processes with parent images such as `rcengmgru.exe`, `rcmgrsvc.exe`, or `remotesupportplayeru.exe`.
  - **Analyze parent-child relationships:** Investigate the parent-child process relationships in the logs. Verify if known legitimate remote control software was used legitimately by authorized personnel. Look for unusual process spawning or unexpected parents that are not typical for daily operations.
  - **Correlate with behavioral context:** Cross-reference the detected process activity with user activity logs and access patterns. Determine if the originating user has the required permissions for RMM tool usage, indicating legitimate administration or potential abuse.
  - **Identify rogue installations:** Check for the presence of RMM installation artifacts or configuration files in the directories associated with the RemoteCall application (e.g., `C:\Program Files\RemoteCall\`). Ensure the associated files are common for legitimate installations.
  - **Report suspicious IP addresses:** If detected processes communicate with external IP addresses, correlate those IPs against threat intelligence sources. Look for blacklisted or suspicious addresses that could indicate malicious command-and-control activity.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on critical systems if RMM tools are abused by an adversary. The likelihood of malicious usage is concerning but depends on the organization's standard operations regarding remote management tools. This behavior can be weaponized by attackers to gain persistent access and control over compromised environments.

  ### Blind Spots and Assumptions

  This detection may be evaded if an attacker uses alternative names for RMM processes or custom-built remote access tools. Reliable detection also requires full logging configuration for both Windows Security and Sysmon. Legitimate RemoteCall activities may trigger these alerts when used appropriately by system administrators. Companion detections, such as monitoring network traffic for unusual outbound connections (e.g., port scanning or foreign API communications), may strengthen overall coverage and context around this alert.

