note: |
  ### Technical Context

  This rule detects network connections to domains associated with the Faronics Core RMM tool, which is commonly used for remote management and monitoring of endpoints. Attackers may leverage this tool to exploit vulnerabilities or maintain persistence in a network by blending it with legitimate remote management operations.

  This detection corresponds to the MITRE ATT&CK tactic of Command and Control (T1071) and technique of Application Layer Protocol (T1219). The primary telemetry source is Windows network connection logs that capture outbound traffic to specified Faronics-related domains. If malicious, such connections may lead to unauthorized access or data exfiltration.

  It is crucial to note that this detection does NOT confirm malicious activity on its own; it only indicates a connection attempt to specific domains associated with Faronics, which may also be used legitimately by system administrators.

  ### Investigation Steps

  - **Validate the source of the connection:** Check Event ID 5156 in Windows Security logs for details about the outgoing connection and confirm the process initiating the connection for legitimacy.

  - **Review the process details:** Use Sysmon Event ID 3 to get information on the process that established the connection. Look for unexpected executables or scripts that may indicate malicious behavior.

  - **Identify whether the tool is authorized:** Confirm with IT or asset management if Faronics Core RMM is a sanctioned tool on the network. Check for records or documentation of its deployment.

  - **Analyze domain resolution patterns:** Investigate DNS logs for resolution attempts to the Faronics domains, focusing on timestamps that correspond with the alert to help establish the timeline of the activity.

  - **Correlate with known baseline behavior:** Compare with historical data for your environment. Legitimate usage of Faronics typically includes scheduled maintenance windows or consistent connection patterns; deviations may warrant further scrutiny.

  - **Check for sensitive data exfiltration:** Look at Windows Event ID 4663 for file access attempts to determine if there was any unauthorized data access or exfiltration during the detected connections.

  ### Prioritization

  This alert is of medium severity. While the Faronics Core tool is legitimate, unauthorized connections could indicate malicious intent to manage or exploit systems. The potential for both command and control and lateral movement remains concerning, given the existing knowledge of adversaries weaponizing legitimate tools.

  ### Blind Spots and Assumptions

  Detection may be limited if Faronics-related traffic is masked or if attackers use encrypted channels. Ensure proper logging configurations are in place to capture all necessary network connection events. Legitimate administrative tasks might trigger this alert, leading to false positives without additional context. A companion detection to consider would be monitoring for anomalous administrative access patterns that could corroborate potentially malicious use of this tool.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
