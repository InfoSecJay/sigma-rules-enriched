note: |
  ### Technical Context

  This rule detects outbound network connections to known Faronics Core RMM (Remote Monitoring and Management) domains, indicating potential use of this tool for remote access or management of systems. An attacker may use Faronics Core RMM to manage compromised systems, allowing for persistence, data exfiltration, or further exploitation within the network. The relevant MITRE ATT&CK tactic is Execution, specifically technique T1219 (Remote Access Software).

  Primary telemetry sources include Windows network connection logs, specifically looking for event logs showcasing outbound connections to hostnames associated with Faronics. The security impact is significant, as an attacker leveraging this tool can establish remote access, potentially leading to data breaches or unauthorized system modifications. It is important to note that this detection does NOT confirm malicious intent on its own, as Faronics Core may be legitimately used in enterprise environments.

  ### Investigation Steps

  - **Identify outbound connections:** Check Windows Security Event ID 5156 (Windows Filtering Platform) for network connections to `upd.faronicslabs.com` or other Faronics domains. Note the process and user context associated with these connections.

  - **Validate legitimacy of the tool:** Review installed software inventory (e.g., via Windows Event ID 7036 or software inventory tools) for instances of Faronics Core RMM. Confirm normal operational hours and expected usage.

  - **Examine process creation:** Look for related process creation in Sysmon Event ID 1 associated with the connections, particularly processes run by service accounts or non-administrative users. Identify any unusual parent-child process relationships.

  - **Assess frequency of connections:** Determine the frequency and volume of connections to these domains. Consistent or high-volume connections could indicate unauthorized activity versus legitimate management tasks.

  - **Evaluate user behavior:** Analyze the user or service account initiating the connections. Legitimate management activities generally occur during maintenance windows and involve known administrative accounts.

  - **Check for additional indicators:** Review for any related alerts or detections around file accesses or changes (like Event ID 4663) post-connection, assessing if data exfiltration or lateral movement occurred in conjunction with RMM activations.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of exposing compromised systems. The likelihood of malicious abuse is moderate, particularly in environments where this tool is not widely deployed. Remote access tools like Faronics are known to be exploited by attackers for gaining control over systems.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate users may trigger alerts when performing normal management activities. Reliable detection requires comprehensive network monitoring to capture all outbound connections to the specified domains. Additionally, organizations using Faronics Core RMM must ensure that proper governance policies dictate its usage. A related detection to consider includes monitoring for unusual administrative task executions (e.g., executing scripts via PowerShell) that could indicate misuse of remote management capabilities.

