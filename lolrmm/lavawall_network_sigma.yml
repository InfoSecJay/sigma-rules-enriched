note: |
  ### Technical Context

  This rule detects potential network connections to known Lavawall RMM (Remote Monitoring and Management) tool domains, indicating possible malicious activity related to command-and-control (C2) communications. The likely objective of an attacker using this tool is to gain persistent access to the victim's environment, allowing for remote manipulation and command execution. This detection correlates with the MITRE ATT&CK framework under the tactic "Command and Control" (ID: TA0011) and technique "Application Layer Protocol" (TID: T1219).

  The primary telemetry source for this rule is Windows network connection logs which capture outbound connections, specifically focusing on domains associated with the Lavawall RMM tool. If confirmed malicious, this behavior can lead to unauthorized access to sensitive systems, data exfiltration, and further lateral movement within the network. It is important to note that this detection alone does not confirm malicious activity, as legitimate usage of the Lavawall tool may occur in administrative contexts.

  ### Investigation Steps

  - **Review network connection logs:** Examine Windows Event ID 5156 (Windows Filtering Platform) or Sysmon Event ID 3 for outbound connections to 'api-ca-1.lavawall.com', 'lavawinupdate.lavawall.com', or 'caremote1.lavawall.com'. Look for connections made during anomalous hours or from unusual internal IPs.

  - **Assess asset role and criticality:** Determine which hosts initiated the connections. Prioritize investigation if connections are observed on critical assets such as servers or workstations with sensitive data or elevated privileges.

  - **Identify expected legitimate usage:** Understand the organization's use of Lavawall RMM for legitimate administrative tasks. Confirm whether any policy or documentation supports such connections.

  - **Gather contextual endpoint data:** Collect additional telemetry from the endpoint (e.g., process creation events via Sysmon Event ID 1) to check for any processes related to Lavawall (e.g., LOLRMM.exe) that may have attempted to launch network connections.

  - **Look for high-confidence malicious indicators:** Search for the presence of known malicious binaries and payloads related to Lavawall installations on the endpoint. Check for file creation events in the Windows Security logs (Event ID 4648) corresponding to unusual or unexpected installations.

  ### Prioritization

  This alert is rated medium severity due to the potential impact on network security if an RMM tool is exploited for unauthorized access. The likelihood of abuse is moderate, as the specific domains are associated with an RMM tool that might be misused by an adversary. While this tool can be used legitimately, the provided domains have been identified as potential C2 endpoints by threat intelligence.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate user activity can trigger the alert, such as authorized administrative use of the Lavawall RMM tool, leading to false positives. Reliable detection requires comprehensive logging of Windows network connections and potential coverage of outbound firewall logs. Related detection to consider includes monitoring for application-layer protocol anomalies which can indicate misuse beyond just the Lavawall domains.

