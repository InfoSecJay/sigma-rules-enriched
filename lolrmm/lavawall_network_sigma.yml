note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to known Lavawall RMM (Remote Monitoring and Management) tool domains, suggesting potential command-and-control (C2) activity. The likely attacker objective involves gaining unauthorized remote access to compromised systems for surveillance, control, or further exploitation. This behavior correlates with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique T1219 (Remote Access Software).

  Primary telemetry sources for this detection include Windows network connection logs that detail DNS resolutions and outbound connections. The security impact of malicious activity here could lead to data breaches, unauthorized access, and prolonged system compromise. Importantly, this detection does NOT confirm malicious intent; legitimate usage of Lavawall may trigger this rule, necessitating further investigation.

  ### Investigation Steps

  - **Examine Network Connections:** Review Windows network connection logs for Event ID 5156 (Windows Filtering Platform) that show connections to any Lavawall domains. Malicious indicators include multiple failed connections followed by successful attempts.

  - **Check for Legitimate Use Case:** Identify if any systems are known to use Lavawall software legitimately. Validate internal documentation, asset inventories, or user tickets to understand if the behavior aligns with authorized RMM usage.

  - **Correlate with Active Threat Intelligence:** Cross-reference the detected connections with threat intelligence feeds to determine if the detected domains are associated with known malicious activity or recent campaigns.

  - **Inspect DNS Queries:** Analyze DNS event logs (Event ID  DNS Client Events) for queries going to the identified Lavawall domains. Look for anomalous or unexpected DNS lookups indicative of potential compromise.

  - **Identify New Process Instantiation:** Investigate for correlated Windows Event ID 4688 entries that show command-line execution involving Lavawall domains or associated remote access tools, as this indicates malicious exploitation or deployment.

  - **Audit System Roles and Criticality:** Assess the role and criticality of the affected systems. RMM tools on high-value assets pose greater risk; prioritize these investigations.

  ### Prioritization

  This alert carries a medium severity due to its potential impact on critical infrastructure via unauthorized remote access tools. The likelihood of malicious abuse is moderate, as legitimate use of RMM software exists, but threats employing these tools have been documented, increasing the necessity for vigilant review.

  ### Blind Spots and Assumptions

  Detection effectiveness is limited by potential evasion techniques, such as encrypted C2 traffic or alternative domains not included in the detection. It requires comprehensive logging configurations for Windows network connections and DNS events. Legitimate administrative activities related to remote management may trigger this rule. A related detection could involve monitoring for unusual administrative login behaviors or the execution of remote management software from non-standard endpoints.

