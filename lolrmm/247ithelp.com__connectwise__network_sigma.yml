note: |
  ### Technical Context

  This rule detects network connections to the domain `247ithelp.com`, associated with the ConnectWise remote monitoring and management (RMM) tool, which can be used by adversaries for command and control (C2) activities. The likely attacker objective could involve exploiting RMM tools to maintain persistence, manage compromised systems, or exfiltrate data. Relevant MITRE ATT&CK tactics are "Command and Control" (TA0011) and "Exfiltration Over Command and Control Channel" (T1041). The primary telemetry source is Windows network connection logs, often captured via Security Event ID 5156 (Windows Filtering Platform) or firewall logs indicating outbound connections. If this behavior is malicious, it may enable an attacker to control a system remotely and execute further malicious activity. This detection does NOT confirm that malicious activity has taken place, as legitimate use of the ConnectWise tool may trigger the same alerts.

  ### Investigation Steps

  - **Check network connection logs**: Review logs for Security Event ID 5156 to capture outbound connections and confirm if they are targeting `*.247ithelp.com`.

  - **Analyze connection timing**: Identify the timestamps of the detected connections. Legitimate ConnectWise usage may align with regular maintenance windows or specific business operations.

  - **Review process creation events**: Utilize Sysmon Event ID 1 to identify processes initiating the outbound connection. Look for recognized ConnectWise executables, which could indicate benign activity, versus unknown processes.

  - **Correlate with user activity**: Investigate recent user actions using Event ID 4624 (Logon) to determine if the connection correlates with a known admin logging in, supporting a benign interpretation of the activity.

  - **Identify repetitive connection attempts**: Monitor for multiple or anomalous connections to `247ithelp.com` within a brief time frame, which can indicate potentially scripted malicious behavior.

  - **Inspect for exfiltration artifacts**: Check for unusual file creation or modifications on system drives (e.g., via Event ID 4663 or shadow copies) that exploit the RMM tool's functionality to exfiltrate sensitive data.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on critical systems, especially in environments where RMM tools are not commonly used. The likelihood of malicious abuse is moderate as attackers may leverage legitimate tools, making identification of actual malicious intent more challenging. This type of behavior is increasingly weaponized by adversaries to facilitate control over environments following initial compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of ConnectWise which could result in false positives; ensure proper baselining of expected RMM tool behavior. Reliable detection also requires comprehensive logging settings for Windows firewall and connection events. Legitimate network operations related to IT support or maintenance may trigger this alert. A companion detection to strengthen coverage could involve monitoring for suspicious API calls related to other known RMM tools.

