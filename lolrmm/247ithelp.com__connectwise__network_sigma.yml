note: |
  ### Technical Context

  This Sigma rule detects network activity targeting domains associated with the ConnectWise Remote Monitoring and Management (RMM) tool, specifically hosts ending in `.247ithelp.com`. The rule aims to identify potential unauthorized access or management attempts by adversaries leveraging this RMM tool. The likely attacker objective can include executing remote commands, data extraction, or establishing persistence within the network environment. This activity is categorized under the MITRE ATT&CK tactic "Execution" and technique "Remote Services" (T1219).

  Primary telemetry sources for this detection are Windows network connection logs, where specific fields include `DestinationHostname`. If this activity is malicious, it could allow attackers to control endpoints and access sensitive data remotely. It is critical to note that this detection does not confirm nefarious intent on its own; legitimate use of ConnectWise for remote management can trigger this alert.

  ### Investigation Steps

  - **Check event logs for related connections:** Review Windows Event ID 5156 to find connections matching `DestinationHostname` of `*.247ithelp.com`. Confirm if the connection was established during a time of known business activity or outside typical hours.

  - **Assess process integrity:** Validate if any allowed management processes (e.g., `connectwise.exe`) initiated the connection via Process Creation logs (Event ID 4688). Connection from common user processes (e.g., `explorer.exe`) could indicate potential misuse.

  - **Review authorized usage:** Identify any IT personnel or departments typically using ConnectWise. Cross-reference with user account activity to distinguish between expected and anomalous connections to the domain.

  - **Correlate IP addresses and geolocation:** Compare the IP address associated with this domain against known geolocation services to identify if the connection originated from an unauthorized geographical location.

  - **Monitor for additional suspicious behavior:** Check Sysmon Event ID 3 for unusual network activity or command execution patterns following connections to `247ithelp.com`. Indicators like unusual command lines or unexpected connections during off-hours may suggest a compromise.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems if unauthorized access is granted through the RMM tool. The risk of abuse is moderate, considering that adversaries often utilize legitimate tools for malicious purposes, making it essential to discern between benign and malicious activity.

  ### Blind Spots and Assumptions

  Detection is limited by the legitimate use of ConnectWise, which could result in false positives, particularly if systems are managed via this tool. Proper logging configuration is required for reliable detection, including enabling Windows Firewall log settings. Legitimate IT administration activities could trigger this alert. A related detection rule targeting unusual remote desktop connection attempts would complement coverage against unauthorized access.

