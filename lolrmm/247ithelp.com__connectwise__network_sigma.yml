note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to hostnames ending with `247ithelp.com`, associated with the ConnectWise Remote Monitoring and Management (RMM) tool. The likely attacker objective could be to establish a command and control (C2) channel or utilize remote management capabilities for malicious actions. This behavior aligns with the MITRE ATT&CK technique for Remote Services (T1219) under the Command and Control tactic.

  Primary telemetry sources include Windows network connection logs. Analyzing these logs helps to identify potential misuse of legitimate RMM tools for malicious purposes, such as establishing unauthorized access to systems. This detection does NOT confirm malicious activity on its own; it simply indicates potential use of the RMM tool, which can also be legitimate.

  ### Investigation Steps

  - **Review network connection logs**: Analyze Windows Event ID 5156 (Windows Filtering Platform) for any connections to `*.247ithelp.com`. Look for an unexpected process initiating these connections, especially on critical assets like servers.

  - **Identify legitimate activity**: Verify if there are approved ConnectWise tools in use within the organization. Check asset management records against the identified connections to see if they align with known RMM activities.

  - **Examine related process creation**: Look for process creation logs (Event ID 4688) associated with established connections to `247ithelp.com`. Focus on instances where the parent process is not a known RMM service, indicating potential misuse.

  - **Check for unusual traffic patterns**: Use network monitoring tools to illustrate traffic to `247ithelp.com`. Investigate large data transfers or anomalous connection attempts outside regular business hours for further indication of unauthorized use.

  - **Correlate with user activity**: Analyze user activity logs (e.g., Event ID 4624 for logins) around the time of the network connections. Look for aberrations such as unexpected logins from administrative accounts or from unusual geographic locations.

  ### Prioritization

  This alert has medium severity due to the potential use of a legitimate RMM tool being exploited for malicious purposes. The commonality of remote management tools in enterprise environments increases the chance of abuse, especially if inadequate access controls are in place. While the tool itself is widely used, its misuse can lead to significant security implications.

  ### Blind Spots and Assumptions

  Evasion techniques may include the use of VPNs or encrypted tunnels to mask connections to `247ithelp.com`, making detection challenging. Reliable detection requires complete logging of outbound connections and process creation events. Legitimate external support or maintenance operations could trigger this alert. Companion detections, such as those capturing other known C2 patterns or suspicious remote access tools, can enhance overall security posture.

