note: |
  ### Technical Context
  This rule detects the potential usage of the BeamYourScreen remote management tool via its associated process activity. BeamYourScreen is a remote desktop application that allows users to connect to and control remote computers. While it can be used legitimately for technical support and remote access, it is also a vector that attackers might exploit to gain unauthorized access and maintain persistence within a compromised environment. By monitoring for the execution of `beamyourscreen.exe` and `beamyourscreen-host.exe`, this rule aims to uncover any unauthorized or suspicious remote management activity.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) since the detection focuses on the execution of specific processes. The specific technique associated with this behavior is **Command and Scripting Interpreter** (T1219), which involves attackers using various remote management tools to execute commands on compromised systems. Detection of this activity is crucial for identifying potential breaches and recognizing the escalation of privileges that may occur through these tools.

  Primary data sources for detecting BeamYourScreen activity are Windows process creation logs, which provide information on executed processes along with their parent processes. These logs help identify when and where the RMM tool is being initiated, offering insights that are vital for forensic analysis and incident response.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation events specifically looking for `beamyourscreen.exe` or `beamyourscreen-host.exe` and their parent process information to determine the context of execution.

  - **Analyze Parent Process Context:** Investigate the parent process associated with the BeamYourScreen executables. Look for unusual or unauthorized applications that may indicate an unauthorized use case.

  - **Correlate User Activities:** Check user account activity around the time of the detected process execution. Ensure that the user is authorized to conduct remote management and verify if they followed proper procedures.

  - **Examine Network Connections:** Look at network logs for any remote connections established from the machine where the RMM tool was detected. This can help identify further malicious actions by uncovering subsequent communications to known threat actor IPs or domains.

  ### Prioritization
  The alert is marked as medium severity due to the potential impact of unauthorized remote access, which could lead to data exfiltration or system compromise. However, legitimate activities involving BeamYourScreen may also trigger the alert, necessitating careful contextual investigation.

  ### Blind Spots and Assumptions
  This detection logic assumes that the presence of specific process names is indicative of potential malicious behavior without accounting for legitimate uses of BeamYourScreen. There may be gaps in detection if the tool's executables are renamed or if other remote management tools are utilized. Furthermore, this rule relies on comprehensive process creation logs, which must be enabled and properly configured to ensure complete coverage of all process executions, including those spawned by legitimate administrative actions.

