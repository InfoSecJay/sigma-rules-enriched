note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the BeamYourScreen Remote Management and Monitoring (RMM) tool. The behavior being monitored includes both direct invocation of the BeamYourScreen executables and parent processes that utilize these executables, indicating remote administrative or monitoring activity. The likely attacker objective could involve unauthorized remote access or control of a target system, which goes against the principles of integrity and confidentiality.

  This detection relates to the MITRE ATT&CK framework, specifically to the tactic "Execution" and technique "Remote Services: RMM" (T1219). Primary telemetry sources for this detection include Windows process creation logs, particularly focusing on Event ID 4688 from the Security log and Sysmon Event ID 1. If these processes are executed maliciously, they can potentially grant an unauthorized party control over a compromised system. It is important to note that this detection alone does NOT confirm malicious intent, as legitimate usage of BeamYourScreen may occur in a corporate environment.

  ### Investigation Steps

  - **Check process execution details:** Review Security Event ID 4688 and Sysmon Event ID 1 logs for prior execution of `beamyourscreen.exe` or `beamyourscreen-host.exe`. Note the user context and command-line arguments for signs of unauthorized usage.

  - **Identify the parent process:** Examine the parent process of detected BeamYourScreen activities. Legitimate use cases often involve sysadmin tools; alert on atypical parent processes or non-standard user accounts initiating these executions.

  - **Audit user accounts involved:** Investigate the user account that executed the BeamYourScreen processes. Look for accounts with administrative privileges or unusual access patterns, such as remote login followed by the execution of the RMM tool.

  - **Correlate with network activity:** Analyze network traffic for connections to known BeamYourScreen servers during the time of execution. Watch for anomalous outbound traffic to unexpected IPs, suggesting potential command and control (C2) behavior.

  - **Review logs for prior legitimate usage:** Search for legitimate instances of BeamYourScreen within your environment to establish a baseline. Check for any prior User-initiated actions, such as scheduled maintenance or remote support sessions.

  - **Document signs of exploitation:** Look for indicators of privilege escalation or lateral movement in conjunction with BeamYourScreen activity, such as unexpected system command executions or changes in system configurations.

  ### Prioritization

  This alert should be treated as a medium-severity incident due to the potential impact on affected systems, particularly if administrative access is gained. While BeamYourScreen may have legitimate business applications, the likelihood of abuse in an attacker’s toolkit, especially in compromised environments, raises concerns that merit further investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers rename legitimate executables or utilize other remote access tools that are not monitored. Ensure that Windows event logging and Sysmon are configured correctly for complete visibility into process creations. Legitimate activities that might trigger this alert include IT support or remote management sessions. Strengthening coverage could include detecting other RMM tools (e.g., TeamViewer, AnyDesk) to correlate with potential abuse patterns.

