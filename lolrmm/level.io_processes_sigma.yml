note: |
  ### Technical Context

  This rule detects the use of the Level.io Remote Monitoring and Management (RMM) tool on Windows systems. Attackers may deploy RMM tools to maintain persistence and perform remote system management, often as part of lateral movement or to facilitate other malicious activities. This behavior fits into the MITRE ATT&CK framework under the "Execution" tactic (TA0002) and the technique “Remote System Management” (T1219).

  The primary telemetry sources required for this detection are Windows process creation logs, specifically focusing on Event ID 4688, which captures the creation of new processes. The potential security impact could include unauthorized access and control over affected systems if this tool is employed maliciously. However, it’s important to note that the detection of this process activity does not inherently confirm malicious intent, as Level.io could be used legitimately within organizational IT operations.

  ### Investigation Steps

  - **Review process creation events:** Check Windows Security Event ID 4688 for processes launching "level-windows-amd64.exe," "level.exe," or "level-remote-control-ffmpeg.exe." Confirm the user and source of the invocation to determine if it's an expected administrative action.

  - **Analyze parent process relationships:** Extract the ParentImage field from Event ID 4688 records to identify the parent process. Legitimate usage is often initiated by trusted administrative tools or system shells, while suspicious activity may show unexpected parents like cmd.exe or powershell.exe.

  - **Check for network activity originating from the detected processes:** Review Network connections via Windows Firewall logs or Sysmon Event ID 3. Look for unusual outbound connections to unknown IP addresses, especially involving the detected RMM processes, as this may indicate potential Command and Control (C2) communications.

  - **Validate file artifacts:** Investigate the file system for recent changes or the creation of files associated with Level.io via file system logs or direct file inspections. Checks should focus on established RMM directories (e.g., typical installation paths), looking for newly modified or created files.

  - **Assess user behavior and role context:** Determine if the user executing the process is classified as administrative or if the activity was initiated by a standard user account. Unauthorized usage by non-administrative users warrants immediate investigation.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized RMM tool usage on sensitive systems. The likelihood of exploitation is moderate; RMM tools are often abused in cyberattacks. This behavior is not commonly weaponized but represents a significant risk if misused by an adversary or inside threat.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming legitimate tools or utilizing system-native tools to achieve malicious ends. Reliable detection requires continuous monitoring of process creation logs. Legitimate IT support teams may trigger alerts when performing maintenance or support tasks. A related detection could involve monitoring network activity for known C2 patterns linked to RMM tool usage, aiding in more comprehensive visibility.

