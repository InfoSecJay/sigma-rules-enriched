note: |
  ### Technical Context
  This detection rule identifies potential malicious activity associated with the Level.io Remote Monitoring and Management (RMM) tool. Level.io is a management software often used for remote system administration; however, it may also be misused by threat actors for unauthorized access and control of target systems. The primary objective of an attacker deploying such tools is to maintain persistence, conduct reconnaissance, and facilitate data exfiltration or lateral movement within a compromised network.

  The relevant MITRE ATT&CK tactics for this rule include **Execution** (TA0002) and **Remote Services** (T1219), as the execution of Level.io processes can lead to the unauthorized control of systems remotely. It is essential for threat responders to be aware of this activity within their environment to prevent potential exploitation and misuses of legitimate administrative tools.

  Primary data sources for this detection include **Windows process creation logs**, which capture details about executed processes, including their parent and child relationships, necessary for identifying potentially malicious process activities related to the Level.io RMM tool.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze Windows process creation logs for instances of `level-windows-amd64.exe`, `level.exe`, or `level-remote-control-ffmpeg.exe`. Pay attention to their parent processes to determine if they originated from legitimate applications.

  - **Identify Suspicious Parent Processes:** Investigate the parent processes associated with the detected Level.io executables. Legitimate uses might show common administrative applications, while unusual parent processes could indicate malicious intent.

  - **Check for Unusual Network Connections:** Monitor network logs for any unexpected outbound connections that originate from the identified Level.io processes. This could help determine whether the tool is being used for remote access in a potentially malicious manner.

  - **Correlate with User Activity Logs:** Look for corresponding user activity in audit logs or authentication logs in conjunction with the process detections. Compare logins or actions by users at times when Level.io processes were initiated.

  ### Prioritization
  This alert is considered **medium severity** given that the use of RMM tools like Level.io can indicate either legitimate administrative actions or unauthorized access attempts by attackers, making it essential to differentiate between benign and malicious uses quickly.

  ### Blind Spots and Assumptions
  There may be gaps in detection where legitimate Level.io usage overlaps significantly with malicious activity, leading to false positives. The detection logic assumes that any process initiation from Level.io executables is suspicious unless otherwise verified by contextual indicators. Effective monitoring of this alert requires proper logging configurations, including process creation events, which must be enabled to ensure visibility into process execution on Windows systems.

