note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the RdViewer Remote Monitoring and Management (RMM) tool, specifically targeting various files and executables typically used in such software deployments. The likely attacker objective is remote access and control over infected machines, allowing for data exfiltration, lateral movement, or persistent control after compromise. This detection relates to the MITRE ATT&CK tactic of Command and Control and technique T1219 (Remote Access Software).

  The primary telemetry sources are Windows file event logs, capturing changes related to known RdViewer executable and configuration files. If malicious, usage of this software can indicate unauthorized remote management, culminating in potential data breaches or system manipulation. Notably, this detection does NOT confirm malicious intent on its own, as RdViewer can be legitimately used in corporate environments for remote technical support.

  ### Investigation Steps

  - **Check recent file modifications:** Review Windows Event ID 4663 (File Access Attempt) for the specified RdViewer files under `C:\Program Files (x86)\rdviewer\` and `C:\ProgramData\host\`. Look for modifications made by unusual users or processes from unexpected IP addresses.

  - **Identify source process:** Use Sysmon Event ID 1 to find the process creating or modifying any of the detected files. Investigate if the parent process aligns with known IT support or administrative tools or if it appears suspicious.

  - **Review scheduled tasks:** Investigate for scheduled tasks (Task Scheduler) initiating the `rdclient.exe`, particularly any that are set to run outside normal operational hours. Verify if these tasks are tied to legitimate use cases.

  - **Assess network communications:** Examine network logs for outbound connections from the affected hosts on ports typically used by RMM tools (e.g., port 3389 for RDP) around the timeframe of file activity, correlating this with known threat actor behavior.

  - **Identify legitimate usage patterns:** Confirm if RdViewer-related files are present as part of organizational tools, looking for established installation and access logs, including documentation of authorized personnel using the RMM tool.

  - **Determine high-confidence malicious indicators:** Investigate for unusual file creation or execution patterns linked to `dmservice.exe` or `diskmgr.exe`, ensuring they are not running under known system accounts or during expected maintenance windows.

  ### Prioritization

  The severity of this alert is medium, as the impact on administrative systems can be significant if utilized maliciously, leading to compromise or data theft. The likelihood of abuse is moderate, given that the software is commonly weaponized in targeted attacks aimed at creating persistent remote access.

  ### Blind Spots and Assumptions

  Detection limitations may include evasion techniques if an attacker uses legitimate-looking patterns or modifies filenames and paths to mask their actions. Required log sources include file system access logs and proper configuration of Sysmon to capture all relevant events. Legitimate activity may arise from IT departments using RdViewer for troubleshooting, highlighting the need for clear operational context. Related detections for remote access tools such as TeamViewer or AnyDesk could strengthen oversight and reduce false positives.

