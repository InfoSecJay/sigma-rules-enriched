note: |
  ### Technical Context

  This Sigma rule detects network activity associated with Electric AI (Kaseya) Remote Monitoring and Management (RMM) tool. The likely attacker objective is to establish a command-and-control (C2) channel to control compromised systems using the RMM tool’s functionalities. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), and the technique is "Application Layer Protocol" (T1219).

  The primary telemetry sources are network logs capturing outbound connections, specifically monitoring for DNS queries and TCP/UDP connections to domains ending with ".electric.ai". If malicious, this activity may indicate unauthorized access to systems allowing attackers to execute commands or exfiltrate data. However, this detection does NOT confirm that malicious activity is occurring on its own; legitimate use of the Kaseya tool can trigger this alert as well.

  ### Investigation Steps

  - **Check network connections to Electric AI domains**: Review network logs for outbound connections to `*.electric.ai` domains (e.g., using NetFlow or firewall logs). Correlate these connections with the affected host's role (e.g., IT management systems), noting that legitimate usage typically involves known IP addresses.

  - **Examine DNS Query Logs**: Validate DNS queries for the domains in question (Event ID DNS Query Logs). Confirm if any non-IT devices are making these requests, which may indicate suspicious activity.

  - **Review Process Creation Events**: Search for related process creation events (Security Event ID 4688) to identify any legitimate applications invoking connections to the identified domains. Look for typical application names linked to Kaseya, such as ‘KaseyaAgent.exe’.

  - **Identify patterns of repeated access**: Document the frequency and timing of connections to the identified domains. Consistent or anomalous attempts in 1-2 minute intervals could suggest scripted or automated behavior, indicating potential malicious intent.

  - **Correlate with user access controls**: Investigate the user context associated with the access to Kaseya applications. Analyze if the account has appropriate privileges or if there are inconsistencies in the allowed use of RMM tools.

  ### Prioritization

  This alert should be classified with medium priority due to the potential impact of compromised systems under RMM control. The likelihood of malicious abuse is moderate, especially in environments where Electric AI is not sanctioned or known. Considering that RMM tools are often weaponized for lateral movement, this should be treated with urgency.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive logging for all devices utilizing the tool. Evasion techniques include use of obfuscation or proxy services that mask communications to the detected domains. Legitimate activities that could trigger this alert include authorized remote management sessions, particularly during maintenance windows. A companion detection related to anomalous internal network traffic could strengthen coverage against misuse of RMM tools.

