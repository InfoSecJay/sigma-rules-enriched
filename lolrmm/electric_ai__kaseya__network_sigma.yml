  ### Technical Context

  This rule detects network connections to domains associated with Electric AI, a Remote Management and Monitoring (RMM) tool offered by Kaseya. Attackers may utilize this tool for unauthorized remote access, typically aiming to facilitate further attacks, lateral movement, exfiltration of data, or deployment of ransomware. The relevant MITRE ATT&CK tactic is Command and Control, with the technique ID T1219.

  The primary telemetry source is Windows network connection logs, which record outbound connections made by processes. If malicious, this behavior could lead to significant security incidents, including data breaches or system takeovers. It is important to note that this detection does not confirm that the access is malicious, as legitimate usage may occur in managed environments.

  ### Investigation Steps

  - **Review network connection logs:** Check Windows Event ID 5156 for outbound connections to any destination hostname ending with 'electric.ai'. Correlate with known legitimate usage to identify potential misconfigurations or unauthorized access.

  - **Identify the process initiating the connection:** Examine the process IDs associated with Event ID 5156 to determine which application initiated the connection. Legitimate processes (e.g., the Kaseya agent) should typically be present; unexpected processes may indicate malicious activity.

  - **Check for concurrent access patterns:** Analyze for multiple connections to 'electric.ai' in a short timespan (e.g., several attempts within minutes) which could indicate automated exploitation or lateral movement attempts.

  - **Validate the legitimacy of the tool's deployment:** Cross-reference the workstation’s installed software inventory against an approved software list to confirm that the Electric AI/RMM tool is authorized. Unauthorized installs represent a higher risk for malicious exploitation.

  - **Examine user activity logs:** Review user activity records and account management logs (e.g., Event ID 4624 for logon events) to determine whether the user triggering the connection had legitimate reasons or permissions to use the RMM software.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on systems utilizing RMM tools and the likelihood of malicious use. RMM tools are commonly weaponized for remote access; therefore, any unauthorized activity requires immediate attention, especially in critical infrastructure environments.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations on endpoints where RMM tools operate. Legitimate administrative activities, such as remote support by IT staff, may also trigger this alert without malicious intent. A related detection to consider is outbound connections to other known RMM platforms, which could strengthen monitoring capabilities and reveal broader adversary movement patterns.

