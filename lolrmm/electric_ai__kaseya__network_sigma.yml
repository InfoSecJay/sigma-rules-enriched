  ### Technical Context
  This rule detects potential network activity associated with the Electric AI (Kaseya) Remote Management and Monitoring (RMM) tool by monitoring for connections to hostnames that end with `electric.ai`. Such tools can be leveraged by attackers to maintain persistence, execute commands remotely, or exfiltrate data from compromised systems. The primary attacker objective in this context is to gain control over networked devices, enabling the manipulation and extraction of sensitive information while potentially compromising internal security controls.

  In terms of MITRE ATT&CK, this detection aligns with the Execution tactic, particularly the Remote System Discovery technique (T1219). By recognizing this activity, security operations teams can uncover whether anomalous remote access is occurring within their environment, which may suggest a deeper compromise or misuse of legitimate administrative tools.

  Data sources that provide the best evidence for this detection include Windows network connection logs, which detail outbound connections made by endpoint devices. Monitoring these logs can help organizations identify potentially illegitimate usages of RMM tools, especially in the wake of insider threats or cyber incidents.

  ### Investigation Steps
  - **Review Network Connection Logs:** Analyze Windows network connection logs to identify the source IP addresses initiating connections to `electric.ai`. Determine if any IP addresses are unusual for your network environment.
  - **Analyze System Activity:** Investigate processes or services on affected systems that may correlate with the identified outgoing connections, looking for unusual command executions or application behavior.
  - **Check User Accounts:** Verify the user accounts initiating the connections to see if they have legitimate reasons for using the RMM tool. Look for accounts with excessive or inappropriate permissions.
  - **Cross-Reference with Recent Incidents:** Review recent security incidents or alerts to assess whether the detected activity corresponds to known threats or high-risk operations already reported in the environment.

  ### Prioritization
  The alert is rated as medium severity because while the detection can indicate legitimate RMM tool use, it may also signify a security event if the tool is being misused. Organizations should treat such alerts seriously, especially if they suspect compromised accounts or unauthorized access.

  ### Blind Spots and Assumptions
  The detection logic assumes that segments of network traffic related to Electric AI will consistently maintain the same hostname. A significant blind spot exists if the attacker uses atypical domain names or modifies hostnames. Additionally, users may deploy legitimate services without alerting security teams, potentially leading to false positives. To ensure the effectiveness of the rule, logging of all outbound connections from Windows devices must be configured and retained, accounting for a variety of user scenarios.

