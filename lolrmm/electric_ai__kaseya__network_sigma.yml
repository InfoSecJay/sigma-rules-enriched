  ### Technical Context

  This rule detects network connection attempts to hosts with domain names ending in "electric.ai," indicative of potential activity by the Electric AI (Kaseya) Remote Monitoring and Management (RMM) tool. The likely attacker objective may involve unauthorized access to networked devices for data exfiltration, lateral movement, or command execution. This type of activity aligns with the MITRE ATT&CK technique for Remote Services (T1219).

  The primary telemetry sources for this detection are Windows Network Connection logs, tracking outbound connections on Windows endpoints. If malicious, such activity could facilitate a range of unauthorized actions leading to data compromise or service disruption. This detection does NOT confirm that the use of Electric AI is malicious, as it may also signify legitimate administrative use of the RMM tool.

  ---

  ### Investigation Steps

  - **Identify outbound connection attempts:** Check Windows Firewall logs (Event ID 5156) for connections to external hosts with a destination hostname ending in "electric.ai." Look for timestamps that align with the alert.

  - **Correlate with user activity:** Verify user account activity around the same timestamp in Security Event logs (Event ID 4624). Legitimate usage patterns should show expected administrator accounts; anomalous accounts may indicate potential credential compromise.

  - **Examine process associations:** Review Sysmon logs (Event ID 3 - Network connection) for processes that initiated these connections. Legitimate usages will typically correspond with known RMM tool processes, while suspicious processes warrant further investigation.

  - **Assess endpoint role and criticality:** Determine if the compromised endpoint is classified as a critical asset. RMM tools typically manage servers and key infrastructure components; unauthorized activity here is of high concern.

  - **Validate logging configuration:** Ensure proper logging is activated for RMM tools on all endpoints. Insufficient logging can lead to gaps in visibility for this type of detection.

  - **Identify known good activity:** Compare against documented usage of Electric AI (Kaseya) within the organization, noting regular admin maintenance windows and connection frequency to valid service endpoints.

  ---

  ### Prioritization

  The alert carries a medium severity level as it involves potential exploitation of an RMM tool, which could lead to significant data loss or operational disruption. However, the likelihood of malicious behavior is contingent upon the context of the activity and its correlation with known user behavior. This behavior, while not universally weaponized, has been exploited in past incidents.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate usage of Electric AI (Kaseya), leading to potential false positives. Dependencies on accurate network logs are critical; failures in logging configurations may obscure detection capabilities. Additionally, periods of high administrative activity could trigger alerts, necessitating an understanding of legitimate network utilization patterns. A related detection may include monitoring for unusual Service Account logins (Event ID 4624) that coincide with these network activities, reinforcing visibility into potentially unauthorized access.

