note: |
  ### Technical Context

  This detection identifies potential malicious network activity originating from the Dataplicity Remote Management & Monitoring (RMM) tool. Adversaries may utilize this tool to establish remote access to compromised hosts, facilitating ongoing control and further exploitation of the environment. The relevant MITRE ATT&CK technique is T1219 - Remote Access Software. The primary telemetry sources for detection are Windows network connection logs, looking specifically for connections to the Dataplicity domain names.

  If confirmed malicious, the impact could include unauthorized access to systems and sensitive data compromise. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of Dataplicity may also trigger the alert.

  ### Investigation Steps

  - **Review network connection logs for suspicious domains:** Check for connections to the following domains: 'dataplicity.com', 'www.dataplicity.com', and '*.wormhole.dataplicity.com' in Windows Security Event ID 5156 or Sysmon Event ID 3. Note the originating IP addresses for any unfamiliar sources.

  - **Assess the context of active sessions:** Examine user activity around the time of the detected connection. Look for Event ID 4624 (Logon) entries and correlate with the timestamps of the network connections to see if they match legitimate user behavior.

  - **Validate expected configurations:** Ensure that the Dataplicity tool is documented and approved for use within your organization. Map out legitimate use cases, including specific systems and authorized users who should be utilizing Dataplicity.

  - **Identify high-confidence malicious indicators:** Look for connections on non-standard ports or from unusual user accounts initiating connections to Dataplicity domains. Event ID 5156 will have fields such as 'Protocol' and 'Destination Port' that can indicate potential misuse.

  - **Check for persistent access attempts:** Investigate for any Event ID 4688 (Process Creation) logs that show unexpected processes launching shortly after the network connections to Dataplicity domains, indicating a possible compromise where the tool has been leveraged illicitly.

  ### Prioritization

  The alert is of medium severity as it involves potential command-and-control behavior, especially if discovered on critical assets or sensitive endpoints. The likelihood of malicious abuse is elevated due to the nature of the tool being used for remote access, which is often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of Dataplicity in corporate environments, potentially masking unauthorized access unless tightly controlled. Reliable detection requires comprehensive logging of network connections (Windows Event ID 5156) and process creations (Event ID 4688) across Windows systems. Legitimacy can be further complicated if an insider is misusing the tool. A companion detection to consider is monitoring for unusual user activity patterns linked to legitimate Dataplicity usage.

