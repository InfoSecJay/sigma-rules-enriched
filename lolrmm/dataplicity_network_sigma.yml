note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the Dataplicity Remote Management and Monitoring (RMM) tool, which may indicate unauthorized access or control over systems. Attackers leveraging RMM tools often aim to maintain persistent access to compromised devices, exfiltrate data, or deploy additional malware. The relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071) and Application Layer Protocol (T1219).

  The primary telemetry sources relevant to this detection include Windows network connection logs, specifically targeting outbound traffic. Malicious activity could allow an adversary to control devices remotely, leading to potential data breaches or malware deployment. However, it's important to note that this detection does NOT confirm that an attacker has successfully exploited a vulnerability or achieved full compromise on the host system.

  ### Investigation Steps

  - **Review network connection logs**: Examine Security Event ID 5156 to identify connections to `*.dataplicity.com` and any associated process information. Malicious indicators include unexpected outbound connections from sensitive systems (e.g., servers or management workstations).

  - **Identify associated process**: Cross-reference Event ID 4688 (process creation) with the network logs to determine the parent process initiating the outbound connection. Legitimate Dataplicity activity often originates from known management scripts or admin user actions.

  - **Check for recent changes**: Investigate any changes in group policy or software installations related to RMM tools on the affected host via Event ID 4101 or system change logs. Malicious use may occur without explicit administrative approval.

  - **Validate existing Dataplicity configuration**: Confirm if Dataplicity is actively used by checking local configuration files or registered applications. Expected behavior would involve authorized usage patterns with documented IP ranges or hostnames.

  - **Monitor for lateral movement**: Look for additional command-and-control indicators or related connections to unknown hosts using Sysmon Event ID 3 (network connection) within the timeframe of the alert.

  ### Prioritization

  This alert is of medium severity due to the potential for malicious abuse, especially if the affected system is critical or holds sensitive data. While there are legitimate use cases for Dataplicity, the behavior is commonly weaponized for maintaining persistence in compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate activities, such as authorized use of Dataplicity by IT staff. It relies on correct configuration of network logging to capture relevant connections effectively. Additionally, this detection may not capture situations where malicious actors utilize other, less-known RMM tools. A companion detection that strengthens coverage could include monitoring for known malware signatures associated with RMM tool abuse.

