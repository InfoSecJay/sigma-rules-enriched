note: |
  ### Technical Context

  This Sigma rule detects network connections to Dataplicity RMM tool domains, indicating a potential use of this remote management tool. Attackers may utilize Dataplicity to maintain persistence or control over compromised devices, making it instrumental in a command and control (C2) scenario. The relevant MITRE ATT&CK tactic is **Command and Control** (T1071), with the technique being **Application Layer Protocol** (T1219). The primary telemetry source is Windows network connection logs, specifically targeting DNS queries or connection attempts reflecting specified Dataplicity domains. If malicious, the security impact could include unauthorized access, data exfiltration, or further deployment of malware. Importantly, this detection does not confirm malicious intent by itself, as the activity may correspond to legitimate use of the Dataplicity service.

  ### Investigation Steps

  - **Review connection logs:**
    Identify network connections to specified Dataplicity domains using Windows Event ID 5156 (Windows Filtering Platform) logs. Look for connections to any entries from the defined domain list, such as `*.dataplicity.com` or `*.wormhole.dataplicity.com`.

  - **Correlate with endpoint activity:**
    Check for corresponding process creations related to the connection in Sysmon Event ID 1 logs. Look for processes (e.g., `dataplicity.exe`) running during the same timeframe to determine if they align with the detected network connections.

  - **Examine user context:**
    Validate the account used for the connection attempts. Investigate any anomalies, such as unusual accounts initiating Dataplicity sessions. This may involve querying Windows Security Event ID 4624 (Logon) logs for the user context during connection creation.

  - **Assess legitimate use cases:**
    Determine if the organization uses Dataplicity legitimately for device management. Confirm this by reviewing internal documents or reaching out to IT teams responsible for device management.

  - **Identify known malicious indicators:**
    Highlight any ties to known malicious actors or malware associated with the use of Dataplicity for C2. Check threat intelligence feeds for reported incidents using the Dataplicity domains or relevant hashes.

  - **Validate artifacts:**
    If Dataplicity activity is confirmed, examine file creation events (Sysmon Event ID 11) related to output or log files that may indicate data exfiltration or other malicious activities.

  ### Prioritization

  The alert carries medium severity due to its potential implications for impacted systems, particularly those critical for business operations. While Dataplicity can be used legitimately, its misuse has been documented in several attacks, making it necessary to verify the context of the detected activity.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of other logging mechanisms, such as application-specific logs from Dataplicity itself. Legitimate operations may trigger these alerts, especially in environments utilizing Dataplicity for remote management. A related detection to enhance coverage is monitoring for processes initiated by this tool to detect its execution in anomalous contexts.

