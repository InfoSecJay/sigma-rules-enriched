  ### Technical Context

  This rule detects network connections to domains associated with the KickIdler remote management tool (e.g., kickidler.com and my.kickidler.com). The likely attacker objective is to manage compromised machines remotely, enabling them to execute commands, move laterally, or conduct malicious activities without detection. This behavior relates to the MITRE ATT&CK technique T1219 (Remote Access Software). The primary telemetry sources for this rule are Windows network connection logs, specifically tracking DNS requests or outbound connection attempts to the identified domains.

  If the activity is malicious, it poses a significant security risk as it may facilitate unauthorized access and control over affected endpoints, leading to data breaches or further lateral movement within the network. Importantly, this detection does NOT provide definitive proof of compromise, as legitimate use of the KickIdler tool may also trigger it.

  ### Investigation Steps

  - **Identify connection details:** Review network connection logs (Event ID 5156) for outbound connections to kickidler.com or my.kickidler.com. Look for high volumes of connections from unusual endpoints that do not typically use RMM tools.

  - **Analyze DNS queries:** Check DNS logs (Event ID DnsQuery) for recent requests to kickidler.com or my.kickidler.com. Legitimate activity might show connections related to authorized administrative services, while suspicious queries may come from non-admin user accounts or unfamiliar devices.

  - **Assess process activity:** Investigate local process activity (Sysmon Event ID 1) on affected endpoints for newly introduced processes communicating with identified KickIdler domains. Look for unusual executable names or command-line arguments indicative of unauthorized remote management.

  - **Review remote access policies:** Confirm if the affected system is sanctioned to use remote management tools. Expected behavior typically involves known administrative accounts accessing legitimate support or monitoring services.

  - **Check user accounts:** Investigate user account activity related to unusual login patterns using Event ID 4624. A spike in logins from administrative accounts or recurring failed login attempts followed by successful connections may indicate compromised credentials.

  ### Prioritization

  The alert should be considered medium severity due to the potential impact on critical systems and the likelihood of malicious exploitation, especially if the endpoints are used for sensitive operations. Additionally, remote management tools like KickIdler are commonly weaponized by threat actors for stealth operations, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may modify outgoing connections or use alternative domains. Reliable detection requires comprehensive logging, including network connection events and DNS queries. Legitimate administrative activities may trigger this alert if authorized personnel utilize KickIdler for valid purposes. A related detection for evaluation could involve monitoring for known remote access tools (e.g., LogMeIn or AnyDesk) to strengthen overall coverage of RMM activity.

