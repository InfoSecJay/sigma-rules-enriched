note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Aspia Remote Monitoring and Management (RMM) tool, specifically when processes are spawned by or connect to the parent application, `aspia_client.exe`. The likely attacker objective is to leverage legitimate RMM capabilities for unauthorized access, remote control, or data exfiltration. This behavior fits into the MITRE ATT&CK framework under the tactic of **Command and Control** (TA0011) and specifically targets the technique **Exploitation of Remote Services** (T1219).

  The primary telemetry source for this detection is the Windows Process Creation logs, specifically focusing on Security Event ID 4688 or Sysmon Event ID 1 that detail process initiation. If the activity is malicious, there could be considerable security impact, including unauthorized remote access to systems, potential data breaches, and compromise of sensitive information. It is critical to note that this detection does NOT confirm malicious intent on its own, as the Aspia tool may be employed legitimately in enterprise environments.

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event ID 4688 or Sysmon Event ID 1, focusing on the `Full Path` and `Parent Image` fields. Look for entries indicating `aspia_client.exe` as the parent and spawned process. A legitimate use case may show `aspia_client.exe` executing other known system management tools or legitimate maintenance scripts.

  - **Validate process legitimacy:** Investigate the `Image` path in the context of established application paths on endpoints (e.g., installed programs directories). Benign indicators will correspond to organizational deployment locations of the RMM tool and signed binaries, whereas anomalous paths may suggest compromise.

  - **Check for network activity:** Look for outbound connections to unusual IPs or domains in firewall or proxy logs associated with attempts to communicate with external servers during or right after the process execution. Malicious indicators may show traffic to known command-and-control (C2) domains.

  - **Identify persistence mechanisms:** Investigate startup entries for the `aspia_client.exe` process in the Windows registry or system services (e.g., using `regedit` or the `Get-Service` cmdlet). Unauthorized persistence beyond expected behavior indicates a potential compromise.

  - **Examine user activity context:** Review user logins and related activity during the timeframe of the event to determine if it aligns with expected administrative actions. Legitimate administrative user activity should show consistent hours and match roles expected to utilize RMM tools.

  - **Confirm endpoint role:** Identify the host operating system’s role (e.g., IT admin workstation, non-critical server). Malicious activity on critical assets (e.g., domain controllers) raised the severity of alerts, demanding deeper investigation.

  ### Prioritization

  The alert's severity is medium, as the Aspia tool can potentially be used for both legitimate system administration and malicious activities. The likelihood of malicious use is heightened if the process execution appears on non-administrative or unexpected systems, given that RMM tools are often weaponized in lateral movement scenarios.

  ### Blind Spots and Assumptions

  Detection limitations exist if the logging level for process creation is not adequately configured; Event IDs must be consistent and the relevant security settings must be enabled on all endpoints for reliable monitoring. Furthermore, legitimate services utilizing Aspia may trigger the alert in appropriate contexts, such as central IT management or MSP activities. A companion detection rule monitoring for unauthorized modifications to system services or registry keys could enhance coverage against misuse of the RMM tool.

