note: |
  ### Technical Context
  This detection rule identifies potential usage of the Aspia Remote Monitoring and Management (RMM) tool by analyzing process creation events. The Aspia RMM tool can facilitate remote administration and support but may also be exploited by malicious actors to gain unauthorized access to systems, execute commands, or manipulate data. Attackers may leverage RMM tools like Aspia to execute malicious activities, often under the guise of legitimate administrative tasks, thereby blending in with normal operations and evading detection.

  The relevant MITRE ATT&CK tactics for this behavior include **Execution** (TA0002) as the primary tactic utilized when the tool is invoked, along with the technique **Remote Services: Remote Desktop Protocol (RDP)** (T1219) which may be used in conjunction with such tools for executing commands remotely. Effective detection requires monitoring specific data sources that highlight process creation events associated with the Aspia client.

  Primary data sources for gathering evidence include:
  - Windows process creation logs, which provide details about which processes were executed and their parent processes, helping to identify potentially malicious activities connected to the Aspia client.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the Windows event logs for new processes starting with `aspia_client.exe`. Look for unauthorized instances that do not correlate with legitimate administrative tasks or known operational patterns.

  - **Analyze Parent Processes**: Investigate the parent processes associated with `aspia_client.exe` to determine if they originate from legitimate administrative scripts or applications. Unusual parent processes may indicate malicious execution.

  - **Correlate with User Activity**: Assess the user account associated with the launching of the Aspia client. Verify whether the user has legitimate administrative privileges and identify patterns of usage that could indicate abuse.

  - **Check for Network Connections**: Look for outbound network connections initiated by the Aspia client that may indicate suspicious activity, especially those that connect to unfamiliar or untrusted destinations.

  ### Prioritization
  This alert is categorized as medium severity due to the potential for significant impact if the tool is being used maliciously. The likelihood of being exploited in an enterprise environment increases alongside the prevalence of remote access tools being targeted by threat actors.

  ### Blind Spots and Assumptions
  This detection logic assumes that the Aspia client will always use its designated file path and naming conventions. There may be blind spots if attackers renaming the executable or using similar processes mimicking `aspia_client.exe` go unnoticed, indicating a need for more comprehensive detection rules. Furthermore, proper configuration of process creation logging is necessary for this detection to function effectively, potentially requiring adjustments to current logging policies to capture all relevant events.

