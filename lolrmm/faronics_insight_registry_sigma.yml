- Legitimate use of Faronics Insight
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications or queries to specific Windows Registry keys associated with the Faronics Insight Remote Management Tool (RMM). These activities may indicate unauthorized use of this tool, which an attacker could exploit for remote access, system surveillance, or insider threat scenarios. The relevant MITRE ATT&CK techniques include "Execution via Control Panel Script" (T1219). The primary telemetry sources involve Windows Registry event logs, particularly focusing on modification events linked to `HKLM\SOFTWARE\Faronics` and `HKLM\SYSTEM\CurrentControlSet\Services\FIStudentSvc`. If malicious, this behavior could lead to the compromise of endpoints for data exfiltration or remote control.

  This detection does NOT confirm that the activity is malicious on its own; legitimate instances of the Faronics Insight tool may trigger this alert if it is used by authorized personnel.

  ### Investigation Steps

  - **Correlate with authorized software inventory:** Verify whether the Faronics Insight RMM tool is listed as an authorized application. Check your asset inventory logs against installed software (e.g., `WMIC Product Get Name`) on the affected host.

  - **Review registry access events:** Investigate Security Log Event ID 4657 (Registry Value Changed) and Event ID 4658 (Registry Value Deleted) for the specific registry paths. Look for timestamps and user accounts involved in these activities.

  - **Identify user context:** Validate the user account associated with the registry modification. Check whether it's a known administrator or a standard user account, as unexpected or non-administrative accounts making changes may indicate malicious use.

  - **Look for process activity:** Analyze process creation logs (Security Event ID 4688 or Sysmon Event ID 1) on the affected host to identify what processes initiated modifications to the targeted registry keys, looking for benign processes that are typically associated with legitimate operations.

  - **Analyze system services:** Investigate relevant services using Windows Service Control Manager logs to confirm legitimate service operations related to `FIStudentSvc`. Malicious versions may exhibit unusual launch times or run from unexpected paths.

  ### Prioritization

  This alert is of medium severity because it indicates a potential misuse of remote management capabilities. The actual impact depends on the criticality of the affected system; however, the likelihood of malicious abuse is moderate, as Faronics Insight could be leveraged for unauthorized monitoring or control.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative use or scripted deployment procedures that also manipulate the registry keys. Ensure proper logging for Registry events is enabled to capture relevant telemetry effectively. Legitimate activities such as scheduled updates or configurations by IT staff could trigger this alert. Companion detections, such as alerts for unusual network connections from the Faronics Insight tool, will enhance coverage and context around this threat.

