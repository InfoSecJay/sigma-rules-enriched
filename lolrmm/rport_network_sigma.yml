note: |
  ### Technical Context

  This rule detects outbound network connections to RPort's infrastructure (rport.io), typically associated with remote management and control software. Attackers may utilize RPort to establish command and control (C2) channels, leveraging it to manipulate compromised systems or deploy malicious activities. The relevant MITRE ATT&CK technique here is Command and Control (T1219).

  The primary telemetry sources are Windows network connection logs, with a focus on the "DestinationHostname" field. If malicious, the presence of RPort connections can indicate an ongoing compromise, where an adversary is attempting to control or exfiltrate data from a targeted system. It's important to note that this detection does NOT confirm malicious activity on its own, as legitimate use of RPort for remote management may exist.

  ### Investigation Steps

  - **Review outbound traffic logs: ** Check Windows network connection logs for Event ID 5156 and examine entries for connections to "*.rport.io." Pay particular attention to the source IP address and user context to determine if the connections align with known RPort usage.

  - **Correlate endpoints and roles:** Identify the role of the affected system (e.g., server vs. user workstation). A legitimate server role may require RPort for authorized maintenance, while a user workstation performing this connection could indicate suspicious behavior.

  - **Identify network anomalies:** Look for any unusual spikes or patterns in network activity correlating with the RPort connection times. Review the "SessionID" and "Remote Port" fields to assess if there are abnormal protocols or ports being used.

  - **Examine user activity logs:** Investigate user activity associated with the outbound connections. Check for related Windows Event IDs (e.g., 4624 for logon events) to identify if the connections coincide with legitimate user actions.

  - **Validate continuous connection attempts:** Analyze connection status for repeated attempts to reach RPort, particularly if they are unsuccessful or come from one machine frequently. Repeated failures may indicate attempts to exploit or connect to C2 infrastructure.

  - **Document legitimate use cases:** Capture known legitimate uses of RPort within the organization. If the connection aligns with a known operational necessity, it may reduce the need for immediate escalation.

  ### Prioritization

  The alert has medium severity due to the potential for significant impact, particularly if a critical asset is involved in the network activity. The likelihood of malicious use is moderate, as RPort can be weaponized for persistence and exfiltration. Given its nature as a remote management tool, monitoring for this type of activity is crucial in the detection of unauthorized access.

  ### Blind Spots and Assumptions

  Detection is limited by environments not utilizing logging practices for Windows network connections. Evasion techniques may include obscuring traffic through tunneling methods. Legitimate administrative activities could trigger the alert if RPort is in authorized use within the organization. A related detection would include monitoring for known C2 traffic indicative of compromised systems, enhancing coverage against potential misuse of RPort.

