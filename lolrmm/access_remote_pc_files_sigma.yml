note: |
  ### Technical Context

  This rule detects unauthorized or suspicious file activity related to the Access Remote PC remote management tool, which is often used for legitimate remote desktop access. However, threat actors may utilize this tool to establish persistence or remote control of compromised systems. The relevant MITRE ATT&CK technique is **Remote Access Tools (T1219)**, showcasing a method adversaries may employ for command and control. The primary telemetry source includes Windows file event logs for specific executable paths associated with Access Remote PC. A successful malicious exploit could lead to significant data theft or system compromise. This detection does NOT confirm malicious activity on its own, as legitimate use cases exist.

  ### Investigation Steps

  - **Identify file access events:**
    Review Windows Security Event ID 4663 for object access, focusing on the executable paths: `'C:\Program Files (x86)\RemotePC\RemotePCUIU.exe'` and `'C:\Program Files (x86)\RemotePC\*'`. Look for unusual access patterns, like access outside business hours.

  - **Verify source of the execution:**
    Check Sysmon Event ID 1 for process creation related to `RemotePCUIU.exe` and examine the parent process field to determine if it was invoked by a known or unusual process.

  - **Assess user behavior:**
    Analyze user account activity within your User Activity logs to identify if the account used to access the RMM tool has a legitimate reason, such as remote support or IT maintenance, ideally from a known IP range or workstation.

  - **Correlate with network traffic:**
    Inspect firewall logs and outbound connection logs for traffic to and from the Access Remote PC control servers. Look for anomalies in destination IP addresses and ports typically used by the tool.

  - **Review for known malicious indicators:**
    Search for indicators of compromise (IOCs) associated with Access Remote PC use, such as unusual data exfiltration patterns or connections to known malicious infrastructures reported by threat intelligence feeds.

  - **Determine expected legitimate behavior:**
    Confirm that any identified activity correlates with documented company processes for remote access or support, including logging or approval processes typically followed when using RMM tools.

  ### Prioritization

  This alert should be classified with medium severity, as the affected system's exploitation could allow attackers to gain unauthorized control, potentially leading to data compromise. The likelihood of abuse exists, especially in environments where remote management tools are commonly weaponized by threat actors to bypass defenses.

  ### Blind Spots and Assumptions

  Detection limitations may arise if logging for file access events is not properly configured or if the RMM tool’s activity is masked by legitimate use. Misconfigured environments may lack the requisite logs for reliable detection. Legitimate remote support activity may generate similar alerts, such as servicing scheduled maintenance. A complementary detection to consider includes tracking outbound network traffic to known command-and-control servers that may indicate illicit usage of RMM tools.

