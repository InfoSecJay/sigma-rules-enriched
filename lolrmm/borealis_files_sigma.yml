note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Borealis Remote Monitoring and Management (RMM) tool, specifically changes to key execution and configuration files. The likely attacker objective may involve unauthorized remote access and control over victim systems, facilitating reconnaissance, data theft, or lateral movement. This detection relates to the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry sources include Windows file event logs that capture file creation, modification, or access. Malicious activity could lead to significant compromises, such as data exfiltration or system manipulation. However, this detection alone does NOT confirm malicious intent; legitimate usage of Borealis by authorized personnel can also trigger the alert.

  ### Investigation Steps

  - **Review logged file activity:** Investigate Windows Event ID 4663 for access to `C:\Borealis\Agent.exe`, `agent.json`, or `agent.log`. Look for unusual timestamps or user accounts that do not align with known administrative practices.

  - **Identify execution context:** Check Windows Security Event ID 4688 to see if `Agent.exe` was launched via a command line indicative of abnormal usage patterns, such as from a non-administrative user or without previous related activity.

  - **Distinguish expected from unexpected behavior:** Confirm if known asset owners (e.g., IT support) have used Borealis for legitimate administrative tasks, which may include accessing agent logs or configuration files.

  - **Correlate with network connections:** Validate any associated network activity by reviewing logs from the Windows Firewall (Event ID 5156) for outbound connections to suspicious IP addresses or domains that align with known C2 infrastructure.

  - **Look for anomalies in log patterns:** Cross-reference any log write frequency for `agent.log` with typical usage. Excessive writing or abnormal patterns may suggest an attempt to exfiltrate data or manipulate logs.

  ### Prioritization

  This alert is medium severity due to the potential impact on critical systems if Borealis is misused for unauthorized remote access. The likelihood of malicious abuse is moderate, given the increasing prevalence of RMM tools being exploited by adversaries. While legitimate usage can occur, the presence of this tool is concerning and warrants careful investigation.

  ### Blind Spots and Assumptions

  Detection may be bypassed if the Borealis tool is improperly configured or if logs are deleted post-exploitation. Reliable detection requires that file audit policies are correctly enabled to capture all relevant file events. Legitimate administrative tasks, such as system updates or diagnostics performed with Borealis, may trigger this alert. A companion detection worth considering is monitoring for unusual Windows process creation (Event ID 4688) related to `Agent.exe`, which can indicate potential exploitation.

