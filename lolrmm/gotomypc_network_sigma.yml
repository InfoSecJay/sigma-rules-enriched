note: |
  ### Technical Context

  This detection rule identifies outgoing network connections to domains associated with the GoToMyPC remote management tool, specifically targeting any destination hostname ending with '*.GoToMyPC.com'. Attackers may leverage legitimate remote management tools like GoToMyPC to gain unauthorized access to systems, presenting a potential risk of data exfiltration or remote command execution. This behavior relates to the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1219). Primary telemetry sources include Windows network connection logs, specifically monitoring outbound connection attempts (Event ID 5156 for Windows Filtering Platform or equivalent telemetry). The security impact could be significant, as unauthorized remote access can lead to data compromise or system manipulation. However, it is important to note that this detection alone does not confirm malicious activity, as legitimate business operations may also generate this traffic.

  ### Investigation Steps

  - **Identify outgoing connections:** Review Windows Filtering Platform logs (Event ID 5156) for any outbound connections to domains ending in '*.GoToMyPC.com' during the alert timeframe.
  - **Correlate with user activity:** Check User Activity Monitoring logs to validate whether the user associated with the connections (e.g., username and IP address fields) is registered to use GoToMyPC, indicating legitimate use or potential abuse.
  - **Analyze process execution:** Inspect Security Event ID 4688 (Process Creation) for any processes launching GoToMyPC-related executables (e.g., 'g2mstart.exe'). Look for unusual or non-standard execution paths.
  - **Check for additional indicators:** Look for high-confidence malicious indicators by investigating suspicious file transfers (e.g., large data volumes or unusual times) through network logs or file creation events indicating possible data exfiltration.
  - **Understand baseline behavior:** Review historical logs for outbound connections to GoToMyPC domains during typical business operations, noting any deviations from expected patterns that may warrant closer scrutiny.
  - **Assess endpoint security posture:** Verify the installation and configuration of endpoint protection solutions on the asset making the connections. Note any recent alerts or detections that may indicate prior malicious behavior.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized access to sensitive systems, particularly if the affected system hosts critical applications or sensitive data. While the use of GoToMyPC might be legitimate in corporate environments, its abuse for remote access by adversaries is concerning, especially since similar tools are commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not log all outbound connections or by settings that exclude known benign traffic. Legitimate usages of GoToMyPC for remote assistance can trigger the alert, potentially complicating investigations. To enhance detection capabilities, consider correlating this rule with VM detection logs or telemetry targeting other common RMM solutions, creating a more comprehensive view of RMM tools in your environment.

