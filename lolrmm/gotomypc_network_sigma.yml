  ### Technical Context

  This Sigma rule detects network connections to domains associated with the GoToMyPC remote management tool. The likely objective of an attacker using this tool would be unauthorized remote access to a compromised system, facilitating lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Execution and the technique Remote Services (T1219).

  The primary telemetry sources are Windows network connection logs, specifically looking for connections to any hostname ending with '.GoToMyPC.com'. If malicious, this could allow an adversary to maintain persistent access to a network, significantly increasing the risk of data breaches or system compromise. It is important to note that this detection does NOT confirm malicious activity on its own since legitimate administrative tasks could trigger the same alert.

  ---

  ### Investigation Steps

  - **Review recent network connections:** Examine Windows Event ID 5156 (Windows Filtering Platform), focusing on events targeting the destination hostname '*.GoToMyPC.com' for the source IP and user account involved.

  - **Identify context around the user account:** Validate whether the user account initiating the connection has a legitimate business reason to use GoToMyPC. Check Active Directory group memberships and last logon times for anomalies.

  - **Check for related applications:** Look for other remote access tool applications running on the host, specifically any services or processes related to remote management. Review Windows Security Event ID 4688 for process creation.

  - **Consider legitimate usage:** Investigate standard operating procedures regarding GoToMyPC usage within the enterprise. Identify any known administrative roles or scenarios where this tool is appropriately used to validate benign behavior.

  - **Correlate with additional telemetry:** Cross-reference findings with DNS query logs for lookups related to GoToMyPC to see if patterns of use suggest automation or repeated suspicious behavior.

  - **Look for signs of misuse:** Identify unusually timed network connections to '*.GoToMyPC.com' that occur outside of business hours or during atypical usage patterns, which could indicate covert access attempts.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on critical systems if exploited. The likelihood of malicious abuse is moderate, as GoToMyPC is typically used in legitimate administrative contexts, but it is also commonly weaponized by adversaries for remote access.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers might use encrypted channels or alternative remote desktop tools not covered by this rule. Reliable detection necessitates an accurate configuration of network logging on all systems. Legitimate remote access by IT support may trigger this alert, necessitating contextual awareness. A related detection would be monitoring for processes associated with other remote access tools, enhancing the detection of unauthorized remote access attempts.

