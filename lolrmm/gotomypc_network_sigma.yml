  ### Technical Context

  This Sigma rule detects network activity associated with the GoToMyPC remote management tool. Attackers may leverage GoToMyPC to establish remote access to compromised systems, facilitating lateral movement within the network. This behavior is particularly concerning when it appears on hosts that do not have legitimate business use for remote connections. The relevant MITRE ATT&CK tactic is Execution, specifically technique T1219 (Remote Access Software).

  Primary telemetry sources for this detection involve Windows network connection logs that report DNS queries and outbound connections. If this is a malicious activity, it indicates unauthorized access to systems, potentially allowing data exfiltration or manipulation. However, it's important to note that this detection does not confirm that the observed activity is malicious on its own, especially if the tool is used legitimately for remote administration.

  ### Investigation Steps

  - **Review network traffic logs for GoToMyPC connections:** Check for outbound traffic with DestinationHostnames ending in '*.GoToMyPC.com' via Windows Firewall logs (Event ID 5156). Document the source IP and time of connection.

  - **Investigate system roles and expected behavior:** Validate if the affected host is authorized to use remote access tools. Common business roles that may use GoToMyPC should have justifications, recorded during asset inventory assessments.

  - **Identify high-confidence malicious indicators:** Look for signs of anomalous user behavior around the GoToMyPC connection, such as unexpected user profiles attempting connections (analyze logs for unusual login times or failed authentication attempts).

  - **Correlate with other telemetry sources:** Analyze Sysmon Event ID 3 (Network Connection) to observe additional context around the connection establishment, such as originating process names and parent processes.

  - **Assess potential for data exfiltration:** Check for file creation events (Sysmon Event ID 11) and any unauthorized transfers through analyzed traffic. Attempt to identify any unusual outbound activity that coincides with the detected GoToMyPC usage.

  ### Prioritization

  This alert has a medium severity as it can indicate unauthorized access to critical systems; however, the likelihood of malicious abuse depends on the context of the host’s role. Since GoToMyPC is a legitimate tool often targeted by attackers for remote access, its detection should trigger further review, specifically if it's not expected behavior on that asset.

  ### Blind Spots and Assumptions

  The detection may have limitations, such as evasion techniques like VPNs or proxies that obscure the true destination hostname. Reliable detection requires proper logging of outgoing network connections on Windows systems. Additionally, legitimate administrative activities using GoToMyPC could inadvertently trigger alerts. A related detection to consider is monitoring for unusual login patterns or credential dumps that would suggest stolen credentials being used for unauthorized remote access.

