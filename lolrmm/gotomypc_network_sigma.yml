note: |
  ### Technical Context
  This rule detects potential network activity associated with the GoToMyPC Remote Monitoring and Management (RMM) tool. GoToMyPC allows users to remotely access and control systems, which can be exploited by threat actors to maintain persistence, access sensitive data, and manipulate systems without detection. The detection logic focuses on requests to hostnames ending in `.GoToMyPC.com`, signaling potential unauthorized remote access sessions that could indicate malicious intent.

  Attackers may target organizations to gain covert entry, often using legitimate software for nefarious purposes. The suspected threat objectives include obtaining sensitive information, executing malicious commands remotely, or exfiltrating data. The relevant MITRE ATT&CK tactics and techniques associated with this activity include "Execution" (TA0002) and "Remote Services" (T1219). Both tactics emphasize the potential for unauthorized remote access and execution of commands through legitimate, trusted software channels.

  Primary data sources providing valuable evidence include Windows network connection logs, which can capture the specifics of outgoing connections to GoToMyPC domains, enabling analysts to recognize anomalous patterns or unauthorized usage of this RMM tool.

  ### Investigation Steps
  - **Review Network Connection Logs:** Analyze network connection logs for outbound connections to `*.GoToMyPC.com`. Pay attention to unexpected users or systems attempting to connect, particularly on non-standard ports.

  - **Correlate with User Activity:** Cross-reference any detected GoToMyPC connections with user activity logs to identify legitimate use versus potential unauthorized access. Look for unusual connections from accounts that typically do not utilize remote desktop tools.

  - **Analyze Process Creation Events:** Investigate any process creation logs around the time of detected network activity. Look for instances of the GoToMyPC client or related processes spawning unexpectedly.

  - **Monitor for Anomalous Accounts:** Check Active Directory logs for unusual usage patterns or logins associated with accounts that should not be utilizing remote access tools. Identify accounts with elevated privileges that connect to these domains.

  ### Prioritization
  The alert carries a medium severity due to the potential for significant impact in a compromised environment, where attackers could exfiltrate sensitive data or manipulate systems undetected. The likelihood of false positives exists, particularly in organizations that legitimately utilize GoToMyPC for remote support.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage, as it relies solely on hostname-based detection, potentially missing traffic from GoToMyPC clients with custom configurations or from internal hosts using direct IP connectivity. Assumptions include the proper functioning of network logging configurations to capture outbound connections. Organizations must ensure that relevant logs for network connections and process creation events are enabled to facilitate effective detection.

