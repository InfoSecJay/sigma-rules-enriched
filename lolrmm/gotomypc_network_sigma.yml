note: |
  ### Technical Context

  This detection rule identifies network connections to the GoToMyPC remote management tool, which may indicate unauthorized remote access activity. Attackers could use GoToMyPC for persistence or data exfiltration, thus enabling them to interact with a compromised system as if they were the legitimate user. This behavior is classified under the MITRE ATT&CK tactic of Command and Control (T1076) and the technique Remote Management Software (T1219).

  The primary telemetry source required is network connection logs that capture outgoing and incoming connections to 'gotomypc.com'. If the activity is malicious, it may lead to unauthorized access to sensitive systems, amplifying the risk of data breaches. However, it is important to note that this detection alone does not definitively prove malicious intent, as legitimate instances of GoToMyPC use might also trigger this alert.

  ### Investigation Steps

  - **Verify recent network activity to GoToMyPC**: Check for events showing connections to '*.gotomypc.com' in the Windows Firewall event logs (Event ID 5156). Track both times and the destination IP addresses. Benign instances will typically occur from known corporate IPs.

  - **Analyze user account activity**: Review Active Directory logs for account logons around the time of the detected network connection (Event ID 4624). Look for patterns of unusual user login times. Normal usage will exhibit logins during business hours.

  - **Check installed applications**: Query installed programs and features using PowerShell (Get-WmiObject -Class Win32_Product). Ensure that GoToMyPC is only installed on approved endpoints; unauthorized installations indicate potential malicious activity.

  - **Monitor for known malicious indicators**: Cross-reference connecting IP addresses against threat intelligence databases for known GoToMyPC abuse. Malicious indicators include IP ranges associated with documented cyber incidents.

  - **Investigate outbound traffic patterns**: Use network monitoring tools to analyze bandwidth spikes or abnormal outbound traffic to '*gotomypc.com*' in the last 30 days. Legitimate use generally shows consistent, moderate traffic with no significant spikes.

  - **Check for file transfer artifacts**: Validate any recent file transfers to or from the GoToMyPC application directory in C:\Program Files\. Look for unusual file types or access patterns, such as executable files or sensitive documents.

  ### Prioritization

  This alert carries a medium severity due to the potential impact of unauthorized access through remote management tools. While GoToMyPC is commonly used for legitimate purposes, its easy exploitation for remote access makes it a noticeable area of concern. The likelihood of malicious abuse is moderate given its ability to facilitate persistent connections undetected.

  ### Blind Spots and Assumptions

  This detection might miss unauthorized use if logs are not consistently captured or if outbound network traffic monitoring is misconfigured. Legitimate activities such as IT support interactions or remote support requests can also trigger the alert, complicating assessments. Additional detections including raised alerts for unauthorized account changes or suspicious lateral movement (T1075) can help bolster overall alert coverage.

