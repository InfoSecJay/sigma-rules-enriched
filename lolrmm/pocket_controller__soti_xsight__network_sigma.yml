  ### Technical Context

  This Sigma rule detects network connection attempts to domains associated with the Pocket Controller (Soti Xsight) Remote Monitoring and Management (RMM) tool. The likely attacker objective includes unauthorized system access, remote command execution, or control over devices that use this tool, potentially for malicious purposes. This behavior is classified under the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1219).

  The primary telemetry source is Windows network connection logs, specifically monitoring DNS lookups and outbound connections. If malicious, the security impact could involve unauthorized remote access to a wide array of devices managed by Soti, leading to potential data breaches or operational disruptions. However, this detection does NOT confirm malicious activity on its own, as legitimate usage of the Pocket Controller by administrators could trigger this alert.

  ### Investigation Steps

  - **Identify active connections:** Review network connection logs (Windows Event ID 5156) for attempts to connect to `*.soti.net`. Check timestamp of connections for unusual activity outside of business hours as a potential indicator of compromise.

  - **Verify legitimate usage:** Confirm whether the Pocket Controller (Soti Xsight) is an authorized application within your organization. Check asset inventories and communication with the IT department regarding usage policies to establish a baseline.

  - **Inspect process execution:** Correlate detected network connections with process execution logs (Windows Event ID 4688). Look for unexpected execution of `SotiPocketController.exe` or related binaries as a high-confidence malicious indicator.

  - **Evaluate system role significance:** Assess whether the affected endpoint is a critical asset (e.g., server or admin workstation). Higher criticality systems should warrant an immediate escalation or investigation due to their potential impact on business operations.

  - **Monitor for additional indicators:** Review for further signs of lateral movement or persistence, such as unusual registry modifications or scheduled tasks related to Soti, corroborated by Sysmon logs (e.g., Event ID 10 for process creation).

  ### Prioritization

  This alert should be considered medium severity due to its potential impact on critical systems managed by RMM tools, along with the moderate likelihood of malicious activity leveraging these tools. Given that RMM tools can be abused for lateral movement and command execution, prompt investigation is warranted to mitigate risks.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate use cases for the Pocket Controller in the environment, potentially leading to false positives. Organizations must ensure proper logging of network activities and have configurations that capture all outbound connections to `*.soti.net`. Additionally, be aware that similar network activity could originate from other authorized management tools, making contextual analysis important. Related detections for lateral movement (e.g., process creation or registry changes) may strengthen overall security posture.

