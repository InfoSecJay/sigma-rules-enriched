  ### Technical Context
  This detection rule identifies potential network activity associated with the Pocket Controller (Soti Xsight) remote management tool. The rule specifically looks for outbound connections targeting hostnames that end with `soti.net`, indicating that this software is attempting to communicate with its management infrastructure. Attackers may exploit such remote management tools for malicious purposes, including unauthorized access, data exfiltration, or deployment of additional payloads.

  The likely attacker objectives include maintaining a foothold in the target environment and controlling devices remotely without detection. This behavior may align with tactics found in MITRE ATT&CK, specifically the Execution tactic (Tactics: Execution, ID: TA0002) as it can be leveraged for remote code execution. Relevant techniques include Remote Management Tools (T1219), which encompasses the use of legitimate software for malicious activities.

  Primary data sources for effectively investigating this rule include network connection logs from the Windows environment, which track all outbound connections and can reveal the establishment of communication with suspicious domains associated with Soti Xsight.

  ### Investigation Steps
  - **Review Network Connection Logs:** Collect and analyze log entries that indicate connections to `soti.net` domains. Look for unusual traffic patterns or connections made from endpoints that do not typically use remote management tools.

  - **Identify Source Hosts:** Determine which hosts initiated the connections to Soti's domains. Focus on endpoints that have not been previously authorized for the use of Pocket Controller.

  - **Correlate with Active Directory Data:** Check Active Directory logs for any recent changes in permissions or group memberships that may correlate with the usage of the remote management tool, particularly any modifications made by unauthorized accounts.

  - **Inspect Installed Applications:** Conduct a thorough inventory of installed software on the endpoints, specifically looking for the presence of Pocket Controller (Soti Xsight). Investigate the context of its installation and ensure it aligns with organizational policies.

  ### Prioritization
  The severity of this alert is considered medium due to the potential impact of unauthorized access through legitimate remote management tools. While it may represent legitimate administrative activity, the possibility of misuse necessitates prompt investigation.

  ### Blind Spots and Assumptions
  One blind spot in this detection is that legitimate users may be using the Pocket Controller for authorized tasks, which can lead to false positives. The detection logic assumes that any connection to `soti.net` is suspicious without context, which may not always hold true in environments that utilize this tool legitimately. Proper logging of network connections must be enabled, and continuous monitoring of the network traffic is essential for the alert to work effectively.

