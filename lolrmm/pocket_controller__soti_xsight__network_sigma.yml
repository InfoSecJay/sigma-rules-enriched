  ### Technical Context

  This Sigma rule detects network activity associated with the Pocket Controller (Soti Xsight) RMM tool, specifically identifying connections to hosts with domain names ending in '.soti.net'. The likely attacker objective is to utilize this remote management tool to gain unauthorized access to managed systems, allowing for subsequent data exfiltration or system manipulation. This behavior correlates with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry source is Windows network connection logs, particularly focusing on connection attempts to specified domains. If malicious, this activity could lead to unauthorized access and control over endpoints, potentially exposing sensitive data. Importantly, this detection does not confirm malicious intent on its own; it simply indicates network connectivity to a potentially unauthorized tool.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Check for Event ID 5156 (Windows Filtering Platform) to see specific outbound connections to '.soti.net'. Note the process initiating these connections.

  - **Identify associated processes:** Investigate the processes that made the network connections, focusing on unusual or non-standard applications that may indicate malicious usage of a legitimate tool.

  - **Assess expected behavior:** Look for legitimate use of Soti Xsight in your environment. Determine if the detected connections match known schedules or activities of IT support teams, correlating with management operations.

  - **Cross-reference user accounts:** Verify the user accounts responsible for creating these connections to identify any anomalous access patterns or accounts that should not have used the tool.

  - **Collect additional telemetry:** Gather Sysmon Event ID 3 (Network connection events) to correlate the connections' timing and originating processes for a comprehensive view of network behavior.

  - **Confirm host role and sensitivity:** Analyze the impacted systems' roles; if critical infrastructure is involved, prioritize the investigation more urgently due to higher impact potential when compromised.

  ---

  ### Prioritization

  This alert holds medium severity due to the potential impact on managed systems and the likelihood that malicious actors could exploit remote management tools like Soti Xsight. While the behavior is associated with legitimate tool usage, its inherent capabilities can be weaponized by adversaries, warranting careful scrutiny.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include false positives from legitimate usage of the Soti Xsight tool by authorized personnel. Reliable detection requires comprehensive logging configurations for Windows network connections and potentially, Sysmon logs for enhanced visibility. Legitimate IT support activities may frequently trigger this alert, complicating the analysis. A related detection that strengthens coverage could involve monitoring for abnormal patterns in remote access software usage, especially during non-business hours.

