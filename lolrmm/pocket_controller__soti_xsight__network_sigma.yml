note: |
  ### Technical Context

  This Sigma rule detects unauthorized or unexpected network activity related to the Pocket Controller (Soti Xsight) Remote Monitoring Management (RMM) tool by monitoring outbound connections to any host ending in `*.soti.net`. The behavior typically indicates an attempt to manage or control devices through the RMM platform, which can be leveraged by adversaries for remote access or device exploitation. This activity aligns with the MITRE ATT&CK tactic **Execution** and technique **Infect Application** (T1219).

  The primary telemetry sources for this detection are Windows network connection logs, specifically information about outbound connections. If these connections are malicious, they could facilitate unauthorized control over endpoints, potentially leading to data exfiltration or additional compromise. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also trigger the alert.

  ### Investigation Steps

  - **Verify involved processes:**
    Check for process creation events (Security Event ID 4688 or Sysmon Event ID 1) on the host that initiated the connection. Look for known Soti Xsight RMM service executables; legitimate behavior could include processes like `PocketController.exe`.

  - **Correlate network logs:**
    Review Windows Network Connection logs (Event ID 5156) to analyze the specific times and interfaces associated with outgoing connections to `*.soti.net`. Expected benign connections may coincide with regular maintenance windows or scheduled tasks.

  - **Identify anomalies in timing:**
    Analyze the timestamp of the outbound connection. Scrutinize connections made during unusual hours (rare business activity) or from endpoints that are typically not used for RMM tasks (e.g., non-administrative workstations).

  - **Examine user account activity:**
    Review recent logins (Security Event ID 4624) and compare the usernames associated with the network connections. If user accounts not typically involved in IT administration are seen making these connections, raise suspicion for possible compromise.

  - **Cross-check with threat intelligence:**
    Utilize threat intelligence sources to see if `*.soti.net` has previously been associated with malicious activity. Take note of any known bad IPs or domains linked to these endpoints for a higher confidence level in identifying malicious actors.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on sensitive systems managed by the Soti Xsight tool. While not all instances of this behavior are malicious, the likelihood of exploitation through remote access tools is a known attack vector, warranting timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of endpoint logging or network monitoring tools, which could obscure legitimate use of the RMM tool. Additionally, the alert may trigger from authorized administrative actions if Soti Xsight is in regular use. Companion detections could include monitoring for unusual process creation or file changes related to Soti Xsight to bolster context for responses and further investigations.

