note: |
  ### Technical Context

  This rule detects network connections to domain names associated with the Soti Xsight Remote Monitoring and Management (RMM) tool, specifically targeting endpoints that are communicating with **soti.net**. Attackers may utilize such RMM tools to remotely control compromised systems, deploy malware, or exfiltrate data towards an external command-and-control (C2) infrastructure. The technique aligns with MITRE ATT&CK Tactic: **Execution** (TA0002), Technique: **User Execution** (T1219).

  The primary telemetry sources are Windows network connection logs capturing destination hostnames and related connection activities. A security incident involving the use of Soti Xsight could lead to unauthorized system access, data leakage, or lateral movement within the network. This detection alone does NOT confirm compromise; legitimate use of Soti Xsight can trigger the alert.

  ### Investigation Steps

  - **Identify network log entries:** Review Windows network connection logs (e.g., Security Event ID 5156) for outbound connections to **soti.net** or any subdomains. Look for a large number of connections or unusual patterns indicative of automated behavior.

  - **Correlate with user activity:** Check user accounts associated with the alerts. Ensure the activity corresponds with documented use cases of Soti Xsight by reviewing application logs or support tickets validating legitimate administrative activity.

  - **Assess host role:** Verify the role of the affected host (e.g., server, user workstation). Remote monitoring tools may have a legitimate purpose on administrative endpoints but indicate potential abuse on less critical or unauthorized systems.

  - **Look for malicious indicators:** Cross-reference connection times with any known incidents or suspicious file behavior, particularly around established RMM tools, by checking Event IDs 4688 (Process Creation) for remote processes initiated by Soti-related executables.

  - **Analyze for exfiltration artifacts:** If suspicious activity is confirmed, investigate for potentially related artifacts such as file creation and modifications or look for logs of data transfers within the Windows event logs (e.g., Event ID 4663 for file access).

  ### Prioritization

  This alert should be treated with medium severity due to the potential for unauthorized remote access via RMM tools, especially on critical systems. The likelihood of malicious use exists, particularly if the tool is discovered on endpoints where it is not commonly deployed. This behavior can be weaponized effectively in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may miss legitimate use cases where Soti Xsight is properly implemented in the organization, such as for IT support tasks. Additionally, ensure that firewall rules and network logging configurations are adequately set up to capture this type of outbound network activity. Legitimate software updates or administrative maintenance may also produce similar traffic. A related detection, such as monitoring for unusual process creation related to known RMM executables (like **PocketController.exe**), can enhance detection capabilities.

