  ### Technical Context

  This Sigma rule detects outbound network connections to the Soti Domain, specifically targeting "soti.net" and its subdomains, which are commonly associated with the Pocket Controller (Soti Xsight) remote monitoring and management (RMM) tool. The likely attacker objective may involve using the RMM functionalities for unauthorized device access or data exfiltration. This behavior aligns with the MITRE ATT&CK framework under the Tactic: Command and Control (ID: TA0011) and Technique: Application Layer Protocol (ID: T1219).

  The primary telemetry sources include Windows network connection logs, specifically focusing on network activity that exhibits outgoing connections to the specified Soti domains. If the detected connection is malicious, it could signal misuse of RMM capabilities to manage or manipulate devices within the enterprise network. It is important to note that this detection alone does not confirm malicious intent; legitimate administrative use of the Soti tool exists in many environments.

  ### Investigation Steps

  - **Review outgoing connection details:** Use Windows Security logs (Event ID 5156) to confirm the process initiating connections to the Soti domains. Look for specific processes that invoke these connections during non-business hours or from unexpected hosts.

  - **Validate legitimate tool usage:** Check for documented usage of Pocket Controller (Soti Xsight) within your organization. Ensure there are corresponding internal policies outlining usage guidelines and authorized devices. Compare connection timestamps for alignment with administrative activity.

  - **Analyze application logs:** Inspect application logs from the Soti solution (if available) to track legitimate device management activities. Review for scheduled tasks or configuration changes around the same timeframe as the network activity for corroboration.

  - **Identify common stealth indicators:** Look for non-standard port usage (other than typical HTTP/HTTPS ports) in network logs (e.g., Traffic on port 3389 for RDP) which may indicate misuse of RMM tools by adversaries.

  - **Cross-reference with asset criticality:** Assess affected systems' roles (e.g., endpoints vs. servers). High-value assets should have tighter monitoring rules, and any anomaly in their communication should raise red flags.

  ### Prioritization

  This alert carries a medium severity level because it indicates potential use of an RMM tool, which could be exploited for unauthorized access or lateral movement within the environment. While such tools are legitimate in many contexts, their misuse presents a significant risk, particularly if monitored assets are high-value or sensitive.

  ### Blind Spots and Assumptions

  Detection is limited by the requirement for thorough logging of outbound connections; systems with insufficient logging practices may evade detection. Legitimate administrative activities may trigger this rule but should be able to be distinguished based on corresponding documentation and timing. Companion detections of user account activity (e.g., logs of user logins or system changes through Event ID 4624) may provide additional context to strengthen coverage and validate potential anomalous behavior from the RMM tool usage.

