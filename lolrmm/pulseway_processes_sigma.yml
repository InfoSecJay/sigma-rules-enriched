note: |
  ### Technical Context
  This rule detects potential activities associated with the Pulseway Remote Monitoring and Management (RMM) tool on Windows systems. Pulseway is commonly used for IT management, allowing administrators to monitor and control devices remotely. However, its legitimate use also makes it a potential vector for malicious actors who can leverage it to gain unauthorized access or control over systems. The detection focuses on processes associated with Pulseway and can indicate unauthorized remote access or system administration attempts that could compromise system integrity.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Execution (T1203)** and **Remote Services (T1219)**. Attackers might utilize the Pulseway RMM tool to execute payloads remotely, facilitating undetected execution of commands or scripts on compromised systems. By identifying unexpected instances of these processes running, incident responders can potentially uncover malicious activities that mimic legitimate administrative actions.

  Primary data sources for this detection include **process creation events**, where logs capture data about the execution of processes such as `PCMonitorManager.exe` and `pcmonitorsrv.exe`. These logs help identify unauthorized or suspicious instances of the aforementioned services running on systems.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events for instances of `PCMonitorManager.exe` or `pcmonitorsrv.exe`. Pay close attention to the parent process to understand where these executions originated from.
  - **Check Parent Process Context:** Investigate the parent processes of detected Pulseway RMM activity. Identify any unusual or unauthorized applications that might indicate malicious intent, such as scripts or processes that should not typically interact with RMM tools.
  - **Assess User Account Activity:** Examine the user accounts executing the Pulseway processes. Determine whether they belong to authorized administrative accounts or if there are any unauthorized or suspicious user accounts implicated.
  - **Correlate with Other Logs:** Cross-reference the findings with other logs, such as VPN connections, firewall logs, and EDR alerts, to assess if there are any additional indicators of compromise or unusual remote activity connected to the detected RMM tool usage.

  ### Prioritization
  This alert has medium severity due to the potential risk of unauthorized system access and control, which could lead to significant data breaches or further lateral movement within the network environment. The likelihood of such occurrences is notable given that Pulseway is often misused in environments with inadequate monitoring.

  ### Blind Spots and Assumptions
  There may be detection gaps if the Pulseway RMM tool has been installed legitimately across the enterprise as part of standard IT operations. The detection logic assumes that any instance of related processes running outside of established control routines warrants further investigation. Required logs include comprehensive process creation logs from the Windows event log, and appropriate configurations must be in place to ensure these events are being collected and monitored consistently.

