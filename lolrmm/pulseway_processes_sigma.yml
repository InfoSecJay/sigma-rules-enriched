note: |
  ### Technical Context

  This Sigma rule detects the execution of the Pulseway Remote Monitoring and Management (RMM) tool on Windows systems. The behavior indicates potential unauthorized access and control over the environment, as adversaries may use tools like Pulseway to maintain footholds or execute commands remotely. The relevant MITRE ATT&CK tactic for this detection includes "Command and Control" (TA0011) and the technique "Remote Access Software" (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could allow an attacker to execute arbitrary commands or scripts, leading to system compromise. Importantly, this detection does NOT confirm compromise on its own, as Pulseway may be legitimately used by authorized IT staff.

  ### Investigation Steps

  - **Check process creation logs for Pulseway artifacts:** Review Security Event ID 4688 for process creation events and confirm if the process names end with '\\PCMonitorManager.exe' or '\\pcmonitorsrv.exe'.

  - **Verify parent process context:** Look for events where the parent process matches '\\PCMonitorManager.exe' or '\\pcmonitorsrv.exe' to establish if the execution chain indicates suspicious activity, particularly from unrecognized users.

  - **Correlate with user activity logs:** Cross-reference the detected events with user activity logs to determine if an authorized admin initiated the Pulseway session. Look for indications of expected administrative activities in the preceding logs.

  - **Identify unusual network behavior:** Check for outbound connections, especially connection attempts to external IPs from the detected Pulseway process using Windows Firewall logs (Event ID 5156) to identify if the telemetry shows anomalous or unauthorized communications.

  - **Monitor for file creation or modifications:** Use Sysmon Event ID 11 to identify any file creation events that are associated with the detected Pulseway processes, as well as examine for potentially exfiltrated data or unauthorized changes.

  - **Assess asset criticality and impact:** Evaluate whether the host running Pulseway is critical to operations. If it is a high-impact system, escalate findings to senior levels for deeper investigation.

  ### Prioritization

  This alert indicates medium severity, as the detection of a legitimate RMM tool may suggest unauthorized access or misconfiguration leading to potential exploitation. While the Pulseway tool itself is useful for IT operations, its execution could be a sign of active malicious behavior, especially when unexpected.

  ### Blind Spots and Assumptions

  The detection may be bypassed by using alternate remote access tools or masked processes. Reliable detection requires appropriate logging settings for Windows processes and Sysmon. Legitimate use of Pulseway by IT or support staff can also trigger this alert. Companion detections, such as monitoring for logins from unusual or unauthorized accounts, could enhance coverage and context for investigations into possible misuse.

