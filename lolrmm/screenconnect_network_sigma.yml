note: |
  ### Technical Context

  This rule detects network activity involving the ScreenConnect remote management tool by monitoring connections to domains associated with ScreenConnect and ConnectWise. Attackers may leverage such remote management tools to gain unauthorized access to systems, conduct lateral movement, or exfiltrate data. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), with the technique identified as Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs, specifically monitoring the destination hostnames/URLs for connections made to `control.connectwise.com`, `*.connectwise.com`, and `*.screenconnect.com`. If the behavior is malicious, it could lead to significant security impacts, such as unauthorized access to sensitive data or systems. This detection does NOT confirm that ScreenConnect usage is inherently malicious, as it may also represent legitimate administrative activities.

  ### Investigation Steps

  - **Validate network connections:** Review Windows network connection logs (Event IDs 5156 and 5158) for outgoing connections to `control.connectwise.com`, `*.connectwise.com`, or `*.screenconnect.com`. Look for anomalous connection attempts from non-administrative workstations, which may indicate abuse.

  - **Identify user context:** Examine the user account associated with the detected connections. If the account is a service account or lacks typical administrative privileges, this may indicate suspicious activity.

  - **Check for process correlation:** Investigate for active processes related to ScreenConnect using Sysmon (Event ID 1) and focus on the parent-child relationship of the process. Legitimate ScreenConnect usage typically involves connections triggered by known administrative tools or IT support workflows.

  - **Review recent installation artifacts:** Look into application logs or Windows Event Logs (Event ID 11707) to check if ScreenConnect was recently installed or updated. Unexplained recent installations can indicate potential compromise.

  - **Assess user behavior:** Analyze the behavior of users who initiated connections to these domains. Expected behavior would include documented IT support or remote assistance scenarios, rather than unexplained access patterns.

  ### Prioritization

  This alert has medium severity due to the potential security impact of unauthorized remote access on critical systems. The likelihood of malicious abuse is moderate, as ScreenConnect is commonly used by legitimate IT personnel but can also be exploited by attackers. Such behavior is often weaponized in targeted attacks, raising the need for prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if legitimate administrative use of ScreenConnect goes unmonitored. Evasion techniques may include attackers disguising their remote access via legitimate credentials or using different C2 channels. Ensure reliable logging from security events and network traffic; companion detections involving unauthorized software installation or process creation in conjunction with this rule would strengthen overall coverage of potential threats.

