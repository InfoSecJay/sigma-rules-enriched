note: |
  ### Technical Context
  This detection rule identifies network activity related to the ScreenConnect Remote Management and Monitoring (RMM) tool, commonly used for remote access and support. By monitoring connections to specific domains associated with ScreenConnect, the rule aims to detect unauthorized or suspicious use of this remote access tool, which could indicate a malicious act such as a potential compromise or unauthorized access to systems.

  Attackers may exploit the functionalities of ScreenConnect to gain remote access, facilitate lateral movement, or exfiltrate sensitive data from compromised systems. The objectives are typically centered around stealthy reconnaissance, establishing persistence, and maintaining control over the targeted environment. The relevant MITRE ATT&CK tactics for this rule include Execution (TA0002) and Remote Services (T1219), which covers techniques related to remote access methods used by threat actors.

  The primary data sources for effective detection include network connection logs, which can provide insights into outbound connections to the ScreenConnect domains. Monitoring these logs in conjunction with other telemetry (e.g., EDR events, process execution logs) can enhance context around potential misuse of the RMM tool.

  ### Investigation Steps
  - **Review Network Connection Logs:** Analyze connection attempts to `control.connectwise.com`, `screenconnect.com`, and other related domains to identify any unauthorized access patterns or unexpected usage.
  - **Assess Endpoint Activity:** Investigate any endpoints showing significant interaction with ScreenConnect or similar RMM tools, particularly looking at process creation logs for execution of remote access utilities.
  - **Correlate with User Activity:** Check user activity logs to determine if the remote sessions correlate with authorized user actions, especially during off-hours or from non-standard locations.
  - **Examine Security Alerts:** Cross-reference alerts from other security telemetry (e.g., EDR, SIEM) to identify any additional anomalies or behaviors linked to potential misuse of the ScreenConnect tool.

  ### Prioritization
  Alerts generated by this rule should be treated as medium severity due to the significant risk posed by unauthorized remote access tools. Such activities can lead to data breaches, system compromises, or insider threats, making them critical to address swiftly in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be blind spots in detection coverage for legitimate usage of ScreenConnect, as this rule may inadvertently trigger on authorized use cases. It's assumed that the necessary network connection logs are being collected for detection, and the rule relies on the proper DNS resolution and logging from the network layer. If network logging is not configured to capture outbound connections effectively, detection may be incomplete, missing legitimate or malicious use.

