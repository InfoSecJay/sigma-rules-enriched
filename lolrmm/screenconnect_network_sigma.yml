  ---

  ### Technical Context

  This rule detects outbound network connections to the ScreenConnect remote management and support tool, which is often used for remote desktop access. Attackers may exploit this tool for unauthorized access to systems, allowing for data exfiltration or lateral movement within a network. The relevant MITRE ATT&CK technique is "Remote Access Software" (T1219).

  The primary telemetry source for this detection is Windows network connection logs. Specifically, the rule looks for connections to hostnames associated with ScreenConnect, indicating potential use by malicious actors. If malicious, this could lead to significant security impacts due to unauthorized access and control over the endpoint systems. Importantly, this detection does not confirm malicious intent on its own, as legitimate users may also employ ScreenConnect for remote support.

  ---

  ### Investigation Steps

  - **Review outbound connection logs:** Check for Event ID 5156 (Windows Filtering Platform network connection), focusing on any connections to destinations matching `control.connectwise.com`, `*.connectwise.com`, or `*.screenconnect.com`.

  - **Verify user authorization:** Identify the user or service account initiating the connection. Cross-reference with HR records or ticketing systems to validate whether this user has legitimate access to use ScreenConnect.

  - **Look for abnormal patterns:** Examine connection timing and frequency. Frequent connections during non-business hours or connections from unusual endpoints could indicate malicious behavior.

  - **Assess legitimate usage:** Determine if there have been recent support tickets or remote access requests that justify the use of ScreenConnect within the specified timeframe.

  - **Identify malicious indicators:** Correlate with existing threat intelligence to see if the IP address or domain used has been reported or linked to malicious activities.

  - **Check for additional indicators of compromise (IoC):** Scan the affected system for suspicious processes or artifacts, including any ScreenConnect executable files that are not part of the legitimate installation.

  ---

  ### Prioritization

  This alert has medium severity due to the potential for unauthorized system access. The likelihood of malicious abuse is moderate, as ScreenConnect can be weaponized by adversaries for remote control purposes. However, it is not uncommon for legitimate business activities to trigger this alert, which can complicate prioritization.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist if the logs for outbound connections are not properly configured or if ScreenConnect uses a non-standard domain. Legitimate remote support activities may trigger this alert, and necessary logging configurations should include Windows Filtering Platform logs. A related detection rule monitoring other remote access tools could strengthen security posture by providing additional coverage.

