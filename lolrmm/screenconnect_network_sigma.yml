note: |
  ### Technical Context

  This rule detects outbound network connections to known domains associated with the ScreenConnect Remote Monitoring and Management (RMM) tool. Attackers may leverage ScreenConnect for remote access to systems, often as a means to maintain persistence or perform administrative tasks without detection. The relevant MITRE ATT&CK tactic is Command and Control (T1071.001), and the technique is Application Layer Protocol: Web Protocols. The primary telemetry source is Windows network connection logs (Event ID 5156), capturing traffic while monitoring for connections to specified ScreenConnect domains.

  If malicious, the security impact could enable attackers to control the affected system remotely, facilitating further actions like data exfiltration or lateral movement. It is important to note that this detection alone does not confirm the presence of malicious activity, as legitimate use of the ScreenConnect tool may trigger the alert.

  ### Investigation Steps

  - **Check for legitimate use of ScreenConnect:** Investigate whether any remote access activity using ScreenConnect is expected based on recent work requests or IT support tickets. Validate this activity against known asset management records.

  - **Analyze network connection logs:** Review Windows Security Event ID 5156 for outbound connections to any of the specified ScreenConnect domains. Look for IP addresses associated with ScreenConnect that may be tied to unauthorized access.

  - **Inspect process activity:** Use Sysmon Event ID 3 to correlate the specific user process generating the network connections. A legitimate process with a known image path string indicates benign activity.

  - **Identify high-confidence malicious indicators:** Cross-reference detected IP addresses or domain names in threat intelligence feeds. If the destination is linked to known malicious activity or unauthorized access attempts, flag this connection as potential compromise.

  - **Examine user accounts involved:** Investigate the user account initiating the connection to determine if it has proper permissions or if it appears anomalous. Event ID 4624 can help identify account logins associated with the connections.

  - **Review asset criticality:** Consider the role of the affected machine. If the machine is a critical system (e.g., a domain controller or sensitive server), escalate the investigation promptly due to potentially elevated risks.

  ### Prioritization

  The alert severity is medium based on the potential impact of unauthorized remote access to critical systems. While ScreenConnect is often used for legitimate purposes, its capabilities for remote control can be weaponized by adversaries, necessitating closer examination when triggered.

  ### Blind Spots and Assumptions

  Detection may miss legitimate use cases amidst high volumes of authentic remote support activities. Ensure logs from firewalls and network monitoring tools are configured to capture all outbound traffic effectively. Additionally, common tools used by IT support might also trigger this alert. A complementary detection could involve monitoring for suspicious patterns of activity following an alert, such as unusual file modifications or account logins, enhancing the analysis of potential compromises.

