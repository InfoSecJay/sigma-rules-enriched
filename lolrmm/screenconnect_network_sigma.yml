note: |
  ### Technical Context

  This rule detects network activity related to the ScreenConnect remote management tool, specifically connections to domains associated with the tool such as control.connectwise.com and related subdomains. The likely attacker objective is to establish remote access to a compromised system for further exploitation or data exfiltration. This behavior fits into the MITRE ATT&CK framework under the tactic of Remote Execution (Tactic ID: TA0002) and the technique of Remote Desktop Protocol (Technique ID: T1219).

  Primary telemetry sources include Windows network connection logs, specifically monitoring for outbound connections to designated ScreenConnect domains. If malicious, this could facilitate unauthorized access and control over enterprise systems, posing a significant security threat. It is crucial to understand that this detection does NOT confirm malicious activity on its own, as ScreenConnect could be used legitimately within the organization.

  ### Investigation Steps

  - **Verify network connection details:** Check Windows Security Event ID 5156 (Windows Filtering Platform) logs for outbound connections to `control.connectwise.com`, `*.connectwise.com`, or `*.screenconnect.com`. Note the process ID and user associated with these connections.

  - **Assess legitimate use cases:** Review internal documentation or ticketing systems to verify if ScreenConnect is a sanctioned tool within the organization. Confirm if there are any ongoing remote support sessions that would explain the network activity.

  - **Correlate with process execution:** Investigate if the detected network connections align with the creation of screen management processes by checking Security Event ID 4688 for process creation events linked to ScreenConnect executables. Look specifically for any suspicious command-line arguments.

  - **Identify high-confidence malicious indicators:** Pay close attention to any unexpected outbound connections originating from high-risk or sensitive assets, such as Domain Controllers or servers with critical data. Review the source IP addresses for any known malicious or untrusted sources.

  - **Examine host logs for additional context:** Look into Sysmon Event ID 3 (Network Connection) to gather detailed information about network activity, including the executing user and process name. Cross-reference these details against known benign use cases.

  - **Check for file artifacts or installations:** Investigate the presence of ScreenConnect installation files on the system, looking in common installation directories and checking file properties for timestamps and digital signatures that may suggest unauthorized installation.

  ### Prioritization

  This alert is considered medium severity due to the potential for malicious use of legitimate remote access tools in targeted environments. Systems involved could be critical depending on their role within the organization, and such remote access capabilities are commonly weaponized by attackers post-compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of ScreenConnect, potentially leading to false positives from authorized remote support activities. Reliable detection requires clear visibility into all outbound network connections and appropriate logging of process execution events. Ensure visibility on alternative remote access tools that could be similarly abused, such as TeamViewer or AnyDesk, enhancing overall monitoring of remote support tool usage.

