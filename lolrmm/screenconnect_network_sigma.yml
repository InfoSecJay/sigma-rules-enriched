note: |
  ### Technical Context

  This rule detects outbound network connections to known ScreenConnect service hosts, which are associated with remote management and support tools. Attackers may use ScreenConnect to gain unauthorized remote access to a target's systems, aiming for data exfiltration, lateral movement, or to maintain persistence. This behavior is relevant to the MITRE ATT&CK tactic **Execution** (TA0002) and technique **Remote Management Software** (T1219).

  The primary telemetry source is Windows network connection logs that capture outbound connections (e.g., Windows Firewall logs, Sysmon Event ID 3). If this activity is malicious, it could result in unauthorized remote access, leading to system compromise. Importantly, this detection does not confirm malicious intent on its own, as ScreenConnect can also be used for legitimate remote assistance.

  ### Investigation Steps

  - **Verify connection logs**: Check Windows network connection logs (e.g., Sysmon Event ID 3) for outbound connections to `control.connectwise.com` and any subdomains of `connectwise.com` and `screenconnect.com`. Note the source IP and user account involved in the connection.

  - **Assess user behavior**: Review user activity around the time of the connection for anomalous login patterns or unauthorized administrative actions. Compare against expected behavior from the user or role.

  - **Identify malicious indicators**: Look for unexpected ScreenConnect client installation artifacts in the system, such as registry keys under `HKEY_LOCAL_MACHINE\SOFTWARE\ConnectWise\ScreenConnect`, which may indicate unauthorized software installation.

  - **Review recent software installations**: Examine Windows logs (Event ID 11724) for any recent installations of ScreenConnect client software, especially by users without appropriate privileges. Cross-check with organizational policies on remote access tools.

  - **Determine legitimate usage**: Ensure that scheduled support sessions or pre-approved maintenance activities are logged properly. If the outbound connection corresponds to a known support session, it may be benign.

  - **Check for exfoliation artifacts**: If malicious activity is suspected, search for file transfers or unusual data exports occurring around the time of the detected connection, potentially leveraging Sysmon Event ID 11 or user application logs.

  ### Prioritization

  This alert indicates medium severity primarily due to the potential impact of unauthorized remote access on sensitive systems. While not extremely common in attacks, the likelihood of malicious exploitation exists, particularly against high-value targets, as remote management tools are often weaponized by attackers seeking quick access.

  ### Blind Spots and Assumptions

  This detection may be evaded if the attacker uses less-known remote management tools or disguises the connection through alternative domains. Reliable detection requires proper configuration of log sources, including Sysmon and Windows Firewall. Legitimate activities such as IT support teams using ScreenConnect for maintenance could trigger this alert. A related detection could involve monitoring for anomalous user behavior that correlates with unauthorized tool usage, enhancing overall coverage.

