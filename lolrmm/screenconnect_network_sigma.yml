note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the ScreenConnect remote monitoring and management (RMM) tool. The likely attacker objective is unauthorized remote access, which could facilitate further actions like data exfiltration or malicious software deployment. This detection correlates with the MITRE ATT&CK tactic for Command and Control (TA0011) and the technique for Remote Access Tools (T1219).

  The primary telemetry sources are Windows network connection logs, specifically focusing on destinations resolving to known ScreenConnect servers (e.g., control.connectwise.com). If malicious, successful exploitation could lead to significant security impacts, including loss of data confidentiality and integrity. Importantly, this rule does NOT confirm that the activity is malicious; legitimate use of ScreenConnect by IT teams may trigger this alert.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows network connection logs (Event ID 5156) for outbound connections to destination hostnames ending with ‘*.connectwise.com’ or ‘*.screenconnect.com’. Connections to these hosts warrant further scrutiny.

  - **Identify usage context:** Determine if ScreenConnect is used within the environment. Check for documented use cases or internal policies regarding ScreenConnect (valid usage should correspond with IT management activities).

  - **Examine associated processes:** Investigate running processes on the affected host with Sysmon Event ID 1 to confirm if unusual children processes (e.g., if ScreenConnect is not typically running) were spawned from legitimate processes.

  - **Correlate with historical data:** Analyze prior network activity logs for any patterns of consistent access to ScreenConnect servers. Valid administrative remote access sessions will reflect typical operating hours and consistency in IP addresses.

  - **Look for high-risk behaviors:** Investigate logs for attempts to modify user accounts or permissions immediately preceding or following the connections to these RMM hosts (Event ID 4728 or 4740). This can indicate potential account takeover attempts.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of the affected system. While unauthorized access can have severe repercussions, the likelihood of malicious abuse varies based on known legitimate deployments of ScreenConnect within the organization.

  ### Blind Spots and Assumptions

  The detection may miss instances where obfuscation techniques are used, such as using custom domains that resolve to the same IPs as ScreenConnect servers. Adequate logging from firewalls and network devices is necessary for comprehensive visibility. Legitimate administrative activity from IT personnel using ScreenConnect may also trigger alerts. A companion detection to strengthen oversight could involve monitoring failed authentication attempts which may indicate unauthorized access attempts.

