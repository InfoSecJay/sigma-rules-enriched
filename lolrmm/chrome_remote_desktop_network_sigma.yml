note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the domains associated with Chrome Remote Desktop. The behavior indicates potential use of this remote management tool, which can enable attackers to access compromised systems undetected, facilitating unauthorized data access or lateral movement. This activity aligns with the MITRE ATT&CK tactic of Remote Access (TA0009) and the technique Remote Access Software (T1219).

  The primary telemetry source is Windows network connection logs, specifically capturing outbound traffic to specified Google domains. If malicious, the impact could include unauthorized access to sensitive data or resources. This detection alone does NOT confirm that malicious activity is taking place; it requires context to differentiate between legitimate use and unauthorized access attempts.

  ### Investigation Steps

  - **Review network connection logs:** Check for Event ID 5156 (Windows Filtering Platform) or Windows Firewall logs to identify connections initiated by user processes to the identified domains: remotedesktop.google.com, etc.

  - **Identify process initiating connections:** Look for the associated process with the outgoing connections using Event ID 4688, which indicates process creation. Analyze process parent-child relationships to ascertain legitimacy.

  - **Examine user context:** Check user account activity associated with the connections. If the user does not require remote access tools for their role, investigate further. Legitimate users typically have roles that necessitate remote access.

  - **Investigate for elevated privileges:** Review for any signs of process execution with elevated privileges using Event ID 4672. Malicious actors often use elevated access levels to run remote desktop applications.

  - **Correlate additional reconnaissance activities:** Look for other signs of compromise, such as unusual user login times or connections from unexpected locations, especially if they precede the remote desktop activity, signaling potential exploitation.

  ### Prioritization

  This alert is of medium severity as it indicates potential unauthorized remote access to enterprise systems, which can be a precursor to significant data breaches. Given the ease of access with such tools, even benign use by insiders can lead to exploitation by malicious actors.

  ### Blind Spots and Assumptions

  This detection may be evaded by using encrypted tunnels to obscure the traffic or by spoofing legitimate application behavior. Reliable detection requires full visibility into outbound connections, including firewall logs and network traffic capturing. Legitimate users may trigger this alert while using legitimate Chrome Remote Desktop for remote work. A companion detection to strengthen coverage could include monitoring for unusual process creations associated with remote administration tools or tracking logins from unauthorized locations.

