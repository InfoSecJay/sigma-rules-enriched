note: |
  ### Technical Context

  This rule detects network connections to Google’s Chrome Remote Desktop service, which may indicate the unauthorized use of a remote management tool (RMM) for system access. An attacker could leverage this tool for control over compromised hosts, facilitating lateral movement or data exfiltration. The relevant MITRE ATT&CK tactic is **Command and Control (T1071)**, with the specific technique being **Application Layer Protocol (T1219)**.

  The primary telemetry source is Windows Network Connection logs, particularly focusing on outbound connections to specific domain namespaces associated with Chrome Remote Desktop. A potential security impact would include unauthorized access to sensitive systems, enabling attackers to manipulate, steal, or destroy data. However, this detection does NOT confirm malicious activity on its own, as legitimate use of Chrome Remote Desktop by authorized users may trigger these alerts.

  ### Investigation Steps

  - **Identify outbound connections:** Review Windows Security Event ID 5156 to verify outbound connections to 'remotedesktop.google.com' and associated domains. Note the source, destination, and process initiating the connection.

  - **Correlate process creation events:** Check Sysmon Event ID 1 for process creation relating to these connections. Look for processes such as 'chrome.exe' or other unexpected applications that might be utilizing Chrome Remote Desktop.

  - **Verify legitimacy of user activity:** Investigate the user account associated with the connections. Confirm if the account has a legitimate reason to use Chrome Remote Desktop, such as remote support scenarios, especially on non-critical assets.

  - **Look for abnormal login patterns:** Examine Windows Security Event ID 4624 for logins preceding the network activity. Multiple concurrent sessions or logins outside of normal working hours can indicate potential misuse.

  - **Assess for additional malicious indicators:** Monitor for associated suspicious activity, such as connections to additional known malicious command-and-control servers or abnormal data exfiltration patterns, by reviewing Windows Firewall logs.

  ### Prioritization

  This alert carries a **medium severity** level due to the potential for command and control activities. While Chrome Remote Desktop can be used legitimately, its association with unauthorized remote access makes it a risk. The ability of adversaries to weaponize such tools for malicious purposes raises the alert's relevance in a mature enterprise SOC.

  ### Blind Spots and Assumptions

  This detection may have limitations due to legitimate use of RMM tools like Chrome Remote Desktop in internal environments. It presupposes that the configuration for Windows Firewall and Security logs is enabled to capture the necessary telemetry. Additionally, benign activities such as remote support sessions by IT staff can trigger this alert. Related detections such as unauthorized access attempts (e.g., Event ID 4625 for failed logins) may enhance overall coverage and context around suspected misuse.

