note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the Chrome Remote Desktop application by monitoring connections to specific Google-related domains. Attackers may use such remote monitoring and management (RMM) tools to gain unauthorized access to systems, enabling them to control devices remotely, exfiltrate data, or spread malware. The relevant MITRE ATT&CK tactic is Execution, specifically technique T1219 (Remote Access Software).

  The primary telemetry sources for this detection are Windows network connection logs, capturing outbound connection attempts. If the behavior is malicious, it poses significant risks, as unauthorized remote access can lead to data breaches or system compromise. It is essential to note that this detection does NOT confirm malicious intent on its own; legitimate usage of Chrome Remote Desktop is also common.

  ### Investigation Steps

  - **Review outbound connections:** Check network connection logs for Event ID 5156 (Windows Filtering Platform) to identify connections to domains ending with '*.remotedesktop.google.com' and related subdomains.

  - **Identify the process origin:** Investigate the process generating the network connection using Event ID 4688 (Process Creation) to establish whether it is a legitimate application or unknown process.

  - **Analyze user behavior:** Evaluate user login and activity logs (Event ID 4624) to determine if a legitimate user initiated the remote desktop session, corroborating expected user behavior.

  - **Correlate with application logs:** Look for entries in Windows Event Logs related to the Chrome Remote Desktop application (Applications and Services Logs -> Google -> Chrome Remote Desktop) to confirm legitimate usage patterns.

  - **Check for file changes:** Validate recent file modifications or new executable files within %LOCALAPPDATA%\Google\Chrome Remote Desktop that may indicate unauthorized installation or compromise.

  ### Prioritization

  The alert has medium severity due to the potential impact of unauthorized remote access on sensitive systems. Given that RMM tools like Chrome Remote Desktop can be weaponized by attackers, the likelihood of abuse is notable, warranting further investigation to prevent exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging for legitimate Chrome Remote Desktop activity, leading to false positives. RMM tool usage will also depend on appropriate configurations of network log sources to ensure reliability. Legitimate network traffic for business operations could trigger this alert, especially in environments using RMM tools for IT support. Companion detections, such as monitoring for unusual process creation behavior related to remote access software (e.g., Event ID 4688), can strengthen overall coverage against unauthorized access attempts.

