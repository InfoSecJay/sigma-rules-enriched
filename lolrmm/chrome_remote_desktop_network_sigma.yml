  ---

  ### Technical Context

  This Sigma rule detects outbound network connections to various domains associated with Google Chrome Remote Desktop (CRD). The behavior indicates that an attacker might be leveraging CRD for remote access, allowing unauthorized control over the affected system. The likely objective is to maintain persistence and facilitate further exploitation within the organization. This activity aligns with the MITRE ATT&CK tactic "Execution" (T1203) and technique "Remote Services" (T1219).

  Primary telemetry sources include network connection logs from Windows (Event ID 5156 from Windows Firewall and related firewall logs). If malicious, this could lead to unauthorized access and control over systems, exacerbating the risk of data breaches or additional lateral movement. It is important to note that this detection does NOT confirm malicious intent; legitimate users may also use Chrome Remote Desktop for remote access.

  ---

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Firewall logs (Event ID 5156) for outbound connections to CRD domains such as `remotedesktop.google.com`, focusing on the `DestinationHostname` field.

  - **Analyze authenticated users:** Validate which user accounts initiated the connections by correlating Event ID 4624 (Logon) from Security logs to see if it aligns with known personnel. Benign connections will likely come from authorized IT staff.

  - **Identify unusual connections:** Look for unexpected times of interaction with CRD domains, such as connections outside normal business hours, which may indicate unauthorized use.

  - **Review process creation logs:** Search for any associated process creation events using Sysmon Event ID 1 that show the execution of CRD-related applications (e.g., `chrome.exe` running `chrome_remote_desktop_host.exe`).

  - **Examine machine roles:** Consider the role of the impacted host (e.g., whether it is a server or workstation) and how it fits into company procedures for remote access. Unapproved systems running CRD should be flagged.

  - **Check for exfiltration artifacts:** Validate nearby network connections (Event ID 5156 or DNS logs) for any unusual data transfers that might accompany CRD activity, indicating data exfiltration attempts.

  ---

  ### Prioritization

  This alert has medium severity due to the risk of unauthorized remote access on sensitive systems. The likelihood of malicious use is notable since CRD is a well-known remote access tool, and its misuse is commonly seen in both targeted and opportunistic attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may miss direct connections to CRD using IP addresses or other obfuscation methods. Reliable detection requires proper configuration of Windows Firewall logging to capture all events. Legitimate activities, such as IT department staff using CRD for remote support, may trigger the alert. Implementing companion detections for other remote access tools (e.g., TeamViewer, AnyDesk) can enhance coverage.

