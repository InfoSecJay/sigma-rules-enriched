note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with Chrome Remote Desktop, a remote management tool that allows users to access other computers via the Google cloud infrastructure. The likely attacker objective is unauthorized access to systems, potentially for data exfiltration or further exploitation. This behavior aligns with the MITRE ATT&CK tactic "Command and Control" (TA0011) and specific technique "Remote Management Software" (T1219). The primary telemetry source is Windows network connection logs, specifically tracking DNS queries or network connection attempts.

  The security impact of malicious use includes potential unauthorized access, control over sensitive data, or lateral movement within the network. This detection does NOT confirm malicious intent on its own, as legitimate use of Chrome Remote Desktop may trigger similar alerts.

  ### Investigation Steps

  - **Check network connections:** Review Windows Event ID 5156 (Windows Filtering Platform), filtering for connections to domains such as *.chromoting-client.talkgadget.google.com or *.remotedesktop.google.com. A high volume of connections in a short time may indicate malicious activity.

  - **Correlate user activity:** Analyze user account logins from Security Event ID 4624 to determine if the initiating user had legitimate administrative privileges. Unexpected use by non-admin users may indicate compromise.

  - **Validate known good activity:** Confirm if users within your organization utilize Chrome Remote Desktop. Check corporate communications for authorized usage, or compare against IT asset inventories to identify benign behavior.

  - **Monitor for additional C2 indicators:** Cross-reference network activity with threat intelligence on known malicious domains or services associated with remote access software. Investigate any connections to suspicious IPs or unexpected domains.

  ### Prioritization

  This alert is categorized as medium severity given the potential impact of unauthorized remote access. While the likelihood of malicious abuse hinges on the organizational context, the use of remote management software is known to be weaponized in several attacks. Therefore, any detection necessitates prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where Chrome Remote Desktop is used legitimately. Reliable detection requires logging configurations that capture Windows Filtering Platform events. Legitimate activities such as IT support sessions or scheduled remote access may generate similar alerts. To strengthen coverage, consider companion detections for other remote desktop protocols, including RDP and VNC, which could indicate coordinated exploitation attempts.

