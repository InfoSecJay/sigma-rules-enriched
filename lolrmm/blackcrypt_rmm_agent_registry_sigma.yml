note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows registry, specifically targeting the key that establishes persistence for the BlackCrypt RMM Agent. This behavior suggests an attempt to maintain ongoing access to a compromised system, indicative of a potential adversary objective to conduct remote monitoring and management for malicious activities. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011) with the technique being **Application Layer Protocol** (T1219).

  The primary telemetry source for this detection comes from Windows registry event logs, specifically monitoring changes to the registry path `HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run`. If this behavior is malicious, it could lead to unauthorized remote access and continued exploitation of the network. This detection alone does not confirm that the system is compromised or being actively exploited; it only identifies potential setup for malicious activity.

  ### Investigation Steps

  - **Check registry modifications**: Review the Windows registry to confirm recent changes to `HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run` for `BlackCryptAgent`. Look for entries with timestamps that do not align with normal operational behavior.

  - **Identify the process responsible**: Use Sysmon Event ID 1 (Process Creation) to correlate any process creation events around the same time as the registry modification. Look for unusual parent-child process relationships indicative of malicious activity, such as `cmd.exe` or `powershell.exe` invoking processes.

  - **Analyze user activity**: Review Security Event ID 4624 (Logon) to identify which user account performed the registry modification. Determine if the user has the appropriate permissions for such changes and verify user activity logs for that timeframe.

  - **Review related legitimate software**: Investigate whether BlackCrypt RMM Agent is a known and authorized tool within your organization. Recognize legitimate activities that involve this software, especially if it's used for remote support, and compare against the context of the registry modification detected.

  - **Investigate network activity**: Inspect network logs for outbound connections to known malicious IPs or domains associated with BlackCrypt. Utilize firewall logs or proxy logs for patterns aligning with unusual outbound traffic when the registry change was detected.

  ### Prioritization

  This alert should be treated with medium severity due to the nature of the affected system, as modifications to startup registry entries typically indicate an attempt to establish persistent access, which is commonly weaponized by attackers leveraging remote access tools. Although the use of BlackCrypt could be legitimate, the associated risks necessitate prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if the logs are not properly configured to capture all relevant registry changes. An adversary might employ evasion techniques such as using alternative persistence mechanisms which do not involve the registry path specified. Legitimate administrative actions or software updates could trigger similar alerts. A companion detection to consider is monitoring for unusual network connections from systems where the BlackCrypt registry activity has been detected.

