note: |
  ### Technical Context

  This Sigma rule detects network connections to the Absolute (Computrace) RMM tool, specifically targeting domains such as `search.namequery.com` and `server.absolute.com`. The goal of this detection is to uncover potential unauthorized access or remediation efforts by an attacker leveraging a remote management tool to maintain persistence or exfiltrate data. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and technique Remote Management Tools (T1219).

  Primary telemetry sources include Windows network connection logs and may involve Event ID 5156 or Sysmon Event ID 3. The security impact could be significant if the tool is misused for illicit purposes, as it can facilitate remote access and control over compromised systems. Importantly, this detection does NOT confirm malicious intent without corroborating evidence from additional investigative steps.

  ### Investigation Steps

  - **Validate network connections to suspicious domains:** Review Windows Firewall logs (Event ID 5156) for outgoing connections to `search.namequery.com` and `server.absolute.com`. Confirm if these connections originate from known Absolute (Computrace) installations.

  - **Check the presence of Absolute client software:** Authenticate that the legitimate Absolute (Computrace) client is installed on the asset in question. Inspection of Application logs or installed programs (via `Get-InstalledProgram` or via the GUI) can confirm expected operational status.

  - **Assess the system's role:** Determine if the affected system is part of a critical infrastructure or sensitive environment. Check asset classification or tagging within your asset management system.

  - **Identify high-confidence malicious indicators:** Look for unusual command line arguments associated with these network connections in Sysmon logs (Event ID 1). For example, if the process launching the connection has a suspicious parent process or shows anomalous behavior.

  - **Conduct a review of DNS logs:** Examine DNS logs for resolution requests to the detected domains in the last 24 hours to assess if the activity correlates with an established threat or unauthorized activity pattern.

  ### Prioritization

  The severity of this alert is medium due to its potential to indicate a foothold in the network via a known remote management tool that can be weaponized for unauthorized access. The likelihood of abuse is moderate, particularly if emerging from unauthorized endpoints.

  ### Blind Spots and Assumptions

  The detection may not capture cases where legitimate Absolute (Computrace) use occurs, leading to false positives. Reliable detection relies on the proper configuration of logging for network connections and proper endpoint visibility. Additionally, legitimate administrative tasks may trigger this alert if users unknowingly utilize compromised accounts. A related detection could include monitoring for unusual PowerShell executions (T1086) in conjunction with RMM tool activity, enhancing visibility into possible exploitation.

