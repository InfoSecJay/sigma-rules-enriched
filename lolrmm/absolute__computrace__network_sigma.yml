note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the Absolute (Computrace) remote monitoring and management (RMM) tool, specifically targeting DNS requests to known Absolute server domains. The likely attacker objective could involve unauthorized monitoring or control of systems after exploitation or installation of backdoors. This behavior aligns with the MITRE ATT&CK tactic of **Command and Control (T1071)** and technique of **Application Layer Protocol (T1219)**.

  The primary telemetry sources include Windows network connection logs, specifically monitoring DNS queries to domains like `*.search.namequery.com` and `*.server.absolute.com`. If the observed activity is malicious, it may indicate an adversary leveraging this legitimate RMM tool for nefarious purposes, such as exfiltrating data or maintaining persistence. This detection does NOT confirm that the use of Absolute (Computrace) is malicious—there are legitimate scenarios where this tool is employed by organizations for asset management.

  ### Investigation Steps

  - **Review network connections to Absolute domains**: Use Windows Event ID 5156 (Windows Filtering Platform) to identify connections to `*.search.namequery.com` and `*.server.absolute.com`. Document the source IP, destination, and timestamp to assess potential malicious intent.

  - **Verify legitimate use cases**: Consult asset inventory to confirm if the detected system is authorized to use Absolute (Computrace). If the tool is in use, the connection can likely be deemed benign, especially for endpoint machines.

  - **Check for unusual request patterns**: Filter logs for an anomalous frequency of requests from the same IP address to Absolute domains, as such patterns may indicate unauthorized use. Compare volume against typical access metrics for that asset.

  - **Correlate with other security alerts**: Cross-reference findings with other alerts such as suspicious process creations (Event ID 4688) or user account logins (Event ID 4624) occurring nearby in time to enhance context around the detected activity.

  - **Investigate potential data exfiltration**: If the analysis points to excessive data transfer associated with Absolute connections, validate file creation or transfer logs to identify any unauthorized data movement.

  ### Prioritization

  This alert carries medium severity due to the potential use of legitimate software for unauthorized access. While Absolute (Computrace) can be a benign tool for asset management, its misuse has been noted in adversary tactics, making its detection pertinent. The potential impact on sensitive data compromise elevates the alert's priority.

  ### Blind Spots and Assumptions

  Detection may be limited by the accuracy of DNS logs and could be evaded by attackers modifying their tool to use less obvious communication methods. Reliable detection requires that DNS logging is enabled and that the domains are not whitelisted in the environment. Legitimate use cases can include organizational asset management, resulting in false positives for authorized users. A relevant companion detection could include alerts for unusual administrative activities or modifications related to endpoint configurations, which may strengthen comprehensive coverage of potential threats.

