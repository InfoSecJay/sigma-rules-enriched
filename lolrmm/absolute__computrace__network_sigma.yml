note: |
  ### Technical Context

  This rule detects network connections to Absolute (Computrace) RMM tool endpoints, specifically targeting domains associated with the service. The likely objective of an adversary using this tool could be unauthorized remote monitoring or management of targeted systems, enabling continued access to compromised devices or environments. This behavior falls under the MITRE ATT&CK tactic "Execution" (TA0002) and the technique "Remote Management Tools" (T1219).

  The primary telemetry sources for this detection include Windows network connection logs, specifically focusing on domain lookups that resolve to the specified Absolute endpoints. If this network activity is malicious, it could indicate potential data exfiltration, remote access, or other malicious actions on the affected systems. It is important to note that this detection does NOT confirm malicious intent or activity on its own, as legitimate use of Absolute (Computrace) is a possibility.

  ### Investigation Steps

  - **Identify network connections to suspicious domains:** Review network logs for connections to "search.namequery.com," "*.search.namequery.com," or "server.absolute.com" within Sysmon Network Connection logs (Event ID 3). Correlate timestamps and any patterns of occurrence with other potential indicators of compromise.

  - **Check for Absolute (Computrace) installation:** Verify if the Absolute (Computrace) tool is installed on the affected endpoints by checking for the relevant application in the Program Files directory or through software inventory systems. Legitimate installations should be documented in asset management systems.

  - **Analyze remote management activity:** Investigate any alerts related to remote management activities associated with Absolute (Computrace). Review the Windows Event ID 4624 (Logon) and 4672 (Special Logon) for successful logins indicating administrative access related to the tool’s functions.

  - **Evaluate user behavior post-connection:** Review the actions taken by users during and after the connection to Absolute’s endpoints, such as file transfers or script executions captured in Windows Event IDs 4688 (Process Creation) and relevant Sysmon logs (Event ID 1). Assess whether actions appear consistent with both legitimate and suspicious usage.

  - **Compile threat intelligence:** Gather threat intelligence reports on the use of Absolute (Computrace) for nefarious purposes. Investigate any known techniques, tactics, or procedures (TTPs) used by threat actors that may align with the observed behavior.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of the affected systems, particularly if managed systems hold sensitive data. The likelihood of malicious abuse exists, as adversaries may exploit known RMM tools for unauthorized access or monitoring. While such tools are commonly used, their presence can signify both legitimate administration and potential compromise, requiring contextual investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations regarding legitimate activities, as legitimate users could access Absolute (Computrace) services without malicious intent. Reliable detection depends on having appropriate logging configurations in place, including sufficient logging settings for network activity and application executions. Legitimate use cases include IT management operations; thus, reviewing usage context is necessary. A companion detection that strengthens coverage includes monitoring for unusual administrative logins or remote access activities related to RMM tools, which could provide additional indicators of potential misuse.

