note: |
  ### Technical Context
  This detection rule identifies potential usage of PSEXEC (Clone) RMM tools within an enterprise environment. PSEXEC is a widely-known tool that allows the execution of processes on remote systems, commonly employed by system administrators for legitimate purposes, but also exploited by attackers for lateral movement and remote code execution in compromised networks. The primary threat scenario involves an attacker using these tools to gain unauthorized access to systems, escalate privileges, and execute malicious payloads across the network. The objective of such threats often includes reconnaissance, data exfiltration, or establishing persistence.

  Relevant to this rule are the MITRE ATT&CK tactics of Execution (TA0002) and the specific technique T1219, which details the use of remote services for command execution. By monitoring for the creation of processes associated with known PSEXEC clone binaries, defenders can identify suspicious activities that may indicate an ongoing breach or misuse of legitimate administrative tools.

  Primary data sources for detecting this behavior include Windows process creation logs, which capture detailed information about the processes starting on endpoints, including their parent processes and command-line arguments. Overlaying this information with other telemetry, such as network connections and authentication logs, may provide further context to the activities detected.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs for instances of PSEXEC clone binaries being executed. Pay attention to the command-line arguments for any indicators of suspicious behavior or malicious intent.
  - **Analyze Parent Processes:** Investigate the parent processes associated with any detected PSEXEC clone activity. Identify whether the parent processes are legitimate administrative tools or unusual for the environment.
  - **Check Network Connections:** Look for outbound network connections corresponding to the detected processes, particularly connections to unknown or unexpected IP addresses, which may indicate lateral movement attempts.
  - **Correlate with User Activity:** Cross-reference the detected activities with user account logins to assess whether they align with legitimate administrative activities or suggest unauthorized access.

  ### Prioritization
  The medium severity of this alert is warranted due to the potential for significant impact if PSEXEC clone tools are leveraged by attackers for lateral movement. The likelihood increases in environments with weak access controls or where administrative privileges are mismanaged.

  ### Blind Spots and Assumptions
  This detection logic may miss instances where PSEXEC (Clone) tools are used in novel or modified forms that do not match the specified executable patterns. The assumption is that the tools are executed with identifiable parent processes; however, it may not account for other legitimate software performing similar network functions without using these known executables. Required logs for the alert include comprehensive process creation logs with sufficient granularity and details regarding command-line usage.

