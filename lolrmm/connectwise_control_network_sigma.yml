note: |
  ### Technical Context

  This Sigma rule detects network connections to ConnectWise Control domains, which are remote monitoring and management tools that may be utilized by legitimate IT support teams or malicious actors. The likely attacker objective is unauthorized access or control over endpoints, potentially for data exfiltration or system compromise. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001 - Application Layer Protocol) as it could indicate that adversaries are attempting to manage systems remotely.

  Primary telemetry sources include Windows Network Connection logs where connections to specific domains are recorded. If malicious, this could lead to significant security concerns, including unauthorized access to sensitive data and control over system resources. It is important to note that this detection does NOT prove malicious activity on its own, as ConnectWise Control may be used legitimately by IT staff.

  ### Investigation Steps

  - **Check outbound connections:** Review Windows Security Event ID 5156 logs to identify outbound connections to ConnectWise domains (e.g., '*.control.connectwise.com'). Look for unusual connections from non-admin accounts or during odd hours.

  - **Identify the process initiating the connection:** Use Sysmon Event ID 3 to correlate the process creating the network connection. A legitimate process (e.g., ConnectWise Control executable) may be present but should be verified against expected usage patterns.

  - **Examine recent user activity:** Investigate logon events (Windows Security Event ID 4624) associated with the user initiating the connection. Look for unusual user behavior, such as elevated access or logins from different geographical locations.

  - **Establish baseline behavior for ConnectWise usage:** Confirm that ConnectWise Control is indeed in use as part of regular IT operations. Review internal documentation or consult with IT teams to validate expected access patterns to these domains.

  - **Look for indicators of privilege escalation:** Examine logs for abnormal user privilege changes (Windows Security Event ID 4672). Focus on any log entries indicating accounts being granted admin rights that correspond with ConnectWise usage.

  ### Prioritization

  The alert has medium severity due to the potential impact on sensitive systems if compromised through unauthorized access. While legitimate use cases exist for ConnectWise Control, their network activity, especially from unexpected endpoints, presents a moderate likelihood of being abused in real attacks. This behavior can be weaponized to facilitate lateral movement within the network.

  ### Blind Spots and Assumptions

  Limitations of this detection include the possibility of evasion through encrypted connections that may not trigger logging. Reliable detection requires proper logging configurations for outbound traffic and appropriate monitoring of the environment. Legitimate activities, such as authorized remote support sessions initiated by IT personnel, could also trigger this alert. A related detection could include monitoring for internal process execution (Sysmon Event ID 1) of tools associated with remote access or management, which would enhance overall visibility of potential threats.

