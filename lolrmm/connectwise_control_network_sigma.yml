  ### Technical Context

  This Sigma rule detects network connections to the ConnectWise Control remote management tool, specifically from hosts attempting to reach domains associated with ConnectWise services (live.screenconnect.com and control.connectwise.com). The likely attacker objective is to establish remote control over a compromised system for activities such as lateral movement, data exfiltration, or executing malicious commands, often aligned with the MITRE ATT&CK technique of Remote Services (T1219). The primary telemetry sources are Windows network connection logs, specifically monitoring the destination hostnames of outbound connections. If malicious, this behavior can lead to significant security threats, including unauthorized access to sensitive systems or data. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of ConnectWise Control exists.

  ---

  ### Investigation Steps

  - **Review network connection logs**: Check Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to live.screenconnect.com or control.connectwise.com. Document source IP, destination hostname, and timestamps to assess the legitimacy of the connection.

  - **Identify expected usage**: Assess whether the affected host is designated for remote support or management tasks. If so, ensure prior approval for using ConnectWise Control as part of legitimate operational procedures.

  - **Correlate with user activity**: Analyze User ID fields in Event ID 4624 (Successful Logon) logs to confirm if user logins coincide with the network activity; mismatched times may indicate potential abuse.

  - **Check for high-confidence indicators**: Investigate additional telemetry from Windows Security Event ID 4688 (Process Creation) to see if connectwise.exe or screenconnect.exe was executed around the same time as the network activity. This could indicate a malicious remote access attempt absent legitimate usage.

  - **Evaluate endpoint role and criticality**: Consider the role of the device initiating the connection (e.g., a server, workstation, or critical infrastructure). Network activity from critical assets warrants higher scrutiny due to increased potential for impact.

  - **Log persistent changes**: Validate if any new files or services were created in the context of this activity that may indicate an established foothold, reviewing for unusual paths in the filesystem.

  ---

  ### Prioritization

  Alert severity is medium due to the potential impact of unauthorized remote access, particularly if the affected system is critical or sensitive. The likelihood of malicious abuse is moderate, as the use of remote management tools has become a common tactic for lateral movement and exploitation.

  ---

  ### Blind Spots and Assumptions

  The detection may miss intercepted or obfuscated network traffic aiming to evade filtering of known domains. Reliable detection requires proper logging configuration on host and network layers to capture outbound connections and process creation events. Legitimate IT support activities may trigger this alert when ConnectWise Control is used appropriately. A companion detection to consider includes monitoring for unusual outbound traffic patterns that could indicate exfiltration attempts post-connection.

