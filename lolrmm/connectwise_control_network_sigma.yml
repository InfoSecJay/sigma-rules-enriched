note: |
  ### Technical Context

  This Sigma rule detects network connections to the ConnectWise Control Remote Monitoring and Management (RMM) tool, specifically targeting hosts reaching out to domains like live.screenconnect.com and control.connectwise.com. The likely attacker objective includes unauthorized remote access and control over a targeted system, which aligns with the MITRE ATT&CK tactic "Execution" (TA0002) and technique "Remote Services" (T1219). Primary telemetry sources include Windows network connection logs, specifically tracking outbound connections to aforementioned domain names.

  If malicious, the security impact includes potential unauthorized access to sensitive systems and data, allowing attackers to manipulate or exfiltrate information. This detection does NOT confirm malicious activity on its own; legitimate use of ConnectWise Control for remote administration is common and could generate similar alerts.

  ### Investigation Steps

  - **Review network connection logs**: Analyze Windows network connection logs (Event ID 5156) for outbound connections to live.screenconnect.com or control.connectwise.com, noting the associated process ID and user context.

  - **Validate process initiation**: Check Windows Security Event ID 4688 for process creation events related to the ConnectWise Control executable (e.g., screenconnect.exe). This helps confirm whether the application was legitimately launched by an authorized user.

  - **Cross-examine remote session logs**: If available, review any logging from the ConnectWise Control tool itself for new sessions initiated during the timestamp of the detected connection. Valid sessions should reflect expected administrative behaviors.

  - **Identify signs of malicious use**: Look for any outliers like unusual timeframes (e.g., after-hours connections) or connections initiated by non-administrative user accounts, indicating potential abuse of the tool.

  - **Assess asset criticality**: Determine if the affected systems are sensitive or critical infrastructure (e.g., servers, databases). Increased scrutiny may be warranted if high-value assets are involved.

  ### Prioritization

  This alert has medium severity due to the potential for unauthorized access to critical systems. While the technology can be weaponized, the likelihood of false positives due to legitimate administrative use lowers the immediate priority, but it should be investigated promptly to rule out malicious activities.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by using legitimate administrative tools and user trust, misleading alerts due to authorized remote access operations. Ensure proper logging configuration for monitoring DNS queries to catch resolution of the target domains. Legitimate activities may include valid internal support teams using the tool for maintenance. A complementary detection involves monitoring for abnormal login patterns and session durations associated with screenconnect.exe execution.

