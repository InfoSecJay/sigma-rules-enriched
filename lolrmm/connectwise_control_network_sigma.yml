note: |
  ### Technical Context
  This rule detects potential network activity associated with the ConnectWise Control Remote Monitoring and Management (RMM) tool. ConnectWise Control is often used by IT professionals for remote administration and support. However, if exploited by malicious actors, it can facilitate unauthorized access to systems, allowing attackers to manipulate devices and exfiltrate data. The detection is centered around identifying connections to specific domains associated with ConnectWise Control, indicating possible misuse or malicious intent.

  The primary objective of an attacker utilizing ConnectWise Control would typically be to establish persistent remote access to a victim's system, conduct lateral movement, or deploy additional tools. This behavior can fall under the MITRE ATT&CK tactics of **Execution** and techniques such as **Remote Services: RMM** (T1219), which highlights the use of valid remote management tools for malicious purposes.

  To effectively capture relevant evidence, logs from network connections are crucial. This includes examining Windows network connection logs that detail outbound connections to the specific domains related to ConnectWise Control.

  ### Investigation Steps
  - **Review Network Connection Logs:** Check Windows network connection logs for connections to `live.screenconnect.com` and `control.connectwise.com`, focusing on timestamps and associated user accounts to determine whether the access was legitimate or potentially unauthorized.

  - **Assess User Authorization:** Verify the user accounts initiating these connections to ensure they are authorized to use ConnectWise Control. Investigate if any unauthorized accounts were involved in the activity.

  - **Correlate with EDR Data:** Utilize endpoint detection and response (EDR) tools to analyze related processes and connections during the timeframe of detected network activity to uncover any suspicious behavior that may indicate exploitation.

  - **Conduct Forensic Analysis:** If unauthorized access is suspected, perform forensic analysis on affected endpoints. This can include examining downloaded files and installed applications linked to ConnectWise Control to ascertain whether the tool was misused.

  ### Prioritization
  The alert's medium severity is justified due to the potential impact of unauthorized access through a legitimate remote management tool. While not inherently malicious, the misuse of ConnectWise Control can lead to significant security incidents, thereby necessitating timely investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where the legitimate use of ConnectWise Control is prevalent, potentially leading to false positives when proper controls are not in place. This logic assumes that connections to the specified domains indicate malicious use; however, false alerts can occur if internal operations legitimately utilize these services. Accurate detection depends on the proper configuration of network logging and monitoring tools to capture outbound connection data comprehensively.

