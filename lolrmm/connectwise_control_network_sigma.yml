note: |
  ### Technical Context

  This rule detects outbound network connections to known domains associated with ConnectWise Control, a remote management tool. Attackers may leverage such tools for remote access to compromised environments, facilitating data exfiltration, lateral movement, or persistent presence. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), with the technique being Application Layer Protocol (T1219). The primary telemetry source is Windows network connection logs, specifically monitoring outflowing traffic. If malicious, this behavior could indicate unauthorized access by an adversary. However, this detection does NOT confirm that the activity is inherently malicious without additional context.

  ### Investigation Steps

  - **Review Recent Network Connections:** Check for outbound connections to 'live.screenconnect.com' and 'control.connectwise.com' in Windows Event ID 5156 (Windows Filtering Platform). Legitimate connections may indicate authorized remote access activity.

  - **Cross-Reference Systems:** Identify if the system generating the alert is an already known administrative or support workstation. Legitimate usage on such systems should be expected, while unexpected usage on sensitive/critical systems may raise concerns.

  - **Examine User Context:** Investigate the user account associated with the connection attempt via Windows Event ID 4624 (Logon). Assess whether the user has elevated privileges or a history of remote tool usage. Authorized personnel would have a legitimate user context.

  - **Check for Concurrent Processes:** Look for related processes spawned during the network connection using Sysmon Event ID 1 (Process Creation). Unfamiliar parent process hierarchies leading to the ConnectWise connection may indicate lateral movement attempts.

  - **Analyze Security Alerts:** Correlate other security events around the same timeframe, such as failed login attempts (Event ID 4625) or other suspicious activities, to establish a pattern of potentially malicious behavior.

  - **Validate Historical Trends:** Check historical network logs for similar connections over extended periods to differentiate between one-off legitimate uses versus persistent connectivity that suggests adversarial presence.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems. While remote management tools are common for legitimate purposes, their abuse poses a substantial risk. Such behavior can be weaponized in various attacks, increasing urgency for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by known evasion techniques such as patching or obfuscating network traffic. Log sources must be consistently configured to capture outbound network traffic for effective detection. Legitimate uses of ConnectWise Control by IT staff may trigger the alert. Companion detections can include monitoring for anomalous credential usage (e.g., Event ID 4625) to enhance coverage against potential abuse.

