note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Faronics Deep Freeze RMM tool, which is often used for endpoint management and system restoration in a corporate environment. Attackers may utilize this tool to gain persistence on a compromised system or to execute unauthorized changes under the guise of legitimate system management. This behavior aligns with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on process creation events tied to known Deep Freeze executables. If this behavior is executed maliciously, it can result in unauthorized access or persistent backdoor installations on managed devices. Importantly, this detection does NOT confirm that malicious activity is occurring; it indicates only that processes typically associated with Remote Monitoring and Management (RMM) tools are being initiated.

  ### Investigation Steps

  - **Review process creation logs**: Examine Security Event ID 4688 logs for any of the following images: `DFServ.exe`, `DFServEx.exe`, `DFWks.exe`, and others listed in the rule. Look for anomalous parent processes that are not typically associated with legitimate Deep Freeze operations.

  - **Correlate with user activity**: Check for recent user login events (Security Event ID 4624) before the detected process creation. Legitimate use cases will usually have accompanying logins from trusted user accounts, whereas malicious use may stem from automated or unauthorized logins.

  - **Identify unusual command line arguments**: Investigate the command line parameters for the detected processes. Malicious actors may modify how legitimate tools are run, so look for suspicious or unusual options, or unfamiliar arguments in the command line fields.

  - **Examine parent-child process relationships**: Analyze the processes leading to the execution of the detected images. Identify if the parent process is a valid system management tool or appears to be exploiting these images for unauthorized purposes.

  - **Check asset criticality**: Assess the sensitivity and criticality of the asset from which the alert has been triggered. Systems with higher criticality should receive immediate attention to prevent potential exploitation.

  - **Monitor for subsequent indicators of compromise**: Validate if any of the detected processes attempt to create new user accounts or modify system settings, which should be seen as a high-confidence malicious indicator.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on operational systems if managed by an attacker. The likelihood of malicious use is elevated, especially if the detected processes are found on systems where deep freeze is not expected or documented. While the tool itself is legitimate, its misuse is frequently weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  This detection may be limited by the legitimate use of Faronics Deep Freeze within the organization and can generate false positives if used for regular system management. The detection requires comprehensive monitoring of process creation logs, and any misconfiguration might lead to missed alerts. Legitimate activities could include routine system maintenance or updates performed by IT staff. A related detection to consider is monitoring for unusual network traffic patterns associated with remote management tools that could strengthen coverage of potential malicious use.

