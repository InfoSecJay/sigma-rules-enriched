note: |
  ### Technical Context

  This rule detects process activity related to Faronics Deep Freeze, a system restore and management tool. An attacker may leverage Deep Freeze for unauthorized system modifications or data persistence on targeted machines. This behavior aligns with MITRE ATT&CK techniques Command and Control (T1071) and Tool Use (T1219). The primary telemetry source involves Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture details such as the process name, start time, and parent process. If malicious, this could allow the adversary to maintain a foothold and manipulate system configurations. This detection does NOT confirm malicious intent on its own, as the legitimate use of Deep Freeze could also trigger the alert.

  ### Investigation Steps

  - **Review Process Creation Events:**
    Check Security Event ID 4688 and Sysmon Event ID 1 for processes created by the listed executables under the 'Image' field. Look for legitimate instances linked to IT administrative actions.

  - **Examine Parent Process Relationships:**
    Validate that the parent process for any detected activity is one of the specified Faronics executables (e.g., `DFServ.exe`). Unexpected parent processes may indicate malicious use.

  - **Identify High-Confidence Malicious Indicators:**
    Confirm any markers of unusual execution patterns, such as creation timestamps out of normal business hours or on systems not known to use Deep Freeze, which could suggest evasion tactics.

  - **Cross-Reference with Asset Inventory:**
    Verify whether the alerting asset is an authorized user workstation or server using Deep Freeze. Unrecognized assets may indicate a broader compromise.

  - **Evaluate System Integrity Monitoring Alerts:**
    Look for changes in system files or configurations that align with unauthorized use of the tool. Check for indicators of file integrity violations post-execution of the detected process.

  ### Prioritization

  The alert severity is medium due to the potential impact on system integrity and its ability to be exploited for malicious purposes. While Faronics Deep Freeze is legitimate software, its usage patterns can be weaponized for persistence, making the likelihood of abuse credible.

  ### Blind Spots and Assumptions

  Detection relies on the proper configuration of Windows process creation logging. Evasion may occur through manipulated timestamps or disguised executables. Legitimate software updates or administrative tasks using Deep Freeze could trigger this alert. A companion detection to consider is monitoring for concurrent network activity related to known C2 addresses, enhancing coverage against evasive behaviors.

