note: |
  ### Technical Context

  This Sigma rule detects the execution of the Rocket Remote Desktop (RMM) tool, specifically monitoring for process creation events related to `RDConsole.exe` and `RocketRemoteDesktop_Setup.exe`. The potential attacker objective could be to establish remote control over a compromised system, enabling further malicious actions such as data exfiltration or lateral movement within the environment.

  This detection aligns with the MITRE ATT&CK framework under the tactic of Command and Control (T1071) and the technique of Remote Access Software (T1219). Primary telemetry sources include Windows security logs for process creation events (Event ID 4688) and possible Sysmon logs (Event ID 1) that detail process creation with associated parent processes. If the detected activity is malicious, the security impact could be significant, allowing unauthorized access and manipulation of systems. However, it’s important to note that this detection does NOT confirm that the activity is malicious on its own, as Rocket RMM tools may be used legitimately.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for instances of `RDConsole.exe` or `RocketRemoteDesktop_Setup.exe` being executed. Look for unusual parent processes that may indicate unexpected initiation.

  - **Identify parent process context:** Verify the parent process for any detected RMM activity. A legitimate launch often occurs from known IT management tools or administrators’ sessions, while unusual parent processes may suggest malicious activity.

  - **Check user account activity:** Examine the account used to launch the process. Use logs from Active Directory (Event ID 4624) to see if the account has elevated privileges or is active during non-business hours, which may suggest account compromise.

  - **Analyze network connections:** Review outbound connections initiated by `RDConsole.exe` using Windows Firewall logs or Sysmon Event ID 3 for unusual IP addresses, especially those outside of the typical operational range.

  - **Validate installation artifacts:** If the setup process (`RocketRemoteDesktop_Setup.exe`) is observed, validate its source and check for installation files or registry entries related to Rocket RMM. Legitimate installations will typically have a signed certificate and be associated with known IT asset tracking.

  ### Prioritization

  This alert is of medium severity due to the possibility of both legitimate and malicious usage of remote desktop tools. The impact can be significant on critical systems, especially if compromised, while the likelihood of abuse is heightened given the tool's functionalities. Remote access software is often weaponized in various attack campaigns.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use obfuscation techniques to rename processes or leverage remote access tools with different names. Reliable detection requires proper logging configurations in place, including Sysmon setup. Legitimate IT support or administrative activities could produce similar alerts, creating potential noise. A companion detection, such as monitoring outbound network connections for anomalous patterns, would enhance coverage and context for investigations.

