note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Rocket Remote Desktop (RMM) tool, specifically monitoring for the launching of `RDConsole.exe` and `RocketRemoteDesktop_Setup.exe` as child or parent processes. The likely attacker objective is to establish unauthorized remote access to systems, facilitating further actions such as data exfiltration or system compromise. This behavior correlates with the MITRE ATT&CK tactic for Execution and the associated technique T1219 (Remote Access Software).

  The primary telemetry sources for this detection are Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide detailed information on newly created processes. If detected activity is indeed malicious, the security impact could be significant as it may indicate an adversary gaining remote access, leading to potential system control and data exposure. It is crucial to note that this detection alone does not confirm malicious intent; legitimate use of Rocket RMM by authorized personnel can trigger the same alerts.

  ### Investigation Steps

  - **Check process creation event details**: Review Security Event ID 4688 and/or Sysmon Event ID 1 logs for the appearance of `RDConsole.exe` or `RocketRemoteDesktop_Setup.exe`. Look for parent processes and user accounts to determine the context of usage.

  - **Compare user activity and context**: Identify if the user executing the RMM tool is an authorized IT personnel or an unexpected user. Legitimate usage typically correlates with administrative user accounts during regular maintenance windows.

  - **Identify high-confidence indicators**: Focus on event data suggesting abnormal execution contexts, such as unusual parent processes other than known management tools, which can indicate potential misuse.

  - **Validate network connectivity**: Review network traffic logs (e.g., Firewall logs or Proxy logs) for outbound connections initiated by the detected processes. Check for connections established with known RMM infrastructure or anomalous external IP addresses.

  - **Assess system impact**: Determine the host role of the affected system (e.g., server, workstation) and the criticality of business services hosted on it. Prioritize the investigation for critical infrastructure components.

  - **Consider file artifacts**: For `RocketRemoteDesktop_Setup.exe`, verify the presence of installation-related files or configurations in system directories (e.g., C:\Program Files). Look for unusual executable or script modifications denoting potential post-exploitation payloads.

  ### Prioritization

  This alert has medium severity due to the reliance on legitimate use of RMM tools within an enterprise. However, the potential for malicious abuse exists, especially if detected in unusual contexts or by unauthorized users. Additionally, tools like Rocket RMM are commonly weaponized and should not be disregarded, especially in sensitive environments.

  ### Blind Spots and Assumptions

  Detection may miss cases where the legitimate use of Rocket RMM is prevalent, impacting the noise-to-signal ratio of alerts. Furthermore, evasion techniques such as process hollowing or renaming can obscure malicious activity. The reliability of detection depends on having Sysmon logging correctly configured alongside Windows event logging. Related detections to consider include monitoring for abnormal outbound connections or execution of non-standard processes associated with remote access tools.

