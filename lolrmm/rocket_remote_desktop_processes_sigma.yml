note: |
  ### Technical Context
  This detection rule identifies instances of the Rocket Remote Desktop tool, specifically focusing on process initiation associated with `RDConsole.exe` and `RocketRemoteDesktop_Setup.exe`. The rule is designed to detect potentially unauthorized or malicious use of this remote monitoring and management (RMM) software, which can facilitate unauthorized access to endpoints. Attackers may leverage such tools to gain control over systems, deploy malicious payloads, or exfiltrate sensitive data.

  Rocket Remote Desktop is known for its legitimate administrative purposes; however, it can also be exploited by threat actors as part of their toolkit to execute lateral movements or establish persistence within a network. This activity could be indicative of unauthorized access attempts or compromise of systems, underscoring the importance of monitoring for this tool's usage in enterprise environments.

  Relevant MITRE ATT&CK tactics/techniques include:
  - Execution (T1203)
  - Remote Services (T1219)

  Primary data sources for detecting this activity include process creation logs from Windows systems, which capture events related to the initiation of processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation logs to identify instances where `RDConsole.exe` or `RocketRemoteDesktop_Setup.exe` have been executed, especially from unexpected user accounts or unusual systems.
  - **Check Parent Process Hierarchy**: Investigate the parent processes associated with any detected instances to determine if they were spawned by legitimate administrative tools or processes, which may indicate potential misuse or abnormal usage patterns.
  - **Analyze Endpoint Activity**: Correlate the time of detection with user activity on endpoints to identify anomalous behavior or unauthorized access attempts, particularly during off-hours or from unusual locations.
  - **Assess Network Traffic**: Monitor network traffic involving remote desktop connections initiated by the tool to detect any signs of data exfiltration or suspicious external communications.

  ### Prioritization
  The alert's severity is rated as medium due to the potential for significant impact if the Rocket Remote Desktop tool is misused by malicious actors. The likelihood of detection is moderate, given the prevalence of legitimate use, necessitating a careful review to distinguish between benign and malicious activity.

  ### Blind Spots and Assumptions
  This detection may not capture all malicious instances of Rocket Remote Desktop usage, especially if the tool is obfuscated or renamed by an attacker. Assumptions include the availability of comprehensive process creation logs and that the threat actor will utilize recognizable process names during their activity. Therefore, environments must ensure that logging is appropriately configured to capture relevant events for this detection to function effectively.

