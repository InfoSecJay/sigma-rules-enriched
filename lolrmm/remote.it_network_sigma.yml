note: |
  ### Technical Context

  This rule detects network activity directed towards the Remote.it API and authentication endpoints, which may indicate the use of the Remote.it Remote Management and Monitoring (RMM) tool. Attackers may utilize this tool to establish persistent remote access to compromised systems, gather intelligence, or exfiltrate data. The relevant MITRE ATT&CK techniques include "Application Layer Protocol" (T1219) within the Command and Control tactic.

  The primary telemetry sources are Windows network connection logs, specifically those that capture outbound connections—a critical artifact for identifying unauthorized remote management activities. If malicious, this type of activity could lead to uncontrolled remote access, data breaches, or lateral movement within the network. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate use of Remote.it by authorized personnel may trigger this alert.

  ### Investigation Steps

  - **Review outbound connections to Remote.it:** Examine network connection logs for Event ID 5156, focusing on DestinationHostnames matching *.api.remote.it or *.auth.api.remote.it. Identify whether the connections are made from unauthorized hosts or at unusual times.

  - **Correlate against asset inventory:** Confirm that the asset initiating connections is not listed as a legitimate Remote.it user or device. Assess host role—if the asset is a server or critical infrastructure, prioritize the investigation.

  - **Investigate process creation associated with connections:** Check Sysmon Event ID 1 for processes making outbound connections to Remote.it, noting their parent process. Look for suspicious process names or hashes that deviate from known good configurations.

  - **Analyze authentication logs:** Review logs from Windows Security Event ID 4648 for any authentication attempts to Remote.it APIs by unusual or unauthorized accounts. Identify patterns indicating credential misuse.

  - **Identify legitimate usage patterns:** Gather insights into typical users leveraging Remote.it within your organization. Document regular usage timings and authorized IP ranges to help distinguish between benign and suspicious activity.

  - **Assess any file transfer activity:** Look for file creation or transfer events related to Command and Control activity using Sysmon Event ID 11, particularly involving the Remote.it tool, to identify potential data exfiltration.

  ### Prioritization

  The severity of this alert is medium, as outbound connections to the Remote.it APIs from unauthorized devices can indicate an attacker is attempting to establish remote access. The likelihood of malicious use is considerable if the affected system is critical, given the potential for remote manipulation or data exfiltration. This behavior can be commonly weaponized in targeted attacks against corporate networks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate usage of Remote.it, which can lead to false positives for authorized users. Ensure comprehensive logging for all outbound network connections; if logs from devices using Remote.it are insufficient or misconfigured, detection may fail. Additionally, Remote.it may trigger this alert when misconfigured or used for legitimate remote access. A companion detection, such as monitoring abnormal user behavior with the Cloud Application Security measures, can strengthen overall security coverage against potential misuse.

