note: |
  ### Technical Context

  This Sigma rule detects network connections to known hosts associated with the Remote.it RMM (Remote Management and Monitoring) tool. The likely attacker objective is to use Remote.it for remote access and control of compromised devices, facilitating further malicious operations such as lateral movement or data exfiltration. The relevant MITRE ATT&CK tactic is Command and Control (T1071.001), and the corresponding technique is Application Layer Protocol (T1219).

  The primary telemetry sources relevant for this detection are Windows network connection logs, specifically focusing on outbound connections to domains like `auth.api.remote.it`, `api.remote.it`, or `remote.it`. If the behavior is indeed malicious, it could indicate a breach, allowing attackers to maintain persistent access to machines within the network. However, this detection alone does NOT confirm malicious intent, as legitimate users could be employing Remote.it for valid purposes.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Security Event ID 5156 (Windows Filtering Platform) for outbound connections to `auth.api.remote.it`, `api.remote.it`, or `remote.it`. Look for timestamps and process IDs associated with these connections to identify the initiating process.

  - **Identify source process:** If connections are detected, examine Process Creation logs (Security Event ID 4688) and/or Sysmon Event ID 1 on the originating host. Look for suspicious command lines or parent-child relationships that indicate non-standard usage of Remote.it.

  - **Assess legitimate usage:** Determine if the identified process has a legitimate business purpose. Check with the service desk or IT teams if Remote.it is approved for use on that asset. Document expected usage patterns for future context.

  - **Correlate with user behavior:** Cross-reference the network activity with user logins and behavior using Windows Security Event IDs 4624 and 4634. Check for any anomalies such as connections made by unexpected accounts, times, or locations.

  - **Search for policy violations:** Review organizational policies regarding the use of remote access tools. Identify if there are any documented instances of Remote.it being registered or used within the environment.

  - **Identify malicious indicators:** Be on the lookout for other signs of compromise associated with remote management tools, such as unauthorized installations or changes to endpoint configurations. These could be validated by checking application logs or software inventory lists.

  ### Prioritization

  This alert should be treated with medium severity. The impact can be high if sensitive systems are compromised, particularly if remote access is exploited. The likelihood of malicious abuse is moderate, as Remote.it can be weaponized for unauthorized remote control, making it necessary to investigate alerts promptly.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include using alternative domains to access Remote.it or employing tunneling methods to obscure traffic. Reliable detection hinges on having complete and accurate network connection logs in place. Legitimate activities that may trigger this alert could include authorized remote management sessions by IT staff. A related detection rule for monitoring other remote access tools (e.g., AnyDesk or TeamViewer traffic) would strengthen coverage against alternative methods used by adversaries.

