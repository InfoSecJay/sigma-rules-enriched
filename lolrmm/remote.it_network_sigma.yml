  ---

  ### Technical Context

  This rule detects network connections to Remote.it RMM tool's API endpoints, which are commonly used for remote management of devices. The likely attacker objective is to maintain persistence on compromised hosts or establish unauthorized remote access. This behavior aligns with the MITRE ATT&CK technique for "Remote Access Tools" (T1219). Primary telemetry sources include network connection logs, specifically those capturing destination hostnames and connections made from Windows devices. If used maliciously, the impact could involve unauthorized remote control of enterprise systems, allowing an attacker to exfiltrate data or deploy further malicious actions. However, this detection alone does not confirm that malicious activity is occurring, as Remote.it can also be used legitimately in various operational environments.

  ---

  ### Investigation Steps

  - **Identify active connections to Remote.it:** Review network connection logs for connections to destination hostnames `auth.api.remote.it` and `api.remote.it`. Look for Event ID 5156 in Windows Security logs or corresponding firewall logs confirming outbound connections.

  - **Validate legitimate usage patterns:** Check asset documentation to confirm if Remote.it is approved for use in the environment. Review timestamps of connections and the associated user accounts to see if they align with known administrative activities.

  - **Look for high-confidence indicators of compromise:** Investigate any connections established during non-business hours or from unusual user accounts. Malicious usage will typically show anomalous patterns in timestamps and frequency compared to established baselines.

  - **Assess related user behavior:** Examine user account activity correlatively using Event ID 4624 from Security logs. Identify patterns of legitimate account usage to confirm if the connections to Remote.it are aligned with typical user actions.

  - **Correlate outbound traffic volume:** Analyze firewall logs for unusual spikes in outbound traffic to the Remote.it domains indicating potentially malicious use. Legitimate use typically has a consistent and predictable traffic pattern.

  ---

  ### Prioritization

  This alert has medium severity due to the nature of Remote.it facilitating remote management capabilities, which can be exploited for malicious purposes. The likelihood of abusive behavior is moderate, especially if unauthorized access points are being established. The weaponization of remote access tools like Remote.it is notable, thus requiring close examination.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate uses of Remote.it, which could generate alerts if employed by authorized personnel. Reliable detection necessitates comprehensive logging from all relevant network activity sources in the enterprise. Also, expect benign scenarios where IT departments use Remote.it for maintenance tasks. A companion detection rule for auditing administrative access logs can enhance overall security posture and verification efforts.

