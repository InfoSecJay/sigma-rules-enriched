note: |
  ### Technical Context

  This rule detects potential network activity associated with the Remote.it remote management tool, specifically monitoring connections to the Remote.it API endpoints. Attackers may utilize Remote.it to gain unauthorized access to internal systems or facilitate lateral movement, intending to manage and control compromised systems remotely. This detection aligns with the **Execution** tactic within the MITRE ATT&CK framework, specifically the **Remote Services** technique (T1219).

  The primary telemetry source for this detection is Windows network connection logs, capturing outbound traffic to Remote.it API domains. If the activity is malicious, the impact could include unauthorized access to sensitive systems or data exfiltration. It is vital to note that this detection alone does not confirm a compromise; legitimate use of Remote.it may trigger the same rule.

  ### Investigation Steps

  - **Check for suspicious connection attempts**: Review network logs (Event ID 5156) for connections to `auth.api.remote.it` or `api.remote.it`. Note the local IP addresses involved; unfamiliar or internal IPs may indicate malicious use.

  - **Identify user context of the activity**: Investigate the associated user accounts by checking logs (Security Event ID 4688) for the process creation time and username. Legitimate users should have prior approvals for Remote.it usage.

  - **Analyze service configurations**: Validate configurations and permissions for installed software (PowerShell or Registry checks) to confirm that Remote.it is an authorized service on the system. Legitimate installations will often have specific version details from trusted sources.

  - **Correlate with threat intelligence**: Compare the activity log with threat intelligence indicators related to Remote.it exploitation. Look for documented attacks or associations with known threat groups.

  - **Monitor for concurrent suspicious activities**: Investigate whether there are any related or unusual inbound connections or processes related to the affected host. This can highlight potential multi-stage attacks where Remote.it is part of a larger exploitation chain.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on systems, particularly servers or sensitive workstations. The likelihood of malicious abuse is medium, as Remote.it can facilitate unauthorized remote access, a method that is sometimes weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by false positives from legitimate usage of Remote.it within the organization. Effective monitoring requires configurations to capture Windows network traffic against defined rules. Legitimate administrative functions may inherently trigger this alert, particularly from IT support using Remote.it for remote maintenance. A related detection to consider is monitoring unusual credential usage (T1078), which may accompany unauthorized Remote.it activity.

