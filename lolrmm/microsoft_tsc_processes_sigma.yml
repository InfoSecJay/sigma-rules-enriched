note: |
  ### Technical Context
  This rule detects processes associated with the Microsoft Terminal Services Client (TSC) Remote Desktop Services (RDS) Management Tool (RMM), which can be leveraged by adversaries for remote access and control. Attackers may exploit this tool to facilitate unauthorized access to systems, as it allows users to connect to remote machines. The primary objectives of such attacks typically include reconnaissance, lateral movement, and establishing a foothold within the network.

  The detection aligns with the MITRE ATT&CK framework, specifically targeting the *Execution* tactic (ID: TA0002) and the *User Execution* technique (ID: T1219). This scenario highlights the importance of monitoring remote access tools (RATs) that could assist threat actors in navigating the enterprise environment more stealthily. The primary telemetry source for this detection will be Windows process creation events, particularly focusing on instances where the parent process of the executed command is known legitimate remote access utilities such as `termsrv.exe` or `mstsc.exe`, indicating possible misuse.

  ### Investigation Steps
  - **Review Process Creation Logs:** Look for instances of `termsrv.exe` or `mstsc.exe` in the process creation logs alongside their parent processes. Identify any anomalies consistent with unauthorized access.
  - **Analyze User Behavior:** Examine the user accounts associated with the detected processes. Determine if the user has legitimate reasons for using the RMM tool or if their activity appears suspicious based on historical behavior.
  - **Correlate with Network Traffic:** Cross-reference the alerts with logs from the network devices to investigate potential remote connections initiated by the detected processes, focusing on unusual IP addresses and destination ports.
  - **Check for Additional Indicators:** Investigate if there are any additional artifacts on the system, such as suspicious scripts or scheduled tasks, that could indicate an adversary using RMM tools for persistence or lateral movement.

  ### Prioritization
  The medium alert severity reflects a significant risk; while the use of Microsoft TSC for remote management is legitimate, its misuse can lead to severe risks including unauthorized access, data exfiltration, and lateral movement across the network.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the presence of legitimate remote management activities, which could lead to false positives. The detection logic assumes that all executions of `termsrv.exe` or `mstsc.exe` with the specified parent processes are suspicious, which may not always be the case. Additionally, the alert relies on accurate process creation logs being configured and collected consistently across all endpoints to function effectively.

