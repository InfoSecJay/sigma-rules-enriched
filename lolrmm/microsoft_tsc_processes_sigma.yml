  ### Technical Context

  This Sigma rule detects activity related to potential process invocation of Microsoft Terminal Services Client (TSC) remote management tools, specifically `termsrv.exe` and `mstsc.exe`. The likely objective of an attacker leveraging these tools is to establish remote access to systems within the network, which could facilitate unauthorized control or data exfiltration. This behavior is associated with the MITRE ATT&CK technique for Remote Services, specifically T1219 (Remote Desktop Protocol).

  Primary telemetry sources include the Windows Security Event Log (Event ID 4688) and Sysmon logs (Event ID 1) of process creation. The security impact, if malicious, can include unauthorized access to sensitive systems, potentially leading to data breaches or lateral movement within the network. It is important to note that this detection alone does not confirm malicious intent; legitimate administrative use of RDP tools can trigger this alert.

  ---

  ### Investigation Steps

  - **Verify Process Creation Events:** Check Windows Security Event ID 4688 for process creation events related to `termsrv.exe` or `mstsc.exe`. Confirm the execution time and user context, identifying if the process was started by legitimate administrative accounts.

  - **Examine Parent Process Relationships:** Analyze Sysmon Event ID 1 to determine the parent process of the detected `termsrv.exe` or `mstsc.exe`. A common legitimate parent is `explorer.exe`, while suspicious parents could indicate unusual activity.

  - **Review User and Machine Context:** Assess the user account combined with the asset's role. For example, if the account is a non-administrative one and the machine is non-administrative, this could indicate a malicious use of RDP tools.

  - **Check Network Connections:** Use network telemetry logs, such as firewall logs, to verify any outgoing connections made by the RDP tools. Legitimate sessions typically connect to well-known administrative hosts or secure internal addresses.

  - **Identify Uncommon Usage Patterns:** Document the frequency and patterns of use of `mstsc.exe` or `termsrv.exe` on endpoints. Multiple sequential connections outside of normal business hours can indicate potential malicious intent.

  - **Correlate with Other Alerts:** Look for related detection alerts that might provide additional context, such as unauthorized access attempts or anomalous account behavior, which could strengthen the case for malicious activity.

  ---

  ### Prioritization

  This alert has medium severity due to the potential for significant impact if an attacker gains unauthorized access to critical systems. The likelihood of misuse is moderate, as these tools are commonly exploited in attacks to gain persistent access. While this behavior can be part of legitimate administrative processes, suspicious patterns should be treated with caution.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging levels are not appropriately configured to capture all relevant process activities or if telemetry sources are not collected consistently. Evasion techniques may include disguising malicious processes under legitimate administrative user accounts. Legitimate administrative access or troubleshooting sessions may trigger this alert without malicious intent. A companion detection worth monitoring is unusual user logon events to critical hosts, which can indicate an attempt to exploit remote access capabilities.

