note: |
  ### Technical Context

  This Sigma rule detects the execution of processes related to the Microsoft Terminal Services Client (TSC), specifically when they are spawned by `termsrv.exe` (Terminal Services) or `mstsc.exe` (Microsoft Remote Desktop). This behavior may indicate unauthorized use of remote management tools that facilitate administrator-level access or remote desktop sessions, potentially signifying an attacker’s objective to maintain persistence or execute commands in an environment by taking control of remote access features.

  The relevant MITRE ATT&CK tactics here are **Execution** (TA0002) and the technique **Remote Services** (T1219). Primary telemetry sources include Windows Process Creation events, particularly Security Event ID 4688 and Sysmon Event ID 1. If the detected activity is malicious, attackers can exploit these remote management tools to gain significant control over systems, leading to data exfiltration or further network compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities can trigger similar process executions.

  ### Investigation Steps

  - **Review process execution lineage:**
    - Verify ParentImage for Event ID 4688 to confirm if the processes were launched by legitimate administrative tools or user accounts. Legitimate activity often involves trusted users performing remote support.

  - **Inspect command line arguments:**
    - Check for suspicious command-line arguments in Event ID 4688 for `mstsc.exe` or `termsrv.exe`. Malicious sessions may contain indicators such as unexpected IP addresses or flags not typically used by legitimate remote desktop connections.

  - **Analyze user context and session information:**
    - Validate the user context of the process execution by cross-referencing the triggering User/GUID fields in logs. Normal expected patterns involve domain and admin accounts, while anomalies may suggest unauthorized activity.

  - **Correlate with network traffic logs:**
    - Review firewall logs for unusual connections to external IPs originating from the host running the detected process. Look for remote connections initiated at unusual times or from unexpected locations.

  - **Identify high-confidence malicious indicators:**
    - Search for documented malicious IPs or domains that correlate with the connection made by `mstsc.exe`. Utilize threat intelligence feeds for this step.

  ### Prioritization

  This alert is of medium severity due to the potential impact of remote access on critical systems. While remote management is commonly used by administrators, the likelihood of this behavior being weaponized by adversaries increases with the prevalence of such processes in environments using RDP, making it essential to triage promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative actions that trigger similar alerts. Log sources must be appropriately configured to ensure comprehensive process creation captures, especially if Sysmon is not deployed. Additionally, non-malicious administrative activities, like routine maintenance or support by IT personnel, can generate similar alerts. A companion detection to consider is monitoring for unusual user access patterns or privileged account usage during the same timeframes as the alert.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
