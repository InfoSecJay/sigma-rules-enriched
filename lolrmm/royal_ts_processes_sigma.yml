note: |
  ### Technical Context

  This Sigma rule detects processes launched by the Royal TS Remote Management Tool, specifically when the parent process is `royalts.exe` itself. Attackers may use this tool to maintain persistence in an environment, manage remote access, or facilitate lateral movements within a compromised network. The relevant MITRE ATT&CK tactic is "Execution," specifically technique T1219 (Remote Access Software).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which detail process initiation and parent-child relationships. If the detected activity is malicious, it could signify an intruder manipulating RMM for unauthorized access or administrative privileges. Importantly, the detection of the Royal TS process does NOT confirm malicious activity on its own, as this tool is also used legitimately by system administrators.

  ### Investigation Steps

  - **Check the process tree:** Analyze the parent-child relationship of the detected process using Security Event ID 4688 or Sysmon Event ID 1. Identify if `royalts.exe` is the parent process of another instance of `royalts.exe`, which could indicate malicious activity rather than expected legitimate access.

  - **Review execution times:** Compare the timestamp of the detected Royal TS process against standard operational hours for your environment. Out-of-hours usage may indicate unauthorized access.

  - **Verify legitimate access:** Identify any known good usage of Royal TS, including user accounts that typically utilize this software. Cross-reference against AD user logs (Event ID 4624) to determine if the invoking user is an authorized admin.

  - **Correlate with remote connections:** Check network logs (e.g., Windows Firewall or VPN logs) during the time of the alert for connections to unusual or unauthorized external IP addresses. This can help identify if the tool is being exploited for exfiltration or unauthorized access (Traffic Analysis).

  - **Inspect for additional artifacts:** Validate if the Royal TS process initiated any other unusual or suspicious child processes that may indicate exploitation. Reference Sysmon Event ID 10 for process creation and network connections.

  ### Prioritization

  This alert is of medium severity due to the potential for malicious use of Royal TS in privileged access scenarios. The impact can be significant, especially if it occurs on critical systems where sensitive data may be accessed or modified. The likelihood of abuse is high because RMM tools like Royal TS are commonly weaponized by sophisticated adversaries during lateral movement.

  ### Blind Spots and Assumptions

  Limitations include the possibility of adversaries using obfuscation techniques to mask the use of RMM tools and legitimate admins unwittingly triggering this alert during authorized maintenance. Ensure that all relevant Windows event logging is enabled, as data collection must be comprehensive for reliable detection. Additionally, related detections such as anomalous login attempts (Event ID 4625) can help correlate suspicious behavior and strengthen overall coverage against unauthorized access attempts.

