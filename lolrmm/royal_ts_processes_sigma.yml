note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Royal TS Remote Management Tool (RMM), specifically monitoring instances where `royalts.exe` is either a parent or child process. The likely attacker objective would be to establish remote access, conduct reconnaissance, or exfiltrate data, leveraging this tool for command and control (C2) operations. This activity aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique Informational Data Theft (T1219). The primary telemetry sources include Windows event logs, specifically Process Creation logs (Event ID 4688) and security event logs that capture process activities.

  If this behavior is associated with a malicious actor, it can lead to significant security impacts, including unauthorized access to sensitive systems and potential data breaches. It's essential to note that the detection of `royalts.exe` alone does not confirm malicious intent, as this tool may be used legitimately within an enterprise environment.

  ### Investigation Steps

  - **Check for legitimate usage:** Review the asset’s role within the organization to confirm if Royal TS is actively utilized for administrative functions; if it’s a known tool for Remote Management roles, this may indicate benign usage.

  - **Analyze process creation events:** Examine Security Event ID 4688 for `royalts.exe` entries, noting the user context, parent process, and execution path for anomalies. Look for unusual users or escalated privileges that do not align with expected operational procedures.

  - **Cross-reference with existing processes:** Verify if `royalts.exe` is running in conjunction with suspicious parent processes. Common benign parents include legitimate management applications; any unexpected parent should be treated with suspicion.

  - **Review network activity:** Investigate outbound connections made by the host running `royalts.exe` through Windows Firewall logs (Event IDs 5156 and 5158) or network traffic analysis, focusing on unusual remote endpoints or unexpected ports.

  - **Identify malicious indicators:** Look for known malicious command sequences or behaviors that deviate from standard operations in conjunction with `royalts.exe`. Abnormal command line arguments or IP addresses tied to C2 infrastructure may indicate nefarious use.

  ### Prioritization

  This alert has a medium severity rating due to its potential impact on sensitive systems and critical assets being managed remotely with Royal TS. The likelihood of malicious abuse is moderate; while the tool can be leveraged legitimately, its use in unauthorized contexts is common among threat actors for C2 operations.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Royal TS in normal operations, potentially leading to false positives, especially in environments where remote management tools are standard. Essential telemetry for reliable detection includes ensuring complete access to Windows process creation logs. Related detections, such as monitoring unusual network connections or the usage of other remote administration tools, can augment coverage and provide additional context for analysis.

