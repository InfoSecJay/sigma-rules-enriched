note: |
  ### Technical Context

  This Sigma rule detects file activity related to the Freshservice Remote Monitoring and Management (RMM) tool. Attackers may utilize this tool to maintain persistent access or exfiltrate data, fitting within the MITRE ATT&CK framework under the tactics of Command and Control (TA0011) and Remote System Discovery (T1219). The primary telemetry sources include Windows file event logs, focused on specific executable and configuration files associated with Freshservice components. Malicious activity could lead to unauthorized system access or data exfiltration, compromising confidentiality and integrity. Importantly, this detection does not confirm the malicious intent of the tool’s use, as it is also used legitimately in enterprise environments.

  ### Investigation Steps

  - **Review recent file activities**: Examine file event logs (Event ID 4663) for any access to Freshservice-related files within the paths specified in the rule. Note the username and timestamps to identify unusual access patterns.

  - **Check process creation**: Investigate associated process creation logs (Sysmon Event ID 1 and Security Event ID 4688) for the execution of Freshservice executables like `FSAgentService.exe` or `Freshservice.DiscoveryProbe.ScanService.exe` to identify unexpected use.

  - **Correlate with user accounts**: Verify the legitimacy of user accounts that accessed or modified the flagged Freshservice files against the organization’s asset management system. This helps to distinguish between benign administrative actions and potential misuse.

  - **Assess file integrity**: Confirm the integrity of Freshservice files by comparing their hashes against known good values. A mismatch may indicate unauthorized modifications indicative of compromise.

  - **Identify network communication**: Review network logs for outbound connections associated with systems running Freshservice. Look for unusual external IP addresses or domains communicating with the Freshservice tool, which may indicate data exfiltration or command and control behavior.

  - **Investigate for benign usage**: Document and confirm legitimate scheduled tasks or automated processes involving Freshservice that have been configured by system administrators, noting typical times and patterns of execution.

  ### Prioritization

  This alert holds a medium severity level due to its potential impact on compromised systems that manage critical organizational services. The likelihood of malicious use is moderate, as tools like Freshservice can serve dual purposes, making the identification of true threats crucial. The established presence of these files is noteworthy, especially in environments where they are not in legitimate use.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative activities that interface with Freshservice files, potentially leading to false positives. Additionally, ensuring that all respective log sources are enabled, including file access logs and process creation logs, is crucial for consistent detection. It's also important to recognize that evasion techniques may involve leveraging legitimate credentials to access RMM tools. A related detection to enhance coverage would include monitoring for abnormal network traffic from Freshservice-associated IPs indicative of data exfiltration attempts.

