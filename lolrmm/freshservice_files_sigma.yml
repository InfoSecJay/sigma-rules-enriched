note: |
  ### Technical Context

  This rule detects file activity associated with the Freshservice Remote Monitoring and Management (RMM) tool. The behavior being monitored includes accessing or modifying executable files and configuration artifacts related to Freshservice components, which are often utilized for network scanning and system monitoring. An attacker might leverage legitimate tools like Freshservice for reconnaissance or lateral movement, potentially masquerading as IT activity.

  This detection is relevant to the MITRE ATT&CK framework under the tactic "Command and Control" (TA0011) and the technique "Application Layer Protocol" (T1219). The primary telemetry sources are Windows file events, specifically targeting processes and files located in the Freshservice installation directory. If this activity is malicious, it could signify unauthorized monitoring or exfiltration of sensitive information. However, detecting activity alone does not confirm malicious intent; it requires contextual investigation to assess the legitimacy of the action.

  ### Investigation Steps

  - **Review file access logs**: Check for Windows Security Event ID 4663 logs specific to the Freshservice installation directory to trace file access. Look for patterns consistent with manual interactions, such as repeated access to the same file within a short timeframe.

  - **Identify process execution**: Investigate Sysmon Event ID 1 to see if any Freshservice executables (like `FSAgentService.exe` or `AutoUpdate.exe`) were invoked. Validate if these processes were launched by a known user or legitimate system accounts.

  - **Analyze user account behavior**: Correlate the triggering events with user accounts to identify if these actions were taken by expected system or IT administrator accounts. Legitimate administrators often run these operations during maintenance windows.

  - **Evaluate scheduled tasks**: Examine Task Scheduler entries (Event IDs 4698 and 4699) to determine if any Freshservice-related tasks were created or executed without prior documentation or processes, which could indicate potential misuse.

  - **Check for unusual file modifications**: Scrutinize the contents of log files (e.g., `fslogger.xml` or `settings.conf`) for unexpected changes or anomalous entries that could indicate malicious manipulation, contrasting these with normal operating conditions.

  - **Confirm legitimate usage**: Compare the activity in question against historical data of confirmed legitimate Freshservice operations, focusing on the frequency and types of files accessed by known good user accounts and during designated time frames.

  ### Prioritization

  This alert is prioritized as medium severity due to the potential security impact associated with unauthorized surveillance or data exfiltration that could arise from misuse of RMM tools. Since legitimate usage of Freshservice is common in IT operations, cautious evaluation of the context is essential to determine actual risk.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include altering timestamps of file access or using legitimate user accounts with elevated privileges to mask malicious behavior. The detection relies on complete logging of file events and appropriate configurations in Windows settings for consistent visibility. Legitimate activities may trigger alerts, specifically when IT staff utilize Freshservice for routine tasks. Complementary detections, such as monitoring for unusual port activity or suspicious inbound/outbound network traffic patterns, can bolster overall security posture against misuse of legitimate tools.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
