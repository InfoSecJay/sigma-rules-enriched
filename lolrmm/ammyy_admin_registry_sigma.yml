note: |
  ### Technical Context

  This rule detects registry modifications associated with the Ammyy Admin remote management tool, including specific keys indicative of its installation or use. An attacker might leverage Ammyy Admin for remote access to compromise systems, facilitate lateral movement, or exfiltrate data stealthily. This behavior aligns with the MITRE ATT&CK technique for Remote Access Software (T1219).

  The primary telemetry sources for this detection are Windows Registry event logs, specifically looking for alterations to the stated registry paths: `HKU\.DEFAULT\Software\Ammyy\Admin` and `HKLM\SYSTEM\ControlSet001\Control\SafeBoot\Network\AmmyyAdmin`. If confirmed as malicious, usage of Ammyy Admin can bypass traditional defense mechanisms due to its common applications in legitimate remote support scenarios. It's important to note that this detection alone does not confirm malicious use; further contextual investigation is required.

  ### Investigation Steps

  - **Verify registry modifications:** Review Windows Registry Event Logs (Event ID 4657) for changes made to `HKU\.DEFAULT\Software\Ammyy\Admin` or `HKLM\SYSTEM\ControlSet001\Control\SafeBoot\Network\AmmyyAdmin`. Legitimate behavior might include entries without associated user accounts likely related to remote support teams.

  - **Identify remote sessions:** Check for active remote sessions corresponding with the registry modifications using the Task Manager or Windows Remote Management Event Logs (Event ID 4103). Unusual connections or sessions initiated from unexpected IP addresses may indicate malicious activity.

  - **Correlate with user activity:** Review User Account event logs (Event ID 4624) to identify the user accounts associated with the registry changes. Look for the context to support or rule out legitimate use cases, especially usage patterns that deviate from established norms.

  - **Examine process activity:** Investigate running processes via Sysmon (Event ID 1) and look for instances of Ammyy Admin (`Ammyy.exe`). Confirm process creation times match the registry changes; any unexpected or unsanctioned process may indicate compromise.

  - **Analyze network connections:** Utilize network monitoring logs to identify any outbound connections made by Ammyy Admin on uncommon ports. Network logs should include details like destination IPs and ports used, which could reveal exfiltration attempts or command-and-control communication.

  ### Prioritization

  This alert has medium severity due to the potential for significant impact if unauthorized access is confirmed, specifically in environments with sensitive data. The likelihood of malicious abuse is moderately high given the software's typical use in both legitimate and illegitimate contexts. Awareness of commonly used remote access tools highlights this as a weaponized tactic in phishing and compromise scenarios.

  ### Blind Spots and Assumptions

  Detection may miss evasion tactics such as legitimate Ammyy Admin use for essential remote support, leading to false positives. Reliability depends on the continuous monitoring of registry events and the wider configuration of Windows Event Log capture, particularly as it relates to user and remote access activity. Expected legitimate use may include proactive IT support activities which could trigger similar registry modifications. A complementary detection method could involve monitoring for anomalous process creation events corresponding to Ammyy Admin which would enhance overall situational awareness.

