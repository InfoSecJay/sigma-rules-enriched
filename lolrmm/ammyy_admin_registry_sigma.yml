note: |
  ### Technical Context

  This rule detects modifications to the Windows registry that may indicate installation or configuration of the Ammyy Admin remote management tool, known for being used in unauthorized remote access scenarios. The likely attacker objective includes establishing control over a compromised system to enable remote access, execution of malicious payloads, or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Remote Access Software (T1219).

  The primary telemetry sources are Windows registry events associated with registry key modifications, specifically targeting the `HKU\.DEFAULT\Software\Ammyy\Admin` and `HKLM\SYSTEM\ControlSet001\Control\SafeBoot\Network\AmmyyAdmin` paths. If malicious, this activity can lead to unauthorized access and manipulation of critical systems. However, this detection does not confirm the presence of an active compromise or the execution of malicious actions; it indicates only potential registry modifications associated with a known tool.

  ### Investigation Steps

  - **Check Registry Modifications: ** Validate changes to the registry keys: Use Registry Event logs (Event ID 4657) to confirm whether the specified registry paths were modified. Look for entries that match the detection criteria.

  - **Evaluate Process Creation Events: ** Investigate Security Event ID 4688 or Sysmon Event ID 1 for process creation related to Ammyy Admin. Confirm the command line parameters and parent processes for any instances of `AmmyyAdmin.exe` being run.

  - **Identify Network Activity: ** Review network logs for outbound connections to known Ammyy Admin servers. Use firewall logs or EDR telemetry to look for unusual traffic patterns, particularly those to external IPs related to remote access.

  - **Correlate User Accounts: ** Cross-reference the activity with user accounts that may have legitimate access to the Ammyy Admin tool. Analyze user activity logs (like Event ID 4624) to see if the user in question is a known administrative user or if login attempts appear suspicious.

  - **Document Expected Behavior: ** Identify and clarify expected behavior by establishing baselines for remote management tools in your environment. Ensure no recent legitimate installations of Ammyy Admin or similar tools have occurred that could trigger these alerts.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized remote access to systems, which can lead to significant breaches. While Ammyy Admin can be misused, the likelihood of it being a benign installation in a tightly controlled environment is low, making it a notable concern that warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate usage of Ammyy Admin, which may result in false positives. Effective detection relies on comprehensive registry event logging being enabled and properly configured. This alert might be triggered by legitimate system administration activities or remote support cases. A companion detection to reinforce coverage would include monitoring for process connections or file access related to any unauthorized use of legitimate remote access software.

