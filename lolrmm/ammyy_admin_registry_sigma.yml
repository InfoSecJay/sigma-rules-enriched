title: Potential Ammyy Admin RMM Tool Registry Activity
id: b467222e-2511-4dc8-b7f2-6512e51f010f
status: experimental
description: |
  Detects potential registry activity of Ammyy Admin RMM tool
references:
- https://github.com/magicsword-io/LOLRMM
author: LOLRMM Project
date: 2025-12-01
tags:
- attack.execution
- attack.t1219
logsource:
  product: windows
  category: registry_event
detection:
  selection:
    TargetObject|contains:
    - HKU\.DEFAULT\Software\Ammyy\Admin
    - HKLM\SYSTEM\ControlSet001\Control\SafeBoot\Network\AmmyyAdmin
  condition: selection
falsepositives:
- Legitimate use of Ammyy Admin
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential registry activity associated with the Ammyy Admin remote management tool, which is often misused by attackers for unauthorized access and remote control of compromised systems. The rule focuses on specific Windows registry entries related to the installation and configuration of Ammyy Admin, recognizing that legitimate users may also employ this tool for remote support. However, due to its association with unauthorized access and malware distribution, monitoring for its usage is critical for safeguarding enterprise environments.

  The likely attacker objectives involve gaining persistent remote access, facilitating lateral movement within a network, and executing commands without alerting security controls. As part of the MITRE ATT&CK framework, this activity can align with the techniques of "Remote Services" (T1219), emphasizing the execution of remote management software that may enable broader malicious actions.

  Primary data sources for this detection include Windows registry event logs, which provide insights into modifications and access patterns in the registry. Monitoring these changes can help security teams identify unauthorized installations or configurations intended for malicious use.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate the specific registry paths flagged by the rule to determine if the changes were made by authorized personnel or applications. Collect the event logs associated with these registry modifications.

  - **Correlate with Process Creation Logs**: Cross-reference the identified registry modifications with process creation events in the environment. Look for instances of Ammyy Admin processes being initiated that may indicate exploitation or unauthorized use.

  - **Analyze Network Traffic**: Examine network traffic logs for outgoing connections associated with Ammyy Admin. Analyze any unusual connections to remote hosts or IP addresses, especially if they correlate with the times of registry modifications.

  - **Identify User Activity**: Review user activity logs to establish whether the user tied to the registry changes had legitimate reasons for using Ammyy Admin. Assess if there were any unusual access patterns or elevated privileges involved.

  ### Prioritization
  This alert is classified as medium severity due to the risks associated with unauthorized remote access tools. While Ammyy Admin may have legitimate uses, its potential for abuse necessitates timely investigation to prevent data breaches or ongoing compromise in the enterprise.

  ### Blind Spots and Assumptions
  One gap in detection coverage may arise from legitimate uses of Ammyy Admin by authorized personnel, leading to potential false positive alerts. The detection logic assumes that the observed registry activity is unauthorized, which may not always be the case. Effective detection relies on the availability of detailed registry event logs and relevant monitoring configurations to capture and analyze the activity of such tools accurately. Additionally, if users have been granted administrative privileges, the likelihood of this tool being misused might not be easily distinguishable without further context.

