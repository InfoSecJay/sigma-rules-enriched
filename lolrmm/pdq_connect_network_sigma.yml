note: |
  ### Technical Context

  This rule detects potential network activity associated with the PDQ Connect remote monitoring and management (RMM) tool, which can be misused by an adversary to establish a command-and-control (C2) channel or perform remote administration tasks. The likely attacker objective is to leverage PDQ Connect for unauthorized access or control over systems within the network. This behavior corresponds to the MITRE ATT&CK techniques of Command and Control (T1071) and specifically Remote Management Tools (T1219).

  The primary telemetry source includes Windows network connection logs, specifically monitoring for outbound connections to domains associated with PDQ services. The security impact of malicious activity involving these connections could include unauthorized system access, data exfiltration, or malware deployment. This detection does NOT confirm malicious intent on its own; legitimate use of PDQ Connect in a managed IT environment may trigger the same alerts.

  ### Investigation Steps

  - **Check outbound network connections:** Examine network connection logs for Event ID 5156 (Windows Filtering Platform) to identify connections to app.pdq.com, cfcdn.pdq.com, and pdqinstallers.*.r2.cloudflarestorage.com. Correlate IP addresses with known PDQ Connect IP ranges for legitimacy.

  - **Identify user activity:** Review Security Event ID 4624 to correlate logins that initiated connections to PDQ domains. Compare with normal login patterns to identify potential unauthorized access.

  - **Cross-reference installation data:** Investigate application logs (Event ID 1033 for Windows Installer) to identify if PDQ Connect was appropriately installed and configured on the system. Legitimate use might include installation logs during authorized maintenance windows.

  - **Analyze communication patterns:** Monitor for repeated outbound connections to PDQ domains over a short time frame, which could indicate automated tools being used to perform remote management. High-frequency connections may indicate suspicious activity.

  - **Correlate with security breaches:** Identify any high-confidence malware indicators, such as known hashes listed in malware databases, that coincide with the timeframe of detected PDQ Connect activity. Compare to existing incidents to identify patterns of misuse.

  ### Prioritization

  This alert has a medium severity due to the nature of the affected systems; PDQ Connect serves as an administrative tool. The likelihood of malicious abuse is moderate, especially if misconfigured or misused by unauthorized personnel. However, such activities are increasingly weaponized as attackers leverage legitimate tools for irregular access.

  ### Blind Spots and Assumptions

  Detection may be limited by instances where PDQ Connect is used legitimately within normal workflows, potentially generating false positives. Ensure logging for Windows Filtering Platform is enabled to capture the necessary outbound connection data reliably. Background tasks or IT maintenance activities, where PDQ Connect is utilized for updates or troubleshooting, may inadvertently trigger this alert. A related detection to consider is monitoring for anomalous usage patterns of other remote management tools that might indicate broader C2 tactics.

