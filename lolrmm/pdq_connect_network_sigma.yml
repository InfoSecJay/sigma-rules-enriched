note: |
  ### Technical Context

  This rule detects outbound network connections to the PDQ Connect RMM tool's domains, indicating potential remote management and control activity. Attackers may leverage tools like PDQ Connect for lateral movement, system management, or unauthorized access to maintain persistence within the environment. This aligns with the MITRE ATT&CK technique Remote Management Tool Usage (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically focusing on DNS queries or HTTP(s) requests. Malicious use of PDQ Connect could allow an adversary to control compromised systems, deploy malware, or exfiltrate sensitive information. However, this detection does NOT confirm that an adversary is actively compromising a system, as legitimate use of PDQ Connect could trigger this alert.

  ### Investigation Steps

  - **Verify destination hostname:** Review connection attempts to `*.app.pdq.com`, `*.cfcdn.pdq.com`, or `pdqinstallers.*.r2.cloudflarestorage.com` in Windows Security Event ID 5156 (Windows Filtering Platform) to identify legitimate PDQ Connect usage vs. potential abuse.

  - **Cross-check user account:** Identify the user account making the connection by examining the `Security Event ID 4624 (an account logon event)`. Confirm if the account is associated with authorized administrative actions or if it looks anomalous for the asset in question.

  - **Monitor process creations:** Inspect Sysmon Event ID 1 logs for process creation events just prior to the network connection. Look for processes like `PDQConnect.exe` that should match expected legitimate behavior for remote management tools.

  - **Identify DNS resolution patterns:** Analyze DNS logs or Event ID  DNS Server Event Logs for any rapid or unusual resolution requests for the detected PDQ domains, which could indicate automated exploitation attempts or misconfigured settings.

  - **Assess asset criticality:** Determine the role of the asset making the network connection. If it involves sensitive or critical infrastructure, elevate the investigation’s priority based on the risk impact due to potential malicious use of PDQ Connect.

  - **Identify network traffic volume:** Review traffic volume associated with connections to these domains in network logs, such as Flow logs, to identify spikes or atypical behavior that may suggest command-and-control activity.

  ### Prioritization

  This alert has medium severity due to the potential impact on enterprise systems, especially if critical assets are involved. While PDQ Connect can be used legitimately, its capabilities make it susceptible to misuse by adversaries, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured logging settings that do not capture all relevant network activity. Legitimate administrative tasks with PDQ Connect may trigger alerts, especially in environments where it is widely used. Companion detections include monitoring for unusual Powershell commands or other remote management tool usage that could indicate a broader compromise.

