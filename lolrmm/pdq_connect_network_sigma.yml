note: |
  ### Technical Context

  This rule detects network activity involving the PDQ Connect Remote Management (RMM) tool. The likely objective of an attacker using PDQ Connect would be unauthorized remote control and management of systems within the network, which could lead to data exfiltration or lateral movement. This detection maps to the MITRE ATT&CK tactic "Execution" and the technique "Remote Services" (T1219).

  Primary telemetry sources for this detection include Windows network connection logs, particularly focusing on connections to domains like app.pdq.com and cfcdn.pdq.com. If this activity is malicious, it poses a risk as the attacker could gain extensive control over endpoints, potentially leading to significant data breaches. Importantly, this detection does NOT confirm malicious intent on its own, as PDQ Connect is a legitimate administrative tool utilized within many organizations.

  ### Investigation Steps

  - **Confirm PDQ Connect Activity**: Examine current network connections for the process associated with PDQ Connect (e.g., checking for Task Manager instances or network connections in `netstat -ano` output). Look for legitimate use patterns, such as connections made during organizational hours and from known administrative workstations.

  - **Identify Suspicious Destinations**: Query network logs (Windows Security Event ID 5156) focusing on outbound traffic to app.pdq.com or cfcdn.pdq.com. Cross-reference these with known legitimate IP ranges for your environment to differentiate between benign and potentially harmful connections.

  - **Review System Permissions**: Check group memberships and permissions of users initiating connections to this domain. Review Active Directory logs for changes to administrative rights that would allow a lower-privileged user to use PDQ Connect maliciously.

  - **Examine Execution Context**: Investigate if actions were initiated from non-trusted endpoints by querying Sysmon Event ID 1 (Process creation) for command-line arguments indicating the use of PDQ Connect or similar tools from unexpected hosts.

  - **Monitor for Data Exfiltration**: Track any high-volume data transfer events associated with these network connections by checking Windows Security Event ID 5145 (File Share Access) for suspicious access patterns to sensitive directories during PDQ Connect sessions.

  ### Prioritization

  This alert has medium severity. The impact is significant, especially on endpoints critical for operations, as unauthorized use of PDQ Connect could enable an attacker to control systems undetected. Given that PDQ Connect is a tool used for remote management, there is a moderate likelihood for abuse, particularly if misconfigured or used by malicious actors.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative use to mimic malicious activity, making false positives a concern. Reliable detection requires comprehensive logging of network connections and the potential for bypasses via approved administrative actions. Legitimate activities that may trigger this alert include scheduled maintenance by IT staff using PDQ Connect for authorized purposes. A related detection that enhances coverage would involve monitoring for anomalous user behavior in conjunction with this network activity, which could indicate privilege escalation or misuse of administrative tools.

