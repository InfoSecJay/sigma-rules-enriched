note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the PDQ Connect remote management tool. PDQ Connect is commonly used for remote management, software deployment, and patch management within environments. The detection logic triggers when network connections are made to specific PDQ-related domains, indicating legitimate or potentially unauthorized usage within the enterprise network. The primary threat scenario involves an attacker using PDQ Connect's functionalities to remotely manage or exploit systems, potentially aiming for lateral movement or unauthorized access.

  Relevant MITRE ATT&CK tactics/techniques for this detection include:
  - **Execution** (TA0002)
  - **Remote Services** (T1219)

  The primary data sources for effective detection include Windows network connection logs that capture all outbound and inbound network traffic, specifically monitoring for connections to the identified PDQ domains.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine Windows network connection logs for the detected connections to `app.pdq.com`, `cfcdn.pdq.com`, and `pdqinstallers.*.r2.cloudflarestorage.com`. Note the source IP addresses and determine if they are from expected internal devices.

  - **Correlate with System Activity:** Investigate the system activity around the times of detection. Look for associated process executions that may indicate how and why PDQ Connect was used. Identify any unusual patterns or unexpected tool usage.

  - **Analyze User Behavior:** Assess user accounts that initiated the connections. Check for any anomalies in the users' privileges or recent activity that could suggest potential misuse of PDQ Connect for unauthorized purposes.

  - **Inspect Firewall Rules:** Verify that firewall and network configs allow only legitimate use of PDQ Connect and that there are no exposed services that could be misused by threat actors leveraging this tool for remote access.

  ### Prioritization
  The alert is considered medium-severity due to the potential risk of attackers using PDQ Connect to gain unauthorized remote access to systems, leading to data exposure or further compromise of the network. The likelihood of such activity may vary based on the legitimate use of the tool within the organization.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where outbound traffic to PDQ Connect domains is expected and legitimate. This detection logic assumes that any connections to PDQ-related domains are suspicious, which may not account for valid administrative activities. Proper logging configurations must be enabled to capture network connection details effectively; if such logs are not preserved, detection may fail. Analysts should also remain aware of potential false positives from legitimate uses of the PDQ Connect tool by system administrators.

