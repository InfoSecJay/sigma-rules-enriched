  ---

  ### Technical Context

  This rule detects the execution of processes associated with the MyIVO Remote Monitoring and Management (RMM) tool, specifically `myivomgr.exe` and `myivomanager.exe`. An adversary may leverage this tool for maintaining access, facilitating remote commands, or executing lateral movements in an environment, often to exfiltrate data or manipulate systems.

  This relates to the MITRE ATT&CK technique for "Remote System Discovery" (T1219). The primary telemetry sources are Windows process creation logs, specifically Event ID 4688 from the Security logs, which track process creation events. If the alert is confirmed as malicious, it may indicate unauthorized remote management activity, potentially compromising the integrity and confidentiality of the systems involved. Importantly, this detection does NOT confirm malicious activity on its own; legitimate use of MyIVO by authorized personnel can trigger this rule.

  ---

  ### Investigation Steps

  - **Verify process origin: ** Check the parent process for `myivomgr.exe` and `myivomanager.exe` in Security Event ID 4688 logs. Look for unusual parent processes that do not align with typical usage patterns (e.g., user-initiated activities).

  - **Assess user credentials: ** Identify the user account executing the processes. Legitimate activities typically involve known administrative accounts, whereas unfamiliar accounts executing these processes may warrant further investigation.

  - **Investigate execution frequency: ** Determine how frequently these processes are being invoked via the Winlogon and Event ID 4688 logs. Continuous invocations can indicate malicious persistence in an enterprise system.

  - **Correlate with other alerts: ** Cross-reference with additional detections related to suspicious remote access or unauthorized installations, particularly those involving RMM tools or unexpected remote administration behaviors.

  - **Review historical context: ** Check for past similar alerts and legitimate MyIVO usage documentation to ascertain if there are previous records of approved operations correlating with the alert.

  - **Examine network activity: ** Investigate outgoing connections related to these processes using firewall logs or network traffic analysis. Look for unusual IP addresses or port usage that may suggest data exfiltration or command and control (C2) communication.

  ---

  ### Prioritization

  This alert is of medium severity in an enterprise context. The presence of MyIVO on sensitive systems increases the risk of exploitation, given attackers often utilize RMM tools for lateral movement or system control. While the behavior may be legitimate, its potential for misuse means it should be prioritized for triage by analysts.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by potential legitimate use of MyIVO in the environment, which can trigger false positives. Proper configuration of logging is required to capture all process creation events accurately. Additionally, authorized IT personnel may use RMM tools for routine management, making contextual investigation essential. A related detection to consider is the monitoring of execution of PowerShell commands (T1086), which may accompany suspicious RMM activities.

