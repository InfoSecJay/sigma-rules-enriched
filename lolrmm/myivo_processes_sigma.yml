note: |
  ### Technical Context
  This detection rule identifies potential malicious activity linked to the MyIVO Remote Monitoring and Management (RMM) tool. RMM tools like MyIVO are often used by legitimate IT administrators for system management; however, they can also be exploited by attackers to maintain persistent access, exfiltrate data, or control compromised devices without detection. When an adversary leverages such a tool, their objectives typically include stealthy data gathering or executing further malicious actions within an environment.

  Relevant MITRE ATT&CK tactics and techniques associated with this activity include **Execution (TA0002)** and **System Owner/System User Discovery (T1219)**. By associating the execution of the MyIVO processes with abnormal behaviors or trigger conditions indicative of an intrusion, this rule aids analysts in detecting potentially malicious use of a tool that may be disguised as legitimate.

  The primary data sources for this detection are **Windows process creation events**, which provide insights into the launching of processes on endpoints. Logs capturing the invocation of specific executable files, such as `myivomgr.exe` or `myivomanager.exe`, are critical for confirming the exploitation or misuse of the MyIVO tool.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation logs for instances where `myivomgr.exe` or `myivomanager.exe` are executed, focusing on the parent process to understand the context in which these commands were run.
  - **Analyze Parent-Child Relationships:** Investigate the parent processes that initiated MyIVO. Look for unusual parent processes that could indicate malicious behavior, such as those that are not typically associated with system administration.
  - **Correlate with Other Logs:** Cross-reference process activities with other system logs, such as network traffic logs, to identify suspicious outbound connections or communications linked to the MyIVO tool.
  - **Evaluate User Behavior:** Check the accounts that executed these processes, focusing on any accounts not typically associated with IT administration or those that show unusual login behaviors or access to sensitive resources.

  ### Prioritization
  Alerts for MyIVO RMM tool activities are considered medium priority because, while they could indicate potential misuse, legitimate administrative activities can also trigger these alerts. The severity escalates if suspicious parent processes are involved or if unusual network communication patterns are detected alongside.

  ### Blind Spots and Assumptions
  This detection logic assumes the presence of consistent logging for process creation events; it may miss instances if logging levels are not correctly set or if these processes are masked or renamed by attackers. Moreover, the detection might generate false positives from legitimate uses of MyIVO by trusted IT personnel, which necessitates careful evaluation of context before drawing conclusions. The effectiveness of this rule also depends on accurate configuration of the endpoint monitoring tools to capture the necessary event logs.

