note: |
  ### Technical Context

  This Sigma rule detects the execution of MyIVO Remote Monitoring and Management (RMM) tool processes, specifically `myivomgr.exe` and `myivomanager.exe`. The likely attacker objective could involve stealthy remote access or management capabilities, allowing for post-exploitation actions. This activity falls under the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Application Layer Protocol (T1219).

  The primary telemetry sources for this detection are process creation events on Windows systems, specifically Security Event ID 4688 and/or Sysmon Event ID 1, which detail the creation of new processes along with their parent processes. If this behavior is malicious, it could lead to unauthorized access and control over the affected system. However, it's essential to note that this detection alone does NOT confirm malicious use; MyIVO may be used for legitimate IT management purposes.

  ### Investigation Steps

  - **Check process parentage:** Review Security Event ID 4688 logs for `myivomgr.exe` or `myivomanager.exe`. Determine the parent process and investigate if it stems from a known administrative tool or user action. Legitimate usage may involve trusted administrative accounts and expected workflows.

  - **Validate execution contexts:** Examine the context of the executed processes in Sysmon Event ID 1. Look for typical execution paths; legitimate usage often originates from a predefined directory like `C:\Program Files\MyIVO`. Discrepancies in execution paths may indicate suspicious activity.

  - **Identify network connections:** Search for any associated network activity linked to the MyIVO processes using Windows Firewall logs or relevant network monitoring tools. Check for unusual outbound connections on non-standard ports, indicating potential command and control communications.

  - **Review user activity logs:** Analyze user authentication logs (e.g., Event ID 4624) to correlate user logins around the time of MyIVO process execution. Legitimate activities will typically be performed by IT admin accounts during business hours.

  - **Assess system role and criticality:** Determine if the affected host plays a critical role (e.g., domain controller or database server). Malicious activity on such systems necessitates a higher priority investigation due to potential widespread impact.

  - **Look for signs of evasion tactics:** Evaluate for any attempts to obfuscate or hide MyIVO execution, such as frequent process termination/re-creation or coincidental spikes in legitimate administrative activities.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems and the increased likelihood of misuse associated with RMM tools. Such tools are often used by attackers for remote control following an initial compromise, increasing the risk of subsequent malicious actions.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using alternative process names or disguising RMM activity as legitimate, thus leading to false negatives. Ensuring logging for all process creation events and network traffic related to tools like MyIVO is crucial for reliable detection. Legitimate administrative activities, particularly in managed IT environments, may trigger this alert. A related detection would include anomalous network activity from known management tools that aids in correlating malicious behavior.

