  ---

  ### Technical Context

  This rule detects the execution of the RPort RMM (Remote Monitoring and Management) tool process (`rport.exe`) or processes spawned under its parent, indicating potential unauthorized remote access or management activities. The likely objective of an attacker utilizing RPort could be to maintain persistence, establish command and control, or facilitate lateral movement within the environment. This detection maps to MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688 (Process Creation) and Sysmon Event ID 1. If the detected behavior is malicious, it could indicate compromise, unauthorized system access, or exploitation of the RMM tool as a backdoor. Importantly, this detection does NOT confirm malicious intent on its own, as RPort may be legitimately used by authorized personnel in the organization.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check for Event ID 4688 to identify the execution of `rport.exe`. Ensure to note the command line parameters used. Legitimate instances typically show authorized user accounts with expected flags, while suspicious instances may include obfuscated commands or unusual arguments.

  - **Analyze parent-child process relationships:** Investigate Sysmon Event ID 1 and look for processes with `ParentImage` ending in `rport.exe`. Malicious use often shows unusual parent processes or an unexpected context in which RPort is executed.

  - **Evaluate user accounts:** Cross-reference the user account that executed `rport.exe` against known authorized personnel. If the account is a service or lacks expected permissions, it may indicate a breach.

  - **Monitor network activity:** Examine network logs related to `rport.exe` to identify any outbound connections indicative of command and control activity. Use firewall or proxy logs to check for unusual IP addresses or payloads initiated by the process.

  - **Alert on process anomalies:** Keep an eye on the frequency and times of occurrence for `rport.exe`. Legitimate RMM usage is typically predictable, and spikes or irregular hours could suggest malicious use.

  - **Validate endpoint software inventory:** Ensure that RPort is documented in the organization's software inventory for authorized use. Discovering `rport.exe` on endpoints not listed could signify an unauthorized installation.

  ---

  ### Prioritization

  The alert is of medium severity as it could indicate potential infiltration via remote access software, which is commonly sought after by attackers. Given that remote management tools can be weaponized, further investigation is necessary to understand the context of the alert.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers rename or modify the legitimate `rport.exe` executable to hide their activity. Additionally, required log sources must be properly configured to capture detailed process creation events; absence of Sysmon logging may limit visibility. Legitimate admin actions might inadvertently generate alerts, especially during remote maintenance or updates involving RPort. A related detection to consider would be monitoring for unusual network traffic patterns indicative of remote management tool misuse, to strengthen coverage against such activities.

