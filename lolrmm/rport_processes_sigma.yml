note: |
  ### Technical Context

  This Sigma rule detects processes initiated by the RPort Remote Monitoring and Management (RMM) tool, specifically when these processes run as children of the `rport.exe` parent process. The main objective of this detection is to identify potential misuse of the RPort tool, which can facilitate unauthorized remote access or exploitation of systems. This activity is relevant to the MITRE ATT&CK technique for command and control over remote services (Execution: T1219).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture detailed process activity. If exploited maliciously, this behavior allows an adversary to gain significant control over the affected system, potentially leading to data exfiltration or further lateral movement. Importantly, this detection does NOT confirm malicious activity on its own, as RPort can also be used legitimately in managed environments.

  ### Investigation Steps

  - **Review Process Creation Events:** Check Security Event ID 4688 for any processes with `ParentImage` equal to `rport.exe` (Event ID Field: `ParentImage` and `Image`). Look for unusual process names or paths that may indicate malicious use.

  - **Identify Parent-Child Relationships:** Analyze Sysmon Event ID 1, particularly `ParentImage`, to assess the context of RPort activities. Legitimate operational use typically involves only expected child processes, such as support scripts or specific applications.

  - **Check for Process Arguments:** Inspect the command line arguments for any processes with `Image` ending in `rport.exe` to identify suspicious flags or options that may indicate unusual behavior (Event ID related fields: `CommandLine`).

  - **Correlate with User Activity:** Cross-reference the `SubjectUserName` in Event ID 4688 logs against known user accounts to determine legitimacy; unexpected executions by service accounts or unprivileged users may indicate malicious usage.

  - **Monitor Network Activity Related to RPort:** Capture outbound network traffic logs (e.g., using firewall or network intrusion detection systems) to identify connections initiated by `rport.exe`. Validate if these connections align with known and trusted RPort operations.

  - **Check for RPort's Installation Files:** Search for any recent file creation/modification events in directories commonly associated with RPort (e.g., installation paths). Identify unexpected changes that may signify improper deployment or insecure configuration.

  ### Prioritization

  This alert is of medium severity as it indicates potential misuse of a legitimate tool that can allow remote access to systems. The impact is significant if used maliciously, especially in sensitive environments. However, the likelihood of abuse is moderate since some organizations utilize RPort for legitimate administration and support purposes.

  ### Blind Spots and Assumptions

  Detection may be limited by adversaries disabling or altering the logging features to evade identification of RPort activity. Required configurations include ensuring Sysmon and adequate Windows logging are enabled for comprehensive coverage. Legitimate activities that may trigger this alert include appropriate administrative use of RPort by IT personnel, which may need contextual knowledge to validate. Companion detections such as monitoring for unusual network connections or authentication attempts related to RPort can strengthen overall coverage against malicious behaviors.

