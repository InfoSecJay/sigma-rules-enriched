note: |
  ### Technical Context

  This rule detects the execution of processes associated with the rdpwrap RMM tool, which is commonly used to facilitate remote desktop access without proper authentication. The likely attacker objective is to leverage this tool to maintain persistent access to compromised systems, potentially allowing for unauthorized control and data exfiltration. The relevant MITRE ATT&CK tactic is "Execution," and the technique is "Remote Services" (T1219). The primary telemetry sources are Windows process creation logs, specifically focusing on Process IDs, Image names, and Parent Image fields. If malicious, the security impact includes unauthorized access to sensitive data and potential escalation of privileges. This detection does NOT confirm that an attack is occurring without additional contextual information related to the execution context.

  ### Investigation Steps

  - **Review parent process activity:** Check for Event ID 4688 and Sysmon Event ID 1 to identify related parent processes (e.g., cmd.exe) that may indicate unusual execution contexts leading to rdpwrap processes.

  - **Validate process legitimacy:** Cross-reference the detected rdpwrap processes (RDPWInst.exe, RDPCheck.exe, RDPConf.exe) against official documentation or known benign use cases to understand if they align with expected operational behavior in your environment.

  - **Examine user account associations:** Investigate the User field in process creation logs (Event ID 4688) to identify if the process was initiated by a legitimate user or a potentially compromised account, focusing on any accounts with elevated privileges.

  - **Assess network connections:** Look for associated network activities in the logs, such as connections to unusual external IP addresses on common RDP ports (TCP 3389), which would suggest potential use of this tool for exfiltration.

  - **Identify common evasion techniques:** Be aware that attackers may use similar sounding legitimate processes or obfuscate their activities by changing process names. Document any variations in naming conventions.

  ### Prioritization

  This alert has medium severity due to the potential for impacting critical enterprise systems through unauthorized remote access. The likelihood of abuse is significant since the rdpwrap tool is aligned with common remote access tactics used by adversaries. This behavior is frequently weaponized in targeted attacks, warranting timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential use of alternate execution techniques or name obfuscation by adversaries. Reliable detection requires comprehensive logging configurations for process creation events and may also be triggered by legitimate administrative use cases. A companion detection may include monitoring for unusual network traffic patterns associated with remote access tools, which can help reinforce visibility into potential abuse.

