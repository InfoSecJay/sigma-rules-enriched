note: |
  ### Technical Context

  This rule detects the execution of processes associated with the `rdpwrap RMM` tool, specifically identifying instances where processes like `RDPWInst.exe`, `RDPCheck.exe`, or `RDPConf.exe` are launched. The primary objective of an adversary using this tool is likely to establish unauthorized remote control and management of systems, facilitating potential lateral movement within a network. This behavior falls under the MITRE ATT&CK tactic of **Command and Control** (Tactic ID: TA0011) and the technique of **Application Layer Protocol** (Technique ID: T1219). The relevant telemetry sources include Windows process creation logs, specifically **Event ID 4688** for process creation details. If this activity is malicious, it could lead to unauthorized access and control over the affected systems. Importantly, this detection does NOT confirm that malicious activity is occurring on its own, as legitimate uses of `rdpwrap` may also trigger this rule.

  ### Investigation Steps

  - **Check process details: ** Review instances of `Event ID 4688` showing execution of `RDPWInst.exe`, `RDPCheck.exe`, or `RDPConf.exe`, focusing on the `CommandLine` field for unusual switches or arguments that deviate from established baselines.

  - **Identify parent process: ** For any detected processes, examine the `ParentImage` field in **Event ID 4688** logs to confirm it ends with `RDPWInst.exe`, `RDPCheck.exe`, or `RDPConf.exe`, as malicious indicators may indicate execution from a suspicious parent.

  - **Contextualize with user behavior: ** Review the user associated with these processes. Legitimate `rdpwrap` use often correlates with known administrative accounts or specific IT operational hours.

  - **Correlate with network activity: ** Investigate **Windows Security Event ID 5140** for any suspicious SMB share access or unusual remote connections that coincide with the process execution timeline to identify possible lateral movement.

  - **Check for persistence mechanisms: ** Verify if these processes create or modify startup items or scheduled tasks using **Event ID 4698** (Task Creation) or **Event ID 4688** (Process Creation) logs to reveal potential persistence tactics by an adversary.

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical systems, as `rdpwrap` can facilitate unauthorized remote access, making legitimate administrative access a point of concern. While commonly used for maintenance tasks, the potential for malicious abuse through this tool elevates the urgency for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if the execution of the tool is obscured by process renaming or if logs related to process creation are not properly configured. Legitimate use cases include IT support troubleshooting which may trigger this alert. Companion detections include monitoring for **Windows Event ID 4624** (Logon) and **Event ID 5145** (File Share Access), ensuring comprehensive coverage against potential misuse or abuse pathways.

