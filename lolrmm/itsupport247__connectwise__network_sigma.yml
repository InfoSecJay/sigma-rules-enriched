  ### Technical Context

  This Sigma rule detects outbound network connections to the domain `*.itsupport247.net`, which is associated with the ITSupport247 (ConnectWise) Remote Monitoring and Management (RMM) tool. The behavior being monitored typically indicates potential unauthorized access to systems within an enterprise, especially if this tool is not part of the organization's legitimate software stack. The likely attacker objective may include remote surveillance, remote command execution, or configuration changes on compromised systems.

  The relevant MITRE ATT&CK tactic is **Execution**, specifically technique **T1219 (Remote Access Software)**. The primary telemetry source is Windows network connection logs that capture outbound traffic details. If malicious, this behavior could lead to system compromise or data exfiltration. It is important to note that this detection does NOT confirm malicious activity on its own, as it may also indicate legitimate administrative actions if the tool is authorized within the environment.

  ### Investigation Steps

  - **Identify unauthorized connections:**
    Review Windows event logs for outbound connections (Event ID 5156 and Event ID 5158) to `*.itsupport247.net`. Note the source IP, process name, and user context to determine if unauthorized access is occurring.

  - **Verify legitimate use cases:**
    Consult internal documentation or the IT support team to confirm if ITSupport247 is a sanctioned tool. If authorized, check for regular connection patterns or hours of operation that would classify it as benign activity.

  - **Correlate with user activity:**
    Review user login events (Security Event ID 4624) to understand who is initiating the connection. Compare timestamps to see if the requesting user has legitimate cause to use the RMM tool during that timeframe.

  - **Investigate associated processes:**
    Look for associated process creation logs (Sysmon Event ID 1 or Event ID 4688) that may indicate how the connection was initiated. Focus on processes commonly linked to RMM tools, like `ConnectWiseClient.exe`.

  - **Check for data exfiltration artifacts:**
    Investigate if large or abnormal amounts of data have been sent during or after the connection through the network logs. Look for other indicators such as unexpected file creation or transfer logs (e.g., DLP logs).

  ### Prioritization

  This alert has medium severity due to the potential impact of compromised systems through remote administrative access tools. Given that the ITSupport247 tool is often weaponized by adversaries for unauthorized access, the likelihood of malicious exploitation is moderate. Systems with high criticality or sensitive data should be prioritized for deeper investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if the domain is hardcoded or if traffic is encrypted. A lack of network connection logs may hinder reliable detection and analysis. Legitimate IT administrative activities may trigger false positives if legitimate connections to ITSupport247 are prevalent. Companion detections include monitoring for known malicious process executions or user behavior analytics to identify anomalous access outside regular patterns.

