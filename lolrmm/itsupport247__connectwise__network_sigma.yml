  ### Technical Context

  This rule detects network connections to domains associated with the ITSupport247 (ConnectWise) remote management tool, typically used for IT support and infrastructure management. An adversary may leverage such tools for unauthorized remote access, data exfiltration, or lateral movement within a target environment. Relevant MITRE ATT&CK tactics include Command and Control (TA0011) and the technique for Remote Desktop Protocol (T1219). The primary telemetry source is Windows network connection logs, specifically monitoring for outbound connections to the defined domain patterns.

  If malicious actors exploit this detection, it can lead to significant security impacts, including unauthorized data access and system manipulation. However, it is essential to recognize that alerting on these connections does not confirm that malicious activity is occurring, as legitimate use of ITSupport247 for remote management by authorized personnel may trigger this rule.

  ### Investigation Steps

  - **Review Network Connection Events:** Examine Windows Security Event ID 5156 (Windows Filtering Platform) for connections to *.itsupport247.net or itsupport247.net. Confirm whether these connections align with known business hours and legitimate user activity.
  - **Correlate with Access Records:** Look for corresponding access records in the Remote Desktop Connection logs (Event ID 4624) to determine if legitimate user accounts are utilizing the RMM tool. Validate if this aligns with scheduled support activities.
  - **Identify Unusual User Behavior:** Analyze account activity for suspicious patterns, such as multiple connections from different geographical locations within a short time frame. Focus on irregular user behavior correlating with Event ID 4624 (Logon).
  - **Check for Additional Indicators of Compromise:** Review logs for Event ID 4104 (PowerShell) to identify any scripts or commands executed from the remote connection that seem out of place. Malicious scripts may indicate unauthorized use of the RMM tool.
  - **Investigate Host Role and Asset Criticality:** Determine whether the impacted system has a sensitive role (e.g., a server or administrator workstation). High-value targets need further scrutiny if there are connections to the specified domain.

  ### Prioritization

  This alert has a medium severity rating due to the potential risk to sensitive systems that could be managed using the ITSupport247 tool. While this tool can be legitimately used, the likelihood of malicious exploitation is significant, making it imperative to assess the context of detected connections thoroughly.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion tactics where attackers might use alternative connections or disguise malicious activities through legitimate software usage. Reliable detection requires comprehensive logging configurations for Windows network events and security audit logs. Legitimate IT support activities may also trigger this alert, highlighting the need for contextual analysis. Companion detections could include monitoring for unusual administrative tasks (e.g., Event ID 4672) that correlate with connections to the ITSupport247 domains, strengthening overall coverage and detection confidence.

