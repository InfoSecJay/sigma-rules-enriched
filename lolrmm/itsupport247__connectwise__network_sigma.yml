note: |
  ### Technical Context

  This rule detects network connections to domains associated with the ITSupport247 (ConnectWise) remote management tool. These connections could indicate an attempt by an adversary to establish command-and-control communication using legitimate RMM tools or indicative of unauthorized remote management activity. The likely attacker objective is to maintain persistence and control over compromised systems while utilizing existing infrastructure to avoid detection.

  Relevant MITRE ATT&CK tactics and techniques include: Command and Control (T1071) and Application Layer Protocol (T1219). The primary telemetry source is Windows network connection logs, specifically those capturing outbound traffic. If malicious, this behavior can lead to system compromise, data exfiltration, or lateral movement within the enterprise network. However, this detection does NOT confirm that malicious activity is occurring, as it may also indicate legitimate use of the ITSupport247 tool by in-scope personnel.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows network connection logs (Event ID 5156) for outbound connections to `*.itsupport247.net` or `itsupport247.net`. This can indicate unauthorized RMM activity.

  - **Identify source hosts:** Look for the originating host (use Field: `ProcessName` and `RemoteIP`) associated with the connection. Determine if this is a known or authorized management workstation within the organizational environment.

  - **Analyze user context:** Validate the account making the connection (Field: `AccountName`). If the account is a service account or from a non-privileged user role with no RMM responsibilities, this may be a red flag for potential compromise.

  - **Review scheduled tasks or services:** Check for any scheduled tasks or services (Event ID 4698) configured to utilize ITSupport247. Legitimate instances will likely show expected business hours execution aligned to IT support workflows.

  - **Collect file artifacts:** For high-confidence malicious indicators, look for executable file creations linked with the connections (Sysmon Event ID 11). Check paths for suspicious location, such as user temp directories.

  - **Verify connection frequency:** Assess the frequency and pattern of connections to ITSupport247 domains. Unusual spikes or repeated connection attempts from non-administrative hosts could indicate malicious activity.

  ### Prioritization

  The severity of alerts is medium due to the potential impact on sensitive systems under management and the increasing sophistication of adversaries utilizing legitimate tools for malicious purposes. While remote management tools are often legitimate, their misuse is commonly weaponized in the context of post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion methods such as obfuscating legitimate connections through domain generation algorithms. Required log sources for reliable detection include comprehensive network logs and Sysmon configurations. Legitimate activities may trigger this alert when authorized users employ the ITSupport247 tool for remote assistance. Companion detections include monitoring for unusual PowerShell activity (T1059.001) indicative of blended techniques often employed alongside RMM tools.

