  ### Technical Context

  This detection identifies network activity related to the ITSupport247 (ConnectWise) Remote Monitoring and Management (RMM) tool, specifically outbound connections to its domains, which suggest potential administrative access or exploitation of these tools by adversaries. The likely attacker objective includes establishing persistence, data exfiltration, or remote command execution using this administrative tool, which can be leveraged for malicious purposes. This behavior is relevant to the MITRE ATT&CK tactic of Command and Control (T1071) and technique Remote Services (T1219).

  The primary telemetry sources include Windows network connection logs, specifically monitoring for outbound requests to the specified ITSupport247 domains. If an adversary utilizes this RMM tool to connect to a compromised system, it can result in significant security impacts including data breaches, lateral movement, and unauthorized access to sensitive resources. However, the detection does not confirm malicious activity on its own, as the tool could be used legitimately by IT personnel.

  ### Investigation Steps

  - **Verify outbound network connections:** Check for Event ID 5156 in the Windows Security logs for outbound connections to `*.itsupport247.net` or `itsupport247.net`. Identify the originating user accounts and hostnames to assess legitimacy.

  - **Assess user permissions:** Review permissions and roles for the user or machine initiating the connection. Legitimate IT support staff will often have different access levels compared to unauthorized users.

  - **Examine process initiators:** Utilize Sysmon Event ID 1 logs to identify which processes initiated the network connections. Legitimate processes are typically associated with known IT support applications; any anomalies may indicate misuse.

  - **Correlate with other alerts:** Look for concurrent alerts related to suspicious activity, such as user account anomalies or privilege escalation events. Correlating multiple indicators can strengthen the case for malicious intent.

  - **Identify indicators of compromise:** Check for known malicious activity patterns related to ITSupport247's usage, such as unusual command execution or unexpected data upload behavior. Monitor for file creation or remote sessions that do not correlate with regular operational timelines.

  ### Prioritization

  This alert is of medium severity due to the potential impact on systems that may be compromised through unauthorized use of RMM tools. There is a moderate likelihood of abuse, particularly if the tool is used by a compromised insider or unauthorized external actor. Such tools are increasingly weaponized in targeted attacks against enterprises.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate use of ITSupport247 (ConnectWise) is prevalent, potentially generating false positives. The security team should ensure logging is properly configured for both Windows outbound connections and relevant application usage. Legitimate IT operations, including scheduled maintenance or support interventions, may trigger the alert. Companion detections such as anomalous privilege escalation or unusual remote access logs should also be implemented for enhanced security monitoring.

