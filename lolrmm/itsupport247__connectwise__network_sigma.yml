note: |
  ### Technical Context
  This rule detects network activity associated with the ITSupport247 (ConnectWise) Remote Monitoring and Management (RMM) tool. The presence of connections to domains ending in `*.itsupport247.net` may indicate that the tool is being used inappropriately, potentially for malicious purposes by an attacker who has gained access to a managed network. Attackers could leverage RMM tools like ITSupport247 to maintain persistence, remotely control systems, or deploy malicious software, leading to significant disruptions or data breaches.

  Important MITRE ATT&CK tactics related to this detection include **Execution (TA0002)**, as the tool may be used to execute unauthorized commands, and **Remote Services (T1219)**, which encompasses the use of RMM tools to manipulate remote systems. The primary data sources for this detection include network connection logs from firewalls or endpoint devices which provide evidence of outbound traffic to monitored endpoints.

  ### Investigation Steps
  - **Review Network Connection Logs:** Analyze the firewall or network logs for connections to domains ending in `*.itsupport247.net`, noting the source IPs and any unusual outbound traffic patterns.
  - **Identify Unusual User Activity:** Look for logins from unusual accounts or unexpected times that might correlate with the identified connections, suggesting unauthorized access.
  - **Check for Installed Applications:** Verify if ITSupport247 (ConnectWise) is an approved application within the environment by cross-referencing with inventory management logs and processes running on endpoints.
  - **Monitor for Further Anomalous Activity:** Observe for any subsequent behavior following the detected connection, such as attempts to deploy software, user credential harvesting, or lateral movement patterns.

  ### Prioritization
  This alert is assigned a medium severity level as the misuse of an RMM tool can lead to serious security incidents, including unauthorized access and control of sensitive systems. However, the potential for legitimate use should also be considered, requiring careful investigation.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include environments where the detection of ITSupport247 network activity could be masked by legitimate remote management usage or traffic filtering. The detection logic assumes that no legitimate administrative access is present during the timeframe of the alerts. Moreover, log sources must be configured to capture detailed network activity, which includes filtering and logging for all outbound network connections effectively. Without comprehensive logging, there may be undetected instances of malicious activity using this tool.

