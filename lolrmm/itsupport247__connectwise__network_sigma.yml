note: |
  ### Technical Context

  The rule detects outbound network connections to domains associated with the ITSupport247 (ConnectWise) Remote Monitoring and Management (RMM) tool. The likely attacker objective is to establish a command and control (C2) channel for managing compromised systems, leveraging the tool's administrative capabilities to facilitate further intrusion activities. This behavior relates to the MITRE ATT&CK tactic of Command and Control (T1071) and technique Remote Access Software (T1219). Primary telemetry sources include Windows network connection logs, specifically tracking DNS resolutions and outbound connections. If this activity is malicious, it could lead to unauthorized access and control over affected systems, posing a significant security threat. However, this detection does NOT confirm that the activity is malicious, as legitimate IT support operations could be using this tool.

  ### Investigation Steps

  - **Verify source of network activity:** Check Windows Security Event ID 5156 to validate the process initiating the outbound connection and confirm it's not a known management tool from your organization.

  - **Correlate with service records:** Cross-reference the connection logs (e.g., Windows network logs) with service ticketing or IT asset management records to identify if the use of ITSupport247 is legitimate for the affected endpoint, which typically shows activity during scheduled maintenance windows.

  - **Inspect process execution:** Review Sysmon Event ID 1 to identify if the process establishing the network connection corresponds to a known ITSupport247 executable or any unusual binaries that signal malicious tampering.

  - **Identify anomalous connection patterns:** Analyze the network connection logs for unusual frequency or timing of requests to *.itsupport247.net domains; compare with the typical patterns of known support operations to assess potential abuse.

  - **Confirm DNS resolutions:** Check DNS logs to confirm any unexpected outbound requests to *.itsupport247.net were recently seen and ascertain the legitimacy of these requests based on your organization's usage policies.

  ### Prioritization

  The alert has medium severity due to the importance of the affected system, typically greater in environments that do not formally use ITSupport247. The likelihood of malicious abuse increases if the endpoint is uncommon for administrative tools, particularly if the organization has no records of employing such RMM software.

  ### Blind Spots and Assumptions

  This detection may have limitations as it could be evaded by adversaries using alternative domain names or custom C2 solutions. Reliable detection requires thorough logging of outbound network connections and potential configuration allowances for legitimate IT support activities. Legitimate use cases may trigger this alert from trusted IT management operations. A related detection would be the identification of known malicious use of legitimate RMM tools, which could enhance coverage against dual-purpose software.

