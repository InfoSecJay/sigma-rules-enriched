note: |
  ### Technical Context

  This rule detects network connections to the ITSupport247 (ConnectWise) remote monitoring and management (RMM) tool. It signifies an attempted connection that could either be legitimate IT support activity or a sign of potential adversary activity seeking to exploit the tool for command and control. The relevant MITRE ATT&CK tactic here is "Command and Control" (ID: T1219). Primary telemetry sources include Windows network connection logs, particularly analyzing connections to the destination hostnames listed. If malicious, such activity could enable unauthorized remote access and control of affected systems. However, this detection does NOT confirm malicious intent on its own, as there may be legitimate IT support operations using the same tool.

  ### Investigation Steps

  - **Verify network connection logs:** Check Windows Event ID 5156 (Windows Filtering Platform) and look for outbound connections to `*.itsupport247.net` or `itsupport247.net`. Document connection timestamps and originating IPs.

  - **Cross-reference asset roles:** Identify the asset initiating the connections. Confirm if it correlates to known IT support systems or restricted environments that should not have RMM tools.

  - **Check for user and process context:** Review the User and Process ID associated with the event. Legitimate IT support use typically involves processes run under service accounts associated with IT personnel—identify if services like `ConnectWise Client` are executing.

  - **Assess for known malicious indicators:** If the originating asset is unusual and connections to ITSupport247 coincide with abnormal internal traffic patterns (e.g., large data uploads or multiple connections), this indicates potential malicious intent.

  - **Identify secondary behaviors:** Analyze for signs of lateral movement by checking for additional network connections to subsequent IPs or services after the initial connection to ITSupport247, which may indicate exploitation.

  ### Prioritization

  The alert has a medium severity due to the potential dual-use nature of the tool. While the impact could range from benign IT support to an attacker abusing the tool for persistent access, the likelihood of misuse in this context is non-negligible, especially if unexpected connections arise from critical assets.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of ITSupport247 in the environment, leading to false positives. Reliable detection requires comprehensive logging of outbound connections and ensuring visibility into all potential assets capable of making such connections. Legitimate activities may include authorized RMM sessions by IT departments. A companion detection method involves monitoring for unusual outbound traffic patterns or anomalous process behavior on connected endpoints, enhancing overall visibility into potential misuse.

