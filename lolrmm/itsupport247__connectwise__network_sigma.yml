  ### Technical Context

  This Sigma rule detects potential network activity originating from the ITSupport247 (ConnectWise) Remote Monitoring and Management (RMM) tool. The likely attacker objective is to establish remote connection capabilities to perform unauthorized system management or data exfiltration. This behavior is categorized under the MITRE ATT&CK tactic of Execution (TA0002), specifically technique T1219 (Remote Access Software).

  The primary telemetry sources for this detection are Windows network connection logs, particularly focusing on outbound connection attempts to the hostname patterns associated with ITSupport247. If an adversary is utilizing this tool maliciously, it may allow for remote access and control over compromised endpoints. It is critical to note that this detection does NOT confirm malicious activity by itself; legitimate use of the ITSupport247 service may also generate similar network connections.

  ### Investigation Steps

  - **Verify outbound connections to suspicious destinations:** Review Windows network logs for Event ID 5156 to identify connections to `*.itsupport247.net`. Check for unusual patterns, such as connections to these hosts from non-admin accounts or atypical hours.

  - **Cross-reference process origins:** Check for associated process creation events (Event ID 4688 or Sysmon Event ID 1) that generated the network connection, ensuring that legitimate processes (e.g., known ITSupport247 executables) match the connection.

  - **Assess the timing and frequency of connections:** Look for repeated attempts in a short timeframe. Legitimate activity typically involves standard business hours and not frequent connections that span multiple accounts or devices.

  - **Investigate local firewall and antivirus status:** Ensure that local security measures (e.g., Windows Defender logs or Antivirus alerts) have not been disabled or bypassed, which could indicate an adversary's efforts to manipulate the environment.

  - **Analyze user context of the connection:** Review user account activity (Windows Security Event ID 4624) corresponding to the connection. Confirm if the user typically utilizes ITSupport247 or if this is an unexpected user activity.

  ### Prioritization

  This alert is of medium severity due to the potential impact on affected systems, specifically if critical infrastructure is accessed using the RMM tool. The likelihood of malicious abuse is moderate because ITSupport247 is a known tool for legitimate IT support, but its use can also be weaponized in compromised environments.

  ### Blind Spots and Assumptions

  Detection is limited by legitimate use of ITSupport247, potentially leading to false positives if not substantiated with further analysis. Required log sources must include comprehensive network connection and process creation telemetry to ensure reliable detection. Legitimate IT maintenance activities may trigger this alert, particularly during remote support sessions. Companion detections could include monitoring for anomalous user behavior patterns or unauthorized administrative access attempts to strengthen coverage against internal threats.

