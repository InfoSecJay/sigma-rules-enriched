  ### Technical Context

  This detection identifies network activity related to the ITSupport247 (ConnectWise) remote monitoring and management (RMM) tool. The likely attacker objective is to establish command and control (C2) communications, facilitating remote access to compromised systems for unauthorized maintenance or exploitation. This behavior corresponds to the MITRE ATT&CK tactic of Command and Control (TA0011) and technique T1219, which pertains to Remote Access Tools. The primary telemetry sources are Windows network connection logs, specifically focusing on connections to the destination hostname patterns of ITSupport247. If malicious, this could allow an attacker to manipulate or exfiltrate data from the affected systems. However, this detection does NOT confirm that the activity is malicious on its own, as the tool may be employed legitimately by IT administrators.

  ### Investigation Steps

  - **Review network connection logs:** Examine Windows Event ID 5156 (Windows Filtering Platform network connection) for connections to hostnames ending with '*.itsupport247.net' or 'itsupport247.net'. Identify connections that deviate from normal operational patterns for your environment.

  - **Identify legitimate usage:** Verify if there are any documented uses of ITSupport247 RMM tool within your organization. Check for change management records that might involve authorized usage of remote administration tools.

  - **Correlate with user activity:** Assess Security Event ID 4688 (Process Creation) for instances of remote management software execution around the same time as the network activity. Look for processes like 'ITSupport247.exe' and identify their parent processes for context.

  - **Investigate unauthorized access attempts:** Analyze authentication logs (Event ID 4624 for successful logins) for any unusual login attempts before or after the detected network connections, specifically focusing on accounts with elevated privileges.

  - **Search for known indicators of compromise:** Cross-reference active hashes or IP addresses of any detected connections to known malicious entries related to RMM tools on threat intelligence platforms.

  - **Monitor data exfiltration artifacts:** Review file creation events (Event ID 4608 - File Creation) on endpoints to check if any files were transferred externally during the remote session, which can indicate potential data exfiltration and misuse of the tool.

  ### Prioritization

  The alert severity is medium due to its potential impact on critical systems if exploited. The likelihood of malicious abuse is moderate, as RMM tools can be leveraged by both legitimate IT personnel and adversaries to maintain control over systems. This behavior is known to be weaponized by various threat actors, warranting swift investigation.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by evasion techniques such as encrypted traffic or the use of legitimate credentials for access. Reliable detection requires proper configuration and monitoring of Windows network connection logs. Legitimate activities may include authorized IT support tasks, which could trigger similar alerts. A related detection could focus on unusual user logins from endpoints where ITSupport247 connections were made, enhancing visibility into potential misuse.

