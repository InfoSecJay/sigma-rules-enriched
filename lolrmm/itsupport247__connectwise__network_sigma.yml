note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the ITSupport247 (ConnectWise) Remote Monitoring and Management (RMM) tool, specifically `*.itsupport247.net`. The likely objective of an attacker utilizing this behavior is to establish a command-and-control (C2) channel for further exploitation or system manipulation, aligning with the MITRE ATT&CK technique for Remote Access Tools (T1219). Primary telemetry sources include Windows network connection logs, particularly involving `DestinationHostname` fields. If malicious, the security impact could include unauthorized remote access, data exfiltration, or system manipulation. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate use of ITSupport247 by IT staff may also trigger this alert.

  ### Investigation Steps

  - **Query network connections:** Investigate outbound connections from the affected host using Security Event ID 5156 and check for connections to `*.itsupport247.net`. Look for unusual timestamps indicating after-hours activity.

  - **Validate source of connection:** Examine the originating process of the network connection by reviewing Process Monitor logs (Sysmon Event ID 1), ensuring that the process's parent hierarchy is legitimate and authorized (e.g., common IT support tools or management applications).

  - **Identify known benign usage:** Confirm legitimate activities by verifying that authorized personnel use ITSupport247 during expected hours. Review recent ticketing system logs related to IT support events linking to the identified endpoint.

  - **Correlate with activity history:** Track user behavior in user authentication logs (Windows Security Event ID 4624) within the relevant timeframe to see if the user had any similar management activities, providing context for the connection.

  - **Review administrative actions:** Look for other administrative action logs (e.g., Event ID 400, 410 from the Task Scheduler) that were occurring near the time of the RMM connection to detect any potential coordinated actions that might indicate misuse.

  ### Prioritization

  This alert has medium severity given that a connection to ITSupport247 could indicate legitimate RMM tool use, but it also poses a risk if exploited by an adversary. The potential for malicious abuse is credible, especially if the originating system is publicly accessible or lacks adequate security controls. This behavior has been weaponized in criminal activities where adversaries use legitimate tools to maintain access.

  ### Blind Spots and Assumptions

  The detection may miss legitimate activity if ITSupport247 is actively used by authorized personnel for genuine maintenance tasks. It is essential to ensure that logs from third-party management tools, like Sysmon and network monitoring, are correctly configured to capture all relevant traffic. Additionally, legitimate users may trigger this alert when using similar RMM services, so contextual investigation is critical. Companion detections focusing on unusual user account behavior (e.g., multiple failed logins or abnormal access times) could provide enhanced visibility into potential abuse scenarios.

