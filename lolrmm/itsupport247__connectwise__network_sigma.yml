note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the ITSupport247 (ConnectWise) remote monitoring and management (RMM) tool. The likely attacker objective is to establish a Command and Control (C2) channel for executing remote commands or transferring sensitive data. This behavior aligns with the MITRE ATT&CK framework under the tactic of "Command and Control" (T1071) and the technique "Application Layer Protocol" (T1219). The primary telemetry sources include Windows network connections logged by the Windows Event Log, particularly focusing on outgoing connections to the specified domains. A successful exploitation could lead to unauthorized access to systems, data exfiltration, or lateral movement within the network. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate users may also utilize ITSupport247 for remote management tasks.

  ### Investigation Steps

  - **Check Network Connection Logs:** Review Windows Security Event Log (Event ID 5156) for outbound connection attempts to `*.itsupport247.net` and correlate timestamps with the alert.

  - **Verify Process Initiation:** Identify local processes initiating the connection by checking Sysmon Event ID 3. Look for processes that are unusual or no expected for IT support roles.

  - **Assess User Context:** Assess the user account associated with the network connection. Legitimate IT personnel may access ConnectWise, but unusual user-agent strings or new, unexpected accounts raising alerts should be scrutinized.

  - **Inspect for File Transfers:** Check for associated file creation or transfer events tied to remote access activity. Review Windows Event ID 4663 for file creation or modifications during the timeframe of detected connections.

  - **Contextualize with Asset Role:** Examine the asset's role within the organization. If the machine in question is a user workstation rather than an administrative or IT support system, further scrutiny is warranted.

  ### Prioritization

  This alert should be treated with medium severity given that while the affected system likely belongs to an IT support function, the network connections can indicate potential abuse. The likelihood of malicious use is moderate, as cyber adversaries often weaponize legitimate RMM tools for unauthorized access.

  ### Blind Spots and Assumptions

  Detection may have limitations in recognizing legitimate access by ITSupport247, perhaps depending on specific user profiles or timing. Reliable detection requires full event logging for Windows networking and Sysmon configurations for detailed tracking. Additionally, legitimate software updates or maintenance may inadvertently trigger the alert. A related detection to strengthen coverage would be monitoring for unauthorized attempts to install or run ConnectWise agents on endpoints.

