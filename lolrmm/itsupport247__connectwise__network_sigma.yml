note: |
  ### Technical Context

  This rule detects outbound network connections to the domain pattern `*.itsupport247.net`, which is associated with ITSupport247, a remote monitoring and management (RMM) tool often used for administrative tasks. An attacker might leverage this tool for unauthorized remote access, system manipulation, or data exfiltration, mimicking legitimate IT support activity. The relevant MITRE ATT&CK tactic is Execution (TA0002) and the technique is Remote System Management (T1219).

  The primary telemetry source is Windows network connection logs, including destination hostname information. If this activity is malicious, it may indicate a breach or compromise of a system. However, this detection alone does NOT confirm malicious activity, as ITSupport247 could also be legitimately used by authorized personnel within the organization.

  ### Investigation Steps

  - **Examine outbound connections:** Review Windows Firewall logs (event ID 5156) to identify connection attempts to `*.itsupport247.net`, noting timestamps and IP addresses. Cross-reference with expected business hours.

  - **Identify user and host:** Check user account and host information associated with the outbound connection by correlating with Security Event ID 4624 (logon events) to ascertain if the user has legitimate access rights consistent with their role.

  - **Review recent application installations:** Investigate execution events (Sysmon Event ID 1) for the presence of ITSupport247 or related remote management software on the endpoint. Ensure they match authorized installation patterns.

  - **Look for anomalies in network traffic:** Analyze network traffic patterns (using NetFlow or similar) for abnormal spikes towards the `itsupport247.net` domain that deviate from typical usage, indicating possible exploitation.

  - **Validate against known benign behavior:** Determine if the connection aligns with documented use cases for ITSupport247 in your organization—user training materials or support tickets could indicate expected actions.

  - **Capture session data:** If suspicious, leverage tools to capture active network sessions for further analysis, focusing on any commands sent or retrieved files associated with the detected traffic.

  ### Prioritization

  This alert should be regarded with medium severity as it involves external communication potentially indicative of lateral movement or system compromise. While the risk of exploitation is heightened if accessed by unauthorized users, legitimate administrative use could account for some alerts, necessitating careful investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations, including potential evasion if an attacker uses alternative domains or obscures their outbound connections. Reliable detection requires correctly configured logging on all endpoint devices, especially with respect to firewall and application logs. Additionally, legitimate IT support personnel may trigger false positives by using ITSupport247 for scheduled maintenance tasks. A related detection to consider is monitoring for unusual account behaviors, such as suspicious login attempts or privileged access escalations, which can help validate the context around an alert.

