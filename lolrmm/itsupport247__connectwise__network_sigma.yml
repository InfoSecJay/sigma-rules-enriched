  ### Technical Context

  This Sigma rule detects outbound network connections to potential Command and Control (C2) servers associated with ITSupport247 (ConnectWise), a Remote Monitoring and Management (RMM) tool often used in IT support scenarios. The likely objective of an attacker employing this tool would be to gain unauthorized access to, or control over, systems for purposes such as information theft, unauthorized changes, or further exploitation within the network.

  The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), with the technique being **Application Layer Protocol** (T1219). The primary telemetry source is Windows network connection logs, specifically looking for indicators of network activity involving the domain `itsupport247.net`. If this connection is confirmed to be malicious, it can lead to significant security impacts, including unauthorized system access and data exfiltration. It’s crucial to note that this detection does NOT confirm malicious activity on its own; legitimate use of ITSupport247 by authorized personnel can generate similar network traffic.

  ### Investigation Steps

  - **Verify connection origin:** Identify the host generating the network traffic using Windows Security Event ID 5156 (Windows Filtering Platform) logs to find connections to `itsupport247.net`. Assess the criticality of the asset (e.g., a server vs. a user workstation) for context.

  - **Analyze account activity:** Check for user account logs using Security Event ID 4624 (Successful logon) to correlate which user initiated the connection, confirming whether the user has legitimate access to use ITSupport247 for authorized IT tasks.

  - **Correlate with other telemetry:** Review antivirus or EDR logs for any alerts related to the ITSupport247 tool or suspicious activity around the time of the connection noted in the network logs (Sysmon Event ID 3 for network connections may also be relevant).

  - **Check for benign usage patterns:** Identify connections initiated by known IT support personnel during regular business hours. Compare timestamps and destination hostnames against established baselines of legitimate usage to rule out typical operational behavior.

  - **Investigate unusual patterns:** Look for high-confidence malicious indicators by cross-referencing outbound connections to `itsupport247.net` with abnormal traffic spikes in prior days or unusual remote desktop logs (Event ID 4624) that may imply unauthorized access or lateral movement attempts.

  ### Prioritization

  This alert is assigned medium severity due to the potential impact of compromised systems and the increasing likelihood of RMM tools like ConnectWise being weaponized by adversaries. While its usage is common in IT operations, any unsanctioned connections can indicate a security incident necessitating further investigation.

  ### Blind Spots and Assumptions

  Evasion techniques may include using alternative domains or disguising connections as legitimate service traffic. This detection relies on Windows network logs being enabled and properly configured, requiring monitoring of application connections. Legitimate administrative usage of the ITSupport247 tool may trigger this alert, indicating the need for contextual analysis. A related detection could involve monitoring for atypical user access patterns to strengthen coverage against potential misuse of RMM tools.

