  ### Technical Context

  This rule detects the execution of processes associated with the SuperPuTTY remote access and management (RMM) tool, specifically activities where the process image or parent image is named "superputty.exe." The likely attacker objective would be to establish unauthorized remote control over a target system using this well-known RMM tool, which can facilitate further lateral movement and data exfiltration. This detection aligns with the MITRE ATT&CK technique "Remote Services" (T1219).

  The primary telemetry source comes from Windows process creation logs. Relevant log types include Security Event ID 4688 for process creation and potentially Sysmon Event ID 1 if Sysmon is deployed. If malicious, the security impact could involve an attacker gaining persistent access to systems, potentially leading to data breaches. This alert does NOT confirm malicious intentions; legitimate uses of SuperPuTTY may trigger the rule.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 logs for any instances of "superputty.exe" appearing in the Image field. Pay attention to the User field to identify if it belongs to a legitimate administrator or a less privileged account.

  - **Review parent process information:** Investigate the ParentImage field in the logs to see if the process was initiated by a suspicious parent process, or if it was started legitimately from a tool like a software deployment service.

  - **Correlate with Sysmon events:** If Sysmon is operational, check Sysmon Event ID 1 for "superputty.exe" executions, paying attention to OS Process Integrity Level and ParentProcessID to assess whether these executions are anomalous.

  - **Identify known good usage:** Look for legitimate operational contexts for SuperPuTTY within your environment, such as approved remote administration sessions by IT staff or under controlled instances tied to specific service windows.

  - **Asses network activity:** Cross-reference with firewall or proxy logs (e.g., using URL filtering logs) for any outbound connections using known SuperPuTTY default ports (22, 22) to determine if there is any suspicious external connectivity linked to the process.

  - **Check for persistence mechanisms:** Investigate if “superputty.exe” or its parent process has created scheduled tasks, services, or any registry entries (e.g., HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run) that may indicate an attempt to maintain persistence.

  ---

  ### Prioritization

  The alert is assigned medium severity due to its ability to indicate potentially unauthorized administrative access, which could severely impact system integrity. The likelihood of malicious abuse is high, as RMM tools are often weaponized for lateral movement and command execution within breached environments. Although legitimate activity occurs, it warrants immediate review due to the sensitive nature of RMM tools.

  ---

  ### Blind Spots and Assumptions

  Common evasion techniques include process renaming, automated script execution, or other legitimate applications misusing SuperPuTTY’s functionality. The detection relies on accurate logging from Windows process creation events; any absence can create blind spots. Legitimate uses include administrative tasks by known personnel. A complementary detection could involve monitoring for additional RMM tools or unusual remote access patterns, strengthening coverage against varied remote access methods.

