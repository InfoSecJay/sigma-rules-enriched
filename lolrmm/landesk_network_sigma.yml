note: |
  ### Technical Context
  This detection rule identifies potential network activity originating from the LANDesk Remote Management (RMM) tool, which is often used by IT departments for managing endpoints. The threat scenario suggests that an attacker could exploit the RMM for reconnaissance or lateral movement within the network, posing significant risks during both initial access and execution phases of an attack. By targeting devices through the LANDesk platform, an adversary could gain unauthorized control, deploy malware, or exfiltrate sensitive information.

  The relevant MITRE ATT&CK tactics for this rule include **Execution (TA0002)**, as it involves leveraging legitimate tools to perform unauthorized actions, and specifically **Remote Services (T1219)**, which pertains to the use of remote access tools for administrative tasks that can be misused in an attack scenario. The ideal telemetry source for this detection comes from network connection logs, particularly those that capture outbound connections to predefined Ivanti domains, which are indicative of LANDesk RMM communications.

  ### Investigation Steps
  - **Review Network Connection Logs**: Examine logs that capture outbound network connections, filtering for interactions with *.ivanti.com domains to identify unauthorized communication patterns.
  - **Correlate with Endpoint Activity**: Investigate the endpoints initiating the connections to determine if any suspicious or unauthorized processes are associated with the usage of LANDesk.
  - **Monitor for Unusual Admin Behavior**: Keep an eye on user accounts executing commands or accessing systems through LANDesk that deviate from their established baselines, potentially indicating compromised accounts.
  - **Assess Legitimate Use Cases**: Confirm whether the identified activity aligns with legitimate operational use, engaging with the IT admin team to differentiate between authorized management tasks and potential abuse.

  ### Prioritization
  The alert's medium severity stems from the potential misuse of trusted management tools like LANDesk RMM which may facilitate lateral movement or data exfiltration by an attacker, especially if combined with other suspicious activities.

  ### Blind Spots and Assumptions
  This detection may have coverage gaps where LANDesk traffic is obfuscated or where custom user configurations lead to uncommon domain usage. It assumes that the necessary telemetry logs for network connection activities are fully captured and retained. A reliance on proper configuration of the RMM tool, including correct domain usage, is also critical for accurate detection in this context.

