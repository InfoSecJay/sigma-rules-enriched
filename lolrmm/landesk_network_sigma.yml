note: |
  ### Technical Context

  This Sigma rule detects network connections initiated by the LANDesk Remote Management (RMM) tool to Ivanti-controlled domains, which can indicate potential command-and-control (C2) activity. The attacker’s objective may be to maintain persistence or execute further malicious activities through remote management functionalities. This behavior aligns with the MITRE ATT&CK framework's "Command and Control" tactic (T1071) and the "Remote Access Tools" technique (T1219).

  Primary telemetry sources include Windows network connection logs, particularly those showing DNS queries or outbound traffic. If malicious, this could allow attackers to control systems remotely and execute commands without user knowledge. However, it is important to note that this detection does NOT confirm malicious intent on its own, as genuine administrative use of LANDesk tools can generate similar traffic.

  ### Investigation Steps

  - **Check for outbound network connection logs:** Investigate Windows network connection logs (Event ID 5156) for connections to Ivanti-hosted domains. Review the destination IPs and ensure they match known Ivanti infrastructure to differentiate between sanctioned and suspicious activities.

  - **Correlate with process logs:** Review Process Creation logs (Security Event ID 4688) to identify any instances of the LANDesk executable process launching prior to the network connection. Legitimate LANDesk activity will typically involve the process "lldmsvc.exe" in connection with Ivanti domains.

  - **Analyze user account activity:** Examine the login history (Event ID 4624) for any anomalous logins or logouts associated with accounts that initiated connections to these domains. Multiple logins from unusual geographic locations may indicate a compromise.

  - **Look for high-confidence malicious indicators:** Identify any evidence of unusual data packets (via NetFlow logs or Windows Firewall logs) being sent to Ivanti domains, especially large data transfers or traffic occurring outside normal working hours, which could indicate data exfiltration.

  - **Review legitimate LANDesk usage:** Understand and document expected schedules and methods of legitimate LANDesk usage within the organization to provide context for alerts triggered around known maintenance windows or authorized tasks.

  ### Prioritization

  This alert should be treated with medium priority due to the potential risk of unauthorized remote access via an RMM tool on critical systems. While LANDesk has legitimate uses, such behavior can also be weaponized by attackers to compromise and control infrastructure.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate LANDesk traffic generating similar alerts, leading to potential false positives. Reliable detection requires proper logging configurations, including comprehensive network connection logs and process creation logs. Overlapping legitimate IT activities, such as software updates or remote assistance sessions initiated by IT staff, could falsely trigger this alert. Implementing companion detections for privileged account activity could help strengthen overall security posture.

