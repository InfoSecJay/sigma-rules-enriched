note: |
  ### Technical Context

  This rule detects network activity originating from the LANDesk Remote Management Manager (RMM) tool, specifically traffic directed towards domains associated with Ivanti, such as `ivanti.com` or wildcard subdomains. Attackers may leverage tools like LANDesk for unauthorized access, system manipulation, or data exfiltration, aligning with the MITRE ATT&CK tactic of "Execution" (TA0002) and technique "Remote Services" (T1219). The primary telemetry sources for this detection are network connection logs from Windows systems, capturing outgoing connection attempts to specific external domain suffixes.

  If this behavior is unauthorized, it poses a significant security risk, potentially indicating unauthorized remote management actions. However, this detection does NOT confirm malicious intent on its own, as legitimate use of LANDesk for IT management purposes could trigger the alert.

  ### Investigation Steps

  - **Verify network connection events:**
    Check Windows network connection logs (Event ID 5156) for outbound connections to `*.ivanti.com`. Confirm if the processes initiating these connections are identified as legitimate LANDesk executables (e.g., `LDClient.exe`).

  - **Review process creation logs:**
    Investigate Security Event ID 4688 for new process creations linked to LANDesk tools. Look for associated parent processes that typically execute under managed environments (e.g., system management console).

  - **Analyze asset role and ownership:**
    Identify the role of the affected asset within the organization. If the asset is a standard user workstation rather than an IT management server, further scrutiny of the activity is warranted as it may indicate unauthorized usage.

  - **Cross-reference with known baselines:**
    Compare the observed behavior against established baselines for LANDesk activity. Document expected connection frequencies and destinations from authorized IT teams to rule out false positives effectively.

  - **Identify unusual traffic patterns:**
    Examine the frequency and volume of the outbound connections to Ivanti domains. High levels or unusual times of activity could be indicative of an exploitation attempt or misuse, necessitating further investigation.

  - **Check for file creation or exfiltration artifacts:**
    Review file system logs or Sysmon Event ID 11 for changes or creations of files within LLTD or other LANDesk related directories, especially if artifacts such as configuration files are created unexpectedly.

  ### Prioritization

  The alert is rated medium in severity due to the potential for sensitive system intrusion or management by unauthorized individuals. The likelihood of malicious abuse exists, particularly if unexpected behavior occurs on non-administrative devices. This tool is not commonly weaponized in external attacks but can facilitate lateral movement within environments if misused.

  ### Blind Spots and Assumptions

  Detection limitations arise from potential evasion techniques, such as the use of legitimate LANDesk tools in authorized contexts, making differentiation challenging. Reliable detection necessitates comprehensive logging of network connections and process activity, alongside well-defined user roles across devices. Legitimate activity can include scheduled maintenance or system updates executed during regular business hours. Companion detections, such as monitoring for unauthorized remote desktop protocol (RDP) access, may enhance coverage against potential misuse of remote management tools.

