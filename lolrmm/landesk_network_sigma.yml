note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to specific domains associated with the LANDesk Remote Management Tool (RMM). An attacker may leverage this tool for system administration tasks, potentially using it to deploy malicious software or exfiltrate data while masquerading as legitimate administrative activities. This behavior fits within the MITRE ATT&CK framework under the tactic of Execution and technique T1219 (Remote Access Software).

  The primary telemetry source is Windows network connection logs, particularly focusing on events indicating external communications (e.g., firewall logs or security event logs capturing outbound connections). If malicious, this activity could lead to unauthorized access, data exfiltration, or lateral movement within the environment. It is important to note that this detection does not confirm malicious intent on its own, as legitimate usage of the LANDesk tool may result in similar network behavior.

  ### Investigation Steps

  - **Identify outbound connections:** Review Windows Firewall logs (Event ID 5156) for outbound connections to the domains `*.ivanticloud.com`, `*.ivanti.com`, and `ivanti.com`. Note the source IP and process name making these connections.

  - **Confirm application context:** Check for associated process creations using Sysmon Event ID 1. Identify if a known LANDesk executable (e.g., `ldms.exe`) initiated the connection. Legitimate activity will show regular management tool processes initiating the connection under appropriate user accounts.

  - **Analyze connection frequency:** Investigate the frequency and timing of the connections. Multiple rapid connections from non-administrative accounts or systems not designated for RMM activities may indicate a potential compromise.

  - **Review related authentication logs:** Assess Windows Security Event ID 4624 for logins associated with the activity. Unusual logins around the time of detected connections, especially from non-admin accounts, should be escalated.

  - **Examine outbound data volumes:** Analyze any associated data transfer (if applicable) using network traffic logs (such as NetFlow). High volumes of data during LANDesk connection times, especially to external addresses, can signal exfiltration attempts.

  ### Prioritization

  The alert severity is medium, as outbound connections to management tools like LANDesk may indicate either benign administrative behavior or potential malicious exploitation. The likelihood of abuse is moderate, given that such tools are often weaponized by attackers for remote access and data exfiltration.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as attackers using proxies or encrypted channels to avoid detection. Reliable detection requires proper configuration of network monitoring tools to capture all outbound traffic. Legitimate administrative activities may also generate similar alerts, especially during scheduled maintenance or updates. Companion detections, such as monitoring for unusual account usage or other unexpected administrative access, can help corroborate findings and reduce false positives.

