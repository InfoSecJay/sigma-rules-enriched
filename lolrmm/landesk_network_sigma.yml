note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the LANDesk Remote Management (RMM) tool, specifically monitoring outbound connections to hosts ending with specified Ivanti domain names. The likely attacker objective is to utilize RMM capabilities for command and control (C2) operations to manage compromised systems stealthily. This detection aligns with the MITRE ATT&CK technique T1219: Remote Management Software.

  Primary telemetry sources include Windows network connection logs, specifically monitoring events of outgoing network connections. If malicious, this behavior could indicate that an adversary is managing compromised devices, potentially for data exfiltration or lateral movement. It is crucial to emphasize that this detection does NOT confirm malicious activity on its own, as legitimate use of LANDesk by system administrators can trigger the same alerts.

  ### Investigation Steps

  - **Identify legitimate LANDesk use: **Review network connection logs for known IPs and domains used by your organization's LANDesk implementation. Legitimate connections will typically be directed toward specific internal management servers rather than arbitrary Ivanti addresses.

  - **Validate connection behavior: **Check for unusual frequency or volume of connections made to "*ivanti.com." Identify any repeated or concurrent attempts to connect, especially from endpoints not known to utilize LANDesk.

  - **Examine originating process: **Correlate network connection events (Security Event ID 5156) with process creation logs (Security Event ID 4688) to establish which processes initiated the outbound connections. Review if any processes are unusual for the asset's role.

  - **Assess inbound alerts for unusual patterns:** Look for other indicators of compromise such as unexpected remote access software (e.g., PowerShell uses or suspicious file downloads) that align chronologically with detected LANDesk activity.

  - **Cross-reference asset criticality:** Identify if the machine involved is a high-value target (e.g., domain controllers or file servers) within your environment. Compromise of such assets increases severity.

  ### Prioritization

  The alert is of medium severity due to the potential impact of network-based command and control on critical business assets. The likelihood of malicious abuse is moderate, especially in environments where RMM tools’ misuse could enable unauthorized control over systems. This behavior has been weaponized in the past, making careful investigation essential.

  ### Blind Spots and Assumptions

  This detection can be limited by the legitimate use of LANDesk, which may falsely trigger alerts. Effective detection requires correct logging configurations for outbound connections and ensuring network traffic is monitored thoroughly. Additionally, other legitimate management tools or cloud services may connect to the same Ivanti domains, complicating attribution. Related detections, such as unauthorized remote access (e.g., T1076: Remote Desktop Protocol), can strengthen overall monitoring efforts.

