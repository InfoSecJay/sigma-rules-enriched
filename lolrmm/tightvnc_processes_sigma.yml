note: |
  ### Technical Context

  This detection rule identifies and alerts on process creation events associated with TightVNC, a remote management tool often used for legitimate purposes but also exploited by adversaries for unauthorized access. The primary objective for malicious actors leveraging TightVNC is to establish persistence and enable remote control over compromised systems to facilitate data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique T1219: Remote Access Software.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Windows Sysmon Event ID 1, which document process initiation. If detected in a malicious context, TightVNC can significantly compromise security by granting unauthorized users remote access to sensitive assets. However, this detection does NOT confirm malicious intent on its own, as TightVNC may be used legitimately within an organization's IT framework.

  ### Investigation Steps

  - **Review Event Creation Details:** Check for Security Event ID 4688 and Sysmon Event ID 1 logs for process creation. Look for process names ending with `tvnviewer.exe`, `TightVNCViewerPortable*.exe`, or `tvnserver.exe`. Legitimate execution will typically show a known user or administrative account, whereas malicious indicators may display unexpected user accounts or event chains.

  - **Verify Parent Process Relationships:** Analyze the parent process of suspicious TightVNC instances using fields from Event ID 4688. Genuine activity often shows system or authorized admin tools (e.g., `explorer.exe`), while anomalies may indicate potentially malicious activity initiated by another unauthorized application.

  - **Cross-Reference Asset Role:** Identify the host asset's role—e.g., workstation, server, or administrative machine. If TightVNC is running on sensitive infrastructure (e.g., domain controllers or critical servers) where it should not exist, flag for further investigation.

  - **Check for Anomalous User Account Behavior:** Review recent login attempts and account activity for unusual patterns (e.g., logins outside normal hours or from unusual geographic locations) correlated with the timing of TightVNC processes. Indicators of compromise may include access from non-standard administrative accounts.

  - **Assess Persistence Mechanisms:** Look for evidence of persistence methods relating to TightVNC, such as alterations in startup folders or registry entries for `tvnserver.exe`. Unexpected persistence can indicate an ongoing malicious presence.

  ### Prioritization

  This alert is categorized as medium severity due to the potential risk of unauthorized remote access that TightVNC poses. The likelihood of malicious abuse is significant, as adversaries often utilize remote access tools to facilitate unauthorized activities. The usage of TightVNC without proper oversight further increases the likelihood of exploitation by both internal and external threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate TightVNC instances, potentially leading to false positives. It is critical that process creation logging is properly configured to avoid gaps in visibility. Legitimate administration or remote support activities may trigger this alert. Companion detections for other remote access tools, such as TeamViewer or AnyDesk, can strengthen coverage and help differentiate between legitimate and malicious use cases.

