note: |
  ### Technical Context

  This Sigma rule detects file activity related to the GoToMyPC remote management tool, specifically targeting log files and executable files involved in remote access operations. An attacker may utilize GoToMyPC to maintain remote control over a compromised system, facilitate unauthorized access, or exfiltrate sensitive data. This behavior aligns with the MITRE ATT&CK technique "Remote Access Tools" (T1219).

  The primary telemetry source includes Windows file event logs that record specific file access patterns, particularly logs from the user's AppData directory where GoToMyPC components reside. If determined to be malicious, the security impact could be significant, enabling attackers to manipulate systems or exfiltrate data without detection. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of GoToMyPC in administrative contexts can trigger the rule.

  ### Investigation Steps

  - **Review specific file access events**: Check Windows Security Event ID 4663 for access to `%AppData%\GoTo\Logs\goto.log` and `%APPDATA%\GoToMeeting\G2M.exe`. Correlate the accessing user with known administrative accounts to assess legitimacy.

  - **Validate file creation timestamps**: Investigate the creation and modification times of the detected files, reviewing Event ID 4663 for any sudden or unusual access patterns linked to these files, especially from non-administrative user accounts.

  - **Check for process execution**: Look for related process execution in Security Event ID 4688 or Sysmon Event ID 1 that involve GoToMeeting or the log file path, focusing on arguments passed and the parent process ID to identify suspicious launch behavior.

  - **Identify user behavior**: Analyze user activity by examining user login logs (Event ID 4624) for unusual logon patterns; legitimate activity may frequently show logon times correlating with typical business hours, whereas anomalies may suggest illicit access.

  - **Review remote connection logs**: Investigate potential remote connection logs in the Windows Event Viewer for instances of GoToMyPC sessions (if applicable), noting the duration and accessed resources to ascertain typical versus suspicious usage.

  ### Prioritization

  This alert has medium severity because if exploited on a critical asset, the use of GoToMyPC could lead to unauthorized access and data exfiltration. The likelihood of malicious abuse is moderate, as remote access tools are often weaponized, especially in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by legitimate users utilizing GoToMyPC for administrative tasks, which may overwhelm the ability to distinguish between benign and malicious use. Required log sources include complete monitoring of the Application and Security event logs. Furthermore, legitimate software updates or configurations may trigger this alert. A related detection could involve monitoring unusual inbound/outbound network traffic indicating unauthorized remote connections that pair with any alerts generated by this Sigma rule.

