  ### Technical Context

  This Sigma rule detects file activity related to the GoToMyPC Remote Management Tool, specifically when log files are accessed or modified. The most likely objective of an attacker leveraging GoToMyPC would be unauthorized remote access or session hijacking to conduct further malicious activities, such as data exfiltration or system manipulation. This behavior aligns with the MITRE ATT&CK tactic for Execution (TA0002) and technique Remote Services (T1219).

  The primary telemetry source is Windows file event logs, focusing on the path specifications for GoToMyPC log files. If this behavior is malicious, the security impact could include unauthorized system control or exposure of sensitive information. Importantly, this detection does NOT inherently confirm that an adversary is present, as legitimate use of GoToMyPC is common in many organizations.

  ### Investigation Steps

  - **Check file access history:** Review Windows file event logs (Event ID 4663) for access to the GoToMyPC log files located at `*\GoTo\Logs\goto.log`. Look for multiple accesses in a short time frame, indicating potential malicious activity.

  - **Identify user accounts:** Cross-reference the user account initiating the file access with known authorized users of GoToMyPC. Legitimate users typically have set schedules for accessing logs and rarely exhibit sudden spikes in log access.

  - **Examine concurrent sessions:** Verify if any GoToMyPC remote sessions were active during the file access events using log sources such as Event ID 4624 (logon events) and correlate with timestamps of the file activity.

  - **Look for anomalous modifications:** Evaluate event logs for any modifications to the goto.log file, focusing on Event ID 4660 (file deletion) and any unusual changes that are out of the norm for the timeframe of the alert.

  - **Monitor system credentials:** Track if any elevated privileges were used (Event ID 4672) during the time of the alert. Unusual or unauthorized elevation could indicate malicious use of GoToMyPC.

  - **Validate host security:** Check host role and asset criticality related to the system accessing the file. Servers or sensitive endpoints should not have GoToMyPC as standard, and any unexpected access should be treated with caution.

  ### Prioritization

  This alert should be considered medium severity due to potential unauthorized access to sensitive systems via GoToMyPC. The likelihood of malicious exploitation is moderate since tools like GoToMyPC are commonly weaponized for covert operations. The impact on the affected systems can be significant if exploited, especially in environments handling confidential data.

  ### Blind Spots and Assumptions

  Detection may be limited due to the possibility of legitimate administrative use of GoToMyPC, leading to false positives. Comprehensive logging and proper configuration of Windows Event Logs must be enabled for reliable detection. Additionally, legitimate activities, such as routine log reviews by admins or scheduled maintenance, may trigger this alert. Strengthening coverage can be achieved by complementing this detection with monitoring for related remote access technologies or lateral movement activities.

