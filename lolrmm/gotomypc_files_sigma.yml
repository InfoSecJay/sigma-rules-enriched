note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the GoToMyPC remote management tool, specifically focusing on log files and executable binaries. The likely attacker objective is to maintain persistent access or conduct remote administration through compromised endpoints, which can facilitate further malicious activities such as exfiltration or lateral movement. The relevant MITRE ATT&CK tactic is **Command and Control (T1071)** and technique **Application Layer Protocol (T1219)**.

  The primary telemetry source consists of Windows file event logs, capturing file access patterns. The potential security impact of malicious use is significant, as it may allow unauthorized remote access to sensitive systems. It should be noted that this detection does NOT confirm malicious intent on its own, as legitimate users may also utilize GoToMyPC for authorized remote access.

  ### Investigation Steps

  - **Review file access logs for goto.log or G2M.exe:** Check for Security Event ID 4663 (File Access) for entries where the TargetFilename matches `%AppData%\GoTo\Logs\goto.log` or `%APPDATA%\GoToMeeting\G2M.exe`. Look for unusual access patterns not associated with known users or administrators.

  - **Verify user account legitimacy:** Cross-reference the accounts triggering the detection with the organization’s normal user list. Ensure that the accounts attempting to access these files are not part of a termination or change process.

  - **Analyze process creation logs:** Review Security Event ID 4688 and/or Sysmon Event ID 1 to verify if G2M.exe was executed around the same time as the file access events. Investigate the parent process to determine if the execution context is suspicious.

  - **Identify historically benign behavior:** Document legitimate uses of GoToMyPC in the environment, including known users and expected patterns of file access. Compare current findings against this baseline to identify anomalies.

  - **Look for concurrent network activity:** Examine network logs for outbound connections associated with known GoToMyPC service IPs or domains during the same timeframe as the file activity. Malicious actors may utilize this tool for data exfiltration or remote command execution.

  - **Check for signs of file exfiltration:** Monitor for evidence of unusual file activity such as the creation of unauthorized backups or large file transfers linked to the process, which may indicate exfiltration attempts.

  ### Prioritization

  The alert has medium severity due to the potential risk associated with asynchronous access to sensitive data through GoToMyPC, which is frequently used by threat actors for remote access. The likelihood of malicious abuse is moderate since GoToMyPC can easily be leveraged for post-exploitation activities. This behavior is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by incomplete log retention or configurations that do not fully capture all file events associated with the GoToMyPC application. Legitimate administrative access and authorized support scenarios may produce similar alerts, making context crucial for analysis. A related detection to consider is monitoring for newly created scheduled tasks or services that may indicate persistence mechanisms associated with unauthorized use of remote tools.

