note: |
  ### Technical Context

  This rule detects the activity of the AnyDesk remote management tool via process creation logs. The likely attacker objective is to establish persistent access or control over a target system without detection, often for data exfiltration or lateral movement within the network. This behavior is associated with the MITRE ATT&CK techniques Command and Control (T1071) and Remote Access Tools (T1219). The primary telemetry sources involved include Windows Security Event ID 4688, which logs process creation events, and potentially Sysmon Event ID 1 for more granular detail about the processes. If malicious, this activity could allow an adversary to manipulate or exfiltrate sensitive data from affected systems. However, this detection does NOT confirm that AnyDesk is being used maliciously without corroborating evidence of unauthorized access or actions.

  ### Investigation Steps

  - **Verify the Parent Process:** Check for Event ID 4688 logs where the ParentImage ends with '\\AnyDesk.exe' or '\\AnyDesk-*.exe'. Legitimate AnyDesk sessions may start from known processes associated with remote support.

  - **Review Image Path:** Confirm that the Image field in corresponding logs indicates a path ending with '\\AnyDesk.exe' or '\\AnyDesk-*.exe'. If the process is running from a non-standard directory or a user temp directory, it may indicate malicious usage.

  - **Identify User Accounts:** Cross-reference the hostname and user account in the logs. Legitimate AnyDesk usage typically involves specific, authorized user accounts. Look for suspicious accounts or accounts with unusual activity.

  - **Correlate with Network Traffic:** Check if AnyDesk-related activity is accompanied by unusual outbound network traffic on common ports used by AnyDesk (e.g., TCP 6568, 80, 443). Malicious usage might involve sustained connections to unknown IP addresses.

  - **Investigate for Persistence Mechanisms:** Look for signs of AnyDesk being set to launch at startup through the registry (e.g., Run/RunOnce keys), which would indicate potential persistence by an attacker.

  - **Audit Recent Changes:** Review System Event logs (Event ID Event ID 4616) for any recent changes that coincide with AnyDesk process creation, especially those related to user permissions or system access rights which could indicate privilege escalation.

  ### Prioritization

  This alert is of medium severity as AnyDesk is a legitimate tool that can also be exploited for unauthorized access. The likelihood of malicious abuse is moderate, given that it can facilitate remote control. While remote access tools can be commonplace in both IT support and malicious operations, the context and correlation with other indicators are key to determining actual threat levels.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of AnyDesk, potentially yielding false positives from authorized IT support activities. Must ensure that Windows event logging and Sysmon configurations are correctly set up to capture process creation. Legitimate activities might include internal support teams using AnyDesk for remote troubleshooting. A companion detection to strengthen coverage would be monitoring for unusual outbound connections to AnyDesk servers or IP addresses, which could indicate command and control activity.

