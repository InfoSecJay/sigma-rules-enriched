note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Splashtop Remote Management (RMM) tool. Cyber adversaries may use Splashtop to bypass traditional security controls, allowing remote access to compromised systems with the intent to manipulate, exfiltrate data, or perform lateral movement. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically technique T1219 (Remote Access Software).

  The primary telemetry sources for this detection include network connection logs from Windows systems, focusing on the DestinationHostname field. If malicious, the security impact could be significant, as it suggests unauthorized remote access that might enable attackers to control or surveil victim machines. This detection does NOT confirm malicious activity on its own, as legitimate use of Splashtop for IT support or administrative tasks can occur.

  ### Investigation Steps

  - **Check outbound connections to Splashtop domains:** Review network logs for Event ID 5156 (Windows Filtering Platform) to identify any connections made to `*.splashtop.com`. Ensure that the connections are intended and documented as authorized usage.

  - **Identify processes initiating connections:** Examine the process responsible for initiating connections to these domains using Sysmon Event ID 3 (Network Connection). Look for unexpected or unrecognized processes that could indicate malicious activity.

  - **Evaluate user context and system roles:** Assess the user accounts involved in the activity. Legitimate activity typically involves IT support personnel using Splashtop during work hours, while access by non-IT staff or during odd hours could indicate potential compromise.

  - **Cross-reference authorized tools and services:** Confirm whether Splashtop is an authorized remote access tool on your network. If so, note any configurations that may require attention or review (e.g., specific user accounts or machines).

  - **Investigate for further malicious indicators:** If the connections to Splashtop are unauthorized, cross-reference with other logs, such as Windows Event ID 4624 (Logon) and check for unusual logon patterns or failed attempts that coincide with the Splashtop activity.

  ### Prioritization

  This alert warrants medium severity due to the potential impact of unauthorized remote access on critical systems. The likelihood of such activity being malicious is non-negligible, particularly if the organization's policy does not support the use of Splashtop. Remote access software is commonly exploited in cyberattacks.

  ### Blind Spots and Assumptions

  Detection may be limited by users employing encryption or anonymizing services to mask their activity. Regular audits of outbound traffic logging configurations are crucial for reliable detection. Legitimate IT support activities may trigger this alert, emphasizing the need for contextual awareness during investigation. A related detection focusing on multiple failed login attempts (e.g., Event ID 4625) could enhance coverage and provide further indicators of compromise.

