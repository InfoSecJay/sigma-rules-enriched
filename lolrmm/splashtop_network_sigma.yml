note: |
  ### Technical Context

  This Sigma rule detects network activity targeting Splashtop's Remote Management (RMM) tool, specifically connections to hosts ending in `.splashtop.com`. The primary objective of an adversary utilizing this tool would likely be remote access to compromised systems, allowing them to control the environment, exfiltrate data, or deploy additional malicious payloads. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071: Application Layer Protocol) and technique T1219: Remote Access Software.

  The primary telemetry sources for this detection are Windows network connection logs, capturing outbound connections to remote hosts. If this behavior is confirmed as malicious, it poses substantial risk, including unauthorized system access and potential data breaches. It is essential to note that this detection does NOT conclusively prove malicious activity, as Splashtop may also be used for legitimate remote administration.

  ### Investigation Steps

  - **Identify network connection details:** Review Windows Firewall logs (Event ID 5156) for outbound connections to domains ending in `.splashtop.com`. Search for any unusual timestamps or patterns indicative of unauthorized access.

  - **Correlate endpoints using Splashtop:** Check if the compromised system has authorized Splashtop installations or user accounts. Analyze installed programs (Event ID 4688) to confirm legitimate use or identify unauthorized installations.

  - **Monitor user activity:** Inspect user activity logs to determine if the account that triggered the alert has a history of accessing Splashtop RMM for legitimate tasks. Look for typical operational hours and frequency of access.

  - **Review running processes:** Validate the presence of Splashtop-related processes via Sysmon Event ID 1 (process creation) to distinguish between benign administrative activities versus potentially unauthorized remote control sessions.

  - **Search for high-confidence indicators:** Investigate network traffic for unusual volume or frequency of connections to Splashtop hosts that deviate from baseline behavior, indicating possible exploitation of the tool.

  - **Evaluate asset criticality:** Assess the importance of the affected system; if a critical server is involved in suspicious Splashtop activity, escalate the incident and involve the incident response team for immediate containment.

  ### Prioritization

  This alert should be considered medium priority due to its potential impact on critical systems when compromised. The likelihood of malicious abuse is moderate, as knowledge of RMM tools is common among adversaries. Additionally, these tools are frequently exploited when users fail to secure their remote access configurations.

  ### Blind Spots and Assumptions

  Limitations of this detection include the possibility of malware using the RMM tool under the guise of legitimate Splashtop usage, complicating identification. Reliable detection requires accurate logging from Windows Firewall and Sysmon, including network connections and process creation. Legitimate remote IT support activities could also trigger this alert, especially in environments where Splashtop is authorized. A complementary detection to strengthen coverage could include monitoring for unusual administrative privilege elevation (MITRE ID T1078: Valid Accounts) alongside Splashtop-related activity.

