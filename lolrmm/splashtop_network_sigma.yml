note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to Splashtop’s infrastructure (e.g., `*.splashtop.com`), which is associated with the Splashtop Remote Management (RMM) tool. The likely attacker objective is to establish remote access to compromised systems, allowing for further exploitation and data exfiltration. This behavior relates directly to the MITRE ATT&CK framework under the tactic “Execution” and technique “Remote Services” (T1219). Primary telemetry sources include Windows network connection logs, which track all outbound calls and their corresponding hostnames. If malicious, this activity signifies an unauthorized remote connection that poses grave risks, including data compromise and potential lateral movement within the network. However, this detection does not confirm malicious intent on its own, as legitimate use of the Splashtop tool may trigger similar alerts.

  ### Investigation Steps

  - **Examine outbound connection logs**: Review Windows Firewall logs (Event ID 5156) for connections headed to `*.splashtop.com`. Identify source hostnames and ensure they match expected usage patterns of the organization’s remote access tools.

  - **Validate legitimate Splashtop usage**: Confirm that authorized personnel utilize Splashtop RMM in an approved capacity. Check active sessions and corresponding user IDs against known personnel and their device roles.

  - **Identify anomalous user behavior**: Look for unusual patterns in username activity, such as access times or unknown users initiating connections. Refer to Active Directory logs (Event ID 4624) for user login context.

  - **Check for signs of malicious software**: Use Endpoint Detection and Response (EDR) solutions to search for known malware behaviors that exploit remote access tools. Look for specific process invocations that could indicate exploitation alongside outbound connections.

  - **Correlate logs with other telemetry**: Analyze corresponding Sysmon logs (Event ID 3) to identify command-line arguments or other telemetry that indicate misuse of the Splashtop tool beyond legitimate administrative functions.

  ### Prioritization

  The severity of this alert is medium due to the potential risk Splashtop poses if misused for unauthorized access. The likelihood of malicious abuse is moderate, as advanced adversaries may leverage such tools for persistence and stealth, making it a noted technique in the attack landscape.

  ### Blind Spots and Assumptions

  This detection can be limited by legitimate Splashtop usage in the environment, potentially leading to false positives. If Windows Firewall logs are not properly configured to capture this traffic, detection may be ineffective. Additionally, similar outbound connections could arise from other legitimate applications utilizing Splashtop APIs for allowed purposes. Companion detections, such as monitoring for abnormal process creation (Event ID 4688) associated with Splashtop usage, can enhance coverage and reduce false positives.

