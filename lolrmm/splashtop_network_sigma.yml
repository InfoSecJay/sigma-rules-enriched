note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the Splashtop Remote Management (RMM) tool. The Splashtop RMM tool is designed to provide remote access to devices over the internet, and while it can be used for legitimate support and administration purposes, its functionality may also be exploited by threat actors to gain unauthorized access to systems within an enterprise environment. The primary objective in such cases is often to establish a foothold in the network, exfiltrate data, or facilitate further privileged access.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (TA0002)**: Utilizing legitimate remote access tools for unauthorized access.
  - **Command and Control (TA0011)**: Establishing outbound connections for remote control and data exfiltration.
  - **Remote Access Software (T1219)**: Specifically leveraging RMM tools for unauthorized remote administration.

  The primary data sources for gathering evidence related to this detection rule include network connection logs, which capture outbound connections made from the organization’s devices to external hosts, specifically those with hostnames ending in `.splashtop.com`. Analyzing these logs can help corroborate the context of any suspicious activity.

  ### Investigation Steps
  - **Review Network Connection Logs:** Check network logs for connections to any hostnames ending in `.splashtop.com`. Pay attention to the timestamp, source IP address, and associated user accounts for anomalies.
  - **Correlate with User Activity:** Cross-reference connection events with user activity logs to determine if the connections were initiated by authorized personnel. Look for any irregular remote access patterns or unusual login times.
  - **Inspect Installed Applications:** Investigate the presence of the Splashtop application on endpoints suspected of making these connections, ensuring the application is authorized and properly documented within inventory.
  - **Monitor for Anomalous Actions:** Look for accompanying signs of suspicious behavior such as privilege escalation attempts, unexpected data accesses, or other remote administrative commands following the detected network activity.

  ### Prioritization
  This alert has a medium severity rating due to the potential for unauthorized access facilitated by legitimate software. Given the likelihood of exploitation of remote management tools in attacks, prompt investigation is crucial to prevent possible data breaches or lateral movement within the network.

  ### Blind Spots and Assumptions
  This detection rule assumes that all legitimate uses of Splashtop RMM are documented and authorized within the organization, which may not always be the case. There is a potential blind spot where legitimate use may trigger false positives, including routine IT support tasks. The coverage is dependent on accurate and comprehensive logging of network connection events; if networking device logs are misconfigured or incomplete, critical events may be missed.

