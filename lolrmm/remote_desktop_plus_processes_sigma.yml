note: |
  ### Technical Context

  This detection rule identifies the execution of processes associated with Remote Desktop Plus (RDP), specifically when the parent process for these activities is also `rdp.exe`. Attackers may utilize Remote Desktop Plus as a means of remote access, which can facilitate unauthorized system control and data exfiltration. This behavior is related to the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1219).

  The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688, which records new process creation events. If this activity is indeed malicious, it can lead to significant security impacts such as system compromise and data breaches. Importantly, this detection does NOT confirm malicious behavior on its own; legitimate usage of Remote Desktop Plus by authorized personnel may also generate similar alerts.

  ### Investigation Steps

  - **Check process relationships:** Review Windows Security Event ID 4688 for `rdp.exe` processes and examine the `ParentImage` field to confirm if it matches legitimate known processes (e.g., `explorer.exe`). Expect benign activity from known administrative accounts.

  - **Identify unusual user context:** Examine the `CallerUserName` field in Event ID 4688. If the process is initiated by a non-administrative or unexpected user account, it may indicate suspicious activity.

  - **Correlate with network activity:** Inspect firewall logs or network traffic (e.g., Windows Firewall Event ID 2004) for external connections initiated from the host where `rdp.exe` was executed. Note anomalous outbound connections to unknown IP addresses as potential indicators of compromise.

  - **Look for concurrent administrative activities:** Review logins from the same IP or account to see if they coincide with the process execution. Check for any use of legitimate RMM tasks or applications that might justify the presence of `rdp.exe`.

  - **Check for process anomalies:** Validate the creation time of the `rdp.exe` process against typical operational hours for your organization. Significant deviations might represent malicious use.

  ### Prioritization

  The alert severity is medium due to the potential impact of unauthorized remote access on critical systems. Given that RDP tools can be weaponized by adversaries for lateral movement and exploitation, the likelihood of malicious intent increases, especially if the initiating user and process context appear suspicious.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if logging levels are insufficient or if relevant log files are disabled. Adversaries could employ techniques to hide their use of RDP by masquerading process images or modifying process metadata. Furthermore, legitimate uses of Remote Desktop Plus by IT staff or support teams may inadvertently trigger this alert. Companion detections, such as monitoring for abnormal outbound network connections (e.g., Cloudflare logs), can provide better context to assess the legitimacy of `rdp.exe` activity.

