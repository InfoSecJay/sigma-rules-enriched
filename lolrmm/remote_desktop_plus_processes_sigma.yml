  ---

  ### Technical Context

  This rule detects the creation of processes associated with the Remote Desktop Plus (RDP) tool, specifically when these processes are spawned by another RDP process. The likely attacker objective could involve remote access for unauthorized control or data exfiltration. This behavior aligns with the MITRE ATT&CK technique T1219 - Remote Desktop Protocol. The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688, which captures process creation events, and Sysmon Event ID 1 for detailed process creation data.

  The security impact of malicious activity detected by this rule could involve unauthorized remote management or surveillance of a system. However, this detection does NOT confirm malicious intent on its own, as it may include legitimate administrative activities or authorized usage of RDP tools.

  ---

  ### Investigation Steps

  - **Check process details:** Review Security Event ID 4688 logs for the creation of any processes with the Image name containing `rdp.exe` (event field `NewImage`) and correlate this with the process's command line arguments for suspicious patterns.

  - **Validate parent process relationship:** Confirm that the `ParentImage` of any detected `rdp.exe` process is also `rdp.exe`. This indicates a potential nested or unauthorized usage scenario that is atypical for standard operations.

  - **Analyze usage patterns:** Identify if the detected instance correlates with legitimate business hours for your organization. Legitimate RDP usage will typically occur during standard business hours; check for anomalous hours that might indicate abuse.

  - **Cross-reference host roles:** Investigate the host from which the process was executed, particularly if it is not a designated management system. Systems expected to use Remote Desktop tools should have appropriate controls in place.

  - **Look for network connections:** Examine network logs (e.g., Firewall logs or network monitoring tools) for any outbound connections initiated by the detected `rdp.exe`, particularly towards unusual destinations that do not align with organizational practices.

  - **Identify previous incidents:** Review past incidents or alerts related to Remote Desktop Plus for patterns or repetition that may indicate a broader problem or a targeted threat actor attempting to leverage remote access.

  ---

  ### Prioritization

  The alert is medium severity due to the potential for abuse of remote desktop functionality, particularly if it originates from non-administrative systems. While RDP can be weaponized in attacks, the presence of `rdp.exe` alone is typical for administrative activities, so contextual investigation is crucial before escalating.

  ---

  ### Blind Spots and Assumptions

  Detection limits exist as legitimate Remote Desktop Plus usage may trigger this alert. Environments must ensure proper configuration of process logging to capture all necessary details effectively. Additionally, users may have authorization for legitimate remote sessions that could yield false positives. A related detection to consider is monitoring for credential dumping techniques (T1003), which might indicate an escalation in attempted access following RDP exploitation.

