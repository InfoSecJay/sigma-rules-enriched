note: |
  ### Technical Context
  This detection rule identifies potential process activity related to the Remote Desktop Plus (RDP) Remote Monitoring and Management (RMM) tool by monitoring for processes that spawn with the parent process `rdp.exe`. The rule is indicative of a scenario where an attacker may attempt to gain unauthorized access to systems within an enterprise environment using the RDP functionality, potentially leading to lateral movement or unauthorized operations on critical assets.

  Attackers leveraging Remote Desktop Plus could aim to create a foothold within the target organization, facilitate remote administration, and execute additional malicious activities without user consent. The relevant MITRE ATT&CK tactics include **Execution** as attackers need to execute their tools on the target systems (Technique ID: T1219). The primary data source for this detection comes from Windows process creation logs, which provide insight into process relationships and can help trace unusual execution paths tied to remote access tools.

  ### Investigation Steps
  - **Review Process Creation Logs**: Inspect the Windows process creation logs for any instances of `rdp.exe` being initiated, particularly focusing on the parent-child relationships of the processes to identify unauthorized usage.
  - **Examine Parent Processes**: For each detected instance of `rdp.exe`, analyze the parent process details to determine if it follows a typical usage pattern, such as being launched by standard administrative tools, or if it's executed unexpectedly by suspicious scripts or binaries.
  - **Correlate with User Account Activities**: Cross-reference the date and time of the detected processes with user account logins to see if unusual account behavior, such as logins from unfamiliar IP addresses or at odd hours, coincides with the activity.
  - **Investigate Further Contextual Logs**: Collect additional telemetry related to the system’s network connections and file access (from firewalls or EDR logs) to identify if any suspicious outgoing communication or file manipulation occurred following the execution of `rdp.exe`.

  ### Prioritization
  This alert has a medium severity in an enterprise environment due to the potential risk associated with unauthorized access through RDP tools. The use of Remote Desktop Plus, even when legitimate, requires careful monitoring to prevent exploitation by malicious actors aiming to take control of critical systems.

  ### Blind Spots and Assumptions
  While this detection provides valuable insights into potential unauthorized use of RDP, there are inherent gaps in coverage. The detection may miss legitimate use cases where administrators need to use Remote Desktop Plus for support duties, leading to false positives. Additionally, the detection logic assumes that the identified processes are only invoked by unauthorized users, without context regarding the user or purpose of the activity. For effective alerting, comprehensive process creation logs and configurations that capture all process executions must be enabled, including monitoring tools' settings to ensure thorough visibility into RDP usage.

