note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Kabuto RMM (Remote Monitoring and Management) tool, specifically those ending with `*.kabuto.io`. The likely attacker objective is to establish command and control (C2) capabilities in an ongoing attack, utilizing Kabuto as a remote management service to control compromised systems. This activity is categorized under the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique T1219 (Remote Access Software).

  The primary telemetry source is Windows event logs for network connections, specifically capturing destination hostnames and ports used. The security impact of this activity can be significant, as it may indicate system compromise, leading to unauthorized access and data exfiltration. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate uses of Kabuto exist within organizations.

  ### Investigation Steps

  - **Check outbound network connections:** Review Windows Event ID 5156 (Windows Filtering Platform) to identify any connections to `*.kabuto.io`. Malicious indicators include connections from unexpected hosts with communication attempts to these domains.

  - **Verify process activity:** Analyze Sysmon Event ID 3 (Network Connection) for any processes initiating connections to kabuto.io domains, particularly looking for atypical processes or services. Common benign indicators involve known administrative tools like remote desktop services.

  - **Audit recent software installations:** Investigate software installation logs (e.g., Event ID INSTALL) for the presence of the Kabuto RMM application. Legitimate installations will typically involve known asset management workflows and approvals.

  - **Analyze authentication activities:** Review authentication logs (Event ID 4624) for any accounts that accessed the machine prior to the network activity. Unusual login patterns from non-administrative accounts may indicate compromise.

  - **Investigate file creation artifacts:** Look for unusual files or scripts (Event ID 4663) in temporary or user profile directories that may have been created around the same time as the detected network activity. Be wary of any scripts that initiate further outbound connections.

  ### Prioritization

  This alert carries medium severity due to the significant potential impact of the affected system, particularly if it hosts sensitive data. The likelihood of malicious abuse is moderate, as Kabuto can be leveraged for both legitimate IT management and unauthorized remote access. Although it is an uncommon tool, its misuse is increasingly weaponized by attackers.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate use of Kabuto RMM within the organizational environment, leading to potential false positives. To ensure reliable detection, logging configuration for Windows network connections must be validated. Additionally, legitimate third-party management and external support activities may trigger similar alerts, complicating triage. It is beneficial to monitor for companion detections associated with remote access software (T1219) to enhance coverage against similar threats.

