note: |
  ### Technical Context

  This Sigma rule detects outgoing network connections to domains associated with Kabuto RMM, a Remote Monitoring and Management tool. The likely attacker objective includes establishing a command and control (C2) channel or remotely managing compromised systems. This behavior relates to the MITRE ATT&CK technique “Application Layer Protocol” (ID T1219). The primary telemetry source is Windows network connection logs that capture destination hostnames.

  If malicious, the security impact may include unauthorized remote management, data exfiltration, or lateral movement within the network. This detection does NOT confirm malicious activity on its own, as the presence of connections to these domains may also indicate legitimate usage of the Kabuto tool.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows network connection logs (Event ID 5156) for outgoing connections to `*.kabuto.io`. Identify any unusual internal systems communicating with these domains.

  - **Verify asset roles:** Confirm if the initiating asset is part of a legitimate IT management environment. For instance, a helpdesk or IT support server may typically use Kabuto. Assess asset criticality and ownership.

  - **Analyze process activity:** Cross-reference Windows Security Event ID 4688 logs to identify processes that initiated the network connection. Look for unexpected executables or scripts that coincide with the connection.

  - **Identify suspicious patterns:** Pay attention to connections made during non-business hours or from unexpected geographic locations, which may indicate malicious usage rather than legitimate administration.

  - **Perform threat intelligence lookups:** Use threat intelligence services to determine if the observed domains have been previously flagged as malicious or are associated with known threat actors.

  ### Prioritization

  This alert is of medium severity due to its potential impact on network integrity and the likelihood that remote management tools could be weaponized by adversaries. The detection is critical on endpoints handling sensitive information where unauthorized access could lead to extensive data breaches.

  ### Blind Spots and Assumptions

  Detection limitations may include the potential for attackers to use alternative domains or methods to obfuscate their connections. Reliable detection requires logging configurations to be fully enabled for network connection events on critical endpoints. Legitimate administrative tasks, such as IT support workflows, may trigger this alert if Kabuto RMM is in use. Companion detections related to abnormal process execution or lateral movement activities could provide additional context to assess the legitimacy of the connections.

