note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to known domains used by Distant Desktop RMM tools, such as `*.distantdesktop.com` and `*.signalserver.xyz`. The likely attacker objective is to establish remote access for command-and-control purposes, enabling further exploitation of the target system. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Application Layer Protocol: Remote Access Tools (T1219). Primary telemetry sources include Windows network connection logs, specifically related to outbound traffic. If malicious, this activity can lead to unauthorized control of systems and data exfiltration. This detection rule does NOT confirm that a malicious actor is present on the system without additional context or evidence.

  ### Investigation Steps

  - **Identify outbound connections to suspicious domains:** Query network logs for Event IDs 5156 and 5158 that show details of outbound connections targeting `*.distantdesktop.com` and `*.signalserver.xyz`. Look for connections occurring outside of normal business hours as a potential red flag.

  - **Check for related process activity:** Review Security Event ID 4688 for process creation logs around the time of the network connection to determine if the Distant Desktop application (or similar RMM tools) is present. Legitimate use should show expected applications, if present.

  - **Examine system for persistence mechanisms:** Investigate whether the Distant Desktop application has created a startup entry or scheduled task. Check for abnormal registry keys under `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run`.

  - **Evaluate for unusual traffic patterns:** Look at traffic analysis tools for any large data transfers or unusual spikes in outbound connections that may align with Distant Desktop activity, such as file transfers or high-frequency connection attempts.

  - **Correlate user activity:** Validate if the user account associated with the outbound connections has a legitimate business need for remote access tools. Review user roles and access permissions to confirm appropriateness.

  ### Prioritization

  This alert carries medium severity as it potentially indicates unauthorized remote access, which can compromise sensitive information and system integrity. The impacted systems' criticality and the commonality of remote access tooling in attacks necessitate prompt investigation, especially if other indicators of compromise are present.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of Distant Desktop by approved personnel, resulting in potential false positives. Reliably detecting such activity may require additional logging configurations for DNS lookups and process execution. Be aware that remote administration tools could also be used for legitimate IT support, potentially triggering the alert during maintenance windows. A companion detection involving monitoring for abnormal PowerShell commands could strengthen overall coverage against related intrusion activities.

