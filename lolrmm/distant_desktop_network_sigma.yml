note: |
  ### Technical Context

  This Sigma rule detects network connections to known domains associated with Distant Desktop remote management tools. The potential attacker objective is to use this tool for remote access to compromised systems, facilitating command and control (C2) communication. This behavior aligns with the MITRE ATT&CK framework under the tactic "Command and Control" (TA0011) and technique "Remote Access Software" (T1219).

  The primary telemetry source for this detection includes Windows network connection logs. Specifically, it relies on observing outbound or inbound connections to domains associated with Distant Desktop. If exploited by an adversary, this activity can result in unauthorized remote access, data breaches, or lateral movement within the network. Importantly, this detection alone does not confirm malicious activity; legitimate use of Distant Desktop by authorized personnel can trigger the alert.

  ### Investigation Steps

  - **Check active connections:** Review network connection logs (Event ID 5156 in Windows Firewall logs) for traffic to the domains `*.distantdesktop.com` and `*.signalserver.xyz`. Look for unusual outbound traffic during off-hours that does not match expected business operations.

  - **Review application logs:** Examine Process Creation logs (Sysmon Event ID 1 and Windows Event ID 4688) for any instances where Distant Desktop or similar remote tools are being executed. Legitimate usage will typically involve known IT administrators from specific asset roles, performing scheduled remote management tasks.

  - **Cross-reference authorized users:** Validate the user accounts initiating connections against inventory lists of users permitted to use Distant Desktop. Any patterns of usage by unauthorized accounts should raise suspicion.

  - **Analyze account activities:** Investigate the timeline of the detected activity for correlated events such as account logins (Event ID 4624) or privilege escalation events (Event ID 4672). Benign usage will usually occur within normal patterns of access.

  - **Inspect for data exfiltration artifacts:** Look for file creation and modifications consistent with data exfiltration or lateral movement, such as suspicious file transfers or the creation of unusual scheduled tasks (Event ID 4670).

  ### Prioritization

  This alert is of medium severity due to the potential for remote access associated with Distant Desktop connections, which can be exploited by an adversary. However, the likelihood of malicious abuse is mitigated by legitimate use cases. Despite this, awareness is critical as remote access tools are commonly weaponized for unauthorized activities.

  ### Blind Spots and Assumptions

  Detection depends on logging configurations; if remote management logs are not captured or if outbound internet traffic is not monitored, this detection will fail. Additionally, legitimate business use of Distant Desktop may produce false positives. Related detections such as outbound connections to other remote access software or monitoring for suspicious PowerShell commands can enhance coverage and reduce blind spots.

