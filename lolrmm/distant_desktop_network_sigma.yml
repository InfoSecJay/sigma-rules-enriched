note: |
  ### Technical Context

  This rule detects network activity involving the Distant Desktop remote monitoring and management (RMM) tool by monitoring for connections to specific destination hostnames. The likely attacker objective is to establish remote control over a compromised system, allowing for further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of "Execution" and technique "Remote Services" (T1219). The primary telemetry source is Windows network connection logs, specifically tracking outbound connections to the Distant Desktop servers. If the activity is malicious, it poses a high-security risk, as it could enable persistent access for an attacker. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative usage of Distant Desktop tools can trigger similar alerts.

  ### Investigation Steps

  - **Validate network connections to known Distant Desktop domains:** Check Windows Event ID 5156 (Windows Filtering Platform) logs for connections to "*.distantdesktop.com" or "*.signalserver.xyz". A legitimate connection will typically show known internal user accounts and authorized IPs.

  - **Examine process creation events:** Review Sysmon Event ID 1 for processes that were initiated around the time of the network connection. Look for suspicious executables (e.g., unusual scripts or binaries) that may correspond with the established outbound connection.

  - **Investigate user account activity:** Utilize Security Event ID 4624 to check if the user account associated with the network connection has a history of login activity, particularly from unusual geographic locations or times. Legitimate administrative accounts are usually logged in during business hours.

  - **Correlate with asset role:** Confirm the role of the affected asset. If the endpoint is categorized as a non-administrative or sensitive server, outbound connections to RMM services warrant immediate attention.

  - **Check for concurrent suspicious activities:** Investigate for additional anomalies, such as abnormal process behavior or privilege escalation events, that might be logged around the same time. Malicious indicators would include unusual command line arguments or file移mai operations that coincide with the detected network connection.

  ### Prioritization

  This alert should be classified as medium severity because it can indicate potential remote access by an adversary. While it could be part of legitimate administrative tasks, the risk of abuse, especially in environments with sensitive information, makes it worth reviewing promptly. Remote services like Distant Desktop are often weaponized for nefarious purposes, increasing the need for contextual analysis.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate Distant Desktop usage may generate similar alerts, leading to potential false positives. Effective detection requires comprehensive logging settings for Windows network connections, ensuring that outbound traffic is monitored persistently. Be aware that legitimate remote support activities can trigger this alert, particularly in IT environments where such tools are standard. Companion detections, such as monitoring for anomalous logins (Security Event ID 4624) or network traffic anomalies (e.g., unusual data patterns in outbound logs), can enhance overall visibility and threat detection.

