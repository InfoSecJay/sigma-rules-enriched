note: |
  ### Technical Context
  This rule detects potential network activity associated with the Distant Desktop RMM (Remote Monitoring and Management) tool. It focuses on connections established towards domains indicating the use of this specific tool, which attackers might exploit to gain unauthorized remote access to enterprise systems. In a typical threat scenario, an adversary could utilize Distant Desktop to remotely control affected hosts, facilitating lateral movement, data exfiltration, or the deployment of further malicious payloads.

  Relevant MITRE ATT&CK tactics that apply to this detection include **Execution** (TA0002), specifically the technique **Remote Services: RDP** (T1219). The primary data sources useful for evidence in this context are network connection logs, particularly those that capture outbound connections and associated domain resolutions that can identify unauthorized access attempts.

  ### Investigation Steps
  - **Review Network Connection Logs:** Examine logs for outbound connections to domains like `*.distantdesktop.com` and `*signalserver.xyz`. Look for unexpected or unusual connection attempts during non-business hours or from unusual internal hosts.
  - **Analyze User Activity:** Investigate the user accounts associated with the detected connections, including login times and patterns. Pay special attention to any accounts that have not typically engaged with remote access tools.
  - **Correlate with Endpoint Events:** Check endpoints for processes related to Distant Desktop or remote management tools. Use endpoint detection solutions to identify any new installations or executions of suspicious tools around the time of detected activity.
  - **Assess Firewall Logs:** Review logs from NGFW or other perimeter defenses to see if there are any blocks or alerts tied to the identified domains. This can provide insight into whether any connection attempts were stopped and why.

  ### Prioritization
  This alert is of medium severity given the potential for Distant Desktop to be used in legitimate scenarios as well as by malicious actors. Ensuring that attributed network activity is monitored helps mitigate risks associated with compromise, especially as remote access tools can significantly amplify an attacker’s operational capabilities.

  ### Blind Spots and Assumptions
  The detection logic may miss legitimate use cases where Distant Desktop is sanctioned for remote support, risking false positives from authorized personnel. The effectiveness of this rule is contingent upon comprehensive network logging being enabled, including outbound connection logs. Additionally, there may be blind spots regarding encrypted connections that obscure destination domain analysis if TLS/SSL inspection is not performed within the environment.

