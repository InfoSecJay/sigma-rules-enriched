note: |
  ### Technical Context

  This rule detects file activity involving the Visual Studio Code Remote Tunnels (VS Code RMM) tool, particularly focusing on the execution of the `code-insiders.exe` process. The likely objective of an attacker using this tool is to establish a remote command-and-control (C2) channel, facilitating unauthorized access to the target system. This activity aligns with the MITRE ATT&CK technique of Remote File Copy (T1219), categorized under the command-and-control tactic.

  The primary telemetry sources include Windows file events which capture file creations, modifications, and access to sensitive executables. If this tool is used maliciously, it can lead to unauthorized data exfiltration or system compromise by creating persistent C2 channels. However, this detection does NOT definitively prove malicious intent on its own, as legitimate usage of VS Code Remote Tunnels is possible.

  ### Investigation Steps

  - **Review process execution details**: Check Security Event ID 4688 for instances of `code-insiders.exe` execution. Look for user accounts unrelated to development or administrative roles, indicating potentially unauthorized usage.

  - **Analyze parent process relationships**: Use Sysmon Event ID 1 to identify the parent process of `code-insiders.exe`. A legitimate user-initiated process (like `vs_code.exe`) suggests normal behavior, while execution from unexpected sources (e.g., scripts or batch files) may indicate compromise.

  - **Correlate file access patterns**: Examine Event ID 4663 for file access attempts to and from `C:\Windows\debug\code-insiders.exe`. Track if the executable is modifying critical system files or performing actions inconsistent with standard operational patterns.

  - **Validate network connections**: Check for outbound connections from the process using Windows Firewall logs or Sysmon Event ID 3. Look for unusual external IP addresses or domains, indicating potential C2 communications.

  - **Confirm legitimate usage scenarios**: Verify that the system running `code-insiders.exe` is part of an active development environment where VS Code Remote Tunnels would be expected to be used, reducing the likelihood of malicious activity.

  ### Prioritization

  The alert severity is medium due to the potential risk of unauthorized remote access via the VS Code RMM tool. The affected systems, particularly development servers or administration machines, are critical in a corporate environment and could be exploited through this method. While remote access tools can be weaponized by adversaries, their legitimate use in software development must also be considered.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques such as obfuscating the usage of the tool or running it in a sandboxed environment. Reliable detection requires correct log configurations to capture both process execution and file access details. Legitimate internal processes, particularly by developers using VS Code for remote work, may trigger this alert. A related detection to strengthen coverage could involve monitoring for unusual outbound traffic from development tools not typically associated with the corporate infrastructure.

