note: |
  ### Technical Context
  This detection rule identifies network activity associated with the Connectwise Automate (LabTech) Remote Monitoring and Management (RMM) tool. The tool is often used by IT administrators and service providers to manage endpoints, deploy updates, and conduct maintenance on systems remotely. However, attackers may exploit RMM tools as a means of maintaining access to compromised environments, facilitating lateral movement, exfiltration, or managing their persistence within a network.

  The likely attacker objective here may be to gain unauthorized access to systems, exploitable configurations, or sensitive data under the guise of legitimate administrative tasks. The applicable MITRE ATT&CK tactics for this detection include **Execution** (T1203), which encompasses the execution of malicious code or scripts, and **Remote Management Tools** (T1219), which specifically addresses the abuse of RMM tools like Connectwise Automate for malicious purposes.

  The primary data sources for this detection include network connection logs, specifically those that capture outbound connections, which can highlight unusual activity directed towards domains associated with the Connectwise Automate service, such as those ending with `*.hostedrmm.com`.

  ### Investigation Steps
  - **Review Network Traffic Logs:** Analyze network connection logs for any unusual or unauthorized connections to domains ending in `*.hostedrmm.com`. Investigate the originating hosts and assess whether the connections align with expected administrative behavior.

  - **Correlate with Endpoint Activity:** Examine endpoint logs to identify any process execution or commands that coincide with the times of suspicious network connections. Look for any instances of the Connectwise Automate client or related scripts being used.

  - **Assess User and Role Permissions:** Determine if the users initiating connections to the RMM service possess appropriate administrative roles. Evaluate if any credential misuse or lateral movement occurred leading to increased permissions.

  - **Cross-check with Asset Management:** Verify if the systems making the connections are documented assets managed by the IT department. Identify any unauthorized devices or configurations that could indicate exploitation of the RMM tool.

  ### Prioritization
  This alert is prioritized as medium severity due to its implications in potential unauthorized remote access, which poses a risk to sensitive enterprise information and could lead to significant security incidents if exploited effectively by malicious actors.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if legitimate uses of Connectwise Automate are not properly contextualized against expected behaviors in the environment. The detection logic assumes that outbound traffic to the `*.hostedrmm.com` domain represents suspicious activity; however, legitimate IT operations may generate similar traffic. Required logs for optimal detection include comprehensive network connection logs and endpoint telemetry that capture system and user activity, ideally enriched with application context and user role information to provide critical operational clarity.

