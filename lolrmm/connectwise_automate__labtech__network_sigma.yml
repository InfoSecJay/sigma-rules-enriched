note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains ending in `.hostedrmm.com`, which is characteristic of the Connectwise Automate (LabTech) Remote Monitoring and Management (RMM) tool. Attackers may leverage such tools to gain control over systems or perform reconnaissance within a network, often disguising malicious activities as legitimate management tasks. This behavior maps to the MITRE ATT&CK framework under the tactic "Execution" and technique T1219 (Remote Access Software).

  The primary telemetry source for this detection is Windows network connection logs, which can be found in security logs monitoring for outbound traffic. If malicious, the security impact includes unauthorized access to systems, data leakage, or lateral movement within the environment. It’s crucial to note that this detection does NOT confirm that an attack is occurring on its own; further investigation is required to understand the context of these connections.

  ### Investigation Steps

  - **Review outbound connection logs:** Check Windows Security Event ID 5156 (Windows Filtering Platform) for recent outbound connections to `.hostedrmm.com`. Legitimate connections may coincide with scheduled maintenance tasks.

  - **Examine process parent-child relationships:** Investigate Windows Event ID 4688 for the creation of processes initiating communications to the suspicious domain. Look for known legitimate processes (e.g., LabTech.exe). Kill-chain indicators include unusual parent processes or behaviors indicating malicious automation tools.

  - **Correlate with installed software:** Cross-reference the identified connections with installed software inventory. If Connectwise Automate is explicitly installed and configured, the connection may be benign; absence of the software points toward potential compromise.

  - **Check for abnormal traffic patterns:** Analyze network traffic logs (from firewall or proxy solutions) to assess frequency and volume of connections to `.hostedrmm.com`. Consistent connections in short intervals may indicate malicious activity.

  - **Investigate asset criticality:** Determine if the affected host is critical to business operations or has elevated privileges. Compromise of such assets could facilitate more significant breaches.

  ### Prioritization

  This alert has a medium severity level due to the potential impact on critical systems and the likelihood of malicious activity mimicking legitimate RMM behaviors. The use of Connectwise Automate is common in managed IT services, but its misuse is a frequently weaponized tactic by adversaries to exploit access for further compromise.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of alternative protocols or tunneling to bypass traditional detection methods. Ensure that full logging from relevant firewalls or network devices is enabled to capture all outbound traffic. Legitimate remote management tasks may trigger this alert, especially in environments managing multiple client systems. Companion detection focusing on unusual admin tool executions (e.g., PowerShell scripts that execute remote commands) can strengthen overall coverage against this detection.

