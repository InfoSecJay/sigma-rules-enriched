  ### Technical Context

  This rule detects network connections to domains associated with the Connectwise Automate (LabTech) remote management tool, specifically targeting hosts under the '*.hostedrmm.com' domain. Attackers may leverage such remote management tools to maintain access to compromised systems, perform reconnaissance, or execute commands remotely. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), using the technique Remote Access Software (T1219).

  The primary telemetry source is Windows network connection logs, specifically tracking outbound connections to the specified domain. A successful malicious exploit could enable unauthorized access and control over the affected devices, leading to potential data theft, lateral movement, or further infrastructure compromise. It is essential to note that this detection does NOT confirm malicious use on its own, as such connections could be legitimate if authorized personnel are utilizing Connectwise Automate for administrative purposes.

  ### Investigation Steps

  - **Verify the destination hostname:**
    Check for connections specifically to domains ending in '*.hostedrmm.com' using Windows Security Event ID 5156 (Windows Filtering Platform). Ensure those connections are not part of legitimate administrative activity.

  - **Identify the source of the connection:**
    Examine the originating host (Event ID 5156) for any recent changes or suspicious behavior, such as new services starting or unusual logins. Legitimate administration should show consistent usage patterns and authorized admin accounts.

  - **Check for common indicators of compromise:**
    Look for associated processes using Sysmon Event ID 1 (Process Creation) that initiate connections to the detected domain during anomalous hours or with unusual command-line arguments, indicating potential misuse.

  - **Review supporting logs for user authentication:**
    Analyze Account Logon events (Event ID 4624) around the same timestamp as the network connection. Cross-reference to identify if a known user was logged in to the host issuing the network request at the time.

  - **Assess any unusual outbound activities:**
    Investigate logs for other outbound connections during the same timeframe which may be indicative of lateral movement or other connections to suspicious domains.

  - **Document expected behavior from Connectwise Automate:**
    Confirm if legitimate connections typically involve a specific user account, session time, or regular activities such as remote management tasks. Document these behaviors for effective baseline comparisons.

  ### Prioritization

  This alert should be considered medium severity due to the possibility of malicious control through remote access tools, especially if observed on critical assets. The likelihood of abuse is realistic, as remote administration tools are often targeted by attackers to maintain persistence. However, legitimate administrative tasks may also trigger this connection, necessitating context-driven analysis.

  ### Blind Spots and Assumptions

  This detection may have limitations in environments where Connectwise Automate is widely used, leading to false positives if not correlated with other data sources. Required log configurations must ensure comprehensive visibility of outbound network activities for effective detection. Legitimate activities may include routine remote management tasks executed by IT personnel. An effective companion detection could involve monitoring for suspicious file execution patterns linked to remote access tools, enhancing overall security coverage.

