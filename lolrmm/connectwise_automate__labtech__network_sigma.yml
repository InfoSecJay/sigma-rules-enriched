note: |
  ### Technical Context

  This detection identifies network activity associated with the Connectwise Automate (LabTech) RMM tool, specifically monitoring connections to domains like `*.hostedrmm.com`. Connectwise Automate is often used for remote management and administrative tasks, which attackers may exploit to maintain control over compromised systems. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011) and the technique is **Application Layer Protocol** (T1219).

  The primary telemetry source is Windows network connection logs, particularly focusing on connection attempts to the specified RMM domains. If the detected activity is malicious, it could signify unauthorized access or use of a legitimate administrative tool for nefarious purposes. Importantly, this detection alone does not confirm that malicious activity is occurring; it may simply reflect legitimate administrative functions.

  ### Investigation Steps

  - **Check connection logs for context:** Review network connection logs (Event ID 5156 or equivalent) for any outbound connections to `*.hostedrmm.com`. Note the process initiating the connection for further analysis.

  - **Validate process legitimacy:** Investigate the process ID that initiated the connection. Look for known legitimate applications or services associated with remote management tools, specifically the Connectwise Automate service.

  - **Correlate with historical activity:** Cross-reference the observed behavior with logs from the last 30 days to determine if previous legitimate RMM activities were conducted, helping establish a baseline of expected behavior.

  - **Assess system roles and criticality:** Determine if the affected system has administrative roles or access to sensitive data, which increases the risk associated with unauthorized RMM activity.

  - **Document any unusual user behavior:** If a non-administrative user or an unexpected service account initiated the connection, further investigation into user activity and permissions is needed for potential misuse.

  - **Check for remote software installation records:** Review Windows logs for software installation events (Event ID 11724) or configuration changes that may indicate the deployment of the Connectwise Automate agent without proper authorization.

  ### Prioritization

  This alert has medium severity due to its association with potential command and control activity. Systems using Connectwise Automate for legitimate purposes are critical, and any unauthorized use poses a significant risk. This behavior can be weaponized in attacks, making it crucial to investigate promptly.

  ### Blind Spots and Assumptions

  Evasion techniques may include altering the domain patterns or using non-standard protocols to bypass detection. Reliable detection requires logging configurations for Windows firewall and connection settings to capture outbound attempts accurately. Legitimate scenarios include scheduled tasks or approved IT management activities that utilize Connectwise Automate, which may trigger this alert. A companion detection such as anomalous authentication attempts to administrative tools (e.g., Event ID 4624 for logon events) can further enhance monitoring for potential misuse.

