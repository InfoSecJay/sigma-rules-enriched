  ### Technical Context

  This rule detects instances of potential malicious or unauthorized use of the Any Support Remote Monitoring and Management (RMM) tool, specifically focusing on processes initiated or related to `ManualLauncher.exe`. The likely attacker objective is to gain remote access or management capabilities over compromised systems, facilitating further attacks or persistence. This behavior aligns with the MITRE ATT&CK tactic of "Execution" and technique "User Execution" (T1219). The primary telemetry source is Windows process creation logs, specifically looking for events related to the execution of `ManualLauncher.exe`.

  If identified as malicious, this could lead to significant security breaches, including unauthorized data access or network control. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate use cases may exist for this tool in managed environments.

  ### Investigation Steps

  - **Review process logs for ManualLauncher.exe activity**: Check Windows Security Event ID 4688 for any instances of `ManualLauncher.exe` being executed and note its parent process lineage for context.

  - **Identify the parent process**: Look for the parent process of the detected instance, specifically confirming if it is `ManualLauncher.exe`, to determine if a legitimate launch scenario is present or if obfuscation is being attempted.

  - **Compare execution time with user activity**: Check for related user logon events (Event ID 4624) to see if the process execution aligns with user activity patterns or was anomalously timed, indicating possible unauthorized use.

  - **Validate legitimate usage**: Engage with the IT support team to confirm if high-profile users or support staff commonly utilize `ManualLauncher.exe` for legitimate remote management tasks. Document their feedback for context.

  - **Search for network connections initiated by the process**: Inspect network logs (e.g., firewall or IDS logs) for any outbound connections initiated by the `ManualLauncher.exe` process, focusing on uncommon IP addresses or unusual ports commonly associated with remote access tools.

  - **Correlate with known malware signatures**: Utilize virus signature databases to compare the checksum or behavior of the detected `ManualLauncher.exe` against known malicious variants, looking for signs that may indicate it has been tampered with or is being used as part of an attack.

  ### Prioritization

  This alert carries a medium severity level due to the potential impact on systems used for sensitive operations and the likelihood that unauthorized use of RMM tools can facilitate significant breaches. While RMM tools are often exploited for malicious purposes, their legitimate use in corporate environments necessitates careful validation.

  ### Blind Spots and Assumptions

  Detection may be bypassed by adversaries utilizing obfuscation techniques or renamed executables to disguise malicious intent. Reliable detection requires comprehensive monitoring of process creation and network activity. Legitimate activities may include authorized IT support actions, resulting in false positives. An associated detection, such as monitoring for unusual outbound traffic patterns following process execution, can reinforce protection against RMM tool exploitation.

