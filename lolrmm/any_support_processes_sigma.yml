note: |
  ### Technical Context
  This detection rule identifies potential process activity related to the Any Support Remote Monitoring and Management (RMM) tool, specifically triggered by instances where processes are initiated with `ManualLauncher.exe`. Such tools are often employed by IT support teams for legitimate remote management but can also be misused by threat actors to maintain persistence or perform unwanted remote access on compromised systems.

  In malicious scenarios, attackers may utilize Any Support RMM to gain unauthorized access to corporate networks, manipulate systems remotely, or harvest sensitive information while masquerading as legitimate support personnel. The detection aligns with the MITRE ATT&CK techniques, particularly under **Execution (TA0002)** and **Remote Services (T1219)**, highlighting concerns with remote access tools that facilitate adversarial operations.

  The primary data source for this detection is process creation event logs on Windows machines. These logs provide insight into which processes are being spawned, by whom, and their associated parent processes, which are critical for identifying potentially malicious activities disguised by legitimate tools.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation logs to identify instances of `ManualLauncher.exe` being executed, including the user context and parent processes involved.
  - **Investigate Parent Process**: Analyze the parent process associated with `ManualLauncher.exe` to determine how the execution was triggered and assess if it deviates from normal operational patterns.
  - **Cross-Reference with Authorized RMM Usage**: Validate with IT asset management records whether the detected use of Any Support RMM is legitimate; consult the team to clarify expected usage scenarios.
  - **Check for Establishment of Remote Sessions**: Look for related network connections and sessions established by Any Support RMM tool during the timeframe of detection, assessing for any anomalies or unexpected endpoints connected to the infrastructure.

  ### Prioritization
  The severity of this alert is medium due to the potential for both legitimate and malicious use of the Any Support RMM tool. Given the right context, even genuine process activity can be leveraged for nefarious purposes, making careful assessment necessary.

  ### Blind Spots and Assumptions
  This detection rule may miss instances where the Any Support tool is executed with different filenames or run through obfuscated methods. The logic assumes that `ManualLauncher.exe` is being used in a typical manner, which may not always be the case in sophisticated attacks. For this alert to function effectively, process creation logs must be properly configured and stored for analysis, alongside comprehensive monitoring of process activity on Windows systems.

