note: |
  ### Technical Context

  This Sigma rule detects the execution of processes that end with `\ManualLauncher.exe`, which suggests potential activity related to the Any Support Remote Monitoring and Management (RMM) tool. Attackers could use RMM tools for maintaining persistence, remote access, or lateral movement within the network after initial compromise. This behavior aligns with the MITRE ATT&CK tactic for Command and Control (ID: T1219), where the objective is to establish control over systems for further malicious actions.

  The primary telemetry sources are Windows process creation logs. Specifically, Security Event ID 4688, which logs the creation of new processes, will contain the necessary details. If malicious, an attacker could potentially leverage this tool to exfiltrate sensitive data or take control of endpoints. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of the Any Support tool also triggers this rule.

  ### Investigation Steps

  - **Check for legitimate usage patterns:** Review recent operations to see if the Any Support RMM tool is expected in the environment. Validate if `\ManualLauncher.exe` is on devices where IT support staff are known to use it.

  - **Verify process parentage:** Analyze Security Event ID 4688 for any instances of `\ManualLauncher.exe` launched by a known legitimate process. Look for unusual parent processes that may indicate abuse.

  - **Investigate execution timestamps:** Correlate the timestamps of the RMM tool execution with other security events (e.g., login attempts, failed access) using a timeline analysis approach. Look for rapid sequences of process creations or accounts not typically associated with IT tasks.

  - **Identify high-confidence malicious indicators:** If the process is initiated by an unknown or suspicious account, or if it is running on critical systems (e.g., servers, domain controllers) where it shouldn't, consider this a significant indicator of compromise.

  - **Review system logs for lateral movement:** Check for associated network communications (e.g., outflowing traffic on uncommon ports) originating from the host running the RMM tool through firewall or IDS logs, to assess if a remote session was established.

  ### Prioritization

  This alert has medium severity as the presence of Any Support RMM tools can signify a legitimate business need; however, their usage indicates potential for malicious abuse. The risk increases on critical systems or when suspicious process parentage is identified. This behavior is commonly weaponized by adversaries for post-exploitation purposes.

  ### Blind Spots and Assumptions

  Detection is limited if the logging configurations for Windows processes are not adequate or if event logs are being suppressed. Legitimate activities include IT support or maintenance operations that utilize RMM tools, which may trigger false positives. Monitoring for other related detections, such as unauthorized remote desktop sessions or unusual administrative account activity, can enhance visibility on potential threats.

