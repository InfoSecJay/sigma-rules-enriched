note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to UltraViewer's domain (ultraviewer.net), which is associated with a remote management tool often exploited by adversaries for unauthorized access to systems. The likely attacker objective is to establish remote control over compromised machines, facilitating data exfiltration or lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry sources for this detection include Windows network connection logs, specifically focusing on DNS resolution events and outgoing connection attempts. The security impact of malicious usage is significant as it may indicate unauthorized access to endpoints, potentially leading to larger breaches. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate usage of UltraViewer for remote support may occur in some environments.

  ### Investigation Steps

  - **Verify destination addresses:** Check logs for Event ID 5156 (Windows Filtering Platform) to confirm outbound connections to 'ultraviewer.net'. Compare against known user activity to distinguish between benign and suspicious usage.

  - **Check for process context:** Investigate Event ID 4688 (Process Creation) to identify the parent process initiating the connection. Common benign processes may include 'UltraViewer.exe', while suspicious processes such as 'cmd.exe' or 'powershell.exe' may indicate misuse.

  - **Review recent user activity:** Inspect user account actions around the time of the alert in Security Event ID 4624 (Logon) to correlate remote access usage with legitimate administrative tasks. Legitimate activity may include scheduled remote support sessions.

  - **Evaluate network traffic patterns:** Utilize network monitoring tools to analyze the volume and frequency of outbound traffic to the UltraViewer domain. Sudden spikes in connections may indicate potentially unauthorized use rather than routine access.

  - **Assess endpoint roles:** Consider the asset criticality of endpoints initiating connections. Alerting for connections from high-value systems (e.g., servers, domain controllers) should be prioritized over typical user workstations.

  ### Prioritization

  This alert is of medium severity because unauthorized UltraViewer activity could lead to significant operational impacts if it enables an adversary's control over critical systems. The likelihood of malicious abuse is high given the tool's association with remote access, which is a well-known attack vector.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate use of UltraViewer by support teams, which could trigger false positives. Required log sources include Windows network connection logs and Windows Security logs for comprehensive visibility. Activities such as legitimate remote support connections may mask malicious usage, making context essential. Related detections for suspicious remote access software (e.g., TeamViewer connections) can enhance overall detection capabilities.

