note: |
  ### Technical Context

  This rule detects potential network activity related to the UltraViewer Remote Management Tool (RMM), which is often used for remote access and support. Attackers may utilize UltraViewer to gain unauthorized access to systems, facilitating data exfiltration or further lateral movement within a network. This behavior aligns with the MITRE ATT&CK techniques for Remote Access Software (T1219).

  The primary telemetry source for this detection is network connection logs indicating connections to the specified UltraViewer domains (e.g., `*.ultraviewer.net`). If this network activity is malicious, it could lead to significant security breaches, including data theft and persistent access. It is important to note that this detection does NOT confirm malicious use, as legitimate usage of UltraViewer exists.

  ### Investigation Steps

  - **Check network connection logs**: Look for Windows Event ID 5156 (Windows Filtering Platform) logs for outbound connections to `*.ultraviewer.net`. Validate the time of the connection against known user activity for context.

  - **Review running processes**: Utilize Process Monitor or Task Manager to identify if any known UltraViewer executables are running (e.g., `UltraViewer.exe`). Legitimate usage would involve expected user profiles where remote support was requested.

  - **Analyze user activity logs**: Examine security logs (Event ID 4624) for user logins around the timestamp of detected connections to ensure that the user is authorized and that their session context aligns with legitimate remote support activities.

  - **Investigate for data exfiltration**: Review additional telemetry for file transfer logs or unusual outbound traffic patterns to external geographies that may indicate data being sent during a remote session.

  - **Correlation with known threats**: Query threat intelligence sources or internal indicators for any previous incidents involving UltraViewer, looking for IP addresses or domains that have been flagged in other investigations.

  ### Prioritization

  This alert is of medium severity due to its potential impact on systems with remote access capabilities, which could lead to unauthorized control or data breach if exploited. Although not highly weaponized compared to more common attack vectors, the specific use of UltraViewer for unauthorized access warrants careful evaluation due to the increasing prevalence of legitimate remote management tools being abused.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations, as some environments could have whitelisted UltraViewer usage, leading to potential false positives. The presence of legitimate remote support sessions can trigger this alert, particularly in IT support environments. Companion detections could include monitoring for anomalous logins or escalated privileges coinciding with the use of remote access tools, strengthening overall coverage and context in investigations.

