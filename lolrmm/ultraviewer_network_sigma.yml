note: |
  ### Technical Context

  This rule detects outbound network connections attempting to resolve the hostname associated with the UltraViewer remote management tool, which is commonly used for remote access by both legitimate support agents and attackers. The likely attacker objective is to establish a remote connection to a compromised system to perform unauthorized activities, such as data exfiltration or system manipulation.

  This detection corresponds with the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1219). The primary telemetry source is Windows network connection logs, specifically focusing on DNS queries and outbound connection attempts related to UltraViewer. If the alert is confirmed as malicious, the security impact could range from unauthorized access, data breaches, to persistent threats within the environment. This detection does NOT confirm that malicious activity is occurring; it merely indicates a potential attempt to connect to an RMM tool known for misuse.

  ### Investigation Steps

  - **Verify outbound connections to UltraViewer domains:** Examine network event logs (Security Event ID 5156) or Windows Firewall logs for outbound connections targeting `*.ultraviewer.net` or `ultraviewer.net`. Check connection timestamps and the source IP to assess the legitimacy.

  - **Correlate with user activity logs:** Identify which user account initiated the connection by cross-referencing user activity logs and event IDs 4624 (successful logon) and 4634 (logoff). Legitimate use will often correlate with known remote support sessions, while anomalous users’ activity triggers suspicion.

  - **Check for concurrent suspicious processes:** Review process creation logs (Sysmon Event ID 1) to identify any simultaneous execution of processes like `UltraViewer.exe` or similar remote management tools. Malicious indicators include unexpected executions or processes initiated by non-administrative users.

  - **Review historical activity around the connection:** Analyze logs for past connections from the same system to previously known safe hosts or a history of unusual outbound traffic patterns. Abnormal spikes should be flagged for further investigation.

  - **Assess host role and asset sensitivity:** Determine the role of the source system (e.g., a critical server versus a user's workstation). A connection from a highly privileged host or sensitive asset to UltraViewer’s domains elevates the risk profile.

  - **Investigate for additional persistence mechanisms:** Look for unusual file creations or modifications in temporary directories, especially scripts or executables that may be dropped by UltraViewer during remote sessions (consider Sysmon Event ID 11 for file creation).

  ### Prioritization

  This alert is considered medium priority due to the potential impact of uncontrolled remote access to sensitive systems. The likelihood of malicious abuse is notable, given UltraViewer's recent associations with unauthorized remote access attempts. This behavior is increasingly weaponized in various cyber-attack scenarios.

  ### Blind Spots and Assumptions

  Detection may have limitations due to legitimate usage of UltraViewer in IT support contexts; thus, misconfiguration can lead to false positives. Ensure that DNS query logging is enabled and that relevant network connection logs are configured for comprehensive monitoring. Legitimate IT support activities may trigger the alert, especially during rapid response scenarios. A related detection for additional coverage could be monitoring for other remote access tools showing patterns of similar network activity, such as TeamViewer or AnyDesk.

