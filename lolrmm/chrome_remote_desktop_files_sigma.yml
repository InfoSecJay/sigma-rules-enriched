note: |
  ### Technical Context

  This rule detects file activity associated with the Chrome Remote Desktop software, specifically targeting the execution of `remoting_host.exe`. The objective of an attacker using this software could be to gain remote control over a compromised system, facilitating unauthorized access. The relevant MITRE ATT&CK tactic is Command and Control, with the technique being Remote Access Software (T1219). Primary telemetry sources include Windows file event logs that capture file execution and modifications. If malicious, this behavior can lead to full system compromise and lateral movement across the network. Importantly, this detection does NOT confirm malicious activity on its own, as Chrome Remote Desktop can be used for legitimate purposes.

  ### Investigation Steps

  - **Check file execution timestamp:** Review Windows Security Event ID 4688 to confirm the execution of `remoting_host.exe`, noting the time and the user that executed it. If it’s initiated by a standard user without administrator privileges, further scrutiny is warranted.

  - **Review process parentage:** Analyze the parent process of `remoting_host.exe` in Sysmon Event ID 1 to identify if it was spawned from a legitimate source or an unusual process indicative of malicious behavior.

  - **Correlate user activity:** Investigate the Windows Security Event logs for Event ID 4624 showing logon events around the same timestamp to determine if the user account has legitimate reasons for remote desktop usage, such as remote work or IT support tasks.

  - **Identify expected behavior:** Understand that legitimate usage of Chrome Remote Desktop would typically involve user accounts tied to IT support roles, logged in during business hours, with reasonable activity aligned to support tasks. Any deviation could indicate risk.

  - **Flag abnormal file modification:** Look for alterations to files related to Chrome Remote Desktop in File Creation/Modification events (Windows Event ID 4663) that could indicate malicious attempts to manipulate the tool for unauthorized access.

  ### Prioritization

  This alert holds medium severity as it can indicate potentially unauthorized remote access attempts on critical endpoints. The likelihood of malicious exploitation is moderate, given that Chrome Remote Desktop is a well-known tool that is sometimes weaponized for lateral movement. Systems with sensitive data or critical functionalities should be prioritized for investigation.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited by user behavior that incorporates Chrome Remote Desktop for legitimate purposes, leading to false positives. It relies on active logging of Windows file events; disabling this could impede detection. Legitimate software updates or remote administration can genuinely trigger this alert. A companion detection that strengthens coverage would be monitoring logs for other known remote access tools often used in tandem with Chrome Remote Desktop, such as TeamViewer or AnyDesk.

