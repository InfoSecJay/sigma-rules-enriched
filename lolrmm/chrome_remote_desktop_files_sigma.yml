note: |
  ### Technical Context

  This rule detects file activity related to the Chrome Remote Desktop tool, specifically targeting the execution and configuration files associated with its functionality. Attackers may use this tool for unauthorized remote access and control, potentially aiming to exfiltrate data or maintain persistence in compromised environments. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011) and the technique is "Remote Access Software" (T1219).

  Primary telemetry sources include Windows file event logs and macOS system logs, particularly focusing on specific executable and configuration files related to Chrome Remote Desktop. If malicious, this behavior could enable an attacker to interact with user systems remotely, posing a significant security risk. Importantly, this detection does NOT confirm malicious intent or usage; legitimate users may utilize Chrome Remote Desktop for authorized support tasks.

  ### Investigation Steps

  - **Check event timestamps:** Review the timestamp of file activities (e.g., Security Event ID 4663 or macOS file system logs) to identify if the file access correlates with unusual user behavior or other suspicious activities. A legitimate user may typically use Chrome Remote Desktop for IT support within business hours.

  - **Identify user contexts:** Assess the user accounts invoking these files. Legitimate activities would typically involve known IT personnel or support accounts. Look for unusual accounts (e.g., administrative accounts not normally in use) accessing `remoting_host.exe` or similar files.

  - **Review execution context:** Look for the process creation events (Windows Security Event ID 4688 or Sysmon Event ID 1) associated with these files. Verify if these processes are running under suspicious user accounts, as unusual parent processes may indicate malicious activity.

  - **Validate process legitimacy:** Confirm the file paths and hashes of the detected binaries against known good benchmarks. Any discrepancies, particularly with files located in unusual directories or altered timestamps, may indicate malicious alteration.

  - **Audit network connections:** Investigate any active network connections (using tools such as `netstat`) initiated by these processes. Consult firewall or proxy logs for external IP matches associated with the remote sessions. Legitimate remote desktop connections should target known IP addresses.

  ### Prioritization

  This alert carries medium severity due to its potential to expose remote access capabilities on sensitive systems, which may allow unauthorized users to manipulate or extract data. While Chrome Remote Desktop is commonly used for legitimate purposes, its usage in systems with sensitive data poses a significant risk that could be exploited by an adversary.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate usage of Chrome Remote Desktop can trigger false positives, necessitating thorough investigation to differentiate between benign and malicious use. Required log sources must be correctly configured; missing or misconfigured event logging can result in undetected activity. Additionally, legitimate remote administration tasks may invoke similar patterns, necessitating a good understanding of normal operational behavior. Related detections could include monitoring for unexpected network traffic to known Chrome Remote Desktop server IPs or unusual process invocation patterns that suggest malicious use of remote access.

