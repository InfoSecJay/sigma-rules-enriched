note: |
  ### Technical Context

  This Sigma rule detects registry modifications associated with the RMMmax remote monitoring and management tool, which may indicate malicious use or unauthorized persistence mechanisms. Adversaries may utilize RMMmax to maintain control over compromised systems, allowing for remote access and potential exploitation of systems and sensitive data. The relevant MITRE ATT&CK tactics are **Command and Control (TA0011)** and the technique **Modify Registry (T1219)**.

  The primary telemetry source is Windows registry event logs that capture changes to specified registry keys, indicating possible installation or configuration changes made by the RMMmax tool. If malicious, this behavior could lead to persistent unauthorized access, data exfiltration, or other nefarious actions. It is important to note that this detection does not confirm that the identified activity is malicious on its own; legitimate usage of the RMMmax tool can also trigger this rule.

  ### Investigation Steps

  - **Examine registry keys: ** Check for modifications to `HKLM\SOFTWARE\RMMmax\AgentService`, `HKLM\SYSTEM\CurrentControlSet\Services\RMMmaxAgentService`, or `HKCU\Software\Microsoft\Windows\CurrentVersion\Run\RMMmaxAgentService` using Security Event ID 4657. Compare modification timestamps against user activity to determine if changes align with legitimate use.

  - **Investigate Task Scheduler: ** Review Windows Task Scheduler for tasks related to `RMMmaxAgentService` creation or modification (Event ID 106). Legitimate tasks may be present; look for unusual execution in terms of frequency and account under which they run.

  - **Check process execution: ** Review process creation events (Sysmon Event ID 1 or Security Event ID 4688) for instances of `RMMmax` or associated executables being executed, especially if timestamps correlate with registry changes.

  - **Verify system integrity: ** Review the asset configuration to determine whether RMMmax is an approved tool for system management. Look for documentation or approvals in change management logs.

  - **Monitor network connections: ** Analyze network traffic logs for outbound connections to known malicious IPs associated with RMMmax or unusual data payload sizes indicative of malicious communication.

  - **Identify legitimate usage patterns: ** Understand and document typical RMMmax usage patterns in your environment. Legitimate usage typically involves scheduled maintenance tasks initiated during business hours, from specific admin accounts.

  ### Prioritization

  This alert has medium severity as it indicates potential compromise on systems critical to business operations, especially if related to administration or sensitive data. While RMMmax can be used legitimately, its common exploitation in post-compromise scenarios raises concerns about possible malicious activity.

  ### Blind Spots and Assumptions

  This detection may have limitations due to legitimate RMMmax use, which can result in false positives. Furthermore, if logging is not configured for registry changes or if certain execution rights are granted without monitoring, it may hinder effective detection. Common benign activities include the installation of RMMmax for authorized system management tasks. It is advisable to have companion detections in place for endpoint process monitoring and API call logging to enhance visibility on suspicious behavior tied to remote management tools.

