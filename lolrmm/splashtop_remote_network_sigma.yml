note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the Splashtop Remote RMM tool, which can indicate remote access activity. The likely attacker objective is to establish a foothold within the environment, potentially enabling remote control over compromised systems. This behavior is categorized under the MITRE ATT&CK tactic of **Execution** (T1203) and specifically the technique for **Exploitation of Remote Services** (T1219).

  The primary telemetry source is Windows network connection logs, capturing outbound requests to specific domains associated with Splashtop. If the remote tool is maliciously utilized, it allows unauthorized access and control over the affected systems. This detection does NOT confirm malicious intent on its own, as legitimate use of Splashtop is common.

  ### Investigation Steps

  - **Examine network connection logs:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to `*.splashtop.com`, `*.api.splashtop.com`, `*.relay.splashtop.com`, and `*.api.splashtop.eu`. Look for connections initiated from sensitive assets, which may indicate risky behavior.

  - **Identify previous remote access tools:** Check for installed software, specifically verifying registered applications that may fall under Remote Access tools (Event ID 4688). A legitimate application list should include the known software versions if provided by IT.

  - **Correlate time of detection with user activity:** Review user activity logs (Event ID 4648) in tandem with the connection timestamps to identify if the outgoing connections correlate with user logins or suspicious account activity.

  - **Evaluate if the tool is authorized:** Confirm whether the use of Splashtop is approved within your organization’s Remote Access Policy. Collect evidence of policy review or exemption for identified systems.

  - **Check for anomalous file transfers:** Monitor for associated file reads or writes (Sysmon Event ID 11) that may suggest file exfiltration or other unintended data sharing during the network activity.

  ### Prioritization

  This alert is rated as medium severity due to the potential impact of enabling unauthorized remote access to critical systems. The likelihood of malicious abuse is moderate, as Splashtop can be weaponized by adversaries. However, benign usage by authorized personnel is also common, which necessitates careful investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if logging for outbound connections isn’t properly configured, or if legitimate uses of Splashtop are frequent within the network. Authorized use of remote access tools should be well-documented to avoid false positives. Related detections, such as monitoring for unusual account logins or privilege escalation attempts, can enhance the context around this alert and provide better coverage of the threat landscape.

