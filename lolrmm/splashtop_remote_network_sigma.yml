note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains associated with the Splashtop Remote Management and Monitoring (RMM) tool, specifically targeting `*.api.splashtop.com` and `*.relay.splashtop.com`. Attackers may utilize legitimate remote access tools like Splashtop to establish control over compromised systems and execute commands. This activity primarily aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001).

  The primary telemetry sources required include Windows network connection logs that capture outbound connection attempts. If malicious, this behavior indicates unauthorized remote access and control, posing severe security risks to sensitive data and system integrity. However, this detection does not confirm the presence of malicious intent on its own, as the utilization of Splashtop is also legitimate within many organizational contexts.

  ### Investigation Steps

  - **Examine recent network connection logs:** Query Windows Event ID 5156 to evaluate outbound connection attempts to the domains listed in the Sigma rule. Look for connections made by unexpected processes, which could suggest unauthorized usage of Splashtop.

  - **Identify the initiating process:** Retrieve Sysmon Event ID 1 to identify the associated process with the outbound connection. Confirm whether known legitimate applications or users are involved (e.g., a recognized remote support team) compared to unknown or unauthorized applications.

  - **Check for previous alerts on the system:** Review the SIEM for alerts related to Splashtop or similar remote access activities in the past 30 days to identify any patterns or repeated behavior which may indicate a compromised host.

  - **Validate expected legitimate usage:** If Splashtop is used within the organization, confirm with IT departments about any scheduled support sessions or maintenance that aligns with the detected network activity. This could help rule out maliciousness.

  - **Look for lateral movement indications:** Monitor for any unusual internal lateral movement after the outbound connection to Splashtop domains, such as accesses to sensitive files or systems (e.g., check for Event ID 4624 for logon attempts on critical devices).

  - **Correlate with user access logs:** Reference Windows Security Event ID 4663 to trace file and registry access attempts before and after the connection was initiated. Any unauthorized access post-connection could further substantiate malicious intent.

  ### Prioritization

  This alert is classified as medium severity due to the potential risk of unauthorized remote access to sensitive systems. The likelihood of malicious abuse is moderate, as adversaries often leverage RMM tools like Splashtop for command and control. However, legitimate usage within the organization may dilute the threat level.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate Splashtop usage in the environment, making it challenging to differentiate between benign and malicious instances. A comprehensive set of logs from Windows should be ensured for reliable detection, including firewall logs and connection logs. Additionally, legitimate IT support activities may trigger this alert, necessitating careful contextual investigation. A related detection to consider is monitoring for unusual process behavior associated with established connections, as this can supplement visibility into potentially malicious activity.

