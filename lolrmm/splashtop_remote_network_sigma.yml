note: |
  ### Technical Context
  This rule is designed to detect potential network activity associated with the Splashtop Remote Management and Monitoring (RMM) tool. Splashtop is commonly used for remote access support and may be exploited by threat actors for unauthorized access or control over systems. The detection focuses specifically on network connections made to domains associated with Splashtop services, which may indicate either legitimate or malicious usage of the tool.

  The likely attacker objectives include establishing persistent remote access to systems within the enterprise network, exfiltrating sensitive data, or deploying additional malware. Given the legitimate use of Splashtop for remote management, monitoring its usage is crucial to differentiate between authorized access and potential covert activities by adversaries impersonating legitimate users.

  Relevant MITRE ATT&CK tactics/techniques include:
  - Execution (T1203): The attacker may use Splashtop for initial execution of malicious payloads.
  - Exploitation of Remote Services (T1219): This technique is particularly relevant, as it encompasses using remote management tools to exploit services for unauthorized access.

  Primary data sources for this detection include Windows network connection logs, which can provide insights into destination hostnames and the nature of outbound traffic.

  ### Investigation Steps
  - **Review Network Connections:** Examine network connection logs for any outbound traffic directed to splashtop.com or its variants. Identify any unexpected patterns or connection attempts from unusual hosts.

  - **Correlate with User Activity:** Check user activity and authentication logs to determine if the connections to Splashtop domains correlate with known legitimate users. Look for discrepancies or anomalous logins.

  - **Inspect Process Creation Events:** Analyze process creation events on endpoints that made connections to the suspicious domains. Look for processes that should not have been initiated, especially those that appear to invoke remote access capabilities.

  - **Verify Endpoint Configuration:** Ensure that endpoint monitoring tools are appropriately configured to detect and alert on unauthorized installations of remote access tools. Review system software for any non-whitelisted applications that may exploit remote access features.

  ### Prioritization
  This alert is considered medium severity due to the potential risk posed by unauthorized remote access. While the use of Splashtop can often be legitimate, understanding its context in the network is critical, as threats leveraging legitimate tools can have significant impacts on enterprise security.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage based on the configuration of firewalls or proxies that could block outgoing requests to Splashtop domains, leading to missed alerts. The detection logic assumes that outbound connections to Splashtop domains are not part of any ticketed support processes within the organization. Required logs include comprehensive Windows event logs and firewall logs to ensure that connection attempts are fully captured and analyzed for legitimacy.

