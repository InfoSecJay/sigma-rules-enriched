note: |
  ### Technical Context

  This Sigma rule detects network connections initiated towards domains associated with the Splashtop Remote Management Tool, such as 'splashtop.com' and related subdomains. Attackers may utilize tools like Splashtop to maintain persistent remote access to compromised systems, often to facilitate data exfiltration or further lateral movement within the network. This activity is relevant to the MITRE ATT&CK technique T1219: Remote Access Software, which encompasses the use of legitimate remote access applications for malicious purposes.

  The primary telemetry source is network connection logs from Windows systems, specifically looking for outgoing connections to specified Splashtop domains. If the activity is malicious, it may suggest an attacker has achieved initial access and is now utilizing remote access tools for control. However, it is important to note that this detection alone does NOT confirm malicious intent, as there may be legitimate uses for the Splashtop tool within the environment.

  ### Investigation Steps

  - **Check for external connections:**
    Review network connection logs (Event ID 5156 or Windows Filtering Platform logs) for outbound connections to 'splashtop.com' or associated domains. Identify connection timestamps and source IP addresses.

  - **Correlate with user activity:**
    Validate the legitimacy of the connections by cross-referencing connection times with user login events (Event ID 4624). Look for any suspicious patterns where users execute connections outside normal working hours.

  - **Look for Splashtop client installation:**
    Examine installed applications for the presence of the Splashtop Remote Management software (product name may vary). Use PowerShell commands like `Get-WmiObject -Class Win32_Product` for a comprehensive inventory.

  - **Identify privileged users:**
    Analyze the user accounts initiating the connections. Check for accounts with elevated privileges that are not typically associated with remote management. This may indicate a riskier scenario.

  - **Review for anomalous behavior:**
    Search for indications of file creation or modification that coincides with the network activity (Sysmon Event ID 10 or 11). For example, a sudden appearance of debugging or logging files that may suggest exploitation attempts.

  ### Prioritization

  The alert severity is medium due to potential impact on sensitive systems if compromised and the realistic likelihood of malicious use of remote access tools. While Splashtop is widely accepted for legitimate purposes, its functionalities are frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by false positives from legitimate Splashtop usage, which should be confirmed with prior knowledge of authorized tool deployments. It is crucial to ensure that network logs are set to capture all outbound connections for complete visibility. Additionally, legitimate network management activities can trigger this alert, such as an IT support team using Splashtop to assist a user. A related detection could involve monitoring for unusual internal IP addresses making outbound connections to these domains, enhancing context around potential misuse.

