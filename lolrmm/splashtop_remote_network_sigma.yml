detection:
  selection:
    DestinationHostname|endswith:
    - 'splashtop.com'
    - '*.api.splashtop.com'
    - '*.relay.splashtop.com'
    - '*.api.splashtop.eu'
  condition: selection
falsepositives:
- Legitimate use of Splashtop Remote
level: medium
note: |
  ### Technical Context

  This Sigma rule detects outgoing network connections to known Splashtop domains, indicating potential use of the Splashtop Remote Management Tool. This tool may be leveraged by both system administrators for remote access and malicious actors seeking to maintain control over compromised systems. The relevant MITRE ATT&CK technique is Remote Access Software (T1219), which reflects the adversary objective of creating a remote foothold within the environment.

  Primary telemetry sources include Windows network connection logs, specifically targeting network events associated with traffic directed at the specified Splashtop domains. If used maliciously, this could enable unauthorized remote access to systems, creating severe security risks. However, this detection does NOT confirm malicious activity on its own, as legitimate administrative actions may also generate similar traffic to these domains.

  ### Investigation Steps

  - **Verify Connection Events:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to the identified Splashtop domains. Look for patterns indicating unusual application connections, especially on sensitive assets.

  - **Check Process Origin:** Use Sysmon Event ID 3 (Network Connection) to correlate any connections to their originating process. Identify any user-level processes making these connections, noting that unexpected connections from non-administrative applications are a high-confidence malicious indicator.

  - **Assess Frequency and Timing:** Analyze connection frequency over time. Legitimate Splashtop usage may be consistent, while spikes or irregular patterns could indicate unauthorized use or infection.

  - **Review User Activity Logs:** Check logs for user activity around the time of detected connections. The legitimate use of Splashtop typically correlates with known administrative and management tasks; discrepancies here may suggest misuse.

  - **Conduct Asset Risk Assessment:** Prioritize investigation on critical assets such as domain controllers or sensitive databases. If Splashtop activity is noted on these systems, escalation for further forensic analysis may be warranted.

  - **Validate with Threat Intelligence:** Cross-reference with threat intelligence sources to confirm if the detected activity matches known indicators of compromise for specific threat actors utilizing Splashtop for remote access.

  ### Prioritization

  The alert has medium severity due to potential unauthorized remote access activity. While it does suggest possible compromise, not every instance correlates to malicious use, making it essential to analyze the context carefully. This behavior is commonly weaponized by adversaries for persistence and control, emphasizing the need for timely investigation.

  ### Blind Spots and Assumptions

  Detection has limitations, as attackers may utilize VPNs or proxies to mask their remote access activity, bypassing the rule. Ensure logging of all outbound network connections (e.g., via Windows Filtering Platform logs) is correctly configured; otherwise, detections may be incomplete. Legitimate use cases, such as IT departments performing remote support, can also trigger alerts, necessitating careful contextual analysis. Companion detections for unauthorized remote access like RDP or VNC use on the network could enhance overall detection efficacy.

