  ---

  ### Technical Context

  This rule detects network activity indicative of the Pocket Controller RMM tool attempting to communicate with its server endpoint at soti.net/products/soti-pocket-controller. The likely attacker objective is to exploit the remote management capabilities of the tool to access or control target systems covertly. This behavior aligns with the MITRE ATT&CK tactic of "Execution" and specifically the technique of "Remote Services" (T1219).

  The primary telemetry source involves network connection logs from Windows systems, specifically looking for outbound traffic to the specified hostname. If malicious, this could allow attackers unauthorized remote access to enterprise resources. However, this detection alone does NOT confirm malicious intent, as the Pocket Controller might be used legitimately for remote management tasks.

  ---

  ### Investigation Steps

  - **Check outbound network connections:** Review network logs for connections to DestinationHostname matching "soti.net/products/soti-pocket-controller". Validate if there’s unexpected outbound traffic, particularly from administrator or sensitive roles.

  - **Identify expected legitimate activity:** Confirm if there are scheduled or known instances of Pocket Controller usage within the organization. This can include looking for documentation on authorized use or recent deployment of such tools.

  - **Assess user context:** Cross-reference the account making the connection. Identify whether the account is a service account, administrative, or if it is linked to user roles that typically require such management capabilities.

  - **Review Windows Security logs:** Look for Security Event ID 4648 (a logon attempt using explicit credentials) or Event ID 4672 (special privileges assigned) occurring close to the time of the detected network activity, indicating potential credential manipulation or misuse.

  - **Monitor file creation or changes:** Inspect for new files or changes under the directory where Pocket Controller would typically be installed (e.g., C:\Program Files\SOTI\Pocket Controller). Look for unexpected installation or update attempts, which could indicate unauthorized usage.

  - **Scan for related processes:** Use Sysmon Event ID 1 to identify any new or unusual processes that could be aligned with the Pocket Controller within the time frame of the network activity, particularly focusing on any that spawn from known legitimate tools.

  ---

  ### Prioritization

  This alert holds medium severity as it reflects a potential security risk depending on the affected system's role and data sensitivity. The likelihood of malicious abuse is moderate, given that remote management tools like Pocket Controller can be leveraged for nefarious activities if misused. While it's not commonly weaponized, any unauthorized access should be treated seriously.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through encrypted traffic or alternate tools that perform similar functions. Proper logging from firewalls and endpoint devices is essential for reliable detection of all relevant network connections. Legitimate activities may include authorized use of Pocket Controller by IT support teams, which could trigger this alert. A related detection could be monitoring for unusual authentication attempts or access patterns around the same timeframe as the Pocket Controller activity to strengthen incident assessment.

