note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the Pocket Controller RMM (Remote Monitoring and Management) tool by monitoring outbound connections to specific Soti-hosted services. The primary threat scenario involves unauthorized usage of this RMM tool, which can facilitate remote access and control over endpoints, thus allowing attackers to manage devices covertly. Attackers may leverage RMM software to perform system reconnaissance, deploy malware, and execute commands, posing a significant risk to the security of the enterprise environment.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002) since the tool may be executed on the target system, and technique **T1219 - Remote Access Software** which describes how attackers may use such tools to maintain persistent access to a compromised environment.

  The primary data sources to monitor for this detection are network connection logs on Windows devices that can capture details about outbound connections, including destination hostnames, timestamps, and source IP addresses. Monitoring these logs provides insights into unauthorized or suspicious RMM tool usage within the organization.

  ### Investigation Steps
  - **Review outbound network connections**: Analyze Windows network connection logs for entries connecting to `soti.net/products/soti-pocket-controller`. Look for unusual patterns or connections from unexpected endpoints that may indicate unauthorized use.

  - **Check endpoint activity**: Correlate the identified connections with endpoint logs on potential devices to discover any related processes or commands executed. Investigate user actions leading to the initiation of the RMM tool.

  - **Assess user accounts**: Identify the user accounts associated with the outbound connections and evaluate their permissions. Look for anomalies, such as non-admin users accessing RMM tools or the execution of commands that deviate from typical user behavior.

  - **Monitor for accompanying signs**: Beyond just network logs, review related security telemetry like EDR alerts, file integrity monitoring data, and process creation events to uncover any malicious activity or unauthorized remote accesses stemming from the use of this tool.

  ### Prioritization
  The severity of this alert is medium due to the potential for significant impact if the Pocket Controller RMM tool is misused. The likelihood of this occurring increases with attackers targeting enterprise environments to exploit administrative tools for unauthorized access.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the environment has legitimate uses for the Pocket Controller RMM tool, leading to possible false positives. The detection logic assumes that all outbound connections to the specified domain are unauthorized, which may not always be true in cases of legitimate use. For effective alerting, relevant logs must be configured to capture and retain detailed network connection records so that any usage of the tool can be investigated adequately.

