note: |
  ### Technical Context

  This Sigma rule detects the execution of potential Royal Apps RMM tools, specifically `royalserver.exe` and `royalts.exe`, which are often utilized in remote management and potential lateral movement within networks. The likely attacker objective is to gain control over target systems for further exploitation or data exfiltration. This behavior corresponds to the MITRE ATT&CK technique T1219 (Remote Access Software).

  Primary telemetry sources include process creation logs from Windows (Security Event ID 4688) and Sysmon (Event ID 1). If these processes are executed without proper justification, they pose a risk to the environment, allowing unauthorized remote management. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use cases for this software exist.

  ### Investigation Steps

  - **Check process creation events:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 for instances of `royalserver.exe` and `royalts.exe`. Focus on the creation time, parent process, and user initiating the process.

  - **Verify parent processes:** Investigate the parent process associated with detected instances. If the parent is a known management tool or system service, this may indicate benign activity. Look for instances where the parent process is suspicious or atypical.

  - **Identify unusual user accounts:** Cross-reference the user executing the processes with a list of authorized personnel who should be using RMM tools. Malicious use is more likely if initiated by non-administrative users or unexpected accounts.

  - **Examine execution paths:** Analyze the execution paths for `royalserver.exe` and `royalts.exe` to ensure they're running from expected directories. Legitimate instances should originate from a known program file directory; deviations may signal compromise.

  - **Quantify frequency of execution:** Monitor how often these processes were created within a specific timeframe. Frequent executions, especially outside of business hours, typically suggest malicious activity.

  - **Review related artifacts:** If suspicious activity is confirmed, check for potential file creation or data exfiltration artifacts related to tool usage, such as network connections initiated by these processes or any changes in file permissions.

  ### Prioritization

  This alert is of medium severity due to the potential impact of RMM tool abuse on asset security, particularly in sensitive systems. Although the likelihood of malicious abuse exists, legitimate administrative usage can also trigger this alert. However, the use of such tools is a known vector for attackers, necessitating close scrutiny.

  ### Blind Spots and Assumptions

  Detection may be limited by instances where the software is used legitimately, potentially producing false positives. Additionally, if logging is misconfigured or if the logs for process creation are not enabled, the detection will fail. Legitimate administrative tools might invoke similar processes, leading to unintended alerts. A related detection to consider is abnormal network traffic patterns generated by these tools, which could further clarify intent.

