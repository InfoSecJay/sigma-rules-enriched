note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Royal Apps Remote Monitoring and Management (RMM) tool, specifically `royalserver.exe` and `royalts.exe`. The likely attacker objective behind using this tool is to maintain remote access to a compromised environment or to perform unauthorized system management, catering to malicious activities such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique for Remote Access Software (T1219) under the execution tactic.

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Security Event ID 4688 or Sysmon Event ID 1 to capture process creation events. If the process execution is malicious, it may indicate an escalated security risk, including unauthorized access to sensitive data or system control. This detection does NOT confirm that the activity is malicious on its own, as legitimate usage of the Royal Apps tool could trigger the same alerts.

  ### Investigation Steps

  - **Verify process creation events:** Review Windows Security Event ID 4688 or Sysmon Event ID 1 to find instances of `royalserver.exe` or `royalts.exe` executing. Look for user context and parent process IDs to understand the origin of the execution.

  - **Analyze parent processes:** Investigate the parent process of any detected `royalserver.exe` or `royalts.exe` executions. Confirm whether the parent process is legitimate (expected software) or shows signs of compromise (e.g., unusual parent process).

  - **Correlate user account activity:** Check the activity of the user account that triggered the event. Use logs from Authentication (Security Event ID 4624) to ensure the user account has not been compromised, and assess recent logon history for anomalies.

  - **Identify legitimate usage:** Confirm if the use of Royal Apps RMM Tool aligns with business operations. Interview the IT department or relevant personnel to validate whether the tool is sanctioned for use in the environment.

  - **Evaluate indications of compromise:** Look for additional indicators or artifacts that may confirm malicious activity, such as suspicious outbound network connections or attempts to access sensitive resources after the tool’s execution.

  ### Prioritization

  Alerts based on this detection should be treated with medium priority. The potential impact is significant if critical systems are involved, as RMM tools can facilitate large-scale exploitation. The likelihood of malicious abuse is high due to the inherent nature of RMM tools being favored by adversaries for remote access, making this behavior a common attack vector.

  ### Blind Spots and Assumptions

  This detection may be limited by false positives resulting from legitimate usage of Royal Apps within the network. It assumes that relevant logs are appropriately configured and retained for analysis, including process creation and security event logging at adequate levels. Other legitimate activities, such as IT support or routine maintenance processes, may inadvertently trigger the alert. Companion detections, such as monitoring for unusual network traffic to and from the systems where these processes are executed, can strengthen overall security posture.

