  ### Technical Context

  This detection rule identifies the execution of processes associated with the Royal Apps Remote Monitoring and Management (RMM) tool, specifically `royalserver.exe` and `royalts.exe`. The probable objective of an attacker utilizing this tool would be to establish remote access to a compromised system for management and control purposes. This aligns with the MITRE ATT&CK framework's Execution tactic, particularly technique T1219 (Remote Access Software).

  The primary telemetry sources for this detection are Windows process creation logs, notably Security Event ID 4688 or Sysmon Event ID 1, which contain information about process execution and the parent-child relationship of processes. If malicious, the use of this RMM tool could enable attackers to conduct reconnaissance, lateral movement, or data exfiltration. However, it is crucial to note that this detection does not confirm malicious intent on its own, as legitimate administrative use of the Royal Apps tool can trigger the alert.

  ---

  ### Investigation Steps

  - **Verify the context of the parent process:** Review Security Event ID 4688 or Sysmon Event ID 1 logs for the suspicious process creation events. Pay special attention to the `ParentImage` field; a legitimate parent process could indicate authorized administrator activity, while unexpected contexts suggest potential malicious use.

  - **Check for unusual execution paths:** Investigate the `Image` field in the relevant logs for paths that do not align with standard operational procedures. If `royalserver.exe` or `royalts.exe` are running from non-standard directories (e.g., user profile directories rather than expected program files), flag these as high-confidence indicators of compromise.

  - **Correlate with user account activity:** Review the associated `SubjectUserName` field in event logs to identify the user account responsible for executing the RMM tool. Confirm whether the account is an administrator or if it has unusual access rights; a regular user attempting to launch these processes may warrant further investigation.

  - **Analyze network activity linked to the process:** Examine outbound connections made by the identified RMM processes using Windows Firewall or network monitoring logs. High volumes of connections to unknown external IP addresses or unusual ports may indicate exfiltration or command-and-control traffic.

  - **Identify legitimate usage patterns:** If logs indicate the presence of `royalserver.exe` or `royalts.exe`, assess whether the execution aligns with scheduled administrative tasks or known maintenance windows. Confirming regular admin conduct mitigates suspicion.

  ---

  ### Prioritization

  The alert has medium severity due to potential impact on system integrity if the RMM tools are exploited maliciously. The risks of abuse are notable given the capabilities of RMM tools for lateral movement and data manipulation, which are often weaponized by threat actors.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming executables or using alternative remote access tools that are not captured here. Reliable detection requires proper configuration of audit logs for process creation (i.e., enabling Sysmon or Windows Security logs). Legitimate administrative activity could trigger this alert during scheduled maintenance. A related detection to consider is anomalous MMI (Managed Malware Insight) behavior, which can complement the tracking of RMM tool usage.

