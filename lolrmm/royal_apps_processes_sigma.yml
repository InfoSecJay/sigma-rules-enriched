note: |
  ### Technical Context
  This detection rule alerts on activity associated with the Royal Apps Remote Monitoring and Management (RMM) tool, which may be used for both legitimate administrative tasks and malicious purposes. The rule specifically identifies process creation instances of "royalserver.exe" and "royalts.exe" that stem from parent processes, which could indicate potential unauthorized access or exploitation activity. The primary threat scenario revolves around an attacker gaining administrative access through the RMM tool to exfiltrate sensitive data or maintain persistence on compromised systems.

  The relevant MITRE ATT&CK tactics include **Execution** (T1203) and **Remote Services** (T1219), where attackers may leverage remote management tools to execute malicious commands or scripts from afar. Important data sources for this detection rule encompass Windows process creation logs, which provide insights into both the origin and context of process executions, assisting analysts in discerning whether the activity is legitimate or indicative of compromise.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation events to identify instances where "royalserver.exe" or "royalts.exe" have been executed. Look for unusual timestamps or patterns in the execution context that deviate from normal administrative behavior.

  - **Inspect Parent Process Activity:** Investigate the parent processes that instantiated the Royal Apps tools. Determine if they originate from known legitimate management software or if there are indications of suspicious activity or unrecognized processes.

  - **Assess User Accounts Involved:** Verify the user accounts triggering the process creation. Look for accounts that do not typically perform administrative actions or have not been involved in related remote management tasks.

  - **Correlate with Network Activity:** Review network traffic logs for any connections made by the identified processes. Check for communications to IP addresses or domains that are unusual or not part of the organization's known infrastructure.

  ### Prioritization
  The alert is categorized as medium severity due to the potential misuse of remote management tools by an attacker, which may facilitate lateral movement and data exfiltration. Timely investigation is crucial to mitigate risks associated with unauthorized access.

  ### Blind Spots and Assumptions
  The detection logic may miss instances where the processes are executed in a legitimate context by trusted administrators, thus leading to possible false positives. Additionally, there may be reliance on the presence of traditional Windows process creation logs, which could be absent in highly secured environments or if logging settings are misconfigured. Assumptions include the absence of legitimate use cases for the Royal Apps tools within the organization, necessitating awareness of all administrative activity associated with these processes.

