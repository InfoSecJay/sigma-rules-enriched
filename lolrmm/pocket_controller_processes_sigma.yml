note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Pocket Controller RMM tool, which is commonly used for remote management. The likely attacker objective would be to exploit this tool for unauthorized remote access or control over a system. This behavior fits within the "Execution" phase of the MITRE ATT&CK framework, specifically targeting technique T1219 (Remote Access Tools). The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688. If an adversary successfully utilizes this tool, it could allow them to access sensitive information, disrupt services, or perform other malicious activities. However, detection of this rule alone does not confirm malicious activity without additional context regarding the system's environment or legitimate use of the tool.

  ### Investigation Steps

  - **Check process creation logs**: Review Security Event ID 4688 to identify when Pocket Controller processes were created (e.g., `pocketcontroller.exe`, `pocketcloudservice.exe`, `wysebrowser.exe`). Look for other unusual processes spawned from these parent processes, as they could indicate malicious use.

  - **Identify user context**: Verify the user account associated with the event timestamp. Legitimate use of Pocket Controller typically occurs under administrative accounts during workstation support; anomalies here could indicate potential compromise.

  - **Review network activity**: Check for any outgoing connections made by these processes (using Windows Defender Firewall logs or netstat). Investigate unusual network activity or connections to IPs that are not part of the enterprise's business operations as these may represent malicious behavior.

  - **Analyze process parentage**: Inspect the parent process of detected instances to establish a chain of execution. Malicious actors often leverage legitimate tools in an attempt to blend in; look for evidence of direct exploitation, such as unusual execution paths or command-line arguments.

  - **Look for anomalous file changes**: Examine file modification logs in the system or application directories where these tools are installed. Unexpected modifications or creations may indicate an attempted exploitation or installation of backdoors associated with this tool.

  ### Prioritization

  This alert is of medium severity as it highlights potential misuse of a legitimate remote management tool. The risk escalates if the affected system holds sensitive data or critical services, making it a valid target for exploitation. Although the tool can facilitate administrative tasks, it’s essential to monitor for unauthorized use, which is a common tactic among attackers.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of the Pocket Controller, potentially leading to false positives when it is used in approved scenarios. Ensure all endpoints are monitored for process creations to maintain visibility. Additionally, activity from legitimate administrative actions or internal support processes may trigger this alert, necessitating further context for accurate evaluation. Companion detections, such as monitoring for unexpected RMM tool configuration changes or unauthorized user access, can enhance detection accuracy.

