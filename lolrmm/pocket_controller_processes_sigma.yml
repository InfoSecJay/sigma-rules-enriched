note: |
  ### Technical Context

  This rule detects potential malicious activity associated with the Pocket Controller RMM tool, which can be used by attackers to establish remote access on compromised systems. The likely attacker objective is to gain unauthorized control over a system, allowing them to execute commands, siphon data, or move laterally within the network. This behavior aligns with the MITRE ATT&CK tactic of **Command and Control** (TA0011) under the technique **Remote Management Software** (T1219).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Event ID 4688 and Sysmon Event ID 1, capturing detailed information about process launches. If malicious, this activity could lead to significant security impacts, such as unauthorized data access and persistent threats in the environment. However, this detection does *not* confirm malicious intent on its own, as the Pocket Controller might be used legitimately in some organizational contexts.

  ### Investigation Steps

  - **Identify related process activity:** Examine processes spawned by `pocketcontroller.exe` or `pocketcloudservice.exe` using Security Event ID 4688 and look for potentially unauthorized child processes. A legitimate session might show known infrastructure being accessed (e.g., connecting to designated servers).

  - **Check parent process lineage:** Review the parent process for the detected instances. Look for an instance of a legitimate management tool or a shell process that typically initiates administrative tasks, as this can indicate benign usage. Legitimate instances should originate from known IT management systems.

  - **Correlate network traffic:** Analyze network logs for outbound connections related to the detected processes. Look for unusual or unapproved external destinations that don’t correlate with known remote management infrastructure (e.g., unexpected IP addresses).

  - **Assess user context:** Validate the user account associated with the `pocketcontroller.exe` process. Cross-reference with your identity and access management (IAM) logs to ensure only authorized personnel are executing the tool. Malicious activity will often be executed by previously compromised accounts or anomalous users.

  - **Review application control logs:** If application whitelisting or EDR solutions are in place, check for any alerts or blocks related to Pocket Controller activity. Any unauthorized executions could be a strong indicator of a compromise.

  ### Prioritization

  The alert should be treated with medium severity due to the potential for the affected systems to serve critical roles in the organization. There is a moderate likelihood of malicious abuse, particularly in environments lacking adequate security visibility, as tools like Pocket Controller are commonly weaponized for remote access.

  ### Blind Spots and Assumptions

  This detection may be circumvented by attackers employing evasive techniques, such as renaming the executable or utilizing clean-process manipulation tools. Reliable detection requires proper logging configurations for process creation events, including ensuring Sysmon is enabled where applicable. Additionally, legitimate IT support activities may trigger this alert, necessitating contextual awareness of routine remote management practices. Consider companion detections for other remote access tools or abnormal outbound connections to enhance overall visibility into potential compromises.

