note: |
  ### Technical Context
  This detection rule identifies the potential execution of processes associated with Pocket Controller RMM (Remote Monitoring and Management) tools, such as `pocketcontroller.exe`, `pocketcloudservice.exe`, and `wysebrowser.exe`. These processes are commonly used for legitimate remote management of devices within enterprise networks. However, threat actors may exploit these tools to gain unauthorized access, maintain persistence, and execute malicious commands from a distance, aligning their activities with a range of attack scenarios, including lateral movement and data exfiltration.

  The relevant MITRE ATT&CK tactics include **Execution (T1203)**, where adversaries may execute code to control systems remotely, and **Remote Services (T1219)**, which encompasses various methods that attackers may leverage for remote management. By employing legitimate RMM tools, attackers can masquerade their activities, thereby complicating detection efforts. The best evidential sources for this alert include Windows process creation logs, which record the execution of these processes alongside their parent-child relationships to detect unusual execution flows.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine Windows process creation logs for instances of `pocketcontroller.exe`, `pocketcloudservice.exe`, and `wysebrowser.exe` to identify potential unauthorized execution.
  - **Analyze Parent Process Relationships:** Investigate the parent processes associated with the detected instances to ascertain their source and context of execution, as anomalous parent-child relationships can indicate malicious activity.
  - **Cross-Reference with Organizational Policies:** Check against your organization's asset inventory to verify whether these RMM tools are sanctioned for use on the affected systems, ensuring that any detected instances align with legitimate operational requirements.
  - **Investigate Network Connections:** Inspect network activity for related outbound connections established by these processes, especially if targeting unusual or external IP addresses that may indicate data exfiltration or command-and-control communication.

  ### Prioritization
  This alert carries medium severity due to the dual-use nature of RMM tools, which, while legitimate in most contexts, can be leveraged by attackers for malicious purposes. Its likelihood of occurrence in an enterprise environment necessitates careful scrutiny, particularly in high-value asset networks.

  ### Blind Spots and Assumptions
  This detection rule may have gaps regarding legitimate uses of Pocket Controller, potentially leading to false positive alerts when sanctioned by IT teams. The detection logic assumes that malicious actors will not change the filenames or execution paths of the associated processes to evade detection. For this rule to function effectively, process creation logs must be enabled and appropriately configured to capture all relevant events on Windows endpoints.

