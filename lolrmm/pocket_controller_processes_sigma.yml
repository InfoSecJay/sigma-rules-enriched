  ### Technical Context

  This Sigma rule detects the execution of potentially unauthorized processes associated with the Pocket Controller RMM tool. These processes may be indicative of an attacker using an RMM (Remote Monitoring and Management) tool to gain control over a system, which aligns with the attack objective of remote access for lateral movement or data exfiltration. The relevant MITRE ATT&CK tactics and techniques for this detection include "Execution" (TA0002) and "Remote Management Tools" (T1219).

  The primary telemetry source is Windows process creation logs, specifically looking at process execution events. If malicious, the impact could be significant, leading to unauthorized access to systems and sensitive data. Importantly, this detection does NOT confirm malicious activity on its own, as these processes could be part of legitimate administrative functions.

  ---

  ### Investigation Steps

  - **Verify process execution details:** Review Process Creation logs (Windows Security Event ID 4688 or Sysmon Event ID 1) for the specific Image names: `pocketcontroller.exe`, `pocketcloudservice.exe`, or `wysebrowser.exe`. Look for an execution path and the user context under which the process ran.

  - **Assess parent process relationships:** Analyze PID and Parent PID values to confirm whether processes were legitimately spawned (Event ID 4688). Legitimate entries typically show allowed administrative tools executed by system or admin users, whereas unauthorized execution may link to non-standard user accounts.

  - **Identify network connections:** Check for any associated network activity using Firewall logs or Process Monitor evidences to see if these processes attempt outbound connections (e.g., to known RMM services). Malicious indicators may include IP addresses outside the corporate range or known malicious command-and-control servers.

  - **Correlate with user behavior:** Look into the event logs (Event ID 4624: Logon events) to check user login patterns before and after the execution of these processes. Suspicious login times or geographic locations might indicate malicious intent.

  - **Review historical context:** Examine prior logs for the use of the Pocket Controller. If this tool isn't typically authorized or frequently used in your environment, it could indicate potential compromise.

  - **Validate legitimate use cases:** Compare recent alerts against the asset inventory to judge if the Pocket Controller was part of documented support activities. If usage aligns with authorized IT management functions, this may indicate benign activity.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical systems if the tool is misused. The likelihood of someone weaponizing RMM tools for unauthorized access is moderate, given their legitimate administrative applications.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where malicious actors rename processes or obscure logged details. Reliable detection requires comprehensive logging configurations, including process creation and network connection logs. Legitimate administrative tasks, especially in managed IT environments, may trigger this alert. A companion detection would be alerting on unusual user logons or the usage of other administrative tools, which helps provide context for evaluating the alert.

