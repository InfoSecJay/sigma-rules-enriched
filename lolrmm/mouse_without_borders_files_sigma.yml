note: |
  ### Technical Context

  This Sigma rule detects file activity related to the "Mouse Without Borders," which is a remote management tool designed to control multiple Windows PCs using a single mouse and keyboard. It may be leveraged by attackers for remote access to compromised systems, leading to data exfiltration or persistence. The relevant MITRE ATT&CK tactic is **Command and Control (TA0011)**, specifically using the technique **Remote Management Software (T1219)**.

  Primary telemetry sources include Windows file event logs triggered by activity related to executables of Mouse Without Borders. If these files are executed unexpectedly, it could indicate malicious behavior, such as an unauthorized remote connection. However, the detection does NOT confirm malicious activity on its own, as legitimate users may also use this tool.

  ### Investigation Steps

  - **Review file activity logs**: Check Windows event logs (Event ID 4663) for access to the following files: 'MouseWithoutBorders.exe', 'MouseWithoutBordersSvc.exe', or 'MouseWithoutBordersHelper.exe'. Look for unusual access times or unexpected user accounts accessing these files.

  - **Confirm legitimate use**: Validate if the user has documented need or prior approval to use Mouse Without Borders. Look for usage in systems designated for remote support or collaborative tasks; if found, this may indicate benign activity.

  - **Analyze process creation events**: Investigate Security Event ID 4688 for creation of processes associated with Mouse Without Borders executables. High-confidence malicious indicators include execution from non-standard directories or execution by suspicious user accounts.

  - **Inspect network connections**: Analyze network logs to identify any outbound connections from the affected host to unfamiliar IP addresses or domains post-execution of the Mouse Without Borders executables. This might indicate data exfiltration or command and control communications.

  - **Check for additional persistence mechanisms**: Look in startup entries (e.g., Registry, Task Scheduler) to see if Mouse Without Borders is set to run at system startup without user knowledge. This may indicate persistence established by a malicious actor.

  ### Prioritization

  This alert holds medium severity as it targets the potential misuse of a remote management tool that can facilitate unauthorized access to sensitive systems. The likelihood of maliciousness increases if the activity occurs on critical assets or systems without documented user activity for such tools. Given the prevalence of remote management software exploitation, analysts should prioritize this investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if file activity logs are not accurately captured or if log retention is insufficient. Legitimate activities can include IT support tasks, particularly in a remote work environment. It is essential to have comprehensive visibility on the use of remote management tools to avoid false positives. Related detections may include alerts on unusual remote desktop protocol (RDP) access or unauthorized connections through common RMM tools.

