note: |
  ### Technical Context
  This detection rule identifies file activity associated with the "Mouse Without Borders" remote control management (RMM) tool, which allows users to control multiple computers with a single mouse and keyboard. While this tool can be used for legitimate purposes, its presence could indicate potential misuse in an enterprise environment as attackers may leverage it to manage remote systems covertly or facilitate lateral movement within the network.

  The suspected threat scenario involves an attacker utilizing Mouse Without Borders to increase their operational efficiency during unauthorized access or surveillance of organizational assets. The attacker might aim to move laterally across systems to access sensitive data or maintain persistence within the network.

  Relevant MITRE ATT&CK techniques associated with this rule include:
  - **Execution (T1203)**: Malicious actors may utilize unauthorized tools to execute harmful scripts and commands on remote systems.

  Primary data sources for evidence will include:
  - File event logs from Windows systems, which can provide details of executed binaries and their paths.

  ### Investigation Steps
  - **Review File Activity Logs**: Analyze file event logs for the specific executables associated with Mouse Without Borders to confirm any unexpected activity or context.
  - **Investigate System Processes**: Check running processes on affected endpoints to see if there are any instances of MouseWithoutBorders.exe that correspond with unusual behavior or times of access.
  - **Assess Network Traffic**: Monitor outbound traffic from involved systems to identify any unauthorized data exfiltration or unusual network connections indicative of misuse.
  - **Evaluate User Behaviors**: Conduct a review of user account activities to establish whether any accounts show signs of anomalous remote access or control behavior related to Mouse Without Borders.

  ### Prioritization
  This alert's medium severity reflects the potential impact of unauthorized remote access tools within an enterprise, where attackers may exploit such tools for malicious purposes. The likelihood of misuse increases if the tool is not approved for use within the organization, meriting prompt investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for environments where Mouse Without Borders is used legitimately, potentially leading to false positives. The detection logic assumes that any execution of the specified executables is suspicious unless deemed legitimate by the organization. Required logs include file event logs from Windows systems, which must be enabled to capture execution events for this alert to function effectively.

