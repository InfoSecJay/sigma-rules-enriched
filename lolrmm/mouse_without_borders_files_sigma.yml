note: |
  ### Technical Context

  This rule detects the execution of files associated with the "Mouse Without Borders" remote management tool, specifically its main executable and related services. An attacker may utilize this tool to control multiple machines remotely, potentially as part of lateral movement or remote access objectives. The detection aligns with the MITRE ATT&CK technique for Remote Service Password Guessing (T1219). Primary telemetry sources include Windows file execution logs, with specific focus on file execution events within a typical Windows environment.

  If the behavior is malicious, it could facilitate unauthorized access or control over systems, enabling attackers to manipulate data or maintain persistence. However, this detection does not confirm malicious activity on its own, as legitimate users may also employ the tool for valid administrative purposes.

  ### Investigation Steps

  - **Verify process execution details**: Check Security Event ID 4688 for `MouseWithoutBorders.exe`, `MouseWithoutBordersSvc.exe`, or `MouseWithoutBordersHelper.exe`. Note the user context and time of execution; legitimate usage often comes from specific administrative accounts.

  - **Inspect user behavior**: Review the user’s recent activity logs for typical usage patterns. If the tool's execution lacks normal context or user familiarity, it may indicate unauthorized use.

  - **Monitor network connections**: Examine any established outbound connections during the execution of the detected processes using Windows Firewall logs (Event ID 5156). Look for unusual connections that could indicate remote control or data exfiltration.

  - **Cross-check installed software**: Verify the presence of "Mouse Without Borders" in the list of installed applications (via `Get-WmiObject -Class Win32_Product`). Legitimate systems should have a documented need for this tool.

  - **Analyze execution time**: Identify anomalies by correlating the execution times of the detected processes with user login/logout events. Execute times outside of standard hours may suggest misuse.

  ### Prioritization

  The alert has medium severity due to the potential impact on systems, especially if the affected host plays a critical role (e.g., server or administrative workstation). The likelihood of malicious abuse is moderate as the behavior can be misused for lateral movement, yet often this tool has legitimate use cases in administrative tasks.

  ### Blind Spots and Assumptions

  The detection may miss scenarios where the application is executed from scripts or alternative file paths, as the signatures are specific. Reliable detection necessitates the inclusion of Windows File and Security logs, and improper configurations might lead to non-detection. Additionally, legitimate remote management practices could trigger the alert under specific conditions, such as scheduled tasks. A related detection to consider is monitoring for unusual user account activity or service modifications to further enhance coverage against misuse of administrative tools.

