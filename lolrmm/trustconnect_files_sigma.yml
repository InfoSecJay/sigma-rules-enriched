note: |
  ### Technical Context

  This Sigma rule detects potential file access associated with the TrustConnect Remote Monitoring and Management (RMM) tool on Windows systems. The likely attacker objective involves managing or manipulating endpoints through unauthorized means, possibly targeting sensitive configurations or surveillance capabilities. This behavior aligns with the MITRE ATT&CK technique for Remote System Control (T1219). The primary telemetry sources for this detection are Windows file event logs, specifically focusing on access to the TrustConnect Agent executable and associated configuration files. If malicious, the security impact may include unauthorized remote access, system manipulation, or data exfiltration. Importantly, this detection does NOT confirm that malicious activity occurred; legitimate use of TrustConnect can generate similar alerts.

  ### Investigation Steps

  - **Inspect file access events:** Review Windows Event ID 4663 for access attempts on files located at 'C:\Program Files\TrustConnect Agent\TrustConnectAgent.exe' and 'C:\ProgramData\TrustConnect\*\config.json'. Identify session IDs and user names associated with the access.

  - **Verify session authenticity:** Check Event ID 4624 (Successful Logon) to confirm logon types and user accounts initiating access. False indicators may include repeated access from system accounts or unexpected user accounts.

  - **Review process creation logs:** Analyze Sysmon Event ID 1 for process creation events involving the TrustConnectAgent.exe. Note command-line arguments or parent processes that could indicate legitimate or unauthorized usage.

  - **Identify configuration changes:** Look for signs of file modification in Windows Event ID 4663 concerning 'config.json' and 'device.id'. Legitimate use may show expected changes by trusted administrators, whereas rapid changes or multiple modifications by different users may indicate compromise.

  - **Evaluate network connections:** Check for outbound connections to unexpected IP addresses or domains from the host running TrustConnect (via Event ID 5156 in Windows Firewall logs) that could signify command-and-control activities.

  ### Prioritization

  The alert is classified as medium severity. It targets a potentially high-risk application that can be abused for system manipulation or remote access. The likelihood of malicious use is moderate, given the advertised capabilities of TrustConnect for remote management. This behavior has been weaponized in past incidents by threat actors utilizing RMM tools for lateral movement and exfiltration.

  ### Blind Spots and Assumptions

  There are detection limitations if log sources are misconfigured or if file access logging is not enabled on hosts running TrustConnect. Legitimate activities, such as IT support using TrustConnect for maintenance, may trigger this alert. A related detection that strengthens monitoring is checking for elevated privilege use via Event ID 4672, which could indicate unauthorized administrative actions alongside file access.

