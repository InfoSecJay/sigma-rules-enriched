note: |
  ### Technical Context

  This rule detects potential file activity associated with the TrustConnect Remote Monitoring and Management (RMM) tool, specifically monitoring for changes or access to specific executable and configuration files. The likely attacker objective is to misuse the RMM tool for unauthorized remote access or management of endpoints within the network. This monitoring falls under the MITRE ATT&CK technique of Remote Management Tools (T1219).

  The primary telemetry sources for this detection are Windows File Event logs, particularly focusing on file access or modification events for specified filenames within the paths of TrustConnect installation and configuration files. If used maliciously, this can lead to remote system compromise and unauthorized control over the managed devices. It is important to note that this detection does not confirm that the file activity is malicious—legitimate use of TrustConnect can trigger the alert.

  ### Investigation Steps

  - **Review affected files for unexpected modifications:** Check Windows File Event logs (Event ID 4663) for access and changes to `TrustConnectAgent.exe`, `config.json`, or `device.id`. Look for timestamps that correlate with the triggered alert; recent or suspicious access patterns could indicate misuse.

  - **Assess the legitimacy of the TrustConnect use:** Investigate if the organization employs TrustConnect as an RMM solution. If confirmed, evaluate the operational procedures around its use. Normal behavior would include regular access by trusted administrative users only.

  - **Identify user account activity:** Correlate the file access events with user activity logs (Event ID 4624 – Logon) to determine if a known user or unusual account is accessing these files. Any access from service accounts or non-administrative users could be suspicious.

  - **Validate process execution:** Check for corresponding process creation events related to `TrustConnectAgent.exe` (Sysmon Event ID 1) during times of suspicious file access. Legitimate execution should align with usual management practices and appropriate user activity.

  - **Monitor for data exfiltration attempts:** Examine for any network-related artifacts (e.g., outbound connections, file uploads) in conjunction with the file access. Check for unusual traffic patterns or connections to external IPs that correspond with `TrustConnectAgent.exe` process events.

  - **Cross-reference with other detection alerts:** Look for any correlated alerts concerning Remote Management Tools or unauthorized administrative activity (feature-rich detections may include process injection or elevated privileges). This helps validate whether the behavior is isolated or part of a larger attack vector.

  ### Prioritization

  This alert carries medium severity due to the essential role of RMM tools in system management, which poses a risk if maliciously exploited. The prevalence of RMM tools in legitimate environments increases the likelihood of abuse, as attackers often weaponize these tools to maintain persistence and manage compromised systems.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of TrustConnect, which can trigger false positives. The required logs must include detailed file event logs from the affected systems, ensuring comprehensive monitoring of file access. Additionally, legitimate IT operations, such as scheduled maintenance or updates, may activate this alert. Complementary detections for system-level changes (such as unauthorized software installations) could enhance overall security posture against RMM misuse.

