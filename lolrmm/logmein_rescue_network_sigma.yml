note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the LogMeIn Rescue remote management tool, specifically monitoring for connections to LogMeIn's various domains. The likely attacker objective involves remote access and potentially unauthorized control over endpoints, which could facilitate further malicious actions, including data exfiltration or lateral movement. This activity correlates with the MITRE ATT&CK technique: Remote Services (T1219).

  Primary telemetry sources include Windows network connection logs, specifically noting DNS queries and established connections to the specified LogMeIn domains. If this remote access tool is being used maliciously, it can result in significant security incidents, including data breaches or unauthorized system access. It is essential to understand that the detection of this activity alone does not confirm malicious intent, as LogMeIn Rescue is also used legitimately in IT support contexts.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows network connection logs (Event ID 5156) for connections to domains like '*.logmeinrescue.com' or 'rescue-list.*.logmein-gateway.com'. Malicious activity is indicated by unexpected connections from non-administrative or user systems.

  - **Identify user context:** Assess user accounts making the network connections through authentic sources (Event ID 4624) to determine if they correspond with known administrative or IT support accounts. Legitimate use would typically involve recognized support personnel.

  - **Examine process initiation:** Look for Windows security logs (Event ID 4688) indicating process creation linked to LogMeIn Rescue. Review timestamps to correlate with the network connections found in the previous step. Unexpected or unusual processes suggest potential misuse.

  - **Review firewall logs:** Analyze firewall logs for outbound traffic to LogMeIn domains, particularly focusing on HTTP/S methods and identifying ports used by the LogMeIn Rescue tool. Legitimate communication should be well-documented and schedulable within IT maintenance windows.

  - **Assess endpoint roles:** Evaluate the roles of impacted endpoints, identifying critical infrastructure, and ensure any remote access is within the organization's policy. Systems not associated with IT or support functions connecting to these domains should be treated as suspicious.

  ### Prioritization

  This alert has medium severity as it indicates potential unauthorized remote access, particularly on workstations or servers within the enterprise environment. While the likelihood of malicious use exists, many organizations employ LogMeIn Rescue legitimately for IT support, necessitating context verification.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of LogMeIn tools by IT support teams, which could trigger false positives. Required log sources include network monitoring logs, which must be configured to capture detailed connection information. Additionally, usage by third-party support services could also falsely trigger the alert without clear visibility into their access patterns. A related detection could involve monitoring for suspicious behavior patterns associated with established LogMeIn processes (e.g., unusual login attempts from the system to external IP addresses).

