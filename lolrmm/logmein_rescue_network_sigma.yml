note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to LogMeIn Rescue (RMM) domains, which could indicate unauthorized remote access activity. The likely attacker objective is to maintain access or control over a compromised system, enabling further exploitation or data exfiltration. This behavior is associated with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1219).

  The primary telemetry source for this detection includes Windows network connection logs, specifically looking for DNS or other network traffic logs that capture the destination hostname. If malicious, the impact could result in significant data breaches or unauthorized actions on sensitive systems. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of LogMeIn Rescue in IT support or remote administration contexts exists.

  ### Investigation Steps

  - **Review network connections:** Examine logs for TCP/IP traffic to domain names such as `*.logmeinrescue.com` or `*.logmein-gateway.com` (Event ID 5156 for Windows Firewall logs). Verify specific timestamps of activity and correlate with user activities.

  - **Check process associations:** Investigate the associated process making the connection using Sysmon Event ID 3 (Network Connection) to identify unusual or unauthorized applications running on the system that could indicate exploitation.

  - **Identify legitimate usage:** Search for contextual user behavior patterns related to remote support requests (e.g., IT helpdesk tickets) that would justify the use of LogMeIn. Verify if any authorized personnel conducted maintenance during reported times.

  - **Look for high-risk indicators:** Isolate connections from non-standard user accounts or roles (e.g., service accounts, users without remote admin permissions) that initiated connections to LogMeIn domains, triggering alerts for potential misuse.

  - **Audit recent changes:** Review group policy changes or system configurations that may allow or deny RMM tools on the affected host, checking Event ID 4700 (User/Group Account Management), to identify any suspicious modifications.

  ### Prioritization

  This alert should be treated with medium priority due to its association with potential unauthorized remote access. The impact can be significant if the affected system contains sensitive data, and the likelihood of malicious abuse is heightened given that attackers often utilize similar tools for lateral movement and maintaining persistence.

  ### Blind Spots and Assumptions

  Detection may be prone to false positives due to legitimate use in support scenarios. Required log sources must include comprehensive network logs and firewall events to accurately capture related activity. Legitimate administrative activities might trigger the alert if users utilize LogMeIn for valid support purposes. Related detections may include unauthorized remote desktop protocol (RDP) sessions or anomalous user logins to strengthen overall coverage.

