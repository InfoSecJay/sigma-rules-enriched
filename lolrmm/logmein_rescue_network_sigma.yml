note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the LogMeIn Rescue remote monitoring and management (RMM) tool. The likely objective of an attacker using this tool is to gain unauthorized access to systems for remote control or data exfiltration. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically technique T1219 (Remote Access Software), which involves tools used to manage systems remotely.

  Primary telemetry sources include Windows network connection logs, specifically monitoring for connections to destination hostnames associated with LogMeIn Rescue services. If this network activity is malicious, it could facilitate unauthorized access, system manipulation, or data theft. However, this detection alone does not confirm malicious intent or compromise, as legitimate users may also access these services for approved remote support activities.

  ### Investigation Steps

  - **Verify connection logs:** Review Windows Network Connection logs for Event ID 5156. Look for outgoing connections to `*.logmeinrescue.com` or `*.logmein-gateway.com`. Connections to these domains might be benign if connected by a known IT support service.

  - **Assess user activity:** Identify the user account associated with the alert. Cross-reference this account against your organization's asset management system to verify if they are authorized to use LogMeIn Rescue for remote support.

  - **Check recent user behavior:** Review the user's recent activity logs (Event ID 4624, Logon events) within the last hour to establish context. Look for unusual login patterns or remote connection initiations that may indicate compromise.

  - **Identify high-confidence indicators:** Look for Event ID 4688 (Process Creation) that shows execution of `LogMeInRescue.exe` or related binaries. Correlate timestamps with known malicious connections to understand potential abuse of the tool.

  - **Validate expected remote access:** Identify if the use of LogMeIn Rescue is part of authorized operational procedures. Confirm if any related notifications or requests were made to your support team prior to the alert activation.

  - **Monitor associated resources:** Check for the presence of files in temporary or download locations associated with LogMeIn activities, such as installation files or logs, to assess whether the tool was intentionally deployed.

  ### Prioritization

  This alert has a medium severity level due to the potential impact of unauthorized remote access to sensitive systems, particularly if the affected asset holds critical data or operational roles. The likelihood of malicious abuse is plausible given the tool's features; however, many organizations legitimately use LogMeIn Rescue for remote support.

  ### Blind Spots and Assumptions

  Detection may be limited by users employing legitimate LogMeIn Rescue sessions for authorized tasks, which could result in false positives. Reliable detection requires consistent monitoring of outbound connection logs, specifically those to LogMeIn domains, which might not be present in all environments. Additionally, users may have programs or services that connect to these domains for legitimate purposes, such as tech support. Consider implementing companion detections for abnormal user login behavior or process anomalies to strengthen coverage.

