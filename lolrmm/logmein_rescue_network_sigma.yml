note: |
  ### Technical Context

  This Sigma rule detects network connections to LogMeIn Rescue Remote Monitoring and Management (RMM) tool domains, such as `logmeinrescue.com` and `logmein-gateway.com`. The behavior indicates potential remote access by unauthorized individuals aiming to control, manage, or exploit devices within the enterprise environment. This could suggest an attacker attempting to maintain persistence or execute lateral movement within the network, thus compromising system integrity and confidentiality.

  The relevant MITRE ATT&CK tactic for this behavior is "Execution" (TA0002) and the technique used is "Remote Access Software" (T1219). Primary telemetry sources include network connection logs, typically found in Windows event logs related to outbound connections (Event ID 5156 from Windows Filtering Platform). If malicious, the impact could be significant as it allows for unauthorized access, data theft, or system manipulation. However, this detection does not confirm malicious intent by itself, as legitimate use of LogMeIn Rescue for remote support is also a possibility.

  ### Investigation Steps

  - **Check outbound network connections:**
    Analyze Windows Filtering Platform logs (Event ID 5156) for connections to `logmeinrescue.com`, `logmeinrescue.eu`, and associated gateway domains. Look for unusual timestamps or sources, which may indicate unauthorized use.

  - **Review user activity:**
    Validate the users who initiated connections to LogMeIn domains against known support personnel. Cross-reference account usage with typical helpdesk session times. Legitimate tools will have consistent usage patterns with predefined users.

  - **Inspect recent access logs:**
    Examine the Sysmon Event ID 3 logs for process creation and associated command-line arguments. Look for the invocation of known LogMeIn executable paths that could indicate unauthorized execution, like `LogMeIn.exe`.

  - **Identify legitimate administrative activity:**
    Confirm whether any authorized remote sessions took place using a known ticketing or support request. This may account for legitimate traffic to LogMeIn domains and reduce false positives.

  - **Correlate with user behavior analytics:**
    Utilize user behavior analytics tools to assess whether the observed network connections align with expected user behavior. Anomalous activity could indicate potential misuse or credential theft.

  - **Assess asset criticality:**
    Determine the criticality of affected systems. A connection from a domain controller to LogMeIn indicates higher risk than a standard workstation. Apply additional scrutiny based on asset classification.

  ### Prioritization

  The alert severity is medium due to the potential impact on sensitive systems if the LogMeIn tool is used maliciously. While this protocol is not uncommon for legitimate support cases, the likelihood of unauthorized access through recognized remote access tools poses a meaningful threat that warrants immediate investigation.

  ### Blind Spots and Assumptions

  This detection is limited by the prevalence of legitimate LogMeIn use within the organization, which may lead to false positives. Required log sources include Windows Filtering Platform logs, and accurate event logging configurations must be enabled for reliable detection. Legitimate administrative access for remote support may trigger alerts. Companion detections such as monitoring for unauthorized administrative accesses or suspicious lateral movement behaviors can provide broader coverage and context.

