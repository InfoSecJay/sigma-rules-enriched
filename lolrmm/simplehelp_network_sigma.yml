note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to domains and IP addresses associated with the SimpleHelp remote management tool. The primary objective of an attacker leveraging SimpleHelp would be to establish unauthorized remote access to a victim's system. This behavior fits within the MITRE ATT&CK framework under the tactic of Execution (TA0002) and the technique of Remote Services (T1219).

  The primary telemetry sources involved in this detection are Windows network connection logs, specifically looking for events related to outbound connections. If malicious, the security impact includes unauthorized control over endpoints potentially leading to data exfiltration, system manipulation, or lateral movement within the network. Importantly, this detection does NOT confirm that an attack is occurring; legitimate usage of the SimpleHelp tool can trigger this alert.

  ### Investigation Steps

  - **Review outbound connection logs:** Check Windows Event Logs (Event ID 5156) for network connection events to the IP addresses `51.255.19.178` and `51.255.19.179`, or domain names ending with 'simple-help.com'. Look for unusual user accounts initiating these connections.

  - **Identify legitimate usage:** Determine if SimpleHelp is an approved remote management tool within your organization. Verify with the IT department if the session corresponds to known, scheduled remote support activities.

  - **Inspect user activity:** Monitor the user account performing the connection via Security Event ID 4624 (Logon). Determine if this account has a history of legitimate remote access or if it is a newly created account, which could indicate potential compromise.

  - **Check for additional indicators of compromise:** Use Sysmon logs (Event ID 3) to identify process creation events that may correspond to the execution of SimpleHelp, looking for unique command-line arguments or unusual parent processes.

  - **Review firewall logs:** Examine firewall logs for outbound traffic to SimpleHelp-related domains or IPs. Check for anomalies in transmission volumes or times that may indicate rapid, scripted activity rather than normal user interaction.

  - **Correlate with other detection rules:** If applicable, review alerts related to remote access tools or anomalous behavior (e.g., unexpected PowerShell executions) to identify patterns that may indicate malicious use of SimpleHelp.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on sensitive systems if SimpleHelp is being used maliciously for unauthorized access. The likelihood of abuse exists, especially if there is no documented use case for this remote tool within the organization. This behavior can be weaponized, as remote access solutions are often exploited in attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the ability of attackers to mask their use of remote management tools, possibly employing other domains or IPs not covered by this detection. Ensure that logging for outbound connections is appropriately configured to capture all necessary data. Legitimate remote support activities may trigger this alert if SimpleHelp is used as part of authorized operational procedures. Companion detections that could enhance visibility include monitoring for unauthorized installation of remote access software or abnormal Windows Logon events.

