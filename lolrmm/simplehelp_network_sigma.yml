note: |
  ### Technical Context

  This rule detects network connections associated with the SimpleHelp Remote Monitoring and Management (RMM) tool. The primary attacker objective would be unauthorized remote access to systems, which could lead to data exfiltration or malicious software deployment. This behavior aligns with the MITRE ATT&CK technique **T1219: Remote Access Software**.

  The primary telemetry sources include Windows network connection logs, specifically targeting connections to known SimpleHelp domains and IP addresses. A successful exploitation could result in significant security impacts, such as unauthorized control over endpoints or data loss. However, this detection alone does not confirm active malicious activity; legitimate use of the SimpleHelp tool may also trigger alerts.

  ### Investigation Steps

  - **Review network connections:** Check for connections to known SimpleHelp domains such as `simple-help.com` or IP addresses like `51.255.19.178`. Look for Event ID 5156 (Windows Filtering Platform) to confirm the connection attempt from the source machine.

  - **Correlate with user activity:** Verify user accounts associated with the connections. If connections are from accounts known to use SimpleHelp legitimately, this may indicate benign usage. Look at logs for Event ID 4624 (logon events) to identify the user and logon type.

  - **Analyze the process initiating the connection:** Identify the process responsible for the network activity by examining Event ID 4688 (Process Creation). Check for unusual processes or executables that are not standard operating practices.

  - **Inspect for non-standard behavior:** Determine if SimpleHelp is being initiated outside of normal working hours or from unexpected asset types (e.g., personal devices instead of corporate endpoints). This indicates potential abuse of the tool.

  - **Validate via endpoint monitoring:** If possible, check for the installation or execution logs of the SimpleHelp tool itself. User-installed versions may indicate unauthorized use, where the specific file creation and execution artifacts could be located in common installation directories (e.g., `C:\Program Files`).

  ### Prioritization

  This alert holds medium severity due to the potential impact on the affected system and the moderate likelihood of malicious abuse, especially if SimpleHelp is not typically used within the enterprise environment. Although the usage of RMM tools is common in IT, unauthorized access can be weaponized effectively by adversaries.

  ### Blind Spots and Assumptions

  Detection may be circumvented by adversaries using custom domain names or IP addresses for their infrastructure. The rule relies on specific network logs to be enabled; without them, detection may fail. Legitimate remote support sessions conducted by IT staff could trigger the alert. Additional detections of suspicious remote access procedures would strengthen coverage and mitigate blind spots, such as tracking for anomalous logon attempts or lateral movement activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
