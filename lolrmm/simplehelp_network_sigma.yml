note: |
  ### Technical Context

  This rule detects network activity associated with the SimpleHelp remote management tool. Adversaries may use this tool to gain unauthorized access to managed systems for control or data exfiltration, aligning with the Execution tactic (MITRE ATT&CK Tactic: Execution, Technique ID: T1219). The primary telemetry source is Windows network connection logs, specifically monitoring outbound connections to known SimpleHelp domains and IP addresses.

  If an alert is generated, there is a significant security impact, as unauthorized use of remote management tools can enable data breaches or lateral movement within an enterprise environment. However, this detection does not confirm malicious intent on its own, as legitimate administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Identify the connection source:**
    Check Windows Security Event ID 5156 for permitted connection logs. Review for unexpected internal endpoints attempting to connect to SimpleHelp destinations, which could indicate unauthorized usage.

  - **Verify the destination and activity:**
    Review outbound network connections in Windows Firewall logs (Event ID 5145) for connections to `simple-help.com` or the IPs `51.255.19.178` and `51.255.19.179`. Compare against known authorized use cases within your organization.

  - **Assess user context and permissions:**
    Investigate the user account initiating the connection. Check Active Directory logs (Event ID 4768) or User Access logs to confirm if it aligns with typical administrative privileges or if it raises suspicion.

  - **Look for additional malicious indicators:**
    Review logs for unusual patterns or increased frequency of connections to these domains from the same IP or user account. Assess for connections occurring outside of regular business hours.

  - **Determine expected behavior:**
    Identify instances of sanctioned SimpleHelp usage through ticketing or change management system documentation, confirming if the connection aligns with a scheduled maintenance window or user support request.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of unauthorized access through remote management tools. The likelihood of malicious abuse is moderate, given that such tools can be weaponized by adversaries for compromise. It is not uncommon for these types of tools to be misused, necessitating further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments using whitelisting for remote management tools, possibly masking malicious activity. Reliable detection requires comprehensive logging configurations for network connections and firewall logs. Legitimate remote support activities by IT personnel may also trigger this alert. Additionally, companion detections that monitor for unusual credential use (e.g., Event ID 4769) can strengthen coverage against potential misuse of administrative accounts.

