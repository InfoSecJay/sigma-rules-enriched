note: |
  ### Technical Context

  This rule detects network connections to known SimpleHelp Remote Management and Monitoring (RMM) tool domains and IP addresses. The likely objective of an attacker using SimpleHelp is to establish remote control over a compromised system, facilitating further malicious actions such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and technique of Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs, specifically focusing on the `DestinationHostname` field to identify connections to domains like `simple-help.com` or IP addresses 51.255.19.178 and 51.255.19.179. If malicious, this activity could indicate unauthorized remote access and control over the organization's systems. Importantly, this detection does NOT confirm that the SimpleHelp tool is being used maliciously, as it may also be utilized for legitimate remote support operations.

  ### Investigation Steps

  - **Check event logs for network activity:** Review Windows Security Event ID 5156 (Windows Filtering Platform) to identify allowed connections to the specified SimpleHelp domains and IP addresses.

  - **Investigate process execution:** Verify if `SimpleHelp.exe` (or associated executables) is running on the host by checking Sysmon Event ID 1 for process creation, noting timestamps that align with the detected network activity.

  - **Identify the context of usage:** Determine if there are legitimate use cases for SimpleHelp in your environment, checking network documentation or user requests within IT departments. This may help classify the observed behavior as benign.

  - **Correlate alerts with user interactions:** Look for user actions by examining Security Event ID 4624 (logon events) around the time of network connections to see if they coincided with known user support sessions.

  - **Collect inbound/outbound traffic data:** Analyze network firewall logs filtering on the IP addresses 51.255.19.178 and 51.255.19.179, reviewing the frequency and volume of connections to assess potential unauthorized use.

  - **Document findings and escalate if necessary:** If malicious indicators are confirmed (e.g., unauthorized SimpleHelp use by a suspicious user), escalate the alert with appropriate details for further investigation.

  ### Prioritization

  This alert carries a medium severity due to the potential for adversaries to leverage SimpleHelp for unauthorized remote access. The likelihood of malicious abuse is significant, especially in environments without a clear approval process for RMM tools. Furthermore, the behavior is known to be weaponized by attackers for maintaining persistence and control.

  ### Blind Spots and Assumptions

  Detection may be limited if network logs are not properly configured to capture all outbound traffic, leaving a gap in identifying legitimate RMM use versus malicious activity. Legitimate administrative activities, like remote support tasks, may trigger this alert, necessitating contextual knowledge of acceptable RMM usage in the organization. Companion detections from EDR solutions focusing on remote access tools or persistence mechanics can enhance coverage and confirm suspicious activity patterns.

