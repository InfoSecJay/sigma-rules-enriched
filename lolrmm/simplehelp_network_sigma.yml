note: |
  ### Technical Context

  This rule detects potential network connections initiated by the SimpleHelp Remote Monitoring and Management (RMM) tool. Attackers may use this tool to establish persistence, facilitate unauthorized access, or manage compromised systems, often with the objective of data exfiltration or lateral movement within the network. The relevant MITRE ATT&CK tactics include Command and Control (T1071) and Exfiltration Over Command and Control Channel (T1219).

  The primary telemetry sources include Windows event logs related to network connections and potentially Sysmon logs for more granular visibility. If the activity is malicious, it can indicate unauthorized control or investigation of systems, heightening the risk for data theft or further network exploitation. However, this detection does NOT confirm actual malicious behavior without corroborating evidence, such as unauthorized access or data exfiltration events.

  ### Investigation Steps

  - **Review network connection logs:** Check Windows Event ID 5156 for filtered connection events to destinations matching 'user_managed', '*.simple-help.com', or IPs 51.255.19.178/51.255.19.179. Look for patterns that deviate from typical organizational IP communications.

  - **Validate legitimate use:** Confirm if the SimpleHelp tool is in legitimate use within the organization. Check if there are documented use cases or assigned assets that utilize SimpleHelp for remote management purposes.

  - **Analyze Sysmon logs for process activity:** Review Sysmon Event ID 1 for process creation activity that includes the SimpleHelp executable paths or network DLLs, cross-reference them with running processes to identify any unauthorized instances.

  - **Identify command and control indicators:** Look for signs of lateral movement or remote access tool communication in network logs. High-confidence malicious indicators include repeated unsuccessful connections or unusual connection patterns to the identified SimpleHelp infrastructure.

  - **Check for authorized user behavior:** Examine user accounts initiating connections to the specified domain names or IP addresses. Legitimate actions will typically include known administrative users and scheduled maintenance, while suspicious accounts may show no prior involvement with these tools.

  ### Prioritization

  This alert has a moderate severity based on the potential exposure of sensitive systems to unauthorized control. Although SimpleHelp can be a legitimate tool, its misuse is common among adversaries, increasing the likelihood of malicious abuse if activity is observed unexpectedly.

  ### Blind Spots and Assumptions

  Detection relies on active logging of network connections and may be limited by configurations that do not capture all outbound traffic. Legitimate IT administration activities might trigger these alerts if SimpleHelp is sanctioned for remote support. A companion detection to strengthen coverage would be an alert for unusual outbound traffic volume to known RMM service providers, which could indicate data exfiltration or command and control communication.

