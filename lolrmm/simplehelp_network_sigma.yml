note: |
  ### Technical Context

  This rule detects potential network activity related to the SimpleHelp Remote Management and Monitoring (RMM) tool, identifying connections to domains associated with SimpleHelp, which may signify unauthorized remote access or command-and-control behavior. The likely attacker objective is to gain remote control over a compromised system, potentially leading to data exfiltration or lateral movement within the network. This detection aligns with the MITRE ATT&CK technique for Command and Control, specifically T1219 (Remote Access Tools).

  The primary telemetry source for this detection is Windows network connection logs, specifically monitoring outbound connections to domains matching `*.simple-help.com`. If malicious, this activity could lead to unauthorized user control and data breaches. This detection alone does not confirm malicious activity, as legitimate use of SimpleHelp may occur within the organization.

  ### Investigation Steps

  - **Identify relevant network connections:** Query Windows security logs for Event ID 5156 (Windows Filtering Platform) to review outbound connections. Investigate connections to any IPs resolving to `*.simple-help.com` during the alert timeframe.

  - **Verify hostname resolution:** Check DNS logs for queries resolving to SimpleHelp domains. Determine if this hostname was resolved from a legitimate internal process associated with remote support tasks.

  - **Evaluate user activity:** Review logon events (Security Event ID 4624) on the endpoint where the alert was triggered to identify if a legitimate administrator or support user executed actions leading to the establishment of this connection.

  - **Analyze system roles:** Confirm if the affected host operates within a role that is expected to utilize remote tools (e.g., IT support workstation) or if it is an unexpected system (e.g., a file server or sensitive endpoint), indicating potential compromise.

  - **Check for unique identifiers:** Look for any accompanying artifacts in the Application Event logs related to SimpleHelp's installation or usage, such as Event IDs pointing to prominent software activity, which can help differentiate benign use from malicious actions.

  ### Prioritization

  This alert is of medium severity. While the system's impact varies based on its role, the likelihood of abuse is moderate due to the nature of remote access tools being commonly exploited. The SimpleHelp domains being triggered may suggest a high probability of malicious intent if this activity is observed on non-admin or sensitive systems.

  ### Blind Spots and Assumptions

  This detection may miss instances where SimpleHelp operates on non-standard ports or uses encrypted connections that bypass regular monitoring. Comprehensive logging of all outbound network connections is required for reliable detection. Legitimate instances of SimpleHelp could result from authorized IT support activities. Companion detections related to other remote access tools (such as AnyDesk or TeamViewer activity) should also be monitored to strengthen overall coverage against remote access threats.

