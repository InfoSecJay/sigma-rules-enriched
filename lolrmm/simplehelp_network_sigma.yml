note: |
  ### Technical Context

  This rule detects network connections to known SimpleHelp RMM (Remote Monitoring and Management) domain names and IP addresses. The likely attacker objective is to establish a command-and-control (C2) channel using unauthorized remote management tools, which can be indicative of an active intrusion or post-compromise activity. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), and the technique is "Exploitation for Client Execution" (T1219). Primary telemetry sources include Windows network connection logs, particularly monitoring DNS lookups and connection attempts to specified domains or IPs. If malicious, this could lead to unauthorized access and control over remote systems, enabling further exploitation or data theft. Importantly, this detection does NOT confirm malicious intent on its own, as the tool may be used by legitimate administrative functions.

  ### Investigation Steps

  - **Check network connections:** Review Windows Security Event IDs 5156 (Windows Filtering Platform - Allow) or 5158 (Windows Filtering Platform - Deny) for outgoing connections to destination IPs 51.255.19.178 or 51.255.19.179 to establish if the connection was allowed or blocked.

  - **List recent processes:** Query Sysmon Event ID 1 for processes creation and filter for processes launching suspicious executables related to SimpleHelp (e.g., simplehelp.exe). Check for any tailing events indicating an unexpected spawn of these processes.

  - **Review DNS queries:** Examine DNS logs for queries to 'user_managed' or 'simple-help.com' in real-time, ensuring to collect time-stamped entries that correlate with the timestamp of the alert. Legitimate activity may include queries from known IT management servers.

  - **Validate connections:** Look for established TCP connections on the local system (using netstat or PowerShell commands) that correspond to SimpleHelp’s known ports (e.g., port 80/443) and verify whether they lead back to the confirmed SimpleHelp domains or IPs.

  - **Investigate related unusual behavior:** Cross-reference the detected activity with other telemetry such as account login attempts and lateral movement logs. Check if there were sudden spikes in administrative or remote access logins which are higher than usual.

  - **Search for file artifacts:** Review system directories and application logs for the presence of SimpleHelp executable files or associated configurations. Use file integrity monitoring (FIM) to check if any unauthorized installations occurred recently.

  ### Prioritization

  This alert has medium severity as it identifies potentially unauthorized remote access attempts, which could lead to serious security risks. The likelihood of malicious abuse is significant due to the tool's potential use in exploitation scenarios, while its presence in legitimate administrative practices may also cause confusion.

  ### Blind Spots and Assumptions

  This detection may be evaded by using domain fronting or alternate remote access tools. Reliable detection depends on correctly configured firewall and DNS logging to capture all relevant traffic. Legitimate administrative activities may trigger this alert due to the authorized use of SimpleHelp by personnel. Companion detections that enhance coverage include monitoring for the use of other remote management tools such as TeamViewer or AnyDesk to identify nefarious patterns.

