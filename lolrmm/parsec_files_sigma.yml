note: |
  ### Technical Context

  This rule detects file activity associated with the Parsec Remote Monitoring and Management (RMM) tool, specifically targeting instances where executable files related to Parsec are accessed or manipulated. Attackers may utilize Parsec RMM for remote access and management of compromised systems, leveraging its capabilities to facilitate lateral movement, data exfiltration, or other malicious activities. The relevant MITRE ATT&CK tactics include Execution (T1203) and Remote Services (T1219).

  Primary telemetry sources include Windows File Events, particularly focusing on the access or modification of specific Parsec executables: `parsecd.exe`, `pservice.exe`, and `teams.exe`. If these executables are involved in unauthorized activities, the potential security impact includes unauthorized system access and data manipulation. However, the detection alone does not confirm malicious intent without additional contextual information, as Parsec may also be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Identify process initiation:** Review Security Event ID 4688 for new process creation evidence involving `parsecd.exe`, `pservice.exe`, or `teams.exe`, focusing on parent process IDs that suggest potential misuse context (e.g., unusual parent processes like `cmd.exe` or `powershell.exe`).

  - **Correlate file access logs:** Check Windows File Events for specific access patterns to `C:\Program Files\Parsec\*`, noting the user account tied to each access. Confirm that access patterns align with acceptable user roles and expected administrative tasks.

  - **Evaluate user account behavior:** Investigate the user account that initiated the access. If not consistent with established roles, such as typical IT staff usage of Parsec, it may indicate potential misuse. Focus on recent logins, privilege escalation events, or anomalous activity.

  - **Analyze network connections:** Review Network Event data or Windows Firewall logs for outbound connections from the affected systems on ports typically used by Parsec (UDP/TCP 8000, 443). Note that legitimate Parsec usage will have consistent network patterns aligned with your organization’s operations.

  - **Identify modified artifacts:** Check for any changes made to startup or scheduled jobs involving Parsec executables. Creation or modification events in `Task Scheduler` related to Parsec could indicate attempts to establish persistence via RMM.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact of the affected system, especially if it manages critical assets. The likelihood of adversaries misusing RMM tools like Parsec is moderate, as they are commonly weaponized for remote access in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of Parsec, which can generate similar file access patterns as those indicating malicious intent. To ensure reliable detection, all relevant host logging must be configured correctly, including file system access logs. Legitimate activities such as authorized remote management sessions may trigger this alert. A related detection to consider is monitoring for unusual process executions by `powershell.exe`, which can provide additional context and enhance coverage against misuse incidents.

