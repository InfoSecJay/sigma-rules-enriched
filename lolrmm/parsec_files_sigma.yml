note: |
  ### Technical Context

  This Sigma rule detects activity related to the execution of files associated with the Parsec Remote Management and Monitoring (RMM) tool, specifically `parsecd.exe`, `pservice.exe`, and `teams.exe`. The likely attacker objective is to use Parsec for remote access and control, potentially allowing unauthorized personnel to manage compromised systems or exfiltrate data. This behavior can be categorized under the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Application Layer Protocol: Web Service (T1219).

  Primary telemetry sources include Windows file event logs, specifically focusing on file execution events. If this behavior is malicious, it could signify a remote control compromise, unauthorized access, or data exfiltration. However, it is important to note that this detection does NOT confirm malicious intent on its own, as Parsec can be used legitimately in many enterprise environments.

  ### Investigation Steps

  - **Review file execution events:** Check for Security Event ID 4688 or Sysmon Event ID 1 for the execution of `parsecd.exe`, `pservice.exe`, and `teams.exe`. Analyze parent processes and command-line arguments for indications of abuse.

  - **Correlate with user activity:** Investigate Windows Event log for User Logon events (Event ID 4624) around the same timestamp as the suspicious file execution. Assess whether the logged user is legitimate and has the right to execute these applications.

  - **Check process ancestry:** Use Sysmon Event ID 10 to evaluate the process tree of executed files. Look for unexpected parent processes that might indicate a malicious execution context.

  - **Identify legitimate use cases:** Determine if the user or system executing the Parsec files is known to utilize this tool. Review application deployment records or configuration management databases (CMDB) to validate expected usage patterns.

  - **Search for data exfiltration artifacts:** Look for any unusual outbound connections made by the Parsec processes (using Windows Firewall logs or network traffic analysis), specifically targeting unexpected external IP addresses or domain names.

  ### Prioritization

  This alert is of medium severity due to the potential impact of unauthorized remote access to critical systems. While Parsec can be legitimately used for system administration, the likelihood of malicious abuse is notable, as adversaries may weaponize it for control over compromised networks.

  ### Blind Spots and Assumptions

  Detection may be limited if Parsec is used intentionally for legitimate remote access, potentially leading to false positives. Organizations must ensure that file events logging is correctly configured on all endpoints for reliable detection. Legitimate administrative tasks using Parsec could trigger this alert, underscoring the need for context-aware analysis. A companion detection involving network traffic patterns to and from known Parsec servers could strengthen overall detection capabilities.

