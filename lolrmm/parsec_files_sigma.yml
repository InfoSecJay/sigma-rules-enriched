  ### Technical Context

  This Sigma rule detects file activity associated with the Parsec RMM (Remote Management and Monitoring) tool, specifically focusing on the execution of critical executables such as `parsecd.exe`, `pservice.exe`, and `teams.exe`. The behavior suggests potential unauthorized remote access or control, typically part of an adversarial operation to manipulate or monitor systems remotely.

  This detection connects to the MITRE ATT&CK framework under the tactic of "Execution" (TA0002), with a specific technique identified as "Remote Services" (T1219). The primary telemetry source comprises Windows file event logs that capture file access and execution details, particularly related to the specified executables. If malicious, this activity could result in unauthorized data access or system interference. It is essential to note that this detection alone does not confirm malicious intent, as it might also reflect legitimate use of the Parsec tool.

  ---

  ### Investigation Steps

  - **Inspect relevant file events**: Review Windows File Event logs for Event ID 4663 related to `C:\Program Files\Parsec\` path indicating access or modification activities. Look for file modifications during unusual hours as a potential indicator of compromise.

  - **Correlate with user activity**: Check user authentication logs (Event ID 4624) to determine if the accessing user account is authorized for the Parsec tool. Remote sessions from non-administrative or unauthorized accounts could indicate malicious intent.

  - **Analyze process creation events**: Gather Process Creation logs (Sysmon Event ID 1) indicating the execution of `parsecd.exe`, `pservice.exe`, or `teams.exe`. Compare command line arguments for unusual flags or parameters that may indicate misuse.

  - **Identify expected legitimate behavior**: Confirm expected use of Parsec involving known users and authorized systems during business hours. Document typical operational windows and common workflows associated with its use to distinguish from anomalous patterns.

  - **Look for associated network traffic**: Examine firewall logs and network monitoring tools for outgoing traffic to unusual external IP addresses or ports that correlate with the use of the Parsec executables. This can indicate potential data exfiltration or command and control communication.

  - **Check for known malicious indicators**: Look for engagement of these executables in conjunction with known attack patterns, such as unusual file access by high-risk users or from potentially compromised hosts in the environment.

  ---

  ### Prioritization

  This alert carries a medium severity due to the potential for unauthorized access and system manipulation via Parsec. While the likelihood of abuse is significant, particularly in environments where remote administration tools are uncommon, legitimate usage can dilute the impact of this behavior, requiring careful investigation to determine intent.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that attackers may obfuscate their use of Parsec or deploy alternative remote tools to evade detection. A comprehensive audit of the security logging configuration is essential to capture all relevant file events, ensuring complete visibility. Legitimate administrative activities could trigger the alert if Parsec is routinely used for maintenance tasks. Related detections involving unauthorized access to remote tools (e.g., TeamViewer executions) enhance coverage and context around this alert.

