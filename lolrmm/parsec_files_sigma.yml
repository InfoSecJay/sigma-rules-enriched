note: |
  ### Technical Context
  This detection rule monitors for file activity related to the Parsec Remote Management and Monitoring (RMM) tool. Parsec is often used for legitimate remote access purposes; however, its capabilities can be exploited by malicious actors to gain unauthorized access to corporate environments. The rule specifically tracks interactions with executable files associated with Parsec, such as `parsecd.exe`, `pservice.exe`, and `teams.exe`.

  In the context of potential threats, attackers may aim to leverage Parsec for remote control of compromised systems to conduct further malicious activities, such as data theft, lateral movement, or persistence mechanisms. This behavior aligns with the MITRE ATT&CK technique T1219 (Remote Access Software), highlighting the use of remote access tools as a critical step in their exploitation phases. Essential telemetry sources for this detection include Windows file event logs that capture details of file access and modifications.

  ### Investigation Steps
  - **Review File Access Logs:** Analyze Windows file event logs for any unauthorized access patterns to Parsec executable files. Look for unusual timestamps or access from non-standard accounts.

  - **Examine Process Execution Context:** Investigate the parent processes that initiated `parsecd.exe`, `pservice.exe`, or `teams.exe`. This will help to identify if these processes were spawned by legitimate user actions or from potentially malicious scripts.

  - **Correlate with Network Activity:** Check for any outbound connections initiated by Parsec components to external IP addresses. Uncommon destination IPs, especially those known for malicious activity, should be flagged for deeper investigation.

  - **Assess User Privileges:** Review the user accounts accessing Parsec components and ensure that only authorized personnel are leveraging these tools. Investigate any accounts that exhibit elevated privileges or unusual behaviors.

  ### Prioritization
  This alert is deemed medium priority due to the potential impact of unauthorized remote access that could lead to significant data breaches or system compromise. Although the usage of Parsec is legitimate for remote administration, the likelihood of threat actors leveraging it for malicious purposes warrants focused investigation.

  ### Blind Spots and Assumptions
  The detection rule primarily focuses on specific Parsec executable files, which may not encompass all methods of unauthorized remote access via different tools or processes. The effectiveness hinges on having comprehensive file event logging enabled within the Windows environment; organizations with restricted logging settings may miss relevant activity. Additionally, the detection assumes that malicious actors will not obscure Parsec's execution or rename its binaries, thus potentially bypassing this rule.

