note: |
  ### Technical Context

  This rule detects network connections to domains associated with the LabTech RMM (now ConnectWise Automate) remote management tool, indicating potential unauthorized remote access or control attempts. The attacker's objective may involve leveraging RMM capabilities to perform reconnaissance, persistent access, or lateral movement within the network. The relevant MITRE ATT&CK tactic is Command and Control, specifically technique T1219 (Remote Access Tools).

  Primary telemetry sources include Windows network connection logs, specifically focusing on connection attempts to domains like `*.connectwise.com`. If these connections are made by unknown or unexpected hosts, it could indicate a compromise. This detection does not confirm malicious activity on its own; legitimate use of LabTech RMM may also trigger it, thus warranting further investigation.

  ### Investigation Steps

  - **Identify source hosts:** Review Security Event ID 5156 (Windows Filtering Platform) for inbound and outbound connection records. Investigate hostname and IP mapping for anomalies, focusing on unexpected endpoints making connections to `*.connectwise.com`.

  - **Assess installation history:** Check for the presence of LabTech RMM (ConnectWise Automate) on the affected system via installed software lists or execution logs (e.g., Program Installations under Windows Event ID 1033). Legitimate installations should correlate with business practices; unexpected instances should be flagged.

  - **Monitor for user activity:** Examine Windows Security Event ID 4624 (Logon) to ascertain who logged into the system at the time of the connection. Ensure that the user activity aligns with typical behaviors of known administrators and their practices.

  - **Cross-reference system roles:** Evaluate the role of the affected system within the network (e.g., server vs. employee workstation). Unexpected connections from servers or critical assets to the RMM domains should raise immediate concerns.

  - **Check for additional behaviors:** Review Sysmon Event ID 3 (Network Connection) for any abnormal process behavior that initiated the connection, such as processes showing unusual parent-child relationships or executing from non-standard locations.

  ### Prioritization

  This alert is of medium severity due to the potential impact of remote management tool misuse on IT operations and security. While it may stem from legitimate administrative activities, unauthorized access to such tools is a tactic frequently exploited by adversaries, especially in targeting sensitive or critical systems.

  ### Blind Spots and Assumptions

  Detection may be limited by instances where legitimate LabTech RMM activities obscure malicious intent, highlighting the importance of contextual analysis. Successful detection relies on proper configuration of Windows Filtering Platform logs and Sysmon for visibility into all network connections. Additionally, false positives may arise from legitimate administrative actions, so reviewing associated alerts such as abnormal logins or unauthorized application installs is recommended for comprehensive coverage.

