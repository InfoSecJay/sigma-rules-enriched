  ### Technical Context

  This rule detects network connections to domains associated with LabTech RMM (Now ConnectWise Automate), indicating potential remote management tool (RMM) activity. Attackers may use RMM tools like LabTech to gain unauthorized control over systems, deploy payloads, or exfiltrate data. The relevant MITRE ATT&CK tactic is **Execution** (T1203).

  Primary telemetry sources include Windows network connection logs, specifically looking for connection attempts to `connectwise.com`. If the detected activity is malicious, it could lead to unauthorized access and control over endpoints in the organization. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate usage of LabTech RMM may trigger this rule.

  ---

  ### Investigation Steps

  - **Inspect network logs:**
    Look for Windows Event ID 5156 (Windows Filtering Platform) logs to verify outbound connections to `*.connectwise.com`. Confirm time of connection and host initiating the request.

  - **Verify process execution:**
    Check for any associated processes or services running at the time of the connection using Sysmon Event ID 1. Malicious activity may involve unexpected processes such as `lttask.exe` or `automate.exe`.

  - **Review user context:**
    Determine the user account associated with the outbound connection using Event ID 4624 (Logon). Assess whether the user is related to IT support or admin roles, which may justify legitimate use of RMM tools.

  - **Analyze recent changes:**
    Investigate if there have been recent changes in device configurations or installations in the organization using Sysmon Event ID 15 (FileCreateStreamHash), focusing on timestamps and associated files.

  - **Identify expected behavior:**
    Normal usage of LabTech RMM should involve scheduled connections from known administrative hosts rather than random IPs trying to connect to RMM services. Cross-check IP addresses against known internal asset inventories.

  - **Correlate with other alerts:**
    Look for other related alerts in the SIEM that indicate suspicious activity from the host or user, enhancing the confidence in identifying potential malicious behavior.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact of compromised systems running RMM tools which can lead to widespread unauthorized access. Given that RMM tools are commonly weaponized for remote control activities, the likelihood of exploiting such a connection for nefarious purposes is significant but context-dependent based on legitimate usage patterns.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the organization’s reliance on LabTech RMM for legitimate purposes, leading to potential false positives. Accurate detection requires configurations to capture all necessary Windows Filtering Platform and network event logs. Legitimate activities may include scheduled maintenance tasks that can trigger this alert. Companion detections, such as monitoring for unexpected admin logins or unusual service executions (e.g., PowerShell), can strengthen overall security posture.

