  ### Technical Context

  This rule detects outbound network connections to hostnames ending with 'connectwise.com', which is associated with the LabTech RMM (Remote Monitoring and Management) tool, now known as ConnectWise Automate. An attacker may leverage this tool for remote access and control over compromised systems, aiming to exfiltrate data, deploy malware, or perform other malicious activities. Relevant MITRE ATT&CK tactics include Command and Control (T1202) and Exfiltration Over Command and Control Channel (T1219).

  The primary telemetry source for this detection is network connection logs that capture outbound connection attempts. If malicious, this behavior can indicate an attacker leveraging legitimate RMM software to maintain persistence or control over compromised assets. It is crucial to note that this detection does NOT confirm malicious activity on its own, as legitimate use of the LabTech RMM tool by authorized personnel can trigger this alert.

  ### Investigation Steps

  - **Correlate with user activity logs:** Review Windows Security Event ID 4624 (Logon) for user login activity around the timestamp of the alert to determine whether the RMM tool is being used legitimately by known personnel.

  - **Examine process creation events:** Check Sysmon Event ID 1 for process creation that contains 'connectwise' to identify if the RMM application was invoked by an authorized process or by a suspicious process.

  - **Query outbound connection logs:** Validate the network connection attempts within your firewall or proxy logs (e.g., Windows Event ID 5156 for Windows Filtering Platform) to confirm the destination hostname matches 'connectwise.com' and log additional fields such as SourceIPAddress and DestinationPort.

  - **Identify unusual timings or host roles:** Assess whether the connection was initiated from a high-value asset (like a domain controller) during unusual hours that deviate from typical operational patterns.

  - **Review for potential data exfiltration:** Investigate if any large file transfers (e.g., Windows Event ID 5145 for file share access) correlate with the alert, which may indicate attempts to exfiltrate sensitive data via the RMM tool.

  ### Prioritization

  This alert has a medium severity level due to the possible compromise of an asset used for remote management and monitoring. The likelihood of malicious use is elevated, given the common exploitation of legitimate administrative tools for nefarious purposes. However, frequent legitimate usage by support personnel may dilute the urgency of immediate action.

  ### Blind Spots and Assumptions

  Evasion techniques may include attackers utilizing legitimate accounts or non-standard hours for RMM access, complicating detection. Ensuring full logging configurations for firewall and system event logs is critical for reliable detection. Legitimate use cases involve IT support using the RMM tool to perform routine maintenance. A companion detection to consider is the monitoring of processes that include Remote Desktop Protocol (RDP) connections, which could work in tandem with RMM tool activity.

