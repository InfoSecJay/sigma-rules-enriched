note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the GetScreen Remote Monitoring and Management (RMM) tool, specifically targeting log files and session information generated by the application. The likely objective of an attacker using this tool could be unauthorized remote access or management of the compromised system, which may lead to data exfiltration or further exploitation. The relevant MITRE ATT&CK tactics and techniques for this behavior are Command and Control (T1071) and Exfiltration Over Command and Control Channel (T1219).

  The primary telemetry sources are Windows file event logs that capture operations on files within specified directories associated with the GetScreen application. If malicious, this activity can indicate an attacker leveraging a legitimate remote management tool for nefarious purposes. Importantly, this detection does not confirm the malicious intent of the file activity on its own, as the presence of these logs may also indicate legitimate use of the GetScreen tool by an authorized user.

  ### Investigation Steps

  - **Review file logs in specified directories**: Investigate the presence of files in `C:\ProgramData\Getscreen.me\` and `C:\Users\*\AppData\Local\Getscreen.me` using Windows Event ID 4663 (File Access). Look for unusual timestamps or suspicious users.

  - **Analyze log file content**: If log files (`<date>.log`, `<date>.gui.log`, or `session.inf`) are found, examine their content for connections to IP addresses or domains that are not typical for your organization. Legitimate use of GetScreen typically involves predictable access patterns and known IP ranges.

  - **Identify user accounts**: Determine which user account has generated or modified the files. Use Event ID 4624 (Logon) to assess the account’s legitimacy. Look for accounts with excessive privileges that are not typical for remote management tasks.

  - **Investigate network connections**: Check for outbound connections from the host to known malicious IPs or domains correlated with the GetScreen tool using network logs (e.g., firewall logs, IDS/IPS alerts). Malicious connections may involve unusual endpoint communication.

  - **Verify host role**: Confirm that the affected host is authorized to have remote management tools installed. Use asset management records to determine if this installation aligns with the organization's remote support procedures.

  - **Correlate with previous alerts**: Search the SIEM for any prior alerts or incidents relating to this tool or similar suspicious activity that could indicate persistent threats, enhancing the context of the investigation.

  ### Prioritization

  This alert is of medium severity due to the potential impact on affected systems, particularly if they contain sensitive information or critical business operations. The likelihood of malicious abuse is credible, as remote management tools are often weaponized for unauthorized access. Given that legitimate use cases exist, analysts must carefully evaluate the context of the alert.

  ### Blind Spots and Assumptions

  This detection may be circumvented by adversaries using obfuscation techniques or modifying file paths. Accurate detection relies on full logging enabled for Windows File Auditing; without this, significant activity may go unnoticed. Legitimate use cases for GetScreen can trigger these alerts, especially for IT support personnel. Companion detections, such as monitoring for unusual login patterns or network connections (related to T1071), can strengthen overall detection capabilities.

