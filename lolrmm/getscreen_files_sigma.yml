note: |
  ### Technical Context

  This Sigma rule detects file activities associated with the GetScreen remote management tool, specifically targeting log and configuration files that may indicate its usage. The likely attacker objective is to utilize the tool for unauthorized remote access or control over a compromised system. This activity aligns with MITRE ATT&CK technique Remote Services: Remote Management Software (T1219).

  The primary telemetry sources are Windows file system events, specifically file creations, modifications, and deletions within designated directories. If malicious, the presence of these files could indicate an adversary's intention to establish persistence or maintain control. However, this detection does NOT confirm that malicious activity is occurring; it merely indicates that the GetScreen tool has been used, which could also be legitimate.

  ### Investigation Steps

  - **Check file activity logs:** Review Windows Security Event ID 4663 or File System logs for create, modify, or delete actions specifically targeting `C:\ProgramData\Getscreen.me\` or any paths ending with `.gui.log` or `.inf`. Look for timestamps and user accounts associated with these actions.

  - **Identify user context:** Determine the user account accessing these files. Investigate if the account is associated with known administrative roles or if it shows unusual activity patterns, such as access from atypical locations.

  - **Correlate with remote connections:** Validate remote connections by checking for associated remote desktop or other remote management service logs (e.g., Event ID 4624 for logon events) occurring around the same timestamps. Look for RMM connections established by user accounts not typically associated with such activities.

  - **Examine endpoints for tool presence:** Search for the GetScreen installation on endpoints by checking `C:\Program Files\` and `C:\ProgramData\` for files related to GetScreen that are not part of standard deployment practices. The presence of GetScreen on systems without legitimate business need raises red flags.

  - **Review legitimate usage:** If GetScreen is used within your environment, document the context and usage patterns. Legitimate business processes should have associated documentation, including user roles that require RMM tools to verify the legitimacy of the detected activity.

  ### Prioritization

  The alert carries a medium severity due to the potential impact of unauthorized remote access, particularly if the affected system is a critical server or management workstation. While the likelihood of malicious abuse exists given the nature of RMM tools, such activities are less common than conventional attack methods, necessitating further investigation into the specific context.

  ### Blind Spots and Assumptions

  Evasion techniques may include users disabling logging or using other software to mask RMM usage. Reliable detection relies on capturing file system events; therefore, ensure file auditing is enabled on affected directories. Legitimate use of GetScreen in corporate environments, especially in IT support roles, may frequently trigger the alert. A companion detection that could strengthen coverage includes monitoring for suspicious account logons (e.g., Event ID 4624) to correlate with the file activities detected by this rule.

