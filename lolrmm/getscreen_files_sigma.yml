note: |
  ### Technical Context

  This rule detects file activity associated with the GetScreen remote monitoring and management (RMM) tool. The behavior indicates potential unauthorized usage of remote desktop management, which adversaries often leverage to maintain access to compromised systems or exfiltrate sensitive data. This detection maps to the MITRE ATT&CK technique for Remote Access Software (T1219) under the command-and-control tactic.

  The primary telemetry sources are Windows file event logs that capture changes related to specific target filenames associated with the GetScreen application. If the usage is malicious, the security impact could include unauthorized access to systems, data exfiltration, or lateral movement. It is important to note that this detection does NOT confirm malicious activity independently, as GetScreen may be used legitimately by personnel.

  ### Investigation Steps

  - **Review file creation events:** Check for Security Event ID 4663 entries related to `C:\ProgramData\Getscreen.me\session.inf` or `C:\Users\*\AppData\Local\Getscreen.me`. Look for timestamps corresponding with the alert to confirm if the file was created or modified.

  - **Validate legitimate usage:** Identify legitimate users who may use GetScreen RMM. Review user reports or internal policies that justify the installation of RMM tools and compare against logged user activity.

  - **Examine parent process information:** Analyze Sysmon Event ID 1 (Process Creation) for processes creating or accessing files in the above paths. A typical command line for a legitimate GetScreen usage may look like `Getscreen.exe --connect`.

  - **Identify suspicious file content:** Conduct file inspection on `session.inf` for any unexpected entries, scripts, or connections to external IPs. Check the presence of known malicious indicators, such as unusual IP addresses or domains.

  - **Check network connections:** Review outbound connection logs for any unusual connections originating from the host where GetScreen has been detected. Focus on event logs such as Windows Firewall with Event ID 5156 for connections that align with GetScreen's operational pattern.

  ### Prioritization

  Given that the affected system may have direct access to sensitive data and the increasingly common use of remote access tools by adversaries, this alert should be treated with medium severity. The risk of abuse via RMM tools is elevated due to their legitimate operational use in many environments, making monitoring critical.

  ### Blind Spots and Assumptions

  Possible evasion techniques include attackers disguising malicious RMM tools as legitimate software to avoid detection. The requirement for accurate detection necessitates comprehensive logging of file access events and process creation activities specifically from affected directories. Legitimate activities triggering this alert can include authorized system maintenance or remote support. A related detection rule could involve monitoring for unusual outbound traffic through remote access tools, enhancing overall telemetry coverage.

