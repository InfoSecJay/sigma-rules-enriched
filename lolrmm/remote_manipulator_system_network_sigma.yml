note: |
  ### Technical Context

  This Sigma rule detects potential network activity related to the Remote Manipulator System (RMM) tool, which could indicate unauthorized remote access or manipulation of systems within the network. The likely attacker objective is to establish a command and control (C2) channel through which they can remotely manage or exfiltrate data from compromised systems. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique for Remote Manipulation Tools (T1219).

  The primary telemetry sources for this detection are network connection logs from Windows systems, specifically focusing on outbound connections to hostnames ending in '.internetid.ru' or 'rmansys.ru'. If malicious, this activity poses a significant security risk, potentially allowing attackers to maintain persistence and control over compromised systems. However, it is essential to note that this detection does NOT confirm malicious intent on its own, as legitimate use of RMM tools by authorized personnel can produce similar network activity.

  ### Investigation Steps

  - **Correlate network connections:**
    Investigate the network connection logs (Windows Event ID 5156) for outbound connections to the specified domains. Identify the source IP, user account, and process associated with the connection. Determine if the process is a known legitimate application or service.

  - **Verify process legitimacy:**
    Check the process creation logs (Windows Security Event ID 4688) during the times of detected activity. Look for unusual parent-child process relationships, specifically any connections from unexpected executables launching the RMM tool or related activities.

  - **Identify legitimate RMM usage:**
    Review company policies around RMM tool use and cross-reference with identified user activity to ascertain if the connections are sanctioned. Assess the user group permissions and recent organizational communication regarding RMM tool deployment or testing.

  - **Analyze DNS query logs:**
    Review DNS logs (or relevant logs from your DNS server) for queries related to 'internetid.ru' and 'rmansys.ru' to establish if there are multiple client systems showing similar behavior. This could indicate widespread unauthorized usage.

  - **Check for Command and Control indicators:**
    Validate other associated indicators of compromise (IoCs), such as registered outbound traffic patterns and anomalies, which could reinforce the presence of a C2 infrastructure. This includes reviewing traffic volume, destination ports, and authentication failures tied to the events.

  ### Prioritization

  This alert has medium severity within an enterprise context. The potential impact on critical systems could allow adversaries to manipulate sensitive data or operations remotely. The likelihood of malicious abuse is moderate due to the known usage of RMM tools by threat actors for exploitation, making it essential to investigate promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate business use of RMM tools, potentially leading to false positives. Ensure that outbound network logs for Windows systems are adequately captured, as incomplete data could lead to missed detections. Additionally, authorized administrators might trigger alerts if legitimate maintenance is performed. Companion detections linked to unauthorized remote access attempts or known RMM IoCs can enhance coverage and validation efforts.

