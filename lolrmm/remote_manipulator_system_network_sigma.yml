note: |
  ### Technical Context

  This Sigma rule detects network connections by the Remote Manipulator System (RMM) tool, which is often used for unauthorized remote access or control of systems. An attacker may utilize this tool to maintain persistence, gather sensitive data, or perform lateral movement within an enterprise environment. This behavior aligns with the MITRE ATT&CK technique for Remote Access Tools (T1219).

  The primary log telemetry sources include Windows Network Connection logs, specifically those tracking outbound connections and their corresponding destination hostnames. Should the behavior be malicious, it signifies potential compromise of systems and possible data exfiltration. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative or support activities may utilize similar tools.

  ### Investigation Steps

  - **Identify the Host and User Initiating the Connection:** Check Windows Security Event ID 4624 (Login) to determine the user account and host from which the network connections are initiated, correlating the source IP and accounts involved.

  - **Examine Network Connection Logs:** Review the network connection logs (Windows Event ID 5156 or similar) focusing on `DestinationHostname`. Look for connections to '*.internetid.ru' or 'rmansys.ru'. Confirm if these domains match the expected use case or are indicative of malicious behavior.

  - **Analyze Recent Changes in Application Use:** Examine Software Inventory logs to identify any recent installations or use of RMM-related software. If identified, assess the legitimacy of the source and the user initiating these actions.

  - **Review Process Activity for RMM Tool:** Utilize Sysmon Event ID 1 to identify process creation events linked with RMM executables. Confirm legitimate process usage patterns by cross-referencing with known software lists.

  - **Correlate with Other Security Events:** Cross-examine findings with Windows Defender ATP alerts or similar endpoint detection alerts to validate suspicious behavior against known indicators (e.g., other indicators of compromise related to RMM usage).

  ### Prioritization

  This alert has a medium severity based on the potential impact of the affected system, as unauthorized access through RMM can lead to significant data loss or breach. The likelihood of malicious use is moderate; RMM tools are routinely abused in attacks but may also be legitimately used in some environments.

  ### Blind Spots and Assumptions

  Detection may be limited by overly permissive firewall rules that permit RMM traffic, potentially masking true intentions. Some legitimate administrative functions may also trigger this alert. Reliable detection hinges on proper logging of network connections and the presence of endpoint visibility solutions. Companion detections could include alerts for credential harvesting or lateral movement techniques associated with RMM use, strengthening overall coverage.

