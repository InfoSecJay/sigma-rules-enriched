  ### Technical Context

  This Sigma rule detects network connections to known domains associated with the Remote Manipulator System (RMM) tool, specifically targeting `*.internetid.ru` and `rmansys.ru`. Attackers may use RMM tools to gain remote access for the purpose of control, data exfiltration, or deploying additional payloads. The relevant MITRE ATT&CK tactic is "Execution" (TA0002), with the technique being "Remote Manipulation" (T1219). The primary telemetry source is Windows network connection logs, which include Event ID 5156 (Windows Filtering Platform) and various outbound connection logs.

  If used maliciously, this could compromise endpoint integrity, allowing attackers persistent access to perform various malicious activities. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate remote management activities by trusted administrators could produce similar network requests.

  ---

  ### Investigation Steps

  - **Verify the connection details:** Check outbound connections logged under Windows Filtering Platform Event ID 5156. Look specifically for connections to `*.internetid.ru` or `rmansys.ru`. Mark suspicious connections with service names that do not conform to known organizational remote management tools.

  - **Identify legitimate RMM usage:** Investigate if the organization uses RMM tools and match the logs against known legitimate IPs or hostnames. Gather evidence from IT operations to confirm scheduled maintenance or legitimate remote admin tasks.

  - **Correlate with user activity:** Review logs for user activity around the same timestamp as the detected connections. Examine Event ID 4624 (Logon events) to assess which users were logged in when the connections occurred. Unexpected logons, especially from non-administrative accounts, could indicate malicious activity.

  - **Inspect process creation related to the connection:** Check for corresponding process creation events (Event ID 4688). Identify any instances of processes that are uncommon or not whitelisted, especially those that establish the connections detected.

  - **Analyze traffic patterns:** Utilize flow logs or packet captures (PCAP) to analyze the content of the connections to `*.internetid.ru` or `rmansys.ru`. Look for patterns or unusual payloads that might confirm malicious intentions.

  - **Monitor for lateral movement attempts:** Review endpoints for signs of unauthorized attempts to access other systems post-establishing the connection. Utilize Event ID 4625 (failed logon attempts) to identify possible lateral movement attempts by the source of the detected connections.

  ---

  ### Prioritization

  This alert is of medium severity. The impact on affected systems could be significant if the RMM tool is exploited by an adversary. The likelihood of malicious use is moderate, as RMM tools are often legitimately used but also commonly abused for unauthorized remote access, making this behavior notable.

  ---

  ### Blind Spots and Assumptions

  Detection may miss legitimate use of RMM tools if organizations run such software under common domains or fail to monitor their configurations. There could be evasion techniques employed, such as using encrypted channels that are otherwise benign in legitimate contexts. Additionally, monitoring for connections from trusted IP ranges could help validate legitimate use. A related detection would involve monitoring for unexpected process creation alongside RMM connections, strengthening overall visibility and context.

