note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to known domains associated with the Remote Manipulator System (RMM) tool, which is commonly used for remote access and administration. Attackers may leverage RMM as part of a command-and-control (C2) infrastructure to manipulate compromised systems or exfiltrate data. The relevant MITRE ATT&CK tactic is "Command and Control" (T1071) with the technique being "Application Layer Protocol" (T1219).

  Primary telemetry sources include Windows network connection logs, specifically monitoring destination hostname connections. If this behavior is confirmed to be malicious, it may indicate ongoing compromise and control over the target system. However, this detection does NOT confirm malicious intent on its own, as legitimate administration activities may also trigger the alert.

  ### Investigation Steps

  - **Check network connections**: Review Windows security Event ID 5156 to identify the corresponding outbound connection to the destination host. Look for connections to `*.internetid.ru` or `*.rmansys.ru`. Legitimate activity would typically show no unusual connections outside expected business-related domains.

  - **Correlate with system changes**: Examine changes in system configuration or unauthorized installations in security Event ID 4688 (process creation). Look for processes associated with RMM tools during the time of the connection. Malicious indicators would involve these processes running without clear administrative purpose.

  - **Review firewall logs**: Inspect firewall logs (e.g., Windows Filtering Platform logs) for entries indicating blocked or allowed traffic to these RMM-related domains. Presence of repeated connection attempts may indicate malicious behavior.

  - **Analyze user activity**: Cross-reference user activity from Windows Security Log (Event ID 4624) with the timestamps of the detected network activity. Compare against user roles; if a non-administrative user is making connections to these domains, further investigation is warranted.

  - **Look for file artifacts**: Validate any installed RMM client health or logs by checking for administrative file creation in `C:\Program Files\RMM` or similar directories. Genuine RMM installations should correlate with entries in application logs.

  ### Prioritization

  This alert warrants medium severity due to the potential impact on targeted systems that could lead to complete compromise. The likelihood of malicious abuse is moderate, as RMM tools can be used in benign scenarios but have been increasingly weaponized in unauthorized access attempts.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logged connections to the specified domains due to network segmentation or poor logging practices. Legitimate remote administration activities may trigger the alert if conducted through these domains. Companion detection could include monitoring for anomalous user behavior or privilege escalation logs to reinforce total investigative coverage for this attack vector.

