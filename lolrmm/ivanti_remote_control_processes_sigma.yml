note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Ivanti Remote Control (RMM) tool, such as `IvantiRemoteControl.exe`, `ArcUI.exe`, and `AgentlessRC.exe`. The likely attacker objective is unauthorized remote access to a target system for reconnaissance, data exfiltration, or further exploitation. This behavior is associated with the MITRE ATT&CK technique "Remote Access Tools" (T1219).

  Primary telemetry sources include Windows process creation logs such as Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity could indicate compromised credentials or insider threat usage. However, this detection does NOT confirm malicious intent on its own; legitimate use of the Ivanti RMM tool is also common in network management.

  ### Investigation Steps

  - **Check process execution history:** Review Security Event ID 4688 and Sysmon Event ID 1 logs to identify the process creation details, specifically for `IvantiRemoteControl.exe`, `ArcUI.exe`, or `AgentlessRC.exe`. Compare timestamps with known maintenance windows and legitimate user activity.

  - **Validate parent process relationships:** Investigate the ParentImage field of related logs to ensure the associated parent processes are legitimate. Look for instances where these processes are initiated by unexpected or untrusted applications, indicating possible malicious usage.

  - **Assess user context:** Identify the UserID or account that executed these processes. Check against authorized personnel lists and work logs for any discrepancies, focusing on administrative or elevated privilege accounts that might be exploited.

  - **Determine remote access attempts:** Utilize network logs to check for anomalous external connections initiated by the detected Ivanti processes. Look for unusual IP addresses or geolocations that are not part of normal operations or maintenance routines.

  - **Review system modifications:** Check for any significant changes made by the detected processes, such as registry modifications or file system changes. Correlate these changes with the timestamps of the Ivanti processes to identify any unauthorized configuration alterations.

  - **Document legitimate usage patterns:** Confirm expected behavior by gathering data during approved RMM sessions. Collect user activity logs and session reports that validate legitimate usage of Ivanti tools.

  ### Prioritization

  This alert carries medium severity due to the risk presented by unauthorized remote access via the Ivanti RMM tool. The likelihood of malicious use is elevated, especially in environments where privileged accounts are compromised. This behavior is often weaponized in targeted attacks and should be treated with caution.

  ### Blind Spots and Assumptions

  This detection may be bypassed by legitimate users of the Ivanti RMM tool, leading to false positives if not contextualized with user behavior and role. Complete and systematic logging configurations for process creation and network access must be in place for reliable detection. Additionally, standard operational activities, like routine remote access for system administration, may trigger this alert. A companion detection for additional remote access tools could enhance security coverage, especially for tools such as TeamViewer or AnyDesk.

