note: |
  ### Technical Context
  This detection rule monitors for the potential use of the Ivanti Remote Control (RMM) tool by identifying specific processes associated with its operation. The Ivanti RMM tool is typically used for remote administration and support, allowing IT personnel to access and manage systems remotely. However, malicious actors may leverage legitimate remote access tools like Ivanti RMM to conduct unauthorized activities, such as lateral movement within a network or exfiltration of sensitive data.

  The threat scenario likely involves an attacker who has gained a foothold within the environment and is using the Ivanti RMM tool to manipulate systems remotely, potentially aiming to escalate privileges or deploy further malicious payloads. This behavior correlates with the MITRE ATT&CK techniques such as "Remote Services" (T1219), which describes the use of legitimate remote access tools to perform malicious actions.

  Relevant primary data sources for this rule include Windows process creation logs, which can provide insights into what applications were initiated on endpoints, particularly those related to remote management activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation events to identify instances of `IvantiRemoteControl.exe`, `ArcUI.exe`, or `AgentlessRC.exe`. Investigate the parent processes to see if they indicate suspicious activity.

  - **Correlate Parent Process Information**: Investigate the origin of the parent processes that spawned the Ivanti RMM tool. Look for any unusual or unauthorized applications initiating these processes, which may signify malicious intent.

  - **Analyze User Context**: Check the user accounts executing the Ivanti RMM processes. Ensure that these accounts have legitimate reasons for using remote access tools, and verify if the actions align with the organization’s authorized practices.

  - **Investigate Network Activity**: If available, cross-reference network logs to assess any unusual connections initiated by these processes. Look for outbound traffic to unrecognized IP addresses that may indicate data exfiltration.

  ### Prioritization
  This alert is classified with a medium severity due to the potential misuse of legitimate remote control software in a corporate environment. While it could represent normal IT operations, its association with unauthorized access warrants immediate investigation to prevent possible security breaches.

  ### Blind Spots and Assumptions
  The detection logic assumes that all instances of the indicated Ivanti processes are suspicious, which may not account for legitimate administrative use, potentially leading to false positives. Furthermore, this detection may not identify all instances of unauthorized use, particularly if adversaries rename processes or employ other evasion techniques. The rule relies on the availability of complete and accurate Windows process creation logs to function effectively, which must be appropriately configured in the organization's logging policy.

