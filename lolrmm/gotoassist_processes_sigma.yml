note: |
  ### Technical Context

  This rule detects the execution of processes related to the GoToAssist remote management tool, which can be used for remote support and administrative functions. Malicious actors may leverage GoToAssist or similar tools to maintain persistence, exfiltrate data, or remotely control compromised systems. This behavior aligns with the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry source for this detection is Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which log detailed information about process creation. If these processes are legitimately used, they do not inherently indicate malicious activity; however, their presence in unusual contexts could suggest unauthorized use. This detection does NOT confirm malicious intent on its own, as GoToAssist is also commonly employed for legitimate support activities.

  ### Investigation Steps

  - **Check process creation logs for GoToAssist:** Query Windows Security Event ID 4688 to list processes launched with images ending in `gotoassist.exe`, `g2a*.exe`, or similar patterns. Look for unusual parent processes that are not typical for remote support activities.

  - **Review parent process context:** Analyze the parent process (e.g., PowerShell, cmd.exe) associated with the detected GoToAssist processes. Malicious activity might involve PowerShell scripts that invoke GoToAssist, which is atypical of legitimate use cases.

  - **Verify account usage:** Identify the user account that started the GoToAssist process. Legitimate usage typically involves corporate support accounts. Investigate any unknown or unexpected users, especially on critical systems.

  - **Analyze network connections:** Review current and recent network connections tied to processes matching the GoToAssist identifiers. Utilize firewall or network logs to check for unusual outbound connections to untrusted IP addresses or geolocations not related to organizational business functions.

  - **Cross-reference with asset inventory:** Validate whether the system is known to be used for remote support, specifically checking whether it is part of the asset inventory that employs GoToAssist legitimately. Non-inventory systems exhibiting this behavior warrant deeper investigation.

  - **Identify strong indicators of compromise:** Look for established malicious patterns, such as process creation from a non-standard directory (e.g., `C:\Users\<User>\Temp`) or unusual execution times (e.g., at odd hours) that deviate from normal operational behavior.

  ### Prioritization

  Alerts generated by this rule should be treated as medium priority due to the potential severity of unauthorized remote access. The likelihood of abuse is based on observed persistence mechanisms by adversaries. Though GoToAssist has legitimate applications, its exploitation is documented, making it a reasonable point of concern.

  ### Blind Spots and Assumptions

  This detection may encounter evasion techniques such as adversaries renaming executables or using other remote access tools that could mimic GoToAssist behavior. Reliable detection requires proper logging configurations for Security Event ID 4688 and Sysmon logging enabled. Legitimate technical support activities may trigger this alert, necessitating context-sensitive investigation. Pairing this detection with alerts for anomalous user activities can enhance coverage and context for ongoing investigations.

