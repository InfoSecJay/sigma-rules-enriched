note: |
  ### Technical Context

  This rule detects potential process activity associated with the GoToAssist Remote Management Tool (RMM). The likely attacker objective is to gain unauthorized access and control over a target system using legitimate remote support software, which can facilitate data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry sources include Windows process creation logs, specifically tracking instances where processes related to GoToAssist are initiated. If the activity is malicious, it can lead to unauthorized remote access and data compromises. It's crucial to note that the detection of these processes does not, by itself, confirm malicious intent; benign use of GoToAssist is common in many corporate environments.

  ### Investigation Steps

  - **Identify the Process Creation Events**: Review Security Event ID 4688 for the creation of processes ending with `gotoassist.exe`, `g2a*.exe`, and `g2mcomm.exe`. Look for anomalies in their parent processes, as unexpected execution can indicate unauthorized use.

  - **Verify Parent Process**: Examine the parent process of detected GoToAssist executables in Sysmon Event ID 1. Malicious use often has unusual parent processes such as those that are not typically involved in remote support activities.

  - **Check User Account Activity**: Investigate the user account executing GoToAssist processes by checking the `SubjectUserName` and `SubjectDomainName` fields in Security Event ID 4624 (Logon). Determine whether this is a legitimate user or if the account shows signs of compromise.

  - **Review Access Path and Arguments**: In the process creation logs, validate the file access path for GoToAssist executables. Strings in `CommandLine` should be scrutinized for unusual arguments that could suggest malicious intent.

  - **Assess Regular Usage**: Determine what legitimate access patterns look like for your organization by comparing this activity with historical logs, particularly focusing on typical usage times and associated user accounts.

  - **Correlate with Network Activity**: Cross-reference with network logs for unusual outbound connections during the time these processes are active. Traffic to remote support IPs or unusual communication patterns could indicate exploitation.

  ### Prioritization

  This alert is of medium severity due to the potential impact of unauthorized access to systems, especially on sensitive assets. The likelihood of malicious abuse is moderate, as adversaries can leverage GoToAssist for both legitimate support and malicious actions. While not commonly weaponized, the misuse of RMM tools is a growing concern.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where adversaries may rename or modify GoToAssist executables. Reliable detection also requires accurate and comprehensive logging configurations that capture all process creation events. Legitimate business activities may trigger this alert during authorized support sessions. Related detections might include monitoring for unusual inbound remote desktop connections (e.g., RDP or other remote software) that can complement the identification of unauthorized remote access attempts.

