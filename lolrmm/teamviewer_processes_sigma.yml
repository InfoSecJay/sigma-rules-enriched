note: |
  ### Technical Context

  This Sigma rule detects the execution of processes related to the TeamViewer Remote Management Tool (RMM), specifically when they are spawned by either `teamviewer_desktop.exe` or `teamviewer_service.exe`. The behavior can indicate both legitimate administration activities or potentially unauthorized remote administration by an adversary. Attackers may leverage tools like TeamViewer to maintain access to compromised systems, enabling data exfiltration or further exploitation.

  The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically under the technique Remote Access Software (T1219). Primary telemetry sources include Windows Security Event ID 4688 (process creation events) that log process initiation and parent-child relationships. If malicious, this type of access could lead to significant security impacts, including data leakage or unauthorized control over systems. However, this detection alone does not confirm malicious activity; legitimate use of TeamViewer may trigger the same alerts without indicating compromise.

  ### Investigation Steps

  - **Check for legitimate TeamViewer usage:** Review the system's policy and authorized remote access tools. Analyze historical usage patterns to determine whether the detected processes align with known IT admin activities.

  - **Review Process Creation Logs:** Retrieve Windows Security Event ID 4688 logs, focusing on the `Image` and `ParentImage` fields. Look for occurrences of `teamviewer_desktop.exe` or `teamviewer_service.exe` being executed with a parent process also related to TeamViewer, which may indicate legitimate activity.

  - **Analyze Parent Process Context:** Investigate the parent processes of the detected TeamViewer executables. A legitimate parent process such as a known admin tool or user-initiated command suggests benign use, while suspicious parent processes may indicate malicious intent.

  - **Correlate User Activity:** Examine recent user activity around the time of the alert. Look for similar patterns in User Accounts (Event ID 4624) to assess if the session correlates with authorized personnel or unusual accounts accessing the environment.

  - **Identify abnormal behavior:** If TeamViewer processes are running in connection with unusual outbound network activity (check for TCP/IP traffic on common TeamViewer ports such as 5938) or unusual system-level changes, classify this as a high-confidence malicious indicator.

  ### Prioritization

  This alert has medium severity primarily due to the potential for significant impact on affected systems through unauthorized remote access. Given that tools like TeamViewer can be weaponized by attackers for persistence and command execution, it is critical to assess the context in which this alert occurred to ascertain its legitimacy or malicious nature.

  ### Blind Spots and Assumptions

  Detection is limited by the prevalence of legitimate TeamViewer usage, which may generate similar alerts without malicious intent. The reliability of this detection relies on proper logging configurations and the visibility of Windows Event ID 4688. Additionally, benign administrative actions involving TeamViewer could lead to false positives. A related detection for the presence of known remote access tools (e.g., AnyDesk, Chrome Remote Desktop) could strengthen overall monitoring efficacy.

