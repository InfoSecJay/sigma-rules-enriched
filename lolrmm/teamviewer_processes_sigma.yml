note: |
  ### Technical Context

  The rule detects the execution of processes associated with TeamViewer RMM (Remote Monitoring and Management) tools, specifically looking for processes spawned from `teamviewer_desktop.exe` or `teamviewer_service.exe`. Attackers may leverage such tools to maintain persistence, remotely control systems, or exfiltrate sensitive information, often when exploiting existing access.

  This behavior aligns with the MITRE ATT&CK technique for “Remote System Access” (T1219). The primary telemetry sources include Windows process creation logs, such as Security Event ID 4688, which detail process spawn events. If the activity is malicious, it could indicate compromised systems being accessed without legitimate user consent or open backdoors for further exploitation.

  It's crucial to understand that this detection alone does not confirm malicious activity, as legitimate administrative or remote support use of TeamViewer does occur in many environments.

  ---

  ### Investigation Steps

  - **Check process initiation context:** Review Windows Security Event ID 4688 logs for the creation of any processes that started from `teamviewer_desktop.exe` or `teamviewer_service.exe`. Validate that the parent process is a known and trusted administrative process.

  - **Analyze process execution details:** Examine the command-line arguments in the event logs for Event ID 4688. Legitimate usage typically includes base command structures, while unusual parameters may indicate misuse or malicious intent.

  - **Verify user activity:** Look for User Account Control (UAC) logs or User Activity logs related to the account spawning the TeamViewer processes. Authorized remote support staff will typically have a clear purpose for using TeamViewer.

  - **Inspect the network connections:** Use network monitoring tools to check if the spawned TeamViewer processes are making outbound connections to known or suspicious IP addresses. Malicious indicators may include connections to non-corporate networks or geographical anomalies.

  - **Assess the asset's criticality:** Identify if the affected system is a critical or sensitive asset (e.g., domain controllers, financial systems). Increased scrutiny is warranted if such systems are involved.

  - **Identify related potential file activity:** Look for signs of file transfer activities associated with TeamViewer, such as temporary files created by the process that may contain extracted data indicative of data exfiltration.

  ---

  ### Prioritization

  This alert carries a medium severity in the enterprise context due to the potential for unauthorized remote access and manipulation of sensitive resources. The likelihood of malicious abuse exists, especially if TeamViewer procedures do not align with established organizational practices. Attackers often weaponize remote management tools like TeamViewer to bypass security controls.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through alternate user-defined process names or configurations that obscure legitimate activities. Ensure comprehensive logging of process creations and associated command-line arguments is enabled for effective detection. Legitimate IT support activities using TeamViewer could trigger this alert during authorized remote assistance. Related detections may include monitoring outbound connections via Windows Firewall logs, providing further context for behaviors linked to TeamViewer usage.

