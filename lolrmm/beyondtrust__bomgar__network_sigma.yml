note: |
  ### Technical Context

  This Sigma rule detects unauthorized network activity targeting BeyondTrust (Bomgar) remote management tool endpoints. Such behavior often indicates an attacker attempting to leverage established remote management tools for command and control (C2) or lateral movement within an environment. The relevant MITRE ATT&CK technique is Command and Control via Application Layer Protocol (T1219).

  The primary telemetry source is network connection logs that indicate outbound requests to known Bomgar cloud hostnames, specifically to domains ending with "*.beyondtrustcloud.com" and "*.bomgarcloud.com." If the detected activity is malicious, it could potentially allow adversaries to gain remote access to systems and exfiltrate sensitive data. This detection does not confirm that an unauthorized session was established or that any additional malicious activity occurred.

  ### Investigation Steps

  - **Check network connections:** Review the network connection logs for Event ID 5156 (Windows Filtering Platform) or equivalent Sysmon Event ID 3. Confirm if connections were made to domains ending with "*.beyondtrustcloud.com" or "*.bomgarcloud.com" within the last hour.

  - **Identify the source of the connection:** Investigate the originating process or user for the detected outbound traffic (look for Event ID 4688 or Sysmon Event ID 1) to determine if it came from an authorized administrative tool or a potentially unauthorized application.

  - **Review related sessions:** Examine if any other outbound connections were made to non-standard ports, particularly ports commonly associated with RMM tools (e.g., TCP 443, TCP 80) and note user account activity patterns.

  - **Confirm legitimate usage:** Verify whether the connections to Bomgar domains correlate with documented maintenance or support sessions conducted by IT teams. These should align with scheduled access windows.

  - **Assess process legitimacy:** Cross-reference processes making these connections against a whitelist of known trusted applications within the organization. Any unknown processes attempting to make such connections may indicate a security incident.

  - **Monitor for follow-up actions:** Investigate subsequent log entries (e.g., data transfer logs, Event ID 4624 for user logins) for any unauthorized file access or manipulation that follows the initial network activity, indicating potential exfiltration or lateral movement.

  ### Prioritization

  This alert is of medium severity due to the potential impact on sensitive systems managed by BeyondTrust. While remote management tools are commonly used for legitimate IT support, their abuse for unauthorized access is a recognized and increasingly weaponized tactic among threat actors. Prompt investigation is essential to assess potential malicious behavior.

  ### Blind Spots and Assumptions

  This detection may miss malicious activity if attackers employ domain fronting or spoof legitimate connections. Reliable detection requires proper logging configurations for network connection events and a thorough understanding of legitimate application usage to avoid false positives. Routine administrative tasks involving BeyondTrust should be validated against expected behavior and session logs. A companion detection focusing on abnormal internal access attempts or account logins might enhance overall monitoring efficacy.

