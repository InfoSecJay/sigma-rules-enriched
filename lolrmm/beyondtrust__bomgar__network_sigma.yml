note: |
  ### Technical Context

  This rule detects network connections to domains associated with BeyondTrust (Bomgar), a remote management tool often used by IT support teams. Attackers may use this tool for unauthorized remote access or to facilitate lateral movement within an environment. The relevant MITRE ATT&CK tactic is "Execution" and the technique is T1219 (Remote Access Software). The primary telemetry sources are Windows network connection logs, focusing on the destination hostname.

  If exploited, the security impact could be significant, allowing attackers to gain control over systems and exfiltrate sensitive data. It is critical to note that this detection does not confirm malicious intent on its own, as legitimate use of BeyondTrust may result in similar network activity.

  ### Investigation Steps

  - **Check connection destination**: Review network connection logs for destination hostnames ending with "*.beyondtrustcloud.com" or "*.bomgarcloud.com". Legitimate connections will typically originate from authorized IT support personnel using the tool.

  - **Examine process associations**: Investigate any processes associated with the network connections (e.g., via Security Event ID 4688 or Sysmon Event ID 1) to confirm if a known process (like "svc.exe" or "Bomgar.exe") initiated the network connection.

  - **Review authentication logs**: Check for successful logins to systems utilizing BeyondTrust (Windows Security Event ID 4624). Review for unusual account behavior or logins during off-hours, which may indicate malicious access.

  - **Validate user roles and permissions**: Analyze user roles identified in the connection logs. Confirm if the user has legitimate administrative rights to access systems remotely via BeyondTrust, as unexpected user accounts may indicate credential compromise.

  - **Look for data exfiltration indicators**: Monitor for large data transfers occurring after connections to BeyondTrust servers, checking for unusual outbound connections or high data volumes in Windows Firewall logs or network monitoring tools.

  ### Prioritization

  This alert carries a medium severity level due to the potential risk of unauthorized remote access. The likelihood of malicious abuse is notable, as BeyondTrust is often weaponized by attackers against systems it has legitimate access to. Given the tool's nature, it is crucial to treat related alerts with a heightened sense of urgency.

  ### Blind Spots and Assumptions

  Limitations include potential evasion if attackers use legitimate accounts or established whitelisted domains to masquerade their activity. Accurate detection relies on comprehensive logging and monitoring of network connections to BeyondTrust servers. Legitimate remote support sessions may trigger this alert, particularly during scheduled maintenance windows. A related detection could include monitoring unauthorized software installation logs to catch instances of BeyondTrust being installed without proper governance.

