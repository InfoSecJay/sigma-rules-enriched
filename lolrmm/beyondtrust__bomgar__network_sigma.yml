note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the BeyondTrust (Bomgar) Remote Management Tool (RMM). The rule aims to flag communication to BeyondTrust's cloud services, specifically targeting instances where systems connect to domains like `*.beyondtrustcloud.com`, `*.bomgarcloud.com`, or `bomgarcloud.com`. Such connections may indicate unauthorized use of the RMM tool, potentially leveraged by attackers for remote access to compromised systems.

  In a threat scenario, an adversary might exploit the BeyondTrust RMM to gain persistent remote access to systems in an enterprise environment, allowing them to execute commands, exfiltrate data, or further navigate the internal network. Their objective could be data theft or lateral movement within the organization, making it critical to monitor these communications closely.

  This detection relates to the MITRE ATT&CK techniques T1219 (Remote Access Software) and the broader category of Execution. Monitoring network connections to known RMM tools like BeyondTrust is essential for identifying potential illicit access attempts.

  Primary data sources for this detection include:
  - Network connection logs from firewalls or EDR solutions that capture outbound communication requests.
  - Proxy logs, which can provide additional context on user activity attempting to access these cloud services.

  ### Investigation Steps
  - **Verify Network Activity:** Review the network connection logs for any unusual connections to domains related to BeyondTrust. Cross-reference these with user accounts to identify any unauthorized or suspicious access attempts.
  - **Assess User Context:** Identify which user initiated the connections to the BeyondTrust domains. Determine if this access aligns with legitimate administrative activities or if it raises flags for further investigation.
  - **Examine System Integrity:** Investigate the endpoints establishing connections to BeyondTrust cloud services. Check for unauthorized installations of RMM software and review running processes to identify potentially malicious behavior.
  - **Correlate with Other Alerts:** Look for other alerts or logs that might indicate unusual behavior, such as privilege escalation or suspicious file access patterns, that could be related to the use of the RMM tool.

  ### Prioritization
  This alert carries medium severity as unauthorized use of a legitimate remote access tool can lead to severe security incidents, including data breaches or lateral movement within the network. The risk is heightened in environments where administrative access must be tightly controlled.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the potential for legitimate uses of BeyondTrust RMM, which can generate false positives. The detection logic assumes that any connections to specified BeyondTrust domains are suspicious without considering contextual factors, such as verified administrative activities. To ensure the alert functions effectively, logging of outbound network connections should be enabled on firewalls, alongside adequate integration of network monitoring tools to correlate activity with user context.

