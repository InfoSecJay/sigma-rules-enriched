note: |
  ### Technical Context

  This Sigma rule detects network connections to BeyondTrust (Bomgar) RMM endpoints, which are often utilized for remote access and support. Attackers may exploit these tools to establish command-and-control (C2) channels, conduct reconnaissance, or control compromised systems. The relevant MITRE ATT&CK tactics and techniques involved are **Command and Control (T1071)** and **Application Layer Protocol (T1219)**.

  Primary telemetry sources include Windows network connection logs, specifically looking at DNS queries and outbound connection events. If malicious, the impact could be significant as attackers could bypass security measures and remotely manipulate systems unnoticed. However, this detection alone does not confirm malicious intent since legitimate administrative activities could generate similar network traffic.

  ### Investigation Steps

  - **Confirm data source validity: **Analyze Windows Event Logs for outbound connections using Event ID 5156 (Sysmon Network Connect) for additional detail regarding the connections to BeyondTrust endpoints.

  - **Check connection frequency and timing: **Evaluate how often and when connections to *.beyondtrustcloud.com or *.bomgarcloud.com occur. Frequent unexpected connections, especially during non-business hours, may indicate malicious behavior.

  - **Investigate user context: **Identify the user or service account initiating the connections. Legitimate administrative use of BeyondTrust should be tied to known IT personnel; unknown or suspicious accounts should be scrutinized.

  - **Validate additional artifacts: **Search for associated processes using Sysmon Event ID 1 (Process Creation) to see if any suspicious executables are executing the network connections, particularly any unusual user-level applications.

  - **Establish baseline behavior: **Document expected usage patterns for BeyondTrust in the environment. For legitimate activity, there should be clear documentation of devices and users who are authorized to utilize this tool.

  - **Look for lateral movement signals: **Review for additional indicators of lateral movement, such as suspicious PowerShell scripts (Event ID 4104), which could indicate that BeyondTrust is being used as part of broader attack activities.

  ### Prioritization

  The alert is marked as medium severity due to the potential impact of remote access tools in the environment. While legitimate use cases exist, the likelihood of malicious abuse, especially in compromised environments, is notable, as attackers often weaponize RMM tools for C2 purposes.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of encrypted communications or modifying legitimate application behavior to masquerade as normal traffic. Reliable detection requires appropriate logging configurations, specifically for outbound network connections. Legitimate activities such as IT support sessions might also trigger this alert, emphasizing the need for contextual awareness. A related detection could involve monitoring for internal DNS queries to known malicious domains that could indicate system compromise or lateral movement attempts.

