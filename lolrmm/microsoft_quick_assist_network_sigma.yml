  ---

  ### Technical Context

  This Sigma rule detects network activity associated with the Microsoft Quick Assist remote management tool, which may be used by attackers to establish remote sessions or facilitate unauthorized access to user systems. Attackers utilizing Quick Assist often aim to gain control over a target machine, either for data exfiltration, lateral movement, or direct exploitation. This behavior aligns with the MITRE ATT&CK tactic of Remote Execution (Execution) and the technique T1219 (Remote Access Software).

  The primary telemetry source is Windows network connection logs that can capture destination hostnames targeted by Quick Assist, specifically those ending with "*.support.services.microsoft.com" or related user-managed hosts. If malicious activity is confirmed, it could lead to unauthorized user interaction and potential data breach. This detection does NOT confirm the malicious intent of the user or guarantee exploitation without additional context.

  ---

  ### Investigation Steps

  - **Identify network connection events:** Review Windows Network Connection logs for Event ID 5156 where `DestinationHostname` ends with ".support.services.microsoft.com" or "user_managed". Note the timestamp and source IP.

  - **Validate legitimate use cases:** Check for documented use of Microsoft Quick Assist within your organization. Users should have clear business justification for invoking this tool.

  - **Correlate user activity:** Examine the Security Event logs (Event ID 4624) for the user account associated with the network connection. Validate the account's recent activities; frequent remote assist usage could indicate a benign use case.

  - **Check for high-confidence malicious indicators:** Identify any unauthorized sessions initiated through Quick Assist during non-business hours or from unusual geographic locations. Document the session details, source, and destination IP addresses.

  - **Analyze process execution:** Confirm any associated process creation related to Quick Assist. Examine Sysmon Event ID 1 for unusual parent-child relationship patterns that may indicate exploitation rather than legitimate use.

  - **Assess asset criticality:** Cross-reference the system initiating the connection against asset classification. Servers or high-value endpoints initiating connections to Quick Assist services warrant higher scrutiny.

  ---

  ### Prioritization

  This alert holds medium severity due to the potential impact on user systems and the likelihood of misuse. Remote management tools like Quick Assist are frequently exploited by adversaries, making this a relevant detection amidst common cybersecurity threats.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations since legitimate support scenarios may trigger the alert. It relies on comprehensive logging of network connections, so ensure Windows Firewall logs are enabled. Common benign activities include IT support teams leveraging Quick Assist for troubleshooting. Consider correlating with additional detections related to system process anomalies or unusual remote desktop activity to strengthen coverage.

