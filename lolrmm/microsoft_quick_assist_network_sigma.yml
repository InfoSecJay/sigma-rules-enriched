note: |
  ### Technical Context

  This Sigma rule detects network activity related to the Microsoft Quick Assist remote management (RMM) tool. An attacker may utilize this tool for remote access and support to execute malicious actions on targeted machines. The relevant MITRE ATT&CK tactic is “Execution” and the corresponding technique is “Remote Services” (T1219). The primary telemetry source is Windows network connection logs, focusing on destination hostnames that end with 'user_managed' or '.support.services.microsoft.com'. If malicious, this activity could lead to unauthorized access to sensitive systems and data. However, this detection does NOT confirm malicious activity by itself, as it may represent legitimate remote support functions.

  ### Investigation Steps

  - **Verify destination hostnames:** Check network connection logs for connections to destination hostnames ending in 'user_managed' or '*.support.services.microsoft.com' (Event ID 5156 or Sysmon Event ID 3). Legitimate Quick Assist connections are expected to be infrequent and should align with known support activities.

  - **Correlate with user activity:** Review Windows Security Event ID 4624 (Logon) and correlate logon events with the timing of Quick Assist connections. Look for logins from known administrative users during normal business hours. Unexpected connections from non-administrative accounts may indicate malicious use.

  - **Examine process creation logs:** Look into Sysmon Event ID 1 and Windows Event ID 4688 to identify parent-child relationship of processes. The creation of unusual processes in conjunction with Quick Assist activity can indicate potential exploitation.

  - **Assess network behavior:** Analyze outbound network traffic patterns for anomalies related to established connections via Quick Assist. Abnormal volumes of data or connections may indicate unauthorized remote sessions or data exfiltration attempts.

  - **Identify potential evasions:** Keep an eye on if an adversary uses reflection or tunneling to disguise Quick Assist activity. Look for established connections that are unexpectedly routed through legitimate services before reaching intended targets.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems being accessed by remote management tools, which can facilitate compromise and data exfiltration. While Quick Assist is not commonly weaponized by adversaries, its legitimate use can easily be misappropriated, making it crucial for vigilant assessment in enterprise environments.

  ### Blind Spots and Assumptions

  Detection limitations include the legitimate use of Microsoft Quick Assist, which may trigger false positives. Comprehensive logging configurations for network connectivity and process creation are required for reliable detection. User-initiated remote support sessions may not constitute malicious activity. Companion detections, such as monitoring for unusual process creation or unauthorized remote access attempts, can strengthen coverage against misuse of remote management tools.

