note: |
  ### Technical Context

  This rule detects network activity associated with Microsoft Quick Assist, a Remote Management Tool (RMM) primarily used for providing support and assistance to end-users. Attackers may leverage Quick Assist to establish remote access to target systems under the guise of legitimate support or administration activities. In the MITRE ATT&CK framework, this behavior relates to the Command and Control tactic (T1071 - Application Layer Protocol) and specifically targets the use of legitimate services to maintain a connection with compromised systems.

  The primary telemetry source for this detection is network connection logs, specifically focusing on events related to TCP/IP connections to certain destination hostnames. If malicious, such activity can indicate unauthorized remote access to systems, leading to potential data exfiltration or persistent, undetected access. This detection does not confirm malicious intent without further investigation, as legitimate use of the Quick Assist tool can generate similar network behaviors.

  ### Investigation Steps

  - **Review network connection logs**: Examine network connection logs for Event ID 5156 (Windows Filtering Platform) to identify connections established to `*.support.services.microsoft.com` or any `*user_managed` domains, checking for timestamps and source IP addresses.

  - **Check for authorized use**: Identify if the connections were initiated by known support personnel or during scheduled support sessions. Look for consistent IP addresses or users associated with legitimate use of Quick Assist.

  - **Correlate with application logs**: Search for application-specific logs (Windows Event ID 4688) for process creation events linked to the Quick Assist executable (`quickassist.exe`). Verify legitimate user activity around the same timeframe.

  - **Identify anomalous source behavior**: Investigate any source IP addresses or machines making unusual or excessive connections to Quick Assist hostnames. Check for signs of enumeration or brute-force attempts that fall outside expected user patterns.

  - **Analyze for unauthorized file transfers**: Look for file creation events (Event ID 4663) linked with Quick Assist sessions, confirming whether there are any transferred files indicative of data exfiltration.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on critical systems if used by an unauthorized user. While the likelihood of malicious abuse exists, especially in environments where unauthorized remote access tools may be restricted, legitimate support activities could also trigger this alert, necessitating thorough investigation.

  ### Blind Spots and Assumptions

  Common evasion techniques may include using a VPN or proxy to disguise the originating IP of Quick Assist traffic. The effectiveness of this detection relies on the logging configuration of Windows Filtering Platform and security event logging; without these logs, the detection may be incomplete. Legitimate activities that may trigger this alert include authorized IT support or Help Desk personnel using Quick Assist for remote troubleshooting. Companion detections can be established around unauthorized use of RMM tools; monitoring application installations or execution of remote support applications can enhance overall coverage.

