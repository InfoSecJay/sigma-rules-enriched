  ---

  ### Technical Context

  This Sigma rule detects network connections made by the Microsoft Quick Assist remote management tool, particularly to Microsoft support domains. The likely attacker objective could be to leverage this tool for unauthorized remote access or to assist in further malicious activities. This behavior falls under the MITRE ATT&CK tactic of Remote Execution (Tactics: Execution, Technique: Remote Services - T1219).

  The primary telemetry source is Windows network connection logs, which can capture the destination hostname and connection details. If malicious, this could lead to unauthorized access and control over the affected system. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use of Quick Assist is common for remote support.

  ---

  ### Investigation Steps

  - **Examine network connection details:** Review Windows event logs for network connections (Event ID 5156) pointing to *.support.services.microsoft.com. Focus on timestamps and the initiating user account to establish the legitimacy of the connection.

  - **Identify the user’s activity before the connection:** Check for logged activities (Event ID 4688) related to process creation, looking for the execution of Microsoft Quick Assist or other remote assistance tools in correlation with the network activity for the same time frame.

  - **Validate legitimate use cases:** Investigate whether a support session had been scheduled to justify the use of Quick Assist (e.g., if the user had a ticket open with IT or was seeking help). Cross-reference with ticketing system logs for validation.

  - **Look for anomalous patterns:** Analyze connection requests for unusual times (e.g., evenings or weekends) or from users without a history of using Quick Assist. This could indicate a potential compromise or misuse of the application.

  - **Identify high-confidence malicious indicators:** Search for persistent network connections; connections made outside of known operational hours (especially under normal behavior patterns for the user in question) can indicate malicious intent.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential for unauthorized remote access through Quick Assist. While common in legitimate helpdesk scenarios, the likelihood of abuse exists, particularly if further malicious activity is detected in conjunction with this alert.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Quick Assist within the organization, which can generate similar alerts. Required logs must include complete network connection records; without them, potential malicious behavior may be missed. Additionally, this alert may trigger from legitimate IT support activities, such as established remote sessions. A companion detection for monitoring anomalous logins (such as Azure AD sign-ins) could strengthen coverage against this behavior.

