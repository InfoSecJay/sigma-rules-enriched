note: |
  ### Technical Context

  This rule detects the execution of the Splashtop Remote Management (RMM) tool, specifically processes with the executable name `strwinclt.exe`, which serves as a client-side component for remote support and management. An attacker may use this tool for unauthorized access to perform actions such as reconnaissance, lateral movement, or data exfiltration, aligning with the MITRE ATT&CK technique for Remote Access Software (T1219).

  The primary telemetry source is Windows process creation logs, particularly focusing on Security Event ID 4688, which details new processes along with their parent processes. If malicious in nature, the presence of this tool could compromise sensitive systems, enabling attackers to manipulate systems remotely. Importantly, this detection does NOT confirm that malicious activity has occurred on its own, as the tool can be legitimately used for remote support.

  ### Investigation Steps

  - **Check process details**: Review Security Event ID 4688 logs for `strwinclt.exe` creation. Look for any unusual parent processes, especially non-standard user accounts that could indicate malicious activities.

  - **Examine user accounts**: Determine the user account executing `strwinclt.exe` by checking the `SubjectUserName` and `SubjectDomainName` fields in Event ID 4688. Accounts with administrative privileges or anomalies in login times may signify potential misuse.

  - **Identify known benign activity**: Verify if `strwinclt.exe` usage corresponds with regular support activities from trusted support teams. Document expected execution times, common user accounts, and specific endpoints involved in remote support.

  - **Analyze network connections**: Inspect logs from Windows Firewall or network monitoring tools for outbound connections initiated by the `strwinclt.exe` process. Particularly look for unusual IP addresses or ports, which could indicate command-and-control communication.

  - **Investigate related process trees**: Review parent-child relationships in process creation events to see if `strwinclt.exe` is spawned by a legitimate application like an admin tool or if it appears after suspicious activity, indicating possible exploitation.

  - **Collect additional artifacts**: Look for temporary files created by `strwinclt.exe`, typically found in directories like `%TEMP%`. Presence of unusual file names or modifications could indicate a malicious payload.

  ### Prioritization

  This alert should be treated with medium priority. The impact of unauthorized access is high if sensitive or critical assets are involved. While remote access tools are often used legitimately, their nature makes them common targets for exploitation, thereby increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as attackers masking their activity by renaming the executable or using custom remote tools. Ensure comprehensive logging of all process creations (via Group Policy) for reliable detection. Legitimate activities by IT support teams may frequently trigger this alert. Additionally, companion detections for anomalous network connections from `strwinclt.exe` could enhance overall security monitoring.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
