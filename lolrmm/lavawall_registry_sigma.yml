note: |
  ### Technical Context

  This Sigma rule detects unauthorized registry modifications associated with the Lavawall Remote Monitoring and Management (RMM) tool. Attackers may leverage such tools for persistence, remote access, and control over compromised systems, potentially aiming for data exfiltration or lateral movement within the environment. This behavior fits the MITRE ATT&CK framework under the tactic "Command and Control," specifically technique T1219 (Remote Access Software).

  The primary telemetry source is Windows Registry event logs capturing modifications to specific keys related to Lavawall. Malicious activity in this context typically indicates that an adversary is attempting to establish or maintain control over a compromised system. Importantly, this detection does NOT confirm the presence of malware on its own, as legitimate use of Lavawall could trigger similar alerts.

  ### Investigation Steps

  - **Examine registry modification details**: Review Registry Event logs (Event ID 4657) for changes to keys: `HKLM\SOFTWARE\WOW6432Node\LavaWall\Agent`, `HKLM\SYSTEM\CurrentControlSet\Services\Lavawall Support Agent`, and `HKLM\SYSTEM\CurrentControlSet\Services\LavaWallRemoteAgent`. Look for event timestamps indicating unusual activity times.

  - **Identify the user context**: Determine the user account making these registry changes by correlating with Event ID 4657. Legitimate administrative changes should originate from known, authorized accounts; anomalous accounts may indicate unauthorized access.

  - **Assess service status**: Check the status of the 'LavaWall Support Agent' and 'LavaWallRemoteAgent' services using Service Control Manager logs (Event ID 7045). Malicious activity may include abnormal start or stop attempts outside of regular maintenance windows.

  - **Correlate with other telemetry**: Cross-reference these registry changes with process creation logs (Sysmon Event ID 1 or Security Event ID 4688) to identify processes launching in proximity to the registry modifications. Look for unusual or unexpected executables associated with the Lavawall software.

  - **Validate expected behaviors**: Confirm the presence of authorized Lavawall installations through Asset Management records. If the monitored endpoints do not officially use Lavawall, deeper investigation into the associated registry modifications and file paths is warranted.

  - **Check for file creation or modification**: Review filesystem logs for any associated file creation pertaining to the identified registry keys. Confirm legitimate creation paths; malicious activity may involve unexpected file placements indicating an unauthorized installation.

  ### Prioritization

  The alert should be treated with medium severity. Given that the affected registry modifications pertain to remote access management tools, which can be weaponized by attackers, the situation demands prompt investigation. The criticality of the impacted system elevates the need for immediate action due to potential exploitability.

  ### Blind Spots and Assumptions

  This detection may be limited if legitimate administrative use of Lavawall is widespread in the enterprise, which could generate false positives. Consistent, thorough logging of registry events is crucial for reliable detection; ensure all necessary settings are enabled. Legitimate IT support or administrative functions may trigger this alert, necessitating a contextual understanding of the network’s operations. Companion detections include monitoring for unusual patterns of network communication corresponding with instances of registry alterations tied to Lavawall.

