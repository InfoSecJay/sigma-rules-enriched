note: |
  ### Technical Context
  This detection rule is designed to identify the execution of processes associated with the **Domotz RMM (Remote Monitoring and Management)** tool on Windows systems. The Domotz tool is commonly used for remote management of IT infrastructure, but its presence in unusual contexts can indicate potential unauthorized surveillance or system management activity by an attacker, especially in environments where remote management access should be limited or closely monitored.

  In a threat scenario, an attacker may leverage Domotz to maintain persistent access to compromised systems or networks, exfiltrate data, or manipulate system configurations to facilitate further attacks. The likely objectives include reconnaissance and system control, which could lead to data breaches or lateral movement within the network.

  This rule relates to the following MITRE ATT&CK tactics and techniques:
  - **Execution (TA0002)**: The act of running malicious processes on a system.
  - **T1219 – Remote Access Tools**: Utilizing remote access software like Domotz for controlling systems.

  The primary data sources for this detection include process creation events from Windows operating systems, which provide insight into newly spawned processes and their parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine recent process creation logs to identify any entries for Domotz-related executables. Focus on the process tree to analyze parent-child relationships that could indicate potentially malicious use.

  - **Correlate with User Activity**: Investigate the user accounts associated with the execution of Domotz processes. Check if these accounts are authorized to use remote management tools or if there are anomalies in their usage patterns.

  - **Conduct File Integrity Checks**: Ensure the integrity and source of the Domotz executables found on the system. This includes verifying that they have not been replaced or modified and that they originate from a legitimate source.

  - **Monitor Network Connections**: Trace any network activity initiated by the identified Domotz processes. Look for unexpected outbound connections that could indicate data exfiltration or command-and-control communications.

  ### Prioritization
  The alert has a medium severity level due to the potential risk that unauthorized use of remote management tools poses in an enterprise environment. While Domotz may have legitimate applications, its misuse can lead to significant security incidents, making timely investigation essential.

  ### Blind Spots and Assumptions
  One primary blind spot in this detection is the reliance on the presence of known Domotz process signatures, which may not capture variants or newly-developed versions of the software. Additionally, the detection assumes that impersonation of legitimate accounts will not be a factor; this could lead to missed alerts if attackers are able to promote themselves to privileged user roles. For this alert to function effectively, comprehensive logging of process creation events must be enabled, along with necessary configurations for monitoring specific executables within the environment.

