note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Domotz Remote Monitoring and Management (RMM) tool. The likely attacker objective is to utilize the Domotz tool for unauthorized remote access or control over a system, potentially to facilitate lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK technique of Remote Services (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, capturing details of process launches and their parent processes. If malicious, the security impact could include unauthorized access, persistent foothold, or exploitation of network infrastructure. Notably, this detection on its own does NOT confirm that malicious activity is occurring; benign use of the Domotz tool for legitimate management purposes could trigger this alert.

  ### Investigation Steps

  - **Verify process origins**: Check the process creation logs for Event ID 4688. Look specifically for the 'NewProcessName' field to confirm that key processes originate from legitimate directories, such as 'C:\Program Files\Domotz\'.

  - **Assess parent process relationships**: Examine the parent process information in Event ID 4688 logs. If the parent processes are commensurate with expected system management activities, it may indicate benign usage. Malicious indicators include unexpected parent processes such as cmd.exe or powershell.exe initiating the Domotz processes, which are often indicative of abuse.

  - **Review user account activity**: Investigate the 'CreatorProcessId' and 'SubjectUserName' fields from Event ID 4688. Ensure the user accounts executing these processes align with administrative roles. Unexpected accounts, especially non-admin users, executing Domotz can signal a potential security concern.

  - **Monitor network connections made by Domotz**: Utilize network monitoring tools to observe outbound connections from the Domotz processes to unfamiliar or suspicious IP addresses. Legitimate usage typically connects to known management endpoints while suspicious behavior may connect to unusual or external addresses.

  - **Identify known vulnerabilities**: Cross-reference the versions of the Domotz RMM tool being used with any known vulnerabilities. Older versions might have exploits that an adversary could leverage.

  - **Check for persistence mechanisms**: Look in the Windows registry (particularly under 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run') for any entries related to the Domotz executable. Legitimate installations often follow standard startup behavior, while unexpected entries may indicate malicious persistence methods.

  ### Prioritization

  The alert is medium severity due to its potential high impact on critical systems, especially those used for remote monitoring and management. The likelihood of malicious abuse is elevated if the tool is found running in environments where it has not been authorized. While Domotz may be misused, its legitimate application is performed under strict control in many environments, which adds to the complexity of this detection.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate use of the Domotz tool, which may generate false positives. Reliable detection requires all instances of process creation logs to be captured, including proper configuration of Sysmon or Windows audit settings. Legitimate IT management activities could inadvertently trigger this alert when performing authorized remote monitoring. A related detection of lateral movement via Remote Services (T1219) may strengthen coverage against this behavior.

