note: |
  ### Technical Context

  This Sigma rule detects outbound network connections where the destination hostname ends with 'royalapps.com', which is associated with the Royal Server Remote Monitoring and Management (RMM) tool. Attackers may use this tool for command and control (C2) purposes to exfiltrate data or manage compromised systems remotely, thereby facilitating unauthorized access and operations. This detection relates to the MITRE ATT&CK technique T1219 (Remote Access Software), which encompasses tools attackers use to maintain control over compromised environments.

  The primary telemetry source is Windows network connection logs from the system, which can include Sysmon Event ID 3 (Network Connection) and the Windows Security logs for outbound connections. If detected network activity is malicious, it could allow attackers persistent and covert access to affected systems. Importantly, this detection alone does not confirm an ongoing compromise or that the RMM tool is being used maliciously, as it may also indicate legitimate use by authorized personnel.

  ### Investigation Steps

  - **Review network connection details**: Check Sysmon Event ID 3 for outbound connections to 'royalapps.com'. Confirm the source process and PID to identify if any known legitimate applications are initiating the connection.

  - **Identify the initiating process**: Use Windows Security Event ID 4688 to view process creation logs. Cross-reference the process names against threat intelligence to determine if they are associated with known malicious behaviors.

  - **Validate user context**: Review audit logs to establish the user account initiating the outbound connection. If it’s a service account or a user without a clear business need for remote management, this may point to malicious activity.

  - **Evaluate historical access**: Check network logs for previous connections to 'royalapps.com' from the same host over time. If multiple connections are observed in a short timeframe, especially from unusual hours, this raises suspicion of abuse.

  - **Check for other signatures of compromise**: Investigate for related suspicious behavior occurring on the same host, such as unexpected scheduled tasks or recent changes to system configurations that may indicate initial access or lateral movement tactics.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on system integrity and confidentiality. The likelihood of malicious use is significant, as RMM tools are frequently weaponized by adversaries to maintain persistent access. Consequently, thorough investigation is warranted to rule out any unauthorized usage.

  ### Blind Spots and Assumptions

  Evasion techniques could include the use of domain fronting or tunneling to obscure legitimate connections to 'royalapps.com'. Reliable detection requires proper logging configurations, such as ensuring Sysmon and Windows Security event logs are enabled. Legitimate administrative functions may also trigger this alert, particularly in environments using Royal Server RMM for consistent maintenance. Monitoring for additional indicators of compromise, such as C2 traffic to known malicious IPs or DNS requests, could provide complementary detection capabilities.

