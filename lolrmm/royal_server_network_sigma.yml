note: |
  ### Technical Context

  This rule detects attempts to establish outgoing network connections to domains associated with the Royal Server Remote Monitoring and Management (RMM) tool, specifically `*.royalapps.com`. The likely attacker objective is to use this tool for remote access or control of compromised systems, potentially leading to data exfiltration or further lateral movement within the network. Relevant MITRE ATT&CK techniques include "Command and Control" (T1071) and "Remote System Manipulation" (T1219).

  The primary telemetry source is network connection logs, particularly focusing on DNS queries and outbound traffic to the specified domain patterns. If malicious, the security impact could range from unauthorized data access to substantial operational disruptions. Importantly, this detection does NOT confirm that the activity is malicious on its own, as legitimate use of the Royal Server may occur in some enterprises.

  ### Investigation Steps

  - **Verify outbound connections to suspicious domains**: Check firewall logs for outbound connections (Event ID 5156) to `*.royalapps.com`. Look for connections established from high-privilege accounts or sensitive servers, which may indicate malicious use.

  - **Correlate process creation events**: Review Security Event ID 4688 on hosts making these outbound connections to identify new process execution that resolves to RMM tools or other uncommon executables. Process creation by legitimate administrative tools may be benign.

  - **Assess user activity and intent**: Investigate user accounts connected to the identified hosts using authentication logs (Event ID 4624) to determine if the accounts showing this behavior are typically involved in IT administration. Legitimate administrative tasks may include maintenance or remote management during standard operating hours.

  - **Inspect for additional indicators of compromise (IoCs)**: Search for concurrent logs showing unusual file access patterns (Sysmon Event ID 11) on the same hosts, especially config files, executable files, or scripts that might be related to the Royal Server RMM tool.

  - **Evaluate DNS query logs**: Analyze DNS logs for any unusual queries to `*.royalapps.com` that exceed expected traffic baselines, especially from non-admin accounts or from systems that don’t typically access RMM resources.

  ### Prioritization

  This alert warrants medium severity due to its potential impact on sensitive systems if misused. The likelihood of malicious exploitation is moderate, especially given the increasing use of RMM tools by adversaries for lateral movement and persistent access in enterprise environments.

  ### Blind Spots and Assumptions

  Evasion techniques may include using encrypted traffic to conceal true command and control activity or subnet masking to route traffic differently. Required log sources include accurate firewall and DNS query logs to ensure comprehensive visibility. Legitimate activities such as scheduled maintenance or technical support using Royal Server may generate similar alerts. Companion detections that strengthen coverage include monitoring for unusual process hierarchies (Sysmon Event ID 1) or monitoring for abnormal login behavior (Event ID 4624) in conjunction with network activity to provide context.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
