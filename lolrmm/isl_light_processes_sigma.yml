note: |
  ### Technical Context

  This Sigma rule detects the execution of ISL Light RMM (Remote Monitoring and Management) tool processes, specifically `islalwaysonmonitor.exe`, `isllight.exe`, and `isllightservice.exe`. The adversary objective could include unauthorized remote access or monitoring of systems, typical in cases of malicious insider threat or external exploitation. This behavior aligns with the MITRE ATT&CK technique for Remote Access Software (T1219).

  The primary telemetry source is Windows process creation logs, tracking processes initiated by users or services. If malicious, this activity can lead to significant security impacts, such as unauthorized control or data exfiltration. However, it is important to note that detection of these processes alone does not confirm malicious intent, as ISL Light may be used legitimately within the organization.

  ### Investigation Steps

  - **Identify the parent processes:** Review Security Event ID 4688 logs to identify parent process IDs and names. Look for legitimate parent processes (e.g., `explorer.exe`, `taskeng.exe`), which may indicate benign usage, versus unexpected ones that could suggest malicious execution.

  - **Examine user context:** Check the event logs for the account running these ISL Light processes. Look for accounts with elevated privileges or compromised user accounts that shouldn't typically run these tools.

  - **Validate execution time:** Review the timestamps of the process creation events against normal operational hours. Unusual execution outside business hours may indicate unauthorized activity.

  - **Analyze related network activity:** Monitor network logs for outbound connections from these processes. Look for anomalous connection attempts, especially to known malicious IP addresses or unauthorized external services.

  - **Review history of ISL Light usage:** Check the organization's asset management records for documented usage of ISL Light. Legitimate use should correspond to systems configured with that software; discrepancies may warrant further investigation.

  - **Identify high-confidence malicious indicators:** Look for signs of privilege escalation or lateral movement attempts if these processes were spawned in a context that deviates from expected operational behavior, such as from critical infrastructure roles (e.g., Domain Controllers).

  ### Prioritization

  The alert is of medium severity due to the potential impact on systems if misused. Given that remote monitoring tools like ISL Light can be weaponized for unauthorized access, the likelihood of adversary exploitation is moderate. The context of the affected system and user behavior will greatly influence the prioritization of the alert.

  ### Blind Spots and Assumptions

  Detection relies heavily on the accuracy and completeness of Windows event logging; lack of integration or configuration may result in missed detections. Legitimate IT support operations may trigger this alert, particularly if ISL Light is used for genuine remote access tasks. A related detection that can enhance coverage would involve monitoring for unusual outgoing network traffic from systems identified as utilizing ISL Light during non-operational hours.

