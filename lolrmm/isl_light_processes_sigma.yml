note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the ISL Light Remote Monitoring and Management (RMM) tool, specifically `islalwaysonmonitor.exe`, `isllight.exe`, and `isllightservice.exe`. Attackers may utilize RMM tools like ISL Light during lateral movement or remote access, potentially aiming to establish persistence within environments or exfiltrate sensitive information. Relevant MITRE ATT&CK tactics and techniques include "Command and Control" (TA0011) and "Exploitation of Remote Services" (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, which will detail process creation events, along with fields indicating the parent process and the image name. If these processes are executed maliciously, they could allow an attacker broader access into the network, putting sensitive data and systems at risk. Importantly, this detection alone does not confirm malicious activity, as ISL Light may be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for processes `islalwaysonmonitor.exe`, `isllight.exe`, and `isllightservice.exe`. Correlate with parent process details to identify potential abuse or legitimate usage.

  - **Validate parent process context:** Investigate the parent process, looking specifically for exploitation patterns or unauthorized remote access tools originating from unusual or high-risk environments (e.g., external networks).

  - **Identify command line arguments:** Examine command line arguments associated with the detected processes in Security Event ID 4688. Malicious usage may include unusual parameters or lack of expected syntax for legitimate operations.

  - **Evaluate host role and access controls:** Review the role of the host running these processes. Ensure access controls align with acceptable use policies; RMM tools should only be operated on designated support or administrative machines.

  - **Cross-reference with other telemetry sources:** Compare findings against remote access logs and network traffic analysis; look for connections to known malicious IPs or domains resembling common ISL Light command-and-control servers.

  - **Identify legitimate scenarios:** Recognize that authorized IT support teams may use ISL Light for remote management. Confirm any detected instances against support tickets or change management records to rule out benign activity.

  ### Prioritization

  This alert is medium priority based on potential impact; the execution of ISL Light processes on critical systems may indicate unauthorized access. Malicious use of legitimate RMM tools is well-documented, raising the likelihood of abuse in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if log sources for process creation are misconfigured or not enabled. Additionally, elevated trust models in environments may legitimize the use of ISL Light, complicating the analysis. RMM tools are commonly used for maintenance, which could inadvertently generate alerts. A companion detection rule focusing on anomalous network connections using ISL Light may enhance detection capabilities and help contextualize the alert.

