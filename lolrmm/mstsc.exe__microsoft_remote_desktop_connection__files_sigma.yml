note: |
  ### Technical Context

  This Sigma rule detects file activity associated with **mstsc.exe** (Microsoft Remote Desktop Connection), which may indicate unauthorized remote access attempts. Attackers might leverage RDP sessions to maintain persistence, exfiltrate data, or control compromised machines. The relevant MITRE ATT&CK techniques are: **Remote Services Tactic (TA0011), Remote Desktop Protocol (RDP) (T1219)**.

  The primary telemetry sources include Windows file event logs that track changes involving key files like `Default.rdp` (stored in user profile directories) and `termsrv.exe` (a core RDP service). If malicious, such activity could lead to unauthorized access, data breaches, or lateral movement within the network. This detection does NOT confirm the legitimacy of the connection or the full context of the initiated session, as legitimate administrative activities can trigger similar alerts.

  ### Investigation Steps

  - **Check file events for `Default.rdp`:** Review Windows file event logs (Event ID 4663) for modifications or creations of **`%USERPROFILE%\Documents\Default.rdp`**. Malicious activity may include unexpected timestamps or abnormal user accounts involved.

  - **Monitor `termsrv.exe` interactions:** Analyze logs for **`%SystemRoot%\System32\termsrv.exe`** usage. Validate the process's parent and associated user sessions. Sign of compromise would be unusual parent processes like `explorer.exe` initiated by non-privileged users.

  - **Identify genuine RDP usage:** Investigate typical usage patterns for your organization. Most legitimate RDP sessions originate from specific admin accounts during standard hours. Look for discrepancies in user accounts or unusual times.

  - **Extract session logs:** Review RDP session logs for Event IDs 4624 and 4647 to see successful logins and logoffs. Check for multiple login attempts from different users to identify potential account compromise.

  - **Correlate with other alerts:** Cross-reference with alerts from endpoint detection tools (e.g., EDR telemetry) to identify suspicious behaviors or processes spawned around the same time as the detected file activity.

  ### Prioritization

  This alert is of medium severity as it indicates potential unauthorized remote access. Given the critical nature of RDP in enterprise environments, if exploited, it poses a significant risk of lateral movement and data exfiltration. While this behavior is not frequently weaponized, it warrants immediate investigation.

  ### Blind Spots and Assumptions

  This detection may miss legitimate RDP usage, especially during periods of heightened remote work activity. Evasive techniques include using alternative remote access tools or tunneling RDP through non-standard ports. Ensure Windows Event auditing is properly configured to capture relevant file actions. A related detection to consider includes monitoring for suspicious log-ins via RDP sessions, particularly from new or rarely used IP addresses.

