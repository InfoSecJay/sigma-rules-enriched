note: |
  ### Technical Context

  This Sigma rule detects behaviors associated with the execution and file activity of `mstsc.exe` (Microsoft Remote Desktop Connection), particularly focusing on the creation or modification of RDP session files (`Default.rdp`) and the terminal services binary (`termsrv.exe`). The likely attacker objective is to gain unauthorized remote access to systems, potentially facilitating lateral movement or exfiltration. This detection correlates with the MITRE ATT&CK tactic for Command and Control (TA0011) and the technique for Remote Desktop Protocol (T1219).

  Primary telemetry sources include Windows file event logs, particularly observing changes to personal user folders or system directories tied to remote desktop configurations. If malicious, this activity poses a significant security risk as it could enable unauthorized access to sensitive systems. Importantly, this detection does NOT alone confirm malicious intent; legitimate administrative or user activities may also trigger it.

  ### Investigation Steps

  - **Review relevant file events:** Check for File Event logs where `TargetFilename` ends with `Default.rdp` or `termsrv.exe` (Windows Event ID 4663). Cross-reference with timestamps of the alert for context.

  - **Analyze process creation events:** Observe Security Event ID 4688 and/or Sysmon Event ID 1 for instances of `mstsc.exe` being invoked. Confirm if executed under user contexts or unexpected service accounts indicating potential abuse.

  - **Identify user behavior patterns:** Conduct analysis to establish baseline user behavior—legitimate use cases might include remote work scenarios involving `mstsc.exe`, typically initiated by known user accounts during specific hours.

  - **Check for network connections related to RDP:** Review Windows Firewall logs (Event ID 5140) and connection attempts over port 3389. Identify successful connections and correlate with the alert for unauthorized access patterns.

  - **Examine other RDP configuration files:** Look for additional RDP files or scripts in suspected directories (e.g., `%USERPROFILE%\Documents\`). Establish if there are unexpected modifications indicating unauthorized setup changes.

  - **Cross-reference with threat intelligence:** Use threat intelligence sources to validate if the observed behavior correlates with known malicious patterns or actors targeting remote access solutions.

  ### Prioritization

  This alert presents a medium severity level. If detected on critical assets, the potential impact is high, as remote desktop access can lead to full system compromise. The likelihood of adversaries abusing `mstsc.exe` for remote access is concerning, particularly as RDP-based attacks remain common in targeted campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of `mstsc.exe` for remote access, which can trigger false positives in environments with heavy remote workforce reliance. Reliably detecting this activity requires complete logging configurations, including file event tracking for user directories. Additionally, be aware that authorized administrative operations, software updates, or legitimate remote troubleshooting can cause similar alerts. Related detections, such as monitoring outbound RDP connections (T1219), could complement this rule to enhance coverage against unauthorized access attempts.

