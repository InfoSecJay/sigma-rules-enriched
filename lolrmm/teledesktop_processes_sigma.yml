note: |
  ### Technical Context
  This detection rule identifies potential malicious use of the TeleDesktop Remote Management Tool (RMM) by monitoring specific process creation events. TeleDesktop is often employed for remote support purposes. However, its misuse can provide attackers with unauthorized access to sensitive systems, enabling lateral movement, data exfiltration, or system manipulation. This detection is crucial as it helps to discern between legitimate operational activity and potential adversary actions that could compromise organizational assets.

  The primary motivations of attackers utilizing such tools may include gaining remote access to systems, evading detection by disguising malicious processes within legitimate administrative activities, or enabling subsequent phases of a more extensive attack. This rule relates to the MITRE ATT&CK tactics of **Execution** (TA0002) and technique **T1219: Remote Access Software**.

  The best sources of telemetry for this detection are Windows process creation logs, which document the launch and execution of processes, capturing critical information such as parent-child process relationships that can highlight suspicious RMM tool activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs to identify instances of `pstlaunch.exe`, `ptdskclient.exe`, or `ptdskhost.exe` being executed. Analyze both the time of execution and the parent processes to determine if they originate from legitimate sources.
  - **Assess Parent Process Activity:** Investigate the parent processes that initiated the RMM tool-related executables. Look specifically for unusual parent processes (e.g., processes unlikely to spawn these RMM tools under normal operational circumstances).
  - **Cross-Check Usage Patterns:** Compare the identified process activity against known baselines of legitimate administrative use within the organization. Focus on active sessions, timing, and geographical locations of those accessing the systems.
  - **Correlate User Accounts:** Identify the user accounts associated with the process execution and investigate their typical behavior patterns. Look for anomalies that may suggest compromise, such as non-administrative accounts launching these tools.

  ### Prioritization
  The severity of this alert is categorized as medium due to the potential implications of unauthorized remote access. The abuse of TeleDesktop could lead to extensive system compromise and data loss, especially if misused by an insider threat or an external adversary.

  ### Blind Spots and Assumptions
  The detection rule may not capture scenarios where the TeleDesktop tools are used legitimately, potentially leading to false positives. It assumes that the process creation logs are properly configured and comprehensive for all endpoints within the environment. Additionally, gaps may exist in monitoring other remote access tools that could be missed unless they exhibit similar process behaviors. Effective logging and alerting configurations will be necessary for accurate detection and response capabilities.

