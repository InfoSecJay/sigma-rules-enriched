note: |
  ### Technical Context

  This rule detects the creation of processes associated with the TeleDesktop Remote Monitoring and Management (RMM) tool, which is often used for remote access and support. The likely attacker objective is to maintain control over a compromised system, conduct unauthorized remote administration, or facilitate lateral movement within the network. This detection corresponds to the MITRE ATT&CK tactic: Command and Control (TA0011) and technique: Remote Access Software (T1219).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process creation events alongside their parent processes. If malicious, this could lead to unauthorized access or data exfiltration. However, it is important to note that the detection does not confirm that malicious activity is occurring without additional context, as TeleDesktop may be used legitimately within the environment.

  ### Investigation Steps

  - **Examine process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for instances of processes ending with `pstlaunch.exe`, `ptdskclient.exe`, or `ptdskhost.exe`. Identify the user context and time frame of execution.

  - **Validate parent process relationship**: Check if the detected process was spawned from a legitimate parent process such as `pstlaunch.exe`, `ptdskclient.exe`, or `ptdskhost.exe`. Focus on the ParentImage field in the process creation logs to confirm this relationship.

  - **Review user activity**: Investigate the user associated with the process execution. Cross-reference their activities and determine if they typically use TeleDesktop for legitimate support tasks. Look for Event ID 4624 (logon events) corresponding to this user.

  - **Assess network traffic**: Analyze outbound traffic for connections to known TeleDesktop control servers or unusual IP addresses. Check for any indicative patterns in firewall or proxy logs (e.g., destination IP, port usage) reflecting unauthorized remote access activity.

  - **Look for persistence mechanisms**: Inspect for any auto-start registry entries or scheduled tasks related to TeleDesktop, which may indicate an attempt to maintain access post initial compromise. Review relevant registry paths or Task Scheduler logs.

  ### Prioritization

  The alert has medium severity due to the potential high impact of unauthorized remote access. The presence of process activity related to TeleDesktop poses a risk, particularly if it originates from a system with sensitive data. This behavior can be weaponized by adversaries using legitimate tools for malicious purposes, making it crucial to investigate promptly.

  ### Blind Spots and Assumptions

  This detection has limitations as legitimate use of TeleDesktop can lead to false positives. Ensure that logging for process creation is appropriately configured; without it, detection may be ineffective. Legitimate administrative actions, especially from IT support personnel, may trigger this alert. A related detection could include monitoring for user logons and lateral movement behaviors to provide context around the use of RMM tools.

