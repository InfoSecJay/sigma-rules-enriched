  ### Technical Context

  This rule detects potential unauthorized use of the TeleDesktop remote management tool by monitoring the creation of processes associated with TeleDesktop components, specifically those initiated by its parent processes like `pstlaunch.exe`, `ptdskclient.exe`, or `ptdskhost.exe`. The likely attacker objective is unauthorized remote access, potentially aimed at controlling systems or exfiltrating sensitive information. This behavior aligns with the MITRE ATT&CK technique T1219 (Remote Access Software).

  Primary telemetry sources include Windows process creation logs, specifically tracking Event ID 4688 for Windows Security and Sysmon Event ID 1. If leveraged maliciously, the security impact includes significant risks associated with unauthorized remote access, confidentiality breaches, and potential lateral movement within the network. Importantly, detection of these processes alone does not confirm malicious activity; legitimate usage of TeleDesktop in administrative or support contexts can also trigger this alert.

  ---

  ### Investigation Steps

  - **Check parent process activity:** Review Windows Security Event ID 4688 logs for process creation events related to `pstlaunch.exe`, `ptdskclient.exe`, or `ptdskhost.exe`. Confirm whether these processes were launched by expected administrative accounts versus unknown or generic user accounts.

  - **Identify time of execution:** Cross-reference the execution timestamps of the detected processes with any known maintenance windows or scheduled remote support sessions. Legitimate activities often align with these periods.

  - **Review network connections:** Use network logs (e.g., Windows Firewall logs) to identify outgoing connections initiated by the detected processes. Look for unusual IP addresses or domains that could indicate malicious connections.

  - **Assess file and registry changes:** Monitor for related file creation or modification events, especially concerning TeleDesktop directories (e.g., check for file paths under `C:\Program Files\TeleDesktop`). Malicious installations often create new files or alter system registries.

  - **Verify account activity:** Inspect logs for unusual user behavior linked to the accounts executing these processes. Check for failed login attempts or login from unusual geographical locations correlated with the process execution.

  - **Correlate with endpoint security alerts:** Review EDR/XDR solutions for any alerts regarding behavior linked to remote access tools. Look for patterns or signatures that are known to accompany malicious use.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the reliance on the affected systems' importance. If TeleDesktop is present in high-value or sensitive environments, the likelihood of malicious abuse increases. Remote access tools such as TeleDesktop are often weaponized in attacks, making this detection critical for immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques such as the use of legitimate credentials or modified TeleDesktop versions that may not trigger standard alerts. Reliable detection requires proper logging configurations for both Windows Security and Sysmon, as missing these logs could result in gaps in visibility. Legitimate remote support activities may incidentally trigger this alert. A companion detection to strengthen coverage is monitoring for unusual scheduled tasks, which can provide early warning signs of compromise or abuse tied to remote tool use.

