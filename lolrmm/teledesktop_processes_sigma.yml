  ---

  ### Technical Context

  This Sigma rule detects the execution of processes associated with the TeleDesktop Remote Management Tool, specifically those instances launched by its parent processes (pstlaunch.exe, ptdskclient.exe, ptdskhost.exe). The likely attacker objective is to maintain persistent remote access and control over compromised systems. This behavior is classified under the MITRE ATT&CK tactic of **Execution** and technique **Remote Services** (T1219). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this could permit unauthorized access to sensitive systems, data exfiltration, and lateral movement within the environment. It is crucial to note that this detection does NOT confirm that the activity is malicious without additional context; legitimate use of TeleDesktop is common and may not indicate a security incident.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 for any instances of processes pstlaunch.exe, ptdskclient.exe, or ptdskhost.exe initiated by other legitimate components. Look for abnormal parent processes or unusual execution paths.

  - **Evaluate associated user accounts:** Analyze the accounts that executed the relevant processes. Check if there are any accounts with lower privilege levels attempting to engage these processes, which could indicate malicious activity.

  - **Investigate network connections:** Monitor the network activity corresponding to the identified processes for unusual external connections. Look specifically for connections to suspicious IP addresses or anomalies in destination ports using Windows Firewall logs (Event ID 5156).

  - **Identify expected legitimate use:** Confirm if TeleDesktop is a sanctioned tool within your enterprise policy. Cross-reference with endpoint inventory to verify if the tool is supposed to be installed on the systems generating alerts.

  - **Correlate logs for malicious indicators:** Check for known indicators of compromise associated with TeleDesktop. This includes searching for any prior alerts or suspicious behavior linked to the detected parent processes in past logs.

  - **Validate against known safe applications:** Cross-reference detected paths for TeleDesktop processes with organizational application whitelists to confirm that their presence is authorized and can be accounted for operationally.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential for unauthorized remote access to critical systems. While TeleDesktop can be used legitimately, its typical application in remote support could also be weaponized by an adversary for nefarious purposes. The likelihood of abuse is moderate, based on historical use cases.

  ---

  ### Blind Spots and Assumptions

  This detection may miss instances if TeleDesktop processes are launched in a stealthy manner or if logs from critical systems are not collected. Legitimate administrative use of the TeleDesktop tool may trigger the alert under normal operational circumstances, complicating triage. A companion detection rule for abnormal login behavior alongside process initiations should be implemented to enhance coverage against potential misuse.

