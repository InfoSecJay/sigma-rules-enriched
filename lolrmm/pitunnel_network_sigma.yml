note: |
  ### Technical Context

  This rule detects network connections to domains associated with the PiTunnel Remote Management Tool (RMM), known for its use in unauthorized remote access and command-and-control operations. Attackers may utilize this tool to maintain persistence in compromised environments, allowing them to manage systems without detection. This behavior aligns with the MITRE ATT&CK technique for Command and Control via Remote Services (T1219).

  Primary telemetry sources include Windows Network Connection Logs, where the relevant fields are DestinationHostname and its associated metadata. If malicious, the security impact could result in unauthorized access and potential data exfiltration. Importantly, this detection does NOT alone confirm malicious intent, as legitimate use of PiTunnel may occur in the environment.

  ### Investigation Steps

  - **Validate the source of the connection:** Check Windows Security Event ID 5140 (Network share accessed) and Event ID 5156 (Windows Filtering Platform (WFP) connection) for source IP and user context when accessing *.pitunnel.com domains.

  - **Review connection frequency:** Analyze the volume of network connections to PiTunnel domain names to identify anomalies; high frequency from a single host or unusual hours could indicate malicious use.

  - **Determine host role:** Identify the asset involved (e.g., server vs. workstation) and its criticality (e.g., high-risk if a Domain Controller); legitimate use cases for PiTunnel are often on non-critical devices or for benign remote access.

  - **Cross-check recent installations:** Look for new software installations or updates that involve PiTunnel on the host through Windows Event ID 1024 (Application Management) or relevant installation logs to determine if its presence aligns with organizational policies.

  - **Inspect for high-confidence malicious indicators:** Look for suspicious processes associated with the connection. Utilize Sysmon Event ID 1 (Process Creation) to check for any obfuscated or unusual names initiating connections to PiTunnel domains.

  - **Correlate with user behavior:** Analyze user activity logs across the impacted network to understand the context of access to PiTunnel domains, ensuring that patterns align with known business operations instead of unauthorized access.

  ### Prioritization

  The alert severity is medium due to the potential impact of remote access on critical systems. The likelihood of abuse is concerning, especially in environments where administrative controls may be relaxed. The PiTunnel tool is recognized in some threat landscapes, making this behavior notable for further investigation.

  ### Blind Spots and Assumptions

  There are limitations in detecting all forms of PiTunnel activity, as adversaries may use encryption or obfuscation methods to hide connections. Reliable detection requires comprehensive logging of network connections and potentially advanced firewall configurations. Legitimate administrative use of PiTunnel could trigger this rule, necessitating validation against internal asset inventories. Companion detections, such as monitoring for anomalous process executions (e.g., unusual scripting behavior or remote access tools), can enhance coverage against remote access threats.

