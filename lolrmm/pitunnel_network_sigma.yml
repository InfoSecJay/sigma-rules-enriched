note: |
  ### Technical Context

  This Sigma rule detects network connections to known PiTunnel domains, which can indicate the use of the PiTunnel remote management (RMM) tool. The likely attacker objective is to use this tool for unauthorized remote access, often facilitating lateral movement or data exfiltration within a target network. This behavior aligns with the MITRE ATT&CK framework under the tactic of Command and Control (T1071.001 - Application Layer Protocol) and potentially impacts systems by creating unauthorized remote sessions.

  The primary telemetry sources for this detection are Windows network connection logs, specifically focusing on DNS requests and outbound connection attempts. If malice is confirmed, it indicates that an adversary may be leveraging remote access to compromise system integrity. However, this detection does NOT confirm that an unauthorized user is actively exploiting the system, as legitimate activities may also trigger this alert.

  ### Investigation Steps

  - **Review outbound network connections:** Check for Event IDs 5156 (Windows Filtering Platform) and Event IDs 5158 in the Windows Security logs to confirm connections to any of the PiTunnel domains. Look for the process name initiating these connections for context.

  - **Correlate with active sessions:** Analyze user accounts associated with the connection attempts. Look for unusual user behavior or accounts that should not have remote access privileges if a connection to PiTunnel is detected.

  - **Identify legitimate use cases:** Determine if the affected asset requires PiTunnel for operational duties. Validate this against documented application usage within your organization. If found legitimate, mark the alert accordingly.

  - **Detect high-confidence malicious indicators:** Look for repeated connection attempts to the PiTunnel domains from the same host or user over a short time frame, which may indicate a persistent threat actor attempting to maintain access.

  - **Analyze firewall logs:** Review firewall logs for dropped or permitted packets between the internal network and PiTunnel domains. Look for anomalous traffic patterns that deviate from normal user behavior.

  - **Assess system roles and asset criticality:** Identify if the affected system holds sensitive information or critical roles (e.g., servers handling confidential data), increasing the focus on investigating this alert for better prioritization based on asset value.

  ### Prioritization

  The alert severity is medium. Systems identified making connections to PiTunnel domains could indicate potential compromise, especially if related to sensitive assets. The use of such tools for administrative purposes is relatively common, but their unexpected usage points to a high likelihood of malicious intent in unauthorized contexts.

  ### Blind Spots and Assumptions

  This detection may have limitations related to users employing legitimate remote access tools that naturally connect to these domains, leading to false positives. Reliable detection requires comprehensive logging from all network devices, including Firewalls and Intrusion Detection Systems (IDS), to provide context and confirm potential threats. Additionally, remote access tools may be utilized by legitimate administrative users, complicating investigations. Companion detections, such as monitoring abnormal user behavior (T1071 - Application Layer Protocol), can reinforce the coverage of this activity.

