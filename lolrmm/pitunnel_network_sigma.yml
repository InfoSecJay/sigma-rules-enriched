note: |
  ### Technical Context

  This detection identifies network connections targeting the PiTunnel domain, indicating potential use of the PiTunnel RMM (Remote Monitoring and Management) tool, which is often exploited by adversaries for remote access and control of compromised systems. The likely attacker objective is to establish persistent access to a network while exfiltrating data or conducting further malicious activities. This activity aligns with the MITRE ATT&CK technique "Remote Access Tools" (T1219).

  The primary telemetry sources include Windows network connection logs, specifically looking for connections to the domains ending in 'pitunnel.com'. If the detected behavior is malicious, the security impact could be severe, as it allows unauthorized remote access and control over sensitive systems and data. This detection does NOT confirm on its own that malicious activity has occurred, as legitimate users may also utilize PiTunnel tools.

  ### Investigation Steps

  - **Verify network connection details:** Check Windows network logs for Event ID 5156 (Windows Filtering Platform) showing connections to 'pitunnel.com' or its subdomains. This indicates potential use of the RMM tool.

  - **Assess process execution:** Investigate related processes using Sysmon Event ID 1. Look for processes spawned from unusual locations or by unexpected applications that may indicate exploitation of the PiTunnel tool.

  - **Identify legitimate usage:** Review historical network connection logs for known legitimate uses of PiTunnel within your organization. Validate if any known assets or user accounts commonly connect to these domains without raising red flags.

  - **Check outbound data transfer:** Look for large outbound data transfers in conjunction with the detected connection (Windows Event ID 5140), which could indicate data exfiltration occurring during the usage of PiTunnel.

  - **Monitor user behavior:** Evaluate user behavior associated with the detected connections. Unexpected user activity, such as connections initiated from administrative accounts, can be a high-confidence indicator of malicious activity.

  ### Prioritization

  This alert indicates medium severity due to the potential for either malicious remote access or legitimate administrative activities. While the usage of PiTunnel may not be common in a typical enterprise environment, if abused, it can lead to significant security breaches.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete log records or configurations that do not capture outbound network connections. Legitimate administrative uses of PiTunnel may trigger the alert, adding complexity to investigations. Companion detections, such as monitoring for known remote access tools (e.g., TeamViewer, AnyDesk) or suspicious outbound traffic patterns, can enhance coverage and improve threat detection capabilities.

