note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the SimpleHelp Remote Management and Monitoring (RMM) tool, which may be indicative of unauthorized remote access attempts or illicit software use in a corporate environment. Attackers aiming to establish persistence, control systems, or exfiltrate data might leverage this tool to remotely manage targeted devices. Relevant to the MITRE ATT&CK framework, this activity falls under the Command and Control tactic (TA0011) and technique T1219 (Remote Access Software).

  The primary telemetry sources include Windows file event logs where changes to specified directory paths are recorded. The identified behavior suggests a potentially malicious use of remote access tools, which can lead to data breaches or unauthorized access to sensitive systems. Importantly, while this detection indicates usage of SimpleHelp, it does not confirm whether the activity is malicious; legitimate usage of the tool can trigger this alert.

  ### Investigation Steps

  - **Review file events:** Examine Windows Security Event ID 4663 or Sysmon Event ID 11 for access to `'C:\ProgramData\JWrapper-Remote Access\'` or `'%APPDATA%\JWrapper-SimpleSetup\'`. Look for unusual access patterns, especially from non-administrative user accounts.

  - **Determine execution context:** Identify the user context executing the file activities. Legitimate SimpleHelp usage typically involves administrative accounts with scheduled maintenance tasks; suspicious behavior may involve non-admin accounts accessing those paths.

  - **Check for associated processes:** Investigate related processes spawned around the same time by reviewing Sysmon Event ID 1 for any unusual executables related to SimpleHelp (e.g., `JWrapper.exe`). It's critical to assess parent-child relationships for potential malicious origins.

  - **Analyze network connections:** Validate if the SimpleHelp tool establishes any outbound connections by reviewing Windows Firewall logs or Sysmon Event ID 3. Look for connections to unknown IP addresses or domains which may indicate data exfiltration.

  - **Identify file modifications:** Check if files were created or modified within the target directories during the alert period. Creation of new files, particularly `.exe`, `.dll`, or scripts (like `.ps1`), may indicate malicious intent.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact on the affected system, as simple remote management tools can be exploited for wider lateral movement if not monitored. There is a moderate likelihood of malicious abuse, given the application is often weaponized by adversaries to maintain persistent control over breached systems.

  ### Blind Spots and Assumptions

  Detection is limited by the legitimate usage of SimpleHelp, which may create noise in the alerting mechanism. Proper logging configurations for file events must be ensured for reliable detection. Legitimate IT support usage could inadvertently trigger this alert when performing regular maintenance tasks. As a related detection, monitoring external connections established by the application can bolster visibility into potential misuse associated with remote access tools.

