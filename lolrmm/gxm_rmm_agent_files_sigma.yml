note: |
  ### Technical Context

  This Sigma rule detects file activity related to the GxM RMM Agent, specifically looking for modifications or accesses to key executable and configuration files. The likely attacker objective is to utilize the GxM Remote Monitoring and Management (RMM) tool for unauthorized control over systems, potentially engaging in further malicious activities such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071 - Application Layer Protocol).

  The primary telemetry sources include Windows file event logs, specifically focusing on the relevant target files such as `GxM.Agent.exe`, `enrollment.json`, and `install.log` located in `C:\ProgramData\GxM`. If detected, this signifies a potential compromise wherein the integrity and confidentiality of the system could be at risk. However, it's important to note that this detection alone does not confirm malicious activity, as the GxM RMM Agent could be used legitimately in some environments.

  ### Investigation Steps

  - **Review file access history:** Check Windows Security Event ID 4663 for access to `C:\ProgramData\GxM\GxM.Agent.exe` and the associated log fields indicating the user context. Look for unusual or unauthorized user accounts accessing these files.

  - **Identify process parentage:** Analyze Sysmon Event ID 1 for the GxM agent process creation. Review the ParentImage field for unusual parent processes, indicating possible exploitation through parent-child process relationships.

  - **Examine legitimate use cases:** Validate whether known administrative accounts are legitimately using the GxM RMM Agent for support tasks, focusing on the timing and context of file access. Cross-reference with expected operational schedules.

  - **Check for abnormal outbound connections:** Investigate network logs, specifically outbound connections (Event ID 5156), initiated by `GxM.Agent.exe` to uncommon external IP addresses or domains. Flag any unexpected communication as a potential indicator of command and control.

  - **Gather installation metadata:** Review the contents of `C:\ProgramData\GxM\enrollment.json` for any unusual configurations or enrollment behaviors that do not align with normal operational usage patterns.

  - **Audit previous logon accounts:** Utilize Event ID 4624 logs to assess successful logins before and after GxM RMM Agent activity. Look for logins from unfamiliar IP addresses or during atypical hours which may suggest account compromise.

  ### Prioritization

  This alert is of medium severity as it indicates potentially suspicious file activity associated with a legitimate remote management tool, which may be abused for malicious actors' gain. The impact could significantly escalate if an attacker gained control over critical systems. This behavior has been weaponized in various contexts, making it essential to monitor closely.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate administrative usage of the GxM RMM agent can trigger this alert, leading to false positives. Reliable detection requires comprehensive logging of Windows file events paired with robust monitoring of legitimate tool usage. Additionally, standard administrative activities involving remote management tools must be considered in context. Strengthening coverage could involve companion detections that signal unusual network activities or account anomalies related to RMM applications.

