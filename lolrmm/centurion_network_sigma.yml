  ### Technical Context

  This Sigma rule detects network connections to destinations ending with "centuriontech.com," indicative of potential usage of the Centurion RMM (Remote Monitoring and Management) tool. The typical adversary objective would be remote access or control of compromised systems, potentially for data exfiltration or system manipulation. This behavior aligns with the MITRE ATT&CK technique for Remote Access Software (T1219), where attackers utilize legitimate RMM tools to facilitate their activities.

  Primary telemetry sources include Windows event logs for network connections, specifically focusing on log data like Security Event ID 5156 (Windows Filtering Platform has permitted a connection). If malicious, the presence of such activities could lead to unauthorized access or lateral movement within the network. However, this detection alone does not confirm malicious intent, as Centurion RMM may be legitimately used by IT staff for management purposes.

  ### Investigation Steps

  - **Review network connections:** Check for Event ID 5156 in the Windows Security logs for connections to "centuriontech.com." Record the time of the connection and the initiating host.
  - **Determine process details:** Correlate network activity with process creation events (Event ID 4688 or Sysmon Event ID 1) on the originating host to identify the executable making the network call. Look for unusual or unrecognized processes to establish potential malicious activity.
  - **Investigate recent changes:** Check for logins and administrative activity leading up to the connection in the Windows Security logs (Event IDs 4624 and 4672). A legitimate activity may involve known admin accounts accessing the RMM tool during regular maintenance windows.
  - **Assess asset criticality:** Identify the role of the affected host within your infrastructure. Any connections from critical assets (servers hosting sensitive data or key services) to centuriontech.com should be treated with heightened scrutiny.
  - **Look for indicators of compromise:** Identify other outbound connections to known malicious IP addresses or domains within the same timeframe as the detected initial alert, as this may suggest coordinated malicious behavior.

  ### Prioritization

  The alert should be prioritized as medium severity due to the risk associated with remote management tools and potential unauthorized access. Systems hosting sensitive data are more likely to be exploited via remote management tools, which attackers frequently weaponize. Sufficient justification exists for immediate investigation, particularly in sensitive environments.

  ### Blind Spots and Assumptions

  This detection may not capture all legitimate use cases, as IT staff might regularly use RMM tools. Adversaries could employ obfuscation techniques, such as IP whitelisting or using VPNs, to mask their connections. Reliable detection requires adequate logging of network connections and process activities on Windows systems. Review companion detections for abnormal user behavior in conjunction with this alert to reinforce overall security posture.

