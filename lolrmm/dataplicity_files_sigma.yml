note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Dataplicity Remote Management and Monitoring (RMM) tool on Windows systems. The likely attacker objective is to utilize Dataplicity’s remote capabilities to maintain persistence, execute commands, or exfiltrate data, potentially compromising sensitive environments. Relevant MITRE ATT&CK tactics include Execution (TA0002) and Persistence (TA0003) with associated technique T1219 (Remote Access Software). The primary telemetry sources are Windows file event logs, specifically monitoring changes to certain notable Dataplicity paths. If these actions are malicious, they could lead to unauthorized remote access and control over critical systems. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate uses of Dataplicity may also trigger these logs.

  ### Investigation Steps

  - **Check file activity at targeted paths**: Query file event logs (Event ID 4663) for access or modifications to:
    - '/opt/dataplicity/tuxtunnel/manager'
    - '/opt/dataplicity/credentials'
    - '/etc/systemd/system/dataplicity.service'
    - '/etc/init.d/dataplicity'
    If observed, this may indicate potential misuse.

  - **Find parent process details**: Review Process Creation logs (Event ID 4688) for processes initiated by Dataplicity. Verify if the spawning process is legitimate (e.g., a known administrative service). Malicious indicators may include unexpected parent processes executing these file accesses.

  - **Monitor for simultaneous logins from external IP addresses**: Review logs for authentication attempts (Event ID 4624 and 4625) connecting to the hosts that accessed Dataplicity files. Unusual geographic locations or multiple failed login attempts may indicate malicious usage.

  - **Identify authorized users of Dataplicity**: Confirm who has legitimate access to Dataplicity on affected hosts by reviewing user accounts with that tool configured. Legitimate entries will likely correspond to IT staff or system admins, while unknown accounts should be scrutinized.

  - **Validate file integrity and creation times**: Investigate the timestamps of file modifications or creations within the Dataplicity directory. Suspicious timing could indicate recent exploits, especially if these actions coincide with detected breaches or escalated user privileges.

  ### Prioritization

  The alert should be considered medium severity due to potential impacts on the integrity and availability of affected systems, particularly if Dataplicity is utilized in sensitive environments. Given that remote access tools are commonly weaponized, there is a heightened likelihood of malicious abuse if unauthorized use is confirmed.

  ### Blind Spots and Assumptions

  This detection could be evaded through modifications of file names or actions taken on legitimate systems without proper monitoring configurations. Ensuring that Windows Auditing is enabled for file integrity verification is critical for reliable detection. Additionally, legitimate administrative actions related to Dataplicity could inadvertently trigger this alert. A companion detection could focus on monitoring network traffic for unusual connections initiated by known Dataplicity executables to further strengthen coverage.

