note: |
  ### Technical Context

  This Sigma rule detects file access events associated with the Dataplicity Remote Monitoring Management (RMM) tool, which typically includes access to configuration and credential files. The likely attacker objective is to establish persistence and maintain control over compromised systems. This behavior corresponds to the MITRE ATT&CK technique for Remote Command and Control (C2) under the tactic "Command and Control" (ID T1219). The primary telemetry sources are Windows file event logs, specifically targeting access to files related to the Dataplicity tool.

  If confirmed malicious, this behavior can facilitate unauthorized remote access, potentially enabling data exfiltration or system compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate use of Dataplicity for remote management could trigger this rule.

  ### Investigation Steps

  - **Check Recent File Access Events:** Review Windows Security Event ID 4663 for access to files ending with '/opt/dataplicity/tuxtunnel/manager', '/opt/dataplicity/credentials', '/etc/systemd/system/dataplicity.service', or '/etc/init.d/dataplicity'. Focus on timestamps and user account associated with the access.

  - **Identify User Context:** Analyze who accessed the files by examining fields in the Event Logs such as `SubjectUserName`. Legitimate access by known administration accounts may indicate benign activity, while access by unusual accounts or non-administrative users should raise concern.

  - **Review Process Creation Events:** Cross-reference with Sysmon Event ID 1 to identify if processes were spawned after file access. Look for unusual parent-child process relationships, particularly involving Dataplicity executables.

  - **Identify Unusual Access Patterns:** Look for unexpected file modification or execution times, especially outside of maintenance windows. Any access between midnight and early morning hours could be indicative of malicious activity.

  - **Confirm File Integrity or Modification:** If files were altered, check file hashes against known-good baselines. Event ID 4663 can help identify changes. Create a baseline of expected file states for Dataplicity and look for unauthorized changes.

  ### Prioritization

  Alerts triggered by this Sigma rule warrant medium severity. The affected system’s role is significant if it manages critical infrastructure or sensitive data. Given that Dataplicity is an RMM tool, it can be realistically exploited for unauthorized remote access, making this behavior relevant for investigation.

  ### Blind Spots and Assumptions

  This detection may exhibit limitations if the log sources are misconfigured or if file activity is obfuscated. Alternatively, legitimate administrative activities may falsely trigger the alert when authorized personnel access these files. Companion detections, such as monitoring for changes to system configurations (e.g., unrecognized services starting), can enhance coverage and help contextualize potential malicious activity.

