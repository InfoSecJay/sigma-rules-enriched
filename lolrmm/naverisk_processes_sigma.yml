note: |
  ### Technical Context

  This rule detects the execution of the Naverisk RMM tool, specifically processes initiated by the `AgentSetup-*.exe` executable. The primary objective of an attacker utilizing this tool is to maintain remote access or control over compromised systems, enabling further exploitation or data exfiltration. Key MITRE ATT&CK tactics and techniques associated with this behavior include Command and Control (TA0011) and Remote Access Software (T1201).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Windows Security Event ID 4688 (process creation events) and Sysmon Event ID 1. If malicious, the presence of Naverisk RMM indicates a potentially compromised environment where an adversary can remotely manage or manipulate the system. However, this detection alone does not confirm malicious intent, as Naverisk can also be used legitimately by IT teams for remote support and management.

  ### Investigation Steps

  - **Check process creation events**: Review Security Event ID 4688 and Sysmon Event ID 1 for the process tree, focusing on instances where `ParentImage` ends with `\AgentSetup-*.exe`. Look for unusual parent-child relationships that deviate from established norms.

  - **Identify legitimate uses**: Cross-reference detected processes with known operating procedures within the organization. Verify if the process initiation corresponds with documented IT activities or support requests.

  - **Review network connections**: Examine outbound traffic logs (such as firewall or proxy logs) for indications of communication with known malicious IP addresses or domains commonly associated with Naverisk. Look for HTTP/S requests made to unexpected or unauthorized domains.

  - **Analyze account activity**: Investigate the user account associated with the process creation. Ensure the account has a legitimate business use and check for anomalous authentication events (Event ID 4624) that may indicate credential compromise.

  - **Look for persistence mechanisms**: Check for registry keys or scheduled tasks related to Naverisk installation files. Inspect specific registry paths like `HKLM\Software\Microsoft\Windows\CurrentVersion\Run` for entries that could indicate persistence beyond initial execution.

  ### Prioritization

  The alert has medium severity due to the potential impact of remote access tools compromising critical systems. The likelihood of malicious abuse is notable as RMM tools are commonly targeted by attackers. While not all instances are malicious, the execution of Naverisk should be treated with caution because such tools are frequently weaponized in attacks.

  ### Blind Spots and Assumptions

  This detection may miss instances where the Naverisk tool is renamed to evade detection, or where legitimate administrative activities mimic suspicious behavior. Effective detection relies on consistent logging from both process creation and network traffic sources; misconfigured logging may lead to blind spots. Additionally, benign activities like IT troubleshooting may trigger this alert, potentially leading to false positives. A companion detection to consider is monitoring for unusual network traffic patterns associated with remote access tools, which can provide context for the detected process execution.

