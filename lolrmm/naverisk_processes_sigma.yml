note: |
  ### Technical Context

  This Sigma rule detects the execution of processes related to the Naverisk RMM (Remote Monitoring and Management) tool, specifically those where the parent process is a setup executable. The primary objective of an attacker using such tools is typically to establish remote access to a victim's system for ongoing management or exploitation. This behavior correlates with the MITRE ATT&CK technique "Remote Management Tools" (T1219). The primary telemetry sources involve Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process creation events.

  If malicious, the security impact can be significant, potentially leading to unauthorized access or control over endpoints within the environment. It is essential to note that this detection does NOT confirm unauthorized access or malicious intent on its own; legitimate use of Naverisk for IT management is a common occurrence.

  ### Investigation Steps

  - **Check process creation events:** Review Windows Security Event ID 4688 for process creation where `Image` ends with `AgentSetup-*.exe`. Verify the execution time and user context to identify any anomalies related to usage patterns.

  - **Identify the parent process:** Look for Security Event ID 4688 where the `ParentImage` contains `AgentSetup-*.exe`. Valid parent processes typically include `services.exe` (for legitimate setups), while unusual parents might indicate suspicious activity.

  - **Examine user account details:** Investigate the account and user context in which the executable ran. Legitimate administrative activity should correlate with known IT support users or service accounts that regularly initiate Naverisk.  Review the `SubjectUserName` field for matches to expected legitimate usage.

  - **Validate previous activity:** Check for prior activity associated with the same process or user in Sysmon logs (Event ID 1). Document the execution chain and confirm that it aligns with documented IT management procedures to identify potential misuse.

  - **Monitor for additional artifacts:** Look for other related telemetry such as files generated during the installation or operation of Naverisk (e.g., logs in `%ProgramData%\Naverisk`), which may indicate legitimate operations versus malicious use.

  ### Prioritization

  The alert is considered medium severity due to the potential impact on critical systems if Naverisk is used maliciously. The likelihood of malicious adversaries weaponizing RMM tools is increasing, especially in the context of remote access and management tools. Therefore, timely investigation is crucial.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate use of Naverisk to trigger alerts, which can create false positives. Reliable detection requires proper logging and monitoring of process creation events. Additionally, organizations may encounter legitimate scenarios involving IT personnel using Naverisk. A related detection to consider is monitoring for unusual outbound network connections from the machine running Naverisk; such anomalies could enhance threat identification.

