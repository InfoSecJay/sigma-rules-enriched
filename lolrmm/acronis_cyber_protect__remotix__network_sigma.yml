note: |
  ### Technical Context

  This Sigma rule detects network activity originating from endpoints communicating with the Acronis Cyber Protect (Remotix) RMM tool via specific cloud domains. The primary behavior observed is unauthorized or unexpected connections to Acronis-related URLs, indicating potential misuse of remote management capabilities. Operationally, an adversary may leverage RMM tools to gain unauthorized access and control over systems for lateral movement or data exfiltration.

  The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and the technique is **Remote Access Software** (T1219). Primary telemetry sources include Windows event logs specific to network connections, which detail outbound traffic to the indicated domains and their corresponding IP addresses. If malicious, the security impact can involve unauthorized access to sensitive systems or data breaches. Importantly, this detection does NOT confirm malicious intent without additional context or supporting evidence from the affected systems.

  ### Investigation Steps

  - **Identify network connection details**: Review Windows Security Event ID 5156 (Windows Filtering Platform) for logs showcasing connections to "cloud.acronis.com" or other specified domains. Look for unusual timings (e.g., late-night connections) or unexpected source IPs.

  - **Correlate with asset inventory**: Validate whether the affected device is within the inventory of systems that legitimately use Acronis Cyber Protect (Remotix) based on asset roles. If it is a non-administrative role, further investigation is warranted.

  - **Check for remote access software installations**: Query installed programs on the endpoint (via PowerShell command `Get-WmiObject -Class Win32_Product`) for any instances of Acronis Cyber Protect or associated tools. Unrecognized installations may indicate a potential compromise.

  - **Examine behavioral artifacts**: Look for new or unexpected executables and connection logs related to the identified Acronis domains in Sysmon Event ID 3 (Network Connection). Investigate timestamps and file paths for any signs of recent suspicious activity.

  - **Review recent user activity**: Analyze user logs for logins by known administrative accounts around the time of the detected network activity. Unexpected logins could indicate privilege escalation or unauthorized use of the RMM tool.

  - **Assess system logs for alerts**: Check Windows Event ID 4624 (Logon) for any successful logons from unfamiliar accounts or devices around the time the detected connections occurred. This may reveal lateral movement attempts.

  ### Prioritization

  The alert's severity is medium due to the potential impact on sensitive systems where Acronis Cyber Protect is inappropriately accessed. Given that RMM tools are often weaponized for unauthorized remote access, the likelihood of malicious abuse is moderate, especially if these tools are not standard in your environment.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques such as IP whitelisting by threat actors to mask their activity. Reliable detection requires comprehensive logging from endpoints, including Windows Filtering Platform logs. Legitimate administrative activities may occasionally trigger this alert, such as routine remote management by authorized IT staff. Companion detections include monitoring for anomalous inbound traffic to systems from the same Acronis-related domains to strengthen coverage against unauthorized access attempts.

