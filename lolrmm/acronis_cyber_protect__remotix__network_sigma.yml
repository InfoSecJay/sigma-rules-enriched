note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to known domains associated with the Acronis Cyber Protect (Remotix) remote management tool. Attackers may utilize Acronis for remote access to compromised systems or to exfiltrate sensitive data while masquerading as legitimate administrative actions. This activity fits within the MITRE ATT&CK framework under the “Command and Control” tactic, specifically technique T1219: Remote Access Software.

  Primary telemetry sources for this detection include Windows network connection logs, specifically tracking destination hostnames for network traffic (e.g., via Windows Event ID 5156). If malicious, this behavior could indicate unauthorized access and potential data theft. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of Acronis as a tool can generate similar signals.

  ### Investigation Steps

  - **Inspect outbound connections:** Review network connection logs for Event ID 5156. Look for connections to domains such as `*.cloud.acronis.com` or `*.gw.remotix.com`. Connections to these domains could be legitimate or malicious, depending on the context.

  - **Validate legitimate usage:** Confirm if Acronis Cyber Protect is officially installed and used within the environment. If so, user accounts authorized to access these tools should correlate with the connections observed.

  - **Identify abnormal user activity:** Review the users associated with the identified outbound connections. Check their login times, geolocation, andwhether the connections originated from unusual assets or times, which may indicate compromised credentials.

  - **Check for file transfer artifacts:** If connections indicate data exfiltration, analyze file creation or modification timestamps in relevant directories (e.g., C:\ProgramData\Acronis\) to identify rogue file movements or unexpected file types (e.g., .zip, .exe).

  - **Correlate with session logs:** Look at Remote Desktop Protocol (RDP) or AnyDesk session logs for activity occurring around the same time as the detected connections to assess if there are any unauthorized sessions.

  - **Review firewall and proxy logs:** Validate network activity against firewall or proxy logs to check for other anomalous traffic. Search for similar destination hostnames in HTTP, HTTPS logs, or SIEM tools for deeper context.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems that could be accessed through Acronis Cyber Protect. The likelihood of malicious exploitation is moderate; while such tools can be used for legitimate administration, they are also commonly leveraged by attackers for command and control operations.

  ### Blind Spots and Assumptions

  The detection may be limited by the absence of comprehensive monitoring for legitimate Acronis activity, potentially leading to false positives. Reliable detection requires that all network logs are properly configured and monitored across the enterprise. Legitimate uses, such as IT support activities or scheduled maintenance by authorized personnel, may trigger the alert. A related detection to consider is logging for atypical remote access software connections (e.g., TeamViewer, AnyDesk) to strengthen coverage against remote access exploitation strategies.

