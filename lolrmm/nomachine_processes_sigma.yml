note: |
  ### Technical Context
  This rule detects the execution of processes associated with the NoMachine remote management tool (RMM). NoMachine is often used for legitimate remote desktop access, but it can also be exploited by threat actors for unauthorized access to systems, thereby compromising sensitive data and furthering their objectives such as lateral movement or persistent access. Attackers may use NoMachine to bypass traditional remote access controls or to establish covert connections to exploit vulnerabilities in target systems.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Execution** (TA0002)
  - **Remote Services** (T1219)

  The primary data sources for this detection are process creation events, which provide insights into the applications that are being executed on the system. Monitoring these logs helps uncover potential unauthorized use of remote management tools that may be leveraged for malicious purposes.

  ### Investigation Steps
  - **Review Process Creation Events:** Investigate the process creation logs for entries involving NoMachine or its associated components (e.g., `nomachine.exe`, `nxd.exe`). Look for unusual execution patterns or processes initiated outside of standard organizational hours.

  - **Examine Parent-Child Process Relationships:** Analyze processes that have `nomachine.exe` or `nxd.exe` as their parent processes to understand the context of their execution. Identify any unfamiliar or unexpected child processes that may indicate malicious intent.

  - **Check User Context:** Determine which users executed the identified processes and if their roles justify using a remote management tool. Look for signs of compromised accounts or unusual user behavior.

  - **Audit Network Connections:** Investigate network logs for connections initiated by NoMachine processes. Analyze destination IPs and ports used during these sessions to identify any connections to known malicious hosts or unauthorized external access.

  ### Prioritization
  This alert is classified with medium severity due to the potential impact of unauthorized remote access tools. In an enterprise environment, the presence of NoMachine processes can indicate either legitimate administrative activity or malicious intent, warranting further investigation to differentiate between the two.

  ### Blind Spots and Assumptions
  This detection may miss instances where NoMachine is executed using non-standard names or by methods that evade process creation logs (e.g., through script execution or alternate command-line methods). It assumes that the logging for process creation is enabled and properly configured in the environment. Furthermore, the detection logic does not account for legitimate uses of NoMachine, which could result in false positives and necessitates manual investigation to confirm the intent behind the detected activity.

