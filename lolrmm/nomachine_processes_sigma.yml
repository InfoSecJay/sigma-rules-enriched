note: |
  ### Technical Context

  This Sigma rule detects process activity associated with the NoMachine remote management tool, including executable files such as `nomachine.exe`, `nxservice.exe`, and `nxd.exe`. Attackers may use NoMachine as a method of remote access, potentially to establish command and control for further malicious activities. This behavior is relevant to the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1219). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If detected, this behavior could indicate a security breach, potentially allowing adversaries to control systems remotely. However, this detection alone does not confirm malicious intent, as NoMachine can also be used in legitimate remote support scenarios.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID 4688 and Sysmon Event ID 1 to identify any instances where `nomachine.exe`, `nxservice.exe`, or `nxd.exe` are launched. Look for clear parent-child relationships indicating unusual starting processes.

  - **Identify parent processes:** Analyze the `ParentImage` field in the logs to confirm if the processes were spawned by a legitimate application. Expected parent images might include `explorer.exe` for standard user interactions or other known remote desktop applications.

  - **Examine user accounts:** Investigate the `NewProcessName` and `TargetUserImage` fields for the user context in which the NoMachine processes were initiated. Legitimate business operations should show expected users (e.g., IT helpdesk) without signs of anomalous account usage.

  - **Check for network activity:** Use network logs to identify outbound connections from NoMachine processes. Look for unusual IP addresses or destinations that are not typically accessed by legitimate remote support activities.

  - **Correlate with system changes:** Check for other system events around the same time as the NoMachine process creation. Look for modifications to user permissions or group memberships that may indicate escalation of privileges (e.g., Security Event ID 4672).

  - **Validate operational necessity:** Confirm if NoMachine is a sanctioned tool in the environment by reviewing asset inventory and approved software lists. Document legitimate usage patterns in your SOC knowledge base for future reference.

  ### Prioritization

  The severity of this alert is medium because it involves potential unauthorized remote access to critical systems. The likelihood of malicious abuse is significant, especially if the environment typically does not use NoMachine. The behavior is known to be exploited by threat actors for remote control, raising concerns for enterprise security.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques like renaming executables or using similar remote management tools not covered by this rule. Ensure comprehensive logging from Windows process creation and the audit policy is correctly configured to capture all relevant events. Legitimate remote support activities, especially within technical teams, may invoke this alert as well. Consider implementing companion detections for other known remote access tools to enhance coverage and context for investigations.

