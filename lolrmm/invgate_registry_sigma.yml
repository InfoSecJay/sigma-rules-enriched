note: |
  ### Technical Context

  This rule detects potential registry modifications associated with the InvGate Remote Monitoring and Management (RMM) tool. InvGate RMM is commonly used for remote administration, and its installation or configuration changes may serve to provide unauthorized access or control over endpoints. The corresponding MITRE ATT&CK technique for this behavior is Remote Services (T1219), which encompasses adversaries leveraging legitimate remote management tools for nefarious purposes. The primary telemetry source for this detection is Windows Registry events, specifically capturing changes to specific registry keys that pertain to the InvGate tool.

  If malicious, this detected behavior could allow an adversary to gain remote access to the affected system, manipulate configurations, or exfiltrate data stealthily. It is crucial to note that this detection does NOT confirm malicious activity on its own, as these registry paths might also reflect legitimate uses of InvGate RMM in the organization when performed by authorized personnel.

  ### Investigation Steps

  - **Check for recent registry modifications:** Review the Windows Event Logs for Registry Event ID 4657, focusing on changes to the paths `HKLM\SYSTEM\CurrentControlSet\Services\InvClient` and `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{F0076285-D0E2-4B49-92BD-25E0B7B27DF6}`. Compare against standard operational procedures; expected modifications may be documented or authorized as part of regular IT operations.

  - **Identify command usage:** Use PowerShell logs (Event ID 4104) or command line history (Event ID 4688) to identify if InvGate was invoked through legitimate administrative scripts or actions which may account for the registry activity observed.

  - **Correlate installed applications:** Cross-reference the detected registry paths with installed software. Query installed applications (`Get-WmiObject Win32_Product`) for any recent installation of InvGate RMM, marking legitimate software deployments which correlate with expected business usage.

  - **Look for unusual user accounts or behaviors:** Check access logs and security events (Event ID 4624, 4625) for any logins or remote access attempts from unusual accounts at the time the registry changes were recorded. Normal usage should involve sysadmins or service accounts with regular access.

  - **Review asset criticality:** Assess the criticality of the affected host(s). Systems with high-impact roles (like database servers or domain controllers) should be prioritized for exhaustive investigations, as they may pose greater security risks if compromised.

  - **Examine for persistence mechanisms:** If suspicious modifications are confirmed, investigate further into the persistence techniques used by InvGate by querying for suspicious scheduled tasks or services using Sysinternals tools to ensure no hidden malicious binaries are installed.

  ### Prioritization

  This alert should be regarded as medium severity due to the potential impact of unauthorized remote access on a critical system. Given that RMM tools like InvGate can be weaponized for nefarious purposes, there exists a moderate likelihood of malicious abuse, particularly if such software is outside the norm for the environment.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate use of InvGate can generate similar registry modifications, leading to false positives. Organizations must ensure that appropriate logging for registry changes is enabled and that the involved systems are regularly monitored for expected configurations. Legitimate IT operations may also trigger this alert, such as software updates or maintenance tasks associated with InvGate. A related detection rule focusing on remote access software or other RMM tools can enhance coverage against misuse in enterprise environments.

