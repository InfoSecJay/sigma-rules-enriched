  ### Technical Context

  This rule detects activity involving the execution of the Nexus RMM (Scogo) remote monitoring and management tool, specifically targeting the file `nexusrmm.exe`. The likely attacker objective is to establish a command-and-control (C2) channel for remote access or management of a compromised system. The relevant MITRE ATT&CK tactic is **Command and Control** (T1071) and the technique is **Application Layer Protocol** (T1219). Primary telemetry sources include Windows file event logs, particularly monitoring for specific file execution events (e.g., Process Creation). If this behavior is malicious, it could enable unauthorized remote management and control over affected systems. Importantly, this detection does NOT confirm malicious intent on its own without further contextual analysis.

  ### Investigation Steps

  - **Verify the execution context**: Check Windows Security Event ID 4688 for the creation of the `nexusrmm.exe` process, including the user account that initiated it. Review the parent process to determine if it is a legitimate administrator or a suspicious application.

  - **Stabilize normal behavior**: Assess if `nexusrmm.exe` is part of approved software for remote management in your environment. Determine if expected legitimate use exists for the host, particularly in IT management contexts.

  - **Identify related file activities**: Review file system operations related to `nexusrmm.exe` using Sysmon Event ID 11, looking for atypical file creation, deletion, or modification in the same folder. Malicious activity may correlate with other unexpected processes or low-frequency commands.

  - **Examine network communications**: Utilize network monitoring tools to analyze outbound connections initiated by `nexusrmm.exe`. Focus on unusual destinations or non-standard ports that could indicate C2 traffic.

  - **Check for persistence mechanisms**: Investigate for any registry modifications related to Nexus RMM under `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run`, which could signify an attempt to retain foothold. Persistence indicates a deliberate attack effort.

  ### Prioritization

  This alert is categorized as medium severity due to the potential impact of the affected system, particularly if it is a server or high-privilege workstation. The likelihood of malicious usage is elevated as tools like Nexus RMM are often abused for unauthorized access and control. This behavior is notably weaponized by advanced threat actors for lateral movement or exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate Nexus RMM usage, which could lead to false positives. Effective detection requires accurate logging of Windows file events, necessitating proper configuration of logging settings. Routine IT maintenance actions or authorized managed services may also trigger this alert, demanding careful contextual review. Companion detection rules focusing on unusual outbound traffic patterns would enhance overall monitoring of this threat vector.

