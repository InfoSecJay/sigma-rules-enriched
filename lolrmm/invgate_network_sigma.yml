note: |
  ### Technical Context

  This rule detects outgoing network connections to domains associated with the InvGate RMM tool, which is a remote monitoring and management software often used for legitimate IT support and management tasks. An attacker may exploit such legitimate tools to gain unauthorized access to systems or orchestrate attacks by blending in with legitimate administration traffic. This activity maps to the MITRE ATT&CK tactic of Command and Control (T1071.001) through the technique of Application Layer Protocol (T1219).

  The primary telemetry source includes Windows networking logs, specifically looking for outbound connections to specific InvGate domain names. If malicious, this behavior may indicate the use of InvGate to facilitate unauthorized access or monitoring by an adversary. Crucially, this detection does NOT confirm malicious activity on its own, as legitimate use of the InvGate tool is common among IT departments.

  ### Investigation Steps

  - **Review network connection logs:** Check Windows Security Event ID 5156 for outbound connections to domains like 'invgate.com' or 'invgate.net'. Confirm if the connection appears legitimate based on the asset's role—determine if the host typically interacts with InvGate as part of expected administrative operations.

  - **Identify unusual user activity:** Correlate Windows logon events (Event ID 4624) with the network activity. Look for non-IT personnel or unusual login times that might indicate unauthorized use of the InvGate tool.

  - **Check for recent changes:** Review configuration management logs (for example, Microsoft System Center or similar solutions) for recent implementation or changes to the InvGate tool on the system. Legitimate installation or updates should show in the application logs.

  - **Analyze process creation:** Look for associated process creation logs (Sysmon Event ID 1) around the same timeframe as the detected network connections. Identify if the InvGate application or related scripts are being executed. Malicious indicators include unexpected paths or high privilege execution.

  - **Review firewall logs:** Examine any firewall logs for Event ID 106 events indicating blocked or allowed connections concerning these domains. Note any patterns of repetitive calls or unusual IP addresses being contacted, suggesting potential automated scripting.

  - **Validate user permissions:** Check user group memberships (e.g., local administrator roles) and associated permissions. Malicious use is more likely from accounts with elevated privileges, indicating unauthorized tools might have been deployed.

  ### Prioritization

  This alert has medium severity due to the potential risk posed by unauthorized remote access management tools. Given that InvGate can facilitate remote administration, its detection is critical in systems where it is not normally employed. The likelihood of abuse is moderate, making it imperative to review whether this behavior is linked to known malicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where InvGate is either commonly or occasionally used, leading to false positives. It is important to ensure logging for both network connections and process creation is properly configured throughout the enterprise. Legitimate IT activities might trigger this alert, particularly during maintenance or support windows. Related detection rules for other remote access tools (e.g., TeamViewer, AnyDesk) should have complementary coverage to provide better context and correlation of potential malicious use.

