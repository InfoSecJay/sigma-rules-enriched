note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the InvGate Remote Monitoring and Management (RMM) tool, specifically connections to various InvGate domains. The likely attacker objective is remote access or management of systems using InvGate without proper authorization. This behavior correlates with the MITRE ATT&CK Tactic "Execution" and Technique T1219 (Remote Access Software). The primary telemetry source for this detection is Windows network connection logs, particularly focusing on domain level details.

  If the alert is confirmed as malicious, it may signify unauthorized remote management, potentially compromising sensitive data or system integrity. However, this detection does NOT confirm that malicious activity is occurring on its own; it merely indicates the presence of network connections to domains associated with the InvGate tool.

  ### Investigation Steps

  - **Verify connection destination:** Check network logs for connections to InvGate domain names, focusing on DestinationHostname field (e.g., "invgate.com"). Look for any anomalous active connections that do not align with expected tool usage in the environment.

  - **Assess host role:** Determine the role of the host generating the alert. Legitimate uses of InvGate typically involve IT support teams, so confirm that the asset is associated with authorized support efforts.

  - **Cross-reference authorized applications:** Review installed applications (via software inventory logs or `Installed Applications` list) for the presence of InvGate or similar remote management software. If found, assess whether its usage aligns with company policies.

  - **Identify high-confidence malicious indicators:** Check for repeated connections or unusual data volume associated with the alerting host, especially in Event ID 5156 (Windows Filtering Platform) logs that may indicate unauthorized data flow to InvGate domains.

  - **Review historical connection patterns:** Analyze the timeline of connections to the InvGate domains. Legitimate usage typically shows consistent patterns during business hours, with infrequent connections outside of this timeframe.

  - **Monitor for subsequent artifacts:** If a connection is confirmed to an InvGate domain, validate any creation or modification of local files (per Event ID 4663, File Creation) that may indicate data exfiltration or malicious software deployment.

  ### Prioritization

  This alert carries medium severity due to the potential for sensitive data exposure if the InvGate tool is used maliciously, particularly on high-impact systems like servers or endpoints with privileged access. While this behavior can be abused, it is also often used legitimately, which necessitates careful analysis before conclusions are drawn.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of benign InvGate usage which may trigger alerts without malicious intent. Additional considerations for reliable detection are ensuring that all necessary network logs are collected, particularly those involving outbound connections. Legitimate administrative activities may trigger this alert, particularly within IT departments. A related detection to strengthen coverage would be monitoring for unusual login attempts or credential use on accounts that have access to remote management tools.

