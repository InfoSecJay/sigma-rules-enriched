note: |
  ### Technical Context

  This Sigma rule detects outgoing network connections from a Windows environment to known NetSupport Manager domains, such as `geo.netsupportsoftware.com` and `*.netsupportmanager.com`. The behavior indicates potential misuse of the NetSupport Manager remote management tool, which could be leveraged by adversaries for remote access or control of a system. The relevant MITRE ATT&CK tactic is Execution, specifically technique T1219 (Remote Access Tools).

  The primary telemetry source is Windows network connection logs, capturing outbound connections. If malicious, this behavior may allow unauthorized access to systems, leading to data exfiltration or further lateral movement within the network. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate uses of NetSupport Manager exist.

  ### Investigation Steps

  - **Review Network Connection Logs**: Check Windows network connection logs for Event ID 5156 indicating connections to domains such as `geo.netsupportsoftware.com` or `*.netsupportmanager.com`.
  - **Identify Source Process**: Investigate the originating process of the connection by correlating Event ID 4688 (Process Creation) to determine if the initiating process is associated with network administration or unauthorised software.
  - **Verify Legitimate Use**: Confirm whether NetSupport Manager is installed and used within the environment. Validate by checking installed applications on the system and looking for user activity logs indicating authorized support sessions.
  - **Check for Anomalies**: Look for multiple connections to these domains from different sources within a short timeframe, which could suggest compromised credentials. Analyze logs for unexpected processes initiating these connections.
  - **Investigate Traffic Patterns**: Examine the nature of the traffic involved in the outbound connection (volume, frequency, packet size) using tools like network monitoring software. Unusual patterns might indicate malicious intent.
  - **Contextualize System Importance**: Evaluate if the system initiating the connection is critical (e.g., a server vs. an endpoint) to determine the potential impact of a compromise.

  ### Prioritization

  This alert has a medium severity level due to the possibility of exploiting a legitimate remote management tool for malicious purposes. The impact can be significant if an adversary gains control over critical systems, but not all such connections are harmful, as legitimate use cases exist.

  ### Blind Spots and Assumptions

  This detection may face evasion techniques such as using alternative domains or IP addresses not covered in the rule. Reliable detection requires comprehensive logging configurations to capture all outgoing connections consistently. Additionally, legitimate remote support activities may frequently trigger this alert, so analysts should be cautious when assessing context. A related detection could monitor unusual login attempts via remote access tools to enhance coverage around potential abuse.

