note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the NetSupport Manager Remote Monitoring and Management (RMM) tool. The likely attacker objective is to establish remote access for control, monitoring, or data exfiltration purposes. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1219).

  The primary telemetry source comprises Windows network connection logs, specifically focusing on DNS queries and outbound connections. If malicious, this behavior could indicate a compromised system being used for unauthorized remote access or surveillance. Importantly, this detection does NOT confirm that the remote access is malicious, as NetSupport Manager can be legitimately used in IT management contexts.

  ### Investigation Steps

  - **Review connection destinations:** Analyze network logs for connections to known NetSupport Manager domains (`*.geo.netsupportsoftware.com`, `*.netsupportmanager.com`, etc.) by checking Event ID 5156 for Windows Filtering Platform (WFP) Connection events. Look for unusual patterns not aligned with IT management policies.

  - **Identify legitimate usage:** Validate recent changes in IT support activities or scheduled maintenance that would justify the use of NetSupport Manager. Compare the timestamps of detected connections against documented IT procedures.

  - **Examine user behavior:** Check the user associated with the connection to identify whether they typically engage in remote management tasks. Use Event ID 4624 to correlate logins and associations with direct system administration activities.

  - **Determine process origins:** Investigate the processes initiating the remote connections. Use Sysmon Event ID 1 to track process creations and ensure that any involved processes are legitimate and known to your organization's operational procedures.

  - **Monitor anomalous data traffic:** Assess for data exfiltration or unusual data transfers following the network connection using packet-level analysis or logs from security appliances. Look for unexpected volumes that exceed typical usage patterns.

  - **Check for unusual telemetry domains:** Investigate any connections to secondary domains such as `*.paternal-angrily.com` (indicative of potentially malicious behavior) to expose possible C2 infrastructure being leveraged by an attacker.

  ### Prioritization

  This alert has medium severity because of the potential security impact on systems involved in IT management. The likelihood of malicious abuse arises if systems are compromised and used for unauthorized remote access. While the specific activity detected can be legitimate, it is also commonly weaponized by attackers utilizing RMM tools for remote operations.

  ### Blind Spots and Assumptions

  Detection limitations exist due to environments where legitimate use of the NetSupport Manager is present, which can lead to false positives. The effective detection relies on having comprehensive Windows network logs enabled, particularly focusing on connection events. Legitimate IT management activities may trigger the alert; therefore, alignment with IT policies is crucial. Companion detections to consider include monitoring for unexpected persistence behaviors related to remote connectivity.

