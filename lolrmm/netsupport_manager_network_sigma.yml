note: |
  ### Technical Context

  This rule detects potential network connections to the NetSupport Manager Remote Management and Monitoring (RMM) tool's infrastructure. Attackers may utilize the NetSupport RMM tool to establish unauthorized remote access to systems, facilitating data exfiltration, command execution, or lateral movement within the network. Relevant to the MITRE ATT&CK framework, this behavior aligns with the Execution tactic and technique T1219 (Remote Access Tools).

  The primary telemetry source for this detection is Windows network connection logs that identify outbound connections, particularly to hostnames associated with NetSupport Manager. If malicious, this could present a significant security impact by granting attackers control over the targeted system. Importantly, this detection does NOT confirm that malicious activity is occurring; legitimate use of the software could trigger this alert.

  ### Investigation Steps

  - **Verify Network Connection Logs:** Check Windows network connection logs for Event ID 5156 (Windows Filtering Platform) or use Sysmon Event ID 3 to identify outbound connections to ‘*.netsupportmanager.com.’ Look for unusual connection attempts from endpoints not using NetSupport Manager legitimately.

  - **Assess Host Usage:** Examine asset roles and configurations for devices generating alerts. Identify whether NetSupport Manager is a sanctioned tool on these hosts. If the program is legitimate for remote access, assess user approvals and documentation.

  - **Extract Application Logs:** Review logs from any active NetSupport Manager agent installations (if applicable) for recent activities or user sessions. Investigate user accounts initiating these connections, focusing on accounts with administrative privileges or unusual access patterns.

  - **Cross-reference Active Sessions:** Identify any current or recently closed remote sessions related to NetSupport Manager from the logs. Review Event ID 4648 (Logon Attempt with Explicit Credentials) to ascertain if credentials used were valid.

  - **Identify Abnormal User Behavior:** Determine if any known user accounts are exhibiting suspicious activities, such as accessing sensitive files or executing commands atypical for their role, especially following remote sessions with NetSupport Manager.

  ### Prioritization

  Given the potential impact of compromised systems facilitated by remote access tools like NetSupport Manager, this alert should be treated with medium-high priority. The likelihood of malicious abuse is notable, as such tools are commonly weaponized to facilitate unauthorized access, especially in enterprise environments lacking strict control over remote access software.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for adversaries to configure their tools to use legitimate channels, thereby evading detection. The effectiveness of this rule hinges on proper logging configurations, including Windows Filtering Platform logs and Sysmon. Legitimate activities that may trigger this alert could include authorized IT support operations. A companion detection, such as monitoring for anomalous user logon behaviors or the use of other unauthorized remote access tools, can enhance coverage.

