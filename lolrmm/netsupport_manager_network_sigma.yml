note: |
  ### Technical Context

  This rule detects network activity related to the NetSupport Manager remote monitoring and management (RMM) tool. Attackers may leverage such tools for unauthorized remote access to control systems, steal sensitive data, or propagate malware within the network. This behavior aligns with the MITRE ATT&CK technique "Remote Access Tools" (T1219), representing a potential phase in an attack lifecycle where an adversary seeks to maintain persistence or exfiltrate data.

  The primary telemetry source includes Windows network connection logs, specifically monitoring for connections to domains associated with NetSupport Manager. If the detected activity is indeed malicious, it may indicate unauthorized remote access to critical systems or data exfiltration efforts. However, it is important to note that this detection does NOT confirm that the activity is malicious on its own, as legitimate use of NetSupport Manager by authorized personnel can generate similar network traffic.

  ### Investigation Steps

  - **Verify Destination Hostname:** Check the logs for network connection attempts to domains ending in `*.netsupportmanager.com`. Any connection to these domains may warrant further investigation.

  - **Cross-reference User Accounts:** Review the user account associated with the detected network activity. Unexpected usage by non-administrative user accounts may indicate malicious intent. Preferred log type: Security Event ID 4624.

  - **Identify Process Initiation:** Inspect any related process creation events (Security Event ID 4688 or Sysmon Event ID 1) that occurred around the same time as the network connection. Look for unusual or unauthorized process names that could indicate exploitation.

  - **Review Legitimate Use Cases:** Determine if legitimate NetSupport Manager usage is present in your environment by gathering operational logs from authorized users. If such activity is reported, weigh this against the detected alert.

  - **Monitor for Exfiltration Indicators:** Validate file activity related to sensitive data around the time of alerting. Review audit logs (e.g., File System Auditing, Event ID 4663) for suspicious file access patterns that may imply data exfiltration efforts.

  ### Prioritization

  The alert should be considered medium severity due to the potential impact of unauthorized access to critical systems. The likelihood of malicious abuse is moderate, as tools like NetSupport can be weaponized by adversaries for remote access. However, benign use is also common; thus, analysts must investigate context carefully.

  ### Blind Spots and Assumptions

  Detection may fail if DNS queries are not logged, or if logging for network connections is misconfigured or disabled. Legitimate corporate use of remote access tools can trigger this alert; therefore, analysts must differentiate between normal operational traffic and potential misuse. A related detection to enhance coverage includes monitoring for unusual process creation patterns that often accompany remote access activity (e.g., tools like PsExec or other remote management software).

