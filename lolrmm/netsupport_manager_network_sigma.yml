note: |
  ### Technical Context
  This rule detects potential network activity related to the NetSupport Manager Remote Monitoring and Management (RMM) tool. NetSupport Manager is software used for remote control and desktop sharing, which can be leveraged by attackers to gain unauthorized access or to maintain persistence in compromised environments. The detection focuses on outbound network connections to domains associated with NetSupport Manager, indicating possible misuse of the tool by threat actors for remote management of compromised systems.

  The primary objective of an attacker using the NetSupport Manager is typically to gather information or control affected machines without raising suspicion. This activity could align with various attack scenarios, including insider threats, initial access vectors, or lateral movements across a network. Relevant MITRE ATT&CK tactics/techniques include Execution (TA0002) and Remote Services (T1219), which highlight methods by which adversaries may execute commands or gain access through remote tools.

  Data sources that will contain critical evidence for these detections include network connection logs from firewall appliances, proxy logs, and endpoint telemetry from security solutions monitoring outbound network activities.

  ### Investigation Steps
  - **Review Network Connection Logs**: Examine the logs for any outbound connections to `*.netsupportmanager.com` or `netsupportmanager.com`. Pay special attention to the source IPs and times of these connections.

  - **Assess Endpoint Activity**: Investigate the endpoints that initiated the connections for any unusual processes or services related to remote management tools. Check for installed software and running processes that might indicate the presence of NetSupport Manager.

  - **Analyze User Activity**: Look into user account activities, especially those related to administrative or elevated privilege accounts. Determine if any accounts show patterns of unauthorized use of remote access tools.

  - **Evaluate Context**: Consider legitimate uses of NetSupport Manager in your environment. Cross-reference with documented business use cases, training records, and application logs to differentiate between authorized and suspicious behavior.

  ### Prioritization
  Given the potential for significant impact through unauthorized access and control, this alert is classified as medium severity. The likelihood of misuse is raised due to the prevalence of RMM tools in both legitimate administration settings and by malicious actors.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding other similar remote management tools that could be used maliciously but are not specifically part of this rule's focus. The detection logic assumes that the network connection to the specified domains indicates malicious activity; however, legitimate use of NetSupport Manager could lead to false positives. It is vital to ensure that relevant network traffic logs are being collected and that network monitoring for the specified domains is properly configured to maximize the effectiveness of this rule.

