note: |
  ### Technical Context

  This Sigma rule detects potential network activity related to the use of the NetSupport Manager remote management tool. Attackers may leverage this tool for command and control (C2) communications or to perform unauthorized remote access to compromised systems, facilitating lateral movement within a network. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically technique T1219 (Remote Access Software).

  The primary telemetry sources include Windows event logs that capture network connection events, specifically looking for connections to domains associated with NetSupport Manager. If malicious, this activity can significantly compromise network integrity, allowing attackers to manipulate systems and data remotely. However, this detection does NOT confirm the presence of an active compromise on its own; further investigation is needed to ascertain intent.

  ### Investigation Steps

  - **Check for network connections to known domains**: Examine the network connection logs for Event ID 5156 (Windows Filtering Platform) or Network Connection logs where the DestinationHostname matches 'geo.netsupportsoftware.com' or '*.netsupportmanager.com'.

  - **Identify activity patterns of legitimate use**: Look for expected scheduled tasks or user-initiated sessions where NetSupport Manager is utilized, which typically occurs during maintenance windows or legitimate remote support scenarios.

  - **Scan for unusual user account behavior**: Review user account logs and assess for accounts accessing the NetSupport Manager URLs that typically do not exhibit remote management usage; analyze User Logon events (Event ID 4624) around the same time as the network connection attempt.

  - **Trace data flows involving critical assets**: For any detected connections to NetSupport Manager URLs, correlate logs from relevant critical asset workflows to identify any unapproved data transfers or remote access sessions.

  - **Assess firewall logs for outbound connections**: Review firewall logs for outbound connections to the identified NetSupport Manager domains, particularly from systems not recognized as support or IT personnel workstations.

  - **Investigate high-confidence malicious activity indicators**: Look for alerts or behaviors indicating persistence or unusual access patterns, such as the installation of unauthorized software, which could serve as a precursor to remote access exploitation.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized remote access on sensitive systems. The likelihood of misuse is significant if the tool is misappropriated; remote management software like NetSupport Manager is often weaponized in attacks. Prompt investigation is critical to determining the legitimacy of the activity.

  ### Blind Spots and Assumptions

  The detection may be evaded if attackers use custom domains or encrypted channels not attributed to NetSupport Manager. Accurate detection requires proper configuration of logging for network connections and Windows Filtering Platform events. Legitimate IT support and maintenance sessions may trigger this alert; therefore, context surrounding network activity is essential. A companion detection to consider is monitoring for anomalous account logons around the same timeframe as detected network activity, which may strengthen efforts to identify potential intrusions.

