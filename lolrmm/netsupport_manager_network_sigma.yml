note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the NetSupport Manager Remote Monitoring and Management (RMM) tool. Attackers may utilize this tool to establish a command-and-control (C2) channel or to conduct remote administrative tasks once inside a network. The relevant MITRE ATT&CK tactic is Command and Control (T1071) and the technique is Application Layer Protocol (T1071.001).

  Primary telemetry sources include Windows network connection logs that show DNS queries and outbound connections to specific domains associated with NetSupport Manager. If this behavior is confirmed to be malicious, it could indicate unauthorized remote access, potentially compromising system integrity and data confidentiality. However, detecting this behavior does not confirm that unauthorized access has occurred; legitimate use of NetSupport Manager within an organization can trigger these alerts.

  ### Investigation Steps

  - **Identify the connection destination:** Check network connection logs (Event ID 5156) for outbound connections to `geo.netsupportsoftware.com`, `netsupportmanager.com`, or similar domains. If legitimate users frequently use these domains, it’s likely benign.

  - **Examine the process origin:** Look for the process generating the network connection using Sysmon Event ID 1. Validate that the originating process is expected (e.g., a facilitation service used by IT). Unexpected processes may indicate malicious activity.

  - **Review DNS query logs:** Cross-check DNS logs for queries to the domains listed in the rule. Investigate if multiple queries originated from unknown hosts or suspicious users, indicating possible misuse.

  - **Check for elevated privileges:** Analyze security logs (Event ID 4672) for user accounts initiating connections. Unusual privilege levels (e.g., a standard user connecting to RMM services) could highlight malicious intent.

  - **Assess historical usage:** Review historical events for previous legitimate connections to these domains. Frequent, recent connections might suggest either legitimate administration activities or potential misuse requiring further scrutiny.

  ### Prioritization

  This alert carries medium severity due to the potential for misuse of the system, especially if the affected asset is critical for operations. The likelihood of malicious abuse exists, as attackers may exploit remote management tools for lateral movement. However, given the tool's legitimate use, it requires careful review to differentiate between benign and malicious activity.

  ### Blind Spots and Assumptions

  Limitations in detection could arise from scenarios where the legitimate use of NetSupport Manager creates false positives. Ensuring thorough logging from all endpoints and network traffic, including comprehensive DNS logs, is critical for accurate detection. Additionally, similar legitimate remote management tools may trigger this alert. A companion detection to consider is monitoring for abnormal user activity patterns (e.g., rapid or unusual login attempts) that could indicate credential misuse in conjunction with detected network activity.

