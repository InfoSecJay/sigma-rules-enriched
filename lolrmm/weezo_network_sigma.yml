note: |
  ### Technical Context

  This rule detects outbound network connections to known domains associated with the Weezo Remote Management and Monitoring (RMM) tool, which is often exploited by malicious actors for command and control (C2) activities. The primary malicious objective is to facilitate remote access to compromised systems, allowing for data exfiltration or further exploitation. This activity maps to the MITRE ATT&CK tactic of "Command and Control" (TA0011) and the technique "Application Layer Protocol" (T1219).

  The primary telemetry sources include Windows network connection logs, specifically monitoring for DNS queries and outbound connections. If malicious, this behavior can lead to unauthorized access and control over systems, resulting in significant security compromises. It is important to note that the detection of these network connections does NOT confirm malicious activity on its own, as legitimate users may also utilize the Weezo application.

  ### Investigation Steps

  - **Review network logs for connections to the Weezo domain:** Check for outbound connections to domains such as `*.weezo.en.softonic.com`, `*.weezo.me`, and `*.weezo.net` in the Windows Network Connection logs (Event ID 5156). Note any patterns or frequencies that appear abnormal.

  - **Validate legitimate usage of Weezo:** Confirm if any known administrative users or systems are authorized to use Weezo for remote management. Cross-check asset documentation to ensure a legitimate use case aligns with the observed connections.

  - **Identify high-confidence malicious indicators:** Look for patterns of repeated connections to the identified domains over a short period, or attempts to establish multiple connections (e.g., multiple Event IDs 5156 logged in quick succession), which could indicate automated scripts or concurrent tools attempting to connect to the C2 server.

  - **Examine DNS resolution logs:** Check DNS queries related to the detected domains. Look for unusual query patterns (e.g., high query rates) using DNS server logs or accordingly configured logging for internal DNS services (Event ID 4662).

  - **Correlate with threat intelligence feeds:** Utilize threat intelligence sources to cross-reference the domains with known malicious activity or associations, identifying historical connections and potential compromise.

  - **Assess asset criticality:** Determine the role of the affected asset within the organization. Prioritize further investigation for critical systems or those containing sensitive data, as they would be prime targets for RMM tools if exploited maliciously.

  ### Prioritization

  The severity of this alert is medium. While the affected systems may not be directly compromised, the likelihood of malicious abuse exists, especially given the reputation of the Weezo tool in criminal activities. The behavior of connecting to known risky domains could lead to escalated threats if further exploited.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate users may use the Weezo tool for valid purposes, leading to false positives. Additionally, ensuring comprehensive logging configurations are in place is crucial for accurate detection; any gaps may result in missed instances of this activity. Consider companion detections like other C2-related domain or IP connections to strengthen overall detection coverage and context.

