note: |
  ### Technical Context

  This rule detects file activity related to the InvGate Remote Monitoring and Management (RMM) tool. The behavior may indicate that an attacker is leveraging legitimate administrative tools for unauthorized access or control over a system, potentially aiming to establish persistence or exfiltrate data. This aligns with the MITRE ATT&CK tactic: Command and Control (T1071) and the technique: Application Layer Protocol (T1219).

  The primary telemetry source is Windows file event logs, particularly focusing on specific file paths associated with the InvGate RMM tool. If malicious, this activity could allow an adversary to manipulate systems remotely, leading to significant data breaches or system compromise. However, these detections do not automatically confirm malicious intent, as legitimate administrative uses of InvGate RMM may exist.

  ### Investigation Steps

  - **Review file access events:** Check for Security Event ID 4663 to investigate access to specific InvGate RMM files (e.g., InvGate-ED.exe, usbLog.txt) to identify unauthorized usage patterns.

  - **Validate network connections:** Analyze Windows Firewall logs (Event ID 5156) for outbound connections initiated by the InvGate processes. Legitimate connections typically involve known management IPs or domains; anything unexpected should raise concern.

  - **Identify abnormal process creation:** Use Sysmon Event ID 1 to correlate new processes started by InvGate tools. Look for anomalies such as processes spawned from unusual parent processes which are typical for malicious exploitation.

  - **Check for log anomalies:** Investigate the file size and frequency of creation of InvGate logs (e.g., InvClient-Log.txt). Frequent generation of logs or unusually large file sizes might indicate excessive data collection, which is typically not expected behavior.

  - **Analyze asset criticality:** If the affected system is a critical server or a high-risk user, escalate the investigation, as the compromise may have a broader impact.

  - **Review existing legitimate usage:** Confirm known usage of the InvGate tool within the organization to distinguish benign activities from suspicious behaviors. Check for associated change management records or documentation.

  ### Prioritization

  This alert should be considered of medium severity. The impact on critical systems can be significant if an attacker abuses the InvGate RMM tool for lateral movement or data exfiltration. Given that RMM tools can be easily weaponized, the likelihood of malicious abuse is notable.

  ### Blind Spots and Assumptions

  This detection may miss usage of similar remote management tools or different versions of the InvGate software that do not match the defined file paths. It assumes proper logging for file access events and may not detect activities if logs are not correctly configured. Legitimate administrative activities, such as scheduled maintenance or support sessions, may also trigger this alert. A related detection to reinforce coverage would include monitoring for unauthorized installations of remote administration tools in the environment.

