note: |
  ### Technical Context

  This rule detects the execution of specific processes associated with the Senso.cloud Remote Monitoring and Management (RMM) tool. The likely attacker objective is to establish remote control over compromised systems, allowing for data exfiltration, system manipulation, or persistence. This activity maps to the MITRE ATT&CK technique "Remote Service Session Hijacking" (T1219).

  The primary telemetry sources are Windows process creation events, specifically Security Event ID 4688 or Sysmon Event ID 1, indicating when processes are created on the system. If this activity is malicious, it could lead to severe security impacts, such as unauthorized access to sensitive data or system configurations. It is essential to note that detection of these processes does NOT confirm malicious activity on its own; legitimate usage of Senso.cloud can trigger this alert.

  ### Investigation Steps

  - **Check process execution logs:** Review Security Event ID 4688 or Sysmon Event ID 1 to confirm the process creation of `SensoClient.exe`, `SensoService.exe`, or `aadg.exe`; pay attention to the user context and parent processes. Legitimate execution should be tied to known administrative or IT management accounts.

  - **Validate authorized presence of Senso.cloud:** Confirm the presence of Senso.cloud in your organization's management software inventory; if found, verify its intended deployment location and assets it manages.

  - **Identify anomalous parent processes:** Look for parent processes that do not commonly launch Senso.cloud processes, indicating potential malicious activity; check the ParentImage field in Event ID 4688.

  - **Correlate network activity:** Examine outbound network connections related to the Senso.cloud processes, focusing on unusual IP addresses or high data volume for an authorized asset. Look for connections in the Windows Firewall logs (Event ID 5156) associated with these processes.

  - **Review task scheduling logs:** Inspect task scheduler logs (Event ID 4698) to identify any scheduled tasks related to Senso.cloud, as adversaries may use this for persistence; ensure these tasks have valid context.

  ### Prioritization

  This alert is classified as medium severity due to the moderate impact of a compromised system when Senso.cloud is leveraged for unauthorized access. While Senso.cloud has legitimate administrative applications, its functionality makes it a potential vector for abuse, thus requiring careful scrutiny of any associated process activity.

  ### Blind Spots and Assumptions

  Detection may overlook legitimate uses of Senso.cloud, particularly in environments where it is integrated into regular IT operations. Evasion techniques may include renaming processes or executing them from non-standard paths. This detection relies on consistent logging of process creation and associated user activities. A companion detection to consider is monitoring for suspicious outbound connections to known malicious IPs or domains, reinforcing the analysis of potential data exfiltration.

