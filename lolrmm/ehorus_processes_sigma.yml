note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the eHorus Remote Monitoring and Management (RMM) tool on Windows systems. The primary objective of an attacker using eHorus is likely to gain unauthorized remote access and administrative control over target machines, potentially leading to data exfiltration or lateral movement within the network. This behavior relates to the MITRE ATT&CK tactic of Command and Control (ID T1071) and technique T1219 (Remote Access Software).

  The primary telemetry sources for this detection include Windows Security Event ID 4688 (process creation) and Sysmon Event ID 1, which log details about new processes launched on the system. If this behavior is malicious, it poses a significant security risk, as it could allow attackers to manipulate the system undetected. It is important to note that this detection alone does not confirm malicious activity, as eHorus may be used legitimately for remote management.

  ### Investigation Steps

  - **Review process creation logs**: Check Windows Security Event ID 4688 and Sysmon Event ID 1 for related process creation events. Look for entries with the Image field ending in any of the eHorus executable names listed in the detection (e.g., `ehorus_agent.exe`).

  - **Identify parent process details**: Investigate the ParentImage field for these entries. If the parent process is legitimate (e.g., a known remote management tool), this could indicate benign activity.

  - **Check for anomalous execution context**: Analyze the execution context of the detected processes. If they are started by uncommon users or processes (e.g., system or administrator accounts not normally used for management), this could indicate malicious activity.

  - **Correlate logs with network traffic**: Use network monitoring tools to evaluate any associated outbound connections from the affected system. Look for connections to known malicious IPs or domains related to remote access, especially those linked to the eHorus tool.

  - **Validate system roles and usage**: Confirm if the device running the eHorus processes is utilized for legitimate IT support activities. If not, this increases the likelihood of malicious exploitation.

  - **Document file creation or modification actions**: Investigate if the eHorus processes have created or modified files in unusual directories. Validate if any exfiltration artifacts (e.g., temporary files or logs) were generated during the active session.

  ### Prioritization

  The alert severity is medium due to the potential impact of unauthorized administrative access on critical systems. While eHorus may have legitimate uses, its association with remote access techniques makes it a target for malicious actors, suggesting vigilance in response.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate eHorus usage, which can falsely trigger alerts. Reliable detection requires proper configuration of logging for process creation events and ensuring all eHorus instances are accounted for. Legitimate administrative tasks can occasionally involve eHorus, potentially leading to false positives. A complementary detection strategy could include monitoring for unusual outbound network connections, which may further clarify intent.

