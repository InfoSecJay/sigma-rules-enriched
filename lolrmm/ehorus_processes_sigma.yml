note: |
  ### Technical Context

  This rule detects process activity associated with the eHorus Remote Monitoring and Management (RMM) tool, specifically by monitoring for processes with names ending in "ehorus*.exe". The likely attacker objective is to maintain persistence and control over compromised systems, enabling them to execute commands and pilfer sensitive data remotely. This detection relates to the MITRE ATT&CK technique "Remote Access Tools" (T1219).

  Primary telemetry sources for this detection rely on Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the impact could include unauthorized access to systems, data breach, and potential lateral movement within the network. However, this detection does NOT confirm that the activity is malicious without further investigation into its context.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for any instances of processes named "ehorus*.exe" on critical workstations and servers. Malicious instances will typically not have an associated legitimate user or predefined business context.

  - **Analyze parent processes:** Assess the parent process of "ehorus*.exe" to identify its source. Malicious instances may originate from unexpected locations, while legitimate activity will often have known parents (e.g., a system administrator or service account launch).

  - **Check eHorus configuration:** Investigate any existing eHorus configuration files or access logs in the file system (e.g., `%ProgramData%\eHorus`). Legitimate use will include documented endpoints and expected configurations.

  - **Cross-reference active sessions:** Utilize remote desktop access logs or session remote connection telemetry to determine if the eHorus agent was used in authorized maintenance sessions, which may indicate benign usage.

  - **Identify unusual user behavior:** Analyze user activity around the time eHorus processes were initiated. Any unexpected spikes in account privilege or unauthorized users invoking these processes could be a strong indicator of malicious intent.

  ### Prioritization

  The alert has medium severity, as the presence of eHorus can indicate potential misuse of administrative tools. Malicious actors often leverage RMM tools for persistence and lateral movement, making it essential to prioritize further investigation, especially in environments with sensitive or high-value systems.

  ### Blind Spots and Assumptions

  Evasion techniques could include renaming eHorus executables or executing legitimate eHorus functions in alternative contexts, such as a benign parent process. Reliable detection requires complete coverage of process creation logs, including proper Sysmon configuration. Legitimate activities, such as maintenance by IT personnel using eHorus, may trigger the alert; hence context is critical. Companion detections that enhance coverage include alerts for unusual remote access tool usage (e.g., TeamViewer, AnyDesk) in conjunction with this detection.

