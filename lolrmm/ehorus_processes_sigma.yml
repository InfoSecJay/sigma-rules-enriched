note: |
  ### Technical Context

  This Sigma rule detects the process activities associated with the eHorus remote monitoring and management (RMM) tool on Windows systems. Such activities are typically indicative of an attacker leveraging RMM software to establish persistent access and manage compromised systems remotely. The relevant MITRE ATT&CK tactic is Execution, with the technique identified as Remote Management Software (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If eHorus is used maliciously, it can facilitate unauthorized access, data exfiltration, and lateral movement within a network. However, this detection does NOT confirm malicious intent, as eHorus may also be abused legitimate administrative activities in environments where it's authorized.

  ### Investigation Steps

  - **Check process creation metadata:** Review process creation for `ehorus standalone.exe` via Security Event ID 4688 and analyze the Command Line details for suspicious arguments or flags that are uncommon in legitimate use cases.

  - **Identify parent process:** Investigate the parent process of `ehorus standalone.exe` by noting the ParentImage from Sysmon Event ID 1 to determine if it was executed from a benign application or another suspicious process.

  - **Examine user context:** Verify the user context under which `ehorus standalone.exe` is running. A legitimate administrative user may indicate expected behavior, while execution under a low-privilege or unusual account warrants further scrutiny.

  - **Correlate with network activity:** Cross-reference with network logs or firewall logs for connections initiated by the eHorus process, focusing on unusual outbound traffic patterns, particularly to unfamiliar or known malicious IP addresses.

  - **Review legitimate eHorus use cases:** Consult your organization's documentation or inventory of authorized software to validate whether the use of eHorus aligns with typical business operations.

  ### Prioritization

  This alert is of medium severity due to the potential impact of eHorus on sensitive systems and its capability to facilitate remote access and management by an adversary. The likelihood of malicious abuse is moderate, particularly in environments where administrative access is misconfigured or poorly monitored. This behavior can be weaponized if targeted against critical assets or during a breach.

  ### Blind Spots and Assumptions

  Detection may be limited if eHorus is misconfigured or installed in contexts where it is typically allowed, as it leads to legitimate activity triggering the alert. Log sources must be configured to capture both Security Event IDs and Sysmon events for reliable detection, highlighting the need for the Sysmon agent to be deployed correctly across the environment. A companion detection related to unauthorized service creation or modification (e.g., EDR alerts capturing Windows services) would strengthen overall coverage against potential abuse scenarios.

