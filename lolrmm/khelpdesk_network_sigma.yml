note: |
  ### Technical Context

  This Sigma rule detects network connections to KHelpDesk's domain (`*.khelpdesk.com.br`), which could indicate the usage of the KHelpDesk Remote Monitoring and Management (RMM) tool. Attackers may leverage this tool to remotely manage compromised systems, often facilitating further malicious activities such as data exfiltration or lateral movement within a network. This detection aligns with the MITRE ATT&CK technique for Remote Command Execution (T1219).

  The primary telemetry source is Windows network connection logs that can provide relevant evidence of outbound connections. If exploited, this could lead to unauthorized access to sensitive information or control over affected systems. It is important to note that this detection does NOT confirm malicious intent on its own, as KHelpDesk could be legitimately used by authorized personnel.

  ### Investigation Steps

  - **Verify connection details:** Check Windows network logs (Event ID 5156, Windows Filtering Platform) for outgoing connections to `*.khelpdesk.com.br`. Identify the source IP and the process responsible for the connection. A legitimate connection should originate from known authorized user accounts or administrative tools.

  - **Examine process activity:** Use Sysmon Event ID 1 to review process creation logs for any new or unusual processes that initiated connections to the KHelpDesk domain. Legitimate processes might include known RMM tools; suspicious processes should be investigated further.

  - **Assess user permissions:** Cross-reference the user account involved in the connections against Active Directory records to determine if they have appropriate privileges for using RMM tools. Unauthorized accounts accessing the service may indicate a breach.

  - **Inspect recent changes:** Review configuration logs, such as Windows Event ID 4702, for any policy changes or new software installations related to remote management tools. Abrupt changes in system configurations may warrant deeper investigation.

  - **Check for lateral movement indicators:** Look for additional network activity to or from internal systems accessing KHelpDesk. Use network flow data and event timestamps to correlate excessive or unusual internal traffic patterns that might suggest a compromise.

  ### Prioritization

  The severity of this alert is medium, as the KHelpDesk RMM tool can significantly impact system integrity if misused. While the likelihood of malicious abuse is present, the use of such RMM tools is also common for legitimate administrative tasks, requiring careful scrutiny.

  ### Blind Spots and Assumptions

  Detection may miss attempts to obfuscate domain usage, such as using alternate or internal domain names. Continuous logging from network devices is essential to reliably capture this activity. Legitimate administrative use can trigger alerts when legitimate staff access KHelpDesk. A companion detection that might strengthen coverage includes monitoring for abnormal usage patterns of network management tools across the enterprise.

