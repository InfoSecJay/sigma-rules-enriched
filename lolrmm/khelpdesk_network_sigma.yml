  ### Technical Context

  This Sigma rule detects network connections to domains associated with the KHelpDesk RMM tool, specifically those ending in '*.khelpdesk.com.br'. The detection indicates potential remote management activities that an attacker could leverage to gain unauthorized access or control over systems. The likely attacker objective would be to conduct reconnaissance, lateral movement, or operational execution via remote management software.

  This behavior aligns with MITRE ATT&CK tactics, specifically 'Execution' (T1203), as it involves running malicious code remotely. The primary telemetry sources include Windows network connection logs, specifically focusing on out-bound connections that may indicate a compromise. If malicious, this could lead to system manipulation, data exfiltration, or establishing persistent access. Note that this detection alone does not confirm malicious intent, as legitimate usage of the KHelpDesk tool may occur.

  ---

  ### Investigation Steps

  - **Review active network connections:** Examine Windows Event ID 5156 (Windows Filtering Platform) and Event ID 4648 (Logon attempt) to identify connections to '.khelpdesk.com.br'. A high volume or unusual connection patterns could indicate malicious activity.

  - **Correlate with endpoint logs:** Check Sysmon Event ID 3 (Network Connection) on the host to view process activity that initiated the connection. Evaluate the process name for known RMM software versus unusual process names that could indicate suspicion.

  - **Analyze user behavior:** Review logs for user account activities (Event ID 4624) associated with the active network connections. Legitimate uses would show consistent user behavior tied to known job functions; suspicious activity may lack user credentials or be triggered outside of business hours.

  - **Check for known indicators of compromise:** Validate if any processes correlating with the KHelpDesk connections are listed in threat intelligence feeds. Malicious indicators may include renamed system processes utilizing RMM or administrative privileges that deviate from standard operational practices.

  - **Evaluate historical connection data:** Look into the DNS query logs for a pattern of repeated connections to the KHelpDesk domains (e.g., related Event ID  DNS queries) that may help establish if the behavior is a one-time event or part of a broader malicious campaign.

  ---

  ### Prioritization

  Alert severity is medium based on the critical role of systems potentially accessed by RMM tools. While the use of such tools can be legitimate, their malicious abuse is increasingly common, reflecting a significant risk where unauthorized access and control can have damaging implications.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from misconfigured logging policies that fail to capture all process and network connection data. Users legitimately using KHelpDesk may trigger this alert, which complicates detection. Evasion techniques may include domain spoofing or using IP whitelisting. Complementing this detection with alerts for known remote access tools (e.g., RDP usage logs or TeamViewer connections) can provide a more comprehensive view of remote access risks.

