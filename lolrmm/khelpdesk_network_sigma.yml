note: |
  ### Technical Context

  This Sigma rule detects outbound network connections made to domains ending in "*.khelpdesk.com.br", indicative of the use of the KHelpDesk Remote Management and Monitoring (RMM) tool. Attackers often leverage RMM tools like KHelpDesk to establish a foothold in a network for persistence, remote control, and exploitation during post-compromise activities. This behavior correlates with the MITRE ATT&CK tactics of Command and Control (T1071) and Application Layer Protocol (T1219).

  The primary telemetry sources for this detection are Windows network connection logs. Relevant log types include firewall logs, Windows Event ID 5156 (Windows Filtering Platform), and potential network IDS alerts. If malicious, unauthorized RMM tool activity can lead to significant risks, including data exfiltration, lateral movement, and unauthorized access to sensitive systems. This detection does NOT, on its own, confirm that malicious activity is occurring; it merely indicates an endpoint is communicating with an associated RMM service.

  ### Investigation Steps

  - **Verify network connections:** Review Windows Event ID 5156 logs for outbound connections to "*.khelpdesk.com.br." Look for unusual time frames or frequencies outside normal business hours. Legitimate use should correlate with known IT support or maintenance schedules.

  - **Assess process execution:** Check for the presence of KHelpDesk executables in recent process creation logs (e.g., Security Event ID 4688 or Sysmon Event ID 1). Malicious use may involve suspicious or unexpected processes that do not typically run in the environment.

  - **Identify user accounts:** Investigate the user accounts initiating the connections. Legitimate KHelpDesk use should occur under accounts assigned to IT personnel. Identify any anomalous accounts that lack proper authorization or oversight.

  - **Examine network traffic:** Utilize network monitoring tools to analyze traffic patterns to the KHelpDesk endpoint. Look for unusual data volumes, sustained connections, or additional payloads that might indicate malicious behavior.

  - **Cross-reference related incidents:** Check historical alerts or incidents tied to KHelpDesk or similar RMM tools. The presence of prior alerts may indicate ongoing or evolving threats that should influence the current investigation.

  ### Prioritization

  This alert warrants a medium severity level. While not all connections to KHelpDesk are inherently malicious, the potential for abuse exists, particularly if the affected system is critical or contains sensitive data. This behavior aligns with established adversary tactics, making it essential to assess the context and activity behind these connections vigilantly.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of encrypted channels (e.g., HTTPS) to connect to KHelpDesk, which could obscure malicious activity. Required log sources must be consistently configured to capture the outbound network connections. Legitimate activity, such as authorized use by IT staff for system maintenance, will likely trigger this alert. Companion detections involving changes to account privileges or process creation can enhance visibility regarding potential compromise.

