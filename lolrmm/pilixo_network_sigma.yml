  ### Technical Context

  This rule detects network connections to domains associated with the Pilixo Remote Monitoring and Management (RMM) tool, specifically targeting requests to pilixo.com and its subdomains. Attackers leveraging unauthorized RMM tools like Pilixo may aim to maintain persistent access, conduct remote administration, or facilitate data exfiltration within the victim's environment. This behavior aligns with the MITRE ATT&CK technique for remote services usage (T1219).

  Primary telemetry sources include Windows event logs related to network connections (Event ID 5156) and DNS queries (Event ID DNS Client Events). The potential security impact is significant since unauthorized RMM tools can enable comprehensive control over an affected system, facilitating further exploitation and lateral movement. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate use of Pilixo in the enterprise may trigger the rule.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Check Windows Event ID 5156 for connections to pilixo.com or its subdomains. Look for the source IP addresses and the associated Process ID (PID) to correlate with known user processes.

  - **Correlate with DNS queries:** Validate DNS queries for pilixo.com (Event ID 4104 in PowerShell logs or DNS Client Event logs), highlighting which users or systems made those requests. Compare to legitimate user behavior.

  - **Identify the associated process:** Cross-reference any identified connections with the parent process (using Process ID). Confirm whether a known and expected administrative RMM tool or process is responsible.

  - **Assess legitimate use:** Determine if the organization has authorized Pilixo usage; consult team leads or system administrators regarding any contracts with third-party RMM providers.

  - **Look for high-confidence malicious indicators:** Check for unusual or unexpected outbound traffic volume or patterns (such as bulk data transfers) during the connection periods that might suggest data exfiltration.

  ---

  ### Prioritization

  Given the potential for impact on critical systems through unauthorized remote access and management, this alert carries medium severity. The likelihood of malicious abuse exists, particularly in enterprises where RMM tools are not used or are not sanctioned, as this type of tool is often exploited in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may miss cases where the Pilixo tool is used legitimately or if attackers mask their traffic over VPNs or through proxy servers. Ensure that relevant log sources (e.g., DNS and network connection logs) are configured and retained for reliable detection. Additionally, monitoring should consider legitimate administrative functions that may trigger similar traffic patterns, such as legitimate RMM tool usage from authorized IT personnel. A related detection for overall RMM tool activity could enhance coverage and reliability.

