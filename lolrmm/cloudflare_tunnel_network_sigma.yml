  ### Technical Context

  This rule detects outbound connections to CloudFlare Tunnel (RMM) service, which could indicate unauthorized remote access or administration attempts. Attackers may leverage this tool for persistence or lateral movement within a network by tunneling traffic to external command and control infrastructure. The relevant MITRE ATT&CK tactic is **Execution** (T1203) using the technique **Remote Access Tools** (T1219).

  The primary telemetry sources are Windows network connection logs, specifically monitoring the destination hostname for connections ending in "cloudflare.com/products/tunnel/". If malicious, the impact could be significant, facilitating remote access and potential data exfiltration. This detection does not confirm compromise by itself; further analysis is necessary to understand the context of the connection.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Check Windows Event ID 5156 for connections to cloudflare.com/products/tunnel/. Record the source IP, destination IP, and timestamp for context.

  - **Identify legitimate use cases:** Verify if the asset is known to use CloudFlare Tunnel legitimately (e.g., authorized remote management). Compare the user activity timeframe and asset role against the connection logs.

  - **Analyze user context:** Check user account activity around the time of the connection. Use Event ID 4624 (Logon) and assess for unfamiliar or high-risk user accounts engaging with the CloudFlare service.

  - **Correlate with endpoint telemetry:** Look for related Sysmon Event ID 3 (Network connection) and Event ID 1 (Process creation) that show the initiation of connections originating from processes that may signify remote access tools.

  - **Look for associated indicators:** Check for identifiable patterns such as unusual outbound traffic volume or connections following a suspicious internal event, indicating possible compromise.

  - **Document findings:** Maintain records in your incident tracking system, specifying whether the detected activity was authorized or resembling known attack patterns.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential for significant impact on network integrity if exploited, especially on critical systems. The likelihood of malicious abuse is moderate, considering that remote access tools are commonly targeted by attackers for lateral movement.

  ---

  ### Blind Spots and Assumptions

  The detection may miss legitimate uses of CloudFlare Tunnel by authorized personnel, leading to potential false positives. Required logs include complete Windows network connection logs and Sysmon configuration for comprehensive monitoring. The alert may also trigger from legitimate administrative activities. For strengthened coverage, consider monitoring explicit Sysmon network connections (Event ID 3) alongside this rule.

