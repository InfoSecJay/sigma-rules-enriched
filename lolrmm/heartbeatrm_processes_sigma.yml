note: |
  ### Technical Context

  This rule detects the execution of processes associated with HeartbeatRM, a remote monitoring and management (RMM) tool commonly utilized for IT management tasks. The likely attacker objective is access and control over systems for maintaining persistence or performing lateral movement within an environment. This relates to the MITRE ATT&CK technique *RMM Tool (T1219)*, which describes the use of legitimate remote management tools to facilitate attacks.

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process initiation and lineage. If malicious, the exploitation of this tool could lead to unauthorized remote access, widespread compromise, and potential data exfiltration. This detection does not confirm malicious intent on its own, as legitimate administrative use of HeartbeatRM may trigger similar events.

  ### Investigation Steps

  - **Check Process Creation Events**: Review Security Event ID 4688 or Sysmon Event ID 1 for the creation of processes named 'agent-installer-any.exe', 'hbrm-x64.exe', or 'hbrm-updater-x64.exe'. Similar malicious processes might not exhibit parental lineage from trusted executables.

  - **Analyze Parent Process**: Inspect the ParentImage field for suspected process initiation by legitimate administrative tools or scripts. Legitimate administrative actions should not commonly create these processes directly.

  - **Correlate with Asset Inventory**: Validate if the affected system is an authorized user or asset for HeartbeatRM. Refer to the asset management database to identify users who are permitted to use this RMM tool.

  - **Evaluate Process Arguments**: Gather and analyze any command-line arguments associated with the detected processes. Malicious activities may include unusual flags or connections indicative of network abuse.

  - **Review Network Connections**: Check for outbound network connections or communication patterns originating from the processes. Unusual or unauthorized connections to unfamiliar IP addresses could indicate malicious activities.

  - **Validate Legitimate Usage**: Confirm recent legitimate activities related to HeartbeatRM, such as scheduled maintenance or updates, by reviewing internal ticketing systems for reported admin actions matching the timing of the alert.

  ### Prioritization

  This alert has medium severity due to its potential impact on critical systems using RMM tools for management. Given the likelihood of adversaries exploiting legitimate tools for malicious intents, analysts should prioritize this alert, particularly on systems that handle sensitive data or critical infrastructure.

  ### Blind Spots and Assumptions

  Detection may be limited by instances where HeartbeatRM is misconfigured, preventing adequate logging. Evasion techniques may include renaming executables or invoking processes under benign parent processes. Legitimate activities, such as scheduled updates from trusted administrators, may trigger the alert. Companion detection may include monitoring for unusual command-line arguments in conjunction with the execution of this RMM tool.

