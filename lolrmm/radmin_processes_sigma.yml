note: |
  ### Technical Context

  This Sigma rule detects the potential execution of the RAdmin Remote Management Tool (RMM) by monitoring process creation events where the parent or child processes are `Radmin.exe` or `rserver3.exe`. The likely attacker objective is to establish remote access to a target system, enabling control and potential data exfiltration. This activity relates to the MITRE ATT&CK tactic of Command and Control (T1219).

  The primary telemetry sources include Windows security logs for process creation (Event ID 4688) and Sysmon logs for process creation (Event ID 1). If malicious, this activity can lead to unauthorized access and control over affected systems. However, this detection does NOT confirm malicious intent on its own, as RAdmin may be used legitimately by IT administrators for support purposes.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 to identify the creation of `Radmin.exe` or `rserver3.exe`. Look for parent-child relationships indicating whether these processes were spawned from legitimate administrative tools or scripts.

  - **Evaluate process parent-child relationships:** Investigate the parent process of `Radmin.exe` or `rserver3.exe`. A legitimate administrative process (e.g., PowerShell or cmd.exe) could indicate benign usage, while execution from suspicious executables may signal malicious behavior.

  - **Analyze user context:** Review the user account linked to the process execution. Legitimate activity typically originates from administrative accounts (e.g., `Domain Admins`, `Helpdesk`). Note unusual account usage or execution from non-administrative accounts.

  - **Search for associated network activity:** Look for outbound network traffic to uncommon ports or IP addresses from the affected machine that correspond to the execution time of RAdmin. Such traffic could indicate data exfiltration or command and control communication.

  - **Confirm installation without unauthorized alterations:** Validate the presence of RAdmin software through file system checks. Legitimate installations should be located in standard directories like `C:\Program Files\RAdmin`. Unusual file paths suggest a possible unauthorized installation.

  ### Prioritization

  This alert has a medium severity due to the implications of remote access enabled by RAdmin on affected systems, which could facilitate significant data breaches or escalated attacks. While RAdmin is sometimes legitimately used by IT staff, its common use within enterprise environments heightens the risk of malicious exploitation, especially if occurring from low-privilege accounts.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases where RAdmin is actively employed for remote management, leading to potential false positives. Ensuring the logging of process creation events (Event ID 4688 and Sysmon Event ID 1) is crucial for reliable detection. Other similar remote access tools (e.g., TeamViewer or AnyDesk) operating under similar conditions may not be detected, highlighting the need for companion detections focused on those applications.

