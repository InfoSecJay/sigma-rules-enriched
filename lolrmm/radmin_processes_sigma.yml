  ### Technical Context

  This Sigma rule detects the execution of processes related to the RAdmin Remote Monitoring and Management (RMM) tool by analyzing the parent and child process relationships. The likely attacker objective is to establish remote access to compromised systems to facilitate further exploitation, data exfiltration, or lateral movement within the network. The relevant MITRE ATT&CK tactic is Execution, with the corresponding technique being Remote Access Tools (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, which captures process creation events, and Sysmon Event ID 1 for detailed process monitoring. If malicious, the security impact can be severe, as it may indicate an adversary gaining unauthorized remote access. Importantly, this detection alone does not confirm malicious intent, as RAdmin may be legitimately used by IT personnel for remote support tasks.

  ---

  ### Investigation Steps

  - **Review recent process creation events: ** Identify instances of Security Event ID 4688 or Sysmon Event ID 1 where the Process Name ends with "Radmin.exe" or "rserver3.exe". Check for anomalies in timing or frequency.

  - **Analyze parent process relationships: ** Investigate parent processes associated with detected instances of RAdmin. Look for unusual parent processes that could indicate malicious execution, such as PowerShell or cmd.exe.

  - **Correlate user accounts: ** Examine which user accounts executed the RAdmin processes by reviewing the “New Process Name” and “Creator Process ID” fields in the logs. Validate against known administrative users or support staff.

  - **Verify legitimate usage patterns: ** Determine if the RAdmin activity corresponds with known support requests or user activity. Compare timestamps with help desk tickets or scheduled maintenance work to confirm benign usage.

  - **Check network activity: ** Monitor network logs for unusual outbound connections associated with RAdmin (ports used, IP addresses contacted) within the same timeframe. Look specifically for connections to unauthorized external IP addresses.

  - **Inspect logs for known malicious indicators: ** Look for indicators linked to known RAdmin misuse or malware that could exploit it. This includes unusual file modifications or access patterns in sensitive directories following the RAdmin process events.

  ---

  ### Prioritization

  The alert is of medium severity due to the potential for high impact on sensitive systems if malicious remote access is confirmed. The likelihood of malicious abuse is moderate, as RAdmin is known to be weaponized in various attacks. However, legitimate uses by IT personnel could create false positives, necessitating careful investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of appropriate logging configurations or if RAdmin is executed by trusted IT personnel, leading to benign alerts. Additionally, adversaries might disguise their activity by using legitimate RAdmin installations, making detection challenging. A related detection strategy is monitoring for unusual PowerShell commands or script executions (T1059.001) that may indicate initial access or lateral movement in conjunction with RAdmin usage.

