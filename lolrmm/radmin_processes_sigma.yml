note: |
  ### Technical Context
  This rule detects the execution of processes associated with the RAdmin Remote Management (RMM) tool, specifically looking for the parent and child processes `Radmin.exe` and `rserver3.exe`. The RAdmin tool is often used for remote control and management of Windows systems, which makes it a double-edged sword—while it can be used legitimately for administrative tasks, it is also a known vector for malicious actors seeking to gain unauthorized access to systems.

  In a potential attack scenario, an adversary might exploit RAdmin to establish a remote session on a compromised machine, facilitate lateral movement within a network, or perform reconnaissance on targets. The relevant MITRE ATT&CK tactics associated with this rule include "Execution" (TA0002) and the specific technique "Remote Access Software" (T1219).

  The primary data source for this detection will be Windows process creation logs, which provide visibility into newly initiated processes and their relationships, crucial for identifying suspicious behaviors tied to remote management tools.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate the process creation logs for instances of `Radmin.exe` or `rserver3.exe` execution. Check for unusual parent-child process relationships that deviate from standard operational behavior.

  - **Analyze Parent Process Indicators:** Look into the parent processes that launch RAdmin. Determine if these parent processes are typical for your environment and if there are any anomalies indicating possible unauthorized access.

  - **Conduct Network Traffic Analysis:** Examine network traffic for connections established by RAdmin tools. Verify if the remote access point is legitimate or aligns with known administrative practices.

  - **Verify User Accounts and Sessions:** Confirm the legitimacy of the user accounts associated with the RAdmin sessions. Investigate any anomalies in user login times, locations, and associated activities that may indicate misuse.

  ### Prioritization
  Given that RAdmin can provide significant control over systems, alerts triggered by this rule should be treated with medium severity. The presence of such tool activities could indicate unauthorized remote access attempts, warranting immediate investigation to prevent potential breaches.

  ### Blind Spots and Assumptions
  The detection logic assumes that the execution of RAdmin processes likely signifies malicious activity, which may not account for legitimate administrative usage in certain contexts. Additionally, if process creation logging is not enabled or is improperly configured, this could lead to gaps in detection coverage. Analysts should ensure that Windows Event Logs are correctly capturing process creation events to facilitate effective monitoring and detection of this activity.

