note: |
  ### Technical Context

  This Sigma rule detects network activity related to the Netviewer (GoToMeet) remote monitoring and management (RMM) tool by monitoring outbound connections to specific Netviewer domains. The likely attacker objective could involve remote access to compromised systems, enabling the execution of unauthorized commands or data exfiltration. This behavior aligns with the MITRE ATT&CK technique of Remote Access Software (T1219) under the Execution tactic. Primary telemetry sources for this detection include Windows network connection logs. If malicious, this activity could result in unauthorized access, data theft, or system manipulation. It is important to note that this detection does not confirm malicious intent; legitimate use of the Netviewer tool can trigger this alert.

  ### Investigation Steps

  - **Review outbound connections:** Check for connections to `*.netviewer.com` using Windows Security Event ID 5156 for filtering network connection events. Look for connections initiated by non-IT personnel, particularly from unexpected hosts.

  - **Validate process initiation:** For processes initiating network connections, cross-reference with Sysmon Event ID 1 (Process Creation) to determine if the Netviewer executable is running. Legitimate usage typically aligns with IT personnel or scheduled support activities.

  - **Assess source IP for anomalies:** Investigate the internal IP addresses attempting to connect to Netviewer domains. Unexpected sources, especially from sensitive or critical asset roles (e.g., domain controllers), should raise alarms.

  - **Inspect logs for command execution:** Look for corresponding PowerShell logs (Event ID 4104) or command history on the host for any commands executed by the Netviewer tool. Compare these with expected operational activities to identify potential misuse.

  - **Review related network activity:** Verify recent firewall logs for unusual patterns before or after the alerting connection to Netviewer domains. An increase in traffic to other remote management tools may indicate broader attack activity.

  ### Prioritization

  This alert carries medium severity because it may indicate potential unauthorized remote access, particularly if observed on critical systems or by accounts outside typical user behavior. The likelihood of malicious abuse is moderate, especially if the organization's policies do not allow such tools. Remote access software is commonly weaponized, emphasizing the necessity of thorough investigations.

  ### Blind Spots and Assumptions

  Detection may miss instances of evasion if the attacker modifies the Netviewer tool or uses a similar domain. Log sources must be correctly configured to capture outbound traffic details; otherwise, detection efficacy diminishes. Legitimate usage by support personnel frequently triggers this alert, necessitating contextual awareness. A related detection to enhance coverage would be monitoring for suspicious process creation patterns that include remote execution capabilities (e.g., RDP or other RMM tools).

