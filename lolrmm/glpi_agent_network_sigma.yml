note: |
  ### Technical Context

  This rule detects network connections initiated to multiple domains associated with the GLPI Agent Remote Monitoring and Management (RMM) tool, including `glpi-project.org` and various subdomains. The likely objective of an attacker employing this tool is to establish a command-and-control channel, potentially for remote access, system monitoring, or data exfiltration. This behavior fits under the MITRE ATT&CK framework as follows: Command and Control (T1071.001) using application layer protocols.

  The primary telemetry source for this detection is network connection logs, particularly those generated by Windows systems, tracking the DestinationHostname of outbound connections. If malicious actors successfully leverage this tool, they may gain unauthorized access to sensitive information or control over the affected systems. Importantly, this detection does not confirm that the activity is malicious without additional context, as legitimate GLPI Agent usage can also trigger the alert.

  ### Investigation Steps

  - **Examine network connection logs:** Review network logs (Event ID: 5156) for connections to `*.glpi-project.org`, `*.glpi-network.com`, or `*.services.glpi-network.com`. Look for recently initiated outbound connections, indicating potential unauthorized RMM tool usage.

  - **Validate legitimate GLPI Agent activity:** Confirm if the logged connection aligns with known asset roles or scheduled tasks related to GLPI operations. If a system is actively managed by an IT team using the GLPI tool, this could represent expected behavior.

  - **Identify unusual connection patterns:** Look for connections initiated by processes not associated with the official GLPI Agent installation path (e.g., `C:\Program Files\GLPI Agent\`). Investigate the command line and parent process IDs for anomalies indicating possible misuse.

  - **Cross-reference with endpoint telemetry:** Check for related event logs (e.g., Sysmon Event ID 3) that show process creation with network connections to the identified GLPI domains. Ensure the process that initiated the connection is legitimate and running under expected user contexts.

  - **Assess timestamp correlation:** Review the time of the network connection against user activity logs (Event ID: 4624) to determine if the connection was made during regular operational hours or off-hours which might indicate suspicious activity.

  - **Monitor for suspicious file changes:** Search for alterations in relevant directories, such as the installation path of GLPI Agent or commonly targeted locations like `C:\ProgramData`, to identify unauthorized modification or potential artifacts from malicious use.

  ### Prioritization

  The alert has medium severity in an enterprise context. The potentially impacted systems may harbor sensitive information or critical resources. Given the duality of the GLPI tool's legitimate and malicious use cases, there is a moderate likelihood of abuse, especially in environments where RMM tools are not tightly controlled or monitored.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate GLPI Agent usage to generate alerts, leading to false positives. A requirement for reliable detection includes ensuring full coverage of outbound network traffic logs. Additionally, activities typical of internal IT processes, such as maintenance updates from IT management teams, could trigger this alert. Related detections might include monitoring for unusual execution of scripts or applications that are known to facilitate command-and-control channels (T1071).

