note: |
  ### Technical Context

  This rule detects outbound network connections from a Windows system to multiple domains associated with the GLPI Agent RMM tool, potentially indicating command-and-control (C2) activity by an adversary. The likely attacker objective could be to establish remote management capabilities or to exfiltrate data using the GLPI Agent as a vector. This behavior relates to the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1219).

  Primary telemetry sources include network connection logs, specifically those capturing destination hostnames, which would detail the connections being made. If malicious, this behavior poses a risk to the integrity and confidentiality of the affected system and network. Importantly, this detection does NOT confirm malicious activity on its own; legitimate operations of the GLPI Agent could trigger the alert.

  ### Investigation Steps

  - **Review outbound connections to GLPI domains**: Check network connection logs (Event ID 5156) for any established TCP or UDP connections to the detected GLPI domains specified in the rule. Confirm expected behavior aligns with legitimate GLPI Agent operational patterns.

  - **Analyze process creation events**: Investigate associated process creation events (Security Event ID 4688 or Sysmon Event ID 1) around the same timeframe as the network activity. Look for processes that may invoke the GLPI Agent, ensuring they are certified and expected in your environment.

  - **Validate GLPI Agent activity**: Confirm the presence of the GLPI Agent installed on the system. Check typical installation paths and registered services to ensure the process matches the expected configuration and version.

  - **Evaluate data exfiltration attempts**: Review log files and folders (Process Monitor output, Sysmon Event ID 11) for unusual file reads or writes happening alongside network connections to GLPI domains, which may indicate unauthorized data exfiltration.

  - **Identify known malicious indicators**: Cross-reference the connecting IP addresses against threat intelligence feeds. Look for known C2 addresses that align with the same GLPI domains, corroborating active malicious attempts.

  ### Prioritization

  The alert is rated medium severity, as it involves outbound communications from potentially critical systems. There is a moderate likelihood of malicious abuse, as attackers frequently exploit legitimate tools for nefarious purposes. The GLPI Agent could be weaponized, warranting urgent investigation based on the affected asset's significance.

  ### Blind Spots and Assumptions

  This detection may have limitations due to the legitimate use of the GLPI Agent, possibly resulting in false positives. Reliable detection requires logging for both outbound network connections and process execution. Additionally, remote management tools, like RMM platforms, often share connections with legitimate traffic, complicating the investigation. A companion detection for standard remote management tools can enhance overall visibility and reduce ambiguity in investigations.

