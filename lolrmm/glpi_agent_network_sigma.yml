note: |
  ### Technical Context

  This rule detects outbound network connections initiated from a Windows host to various GLPI-related domains, choices frequently associated with the GLPI Agent Remote Monitoring and Management (RMM) tool. The likely attacker objective includes utilizing this tool to enable system management or unwanted monitoring, which may lead to data exfiltration or unauthorized access. This behavior maps to the MITRE ATT&CK technique for Execution (T1219).

  The primary telemetry sources are Windows network connection logs (Event ID 5156) capturing outbound connections. If malicious, this behavior may indicate that a compromised host is being leveraged for unauthorized communications. However, this detection does NOT confirm that the GLPI Agent activity is nefarious; it could represent legitimate administrative actions.

  ### Investigation Steps

  - **Review outbound connections**: Examine Windows Security Event ID 5156 logs for new outbound connections. Look for destinations matching 'glpi-project.org' or similar GLPI domains. Be aware that legitimate systems regularly connect to these if the GLPI Agent is used correctly.

  - **Identify processes initiating connections**: Cross-reference connections with Process Creation logs (Event ID 4688 or Sysmon Event ID 1) to identify the originating processes. Examine any non-standard processes launching connections to these domains, as this may indicate misuse.

  - **Check system role and installed software**: Validate whether the host is authorized to use GLPI Agent by checking installed applications in the system (via WMI or relevant software inventory tools). If GLPI Agent is installed, the alerts could be benign.

  - **Investigate regular activity patterns**: Assess previous network connection patterns to the GLPI domains. Legitimate activity would show consistent periodic connections associated with scheduled tasks rather than sudden spikes.

  - **Monitor for anomalous data transfer**: If GLPI Agent is in use, review data transfer logs for unusual outbound data volumes or types (via network analysis tools or firewall logs). This includes examining content types and sizes for signs of potential data leaks.

  ### Prioritization

  This alert has a medium severity due to the potential for sensitive information to be appropriated via unauthorized GLPI Agent use. While GLPI Agent is a legitimate tool, its misuse can lead to significant security risks. The likelihood of malicious use exists, especially if an actor is exploiting compromised environments to manage or surveil systems.

  ### Blind Spots and Assumptions

  Detection may miss cases where attackers disguise their activities under legitimate process names or use unmonitored non-GLPI services for communication. Ensure that logs from Windows Firewall and relevant network devices are captured fully for enhanced visibility. Additionally, legitimate users may unintentionally trigger these alerts by connecting to the GLPI infrastructure for valid management tasks. Monitoring tools could enhance detection coverage by correlating against other known attack patterns such as abnormal credential access or misuse of administrative tools.

