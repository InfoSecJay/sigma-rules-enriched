note: |
  ### Technical Context

  This Sigma rule detects the process activity of the Duet Display remote monitoring and management (RMM) tool, which can be used for legitimate screen mirroring and remote desktop access. However, attackers may leverage this tool to maintain persistence or access compromised systems. The relevant MITRE ATT&CK technique is "Remote Desktop Protocol" (T1219). Primary telemetry sources include Windows Process Creation logs, specifically Event ID 4688, which captures process creation events, detailing parent and child processes involved.

  If the activity is determined to be malicious, it could enable an attacker to remotely access and control systems, leading to data exfiltration, credential theft, or lateral movement within the network. This detection does NOT, on its own, confirm malicious intent or activity, as legitimate usage of the Duet Display tool is common in enterprise environments.

  ### Investigation Steps

  - **Verify the process origin:** Examine the file path of the detected processes (duet.exe, DuetSetup.exe, DuetDisp.exe) using Event ID 4688. Look for execution from unexpected directories (e.g., user profile folders) which may indicate compromise.

  - **Check the parent process:** Review the parent process ID associated with the detected Duet Display processes. High confidence for malicious intent if the parent process is unrelated or suspicious, such as a command shell or known malware.

  - **Identify installed software:** Cross-reference the process with installed programs on the system using the 'Programs and Features' panel or via PowerShell command `Get-WmiObject -Class Win32_Product`. Legitimate installations should be clearly documented.

  - **Review user activity:** Check for recent user logins, especially from administrative accounts, by reviewing Windows Security Event ID 4624. Frequent administrative access coinciding with Duet Display usage may indicate suspicious behavior.

  - **Network connections monitoring:** Utilize network logs to observe outbound connections initiated by the detected processes. Malicious activity could be indicated by connections to known command and control (C2) IP addresses or unusual network traffic patterns.

  - **Assess the asset's criticality:** Identify if the affected host is classified as a critical asset or has sensitive data. Compromise of high-value assets through remote access tools poses a higher risk and necessitates immediate action.

  ### Prioritization

  This alert is of medium severity due to the potential impact on system security and the common use of RMM tools by attackers. The likelihood of abuse is moderate, as Duet Display is often used legitimately. However, the presence of unauthenticated remote access warrants prompt investigation, especially when tied to sensitive or critical systems.

  ### Blind Spots and Assumptions

  Detection may have limitations if the logs are not configured to capture all process creation events, or if the RMM tool is executed through obfuscation techniques. The alert could also be triggered by legitimate remote work activities involving the Duet Display tool. To strengthen detection capabilities, relate this rule to those monitoring RDP activity (T1076) or remote access tools (T1219) for enhanced visibility on potentially malicious use.

