note: |
  ### Technical Context

  This rule detects potential process activity related to the Duet Display RMM tool, which may indicate unauthorized remote management or monitoring activities. Attackers may use this tool to gain persistent access to a target system, facilitating data exfiltration or other malicious actions. The relevant MITRE ATT&CK tactic is Command and Control (T1071), with the technique being Application Layer Protocol (T1219).

  The primary telemetry source is the Windows process creation logs, specifically related to the execution of the Duet Display executable files. If the activity is malicious, it could lead to unauthorized access and control over the endpoint or network. It is essential to note that this detection does NOT confirm malicious activity on its own, as legitimate usage of Duet Display is common in remote desktop scenarios.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for entries with `Image` ending in `duet.exe`, `DuetSetup.exe`, or `DuetDisp.exe`. Identify timestamps and parent processes for context.

  - **Identify parent process activity:** Assess the parent process for any unusual behavior, especially if it is not a known or trusted application. If the parent process is not an expected legitimate application, this may indicate malicious activity.

  - **Review user activity logs:** Investigate user account activities associated with the identified processes. Check for unusual login times or locations that deviate from established user behavior.

  - **Examine network connections:** Look at network logs (e.g., Windows Firewall logs or IDS logs) to check if the detected processes are making outbound connections, particularly to known malicious IP addresses or domains related to remote management tools.

  - **Validate legitimate use cases:** Confirm whether the Duet Display application is authorized and utilized by the user or organization. If it is installed, document its intended purpose to differentiate between benign use and potential abuse.

  - **Cross-reference with threat intelligence:** Check if the detected process is associated with known malicious activities or if it appears in threat intelligence databases that classify it as a potential risk.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on critical systems, especially if Duet Display is exploited for unauthorized access. The likelihood of malicious exploitation hinges on the specific context of the environment, but tools like this are increasingly common in adversary tactics.

  ### Blind Spots and Assumptions

  This detection may miss instances where Duet Display is correctly utilized in a legitimate context, or where evasion techniques, such as renaming the executables, are employed. It is crucial to have process creation logging correctly configured for reliable detection. Legitimate remote work activities may trigger this alert, and companion detections that monitor systems for unauthorized software installations could help enhance coverage and context.

