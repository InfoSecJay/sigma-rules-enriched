  ### Technical Context

  This rule detects potential network activity associated with the rdp2tcp Remote Management Tool (RMM). The typical objective of an attacker utilizing rdp2tcp is to establish covert command and control connections, enabling remote access to compromised systems. This detection aligns with the MITRE ATT&CK framework under the tactic of Execution and technique T1219 (Remote Access Software).

  The primary telemetry source is Windows network connection logs, which should capture the destination hostnames of connection attempts associated with rdp2tcp. If such activity is malicious, it could signify unauthorized remote access. This detection does NOT confirm that rdp2tcp usage is malicious on its own, as legitimate administrative activities may also employ this tool.

  ---

  ### Investigation Steps

  - **Verify the destination hostname:** Check network connection logs (Event ID 5140) for any connections to `user_managed` or `github.com/V-E-O/rdp2tcp`. Compare against known benign entries in your environment.

  - **Correlate with user activity:** Review associated user accounts (Security Event ID 4624) for any logs that show access patterns or permission changes around the time of the detected connections to identify any flagged behavior.

  - **Inspect process creation:** Look for process creation events (Sysmon Event ID 1) related to rdp2tcp on the host. Legitimate usage will typically display associated admin tools or monitoring software, while suspicious activity may show unrecognized executables.

  - **Monitor for outbound connections:** Use firewall logs (Windows Filtering Platform Event ID 5156) to examine outbound connections made by potential rdp2tcp processes. Malicious indicators can include unusual external IP destinations not commonly accessed by the host.

  - **Identify lateral movement:** Investigate event logs for SMB or RDP sessions (Event IDs 4624 and 5140) from unexpected or untrusted sources to check for lateral movement attempts leveraging rdp2tcp.

  - **Look for alternate indicators:** Identify any file creation or exfiltration artifacts related to rdp2tcp interactions, such as .bat or .exe files in the system's temporary folders or user directories, indicating installation or execution attempts.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact when an attacker gains covert remote access, particularly in high-value systems. The likelihood of malicious abuse is heightened since rdp2tcp is often not part of standard administrative toolsets, making it a target for exploitation. However, legitimate administrative tasks can also invoke this behavior, necessitating careful investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments where rdp2tcp is used legitimately, leading to a higher rate of false positives. Comprehensive logging must be in place, including network connection and event processing logs, to ensure reliable detection. Legitimate data transfers or remote access scenarios may trigger this alert. A related detection could be the monitoring of unusual remote desktop protocol (RDP) activity (T1076) to bolster overall coverage against unauthorized remote access.

