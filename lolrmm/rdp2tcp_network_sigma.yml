note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the rdp2tcp Remote Management Tool (RMM), which can be used by attackers to establish reverse shells and facilitate lateral movement within a compromised network. The rdp2tcp tool allows an attacker to tunnel traffic over RDP connections into a TCP connection, making it valuable for post-exploitation scenarios. Understanding its usage is crucial, as it can blend in with legitimate traffic, thereby concealing malicious activities aimed at network exploitation.

  In this context, the likely attacker objective is to maintain persistent and covert control over compromised environments, potentially leading to data exfiltration or further lateral movement within the organization. Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002)
  - **Command and Control** (TA0011)
  - **Remote Services** (T1219)

  The primary data sources for detection include network connection logs from Windows operating systems, specifically those capturing outgoing connections and associated application behaviors.

  ### Investigation Steps
  - **Review Network Connection Logs**: Analyze the network connection logs for any outgoing connections to hosts that end with "user_managed" or specifically "github.com/V-E-O/rdp2tcp". Pay attention to the timestamps and involved endpoints.

  - **Investigate RDP Activities**: Examine any RDP connection attempts to identify unusual patterns or connections originating from unrecognized or unauthorized machines.

  - **Correlate with Endpoint Activity**: Use EDR telemetry to check for any processes related to rdp2tcp or similar tunneling tools. Look for abnormal parent-child process relationships that indicate misuse.

  - **Monitor for Data Exfiltration Attempts**: Keep an eye out for any suspicious data movement or signaling that may indicate data exfiltration following the establishment of an rdp2tcp connection.

  ### Prioritization
  The alert is categorized as medium severity due to the potential risk of unauthorized remote access, which can compromise sensitive enterprise data and operations. While the likelihood of legitimate use exists, the implications of misuse warrant prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited for environments where rdp2tcp or similar tools are used legitimately, leading to potential false positives. The detection logic assumes that network connection logs are configured to capture all relevant traffic and that effective monitoring tools are in place to analyze this data. Additionally, environments may lack comprehensive oversight of RDP usage, which could hinder the detection accuracy of this rule.

