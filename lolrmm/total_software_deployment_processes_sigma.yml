  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Total Software Deployment (TSD) Remote Monitoring and Management (RMM) tool. The likely objective of an attacker using this tool could be to manage and deploy software across an enterprise network covertly. This behavior aligns with the MITRE ATT&CK technique of Remote Services (T1219), which involves leveraging existing remote management tools for unauthorized actions.

  The primary telemetry source is Windows process creation logs, specifically Event ID 4688, detailing the creation of new processes. If malicious, the use of this software could enable broad unauthorized system access and software deployment capability, potentially allowing data exfiltration or malware installation. Importantly, this detection does NOT confirm malicious intent solely based on process execution; legitimate administrative use is common.

  ---

  ### Investigation Steps

  - **Review Process Creation Logs**: Check for Event ID 4688 entries where the ParentImage is either `tniwinagent.exe` or `Tsdservice.exe`. Note the User and Process ID fields to identify the invoking user and any suspicious user accounts.

  - **Validate Process Legitimacy**: Confirm the legitimacy of related accounts running the processes. Approved administrators or automated systems typically invoke these processes, such as dedicated IT personnel rather than standard user accounts.

  - **Cross-Reference with TSD Deployments**: Look at software deployment logs to determine if TSD processes correspond with recent changes to systems. If known deployments were scheduled, it may indicate benign activity.

  - **Examine System Impact**: Identify impacted systems' criticality. For example, if the process affects a domain controller or critical application server, escalate the incident accordingly.

  - **Identify Malicious Indicators**: Check for unusual command-line arguments associated with the processes, particularly those not part of routine software management tasks, which may indicate malicious activity.

  - **Check for Evasion Techniques**: Investigate whether the processes are obfuscated or executed from unusual directories or using altered executable names. Compare with legitimate paths for TSD execution to identify discrepancies.

  ---

  ### Prioritization

  This alert has medium severity due to the potential for significant impact on system integrity and availability. The likelihood of abuse is moderate as RMM tools are commonly misused by attackers for unauthorized access and control over systems. It is essential to prioritize alerts involving sensitive systems or unusual user activity.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if the TSD tools are modified or run under different names, creating potential blind spots. Ensure that logs from all hosts using the TSD tool are configured to capture process creation events reliably. Legitimate activities may include authorized software updates managed by IT departments. A related detection includes monitoring for unauthorized remote access sessions, which can complement alerts generated by this rule.

