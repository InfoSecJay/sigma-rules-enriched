note: |
  ### Technical Context

  This Sigma rule detects network connections established to systems associated with the Ericom Connect remote management tool. The underlying behavior suggests an attempt to leverage remote management capabilities, which may be exploited by adversaries for lateral movement, command and control, or exploitation of remote desktop features. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011) and the technique involved is "Application Layer Protocol" (T1219).

  The primary telemetry source is Windows network connection logs capturing outbound connections. If these connections are initiated without proper authorization, they signify a potential risk of unauthorized remote management. It's important to note that this detection does NOT confirm malicious activity on its own, as legitimate use of Ericom Connect can trigger the same alerts.

  ### Investigation Steps

  - **Verify the destination and source IPs:** Check if the connecting source IP matches known assets and whether the destination IP resolves to an Ericom service. Use DNS logs or lookups to validate hostname resolutions and review Event ID 5156 for the respective network connections.

  - **Examine the user context:** Identify which user account initiated the connection. Analyze Security Event ID 4624 (Logon) to confirm the legitimacy of potentially compromised user credentials, especially looking for anomalies in user behaviour.

  - **Check for legitimate usage patterns:** Investigate if there are documented cases of Ericom Connect usage within your organization. This typically includes reviewing user training materials or internal communications indicating authorized access.

  - **Look for concurrent suspicious activity:** Investigate any other logs (e.g., Event ID 4688 for process creation) that might indicate suspicious processes or activities occurring at the same time as the network connectivity to Ericom. Malicious actors may use other tools concurrently with the RMM tool.

  - **Identify command and control indicators:** Search for additional anomalies within network logs, such as frequent reconnections, unusual data transfers, or connections happening outside business hours, which would typically indicate a high-confidence malicious indicator.

  - **Validate configurations for endpoint protection solutions:** Ensure endpoint security solutions are configured to monitor and alert for unauthorized remote access tools to strengthen detection capabilities further.

  ### Prioritization

  The alert is medium severity as it involves potentially unauthorized network access to a sensitive remote management tool. The impact is significant if the affected system is critical and can lead to further exploitation of internal resources. The likelihood of malicious usage is moderate due to the common use of such tools in IT administration, but weaponization is a known tactic.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of legitimate Ericom Connect usage, which could generate alerts and lead to false positives. Proper configuration of DNS logging and network monitoring is essential for reliable detection. Additionally, legitimate administrative tasks involving Ericom Connect may unintentionally trigger this alert. Combining this rule with detection for unusual lateral movement (T1021.001 - Remote Services: RDP) can enhance coverage against potential threats.

