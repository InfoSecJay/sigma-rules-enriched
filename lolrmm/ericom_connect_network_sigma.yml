note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the Ericom Connect Remote Monitoring and Management (RMM) tool. Attackers utilizing RMM tools like Ericom Connect may aim to maintain persistence, conduct remote administration, or exfiltrate data. The relevant MITRE ATT&CK technique is "Remote Control Software" (T1219), which falls under the Execution tactic.

  The primary telemetry source is network connection logs, specifically those that capture connections to domains like "ericom.com" or user-managed environments. If malicious, the security impact could include unauthorized access to sensitive systems and potential data breaches. Importantly, this detection does NOT confirm an active attack—it may also capture legitimate use of the Ericom Connect tool in an enterprise setting.

  ### Investigation Steps

  - **Analyze network connection logs:** Review network logs for Event ID 5156 (Windows Filtering Platform) and focus on connections made to "ericom.com" or domains ending with "user_managed." Determine if these connections were initiated from high-value assets or sensitive environments.

  - **Identify user context:** Check the user account associated with the detected connection. Validate if the user is authorized to use remote management tools. An unusual user context or elevated privileges without prior justification may indicate a malicious activity.

  - **Correlate with process execution logs:** Cross-reference with Security Event ID 4688 (process creation) and Sysmon Event ID 1 to see if the Ericom Connect executable (typically `EricomAgent.exe`) was spawned during the network activity. Legitimate use would display authorized applications running as expected with known paths.

  - **Check for additional indicators:** Inspect for unusual patterns in network traffic, such as high volumes of outbound connections or data transfers following the detected activity. Malicious behavior might include exfiltration attempts correlating with the timing of RMM tool usage.

  - **Review false positive scenarios:** Confirm if users in your environment have recently implemented Ericom Connect for legitimate purposes. Documentation of approved deployments or maintenance activities might explain the connection patterns.

  ### Prioritization

  The alert is of medium severity as unauthorized use of RMM tools can provide attackers with backdoor access to corporate networks, especially on critical assets. Given the increasing sophistication of RMM-based attacks, including active exploitation by adversaries, prompt investigation is advisable.

  ### Blind Spots and Assumptions

  Detection might be limited if the enterprise lacks comprehensive logging of all outbound network connections or if firewall rules do not capture all pertinent traffic. Legitimate administrative tasks using Ericom Connect could trigger these alerts, leading to potential false positives. A companion detection might include monitoring for elevated user privilege changes or other remote management tool usage to enhance security context and response capabilities.

