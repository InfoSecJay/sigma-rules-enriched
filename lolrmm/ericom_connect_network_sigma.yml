  ### Technical Context

  This Sigma rule detects potential network activity associated with the Ericom Connect Remote Management and Monitoring (RMM) tool. The likely objective behind such activity is unauthorized remote management or data exfiltration from compromised systems. This behavior fits into the MITRE ATT&CK framework under the Command and Control tactic (TA0011) and the Remote Management Tools technique (T1219). Primary telemetry sources include Windows network connection logs, particularly focusing on destination hostnames, such as those ending with 'user_managed' or 'ericom.com'.

  If malicious, this behavior could indicate that an attacker is leveraging the RMM tool to gain persistent access or control over the affected hosts. It is crucial to note that this detection does NOT confirm the presence of an adversary on the network, as legitimate use of Ericom Connect can trigger these alerts.

  ### Investigation Steps

  - **Review connection logs for suspicious activity:** Investigate Windows Event ID 5156 (Windows Filtering Platform), specifically noting any connections to 'user_managed' or 'ericom.com' that lack a legitimate business context.

  - **Identify legitimate instances of Ericom Connect:** Validate any alerts against known authorized usage. Check for recent changes in usage patterns or newly onboarded systems designated for remote management.

  - **Correlate with other security events:** Look for related indicators in the same time frame, especially events indicating lateral movement (e.g., Event ID 4624 for logons, Event ID 4688 for process creations) from the affected hosts.

  - **Check for abnormal data exfiltration patterns:** Monitor for outbound connections with high data volumes (e.g., analyzing logs for excessive TCP/UDP traffic linked to the identified destination hostnames) – legitimate connections typically have low data transfer associated with user access.

  - **Assess role and criticality of affected assets:** Determine the function of any hosts associated with flagged connection attempts and their role in your network. Prioritize investigation based on criticality and whether the asset holds sensitive data.

  ### Prioritization

  Given that the Ericom Connect RMM tool is often used for legitimate remote access but can also be exploited by attackers, the alert severity is medium. The potential impact is contingent on the criticality of the affected system and the likelihood of nefarious use is moderate, given the prevalence of remote administration tools in modern environments.

  ### Blind Spots and Assumptions

  Detection can be limited by legitimate usage of Ericom Connect within the organization, which may inadvertently trigger alerts. Reliable detection also requires accurate logging from the Windows Filtering Platform. Additionally, normal administrative access can mimic this behavior, making it important to correlate with other detection mechanisms. Companion detections include monitoring for unauthorized installation of RMM tools (T1219), which can enhance coverage against potential unauthorized remote management activities.

