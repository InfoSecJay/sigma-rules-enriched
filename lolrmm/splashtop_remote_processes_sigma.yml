note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Splashtop Remote Management Tool. This tool can enable remote access and facilitate unauthorized control over a system, indicating a possible attacker objective of gaining persistent access or conducting surveillance. The relevant MITRE ATT&CK tactic is Execution (TA0002), and the technique is Remote Services: Remote Access Tools (T1219).

  The primary telemetry sources are Windows process creation logs, specifically focusing on process creation events (Event ID 4688). If malicious, the impact could range from unauthorized data access to system manipulation and exfiltration. However, it’s crucial to note that this detection does NOT confirm malicious intent on its own, as Splashtop may be used legitimately within the environment.

  ### Investigation Steps

  - **Check Event ID 4688 for process creation details:** Review the Security logs for Event ID 4688, focusing on the `NewProcessName` field for entries linking to the specified Splashtop executables. Compare the `ParentProcessName` to validate the process hierarchy and discern between expected and unexpected behaviors.

  - **Validate application whitelist:** Identify legitimate use cases for Splashtop in your organization. Review documentation or prior tickets that mention its approved use. Compare timestamps of detected events (e.g., during business hours) to confirm if they align with known authorized access.

  - **Assess system user accounts:** Investigate which user accounts initiated the processes by examining the `CreatorProcessId` and `UserName` fields in the 4688 events. Unusual accounts performing such activity are indicative of potential compromise.

  - **Correlate with network logs:** Check for any corresponding outbound connections related to Splashtop in the firewall or EDR logs (using Event ID 5156) to identify if this activity was followed by data exfiltration or unusual communications. Look for connections to known Splashtop IP addresses or domains.

  - **Identify abnormal process behavior:** Review for any commands executed by these processes on the endpoint through Sysmon logs (particularly Event ID 1) which may provide insights into malicious activities like command line arguments used for exploitation.

  ### Prioritization

  The severity of this alert is medium, as the activity could indicate a system compromise, especially if occurring on critical infrastructure. Given that Splashtop is often utilized in environments for legitimate remote management, the likelihood of abuse by threat actors remains a concern, especially if lack of controls is present.

  ### Blind Spots and Assumptions

  This detection may generate false positives stemming from legitimate Splashtop usage. It assumes that telemetry sources for process creation are adequately configured and not filtered out. Legitimate activities may also include IT support staff using Splashtop for remote troubleshooting. A related detection to consider is monitoring for unusual authentication logs (e.g., those from Event ID 4624) from remote session logins through RMM tools for comprehensive coverage.

