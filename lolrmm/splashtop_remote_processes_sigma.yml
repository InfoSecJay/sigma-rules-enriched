note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Splashtop Remote Management and Monitoring (RMM) tool. The likely attacker objective is remote access to systems to perform reconnaissance, data exfiltration, or lateral movement within the network. This detection aligns with the MITRE ATT&CK technique for Command and Control (T1219). The primary telemetry sources involve Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, tracking the creation of processes related to Splashtop. If these processes are executed without proper authorization, they pose a significant security risk by potentially allowing an attacker unauthorized access to system resources. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; further investigation is required to establish context.

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 or Sysmon Event ID 1 for the image name matching `\\strwinclt.exe` or `\\Splashtop_Streamer_Windows*.exe`. Benign behavior may involve scheduled tasks or legitimate remote admin usage via these tools.

  - **Check parent process information:** Investigate the parent processes of detected Splashtop executables. If the parent process is a known administrative tool or service (e.g., legitimate IT management software), it could indicate legitimate use. Look for Event ID 4688 containing the ParentProcessName field.

  - **Validate user context:** Identify the user account associated with the suspicious process. Check for anomalies in the user’s activity or role. Unusual accounts or information that does not match typical administrative activities could present a high-confidence malicious indicator.

  - **Correlate with network logs:** Examine outbound connections in logs (Firewalls, Proxy logs) to confirm if these processes initiate communications to known malicious IP addresses or domains. Look for unusual destination IPs that deviate from normal operational patterns.

  - **Assess frequency and patterns:** Determine the frequency of Splashtop process executions. Legitimate use would typically occur during specific maintenance windows, while suspicious spikes could indicate an ongoing attack.

  ### Prioritization

  This alert has a medium severity, primarily due to the potential impact of the Splashtop tool being used maliciously for remote access, combined with the frequency of its legitimate use in IT operational environments. While Splashtop is a legitimate software, its exploitation by threat actors makes identifying suspicious activity essential to mitigating risks.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques, such as attackers renaming or obfuscating the executable files associated with Splashtop. If not all relevant logs are configured to capture process creations or network connections, legitimate remote access activities may trigger the alert. Activities by trusted IT personnel using RMM tools may also generate similar alerts. A related detection rule focusing on anomalous outbound connections or identifying unauthorized remote access tools could enhance security coverage.

