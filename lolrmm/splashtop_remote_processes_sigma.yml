note: |
  ### Technical Context
  This detection rule identifies the process activity associated with the Splashtop Remote Management Tool, which is commonly used for remote desktop support and system management tasks. The rule primarily focuses on processes initiated from known parent processes that belong to the Splashtop suite of applications, such as `strwinclt.exe`, `Splashtop_Streamer_Windows*.exe`, and others. Attackers may exploit remote desktop tools like Splashtop to gain unauthorized access to systems, enabling them to manipulate data, exfiltrate information, or further compromise the network.

  The relevant MITRE ATT&CK tactics and techniques applicable in this context include:
  - **Execution (TA0002):** The rule specifically looks for execution of processes related to Splashtop that could indicate malicious remote access activities.
  - **T1219: Remote Access Software:** The detection hinges on identifying processes that suggest unauthorized remote access via Splashtop.

  Primary data sources for this detection include Windows process creation logs, which will be critical in identifying the improper invocation of these specific processes, and monitoring for any anomalies in their execution context.

  ### Investigation Steps
  - **Review Process Creation Events:** Start by examining Windows process creation logs for instances of the identified Splashtop processes. Look for details like user accounts, timestamps, and parent processes.
  - **Analyze Parent Process Activity:** Investigate the parent processes that initiated these Splashtop processes. Determine whether they are legitimate or if there are signs of malicious behavior in their execution context.
  - **Identify User Accounts and Permissions:** Assess the user accounts associated with the execution of any suspicious Splashtop processes. Check if these accounts have elevated privileges or appropriate permissions for remote access tools.
  - **Check for Anomalies in Network Traffic:** Monitor network traffic logs to see if there are unusual outbound connections linked to these processes, which may indicate data exfiltration or unauthorized access attempts.

  ### Prioritization
  This alert has medium severity due to the potential for unauthorized remote access, which may lead to privilege escalation or system compromise. The likelihood of such threats can vary based on organizational policies related to remote access tools but warrants prompt investigation due to the sensitivity of operation environments.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the presence of legitimate Splashtop usage within the environment, which could lead to a higher number of false positives. The detection logic assumes that malicious actors will not disguise their usage of legitimate remote management tools. For the alert to function effectively, it requires comprehensive logging of process creation events on Windows systems, and any misconfigurations or missing logs may hinder its detection capabilities.

