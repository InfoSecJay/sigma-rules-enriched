note: |
  ### Technical Context

  This Sigma rule detects the process creation of Core FTP RMM tool, specifically instances where processes are initiated with `coreftplite.exe` as the parent image. Attackers may leverage Core FTP RMM for remote management and file transfer with the intent to exfiltrate sensitive data or deploy further malicious artifacts. This behavior aligns with the MITRE ATT&CK technique for Remote File Copy (T1219) under the Execution tactic.

  Primary telemetry sources include Windows Event ID 4688 (process creation events) and Sysmon Event ID 1. If malicious, this could lead to unauthorized file transfers or data exfiltration. However, this detection does NOT confirm malicious activity on its own, as legitimate use of Core FTP can trigger this alert.

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 logs and Sysmon Event ID 1 for new process entries originating from `coreftplite.exe`. Note the command line arguments for anomalies.

  - **Identify the parent process:** Analyze the process tree to identify what process spawned `coreftplite.exe`. Legitimate activity may show other benign applications as the parent, while suspicious activity may demonstrate an unusual parent process.

  - **Correlate with recent user activity:** Investigate user logon sessions and recent account activity using Event ID 4624. Ensure that the user has a reason to utilize Core FTP; unexpected use could indicate compromise.

  - **Check for data transfer artifacts:** Validate the presence of file creation or transfer logs associated with `coreftplite.exe`, especially in sensitive directories. Look for unexpected file creation or modifications in directories like `C:\Users\[USERNAME]\Documents`.

  - **Examine network activity:** Capture and analyze network traffic logs (e.g., firewall logs or IDS logs) to confirm connections to suspicious external IPs or hostnames that align with the timing of the process execution, indicating potential data exfiltration.

  ### Prioritization

  This alert has a medium severity due to its potential impact, particularly on sensitive systems or data. The likelihood of malicious abuse is moderate, as Core FTP is commonly used for legitimate file transfers, but it is also known for misuse in exfiltration scenarios. The technique is not widely weaponized, demanding scrutiny based on context.

  ### Blind Spots and Assumptions

  Detection may be limited if the necessary logging is not enabled on endpoints, such as Sysmon for advanced process tracking. Legitimate scenarios can trigger this alert, such as authorized use of Core FTP for scheduled file transfers. A companion detection for lateral movement via PowerShell (T1086) could enhance coverage against misuse of authorized tools.

