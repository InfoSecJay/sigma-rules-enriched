  ### Technical Context
  This detection rule identifies the execution of processes associated with the Core FTP Remote Management and Monitoring (RMM) tool. The primary objective of this tool is to provide management functionalities for FTP servers; however, it may also be exploited by threat actors to gain unauthorized access to systems or exfiltrate data. The detection focuses on identifying instances where the process `coreftplite.exe`, typically associated with Core FTP, is launched in a manner that may indicate malicious intent, especially in environments where its use is not expected.

  Threat scenarios may include unauthorized data transfer or remote management activities by internal or external attackers who have gained access to the network. Attackers may leverage this tool to evade detection and perform nefarious actions while masquerading as legitimate administrator tasks. The detection is aligned with the MITRE ATT&CK tactics of Execution (ID: T1203) as it highlights the execution of software not typically seen in the environment.

  Primary data sources for this detection include Windows process creation logs, which capture detailed information about executed processes, including parent-child relationships that can help identify unusual process invocation patterns.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze recent Windows process creation logs to identify instances of `coreftplite.exe` execution. Pay attention to the associated parent image to discern the context of the execution.

  - **Validate Source and Timing:** Investigate the timestamps and user accounts associated with the detected process to determine if they align with normal operational hours and user behavior within the organization.

  - **Correlate Network Activity:** Check network logs for any outgoing connections or file transfers that coincide with the execution of `coreftplite.exe`. Look for unexpected destinations that could indicate data exfiltration.

  - **Examine System Permissions:** Assess the permissions of the user account that executed the process to identify if the account possesses higher privileges than necessary, which could indicate a compromised account or misuse of legitimate tools.

  ### Prioritization
  The rule's severity is classified as medium due to the potential misuse of the Core FTP RMM tool for unauthorized remote access or data transfer. Given the sensitivity of the environments where FTP server management occurs, any detection of this tool's execution warrants immediate investigation.

  ### Blind Spots and Assumptions
  This detection rule may not cover all instances of potential misuse of Core FTP if the tool is executed from non-standard paths or if attackers use alternative file names. The logic assumes that `coreftplite.exe` is not a legitimate process expected in the environment; thus, there might be false positives in organizations where the tool is used for legitimate purposes. To ensure this alert functions effectively, it is crucial to have comprehensive logging enabled for Windows process creation events. Additionally, maintaining an inventory of approved software can aid in minimizing false alarm rates.

