note: |
  ### Technical Context

  This Sigma rule detects potential registry activity associated with the Nezha Remote Management and Monitoring (RMM) tool. Adversaries using Nezha may aim to establish persistence or control over compromised systems for further exploitation. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **Command and Scripting Interpreter (T1219)**.

  Primary telemetry sources include Windows registry event logs, specifically monitoring for changes to the `HKLM\SYSTEM\CurrentControlSet\Services\nezha-agent` registry key. If malicious, this action indicates the potential establishment of a backdoor on the affected system. However, this detection alone does not confirm that the system has been compromised; it may also include legitimate administrative use of Nezha.

  ### Investigation Steps

  - **Review registry changes: ** Examine Windows Registry Event logs (Event ID 4657) for changes to `HKLM\SYSTEM\CurrentControlSet\Services\nezha-agent`. Look for unusual timestamps or multiple edits in a short span as indicators of automated scripts.

  - **Correlate process activity:** Check for associated process creation events (Sysmon Event ID 1 or Security Event ID 4688) that may indicate the execution of `nezha-agent` or related binaries. Look for unusual parent processes such as `cmd.exe` or `powershell.exe`.

  - **Identify legitimate behavior:** Verify administrative use by checking logged actions or requests for services related to Nezha from known administrators. Typical benign activity might include configuration changes or routine updates from a reliable source.

  - **Check for persistence mechanisms:** Review scheduled tasks (Event ID 4698) or services (Event ID 7045) created by the Nezha agent. Legitimate installations should originate from controlled deployment processes.

  - **Look for known malicious indicators:** Investigate any communication from the Nezha agent to uncommon external IPs or domains by analyzing network logs (Firewall/IDS logs). Use threat intelligence feeds to identify which C2 (Command and Control) addresses this tool may connect to.

  ### Prioritization

  This alert is of medium severity, considering the potential impact of unauthorized remote access on sensitive systems. The likelihood of malicious use is moderate, as RMM tools like Nezha are increasingly weaponized in attacks. Rapid detection and response are critical due to the potential for significant data loss or system compromise.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as modifying registry key names or using encrypted communication methods to bypass detection. Comprehensive monitoring requires ensuring that relevant telemetry from the Windows event logs is actively collected and retained. Legitimate administrative tasks may also trigger this alert if Nezha is used within operational procedures. Implementing companion detections for command execution through logging of administrative command-line actions can strengthen overall coverage.

