note: |
  ### Technical Context

  This Sigma rule detects interactions with the Windows registry, specifically targeting the creation or modification of entries associated with the Nezha Remote Monitoring and Management (RMM) tool. This behavior typically suggests an attempt by an attacker to establish persistence or control over a compromised system, allowing them continued access and monitoring capabilities. The relevant MITRE ATT&CK tactic is **Command and Control** (T1071) and the technique is **Application Layer Protocol** (T1219).

  The primary telemetry source for this detection is Windows Registry Event logs, specifically focusing on changes to the target registry object defined in the rule. If malicious, this activity can indicate a breach through RMM tool installation for unauthorized remote access. Importantly, this detection does NOT confirm successful exploitation or operational use of Nezha; further context is required to validate malicious intent.

  ### Investigation Steps

  - **Review registry changes:** Check Windows Registry Event Log (Event ID 4657) for modifications to `HKLM\SYSTEM\CurrentControlSet\Services\nezha-agent`. Confirm that the registry entry was not part of a legitimate installation by cross-referencing with known good configurations.

  - **Validate process execution:** Look for the execution of the Nezha agent by checking Security Event ID 4688 for any processes initiated by `nezha-agent.exe`. Legitimate behavior would show user context under a specific service account rather than SYSTEM.

  - **Examine network activity:** Investigate Network logs for outbound connections on known Nezha-associated ports (commonly TCP 80 or 443) to unusual external IP addresses. Malicious outgoing connections can often indicate data exfiltration attempts.

  - **Identify evidence of prior infections:** Search for potential artifacts or remnants of known malicious activity (e.g., file creation/modification timestamps correlated with alert times) across the file system indicating the historical use of unauthorized RMM tools.

  - **Assess user accounts:** Review user account activity to identify any anomalous behavior or accounts used to manipulate the Nezha service. Anomalous login times or locations can indicate further lateral movement.

  ### Prioritization

  This alert is of medium severity as it points to possible persistence mechanisms being established on the system. The likelihood of malicious abuse is moderate given the known use of Nezha RMM tools in cyberattacks. While not universally weaponized, its usage in targeted attacks makes it relevant for timely investigation.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers using alternative registry hives or utilizing legitimate software updates that modify the same registry keys. Reliable detection requires enabled audit policies for registry access. Legitimate administrative tasks, such as configuration changes by an IT department, may trigger this alert. A related detection could be monitoring for executed scripts or installers commonly associated with RMM tools, which would strengthen coverage and context for this behavior.

