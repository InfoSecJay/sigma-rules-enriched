note: |
  ### Technical Context

  This Sigma rule detects registry modifications associated with `mstsc.exe` (Microsoft Remote Desktop Connection), indicating potential misuse as a remote management tool by threat actors. The likely attacker objective is to leverage remote desktop capabilities for unauthorized access or lateral movement within a compromised environment. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), specifically using the technique "Remote Services" (T1219).

  The primary telemetry source is Windows registry event logs, specifically capturing changes to keys related to the Terminal Server Client. If malicious, this activity can facilitate unauthorized remote access, bypassing other security controls. Importantly, this detection does NOT confirm malicious intent on its own; legitimate use of Remote Desktop Connection can trigger similar modifications.

  ### Investigation Steps

  - **Check registry modifications:** Review registry event logs for Event ID 13 in Windows logs related to `HKCU\Software\Microsoft\Terminal Server Client\Default` or `HKCU\Software\Microsoft\Terminal Server Client\Servers`. Identify any recent changes and verify user accounts involved.

  - **Review associated process activity:** Investigate process execution logs (Event ID 4688) to see if `mstsc.exe` was invoked around the same time as the registry changes. Correlate user accounts with the execution to assess legitimacy.

  - **Look for suspicious command line arguments:** Analyze command line arguments for `mstsc.exe` from process creation logs. Malicious usage may involve unexpected parameters that suggest automated or unauthorized access.

  - **Verify typical usage patterns:** Cross-check the user account against historical usage of `mstsc.exe`. Anomalies in the timeframe or user behavior may indicate potential misuse.

  - **Identify high-confidence malicious indicators:** Check for known compromised user accounts or system hosts that may be privileged with Remote Desktop access. Conduct a search for recent lockouts or anomaly alerts related to these accounts.

  ### Prioritization

  This alert carries medium severity due to the potential impact of unauthorized remote access on sensitive systems. While the likelihood of malicious abuse is moderate, the misuse of RMM tools for lateral movement is a recognized risk. This behavior is often weaponized in targeted campaigns, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the frequency of legitimate remote desktop use, causing potential false positives. Reliable detection requires comprehensive logging of registry changes and process creations, ensuring no essential telemetry is missed. Legitimate administrative activities may trigger this alert, especially in organizations relying on remote management for operational purposes. Related detections include monitoring for outbound connections on TCP port 3389, as this would support detecting active remote desktop sessions tied to suspicious activity.

