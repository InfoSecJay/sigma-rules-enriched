note: |
  ### Technical Context

  This Sigma rule detects registry activity associated with `mstsc.exe`, the Microsoft Remote Desktop Connection client, specifically targeting entries related to terminal server connections. The likely objective of an attacker utilizing this tool is to establish remote access to compromised systems, facilitating further exploitation, data exfiltration, or lateral movement within the network. The relevant MITRE ATT&CK tactic is Execution (TA0002) and the associated technique is Remote Services (T1219).

  The primary telemetry sources for this detection are Windows registry events, specifically those capturing changes to the `HKCU\Software\Microsoft\Terminal Server Client\Default` and `HKCU\Software\Microsoft\Terminal Server Client\Servers` keys. If malicious, this behavior poses a significant security risk as it may enable unauthorized remote access to systems. Importantly, this alert does NOT confirm that the activity is malicious solely based on registry changes, as legitimate use of Remote Desktop can trigger the same events.

  ### Investigation Steps

  - **Review registry modifications:** Examine Windows Security Event ID 4657 for changes to the above registry keys. Look for unauthorized entries such as unfamiliar server names or IP addresses that deviate from expected usage patterns.

  - **Check mstsc.exe execution context:** Verify the process creation log for `mstsc.exe` by reviewing Sysmon Event ID 1. Investigate the parent process ID to determine the context and legitimacy of the invocation.

  - **Identify legitimate usage patterns:** Cross-reference any legitimate use of `mstsc.exe` by checking your organization's asset inventory and approved remote access policies. Confirm if connections to known management servers or desktops are aligned with expected user behavior.

  - **Analyze network connection attempts:** Monitor logs for subsequent network traffic following the registry modification using Windows Firewall logs (Event ID 5156) or similar network detection methods to pinpoint unauthorized outbound connections to new or suspicious IP addresses.

  - **Assess user roles and permissions:** Evaluate the user accounts making registry changes to see if they have the necessary rights to modify RDP settings. Review for any accounts that are unexpected or haven't been authorized for remote access capabilities.

  - **Correlate with threat intelligence:** Check incident response and threat intelligence feeds for known indicators related to RMM tools and unauthorized uses of `mstsc.exe` against your organization's systems to determine if any matches are present.

  ### Prioritization

  This alert has medium severity due to the potential impact of remote access exploitation on critical systems. The likelihood of malicious abuse is moderate, as the use of `mstsc.exe` can be both legitimate and nefarious. Historically, RMM tools have been weaponized for lateral movement, making this behavior notable for further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate usage of RDP within the organization, as certain employees may need to use `mstsc.exe` regularly. Ensure registry logging is enabled for accurate monitoring; otherwise, telemetry may not capture all pertinent events. Additionally, automated management scripts or tools that modify registry settings for known servers may also trigger this alert, requiring contextual understanding. Companion detections, such as monitoring for unusual login patterns or failed RDP connection attempts, can enhance overall security visibility related to this behavior.

