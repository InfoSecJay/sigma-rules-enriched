note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Remotely RMM (Remote Monitoring and Management) tool, specifically looking for `Remotely_Agent.exe` and `Remotely_Desktop.exe`. The likely attacker objective is to gain remote access to systems for management or malicious purposes, potentially leading to data exfiltration or system compromise. This behavior is associated with the MITRE ATT&CK technique **Execution: Remote Services** (T1219).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture detailed information about process execution on the system. If malicious, the impact could be significant, as it implies unauthorized remote access or control over the host. Importantly, this detection does NOT confirm malicious intent on its own; it does not indicate whether the tool is being used legitimately or not.

  ### Investigation Steps

  - **Check process execution details:** Review the process creation logs (Security Event ID 4688 or Sysmon Event ID 1) for any instances of `Remotely_Agent.exe` or `Remotely_Desktop.exe`. Pay attention to the **ParentImage** field to identify if these processes were launched from legitimate applications or user sessions.

  - **Verify legitimate usage:** Assess whether there is a documented business need for using Remotely tools in the environment. Lookup internal documentation or check with IT support to confirm if these applications are sanctioned for remote management.

  - **Correlate with user activity:** Analyze user login and activity logs (e.g., Event ID 4624) around the time of the event. Ensure user accounts running the connected sessions are recognized as legitimate administrators or tech support personnel.

  - **Identify anomalous network connections:** Investigate network logs for outgoing connections initiated by the detected processes. Look for unexpected IP addresses or concerning ports that do not correspond to known management destinations (e.g., Security Event ID 5156 for Windows Filtering Platform logs).

  - **Review account privileges:** Examine the permissions of the associated user accounts. Anomalies in user privileges might indicate compromised accounts that could lead to unauthorized use of remote management tools.

  ### Prioritization

  The alert is rated as medium severity due to the potential impact of the affected systems, particularly if they host sensitive data or critical applications. While usage of RMM tools can be legitimate, their potential for malicious abuse increases risk. Moreover, these tools are commonly weaponized by attackers to maintain persistent access in compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate presence of RMM tools in the environment, leading to possible false positives. Essential log sources include both process creation logs and network connection logs, which should be configured to ensure comprehensive monitoring. Legitimate remote support or management activities may inadvertently trigger the alert without malice. Companion detections might include monitoring for unusual lateral movement or administrative command executions to enhance overall coverage against potential abuse.

