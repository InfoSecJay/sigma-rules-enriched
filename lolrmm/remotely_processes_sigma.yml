note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Remotely Remote Management and Monitoring (RMM) tool, specifically `Remotely_Agent.exe` and `Remotely_Desktop.exe`. Attackers may use RMM tools for remote access to compromise systems, facilitate lateral movement, or maintain persistence. The relevant MITRE ATT&CK tactics and techniques include Remote Access Software (T1219), which relates to unauthorized remote access for exploitation.

  The primary telemetry sources for this detection include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the impact can be significant, enabling adversaries to control systems remotely and access sensitive data. However, this detection does NOT confirm malicious intent, as the legitimate use of the Remotely tool by support staff or admins can trigger the same alert.

  ### Investigation Steps

  - **Collect process creation logs:** Review Security Event ID 4688 for process creation by `Remotely_Agent.exe` or `Remotely_Desktop.exe`. Note the user account associated with the process launch to determine if it aligns with expected administrative activity.

  - **Inspect parent process details:** Analyze the `ParentImage` field in the same logs to identify the origin of the RMM tool's execution. Legitimate instances will likely have known system processes (e.g., `explorer.exe`), while suspicious origins could indicate adversarial use.

  - **Evaluate user account behavior:** Check the user's activity in the last 30 minutes around the execution time. Unexpected or atypical activity by the user or privileged accounts may suggest malicious behavior. Cross-reference with user activity events (Security Event ID 4624).

  - **Cross-reference with network activity:** Examine network logs for unusual outbound connections established by the RMM tool’s process, especially to known command-and-control IPs or domains in the last 24 hours. This could be a strong indicator of compromise.

  - **Contextualize using asset classification:** Assess the criticality of the affected host. If it's a production server or a sensitive workstation, prioritize the investigation accordingly. Non-critical systems may warrant less immediate action if legitimate use can be confirmed.

  - **Check for scheduled tasks or services:** Investigate if the processes appear as a running service or scheduled task (Task Scheduler logs). Legitimate instances could run regularly based on established maintenance schedules.

  ### Prioritization

  The alert severity is medium. While the RMM tool can facilitate significant security incidents if misused, its legitimate administrative use can result in false positives. This behavior could be weaponized; however, its frequency and context should be closely assessed during triage.

  ### Blind Spots and Assumptions

  This detection may miss instances where an attacker uses alternative means to run remote access tools (e.g., renamed executables). It relies on having detailed process creation logs available, so ensure Sysmon and relevant auditing configurations are in place for comprehensive visibility. Legitimate use by IT support teams can easily trigger the alert; factors such as operational hours and known maintenance schedules should be considered. A companion detection focusing on unusual outbound traffic during the tool's execution can enhance incident investigation accuracy.

