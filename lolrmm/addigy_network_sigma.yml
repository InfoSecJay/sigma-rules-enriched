note: |
  ### Technical Context

  This rule detects outbound network connections targeting Addigy's known domains, indicating that an endpoint may be using the Addigy Remote Management and Monitoring (RMM) tool. The likely attacker objective is to establish command and control (C2) infrastructure under the guise of legitimate RMM activity or to exploit existing legitimate RMM sessions for unauthorized access. This aligns with the MITRE ATT&CK tactics: Command and Control (TA0011) and the technique of Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs that capture outbound connections via specific destination hostnames. If malicious, this behavior might facilitate unauthorized remote management or exploitation of vulnerabilities on managed devices. Importantly, this detection does NOT confirm malicious intent, as legitimate use of Addigy for RMM could trigger the alert.

  ### Investigation Steps

  - **Check outbound connections:** Review network connection logs for Event ID 5156 (Windows Filtering Platform) to identify connections to `prod.addigy.com`, `grtmprod.addigy.com`, or `agents.addigy.com`. Verify destination IP addresses against known Addigy IP ranges.

  - **Evaluate process creation:** Cross-reference any detected connections with process creation logs (Event ID 4688) to determine if the connections were initiated by the Addigy agent or other legitimate applications expected to communicate with Addigy services.

  - **Identify unusual user activity:** Inspect user login events (Event ID 4624) for any user accounts that do not typically utilize Addigy services. Non-admin accounts making connections may indicate potential abuse.

  - **Review asset criticality:** Identify if the affected system is critical to business functions or holds sensitive data. Systems with higher significance warrant a more urgent response.

  - **Establish baseline behavior:** Document expected legitimate use of Addigy in your environment. Typical RMM operational windows, user accounts involved, and frequency of access are key to distinguishing between legitimate and suspicious behavior.

  ### Prioritization

  This alert has a medium severity due to the potential impact on managed systems from unauthorized remote access. While the likelihood of malicious abuse is moderate, knowing that Addigy is a recognized management tool means this behavior can often be legitimate, although monitoring for unauthorized use is crucial.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of encrypted connections, which can obscure malicious activities. Additionally, false positives can arise from legitimate employee use of Addigy. Required log sources include consistent network connection telemetry, which must be collected without filtering relevant outbound connection events. A related detection would be monitoring for unusual patterns in user logins to the Addigy platform, further enhancing visibility into potential abuse.

