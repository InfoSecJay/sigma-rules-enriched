note: |
  ### Technical Context
  This rule detects potential network activity associated with the Addigy Remote Monitoring and Management (RMM) tool, which may indicate unauthorized or unintended use within an enterprise environment. The primary concern is that malicious actors could exploit legitimate RMM tools like Addigy to gain remote access, execute commands, or even exfiltrate data without authorization. If compromised, attackers could leverage these tools to maintain persistence in the environment, perform reconnaissance, or conduct lateral movement within the network.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (TA0002):** Life cycle involvement where the attacker runs malicious code.
  - **Remote Services (T1219):** Exploitation of legitimate remote services, including remote management tools to achieve unauthorized access.

  To detect these suspicious activities, the primary data source is network connection logs on Windows machines, specifically focusing on outbound connections to domains associated with Addigy.

  ### Investigation Steps
  - **Explore Network Connections:** Review network connection logs for any unusual or unauthorized connections to domains such as `prod.addigy.com`, `grtmprod.addigy.com`, or `agents.addigy.com`, noting any endpoint behaviors that deviate from normal operations.

  - **Assess Process Activity:** Investigate recent process creation events that may correspond with the observed network activity, particularly looking for any instances of legitimate tools running in unexpected contexts or locations.

  - **Correlate User Activity:** Analyze user activity logs to determine legitimate vs. suspicious access patterns to RMM tools and any associated commands or scripts executed during those connections.

  - **Review Firewall Logs:** Examine firewall logs for unusual outbound traffic patterns or blocked connections that could provide insights into attempts to communicate with the Addigy endpoints.

  ### Prioritization
  The alert is considered medium severity due to the potential risk of remote management tool misuse, which may lead to unauthorized access or data exfiltration. While legitimate use exists, the likelihood of exploitation in the enterprise puts this activity on the radar for further investigation.

  ### Blind Spots and Assumptions
  This detection logic may miss legitimate uses of the Addigy RMM tool, which could lead to false positives. The effectiveness of this rule depends on having complete logging enabled for network connections and proper monitoring configurations. A gap exists in detecting internal misuse versus external attacks, as the tool's legitimate use may obscure malicious activity. If logging is misconfigured or incomplete, the alert may not trigger as expected, leading to potential blind spots in detection coverage.

