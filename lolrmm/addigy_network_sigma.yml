note: |
  ### Technical Context

  This rule detects network activity indicating potential usage of the Addigy Remote Monitoring and Management (RMM) tool through connections to specific Addigy domains. Attackers may leverage Addigy to gain remote access to managed systems, potentially exfiltrating data or deploying malicious software. Relevant MITRE ATT&CK tactic includes Execution (TA0002) and technique Remote Services (T1219). The primary telemetry sources are Windows network connection logs capturing outbound traffic towards Addigy domains, such as prod.addigy.com, grtmprod.addigy.com, or agents.addigy.com. If confirmed malicious, this behavior can signify unauthorized access to critical systems. This detection does NOT prove malicious intent on its own, as legitimate Addigy use would also generate similar network activity.

  ### Investigation Steps

  - **Verify network connections:** Check for network connections to the specific Addigy domains (prod.addigy.com, grtmprod.addigy.com, agents.addigy.com) in Windows Firewall logs (Event ID 5156) to confirm legitimate RMM tool usage or potential breaches.

  - **Review process origin:** Assess related process creation events (Security Event ID 4688 or Sysmon Event ID 1) to identify if the connection was initiated by the expected Addigy processes (e.g., "Addigy Agent.exe"). Any unexpected parent process may indicate malicious activity.

  - **Inspect recent user activity:** Investigate user login events (Security Event ID 4624) and correlate timestamps with the detected Addigy connections. Identify if the user is an authorized admin or IT staff member who has legitimate reasons for RMM activity.

  - **Confirm system role and criticality:** Determine the asset's role and criticality in the environment. Look for endpoint configurations or statuses indicating if the system is intended to be managed by Addigy, which can clarify the legitimacy of the detected connection.

  - **Examine payload delivery:** Investigate file creation logs for potential artifact creation linked to Addigy (e.g., execution of scripts or files related to the Addigy agent) to identify possible payload delivery points.

  ### Prioritization

  This alert is medium severity due to the risk of unauthorized remote access to potentially sensitive systems. The likelihood of abuse is moderate because RMM tools like Addigy are increasingly weaponized by threat actors to facilitate lateral movement and unauthorized management of devices.

  ### Blind Spots and Assumptions

  Detection may have limitations due to lack of visibility into encrypted traffic, which could evade inspection. Environments that do not log network connections or firewall events may miss this detection entirely. Additionally, benign usage from IT departments frequently generates similar alert patterns, complicating identification. Companion detections, such as monitoring for unusual process executions related to RMM tools (e.g., unexpected interactions with the Addigy agent), can improve coverage and accuracy in identifying genuine threats.

