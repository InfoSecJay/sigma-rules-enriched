note: |
  ### Technical Context

  This rule detects network connections to known Addigy RMM (Remote Monitoring and Management) tool domains, indicating that a system might be utilizing this remote management software. The likely objective of an attacker leveraging Addigy could be unauthorized access and control over managed endpoints, which can facilitate various malicious activities such as data exfiltration or deploying further malware. The identified relevant MITRE ATT&CK tactic is Command and Control (T1071), with the associated technique being Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs, specifically focusing on events related to outbound connections. If leveraged maliciously, the impact may include unauthorized access to systems and sensitive data compromise, particularly in environments managed through the Addigy platform. This detection does NOT confirm that malicious activity is occurring without additional context or corroborating evidence.

  ### Investigation Steps

  - **Check network connections:**
    Review Windows Event ID 5156 and 5158 to identify outbound network connections to any of the specified Addigy domains. Document the process initiating these connections for further analysis.

  - **Identify legitimate usage:**
    Correlate the detected activity with known usage patterns of the Addigy tool within your organization. Verify if any authorized administrators used Addigy during the alert timeframe.

  - **Correlate user activity:**
    Examine the Windows Security Event ID 4624 for logon events on the host. Pay particular attention to logons by users with administrative privileges to understand if there’s legitimate activity occurring alongside the alert.

  - **Evaluate process behavior:**
    Investigate the running processes on the affected systems using Sysmon Event ID 1 to determine if any processes related to Addigy, like "AddigyAgent.exe" or similar, are active. Ensure these processes are expected in your environment.

  - **Look for signs of abuse:**
    Identify unusual patterns, such as multiple connections within a short period to Addigy domains from non-admin accounts or from unusual geographic locations, which may indicate compromise.

  - **Review for exfiltration signs:**
    Check for file creation or data exfiltration artifacts that may indicate unauthorized data transfer via Addigy. Assess logs from user data directories or any evidence of unexpected data access around the time of the alert.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on managed systems and the likelihood of malicious abuse by adversaries gaining unauthorized control. While not all instances represent a threat, RMM tools like Addigy are commonly weaponized in targeted attacks, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection quality relies on accurate logging configurations, notably for Windows Firewall and network activity. Legitimate administrative use of Addigy may trigger this alert, necessitating a contextual understanding of its purpose within your environment. Consider companion detections for related suspicious network activity or other potential command and control signals to enhance coverage and validate findings.

