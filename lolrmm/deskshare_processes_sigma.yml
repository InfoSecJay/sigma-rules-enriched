note: |
  ### Technical Context
  This rule detects potential malicious usage of the DeskShare Remote Management Tool (RMM), which may be exploited by attackers to gain unauthorized access to systems. DeskShare RMM is a legitimate remote desktop tool that can be misused for remote administration or lateral movement within a network, often after an initial compromise. The likely objectives for an attacker using this tool include maintaining persistence, remote manipulation of compromised systems, and data exfiltration.

  In the context of MITRE ATT&CK, this detection relates to the **Execution** tactic, specifically technique **T1219: Remote Access Software**. This behavior indicates a possible misuse of a legitimate remote access application for malicious purposes. Analysts should focus on processes that indicate the execution of the DeskShare tool, particularly those initiated by commonly seen parent processes, which may indicate lateral movement or unauthorized remote access.

  The primary data sources for this detection rule are **process creation logs** from Windows systems, which will provide insight into the execution of processes associated with DeskShare RMM, helping analysts identify abnormal activity linked to remote system management.

  ### Investigation Steps
  - **Review Process Logs**: Analyze process creation logs to identify instances of `TeamTaskManager.exe` or `DSGuest.exe` being executed. Pay special attention to the parent processes of these binaries to determine their context.
  - **Check Parent Process Relationships**: Look for unusual parent-child relationships where DeskShare processes are spawned. Identifying legitimate parent processes versus unexpected initiation can help distinguish between authorized and malicious activity.
  - **Correlate Network Activity**: Examine network logs for any outbound connections made to unusual or unauthorized destinations from the systems running DeskShare processes, which might indicate exfiltration attempts or command and control communications.
  - **Monitor for User Behavior**: Investigate the user accounts involved in launching the DeskShare tools. Determine if these accounts have a history of legitimate use or if they exhibit anomalous behavior suggestive of compromise (e.g., accessing systems outside their normal scope).

  ### Prioritization
  The alert is considered medium severity due to the potential for significant impact if an attacker successfully gains unauthorized remote access, which could lead to data breaches or system compromise. However, the functionality of DeskShare as a legitimate tool also results in a risk of false positives.

  ### Blind Spots and Assumptions
  Detection coverage may miss instances where the tool might be used legitimately by authorized personnel for remote support or administration. The detection logic assumes that DeskShare processes typically originate from specific known parent processes, which may not always be true in all environments. Additionally, the alert relies on the availability of comprehensive process creation logs; if these logs are not configured to be captured, the rule may fail to trigger during actual malicious activity.

