note: |
  ### Technical Context

  This Sigma rule detects the execution of the DeskShare Remote Management Tool (RMM) processes, specifically `TeamTaskManager.exe` and `DSGuest.exe`, which are commonly used for remote desktop access. The associated attacker objective may involve unauthorized remote access to systems for administrative oversight, data exfiltration, or lateral movement within an enterprise environment. This behavior maps to the MITRE ATT&CK technique "Remote Desktop Protocol" (T1219).

  The primary telemetry sources for this rule are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide detailed information on process execution. If malicious, this activity could lead to significant data breaches or system compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also utilize these processes.

  ### Investigation Steps

  - **Check recent process activity:** Review Security Event ID 4688 for process creation logs related to `TeamTaskManager.exe` and `DSGuest.exe`. Look for timestamps and associated user accounts that triggered these processes.

  - **Assess parent process relationships:** Investigate parent processes (e.g., check for `TeamTaskManager.exe` parenting other instances). This can indicate legitimate administrative activity or an attacker's method of executing the RMM tool.

  - **Determine asset criticality:** Identify if processes were initiated on highly sensitive systems (e.g., servers, databases). Malicious use on critical assets may carry higher risk.

  - **Review user account activity:** Examine user account authentication logs (Event ID 4624) to correlate logins with reported process creation events. Analyze whether the accounts executing these processes have a history of legitimate administrative access or unusually high login activity.

  - **Validate tool usage policies:** Assess organizational policies regarding the use of remote management tools. Known legitimate instances should match documentation and intended use cases, while deviations could indicate potential abuse.

  - **Identify malicious indicators:** Look for unusual command-line arguments or network connections initiated by the detected processes that are not standard for DeskShare usage, which may indicate unauthorized attempts to exploit the tool for malicious purposes.

  ### Prioritization

  This alert holds medium severity as it may indicate unauthorized remote access attempts. The impact can vary based on the system's role and sensitivity. While DeskShare can facilitate legitimate administration, it has known associations with unauthorized access, making it a target for attackers.

  ### Blind Spots and Assumptions

  Detection may be limited if DeskShare is whitelisted or if process logs are not consistently monitored. Evasion techniques could include renaming the executables or using alternative remote access methods. Legitimate activities, such as authorized remote access by IT personnel, can trigger this alert. Consider companion detections related to RDP logins (T1076) to enhance overall monitoring effectiveness.

