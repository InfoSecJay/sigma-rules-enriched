note: |
  ### Technical Context

  This rule detects the process creation activity of the DeskShare Remote Management and Monitoring (RMM) tool, specifically when instances of either `TeamTaskManager.exe` or `DSGuest.exe` are spawned. The likely attacker objective would be to establish remote control over a compromised system, which may facilitate further malicious actions such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK framework under the tactic of Command and Control (T1219).

  The primary telemetry source is Windows process creation logs, specifically looking for Security Event ID 4688 and Sysmon Event ID 1 to capture details of process spawning. If this tool is being used maliciously, it poses a serious security risk as it enables unauthorized access and control over systems. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of the DeskShare application may trigger the alert.

  ### Investigation Steps

  - **Check process creation logs for events**: Review Security Event ID 4688 or Sysmon Event ID 1 to identify instances of `TeamTaskManager.exe` and `DSGuest.exe` being launched. Focus on timestamps and parent process details to establish the context of execution.

  - **Validate legitimate use of DeskShare**: Confirm if the affected asset has a documented need for Remote Management and Monitoring tools. Look for corresponding business justification or documentation, such as usage records or IT support requests.

  - **Investigate network connections to external hosts**: Analyze firewall logs or network traffic (e.g., NetFlow data) for any outbound connections initiated by the detected processes. Indicator of compromise includes connections to unusual or non-whitelisted external IP addresses.

  - **Assess process parent-child relationships**: Identify the parent processes of the DeskShare executables to detect unusual behaviors, such as processes launching from unexpected parent executables like common utilities or scripts (e.g., `powershell.exe`, `cmd.exe`).

  - **Review system user activity**: Check Windows Event IDs 4624 (Logon) and 4625 (Logon Failure) to correlate user accounts using the machine. Look for anomalies, such as new or unexpected user accounts attempting to access DeskShare.

  ### Prioritization

  This alert is medium severity due to the potential impact on compromised systems, especially during remote access sessions. The likelihood of malicious abuse is moderate, as RMM tools like DeskShare are increasingly weaponized by adversaries for unauthorized access. However, legitimate organizational use may complicate the response.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into user behavior and external network traffic logs. Adversaries may also employ obfuscation techniques, such as renaming or altering the executable to bypass detection. Legitimate administrative activities, such as IT support teams using DeskShare for remote troubleshooting, can trigger these alerts. A complementary detection could include monitoring for unusual command line arguments or application hooks related to remote access tools for enhanced coverage.

