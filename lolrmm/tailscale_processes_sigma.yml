note: |
  ### Technical Context

  This rule detects the execution of processes related to the Tailscale RMM tool, such as `tailscale-*.exe`, `tailscaled.exe`, and `tailscale-ipn.exe`. The behavior observed typically indicates remote management and potential network tunneling activities, which attackers may leverage to establish persistence and command-and-control (C2) communications. This activity correlates with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688. If these processes are being executed maliciously, they could facilitate unauthorized access to systems, leading to data breaches or lateral movement within the network. Importantly, this detection does not confirm malicious intent on its own, as Tailscale is also used for legitimate remote access.

  ### Investigation Steps

  - **Identify the process creation event:** Review Security Event ID 4688 for instances where the `Image` field matches `tailscale-*.exe`, `tailscaled.exe`, or `tailscale-ipn.exe`. Record the user account and parent process that launched these executables.
  - **Establish context for user activity:** Determine if the user associated with the process execution is authorized to use Tailscale. Check user groups and recent access patterns in logs (Event ID 4624) to identify any anomalies or unauthorized access.
  - **Monitor network activity:** Analyze network logs for outbound connections related to `tailscale-*.exe`. Look for unusual foreign IP addresses or ports that deviate from normal traffic patterns, as these could indicate malicious use of Tailscale for external access.
  - **Examine installation evidence:** Verify the presence of Tailscale in the system by checking installation paths or configurations (e.g., `%ProgramFiles%\Tailscale\`). Ensure it aligns with known legitimate installations within the organization.
  - **Review prior alerts:** Correlate with previous alerts related to remote access tools or suspicious outbound connections, which could indicate a broader compromise attempt or pattern of behavior consistent with known adversary tactics.

  ### Prioritization

  This alert is assigned a medium severity owing to the potential impact on critical systems due to unauthorized remote access. The likelihood of malicious abuse exists as remote access tools can be weaponized by threat actors for lateral movement and control. Given the increasing trend of legitimate software like Tailscale being exploited, this requires prompt investigation.

  ### Blind Spots and Assumptions

  The detection may miss operations where Tailscale is used legitimately in environments that require remote access. Evasion techniques could include renaming processes or hiding them under different parent processes. Reliable detection depends on ensuring that relevant process creation logs are enabled and collected. Companion detections, such as monitoring for unusual network behavior (e.g., unexpected external connections outside normal business hours), can enhance coverage against the misuse of remote access tools.

