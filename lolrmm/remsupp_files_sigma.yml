note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the RemSupp Remote Management and Monitoring (RMM) tool on Windows systems. The primary attacker objective may involve unauthorized remote access, session recording, or data exfiltration, exploiting the perceived legitimacy of the RemSupp tool. This detection aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Remote Access Software (T1219).

  The primary telemetry sources include Windows file event logs, specifically targeting paths associated with the RemSupp application. The security impact is significant, as attackers can achieve persistence and disrupt normal operations by leveraging valid RMM tools. This detection does NOT confirm malicious activity on its own; legitimate use of the RemSupp software can trigger the rule.

  ### Investigation Steps

  - **Review file activity:** Check Windows Event ID 4663 for file access events related to `C:\Users\*\AppData\Local\Programs\RemSupp\*` and identify unusual access patterns or timestamps outside normal operational hours.

  - **Assess the context of the tool:** Verify whether RemSupp is an approved tool within the organization. Legitimate use typically includes known management IPs and scheduled maintenance activities documented by IT.

  - **Investigate execution paths:** Examine Sysmon Event ID 1 for the execution of RemSupp.exe. Confirm that only expected application admins are using the tool and that the process initiation aligns with documented support activities.

  - **Identify high-confidence malicious indicators:** Look for HTTP traffic references to known C2 infrastructures within RemSupp’s log files, specifically in `chromium.log` or `preferences` files within the `C:\Users\*\AppData\Roaming\RemSupp\` directory.

  - **Correlate with user accounts:** Use Active Directory logs to check for unusual user behavior or account compromise, especially if RemSupp is executed by accounts that typically do not utilize RMM tools, indicated in security ID fields.

  ### Prioritization

  The alert severity is medium due to the potential for critical impact if RemSupp is misused by an adversary. The tool is commonly weaponized for persistence and command execution. However, the likelihood of abuse depends on the organization's IT practices concerning remote management tools.

  ### Blind Spots and Assumptions

  Detection limitations include potential misuse of RemSupp by legitimate administrators, which could cause false positives. Required log sources include comprehensive file auditing enabled on relevant directories to ensure accurate detection. Also, legitimate software installations or updates may trigger this alert, such as authorized maintenance activities. Companion detections could include monitoring for unusual outbound network connections from systems that have executed RemSupp.

