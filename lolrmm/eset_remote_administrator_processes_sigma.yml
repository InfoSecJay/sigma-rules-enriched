note: |
  ### Technical Context

  This Sigma rule detects potential process activity associated with the ESET Remote Administrator (ERA) tool, specifically targeting parent and child processes that involve specific executable file names. The likely attacker objective is to gain remote control over compromised systems, mimicking legitimate administrative access for malicious purposes. It aligns with MITRE ATT&CK Tactics such as Command and Control (T1219).

  The primary telemetry source is Windows process creation logs, particularly Event ID 4688 and Sysmon Event ID 1, which provide insights into processes spawned on endpoints. If malicious, successful exploitation can lead to unauthorized access to systems and the ability to execute arbitrary commands or exfiltrate sensitive information. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of the ESET Remote Administrator tool may trigger the same alert.

  ### Investigation Steps

  - **Check process hierarchy:** Review Event ID 4688 for any instances where processes are spawned from `era.exe`, `einstaller.exe`, or similar. Cross-reference the `ParentImage` and `Image` fields to establish the relationship.

  - **Review execution context:** Validate if the user account associated with the process has legitimate administrative access. A high-confidence indicator of malicious activity is a non-administrative account executing ERA tools.

  - **Assess timing of the alert:** Investigate the timestamps of the process creation in relation to recent security events or alerts (such as logins or network changes). Abnormal timeframes may indicate malicious use.

  - **Identify regular usage patterns:** Understand typical usage of the ESET Remote Administrator in your environment. Document expected times and contexts for legitimate use to differentiate against anomalous activity.

  - **Analyze associated network connections:** Check for any outbound network connections initiated by the detected processes using tools like Sysmon. Confirm connection destinations and protocols against known legitimate control servers (e.g., ESET management servers).

  - **Evaluate clustered activity:** If multiple alerts are triggered in a short time frame, look for evidence of coordinated actions that may suggest malicious infiltration, such as similar process executions across various endpoints.

  ### Prioritization

  The alert has medium severity due to the potential for significant impact on affected systems, particularly when administrative control is misused. The likelihood of malicious activity is elevated if the tools are running under unexpected conditions. While ESET Remote Administrator is a legitimate tool, it is commonly weaponized in targeted attacks, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if ESET remote management tools are not logged consistently or if there are gaps in Event ID 4688 logging configurations. Legitimate activities, such as scheduled system maintenance or updates performed by IT, may trigger these alerts. A related detection to consider is tracking unusual network activity involving established command and control behavior to reinforce alert accuracy and context.

