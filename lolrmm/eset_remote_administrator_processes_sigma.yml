note: |
  ### Technical Context

  This rule detects potential malicious or unauthorized usage of the ESET Remote Administrator (ERA) tool by identifying processes spawned from known ESET binaries such as `era.exe` and `ERAAgent.exe`. Attackers often utilize Remote Management Tools (RMM) for remote access, which can facilitate unauthorized changes, data exfiltration, or lateral movement across the network.

  The primary objective of an attacker leveraging RMM tools is to maintain access and control over compromised systems, often leading to data breaches or persistent threats. This behavior aligns with the MITRE ATT&CK technique for Remote Services (T1219) within the Execution pillar, suggesting active exploitation or lateral movement based on remote access capabilities.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, which captures details about new process creation events. A security impact assessment indicates that malicious use of this tool can result in significant impact to data integrity and confidentiality. This detection does not confirm that all instances of the detected processes are malicious; legitimate usage of ESET Remote Administrator is common within organizations.

  ### Investigation Steps

  - **Review process creation logs:** Analyze Security Event ID 4688 for process creation related to `era.exe`, `ERAAgent.exe`, or similar executables. Focus on timestamps concurrent with the alert.

  - **Identify parent-child relationships:** Use Sysmon Event ID 1 to verify the parent processes of detected instances. Legitimate instances should typically have `era.exe`, `einstaller.exe`, or `ezhelp*.exe` as the parent process.

  - **Check associated user accounts:** Cross-reference the user account that initiated the ESET processes. Legitimate users should be part of IT or support roles, while unexpected accounts may indicate malicious activity.

  - **Validate network connections:** Inspect network activity on affected endpoints using firewall or network monitoring logs. Look for provided IP addresses or outbound connections that align with known ESET management infrastructure.

  - **Assess endpoint role and criticality:** Determine if the affected system is a critical server or part of the IT management infrastructure. RMM usage in critical areas poses a higher risk and requires immediate attention.

  - **Correlate with anomaly detection:** Identify any previous alerts or anomalous behaviors associated with the same user or system. Any marked deviations from typical operational patterns warrant deeper investigation.

  ### Prioritization

  This alert is deemed medium severity due to the potential impact of unauthorized access on sensitive systems and the likelihood of malicious abuse through remote access tools. The behavior is weaponized in attacks targeting system management, especially in environments where RMM tools are present, heightening the urgency of investigation.

  ### Blind Spots and Assumptions

  Detection relies on comprehensive logging of process creation events; without detailed telemetry, false negatives could occur. Legitimate activities, such as authorized IT support sessions, may trigger this alert if not properly whitelisted. Related detections, such as unusual authentication patterns or unexpected network connections from these processes, can supplement this rule, improving overall threat detection capabilities.

