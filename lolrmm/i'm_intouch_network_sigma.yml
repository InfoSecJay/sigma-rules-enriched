note: |
  ### Technical Context
  This rule is designed to detect potential network activity associated with the "I'm InTouch" Remote Monitoring and Management (RMM) tool, which can be leveraged by threat actors for remote access to compromised systems. The suspected threat scenario involves attackers utilizing the I'm InTouch tool to maintain persistence within a victim’s network, allowing them to perform various malicious actions such as data exfiltration, lateral movement, or network reconnaissance. By establishing a remote connection via this tool, adversaries aim to evade detection and control compromised systems without the need for direct presence.

  Relevant MITRE ATT&CK tactics and techniques applicable to this detection include "Execution" (TA0002) and "Remote Services" (T1219). These techniques encompass the use of remote access applications and services to carry out various actions on a target machine. To effectively identify the usage of the I'm InTouch tool, primary data sources include Windows network connection logs that capture outbound connections to specific hostnames, especially those associated with `01com.com` domains and its related subdomains.

  ### Investigation Steps
  - **Review Network Logs**: Examine network connection logs for activities connecting to `*.01com.com` or `01com.com/imintouch-remote-pc-desktop`. Identify any unusual connection patterns or timestamps that deviate from normal operations.

  - **Analyze Process Activity**: Investigate any associated process creation events around the time of the detected network connections. Look for unauthorized or unexpected executions of RMM tool processes that indicate malicious use.

  - **Check for Unusual User Behavior**: Identify user accounts linked to the detected connections and cross-reference them with typical usage patterns. Look for anomalies such as connections made during off-hours or from unexpected devices.

  - **Monitor for Related Indicators**: Keep an eye on other potential indicators of compromise, like changes in system configurations or unexpected services being actively hosted on systems running the RMM tool, which could suggest exploitation or lateral movement attempts.

  ### Prioritization
  This alert is considered medium severity due to the potential for significant impact on system integrity and confidentiality. The use of remote access tools like I'm InTouch may indicate that an attacker has established unauthorized access, creating a critical need for immediate investigation.

  ### Blind Spots and Assumptions
  The detection logic assumes that all connections made to the specified domains originate from malicious activity, which may lead to false positives in environments where I'm InTouch is used legitimately for managed services. A gap exists in covering environments that use alternative remote management tools or those that utilize encrypted traffic which may bypass standard logging. Proper logging configurations and real-time monitoring of network connections are necessary for this alert to function effectively, including ensuring visibility into DNS queries and associations with the specified remote access service.

