note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the I'm InTouch remote management tool, specifically monitoring connections to domains ending in `.01com.com`. Attackers often leverage legitimate remote management tools in their operations, aiming to establish command and control (C2) channels to compromised hosts. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) under the technique Remote Access Software (T1219).

  The primary telemetry sources include Windows network connection logs that capture outbound connection attempts to suspicious domains, specifically indicating potential misuses of remote admin tools. If this activity is genuinely malicious, it may lead to unauthorized access and control over enterprise systems. However, this detection does NOT confirm malicious intent on its own, as legitimate configurations may also trigger the rule.

  ### Investigation Steps

  - **Check outbound connections:** Investigate Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to `.01com.com` to identify if the connection attempts are coming from known I’m InTouch installations.

  - **Evaluate process legitimacy:** Review the processes associated with the detected connections using Sysmon Event ID 1 (Process Creation). Look for suspicious parent processes or unusual command-line arguments that deviate from standard operational practices.

  - **Correlate with known assets:** Confirm the legitimacy of installed software by verifying asset inventory against the detected hosts to ensure that I’m InTouch is an authorized application. Expected behavior should show known administrative hosts connecting to this domain during maintenance periods.

  - **Review user activity:** Examine user account logs in Security Event ID 4624 for active sessions engaging with I’m InTouch around the time of the network activity, focusing on unusual user accounts or times that diverge from normal operational hours.

  - **Analyze traffic volume:** Utilize network monitoring tools to assess bandwidth and data transmission rates related to connections to `.01com.com`. High traffic volumes may indicate exfiltration or active C2 communication.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems, especially if the detected activity originates from sensitive services or administrative accounts. While I’m InTouch is a legitimate tool, its misuse by adversaries is common, making this alert significant but requiring further validation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete logging configurations or filtering settings necessary to catch all relevant events. Some legitimate administrative work might also trigger this alert based on standard operational behavior. Related detection coverage might include monitoring of known remote administration tools, such as TeamViewer or AnyDesk, to identify anomalies in their behavior and strengthen defensive postures.

