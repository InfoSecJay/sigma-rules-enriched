note: |
  ### Technical Context

  This detection rule identifies file activity related to the NetBird Remote Monitoring and Management (RMM) tool, including its executable, configuration files, and associated scripts. The likely attacker objective is to leverage the RMM tool for remote access and management of compromised systems, which could facilitate further malicious actions such as data exfiltration or lateral movement. This aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Remote Access Software (T1219).

  The primary telemetry sources include Windows file event logs that detail file creation, modification, or access events associated with specific paths linked to NetBird components. If malicious, unauthorized presence of this tool can lead to significant security breaches, including unauthorized control over systems or data exfiltration. Importantly, this detection alone does not confirm malicious intent; legitimate use of the NetBird tool can trigger this alert.

  ### Investigation Steps

  - **Investigate file creation events:**
    Review Windows Security Event ID 4663 for file access events pertaining to `C:\Program Files\Netbird\netbird.exe`, focusing on the "Object Type" field to confirm whether it matches expected executable activity.

  - **Correlate with process launch:**
    Cross-reference process creation logs (Sysmon Event ID 1 or Windows Event ID 4688) for instances where `netbird.exe` was executed, checking if the parent process is associated with legitimate management software.

  - **Identify legitimate usage:**
    Confirm whether the timestamps of file activity correspond to known maintenance or updates, as these may involve legitimate NetBird executions based on IT operational schedules.

  - **Look for anomalous configuration changes:**
    Check for edits to `C:\ProgramData\Netbird\config.json` through Security Event ID 4663, noting any modifications not justified by legitimate IT operational needs.

  - **Check for known malicious patterns:**
    Assess any creation of vbs or zip files in `C:\bin\` which are not tied to legitimate usage patterns, as the presence of `cis.vbs` or `trm.zip` without justification may indicate malicious intent.

  ### Prioritization

  This alert is of medium severity, as the presence of the NetBird tool can be associated with both legitimate and malicious activities. Given the potential for remote access to be weaponized by attackers, systems where this activity is detected should be treated with caution, especially if critical assets are involved.

  ### Blind Spots and Assumptions

  The detection may miss legitimate administrative tasks that incorporate NetBird or be evaded by using obfuscated file paths or alternate management tools. Reliable detection necessitates comprehensive logging configurations on Windows file systems. Legitimate activities, such as IT maintenance or legitimate software deployment, can inadvertently trigger this alert. A companion detection rule to monitor for unusual connectivity patterns (e.g., outbound connections to known malicious IPs) can enhance the context and corroborate findings related to RMM tool activity.

