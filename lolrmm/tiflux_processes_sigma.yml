note: |
  ### Technical Context

  This rule detects the execution of processes associated with the TiFLUX RMM tool, which is commonly used in unauthorized remote monitoring and management operations. The likely attacker objective is to maintain persistence, facilitate remote control of compromised systems, and potentially exfiltrate sensitive data. This detection aligns with the MITRE ATT&CK tactic of Execution (T1203) and the technique Remote Access Software (T1219). Primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, capturing process execution details.

  If malicious, the security impact can be significant, allowing attackers sustained access to the system and the ability to manipulate or exfiltrate data. However, this detection does NOT confirm that malicious activity is occurring, as TiFLUX may be legitimately used in various environments, especially in managed services.

  ### Investigation Steps

  - **Verify process creation events:** Check for Windows Security Event ID 4688 and Sysmon Event ID 1 for any processes named "TiService.exe," "TiUpdateService.exe," "si.exe," or "TiAgent.exe." Compare these against known baselines to identify discrepancies.

  - **Identify parent processes:** Review the parent process information from detected events. Legitimate usage typically involves common system tools such as "explorer.exe" or "powershell.exe." An unexpected parent process may indicate malicious activity.

  - **Audit system configuration:** Confirm the installation of the TiFLUX tool on the system by checking for related artifacts in the file system, such as “C:\Program Files\TiFLUX.” Analyze timestamps of the files for recent changes or unauthorized modifications.

  - **Review network connections:** Investigate any outbound network activity linked to the detected processes. Look for connections to suspicious or known malicious IPs or domain names. Common ports used by RMM tools can be telltale indicators of compromise.

  - **Assess user activity:** Examine the user context associated with the process creation events. Legitimate entries should align with designated administrative tasks or known personnel using RMM software. Look for impersonation of legitimate users as a potential red flag.

  - **Investigate related detections:** Correlate findings with other alerts indicating unusual process activity or suspicious configurations in remote access tools to strengthen confidence in identifying a malicious incident.

  ### Prioritization

  This alert should be classified as medium severity due to potential impacts on system integrity and data security. The likelihood of abuse is moderate, as RMM tools can be leveraged by attackers for post-exploitation purposes. This behavior is not uncommon among adversaries seeking to establish footholds in enterprise environments.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming legitimate processes or modifying executables to blend with benign activity. Reliable detection necessitates comprehensive logging capabilities, including Sysmon and Windows Event Logs, to capture process details consistently. Legitimate activities, such as IT support tasks or system maintenance updates, may trigger this alert, warranting further investigation. A related detection for unauthorized RMM tools or anomalous remote access activities can enhance overall detection and response capabilities.

