note: |
  ### Technical Context

  This Sigma rule detects the creation of processes related to the GoToAssist (GoTo Resolve) remote management tool. The likely attacker objective is to leverage legitimate remote administration tools for unauthorized access or control over an environment, fitting within the MITRE ATT&CK tactic of **Command and Control** (TA0011) and technique **Application Layer Protocol** (T1219). The primary telemetry sources include Windows process creation events (Event ID 4688) and potentially Sysmon logs. If malicious, these detections indicate unauthorized remote access, potentially leading to data exfiltration or system compromise. This detection alone does NOT confirm malicious activity, as GoToAssist may be in legitimate use within the organization.

  ### Investigation Steps

  - **Review recent process creation events**: Check Windows Security Event ID 4688 for processes spawned by GoTo Resolve components. Focus on timestamps correlating with alert triggers to identify suspicious activity patterns.

  - **Identify parent-child process relationships**: Investigate specific parent process instances like `GoToResolveExternalModuleHandler.exe` for children processes. Analyze if these processes were executed in unusual contexts or by non-administrative user accounts.

  - **Correlate user accounts**: Determine if the account executing the GoTo Resolve processes is a known legitimate remote support technician or if it is an atypical account, especially focusing on Event ID 4624 for logon events.

  - **Validate remote connection logs**: Review logs from the GoToAssist application that show legitimate sessions. Ensure these sessions align with known support requests and match documented approval for remote access.

  - **Check for known malicious indicators**: Look for high-confidence indicators such as unusual creation times of the processes (e.g., during non-business hours) or presence on unexpected endpoints. For instance, if a critical asset like a domain controller has GoTo Resolve processes not associated with a support request, it is a potential red flag.

  - **Assess environmental controls**: Verify if the organizational policy allows GoTo Resolve usage in certain environments and ensure access logs are maintained for compliance checks.

  ### Prioritization

  The alert is of medium severity given the potential impact of unauthorized remote access to sensitive systems. The likelihood of malicious use is elevated if seen on critical assets without prior user support requests. This behavior can be weaponized as attackers often utilize legitimate RMM tools to facilitate intrusions.

  ### Blind Spots and Assumptions

  Detection is limited by reliance on user behavior, meaning legitimate remote support usage may trigger false positives. Log sources must include comprehensive Windows event logs and potentially Sysmon for reliable detection. Legitimate internal support activities, especially during critical system updates or troubleshooting, may cause alerts to trigger. A related detection could include monitoring for unauthorized remote access tool executions across the network to augment the visibility of misuse.

