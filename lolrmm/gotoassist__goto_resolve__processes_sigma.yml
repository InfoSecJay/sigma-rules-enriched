note: |
  ### Technical Context

  This rule detects processes initiated by the GoToAssist (GoTo Resolve) remote monitoring and management (RMM) tool. It is likely part of an attacker's objective to maintain access to compromised systems or conduct administrative tasks discreetly. The relevant MITRE ATT&CK tactic is Execution, specifically technique T1219 (Remote Access Software). The primary telemetry source is Windows process creation logs, notably Security Event ID 4688 or Sysmon Event ID 1, indicating new process creation activities. If malicious, this behavior may enable attackers to manipulate systems or exfiltrate data remotely. However, the detection does NOT confirm malicious activity on its own, as legitimate usage of GoToAssist is common in IT support and maintenance.

  ### Investigation Steps

  - **Identify process creation details:** Review Security Event ID 4688 logs for processes where `ParentImage` is one of the GoToResolve executables and check `Image` paths for the same. This could indicate potentially unauthorized use.

  - **Validate legitimate use:** Confirm if the alert corresponds with expected IT support activities. Check for known tickets or requests involving GoToResolve, and correlate with the time of process executions.

  - **Check process parameters:** Investigate the `CommandLine` field in event logs for any suspicious arguments or commands run alongside the GoToResolve executables that may indicate misuse (e.g., unusual flags or connecting to unknown IPs).

  - **Monitor network activity:** Review firewall logs or network traffic (NetFlow or packet capture data) for outbound connections initiated by GoToResolve to unfamiliar IP addresses or domains. This could indicate potential exfiltration or beaconing.

  - **Assess host roles:** Identify the role of the host where the alert was triggered (e.g., user workstation vs. server) to evaluate the impact of potential misuse. For example, unauthorized RMM access to a critical server could have severe implications.

  - **Document any anomalies:** Look for unusual behavior patterns associated with process execution, such as the timing of the executions or elevated privileges. If the `GoToResolveUi.exe` is running without a legitimate context, consider it a high-confidence malicious indicator.

  ### Prioritization

  This alert should be treated with medium severity due to its connection to remote access processes that can be exploited by adversaries. Given the common usage of GoToResolve for legitimate IT tasks, analyzing context is critical; however, unauthorized execution can lead to significant compromises, particularly if run on sensitive systems.

  ### Blind Spots and Assumptions

  Detection may be limited if GoToResolve is misconfigured or if the log sources are not consistently enabled on all endpoints. The presence of GoToResolve may also trigger alerts during routine IT maintenance, leading to false positives. A related detection is monitoring for unusual remote access patterns (T1071.001) to provide broader context for network communications initiated by this tool.

