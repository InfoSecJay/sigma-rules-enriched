note: |
  ### Technical Context

  This Sigma rule detects registry modifications related to the ProxiPort Remote Management and Monitoring (RMM) tool, specifically targeting the registry path `HKLM\SYSTEM\CurrentControlSet\Services\proxiport`. The likely attacker objective is to establish persistence or remote access to a compromised system as part of their command-and-control (C2) operations. This behavior fits within the MITRE ATT&CK framework under the "Command and Control" tactic (T1071) and the "Application Layer Protocol" technique (T1219). The primary telemetry source is Windows Registry event logs, particularly focusing on changes involving service installation or modifications.

  If malicious, such activity can lead to unauthorized remote access, data exfiltration, or further exploitation of network resources. However, it is essential to note that this detection does NOT confirm malicious intent on its own since legitimate use of ProxiPort by authorized personnel can trigger similar alerts.

  ### Investigation Steps

  - **Examine the registry changes**: Review Windows Registry Event logs, specifically Event ID 4657, which track changes to `HKLM\SYSTEM\CurrentControlSet\Services\proxiport`. Look for unexpected modifications made outside of known maintenance windows.

  - **Look for process creation tied to the tool**: Check Security Event ID 4688 logs for the creation of processes associated with ProxiPort, such as `proxiport.exe`. Cross-reference timestamps with the registry changes for correlation.

  - **Identify network connections**: Use network telemetry (NetFlow or firewall logs) to identify outbound connections to known ProxiPort C2 IP addresses or domains. Look for unusual network activity not typical for the affected asset.

  - **Validate legitimate usage**: Determine the user's identity associated with the registry changes by checking the system's event logs (Event ID 4624). Identify if the activity matches the user's typical behavior patterns, such as routine administrative tasks.

  - **Analyze for high-confidence indicators of compromise**: Search for the presence of known malicious hashes or binaries related to ProxiPort through endpoint protection platforms or threat intelligence sources.

  - **Review documentation for legitimate use**: Consult internal documentation regarding authorized installations of ProxiPort. Determine if the affected system is part of a legitimate RMM operation, which might explain registry modifications.

  ### Prioritization

  This alert should be treated with medium severity due to the potential risks associated with unauthorized remote access and service persistence capabilities. The impact can be significant if a critical system is affected, and while known legitimate usages exist, the possibility of its malicious exploitation remains prevalent.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for evasion through legitimate use of the ProxiPort tool. Ensure that all relevant Windows Registry monitoring logs are enabled for comprehensive coverage. Legitimate administrative activities, such as authorized maintenance or updates, could also trigger this alert. A related detection to strengthen coverage is monitoring for unusual remote access service installations (e.g., Remote Desktop, TeamViewer) which may accompany or mimic ProxiPort usage.

