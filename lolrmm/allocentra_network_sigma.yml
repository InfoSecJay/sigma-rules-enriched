note: |
  ### Technical Context

  This rule detects network connections to the Allocentra RMM (Remote Monitoring and Management) tool, specifically when connecting to the domain `api.allocentra.co.za`. The likely attacker objective may involve using this tool for remote access, command control, or system monitoring. This activity correlates with the MITRE ATT&CK techniques for Command and Control (T1071) and Remote Access Tools (T1219).

  The primary telemetry source for this detection is Windows network connection logs. These logs provide insight into outbound connections from the host. If malicious, the execution of Allocentra could allow an adversary to gain unauthorized access to systems or execute arbitrary commands. It’s important to note that this detection does NOT confirm malicious activity by itself, as legitimate use of Allocentra is possible.

  ### Investigation Steps

  - **Verify network connections:** Examine Security Event ID 5156 or Windows Firewall logs. Check for `api.allocentra.co.za` as the destination and note any corresponding source IPs and ports. Ensure connections align with expected usage patterns.

  - **Identify related processes:** Review Security Event ID 4688 (Process Creation) logs for any executables that initiated the network connection to the Allocentra API. Look for unexpected or suspicious process names or parent-child process hierarchies.

  - **Examine user context:** Check the user account associated with the network connection. Investigate whether the user has legitimate access rights to perform administrative tasks with Allocentra.

  - **Assess asset criticality:** Determine the asset type initiating the connection (e.g., endpoint, server). High-value assets (like domain controllers) initiating this connection warrant immediate deeper inspection.

  - **Correlate with installation records:** Validate if Allocentra software is installed on the system by reviewing application logs or installed software lists (e.g., via WMI query). Confirm if it aligns with known legitimate administrative use cases.

  ### Prioritization

  This alert carries medium severity due to the potential impact of the affected system being exploited as a remote command and control point. While the likelihood of malicious abuse exists, the Allocentra tool can be legitimately used by admins, which makes evaluation context-critical to prioritize incident response.

  ### Blind Spots and Assumptions

  Detection may be limited if legitimate use of Allocentra is prevalent within the organization, leading to potential false positives. Reliable detection requires configuration to ensure comprehensive network logging is enabled. Additionally, benign administrative activities may trigger this alert if team members are conducting routine RMM tasks. Presence of companion detections involving anomalous outbound connections (e.g., connection patterns not aligning with user behavior) can help strengthen overall monitoring and threat assessment.

