note: |
  ### Technical Context

  This rule detects network activity linked to the use of the ezHelp Remote Management Tool (RMM), with specific focus on outbound connections to its domains. The likely attacker objective is to control or maintain persistence on a target system, using the RMM capabilities for unauthorized access or remote management. This behavior corresponds to the MITRE ATT&CK techniques: remote access software, T1219. The primary telemetry source for this detection is Windows network connection logs, focusing on connections to hostnames ending in `*.ezhelp.co.kr`. If malicious, this could indicate unauthorized remote access, potentially leading to data exfiltration or system compromise. Importantly, this detection does NOT confirm malicious intent on its own, as ezHelp may be used legitimately within an organization.

  ### Investigation Steps

  - **Verify outbound connections:** Review Windows Firewall logs for outbound connections (Event ID 5156) to `ezhelp.co.kr` or related domains. Malicious indicators include unexpected connections from critical systems or during non-business hours.

  - **Correlate process creation:** Check for Sysmon Event ID 1 to see if connections to ezHelp are initiated by known remote management processes. Legitimate activity typically involves administrative processes such as `msiexec.exe`.

  - **Inspect installed software:** Query installed applications to identify whether ezHelp RMM is an authorized tool (e.g., via `Get-WmiObject -Class Win32_Product` in PowerShell). Unauthorized installations might indicate potential abuse.

  - **Analyze user activity:** Review Windows Security Event ID 4624 for user logon events around the time of the detected network activity. Legitimate admin logins should show expected behavior patterns, while anomalous logins with recent RMM activity may warrant further investigation.

  - **Check for scheduled tasks:** Look into Task Scheduler logs (Event ID 4698) to see if any scheduled tasks are utilizing ezHelp for automated remote access. Legitimate administrative automation tasks should be predefined with clear documentation.

  ### Prioritization

  The severity of this alert is medium due to the potential risk of unauthorized remote access via ezHelp. If exploited, it could provide attackers with substantial control over important systems, especially on critical assets. This behavior can be weaponized, making it crucial for analysts to assess the context of the activity quickly.

  ### Blind Spots and Assumptions

  This detection could be evaded through obfuscation techniques, such as using non-standard DNS names or IP addresses. Its effectiveness relies on capturing all network connection logs; missing these could lead to false negatives. Legitimate administrative use of ezHelp can trigger this alert, complicating assessments. A relevant companion detection could include monitoring for unusual process execution correlated with ezHelp usage to enhance investigative accuracy.

