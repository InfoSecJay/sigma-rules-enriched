  ---

  ### Technical Context

  This detection rule identifies network connections to the ezHelp Remote Monitoring and Management (RMM) tool's domains. The likely attacker objective is to establish remote control over compromised systems for information theft, lateral movement, or data exfiltration. This activity aligns with the MITRE ATT&CK technique for Remote Desktop Protocol (RDP) and other remote access tools (Technique T1219). The primary telemetry sources include Windows network connection logs that record outbound connections, specifically focusing on `DestinationHostname`.

  If confirmed as malicious, this behavior can lead to unauthorized access and potential breach of sensitive systems. It is important to note that this detection does NOT confirm malicious activity on its own, as there may be legitimate or benign uses of the ezHelp tool within the organization.

  ---

  ### Investigation Steps

  - **Review connection logs to ezHelp domains:** Examine Windows Event ID 5156 and Event ID 5158 for outbound connections to `*.ezhelp.co.kr`. Check for unusual timestamps or connections from non-IT personnel.

  - **Identify the process initiating the connection:** Use Sysmon Event ID 3 to find the parent process associated with the connection. Look for processes commonly used by IT staff versus those initiated by non-typical applications.

  - **Validate legitimate use cases:** Cross-reference the connection time with known remote support sessions or maintenance schedules. Check if ezHelp connections coincide with authorized administrative tasks.

  - **Check for concurrent suspicious activities:** Review other security alerts triggered around the same time that could indicate a broader compromise, such as failed logins or unusual privilege escalations (use Event ID 4740 for account lockouts).

  - **Investigate endpoint security configurations:** Ensure endpoint protection mechanisms like firewalls are logging and blocking unauthorized outbound traffic. Document any exceptions granted for ezHelp.

  - **Verify system role and criticality:** Assess if the system making the outbound connection is critical (e.g., a server handling sensitive data) or if it is a less critical asset. This helps gauge the potential impact of a breach.

  ---

  ### Prioritization

  This alert should be treated as medium severity due to the implications of potential remote access on critical infrastructure. While ezHelp may have legitimate uses, its known association with remote management tasks makes it a potentially exploitable vector for attackers. The frequency of weaponized RMM tools in the threat landscape heightens the significance of this alert.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate use of ezHelp is prevalent, leading to false positives. Ensure that Windows firewall logs or equivalent are enabled to capture all relevant outbound connections. Additionally, employees in helpdesk roles may naturally generate alerts due to their use of remote management tools. A related detection to consider is monitoring for unauthorized tools or processes typically associated with remote access that are not part of the organization’s approved software suite.

