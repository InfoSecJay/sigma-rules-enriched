note: |
  ### Technical Context

  This rule detects network connections to domains associated with the ezHelp remote management tool, which is often used in IT support situations. An attacker may misuse this software to maintain persistence on a compromised system or to facilitate remote access during a cyber intrusion. The relevant MITRE ATT&CK tactic is **Command and Control (T1071)**, specifically technique **Application Layer Protocol (T1219)**.

  The primary telemetry sources include Windows network connection logs, specifically monitoring for outbound connections. If malicious, this behavior can lead to unauthorized access and control over affected systems. This detection does NOT confirm whether the activity is benign or malicious on its own; legitimate use of the ezHelp tool is common in IT environments.

  ### Investigation Steps

  - **Examine outbound connections:** Review Windows network connection logs (Event ID 5156) for any outbound traffic to *.ezhelp.co.kr or ezhelp.co.kr to identify if any internal assets are making these connections.

  - **Review running processes:** Check for associated processes on systems making these connections (e.g., using Sysinternals Process Explorer) to see if ezHelp RMM is actively running. Legitimate usage would typically involve a user or technician present.

  - **Correlate with user activity:** Analyze usage patterns around the time of detection. If the connection aligns with authorized support requests or scheduled maintenance, it may be benign.

  - **Identify anomalous behaviors:** Investigate for other indicators of compromise such as abnormal login attempts, suspicious IP addresses in conjunction with the connection log, or any user sessions starting the ezHelp tool unexpectedly.

  - **Inspect related logs:** Look for file creations or modifications associated with ezHelp (e.g., logs or executable files in typical installation directories) to further validate if the tool is being used legitimately or if it has been deployed maliciously.

  ### Prioritization

  The severity of this alert is medium, as the ezHelp tool can be weaponized for unauthorized remote access, potentially leading to data breaches. The impact is contingent on the criticality of the affected system and whether it holds sensitive information.

  ### Blind Spots and Assumptions

  This detection is limited by the potential use of tunneling techniques to disguise the traffic or use of domain fronting. Accurate detection relies on having comprehensive network logging configurations and may miss legitimate uses of ezHelp in a corporate environment. A companion detection could involve monitoring for anomalous authentication events related to accounts using ezHelp, strengthening the ability to discern malicious from legitimate activity.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
