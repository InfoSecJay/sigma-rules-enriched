note: |
  ### Technical Context

  This detection rule identifies outbound network connections to domains associated with the ezHelp Remote Monitoring and Management (RMM) tool. The behavior suggests that an attacker may be attempting to utilize the ezHelp RMM tool for administrative control, data exfiltration, or remote access, potentially during a post-exploitation phase. This aligns with the MITRE ATT&CK tactics of Execution (TA0002) and Remote Services (T1219). The primary telemetry sources include Windows network connection logs, specifically monitoring connections to the designated hostname patterns. If malicious, the impact could range from unauthorized system control to data theft. This detection does NOT confirm that an attack is underway, as legitimate use of ezHelp by authorized personnel can trigger this alert.

  ### Investigation Steps

  - **Verify outbound connections to ezHelp domains:** Check Windows Firewall logs for outbound connections (Event ID 5156) to '*.ezhelp.co.kr' or 'ezhelp.co.kr'. Validate if the connections are linked to known administrative accounts or services.

  - **Monitor for related process creation:** Review process creation logs (Security Event ID 4688 and Sysmon Event ID 1) where the command line includes the term 'ezHelp'. Note the user's context and associated parent process for legitimacy.

  - **Assess user activity:** Investigate user activity around the time of the alert. Check for legitimate use cases of ezHelp by reviewing ticketing or IT service desk logs. Compare the timestamps of connections with user activity in service management systems.

  - **Identify high-confidence malicious indicators:** Look for unusual traffic patterns or frequent reconnections to the ezHelp domains, alongside other suspicious behaviors such as unauthorized file accesses or privilege escalation attempts (Event IDs 4672, 4800).

  - **Correlate with known threats:** Cross-reference alerts with threat intelligence feeds or internal threat hunting tools for previous incidents involving ezHelp. Document any overlaps with reported misuse or exploitation.

  ### Prioritization

  The severity of this alert is medium due to the potential use of a remote management tool, which can enable attackers to control or exfiltrate data from critical systems. While the usage of RMM tools like ezHelp is common in IT management, unauthorized access raises significant concerns.

  ### Blind Spots and Assumptions

  Detection may be limited if the logs are not correctly configured to capture all outbound traffic or if the ezHelp tool is used legitimately in the environment. The detection might also trigger from benign administrative tasks, making it crucial to verify the context of connections before escalation. Companion detections related to unusual user access patterns or privilege escalations would strengthen overall coverage and threat analysis.

