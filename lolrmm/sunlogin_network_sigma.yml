note: |
  ### Technical Context

  This rule detects outbound network connections to known SunLogin RMM (Remote Monitoring and Management) domains, which may indicate unauthorized remote access or command-and-control (C2) activity by an attacker. The likely attacker objective is to establish a remote session to infiltrate or control affected machines. This detection relates to the MITRE ATT&CK tactic: Command and Control (T1071.001) and technique: Application Layer Protocol (T1071). The primary telemetry source is Windows network connection logs, specifically those capturing outbound connection attempts.

  If malicious, this behavior could allow an adversary to execute commands remotely and compromise network integrity. This detection does NOT confirm malicious intent on its own; legitimate uses of SunLogin can trigger similar alerts.

  ### Investigation Steps

  - **Check network connection logs**: Examine Windows network connection logs for Event ID 5156 indicating outbound connection attempts to `*.client.oray.net` or `*.sunlogin.oray.com`. Focus on the destination IP addresses for known SunLogin infrastructure.

  - **Review process creation events**: Look for related process creation activity by checking Security Event ID 4688 or Sysmon Event ID 1. Identify if a legitimate process (e.g., `sunlogin.exe`) is responsible for the network call, or if it’s an unauthorized application.

  - **Identify legitimate usage**: Confirm if the affected system has documented use cases of SunLogin, and cross-reference user account activity with helpdesk tickets or remote assistance logs ensuring it aligns with normal operational behavior.

  - **Analyze DNS queries**: Utilize DNS logs to correlate queries made to `*.client.oray.net` or `*.sunlogin.oray.com`. Look for rapid or unusual DNS request patterns that exceed typical usage for the organization.

  - **Evaluate asset criticality**: Determine if the affected asset belongs to critical infrastructure or sensitive environments. Increased attention is required for servers or endpoints with sensitive data.

  - **Identify malicious indicators**: Check for unusual user behavior consistent with unauthorized access, such as new user accounts or logins from unfamiliar locations leading to connections to SunLogin domains.

  ### Prioritization

  This alert is of medium severity due to the potential risk associated with unauthorized remote access. The likelihood of malicious abuse is significant, as SunLogin is often weaponized in attacks, especially in environments with weak access controls.

  ### Blind Spots and Assumptions

  Detection is limited by the need for comprehensive logging of outbound connections. Legitimate administrative activity using SunLogin can trigger false positives, requiring context for proper triage. Evasion techniques may include DNS spoofing or tunneling traffic over legitimate ports. A related detection, monitoring for unusual account logins combined with outbound connections could strengthen coverage and help identify compromised accounts.

