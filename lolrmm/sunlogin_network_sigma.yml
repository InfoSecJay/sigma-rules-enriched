note: |
  ### Technical Context

  This rule detects network connections to the SunLogin Remote Maintenance Management (RMM) tool, specifically targeting known domains such as `sunlogin.oray.com` and `client.oray.net`. The likely attacker objective is to establish remote access to compromised systems, which can facilitate further exploits or lateral movement within a network. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (ID: T1219). The primary telemetry source for this detection comes from Windows network connection logs, specifically tracking outbound connections to suspicious domains.

  If this activity is confirmed to be malicious, it could lead to unauthorized access, data breaches, or further compromise of host integrity. However, this detection alone does not confirm that the host has been compromised or that the activity is malicious, as legitimate business activities may also involve the use of SunLogin or similar remote desktop tools.

  ### Investigation Steps

  - **Identify outbound connections to suspicious domains:** Review Windows network connection logs (Event ID 5156, Windows Filtering Platform) for entries with DestinationHostname matching `sunlogin.oray.com` or `client.oray.net`. Look for high-frequency connections which are atypical for the user role.

  - **Examine process execution context:** Cross-reference the network connections with process creation logs (Event ID 4688/Sysmon Event ID 1) to determine which process initiated the connection. Legitimate usage might show known remote support software like TeamViewer; suspicious processes could involve uncommon executables.

  - **Check user context of the connection attempt:** Determine the user account initiating the outbound connection by reviewing UserID fields within the network logs. Uncommon accounts (e.g., service accounts) or non-administrative users performing this action should raise suspicion.

  - **Monitor for subsequent activity:** Following an alert, check for any files created or modified in the application data directories associated with SunLogin (e.g., `C:\Users\<username>\AppData\Roaming\SunLogin`). Creation or modification of unusual files should raise escalation concerns.

  - **Evaluate asset criticality:** Assess the role of the affected system within the organization. If it's a critical server or contains sensitive data, prioritize further investigation and response actions.

  ### Prioritization

  This alert has medium severity due to the possible implications of remote access tools being used maliciously. While the likelihood of exploitation through these tools is notable, the impact varies based on the asset affected. Given the nature of remote access solutions, this behavior is weaponized in targeted attacks but may occasionally be benign.

  ### Blind Spots and Assumptions

  This detection may have limitations related to illicit use of legitimate remote access tools that can bypass conventional monitoring if not properly tracked. There may be missing telemetry from network hardware or firewalls that log external connections, which is essential for comprehensive coverage. Additionally, legitimate remote support operations could trigger this alert, such as IT departments leveraging SunLogin for support. It is advisable to monitor logs for related activities such as potential lateral movement attempts (e.g., suspicious RDP connections) for stronger coverage against exploitation risks.

