note: |
  ### Technical Context

  This rule detects network connections that end with the domains associated with SunLogin, specifically `sunlogin.oray.com` and `client.oray.net`. The likely objective of an attacker using this tool could be remote access and control of compromised machines, which may facilitate further exploitation or data exfiltration. This detection aligns with the MITRE ATT&CK tactics of Execution (T1203) and Remote Services (T1219). The primary telemetry source is Windows network connection logs, where these specific destinations are noted.

  If malicious, the use of SunLogin could lead to unauthorized access to sensitive systems and data, thus posing a significant security threat. However, this detection does not confirm malicious intent on its own, as legitimate users may use SunLogin for remote management purposes.

  ### Investigation Steps

  - **Review network logs for connections to the specific domains**: Examine Windows Event ID 5156 (Filtering Platform Packet Drop) or related network logs for connections to `sunlogin.oray.com` or `client.oray.net` to confirm the interaction.

  - **Check for process association**: Utilize Sysinternals or other endpoint detection tools to inspect running processes around the time of the alert (e.g., look for `Sunlogin.exe` or related processes). Malicious indicators include unusual processes not directly related to legitimate business operations.

  - **Validate user context**: Look at the user accounts that initiated the connections by checking Windows Security Event ID 4624 (An account was successfully logged on) to determine if the connections were made by unexpected or high-privilege accounts.

  - **Correlate with Active Directory changes**: Investigate any recent account modifications or privilege escalations (Security Event ID 4728 - A member was added to a group) around the time of the detected connection to identify if credential abuse might be taking place.

  - **Identify legitimate use cases**: Check for known and approved deployments or configurations that involve SunLogin within specific business units. Document any legitimate users or systems that might utilize SunLogin for remote work.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact of unauthorized remote access on sensitive systems. The likelihood of malicious use of SunLogin is notable, especially since the tool can bypass traditional restrictions, and it has been weaponized in various attack scenarios in the past.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use other remote access tools or where network connection logs are not sufficiently detailed. Ensure logging is enabled for outbound connections on all endpoints for reliable detection. Legitimate administrative tasks could trigger this alert, especially in remote work environments. A related detection to consider includes logging for suspicious logon behaviors or known bad IP addresses associated with malicious remote access tools.

