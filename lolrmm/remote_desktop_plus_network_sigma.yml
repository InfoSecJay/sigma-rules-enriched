note: |
  ### Technical Context

  This Sigma rule detects network connections initiated to domains associated with the Remote Desktop Plus (RDP+) remote management tool. Attackers may use RDP+ for command-and-control (C2) purposes, potentially allowing unauthorized remote access to compromised systems. The relevant MITRE ATT&CK tactic is Command and Control (ID: TA0011), with the technique being Application Layer Protocol: Remote Desktop Protocol (ID: T1219). Primary telemetry sources include Windows network connection logs, specifically targeting fields showing destination hostnames (DestinationHostname). If the detected activity is malicious, it poses a significant risk of unauthorized system access and lateral movement within the network. This detection does NOT confirm that malicious activity is occurring on its own without corroborating evidence of access or payload execution.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 in the Security log for connections to domains ending with 'donkz.nl' during off-hours, particularly from critical assets (e.g., domain controllers, servers).

  - **Identify anomalous user accounts:** Investigate any user accounts associated with the detected connections and review their recent activities in the Security log (Event ID 4624 - logon events). Look for unusual login locations or times.

  - **Correlate with additional telemetry:** Cross-reference the identified domain names with web proxy logs or DNS query logs to identify DNS resolution attempts for 'donkz.nl' and check for unusual patterns or excessive requests.

  - **Assess legitimate use cases:** Confirm if Remote Desktop Plus is authorized for use in your environment. If legitimate, document its intended use, including scheduled maintenance windows and user accounts for operational acceptance.

  - **Look for high-confidence malicious indicators:** Identify if any associated processes (e.g., `rdp.exe` or related RDP+ binaries) are running on the machine(s), using Sysmon logs (Event ID 1 - process creation) for abnormal parent-child relationships indicative of exploitation.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized remote access to critical systems. The likelihood of malicious usage is moderate, especially if coupled with observed persistence techniques commonly leveraged in prior incidents involving RDP tools.

  ### Blind Spots and Assumptions

  This detection may miss malicious activity if the adversary uses a different C2 method or domain outside of 'donkz.nl.' Reliable detection relies on complete logging configurations for network connections, including DNS and web proxy logs. Legitimate administrative activities may trigger this alert if Remote Desktop Plus is used for maintenance or support. A companion detection could involve monitoring for abnormal process creations that accompany RDP activity, aiding in further validating suspicious behavior.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
