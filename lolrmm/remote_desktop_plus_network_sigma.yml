  ### Technical Context

  This rule detects outbound network connections initiated by Remote Desktop Plus to a specific domain (donkz.nl), which is commonly associated with remote management abuse. The likely attacker objective is unauthorized access to systems, with the intent to control or manipulate targets remotely, typically following an initial compromise. This behavior aligns with the MITRE ATT&CK technique for Remote Services Use (T1219).

  The primary telemetry source is Windows network connection logs, capturing relevant event types related to outbound connections. If malicious, this activity poses significant security risks, including data exfiltration, system manipulation, or lateral movement across the network. Importantly, this detection does NOT independently confirm malicious intent; legitimate use of Remote Desktop Plus for administrative purposes may generate similar alerts.

  ### Investigation Steps

  - **Review network connections:** Examine the network logs (Event ID 5156) on the affected endpoint for connections to IP addresses resolving to donkz.nl. Confirm if the connection attempt correlates with unauthorized access behavior.

  - **Validate legitimate usage:** Determine if Remote Desktop Plus has been authorized for use in your organization by checking asset inventories and service logs. Expected activity should show routine connections from known good user accounts to permitted destinations.

  - **Check user account activity:** Look for recent authentication events (Security Event ID 4624) from the same user account initiating a connection to confirm user legitimacy. High-risk indicators include logins from unusual geographic locations or anomalous times.

  - **Inspect associated processes:** Use Sysmon Event ID 1 to track process creation and identify if Remote Desktop Plus is spawned by unexpected or suspicious parent processes, which may indicate exploitation.

  - **Monitor for multiple connection attempts:** Evaluate the frequency of connection attempts to donkz.nl to detect any patterns suggesting rapid-fire outbound connections, which may indicate automated attacks or scanning operations.

  ### Prioritization

  This alert has a medium severity due to the potential impact of remote access tools on critical systems. While Remote Desktop Plus can be used legitimately, its usage for unauthorized purposes is prevalent among adversaries, increasing the likelihood of malicious exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Remote Desktop Plus, potentially leading to false positives. Accurate detections require logging configurations to capture all network connection events, specifically focusing on internal versus external traffic. Furthermore, legitimate instances of the tool may inadvertently trigger alerts, particularly during maintenance or support activities. A companion detection for additional context might include monitoring for suspicious login patterns (e.g., RDP session logs) or alerts for credential dumping activities.

