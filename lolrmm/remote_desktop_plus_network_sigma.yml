  ### Technical Context

  This Sigma rule detects potential network activity associated with the Remote Desktop Plus (RDP) remote management tool communicating with a suspicious server, specifically those ending with `donkz.nl`. The likely attacker objective includes establishing command-and-control (C2) channels to control compromised systems or exfiltrate data. This aligns with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry sources for this detection are Windows network connection logs, specifically highlighting outbound connections to potentially malicious domains. If confirmed malicious, this behavior suggests a significant breach with possible data exfiltration or unauthorized remote access. It is crucial to understand this detection does NOT confirm malicious intent or compromise on its own, as legitimate use of the Remote Desktop Plus tool may trigger similar alerts.

  ### Investigation Steps

  - **Check network connection logs:**
    Review Windows Event ID 5156 (Security) to identify outgoing connections to `*.donkz.nl`. Verify the process responsible for the connection.

  - **Correlate with process activity:**
    Locate associated process details in Sysmon Event ID 5 (Process Creation) to understand which application initiated the connection. Validate if the binary path leads back to a legitimate installation of Remote Desktop Plus or an unauthorized variant.

  - **Examine DNS queries:**
    Inspect DNS logs for any queries to `donkz.nl` using the DNS Server log (Event ID 4662). If queries coincide with unusual internal activities, this could indicate malicious intent.

  - **Determine expected behavior:**
    Legitimate use of Remote Desktop Plus would typically involve connections to known, trusted domains and IP ranges within your environment. Confirm if endpoint connections are consistent with documented IT policies.

  - **Identify known malicious indicators:**
    Investigate if any endpoints have previously been flagged or compromised with reported incidents related to unauthorized remote access tools listed in threat intelligence databases.

  - **Validate for potential exfiltration artifacts:**
    Check for abnormal outbound traffic volume within the affected host's bandwidth usage logs. This would suggest possible file exfiltration attempts or extensive data transfers.

  ### Prioritization

  Given the possible use of a remote access tool for malicious purposes, alerts generated by this rule should be treated with medium severity. The impact of compromised systems can be significant, especially if sensitive data is exfiltrated. This behavior is relevant in the current threat landscape where numerous tools are weaponized for remote access.

  ### Blind Spots and Assumptions

  This detection may not encompass all evasion techniques, such as the use of VPNs or encryption to obscure traffic. Reliable detection requires logging of outbound DNS queries and network connections, and misconfigured logs may lead to missing relevant activities. Legitimate administrative use of Remote Desktop Plus could also trigger alerts. A companion detection to strengthen coverage would involve monitoring for lateral movement activities, such as suspicious PowerShell commands (MITRE ATT&CK T1086).

