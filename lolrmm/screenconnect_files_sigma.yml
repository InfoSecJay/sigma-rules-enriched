note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the ScreenConnect remote management tool (RMM). The likely attacker objective is to leverage ScreenConnect for unauthorized remote access to a system, which can facilitate further reconnaissance or lateral movement within a network. Relevant MITRE ATT&CK tactics include Command and Control (T1071) and Remote Services (T1219). The primary telemetry sources are Windows file events that capture interactions with specific paths related to ScreenConnect installations and associated files.

  If malicious, this behavior could indicate a compromised system potentially allowing unauthorized access to sensitive data or resources. Notably, this detection does NOT confirm malicious intent on its own, as legitimate users may also legitimately install or utilize ScreenConnect.

  ### Investigation Steps

  - **Check for ScreenConnect installation:** Review installed applications using PowerShell (Get-WmiObject -Class Win32_Product) or via the Programs and Features control panel to confirm if ScreenConnect is an authorized tool in your environment.

  - **Analyze suspicious file creation:** Look for file creation events in conjunction with the detected paths (e.g., Event ID 4663 for access to 'C:\Program Files*\ScreenConnect\App_Data\Session.db') from Windows Security logs to establish context, noting typical timestamps for execution.

  - **Search for unusual download activities:** Validate if the executable files detected (e.g., 'ScreenConnect.ClientSetup*.exe' from the Downloads folder) were downloaded from approved sources or correlate to known incidents within the organization.

  - **Review access and modification logs:** Investigate if there are unusual access patterns or modifications to sensitive files like 'User.xml' and 'Session.db', focusing on timestamps and user accounts to identify potential misuse.

  - **Identify indicative user behavior:** Assess whether users logged into the machine employed ScreenConnect for legitimate support tasks, which could taper with expected user activity to provide context in assessing the threat.

  ### Prioritization

  This alert carries medium severity due to the potential security impact of the affected system, especially if it contains sensitive data. ScreenConnect can be weaponized for unauthorized access, making it relevant to monitor. Given that it may also be a legitimate support tool, further investigation is crucial to differentiate between benign and malicious use cases.

  ### Blind Spots and Assumptions

  Detected file activities may be evaded by the use of alternative remote management tools or by altering the default installation paths for ScreenConnect. Reliable detection requires complete logging configurations of Windows file events to capture comprehensive activity. Legitimate activities may include authorized remote support sessions, potentially leading to false positives. A complementary detection rule monitoring for suspicious outbound connections associated with ScreenConnect could provide a more holistic security posture.

