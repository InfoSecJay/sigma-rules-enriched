note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the ScreenConnect remote management tool, focusing on specific configuration and session files. The likely attacker objective is to maintain persistence or control over a compromised system, leveraging ScreenConnect for remote access to target machines. Relevant MITRE ATT&CK tactics include Command and Control (T1071.001: Application Layer Protocol), and the technique is categorized as “Exfiltration Over Command and Control Channel” (T1219).

  The primary telemetry sources for this detection are Windows file event logs indicating access to specific ScreenConnect files, such as `Session.db` and `User.xml`. If malicious, the security impact could include unauthorized remote access to sensitive systems and data exfiltration. This detection does NOT confirm malicious activity on its own, as it could also be triggered by legitimate use of ScreenConnect within the organization.

  ### Investigation Steps

  - **Check file access events:** Review Windows Security Event ID 4663 for access to `C:\Program Files*\ScreenConnect\App_Data\Session.db`. A high volume of access or unusual access patterns could signify malicious activity.

  - **Examine creation or modification times:** Look at the timestamp fields for the relevant ScreenConnect configuration files (e.g., `user.config`, `system.config`). Malicious activities often have anomalous timestamps indicating recent changes outside of regular business hours.

  - **Identify system roles:** Determine if the compromised host is a critical asset (such as a server or workstation). An alert on a critical system should be prioritized for immediate investigation.

  - **Verify legitimate usage patterns:** Correlate with IT documentation and internal inventory to confirm valid instances of ScreenConnect access. Authorized use will show regular access patterns and configurations as per the organizational policy.

  - **Analyze outbound connections:** Inspect firewall logs or network traffic for connections to known ScreenConnect IPs or domains during the time of file access. Legitimate users would show outbound connections to whitelisted management servers.

  - **Look for potential persistence indicators:** Investigate Windows Registry HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run for entries related to ScreenConnect. Entry presence without legitimate justification may indicate an attempt to maintain persistence.

  ### Prioritization

  The alert is categorized as medium severity due to the potential for significant impacts if remote access is established on critical systems. The likelihood of malicious abuse is moderate, considering adversaries often utilize remote management software for command-and-control operations. Although instances of legitimate use exist, the typical behaviors associated with this tool can also be weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as renaming files or running ScreenConnect from non-standard directories. Reliable detection requires comprehensive logging from file access events and real-time monitoring of critical systems where remote management is less expected. Legitimate activities, such as authorized IT support sessions, may trigger this alert. A related detection to strengthen coverage would be monitoring for unusual network connections from systems with ScreenConnect installed, enhancing detection of potential command and control activity.

