  ### Technical Context

  This Sigma rule detects file activity related to the ScreenConnect Remote Management (RMM) tool, particularly focusing on the manipulation of key configuration and session files such as `Session.db`, `User.xml`, and `user.config`. The likely attacker objective is to establish remote access or execute further commands on compromised systems using this remote management tool. The relevant MITRE ATT&CK tactics and techniques include **Execution (T1203)**, particularly related to remote management and administration.

  The primary telemetry sources for this detection are Windows file system events, specifically monitoring changes to the mentioned file paths. The potential security impact includes unauthorized remote access and control over endpoints if exploited maliciously. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate use of ScreenConnect by authorized personnel can trigger the same events.

  ---

  ### Investigation Steps

  - **Review file access events:** Check Windows Event Logs for File System Activity (Event ID 4663) related to `C:\Program Files*\ScreenConnect\App_Data\Session.db`, `User.xml`, or `user.config`, noting the user context under which these activities were executed.

  - **Identify user account legitimacy:** Correlate the above events with the user accounts accessing these files, particularly looking for atypical or administrative level accounts that should not be running ScreenConnect (Event ID 4624).

  - **Analyze session timestamps:** Investigate the timestamps of file access to determine if there is a pattern inconsistent with normal operational hours for administrative staff, which may indicate malicious activity.

  - **Verify legitimate usage patterns:** Cross-reference any activity with documented remote management tasks, such as scheduled maintenance using ScreenConnect by IT staff, to differentiate between acceptable use and potential abuse.

  - **Check for unauthorized file modifications:** Look for unexpected modifications or creations of `C:\ProgramData\ScreenConnect Client*\user.config` that could signify configuration changes aimed at enabling unauthorized access (monitor Event ID 4663 for changes).

  - **Validate host role:** Identify the host machine's role in the environment—if it is a critical server or workstation typically not managed via ScreenConnect, this would heighten the severity of the alert.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the sensitive nature of remote management tools. The risk escalates if such activities are detected on critical infrastructure where malicious remote access could have significant operational impacts. While ScreenConnect can be used legitimately, its common exploitation in attacks increases the alert's weight.

  ---

  ### Blind Spots and Assumptions

  Detection may face limitations from legitimate use of ScreenConnect, leading to false positives. Ensure file monitoring is enabled for the Windows file system events to capture all necessary activities. Legitimate actions may include authorized IT personnel performing maintenance tasks using the ScreenConnect tool. Consider related detections for abnormal Remote Desktop Protocol (RDP) sessions or unusual outbound network traffic that could complement the visibility of remote management tool usage.

