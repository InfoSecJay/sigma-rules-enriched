note: |
  ### Technical Context

  This Sigma rule detects file activity related to the ScreenConnect (now known as ConnectWise Control) remote management tool, specifically targeting files integral to its operations. The behavior indicates potential misuse of the RMM tool for unauthorized access or persistence by an attacker, potentially aiming to maintain control over compromised systems.

  The relevant MITRE ATT&CK tactics include Command and Control (T1071) and Application Layer Protocol (T1219). Primary telemetry sources involve Windows file event logs. The security impact is significant if the tool is used maliciously for remote access, data exfiltration, or other unauthorized actions. This detection does NOT confirm malicious intent alone and must be assessed alongside other contextual indicators.

  ### Investigation Steps

  - **Check the file access logs:** Review Windows Security Event ID 4663 for any operations involving "C:\Program Files*\ScreenConnect\App_Data\Session.db" and "User.xml" that are not standard operational patterns. Look for atypical access times or users.

  - **Identify abnormal user accounts:** Investigate if the accessing users are admins or unusual accounts. Legitimate activity usually involves service accounts associated with IT operations.

  - **Review associated network traffic:** Analyze network traffic logs for outbound connections to known command and control servers used by ScreenConnect. Use traffic analysis tools to check for suspicious IP addresses or domains connecting from affected hosts.

  - **Validate installation history:** Examine the system for the installation logs of ScreenConnect, found in “C:\Program Files*\ScreenConnect\logs”. Confirm that these logs correspond with legitimate maintenance or IT support activities rather than unexpected installations.

  - **Correlate alert with known TTPs:** Identify if the detected file activity coincides with other situational alerts, such as unusual PowerShell execution (Sysmon Event ID 4104) or suspicious process creations (Event ID 4688) linked to known attack patterns.

  ### Prioritization

  This alert is considered medium severity due to the potential impact on enterprise systems from unauthorized remote access, coupled with the fact that remote management tools like ScreenConnect are commonly exploited. The likelihood of malicious abuse is moderate, given the legitimate use of the tool but also its history in targeted attacks.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if logging for access to these files is misconfigured or if legitimate users frequently use ScreenConnect for standard operations. False positives could arise from IT teams using the tool for remote support. Ensuring comprehensive logging for File Event IDs will aid in identifying true positives. Related detections could include monitoring for unusual account activities or application connections indicative of unsanctioned behavior.

