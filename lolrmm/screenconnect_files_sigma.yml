  ### Technical Context

  This Sigma rule detects file activity associated with the ScreenConnect remote management tool, specifically monitoring for changes to critical configuration and session files. ScreenConnect can be exploited by attackers to gain unauthorized access to systems for remote control, data exfiltration, or deployment of additional malware. Relevant MITRE ATT&CK tactics include Execution (TA0002) and the technique Remote Services: RDP (T1219).

  The primary telemetry source is Windows file event logs that capture changes to specified files in the ScreenConnect installation directory. If the activity is malicious, it could lead to significant security incidents such as unauthorized remote access or data breaches. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate use of ScreenConnect may trigger the same alerts.

  ---

  ### Investigation Steps

  - **Check file modification times:** Review Event ID 4663 logs for modifications to `C:\Program Files*\ScreenConnect\App_Data\Session.db` and `User.xml`. Malicious activity may show recent changes outside of expected operational hours.

  - **Identify user account associated with activity:** Analyze the `SubjectUserName` field in Event ID 4663 logs. Unexpected accounts or service accounts modifying these files are high-confidence indicators of malicious behavior.

  - **Examine process metadata:** Investigate Sysmon Event ID 1 for processes associated with accessing or modifying these ScreenConnect files. Pay attention to unknown or suspicious processes that are not typically associated with legitimate remote management tasks.

  - **Validate legitimate usage:** Confirm whether ScreenConnect is actively used within your environment by consulting asset inventory and support ticketing systems. Frequent legitimate access should show consistent modifications aligned with business hours.

  - **Correlate with network activity:** Review network logs for unusual outbound connections from the ScreenConnect client, especially during non-standard hours. This may showcase exfiltration attempts or unauthorized remote sessions.

  - **Look for abnormal file create events:** Review Event ID 4663 for creation events of `user.config` in `C:\ProgramData\ScreenConnect Client*`. Legitimate installs should not show rapid file creation.

  ---

  ### Prioritization

  This alert holds medium severity due to the impact associated with the ScreenConnect tool on endpoint security. The likelihood of malicious abuse is moderate, as attackers commonly weaponize legitimate remote management tools. However, the prevalence of legitimate use in support operations requires nuanced investigation.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the presence of legitimate ScreenConnect activity that may trigger similar alerts. Reliable detection requires proper logging configuration to capture detailed file events. Benign activities may include scheduled updates or user-initiated maintenance sessions. A related detection to strengthen coverage would be monitoring outbound connections from the ScreenConnect installation for unusual activity or unsanctioned IP addresses.

