note: |
  ### Technical Context

  This rule detects file activity related to the HopToDesk Remote Monitoring and Management (RMM) tool, specifically focusing on key executable and configuration files associated with its operational framework. The primary objective of an attacker using HopToDesk would be to gain remote access to compromised systems, facilitating further malicious actions such as data theft or system manipulation. This behavior relates to the MITRE ATT&CK technique: Remote Access Software (T1219).

  The primary telemetry sources are Windows file event logs that capture the creation, modification, or access of files. Relevant log types include native Windows Event IDs or Sysmon logs providing detailed file events. If associated with malicious intent, the security impact is high, as it could indicate unauthorized remote access. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate users may also utilize HopToDesk for remote support.

  ### Investigation Steps

  - **Review file creation events:** Examine Windows Security Event ID 4663 for any creation or modification of the files listed as indicators (e.g., HopToDesk.exe, privacyhelper.exe). Verify if the activity aligns with known legitimate use cases of HopToDesk within your environment.

  - **Cross-reference user accounts:** Investigate the user accounts associated with the detected file activity. Evaluate whether they are known to use HopToDesk legitimately or if they are unfamiliar or suspicious.

  - **Analyze file artifacts:** Check for temporary file creations such as those located in "C:\Users\*\AppData\Local\Temp\". Look for timestamps and patterns that indicate unusual behavior (e.g., creations by non-admin users).

  - **Assess log file access:** Validate any access to the HopToDesk log file at "/Library/Logs/HopToDesk/hoptodesk_rCURRENT.log". Malicious access would likely involve unusual timeframes or be after unauthorized file modification.

  - **Monitor for related processes:** Review the process creation logs (Event ID 4688 or Sysmon Event ID 1) to identify instances where HopToDesk was executed. Analyze the command line arguments for anomalies consistent with unauthorized remote access activity.

  ### Prioritization

  The alert severity is medium due to the potential for unauthorized remote access on critical systems. The likelihood of malicious abuse is moderate, especially in environments where remote management solutions are not tightly controlled or monitored. This behavior is of particular concern as RMM tools like HopToDesk are often weaponized in lateral movement scenarios by adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate use of HopToDesk, which might trigger this alert without malicious intent. Continuous monitoring of the necessary telemetry from Windows file event logs is required for reliable detection. Legitimate IT support teams may frequently utilize RMM tools, making it essential to establish clear baselines for acceptable activity. Companion detections include monitoring for unusual authentication attempts or logins related to the HopToDesk tool, enhancing coverage against remote access abuse.

