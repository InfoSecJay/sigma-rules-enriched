note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the HopToDesk remote management tool, specifically targeting the executable and configuration files known to be part of its operation. The likely attacker objective is to utilize HopToDesk as a means of remote access and control over a compromised system, potentially to exfiltrate data or execute further attacks. This behavior aligns with the MITRE ATT&CK tactic "Execution" (TA0002) and the technique "Remote Services" (T1219).

  Primary telemetry sources include Windows file system events, specifically focusing on events related to file access and modifications for the identified file paths. If utilized for malicious purposes, the impact can be significant as it may provide an adversary with persistent remote access to affected systems. This detection does NOT confirm that a compromise has occurred; legitimate use of HopToDesk for remote support can trigger this rule.

  ### Investigation Steps

  - **Review file event logs:** Check for Windows File System Event IDs 4663 (file access) or 5145 (file share access) related to the detected HopToDesk files. Look for access patterns indicative of unauthorized remote access versus legitimate support sessions.

  - **Investigate process invocations:** Analyze Process Creation events (Security Event ID 4688 or Sysmon Event ID 1) for process execution of HopToDesk.exe or its related files. Check for unusual parent processes or execution context that might indicate malicious usage.

  - **Identify legitimate usage patterns:** Determine whether the files related to HopToDesk are being accessed by known administrators or support personnel during peak support hours. Cross-reference the timestamps with typical support activity within your organization.

  - **Check for abnormal file locations:** Look for suspicious file creation or modifications in atypical directories, especially unusual instances of 'C:\Users\*\AppData\Local\Temp\' or non-user specific paths. This could indicate potentially malicious activity attempting to obfuscate usage.

  - **Correlate with user account activity:** Investigate user account activity linked to file access, including user roles and permissions associated with access attempts. Identify if access is consistent with legitimate users' roles or indicative of account misuse.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of the HopToDesk tool being misused for unauthorized remote access. The likelihood of malicious abuse is elevated as remote access tools are commonly weaponized by adversaries after a successful compromise. However, legitimate use by IT support staff can cause false positives, necessitating thorough investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if the HopToDesk tool is not installed via standard software deployment channels, as it may not leave the expected artifacts. False positives can also arise from legitimate administrative activities utilizing HopToDesk for remote support. Essential log sources include both file system events and process creation logs. A related detection for comprehensive coverage may include alerts for unusual network connections to external IPs typically associated with remote access tool communication.

