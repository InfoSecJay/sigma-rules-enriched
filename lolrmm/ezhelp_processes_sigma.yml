note: |
  ### Technical Context
  This detection rule identifies potential activity associated with the ezHelp Remote Monitoring and Management (RMM) tool on Windows systems. The presence of specific processes like `ezhelpclientmanager.exe`, `ezHelpManager.exe`, and `ezhelpclient.exe` suggests that an attacker might be using this legitimate tool for malicious activities, such as unauthorized remote access, system monitoring, or data exfiltration. Given that RMM tools are often co-opted by attackers due to their capability to provide deep access to endpoint systems, detecting their utilization is crucial for security operations.

  The primary MITRE ATT&CK tactics relevant to this alert include **Execution (TA0002)** and **Remote Services (T1219)**, as the use of RMM tools often involves executing commands and actions remotely on compromised systems. The likely objectives of an attacker leveraging an RMM tool would include establishing persistence, conducting reconnaissance, or executing lateral movement within the network.

  The best sources of telemetry to confirm the detection include **process creation logs** from the Windows operating system, which can provide insights into the launch of these specific processes. Additionally, event logs that record application installations or modifications could be useful in contextualizing the alert.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation events in the SIEM for instances of `ezhelpclientmanager.exe`, `ezHelpManager.exe`, or `ezhelpclient.exe`. Look for unusual parent-child relationships that deviate from typical usage patterns.

  - **Analyze Remote Access Patterns:** Investigate any anomalous connections to or from remote systems associated with these RMM processes. Utilize network logs to identify any unexpected outbound traffic or remote sessions initiated.

  - **Correlate with User Activity:** Assess user account activity correlated with the triggering processes. Look for irregularities such as atypical logon times, multiple sessions, or escalated privileges that could indicate an account compromise.

  - **Examine Historical Context:** Determine if the detected processes were previously authorized in the environment. Check for valid reasons for their use during the time of detection, and confirm with the systems administration team if the alerts correlate with legitimate activities.

  ### Prioritization
  This alert has a medium severity rating due to the legitimate usage of the ezHelp tool which may result in false positives. However, its potential use in unauthorized remote access activities raises concerns that warrant timely investigation to mitigate risks associated with system compromise.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if other instances of the ezHelp tool are used that do not involve the specified process names. Additionally, the detection logic assumes that the presence of these processes is abnormal if not verified by user activity; therefore, legitimate instances may be missed without proper context. Continuous logging of process creation and access to managing these applications must be ensured for the alert to function correctly.

