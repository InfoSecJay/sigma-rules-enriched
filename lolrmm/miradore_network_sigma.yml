note: |
  ### Technical Context

  This Sigma rule detects network connections to specific domains associated with the Miradore Remote Management (RMM) tool. This behavior may indicate that an attacker is using Miradore RMM for remote control or command and control (C2) activities, often as part of a lateral movement strategy within a compromised environment. The relevant MITRE ATT&CK tactic is "Command and Control" (ID: TA0011) and the technique is "Application Layer Protocol" (ID: T1219).

  The primary telemetry sources include Windows network connection logs, specifically monitoring for connections to domains ending with `*.miradore.com` and `*.gerwconline.blob.core.windows.net`. Should these connections be malicious, they could facilitate unauthorized access, data exfiltration, or additional reconnaissance by the adversary. This detection does NOT confirm that a malicious action is occurring solely based on a connection; it must be evaluated within context.

  ### Investigation Steps

  - **Check for active sessions to Miradore domains:** Review network connection logs for Event ID 5156 (Windows Filtering Platform connections), specifically filtering for DestinationHostname containing `miradore.com` or `gerwconline.blob.core.windows.net`. Look for multiple connections in a short timeframe, which may indicate automated or scripted access.

  - **Review legitimate usage patterns:** Identify whether any recognized operational personnel have established valid connections to Miradore domains. This may include checking user accounts and timestamps against service logs. Normal usage patterns generally include scheduled maintenance or management tasks, not frequent or anomalous access.

  - **Identify high-confidence malicious indicators:** Search for any connections flagged within the logs that bypass established filtering mechanisms or originate from non-standard endpoints (unmanaged devices). In particular, focus on unexpected systems attempting to connect to Miradore’s infrastructure during unusual times or from unusual locations.

  - **Validate file creation or exfiltration artifacts:** Analyze file system logs (e.g., Windows Event ID 4663) for processes related to Miradore executable (e.g., `MiradoreAgent.exe`). Look for write operations to sensitive directories that coincide with network connections to Miradore.

  - **Examine related endpoints:** Assess whether multiple devices exhibit similar behavior connected to the same Miradore domains. A coordinated attempt often implies a greater breach, as opposed to isolated incidents which may indicate legitimate use.

  - **Correlate with other telemetry sources:** Cross-reference with endpoint detection solutions to identify behaviors consistent with remote administration or suspicious lateral movement patterns, such as the use of PowerShell or other scripting methods.

  ### Prioritization

  The alert is of medium severity given that while the systems may have legitimate use of the Miradore tool for remote management, its misuse could lead to significant security incidents such as unauthorized access or data theft. The likelihood of malicious abuse is moderate, primarily if network indicators indicate unusual patterns or behavior typically associated with exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the possibility of adversaries using common tools that mimic legitimate traffic patterns to evade detection. Reliable detection requires comprehensive logging from both network and endpoint perspectives. Legitimate IT administrative activities may generate similar alerts, so context is vital. Related detections include monitoring for anomalous logins to administrative utilities, which could provide additional context for assessing risk.

