note: |
  ### Technical Context

  This rule detects outbound network activity associated with the Miradore Remote Management (RMM) tool. The likely attacker objective may involve unauthorized remote management of systems, data retrieval, or exploitation via this remote access solution. This detection is associated with the MITRE ATT&CK tactic "Execution" (TA0002) and technique "Remote Services" (T1219). The primary telemetry source is Windows network connection logs, specifically monitoring DNS, TCP connections, or outbound HTTP/S traffic.

  If malicious, this could potentially lead to unauthorized access to systems, data manipulation, or data exfiltration. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate instances of the Miradore RMM tool can trigger this rule.

  ### Investigation Steps

  - **Identify source of the connection:** Review Windows Firewall or network connection logs to determine the originating process. Check for Event ID 5156 indicating allowed connection or Event ID 4688 (Process Creation) for the process initiating the connection.

  - **Analyze process legitimacy:** Check whether the connecting process corresponds with an authorized and known instance of Miradore RMM. Look in Sysmon Event ID 1 output for process command lines that match legitimate Miradore installations.

  - **Assess connection pattern:** Examine the frequency of connections to `*.miradore.com` over a specific time frame. Legitimate usage typically occurs during scheduled maintenance or management windows, not during off-hours unless specified by organizational policy.

  - **Review data transfer indications:** Look for file creation or transfer artifacts associated with the Miradore tool using logs from Windows Event ID 4663 (Access to an object) or Windows PowerShell logs to check for file manipulation that could suggest data exfiltration.

  - **Cross-reference user actions:** Investigate the user account associated with the network connection. Cross-check against recent user activity logs to determine if there were any actions that preceded the outbound connection, indicating potential misuse or compromise.

  ### Prioritization

  This alert is classified as medium severity. The impact may be significant if the RMM tool is compromised endangering the integrity of systems. While Miradore can be used legitimately, its presence in unexpected contexts or without prior approval can reflect malicious abuse.

  ### Blind Spots and Assumptions

  Potential evasion techniques include adversaries using legitimate Miradore operations to conduct malicious activities without detection. The rule relies on the availability of Windows network connection logs, which must be configured to capture outbound communications effectively. Legitimate activity could include authorized employee usage of Miradore for system maintenance. Companion detections that strengthen coverage include monitoring for Windows PowerShell command execution (T1059.001) which may relate to malicious actions on the same systems.

