note: |
  ### Technical Context

  This detection identifies network connections to domains associated with the Miradore RMM tool, a remote monitoring and management application. An attacker may exploit this tool's legitimate functionality to establish command and control (C2) or remote access to compromised systems, which is often a preliminary action following initial access. The relevant MITRE ATT&CK tactic is Command and Control (TA0011) with technique T1219 (Remote Access Software).

  The primary telemetry source is Windows network connection logs, specifically monitoring connections to DNS-resolvable hostnames related to Miradore. If malicious in nature, this behavior could indicate unauthorized remote access to systems under surveillance. However, this detection does NOT confirm malicious intent on its own, as Miradore may be deployed legitimately within the organization for remote management purposes.

  ### Investigation Steps

  - **Confirm the traffic source and destination:**
    Check network connection logs (Event ID 5156) for outbound connections to `gateway.miradore.com`, `*.miradore.com`, or `gerwconline.blob.core.windows.net` with the destination port typically used by Miradore (default TCP port 443).

  - **Examine process details:**
    If a connection to a Miradore domain is observed, obtain process creation logs (Security Event ID 4688 or Sysmon Event ID 1) to identify the initiating process and its command-line arguments. Look for known Miradore executables or PowerShell commands related to remote management.

  - **Identify legitimate usage:**
    Review internal documentation or team communications to verify if Miradore RMM is authorized for use within your environment. If confirmed, ensure the connecting client (host) is listed in approved assets.

  - **Cross-reference with user activity:**
    Inspect Windows Security Event logs (Event ID 4624) to correlate user logon events with the timing of network connections to these domains. Determine if the user was logged into the host when these connections occurred, which could contribute to benign interpretation.

  - **Assess for suspicious behavior:**
    Look for signs of lateral movement or privilege escalation from the process that initiated the Miradore connection, particularly connections to sensitive systems or databases that should remain inaccessible.

  ### Prioritization

  This alert has medium severity due to the potential for legitimate use, but can also indicate an active compromise capable of enabling further malicious activities. The likelihood of abuse hinges on how frequently attackers leverage remote access tools for C2, making this behavior moderately common in observed threat patterns.

  ### Blind Spots and Assumptions

  Detection may overlook situations where logged connections use obfuscation mechanisms or alternate domains not covered by the rule. It requires appropriate configurations of Windows Event Forwarding or Sysmon for comprehensive coverage of necessary artifacts. Legitimate business operations involving third-party management solutions or maintenance activities might trigger the alert. A related detection could involve monitoring system logons combined with known indicators of compromise (IOCs) for Miradore to provide additional validation of suspicious behavior.

