note: |
  ### Technical Context

  This rule detects file activity associated with the RMMCRAT remote management and monitoring (RMM) tool, particularly focusing on specific filenames and paths that are indicative of its presence on a Windows system. The likely attacker objective is to maintain remote access and control over compromised systems by leveraging the RMMCRAT tool, which is often used in post-exploitation phases for command-and-control (C2) operations. This behavior falls under the MITRE ATT&CK tactic “Command and Control” (TA0011) with the technique being “Application Layer Protocol” (T1219).

  The primary telemetry sources include Windows file event logs that detail file creation, modification, and access events. Key log types are from the Windows Security Event logs and the Windows File System, specifically tracking changes to files with the paths indicative of RMMCRAT. The security impact of malicious activity detected here can range from unauthorized data access to complete system compromise. This detection does NOT confirm malicious intent on its own, as legitimate use cases for RMM tools exist in IT management.

  ### Investigation Steps

  - **Review file event logs for specific paths**: Check Windows file event logs (Event ID 4663) for creations or modifications made to `*\\AppData\\Roaming\\rmm.exe`, `C:\\ProgramData\\RMMAgent\\client_id.bin`, and `C:\\ProgramData\\RMMAgent\\credentials.dat`. Pay attention to the user context that made these modifications.

  - **Correlate with application usage**: Cross-reference the creation or modification of these files with recorded user activity or legitimate RMM tool usage incidents. Validate if team members with known legitimate access were using remote management tools during the timeframe of these events.

  - **Identify suspicious process creation**: Investigate Security Event ID 4688 for process creation linked to `rmm.exe` and other files related to RMMCRAT. Look for unusual parent processes or execution times outside of regular business hours.

  - **Monitor network traffic**: Use network monitoring to inspect outbound connections from the affected system to known C2 domains or IP addresses associated with RMMCRAT. Look for unusual external communications, particularly if they occur after the file activity was detected.

  - **Check for unauthorized modifications**: Look for signs of manipulation in `C:\\ProgramData\\RMMAgent\\credentials.dat` which might indicate credential theft or unauthorized access. Document recent accesses and check indicators such as sudden changes or unexpected file size modifications.

  - **Ascertain host role and criticality**: Identify the role of the affected system (e.g., server, end-user workstation) and its criticality within the organization's infrastructure. Evaluate potential impacts on security and operations if this system were compromised.

  ### Prioritization

  The alert should be considered medium severity due to the potential for compromise in environments where RMM tools are typically trusted for IT management. The likelihood of malicious abuse is moderate, particularly if RMMCRAT is present on systems that should not have such tools installed. This behavior is often weaponized as attackers seek covert access and control over infrastructure.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate usage patterns that mirror those of RMMCRAT, resulting in false positives. To reliably detect this behavior, ensure comprehensive logging of file events is enabled across all endpoints, specifically focusing on the detailed tracking of file modifications. Legitimate IT management activities may also trigger this alert, necessitating a contextual understanding of the environment. A companion detection related to unauthorized access attempts on relevant files may strengthen coverage and provide additional context for ongoing investigations.

