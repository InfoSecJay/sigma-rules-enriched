note: |
  ### Technical Context

  This Sigma rule detects potential network activity related to the Rodex RMM tool, which is used for remote management and administration of systems. The likely attacker objective is to exploit the RMM capabilities for unauthorized access, lateral movement, or data exfiltration. The detection aligns with the MITRE ATT&CK technique for Remote Management Tools (T1219). The primary telemetry sources include Windows network connection logs, specifically focusing on connections made to known Rodex domains or associated IP addresses. If malicious, this activity can facilitate a compromise or manipulation of systems within the enterprise. This detection does NOT confirm that the activity is malicious on its own, as legitimate RMM usage may also trigger the alert.

  ### Investigation Steps

  - **Check network connections to suspicious hosts:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to 'rodex.cc', 'www.rodex.cc', or other confirmed Rodex-related IPs. Identify establishing processes and users. Look for high-frequency connections indicating potential command and control (C2) activity.

  - **Verify the legitimacy of RMM usage:** Confirm with the IT or system administration team if Rodex RMM is authorized for use in your environment. Document any legitimate operational activities, including scheduled maintenance or software updates that utilize RMM tools.

  - **Monitor process creation events:** Check for associated process creation logs via Sysmon Event ID 1. Identify new or modified processes spawned from unusual parent processes, especially if they correspond to connections detected in previous steps.

  - **Analyze user activity:** Review Windows Security Event ID 4624 (Logon) for account logins from user accounts that are connecting to RMM services. Pay attention to the time of day and account behavior patterns—unusual logins may indicate a compromised account.

  - **Correlate with threat intelligence:** Utilize threat intelligence sources to verify if the detected IPs or domains have been associated with known malicious activities. Update detection rules as necessary based on emerging threats.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems using Rodex RMM for administrative purposes. Given that RMM tools can be exploited for malicious purposes, the likelihood of abuse is significant. Furthermore, the behavior detected is weaponized in the context of remote command and control activities.

  ### Blind Spots and Assumptions

  Detection may be limited by network visibility and whether Windows Filtering Platform logs are enabled and properly configured. Legitimate administrative use of Rodex RMM may generate false positives. A related detection to strengthen coverage is monitoring for unusual credentials or logins accompanying the RMM tool usage, as this could indicate credential theft or misuse.

