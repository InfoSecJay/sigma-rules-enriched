note: |
  ### Technical Context

  This Sigma rule detects outbound network activity targeting the Rodex RMM domain, which is often associated with remote management tools used by adversaries for command and control (C2). Attackers leveraging this tool typically aim to gain unauthorized access to systems for lateral movement, data exfiltration, or persistent access. The relevant MITRE ATT&CK tactic is "Command and Control" with the technique ID T1219.

  The primary telemetry source for this detection is Windows network connection logs, specifically monitoring for connections to hostnames related to Rodex RMM. If this activity is confirmed malicious, it poses a significant threat as it could facilitate unauthorized remote access. Importantly, this detection does NOT confirm that malicious activity is occurring on its own, as benign use of the Rodex RMM tool exists.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows network connection logs (Event ID 5156) for outbound connections to `*.rodex.cc` domains. Validate that these connections are not part of legitimate business operations.

  - **Catalog associated processes:** Identify the process initiating the connection by correlating with the Security Event ID 4688. Legitimate applications may include known RMM tools, while suspicious processes could indicate malicious activity.

  - **Investigate user activity:** Cross-reference user access logs to verify whether the user initiating the connection has permission to use remote management tools. Legitimate users typically belong to IT operations roles.

  - **Examine for abnormal patterns:** Look for repeated or unusual connection attempts to the Rodex domains within a short time frame. This could indicate a malicious attempt to establish persistence.

  - **Confirm traffic directionality:** Ensure that the outbound connections originated from non-administrative workstations or servers, as legitimate usage of Rodex RMM may be confined to specific administrative hosts.

  - **Identify malicious indicators:** Look for previous alerts or reports associated with the identified IP addresses or domains. Use threat intelligence feeds to determine if the connected IPs have been reported for malicious activity.

  ### Prioritization

  Alerts generated by this detection are of medium severity due to the potential impact on critical systems and user data. The likelihood of malicious abuse is moderate, as Rodex RMM has been observed in malicious use cases, but legitimate operations may trigger similar alerts.

  ### Blind Spots and Assumptions

  Detection may be evaded by using alternative or encrypted communication channels that obscure the connection. Reliable detection requires comprehensive logging of network connections, including the resolution of hostnames and timestamps. Legitimate activities may include authorized remote support sessions by IT staff. A related detection rule that enhances coverage could involve monitoring for known malicious IPs that are associated with Rodex RMM.

