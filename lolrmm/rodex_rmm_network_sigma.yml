note: |
  ### Technical Context

  This rule detects outbound network connections to hosts associated with the Rodex Remote Management and Monitoring (RMM) tool, which is frequently used by threat actors to establish command and control (C2) communications with compromised systems. The likely attacker objective is to maintain persistence and control over infected devices for data exfiltration or further attacks. This behavior fits within the MITRE ATT&CK framework under the tactic of Command and Control (TA0011) and technique for Application Layer Protocol (T1071).

  The primary telemetry sources include Windows network connection logs, specifically those capturing outbound connections to the domain patterns 'rodex.cc' and similar operator-controlled IPs. If malicious, this activity could lead to data breaches, unauthorized access, and further attacks on the network. Importantly, this detection does NOT confirm actual compromise or malicious activity on its own, as legitimate users may also utilize Rodex RMM for remote administration.

  ### Investigation Steps

  - **Check outbound connection logs**: Review Windows Event ID 5156 (Windows Filtering Platform) for new outbound network connections to 'rodex.cc' or similar domains within the last 24 hours.

  - **Analyze asset role**: Identify the host initiating the connection. If the asset is a known administrator or RMM tool user, note this context as potentially legitimate activity.

  - **Inspect event frequency**: Note the frequency of connections to the suspicious host. Continuous connections within a short time frame are more indicative of compromise than sporadic use.

  - **Review process information**: Check for associated process details using Sysmon Event ID 3. Legitimate usage would typically show known remote management applications, while unknown executables could indicate malicious use.

  - **Cross-reference IP addresses**: Use a threat intelligence platform to validate the reputation of the destination IPs. Connections to widely known malicious IPs would be a high-confidence indicator of malicious intent.

  - **Verify user actions**: Interview users who have access to the affected system to determine if the connection was authorized. Legitimacy may often correlate with specific scheduled tasks or known maintenance windows.

  ### Prioritization

  The alert is set to medium severity due to the potential impact of infected systems that could serve as gateways for further attacks. While remote management tools can have legitimate uses, the possibility of malicious exploitation in the current threat landscape underscores the importance of prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of specific logging configurations or if the communication uses encrypted traffic, which could hinder visibility. Legitimate remote administrative tasks could trigger this alert, complicating triage efforts. Additionally, monitoring for connections to related known C2 infrastructure could strengthen detection capabilities and context during investigations.

