  ### Technical Context

  This Sigma rule detects the execution of processes associated with the DeskDay Remote Monitoring and Management (RMM) tool. Such tools are often employed by attackers to manipulate and control systems remotely, indicating potential malicious intent such as unauthorized access or lateral movement within a network. Relevant MITRE ATT&CK technique for this detection includes "Remote System Discovery" (T1219), categorized under the "Execution" tactic.

  The primary telemetry source is Windows process creation logs, specifically targeting the Event ID 4688 and Sysmon Event ID 1 for process creation events with a parent image prefix of "ultimate_". If this behavior is confirmed malicious, it could allow an attacker to execute arbitrary commands or gain persistent access. This detection alone does not confirm malicious activity without further context, as legitimate DeskDay usage could trigger the same alert.

  ### Investigation Steps

  - **Check process details: ** Review the process creation logs (Event ID 4688) for the detected processes, focusing on the fields 'Image' and 'ParentImage' to identify if the full command line or any unusual arguments are present. Legitimate DeskDay usage may contain common parameters relevant to expected business functions.

  - **Assess parent process relevance: ** Analyze the parent process (fields: 'ParentImage') to determine if it is a known legitimate application (e.g., other RMM tools) or part of suspicious activity, as this context is crucial to evaluate potential malicious intents.

  - **Look for related anomalies: ** Cross-highlight process execution times with user account logins (Event ID 4624) to establish if legitimate users or service accounts initiated the processes. Use the 'Logon Type' in Event ID 4624 to differentiate between interactive and service logins.

  - **Validate persistence indicators: ** Search for file artifacts associated with DeskDay in common installation paths (e.g., C:\Program Files\DeskDay) or checks for registry entries (often under HKLM or HKCU\Software\) that indicate persistence mechanisms such as auto-start functionality.

  - **Review network activity: ** Examine network logs for unusual outbound connections associated with detected processes. Check for IPs or domains related to DeskDay operations that may signify C2 communications or data exfiltration.

  - **Search for other RMM tools: ** Conduct a review of the environment for other known RMM tools (e.g., TeamViewer, AnyDesk) and their process signatures to identify potential co-existence that may indicate benign operations under similar usage patterns.

  ### Prioritization

  The alert generated is of medium severity since it indicates potential RMM tool execution, which can be abused by malicious actors. Although the DeskDay tool can serve legitimate purposes, its misuse for unauthorized access poses a significant risk, especially in sensitive environments. Monitoring should focus on the context of the execution due to the potential for abuse.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques that involve renaming executable files or using alternative methods to obscure RMM tool usage. Reliable detection requires proper configuration of logging mechanisms for Windows process creation, specifically enabling detailed process tracking. Legitimate administrative activities could trigger this alert when using DeskDay for remote support. A related detection to strengthen coverage is monitoring for new service installations or changes (Event ID 7045) related to RMM tools, which could indicate newly established persistence mechanisms.

