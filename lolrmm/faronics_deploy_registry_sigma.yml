note: |
  ### Technical Context

  This Sigma rule detects registry activity related to the Faronics Deploy Remote Monitoring and Management (RMM) tool, specifically targeting keys that are commonly associated with its installation and operational components. The likely objective of an attacker could be to leverage an administrative or monitoring tool for unauthorized access or management of systems, enabling data exfiltration or lateral movement. This behavior falls under the MITRE ATT&CK tactic of Execution (T1203) and the technique of Remote System Management Tools (T1219).

  The primary telemetry sources for this detection include Windows registry event logs capturing changes to specific registry keys associated with the Faronics product. If malicious, this activity could indicate unauthorized use of a legitimate administration tool, potentially compromising the integrity of affected systems. Importantly, this detection does NOT confirm malicious activity by itself, as legitimate operations of Faronics Deploy can trigger the same registry changes.

  ### Investigation Steps

  - **Review registry event logs**: Check for Event IDs related to registry changes (Event ID 4657) specifically targeting paths such as 'HKLM\SOFTWARE\Faronics' or 'HKLM\SOFTWARE\Classes\AppID\FWAService.exe'. Look for anomalies in user accounts making these changes.

  - **Identify user accounts involved**: Cross-reference the modifying user accounts with known administrative roles. Legitimate use of Faronics Deploy should typically involve service accounts or specific admin users. Any unexpected accounts making changes warrant further investigation.

  - **Verify installation history**: Check the uninstall registry key for Faronics (e.g., 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{581F69E6-A5D1-48C7-9F6F-CC333007F7EB}'). Confirm if Faronics Deploy is installed and assess when the installation occurred and by which user.

  - **Look for associated processes**: Monitor for related processes in execution (e.g. FWAService.exe) using Sysmon Event ID 1. Any anomalies, such as unexpected execution or abnormal parent-child process relationships, could indicate nefarious use.

  - **Validate network activity**: Examine network logs for unusual outbound traffic involving Faronics components. Look for connections to unexpected IP addresses or any data exfiltration attempts that coincide with the registry changes.

  - **Collect context from security incidents**: Review any recent security incidents or alerts triggered around the same timeframe as the detection. Correlate findings with known incidents and assess for potential patterns of compromise.

  ### Prioritization

  The alert severity is medium due to the potential for abuse of a legitimate tool that has significant management access. While the activity could stem from legitimate administrative actions, it is critical to prioritize investigation given that Faronics Deploy is a common target for adversaries looking to exploit remote monitoring capabilities.

  ### Blind Spots and Assumptions

  Detection limitations may arise from users legitimately utilizing Faronics Deploy, which could trigger false positives. Reliance on specific registry event logging is necessary for this detection, and without those logs, meaningful insights may be lost. Additionally, standard administrative activities might cause similar alerts, making context and correlation crucial. A related detection could include monitoring for suspicious process creation (Sysmon Event ID 1) involving known remote management executables to strengthen monitoring coverage.

