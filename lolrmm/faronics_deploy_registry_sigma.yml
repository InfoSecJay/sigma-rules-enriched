note: |
  ### Technical Context

  This Sigma rule detects registry activity related to the Faronics Deploy RMM tool, specifically monitoring entries that pertain to its installation and configuration in the Windows registry. The likely attacker objective may involve establishing persistence or stealthy command and control by manipulating or leveraging legitimate administrative tools like Faronics Deploy. This aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique T1219 (Package Content Modification).

  The primary telemetry sources are Windows registry event logs that capture changes to specific key paths associated with Faronics. If malicious, such activity could allow an attacker to maintain access or control over the system. It is crucial to note that this detection does NOT confirm malicious intent on its own, as these registry keys may be modified legitimately by the Faronics Deploy tool during normal operations.

  ### Investigation Steps

  - **Verify registry key modifications:** Check for Event ID 4657 (Registry Value Modified) in the Windows Security logs to identify changes to 'HKLM\SOFTWARE\Faronics'. Look for abnormally timed changes or unusual user accounts making these alterations.

  - **Identify the user context:** Validate the account associated with the registry modification. If the modifying user is not recognized as an administrator or known Faronics user, this may indicate a malicious activity.

  - **Check for Faronics Deployment:** Look for processes linked to Faronics, specifically the presence of FWAService.exe (Event ID 4688). Successful identifiers may include the creation of installation logs or unusual execution times.

  - **Distinguish legitimate behavior:** Cross-reference logged changes with known patterns of legitimate Faronics Deploy usage. Regular updates or configurations should align with expected deployment cycles rather than isolated or irregular timing.

  - **Analyze related log artifacts:** Review application logs (such as Faronics logs located under ProgramData) for entries around similar timestamps as the registry changes. Legitimate activity typically involves documented changes and updates, indicating regular maintenance.

  - **Look for additional indicators of compromise:** Investigate any outbound network connections made by devices running Faronics, which may suggest command and control activity. Audit network traffic for unusual patterns associated with these devices.

  ### Prioritization

  This alert is considered medium severity due to the potential risk of privileged access manipulation if an attacker exploits the Faronics Deploy tool. The likelihood of malicious abuse exists, especially since the tool is already used in enterprise environments, making it a target for adversaries aiming to exploit trusted systems.

  ### Blind Spots and Assumptions

  Detection may be limited by proper logging configurations; if registry auditing is disabled, these events may not be captured. Legitimate system admins may trigger the alert when performing routine maintenance on Faronics Deployment. To strengthen coverage, complementary detections around anomalous network traffic or unauthorized process executions involving Faronics should be implemented, particularly focusing on aspects of lateral movement or persistence mechanisms.

