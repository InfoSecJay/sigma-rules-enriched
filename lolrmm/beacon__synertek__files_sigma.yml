  ### Technical Context

  This Sigma rule detects file activity related to the Beacon Remote Management Tool (Synertek), specifically targeting the execution of the agent executable and the access of configuration and log files. The likely objective of an attacker using this tool would be to maintain persistent access or control over compromised systems while exfiltrating data. This detection aligns with the MITRE ATT&CK tactic of Command and Control (T1219), indicating potential malicious operations managed through remote tooling.

  The primary telemetry sources include Windows file system events and specifically logs indicating access to file paths tied to the Beacon tool, such as the executable and its associated configuration files. If the activity is malicious, it can facilitate unauthorized remote management and information leakage. It is crucial to note that the detection of these file activities does not inherently confirm malicious use; legitimate instances of Beacon may occur under authorized operations.

  ### Investigation Steps

  - **Review event logs for access to Beacon files:** Check for Security Event ID 4663 entries that show access to 'C:\Program Files\Beacon\beacon-agent.exe', 'C:\ProgramData\Beacon\credential.json', or 'C:\ProgramData\Beacon\agent.log'. Note any legitimate business processes that involve this file access.

  - **Identify the user context of the file access:** Investigate the user associated with the file access events. If a non-administrative user accessed these files outside of expected operational parameters, mark this as a potential indicator of compromise.

  - **Analyze recent process creation events:** Utilize Sysmon Event ID 1 to identify if 'beacon-agent.exe' executed recently, including parent-child relationship analysis. Often, malicious activity will show unusual parents like 'cmd.exe' or 'powershell.exe'.

  - **Check for outbound connection logs:** Query network logs for any unauthorized outbound connections from the host with the Beacon files, particularly to known malicious IPs or uncommon ports. Look for destination IP addresses and DNS queries associated with command and control servers.

  - **Validate file integrity:** Use file integrity monitoring to confirm if 'credential.json' or 'agent.log' files have been modified unexpectedly. Signs of tampering or unusual timestamps could indicate malicious use.

  ### Prioritization

  This alert has a medium severity due to the potential risk associated with unauthorized file access in command and control contexts. The affected systems' importance will influence the response, particularly if they host sensitive data or critical infrastructure. The use of tools like Beacon is increasingly common in cyberattacks, raising the likelihood of malicious exploitation.

  ### Blind Spots and Assumptions

  Detection is limited by scenarios where Beacon is being used legitimately, which could lead to false positives. Effective monitoring requires file and access logging configurations to ensure visibility into sensitive file activities. Legitimate administrative tasks may involve accessing these files, particularly in managed service environments. A related detection to consider involves network connections linked to remote management tools, which enhances overall threat coverage.

