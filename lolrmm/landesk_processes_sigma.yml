note: |
  ### Technical Context

  This rule detects potentially unauthorized or malicious activity originating from the LANDesk RMM (Remote Monitoring and Management) tool on Windows systems. Adversaries may leverage RMM tools like LANDesk to maintain access, execute commands remotely, or deploy malware on target systems without detection. This behavior is relevant to the MITRE ATT&CK technique for Remote Administration Tools (T1219).

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Event ID 4688. If malicious, the security impact can include unauthorized access, data exfiltration, or system compromise. It’s important to note that this detection alone does not confirm malicious intent, as legitimate use of LANDesk tools can also trigger this rule.

  ### Investigation Steps

  - **Review process creation logs: ** Pull Windows Security Event ID 4688 and filter by the specific process names detected (e.g., issuser.exe, landeskagentbootstrap.exe). Look for unexpected instances of these processes being initiated from unusual parent processes that are not typically associated with LANDesk operations.

  - **Analyze parent-child process relationships: ** Check for parent process IDs (PPIDs) in logs that lead to the suspicious child processes. A typical benign hierarchy might include a System or Administrator-level process, whereas suspicious activity may show anomalies in user context or unexpected process trees.

  - **Verify process execution paths: ** Examine file paths for the detected processes; legitimate LANDesk installation paths will often be under C:\Program Files\LANDesk\. If the file path deviates significantly, it may indicate post-exploitation behavior.

  - **Identify user context for executions: ** Assess the user accounts that executed the processes. Legitimate use of LANDesk typically relates to administrative accounts within IT departments. An unknown user or a standard user account executing LANDesk processes should trigger further scrutiny.

  - **Check for launch frequency: ** Investigate the frequency and timing of the launch events for these processes. Legitimate LANDesk operations are typically routine and predictable; anomalies, such as processes being triggered outside of working hours, may signify malicious activity.

  ### Prioritization

  This alert has medium severity due to the potential impact of compromised systems associated with LANDesk administrative controls. The likelihood of abuse is moderate, particularly in environments where RMM software is commonly used, increasing the risk of weaponization by adversaries exploiting legitimate tools.

  ### Blind Spots and Assumptions

  The primary detection limitation includes the possibility of legitimate LANDesk operations triggering the alert, which can lead to false positives. Accurate detection relies on comprehensive logging configurations for Windows processes, specifically ensuring that process creation logs are enabled. Additionally, legitimate administrative actions or scheduled tasks could trigger this alert. To enhance coverage, consider companion detections for related remote administration tools that could also exhibit similar process behaviors.

