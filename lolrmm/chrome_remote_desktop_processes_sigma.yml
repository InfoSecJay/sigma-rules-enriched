note: |
  ### Technical Context

  This Sigma rule detects the creation of processes associated with Chrome Remote Desktop, specifically those initiated by known parent processes like `remote_host.exe` or `remoting_host.exe`. The likely objective of an attacker utilizing this tool is to establish remote access for control or data exfiltration, which aligns with the MITRE ATT&CK technique Remote Services (T1219).

  Primary telemetry sources include Windows process creation logs—specifically Security Event ID 4688 or Sysmon Event ID 1. The security impact of detecting this behavior could be significant, as it may indicate unauthorized remote access that could facilitate a range of malicious activities from system manipulation to data theft. However, this detection does NOT confirm that the activities are malicious on their own, as Chrome Remote Desktop is also used for legitimate remote assistance.

  ### Investigation Steps

  - **Verify process creation details:** Review Security Event ID 4688 or Sysmon Event ID 1 for details on process creation, focusing on fields such as `NewProcessName`, `ParentProcessName`, and `CommandLine`. Observe entries with paths ending in `remote_host.exe` or `remoting_host.exe`.

  - **Assess parent process legitimacy:** Identify the parent process of the detected instances. If it matches legitimate remote access programs running on administrative hosts (e.g., remote management servers), consider this normal behavior.

  - **Correlation with remote access history:** Check for previous log entries within a timeframe surrounding the alert. Look for prior usage logs or legitimate remote access confirmed by users.

  - **Investigate unusual logon methods:** Use Security Event ID 4624 to review logon events associated with the same user account creating the remote process. Unusual accounts or anomalous logon times may indicate malicious control.

  - **Check for competing activity on assets:** Validate that no other users simultaneously used remote access applications. An unexpected overlap could suggest unauthorized access.

  - **Review file changes or network traffic:** Monitor for unusual file modifications or outbound connections from the host associated with `remote_host.exe`. Look for unusual file types or unexpected HTTP/HTTPS traffic, which may indicate data exfiltration.

  ### Prioritization

  This alert holds medium severity due to the potential impact of unauthorized remote access. The likelihood of malicious abuse is moderate, given that tools like Chrome Remote Desktop are commonly weaponized for remote control in compromise scenarios. The behavior may be legitimate, but proactive investigation is warranted if detected.

  ### Blind Spots and Assumptions

  This detection may be limited if the logging of process creations is not consistently enabled across all endpoints. Attackers may evade detection by employing alternative remote access technologies not covered by this rule. Legitimate activities, such as user-initiated remote support, can also trigger this alert. A companion detection to strengthen coverage might include logs from network traffic monitoring tools that track non-standard outbound connections initiated by remote access tools.

