note: |
  ### Technical Context
  This detection rule focuses on identifying suspicious process activity associated with Chrome Remote Desktop, an RMM (Remote Monitoring and Management) tool often utilized for remote access to systems. Attackers may leverage this tool to gain unauthorized access to a target's network, conduct reconnaissance, or execute malicious activities under the guise of legitimate remote assistance. The overarching goal of such activities typically aligns with establishing persistence, exfiltrating sensitive data, or facilitating lateral movement within an organization.

  The rule aligns closely with the MITRE ATT&CK framework, particularly within the **Execution** tactic. Specifically, it relates to **T1219: Remote Access Software**, which encompasses the usage of common remote access tools that may be exploited by malicious actors. The primary data source expected to provide relevant telemetry for this detection consists of **process creation logs**, which document the start of executable processes on Windows systems and can reveal suspicious patterns indicative of RMM tool usage.

  ### Investigation Steps
  - **Review Process Creation Logs**: Utilize EDR or SIEM tools to analyze process creation logs for instances of `remote_host.exe` or `remoting_host.exe`, particularly focusing on their parent processes to establish context around their execution.

  - **Correlate Parent-Child Process Relationships**: Investigate the lineage of any detected instances of the specified executables. Pay special attention to the parent process (`remote_host.exe` or `remoting_host.exe`) to determine if legitimate remote access was employed or if an attacker initiated the process.

  - **Assess User Activity and Access Logs**: Examine user activity logs to validate whether the legitimate personnel used Chrome Remote Desktop, cross-referencing with scheduled remote support sessions or authorized remoting activities.

  - **Conduct Network Traffic Analysis**: Monitor for anomalous outbound network connections typically associated with remote access tools. Evaluate any communication patterns with known IP addresses or domains associated with remote management tools.

  ### Prioritization
  The alert is considered of medium severity due to the potential impact of unauthorized remote access, which could lead to data breaches, system compromise, or further malicious actions. The likelihood of abuse is moderate since remote access tools can be legitimately used, making context critical for accurate assessment.

  ### Blind Spots and Assumptions
  One gap in detection coverage arises from false positives associated with the legitimate use of Chrome Remote Desktop within many organizations. The detection logic assumes that processes always originate from known parent processes but does not account for other methods of execution or obfuscation techniques that attackers may employ. Additionally, for this alert to function optimally, comprehensive logging of process creation events must be enabled across all relevant systems.

