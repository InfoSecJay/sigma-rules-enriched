note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the GatherPlace desktop sharing tool, which is often used for remote management and support. Attackers may utilize this tool to establish control over compromised systems, enabling them to exfiltrate data or deploy further malicious activities. The relevant MITRE ATT&CK tactics and techniques include "Execution" (T1219), which refers to the execution of a remote management tool within the environment.

  Primary telemetry sources for detection are Windows network connection logs, specifically monitoring hostname resolution to domains associated with GatherPlace (e.g., `*.gatherplace.com`). If used maliciously, this activity could facilitate unauthorized remote access and system manipulation, posing significant security risks. However, it is important to note that this detection does NOT confirm malicious intent on its own, as the GatherPlace tool may be used legitimately within the organization.

  ### Investigation Steps

  - **Check network connection logs:** Review Windows Event ID 5156 for outbound connections where `DestinationHostname` matches any of the GatherPlace domains (`*.gatherplace.com`, `*.gatherplace.net`). Investigate connections made outside standard operating hours or from unusual IP addresses.

  - **Analyze user accounts involved:** Identify the user accounts responsible for initiating the connection by reviewing Event ID 4624 (Logon) logs. Look for a match between the user account and known roles that typically engage with remote management tools.

  - **Validate legitimate usage:** Confirm if the GatherPlace tool is authorized and used within the organization. Review any internal documentation or communication regarding maintenance or support operations utilizing GatherPlace.

  - **Examine process execution:** On hosts where network activity is detected, check System Event ID 4688 for process creation logs related to GatherPlace. Assess if there are suspicious command-line arguments or unexpected parent processes.

  - **Gather additional context through endpoint protection tools:** Utilize EDR tools to collect telemetry on file creation activities associated with GatherPlace on affected hosts. Look for unusual file modifications or remotely executed scripts that could signify malicious actions.

  - **Cross-check against known IOCs:** Reference threat intelligence feeds for any reported malicious use of GatherPlace or related tools. If any indicators of compromise match the observed connection, escalate the investigation.

  ### Prioritization

  The medium severity of this alert reflects that the affected systems may have critical roles and that GatherPlace is sometimes weaponized for lateral movement. The likelihood of abuse is moderate as legitimate use cases exist, making contextual investigation crucial.

  ### Blind Spots and Assumptions

  This detection may be evaded by adversaries using different remote access tools or masking their traffic. Successful detection relies on the configuration of Windows network connection logs and ensuring comprehensive monitoring of outbound connections. Legitimate activities could include remote support sessions that match the detected behavior. Companion detections could include monitoring for unusual administrative access patterns or process executions that align with RMM tools.

