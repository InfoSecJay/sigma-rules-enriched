note: |
  ### Technical Context

  This rule detects network connections to domains associated with the GatherPlace-desktop sharing remote management tool (RMM). Attackers may use such tools to control compromised systems, transferring data or executing commands, thereby achieving remote access and persistence. This detection aligns with the MITRE ATT&CK tactic of Command and Control (T1071 - Application Layer Protocol) and technique T1219 (Remote Access Software).

  The primary source of telemetry is Windows network connection logs, specifically monitoring for outbound connections to the specified GatherPlace domains. If malicious, this behavior can indicate unauthorized remote access and potential data exfiltration or lateral movement. It is essential to note that this detection does NOT confirm that malicious activity is occurring without additional context, as administrative use of this tool can be legitimate.

  ### Investigation Steps

  - **Review active connections:** Check for network connections matching the domains `*.gatherplace.com` or `*.gatherplace.net` in Windows logs. Look for Event ID 5156 (Windows Filtering Platform) that details allowed network connections.

  - **Correlate with known users:** Identify the user context associated with the connection attempting to utilize the GatherPlace RMM tool. Use Event IDs 4624 (Logon) and 4648 (Logon attempt) to determine if the user has administrative privileges or any anomalies in user behavior.

  - **Assess legitimate use:** Document instances of legitimate use of GatherPlace-desktop sharing within your organization. Engage with the team or individual responsible for its deployment to verify expected configurations.

  - **Identify high-confidence indicators:** Look for unusual process activity related to GatherPlace (e.g., gatherplace.exe) using Sysmon Event ID 1. If this process is identified without corresponding legitimate usage, escalate for further investigation.

  - **Check for data exfiltration:** Verify if any files were accessed or transferred in conjunction with GatherPlace by reviewing Windows Event ID 4663 (File Access), especially to external domains or cloud storage. Ensure the presence of file creation or transfer artifacts.

  ### Prioritization

  The alert is medium severity due to the potential impact on sensitive systems and data. While GatherPlace is widely used for remote management, its usage could also indicate malicious intent, especially in a post-compromise scenario. This behavior can be weaponized by attackers for remote access and lateral movement within the network.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of GatherPlace, which could trigger false positives. Ensure the necessary network monitoring logs are enabled to capture all outbound connections to the specified domains. Additionally, routine administrative tasks may lead to these alerts, necessitating clear documentation of expected use cases. Companion detections, such as those identifying unusual logon patterns or process injection behaviors, would strengthen overall security visibility in conjunction with this rule.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
