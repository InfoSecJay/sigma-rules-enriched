  ---

  ### Technical Context

  This rule detects network activity associated with the GatherPlace desktop sharing tool, commonly used as a remote management and control (RMM) application. Attackers may utilize GatherPlace to gain unauthorized access to systems for lateral movement, data exfiltration, or maintaining persistence in a compromised environment. The relevant MITRE ATT&CK tactic is "Execution" and the technique is "Remote Services" (T1219).

  Primary telemetry comes from Windows network connection logs, specifically monitoring outbound connections to domains associated with GatherPlace (e.g., `*.gatherplace.com`). If malicious, this behavior can significantly compromise system integrity and data confidentiality. However, it is crucial to note that this detection does not confirm malicious intent on its own, as GatherPlace may be used legitimately by authorized personnel.

  ---

  ### Investigation Steps

  - **Check network connections:** Review Windows Event ID 5156 (Windows Filtering Platform) and 5158. Look specifically for connections to `*.gatherplace.com` or `*.gatherplace.net`. Confirm whether there is unusual traffic outside of expected use cases.

  - **Evaluate user activity:** Inspect user account logs in conjunction with process creation events (Event ID 4688). Identify if the user associated with the GatherPlace activity typically uses desktop sharing RMM tools or has legitimate business needs for this application.

  - **Identify confirmed malicious workflows:** Look for outbound connections initiating from known vulnerable applications or processes commonly exploited by adversaries. Flag any connections where the source process is suspicious (e.g., newly installed software without prior approvals).

  - **Validate legitimate use cases:** Confirm with the IT or support teams if the use of GatherPlace was authorized. Check asset inventories for any known deployment of GatherPlace in the environment.

  - **Assess packet captures (if available):** If packet capture data exists, analyze the traffic to discern whether encryption protocols (e.g., SSL/TLS) are being used, indicating potentially sensitive activity, or misconfigurations aiding unauthorized access.

  ---

  ### Prioritization

  This alert is of medium severity, as it typically indicates potential malicious activity related to remote desktop sharing tools that can lead to data compromise or widespread system access. Given that RMM tools can be weaponized, any detection should be investigated promptly, especially in sensitive environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by lack of visibility into encrypted traffic, where legitimate usage of GatherPlace could mask malicious intent. Ensure that Windows Filtering Platform logs are configured and enabled for comprehensive traffic monitoring. Benign activities may include legitimate support sessions. A related detection to consider is monitoring for anomalous user account behavior (e.g., Event ID 4624 for logon attempts) associated with these connections for enhanced context.

