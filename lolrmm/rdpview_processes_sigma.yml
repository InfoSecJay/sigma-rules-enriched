  ### Technical Context

  This Sigma rule detects process activity related to the RDPView remote monitoring and management (RMM) tool, specifically instances where the process `dwrcs.exe` is created. The likely attacker objective of using RDPView is to establish remote access and control over compromised systems, which aligns with the MITRE ATT&CK technique for Remote Services (T1219). Primary telemetry sources include Windows Event logs capturing process creation (Event ID 4688) and potentially Sysmon logs (Event ID 1). The security impact is significant, as unauthorized RMM tool usage can lead to data breaches, system manipulation, and lateral movement across networks. It is important to note that this detection does NOT confirm malicious intent on its own, as RDPView may be used legitimately in organizational environments.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 and/or Sysmon Event ID 1 for the creation of `dwrcs.exe`. Document the user account and system involved in the creation event.

  - **Examine parent processes:** Investigate the parent process of `dwrcs.exe` to confirm it originated from the expected legitimate process or an anomalous one. A legitimate parent would typically be a known RDP management tool, while an unexpected parent may indicate suspicious activity.

  - **Correlate with user activity:** Analyze user activity logs for a correlation with the process creation. Review for recent use of the legitimate RDP management workflows or administrative actions around the same timeframe.

  - **Assess asset criticality:** Determine the role of the affected host within the network. Critical assets (e.g., domain controllers, application servers) with this activity should be prioritized for immediate investigation.

  - **Identify malicious indicators:** Look for known indicators of compromise related to `dwrcs.exe`, such as unusual command line arguments or connections to external IP addresses not associated with normal business operations.

  - **Validate legitimate use:** Confirm if `dwrcs.exe` is being used in compliance with company policies. If legitimate use is determined, document the intended purpose and authorized user to reduce false positives.

  ---

  ### Prioritization

  This alert should be considered medium severity as it may involve remote control capabilities that could be exploited by attackers. Given the sensitivity of typical environments utilizing RMM tools, the likelihood of malicious abuse is moderate, and such tools are commonly weaponized for further attack stages, making swift investigation important.

  ---

  ### Blind Spots and Assumptions

  The detection may miss evasion techniques where the attacker renames or modifies `dwrcs.exe` or the use of alternative RMM tools. Accurate detection relies on comprehensive logging configurations for process creation events and Sysmon data. Legitimate activities may include authorized IT support using RDP tools. A companion detection could include monitoring for abnormal network connections to remote hosts initiated by systems running `dwrcs.exe`, further enhancing threat detection capabilities.

