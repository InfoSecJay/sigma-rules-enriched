note: |
  ### Technical Context

  This rule detects the use of the RDPView remote management tool, which can signify unauthorized remote access or control. Attackers may use RDPView to maintain persistence, manage compromised systems, or exfiltrate data, particularly if they have already breached a system. This behavior is relevant to the MITRE ATT&CK tactic of Execution (TA0002) under the technique of Remote Services (T1219).

  The primary telemetry source is Windows process creation logs, specifically monitoring for the execution of processes with a parent image of `dwrcs.exe`, typical of RDPView activity. If malicious, this activity can allow an adversary continuous oversight and control over a system. This detection does not confirm malicious intent by itself; legitimate instances of RDPView may exist, especially in environments where this tool is sanctioned for team usage.

  ### Investigation Steps

  - **Identify the executing process:** Check for processes matching `dwrcs.exe` in Windows Security Event ID 4688 logs. Look for abnormal command line arguments that deviate from normal behavior (e.g., unexpected parameters or obfuscation) as a high-confidence malicious indicator.

  - **Verify parent child relationships:** Correlate processes in Security Event ID 4688 to determine the parent process. Ensure `dwrcs.exe` is not being spawned by a legitimate system service or administrative tool.

  - **Review execution time patterns:** Analyze logs for execution times of `dwrcs.exe`. Unexpected execution outside of operational hours (e.g., after hours or on weekends for an organization) could indicate malicious usage.

  - **Audit legitimate usage scenarios:** Determine if RDPView is a known tool within your organization's IT management framework. Review standard operating procedures and ensure that any incidents of `dwrcs.exe` execution align with business operations.

  - **Check for any active remote sessions:** Investigate if there are active remote sessions originating from non-approved systems. Look for `Remote Desktop` sessions related to `rdpclip.exe` in systems where RDPView usage would not typically occur.

  ### Prioritization

  The alert is of medium severity due to the potential use of RDPView for unauthorized access. The impact could be significant if critical systems are accessed. While the behavior can be weaponized by threat actors, it may also result from legitimate administrative activity, necessitating careful analysis.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging is not configured to capture all relevant process creation events. Additionally, users might legitimately utilize RDPView for acceptable maintenance, which can trigger false positives. The lack of coverage for lateral movement by RDPView means other detection rules, such as those identifying unusual remote access patterns (e.g., RDP or network connections), could strengthen overall detection capabilities.

