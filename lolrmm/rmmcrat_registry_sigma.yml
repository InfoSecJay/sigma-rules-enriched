note: |
  ### Technical Context

  This rule detects registry activity related to the RMMCRAT (Remote Management Malware C2) tool, specifically modifications targeting the `HKLM\SYSTEM\CurrentControlSet\Services\RMMAgent` registry key. The likely attacker objective is to establish or maintain command-and-control capabilities on compromised systems, facilitating remote access or management. Relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071.001) and Application Layer Protocol (T1219).

  Primary telemetry sources include Windows Registry Event logs, specifically focusing on event types that log modifications to the registry key noted in the detection condition. If malicious, the security impact is significant, as attackers could exploit this access for data exfiltration, lateral movement, or further attacks. However, this detection does not confirm active exploitation or the presence of other malware components on its own.

  ### Investigation Steps

  - **Verify registry modification occurrence**: Check Windows Registry Event logs (Event ID 4657) for changes to `HKLM\SYSTEM\CurrentControlSet\Services\RMMAgent` and note timestamps and user accounts making changes.

  - **Investigate user account context**: Determine if the user account modifying the registry key is a standard administrative account or an atypical user—malicious changes may originate from accounts not typically involved in system administration.

  - **Identify associated processes**: Look for process creation events (Security Event ID 4688, Sysmon Event ID 1) around the time of the registry modification to correlate potentially malicious processes starting or running concurrently.

  - **Check for benign usage**: Confirm whether the RMMCRAT tool has legitimate uses within your environment; review the asset criticality and consult with IT teams about any expected remote management operations or administrative activities.

  - **Look for additional indicators of compromise**: Search for evidence of outbound connections associated with the RMMCRAT tool using firewall or proxy logs for unusual IP addresses, domains, or importantly, connections over remote management protocols (e.g., RDP or SSH).

  ### Prioritization

  This alert has medium severity due to its ability to indicate potential command-and-control behavior from a specific malware tool, which could compromise important systems. The likelihood of malicious abuse is moderate to high, as RMMCRAT is known to be weaponized for unauthorized remote management. Timely investigation is crucial to prevent further exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate administrative activities could also trigger this alert. It is essential to ensure that Windows Registry log collection is properly configured to capture relevant modifications. Additionally, legitimate remote management tools may utilize similar registry keys without malicious intent, necessitating careful contextual evaluation of alerts. A related detection to strengthen coverage would be monitoring for outbound traffic on common RMM ports or known C2 protocols, such as HTTP/S over port 80/443.

