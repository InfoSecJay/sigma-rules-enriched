note: |
  ### Technical Context

  This Sigma rule detects registry activity related to the GxM RMM Agent, a remote management tool commonly used for administrative tasks and support. The likely attacker objective is to maintain persistence on a compromised host or execute remote management tasks without detection. This behavior aligns with the MITRE ATT&CK technique for Command and Control (T1219: Remote Access Tools). The primary telemetry source is Windows registry events, specifically focusing on modifications to the relevant registry keys. If detected as malicious, the security impact could include unauthorized remote access and control over affected systems. It is important to note that this detection only indicates potential GxM RMM Agency activity and does not confirm malicious intent on its own.

  ### Investigation Steps

  - **Check registry modifications:** Review Windows Security Event ID 4657 or Sysmon Event ID 13 for changes to 'HKLM\SYSTEM\CurrentControlSet\Services\GxMAgent'. Note any timestamping related to user logins or scheduled tasks.

  - **Correlate with user activity:** Cross-reference the time of the detected registry activity with user activity logs (e.g., Event ID 4624 for logons) to determine if the modifications coincide with known admin activities or unauthorized access.

  - **Identify benign usage:** Verify if the GxM RMM Agent is part of your organization's legitimate toolset. Check asset inventory records and service documentation to validate expected configurations on relevant endpoints.

  - **Look for process execution:** Check for related process creations (Event ID 4688 or Sysmon Event ID 1) indicating the GxM agent is actively being executed or its services started. Focus on parent process IDs and associated command lines that should be confirmed for legitimacy.

  - **Monitor network activity:** Investigate whether there are outbound connections related to the GxM RMM Agent (e.g., using Windows Firewall logs or network monitoring tools). Identify unusual connections to remote servers that do not match known management endpoints.

  ### Prioritization

  This alert has medium severity due to the potential exposure of critical systems via remote access utilities. The likelihood of malicious exploitation is moderate as it indicates the use of a tool that can facilitate unauthorized control over systems. The behavior is not commonly weaponized but can signal a prelude to targeted attacks or lateral movement.

  ### Blind Spots and Assumptions

  The detection may be evaded through the renaming or obfuscation of the GxM RMM Agent or through legitimate administrative usage that may trigger similar alerts. Required log sources include a comprehensive set of Windows security logs, specifically for registry events, and verification that Sysmon is deployed and configured. Legitimate administrative activities, particularly during maintenance windows, may trigger the alert. Complementary detections, such as monitoring for unusual scheduled tasks (e.g., using Event ID 4698), can enhance overall coverage and threat posture.

