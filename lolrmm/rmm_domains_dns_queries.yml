level: medium
note: |
  ### Technical Context

  This Sigma rule detects DNS queries made to known Remote Monitoring and Management (RMM) tool domains, which may indicate unauthorized remote access attempts by adversaries leveraging RMM tools for persistence or exfiltration. The attacker objective often includes gaining remote control over compromised systems to execute malicious activities such as data theft or lateral movement within the network.

  Relevant MITRE ATT&CK tactics and techniques include "Command and Control" (TA0011) and "Remote Services" (T1219). Primary telemetry sources include DNS logs from local DNS servers or firewalls, with a focus on event types such as DNS query logs (e.g., DNS Event ID 1 or equivalent). If malicious, the security impact can be significant, potentially leading to unauthorized access and data compromise.

  It is critical to understand that this detection alone does not confirm a breach; it only flags potentially suspicious behavior and requires further investigation to establish context and intent.

  ### Investigation Steps

  - **Review DNS queries for known RMM domains:**
    Query the DNS logs for Event ID 1 entries that include domain names from the list provided in the Sigma rule, checking for anomalous timestamps or unusual frequency of requests from specific IP addresses.

  - **Assess the source of the queries:**
