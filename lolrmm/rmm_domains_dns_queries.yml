- Legitimate usage of approved remote management tools
level: medium
note: |
  ### Technical Context

  The Sigma rule detects DNS queries to known Remote Monitoring and Management (RMM) tool domains, which are often associated with unauthorized remote access activities by attackers. An attacker might use these tools to gain persistent access and control over compromised systems for data theft or lateral movement within an organization’s network. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011) with the technique ID **Application Layer Protocol** (T1219).

  The primary telemetry sources include DNS query logs, specifically focusing on queries capturing domain names listed in the detection logic. If malicious, this activity could allow an adversary to manipulate systems or exfiltrate sensitive data undetected. Importantly, this detection does NOT confirm that malicious activity is happening without additional evidence, as legitimate usage of RMM tools can trigger the same alerts.

  ### Investigation Steps

  - **Review DNS queries for alerts**: Examine DNS logs (Event ID  DNS queries in forwarders or logs from DNS servers) for suspicious activity, filtering for log entries where the domain matches the listed RMM domains in the Sigma rule.

  - **Check for authorized use**: Confirm which remote management tools are authorized for use within your organization and correlate them with the DNS query results. Look for entries that include your-approved-rmm.com domain to filter out legitimate activity.

  - **Analyze host behavior**: Investigate the endpoints with matching DNS queries for unusual activity, such as unexpected or new processes, by checking Sysmon Event ID 1 (Process Creation) and correlating with the network activity to determine if any unauthorized RMM sessions are active.

  - **Identify high-confidence indicators**: Look for established connections or established remote sessions with flagged domains. Use network logs (e.g., netstat, Process Monitor) to see if any unauthorized outbound connections were initiated that might align with the same domains detected in the alert.

  - **Review asset criticality**: Prioritize investigation based on the criticality of the affected systems (e.g., servers vs. workstations) and their roles within the network, as breaches in critical assets could lead to severe impacts.

  - **Validate log integrity**: Cross-reference user activity logs (e.g., Windows Event ID 4624 for logon events) to check the timestamps around the detected queries, ensuring that the users correlated with the activity are legitimate, and inspect if the sessions align with typical user behavior.

  ### Prioritization

  The alert is considered medium severity due to the potential impact of unauthorized remote access and the likelihood that such behavior can be weaponized in active exploitation scenarios. The presence of queries to known RMM domains suggests a possible compromise that should be investigated promptly, particularly focusing on critical assets.

  ### Blind Spots and Assumptions

  Detection may have limitations due to potential evasion techniques, such as using custom DNS tunneling or approved RMM solutions not being listed in the current rule. To ensure reliable detection, maintaining an up-to-date list of legitimate RMM tools is essential. Additionally, legitimate administrative functions (e.g., IT support using RMM tools) may trigger this alert, necessitating context around normal usage patterns. A companion detection could include monitoring for unusual user behavior or unexpected increases in privilege escalation events (e.g., Event ID 4672) alongside DNS query analysis to strengthen overall coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
