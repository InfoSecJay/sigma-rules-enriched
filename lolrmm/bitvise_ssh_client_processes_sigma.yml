note: |
  ### Technical Context

  This rule detects the execution of the Bitvise SSH Client RMM tool, specifically processes originating from `BvSshClient-Inst.exe`. The behavior may indicate an attempt by an attacker to leverage remote management capabilities, potentially for unauthorized access or lateral movement within the environment. This activity aligns with the MITRE ATT&CK tactic of **Execution** and Technique **T1219: Remote Access Software**.

  Primary telemetry sources include process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could lead to system compromise, unauthorized data access, or persistence. It is important to note that the detection of the Bitvise SSH Client does NOT confirm malicious intent on its own, as this software may be used legitimately by system administrators.

  ### Investigation Steps

  - **Check process parentage:**
    Review Security Event ID 4688 logs for process creation events where the `ParentImage` ends with `BvSshClient-Inst.exe`. A legitimate execution would typically include administrative context or be followed by activity noted in remote sessions.

  - **Review command-line arguments:**
    Examine the `CommandLine` field in Sysmon Event ID 1 logs for any unusual or non-standard arguments passed to `BvSshClient-Inst.exe`. Malicious usage may include parameters indicating obfuscation or unusual ports.

  - **Identify expected behavior:**
    Compare with baseline activity logs to determine typical usage patterns for `BvSshClient-Inst.exe`. Legitimate instances are often linked with authorized operations, not driven by non-administrative users or atypical usage locations.

  - **Cross-reference user actions:**
    Investigate logs for user behavior using Event ID 4624 (Logon) to correlate user sessions with the execution time of the Bitvise tool. Incidents stemming from unknown or peripheral user accounts may indicate compromise.

  - **Check for unusual network activity:**
    Monitor network logs for outbound connections initiated by `BvSshClient-Inst.exe`. Analyze for connections to unrecognized external IP addresses or ports that deviate from standard operational patterns.

  - **Validate file creation and modifications:**
    Look for file creation or modification events associated with the installation directories of technology or tools related to `BvSshClient` within Windows Event ID 4663 logs. Unusual file activity may suggest malicious obfuscation or use of the tool for nefarious purposes.

  ### Prioritization

  This alert has medium severity due to the potential exploitation of remote access tools like Bitvise SSH Client. While the software can be used for legitimate administration, its potential for malicious abuse, especially in an environment where remote access may lead to data exfiltration or lateral movement, heightens the urgency of investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate presence of Bitvise SSH Client in the environment, resulting in potential false positives from authorized administrative actions. Required log sources such as Sysmon must be correctly configured to ensure comprehensive visibility. Additionally, legitimate IT support or remote work efforts could trigger this alert, necessitating contextual understanding before escalation. Related detections could include unusual VPN or RDP access patterns that may indicate broader exploitation efforts.

