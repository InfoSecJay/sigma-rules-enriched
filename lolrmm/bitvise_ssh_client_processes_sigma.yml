note: |
  ### Technical Context

  This rule detects instances of the Bitvise SSH Client RMM tool being executed on Windows systems, specifically monitoring for processes that directly initiate from the installation executable, `BvSshClient-Inst.exe`. The likely objective of an adversary utilizing this tool would be to establish remote command-and-control capabilities or perform unauthorized administrative tasks. This behavior aligns with the MITRE ATT&CK tactics of Command and Control (TA0011) and the technique Remote Services (T1219).

  Primary telemetry sources include Windows security logs, specifically those capturing process creation events, such as Security Event ID 4688 and Sysmon Event ID 1. If this activity is malicious, it could allow attackers to maintain persistent access to the targeted environment, control compromised systems, and exfiltrate sensitive data. It is crucial to note that an alert on this rule alone does not confirm malicious intent, as it may reflect legitimate business activities where the Bitvise SSH Client is used appropriately.

  ### Investigation Steps

  - **Identify process initiation events:** Review Security Event ID 4688 and Sysmon Event ID 1 to see the exact command line arguments used during the execution of `BvSshClient-Inst.exe`. Malicious use may include unusual `username` or `destination IP` parameters that deviate from standard operational patterns.

  - **Examine parent process relationships:** Investigate the parent process of `BvSshClient-Inst.exe` to understand context. If this process is initiated by a known administrative tool or standard application (e.g., `cmd.exe` or a user-initiated application), it may be benign.

  - **Log user activity:** Check user account access patterns related to the execution. If an unexpected user or service account initiated the process, it increases the likelihood of malicious activity. Reference account logon events (e.g., Security Event ID 4624).

  - **Correlate with network traffic:** Analyze related outbound traffic for unusual connections to high-risk IP addresses. Use firewall logs to identify traffic patterns associated with the SSH protocol on non-standard ports, which may suggest unauthorized remote access.

  - **Assess with threat intelligence:** Compare the IP addresses or hashes associated with `BvSshClient-Inst.exe` using threat intelligence repositories to identify known malicious actors or campaigns. High-confidence malicious indicators include hashes listed in threat intelligence databases.

  ### Prioritization

  This alert is considered medium severity due to the potential high impact of compromised systems in an enterprise environment. The use of remote management tools is often exploited in the wild, making it critical to differentiate between legitimate administrative use and malicious behavior.

  ### Blind Spots and Assumptions

  Detection may be limited if the logs for process creation are not enabled or configured correctly on endpoints. Legitimate administrative activities may trigger this alert when network administrators use Bitvise SSH for remote management, potentially complicating investigations. A companion alert based on outbound network connections to known compromised IPs can enhance detection capabilities and provide a clearer context for ongoing incidents.

