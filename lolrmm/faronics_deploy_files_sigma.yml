note: |
  ### Technical Context

  This rule detects file activity linked to the Faronics Deploy RMM tool, specifically actions involving its executable files and log files. The likely attacker objective may include using this legitimate administrative tool for remote management and control to facilitate unauthorized access or deployment of malware. This detection aligns with the MITRE ATT&CK framework under the tactic "Execution" and technique "Script Execution" (T1219).

  The primary telemetry sources required for this detection are Windows file event logs, particularly focusing on file creation, modification, or deletion events for specific Faronics Deploy paths. Should this activity be exploited maliciously, unauthorized access could lead to significant compromise of systems under management. Importantly, this detection does NOT confirm malicious intent by itself, as the legitimate use of Faronics Deploy could trigger similar alerts.

  ### Investigation Steps

  - **Verify file activity:** Check for Windows Security Event ID 4663, focusing on `ObjectName` fields corresponding to the Faronics file paths. Look for changes (e.g., creation, modification) that appear unexpected based on the asset's role.

  - **Determine context of execution:** Identify any prior processes related to the execution of FaronicsDeployAgent.exe or related files by reviewing Sysmon Event ID 1. Confirm if these processes originate from legitimate admin tasks or automation scripts.

  - **Review log file entries:** Examine the contents of CloudAgentLogs.LOG and FWASvc.log located in `C:\ProgramData\Faronics\...` for references to unusual activities or irregular entries that deviate from expected operational patterns, such as unauthorized access attempts.

  - **Assess asset role:** Determine the role and criticality of the impacted system by consulting asset inventories. This helps contextualize the use of Faronics Deploy; for example, legitimate usage may include device management in IT environments.

  - **Identify high-confidence malicious activities:** Search for concurrent connections to unusual IP addresses or any connections not typically seen during normal operations from the Faronics Deploy tool, as indicated by network logs or firewall events.

  ### Prioritization

  This alert should be considered of medium severity due to the potential impact on system integrity and data confidentiality where Faronics Deploy is involved. While the tool is legitimate, its misuse can lead to significant abuse, especially if an adversary exploits it for lateral movement or attack infrastructure deployment.

  ### Blind Spots and Assumptions

  The detection could be evaded if an attacker modifies the Faronics tool or files to bypass these specific paths or logs. Proper configuration of event logging, particularly for process and file modifications, is essential for reliable detection. Additionally, legitimate administrative activities, such as scheduled updates or maintenance by IT personnel, may trigger these alerts. Companion detections involving unusual remote connections or suspicious file transfers associated with this activity can further strengthen security coverage.

