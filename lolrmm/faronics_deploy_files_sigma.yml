note: |
  ### Technical Context

  This rule detects file-related activities associated with Faronics Deploy, a remote management tool. The likely attacker objective may include establishing a foothold or executing commands remotely on compromised systems. Relevant MITRE ATT&CK tactics and techniques include "Command and Control" (T1071) and "Remote System Discovery" (T1219). The primary telemetry sources are Windows file event logs, capturing file operations related to specified executables and log files within the Faronics Deploy directory. If malicious, this behavior could indicate unauthorized remote access or system manipulation. However, it is important to note that this detection does NOT confirm that the activity is indeed malicious without further contextual information.

  ### Investigation Steps

  - **Review file access events:** Examine Windows Security Event ID 4663 or Sysmon Event ID 10 for access to `C:\Program Files (x86)\Faronics\Faronics Deploy Agent\**` files, noting the user account involved and the type of access.

  - **Identify abnormal process execution:** Look for process creation events (Security Event ID 4688 or Sysmon Event ID 1) related to `FaronicsDeployAgent.exe`, `FWAService.exe`, or other monitored executables and confirm if they are invoked by suspicious users or from unusual parent processes.

  - **Check for unauthorized logs:** Review the contents of CloudAgentLogs.LOG and FWASvc.log for irregular patterns or entries that could indicate unwanted remote interactions. Legitimate usage typically shows routine log entries without anomalies.

  - **Validate user context:** Investigate if the executing user is authorized to utilize Faronics Deploy, especially if the user is non-administrative or does not match expected behaviors for that host.

  - **Assess simultaneous access:** Monitor Event ID 4624 (Logon) to evaluate any concurrent logins that could suggest lateral movement or credential misuse, especially from multiple sessions on the same endpoint.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical systems managed through Faronics Deploy. The likelihood of malicious abuse is moderate, as legitimate administrative activities can trigger this alert, but attack vectors often exploit remote management tools, making this behavior a common target for adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if Faronics Deploy is actively used by IT staff, leading to false positives. Additionally, if telemetry is not correctly configured to capture specific log paths, detection may fail. Legitimate administrative tasks could also trigger these events, complicating investigations. A companion detection might include monitoring for unusual network connections or traffic to known malicious IPs, which could indicate further compromise related to this tool.

