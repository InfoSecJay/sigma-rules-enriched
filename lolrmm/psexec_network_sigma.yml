note: |
  ### Technical Context

  This rule detects potential network activity involving the use of the PSEXEC tool connecting to hosts with a hostname ending in 'user_managed'. The detection is indicative of lateral movement or remote management activity of an attacker, likely aimed at executing commands or spreading malware within a network. Corresponding MITRE ATT&CK techniques include Command and Control (T1071) and Remote Services (T1219).

  Primary telemetry sources involve Windows Network Connection logs detailing outbound connections, particularly focusing on specific destination hostnames. If malicious, this behavior could lead to unauthorized control over networked machines or successful exploitation of vulnerabilities. Importantly, this detection does not confirm malicious activity on its own, as legitimate administrative tasks may trigger similar logs.

  ### Investigation Steps

  - **Check Network Connection Logs**: Review Windows Network Connection logs (Event ID 5156) for connections initiated to hosts ending in 'user_managed'. Look for unexplained outbound connections during non-administrative hours.

  - **Identify the Source Process**: Examine the process initiating the PSEXEC command. Use Sysmon Event ID 1 to identify process creation details, including command line arguments that indicate remote execution attempts. Legitimate PSEXEC usage will show administrative process origins with clear execution paths.

  - **Validate User Activity**: Confirm whether the user associated with the alert has legitimate administrative duties. Check for recent logins, remote sessions, or established playbooks that justify the PSEXEC usage.

  - **Monitor for Abnormal Command Usage**: Look for unusual command flags in Sysmon Event ID 1 to identify high-confidence malicious activity. For instance, the usage of commands that replicate or propagate across the network can signify exploit attempts.

  - **Analyze Anomalous Account Behavior**: Review user behavior associated with account activity during the timeframe of the alert. A sudden spike in account usage or abnormal privileges assigned can link back to potential exploitation or compromise.

  ### Prioritization

  The alert has medium severity due to the potential impact of unauthorized access to critical systems, facilitating data breaches or further exploitation. Given that PSEXEC is commonly weaponized in lateral movement scenarios by adversaries, the likelihood of malicious intent is non-negligible.

  ### Blind Spots and Assumptions

  This detection might miss evasion techniques, such as using alternative processes or obfuscation tactics to mask PSEXEC activity. Reliable detection relies on having comprehensive Windows Network Connection logs configured properly. Activities like scheduled tasks or legitimate administrative processes may trigger similar alerts and need to be corroborated. Related detections to this might include monitoring for abnormal account privilege escalation events (T1068).

