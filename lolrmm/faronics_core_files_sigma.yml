note: |
  ### Technical Context

  This Sigma rule detects file activity related to the Faronics Core Remote Monitoring and Management (RMM) tool on Windows systems. The behavior observed typically indicates that an adversary may leverage this tool for unauthorized remote access or management of compromised systems. This aligns with the MITRE ATT&CK technique of Remote Access Software (T1219), where attackers use legitimate software to maintain persistence and control over target environments.

  Primary telemetry sources include Windows file event logs capturing actions on specific executables related to Faronics Core RMM. The security impact could be significant, as this tool facilitates remote access that an adversary could exploit for malicious purposes. However, this detection alone does not confirm malicious intent; legitimate use by authorized personnel can generate similar alerts.

  ### Investigation Steps

  - **Review triggered file events:** Check for Event IDs related to file modifications or access, specifically Event ID 4663 (Access to an Object) or Sysmon Event ID 11 (FileCreate). Look for any anomalies surrounding the timestamps of the alert.

  - **Identify authorized users:** Cross-reference the user accounts initiating the file activity with the organization’s policy on Faronics Core RMM usage. Confirm if expected personnel have permissions to interact with these files.

  - **Assess system role:** Determine the role and criticality of the host system. If the system is a server or high-privilege workstation, the alert warrants higher scrutiny compared to a non-critical user machine.

  - **Check for concurrent suspicious events:** Look for other indicators of compromise (IoCs) within the logs, such as unusual network connections or authentication logs (Event ID 4624) that correlate with the time of the alert, indicating potential progression in a compromise.

  - **Validate file integrity:** Confirm that the files, such as `FaronicsCoreAgent.exe` and `CoreAgentService.exe`, match known good hashes. Use hash comparison tools to identify if they have been modified from their original, legitimate states.

  - **Monitor for common evasion techniques:** Watch for attempts to mask the execution of Faronics RMM using renamed executables or modifications in their paths, indicating an effort to bypass detection measures.

  ### Prioritization

  This alert indicates medium severity due to the possibility of malicious use of legitimate remote access tools, particularly if an enterprise resource is involved. Given the common abuse of such software for unauthorized access, immediate investigation is warranted, especially in sensitive environments.

  ### Blind Spots and Assumptions

  Detection may face limitations if legitimate Faronics Core RMM tools are wholly integrated into the organization without clear usage policies. This can lead to false positives if multiple legitimate interactions occur. It's crucial to have complete logging configurations for file events and to be aware that legitimate administrative activities might trigger these alerts. Additionally, consider companion detections for other remote management tools that may be used maliciously, enhancing the overall visibility of potential threats.

