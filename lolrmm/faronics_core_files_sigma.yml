  ### Technical Context

  This Sigma rule detects file activity associated with the Faronics Core RMM tool, specifically focusing on the `FaronicsCoreAgent.exe`, `CoreAgentService.exe`, and `FCAForStartupMonitor.msi` files. The likely attacker objective is to leverage this remote management tool for unauthorized system access or control, enabling actions such as malware deployment or exploitation of the managed devices. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002), and the specific technique is Remote Services (T1219).

  The primary telemetry sources are Windows file event logs, particularly monitoring for file creation or modification events related to the specified Faronics Core RMM components. If exploited maliciously, this activity could lead to significant security impacts, including unauthorized remote control or data exfiltration. Notably, this detection does NOT confirm malicious intent by itself—legitimate use of the Faronics Core RMM tool can generate identical file events.

  ### Investigation Steps

  - **Review associated processes:** Check for processes initiated in conjunction with the detected file activity. Look for Event ID 4688 (Process Creation) and Sysmon Event ID 1, filtering for process names related to Faronics Core. A legitimate process would typically originate from a user account tied to IT operations or system administration.

  - **Investigate file modification activities:** Examine the Windows Security logs for Event ID 4663 (File Access) related to `FaronicsCoreAgent.exe`, `CoreAgentService.exe`, or `FCAForStartupMonitor.msi`. Legitimate activity would show known admin users accessing these files around standard operational hours.

  - **Analyze network traffic:** Inspect network logs (e.g., firewall or proxy logs) for unusual outbound connections from the Faronics-related executables to untrusted domains or IP addresses. Look for anomalous HTTP/S requests or file transfers indicative of exfiltration.

  - **Identify user account activity:** Query Active Directory logs for the user accounts executing the Faronics tool. Anomalous logon behavior (such as, Event ID 4624 with a logon type of 3 from unusual locations) should raise flags.

  - **Verify file integrity and origin:** Check for the file signatures and hashes of detected artifacts against a known baseline or a malware database. Files differing from standard signatures may indicate compromise or tampering.

  ### Prioritization

  This alert has medium severity due to its potential impact on systems managed by Faronics Core, which are often sensitive endpoints in an enterprise. The likelihood of malicious abuse is moderate, as adversaries may exploit remote management tools for nefarious purposes. While this tool can be used legitimately, its capabilities are commonly weaponized for exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited if log sources or configurations do not include file event logging or if the Faronics tool is deployed in a non-standard manner. Evasion techniques may include renaming or signature spoofing of the monitored executables. Legitimate administrative tasks, such as updates or regular maintenance of the Faronics tool, could also trigger this alert. A related detection to strengthen coverage would be monitoring for unusual remote connection attempts tied to legitimate management tools.

