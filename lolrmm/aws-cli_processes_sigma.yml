note: |
  ### Technical Context

  This rule detects processes spawned from the `AWSCLISetup.exe` executable, which could indicate potential misuse of the AWS Command Line Interface (CLI) as a Remote Management Tool (RMM). Attackers may leverage the AWS CLI to execute commands on compromised systems, often with the goal of lateral movement, data exfiltration, or establishing persistence. The relevant MITRE ATT&CK tactic for this behavior is Execution, specifically technique T1219 (Remote Services: Remote Command Execution).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688, which records new process creations. The security impact is significant if malicious; unauthorized use of AWS CLI may facilitate compromised environment control or data access. This detection does NOT confirm malicious intent by itself, as legitimate AWS CLI usage can trigger the same alerts.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Event ID 4688 entries where `ParentImage` contains `AWSCLISetup.exe`. Determine time and associated user accounts to assess context.

  - **Cross-reference user activity:** Analyze user behavior around the time of the alert. Expected behavior would include usage patterns like script execution or known administrative tasks associated with AWS resources (e.g., deploying infrastructure).

  - **Validate command execution history:** Investigate logs for the AWS CLI commands issued by the detected process. Look for unusual or sensitive operations that do not align with normal operational behavior. Example commands: `aws s3 cp`, `aws ec2`, etc.

  - **Assess host role and criticality:** Identify the role of the compromised host. Servers hosting sensitive data or critical AWS-managed resources should prompt higher scrutiny and immediate containment actions.

  - **Check for additional indicators of compromise:** Look for any related entries in the logs that may signify further malicious activity such as suspicious network connections to known malicious IPs or abnormal outgoing traffic through AWS APIs.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential security implications of unauthorized AWS CLI usage. The likelihood of malicious activity is notable, as the behavior observed is a common technique for lateral movement and remote command execution leveraged by adversaries. The action is also weaponized in certain attacker methodologies.

  ---

  ### Blind Spots and Assumptions

  Limitations of this detection include the possibility of legitimate AWS CLI usage triggering false positives, especially in environments utilizing cloud infrastructure management. Required log sources must include detailed process creation telemetry, and without full logging of AWS API interactions, context can be limited. Legitimate activities that may trigger the alert include routine administration tasks like infrastructure updates or deployments. A related detection rule for unauthorized AWS API calls (e.g., `iam:CreateAccessKey`) can complement this rule to enhance overall coverage.

