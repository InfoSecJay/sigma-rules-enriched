  ### Technical Context

  This Sigma rule detects file activity associated with the Obliance Remote Monitoring and Management (RMM) tool. The behavior indicates potential usage of the OblianceAgent executable files and configuration files, which can be exploited by malicious actors for remote control, manipulation, or monitoring of compromised systems. The relevant MITRE ATT&CK tactic is **Command and Control (T1071)**, and the technique involved is **Application Layer Protocol (T1219)**.

  The primary telemetry source is Windows file event logs, specifically monitoring modifications or creation of certain files (e.g., executables and configuration files) related to the Obliance software. If this activity is malicious, it could indicate an adversary gaining persistent access or control over targeted systems. However, detecting this activity does NOT confirm that malicious actions are taking place without further investigation to discern context and intent.

  ### Investigation Steps

  - **Review file activity logs**: Analyze Windows Event ID 4663 (File Access) logs to determine which user or process interacted with the files at `C:\Program Files\OblianceAgent\` and `C:\ProgramData\OblianceAgent\`. Look for unusual processes or non-administrator accounts accessing these locations.

  - **Identify creation timestamps**: Review the creation and last modified timestamps of files in the paths specified. Legitimate use may show consistent timestamps reflective of known maintenance windows, while anomalous times (e.g., out of hours) may indicate potential compromise.

  - **Check process execution logs**: Investigate Windows Event ID 4688 (Process Creation) logs for the execution of `obliance-agent.exe`, `obliance-tray.exe`, or `obliance-watchdog.exe`. Look for unusual parent processes, such as `cmd.exe` or `powershell.exe`, which may suggest misuse.

  - **Validate configuration changes**: Examine the contents of `config.json` and `watchdog.json` files in `C:\ProgramData\OblianceAgent\` for unexpected changes or configurations that could indicate malicious activity, such as altered command and control settings.

  - **Identify legitimate use cases**: Confirm whether Obliance is registered and authorized within the environment, which may be found in asset management records. Compare file activity against known use cases for administration by legitimate IT personnel.

  ### Prioritization

  The alert is considered medium severity due to the reliance of compromised systems on RMM tools for unauthorized access. If exploited, it could enable adversaries to perform extensive configuration changes or data exfiltration. The likelihood of malicious abuse is notable, as RMM tools are often weaponized for lateral movement or persistence.

  ### Blind Spots and Assumptions

  Limitations exist as legitimate use of the Obliance RMM tool may trigger alerts, posing a false positive risk. Ensure configurations of relevant Windows file auditing logs are comprehensive to support this detection reliably. Background processes associated with existing administrative duties might create benign file activity. For additional coverage, consider implementing detections for anomalous network traffic that could signal communication with known malicious command and control IP addresses.

