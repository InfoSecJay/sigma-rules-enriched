note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the ScreenMeet Remote Monitoring and Management (RMM) tool by monitoring outgoing connections to hostnames ending with '*.screenmeet.com' and '*.scrn.mt'. The likely objective of attackers utilizing this tool is unauthorized remote access to victims’ machines, potentially performing tasks such as data exfiltration, manipulation, or installing additional malicious software. This activity is associated with the MITRE ATT&CK tactic of "Execution" and the technique ID T1219 (Remote Access Software).

  The primary telemetry sources for this detection include Windows network connection logs, specifically looking for outbound connections. If detected maliciously, ScreenMeet activity could allow an adversary to gain control over an endpoint, leading to further compromise of sensitive data or systems. It is important to note that this detection does NOT on its own confirm malicious intent, as legitimate use of ScreenMeet for remote assistance may trigger similar alerts.

  ### Investigation Steps

  - **Review network connection events:** Check Windows security event logs (Event ID 5156) for outbound connections to hostnames such as '*.screenmeet.com' or '*.scrn.mt'. Verify the user context and associated process, looking for processes not typically associated with remote support activities.

  - **Correlate logins with activities:** Examine authentication logs (Event ID 4624) for user account activities that align with the timestamps of the detected ScreenMeet connections. Normal usage should show authorized users utilizing ScreenMeet for genuine support tasks.

  - **Identify high-confidence malicious indicators:** Investigate the execution context of the process making the network connection; if it originates from suspicious or unknown software, or if there’s unusual behavior, such as frequent reconnections to the same screenmeet domain, this can signal malicious usage.

  - **Check for related processes:** Analyze running processes using Sysmon (Event ID 1), specifically those that reference remote access tools or unusual binaries running on endpoints. Legitimate ScreenMeet processes should typically have expected parent processes (like known IT support software).

  - **Validate user accounts and organizational policy:** Assess whether the user accounts triggering the alerts have legitimate business reasons for accessing ScreenMeet. Confirm organizational policy regarding the use of remote management tools.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on sensitive systems if the activity is indeed malicious. The likelihood of abuse is moderate, as the tool is often employed legitimately, but it could also be weaponized by adversaries. Monitoring such tools in the context of network behavior is critical, especially in environments with high-value assets.

  ### Blind Spots and Assumptions

  Detection limitations may occur if the logs from network connections are not retained or monitored consistently. Remote access tools, including ScreenMeet, could be misused by legitimate personnel for authorized purposes, complicating investigations. Additionally, adversaries may attempt to bypass detection by using custom domains or obfuscating their traffic. A companion detection, such as monitoring for process creation events related to Remote Access software, strengthens coverage and helps establish context around the detected network connections.

