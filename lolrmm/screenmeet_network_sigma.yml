note: |
  ### Technical Context

  This Sigma rule detects network activity related to the ScreenMeet remote management tool. The likely attacker objective is to establish remote access and control over an asset, facilitating data exfiltration or lateral movement within the network. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically technique T1219 (Remote Access Tools). The primary telemetry source is Windows network connection logs, particularly filtering for connections to hostnames that end with `.screenmeet.com` or `.scrn.mt`. If this behavior is malicious, it may indicate a compromise of remote access capabilities by an adversary. However, this detection does NOT confirm that the activity is inherently malicious, as legitimate users may utilize ScreenMeet for support purposes.

  ### Investigation Steps

  - **Check for connections to ScreenMeet domains:** Review Windows network connection logs (Security Event ID 4800) for any outgoing connections to domains like `*.screenmeet.com` or `*.scrn.mt`. Malicious indicators include unexpected connections from non-administrative users.

  - **Correlate process creation events:** Investigate Windows Event ID 4688 or Sysmon Event ID 1 on the same hosts to see if any unrecognized processes initiate connections to ScreenMeet addresses or if known legitimate processes (like `ScreenMeet.exe`) are involved.

  - **Verify user context of activity:** Identify the user associated with the network connection by checking Event ID 4624 (Logon). Legitimate activity often derives from IT support personnel or help desk accounts.

  - **Assess host role and criticality:** Determine the role and criticality of the affected host. A connection from an endpoint classified as "high-value" or sensitive may require immediate forensic review, especially if unauthorized software is present.

  - **Investigate for other remote access tools:** Look for simultaneous or recent activity involving other remote access tools by reviewing for common remote access process signatures. This can strengthen the suspicion of compromise if multiple tools are present.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive systems if malicious, coupled with the realistic likelihood of adversaries using legitimate remote access tools for exploitation. Given the nature of remote administration software, its behavior can often be weaponized, highlighting the need for diligence in investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configurability of network logs and legitimate network usage patterns of ScreenMeet that could trigger alerts. The requirement for reliable detection includes ensuring that telemetry from all endpoints includes outbound connection logs. Additionally, legitimate remote support sessions may result in the same alerts; thus, context is crucial. A related detection that enhances coverage is monitoring for other RMM tool activity, such as connections to `*.teamviewer.com` or similar domains.

