  ---

  ### Technical Context

  This Sigma rule detects network activity associated with the ScreenMeet Remote Monitoring and Management (RMM) tool. Such behavior typically indicates attempts by an adversary to gain remote access to systems, allowing for potential malicious activities like data exfiltration or system manipulation. The relevant MITRE ATT&CK tactic is **Execution** (TA0002), and the technique is **Remote Services** (T1219).

  Primary telemetry sources include Windows network connection logs, specifically looking for logs indicating DNS resolutions or outbound connections to domains associated with ScreenMeet such as `*.screenmeet.com` and `*.scrn.mt`. If malicious, this activity could facilitate unauthorized remote access or control over corporate endpoints. Importantly, this detection does NOT confirm unauthorized access has occurred without additional context from endpoint activity.

  ---

  ### Investigation Steps

  - **Validate active sessions on the host:**
    Check for any legitimate usage of ScreenMeet by correlating user account activity with connection logs, ensuring user access logs reflect expected usage patterns and user roles.

  - **Examine outbound connections:**
    Review Windows network logs (Event ID 5156 from Windows Firewall) for outbound connections to `*.screenmeet.com` or `*.scrn.mt` during unusual times or from atypical user accounts.

  - **Inspect process creation logs:**
    Look for Sysmon Event ID 1 for processes related to the ScreenMeet executable. Legitimate processes usually align with known user or admin activity; any unexpected or unauthorized use should raise flags.

  - **Review user account activity:**
    Analyze user login activity in Security Event IDs 4624 and 4634. Pay particular attention to whether the user account initiating the connection has a history of legitimate remote support behaviors.

  - **Identify abnormal data transfer patterns:**
    Check for large data transfers or unusual traffic volumes to the identified domains using network logs. This may denote a potential data exfiltration attempt.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential exposure of sensitive systems through remote access tools like ScreenMeet, which are frequently exploited by adversaries. While legitimate uses exist, the frequency and scope of this activity warrant prompt investigation, particularly if observed in high-risk environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of ScreenMeet within the organization, which could lead to false positives. Ensure logging for Windows Firewall and process creation is adequately configured to capture this network activity reliably. Legitimate IT support activities may trigger the alert, hence the importance of contextual user behavior. Consider companion detections related to unusual administrative tool usage or unauthorized access attempts for comprehensive visibility.

