note: |
  ### Technical Context

  This rule detects outbound network connections directed at ScreenMeet RMM tool domains, including `*.screenmeet.com` and `*.scrn.mt`. The likely attacker objective is to utilize ScreenMeet as a remote management tool for unauthorized access to victim systems. This behavior aligns with the MITRE ATT&CK tactic of Command and Control, specifically technique T1219, which involves using remote access tools to control compromised hosts.

  The primary telemetry sources include Windows logs for network connections, especially focusing on outbound traffic to the specified domains. If the connections are malicious, they may indicate an unauthorized remote access session. However, it's important to note that this detection does NOT confirm unauthorized activity on its own, as it may include legitimate usage scenarios for remote support or administrative tasks.

  ### Investigation Steps

  - **Verify connection logs:** Check Windows Event ID 5156 (Windows Filtering Platform) for allowed outbound connections to `*.screenmeet.com` or `*.scrn.mt`. Malicious indicators include connections occurring outside of normal business hours or from unexpected locations.

  - **Assess user context:** Review the user account initiating the connections by cross-referencing Event ID 4624 (Logon) for user authentication. Benign behavior could show logons by known administrative accounts associated with remote support.

  - **Review process execution:** Examine Event ID 4688 (Process Creation) to identify any processes associated with outgoing connections to ScreenMeet domains. Look for unusual parent process relationships, as typical usage would involve known remote management software executables.

  - **Audit firewall activity:** Analyze Windows Firewall logs (Event ID 5000) for rules related to the ScreenMeet domains. Confirm whether the configuration corresponds with registered usage patterns of sanctioned remote management software.

  - **Confirm legitimate operations:** Recognize that authorized IT personnel may utilize screen sharing or remote support tools; verify tickets or requests logged in the IT service management system correlating with the times of detected outbound connections.

  - **Identify high-confidence malicious indicators:** Check for previously known malicious IP addresses or blacklisted domains associated with ScreenMeet activity. Correlate these findings with external threat intelligence for context.

  ### Prioritization

  This alert has medium severity in an enterprise context. Impact is dependent on whether the affected system is critical and if unauthorized access enables exfiltration of sensitive data or manipulation of configurations. The likelihood of malicious abuse is moderate as screen sharing tools are commonly weaponized in remote access attacks.

  ### Blind Spots and Assumptions

  This detection may be limited by false positives from legitimate use of screen sharing tools, which could generate similar outbound traffic. Ensuring that telemetry from firewall and network services are properly configured is essential for reliable detection. Additionally, remote support by internal IT teams may trigger this alert. A companion detection to strengthen coverage could involve monitoring for abnormal process creation patterns related to known remote access tools.

