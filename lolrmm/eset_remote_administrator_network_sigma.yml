note: |
  ### Technical Context

  This rule detects outbound network connections to potential ESET Remote Administrator (RMM) tool endpoints, specifically to domains such as `user_managed` and `eset.com`. The objective may be to manage endpoints remotely, which could indicate legitimate administrative activity or unauthorized access if performed by an attacker. This detection aligns with the MITRE ATT&CK tactic: Execution (TA0002), technique: Remote Services (T1219).

  The primary telemetry sources include Windows network connection logs, particularly focusing on outbound connections. If malicious, such activity can lead to unauthorized endpoint management, data exfiltration, or system manipulation by an attacker. This detection does NOT confirm malicious intent or activity on its own; it merely flags instances where the behavior matches known RMM tool network activity.

  ### Investigation Steps

  - **Review outbound connection logs:** Check for connections to `user_managed` or `eset.com` from relevant assets. Use Windows networking logs (Event ID 5156) to identify if any suspicious IPs or unexpected outbound flows are initiated by non-administrative users.

  - **Validate the host's role:** Determine if the alerting host is part of an administrative team that may legitimately use ESET RMM, based on asset classification and role information in the asset management database.

  - **Correlate with endpoint logs:** Look into Security Event ID 4688 for process creation associated with ESET components or unusual tools related to remote management being executed to confirm if execution matches known patterns of RMM usage.

  - **Check for abnormal request patterns:** Analyze HTTP logs if available for unusual GET/POST requests to ESET domains, including unusual user agent strings or request volume.

  - **Identify known malware associations:** Check the alerting IP addresses against threat intelligence feeds or sandbox results for associations with known malicious behavior or adversarial tactics.

  ### Prioritization

  This alert carries medium severity due to the potential impact on systems utilizing remote management. While ESET RMM can be used legitimately, the risk of abuse during unauthorized access attempts necessitates timely investigation. Connections to these domains can indicate commonly exploited remote management tools.

  ### Blind Spots and Assumptions

  Legitimate administrative users may trigger this alert without malice, especially in environments with authorized use of ESET RMM tools. Detection efficacy relies on comprehensive logging configurations for network connections and endpoint activity. Adversaries may employ encrypted connections or utilize other remote management tools to bypass detection. A related detection involves monitoring for abnormal user behavior explored in user entity behavior analytics (UEBA) deployments.

