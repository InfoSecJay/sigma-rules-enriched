note: |
  ### Technical Context

  This rule detects network activity associated with the ESET Remote Administrator RMM tool, specifically monitoring connections to destinations ending with 'user_managed'. The behavior indicates that an analyst may observe unauthorized access or control of an endpoint, aligning with an attacker's intent to maintain persistence or execute remote commands. This detection relates to the MITRE ATT&CK tactic of Remote Execution (TA0002) and technique of Remote Services (T1219).

  The primary telemetry sources are Windows network connection logs, which include details about outbound connections. If malicious, such activity can facilitate unauthorized access, data exfiltration, or lateral movement. However, this detection does NOT confirm malicious intent or activity on its own; legitimate ESET Remote Administrator use can trigger this rule.

  ### Investigation Steps

  - **Review network connection logs**: Check for connections from the affected host to external destinations ending with 'user_managed'. Validate through Windows Event ID 5156, which indicates allowed connection attempts on the firewall.

  - **Check process creation logs**: Investigate for any processes associated with ESET Remote Administrator using Sysmon Event ID 1 (Process creation) or Windows Event ID 4688. Verify if these processes align with expected behavior for legitimate administrative activity.

  - **Verify asset ownership and role**: Confirm whether the device in question is designated for IT or administrative tasks that may utilize the ESET tool. If not, further investigation is warranted.

  - **Analyze outbound connection timestamps**: Correlate timeframes of the alerts with user activities reported through logs. Determine if these connections coincided with user logins or administrative actions.

  - **Identify known malicious indicators**: Look for a pattern of repeated connections or unusual communication volume with 'user_managed' destinations, as these may suggest compromise. Verify source IP addresses against threat intelligence to check for known bad actors.

  ### Prioritization

  This alert is medium severity due to the potential for unauthorized access via a remote management tool. While ESET Remote Administrator can be legitimately employed, its misuse often leads to significant impacts, particularly in sensitive or administrative environments. Remote execution techniques are frequently exploited by adversaries, necessitating timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate ESET Remote Administrator usage which can mimic malicious behavior. Ensure logging for Windows network connections is enabled and properly configured for comprehensive visibility. Other legitimate activities, such as remote support sessions initiated by help desk personnel, can trigger similar alerts. Consider companion detections for related remote execution techniques to enhance coverage and context.

