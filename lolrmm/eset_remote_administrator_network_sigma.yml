note: |
  ### Technical Context

  This rule detects network activity associated with the ESET Remote Administrator RMM tool, specifically targeting connections where the DestinationHostname ends with 'user_managed'. The likely attacker objective could involve gaining unauthorized access to endpoints for administrative control or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (TA0011), specifically technique T1219, which pertains to remote access tools.

  Primary telemetry sources for this detection include Windows network connection logs that capture outbound connections, which will contain fields such as DestinationHostname and DestinationPort. If the detected activity is malicious, it could result in significant security impacts including data breaches and system compromise. Importantly, this detection solely indicates unusual RMM tool activity; it does NOT confirm that the actions are malicious, as legitimate use can generate similar alerts.

  ### Investigation Steps

  - **Review network connection logs:** Check Windows Event ID 5156 (Security Filtering) for allowed outbound connections to any IP or domain ending with 'user_managed'. Confirm if the connection was initiated by a known, legitimate user or application.

  - **Identify legitimate use of ESET Remote Administrator:** Validate if the IP addresses or hostnames in question are part of a recognized management infrastructure, especially if they are listed in ESET documentation or company assets.

  - **Correlate with user activity:** Investigate recent user activity within the relevant environment using Active Directory logs (Event ID 4624 for logon events). Determine if the initiating user has a history of legitimate use of RMM tools.

  - **Check for high-confidence malicious indicators:** Look for unusual login patterns or connections during non-business hours that correlate with the RMM tool usage in the logs. This may include Event ID 4625 (failed logon attempts) preceding the alert, indicating potential unauthorized access attempts.

  - **Monitor asset criticality:** Assess the criticality of the device generating the alert. RMM activities on high-value assets should be prioritized, and discrepancies in their usage patterns should be treated with higher scrutiny.

  ### Prioritization

  This alert should be rated as medium severity due to the possibility of malicious abuse concerning remote access tools which are often weaponized by adversaries for unauthorized access. The impact level can be critical if the affected system manages sensitive data or critical infrastructure.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate Remote Management tools if not carefully monitored. The absence of comprehensive logging can lead to missed indicators of unauthorized activity. Legitimate administrative tasks using ESET Remote Administrator may trigger these alerts, especially during regular maintenance periods. A related detection could involve monitoring for unusual processes associated with RMM tool installations, providing additional context for anomalies in RMM usage.

