note: |
  ### Technical Context
  This detection rule identifies network activity consistent with the use of the ESET Remote Administrator (RMM) tool, a remote management and monitoring solution often used by IT administrators. The typical threat scenario involves potential misuse of the RMM tool by an unauthorized actor who may leverage it to gain control over managed endpoints, exfiltrate data, or deploy malicious payloads. Attackers may employ legitimate administrative tools like ESET RMM to evade detection by blending in with normal administrative activities.

  Relevant MITRE ATT&CK tactics include **Execution (TA0002)** through the use of legitimate software such as ESET RMM, and specifically the technique **Remote Services (T1219)**, which covers exploitation of remote services for unauthorized access or control of machines. The primary data sources for this detection are Windows network connection logs, which will capture the outbound connections to ESET-associated domains.

  ### Investigation Steps
  - **Review Network Logs:** Examine Windows network connection logs to identify outbound connections to domains associated with ESET Remote Administrator, particularly patterns with URLs ending in `user_managed` and `eset.com/me/business/remote-management/remote-administrator/`.
  - **Analyze Process Activity:** Investigate local process creation and execution logs around the same time as the network activity to identify any unauthorized usage of the ESET RMM tool or associated processes that may indicate suspicious behavior.
  - **Check User Access:** Confirm whether the user initiating these connections has appropriate access rights and verify their activity against known good behaviors. Look for any unusual authentication events tied to these user accounts.
  - **Correlate with Endpoint Security Alerts:** Review alerts from endpoint detection and response (EDR) solutions for any related detections that may indicate compromise or misuse of the RMM tool in line with the network activity observed.

  ### Prioritization
  The alert is considered medium priority due to the potential for serious impact on enterprise security if attackers are able to exploit remote management tools for unauthorized access. While the likelihood of a false positive exists due to legitimate administrative usage, the risk associated with misuse necessitates prompt investigation.

  ### Blind Spots and Assumptions
  This detection assumes clear visibility into Windows network connection logs that detail domain reachability. There may be blind spots regarding legitimate administrative actions, as some IT personnel may use the ESET RMM tool legitimately, leading to false positives. It also presumes that operational logging configurations are adequately set to capture necessary artifacts for effective detection, which if not in place, could impede the functionality of this alert.

