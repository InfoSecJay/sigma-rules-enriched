note: |
  ### Technical Context

  This Sigma rule detects network connections to Any Support remote management tool domains, specifically those with the pattern `*.anysupport.net`. Such tools are typically used by IT support teams for remote assistance, but they can also be leveraged by attackers for persistence and lateral movement. The likely attacker objective is to establish a command and control (C2) channel or maintain access to compromised systems. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1219).

  The primary telemetry source required is Windows network connection logs (e.g., Security Event ID 5156) that capture outbound connections. If the detected activity is malicious, it may allow an adversary to control an endpoint remotely, exfiltrate data, or move laterally within the network. Importantly, this detection does NOT confirm that the use of Any Support is malicious; legitimate support activities can trigger this alert.

  ### Investigation Steps

  - **Check recent network connection logs:** Review Windows Security Event ID 5156 for network connections to `*.anysupport.net`. Look for processes initiating these connections, noting the process ID (PID) and process name.

  - **Identify process origins:** Validate if the process establishing the connection is from legitimate applications (e.g., Any Support) or unexpected executables. Use Sysmon Event ID 1 to correlate the process creation with the connection activity.

  - **Assess historical use:** Review the system's historical logs for previous legitimate usage of Any Support. Check application installation logs (e.g., Program Install and Uninstall logs) for a record of any IT support tools that would typically use this domain.

  - **Look for lateral movement indicators:** If the alert appears on multiple endpoints, correlate connections to identify potential lateral movement. Check for simultaneous connections across different hosts interacting with Any Support.

  - **Verify asset criticality:** Confirm if the affected systems are critical endpoints (e.g., domain controllers, sensitive servers). If so, escalate investigation based on asset criticality.

  - **Check for credential misuse:** Look for specific authentication attempts from the detected process to remote services or unusual user account activity, including failed logins and account lockouts that may indicate an abuse of legitimate credentials.

  ### Prioritization

  This alert carries medium severity due to the potential impact of remote access tools being exploited by adversaries. The likelihood of malicious activity is notable, as legitimate support tools can be weaponized for unauthorized access. The behavior of connecting to Any Support domains is also relatively common in C2 setups.

  ### Blind Spots and Assumptions

  Detection of this behavior may be limited by the absence of complete network logs or potential evasion through custom domains. Reliable detection requires appropriate logging settings to capture all outbound connection attempts. Legitimate support engagements, especially in organizations that utilize Any Support for remote troubleshooting, may lead to false positives. A companion detection to consider is monitoring for unusual process behavior (e.g., unexpected remote connections initiated by non-support-related applications).

