note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the Any Support Remote Monitoring and Management (RMM) tool, specifically targeting `*.anysupport.net`. The likely objective of an attacker using this tool would be to establish command-and-control (C2) functionality, allowing them to manipulate compromised systems or exfiltrate data covertly. This aligns with the MITRE ATT&CK technique for Remote Access Tools (RAT), specifically T1219. The primary telemetry sources required for this detection include Windows Event logs capturing network connections, specifically logs related to outbound traffic. If this behavior is indeed malicious, it may enable unauthorized access to IT environments or facilitate data breaches. It is essential to note that this detection does NOT confirm malicious intent on its own, as legitimate use of Any Support for remote administration may also trigger this alert.

  ### Investigation Steps

  - **Review outbound network connections:** Investigate Windows Security Event ID 5156 (Windows Filtering Platform) to confirm the specific process making the connection to `*.anysupport.net`. Ensure that the originating process is not a known legitimate application (e.g., Any Support client).

  - **Cross-reference recent installations or changes:** Check your asset inventory for any recent deployments of remote management tools or updates to existing legitimate software that might explain the outbound connection. Validate against authorized software lists.

  - **Analyze process creation logs:** Look for process creation logs (Security Event ID 4688) that may indicate if a known suspicious process is initiating connections to the RMM domains. Focus on creation times and the parent-child relationship of processes involved.

  - **Identify associated file activity:** In cases where exfiltration might occur, search for file creation or modification events (Sysmon Event ID 11) to detect unusual file transfers or changes occurring concurrently with the network connection attempts.

  - **Determine legitimate usage patterns:** Consult your IT department to verify legitimate use of Any Support. Identify typical usage hours and the expected network destinations. Document these standards for reference.

  - **Identify any previous alerts:** Review the alert history for similar outbound connections in the last 30 days to determine if this behavior is part of a pattern involving malicious activity or if it is a recurring legitimate operation.

  ### Prioritization

  This alert holds medium severity due to the potential impact on enterprise security if malicious use of Any Support leads to unauthorized access or data loss. The likelihood of abuse is moderate, particularly given the tool's legitimate administrative function that may mask malicious activity. However, the frequency of weaponized RMM tools in attacks contextualizes the alert's importance.

  ### Blind Spots and Assumptions

  Detection may be limited by evasions such as the use of VPNs or proxies that mask the connection, which can prevent accurate attribution to the Any Support domains. It is critical to ensure that Windows Filtering Platform logging is properly configured to capture outbound connection events. Legitimate administrative actions may also generate alerts, particularly if legitimate users are using the tool for support purposes. Companion detections, such as monitoring for anomalous authentication attempts or unusual behavior from processes associated with RMM tools, can help provide a more comprehensive security posture.

