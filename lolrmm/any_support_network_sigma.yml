note: |
  ### Technical Context

  This rule detects outbound network connections to any host resolving to the `*.anysupport.net` domain, which is commonly associated with the Any Support Remote Management Tool (RMM). Attackers may leverage such RMM tools to gain unauthorized access to systems, exfiltrate data, or deploy additional malicious payloads. The likely attacker objective is to achieve remote access for reconnaissance, lateral movement, or persistence, corresponding to the MITRE ATT&CK technique "Remote Access Tools" (T1219).

  Primary telemetry sources include Windows network connection logs that capture outbound traffic to this domain. If detected activity is malicious, it could lead to significant compromise of sensitive data and network integrity. This detection does NOT inherently confirm unauthorized access; it only indicates that a connection to a known RMM service has been initiated, which could also be legitimate.

  ### Investigation Steps

  - **Check outbound connection details:** Review Windows Security Event ID 5156 and Windows Firewall logs for details on connections to `*.anysupport.net`, noting source IP and user account involved.

  - **Correlate with user activity:** Identify recent user activity or remote support cases that justified the use of Any Support. Look for the User account in question involved in legitimate support interactions or sessions.

  - **Evaluate process execution:** Analyze Windows Process Creation logs (Security Event ID 4688 and Sysmon Event ID 1) to identify whether the Any Support application initiated any unusual processes or executed scripts.

  - **Analyze data transfer volume:** Examine network traffic logs for abnormal data transfer volumes during the connection to the RMM service. High outbound traffic patterns can indicate potential data exfiltration.

  - **Review host system role:** Account for the criticality of the host involved in the alert. An alert on a domain controller versus a user workstation may present different levels of concern and warrant escalated investigation.

  ### Prioritization

  This alert has medium severity as it indicates potential misuse of a remote management tool, which can allow significant impacts if leveraged maliciously. While legitimate use exists, awareness of this activity in sensitive systems is crucial since such RMM tools are frequently abused in targeted attacks.

  ### Blind Spots and Assumptions

  Detection is limited by possible evasion techniques such as tunneling or the use of VPNs, which can obscure actual malicious connections. Comprehensive logging of outbound connections and proper filtering configurations are necessary for reliable detection. Legitimate IT support activities may inadvertently trigger this alert. A related detection for added coverage could include monitoring for other known RMM tools or evaluating internal traffic to differentiate legitimate from unauthorized support actions.

