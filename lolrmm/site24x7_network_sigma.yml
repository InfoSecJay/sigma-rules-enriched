  ---

  ### Technical Context

  This rule detects network connections to Site24x7 domains which are typically associated with the Site24x7 Remote Monitoring Management (RMM) tool. Attackers may leverage similar infrastructure to establish unauthorized remote access or control over target machines, using such tools for post-exploitation activities. Relevant MITRE ATT&CK tactic is **Execution** (TA0002), and the technique is **Exploitation of Remote Services** (T1219).

  Primary telemetry sources include Windows network connection logs, specifically looking for events involving connections to destination hostnames that match designated Site24x7 patterns. If this behavior is malicious, it could indicate unauthorized monitoring or manipulation of endpoints. This detection does NOT confirm malicious intent on its own; legitimate use of the RMM tool by authorized personnel can trigger the alert.

  ---

  ### Investigation Steps

  - **Verify network connection logs:** Review Windows Security Event ID 5156 to confirm outbound connections to specified Site24x7 domains. Correlate source IP addresses with known asset inventories to assess legitimacy.

  - **Check endpoint configuration:** Identify if the affected system is authorized to use Site24x7 tools by referencing its Service Authorization logs or documentation. Confirm its role — legitimate usage may be expected on administrative machines.

  - **Inspect remote connection activity:** Use Sysmon Event ID 3 to track process creation related to remote domain connections initiated from the affected endpoints. Malicious indicators include processes started from unexpected directories.

  - **Assess user account activities:** Look for related user logon events (Security Event ID 4624) tied to non-admin accounts that may indicate unauthorized use during odd hours. A legitimate admin account should be the one initiating these connections.

  - **Confirm external communication:** Analyze firewall logs for outbound traffic to Site24x7. Correlate connections with recent system changes or unusual patterns, such as high volumes of requests, which may indicate exploitation attempts.

  ---

  ### Prioritization

  The alert has medium severity due to its potential impact on critical systems if exploited. It reflects a higher likelihood of malicious activity compared to benign usage, especially in environments where the Site24x7 tool is not commonly employed. The behavior is not widely weaponized but could indicate a pivot towards manipulation through RMM.

  ---

  ### Blind Spots and Assumptions

  Detection may overlook legitimate uses of Site24x7 by authorized IT personnel, leading to false positives. Proper logging for Windows network connection events (Event ID 5156) must be enabled to ensure comprehensive monitoring. Additionally, personnel utilizing legitimate RMM tools may trigger alerts, warranting careful review. A companion detection to bolster coverage includes monitoring for anomalous process creation (Sysmon Event ID 1) after establishing network connections to the flagged domains.

