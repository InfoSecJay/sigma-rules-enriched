note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Auvik Remote Monitoring and Management (RMM) tool, specifically `auvik.engine.exe` and `auvik.agent.exe`. Attackers may leverage Auvik’s capabilities to manage remote systems, bypass controls, or conduct lateral movement within an enterprise environment. This behavior fits within the MITRE ATT&CK framework, associating with the Command and Control tactic (TA0011) and the Remote Services technique (T1219).

  The primary telemetry sources required include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, detailing the creation of new processes and their parent-child relationships. If malicious, an attacker could exploit Auvik to manipulate or control compromised systems. Importantly, this alert does NOT confirm malicious intent on its own; Auvik may also be legitimately deployed for system management.

  ### Investigation Steps

  - **Check process details for legitimacy:** Examine the process details of any detected activity using Sysmon Event ID 1 or Security Event ID 4688. Look for the process creation time and account under which the processes are running; generally, administrative or service accounts are expected for Auvik.

  - **Investigate the parent process:** Determine the parent process linked to the executions. Ensure that `auvik.engine.exe` or `auvik.agent.exe` is launched from a trusted or expected parent application (like `C:\Program Files\Auvik\...`). Unauthorized parent processes could indicate potential abuse.

  - **Monitor network connections:** Review network activity associated with these processes. Use logs from firewall or IDS/IPS systems to detect outbound connections to suspicious or uncommon external IP addresses. Auvik may interact with remote servers; analyze destination IPs against threat intelligence for confirmation.

  - **Identify irregular user interaction:** Look for unusual user behavior linked with these processes. If Auvik was recently installed or updated by a user, verify installation logs in Windows Event Viewer (Event IDs 11724 or 1033) for sanctioned management activity.

  - **Cross-reference with anomaly detection:** Identify baseline behavior of Auvik's expected operation in your environment. Use past logs to verify normal execution patterns—any deviation, such as executions at odd hours or unusual account usage, should be flagged for further investigation.

  ### Prioritization

  This alert is of medium severity due to the potential for malicious use of Auvik’s functionality to compromise enterprise systems. While Auvik is a legitimate RMM tool, the potential for misuse, especially in environments where it is not formally recognized or authorized, warrants vigilant investigation.

  ### Blind Spots and Assumptions

  Detection limitations may arise if Auvik is improperly configured or if logs are not enabled for all process creation events. Legitimate administrative activity could trigger this alert, especially during system maintenance or updates using Auvik. To strengthen coverage, correlate findings with detections of other RMM tools or unauthorized remote access attempts, such as via TeamViewer or any other remote access software.

