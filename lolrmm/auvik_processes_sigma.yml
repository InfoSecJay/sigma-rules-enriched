  ---

  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Auvik RMM (Remote Monitoring and Management) tool, specifically `auvik.engine.exe` and `auvik.agent.exe`. The behavior being monitored may indicate unauthorized use of Auvik for potentially malicious objectives, such as reconnaissance or lateral movement within the network. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **T1219** (Remote Access Software).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If utilized maliciously, the impact could range from unwarranted exposure of sensitive data to control over managed devices. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate usage of Auvik for network management can trigger the rule.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 logs where the `Image` ends with `auvik.engine.exe` or `auvik.agent.exe`. Look for the process creation time and user context to determine if the activity aligns with authorized use.

  - **Identify the parent process:** Investigate the `ParentImage` field in the logs. If both the parent and child processes are Auvik executables, this could indicate routine operation. If the parent process is unexpected, this may suggest malicious behavior.

  - **Review account activity:** Validate the user account that initiated the Auvik processes. Commonly, this should be a service account related to IT operations. Unexpected accounts triggering this alert can be a strong indicator of malicious intent.

  - **Correlate with network activity:** Analyze network logs for connections initiated by these Auvik processes. Look for unusual external communication, especially to non-corporate or suspicious IP addresses during the time of the alert.

  - **Document legitimate use cases:** Identify any recent legitimate maintenance or network management activities that align with the normal operation of Auvik RMM to contextualize the alert within expected behavior.

  - **Evaluate asset criticality:** Confirm if the affected device is critical to business operations. Compromise of RMM tools on key assets represents a greater risk for lateral movement and impact.

  ---

  ### Prioritization

  This alert holds medium severity due to the potential for Auvik being used inappropriately. Since RMM tools are commonly targeted in breaches for remote access, the likelihood of malicious use is significant, particularly if unauthorized accounts or unusual actions are detected.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion techniques by attackers who may exploit Auvik in a manner that does not generate clear process creation logs. Reliable detection requires complete Windows event log collection, especially for processes initiated by system-level accounts. Legitimate administrative tasks may also trigger the alert, highlighting the necessity for context-aware analysis. A companion detection could focus on unusual outbound network activity associated with devices running Auvik, providing additional context to support investigation efforts.

