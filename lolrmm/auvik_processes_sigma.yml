note: |
  ### Technical Context

  This rule detects process creation activities related to the Auvik RMM (Remote Monitoring and Management) tool, specifically instances of `auvik.engine.exe` and `auvik.agent.exe`. The likely attacker objective could involve exploiting the Auvik tool to conduct unauthorized administrative actions within the environment, potentially leading to lateral movement or persistence. This behavior maps to the MITRE ATT&CK framework under "Execution" (T1219) as it relates to executing malicious code through remote tools.

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Events ID 4688 and Sysmon Event ID 1, which detail process execution on Windows systems. If malicious, this activity could lead to significant security impacts, including compromise of sensitive systems and data. However, this detection does NOT confirm malicious intent on its own, as Auvik is a legitimate tool used for network monitoring.

  ### Investigation Steps

  - **Review process creation details:** Examine Security Event ID 4688 or Sysmon Event ID 1 for any occurrences of `auvik.engine.exe` or `auvik.agent.exe`. Validate the UserName and ComputerName fields to confirm legitimate account usage.
  - **Identify parent processes:** Analyze the ParentImage field to determine if the Auvik process was initiated by a known malicious or suspicious parent process. Compare against legitimate workflows to identify anomalies.
  - **Investigate the system role:** Confirm the asset's role within the environment—servers, endpoints, or workstations. Expected behavior in network monitoring tools operates on servers or designated management machines.
  - **Cross-reference execution time:** Review the timestamps of the executed processes against typical maintenance windows for legitimate Auvik tool usage. Deviations could indicate malicious activity.
  - **Check for subsequent network activity:** Look for suspicious outbound connections from the detected Auvik processes in firewall or network logs. Unusual IP addresses or protocols could further indicate malicious operation.
  - **Validate trusted sources:** Ensure that `auvik.engine.exe` and `auvik.agent.exe` were retrieved from known, trusted repositories for software deployment. Check file hashes against a database of legitimate binaries.

  ### Prioritization

  This alert is rated medium severity due to the potential for significant impact on systems if Auvik is misused. The likelihood of malicious abuse is medium, as adversaries may leverage legitimate tools for reconnaissance or lateral movement. While not the most commonly weaponized behavior, unauthorized use of RMM tools poses a credible risk in mature environments.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers leveraging advanced evasion techniques, such as renaming legitimate binaries or using alternative process execution methods. To ensure reliable detection, proper configuration of Windows logging, including enabling Sysmon for complete process monitoring, is essential. Legitimate activities may include scheduled maintenance or automated script executions via Auvik. A related detection could be monitoring for unusual command-line arguments associated with Auvik processes that might indicate an attack vector, which would complement this rule's coverage.

