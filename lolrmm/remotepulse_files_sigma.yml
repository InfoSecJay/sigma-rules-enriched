note: |
  ### Technical Context

  This rule detects file activity related to the RemotePulse RMM tool, specifically focusing on the execution of potentially malicious scripts and executables associated with remote management tools. The likely attacker objective includes executing administrative functions or establishing persistence through RemotePulse, which is typically utilized for remote system administration but can be exploited by adversaries for nefarious purposes. The relevant MITRE ATT&CK techniques include Execution (T1203) and Remote Services (T1219).

  Primary telemetry sources include Windows file event logs that capture file access or modifications, specifically targeting events related to executable files and scripts located in the RemotePulse directory. If malicious, this could compromise system integrity, lead to unauthorized access, or facilitate lateral movement within the network. However, this detection does NOT confirm that an attacker is present, as legitimate administrative use of the RemotePulse tooling could trigger the same alert.

  ### Investigation Steps

  - **Verify detected file activity:** Review Windows file event logs (Event ID 4663) specific to the RemotePulse files: `InstallCore.exe`, `agent.ps1`, `defender-exclude.ps1`, `install.ps1`, and `install.cmd`. Check for unusual timestamps or patterns of access that deviate from normal operational hours.

  - **Assess user behavior:** Cross-reference the user account triggering the alert with Active Directory logs (Event ID 4624) to determine if the account has administrative privileges and if it typically interacts with RemotePulse. Legitimate behavior usually correlates with expected administrative user patterns.

  - **Identify high-confidence malicious indicators:** Investigate process creation logs (Sysmon Event ID 1) to see if any detected file was executed and the process tree associated with it. Look for parent-child relationships that indicate unusual command executions or script initiation.

  - **Check for prior incidents:** Examine any previous instances of RemotePulse activity by reviewing the timeline of alerts related to this tool. Frequent alerts may indicate misuse or compromise versus single alerts that could indicate legitimate use.

  - **Validate executive intent:** Establish whether the detected activity corresponds with documented IT or administrative tasks that commonly use RemotePulse. If the execution context lacks legitimate context, escalate the alert.

  - **Review alert context:** Use SIEM tools to correlate additional telemetry sources (e.g., network logs) around the time of the alert to identify external connections or data exfiltration attempts that may support suspicious behavior.

  ### Prioritization

  This alert has a medium severity level due to the potential risk of the affected system being compromised through unauthorized remote access. The likelihood of malicious abuse is moderate, given that tools like RemotePulse are often weaponized for lateral movement. This behavior is not uncommon in targeted attacks involving remote management systems.

  ### Blind Spots and Assumptions

  Detection limitations include the fact that legitimate use of RemotePulse may trigger similar alerts, necessitating further context for accurate interpretation. Required log sources must include comprehensive file activity monitoring alongside execution and access logs for effective coverage. Legitimate administrative activities could include scheduled updates or system maintenance tasks that utilize RemotePulse. Related detections could include alerts for unusual command-line activities involving PowerShell or other administrative scripts that may indicate misuse.

