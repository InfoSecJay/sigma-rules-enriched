note: |
  ### Technical Context

  This Sigma rule detects file activities associated with the RemotePulse Remote Monitoring and Management (RMM) tool. Specifically, it identifies access or modifications to critical files used by RemotePulse, which could indicate malicious use or unauthorized access, such as remote control or monitoring of systems. The likely attacker objective would be to leverage RMM capabilities to maintain persistence or execute commands on compromised systems. The relevant MITRE ATT&CK tactic is **Command and Control (TA0011)**, specifically the technique **Remote Desktop Protocol (T1219)**.

  The primary telemetry sources for this detection are Windows file event logs that capture file access and manipulation activities (e.g., Security Event ID 4663). If this activity is indeed malicious, it could lead to significant security impacts, including unauthorized access to sensitive data or control over critical systems. This detection does not confirm malicious behavior on its own, as legitimate use of RemotePulse by authorized personnel could trigger similar alerts.

  ### Investigation Steps

  - **Check file access events:** Review Windows Security Event ID 4663 for the specified RemotePulse files. Compare timestamps against user activity to determine legitimacy. Look for access by non-administrative accounts as malicious indicators.

  - **Validate user account activity:** Cross-reference the user's account with recent logins or active sessions in the environment. Legitimate users should have a traceable need for the access. Look for any accounts lacking administrative roles accessing these files.

  - **Review process creation logs:** Investigate Windows Security Event ID 4688 for process creation events related to `InstallCore.exe`, `agent.ps1`, or any other RemotePulse binaries. Look for suspicious command-line arguments indicative of unauthorized script execution.

  - **Identify unusual execution contexts:** Examine Sysmon Event ID 1 to capture process creation, including parent-child relationships. Assess if any of the detected processes are spawned from unusual parent processes or by privileged processes that could indicate malicious intentions.

  - **Correlate with external threat intelligence:** Conduct searches against threat intelligence repositories to determine if the identified file names or user behaviors are associated with known malware or threat actor tactics.

  ### Prioritization

  This alert has a medium severity due to the sensitive nature of RMM tools, which, if exploited, could lead to substantial operational and data security risks. The likelihood of malicious abuse is moderate, as RMM tools are often weaponized by adversaries to facilitate ongoing access and control over IT environments, yet many organizations use them legitimately.

  ### Blind Spots and Assumptions

  This detection may be bypassed by using legitimate access methods or through the use of benign file names that do not match the specified patterns. It requires that Windows auditing is enabled for file access events. Legitimate use of RemotePulse by IT staff may trigger this alert frequently. A related detection includes monitoring for `Remote Desktop Protocol` connections that may indicate concurrent use of RMM tools for remote access.

