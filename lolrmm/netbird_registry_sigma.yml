  ### Technical Context

  This Sigma rule detects registry modifications associated with the NetBird remote monitoring and management (RMM) tool. The likely attacker objective involves establishing persistence or command-and-control (C2) capabilities on a compromised host. This behavior aligns with the MITRE ATT&CK technique for Command and Control (T1219) and the associated tactic of Command and Control.

  The primary telemetry source is Windows registry event logs, specifically focusing on modifications targeting certain registry paths: `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList\user` and `HKLM\SYSTEM\CurrentControlSet\Services\Netbird`. If malicious, such activities may indicate a malicious actor's attempt to create backdoor access into enterprise environments. However, it is important to note that this detection alone does not confirm an active compromise; legitimate use of the NetBird tool may trigger the same alerts.

  ### Investigation Steps

  - **Examine registry event logs:** Review Windows registry event logs (Event ID 4657) for modifications to `HKLM\SYSTEM\CurrentControlSet\Services\Netbird` and `UserList\user`. Look for successful changes made around unusual times or following a security incident.

  - **Validate legitimate NetBird use:** Cross-check against an authorized asset inventory for any pre-approved usage of the NetBird tool. Confirm users associated with the changes have legitimate reasons to access the RMM.

  - **Check for additional Windows events:** Investigate related Security Event ID 4688 (process creation) for any executables that may be launching in conjunction with registry modifications. Focus on process execution paths that are uncommon or unexpected.

  - **Identify unusual user behavior:** Review user activity logs (Event ID 4624) to pinpoint logins around the time of registry changes. Detect any accounts that lack proper authorization or that display abnormal login patterns.

  - **Corroborate associated artifacts:** Look for signs of external access such as network connections to known bad IP addresses in firewall logs. This includes uncharacteristic outbound traffic that could indicate C2 communications.

  ### Prioritization

  This alert has medium severity due to the potential impact of the affected system if compromised, as it may serve as an entry point for further exploitation. The likelihood of malicious abuse is moderate since the behavior can be easily mimicked by legitimate software installations, yet is weaponized by adversaries looking to maintain persistent access.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate activity triggering the alert, as authorized use of NetBird may result in similar registry modifications. Reliable detection requires proper configuration of Windows registry event logging and auditing settings. Additionally, benign network traffic from legitimate RMM tools may also mimic malicious signatures. A related detection for comprehensive coverage could be the monitoring of outbound network connections utilizing the `Event ID 5156` for Windows Filtering Platform events, which could indicate unauthorized data exfiltration attempts.

