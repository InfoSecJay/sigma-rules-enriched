note: |
  ### Technical Context

  This Sigma rule detects potential registry modifications associated with the NetBird remote monitoring and management (RMM) tool, specifically targeting the creation of user accounts and service configurations. Attackers may seek to establish persistence on compromised systems by using NetBird to maintain control over devices after initial exploitation. This behavior is relevant to the MITRE ATT&CK technique for Execution (T1219), which relates to executing remote scripts or commands on compromised hosts.

  The primary telemetry sources include Windows registry event logs, particularly focusing on modifications to key locations like `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList\user` and `HKLM\SYSTEM\CurrentControlSet\Services\Netbird`. If malicious, the use of this tool could indicate an advanced persistent threat attempting to maintain a foothold within the environment. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate use of the NetBird tool may trigger the same alerts.

  ### Investigation Steps

  - **Examine the registry changes: ** Review Windows Security Event ID 4657 for Registry Modification, focusing on the aforementioned keys. Look for creation timestamps and user accounts that appear suspicious or unfamiliar.

  - **Identify user account changes: ** Check the `UserList` registry key in the User Account Control (UAC) settings for any anomalous user entries that do not align with organizational policy or standard naming conventions.

  - **Validate service configurations: ** Investigate Windows Event ID 7045 for service installation events, specifically related to the Netbird service. Confirm whether the service was installed by trusted systems admin accounts or unexpected users.

  - **Review legitimate NetBird usage: ** Confirm if NetBird configurations are known and documented within your organization. Look for expected IP ranges, user accounts typically associated with the tool, and past deployments to determine if this is expected behavior.

  - **Analyze network traffic patterns: ** Explore network logs for traffic to the known NetBird communication endpoints or IP addresses. Look for unusual outbound connections over TCP or UDP that correlate with registry changes detected.

  ### Prioritization

  Alerts indicating potential NetBird registry activity should be treated with medium severity due to the critical nature of systems potentially affected. The likelihood of malicious abuse is significant, given the tool's use for RMM and the tendency of threat actors to utilize such tools for persistence. Although this behavior may occur legitimately, it is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of proper audit policies; ensure registry auditing is enabled to capture relevant events effectively. Evasion techniques could include modifications by attackers directly after initial exploitation, avoiding traces. Legitimate activity exists where internal teams may deploy NetBird for business operations; confirming the deployment context through asset inventories is essential. Companion detections like monitoring for unusual process creations (e.g., Event ID 4688) can help paint a complete picture of the activity and enhance overall security posture.

