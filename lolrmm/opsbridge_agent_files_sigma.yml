note: |
  ### Technical Context

  This Sigma rule detects file activity related to the OpsBridge Agent Remote Monitoring and Management (RMM) tool, specifically when certain files associated with the tool are created, modified, or accessed. The likely attacker objective is to leverage the management capabilities of the OpsBridge Agent to communicate with compromised systems or to conduct malicious activities under the guise of legitimate operations. This detection correlates with the MITRE ATT&CK technique for Remote File Copy (T1219) within the command-and-control (C2) tactic.

  The primary telemetry sources include Windows file event logs, specifically monitoring for changes to files located in 'C:\Program Files\OpsBridge\' and 'C:\ProgramData\OpsBridge\'. A potential security impact is the risk of unauthorized access or remote control over systems that could lead to data breaches or service disruptions if the OpsBridge Agent is misused. It is essential to note that this detection does NOT, on its own, confirm malicious activity, as legitimate use of the OpsBridge Agent could trigger the rule.

  ### Investigation Steps

  - **Review file activity logs**: Check Windows Security Event ID 4663 for operations involving the targeted files ('OpsBridgeAgent.exe', 'agent_state.json', etc.). Note the User SID and Compare against legitimate service accounts or users authorized to manage the OpsBridge Agent.

  - **Verify process execution**: Inspect Sysmon Event ID 1 to identify if 'OpsBridgeAgent.exe' was executed. Confirm the command line parameters for known benign behaviors. Be cautious of unusual parameters or unexpected parent processes which can indicate malicious intent.

  - **Examine task scheduler entries**: Check for tasks related to 'OpsBridge Agent' in the Task Scheduler (Event ID 106) to assess what operations are scheduled. Ensure these entries align with standard operating procedures for the agent’s use.

  - **Identify anomalies in log files**: Review 'C:\ProgramData\OpsBridge\agent.log' and 'install.log'. Look for sudden, unexpected entries or rapid, repeated log outputs that may indicate automated or scripted tampering.

  - **Analyze network activity**: Correlate any detected file activity with network traffic logs (e.g., DNS queries, firewall logs) to identify outbound calls made by the OpsBridge Agent. Look for unusual destinations or data transfer volumes which can signal a potential exfiltration attempt.

  - **Assess legitimate usage patterns**: Compile historical data on normal usage timelines for the OpsBridge Agent to establish a baseline. This includes acceptable timeframes for file modifications or accesses, and user activity that aligns with maintenance such as updates or automated monitoring.

  ### Prioritization

  This alert is considered medium severity due to the potential impact on affected systems used for IT management and operations. The likelihood of malicious abuse is moderate, especially if the environment uses OpsBridge Agents widely, as threat actors may exploit these tools for unauthorized access. While this behavior is not commonly weaponized, it can be concerning if observed out of context with organizational policies.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate usage of the OpsBridge Agent, which can trigger false positives. Reliable detection requires comprehensive logging of file system events and access, specifically ensuring that all relevant logs for the specified file paths are being collected. Legitimate activities that may trigger the alert include routine updates or changes performed by system administrators during maintenance periods. A related detection to reinforce coverage could involve monitoring unauthorized installations of remote management tools or other executable files in critical directories.

