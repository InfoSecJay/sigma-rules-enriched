note: |
  ### Technical Context

  This Sigma rule detects network connections to Domotz-related domains, which indicate potential use of the Domotz Remote Monitoring and Management (RMM) tool. The primary objective for an attacker could be to establish command and control (C2) over the compromised system, facilitating remote access and management for malicious purposes. The relevant MITRE ATT&CK tactics and techniques include Command and Control (TA0011) and Application Layer Protocol (T1219).

  The primary telemetry source for this detection is network connection logs from Windows, specifically monitoring for outbound connections to specified Domotz domains. If malicious, this activity could enable unauthorized remote control of systems, leading to data breaches or increased persistence within a network. Importantly, this detection alone does not confirm malicious activity, as legitimate use of the Domotz tool for remote management can result in similar network activity.

  ### Investigation Steps

  - **Check for recent high-risk access attempts:** Review Windows Security Event ID 4624 for successful logon events to the affected device around the same time as the detected network connection. Look for logons from unusual accounts or locations.

  - **Validate the source of the connection:** Cross-reference the network connection logs (Event ID 5156 and 5158) against known good instances of Domotz usage. Confirm previous legitimate traffic to these domains to assess normal operating parameters.

  - **Identify associated processes:** Check for process creation (Event ID 4688) that correspond to the detected network connections involving Domotz. Suspicious processes that were spawned around the same timeframe may indicate malicious intent.

  - **Analyze DNS query logs:** Obtain DNS query logs (Event ID 4663 or whichever logs capture DNS resolution) for any resolutions to the detected Domotz domains. Legitimate systems might show consistent internal hostnames, whereas malicious instances may show erratic or unknown names.

  - **Investigate data exfiltration patterns:** If the host is a sensitive environment, validate telemetry for large outbound data transfers (Event ID 5156) occurring before or during the network connection. Look for unusual file sizes or types that could indicate data exfiltration.

  ### Prioritization

  This alert should be treated as medium severity due to the sensitive nature of remote management tools like Domotz. While the impact of a successful compromise could be significant, this behavior is not commonly weaponized; however, it should not be dismissed without further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of Domotz, potentially generating false positives. Continuous monitoring for Domotz employment across the enterprise is required; be aware of any network configuration changes that might obstruct relevant telemetry. Companion detections may include alerts from endpoint detection solutions for remote access tool usage or abnormal process execution related to these DNS queries.

