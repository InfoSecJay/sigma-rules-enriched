note: |
  ### Technical Context
  This detection rule identifies potential network activity associated with the Domotz Remote Monitoring and Management (RMM) tool. Domotz is typically used for remote access and management of devices, primarily in enterprise environments, allowing IT teams to monitor, control, and troubleshoot systems remotely. However, its use by unauthorized individuals may indicate a nefarious attempt to gain control over a target environment, potentially aligning with various stages of an attack, from network reconnaissance to exploitation.

  The threat scenario involves an attacker leveraging the capabilities of the Domotz RMM tool to gain persistence or control over compromised devices within a network. Objectives may include data exfiltration, lateral movement, or even deploying additional malware. Understanding such tools' legitimate and malicious use cases is critical for effective incident response. Relevant MITRE ATT&CK tactics and techniques include "Execution" (TA0002) and "Remote Services" (T1219), as they encompass the remote execution of commands via authorized administrative tools.

  Primary data sources for this detection rule include network connection logs that capture attempts to connect to or establish sessions with the domains associated with Domotz. Monitoring these logs is crucial to differentiate between legitimate administrative activities and unauthorized access attempts.

  ### Investigation Steps
  - **Review Network Logs:** Examine network connection logs for outbound connections to *.domotz.co and domotz.com, looking for patterns indicative of unauthorized use of the RMM tool.
  - **Correlate with User Activity:** Cross-reference the network activity with user login records to determine if the connections align with legitimate administrative activity or if they appear anomalous.
  - **Analyze Traffic Patterns:** Investigate the frequency and timing of connections to the detected domains. High-frequency or off-hours access may suggest malicious intent.
  - **Inspect Running Processes:** Check for the presence of the Domotz agent or related processes running on endpoints. Confirm whether these processes are used for legitimate purposes within your environment.

  ### Prioritization
  Given the medium severity of this alert, potential unauthorized use of the Domotz RMM tool poses significant risks, particularly if it could lead to unauthorized system access or data compromise. Effective prioritization of this alert is crucial to ensure swift investigation and response, considering the likelihood of exploitation if used by malicious actors.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of the Domotz tool in use, particularly if configurations or domain names change. An assumption made is that any connections to the specified domains are indicative of potential threats; however, legitimate administrative use may exist. For this alert to function effectively, comprehensive network connection logs must be enabled, ensuring that all outgoing and incoming connections to potentially malicious domains are recorded and analyzed.

