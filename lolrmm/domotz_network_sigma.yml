note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to known Domotz Remote Management and Monitoring (RMM) service domains. The behavior likely indicates an attacker leveraging the Domotz tool to facilitate remote management, potentially as part of an initial access phase or for persistence. The relevant MITRE ATT&CK tactic and technique is Execution (TA0002) and Remote Services (T1219). Primary telemetry sources include network connection logs from Windows systems, particularly events capturing outbound connections to the specified domains.

  If the detected activity is malicious, it could allow unauthorized control or monitoring of the affected system, facilitating further exploitation or lateral movement in the environment. However, this detection does NOT confirm malicious intent on its own, as legitimate usage of Domotz for remote management can trigger the same alerts.

  ### Investigation Steps

  - **Examine network connections:** Check network connection logs for Event ID 5156 (Windows Filtering Platform) and confirm if any are targeting `*.domotz.co` or `*.domotz.com`. Look for unusually large numbers of these requests, especially from non-admin user accounts.

  - **Identify running processes:** Review the processes on the host using Sysinternals or Task Manager to identify any instances of legitimate or unauthorized Domotz services. Legitimate use will typically show an executable related to Domotz running under the System or Administrative users.

  - **Validate recent changes:** Check for any recent policy or software installation changes, particularly regarding RMM tools. Review Windows Event Logs (Event ID 1033) for updates or installations referencing Domotz.

  - **Correlate with user activity:** Investigate user activity logs for accounts that initiated the connection, analyzing logins (Event ID 4624) and determining if their behavior aligns with legitimate remote support requests.

  - **Check for known security incidents:** Utilize threat intelligence sources to check if the associated IP addresses or confirmed command-and-control traffic matches any current active threats or previously reported attacks.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on sensitive systems if exploited by malicious actors. The likelihood of malicious abuse ties directly to the increasing use of RMM tools in both legitimate and illicit activities. Given that RMM tools are commonly weaponized, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques, such as adversaries using legitimate credentials for Domotz or employing alternative DNS services to mask the traffic. An appropriate log configuration is essential, particularly ensuring that outbound connection logs are comprehensive for effective detection. Legitimate activities that might trigger this alert include authorized remote management sessions by IT support staff. Companion detections may include monitoring for anomalous user behavior associated with the accounts connecting to these domains, enhancing overall threat visibility.

