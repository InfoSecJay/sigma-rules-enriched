  ---

  ### Technical Context

  This detection targets network activity indicative of the Domotz Remote Monitoring and Management (RMM) tool. The presence of specific outbound connections to known Domotz domains may indicate unauthorized use of the tool, typically employed for remote access and management of devices within a network. In an attack lifecycle context, this behavior falls under the Execution tactic, specifically technique T1219 (Remote Access Tools).

  Primary telemetry sources include Windows network connection logs that capture outbound connection attempts. If this activity is malicious, it may facilitate unauthorized access to sensitive systems. Importantly, this detection alone does not confirm malicious intent; it may also signal legitimate use of Domotz by authorized personnel.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Check Windows event logs for network connection events (Event ID 5156) showing connections to *.domotz.co, domotz.com, or *cell-1.domotz.com. Validate whether the connections are initiated from critical assets (e.g., servers or workstations) that require strict monitoring.

  - **Identify user account associated with the connection:** Utilize Security Event ID 4624 (Logon) to find which user account initiated the outbound connection. Investigate if the user has legitimate authorization to access or utilize the Domotz tool.

  - **Correlate with endpoint security alerts:** Cross-check any existing endpoint detection alerts that may signal unusual behavior on the asset making the connection. Look for recent suspicious activity or changes that might indicate exploitation.

  - **Determine expected legitimate behavior:** Confirm if the detected connections coincide with known operational hours and users' reported use of Domotz. Consult with IT teams to validate instances of legitimate remote management activity.

  - **Assess potential data exfiltration:** If related DNS queries or file transfer logs are available, review for any large or unusual outbound data transfers potentially indicating exfiltration via the Domotz connection.

  - **Check for patterns of repeat offenses:** Review logs for recurring connections to the identified domains, which may suggest a persistent entity attempting to leverage Domotz for ongoing remote access.

  ---

  ### Prioritization

  This alert is considered medium severity due to the potential security impact on critical systems. Although Domotz can be used legitimately, its unauthorized use represents a significant risk for lateral movement or data compromise. The behavior is less common in most environments but could be weaponized by adversaries familiar with RMM tools.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative usage of Domotz, which could trigger this alert. Required logging configurations must ensure comprehensive capture of outbound network connection events to effectively monitor for this activity. Additionally, benign legitimate tools like remote access utilities could produce similar patterns, complicating analysis. A companion detection to consider is monitoring for anomalous PowerShell usage, which frequently accompanies unauthorized remote management activity.

