note: |
  ### Technical Context

  This rule detects outbound network connections to the Domotz RMM (Remote Monitoring Management) service, commonly used for remote access and management of IT assets. The likely attacker objective is to establish command and control (C2) connections or exploit legitimate remote management tools for unauthorized remote access. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), with specific techniques being Application Layer Protocol (T1219).

  Primary telemetry sources include Windows network connection logs detailing DNS lookups and outbound connections. If malicious, this behavior can lead to a broad compromise of IT systems through unauthorized remote access. However, this detection alone does not confirm malicious intent, as legitimate usage of Domotz by administrators may trigger the same alert.

  ### Investigation Steps

  - **Check for active connections to Domotz:** Review network connection logs for Event ID 5156, specifically looking for connections to hosts matching 'domotz.com'. Ensure the connection occurs from unexpected or non-administrator user accounts.

  - **Identify associated processes:** Validate the process generating the outbound connection by correlating with Event ID 4688 to determine if it belongs to a legitimate management tool or an unknown executable, which may indicate malicious activity.

  - **Review DNS logs:** Analyze DNS query logs for entries resolving to 'domotz.com' (e.g., DNS event types showing queries for *.domotz.com). Ensure they are initiated by known and trusted hosts.

  - **Look for anomalous activity within the network:** Identify unusual network patterns such as multiple rapid connections to various Domotz endpoints, which could indicate an attacker attempting to utilize the service for lateral movement or data exfiltration.

  - **Consider asset criticality:** Assess the role of the initiating host. If it’s a server with sensitive information, the alert should be prioritized for deeper investigation compared to a non-critical workstation.

  - **Cross-check with known legitimate usage:** Reference recent asset management records to identify if a legitimate administrator has a documented need for using Domotz tools during the alert period, confirming or refuting benign behavior.

  ### Prioritization

  The medium severity of this alert is heightened by the potential impact on critical systems, as RMM tools like Domotz could be exploited for extensive breaches. The likelihood of malicious abuse is moderate given that legitimate use exists; however, the tool is often weaponized by adversaries to gain remote access, necessitating careful consideration.

  ### Blind Spots and Assumptions

  Detection may be limited by DNS tunneling techniques or the use of alternative or obfuscated domains by adversaries, which are not captured by this rule. Accurate detection relies on proper logging configurations for Windows network connection events and DNS queries. Legitimate administrative activities may frequently trigger the alert, especially in environments utilizing Domotz for remote management. A companion detection to consider is monitoring for unusual process creation (using Event ID 4688) associated with known remote access tools.

