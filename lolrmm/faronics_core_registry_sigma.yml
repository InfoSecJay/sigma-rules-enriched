note: |
  ### Technical Context

  This rule detects registry modifications related to the Faronics Core Remote Management (RMM) tool, which can indicate unauthorized or suspicious usage of this management software. The likely objective of such activity by an attacker would be to leverage administrative tools for remote access or maintaining persistence on compromised systems. This behavior aligns with the MITRE ATT&CK technique of "Remote Services" (T1219).

  Primary telemetry sources for this detection include Windows registry event logs capturing changes to specific registry keys associated with Faronics Core. If this behavior is malicious, it can lead to unauthorized access to system management functionalities and potentially compromise system integrity. Importantly, this detection does NOT confirm that malicious activity has occurred without additional context and corroborating evidence.

  ### Investigation Steps

  - **Review recent registry changes:** Check for Event ID 4657 in Windows Security logs to identify specific changes made to keys under 'HKLM\SYSTEM\CurrentControlSet\Services\FaronicsCoreAgent' or related Faronics keys.

  - **Cross-reference application usage:** Investigate usage logs for legitimate installations of the Faronics Core RMM tool. Use logs from the software deployment tool or systems management platform to determine whether the tool is registered and properly configured on the affected hosts.

  - **Identify suspicious process activity:** Look for processes spawned from the FaronicsCoreAgent registry key using Sysmon Event ID 1 to identify if any execution is occurring from these registry entries, which may indicate malicious usage of the tool.

  - **Validate multi-user activity:** Review corresponding Event ID 4624 (logon) records to see if unusual user accounts are accessing the systems. Verify accounts which do not typically utilize the Faronics RMM tool for expected operational tasks.

  - **Examine communication traffic:** Inspect network traffic logs for the Faronics Core agent connections (using protocols like HTTPS and TCP/UDP) to detect any anomalous external communication indicative of exfiltration or remote command execution.

  ### Prioritization

  The alert severity is medium, as unauthorized alterations to registry entries for management tools can pose significant security risks, particularly on critical systems comprising sensitive data or operational controls. While the use of remote management tools can sometimes be legitimate, their abuse is a known tactic among adversaries, necessitating careful scrutiny.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative activity might trigger this alert if Faronics Core is used according to its intended purpose. Additionally, missed detections may occur if logging is not sufficiently comprehensive, particularly if registry auditing isn't enabled. Related detections, such as anomalous user access logs or alerts for privileged account usage, can help enhance overall monitoring of potential misused administrative tools.

