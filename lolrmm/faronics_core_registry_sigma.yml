note: |
  ### Technical Context

  This Sigma rule detects registry modifications associated with the Faronics Core RMM (Remote Monitoring and Management) tool. Such behavior may indicate an attempt by an attacker to leverage the legitimate RMM capabilities, which can provide extensive control over managed devices. The likely attacker objective could be to establish persistence or to control endpoints for further malicious activities.

  This detection aligns with the MITRE ATT&CK tactics of Command and Control (ID: TA0011) and Persistence (ID: T1219). The primary telemetry sources for this detection are Windows registry event logs, particularly those that track modifications to specified keys linked to Faronics Core. If malicious, this behavior could facilitate unauthorized access to systems and sensitive information. However, this detection does NOT confirm malicious intent by itself, as the Faronics Core tool may be used legitimately in the environment.

  ### Investigation Steps

  - **Review recent registry changes:** Check for Event IDs related to registry changes (e.g., Event ID 4657 or Sysmon Event ID 13) around the same time as the alert. Look for alterations to 'HKLM\SYSTEM\CurrentControlSet\Services\FaronicsCoreAgent' and similar paths to assess if they correlate with expected administrative deployments.

  - **Evaluate user behavior:** Identify the account associated with the registry modifications. Compare against known admin or IT personnel. Legitimate activity typically involves registered IT personnel making these changes as part of system management.

  - **Cross-reference process activity:** Investigate processes spawned around the time of registry changes using Sysmon Event ID 1. Focus on process creation related to Faronics Core functions; legitimate processes should originate from expected paths such as C:\Program Files\Faronics\.

  - **Check for system task scheduling:** Examine Task Scheduler for any unexpected tasks related to Faronics. Utilize Event ID 4698 to see task creation events. Legitimate tasks will often have clear descriptions and be linked to known management schedules.

  - **Identify network activity:** Review network logs, such as Windows Firewall events (Event ID 5156), related to outbound connections resulting from Faronics Core. Look for connections to known management servers which should align with normal operational patterns.

  ### Prioritization

  This alert signals medium severity given the risk associated with unauthorized control over managed systems. The use of RMM tools is attractive to adversaries for exploitation, and such activity is commonly weaponized when linked to persistence mechanisms.

  ### Blind Spots and Assumptions

  While this detection indicates registry access, it does not account for other legitimate administrative activities that may trigger similar alerts. Adversaries may employ techniques to obscure their actions, such as altering timestamps or using encrypted communications. Required log sources include correct configuration of Windows registry monitoring. A related detection to consider is monitoring for unusual outbound connections from services associated with the Faronics Core Agent, which can help verify unauthorized use of the tool.

