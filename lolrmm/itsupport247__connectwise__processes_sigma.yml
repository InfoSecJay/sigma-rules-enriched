  ---

  ### Technical Context

  This Sigma rule detects activity associated with the ITSupport247 (ConnectWise) remote monitoring and management (RMM) tool by identifying processes created with the parent image `saazapsc.exe`. The likely objective of an attacker exploiting this tool would be to maintain unauthorized access, conduct surveillance, or manipulate systems under the guise of legitimate IT support functions. This detection aligns with the MITRE ATT&CK technique "Remote Service Session Enumeration" (T1219).

  The primary telemetry for this detection comes from Windows process creation logs, specifically focusing on Event ID 4688 for system process creation and related Sysmon Event ID 1. If malicious, the usage of this tool could lead to unauthorized system changes or data exfiltration. However, detection of this process alone does not confirm malicious intent, as it may also indicate legitimate administrative activity.

  ---

  ### Investigation Steps

  - **Review process creation logs: **Check Event ID 4688 for entries where the `Image` field ends with `saazapsc.exe`. Look for associated parent processes to identify potential misuse.

  - **Validate parent process legitimacy: **Confirm that the parent process (`saazapsc.exe`) is expected in your environment. Typical legitimate uses will show interaction with `msiexec.exe` or similar installer processes.

  - **Assess user context: **Investigate the user account associated with the process creation. Legitimate activity will often involve IT staff; any suspicious or non-IT personnel executing this tool should be flagged.

  - **Correlate with external sources: **Check for known malicious indicators associated with ITSupport247 usage, such as signatures or IP addresses linked to previous compromises.

  - **Monitor for credential dumping: **Observe any correlating events related to credential access or manipulation from the user associated with the `saazapsc.exe` execution, as malicious actors may attempt to gather authentication info.

  - **Analyze network activity: **Inspect outbound connection logs for unusual traffic patterns or communications with known bad IPs linked to ConnectWise tools, as unauthorized access attempts often involve remote connections.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential risk associated with RMM tools, which, if exploited, can lead to significant system compromise. There is a plausible likelihood of abuse since RMM tools are frequently weaponized by adversaries to gain unauthorized access and conduct lateral movements within networks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of ITSupport247 for maintenance tasks, potentially leading to false positives. Ensuring comprehensive logging (e.g., enabling detailed process creation logs and Sysmon) is crucial for reliable detection. Routine administrative activities such as software updates or legitimate support sessions by IT personnel might trigger the alert. A companion detection focusing on anomalous network connections from Remote Management tools would enhance coverage against misuse.

