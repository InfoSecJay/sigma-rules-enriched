  ### Technical Context

  This rule detects the execution of processes associated with the ITSupport247 (ConnectWise) Remote Monitoring and Management (RMM) tool, specifically processes that are spawned by a parent executable named `saazapsc.exe`. The likely attacker objective is to gain unauthorized access or control over endpoints using the RMM tool, often employed by adversaries in targeted attacks following initial compromise. This behavior aligns with the MITRE ATT&CK technique for remote access tools, specifically "Remote Desktop Protocol" (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, the exploitation of RMM tools poses significant security impacts by allowing unauthorized remote access to sensitive systems. However, this detection does not confirm malicious activity on its own, as the legitimate use of ITSupport247 (ConnectWise) can trigger this alert.

  ---

  ### Investigation Steps

  - **Examine process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 for occurrences of `saazapsc.exe`. Filter for execution by suspicious users or from unexpected locations, as legitimate activity would typically involve administrative accounts on managed systems.

  - **Identify parent-child relationships:** Check for instances where `saazapsc.exe` is the parent process. Analyze the process tree to confirm if other related processes are spawned, which could indicate automated lateral movement or exploratory behavior by an attacker.

  - **Verify user accounts and context:** Assess the user accounts executing the detected process. Legitimate use of ITSupport247 should originate from designated IT support personnel or during defined maintenance windows, beyond which deviations could warrant further scrutiny.

  - **Monitor network connections:** Check for outbound connections from systems running `saazapsc.exe`. Use network connection logs (e.g., Windows Firewall or Sysmon Network Event ID 3) to look for unusual external IP addresses or high-volume communication, which may signal data exfiltration attempts.

  - **Evaluate system role and criticality:** Determine if the affected system is critical (e.g., servers hosting sensitive applications). Higher-risk systems require immediate investigation to prevent potential exploitation.

  - **Investigate for file creation or modification:** Identify any new executables or scripts created by `saazapsc.exe` in system directories or user folders. Sysmon File Create events (ID 11) should be monitored for potentially malicious payloads or backdoors installed during the RMM session.

  ---

  ### Prioritization

  This alert is medium severity in an enterprise context. Systems using RMM tools like ITSupport247 are often critical for operations, which increasing the risk if misused. The likelihood of malicious abuse is moderate, as adversaries may leverage these tools for lateral movement and persistence in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative use of RMM tools, which can result in false positives. Reliable detection requires appropriate logging configurations for process creation and Sysmon events. Legitimate activities such as scheduled maintenance by IT staff could trigger this alert. A related detection to consider is monitoring for unauthorized installation of software (e.g., via installation logs), which may indicate an attacker setting up an RMM tool without permission.

