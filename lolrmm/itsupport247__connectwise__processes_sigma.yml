note: |
  ### Technical Context
  This rule is designed to detect the execution of the ITSupport247 Remote Monitoring and Management (RMM) tool, which can be associated with remote administration or support activities. The presence of this tool may indicate either legitimate IT operations or potentially unauthorized access to systems if used by malicious actors. Attackers may leverage such tools to maintain persistence, remotely access sensitive information, or execute additional malicious software under the guise of legitimate IT support.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) for initiating the tool and specifically **Remote Service Session Hijacking** (T1219), which encompasses methods for initiating remote connections to systems ostensibly for support purposes. Primary data sources for detection include Windows process creation logs, which detail the execution of processes and their parent processes, offering insights into suspicious activity patterns.

  ### Investigation Steps
  - **Review Process Creation Events**: Collect and analyze process creation events from Windows logs to identify instances of `saazapsc.exe`. Focus on the times and accounts associated with these process executions.
  - **Analyze Parent Process Relationships**: Investigate any process instances of `saazapsc.exe` to determine their parent processes, ensuring that legitimate system processes aren’t inadvertently flagged.
  - **Evaluate Network Activity**: Examine network traffic logs for unusual external connections initiated by `saazapsc.exe`. Look for any communications that may indicate clandestine remote access or data exfiltration efforts.
  - **Check User Context**: Identify the user accounts executing `saazapsc.exe`. Determine if these accounts have legitimate reasons to run the tool and verify any associated user behavior for signs of compromise.

  ### Prioritization
  The alert is deemed medium severity due to the potential for significant impact if the RMM tool is misused for unauthorized access. While legitimate use is common in enterprise environments, any unexpected or unrecognized execution warrants further investigation, especially in sensitive areas.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the RMM tool is executed from different or obfuscated filenames or directories, bypassing this specific detection logic. The rule assumes that all instances of `saazapsc.exe` are legitimate unless proven otherwise; however, a skilled attacker might disguise their tools effectively. Additionally, logging configurations must be properly set to capture all relevant process creation events for the detection to be fully operational.

