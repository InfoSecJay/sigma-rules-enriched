  ### Technical Context

  This Sigma rule detects processes spawned by the ITSupport247 (ConnectWise) RMM tool, specifically looking for instances where the executable `saazapsc.exe` is involved. Attackers may utilize this tool for remote management and exploitation of systems, enabling them to perform unauthorized actions remotely. This detection aligns with the MITRE ATT&CK framework under the tactics of Command and Control (T1219), which involves utilizing external remote services for malicious purposes.

  The primary telemetry source for this detection is Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1 to capture process execution events. If malicious, this could indicate unauthorized remote access or exploitation of systems using legitimate-looking tools. Importantly, this detection does NOT confirm that any malicious activity has occurred on its own; further investigation is necessary to determine intent and context.

  ### Investigation Steps

  - **Check process details:** Review Security Event ID 4688 or Sysmon Event ID 1 logs. Look for parent process information that corresponds with `saazapsc.exe`. Legitimate activities should typically be associated with known user processes on endpoints, not automated or unexpected launches.

  - **Evaluate system criticality:** Identify the criticality of affected systems. If the process is executed on administrative servers or sensitive assets, prioritize the investigation higher, as this could indicate potential compromise.

  - **Examine user context:** Analyze the user account associated with the event. Investigate unusual login patterns, privileges, or accounts that are not typically associated with RMM tool usage.

  - **Cross-validate with parent process:** Identify the parent process (e.g., `saazapsc.exe`) for all child processes and check their legitimacy. Malicious activity may indicate that this parent process was executed illegitimately or in an unexpected context.

  - **Search for network activity:** Review firewall logs or network appliances for outbound connections from affected systems that are utilizing the RMM tool. Look for connections to known malicious IP addresses or domains associated with remote access tools.

  - **Assess for known vulnerabilities:** Scrutinize the affected host with tools or scripts to search for known exploits related to ITSupport247 (ConnectWise) RMM tools. Confirm if any actions corresponding with this alert align with CVEs that could indicate exploitation attempts.

  ### Prioritization

  This alert has medium severity due to potential risk, particularly if observed in critical infrastructure systems. The likelihood of malicious abuse is moderate, as RMM tools like ITSupport247 are often leveraged in attacks but may also represent legitimate administrative access. Awareness of this behavior is essential due to its common use in real-world targeted attacks.

  ### Blind Spots and Assumptions

  The detection may be bypassed if attackers obfuscate the process name or use alternate methods of execution. Reliable detection depends on having Security Event ID 4688 and Sysmon configured correctly to capture all relevant process creation activities. Legitimate administrative functions by IT support staff utilizing the RMM tool may trigger this alert, leading to false positives. Companion detections could include monitoring for suspicious network traffic indicative of command and control communications directly following remote management tool usage.

