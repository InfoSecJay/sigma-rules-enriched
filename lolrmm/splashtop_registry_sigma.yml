note: |
  ### Technical Context

  This detection rule identifies registry activity associated with the Splashtop Remote Management (RMM) tool. The likely attacker objective includes remote access, control of systems, and potential data exfiltration, aligning with MITRE ATT&CK tactic "Execution" (TA0002) and technique "Remote Services" (T1219). Primary telemetry sources include Windows registry event logs, focusing specifically on paths related to Splashtop installations and configurations. Malicious activity could lead to unauthorized remote access, compromising system integrity and confidentiality. Importantly, this detection does NOT confirm malicious intent on its own since legitimate organizational use of Splashtop exists.

  ### Investigation Steps

  - **Check registry entries for Splashtop activity:** Review Windows Registry Event ID 4657, focusing on the following paths: `HKLM\SOFTWARE\WOW6432Node\Splashtop Inc.\*`, `HKLM\SYSTEM\CurrentControlSet\Services\SplashtopRemoteService`, and `HKU\S-1-5-18\Software\Splashtop Inc.\*`. Verify if changes are consistent with expected configurations for organizational use.

  - **Validate process activity:** Examine Event ID 4688 (Process Creation) for the following: executable paths related to Splashtop (e.g., `SplashtopStreamer.exe`). Compare parent processes to identify potentially malicious execution chains versus legitimate user actions.

  - **Review logon events:** Investigate Event ID 4624 for abnormal account usage or logons associated with Splashtop usage, specifically focusing on accounts that do not typically access remote tools.

  - **Identify unauthorized service installations:** Inspect Event ID 7045 (Service Installed) for installations of `SplashtopRemoteService`. Check the timestamp of the installation against known deployment schedules to identify anomalous installation patterns.

  - **Look for abnormal network connections:** Analyze network logs for outbound connections associated with Splashtop applications. Review source IPs, destination IPs, and ports to distinguish between legitimate internal activity and suspicious remote access attempts.

  ### Prioritization

  The severity of this alert is medium based on the potential impact on sensitive systems managed by Splashtop, which could facilitate unauthorized access. While the likelihood of malicious abuse depends on the context of use within the organization, this behavior is often weaponized by attackers seeking remote control over compromised systems.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as attackers configuring the tool to use benign or legitimate-looking registry values. Required log sources for reliable detection include comprehensive logging of Windows registry events to capture all related activities. Additionally, legitimate organizational practices with Splashtop may frequently trigger these alerts. Companion detections, such as monitoring unusual network activity (e.g., abnormal outbound traffic to remote endpoints), can strengthen overall coverage against unauthorized use of remote management tools.

