note: |
  ### Technical Context

  This Sigma rule detects activity related to the Splashtop Remote Management (RMM) tool, including registry modifications potentially indicative of the installation or configuration of Splashtop services on Windows systems. The likely attacker objective is establishing remote access for malicious operations, thus facilitating data exfiltration or lateral movement within the network. The relevant MITRE ATT&CK tactic is Command and Control, specifically technique T1219 (Remote Access Software).

  Primary telemetry sources are Windows registry events logged in the Security Event Logs and Sysmon logs, particularly focusing on modifications to specific keys associated with Splashtop services. If this behavior is malicious, it can compromise the confidentiality and integrity of sensitive data and systems. However, it's important to note that this detection does not confirm active compromise on its own; legitimate usage of Splashtop by authorized personnel may trigger similar alerts.

  ### Investigation Steps

  - **Analyze registry modifications for Splashtop keys:** Review Security Event ID 4657 logs for changes to registry paths including `HKLM\SOFTWARE\WOW6432Node\Splashtop Inc.\*` and `HKLM\SYSTEM\CurrentControlSet\Services\SplashtopRemoteService`. Look for an unexpected installation or configuration without prior knowledge or documentation.

  - **Check for he unique identifiers and timestamps:** Investigate Event IDs 4657 and 4663 to correlate any changes against known installation times and authorized personnel. Unexpected registry changes made outside authorized hours may indicate malicious usage.

  - **Verify current active sessions:** For systems flagged by the detection, use `Get-Process` or Task Manager to identify running instances of Splashtop software (e.g., "Splashtop Streamer"). Benign use will typically show authorized personnel using the software and correlating logged usage times.

  - **Identify service status:** Look at the status of services via `Get-Service` to check for `SplashtopRemoteService`. An active service with unexpected recent registry changes may indicate unauthorized persistence mechanisms.

  - **Corroborate with user account activity:** Review logon events (Security Event ID 4624) to see if user accounts associated with the registry changes have been active or logged in at the time of the registry modification. Unusual account activity or multiple logins may add to situational context.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of remote access on sensitive systems. The likelihood of abuse is elevated, as Splashtop is commonly leveraged by attackers for facilitating unauthorized remote sessions. The prevalence of weaponized remote access tools further underscores the need for prioritized investigation.

  ### Blind Spots and Assumptions

  Detection might miss sophisticated evasion techniques such as renaming or modifying the legitimate Splashtop binaries to bypass scrutiny. Reliable detection requires the continuous logging of registry modifications and strict implementation of least privilege and application whitelisting policies. Legitimate administrative use of Splashtop in remote support contexts can trigger false positives. For enhanced coverage, companion detections focused on remote access connections (e.g., monitoring network traffic for known Splashtop communication patterns) can bolster the integrity of security posture regarding remote tools.

