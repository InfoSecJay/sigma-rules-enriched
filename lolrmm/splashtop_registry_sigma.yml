note: |
  ---

  ### Technical Context

  This Sigma rule detects registry activity related to the Splashtop RMM (Remote Monitoring and Management) tool, which can indicate unauthorized remote access attempts or the use of a potentially malicious tool by an adversary. The attacker’s objective may include gaining persistent access or control over a compromised system through remote access. This behavior falls under the MITRE ATT&CK framework's Execution tactic, particularly technique T1219 (Remote Access Software).

  The primary telemetry source for this detection includes Windows registry events indicating modifications or access to specific keys associated with Splashtop. If malicious, the security impact could be significant, allowing an attacker to conduct remote operations undetected. This detection does NOT confirm malicious intent solely on its own; it may also trigger from legitimate usage of the Splashtop application.

  ---

  ### Investigation Steps

  - **Verify registry access activity:** Review Windows Event Logs (Event ID 4657, indicating a registry value change) for any modifications to the keys listed in the Sigma rule, specifically in paths such as `HKLM\SOFTWARE\WOW6432Node\Splashtop Inc.\*`.

  - **Identify authorized uses:** Check with relevant teams (IT Support, Engineering) if Splashtop is a legitimate tool in use within the organization. If confirmed, note user access patterns working with Splashtop to differentiate between authorized and suspicious activity.

  - **Analyze process creation events:** Monitor for associated process creation (Event ID 4688) that launches Splashtop binaries during or immediately following registry modifications. Look for anomalies, such as unfamiliar users initiating the process.

  - **Check for network connectivity:** Examine network logs for outbound connections to known Splashtop servers during the timeframe of registry modifications, potentially using firewall logs or a network monitoring tool with relevant indicators.

  - **Correlate across endpoints:** If alerts are triggered on multiple endpoints, assess for commonality in users or processes, indicating potential lateral movement or coordinated malicious behavior.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact of Splashtop on critical systems and the likelihood that malicious actors may misuse remote access tools. The specific behavior detected is less common in benign activities, thus also indicating elevated risk if observed.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as modifying registry paths or disguising malicious tools as legitimate entries. Reliable detection requires configured auditing of Windows registry changes and appropriate telemetry collection for effective monitoring. Legitimate activities may include system maintenance or support sessions utilizing Splashtop, complicating investigations. A related detection to consider includes monitoring for unusual outbound connections (e.g., using NetFlow or similar technology) during registry interactions.

