note: |
  ### Technical Context
  This detection rule identifies registry activity related to the Splashtop Remote Management (RMM) tool, which is often misused by attackers to gain remote access to compromised systems. Attackers leveraging Splashtop may aim to establish persistence, exfiltrate sensitive data, or facilitate further lateral movement within the network. Given its inherent capability for remote control, detecting its usage, especially in unusual contexts, can signify potential unauthorized access.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (TA0002)**: The technique utilized when executing malicious or unauthorized remote access software.
  - **Remote Access Tools (T1219)**: Indicates the use of software like Splashtop which facilitates remote connections.

  The primary data sources that contain relevant evidence for this detection include:
  - Windows Registry event logs, which record changes and access to specific registry keys associated with Splashtop.
  - System and security event logs that may also detail related process creation events.

  ### Investigation Steps
  - **Review Registry Changes**: Examine recent modifications in the Windows Registry, focusing on keys associated with the Splashtop software listed in the detection logic. Look for unusual creation or modification timestamps.
  - **Analyze Process Activity**: Investigate any processes related to Splashtop or that interact with the keystrokes, file transfers, or remote sessions. Check for uncommon parent-child relationships or atypical execution paths.
  - **Check Network Connections**: Monitor network traffic for outbound connections or unusual internal communication to IP addresses that correspond to Splashtop services. Pay attention to remote sessions initiated from unfamiliar workstations.
  - **Validate User Behavior**: Conduct a review of user accounts that invoked activities related to the Splashtop keys. Verify if they have the legitimate need for remote access tools and whether any access levels appear overly permissive.

  ### Prioritization
  The alert should be treated as medium severity due to the potential for Splashtop RMM to be used in malicious operations while also being a legitimate tool within the organization. The context of usage is critical; thus, understanding whether the activity correlates with expected business processes is essential.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to legitimate instances of Splashtop being used for remote administration, as this may lead to false positives. The detection logic assumes that any activity related to the specified registry keys is suspicious; thus, it may miss benign activities from known and trustworthy users. Additionally, this rule is reliant on comprehensive logging of Windows Registry events, which need to be correctly configured within the environment for effective monitoring.

