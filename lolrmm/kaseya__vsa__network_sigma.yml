note: |
  ### Technical Context

  This rule detects network connections to Kaseya RMM tool domains, such as `deploy01.kaseya.com`, which may indicate the usage of this remote management tool. The likely attacker objective is to exploit vulnerabilities in the Kaseya software or use it as a vector for lateral movement or command and control operations. This detection aligns with the MITRE ATT&CK tactic of Execution (TA0002) and technique of Remote Services (T1219).

  The primary telemetry sources are Windows network connection logs, specifically targeting network activity to the specified Kaseya domains. If malicious, this behavior could enable attackers to remotely control compromised systems, facilitating further exploits or data exfiltration efforts. Importantly, a connection to these domains does NOT confirm malicious intent, as legitimate use of Kaseya for IT management is common in many environments.

  ### Investigation Steps

  - **Check connection details:** Review Windows Security Event ID 5156 (Windows Filtering Platform) and correlate any outgoing connections to `deploy01.kaseya.com`, `*.managedsupport.kaseya.net`, or `*.kaseya.net`. Note the source IP, timestamp, and user context for unique indicators of compromised accounts.

  - **Validate Kaseya usage:** Confirm whether the affected host is officially using Kaseya for remote management. This typically involves checking asset inventories or IT asset management tools to identify allowed applications.

  - **Review process executions:** Examine Sysmon Event ID 1 for process creation events related to the Kaseya executables (e.g., `KaseyaAgent.exe`) to establish baseline behaviors. Compare timestamps with network connection logs to detect unusual activity patterns.

  - **Identify lateral movement:** Investigate other hosts communicating with the same Kaseya domains in quick succession. Use Windows Event ID 4672 (Special Privileges Assigned) to highlight any recent administrator account activity that may signify privilege escalation.

  - **Analyze related logs:** Look at related network activity in your firewall or proxy logs for connections to the Kaseya domains by other IPs. Malicious actors may attempt to pivot from the initial point of entry, indicated by unexpected IP ranges or unknown user agents.

  ### Prioritization

  This alert is of medium severity. While Kaseya is a legitimate tool, any unexplained or unauthorized network activity towards Kaseya’s domains warrants attention due to the potential risk of exploitation and the tool's known associations with past cyber incidents.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate Kaseya usage, so context about internal asset management is essential to avoid false positives. Ensure that Windows Filtering Platform logs are enabled for accurate detection. Additionally, consider that benign administrative activities could trigger this alert, complicating response efforts. Related detections, such as monitoring for unusual logins (Event ID 4624) or privilege escalations, can enhance the ability to identify potential malicious activity linked to Kaseya usage.

