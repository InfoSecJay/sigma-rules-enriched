note: |
  ### Technical Context

  This Sigma rule detects network activity indicative of the Kaseya (VSA) Remote Monitoring and Management (RMM) tool. Attackers may leverage Kaseya to gain remote access, deploy malware, or conduct lateral movement within a network. The relevant MITRE ATT&CK tactics are Execution (TA0002) and Command and Control (TA0011), with the technique being Remote Services (T1219). Primary telemetry sources include Windows network connection logs, specifically targeting connections to known Kaseya domains. If malicious, this activity can lead to unauthorized remote access to managed systems or data compromise. However, this detection alone does not confirm that malicious intent is behind the connection; legitimate administrators may use Kaseya as part of their IT operations.

  ### Investigation Steps

  - **Identify the connection source:** Review network connection logs for Event ID 5156 (Windows Filtering Platform) to identify the originating IP address of the connections to Kaseya domains. Look for known external IP addresses associated with Kaseya service instances.

  - **Check for unauthorized access:** Search for any previous access or logged sessions originating from accounts that are not recognized as legitimate administrators. Focus on failed login attempts (Event ID 4625) associated with the Kaseya connections.

  - **Review user activity logs:** Inspect Security Event ID 4688 (Process Creation) on endpoints interacting with Kaseya domains to identify any unexpected or anomalous processes spawning immediately before or after these connections. Distinguish legitimate Kaseya processes from potentially malicious ones.

  - **Validate expected operations:** Confirm that managed endpoints regularly establish connections to Kaseya domains during scheduled maintenance windows. Document their normal expected behavior, including connection times and durations.

  - **Analyze associated artifacts:** If applicable, check for file creation or modification timestamps in directories typically used by Kaseya (e.g., C:\Program Files\Kaseya) or unauthorized downloads related to these network connections.

  - **Cross-reference with other detections:** Look for other related alerts or indicators of compromise that identify unusual remote activity, such as failed RDP login attempts or abnormal PowerShell usage (Event ID 4104) that may indicate an exploit attempt.

  ### Prioritization

  This alert is of medium severity due to the potential system impact and likelihood of misuse. Kaseya is a commonly utilized RMM tool, meaning there is a legitimate operational context. However, its exploitation is well-documented, suggesting that alerts of this nature require prompt investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for false positives from legitimate Kaseya usage. Ensure that the Windows Filtering Platform is correctly configured to log network traffic relevant to this detection. Legitimate use of Kaseya by IT personnel in routine management tasks may trigger this alert. Complementary detections include monitoring for unusual behavior following remote sessions, such as unexpected file transfers or account privilege escalations, enhancing security posture against misuse.

