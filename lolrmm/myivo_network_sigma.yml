note: |
  ### Technical Context

  This Sigma rule detects network activity directed towards the hostname associated with the MyIVO Remote Monitoring and Management (RMM) tool. The likely objective of this network connection is to establish remote access to endpoints, potentially allowing unauthorized execution of commands or malware deployment by an adversary. The relevant MITRE ATT&CK techniques include command and control (T1071) and application layer protocol (T1219).

  Primary telemetry sources include Windows network connection logs, specifically monitoring outbound connections to the domain ‘myivo-server.software.informer.com’. If the connection is indeed malicious, it could result in unauthorized access to sensitive data or control over the affected systems. Importantly, this detection does NOT confirm that the activity is inherently malicious; legitimate usage of the MyIVO RMM tool may also trigger the rule.

  ### Investigation Steps

  - **Review outbound connection logs**: Check for network connection events originating from internal endpoints towards 'myivo-server.software.informer.com' (Windows Event ID 5156, Security logs, or equivalent network telemetry).
  - **Identify legitimate usage**: Determine if the affected system has prior documented use of the MyIVO RMM tool, which could legitimize the connection. Look for installed applications or user activity corresponding to MyIVO usage.
  - **Analyze process execution**: Review Windows Security Event ID 4688 (process creation) to see if there are any processes spawned that align with MyIVO or similar RMM tools immediately following the network connection.
  - **Check DNS queries**: When analyzing the logs, look for DNS queries made to 'myivo-server.software.informer.com' (Windows Event ID  DNS query logs) to ensure there isn't suspicious resolution activity by internal endpoints.
  - **Look for additional indicators of compromise**: Examine if there's other unusual network activity or system behavior related to the MyIVO connection, such as high data exfiltration rates or remote session creations.
  - **Document user demographics**: Validate if the source IP of the connection is associated with high-risk users or critical assets that might increase the severity of an unauthorized MyIVO RMM usage.

  ### Prioritization

  The alert is considered medium severity due to the possibility that the affected system may hold sensitive data, increasing the potential impact of an RMM tool being exploited for malicious purposes. While not all attempts to connect to legitimate RMM servers are malicious, such tools are commonly weaponized in targeted attacks, necessitating verification.

  ### Blind Spots and Assumptions

  Limitations exist if logging is not consistent across the enterprise, particularly around network connection events or DNS resolutions. Legitimate administrative tasks using MyIVO RMM may trigger this alert, complicating investigations. For enhanced detection capabilities, establish companion alerts for other common RMM tool behaviors or network communications that could suggest lateral movement or data exfiltration.

