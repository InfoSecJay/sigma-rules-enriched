note: |
  ### Technical Context

  This rule detects potential network communication with MyIVO Remote Monitoring and Management (RMM) tools, specifically targeting the domains associated with the MyIVO platform. Attackers may leverage such RMM tools to establish a foothold, perform lateral movement, or execute unauthorized command and control (C2) operations. The relevant MITRE ATT&CK tactic is **Command and Control** and the technique is **Application Layer Protocol** (T1219).

  Primary telemetry sources include Windows network connection logs, specifically monitoring DNS requests or outgoing connections to the specified MyIVO domains. If malicious, this behavior could indicate unauthorized remote management activity, posing a significant risk to system integrity and data confidentiality. This detection does NOT confirm that the application is being misused as functional business operations might involve legitimate MyIVO usage.

  ### Investigation Steps

  - **Verify DNS Resolution Details:** Check DNS logs for queries to `*.myivo-server.software.informer.com`. Look for Event IDs  DNS User Event ID 22 or Server Event ID 1000 that reveal the source IP initiating these queries. Benign activity typically shows infrequent queries or a lack of activity during non-business hours.

  - **Investigate Network Connection Activity:** Review Windows Event ID 5156 to identify outbound connections to the MyIVO domains. Focus on unusual or unexpected processes initiating these connections. Investigate if common management tools (e.g., RDP) are being used legitimately from expected endpoints.

  - **Analyze Associated Process Execution:** Cross-reference Event ID 4688 (process creation) for processes related to network activity involving MyIVO domains. Look for executables that are not typical for RMM tool operations, marking them as potential malicious indicators if initiated by non-management systems.

  - **Confirm Host Trustworthiness:** Review the asset owner's business function to determine if the device has a legitimate use case for MyIVO tools. High-privilege servers, like domain controllers or sensitive data repositories, require heightened scrutiny compared to user workstations.

  - **Establish Timeline of Events:** Trace the activity leading up to the detection by examining related logs like Sysmon Event ID 3 for network connection attempts. Establishing timing may reveal persistence attempts or correlate against wider lateral movement activities.

  ### Prioritization

  This alert has medium severity as the affected system may be critical if involved in sensitive data management or administrative tasks. The likelihood of abuse is concerning due to the known use of RMM tools by adversaries for exploitation. While MyIVO can be legitimate, its usage must be closely monitored given its capabilities for remote management.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate MyIVO usage may generate similar network traffic. Make sure logging for remote connections (e.g., RDP, TeamViewer) is enabled to differentiate between benign and malicious behaviors. It is also important to consider that authorized third-party vendors might connect using MyIVO tools. A related detection could include monitoring for unusual user account behaviors prior to or following detected MyIVO connections to enhance context and response.

