note: |
  ### Technical Context

  This rule detects network connections initiated to domains associated with the ISL Light Remote Management and Monitoring (RMM) tool, specifically targeting `islonline.com`. The likely objective of an attacker using ISL Light is to establish a remote session for system compromise, enabling unauthorized control over an affected machine. This behavior aligns with the MITRE ATT&CK technique T1219 - Remote Access Software.

  Primary telemetry sources include Windows network connection logs that capture outbound connections, specifically focusing on the DestinationHostname field. If malicious, the use of ISL Light can allow threats to exfiltrate data, deploy malware, or maintain persistence through remote access. It is crucial to note that an alert on this rule alone does not confirm malicious activity; legitimate usage of ISL Light by authorized personnel can also trigger this detection.

  ### Investigation Steps

  - **Verify host activity: **Check for legitimate usage of ISL Light on this host. Investigate recent activity logs, including Event ID 4648 (Login Failed) and Event ID 4624 (Successful Logon), to confirm if authorized personnel access occurred around the time of the alert.

  - **Review network logs: **Analyze Windows Firewall or network logs for outbound connections to `*.islonline.com` (Network Connection Event IDs 5156/5157). Look for any erratic timestamps or frequent retries which could indicate misuse.

  - **Correlate user behavior: **Examine user activity in user account logs (Event ID 4672 - Special Privileges Assigned to New Logon) from the time of alert generation. Suspicious logon patterns or access from unrecognized accounts may suggest malicious intent.

  - **Identify high-confidence malicious indicators: **Connect network activity to potential credential theft by checking for unusual non-local connections (IP addresses) or anomalies in the host's usual connection patterns, particularly if ISL Light is not part of the standard software baseline.

  - **Assess system context: **Determine the role of the affected system (e.g. workstation, server) and its criticality. A connection to ISL Light from a critical server, without documented legitimate use, escalates the severity of the alert.

  ### Prioritization

  This alert has a medium severity due to the potential impact of compromised systems being accessible via unauthorized remote tools. The likelihood of malicious intent is moderate, as ISL Light is widely used, and misuse is common in supply chain attacks and compromised support scenarios.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate administrative use of ISL Light can trigger this alert. Required log configurations include enabling detailed Windows security logs and network logs for proper tracking of outgoing connections. Additionally, other tools and protocols for remote access (e.g., TeamViewer, VNC) could produce similar alerts, warranting companionship with detections for T1219 activity using those tools.

