note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the ISL Light Remote Management and Monitoring (RMM) tool by identifying connections to the domain 'islonline.com'. An attacker could use this tool to establish remote access to compromised systems, permitting data exfiltration, system manipulation, or further lateral movement within the network. This activity maps to the MITRE ATT&CK tactic of Command and Control (TA0011) under technique T1219, which pertains to remote access tools.

  The primary telemetry source is Windows network connection logs, particularly focusing on DNS queries and outbound connection attempts. If malicious, the security impact can be substantial, enabling unauthorized access to sensitive information and enterprise assets. Importantly, this detection does NOT confirm an attack on its own, as legitimate use of the tool may also trigger the alert.

  ### Investigation Steps

  - **Check outbound DNS queries:** Look for Event ID 解析 (DNS Client Event) indicating requests to 'islonline.com'. If seen during off-business hours and from unexpected hosts (e.g., non-IT assets), it may be malicious.

  - **Review active network connections:** Investigate connections (Event ID 5156) to 'islonline.com' from unexpected hosts. Legitimate connections should originate from known administrative systems.

  - **Analyze process associations:** Use Sysmon Event ID 1 to identify any processes associated with connections to 'islonline.com'. Legitimate instances will likely originate from known administrative tools (e.g., team support roles).

  - **Identify unusual user behavior:** Look for signs of lateral movement by reviewing user account activity (Event ID 4624). Unusual login patterns from accounts that generally do not conduct remote management should raise flags.

  - **Correlate with remote desktop logs:** If RDP was used before the detected activity (Event ID 4624), this could indicate a more legitimate scenario. Look for RDP Event ID 4624 logs to ensure related session activity is consistent.

  ### Prioritization

  The severity of this alert is medium due to the potential for significant impact on system integrity and confidentiality if malicious. While ISL Light can be a legitimate tool, its remote access functionalities are often weaponized by adversaries, making this behavior suspicious.

  ### Blind Spots and Assumptions

  Detection limitations include potential legitimate use of ISL Light, which may trigger false positives. Accurate detection depends on comprehensive network logs that capture all outbound traffic, including DNS resolutions. Legitimate activities might include support sessions from IT staff. A related detection to consider is unauthorized use of other remote access tools (e.g., TeamViewer, AnyDesk) to strengthen coverage against similar threats.

