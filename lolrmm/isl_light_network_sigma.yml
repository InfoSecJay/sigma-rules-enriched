note: |
  ### Technical Context

  This rule detects network connections to `islonline.com`, which are characteristic of the ISL Light Remote Management and Monitoring (RMM) tool. Attackers may use this tool to establish remote access to a compromised system, facilitating lateral movement, data exfiltration, and further malicious activities. The relevant MITRE ATT&CK tactic is "Execution" and the technique is "Remote Services" (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically monitoring outbound traffic to predefined domains associated with the ISL Light tool. If cases are confirmed malicious, the impact could include unauthorized access to sensitive systems and data. Importantly, this detection does NOT confirm malicious activity on its own; it could indicate legitimate remote support processes.

  ### Investigation Steps

  - **Review outbound connections:** Examine Windows Security Event ID 5156 in the Windows Filtering Platform (WFP) logs for outbound connections to `islonline.com`. Look for unusual timing or systems that should not be using RMM tools.

  - **Validate user activity:** Check for legitimate user activity before the alert, specifically for the technical support department’s scheduled maintenance. Review timestamps against common business hours and user account activity logs.

  - **Analyze process execution:** Use Sysmon Event ID 1 to identify the creation of processes that might indicate the launch of the ISL Light tool. Legitimate execution will typically be tied to known support personnel.

  - **Check for additional artifacts:** Identify any created or modified files, such as logs or configurations used by ISL Light. Look for file creation timestamps within the timeframe of the detected network activity.

  - **Assess system role:** Consider the criticality of the affected asset. If the alert pertains to a high-value target or sensitive system, escalate the investigation promptly due to increased risk.

  ### Prioritization

  This alert has medium severity due to the potential for high-impact consequences if the affected system is critical. The likelihood of malicious abuse exists, especially given that RMM tools are commonly weaponized in cyber intrusions. Analysts should treat this alert with due diligence, particularly in environments with a low tolerance for remote support tools.

  ### Blind Spots and Assumptions

  Detection may be limited by outbound traffic filtering or restrictions, potentially allowing attackers to bypass monitoring. Ensure logging for outbound network connections is enabled and configured correctly within the enterprise environment. Legitimate activities, such as authorized remote support, may trigger this alert. Consider companion detections related to remote desktop protocol (RDP) activity, which may enhance overall coverage against similar threats.

