note: |
  ### Technical Context

  This detection identifies outbound network connections to domains associated with the SuperOps RMM (Remote Monitoring and Management) tool. Attackers may leverage such tools to gain unauthorized control over systems, potentially facilitating lateral movement within the network or executing malicious payloads. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **Remote Services: Remote Access Tools (T1219)**.

  Primary telemetry sources include network connection logs that capture DNS queries and outbound connections, specifically looking for Event ID 5156 in Windows Filtering Platform events. If this activity is malicious, it may indicate a compromise of systems that were intended for legitimate remote management. Notably, this detection alone does NOT confirm malicious use, as legitimate administrators may also utilize these tools.

  ### Investigation Steps

  - **Check network connection logs**: Review Windows Event ID 5156 to confirm outbound connections to domains such as `*.superopsbeta.com`, `superops.ai`, or `serv.superopsalpha.com`. Correlate timestamps with the alert for specific user sessions.

  - **Evaluate the initiating process**: Investigate the parent process for the outbound connection (from Event ID 4688), identifying whether it originated from a known administrative tool or a suspicious executable. Established tools like Task Manager or Process Explorer can assist in identifying legitimate processes.

  - **Assess configuration and permissions**: Validate if the connections were made from expected administrative workstations or endpoints designated for RMM tools. Identify if the computer is part of an approved asset inventory to gauge legitimacy.

  - **Correlate with user activity**: Look for recent changes in user roles or permissions in Active Directory logs (Event ID 4662) that could suggest a compromised account was used to initiate the remote tool.

  - **Identify known malicious activity**: Monitor the network for known signatures of compromised credentials or command-and-control (C2) communications. Review connections to additional malicious IPs or domains that might signify a broader compromise.

  - **Review legitimate use cases**: Document legitimate context where SuperOps tools are used, such as scheduled maintenance or technical support sessions. Obtain confirmation from IT teams if these tools are in active use during the alert period.

  ### Prioritization

  This alert is rated medium severity due to the potential impact of unauthorized remote management activities on sensitive systems. While legitimate use occurs, the likelihood of malicious exploitation exists given the capabilities of remote access tools and their prevalence among attackers.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of VPNs to mask connections or domain fronting to avoid detection. Reliable detection requires logging of outbound connection events and an understanding of legitimate SuperOps usage within the organization. Legitimate activities may include scheduled IT support sessions. A related detection leveraging unauthorized PowerShell scripts to invoke SuperOps actions could enhance overall coverage and threat visibility.

