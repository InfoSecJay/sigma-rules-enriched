note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Pcvisit Remote Management and Monitoring (RMM) tool, such as `pcvisit.exe`, its client, and service executables. The likely attacker objective is to perform remote access to systems, facilitating unauthorized control or information exfiltration, which aligns with the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Remote Access Software" (T1219). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide details regarding the creation of processes and their parent-child relationships. If detected as malicious, this behavior can lead to significant security incidents, potentially allowing external actors to manipulate or extract sensitive information from affected systems. Importantly, this detection does NOT confirm malicious activity on its own, as the PCVisit tool may be used for legitimate remote support.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for instances where `Image` ends with `\pcvisit.exe`, `\pcvisit_client.exe`, `\pcvisit-easysupport.exe`, or `\pcvisit_service_client.exe`.

  - **Analyze parent process relationships:** Identify parent processes leading to the creation of these Pcvisit processes. Legitimate behavior may show trusted support tools initiating these processes, while anomalous patterns may indicate unauthorized access.

  - **Inspect user account activities:** Verify the account associated with the process creation. Look for unusual account activity or access from accounts that typically do not utilize remote management tools.

  - **Monitor network behavior:** Check for network connections originating from the detected processes, especially towards external IP addresses. Any outbound traffic to unknown domains or IPs could indicate malicious intent.

  - **Evaluate known whitelist entries:** Confirm if the use of Pcvisit aligns with documented company policies for remote support tools. Consult whitelists for exceptions; if the activity falls outside approved usage, escalate as potential malicious behavior.

  - **Identify lateral movement indicators:** Look for subsequent process executions or logins from the host where Pcvisit executed. Malicious actors may use this tool as a stepping stone for lateral movement within the network.

  ### Prioritization

  This alert is of medium severity. The use of remote management tools like Pcvisit can be exploited for unauthorized access, particularly if the affected system is critical or contains sensitive data. Since RMM tools are often targeted by adversaries for exploitation, the likelihood of malicious abuse is notable, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by variations in legitimate usage of the Pcvisit tool, making it essential to understand the organization's intended application of this software. Additionally, without proper logging configuration or the presence of Sysmon, visibility into process relationships may be hindered. Legitimate IT support activities can inadvertently trigger this alert. Related detections of initial access vectors, such as suspicious logins or credential misuse, can provide additional context and strengthen monitoring effectiveness.

