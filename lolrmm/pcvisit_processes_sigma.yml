note: |
  ### Technical Context

  This Sigma rule detects the execution of various Pcvisit RMM (Remote Monitoring and Management) tool processes, including `pcvisit.exe`, `pcvisit_client.exe`, `pcvisit-easysupport.exe`, and `pcvisit_service_client.exe`. The likely attacker objective behind using such tools is to gain unauthorized remote access to systems, exfiltrate sensitive data, or perform malicious activities under the guise of legitimate support. This activity fits into the MITRE ATT&CK framework under the Execution tactic and specifically aligns with the technique T1219 (Remote Access Software).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture details of new process creation events. If the malicious activity is confirmed, it could lead to compromise of sensitive data or systems. However, this detection alone does not definitively prove malicious intent, as legitimate use of the Pcvisit tool exists.

  ### Investigation Steps

  - **Review process creation logs**: Look for Security Event ID 4688 and Sysmon Event ID 1 that indicate process execution. Check `Image` path for any occurrence of `pcvisit.exe`, `pcvisit_client.exe`, `pcvisit-easysupport.exe`, or `pcvisit_service_client.exe` to establish if the tool was launched.

  - **Identify parent-child relationship**: Analyze the `ParentImage` field in process logs for associations with legitimate applications. A legitimate parent process may indicate normal usage, while unknown applications initiating these processes could be suspicious.

  - **Check network activity**: Examine firewall logs or network traffic (using tools like Wireshark or network monitoring solutions) for connections to known Pcvisit servers or unusual outbound traffic during the process execution timeframe, which may suggest exfiltration efforts.

  - **Validate installation paths**: Confirm that the installation path of Pcvisit tools matches expected directories (e.g., `C:\Program Files\Pcvisit\`) versus anomalous paths which may indicate an unauthorized installation.

  - **Review user account activity**: Verify the user account launching these processes via Event ID 4672 (Special Privileges Assigned to a New Logon) to ensure it corresponds to authorized IT support roles, as misuse by non-privileged accounts could indicate malicious activity.

  - **Determine historical usage**: Check for historical evidence of expected behavior; if these processes appear frequently without known authorization or support activity, this may suggest ongoing unauthorized access or misuse.

  ### Prioritization

  This alert is considered medium severity as the detected processes can indicate potentially malicious activities within critical systems. The likelihood of abuse is moderate, given that similar remote access tools are often exploited by adversaries. However, the tool can also be used legitimately by IT support staff, which necessitates further investigation.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by the presence of custom-installed remote access tools or altered executable names that could evade this rule. Ensure that process creation logging is enabled across all endpoints to guarantee comprehensive visibility. Legitimate administrative tasks or IT support activities may trigger this alert, creating potential false positives. As a companion detection, implementing logs from other remote access tools can enhance coverage of potential unauthorized access methods.

