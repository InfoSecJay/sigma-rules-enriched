note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Sentinel RMM (Remote Monitoring and Management) tool, specifically when they are spawned by the sentinel-agent.exe parent process. The likely attacker objective may include establishing remote control over compromised systems or leveraging legitimate remote management tools for malicious activities. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), and the associated technique is **Exploitation of Remote Monitoring and Management Tool** (T1219). Primary telemetry sources include Windows process creation logs (Security Event ID 4688) or Sysmon logs (Event ID 1) that capture details about process execution. If the activity is unauthorized, it poses a significant security impact, as attackers could use these tools to facilitate lateral movement or conduct further exploitation. It is important to note that this detection does not confirm malicious intent or activity without additional contextual evidence.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 and/or Sysmon Event ID 1 for any instances of 'sentinel-agent.exe' as a parent or child process. Confirm if the timestamps align with the alert.

  - **Identify the source of the execution:** Determine the user account and system executing the process to validate if they are authorized to use Sentinel RMM. Look for unusual remote access during off-hours as a red flag.

  - **Establish expected behavior:** Review the organization's policy regarding the use of Sentinel RMM. Legitimate instances should demonstrate typical patterns, such as scheduled maintenance during business hours by authorized IT personnel.

  - **Verify command line arguments:** Investigate the command line arguments used during the process creation in Event ID 4688. Malicious instances may contain unexpected parameters that deviate from normal operational usage.

  - **Cross-reference with threat intelligence:** Use threat intelligence sources to check if the specific host or user has previously exhibited suspicious behavior or if the RMM tool usage aligns with known attacker tactics.

  - **Evaluate system role and criticality:** Consider the role of the affected host (e.g., domain controllers, critical servers) and assess the potential impact of exploitation, focusing investigations on higher-value targets.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems managed by Sentinel RMM, which could facilitate extensive control in the hands of attackers. The likelihood of abuse is moderate, as such tools are frequently weaponized by adversaries. Prompt investigation is essential to avoid larger compromise.

  ### Blind Spots and Assumptions

  Detection can be limited by the legitimate use of Sentinel RMM within the environment, leading to false positives. Additionally, if process creation logging is not enabled or configured properly, detections may be missed. Situations where remote support is common may create noise in alerts. Companion detections, such as monitoring unusual PowerShell commands (T management operations), can provide a more comprehensive threat landscape analysis.

