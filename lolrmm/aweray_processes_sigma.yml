note: |
  ### Technical Context
  This detection rule identifies potential malicious activity associated with the AweRay Remote Management Tool (RMM), specifically monitoring the execution of the `awe_ray_remote` and `AweSun.exe` processes. AweRay is often exploited by threat actors for unauthorized remote access and management of systems, allowing them to manipulate or compromise devices in a network. The core objective of attackers leveraging this tool may range from system surveillance to executing commands remotely, which can lead to data exfiltration or deployment of additional malicious payloads.

  Relevant MITRE ATT&CK tactics and techniques related to this detection include **Execution** (T1203) and **Remote Services** (T1219), which encapsulate the use of remote access tools to gain control over systems. By monitoring for these process executions, defenders can identify unauthorized usage that could signify an intrusion or active compromise of a system.

  Primary data sources for this detection include Windows process creation logs, which capture detailed information about processes starting on the system, including both the parent and child processes. These logs serve as critical evidence in identifying unauthorized execution pathways utilized by an attacker.

  ### Investigation Steps
  - **Review Process Creation Logs:** Look at the Windows process creation logs to identify the timeline and context of the `awe_ray_remote` or `AweSun.exe` executions and their associated parent processes.
  - **Analyze Parent Process Relationships:** Check the parent processes that initiated the AweRay applications to determine if they were launched by legitimate administrative tools or from suspicious commands.
  - **Correlate with User Activity:** Investigate user accounts that triggered these processes, focusing on any anomalous login patterns or unauthorized access attempts that could indicate a compromised user account.
  - **Evaluate Network Activity:** Monitor network connections originating from the affected systems to identify unusual outbound connections that may indicate data exfiltration or command and control (C2) communications.

  ### Prioritization
  This alert should be treated with medium severity due to the potential risk it poses in an enterprise environment. The presence of AweRay's RMM tool activity often suggests that a threat actor is attempting to leverage legitimate remote management capabilities for malicious purposes, increasing the likelihood of compromise and lateral movement within the network.

  ### Blind Spots and Assumptions
  This detection rule does not account for environments where AweRay is legitimately used for remote management tasks, leading to potential false positives. The detection depends on specific process naming conventions, so any variation or renaming of the executable by attackers may evade detection. Additionally, this rule assumes that process creation logs are adequately collected and retained in the environment; any gaps in logging configurations may hinder the ability to detect this activity effectively.

