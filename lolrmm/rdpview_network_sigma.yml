  ### Technical Context

  This rule detects network activity potentially associated with the RDPView Remote Management and Monitoring (RMM) tool, specifically targeting connections to certain known URLs such as "user_managed" or "systemmanager.ru/dntu.en/rdp_view.htm". The likely objective of an attacker using RDPView is to establish remote access and manipulate systems without detection. This behavior aligns with the MITRE ATT&CK tactic of Execution (T1203) and specifically targets remote services.

  The primary telemetry sources required for this detection include Windows network connection logs, specifically monitoring for outgoing connections to the stated domains. If malicious, this activity could lead to unauthorized remote access and control of the affected systems, posing a significant risk to enterprise security. However, this detection does not confirm that the activity is inherently malicious, as legitimate use of RDPView may occur in the environment.

  ### Investigation Steps

  - **Review network connections:** Check Windows event logs for network connection entries (Event ID 5156) that indicate communication with the detected domains. Look for high outbound traffic volume to these URLs as a potential malicious indicator.

  - **Analyze user context:** Confirm the user account initiating the connection to the RDPView URLs. Legitimate administrative accounts may use RDPView; however, check for unusual access patterns or connections from non-standard hosts.

  - **Assess host roles:** Identify whether the affected system is an endpoint or server designated for remote access. Critical systems (e.g., domain controllers or database servers) under RDPView connections warrant higher scrutiny.

  - **Check for additional artifacts:** Look for related files or executables in system directories that may indicate RDPView has been installed (e.g., file paths like "C:\Program Files\RDPView"). Validate timestamps and signatures.

  - **Investigate related logs:** Review Windows Firewall logs (Event ID 2004) for any allowed or denied outbound connections matching the identifying indicators. Note any unexpected access patterns.

  ### Prioritization

  The alert is medium severity due to potential impact on critical systems if compromised. RDPView can be weaponized for unauthorized access, making it a concern, especially when activity arises from non-administrative users or unexpected network locations.

  ### Blind Spots and Assumptions

  This detection can be evaded by legitimate usage of RDPView in an enterprise environment. Furthermore, log sources must be correctly configured to capture detailed network connection events to ensure reliable detection. Legitimate organizational activity may include system administration tasks involving RDP, which could trigger false positives. A companion detection focusing on anomalous administrative actions, such as account privilege escalation (e.g., T1078), enhances overall coverage.

