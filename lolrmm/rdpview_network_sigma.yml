note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the domain `systemmanager.ru`, which is associated with the RDPView Remote Management Tool (RMM). The primary objective of an attacker using this tool would be to maintain persistence and manage compromised systems remotely. This behavior falls under the MITRE ATT&CK techniques for Remote Access Software (T1219).

  The primary telemetry source is Windows network connection logs, particularly those that capture network activity such as DNS queries and outbound connections. If this behavior is indeed malicious, it poses a significant risk of data exfiltration and control over affected assets. However, it’s important to note that this detection does NOT confirm malicious intent on its own, as legitimate uses of RDPView exist.

  ### Investigation Steps

  - **Review recent network activity:** Examine Windows event logs for network connection attempts to `systemmanager.ru`. Specifically, look for logs categorized under Network Connection (Event ID 5156) and confirm if connections coincide with times reported in the alert.

  - **Correlate with user activity:** Check for user logon activity (Event ID 4624) and session history (Event ID 4672) to determine if the account initiating the connection has shown unusual behavior or elevated privileges recently.

  - **Validate installed applications:** Investigate installed applications on the affected system (via inventory tools or Event ID Installed Applications logs) to confirm if RDPView or similar RMM software is present and configured. Identifying legitimate RMM tools may indicate benign usage.

  - **Identify indicators of compromise:** Look for signs of lateral movement or command execution (Event ID 4688) that occurred in conjunction with the network connection. Unusual command-line arguments related to RDPView should raise red flags.

  - **Analyze DNS queries:** Examine DNS logs to see if there are any associated queries to `systemmanager.ru` or other related subdomains during the same time frame. High frequency of queries with abnormal patterns could indicate malicious use.

  - **Check for file creation or modification:** Inspect file system logs for any newly created or modified files associated with RDPView (e.g., configuration files or executables). This might reveal if the tool was downloaded or executed in a suspicious context.

  ### Prioritization

  This alert is rated medium severity due to the potential for unauthorized remote access and management of systems. The likelihood of abuse is moderate, as this specific tool can be weaponized by attackers, especially targeting systems with high-value data or lower security postures.

  ### Blind Spots and Assumptions

  There are inherent limitations in detecting all legitimate uses of RDPView, which may include valid IT administrative tasks. Furthermore, this detection relies on accurate logging of outbound network connections which must be properly configured in the environment. It’s also worth noting that a user's legitimate use of remote management tools could trigger this alert. A companion detection rule for internal port scans or suspicious process creations can strengthen coverage against related threats.

