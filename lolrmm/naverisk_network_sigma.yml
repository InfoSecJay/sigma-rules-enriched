  ---

  ### Technical Context

  This Sigma rule detects outbound network activity indicative of the Naverisk Remote Monitoring and Management (RMM) tool, specifically targeting connections to domains like "user_managed" and "naverisk.com." The likely attacker objective involves the use of Naverisk for remote access or management tasks, which may be leveraged for malicious purposes, such as providing an adversary with persistent access to compromised systems. This behavior falls under the MITRE ATT&CK Tactic **Execution** and Technique **T1219 - Remote Access Tools**.

  The primary telemetry sources include Windows network connection logs, which may capture details regarding the destination hostname and protocol of the connections. If malicious, the use of Naverisk can lead to unauthorized system access, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT in itself confirm malicious intent, as legitimate business use of the Naverisk tool exists.

  ---

  ### Investigation Steps

  - **Review network connection logs**: Examine Windows event logs for network connection entries (Event ID 5156) that show connections to "user_managed" and "naverisk.com." Note the timestamp, source, and destination IPs.

  - **Identify expected legitimate usage**: Confirm whether the organization utilizes Naverisk for IT management. Verify segment logs for specific user accounts or IP addresses that typically access these domains.

  - **Assess process execution**: Use Sysmon logs (Event ID 1) to trace back any new or unexpected processes launched around the time of the outbound connections, particularly looking for `Naverisk.exe` or other related executables.

  - **Analyze DNS resolution activity**: Check DNS logs for resolutions to "naverisk.com" or related domains, identifying any unusual frequency or patterns that deviate from normal operational activity.

  - **Correlate with other alerts**: Look for indicators of compromise (IOCs) across other detections within the SIEM that coincide with the identified Naverisk network activity, such as unauthorized configuration changes or suspicious file access.

  ---

  ### Prioritization

  This alert is classified as medium severity due to the potential compromise of systems managed by Naverisk. The likelihood of abuse is significant, as RMM tools like Naverisk are commonly weaponized in malware delivery and persistent access scenarios. Therefore, timely investigation is crucial to prevent potential data breaches or unauthorized control.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate Naverisk usage, which can lead to false positives. Ensuring comprehensive logging settings from Windows firewalls and ensuring Sysmon configuration is correct is vital for reliable detection. Legitimate network management activities may also trigger this alert, thus thorough context around user behavior is essential. A companion detection to fortify coverage includes monitoring for unusual admin privileges or file changes consistent with RMM tool usage.

