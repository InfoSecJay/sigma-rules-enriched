note: |
  ### Technical Context

  This Sigma rule detects instances of potential Remote Desktop Protocol (RDP) connections initiated by the `mstsc.exe` process, which can be indicative of unauthorized remote administration or lateral movement within an organization's network. The primary objective for an attacker may be to establish a foothold through remote access to compromised systems, facilitating further attacks or data exfiltration.

  This behavior aligns with the MITRE ATT&CK framework under the Execution tactic and the Remote Services technique (T1219). The detection is based on logs capturing process creation events originating from `mstsc.exe`, primarily collected from Windows Security Event IDs 4688 or Sysmon Event ID 1. The security impact is significant, as it may indicate unauthorized access to critical systems. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger the rule.

  ### Investigation Steps

  - **Check process creation events:** Review Windows Security Event ID 4688 for instances where the New Process Name is `mstsc.exe`. Ensure that the originating user is authorized for RDP access to the system in question.

  - **Verify parent process behavior:** Analyze the Parent Image field in Event ID 4688 to confirm that the `mstsc.exe` process is spawned by a legitimate administrative tool or user session. Malicious indicators may include execution from unexpected scripts or automation tools.

  - **Investigate session initiation:** Look for relevant logs, such as Network Layer (TCP/UDP) logs or Windows Event ID 4624, indicating successful logins via RDP, checking for unfamiliar user accounts or unusual source IP addresses which may indicate unauthorized access attempts.

  - **Understand legitimate use cases:** Assess the business context of the asset. Note that `mstsc.exe` can be used routinely by IT staff for remote support; however, frequent connections at odd hours or from unusual locations warrant further scrutiny.

  - **Monitor for post-connection actions:** Investigate any subsequent process creation events triggered after the `mstsc.exe` execution, particularly any shell or scripting instances that may indicate further exploitation attempts (e.g., PowerShell, command prompt executions).

  - **Examine endpoint security alerts:** Cross-reference any alerts from endpoint detection solutions that may also indicate suspicious activity tied to the `mstsc.exe` execution, such as unusual file creations or network connections.

  ### Prioritization

  This alert carries a medium severity rating due to the potential impact on systems that are accessible through RDP. Given that unauthorized remote access is a common tactic among attackers, the likelihood of malicious abuse is significant, particularly in high-value assets or sensitive environments.

  ### Blind Spots and Assumptions

  The detection may be limited by the presence of legitimate RDP usage, potentially leading to false positives. Reliable detection relies on comprehensive logging configurations in Windows environments for Security Event IDs and Sysmon. Furthermore, organizations may need to account for benign administrative activities that occur through legitimate means. Companion detections, such as monitoring for known malicious RDP credentials or failed RDP login attempts, can enhance overall security visibility.

