  ---

  ### Technical Context

  This rule detects execution of the Microsoft Terminal Services Client (mstsc.exe) from suspicious parent processes, indicating potential unauthorized remote desktop access. Attackers often use tools like mstsc.exe for lateral movement, exploiting valid user sessions to gain access to sensitive systems or environments.

  The relevant MITRE ATT&CK tactic is **Execution** (TA0002), specifically the technique **Remote Services: RDP** (T1219). The primary telemetry source is Windows process creation logs (Event ID 4688), indicating active process initiation and can also include Sysmon logs (Event ID 1). If adversarial actions are taking place, they could lead to unauthorized access and control over critical systems. This detection does NOT confirm malicious intent or compromise on its own, as mstsc.exe can be used legitimately.

  ---

  ### Investigation Steps

  - **Identify the Parent Process:** Review the process creation logs for Event ID 4688 where the `ParentImage` ends with `mstsc.exe`. Focus on the timestamp, user context, and the full command line of the initiating process for suspicious arguments or context.

  - **Check User Access History:** Analyze authentication events (Event ID 4624) related to the user linked to the mstsc.exe process. Ensure the user has permissions applicable to using mstsc.exe legitimately, such as being within an administrative role or a trusted user.

  - **Examine Active RDP Connections:** Investigate the Remote Desktop Services log (Event ID 4778) for active session IDs tied to the detected mstsc.exe process. Assess if the session was initiated by a known or trusted user, including duration and source IP addresses.

  - **Audit for Unusual Network Activity:** Utilize network logs to identify any associated unusual outbound connections during the same timeframe when mstsc.exe was executed. Pay attention to connections to external IP addresses that are not typical for internal operations.

  - **Review Legitimate Usage Patterns:** Document typical legitimate uses of mstsc.exe within the organization, noting common user accounts, source systems, and typical access hours to distinguish them from potentially malicious activities.

  - **Correlate with Security Events:** Cross-reference this detection with other security incident logs, such as failed logins (Event ID 4625), to determine if there are attempts to establish unauthorized connections matching the same time frame.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized remote access to sensitive systems. While mstsc.exe is often used legitimately, its misuse can lead to significant breaches, especially if leveraged by attackers who have already gained access through other vector avenues.

  ---

  ### Blind Spots and Assumptions

  Legitimate administrative tasks can trigger this alert, particularly in environments where remote desktop access is common for support teams. Detection may be evaded by renaming or altering the execution path of mstsc.exe. Reliable log sourcing and configuration must include process creation logs and ensure detailed command-line logging is enabled. Related detections could include monitoring for newly created user accounts (Event ID 4720) to provide broader context of potential insider threats or lateral movements.

