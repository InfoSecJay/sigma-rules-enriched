note: |
  ### Technical Context
  This detection rule identifies potential remote management activity via the Microsoft Terminal Services Client (mstsc.exe). This tool is commonly used for remote desktop connections, and its legitimate usage may often mask unauthorized or malicious access attempts. Attackers may utilize mstsc.exe to establish remote sessions to compromised machines, posing risks such as data exfiltration or lateral movements within an enterprise network.

  The likely threat scenario involves an attacker leveraging mstsc.exe to remotely access systems after gaining initial foothold through phishing or other means, aiming to escalate privileges or exfiltrate sensitive data. The MITRE ATT&CK tactics relevant to this detection include **Execution (T1203)**, indicating that the attacker is executing their intended behavior, and **Remote Services (T1219)**, as the use of remote desktop services is a common pathway for adversaries to control and manipulate victim environments.

  Primary data sources for monitoring this activity involve **process creation logs**, particularly focusing on instances where mstsc.exe is launched, especially when initiated from suspicious parent processes or scripts, as these could indicate malicious intent.

  ### Investigation Steps
  - **Analyze Process Creation Logs:** Review logs for any instances of mstsc.exe being executed. Pay particular attention to the context in which it is invoked (e.g., parent processes and user accounts).
  - **Check User Account Activity:** Identify accounts launching mstsc.exe, especially those that do not typically use RDP services. Assess for any known compromised accounts.
  - **Inspect Network Connections:** Look for unusual outbound or internal network connections originating from hosts where mstsc.exe was executed, focusing on IP addresses and ports commonly associated with RDP sessions.
  - **Gather Host Artifacts:** Collect artifacts such as Windows Event Logs to analyze for unusual authentication events and check for any simultaneous logins to other accounts or systems during the mstsc session.

  ### Prioritization
  This alert carries medium severity due to the dual nature of mstsc.exe as both a legitimate administrative tool and a potential vehicle for intruders to establish unauthorized remote access. The likelihood of its misuse increases when aligned with other suspicious activities in the environment.

  ### Blind Spots and Assumptions
  This detection may not capture all malicious uses of mstsc.exe, especially if attackers employ other methods to obfuscate their activities, such as renaming the executable or using alternative remote access tools. The rule presumes that process creation logs are configured and collected effectively; hence, if system auditing is insufficient, this alert may miss critical events. Additionally, legitimate administrative usage can complicate analysis, leading to potential false positives.

