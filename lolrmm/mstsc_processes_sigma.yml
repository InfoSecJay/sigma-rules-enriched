note: |
  ### Technical Context

  This rule detects potential use of `mstsc.exe`, the Microsoft Remote Desktop Connection client, which can be exploited by attackers for interactive lateral movement within a network. The likely objective of an attacker using `mstsc.exe` is to remotely access other compromised systems, allowing for data exfiltration or further exploitation. This behavior aligns with MITRE ATT&CK techniques T1219 (Remote Access Software) and T1021.001 (Remote Services: Remote Desktop Protocol).

  The primary telemetry source is the Windows process creation log, specifically monitoring the creation of processes related to `mstsc.exe`. If this activity is malicious, it could lead to unauthorized access or control of systems. However, this detection does NOT confirm that malicious activity occurred without corroborating evidence.

  ### Investigation Steps

  - **Identify the initiating process:** Review Security Event ID 4688 logs for any parent process entries creating `mstsc.exe`. Check the `ParentImage` field to determine the context in which this process was initiated.

  - **Examine timestamps and user accounts:** Look at the `SubjectUserName` and `EventTime` fields in relevant logs to identify who initiated the remote connection and when. Compare this with business hours to distinguish between expected and suspicious activity.

  - **Check remote session history:** Utilize Remote Desktop Services logs (Event ID 4624 for logon events) to confirm if legitimate users regularly access systems using Remote Desktop. Look for scheduled logons outside of business hours.

  - **Monitor network traffic for unusual behavior:** Capture traffic logs for RDP connections and review for unusual data transfers or non-standard destinations. Use tools to log RDP session traffic patterns and verify destination IP addresses against known asset lists.

  - **Assess for multiple remote access entries:** Multiple instances of `mstsc.exe` initiated from a single workstation in a short time frame may indicate lateral movement. Review logs to identify any rapid, successive connections to different internal IP addresses.

  - **Identify known good users:** Create a baseline of legitimate users typically using `mstsc.exe`, and flag any connections initiated by accounts not recognized as part of standard operational activity.

  ### Prioritization

  This alert carries medium severity because it relates to a commonly exploited method for lateral movement within networks. The impact could be significant if an attacker successfully gains unauthorized access, especially within sensitive or critical systems. The likelihood of abuse is moderate, as `mstsc.exe` is frequently seen in legitimate administrative activities.

  ### Blind Spots and Assumptions

  Detection may be limited by users manually launching `mstsc.exe` executable in legitimate scenarios, leading to potential false positives. Continuous logging of process creation must be enabled for reliable detection, and there could be legitimate users who frequently access remote systems, thus triggering alerts. Companion detections for anomalous user behavior or unexpected remote access patterns can strengthen overall monitoring strategies.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
