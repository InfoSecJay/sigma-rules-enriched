note: |
  ### Technical Context

  This rule detects process activity related to the `rdp2tcp.exe` application, which can serve as a remote management tool that wraps Remote Desktop Protocol (RDP) over TCP tunnels. The adversary's likely objective is to establish unauthorized access to systems by circumventing standard security measures. This behavior maps to MITRE ATT&CK Tactic: **Execution** (ID: TA0002) and Technique: **Protocol Tunneling** (ID: T1219).

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Security Event ID 4688 and Sysmon Event ID 1. If malicious, the presence of `rdp2tcp.exe` could enable attackers to bypass security controls and maintain persistent access. However, it is crucial to note that this detection alone does not confirm malicious intent, as `rdp2tcp.exe` may also be used legitimately in certain environments.

  ### Investigation Steps

  - **Verify Process Context: **Review the parent process: Check the parent process of `rdp2tcp.exe` in the logs (Event ID 4688). If it originates from a well-known system management tool, the activity may be benign, but if it's spawned from suspicious processes, further investigation is warranted.

  - **Analyze Command Line Arguments:** Inspect any command line arguments associated with the `rdp2tcp.exe` process using Sysmon Event ID 1. Malicious use may exhibit unusual flags or connections to IP addresses not typically associated with the organization.

  - **Review Network Connections:** Confirm outbound connections made by `rdp2tcp.exe` by reviewing relevant firewall or network logs (e.g., Windows Firewall logs). Legitimate use will typically show established connections to known internal management IPs, while suspicious connections may target unexpected or foreign networks.

  - **Identify Historical Usage:** Search for prior instances of `rdp2tcp.exe` usage using a historical file system query (e.g., through Windows Event Logs or Sysmon) to determine if previous instances were associated with legitimate operations or problematic occurrences.

  - **Cross-reference with Security Alerts:** Utilize threat intelligence feeds or SIEM logs to check for reported endpoints utilizing `rdp2tcp.exe`. Cross-referencing against known indicators of compromise (IOCs) can assist in determining the legitimacy of the activity.

  ### Prioritization

  This alert has a medium severity due to the potential for `rdp2tcp.exe` to facilitate unauthorized remote access. While legitimate use exists, its exploitation in environments lacking oversight or security measures can lead to significant security breaches. The likelihood of malicious abuse exists, especially in compromised networks where visibility is already low.

  ### Blind Spots and Assumptions

  Detection may be limited by the sophistication of the adversary, who could mask their activity or use legitimate credentials alongside `rdp2tcp.exe`. Ensuring endpoint logging is configured to capture detailed process execution logs is critical for reliable detection. Legitimate admin activities may trigger alerts, especially in environments where `rdp2tcp.exe` is employed. Companion detections, such as monitoring for unusual outbound RDP connections (Event ID 4798 for user logon events), can enhance coverage and context for ongoing investigations.

