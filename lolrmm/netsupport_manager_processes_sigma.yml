  ### Technical Context

  This Sigma rule detects process creation activities related to the NetSupport Manager remote management tool, specifically monitoring for instances where the tool is invoked by certain parent processes. The likely attacker objective could be to establish remote access or control of a compromised system. This activity aligns with the MITRE ATT&CK technique for Remote Services, specifically T1219 (Remote Access Tools).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, both capturing details about process execution on Windows systems. If malicious, the impact could be significant, including unauthorized remote access, data exfiltration, or system control. This detection does NOT confirm malicious activity on its own as NetSupport Manager could be used legitimately in administrative tasks.

  ---

  ### Investigation Steps

  - **Review Event ID 4688 for process creation details**: Look for Security Event ID 4688 where the new process name ends with "pcictlui.exe", "pcicfgui.exe", or "client32.exe." Note the usernames and parent process IDs to determine the context.

  - **Analyze Sysmon Event ID 1 artifacts**: Correlate Sysmon Event ID 1 for the detected process, focusing on the 'Image' and 'ParentImage' fields. Validate if the parent process is a legitimate administrative tool.

  - **Identify legitimate use cases of NetSupport Manager**: Verify if the software is deployed in your environment legitimately. Check organizational documentation or consult with IT management to confirm expected usage patterns.

  - **Check for abnormal authentication attempts**: Investigate authentication logs (Event ID 4624) for unexpected remote logins or logins outside normal working hours prior to the process creation events.

  - **Cross-reference network activity**: Utilize network monitoring logs, concentrating on the source IP of executing processes. Look for unusual connections to external IP addresses associated with unauthorized remote management services.

  - **Observe deletion or modification of log files**: Scan for Event IDs indicative of log deletion (Event ID 5145) around the same timeframe as the alert to identify attempts to cover malicious activity.

  ---

  ### Prioritization

  The alert severity is medium due to the potential risk associated with unauthorized remote management capabilities that could lead to broader malicious intent, such as lateral movement. The likelihood of malicious abuse is moderate, as such tools are often weaponized by threat actors for remote access. However, legitimate use within enterprise environments may also occur, necessitating careful investigation.

  ---

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion through process renaming or using remote access tools not covered by this rule. Reliable detection depends on consistent logging configurations, specifically ensuring Sysmon and Windows security logs are enabled. Legitimate administrative activities using NetSupport Manager may trigger the alert, creating false positives. A related detection to implement is monitoring for unusual user behavior or escalation attempts (e.g., Event ID 4672 – Special privileges assigned to new logon) to strengthen coverage against unauthorized access attempts.

