note: |
  ### Technical Context
  This rule detects processes associated with the NetSupport Manager remote management tool, specifically when executed in a manner that might be indicative of benign or malicious activity. NetSupport Manager can enable remote access to systems, which can be exploited by threat actors to gain unauthorized control, facilitate lateral movement, or conduct reconnaissance within a network. The typical objectives could include data exfiltration, persistent access, or the deployment of additional malicious payloads.

  Relevant MITRE ATT&CK tactics for this rule include:
  - **Execution (T1203)**: Using software to execute code on a target system.

  Primary data sources for detecting this activity include process creation events from endpoint detection capabilities (e.g., EDR solutions) that log the execution of processes and their parent-child relationships. These logs provide insight into suspicious parent processes that might indicate how malicious instances of NetSupport Manager are being invoked.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of `pcictlui.exe`, `pcicfgui.exe`, or `client32.exe` to determine if they were initiated by unusual parent processes indicative of potentially malicious activity.

  - **Investigate Parent Process Relationships**: Trace back the parent processes of the detected NetSupport Manager instances to identify if they were spawned by processes commonly associated with administrative or automation tasks, or if they stem from unknown or malicious sources.

  - **Assess Network Traffic**: Examine outbound connections made by the identified processes for any unusual activity signaling potential command and control (C2) communications or unauthorized data transmission.

  - **Correlate with User Behavior**: Check if the user account associated with the execution of these processes has a legitimate need for remote management tools. Sudden or unexplained usage could indicate compromise.

  ### Prioritization
  The alert is rated as medium severity due to the dual nature of NetSupport Manager as a legitimate remote management tool and its potential misuse by attackers. The likelihood of exploitation is heightened in environments that lack strict access controls or where remote management tools are incorrectly configured or monitored.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if sufficient logging is not enabled for process creation events or if the environment is using EDR solutions that do not log parent-child process relationships effectively. The detection logic assumes that any execution of the specified process under suspicious parent processes is an indicator of potential compromise. For this alert to function correctly, comprehensive process creation logging must be enabled on endpoints where NetSupport Manager may be utilized.

