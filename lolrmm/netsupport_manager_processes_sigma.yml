note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the NetSupport Manager Remote Monitoring and Management (RMM) tool. This tool can be misused for unauthorized remote access, often aligning with adversary objectives such as lateral movement or persistent access within a network. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **Remote System Discovery** (T1219).

  Primary telemetry sources include Windows process creation logs, specifically capturing Event ID 4688 for new process creation. The security impact of malicious use could include unauthorized surveillance, data exfiltration, or system compromises. However, this detection alone does NOT confirm that malicious activity has occurred, as NetSupport Manager may also be legitimately utilized for IT support purposes.

  ### Investigation Steps

  - **Review process execution details:**
    Check Windows Security Event ID 4688 for process details such as `NewProcessName`, `ProcessId`, and `ParentProcessId` associated with `pcictlui.exe`, `pcicfgui.exe`, or `client32.exe`.

  - **Correlate parent-child process relationships:**
    Investigate processes that launched these executables. Legitimate activity often involves a helpdesk or system admin tool that is common in enterprise environments for remote support.

  - **Identify unusual execution patterns:**
    Examine logs for time, frequency, and context of execution. Malicious indicators include execution outside of typical hours for the IT support staff or processes running from non-standard paths.

  - **Check for network connections:**
    Analyze Windows Firewall logs or network device logs during the execution timeframe to identify if outbound connections were established to unexpected external IPs or domains. Malicious usage may attempt to contact C2 servers.

  - **Examine user account activity:**
    Validate the user accounts executing the RMM processes. High-risk indicators arise if a non-IT user or a service account executes these processes, especially without justification.

  - **Assess configuration and deployment of the tool:**
    Check if the deployment of NetSupport Manager is documented and approved within your organization’s IT policies. Unsupported or undocumented instances increase the risk of malicious activity.

  ### Prioritization

  The alert is of medium severity due to the potential for unauthorized remote access, particularly if indicated processes run under unusual user accounts or contexts. The likelihood of malicious abuse increases if these processes occur within sensitive or critical systems. This behavior is not commonly seen but can be indicative of targeted attacks, increasing the importance of thorough investigation.

  ### Blind Spots and Assumptions

  Detection may miss legitimate usage patterns if not configured to monitor all execution instances properly, creating potential blind spots for administrative activities. Adversaries may also use obfuscation techniques or modify process names to evade detection. Legitimate installations of NetSupport Manager may lead to false positives; thus, historical usage data and asset inventories should be reviewed. A companion detection could include monitoring for unusual network traffic patterns associated with outbound communication from these processes.

