  ### Technical Context

  This Sigma rule detects suspicious process activity related to the NetSupport Manager Remote Monitoring and Management (RMM) tool, specifically through its execution or spawning of processes typically associated with remote control functionality. The primary objective for an attacker leveraging this software would be to gain unauthorized remote access to systems, control user sessions, or potentially manipulate system data for malicious intent.

  This behavior relates to the MITRE ATT&CK technique "Remote Control Software" (T1219). Key telemetry sources include Windows process creation logs (Security Event ID 4688) and Sysmon logs capturing process details (Event ID 1). If malicious, the potential security impact includes unauthorized access to sensitive data, system takeover, or lateral movement within the network. It is essential to note that this detection does NOT confirm malicious activity on its own without further investigation.

  ### Investigation Steps

  - **Check process hierarchy:** Review the parent process of the detected processes. Look for the triggering parent (e.g., pcictlui.exe) associated with remote sessions in Security Event ID 4688 logs. Legitimate usage of these tools may originate from trusted administrative tasks.

  - **Validate process origins:** Examine the file path of the detected processes for anomalies or signs of tampering. For instance, processes launching from known directories (e.g., C:\Program Files\NetSupport\) are more likely to be legitimate compared to those from temporary directories.

  - **Identify user behavior:** Review user account activity related to the process creation. Validate if the account associated with the activity has a legitimate need for using RMM tools, ensuring that the behavior aligns with administrative functions.

  - **Investigate network behavior:** Analyze outbound connections initiated by the processes using network logs or firewall logs. Look for atypical connection requests (e.g., to unknown external IPs) that could indicate unauthorized remote access efforts.

  - **Correlate with existing alerts:** Check for other related alerts that may indicate coordinated malicious activity, such as failed logins or unusual access attempts that occurred around the same time as the detected process execution.

  ### Prioritization

  The alert severity is medium because while NetSupport Manager can be used legitimately within enterprise environments, its abuse for unauthorized remote access poses significant risks. The likelihood of encountering malicious abuse is moderate, especially in organizations with insufficient monitoring of remote access tools. This behavior can be weaponized, particularly in targeted attacks or system compromise scenarios.

  ### Blind Spots and Assumptions

  There are limitations inherent in detection as legitimate uses of RMM tools may trigger this alert during normal operations. Required log sources must include detailed process creation logs, and proper configurations for auditing process activities should be in place for reliable detection. Additionally, the tool may be used comfortably in IT environments, raising the risk of false positives. A related detection could include monitoring for unauthorized installation of remote access software to enhance coverage and context surrounding potential incidents.

