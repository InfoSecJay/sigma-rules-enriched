note: |
  ### Technical Context

  This rule detects network activity associated with the eHorus remote monitoring and management (RMM) tool by capturing connections to its associated domains (`*.ehorus.com`). The likely attacker objective is to establish a command-and-control (C2) channel to manage compromised systems within the target environment, facilitating further malicious actions such as data exfiltration or lateral movement. The relevant MITRE ATT&CK tactic is Command and Control (T1071.001), with the technique being Application Layer Protocol (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically monitoring outbound connections to the eHorus domains. If malicious, the activity can indicate an active compromise with the potential for significant operational impact. This detection on its own does NOT confirm the presence of a compromise, as legitimate use of eHorus for remote management may result in similar alerts.

  ### Investigation Steps

  - **Check process execution related to eHorus connections:** Review Windows Security Event ID 4688 logs for new process creation events where the command line arguments show execution paths leading to eHorus binaries or scripts (`ehorus.exe` or similar).

  - **Validate destination connections:** Examine Windows Network Connection logs for Event ID 5156, focusing on connections to `*.ehorus.com`. Identify the source IP addresses, and check if they belong to known management servers.

  - **Identify legitimate use cases:** Investigate recent changes or maintenance schedules to confirm users or IT personnel may be managing devices using eHorus. Document any authorized eHorus activity and user accounts involved.

  - **Look for spikes in eHorus traffic:** Analyze the network traffic volumes to `*.ehorus.com` during the alert period. Any unusually high amounts of traffic could indicate malicious usage or misuse of the RMM tool.

  - **Check for signs of lateral movement:** Review Windows Security Event ID 4624 (Logon events) and Event ID 4672 (Special privileges assigned) to see if there are multiple logins related to administrative users shortly before or after the active connection to eHorus. Consider the timing and nature of the access.

  ### Prioritization

  This alert is of medium severity due to its potential to indicate active C2 communication and the risk associated with using RMM tools for unauthorized access or control of systems. The likelihood of malicious behavior may be moderate, as legitimate use cases exist, but misuse is a common tactic for attackers leveraging RMM software.

  ### Blind Spots and Assumptions

  The detection may be evaded by using tunnels or proxies to obscure the eHorus traffic. It requires that appropriate logging configurations are enabled on Windows hosts to ensure coverage of all relevant activity. Legitimate use of eHorus may trigger this alert, particularly if IT staff utilize the tool without clear documentation. A companion detection rule for general outbound C2 traffic could strengthen the overall detection efficacy in identifying malicious activity.

