  ### Technical Context

  This Sigma rule detects network activity associated with the eHorus Remote Monitoring and Management (RMM) tool by analyzing outbound connections to hostnames ending with 'ehorus.com'. The likely attacker objective is to establish command and control (C2) communications or remote access to compromised systems leveraging this management tool, which may be exploited by threat actors for malicious intent. This behavior aligns with the MITRE ATT&CK technique "Application Layer Protocol" (T1219).

  The primary telemetry source includes Windows network connection logs, particularly those detailing process-level activity that reveals outbound connections and host resolutions. If malicious, this behavior could enable an attacker to control the environment, exfiltrate data, or deploy additional malicious payloads. It's important to note that this detection does NOT confirm malicious activity on its own; legitimate use of eHorus by authorized personnel can also trigger this alert.

  ### Investigation Steps

  - **Verify outbound connections:** Review Windows Security log for Event ID 5156 (Windows Filtering Platform) to confirm outbound connection events to 'ehorus.com'. Cross-reference process IDs with known legitimate eHorus RMM instances.

  - **Identify recent eHorus RMM usage:** Check for legitimate eHorus usage by referencing application installation logs or usage patterns in the organizational asset inventory. Analyze for expected user behavior versus suspicious activity.

  - **Review associated process executions:** Examine Security Event ID 4688 (process creation) or Sysmon Event ID 1 logs to identify which process initiated the connection to 'ehorus.com'. Look for unusual or unauthorized executables, such as cmd.exe or PowerShell, typically used in malicious exploitation.

  - **Look for data exfiltration indicators:** Investigate any large volume data transfers from the host to external IPs resolved from 'ehorus.com'. Check for Event IDs related to file creation or modification, such as Event ID 4663, indicating sensitive files accessed or modified.

  - **Identify unusual user activity:** Evaluate user activity logs for any unexpected accounts or high-privilege user accounts initiating connections to 'ehorus.com'. Correlate any anomalies with known safe user behavior patterns.

  ### Prioritization

  This alert has a medium severity level. While the affected system's impact can be significant if exploited, the likelihood of malicious abuse depends on the context of eHorus usage within the organization. Given that RMM tools can often be weaponized for malicious purposes, analysts should prioritize these alerts according to the system's role and associated risks.

  ### Blind Spots and Assumptions

  Detection limitations may arise due to legitimate usage of eHorus by authorized personnel, which can generate false positives. Reliable detection relies on comprehensive logging of network connections and process executions enabled in the environment; without this, detection capabilities diminish. Additionally, other legitimate software that utilizes similar protocols and network patterns may inadvertently trigger the alert. A related detection that strengthens coverage could include alerting on processes that attempt to connect to multiple similar domains used by RMM tools.

