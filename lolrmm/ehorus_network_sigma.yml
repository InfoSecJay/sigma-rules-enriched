note: |
  ### Technical Context

  This rule detects outbound network connections to the eHorus Remote Monitoring and Management (RMM) tool, specifically targeting destination hostnames ending with `ehorus.com`. Such behavior may indicate unauthorized remote access or management activity by an adversary aiming to compromise systems and maintain persistent control. The relevant MITRE ATT&CK tactic is Execution (TA0002) and the specific technique is Remote Services (T1219). The primary telemetry source is Windows network connection logs, typically found in Windows Event Logs related to network activity.

  If malicious, active eHorus network connections could allow an attacker to fully control the compromised system, exfiltrate data, and install additional payloads. It is important to note that this detection does NOT confirm a breach on its own, nor does it indicate malicious intent since legitimate use of eHorus may occur within the environment.

  ### Investigation Steps

  - **Review network connection logs**: Check Windows Event ID 5156 for any network connections where `DestinationHostname` ends with `ehorus.com`. Look for unusual source IP addresses or user accounts not normally associated with RMM activity.

  - **Identify service accounts**: Determine if any known legitimate service accounts are establishing these connections. Legitimate connections might originate from accounts typically used for remote management within the organization.

  - **Validate against asset inventory**: Cross-reference the connecting hosts with an asset inventory to identify the criticality and expected function of the affected systems. Check for previous registrations of the eHorus application on these machines.

  - **Check for process creation events**: Investigate Windows Security Event ID 4688 or Sysmon Event ID 1 for instances of `eHorus.exe` or similar process executions around the same timestamp as the network connection logs, identifying any unauthorized execution of this tool.

  - **Monitor content of outgoing traffic**: Utilize network tools to inspect the traffic volume and contents for any suspicious data exfiltration patterns, especially concerning high-volume uploads or sensitive data types.

  ### Prioritization

  The alert should be considered medium severity due to its potential impact on compromised systems. The likelihood of malicious abuse is moderate given the existence of legitimate eHorus usage in some environments. Still, connections to this RMM tool warrant careful scrutiny due to the risk of unauthorized access.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate eHorus usage within the organization, potentially resulting in false positives. Ensuring reliable detection requires records of both expected administrative workloads and proper logging configurations to capture all relevant network activity. Legitimate business functions involving remote management could trigger this alert, necessitating careful analysis of user behavior. A related detection to consider is monitoring for the execution of the eHorus agent (Sysmon Event ID 1), establishing a comprehensive view of its use in exploration or command-and-control scenarios.

