  ### Technical Context

  This rule detects network activity associated with the eHorus Remote Monitoring and Management (RMM) tool by monitoring outbound connections to the domain `ehorus.com`. The likely attacker objective may be to establish remote access for malicious purposes, such as data exfiltration or exploitation of resources. The relevant MITRE ATT&CK technique is Remote Access Software (T1219). Primary telemetry sources for this detection include Windows network connection logs, specifically those showing DNS queries and outbound connections. If the activity is malicious, it may indicate compromised systems being controlled or monitored by an adversary.

  This detection alone does NOT confirm malicious activity, as legitimate use of eHorus for remote support and monitoring can trigger the same alerts.

  ---

  ### Investigation Steps

  - **Review outgoing network connections:** Check for outbound connections to `ehorus.com` using Windows Security Event ID 5156 (Windows Filtering Platform). Legitimate activity may show a match with known organizational policies for remote management.

  - **Correlate with asset inventory:** Validate the system initiating the connection by cross-referencing with the endpoint asset database. Ensure it matches expected usage of eHorus by IT support teams rather than unauthorized devices.

  - **Analyze process initiation:** Inspect process creation logs, specifically Windows Event ID 4688, for any processes associated with eHorus, such as `ehorus.exe`. A high-confidence malicious indicator would be unexpected instances of this process on unauthorized machines.

  - **Check DNS logs for historical queries:** Review DNS query logs that may contain references to `ehorus.com` (e.g., Windows DNS logs or network firewall logs). Note potential anomalies, such as high-frequency queries from non-compliant users.

  - **Examine firewall rule changes:** Investigate any recent changes to firewall rules or outbound network filtering rules that might permit connections to `ehorus.com`. Unauthorized alterations could indicate risky behaviors or compromise.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential risk of unauthorized remote access. The impact of exploitation could lead to significant data breaches or resource manipulation, especially if critical assets or sensitive systems are involved. The use of RMM tools by adversaries is not uncommon, enhancing the likelihood of malicious abuse in this context.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by effective obfuscation techniques employed by adversaries using the eHorus tool. Reliability of detection is contingent on comprehensive logging of network connections and visibility into all active outbound communications. Legitimate RMM usage by IT personnel could generate false positives. A related detection worth considering is monitoring for signs of established remote sessions via other RMM tools (e.g., TeamViewer, AnyDesk) to enhance coverage against potential abuse.

