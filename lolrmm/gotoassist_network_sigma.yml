note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the GoToAssist Remote Management Tool (RMM). The behavior indicates potential usage of remote control software, which adversaries may exploit to gain access to systems undetected and manipulate system configurations or exfiltrate data. It primarily aligns with the MITRE ATT&CK tactic of Command and Control (T1219).

  The primary telemetry sources are network connection logs that capture destination hostnames, indicating where outbound communications are occurring. A malicious use of this tool could lead to unauthorized remote access, allowing attacks such as data theft, system manipulation, or lateral movement within the network. This detection does NOT confirm that the activity is malicious on its own, as GoToAssist can also be used for legitimate remote support by authorized personnel.

  ### Investigation Steps

  - **Check network connection logs: ** Review Windows network connection logs for Event ID 5156 to find connections to domains such as 'goto.com' or 'getgo.com’ that could indicate unauthorized remote access attempts.

  - **Identify authorized usage: ** Cross-reference any identified GoToAssist activity with your organization’s list of approved remote support tools and legitimate business needs, particularly from IT support roles.

  - **Evaluate connection duration and frequency:** Look for unusually long connection times or high frequency of connections to the identified domains, which may indicate ongoing unauthorized remote sessions.

  - **Review system modifications:** Examine the Windows Security Event ID 4688 logs for any process creation events linked to GoToAssist executables (e.g., GoToAssist.exe), which can confirm if the application is being run, particularly by non-IT personnel.

  - **Check for sensitive data access:** Investigate if sensitive data was accessed or modified during the remote session by analyzing relevant logs (e.g., file access logs), specifically focusing on any ticketing or remote support logs generated during the same timeframe.

  ### Prioritization

  The alert is considered medium severity due to its potential impact on sensitive systems and data. The likelihood of malicious abuse is moderate, as GoToAssist is a legitimate tool but can easily be weaponized for unauthorized access. Similar behavior has been observed in attacks targeting sensitive environments.

  ### Blind Spots and Assumptions

  This detection is limited by the possibility of legitimate GoToAssist usage by authorized personnel, leading to false positives. It requires proper logging of network connections and process creation to ensure comprehensive coverage. Legitimate remote support operations, especially during system troubleshooting, may trigger the alert. Deploying companion detections focusing on other remote management tools (e.g., TeamViewer or AnyDesk) would strengthen coverage against potential abuse scenarios.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
