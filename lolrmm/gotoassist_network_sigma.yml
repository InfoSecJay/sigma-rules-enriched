note: |
  ### Technical Context

  This Sigma rule detects potential network activity associated with the GoToAssist remote management tool. Attackers may utilize this tool to establish unauthorized remote access to compromise systems, exfiltrate data, or manipulate devices within the network. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), with the specific technique being Remote Access Tools (T1219).

  Primary telemetry sources include Windows network connection logs (Event ID 5156 for Windows Filtering Platform) capturing the destination hostnames associated with GoToAssist services. If malicious, this activity can lead to significant security breaches, including data theft and disruption of IT operations. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate users may utilize GoToAssist for remote support sessions.

  ### Investigation Steps

  - **Examine recent network connection logs**: Review Windows security logs for Event ID 5156 and identify connection attempts to any of the respective GoToAssist domains. Compare the timestamps to the alert to validate context.

  - **Identify the client application**: Look for Event ID 4688 (Process Creation) in Windows Security logs to determine if the GoToAssist application is executing. Legitimate usage should show expected processes with user accounts known to employ remote support.

  - **Check user accounts' authorization**: Verify if the user initiating the GoToAssist connection has appropriate permissions and is included in accepted roles for remote support tasks. Unusual accounts initiating this tool may indicate misuse.

  - **Monitor for concurrent anomalies**: Review logs for other suspicious activities coinciding with the GoToAssist connections, such as unusual login times, failed authentication attempts, or connections to known malicious IPs.

  - **Validate external connections**: Perform an outbound connection test to confirm whether the destination hostnames are truly representative of GoToAssist services or if they're being masqueraded for nefarious purposes.

  ### Prioritization

  This alert has a medium severity level due to the potential risk associated with unauthorized remote access facilitated by the GoToAssist tool. While not all instances are malicious, the possibility of exploitation is realistic, particularly if the source is untrusted or unexpected.

  ### Blind Spots and Assumptions

  The detection's limitations include potential evasion techniques where attackers may obfuscate connections to GoToAssist services. Required log sources for reliable detection are active logging for network traffic and process creation in Windows environments. Legitimate support operations could trigger this alert, particularly during busy remote support sessions. A related detection for file transfers using tools like PsExec may strengthen incident investigation and response efforts.

