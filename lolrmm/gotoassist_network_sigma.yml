note: |
  ### Technical Context

  This rule detects potential network activity associated with the GoToAssist remote management tool. The behavior indicated may be consistent with unauthorized remote access attempts by an adversary aiming to gain control over systems or perform unauthorized support actions. Relevant MITRE ATT&CK tactics include Execution and the technique ID T1219, which relates to Remote Access Tools.

  Telemetry sources include Windows event logs, specifically network connection events detailing connections to specific domains. The security impact is significant if malicious, as it can lead to system compromise and data exfiltration. However, this detection does NOT confirm any malicious activity on its own; legitimate use of GoToAssist is common in technical support scenarios.

  ### Investigation Steps

  - **Verify active sessions:** Check for current sessions using tools such as `netstat` or resource monitoring in Task Manager for any legitimate GoToAssist processes on the affected host. Legitimate sessions typically show expected application behavior, such as Service Desk teams connecting during regular business hours.

  - **Inspect Windows Event Logs:** Review Security Event ID 5156 (Windows Filtering Platform) for outbound connections to IP addresses associated with GoToAssist domains (e.g., goto.com, getsupport.com). Confirm any accompanying unusual activity, such as multiple rapid connections.

  - **Assess connection logs:** Examine network connection logs for unusual peaks in outbound traffic to GoToAssist domains. A spike outside of normal operational hours may indicate potential misuse.

  - **Cross-reference application usage:** Identify recent software installations or usages in application logs (e.g., Windows Event ID 4688 for process creation) that align with the GoToAssist tool, ensuring that the use aligns with job functions.

  - **Evaluate user account activity:** Check for any anomalies in user behavior in Azure Active Directory or Active Directory logs relevant to the user associated with detected connections. Anomalies might manifest as logins from unusual IP addresses or compromised accounts typically managed by IT support.

  ### Prioritization

  The alert is of medium severity because it originates from a commonly used remote access tool, which poses a moderate risk if exploited by malicious actors. While remote access tools are often utilized for support by IT teams, they can be weaponized for unauthorized access if misconfigured or abused.

  ### Blind Spots and Assumptions

  This detection may have limitations as legitimate use of GoToAssist could easily trigger alerts without confirming malicious intent. Reliable detection hinges on the compilation of network connection logs and the performance of appropriate filters. Additionally, awareness of legitimate remote support activities is crucial, as regular user support interactions may falsely appear as suspicious. Companion detections include monitoring for unusual account behaviors (via Azure AD sign-in logs) that could indicate credential misuse related to remote access tools.

