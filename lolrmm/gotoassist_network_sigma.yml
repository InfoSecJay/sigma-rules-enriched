note: |
  ### Technical Context
  This detection rule identifies network activity associated with the GoToAssist Remote Management and Monitoring (RMM) tool, which is often used for remote support and access by IT professionals. Detection focuses on outbound connections to known domains associated with GoToAssist, indicating potential unauthorized use of this tool within the enterprise. Attackers may exploit legitimate remote support tools like GoToAssist to facilitate remote access to compromised systems, enabling data exfiltration, lateral movement, or persistence within the network.

  The relevant MITRE ATT&CK tactics for this detection include **Execution** (TA0002) as the attacker executes code remotely, and **Remote Services** (T1219), where legitimate services are utilized to perform unauthorized actions on a target system.

  Primary data sources for detecting this activity include network connection logs from Windows operating systems, specifically monitoring outbound connections to specific domains and IP addresses associated with GoToAssist.

  ### Investigation Steps
  - **Review Outbound Network Connections**: Examine network connection logs for any outbound traffic directed towards the identified GoToAssist domains. Pay attention to the time, frequency, and volume of these connections to identify anomalous patterns.

  - **Correlate with User Activity**: Check for recent user login activity on the systems generating these outbound requests. Validate whether users had legitimate needs for remote support or if these connections align with suspicious account behavior.

  - **Assess for Unauthorized Use**: Investigate any alerts or logs concerning system changes, file transfers, or other network behaviors that may correlate with the identified GoToAssist connections, which could indicate exploitation or misuse of the tool.

  - **Investigate Endpoint Behavior**: Use EDR tools to analyze endpoints that initiated connections to GoToAssist domains. Look for unusual processes running, particularly connections that seem to have been initiated outside normal operational windows or those that deviate from standard application behavior.

  ### Prioritization
  The alert is rated as medium severity due to the potential misuse of a legitimate remote management tool, which can lead to unauthorized access and control over systems within the enterprise. While not inherently malicious, unmonitored usage indicates a risk that should be assessed and addressed promptly.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage concerning variations of network behavior associated with similar RMM tools that do not utilize the specified domains. The detection logic assumes that outbound connections to the specified list of domains are unauthorized; however, legitimate usage within the organization is a potential false positive. This rule also relies on the presence of accurate network connection logs and appropriate monitoring configurations to successfully trigger alerts based on outbound network activity to these domains.

