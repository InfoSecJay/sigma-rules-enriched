note: |
  ### Technical Context

  This Sigma rule detects network connections made to domains associated with the GoToAssist Remote Monitoring and Management (RMM) tool. Attackers may leverage this tool to facilitate remote access for system exploitation, information theft, or malware deployment. This behavior is commonly categorized under the MITRE ATT&CK technique for Remote Access Software (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically monitoring for outbound connections or DNS resolutions to specified GoToAssist domains. If confirmed as malicious, the potential impact could include unauthorized access to sensitive systems and data exfiltration. However, a triggered alert does NOT confirm malicious activity on its own, as legitimate use of GoToAssist within enterprise environments may lead to similar alerts.

  ### Investigation Steps

  - **Identify network connections to target domains:** Review Windows event logs for outbound connections (Event ID 5156) to domains such as `goto.com`, `getgo.com`, and `fastsupport.com`. Note the associated process and user account for context.

  - **Analyze process execution data:** Check related process creation logs (e.g., Sysmon Event ID 1) for the execution of processes that typically lead to GoToAssist connections, such as `GotoAssist.exe`. Evaluate command line parameters for anomalies.

  - **Review user behavior:** Look for historical usage patterns of legitimate GoToAssist interaction by correlating user activity logs (e.g., Event ID 4624) and validated session times to confirm expected use.

  - **Determine network context:** Investigate firewalls or proxy logs for DNS lookups or web traffic hitting GoToAssist URLs. Confirm if traffic aligns with legitimate remote support sessions.

  - **Check for anomalies in asset criticality:** Consider the role of the affected system; connections from critical assets should be thoroughly scrutinized. Analyze if the endpoint has recent changes in ownership or access rights, which may suggest unauthorized use.

  ### Prioritization

  The alert severity is medium, primarily due to the potential for system access and data compromise via the RMM tool. The likelihood of misuse exists if attackers can impersonate legitimate users or exploit unmonitored sessions. Additionally, remote access tools like GoToAssist are frequently weaponized, warranting careful analysis.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers using domain fronting techniques or masquerading legitimate software usage. Required reliable detection necessitates logging configurations that capture detailed network activity and process execution context. Legitimate activities such as remote support sessions may trigger alerts, underscoring the need for contextual analysis. A related detection could involve monitoring for abnormal DNS lookups from the same endpoints, enhancing identification of unauthorized remote access activities.

