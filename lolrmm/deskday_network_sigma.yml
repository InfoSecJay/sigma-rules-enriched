note: |
  ### Technical Context

  This rule detects outbound network connections to domains associated with the DeskDay Remote Monitoring and Management (RMM) tool. The behavior suggests an attacker may be establishing command and control (C2) communications or leveraging RMM capabilities for unauthorized access or lateral movement within the network. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), with a specific technique being "Application Layer Protocol" (T1219). The primary telemetry source is Windows network connection logs, particularly those detailing DNS queries and outbound connections. If malicious, an organization could suffer data loss, system compromise, or unauthorized remote access. It is essential to highlight that this detection does NOT confirm malicious intent without additional supporting evidence.

  ### Investigation Steps

  - **Verify network connections:** Check Windows network connection logs (Event ID 5156 or Sysmon Event ID 3) for outbound connections to any of the DeskDay domains. Look for unusual destination IPs that do not resolve to standard service endpoints.

  - **Examine user activity:** Review Security Event ID 4624 (Logon) and Event ID 4672 (Special Privilege Use) to identify whether privileged accounts initiated these connections. Legitimate DeskDay usage often involves specific user roles, such as IT support or system administrators.

  - **Cross-reference DNS logs:** Validate DNS query logs for resolutions of domains associated with DeskDay (e.g., app.deskday.ai). Look for patterns or high volumes of queries in a short time frame that are atypical for the environment.

  - **Identify high-confidence malicious indicators:** Look for multiple connections to DeskDay domains quickly following suspicious account behavior, such as failed login attempts (Event ID 4625) or logins from unusual locations/anomalous hours.

  - **Use threat intelligence sources:** Query external threat intelligence databases for any reported malicious activity associated with DeskDay domains or IP addresses. Update detection content as necessary based on findings.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impacts if exploited, particularly on critical systems like workstations used for remote management. The likelihood of malicious abuse is elevated, especially if the behavior deviates from normal network patterns, as RMM tools are frequently weaponized in cyber incidents.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of the DeskDay RMM tool, resulting in false positives. Ensure all appropriate Windows logging is enabled, particularly for network connections and user authentication events, to enhance detection efficacy. Be aware that legitimate software updates or administrative tasks may generate similar network activity patterns. A related detection could involve monitoring for processes that spawn from known RMM executables, further strengthening coverage against unauthorized use.

