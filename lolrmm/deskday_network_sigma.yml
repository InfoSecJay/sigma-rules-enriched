  ### Technical Context

  This Sigma rule detects outbound network connections to the DeskDay RMM (Remote Monitoring and Management) tool, specifically through the domain names `deskday.ai` and `app.deskday.ai`. Attackers may use this tool for remote access, system configuration, and deployment of malicious payloads after gaining initial access to a compromised system. The relevant MITRE ATT&CK tactic is “Execution” (TA0040), with the technique being “Remote System Discovery” (T1219). The primary telemetry sources for this detection are network connection logs from Windows systems, particularly monitoring DNS queries and outbound connections.

  If the DeskDay RMM tool is being used without proper authorization, it can have significant security implications, such as unauthorized remote access and subsequent data exfiltration or lateral movement within the environment. However, this detection alone does not confirm malicious activity, as legitimate usage of DeskDay by authorized administrators can trigger this alert.

  ### Investigation Steps

  - **Check connection logs to DeskDay domains:** Review Windows security logs (Event ID 5156) to find entries about outbound connections to `deskday.ai` or `app.deskday.ai`, focusing on timestamps correlating to the trigger of the alert.

  - **Corroborate with network sniffing data:** Analyze packet captures or flow logs (e.g., NetFlow) to confirm the nature of the traffic sent to the DeskDay domains. Look for unusual command and control patterns or excessive data transfers.

  - **Identify user accounts associated with activity:** Utilize Security Event ID 4624 to examine logins or connections that occurred around the time of the alert, especially looking for accounts with administrative privileges or those not typically associated with DeskDay usage.

  - **Determine if DeskDay was installed legitimately:** Investigate installed programs (using WMIC or PowerShell cmdlets) for any evidence of the DeskDay RMM software, ensuring that any installations are authorized by the organization and match expected host roles.

  - **Review application logs for legitimate usage patterns:** Examine logs from other applications involved with remote access protocols (e.g., RDP, TeamViewer) to identify whether the DeskDay activity may coincide with expected administrative tasks.

  - **Identify high-confidence malicious indicators:** Look for signs of data exfiltration or unauthorized activity, such as unusual file modifications, new user accounts created on the machine (Security Event ID 4720), or processes spawned from the DeskDay tool (Sysmon Event ID 1).

  ### Prioritization

  This alert has medium severity due to the potential risk of unauthorized remote access by an attacker using legitimate tools. The likelihood of malicious abuse is moderate, especially if the organization has not officially adopted DeskDay as part of its operational tools. While this detection can indicate suspicious behavior, it is not uncommon for RMM tools to be weaponized for nefarious purposes.

  ### Blind Spots and Assumptions

  This detection may miss cases where attackers employ evasion techniques such as tunneling through VPNs or using encrypted services to obscure their traffic. Reliable detection relies on having comprehensive network logging enabled, including DNS and outbound connection logs. Legitimate administrative activities, such as monitored updates or support sessions using DeskDay, may falsely trigger the alert. For improved coverage, companion detections could include monitoring for unauthorized installations of remote access tools or changes in user privilege levels.

