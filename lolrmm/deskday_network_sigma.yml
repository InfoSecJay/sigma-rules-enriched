note: |
  ### Technical Context

  This rule detects outbound network connections to domain names associated with the DeskDay Remote Monitoring and Management (RMM) tool. These connections may indicate unauthorized remote access or command and control capabilities being leveraged by an attacker. The likely objective of the adversary is to manipulate or gather information from compromised systems, fitting into MITRE ATT&CK tactic: Command and Control (T1071).

  The primary telemetry source is Windows network connection logs, specifically looking at outbound connections. The security impact of malicious activity can include unauthorized access to sensitive data, installation of malware, or further lateral movement within the environment. It is important to note that this detection alone does not confirm malicious intent, as legitimate use of the DeskDay tool may trigger the same alert.

  ### Investigation Steps

  - **Examine outbound connections to DeskDay domains:** Check network connection logs (e.g., Windows Event ID 5156) for connections to ‘deskday.ai’ or ‘app.deskday.ai’. Document any endpoints making these connections for further analysis.

  - **Identify process initiation context:** Review associated process creation logs (Windows Event ID 4688) that coincide with the network connections to identify if a legitimate application (e.g., DeskDay) is executing or if an unauthorized process (e.g., cmd.exe, powershell.exe) is involved.

  - **Determine expected usage patterns:** Investigate whether the observed hosts have a business justification for accessing DeskDay services. Review asset inventory for roles that typically use RMM tools to filter out benign cases.

  - **Check for lateral movement activity:** Look for other suspicious outbound connections or process executions that might indicate further compromise, such as connections to known malware servers or unusual use of scripting languages (e.g., powershell).

  - **Validate with threat intelligence feeds:** Cross-reference the destination IPs or observed behaviors with threat intelligence databases to identify if the activity aligns with known malicious behavior associated with the DeskDay tool.

  ### Prioritization

  This alert should be considered medium severity. Systems making unauthorized connections to DeskDay can signal potential compromises, especially if they exhibit additional malicious behaviors. As RMM tools are frequently targeted for misuse, the likelihood of this behavior being weaponized is moderate.

  ### Blind Spots and Assumptions

  Detection may be limited by firewall configurations that do not log outbound connections effectively or if legitimate RMM activities are common in organizational workflows. Only logging network connections to specified domains could overlook connections to dynamic IPs. Related detections could include monitoring for unusual process activity or other remote access tools that operate in a similar manner.

