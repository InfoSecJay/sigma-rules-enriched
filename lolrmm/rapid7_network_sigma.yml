note: |
  ### Technical Context

  This rule detects network connections to specific Rapid7 domains associated with their Remote Monitoring and Management (RMM) tool. The likely attacker objective is to use the RMM tool for command and control (C2) purposes, often to manage and exploit compromised endpoints. This detection relates to the MITRE ATT&CK techniques: Command and Control (T1071) and Application Layer Protocol (T1219). The primary telemetry sources are Windows network connection logs, specifically focusing on the destination hostnames which are part of the Rapid7 domain. If malicious, this behavior could indicate unauthorized remote access to systems that may lead to data exfiltration, lateral movement, or further exploitation. Importantly, this detection does NOT confirm malicious activity on its own, as it could also indicate legitimate use of the Rapid7 RMM tool.

  ### Investigation Steps

  - **Check network connections:** Review all network connections originating from sensitive endpoints by filtering for Event ID 5156 in Windows Security logs. Identify connections to `*.analytics.insight.rapid7.com` or `*.endpoint.ingress.rapid7.com`.

  - **Identify legitimate use:** Validate if the organization has a legitimate use case for Rapid7 by consulting the asset inventory and confirming authorized usage on systems that should connect to these domains.

  - **Look for rapid connections:** Examine the connection frequency within a short time frame. Frequent, repeated connections to these domains (e.g., multiple connections every minute) from the same host may indicate suspicious behavior.

  - **Check for anomalous processes:** Investigate the process making the network connection using Sysmon Event ID 3. Look for unusual processes or scripts typically not associated with RMM operations, such as PowerShell scripts or unknown executables.

  - **Review outbound traffic:** Analyze outbound Windows Firewall logs (Event ID 5140) for additional context on volume and timing of the connections to better assess potential data exfiltration without legitimate user activity.

  ### Prioritization

  The alert severity is medium due to the potential impact of compromised systems that could lead to data breach incidents. The likelihood of malicious abuse is moderate, as the Rapid7 RMM tool is commonly used by attackers for unauthorized access operations, although it can also be invoked legitimately.

  ### Blind Spots and Assumptions

  This detection has limitations, particularly around legitimate administrative activities that may generate similar network traffic. Essential log sources include Windows Firewall and Sysmon, necessitating proper configuration for comprehensive visibility. Common legitimate activities could involve system administrators conducting maintenance or updates through Rapid7. To strengthen coverage, companion detections for anomalous authentication events (e.g., failed logins related to RMM access) would provide additional context for ongoing investigations.

