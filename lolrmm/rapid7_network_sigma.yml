  ---

  ### Technical Context

  This detection captures network activity indicative of the Rapid7 Remote Monitoring and Management (RMM) tool by identifying connections to specific Rapid7 domains. The likely attacker objective may include remote intrusion or exploitation of systems for reconnaissance, lateral movement, or data exfiltration. This behavior aligns with the MITRE ATT&CK technique "Remote System Discovery (T1219)."

  Primary telemetry sources include Windows network connection logs, particularly focusing on outbound connections to `*.analytics.insight.rapid7.com` and `*.endpoint.ingress.rapid7.com` domains. If malicious, an attacker could utilize these tools to manage compromised machines stealthily. Importantly, this detection does NOT confirm that malicious activity is occurring—it merely indicates potential use of the Rapid7 RMM tool.

  ---

  ### Investigation Steps

  - **Verify source of network connections:**
    Review Security Event ID 5156 entries associated with outbound connections. Check the "DestinationHostname" field for matches to `*.analytics.insight.rapid7.com` or `*.endpoint.ingress.rapid7.com`. Confirm unexpected hosts, especially non-admin or non-management roles.

  - **Check process origins:**
    Analyze Security Event ID 4688 (Process Creation) logs for process creation events associated with Rapid7 executables or common management tools (e.g., `rmm.exe`, `msiexec.exe`). Determine if these processes originate from expected paths (e.g., C:\Program Files\Rapid7).

  - **Assess network traffic volume:**
    Evaluate the amount of data transmitted to Rapid7 domains. High outbound volumes, particularly in conjunction with a large number of connections in a short period, may indicate malicious usage rather than standard management.

  - **Identify legitimate use:**
    Review documentation and inventory of authorized use of Rapid7 RMM within the organization. Compare any detected connections against known legitimate workstation management schedules and user roles.

  - **Cross-reference with user activity:**
    Check user activity logs (e.g., Windows Security Event ID 4624) to correlate the timing of connections. Look for recent logins from users expected to manage systems remotely.

  ---

  ### Prioritization

  This alert has medium severity due to the potential misuse of Remote Monitoring tools, which can facilitate unauthorized access to sensitive systems. The likelihood of abuse is moderate, especially in environments where such tools are not well-managed or monitored. This behavior can be weaponized, especially when attackers seek to maintain persistence on compromised hosts.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by potential legitimate use of Rapid7 RMM, which may trigger the alert without malicious intent. Reliably detecting this behavior requires comprehensive visibility into network connections and process creation events. Legitimate administrative actions can lead to alerts, especially during maintenance periods. Related detection, such as monitoring for unexpected administrative access (e.g., Event ID 4624 with elevated privileges), can further strengthen coverage against misuse.

