note: |
  ### Technical Context

  This Sigma rule detects network activity from the Rapid7 RMM (Remote Monitoring and Management) tool by monitoring outbound connections to specific Rapid7 domains. The likely attacker objective is to use this tool to gain unauthorized access or to manage compromised systems. The relevant MITRE ATT&CK tactic and technique are "Execution" (TA0002) and "Remote Service Session" (T1219). Primary telemetry sources include Windows network connection logs, specifically monitoring for Event ID 5156 to identify allowed packet-filtering rules for network connections. If malicious, the security impact could include unauthorized remote system access and potential lateral movement within the network. This detection does NOT confirm that the activity is definitively malicious or that an adversary is present, as legitimate use of Rapid7 tools exists.

  ### Investigation Steps

  - **Check network connections for Rapid7 domains:** Review outbound connections in Windows Event ID 5156 logs for DestinationHostnames ending with '.analytics.insight.rapid7.com' or '.endpoint.ingress.rapid7.com'. Identify if unexpected systems are attempting to connect.

  - **Identify authorized Rapid7 usage:** Validate if Rapid7 RMM is in use within the organization, reviewing asset management and configuration documentation to confirm whether the affected host is a designated RMM client.

  - **Analyze associated process activity:** Use Sysmon Event ID 1 to correlate the process creating network connections. Look for instances of Rapid7 executables (e.g., RMMAgent.exe) to determine if the process appears legitimate or has anomalous command-line arguments.

  - **Examine user activity logs:** Review user activity logs around the time of the connection, focusing on Event ID 4624 for successful logon attempts. Detect if logins correspond to authorized administrative users or if there are unexpected users.

  - **Assess for signs of data exfiltration:** Look for any rapid file transfers or connection patterns indicative of potential data exfiltration following the connection, using Event ID 4663 to identify file access events that coincide with network connections.

  ### Prioritization

  This alert has medium severity due to the potential risk of using a legitimate tool for malicious purposes, especially if it is observed on critical systems. If the systems involved are sensitive or contain confidential information, the likelihood of malicious abuse increases. While Rapid7 tools are commonly used in legitimate contexts, the specific behavior monitored can also be weaponized by adversaries.

  ### Blind Spots and Assumptions

  The detection may be limited by configurations not capturing all relevant network traffic, particularly if outbound traffic is filtered. Legitimate activities such as maintenance or troubleshooting by IT staff using Rapid7 tools might trigger this alert, leading to false positives. A related detection to strengthen coverage is monitoring for unusual administrative logins or activity patterns that do not align with typical usage of Rapid7 RMM tools.

