note: |
  ### Technical Context

  This Sigma rule detects file activity related to the LocalXpose Remote Management and Monitoring (RMM) tool on Windows systems. The presence of this tool may indicate an attacker’s objective to establish or maintain command-and-control (C2) capabilities or facilitate remote access within a compromised environment. It aligns with the MITRE ATT&CK technique "Application Layer Protocol" (T1219), commonly leveraged for C2 purposes.

  Primary telemetry sources include file event logs from Windows, specifically monitoring for file creations and modifications of executables and configuration files associated with LocalXpose. If malicious, this activity could enable an adversary to remotely control the system and exfiltrate sensitive data. However, the detection does NOT confirm that the observed activity is inherently malicious, as LocalXpose may be legitimately used in certain organizational contexts.

  ### Investigation Steps

  - **Identify File Creation Events**: Review file event logs for Event ID 4663 where `TargetFilename` matches either `loclx.exe` or `config.yaml` in the `%APPDATA%\loclx\` directory. Note the timestamp and source user associated with these events.

  - **Determine Contextual Usage**: Investigate the account creating or modifying the files. Determine if the account or system typically runs LocalXpose as part of their operational duties. Cross-reference against a known list of authorized software.

  - **Assess Network Connections**: Analyze network logs for outbound connections from the host running LocalXpose. Look for unusual application layer protocol communications directed toward IPs that are not recognized or are on blocklists.

  - **Review Installed Applications**: Use software inventory tools to check for the presence of LocalXpose on the system. If absent yet appearing in logs, it may indicate a potentially unauthorized installation.

  - **Check Process Creation Logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for any instances of `loclx.exe` being invoked. Assess the parent process to differentiate legitimate usage from suspicious behavior.

  - **Validate Configuration File Contents**: If `config.yaml` is created or modified, inspect its contents for indicators of malicious usage (e.g., unexpected routing rules, hidden configurations). Look for unusual or unfamiliar settings that deviate from standard operational norms.

  ### Prioritization

  This alert has medium severity due to the possible impact on affected systems that may facilitate remote access for an attacker. The likelihood of malicious abuse is moderate, considering LocalXpose’s legitimate use cases in some environments. However, its association with command-and-control activities makes it a noteworthy indicator of potential compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of LocalXpose, leading to potential false positives. Reliable detection relies on the configuration of file event logging for all directories associated with application data. The alert may also trigger during legitimate software installation or updates involving LocalXpose. A companion detection for outbound network activity associated with Remote Management could bolster threat detection regarding potential command-and-control activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
