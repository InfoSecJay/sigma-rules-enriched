note: |
  ### Technical Context

  This Sigma rule detects file activity related to the LocalXpose Remote Management Tool (RMM), specifically the execution of its executable (`loclx.exe`) or changes to its configuration files (`config.yaml`). The likely attacker objective involves establishing a reverse shell or exposing local services to the internet, facilitating unauthorized access or data exfiltration. This detection correlates with the MITRE ATT&CK technique 'Remote Services' (T1219).

  Primary telemetry sources include Windows File Events and any associated application logs that might log creation or modifications of these specific files. If detected activity is malicious, it could lead to an adversary gaining persistent access to the environment. This detection does NOT confirm that the usage of LocalXpose is inherently malicious, as it may be legitimate in some operational contexts.

  ### Investigation Steps

  - **Verify executable presence: ** Check for the execution of `loclx.exe` using Windows Security Event ID 4688 to confirm process creation. Compare parent process IDs to identify suspicious parent relationships that might suggest malware behavior.

  - **Inspect configuration file modifications: ** Review Windows File Event logs for any changes to `config.yaml` in the `%APPDATA%\loclx\` directory (Event ID 4663), specifically looking for unexpected changes in file size or timestamp from normal user accounts.

  - **Identify legitimate use cases: ** Determine legitimate use by cross-referencing system usage patterns. For example, verify if authorized users have scheduled tasks or documented use of LocalXpose, looking for consistent execution patterns rather than isolated instances.

  - **Correlate with network activity: ** Monitor related network connections for outgoing traffic to suspicious external destinations or unusual ports using network monitoring tools (e.g., 443 or custom TCP/UDP), especially shortly after file activity.

  - **Check for persistence mechanisms: ** Investigate if there are other file creation artifacts related to LocalXpose, such as startup entries or scheduled tasks that persistently execute `loclx.exe`, which are indicative of ongoing malicious behavior.

  ### Prioritization

  This alert carries a medium severity level, as the potential presence of LocalXpose can expose critical internal services and data. While it is not commonly weaponized by default, its misuse in exfiltration scenarios increases the urgency for investigation, particularly in sensitive environments.

  ### Blind Spots and Assumptions

  Detection may miss explicitly renamed variants of the LocalXpose tool or more sophisticated circumventions by attackers. Accurate detection requires the configuration of file event logging and monitoring of all user activity to capture context. Legitimate administrative tasks, such as remote troubleshooting, can trigger this alert. A related detection that strengthens overall coverage would include monitoring for service creation or manipulation using Windows Service Control events, which can indicate persistence efforts related to remote tools.

