note: |
  ### Technical Context

  This rule detects file activities related to the LocalXpose Remote Management and Monitoring (RMM) tool, specifically monitoring access to files such as `loclx.exe` and configuration files in the user’s AppData folder. The likely objective of an attacker using this tool would be to set up a reverse proxy for remote access to internal systems, facilitating Command and Control (C2) operations. This behavior corresponds to the MITRE ATT&CK tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1219).

  Primary telemetry sources include Windows File Event logs that capture file access events. If malicious, the use of LocalXpose can lead to unauthorized access to sensitive systems and data exfiltration. However, it is important to note that detection of these file accesses does NOT inherently confirm malicious intent; legitimate users may also deploy the LocalXpose tool for valid reasons.

  ### Investigation Steps

  - **Review file access events:** Examine Windows Event ID 4663 for accesses to `loclx.exe` and related configuration files, ensuring to note the user and process initiating the access. A legitimate admin may access these files with processes like PowerShell or Command Prompt for configuration changes.

  - **Correlate with running processes:** Utilize Sysmon Event ID 1 to check if `loclx.exe` is currently running on the system. If this binary is active and matches a user with limited authority, it may indicate potential unauthorized usage.

  - **Investigate user context:** Analyze user activity around the time of the alert using Windows Event ID 4624 (Logon events) to confirm if the user is authorized to execute LocalXpose. Legitimate users should ideally show a history of valid administrative activities.

  - **Monitor for outbound connections:** Review firewall logs for unusual outbound traffic to known unusual IP addresses or domains, especially if the `loclx.exe` process established a connection. High traffic to unknown destinations could indicate malicious data exfiltration attempts.

  - **Analyze configuration files:** Verify if changes in `%APPDATA%\loclx\config.yaml` correspond with the accesses detected. Any unauthorized modifications—such as adding unknown C2 IPs—suggest potentially malicious configurations.

  ### Prioritization

  This alert should be treated with medium severity due to the current active presence of the LocalXpose tool, which could facilitate malicious remote access. The impact is substantial if the affected system is critical, especially if exfiltration capabilities are misused. While the tool is not commonly weaponized in widespread attacks, its use can lead to effective C2 situations when exploited.

  ### Blind Spots and Assumptions

  Detection relies heavily on the availability of Windows File Event logs and sufficient granularity in audit policies. Legitimate uses of LocalXpose, particularly in development or testing environments, may generate similar alerts. To strengthen coverage, complement this rule with detections that monitor for abnormal outbound connections (e.g., unexpected DNS queries or unusual HTTP requests), enhancing the overall visibility of potential C2 activities.

