note: |
  ### Technical Context

  This rule detects the execution of the LocalXpose RMM tool, particularly when files with the name `loclx.exe` are created or modified. This behavior is typically associated with the objective of establishing remote access to a compromised local network, potentially allowing an attacker to exfiltrate data or control internal systems. The relevant MITRE ATT&CK tactic is Command and Control, specifically Technique T1219 (Remote Access Software).

  The primary telemetry source is Windows file event logs that track file system activities. A successful execution of `loclx.exe` can have significant security implications, potentially compromising sensitive data or system integrity. It’s important to note that this detection alone does not confirm malicious intent, as LocalXpose could be used for legitimate purposes.

  ### Investigation Steps

  - **Check file execution evidence:** Review Windows Security Event ID 4688 to find details on the execution of `loclx.exe`, including the user context and parent process. Consider if the execution was performed by a known and trusted user.

  - **Review file access logs:** Examine Windows File System logs for any reads or writes to `loclx.exe` (Event ID 4663). Look for unusual access patterns, like creation from non-administrative user accounts.

  - **Inspect for network activity:** Analyze network logs (such as Windows Firewall or equivalent) for outbound connections made by `loclx.exe`. Specifically, check for any unexpected or unauthorized remote IP addresses or unusual port usage that aligns with Command and Control activity.

  - **Assess legitimate usage cases:** Determine if `loclx.exe` execution aligns with known business processes. Review if any documented use cases for LocalXpose exist, such as remote development tasks, and confirm if users have been trained on its appropriate usage.

  - **Identify high-confidence malicious indicators:** Look for logs indicating connections to malicious IPs associated with known Remote Access Tools. Utilize threat intelligence sources to correlate IP addresses with reported Command and Control infrastructure.

  ### Prioritization

  This alert is of medium severity due to the potential impact on security and system integrity of the affected system. The likelihood of malicious abuse exists, particularly if `loclx.exe` is detected in environments where it is not part of standard operational practices. Remote Access Tools are commonly weaponized by adversaries to facilitate unauthorized access.

  ### Blind Spots and Assumptions

  Detection may be limited if logging for file events is not comprehensively configured or if endpoint protection tools are overly restrictive, potentially blocking legitimate usage. Legitimate activities that could trigger this alert include standard remote access tasks conducted by system administrators. It is beneficial to supplement this detection with alerts for known remote access tools that may assist in identifying broader usage patterns, enhancing overall coverage of potential threats.

