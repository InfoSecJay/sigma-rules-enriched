note: |
  ### Technical Context

  This Sigma rule detects file activity related to the Veyon Remote Monitoring and Management (RMM) tool, specifically monitoring the creation or modification of log files associated with Veyon. The likely attacker objective is to leverage Veyon for persistent access or control over targeted systems, exploiting its functionalities to manage remote endpoints. This detection aligns with the MITRE ATT&CK technique for Remote System Maintenance (T1219).

  The primary telemetry source is Windows file event logs, specifically monitoring changes to the file paths designated for Veyon log files. If malicious, this behavior could indicate unauthorized use of the tool to facilitate further exploitation, lateral movement, or data exfiltration. It is important to note that this detection does not confirm malicious intent on its own, as Veyon may be used legitimately within the organization.

  ### Investigation Steps

  - **Assess file modification timestamps:** Review Event ID 4663 (File Access) for changes to 'C:\Windows\Temp\VeyonServer.log', 'C:\Windows\Temp\VeyonService.log', or 'C:\Users\*\AppData\Local\VeyonCLI.log' to determine when the logs were last accessed or modified. Look for unusual timestamps outside of normal business hours.

  - **Identify process execution:** Check for associated process creation events (Event ID 4688) around the time of file modifications, specifically for known Veyon executable names like `Veyon.exe` or `VeyonService.exe`. This helps correlate log file activity with specific user actions.

  - **Evaluate user context:** Identify the user account associated with the file activity. Review whether the account has a legitimate business need for Veyon access, and investigate any accounts not typically associated with this tool.

  - **Look for network connections:** Monitor for outbound connections from the Veyon service process to external IPs or unrecognized internal subnets, indicating potential data exfiltration. This can be done using network log telemetry such as Windows Filtering Platform logs.

  - **Confirm legitimate usage patterns:** Identify and document any legitimate usage of Veyon within the organization, focusing on names of known users or workstations that commonly utilize the tool for remote management.

  ### Prioritization

  The alert is of medium severity. While the impact may vary based on the affected system's role within the network, the likelihood of malicious use of tools like Veyon is concerning. Remote management tools are frequently weaponized in attacks, heightening the need for careful review.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers who rename or obscure the log file paths. Reliable detection requires appropriate file system logging configurations to capture all relevant file activity. Legitimate administrative actions involving Veyon for remote management may trigger this alert, leading to false positives. A companion detection could include monitoring for processes spawned by user accounts commonly associated with administrative tasks, enhancing the context for evaluating the alert.

