note: |
  ### Technical Context

  This rule detects file activity associated with the Veyon Remote Monitoring and Management (RMM) tool, specifically the creation or modification of log files within the Windows Temp directory and user AppData. The potential attacker objective may include exfiltration of sensitive data or unauthorized remote access through compromised systems using Veyon. This behavior relates to the MITRE ATT&CK tactics of Command and Control (TA0011) and the associated technique of Application Layer Protocol (T1219).

  The primary telemetry sources for this detection are Windows file event logs, specifically monitoring paths where Veyon logs are typically stored. If malicious, this activity can indicate the presence of malicious software or unauthorized remote access tools on the system. Importantly, this detection does NOT confirm malicious intent on its own; legitimate instances of Veyon use in an enterprise environment could produce similar log entries.

  ### Investigation Steps

  - **Identify file creation events**: Review Windows Security Event ID 4663 for 'C:\Windows\Temp\VeyonServer.log' and 'C:\Users\*\AppData\Local\VeyonCLI.log' to confirm file creation; look for entries indicating a 'Create' operation by unauthorized users or processes.

  - **Verify user account activity**: Check who accessed or modified the log files with Event ID 5145 from the Security logs. Ensure that users correspond with known administrators or authorized personnel responsible for RMM activities.

  - **Correlate with Veyon legitimate usage**: Cross-reference the timestamps of the log file activity with documented schedules of authorized use of Veyon in your organization to validate benign activity against system-wide usage patterns.

  - **Analyze file content**: If possible, examine 'C:\Windows\Temp\VeyonServer.log' for suspicious entries or error messages indicative of attempts to exploit the system or unusual command executions not aligned with typical usage.

  - **Check for lateral movement behavior**: Review Windows Event ID 4672, indicating special privileges assigned to the account that might access these files. A high volume of privileged actions may signal malicious intent.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of compromised systems that could facilitate unauthorized remote access. While Veyon can be used for legitimate purposes, the likelihood of malicious abuse increases if observed anomalously or by unauthorized user accounts. The behavior identified is a common tactic used by threats deploying remote administration tools.

  ### Blind Spots and Assumptions

  Detection may be limited if logs for file activities are not properly configured or are being overwritten without appropriate retention policies. Legitimate activities, such as routine maintenance and monitoring by IT teams using Veyon, may trigger this alert. Companion detections, such as unusual remote session establishment events (Event ID 4624: Successful Logon), can strengthen overall detection capabilities and provide greater context for the investigation.

