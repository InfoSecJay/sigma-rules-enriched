note: |
  ### Technical Context

  This Sigma rule detects the execution of the ProxiPort Remote Monitoring and Management (RMM) tool by monitoring process creation events where the image path ends with `\proxiport.exe`. The likely attacker objective is to establish command and control (C2) over a compromised system for persistent access or management. This corresponds with the MITRE ATT&CK technique titled "Remote Access Software" (T1219).

  Primary telemetry sources include Windows process creation logs, specifically security Event ID 4688. Malicious use of ProxiPort would enable unauthorized access to device management functionality, allowing attackers to control infected systems. It's crucial to note that this detection does NOT alone confirm malicious intent, as ProxiPort may be used legitimately by system administrators.

  ### Investigation Steps

  - **Review process creation logs:** Check for Event ID 4688 in Security logs to identify the creation of processes. Look for `Image` field containing `\proxiport.exe` and `ParentImage` indicating legitimate processes such as `powershell.exe` for anomalous command sequences, which may signal misuse.

  - **Validate source of execution:** Identify the user account associated with the process creation and correlate with the `EventData` fields in Event ID 4688. If the executing user is part of a system administrator group or in a legitimate support context, it may indicate benign behavior.

  - **Check for network connections:** Analyze network logs (e.g., Firewall logs or Windows Network Connection logs) for outbound connections originating from the host running ProxiPort. Look for unusual destinations or protocols that do not conform to normal business operations, indicating potential malicious activity.

  - **Identify anomalies in execution context:** Investigate the legitimacy of the execution path by checking the process tree, with a focus on how `proxiport.exe` was spawned. Examine parent processes for unusual command lines or scripts running prior to execution that may indicate malicious use.

  - **Assess asset criticality:** Confirm the role of the affected host in the enterprise environment. If it's a critical system (e.g., a server managing sensitive data), prioritize further investigation.

  ### Prioritization

  This alert should be treated as medium severity due to the potential for significant impact on system integrity and operational functionality if exploited by an adversary. While ProxiPort may be used legitimately, its association with command and control makes it a potential vector for abuse, particularly if seen in an unusual context.

  ### Blind Spots and Assumptions

  The detection may be limited by the legitimate use of ProxiPort, which can lead to false positives. Ensure that process creation logging is correctly configured and that logs are retained for sufficient duration. Legitimate remote support activities or internal IT tasks may also trigger the alert, suggesting a need for contextual awareness in investigations. To enhance coverage, consider companion detections for other RMM tools (e.g., TeamViewer or AnyDesk) that may indicate similar activities, providing a broader detection scope for potential abuse.

