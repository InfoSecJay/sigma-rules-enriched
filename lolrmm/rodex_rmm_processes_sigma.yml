note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Rodex RMM (Remote Monitoring and Management) tool, specifically when spawned by its parent process, RodexAgent.exe. The likely attacker objective is to utilize the Rodex RMM for remote access, system control, or data exfiltration. This behavior aligns with the MITRE ATT&CK technique for Remote Access Tools (T1219).

  The primary telemetry sources encompass Windows process creation logs, specifically focusing on process creation events indicating the execution of RodexAgent.exe and any subsequent child processes. If the identified activity is indeed malicious, it could lead to unauthorized access and control over systems within the network. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate usage of the Rodex RMM tool may occur in the environment.

  ### Investigation Steps

  - **Identify process creation events:** Check for Windows Security Event ID 4688 or Sysmon Event ID 1 that logs process creation details. Look specifically for entries that log `Image` ending with `\RodexAgent.exe` to confirm execution.

  - **Review parent-child process relationships:** Analyze the ParentImage attribute to verify if the detected process stemmed from `\RodexAgent.exe`. This relationship is critical to understanding the context of the execution.

  - **Check for second-order processes:** If additional processes spawn from the RodexAgent.exe, examine their behavior, focusing on command-line arguments and file paths to identify any suspicious or non-standard activities related to RMM operations.

  - **Assess legitimate usage:** Validate known assets or user accounts within your environment that utilize Rodex RMM. Legitimate usage should typically involve administrative users performing maintenance tasks during off-peak hours.

  - **Investigate for malicious commands:** Look for use of command-line parameters in conjunction with the identified process that may indicate attempts to manipulate or control the system beyond expected administrative tasks. Example parameters might be `-remote`, which could indicate remote control functionality.

  - **Log historical data for comparison:** Utilize event logs to analyze historical execution patterns of RodexAgent.exe, comparing against known legitimate activity to identify anomalies or deviations from baseline behavior.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on systems where Rodex RMM is used. While the likelihood of malicious abuse exists, it is often associated with legitimate administrative tasks, requiring thorough investigation to discern intent. The behavior is relevant to the attack lifecycle when employed for malicious purposes, warranting prompt review.

  ### Blind Spots and Assumptions

  Detection may miss variations in the Rodex RMM tool usage, such as strategically renamed binaries or obfuscated command-line arguments. A reliable detection environment necessitates accurate logging configurations for process creation and visibility into RMM tool usage policies. Legitimate activities, such as authorized maintenance or monitoring, could trigger the alert. Companion detections for unusual network activity on commonly used RMM ports (e.g., ports 443 or 8080) can provide additional context to strengthen overall detection efforts.

