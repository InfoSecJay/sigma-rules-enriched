note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Komari Remote Monitoring and Management (RMM) tool, specifically monitoring for instances of `komari-windows-386.exe`, `komari-windows-amd64.exe`, `komari-windows-arm64.exe`, and `komari-agent.exe`. The likely objective of an attacker utilizing this tool is to gain unauthorized control over victim systems, allowing for data exfiltration, credential theft, or deployment of additional malware. This behavior correlates with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry sources needed are Windows process creation events, specifically Security Event ID 4688, which logs new process creations. If found malicious, the use of this tool may indicate a compromised environment or an illicit remote management scenario. It is important to note that this detection does NOT confirm malicious intent by itself as rewards legitimate administrative functionalities may trigger this alert.

  ### Investigation Steps

  - **Review Process Creation Events**: Examine Security Event ID 4688 for instances where `Image` field matches any of the specified Komari executable names noted in the rule. Malicious indicators include the spawned processes occurring on unexpected endpoints within the organization.

  - **Check Parent Process Hierarchy**: Look for the `ParentImage` field in Event ID 4688. A legitimate scenario would typically show these processes being spawned from IT management tools or other administrator-level interfaces. Malicious behavior might exhibit unusual parent processes such as `cmd.exe` or `powershell.exe` executed by non-administrative users.

  - **Assess User Context**: Identify the `SubjectUserName` field in the Event ID logs. If the user executing the Komari process is not aligned with IT operations or if the execution occurs outside business hours, this could indicate an anomaly and warrant further investigation.

  - **Correlate Logs with Network Activity**: Check for corresponding network activity that involves communication to known Komari infrastructure. Look at outbound connections on unusual ports or to external IPs associated with RMM tools, indicating potential data exfiltration.

  - **Investigate Logon Events**: Review Security Event IDs 4624 and 4625 for logon attempts prior to the Komari process creation. Unusual logon patterns, such as multiple failed logins followed by a successful login, could suggest compromised credentials.

  - **Validate with Asset Inventory**: Cross-reference the system where the alert was triggered against your asset inventory to determine if it should legitimately have Komari installed. Legitimate installations in accordance with inventory would suggest a lower risk profile.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems capable of remote access and management. The likelihood of malicious abuse is moderate, as RMM tools are commonly weaponized by attackers for unauthorized access. Given the legitimate use of Komari, affected systems should be prioritized based on their criticality and the contextual behavior surrounding the alert.

  ### Blind Spots and Assumptions

  Detection may be limited by lack of logging for legitimate administrative use of RMM tools, potentially leading to false positives. Required log sources include Windows process creation logs, and configurations must ensure all necessary Event IDs are being captured. Legitimate administrative tasks, such as remote support from IT staff, may trigger this alert. A companion detection could involve monitoring the use of PowerShell or Command Line tools that interact with Komari processes, which strengthens coverage against evasion tactics.

