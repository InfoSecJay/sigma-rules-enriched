note: |
  ### Technical Context

  This rule detects outbound network connections to Teramind RMM tool domains, indicating potential Remote Monitoring and Management (RMM) activity. The primary objective of an attacker utilizing such a tool could be unauthorized monitoring or management of systems, potentially leading to further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK technique for Remote Control: T1219. The primary telemetry source is Windows network connection logs, specifically targeting traffic to the domains associated with Teramind.

  If this behavior is malicious, it could compromise sensitive data and system integrity. However, this detection does NOT confirm that the activity is inherently malicious, as Teramind may be used legitimately by authorized personnel for administrative purposes.

  ### Investigation Steps

  - **Review recent network activity:**
    Examine Windows Security Event ID 5156 (Windows Filtering Platform) for outbound connection events to Teramind domains. Identify user accounts and source IPs related to these connections.

  - **Correlate with asset inventory:**
    Determine if the affected systems are known to use Teramind for legitimate purposes. Check asset documentation to confirm if they are authorized RMM tools in use.

  - **Investigate user activity:**
    Review the logs of current user sessions, focusing on Windows Event ID 4688 (Process Creation) to identify any processes related to Teramind or unusual command line arguments indicative of unauthorized usage.

  - **Identify known malicious indicators:**
    Check if the destination traffic originates from untrusted IP addresses or if there's a high volume of data being sent immediately after the connection is established, which could indicate exfiltration attempts.

  - **Monitor system changes and file creation:**
    Leverage Sysmon Event ID 11 to identify any file creation on the system that correlates with the outbound connection to Teramind domains, particularly monitoring for unexpected scripts or executables.

  ### Prioritization

  This alert should be treated with medium severity due to the potential risk associated with RMM tools, which are commonly targeted by attackers for gaining control over systems. The likelihood of malicious abuse is plausible, given that these tools can be weaponized to facilitate reconnaissance and data theft, especially in environments without proper controls.

  ### Blind Spots and Assumptions

  Detection may miss legitimate activity if Teramind is authorized for use within the organization. Additionally, if logging settings are misconfigured, the required network connection data may be incomplete or unavailable. Legitimate administrative tasks or troubleshooting sessions may trigger this alert if Teramind software is used. A companion detection to consider would be monitoring for anomalous behavior in user activity logs, such as unusual access patterns or privilege escalations following Teramind connections.

