note: |
  ### Technical Context

  The Sigma rule detects file activity related to the ProxiPort RMM (Remote Monitoring and Management) tool, specifically targeting the executable and configuration file associated with this tool. This behavior may indicate an adversary's attempt to establish persistent access or control over compromised systems via remote management capabilities. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), with the associated technique being "Remote Access Tools" (T1219).

  The primary telemetry sources include Windows file event logs that capture file creation, modification, and access actions. If malicious, the use of ProxiPort may allow an attacker to manage, exfiltrate data, or pivot to other systems within the network. However, this detection does NOT confirm that malicious activity occurred, as ProxiPort might be used legitimately by authorized personnel in the environment.

  ### Investigation Steps

  - **Check recent file access:** Review Windows Security Event ID 4663 logs for access events to `C:\Program Files\ProxiPort\proxiport.exe` and `proxiport.conf`, focusing on SID/username to establish if it aligns with known administrative activity.

  - **Investigate process creation:** Inspect Sysmon Event ID 1 for new process creation involving `proxiport.exe`. Verify the parent process ID and correlate it with legitimate administrative tasks to differentiate benign usage.

  - **Analyze modification timestamps:** Review file modification timestamps on `proxiport.conf` for signs of unusual updates or configurations, especially if the file was modified outside standard maintenance times or by non-authorized accounts.

  - **Correlate with network behavior:** Check firewall and Proxy logs for outbound connections aligned with the usage of ProxiPort. Look for signatures typical of command and control activity, such as unexpected external endpoints or unusual port usage.

  - **Identify legitimate usage:** Confirm whether ProxiPort is in use in the environment by querying asset management systems or reaching out to system administrators, to substantiate benign usage versus suspicious activity.

  ### Prioritization

  This alert has medium severity due to the potential impact of a compromised system leveraged for remote management. The likelihood of malicious abuse is moderate since ProxiPort is often used as a legitimate tool, but it can be weaponized by attackers for establishing persistence.

  ### Blind Spots and Assumptions

  Detection can be limited by the legitimate use of ProxiPort in the environment, leading to potential false positives. Ensure that appropriate logging for file events and process creation is enabled for comprehensive coverage. Legitimate administrative activity may trigger this alert when troubleshooting or managing devices remotely. A companion detection could include monitoring network traffic for connections to known C2 servers that may indicate malicious use of remote access tools.

