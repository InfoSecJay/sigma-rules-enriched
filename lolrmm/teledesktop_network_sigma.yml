note: |
  ### Technical Context

  This rule detects network connections to the TeleDesktop Remote Management Tool, indicating potential unauthorized remote access or command-and-control activity. The likely attacker objective is to control compromised systems remotely, facilitating data exfiltration or lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique for "Remote Access Software" (T1219).

  Primary telemetry sources necessary for this detection include Windows network connection logs, specifically focusing on connection attempts to the domains associated with TeleDesktop (*.tele-desk.com). If this activity is malicious, it could lead to significant security incidents, including data breaches and system compromise. Importantly, this detection does NOT confirm an active attack on its own; further investigation is required to ascertain the context and legitimacy.

  ### Investigation Steps

  - **Review network connections:** Check for Event ID 5156 (Windows Filtering Platform) logs that show outbound connections to *.tele-desk.com. Look for unexpected hosts making these connections outside of known maintenance windows.

  - **Identify user activity prior to connection:** Investigate the Security Event ID 4688 to see which user or process initiated the connection to TeleDesktop. Confirm whether the process associated with the user is legitimate or a known remote management tool.

  - **Assess system role:** Verify whether the affected machines typically use remote management tools. Focus on servers or endpoints designated for administration and whether they have the TeleDesktop installed by checking the installed applications in the system registry or via inventory tools.

  - **Check for high-confidence indicators:** Look for process initiation associated with TeleDesktop (e.g., executable names like TeleDesktop.exe) via Sysmon Event ID 1. A deviation from the norm, such as these processes being executed without prior legitimate connections, increases suspicion.

  - **Investigate historical connections:** Review prior connections to the same domains over the last 30 days using network logs. Frequent connections from untrusted sources or unexpected timing patterns may indicate ongoing malicious activity.

  - **Validate legitimate usage:** Determine if known legitimate users or IT teams utilize TeleDesktop by cross-referencing with approved software lists or maintenance documentation. Any unauthorized usage or installation should trigger further investigation.

  ### Prioritization

  This alert has medium severity due to the associated risk of unauthorized remote access, which can lead to data breaches or internal compromise. Given the potential for legitimate use of remote management tools in an enterprise, this requires careful contextual analysis to discern malicious intent from authorized activities.

  ### Blind Spots and Assumptions

  Detection limitations include potential legitimate use of TeleDesktop by trusted IT personnel that may trigger this alert. Comprehensive logging of both allowed and denied outbound connection attempts must be configured for reliable detection. Adversaries may also use other remote tools that do not resolve to the same domains, creating blind spots. Consider companion detections based on unexpected process executables related to remote access tools to bolster overall monitoring efforts.

