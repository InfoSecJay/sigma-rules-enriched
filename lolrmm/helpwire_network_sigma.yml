note: |
  ### Technical Context

  This Sigma rule detects network activity related to the HelpWire Remote Monitoring and Management (RMM) tool, specifically when network connections are made to its associated domains. The likely objective of an attacker using HelpWire is to establish command-and-control (C2) functionality, allowing for remote access to compromised systems. This detection aligns with the MITRE ATT&CK framework's Command and Control tactic (T1071.001 - Application Layer Protocol: Web Protocols) and the Use of Remote Access Tools technique (T1219).

  The primary telemetry sources for this detection are Windows network connection logs that capture event data about outbound connections. If the detected activity is malicious, it could lead to unauthorized access, data exfiltration, or lateral movement within the network. It is important to note that this rule does not confirm unauthorized access or malicious intent on its own—legitimate use of HelpWire for remote support could trigger this alert.

  ### Investigation Steps

  - **Review network connection logs:** Analyze logs for connections to HelpWire domains (e.g., `helpwire.app`, `account.flexihub.com`) using Windows Event ID 5156 (Windows Filtering Platform). Compare against known infrastructure to establish legitimacy.

  - **Identify user context:** Check the user account associated with the network connections. Legitimate HelpWire usage typically involves accounts with administrative permissions, while anomalous activity might involve unexpected accounts or non-administrative user roles.

  - **Investigate process activity:** Correlate network activity with process creation events (Security Event ID 4688). Look for expected HelpWire executable names, such as `HelpWire.exe`. Abnormal or unknown process names associated with network connections warrant further investigation.

  - **Cross-reference against known baselines:** Validate whether the host regularly uses HelpWire or similar RMM tools. Hosts with no prior logs of using these services but showing activity to HelpWire domains have a higher likelihood of being compromised.

  - **Check for data exfiltration artifacts:** Review for file access or transfer events indicating potential data exfiltration. Look for uncommon file access patterns that coincide with the network activity (Sysmon Event ID 11 for file creation events).

  ### Prioritization

  This alert has medium severity within an enterprise context. The affected systems may hold sensitive data, and HelpWire is a known administrative tool, increasing the likelihood of malicious exploitation if misused. This behavior can be weaponized by adversaries to facilitate remote access during intrusion attempts.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate HelpWire usage in the environment, potentially leading to false positives. Reliable detection requires comprehensive logging of all outbound network traffic and process creation; lacking this, malicious activity could go undetected. Legitimate remote support operations, such as IT service management or support tickets involving HelpWire, could trigger this alert. A related detection that can enhance coverage is monitoring for unusual credential use or account lockouts that may indicate unauthorized access attempts using legitimate RMM tools.

