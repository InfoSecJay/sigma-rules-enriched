note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to known domains associated with the HelpWire Remote Monitoring and Management (RMM) tool. Attackers might use such tools to remotely access and control a compromised system, aiming to steal data, install additional malware, or maintain persistence. The relevant MITRE ATT&CK tactic is "Execution" (TA0002), with the associated technique being "Remote Access Software" (T1219).

  The primary telemetry source for this detection is Windows network connection logs, particularly focusing on DNS queries and outbound connection records. If malicious, such activity may indicate unauthorized remote access, data exfiltration, or lateral movement within the network. However, this detection does NOT confirm malicious intent on its own; legitimate use of the HelpWire tool can often trigger this alert.

  ### Investigation Steps

  - **Review connection logs for suspicious patterns:** Check for Event ID 5156 (Windows Filtering Platform) to identify outbound connections to 'helpwire.app' domains. Look for anomalies like connections from unexpected hosts or at unusual times, which may indicate malicious use.

  - **Identify known legitimate usage:** Determine if the HelpWire tool is documented and approved for use within the organization. Review the asset inventory to confirm that the host making connections is officially allowed to utilize HelpWire.

  - **Correlate with user activity logs:** Examine user activity logs to ensure that the connections align with valid user activities. Check Event ID 4624 (Logon) to assess if the user account initiating the connection was active during those timestamps.

  - **Investigate for high-confidence malicious indicators:** Look for unusual behavior associated with HelpWire connections, such as connections established after hours (using timestamps in Event ID 5156) or multiple rapid connections within a short time frame, which could indicate automated scripts.

  - **Examine DNS queries:** Review DNS logs for "helpwire.app" queries (could be queried in systems capturing DNS logs) to assess the source and any abnormal patterns such as nonsynchronous queries or unexpected resolve times.

  - **Assess network traffic volume:** Analyze traffic generated to any HelpWire domains for unusual spikes that may indicate data exfiltration attempts, especially on non-typical devices. Check for high volume connections in network monitoring tools.

  ### Prioritization

  This alert is of medium severity due to the potential for critical systems being accessed by unauthorized parties. HelpWire RMM tools can be weaponized by attackers for remote control and persistence. The likelihood of malicious abuse increases in environments where remote access software is not explicitly authorized.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited by the absence of detailed logging configurations or if DNS logging is not fully enabled, possibly allowing for effective evasion. Legitimate activities may include authorized use of HelpWire for remote support tasks. A related detection that could enhance coverage is monitoring for process creation events (Event ID 4688) specifically for HelpWire executables, confirming the execution of the software in conjunction with network activity.

