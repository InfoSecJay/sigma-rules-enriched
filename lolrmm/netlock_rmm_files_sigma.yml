note: |
  ### Technical Context

  This rule detects potential file activity associated with the NetLock RMM tool, specifically monitoring changes to log files and configuration files critical to the operation of the tool. An attacker's objective in utilizing the NetLock RMM could range from gaining remote access to a compromised system to exfiltrating sensitive data under the guise of regular operational activity. The relevant MITRE ATT&CK tactics and techniques for this detection include Command and Control (T1071) and Application Layer Protocol (T1219).

  Primary telemetry sources include Windows file event logs and Unix/Linux logging for file system activity. If malicious, the manipulation of these files could enable unauthorized access or control over systems, heightening security risks. Importantly, this detection does NOT confirm that the activity is malicious on its own; legitimate usage of the NetLock RMM can trigger this rule.

  ### Investigation Steps

  - **Examine file creation/modification timestamps:** Review the access and modification times of files located at `C:\temp\netlock rmm\installer\logs\` and `/var/log/netlock-rmm-agent-comm.log` (Event IDs 4663, 4656 for Windows, and `auditd` logs for Linux) to check for anomalous patterns compared to typical operational times (i.e., during business hours).

  - **Check for unusual configurations:** Look into the contents of `C:\ProgramData\0x101 Cyber Security\NetLock RMM\Comm Agent\server_config.json` and `/Library/LaunchDaemons/com.netlock.rmm.agentcomm.plist`. Confirm if any unauthorized entries or modifications are present that could indicate malicious intent.

  - **Identify competing processes:** Use Sysinternals tools or built-in task manager to identify any unexpected processes that may be associated with the NetLock RMM tool, particularly those that deviate from the typical behavior observed within your environment (e.g., high CPU usage when the tool is not in active use).

  - **Review legitimate usage logs:** Confirm if the activity aligns with known legitimate usage patterns for NetLock RMM in your organization. Validate if expected schedule tasks or administrative activities correlate with the events being logged.

  - **Correlate with network traffic:** Monitor network behavior linked to the affected systems for abnormal outbound connections to known command-and-control servers or unfamiliar IP addresses, which could bring into question the legitimacy of the file manipulations (reference external threat intelligence).

  ### Prioritization

  This alert is medium priority due to the potential impact on affected systems when using remote management tools like NetLock RMM, which, if compromised, can lead to significant security risks. While legitimate business use is common, the likelihood of abuse exists, particularly in environments with sensitive data, making timely investigation important.

  ### Blind Spots and Assumptions

  Detection is limited by the configuration of logging, as the absence of necessary file system auditing could allow malicious activity to go unnoticed. Legitimate administrative actions, such as routine configuration updates or maintenance on the NetLock RMM tool, may trigger alerts. A related detection rule monitoring unusual network connections initiated by the RMM agent can provide complementary insights into potential threats.

