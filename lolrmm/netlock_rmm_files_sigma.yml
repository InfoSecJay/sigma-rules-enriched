  ### Technical Context

  This Sigma rule detects file activity related to the NetLock RMM tool, specifically monitoring for access or modifications to files in predefined paths associated with its installation and logging. The likely attacker objective is to remotely manage or exploit systems via the NetLock RMM agent, which could allow unauthorized access to sensitive data or system control. The relevant MITRE ATT&CK technique is "Remote File Copy (T1219)."

  The primary telemetry sources for this detection include Windows file event logs corresponding to system file modifications, as well as Linux system logs for activity related to the NetLock RMM agent. If malicious, activity may indicate a compromise where an attacker is leveraging existing RMM functionality for nefarious purposes. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate use of the NetLock RMM tool can trigger the same alerts.

  ### Investigation Steps

  - **Review detected file events**: Examine file events corresponding to the detected paths (e.g., Security Event ID 4663 for file access) for any unusual timestamps or user accounts that are not typically associated with RMM operations.

  - **Identify recent changes**: Analyze the target file modifications in `C:\temp\netlock rmm\installer\logs\` and `/var/log/netlock-rmm-agent-comm.log` for unexpected alterations, particularly focusing on content that shows signs of misconfiguration or unauthorized changes.

  - **Correlate with user activity**: Check user activity logs (Windows Event ID 4624 for logons) to see if the account making changes has legitimate access rights and is expected to operate in the affected environments; especially assess if any elevated privileges were used during file modifications.

  - **Evaluate legitimate behaviors**: Confirm whether file activity aligns with documented NetLock RMM maintenance schedules or updates, which can help distinguish between benign use and potential misuse.

  - **High confidence indicator**: Look for patterns showing repeated modifications to `server_config.json` or suspicious endpoint communications from unusual locations, which can indicate misuse or evasion attempts.

  - **Inspect for exfiltration artifacts**: Validate if any logs indicate unexpected file transfers from the suspect paths to external locations, signifying potential data exfiltration attempts tied to the NetLock RMM tool.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on sensitive systems managed by the RMM tool. The likelihood of malicious abuse is moderate, especially if the network employs RMM tools to manage critical infrastructure, as such tools are commonly targeted in cyberattacks.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by the presence of legitimate NetLock RMM activity, which can obscure malicious use. Reliable detection hinges on monitoring appropriate file paths and maintaining comprehensive logging settings for both Windows and Linux environments. Legitimate administrative tasks may trigger this alert, particularly during maintenance or updates. A companion detection worth implementing is monitoring for anomalous network communications from the RMM tool, which could indicate exploitation or backdoor use.

