note: |
  ### Technical Context
  This detection rule identifies potentially unauthorized processes associated with the Rapid7 Remote Monitoring and Management (RMM) tool. Rapid7 RMM is commonly used by IT departments for monitoring endpoint activity and managing devices, but it can also be exploited by threat actors to gain unauthorized access to systems, exfiltrate data, or deploy malicious software. The detection focuses on processes that initiate from known Rapid7 executables, such as `ir_agent.exe`, `rapid7_agent_core.exe`, and `rapid7_endpoint_broker.exe`.

  In the context of an attack scenario, an adversary might use the Rapid7 tool to gain administrative control over a network or specific endpoints, conduct reconnaissance, or escalate privileges. The motivation behind such actions usually aligns with lateral movement within the environment to achieve objectives like data theft or system compromise. This activity corresponds to MITRE ATT&CK tactics such as **Execution** (T1203) for running the malicious processes, showcasing possible misuse of legitimate administrative tools.

  The primary data sources for this detection include Windows process creation events, which log details about application launches and their parent processes, making them pivotal for identifying potentially malicious activities conducted through trusted tools.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check Windows process creation events for instances of `ir_agent.exe`, `rapid7_agent_core.exe`, or `rapid7_endpoint_broker.exe` running in unexpected contexts or with unusual parent processes, as these might indicate misuse.

  - **Analyze Parent-Child Process Relationships:** Inspect the hierarchical relationship between processes to determine if Rapid7 executables are being spawned by suspicious or unauthorized parent processes that do not typically interact with management tools.

  - **Correlate with User Activity:** Monitor user account activity to find correlating timestamps or patterns indicating which user initiated the suspected processes and whether their role aligns with such system management activities.

  - **Check Network Connections:** Investigate any outbound network connections initiated by these Rapid7 processes to identify potential data exfiltration or command and control (C2) communication with external IP addresses.

  ### Prioritization
  This alert carries medium severity due to the criticality of the Rapid7 RMM tools in enterprise environments. Although legitimate administrators may utilize these processes regularly, any anomalies associated with them pose a significant risk to system integrity and should be treated with urgency to prevent potential exploitation.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage, as it relies heavily on specific process names, potentially overlooking renamed binaries or custom installations of the Rapid7 tools. The logic assumes that any process execution from the defined Rapid7 executables is illegitimate; however, it does not account for legitimate administrative use, which could lead to false positives. For effective detection, it is necessary to ensure that comprehensive logging is enabled for process creation events in Windows and that the monitoring system is correctly configured to capture these logs.

