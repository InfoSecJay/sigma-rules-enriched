note: |
  ### Technical Context

  This rule detects the execution of processes associated with the Rapid7 Remote Monitoring and Management (RMM) tool. Attackers may use this tool for remote access, lateral movement, or system reconnaissance within an environment, enabling them to control or monitor compromised hosts. The relevant MITRE ATT&CK tactics are Execution (TA0002) and the technique is Tool Usage for Remote Access (T1219). Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, indicating when new processes are executed. If exploited maliciously, it could lead to extensive control over systems, data exfiltration, or further penetration into the network. Notably, this detection does not confirm malicious intent on its own, as it may also represent legitimate administrative activity.

  ### Investigation Steps

  - **Review process details:**
    Check for Security Event ID 4688 logs. Analyze parameters for the executed command line and look for any anomalies or suspicious arguments that indicate non-standard usage.

  - **Identify the parent process:**
    Examine the ParentImage field for entries ending with "ir_agent.exe", "rapid7_agent_core.exe", or "rapid7_endpoint_broker.exe". Normal operations would typically show these parent processes being executed by administrative users.

  - **Assess user behavior:**
    Analyze the user account executing the process. Administrative accounts executing these processes outside of standard business hours or from unexpected locations could indicate malicious behavior.

  - **Correlate system impact:**
    Determine the affected system's role. If the system is critical for business functions (e.g., a domain controller or a database server), elevated alert status may be warranted.

  - **Scan for ongoing communications:**
    Investigate outgoing network connections from the affected system during the time of execution. Look for connections to suspicious external IP addresses or unusual ports, which could indicate C2 activity.

  - **Validate existing policies:**
    Check if the usage of Rapid7 tools is part of the organization's approved monitoring strategy. If no legitimate reason is documented for the activity, raise the priority for further analysis.

  ### Prioritization

  This alert is of medium severity due to the potential impact of Remote Monitoring and Management tools on critical systems. The likelihood of attackers using similar tools to maintain persistence or facilitate lateral movement is moderate, as these utilities are often weaponized for such purposes in enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where Rapid7 tools are used legitimately, leading to potential false positives. Proper logging configurations for process creation and system activity must be in place to ensure reliable detection. Legitimate remote administration tasks may trigger this alert, particularly during routine maintenance. A related detection rule monitoring network traffic for unusual command and control patterns could enhance overall detection fidelity.

