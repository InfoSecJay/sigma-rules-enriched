note: |
  ### Technical Context
  This rule is designed to detect the execution of the Parsec Remote Management and Monitoring (RMM) tool on Windows systems. Parsec RMM is typically used for legitimate remote desktop activities, but it can also be exploited by attackers to gain unauthorized access to systems, execute commands, and perform lateral movement within a network. The detection logic focuses on processes that are spawned by Parsec's parent executable, indicating an active session that may be leveraging this tool for malicious purposes.

  The potential threat scenario involves an attacker using Parsec RMM to access sensitive systems, manipulate data, or pivot to other devices within the enterprise environment. Their objectives may include theft of sensitive information, installation of further malware, or disruption of services. Relevant MITRE ATT&CK techniques include **Remote Services (T1219)**, which involves attackers abusing legitimate remote access services to establish a foothold and control within a target environment.

  To gather actionable intelligence, the primary data sources include Windows process creation logs, which provide visibility into parent-child process relationships, and details of command-line parameters that may reveal suspicious activity associated with Parsec.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the Windows process creation event logs for instances where `parsecd.exe` or `pservice.exe` are indicated as parent processes, and analyze the child processes spawned from these executables for unusual activity.

  - **Analyze Command-Line Arguments:** Investigate the command-line arguments associated with detected processes. Look for flags or options that may suggest unauthorized remote access or interactions with sensitive applications that do not align with normal usage patterns.

  - **Inspect User Context:** Determine the user account associated with the execution of the Parsec processes. Assess if the user has legitimate business justification for using RMM tools and verify if the account has been previously observed engaging in remote management activities.

  - **Correlate with Network Traffic:** Monitor network logs for suspicious outbound connections that coincide with the execution of Parsec processes. Pay particular attention to communications to unusual IP addresses or regions not typically associated with your organization's operations.

  ### Prioritization
  The severity of this alert is medium due to the dual-use nature of Parsec RMM. While often used legitimately, its exploitation can lead to significant security breaches, thus warranting prompt investigation to mitigate potential risks.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where the use of Parsec is common and accepted; this could lead to increased false positives. The detection logic assumes that the execution of the identified processes is out of the ordinary for the user, based on their established behavior. Required logging configurations include enabling detailed process creation events on Windows systems to ensure comprehensive visibility into execution behaviors and parent-child relationships.

