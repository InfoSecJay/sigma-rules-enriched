note: |
  ### Technical Context

  This rule detects process activity associated with the Parsec RMM tool, specifically monitoring instances where either `parsecd.exe` or `pservice.exe` is launched as a child process. The likely attacker objective includes establishing a persistent remote management capability on compromised systems, allowing unauthorized access to network resources. This activity aligns with the MITRE ATT&CK technique for Remote Access Tools under the Command and Control tactic (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1, capturing process creation events. If the detected behavior is malicious, it can lead to unauthorized system access, data exfiltration, or lateral movement. However, this detection does NOT confirm malicious behavior on its own, as Parsec RMM can be legitimately used for remote support and management.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for `parsecd.exe` or `pservice.exe` creation events. Confirm the `ParentImage` field references known and approved management software as benign.

  - **Identify process parentage:** Analyze the `ParentImage` field in the same logs. If it indicates a legitimate process (e.g., `explorer.exe` or known management software), this may suggest benign usage. Conversely, if a suspicious or unknown process is listed as the parent, escalate the investigation.

  - **Validate network connections:** Examine events related to network activity (e.g., Endpoint Connection Events or Sysmon Event ID 3) that may correlate with the execution of detected executables. Look for established outgoing connections to suspicious IPs or domains that may suggest malicious intent.

  - **Correlate with asset criticality:** Assess the role and criticality of the host running the detected processes. Determine if the machine is within a sensitive segment (e.g., finance, HR), which may require greater scrutiny of activity.

  - **Monitor for additional indicators:** Check for additional artifacts like file creation or configuration changes associated with Parsec in the timeline of detection, which could indicate malicious activity or unauthorized configuration.

  ### Prioritization

  The alert has a medium severity due to the potential for misuse of remote management tools, which could lead to unauthorized access and significant impact if exploited. The likelihood of malicious abuse is real, given that unauthorized use of such tools is fairly common among adversaries.

  ### Blind Spots and Assumptions

  There may be limitations in detection if Parsec is legitimately used for business purposes, leading to potential false positives. Reliable detection hinges on comprehensive logging of process creation and network activity. Legitimate remote support activities could trigger similar alerts. Companion detections such as monitoring for unusual outbound connections or monitoring other known remote management tools will enhance coverage and reduce false positives.

