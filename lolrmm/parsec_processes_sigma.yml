  ### Technical Context

  This Sigma rule detects the execution of processes associated with Parsec, a remote management tool typically used for legitimate remote access and support. An attacker may utilize this tool to gain unauthorized access, control remote machines, and potentially exfiltrate data or deploy additional malicious software. The relevant MITRE ATT&CK tactic is "Execution" (TA0002), with technique "Remote Service Session" (T1219).

  The primary telemetry sources include Windows security logs tracking process creation (Event ID 4688) and Sysmon logs (Event ID 1) for detailed process execution information. If this behavior is malicious, it could lead to significant security impacts, including unauthorized access and data breaches. Notably, this detection does NOT confirm that the Parsec tool is being used with malicious intent on its own, as it can also be used legitimately for remote support.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check Windows Security Event ID 4688 and Sysmon Event ID 1 for new processes. Specifically, look for instances where `parsecd.exe` or `pservice.exe` are invoked and identify parent processes.

  - **Identify the source of execution:** Determine the initiator of the process using fields such as UserName and ParentImage in the logs. Legitimate instances typically originate from trusted user accounts performing remote support tasks.

  - **Correlate with network traffic:** Analyze network logs for any unusual connections to external IPs that may indicate malicious use of Parsec. Look for outgoing connections on ports commonly associated with remote support protocols.

  - **Evaluate the context of usage:** Identify the host's role and criticality. Parsec usage on high-value assets or servers should be investigated more thoroughly. Verify whether this aligns with known IT support operations.

  - **Check for persistence mechanisms:** Look for additional artifacts such as scheduled tasks or startup entries linked to Parsec (`parsecd.exe`). Verify if these entries are consistent with authorized configurations.

  - **Look for known indicators of compromise (IoCs):** Search for behavioral signatures commonly seen in misuse scenarios involving remote tools, such as abnormal times of execution or execution by non-admin user accounts.

  ---

  ### Prioritization

  This alert should be treated with medium severity. While the impact may vary based on the system affected, the use of remote management tools like Parsec can be weaponized to facilitate unauthorized access. Legitimate usage does occur, but the activity may also indicate a compromised environment, warranting further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited due to the existence of legitimate Parsec usage within the organization, leading to false positives. Properly configured environments should have comprehensive logging enabled, including both Windows Event logs and Sysmon telemetry to ensure reliable detection. Additionally, remote sessions by IT support personnel could legitimately trigger this alert, which may complicate initial assessments. Companion detections related to anomalous user behavior or unauthorized configuration changes can strengthen overall detection capabilities.

