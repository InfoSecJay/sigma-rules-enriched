note: |
  ### Technical Context

  This Sigma rule detects process creation activities related to the Parsec RMM tool, specifically when processes such as `parsecd.exe` and `pservice.exe` are spawned. Parsec is commonly used for remote monitoring and management and can be exploited by adversaries to maintain persistence or remotely control compromised systems. The relevant MITRE ATT&CK tactic is Execution, with the technique ID T1219 (Remote Access Software).

  The primary telemetry sources are Windows process creation logs, specifically the Security Event ID 4688 for process creation or Sysmon Event ID 1. If these processes are associated with unauthorized or suspicious activities, the security impact could be significant, indicating potential unauthorized remote access. Importantly, this detection alone does not confirm malicious intent; legitimate use of Parsec by authorized personnel can trigger this alert.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 where the New Process Name field contains `parsecd.exe` or `pservice.exe`. Indicators of malicious use would be unexpected spawning of these processes outside of normal business operations.

  - **Validate parent processes:** Investigate parent processes that initiated `parsecd.exe` or `pservice.exe`. A benign indicator is if these processes are spawned from known system management tools versus a suspicious shell or cmd.exe, which could indicate adversarial behavior.

  - **Assess user accounts:** Identify the user account associated with the process creation. If the user context is a non-administrative account without a legitimate operational requirement for Parsec, consider this a higher risk indicator.

  - **Review network activity:** Check for outbound connections initiated by the spawned processes, particularly to unfamiliar IP addresses or domains. Use network logs (e.g., firewall logs, IDS alerts) to identify such connections which would corroborate malicious remote access indicators.

  - **Investigate User Rights Assignment:** Confirm if the user executing the processes has administrative privileges on the affected asset. Elevated access used to initiate remote management tools such as Parsec without due justification may indicate malicious intent.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized remote access on critical systems. Given the frequent misuse of remote access tools by adversaries, the likelihood of malicious abuse is significant, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of Parsec, often resulting in false positives in environments where it is part of standard operations. Sufficient log collection for process creation (Event ID 4688 or Sysmon Event ID 1) is essential to enhance detection reliability. Legitimate remote administrative actions, such as system updates or troubleshooting by IT staff, can trigger this alert. Companion detections focusing on unusual remote connections or new account creation (related to remote access) can strengthen overall security posture.

