note: |
  ### Technical Context

  This rule detects network connections to domains associated with the RMMCRAT remote monitoring and management tool, specifically targeting `softbymade.top`. The primary objective of an attacker utilizing RMMCRAT is often to gain unauthorized access to systems for the purposes of information theft, system manipulation, or persistence. This behavior aligns with the MITRE ATT&CK framework under the tactic of Command and Control (T1071.001—Application Layer Protocol) and the technique of Remote Services (T1219).

  The primary telemetry source is Windows network connection logs, particularly focusing on outbound connections made by processes running on host machines. If malicious, this behavior may indicate an attacker establishing a command and control channel, potentially leading to significant security implications. Importantly, it is crucial to understand that this detection does NOT confirm that the RMMCRAT tool is actively being used for malicious purposes, as it can also be employed for legitimate administrative activities.

  ### Investigation Steps

  - **Review network connection logs**: Check Windows Network Connection events (Event ID 5156) for outbound connections to `*.softbymade.top`. Document the timestamps and source IPs to establish context.

  - **Identify the initiating process**: Cross-reference the identified network connections with Security Event ID 4688 (Process Creation) to determine which processes initiated the outbound connections. Look for unusual or unauthorized processes that may indicate malicious activity.

  - **Check for legitimate use**: Validate if the observed connections are part of expected maintenance or monitoring activities. Analyze historical data to see if the organization typically uses the RMMCRAT tool for remote management.

  - **Monitor for repeated connections**: Track the frequency and patterns of connections to the suspicious domain over time. Persistent attempts could suggest an active compromise. Look for more than 3 connections within a short timeframe.

  - **Look for lateral movement**: If multiple hosts are initiating connections to the same domain, investigate for possible lateral movement or compromise within the network. Cross-reference network activity across endpoints.

  - **Correlate with threat intelligence**: Compare findings against threat intelligence sources to determine if the detected domain is noted for malicious activity or if it has been marked as a benign RMM service.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems if RMMCRAT is misused. The likelihood of malicious abuse is significant, given that remote management tools are commonly weaponized for unauthorized access. However, the presence of these network connections does not automatically indicate an active security breach and requires further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of proxies or tunneling techniques that obscure the true destination of the network connections. Additionally, if the necessary Windows Network Connection logs are not being collected or if there are misconfigurations in monitoring policies, these detections may not trigger reliably. Legitimate administrative use of RMM tooling may unintentionally trigger this alert. A related detection could include monitoring for unusual process creation events linked to common remote management tool activity, enhancing overall visibility into potential misuse.

