  ### Technical Context

  This detection rule identifies potential network connections to the RMMCRAT Remote Management and Monitoring Tool by monitoring traffic destined for the hostname that ends with 'softbymade.top'. The likely attacker objective involves gaining unauthorized control over systems through remote management capabilities, aligning with the MITRE ATT&CK strategy for Command and Control (C2) under technique T1219 (Remote Access Software). The primary telemetry sources include Windows Network Connection logs, specifically examining destination hostnames to corroborate suspicious network behaviors.

  If the network activity is confirmed malicious, the security implications could be severe, as it may indicate an adversary's ability to maintain persistent access and control over the compromised environment. However, it is important to note that this detection alone does not confirm malicious intent, as legitimate use of RMMCRAT could also trigger this alert.

  ### Investigation Steps

  - **Check network logs for connections to softbymade.top:** Review Windows Event ID 5156 (Windows Filtering Platform) for outbound connections to 'softbymade.top'. Verify unusual patterns in connection frequency or user accounts initiating the connections.

  - **Review endpoint security logs for RMMCRAT installations:** Use antivirus or EDR tooling to investigate any installations of RMMCRAT on endpoints. Look for known artifact locations (e.g., C:\Program Files\RMMCRAT) and recent file creation timestamps.

  - **Identify legitimate use cases:** Consult asset and operational documentation to ascertain if 'softbymade.top' is a known and accepted endpoint for legitimate remote management software usage within your organization. Document any business justification linked to such activity.

  - **Correlate user activity with network connections:** Analyze User Account Activity logs (Windows Event ID 4624) to determine if the user initiating the connection has a valid reason tied to this network activity, such as administrator or IT support role conducting remote support.

  - **Evaluate for additional indicators of compromise (IoCs):** Monitor for additional related artifacts, such as unusual process creations (Sysmon Event ID 1) indicating RMMCRAT execution on any endpoint, particularly those with unexpected parent processes linking back to administrative tools.

  ### Prioritization

  This alert is of medium severity due to the potential impact of compromised systems with administrative access. The likelihood of misuse is moderate, as RMM tools are commonly weaponized in post-exploitation scenarios. Any detection of RMMCRAT activity warrants immediate investigation, given its inherent capabilities for full system compromise.

  ### Blind Spots and Assumptions

  This detection rule may be evaded by using domain-fronting or VPNs obscuring the true traffic destination. It requires proper logging configurations to capture all relevant network connections; without complete logging, detection effectiveness diminishes. Legitimate IT support operations might trigger this alert if they utilize RMMCRAT tools. A companion detection to consider would be monitoring for known malicious IP addresses or domains associated with known C2 infrastructure for stronger coverage against RMM tool abuse.

