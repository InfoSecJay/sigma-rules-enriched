note: |
  ### Technical Context

  This Sigma rule detects the execution of the Komari RMM (Remote Monitoring and Management) tool, which can be misused for malicious activities. The likely attacker objective is to gain unauthorized access or control over a targeted system for nefarious purposes, such as data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique: Remote File Copy (T1219).

  The primary telemetry source for this detection is the Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log process creations along with their parent-child relationships. If malicious, this activity can compromise system integrity and allow for unauthorized access to sensitive data. Importantly, this detection does NOT confirm whether the Komari tool is being used for legitimate admin purposes or for malicious intent without further context.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 and Sysmon Event ID 1 for entries indicating the process creation of `komari-windows-xx.exe`. A high volume of these events may indicate potential misuse.

  - **Identify parent processes:** Investigate parent process details associated with the Komari executables. Anomalous parent processes (like those not related to administrative tasks) can suggest malicious activity.

  - **Analyze installed software:** Validate whether the Komari RMM tool is officially installed and justified on the asset by checking the list of installed programs via the Control Panel or PowerShell (e.g., `Get-WmiObject -Class Win32_Product | Where-Object { $_.Name -like '*Komari*' }`).

  - **Monitor for known malicious indicators:** Look for network connections initiated by Komari processes to unknown or suspicious IP addresses, as this could indicate command and control (C2) activity.

  - **Review user permissions and access logs:** Ensure that the account executing the Komari processes has appropriate permissions and hasn't been involved in any suspicious activities, such as unexpected privilege escalation.

  - **Document legitimate usage scenarios:** Recognize legitimate behavior by identifying the expected usage of Komari RMM within authorized IT administrative tasks, such as performing routine maintenance or remote support for endpoints.

  ### Prioritization

  This alert is high-severity due to the potential impact on critical enterprise systems that may be compromised through unauthorized remote access. The likelihood of malicious abuse is significant given the known misuse of RMM tools in cyberattacks. This behavior is commonly weaponized by attackers seeking to maintain persistence within compromised environments.

  ### Blind Spots and Assumptions

  This detection may have limitations, including potential evasion through renaming or disguising the Komari executables, or if legitimate administrative roles utilize the software. Reliable detection requires comprehensive logging configurations to capture all relevant process creation events. Additionally, legitimate usage of Komari (though unlikely) might trigger the alert, which underscores the importance of context-aware investigation. Strengthening coverage could involve monitoring network traffic for anomalous outbound connections typically associated with remote management tools.

