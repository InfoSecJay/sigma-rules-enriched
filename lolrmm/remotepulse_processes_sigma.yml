note: |
  ### Technical Context

  This Sigma rule detects the execution of the RemotePulse Remote Management and Monitoring (RMM) tool, indicated by processes initiated from or associated with `InstallCore.exe`. The likely attacker objective is to establish remote control over compromised systems, facilitating further malicious activities such as data exfiltration or system manipulation. The relevant MITRE ATT&CK technique is T1219: Remote Access Software.

  The primary telemetry sources for this detection would be Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which detail process creation activities. If malicious, this could allow an adversary to maintain persistence, conduct lateral movement, or exfiltrate sensitive data. Importantly, this detection does NOT confirm malicious activity on its own, as the RemotePulse tool can be used legitimately by IT administrators.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for instances of `InstallCore.exe`. Note the user context and ensure that the process originates from a known administrator account, which may indicate benign use.

  - **Validate parent process behavior:** Confirm process relationships via Sysmon Event ID 1. If `InstallCore.exe` is spawned from an unexpected parent process, such as a web browser or non-administrative tool, flag as potentially malicious.

  - **Analyze command line arguments:** Inspect the command line associated with the `InstallCore.exe` process for unusual flags or parameters. Malicious variants may include command-line options that deviate from standard administrative usage.

  - **Identify high-confidence indicators:** Look for signs of abnormal network activity generated by `InstallCore.exe`. If outbound connections are made to unfamiliar IPs, especially on non-standard ports, mark as suspicious.

  - **Check for legitimate usage patterns:** Ensure the presence of Organizational policies or entries that outline expected use of RemotePulse RMM within your environment. Compare against known good usages to establish a behavioral baseline.

  - **Examine asset criticality:** Based on the host role, prioritize investigation accordingly. If the system running RemotePulse is critical (e.g., domain controller, database server), escalate the investigation to higher levels of monitoring and response.

  ### Prioritization

  This alert carries medium severity due to the potential impact it poses on critical systems, as RemotePulse can provide an attacker with extensive control. The likelihood of malicious abuse is significant, given that RMM tools are often leveraged for nefarious purposes, especially in environments lacking stringent monitoring practices.

  ### Blind Spots and Assumptions

  The detection may miss legitimate uses of RemotePulse by authorized personnel, leading to potential false positives. It requires properly configured Windows process creation logging; without it, activities go undetected. Legitimate administrative tasks may trigger the alert if they inadvertently invoke `InstallCore.exe`. Related detections include monitoring for unusual outbound traffic by processes known to be associated with remote management activities, which can provide contextual validation for any alerts generated.

