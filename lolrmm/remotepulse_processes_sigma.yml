note: |
  ### Technical Context

  This Sigma rule detects the creation of processes associated with the RemotePulse RMM (Remote Monitoring and Management) tool, specifically when the parent and child processes both end with 'InstallCore.exe'. The likely attacker objective is to facilitate remote access or management of targeted systems, potentially enabling data exfiltration or system compromise. The relevant MITRE ATT&CK tactic and technique is Execution (T1203).

  Primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 and Sysmon Event ID 1, which log process creation along with their parent-child relationships. If unauthorized, this could lead to severe security impacts, such as data breaches or persistent access for attackers. However, this detection does NOT confirm malicious activity on its own, as the RemotePulse tool may be used legitimately in environment management.

  ### Investigation Steps

  - **Check the process chain:**
    Examine Security Event ID 4688 or Sysmon Event ID 1 for the parent-child relationship. Verify if the parent process is indeed 'InstallCore.exe' and check if it initiated other potentially malicious children processes.

  - **Review timestamps:**
    Analyze the creation and modification timestamps of the detected processes to see if they align with known maintenance windows or other legitimate activities. Legitimate use may show consistent patterns during scheduled IT operations.

  - **Identify active sessions:**
    Investigate active network connections from the system with the detected processes using netstat or network analysis tools. Look for unusual outbound connections that may indicate a compromise, such as connections to known malicious IPs.

  - **Correlate with user actions:**
    Review user activity logs to confirm if users initiated RemotePulse operations within expected maintenance periods. Legitimate users may request administrative access or initiate remote management, which should match the timestamps of the detected process.

  - **Look for additional artifacts:**
    Check for the presence of any files created by the detected processes, located in common RMM directories or with names typically associated with such tools. Evidence of file creation or modification will reinforce your investigation into the legitimacy of the tool's use.

  - **Cross-reference with threat intelligence:**
    Utilize threat intelligence feeds to verify if the 'InstallCore.exe' version or hash aligns with known malicious variants. Indicators such as file hashes or signatures can enhance confidence in determining malicious activity.

  ### Prioritization

  This alert has medium severity because it indicates potentially unauthorized remote access capabilities that could threaten system integrity. The likelihood of malicious abuse is significant, particularly as RMM tools are often weaponized for lateral movement among networks and exploitation of vulnerabilities.

  ### Blind Spots and Assumptions

  Detection may miss instances where legitimate use of RemotePulse occurs, especially in managed IT environments. Effective detection relies on comprehensive logging from Security Event ID 4688 and Sysmon; without proper configuration, this may lead to missed alerts. Legitimate administrative tasks, like IT management activities, can also trigger this alert. A companion detection focusing on unusual network activity (e.g., tracking connections from newly created processes) would enhance threat coverage.

