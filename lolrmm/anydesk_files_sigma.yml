  ---

  ### Technical Context

  This rule detects file activities related to the AnyDesk Remote Monitoring and Management (RMM) tool, specifically targeting the creation or modification of files typically associated with its operation. The likely attacker objective may include remote access, system manipulation, or lateral movement using AnyDesk, which is a known tool for legitimate remote desktop connections but can also be exploited maliciously. This behavior maps to the MITRE ATT&CK technique "Remote Services" (T1219).

  Primary telemetry sources include Windows file system activity logs, specifically targeting Event IDs related to file creation or modification. The security impact of detected malicious activity could result in unauthorized remote access, data exfiltration, or system compromise. However, it's important to note that this detection does NOT confirm that the activity is malicious on its own, as AnyDesk can legitimately be used by authorized users.

  ---

  ### Investigation Steps

  - **Check File Activity: ** Review Windows Security Event ID 4663 logs for file creation or modification entries related to AnyDesk, specifically `C:\Users\*\Videos\AnyDesk\*.anydesk` or `C:\Users\*\AppData\Roaming\AnyDesk\*`. Determine if these files were accessed during non-business hours.

  - **Identify User Context: ** Look at the user account associated with the file activity. Verify if the user is part of IT or Technical Support teams, which may indicate legitimate use of AnyDesk. Unfamiliar or unauthorized users accessing AnyDesk files should be treated as suspicious.

  - **Analyze System Profile Logs: ** Check for file creation events in `C:\Windows\SysWOW64\config\systemprofile\AppData\Roaming\AnyDesk\*` using Windows Event ID 4663. This path should primarily be used by system processes; any user-generated activity here could indicate an unauthorized attempt to use AnyDesk.

  - **Review Shortcut Creation: ** Investigate any entries for modification of Start Menu shortcuts for AnyDesk (specifically `StartUp\AnyDesk.lnk`) from the Event ID 4663 logs. Authorized changes should be minimal; repeated creation or alteration of these shortcuts is suspicious.

  - **Obtain Corresponding Network Activity: ** Cross-reference with network logs (such as firewall logs) to identify if AnyDesk traffic (typically TCP 7070) corresponds with suspicious file activity. Watch for unusual connections initiated by users with no legitimate reason to use remote access tools.

  - **Determine Uninstall/Install Patterns: ** Review for any related uninstallation logs, particularly for `Uninstall AnyDesk.lnk`. Frequent installations and uninstallations of remote access software could indicate evasion techniques or installation of persistence mechanisms by an adversary.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity given that it involves remote access capabilities, potentially allowing for unauthorized access or control over critical assets. The likelihood of malicious abuse is moderate, as AnyDesk is weaponized in various attacks for persistence and evasion.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of legitimate AnyDesk usage, potentially triggering false positives within the environment. Accurate detection relies on proper logging configuration for file activities and associated network communications. Additionally, authorized IT personnel might trigger these alerts during routine support operations. A companion detection to consider is monitoring for anomalous user behavior or command execution history using AnyDesk or similar remote management tools to strengthen coverage against misuse.

