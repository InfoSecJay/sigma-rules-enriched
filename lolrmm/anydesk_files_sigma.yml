note: |
  ### Technical Context

  This rule detects file activity related to the AnyDesk Remote Monitoring and Management (RMM) tool. The likely attacker objective is unauthorized remote access to systems for data exfiltration or lateral movement within the network. The relevant MITRE ATT&CK technique for this behavior is "Remote Access Software" (T1219). Primary telemetry sources include Windows file event logs capturing file creation and modification activities, specifically looking for AnyDesk-related file paths and configuration files. If malicious, the presence of these files may indicate an adversary using AnyDesk to establish remote access or control over compromised systems. However, this detection does NOT confirm that AnyDesk is being used maliciously, as it may also indicate legitimate administrative remote support tasks.

  ### Investigation Steps

  - **Validate file activity from AnyDesk paths:** Check for entries in Windows Event ID 4663 (Access Attempt) and Security Event ID 4656 (Object Access). Look for files accessed within the directories: `C:\Users\*\Videos\AnyDesk\*.anydesk`, `C:\Users\*\AppData\Roaming\AnyDesk\*`, and `~/.config/AnyDesk/Logs/`. A large number of access attempts within a short time frame may indicate malicious usage.

  - **Identify critical configuration files:** Examine for modifications to `C:\Users\*\AppData\Roaming\AnyDesk\service.conf` and `C:\Users\*\AppData\Roaming\AnyDesk\user.conf`. Changes to these files can indicate unauthorized configuration adjustments for remote access.

  - **Cross-check expected legitimate behavior:** Review whether the detected file activities correspond to legitimate use patterns, such as routine IT support sessions. Noting regular access times and user accounts can help differentiate between benign and malicious activities.

  - **Look for anomalous file creation events:** Investigate System Event ID 5145 (File Share Access) for any unexpected creations of files within the AnyDesk directories. Legitimate use typically generates fewer transient files.

  - **Assess the role of the host:** Consider the asset's criticality within the organization. If the system is a sensitive server or a workstations handling confidential data, heightened scrutiny is warranted for any detected events related to AnyDesk.

  ### Prioritization

  This alert has medium severity due to the potential impact of AnyDesk as a remote access tool, which could facilitate unauthorized actions if misused. The likelihood of malicious abuse is significant, given that attackers often leverage remote access tools in their workflows. This behavior is increasingly weaponized within targeted attacks, particularly against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of file logging on certain platforms or configurations that could prevent comprehensive visibility of all file activity. Legitimate administrative use of AnyDesk can generate false positives, especially during IT support operations. A companion detection to consider is monitoring for anomalous logins or remote sessions associated with the same user tied to AnyDesk usage, enhancing the overall effectiveness of threat detection.

