  ### Technical Context
  This rule is designed to detect possible process activity related to the ExpanDrive Remote Management and Monitoring (RMM) tool. ExpanDrive can be leveraged for remote access to file systems, enabling attackers to maintain foothold within compromised environments and transfer data or execute commands. The rule specifically looks for instances where processes are initiated by the ExpanDrive executable, which could indicate unauthorized remote access attempts conducted by malicious actors.

  The threat scenario for this detection focuses on adversaries who might exploit ExpanDrive for lateral movement or data exfiltration after compromising a host. Their objectives may include accessing sensitive data, establishing persistent access, or manipulating files on remote systems. As per the MITRE ATT&CK framework, this detection relates to the Execution tactic, specifically the technique of "User Execution" (T1219), as it identifies potential misuse of software that is typically considered legitimate.

  Primary data sources that will provide valuable evidence for this detection include process creation events on Windows systems, which log the execution of processes and their parent-child relationships. Additionally, monitoring any associated network activity through EDR or NDR tools may prove beneficial in detecting suspicious connections stemming from ExpanDrive.

  ### Investigation Steps
  - **Review Process Logs**: Examine process creation logs for instances of ExpanDrive.exe being executed. Pay attention to the parent process to determine the context of its launch and assess if it originates from a legitimate user session or unusual circumstances.

  - **Examine User Activity**: Investigate the user accounts associated with the detected ExpanDrive process activity. Look for unusual access patterns, such as logins from atypical locations or during non-business hours, which may indicate compromised credentials.

  - **Analyze Network Traffic**: Monitor outgoing network connections initiated by ExpanDrive to identify any suspicious destinations, particularly those associated with known threats or data exfiltration behaviors. Consider capturing and analyzing traffic for further investigation.

  - **Correlate with Other Security Events**: Cross-reference the detected ExpanDrive activity with other security events and alerts in your SIEM or EDR platforms. Look for potential indicators of compromise or additional suspicious activities tied to the same user or device.

  ### Prioritization
  The alert carries a medium severity level due to the potential implications of unauthorized remote access and data manipulation. Considering the frequency of legitimate ExpanDrive use in enterprise settings, it is crucial yet necessary to investigate instances where its activity may be indicative of malicious behavior.

  ### Blind Spots and Assumptions
  This detection may not cover all potential use cases of ExpanDrive, particularly its legitimate use within approved workflows. Assumptions include the reliability of process creation logs to indicate malicious activity related to ExpanDrive. Required logs for effective detection include comprehensive monitoring of process execution on Windows and potentially network logs to capture outbound connections initiated by ExpanDrive. Additionally, environments with stringent application whitelisting or heavily monitored remote access tools may necessitate alternative detection strategies.

