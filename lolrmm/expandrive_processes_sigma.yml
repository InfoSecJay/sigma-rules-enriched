  ### Technical Context

  This Sigma rule detects the execution of processes spawned by the ExpanDrive Remote Management (RMM) tool on Windows systems. The likely attacker objective is to conduct unauthorized remote operations, such as file manipulation or system reconnaissance, using the capabilities provided by the ExpanDrive tool. This activity aligns with the MITRE ATT&CK technique for Execution: Remote Management Tools (T1219).

  Primary telemetry sources include Windows process creation logs (Event ID 4688) that detail command line execution and parent-child process relationships. If malicious, this behavior can lead to significant security impacts, such as unauthorized access to sensitive data or system modifications. However, it’s essential to note that this detection alone does not confirm malicious intent, as ExpanDrive is a legitimate tool used by many organizations for cloud storage management.

  ### Investigation Steps

  - **Verify process creation details:**
    Check Windows Security Event ID 4688 for newly created processes initiated by `ExpanDrive.exe`. Review the command line arguments and parent process ID for unusual patterns.

  - **Identify parent process:**
    Look specifically for instances where `ExpanDrive.exe` is the parent process. Confirm if it originated from expected parental processes, such as a user-initiated application or system service.

  - **Analyze scheduled tasks or runs:**
    Review Task Scheduler for entries that could initiate `ExpanDrive.exe`, looking at the Task Scheduler logs (Event ID 106) for unexpected schedules or triggers.

  - **Investigate file access patterns:**
    Check Sysmon Event ID 11 for any unusual file read/write activities related to `ExpanDrive.exe`, particularly concerning sensitive directories or files.

  - **Correlate with user behavior:**
    Assess the user account associated with the execution through Windows Security Event ID 4624. Determine if the user has a legitimate reason for using ExpanDrive, such as being part of a department that requires cloud connectivity.

  ### Prioritization

  The alert should be considered medium priority. The risk varies based on system criticality and organizational context. If ExpanDrive is not part of the enterprise toolset, the likelihood of malicious abuse increases, as this behavior is not commonly weaponized but may serve as a precursor to more extensive exploitation.

  ### Blind Spots and Assumptions

  This detection may have limitations due to evasion techniques where adversaries rename legitimate tools or use alternative methods to access similar functionalities. Reliable detection requires comprehensive logging of process creations (Event ID 4688) and should include monitoring of application whitelisting for ExpanDrive. Legitimate scenarios might include system administrators performing routine maintenance or users working with cloud files. A companion detection to enhance coverage would be monitoring for abnormal outbound network connections initiated by `ExpanDrive.exe`.

