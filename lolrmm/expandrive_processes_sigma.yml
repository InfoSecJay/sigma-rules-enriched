  ---

  ### Technical Context

  This Sigma rule detects the execution of processes that are initiated by the ExpanDrive Remote Management and Monitoring (RMM) tool. The likely objective of utilizing ExpanDrive is to perform remote management tasks or potentially exploit the remote capabilities for unauthorized access, data exfiltration, or lateral movement. This behavior aligns with the MITRE ATT&CK framework under the Execution tactic (TA0002) and specifically Technique T1219 (Remote Access Software).

  The primary telemetry source for this detection is Windows process creation logs, specifically Security Event ID 4688, which records process creations and their corresponding parent processes. If this activity is malicious, attackers may gain unauthorized control over systems, leading to data breaches or system compromise. However, this detection does NOT confirm malicious activity on its own, as ExpanDrive can be used legitimately within an organization for remote management.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 for timestamps, user account names, and the process details tied to ExpanDrive. Legitimate activity should show typical user accounts (e.g., IT personnel) initiating the process, along with the time and frequency of execution aligning with known maintenance windows.

  - **Cross-reference parent process**: Examine the ParentImage field for entries ending with `ExpanDrive.exe`. Legitimate usage typically has user-initiated parent processes (e.g., `cmd.exe` or `powershell.exe`) with clear documentation of intended usage or scheduled tasks.

  - **Identify unusual user accounts**: Look for execution of ExpanDrive by non-standard user accounts or service accounts. If the process is initiated by a suspicious account with no legitimate connection to IT or management tasks, this increases the likelihood of malicious intent.

  - **Analyze the system context**: Review other telemetry (e.g., Event ID 4624 - Logon) to determine if the execution aligns with remote logins or unusual activity patterns, indicating possible compromised credentials seeking remote execution.

  - **Check for file transfers or anomalies**: Validate any unusual network activity associated with ExpanDrive, such as unexpected large data transfers or connections to unfamiliar external IP addresses that could indicate data exfiltration using the RMM tool.

  - **Consult baseline behavior**: Establish baseline process execution patterns for known and approved use cases of ExpanDrive in your organization. Above normal execution frequency outside maintenance or operational hours may indicate malicious use.

  ---

  ### Prioritization

  This alert is of medium severity because it represents a potential misuse of remote management capabilities that could lead to significant impact on sensitive systems. The likelihood of malicious abuse is moderate as RMM tools can be weaponized by attackers to exploit organizations using legitimate tools for nefarious objectives.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by users executing ExpanDrive legitimately, which may trigger false positives. It is also highly dependent on monitoring configurations for Windows Event Logs, where proper logging needs to be assured. This detection may generate alerts during legitimate remote support operations or system maintenance. Related detections could include unusual outbound connections detected via network monitoring solutions, which would support identifying potential data exfiltration or network reconnaissance efforts.

