note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to Microsoft support domains, specifically targeting connections that may be established by the Quick Assist Remote Management (RMM) tool. The likely attacker objective could involve leveraging this tool to remotely access or control compromised systems, potentially facilitating data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK technique "Remote Services" (T1219).

  Primary telemetry sources include Windows network connection logs, particularly those containing destination hostnames. If malicious actors use Quick Assist for nefarious purposes, the security impact could be significant, enabling unauthorized access to sensitive systems. Importantly, this detection does NOT confirm malicious activity on its own, as it could arise from legitimate usage of the Quick Assist tool.

  ### Investigation Steps

  - **Review outbound connections**: Check for the presence of connections to hostnames ending in '.support.services.microsoft.com' in the Windows Firewall logs (Event ID 5156) or network device logs. Legitimate Quick Assist use will typically have clear documentation and user consent.

  - **Analyze process execution**: Investigate the parent-child process relationship in Security Event ID 4688 for any processes invoking `QuickAssist.exe` or related executable files. Malicious indicators may include unrecognized process names or digital signatures.

  - **Observe DNS query logs**: Query DNS logs for recent lookups toward any `*.support.services.microsoft.com` entries from affected hosts. Benign queries will likely coincide with known support activities documented within your enterprise’s IT support scope.

  - **Inspect user sessions**: Validate the user context performing the Quick Assist connections by analyzing remote desktop session logs (Event ID 4624) in combination with timestamps of network activity. Unauthorized accounts or unusual login times may indicate compromise.

  - **Monitor for additional command execution**: Check for any subsequent PowerShell commands or additional network activity related to the RMM tool by examining Security Event ID 4104 (PowerShell scripts) or Sysmon Event ID 1 to catch signs of lateral movement.

  ### Prioritization

  This alert should be considered medium severity. Its impact depends on the criticality of the host involved; systems with sensitive data or critical infrastructure at risk should be prioritized. The likelihood of malicious abuse is moderate, as Quick Assist can facilitate unauthorized access if misused and is recognized as a potential attack vector.

  ### Blind Spots and Assumptions

  Detection might be limited by the absence of comprehensive logging for all outbound connections. Attackers may evade detection by masking traffic through established applications or by using alternate remote access tools that do not generate similar logs. Legitimate activities might include scheduled IT support sessions or trained staff using the tool for remote assistance, which should be documented. Related detections include logging of unauthorized RDP connections (Event ID 4625) which may provide additional insight into potential remote access abuse.

