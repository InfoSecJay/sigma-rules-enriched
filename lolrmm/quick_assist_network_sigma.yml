  ### Technical Context

  This Sigma rule detects outbound network connections made by the Quick Assist Remote Management Tool to Microsoft support domains, specifically `*.support.services.microsoft.com`. The likely attacker objective is to exploit the Quick Assist tool for remote access to compromised endpoints, allowing for potential data exfiltration or lateral movement within an environment. The relevant MITRE ATT&CK tactic is Execution, with the associated technique being Remote Services (T1219).

  The primary telemetry sources include Windows firewall logs, network connection logs, and possibly Microsoft Defender ATP logs. If malicious, an active alert could signify unauthorized access to systems with sensitive data. However, this detection alone does not confirm malicious activity, as legitimate usage of Quick Assist for support or troubleshooting purposes can trigger similar alerts.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Check for Event ID 5156 (Windows Filtering Platform) that displays outbound connections. Focus on connections to `*.support.services.microsoft.com` to corroborate the detected behavior.

  - **Correlate with process creation events:** Investigate Event ID 4688 (Process Creation) for instances where Quick Assist (``Quick Assist.exe``) was launched, identifying whether administrative activity corresponds to the network connection.

  - **Check for authorization records:** Validate usage against known legitimate support requests or tickets that involved Quick Assist to distinguish expected from suspicious behavior.

  - **Inspect user behavior:** Look for instances where users initiated Quick Assist sessions for troubleshooting purposes. Compare timestamps and parameters with the detected connection to assess legitimacy.

  - **Identify signs of malicious use:** Look for patterns such as multiple simultaneous connections to support domains or connections from unusual user accounts, which may indicate unauthorized access attempts.

  ---

  ### Prioritization

  The severity of this alert is medium, as it reflects potential misuse of a legitimate tool, which could lead to significant security impacts if exploited. The likelihood of abuse is moderate, considering the recent prevalence of remote management tools in attacks. Quick Assist is not commonly weaponized but can facilitate unauthorized access if misconfigured or exploited.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives from legitimate support activities utilizing Quick Assist. Comprehensive logging, including Windows Event 5156 and 4688, is necessary for reliable detection. Legitimate troubleshooting sessions may inadvertently trigger this alert, so context is crucial. A companion detection to enhance coverage would involve monitoring for abnormal authentication events related to accounts accessing Quick Assist.

