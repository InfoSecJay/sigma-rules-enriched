note: |
  ### Technical Context

  This rule detects connections to the domain suffix '*.support.services.microsoft.com', which may indicate the usage of the Quick Assist Remote Management Tool (RMM). Attackers may use RMM tools to gain unauthorized remote access to systems, allowing for potential data exfiltration, persistence, or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001 - Application Layer Protocol) and potentially Remote Access Tools (T1219).

  The primary telemetry source for this detection involves Windows network connection logs, specifically those capturing outbound connections. If malicious, the impact could range from compromised systems to data breaches. Notably, this detection does NOT confirm malicious activity on its own; legitimate use of Quick Assist can trigger this alert without any nefarious intent.

  ### Investigation Steps

  - **Review network connection logs:** Examine Windows Event Logs for Network Connection events (Event ID 5156) involving connections to '*.support.services.microsoft.com'. Note whether these connections are initiated by known user accounts or processes.

  - **Correlate with user activity:** Check user login activity (Event ID 4624) to validate if the initiating user has a legitimate need for remote assistance, focusing on the timing of the network activity in relation to user sessions.

  - **Inspect running processes:** Identify processes associated with the detected connections by retrieving process information via Sysmon Event ID 1 to see if the Quick Assist executable (QuickAssist.exe) is running on the host.

  - **Monitor for repeated connections:** If multiple connections to the specified domain occur within a short timeframe, escalate for further investigation, as this may indicate potential scripting or automated exploitation.

  - **Determine host role:** Assess the affected system's role (e.g., Domain Controller, workstation) to evaluate the potential impact and targeting relevance of the detected Quick Assist usage.

  - **Identify legitimate use cases:** Understand common use cases for Quick Assist within the organization to differentiate between benign assistance sessions and potentially malicious activity.

  ### Prioritization

  Given its medium severity, this alert should be prioritized based on the criticality of the affected endpoint and the likelihood that compromised systems may initiate unauthorized remote access. While Quick Assist is a legitimate application, its use inappropriately can indicate an ongoing attack, especially if detected on sensitive or high-risk systems.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate uses of Quick Assist, leading to certain false positives. Ensure complete logging of outbound connections within the firewall configurations to capture relevant data. The behavior may also be triggered by authorized IT personnel using the tool for support. Companion detections involving unusual administrative activity or anomalous login patterns can enhance overall detection accuracy.

