note: |
  ### Technical Context

  This rule detects network activity associated with the Quick Assist Remote Monitoring Management (RMM) tool, which can be used for remote support by IT personnel. The likely attacker objective is to exploit remote desktop capabilities to gain unauthorized access to a system and potentially execute further malicious actions. This behavior aligns with the MITRE ATT&CK technique for Remote Access Tools (T1219).

  The primary telemetry sources include Windows Event logs related to network connections, specifically targeting connections to hostnames ending in "*.support.services.microsoft.com." The security impact is significant if a malicious actor gains access, as it could lead to data exfiltration or system compromise. Importantly, this detection does NOT confirm unauthorized access on its own, as legitimate use of Quick Assist may trigger this rule.

  ### Investigation Steps

  - **Review network connection events:** Examine Windows Event ID 5156 from the Windows Firewall logs for outbound connections to *.support.services.microsoft.com. Look for unusual timestamps or systems not typically engaging in remote support activities.

  - **Identify process initiators:** Check Windows Security Event ID 4688 for process creation events that led to the network activity. Look for processes like "quickassist.exe" that indicate legitimate Quick Assist usage.

  - **Correlate with user activity:** Verify user actions around the time of detection by checking logon events (Security Event ID 4624) on affected systems. Ensure that the user is authorized to initiate Quick Assist sessions.

  - **Analyze session duration and protocols:** Compare the duration and protocol used in the detected connection (e.g., TCP/UDP) against expected behavior for legitimate Quick Assist sessions, which are typically brief.

  - **Validate host functions:** Confirm whether the source system is designated for IT support functions; if not, this may indicate unauthorized use. Cross-reference against asset inventories.

  - **Investigate for concurrent alerts:** Look for correlated alerts or entries from other monitoring tools that may indicate a broader compromise or exploitation attempt in the same time frame.

  ### Prioritization

  This alert has medium severity because it involves network activities that could signal unauthorized use of remote access. The potential for exploitation in an organization's infrastructure elevates its significance, especially if the accessing system is critical or holds sensitive data.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of Quick Assist. Not all RMM activities will be clearly visible if the organization uses multiple remote management tools. This alert could also falsely trigger during legitimate remote support cases executed by authorized personnel. A related detection to strengthen coverage could involve monitoring for anomalous user behavior with Privileged Access Management tools or observing for unauthorized exploitation of administrative credentials.

