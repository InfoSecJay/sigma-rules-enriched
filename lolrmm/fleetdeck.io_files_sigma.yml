note: |
  ### Technical Context

  This Sigma rule detects file activity related to the FleetDeck.io remote monitoring and management tool, specifically monitoring changes to its executable files and DLLs. The likely objective for an attacker utilizing FleetDeck.io would be to establish or maintain control over compromised systems through unauthorized remote access. This behavior is associated with the MITRE ATT&CK technique for Remote Management Tool Use (T1219).

  Primary telemetry sources include file event logs on Windows, specifically monitoring changes to files in the FleetDeck Agent installation directory and temporary folders. If malicious, such activity could lead to unauthorized access, data exfiltration, or lateral movement within the network. Importantly, this detection does not confirm malicious intent on its own, as legitimate use of FleetDeck.io can occur within an environment.

  ### Investigation Steps

  - **Check process creation events:** Review Security Event ID 4688 for the creation of `fleetdeck_agent_svc.exe`, `fleetdeck_agent.exe`, or `fd_agent.dll`. Verify that the process paths correspond to the expected installation directory. Legitimate processes will typically originate from authorized hosts and users.

  - **Analyze file access logs:** Evaluate Windows file event logs for any changes to `C:\Program Files (x86)\FleetDeck Agent\*`. Focus on file modifications or deletions around the same time the alert was triggered. Unusual patterns or changes made by unauthorized accounts can indicate malicious activity.

  - **Review Temp folder activity:** Investigate temporary file creation in `C:\Windows\Temp\FleetDeck\*`. Determine whether these files align with known behavior for legitimate RMM operations. Excessive or anomalous file creation may indicate an attempt to abuse the tool.

  - **Validate user credentials and access patterns:** Confirm that the user account associated with the activities has legitimate permissions for using FleetDeck.io. Look for unusual login behavior or access from atypical hosts.

  - **Cross-reference network activity:** If available, use network logs to identify outbound connections made by FleetDeck components. Monitor for connections to suspicious IPs or domains, especially if occurring shortly after file activity. High confidence indicators include communication with known malicious infrastructure.

  ### Prioritization

  The severity of this alert is medium, as the affected systems may contain sensitive data and be critical for operations. The likelihood of abuse is moderate given the specific nature of the tool and its documented use in malicious exploitation. Remote management tools like FleetDeck.io are commonly targeted by attackers for persistence and control.

  ### Blind Spots and Assumptions

  This detection may miss instances where FleetDeck.io is used legitimately by administrators, creating false positives. Evasion techniques could include renaming files or installing the tool in unconventional directories. Reliable detection requires proper configuration of file monitoring on Windows systems. Consider using companion rules that detect unusual remote access patterns or process injection techniques for enriched coverage.

