note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the FleetDeck.io Remote Management and Monitoring (RMM) tool, which may indicate unauthorized remote administration or manipulation of system files. The likely objective of an attacker using FleetDeck is to maintain persistence, execute remote commands, or exfiltrate sensitive data. The relevant MITRE ATT&CK tactics include Execution (T1203) and the technique for Remote Management Tools.

  The primary telemetry sources include Windows file system event logs, specifically targeting file creation, modification, and access events. If malicious, this behavior can lead to unauthorized access and exploitation of compromised systems. This detection does NOT confirm illicit activity on its own, as legitimate usage of FleetDeck by authorized personnel may trigger the same alerts.

  ### Investigation Steps

  - **Check for unauthorized installation:** Query Security Event ID 4624 (Logon) and 4672 (Special Logon) to identify the context of user logins associated with non-administrator accounts accessing FleetDeck directories in `C:\Program Files (x86)\FleetDeck Agent\`.

  - **Monitor file activity:** Review Windows Event ID 4663 (File Access) for timestamps and specific users interacting with `fleetdeck_agent_svc.exe`, `fd_agent.dll`, or files in `C:\Windows\Temp\FleetDeck\`. Look for irregular access patterns, such as access from unusual user accounts or systems.

  - **Identify legitimate operations:** Investigate instances of `fleetdeck_agent.exe` performing regular diagnostic operations during scheduled maintenance windows. Legitimate usage should coincide with corporate policies and scheduled tasks.

  - **Assess temporary files:** Look for unusual file creation or modification in `C:\Windows\Temp\FleetDeck\`, noting creation timestamps and user account IDs. Frequent or unexpected file manipulation could signal malicious intent.

  - **Cross-reference with network activity:** Check for outbound connections to known FleetDeck command and control servers in firewall logs or network traffic logs. Any communications to suspicious or unknown domains should be analyzed further.

  ### Prioritization

  This alert is medium severity due to the impact of the potential compromise of administrative tools on critical systems. While FleetDeck is often used for legitimate purposes, its capabilities can easily be weaponized by attackers seeking unauthorized access. The likelihood of malicious abuse increases if observed on systems with elevated privileges.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through file renaming or modifying the signature of FleedDeck components, which could evade this rule. Reliable detection requires complete logging of file events and modifications, particularly for the specified locations. Legitimate activities, such as scheduled updates or maintenance by system administrators, may trigger alerts, complicating investigation efforts. Companion detections like monitoring for unusual remote command execution patterns (e.g., PowerShell scripts invoking FleetDeck components) can enhance overall threat coverage.

