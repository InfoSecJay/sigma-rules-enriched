note: |
  ### Technical Context

  This rule detects potential network activity initiated by the LS RMM (Logistical Software Remote Monitoring Management) tool, specifically connections to designated hostnames associated with the tool's infrastructure. Attackers looking to maintain persistence or conduct remote management may leverage LS RMM for unauthorized access to systems. Relevant MITRE ATT&CK tactics include "Command and Control" (TA0011) and the specific technique "Application Layer Protocol" (T1219), as it involves utilizing a legitimate application layer protocol for communication.

  The primary telemetry sources are Windows network connection logs, ideally sourced from Windows Firewall or Sysmon. If this network activity is malicious, it can lead to unauthorized system access or exploitation of system resources. However, this detection does NOT confirm that the activity is necessarily malicious; it could represent legitimate use of LS RMM by authorized personnel.

  ### Investigation Steps

  - **Confirm the source of the connection:** Review Windows Security Event ID 5156 (Windows Filtering Platform) logs for the process creating the connection to the specified hostnames. Look for associated user accounts to determine legitimacy.

  - **Identify the initiating process:** Check Sysmon Event ID 3 (Network Connection) for details about the process creating the outbound connection to the destination hostname. For example, a process like 'msiexec.exe' establishing a connection to 'webserv.logistical-software.co.uk' may raise suspicion.

  - **Assess user context and activity:** Validate if the initiating user has permissions or a business need to use LS RMM. Cross-reference with user activity logs within the same timeframe to confirm legitimate usage patterns, especially for administrative accounts.

  - **Look for additional indicators of compromise:** Search for any related Sysmon Event ID 1 (Process Creation) logs to track any process executions preceding the network connection. For example, abnormal process chains launching from common administrative tools may suggest malicious intent.

  - **Validate network behavior norms:** Identify baseline network traffic for the systems involved. A sudden increase or unusual destination patterns can indicate potential misuse of LS RMM versus typical business activities.

  ### Prioritization

  This alert should be treated as medium severity due to the potential for unauthorized access to critical systems. The likelihood of abuse is moderate, especially if LS RMM is not typically used within the environment. However, this behavior can be weaponized during active exploitation campaigns, thus warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if LS RMM has been whitelisted or if appropriate logging is not configured for network connections. Legitimate activities may also include authorized IT staff utilizing LS RMM for routine system maintenance, which could trigger false positives. A companion detection to consider is monitoring for unusual lateral movement behavior that follows LS RMM network connections, enhancing coverage for potential post-compromise scenarios.

