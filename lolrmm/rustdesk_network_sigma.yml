note: |
  ### Technical Context
  This detection rule identifies network activity related to RustDesk, a Remote Management and Monitoring (RMM) tool commonly used for remote desktop access. In a legitimate context, organizations may utilize RustDesk to facilitate remote support and streamline IT management. However, threat actors may also exploit such tools for unauthorized remote access to systems, evading detection through legitimate pathways. The rule focuses on monitoring outgoing or incoming connections to specific RustDesk-associated domain names, suggesting attempts to leverage the tool for malicious purposes, such as data exfiltration or lateral movement within the network.

  The applicable MITRE ATT&CK tactics/techniques for this detection include:
  - **Execution** (TA0002) - indicating the execution of commands via remote management tools.
  - **Remote Services** (T1219) - as RustDesk serves as a means for remote connectivity and management.

  Primary data sources for effective detection and investigation include network connection logs, which capture outbound and inbound traffic to the targeted RustDesk domains, facilitating the identification of unauthorized usage.

  ### Investigation Steps
  - **Review Network Logs**: Analyze network connection logs for outgoing connections to rustdesk.com and associated domains. Investigate all anomalous activity, especially from unexpected internal IP addresses or during off-hours.
  - **Correlate with EDR Data**: Cross-reference alerts from endpoint detection and response (EDR) solutions to identify any processes or executables associated with RustDesk. Look for unusual process creation that may indicate a malicious context.
  - **Monitor User Behavior**: Check for any unusual user activities or access patterns related to remote access. Investigate whether any accounts with administrative privileges are involved in the detected traffic.
  - **Assess Firewall Logs**: Utilize network firewall logs to examine any blocked or allowed traffic referencing RustDesk domains. This can provide insights into potential attempts to connect and alert on abnormal attempts.

  ### Prioritization
  The medium severity of this alert is due to the inherent risk associated with RMM tools like RustDesk, which can enable significant operational disruption or data compromise if exploited by attackers. The likelihood is moderate given the prevalence of such tools in both IT environments and threat actor tactics.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the legitimate use of RustDesk within the organization, which could lead to false positives. The detection logic assumes that any connection to RustDesk domains is suspect, without accounting for validated, authorized usage. Additionally, the effectiveness of this alert relies on comprehensive logging of network connections; if logging is not enabled or improperly configured, relevant network activity may go undetected.

