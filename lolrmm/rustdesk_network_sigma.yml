note: |
  ### Technical Context

  This detection identifies outbound network connections to RustDesk domains, which may indicate the usage of the RustDesk Remote Management Tool (RMM). The likely attacker objective is to maintain remote access to a compromised system or to perform post-exploitation activities such as data exfiltration or system manipulation. This aligns with the MITRE ATT&CK technique Remote Services: Remote Access Tools (T1219).

  The primary telemetry source is Windows network connection logs, specifically focusing on connection attempts to domain names associated with RustDesk. The security impact is significant, as unauthorized use can facilitate persistent access by adversaries, potentially leading to data breaches or further exploitation. However, this detection does NOT confirm malicious activity on its own, as legitimate use of RustDesk for IT support or remote administration can also trigger the alert.

  ### Investigation Steps

  - **Check for connection details:** Review Windows security logs, specifically Security Event ID 5156 (Windows Filtering Platform), to obtain details about the network connection, including the source IP and user account context.

  - **Identify user activity:** Cross-reference the timestamps of the connections with user activity logs (e.g., Event ID 4624 for logon events) to determine if a legitimate user initiated the connection.

  - **Examine the destination hostname:** Verify the destination hostname against known RustDesk domains (e.g., api.rustdesk.com), and ensure no other unusual activities were logged around the same time frame.

  - **Assess process execution:** Review Windows process creation logs (Security Event ID 4688 or Sysmon Event ID 1) to identify processes that may have initiated the RustDesk connection. Look for suspicious parent-child process relationships indicating potential malicious invocation.

  - **Check for legitimate use scenarios:** Confirm if there is an established use case for RustDesk within your organization (e.g., documented remote support scenarios) that justifies this network activity, including any approved IT support practices.

  - **Identify high-confidence indicators:** Look for the presence of executable files associated with RustDesk in directories typically used for downloaded applications (e.g., C:\Program Files\RustDesk\). Presence of RustDesk executables combined with the network activity indicates potential malicious usage.

  ### Prioritization

  This alert warrants medium priority due to the potential impact of compromised systems using RustDesk for unauthorized remote access. The likelihood of abuse is moderately high, especially if RustDesk is not part of the organization's approved tools. This behavior is known to be weaponized in various attack scenarios, making it essential to investigate further.

  ### Blind Spots and Assumptions

  Detection may be limited by encrypted connections or misconfigured logging, resulting in missed connections or benign traffic being flagged. Organizations need to ensure that network logging is properly configured to capture all outbound connections. Legitimate remote support by IT staff can also trigger this alert. A related detection could include monitoring for known RMM tools and their behaviors, enhancing coverage against unauthorized remote access attempts.

