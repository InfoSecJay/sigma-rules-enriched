note: |
  ### Technical Context

  This Sigma rule detects potential network connections to RustDesk RMM tool endpoints, which are commonly used for remote access and management. The attacker objective likely involves establishing a command and control (C2) connection to manipulate or exfiltrate data from the target system using RustDesk as a remote access tool. This behavior corresponds with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry for this detection is network connection logs where the destination hostnames correlate with RustDesk services, notably patterns such as '*.api.rustdesk.com' and similar. If malicious, the impact can be significant, enabling unauthorized access and control over sensitive systems. However, this detection does NOT confirm malicious intent on its own, as legitimate uses of RustDesk for remote support or administration may occur.

  ### Investigation Steps

  - **Identify network connections:**
    Check for network connection logs (Windows Event ID 5156) where `DestinationHostname` matches `*.api.rustdesk.com` or similar. Compare timestamps against user activity to establish context.

  - **Review process initiation:**
    Examine Windows Security Event ID 4688 to correlate process creation with RustDesk or related executables around the time of the network event. Look for any unusual parent process indications.

  - **Assess user accounts:**
    Determine if the user account initiating the connections has legitimate reasons to use a remote access tool. Check Active Directory logs for the user's recent account activity and group memberships.

  - **Contrast with expected behavior:**
    Identify expected usage of remote access tools within the organization. If RustDesk has been approved for use, ensure corresponding documentation and operational protocols are met.

  - **Correlate with known good indicators:**
    Look for documented legitimate usage patterns of RustDesk, including expected timestamps, network destinations, and user accounts that have historically engaged in remote support scenarios.

  - **Note high-confidence malicious indicators:**
    Establish connection attempts to multiple RustDesk domains with unusual frequency or patterns that deviate from typical organizational behavior, e.g., high-volume data transmission or access during non-standard hours.

  ### Prioritization

  The alert severity is medium due to the potential severity of remote access capabilities, which can lead to system compromise. While malicious use of RustDesk is not rare, its deployment must be evaluated in the context of the organization's remote access policy. The possibility of legitimate usage still necessitates careful investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by network filtering configurations that do not capture all outbound connections or obfuscation techniques used by adversaries to disguise remote access tool connections. Legitimate activities might trigger the alert during authorized remote sessions. Companion detections, such as monitoring for unusual process creation associated with RustDesk, can enhance detection coverage and provide further context.

