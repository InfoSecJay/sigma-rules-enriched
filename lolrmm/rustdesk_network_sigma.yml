note: |
  ### Technical Context

  This Sigma rule detects outbound network connections to the RustDesk remote monitoring and management (RMM) tool domain. Adversaries may leverage RustDesk for unauthorized remote access to affected systems, potentially facilitating data exfiltration, lateral movement, or remote command execution in a compromised environment. This activity correlates with the MITRE ATT&CK tactic "Command and Control" (T1071) and technique "Application Layer Protocol" (T1071.001).

  The primary telemetry source for this detection is Windows network connection logs, specifically targeting connections where the destination host includes various RustDesk domains. Malicious use of RustDesk can grant attackers extensive control over endpoints, posing significant security risks. It is important to note that this detection alone does not confirm malicious activity, as legitimate use of RustDesk may occur within authorized IT operations.

  ### Investigation Steps

  - **Review network connection logs**: Check Windows Event ID 5156 for connections to the following domains: `rustdesk.com`, `user_managed`, `web.rustdesk.com`, `api.rustdesk.com`, and `rs-ny.rustdesk.com`. Legitimate RustDesk use will typically involve internal IT personnel managing devices for support.

  - **Investigate application presence**: Verify if the RustDesk application is installed on the affected host by checking the Windows installed programs list (using PowerShell commands like `Get-WmiObject -Query "SELECT * FROM Win32_Product" | Where-Object { $_.Name -like "*RustDesk*" }`). The absence of installation may indicate unauthorized use.

  - **Monitor for unusual user activity**: Look at user logons (Event ID 4624) around the time of detected network connections. Malicious actors may use unusual accounts or times that deviate from typical access patterns, particularly outside of business hours.

  - **Correlate with other security alerts**: Check for concurrent alerts or logs that indicate suspicious activities, such as unusual process executions (Event ID 4688) related to the RustDesk tool, which may complement the network detection and strengthen the investigation.

  - **Analyze command-line parameters**: If RustDesk is detected, examine its execution commands for arguments that suggest malicious usage, such as initiating remote sessions or using obfuscation techniques.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of remote control capabilities that can facilitate further malicious actions. The likelihood of abuse is moderate since adversaries often use such tools to leverage existing infrastructure for stealthy command and control. However, legitimate business use cases for RustDesk exist, which requires careful analysis before concluding malicious intent.

  ### Blind Spots and Assumptions

  The detection may miss cases where attackers modify the destination hostname to evade detection or if RustDesk is misconfigured to use non-standard ports. Reliable detection necessitates active logging of outbound network connections and monitoring for unexpected software installations. Legitimate administrative teams may also trigger alerts; thus, it is important to investigate the context of connections. A related detection could be monitoring for abnormal access patterns in the event logs or unusual commands executed by the RustDesk application.

