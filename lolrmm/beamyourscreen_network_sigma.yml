note: |
  ### Technical Context

  This Sigma rule detects network activity associated with the BeamYourScreen remote monitoring and management (RMM) tool. The behavior suggests that an attacker may be using this tool for unauthorized remote access, potentially indicating a compromised system or an insider threat. The relevant MITRE ATT&CK tactics are Command and Control (TA0011) and Remote Access Tools (T1219).

  Primary telemetry sources are Windows network connection logs, specifically those capturing DNS queries that resolve to *.beamyourscreen.com. The security impact of malicious use could include data theft, lateral movement within the network, or persistent access for further exploitation. Note that this detection does NOT confirm unauthorized access or malicious intent on its own; legitimate use of the BeamYourScreen tool is possible.

  ### Investigation Steps

  - **Verify the source of network activity:**
    Check Windows Security Event ID 5156 for filtering information on network connections to confirm which process initiated connections to the BeamYourScreen domain.

  - **Correlate with Process Information:**
    Examine Sysmon Event ID 3 (Network Connection) and Event ID 1 (Process Creation) to isolate the executable responsible for the network connection, ensuring it aligns with expected process behavior for remote access tools.

  - **Identify legitimate usage patterns:**
    Investigate the business context of the affected hosts and check if any scheduled remote support sessions have been logged in software used (such as ticketing systems) to validate if legitimate use aligns with the timestamps of the connections.

  - **Review Active Directory logs:**
    Check Event ID 4648 in Security logs to identify any unusual authentication activity from user accounts associated with remote access programs to ensure they're used by legitimate users.

  - **Assess the system's role in the environment:**
    Identify critical hosts (e.g., domain controllers or servers) and assess their interaction with BeamYourScreen. Unusual network behavior from such systems may indicate security threats.

  - **Look for high-confidence malicious indicators:**
    Establish a timeline of events surrounding the network activity and correlate with known malicious IP addresses or domains using threat intelligence feeds to identify any previous flagged activities.

  ### Prioritization

  Alerts generated by this detection should be prioritized as medium severity due to the potential impact on sensitive systems when remote access tools are used invasively. The likelihood of malicious abuse exists as unauthorized access could lead to data breaches or system compromise. Moreover, the use of RMM tools like BeamYourScreen is relatively common among adversaries for lateral movement.

  ### Blind Spots and Assumptions

  The detection may be limited by the presence of legitimate use of BeamYourScreen, potentially generating false positives. Ensure that DNS logging is properly configured on endpoints to capture all relevant queries. Similarly, legitimate employees using the tool for support may trigger alerts. A companion detection could include monitoring for usage of known RMM tools in conjunction with other behaviors indicative of malware or unauthorized access for stronger context.

