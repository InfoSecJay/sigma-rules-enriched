note: |
  ### Technical Context

  This Sigma rule detects network connections to the BeamYourScreen remote management tool (RMM) by identifying endpoints connecting to domains associated with this service. Attackers may leverage legitimate RMM tools like BeamYourScreen for remote access, aiming to facilitate unauthorized control over systems or to conduct further attacks post-compromise. This behavior aligns with the MITRE ATT&CK technique for Remote Administration Tools (RAT) under the tactic of Execution (T1219).

  The primary telemetry source is Windows network connection logs, specifically capturing connections to the specified domains. If this behavior is malicious, it may indicate an attacker is establishing access to the network or maneuvering within it. Importantly, this detection does NOT confirm malicious intent on its own, as the legitimate use of BeamYourScreen by authorized personnel can produce similar activity.

  ### Investigation Steps

  - **Review network connection logs:**
    Check Security Event ID 5156 (Windows Filtering Platform) to identify connections to 'beamyourscreen.com' or '*.beamyourscreen.com'. Focus on the source and destination IP addresses to track the connection.

  - **Validate host role:**
    Determine if the connecting host is an authorized user or IT support personnel with a legitimate need for remote access. Look for expected usage patterns or scheduled maintenance activities that justify the connection.

  - **Identify high-confidence indicators:**
    Look for concurrent unauthorized logins or suspicious user behavior around the same time as the connection (e.g., Security Event ID 4624 for logins) that do not align with known operational workflows.

  - **Examine for file transfer activity:**
    Investigate any file transfers initiated from the connecting host (use relevant logs like Security Event ID 4663 or Sysmon Event ID 11 for file creation). Confirm if large file uploads/downloads occurred that deviate from normal usage.

  - **Determine external traffic patterns:**
    Cross-reference with DNS query logs (if available) to identify unusual trends or unexpected domain resolution requests related to BeamYourScreen traffic.

  ### Prioritization

  This alert carries medium severity because it indicates possible unauthorized access to systems, especially if coming from critical assets. The likelihood of malicious abuse is moderate, as legitimate use cases exist, but the presence of RMM tools is often weaponized in attacks against organizations.

  ### Blind Spots and Assumptions

  Detection may miss legitimate usages by users who require BeamYourScreen for their roles, potentially leading to false positives. Ensure that the relevant network connection logs are enabled and adequately configured for comprehensive coverage. Related detections include monitoring for other known RMM tools or shadow IT software that could pose similar risks, enhancing overall threat visibility.

