  ---

  ### Technical Context

  This Sigma rule detects network connections to BeamYourScreen (RMM tool) domains, indicating potential use of the remote management software. The primary attacker objective could involve remote access to a target system for unauthorized control or data exfiltration. This activity maps to the MITRE ATT&CK framework under the tactic "Execution" (TA0011) and technique "Remote File Copy" (T1219).

  The primary telemetry sources include Windows network connection logs, specifically capturing DNS resolutions and outbound connection attempts to the domains `beamyourscreen.com` and its subdomains. If used maliciously, this could provide an attacker with a means to control or manipulate target systems. It’s important to note that this detection does NOT confirm malicious intent on its own; legitimate use cases exist for BeamYourScreen.

  ---

  ### Investigation Steps

  - **Check outbound connections to known domains**: Review logs for connections to `beamyourscreen.com` or any subdomains. Use Windows Event ID 5156 (Windows Filtering Platform), and focus on `DestinationIp` and `DestinationPort` fields for investigation.

  - **Identify connections originating from uncommon assets**: Validate whether the source of the connection is a critical system (e.g., servers, admin workstations). Check the `SourceHostname` and ensure it aligns with expected legitimate activity.

  - **Review remote access logs**: Cross-reference with other RMM tool logs (if available) or look for any unusual patterns in TeamViewer or AnyDesk logs. Use API prints or logs filtering for specific user actions (start, stop, or manage sessions) to differentiate benign activities.

  - **Monitor for user activity during the connection**: Investigate whether the user accounts initiating connections were actively logged in or in a session during the occurrences. This utilizes security event logs (Event ID 4624 – logon events) correlated with network activity timestamps.

  - **Correlate with known threat actor behaviors**: Investigate if the connection aligns with behavioral patterns of known threats in your environment. This includes correlating with previous incidents involving remote access tools and atypical connection times.

  - **Document legitimate use cases**: Compile a list of users or assets who typically utilize BeamYourScreen. Verify if their activities coincide with the alert and assess for anomalous usage patterns outside typical hours or resource demands.

  ---

  ### Prioritization

  The medium severity assessment indicates a moderate risk due to potential unauthorized access via a known remote management tool. The impact can range from information disclosure to system compromise depending on the criticality of the affected systems. While BeamYourScreen is legitimate software, its misuse in an enterprise context is not uncommon.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if an attacker uses tunneling or encrypted channels that do not exhibit recognizable outbound traffic patterns. Reliable detection relies on accurate logging configurations of both network connections and user activities. Legitimate remote support sessions conducted by IT staff may trigger this alert, as would occasional usage for training or demonstrations. A complementary detection to consider is monitoring for PowerShell activity associated with remote access, which can help detect automation or scripted exploitation attempts.

