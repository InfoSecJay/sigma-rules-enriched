  ### Technical Context

  This Sigma rule detects network activity associated with the BeamYourScreen remote management and monitoring (RMM) tool, specifically targeting connections to the domain `beamyourscreen.com`. Attackers may utilize RMM tools to gain unauthorized access and control over systems, conduct reconnaissance, or deploy malware. The relevant MITRE ATT&CK technique is "Remote Services: Remote Desktop Protocol" (T1219).

  Primary telemetry sources include Windows event logs for network connections, specifically network connection logs that provide destination hostnames. If this behavior is malicious, it could lead to unauthorized administrative access and potentially data breaches or system manipulation. Importantly, this detection does NOT confirm that the activity is malicious, as legitimate use of BeamYourScreen for remote support or administration can trigger the same connections.

  ---

  ### Investigation Steps

  - **Review network connections: ** Cross-reference recent network connections (Event ID 5156) to identify any outbound connections to `beamyourscreen.com` or its subdomains.

  - **Check process associations: ** Investigate associated processes using Sysmon Event ID 1 to identify if any unusual or unrecognized processes initiated the network connections to BeamYourScreen.

  - **Identify legitimate usage: ** Confirm if organizational policies permit the use of BeamYourScreen and check for authorized user accounts that may be utilizing it for legitimate support.

  - **Look for suspicious activities: ** Assess if the connections are accompanied by other suspicious behaviors, such as unusual file creations or modifications in critical directories, especially by newly created or unknown accounts.

  - **Validate source IP addresses: ** Determine if the source IP addresses for these connections match known assets within the organization or should be flagged for further review.

  - **Monitor for common indicators: ** Watch for additional activity linked to RMM tools, such as login events (Security Event ID 4624) from unexpected user accounts or timestamps that don’t align with regular operational hours.

  ---

  ### Prioritization

  The severity of this alert is medium. While the RMM tool might have legitimate uses, the risk posed by unauthorized access through such tools is significant, especially on critical systems. This type of behavior is increasingly weaponized by attackers for lateral movement and persistence, warranting careful review.

  ---

  ### Blind Spots and Assumptions

  The detection has limitations as it could be evaded by modifying the target hostname or using alternative remote desktop solutions. Reliable detection requires proper configuration of endpoint behavioral logging and may generate false positives from legitimate administrative activities. A related detection to consider involves monitoring for credential dumping or lateral movement techniques that often accompany RMM tool usage, enhancing overall coverage.

