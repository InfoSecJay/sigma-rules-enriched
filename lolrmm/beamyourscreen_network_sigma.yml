note: |
  ### Technical Context

  This rule detects network activity attempting to connect to the BeamYourScreen remote management tool (RMM), specifically targeting the `beamyourscreen.com` hostname or its subdomains. The likely objective of an attacker using this tool could be unauthorized remote access or control over compromised systems. This activity aligns with the MITRE ATT&CK technique for "Application Layer Protocol" (T1219) under the command and control tactic.

  The primary telemetry sources for this detection include Windows network event logs, specifically those capturing outbound network connections. If this activity is malicious, it can indicate unauthorized access and potential compromise of sensitive data. It's important to note that the detection of this network activity does NOT confirm that the system has been compromised or that any harmful actions were executed.

  ### Investigation Steps

  - **Check outbound connection logs:** Review Windows Security Event ID 5156 (Windows Filtering Platform) to identify any connections to `beamyourscreen.com` or related subdomains. Confirm if the source is an expected asset or a known system based on your organization's usage policies.

  - **Identify inbound rule exceptions:** Examine your network firewall logs for any outbound rules applied to ports associated with BeamYourScreen (typically TCP 443). Legitimate usage may be seen if traffic is initiated by authorized user accounts or processes.

  - **Analyze process activity:** Review Windows Event ID 4688 (Process Creation) for suspicious processes that may have listed 'beamyourscreen.com' in command line arguments. Look for high-risk indicators, such as unusual user accounts starting these processes.

  - **Examine user behavior:** Validate if the user account initiating connections is a known RMM user. Look through authentic user activity logs to establish if the behavior aligns with normal operational practices or if it raises any red flags.

  - **Investigate related artifacts:** Determine if any files associated with the BeamYourScreen tool were created or modified. Check for file artifacts in paths typical for RMM tools (e.g., Program Files or AppData folders) that could indicate installation or execution.

  ### Prioritization

  This alert carries medium severity as it involves potential remote access by both legitimate users and threat actors. Given the tool’s legitimate use and targeting of potentially sensitive systems, it could be exploited for malicious purposes. This behavior is concerning, especially if seen on critical assets without prior authorization.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate usage of the BeamYourScreen tool within the organization, leading to false positives. Ensure that Windows Filtering Platform and relevant network logs are configured correctly to capture this data consistently. Additionally, mundane remote support activities can trigger the alert, which should be noted during investigations. For comprehensive coverage, consider pairing this detection with alerts monitoring for unusual inbound remote connections to ensure a holistic view of potentially unauthorized access attempts.

