note: |
  ### Technical Context

  This Sigma rule detects network activity from Parallels Access, a remote management tool, by monitoring outbound connections to domains ending in '.parallels.com'. The likely objective of an attacker using this tool is to achieve unauthorized remote access and control of a target system, facilitating further exploitation or data exfiltration. This behavior is related to the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically looking for DestinationHostname fields indicating a connection to Parallels domains. If this activity is malicious, it may indicate a compromised asset being accessed by an external attacker. However, it is important to note that this detection alone does not confirm malicious activity, as legitimate use of Parallels Access can trigger similar alerts.

  ### Investigation Steps

  - **Check outbound connection details:** Review Windows Firewall logs for outbound connections (Event ID 5156) to domains ending with '.parallels.com'. Note the local process name and unique user account tied to the connections.
  - **Validate legitimate use cases:** Investigate if Parallels Access is officially installed and used by authorized personnel. Review installation logs or documentation for known user activity and access events.
  - **Examine session initiation:** Look for Remote Desktop Protocol (RDP) events (Event ID 4624) corresponding to the time of the network connection. Identify if the user context indicates legitimate administrative access or non-standard hours of activity.
  - **Identify malicious indicators:** Focus on connections made by non-standard processes attempting to reach '.parallels.com' domains from endpoints not designated to utilize remote desktop tools. Check for unusual source IP addresses or user accounts.
  - **Review process tree:** Use Sysmon logs (Event ID 4688) to examine the parent-child process relationships for any suspicious processes connected to Parallels domains. Validate unusual process parents or unexpected command-line arguments.
  - **Compliance with asset categorization:** Consider the role of the host connecting to the Parallels service. Critical systems (e.g., domain controllers, sensitive data stores) should not have access unless explicitly allowed; flag any such access for further scrutiny.

  ### Prioritization

  This alert has medium severity due to the potential risk of unauthorized remote access on internal systems. If exploited, attackers could gain control over critical infrastructure. Given the nature of remote access tools, this behavior is often weaponized in advanced persistent threat scenarios, requiring prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via masked or proxied outbound connections that may obscure legitimate use. Required log sources include comprehensive monitoring of network activity and firewall configurations to capture all outbound connections accurately. Additionally, legitimate activities might encompass valid remote access scenarios by employees using authorized software; therefore, context review is crucial. Companion detections should include logs for known remote access software installations and use (e.g., Event IDs related to software installation and Service creation).

