  ### Technical Context

  The Sigma rule detects network connections to Parallels Access RMM tool endpoints, indicating potential use of remote management software in the enterprise environment. Attackers may aim to gain unauthorized access or maintain persistence within systems by leveraging this remote access tool. This behavior relates to the MITRE ATT&CK technique: Remote Services (T1219).

  The primary telemetry sources for this detection include Windows network connection logs, particularly focusing on DNS queries and network events tied to outbound connections. If malicious activity is confirmed, it could result in unauthorized data access, system compromise, or lateral movement within the network. Importantly, this detection alone does not confirm malicious intent, as legitimate use of Parallels Access is not uncommon in some enterprise environments.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Check Windows Event log (Event ID 5156) for outbound connections to `*.parallels.com`. Focus on connections initiated from sensitive or high-privilege systems (e.g., domain controllers or admin workstations).

  - **Validate endpoint configuration:** Confirm whether Parallels Access is registered and authorized for use within the organization by checking configuration management databases or software inventories.

  - **Assess user activity:** Investigate user accounts associated with the detected connections. Look for increased activity or anomalies during the connection timeframe, especially actions leading up to or following the remote session (i.e., Event ID 4624 for login activity).

  - **Identify high-confidence malicious indicators:** Look for other clustering behaviors, such as connections to multiple Parallels IP addresses in a short timeframe, which may suggest automated tools or scripts (e.g., frequent DNS queries in system logs).

  - **Determine alternative legitimate usage:** Understand how legitimate users typically engage with Parallels Access, which usually involves specific usage patterns (e.g., scheduled remote sessions or access outside normal hours) as opposed to erratic access requests.

  ---

  ### Prioritization

  This alert indicates medium severity due to the potential impact on sensitive systems if exploited by malicious actors. The likelihood of malicious abuse is moderate as remote access tools like Parallels Access are often weaponized in targeted attacks. Moreover, detection may highlight both legitimate administrative actions and potential adversary techniques, requiring further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if outbound network logging is not fully enabled or configured, potentially allowing malicious activity to go undetected. Legitimate activities such as IT support or remote management by authorized personnel might trigger this alert. A related detection to consider is monitoring for unusual RDP or VPN activity in conjunction with identified access to ensure comprehensive coverage.

