  ---

  ### Technical Context

  This rule detects network activity associated with the Parallels Access Remote Management Tool (RMM), specifically connections to destinations ending with "*.parallels.com." The attacker may leverage Parallels Access for remote administration or exploitation of compromised hosts, typically to maintain persistence or to gather sensitive data. The relevant MITRE ATT&CK tactic is Execution, with technique ID T1219 (Remote Access Software).

  Primary telemetry sources include Windows network connection logs, specifically monitoring outbound connections. If this tool is used maliciously, it poses a significant security risk by enabling unauthorized remote access to systems, leading to potential data breaches or system manipulation. It's important to note that this detection does NOT confirm malicious use of Parallels Access; legitimate uses by authorized personnel may trigger the alert.

  ---

  ### Investigation Steps

  - **Review network connection logs**: Examine Windows Event IDs related to network connections (Event ID 5156 and 5158) to identify any connections made to "*.parallels.com". Note the user accounts involved and compare against known authorized users of the tool.

  - **Correlate with known asset lists**: Determine if the system generating the alert is a device known or approved to use Parallels Access. Check the asset inventory for device roles, such as IT administrative systems that may legitimately use RMM tools.

  - **Inspect user behavior**: Look for patterns of use in the user identity context (e.g., time of day, frequency of access) that align with typical operational timelines for the known Parallels Access users. Alert on anomalous access times.

  - **Identify malicious indicators**: Focus on investigation of any successful connections to the specified domain that are accompanied by unusual user-agent strings or non-standard ports. Document any discrepancies, such as connections initiated by non-privileged accounts.

  - **Check for file creation activity**: Monitor for related file creation events (Security Event ID 4688 for process creation) that indicate the execution of Parallels Access binaries. Investigate any incongruities in timestamps or user context during these events.

  ---

  ### Prioritization

  This alert should be considered medium severity given the potential impact on sensitive data if remote access is misused. While the presence of Parallels Access does not guarantee malicious activity, remote execution tools are often weaponized in targeted attacks. The likelihood of abuse is notable, particularly if the alert arises from systems without an established need for such tools.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate use of the Parallels Access tool by authorized users, which may lead to false positives. Required log sources must be configured to ensure comprehensive coverage of network connections; absence of this telemetry can hinder detection. Additionally, other legitimate remote access tools may generate similar network traffic. A related detection to consider is monitoring for instances of remote access software installations (e.g., via software deployment logs), which could further augment detection coverage.

