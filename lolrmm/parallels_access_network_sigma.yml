note: |
  ### Technical Context
  This rule detects potential network activity associated with the Parallels Access Remote Management (RMM) tool. Parallels Access is known for enabling remote desktop and application access, which can be exploited by attackers to gain unauthorized control over machines and sensitive data. Adversaries may use this tool to facilitate remote administration tasks, pivot through networks, and carry out various malicious activities while remaining under the radar.

  The likely attacker objectives include establishing persistence, exfiltrating data, and evading detection by utilizing remote management capabilities that are typically seen in legitimate use cases. This activity aligns with the **MITRE ATT&CK tactic of Execution** and technique **T1219: Remote Access Software**, highlighting the potential threat posed by remote access tools when abused by malicious actors.

  Primary data sources for this detection include Windows network connection logs, which provide visibility into outbound connections and can help identify when machines are reaching out to suspicious endpoints associated with Parallels Access.

  ### Investigation Steps
  - **Review Network Connection Logs:** Collect logs related to outbound network connections to identify any conversations with domains ending in '*.parallels.com' or directly interacting with 'parallels.com/products/ras/try'.
  - **Analyze Endpoint Activity:** Investigate process creation events on endpoints showing the Parallels Access client or associated processes to confirm any unusual usage patterns or execution anomalies.
  - **Assess User Activity:** Look into user account activity, ensuring that the users accessing the Parallels service have a legitimate business need, particularly considering any patterns that deviate from normal operations.
  - **Examine Firewall Logs:** Check network firewall logs for any connections to Parallels-related IP addresses or domains that may indicate unauthorized use of the RMM tool.

  ### Prioritization
  Given the potential for unauthorized remote access and control, the alert has a medium severity level. While legitimate use of Parallels may occur, the possibility of abuse in an enterprise environment necessitates attention to distinguish between normal and malicious activity.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if certain endpoint logs are not enabled or if the organization does not typically utilize Parallels Access, leading to false negatives. The detection logic assumes that any connection attempts to specified Parallels domains without corresponding legitimate usage will indicate a potential threat. For optimal alert functionality, ensure that Windows network connection logging and process creation event logging are configured and that network traffic is monitored comprehensively.

