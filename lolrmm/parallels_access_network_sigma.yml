note: |
  ### Technical Context

  This rule detects network activity involving the Parallels Access RMM tool, which is used for remote monitoring and management of systems. Its detection is important as attackers may leverage legitimate remote access tools for unauthorized access to systems or for command-and-control (C2) communications. This behavior fits within the MITRE ATT&CK framework under the tactic of Command and Control (ID T1219). The primary telemetry sources for this detection include Windows event logs related to network connections, specifically monitoring DNS queries or outbound connections.

  If the activity is malicious, it can result in unauthorized access and control over the affected systems, potentially leading to data exfiltration or system compromise. It is important to note that this detection does NOT confirm malicious intent on its own, as Parallels Access can be used for legitimate administrative purposes.

  ### Investigation Steps

  - **Check for outgoing connections to Parallels domains**: Review network connection logs (Windows Event ID 5156 or Sysmon Event ID 3) specifically for outbound connections to `*.parallels.com`. Malicious indicators may include unexpected connections from systems not designated for remote management.

  - **Identify associated processes**: Investigate the process associated with the network connection by utilizing Sysmon Event ID 1 for process creation events. Look for processes that are not typical for remote management activities, such as unknown scripts or executables.

  - **Review remote management policies and asset role**: Confirm if the affected asset is designated for remote management using Parallels. Legitimate use should show discussions in tickets or documentation that authorize the tool's usage by specific administrators.

  - **Examine authentication events from the same timeframe**: Check for any unusual authentication logs (Security Event ID 4624) around the time the connection to Parallels domains was made. Look for anomalous user accounts or high volumes of login attempts from unexpected locations.

  - **Monitor for data exfiltration activities**: Validate any file creation or data exfiltration events during the activity window by inspecting the Windows Event ID 4663 (file access) or audit logs for unauthorized modification or access patterns.

  - **Cross-reference with incident history**: Look up any previous incidents involving the usage of Parallels Access or similar RMM tools in your environment. Familiarity with historical data can help in identifying whether this activity is part of a new attack or legitimate business operations.

  ### Prioritization

  The alert has a medium severity due to the potential risk of unauthorized access via remote management tools. The impact depends on the criticality of the affected system and the legitimacy of the activity, while the likelihood of malicious abuse is higher, given that RMM tools are often targeted for exploitation in attacks.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers utilize DNS tunneling or advanced evasion techniques to mask their use of the tool. Reliable detection relies on active monitoring of network connection logs, which must be configured properly to catch such activity effectively. Legitimate use cases include administrative access by IT staff for maintenance, which may trigger this alert without malicious intent. A companion detection could involve monitoring for unexpected usage patterns of other remote access tools to enhance visibility into potential malicious behavior.

