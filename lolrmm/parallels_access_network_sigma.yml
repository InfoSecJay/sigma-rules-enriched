note: |
  ### Technical Context

  This rule detects outbound network connections to domains ending in `.parallels.com`, which is associated with the Parallels Access remote access management (RMM) tool. Attackers may use this tool to establish unauthorized remote access, moving laterally within a network or exfiltrating sensitive data. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique for Remote Access Software (T1219).

  The primary telemetry sources include Windows network logs with attention to outgoing connection data. Malicious activity could imply unauthorized use of Parallels Access, leading to potential data breaches or unauthorized system manipulation. This detection does NOT confirm that malicious activity is occurring; legitimate administrative use of the tool can trigger the alert.

  ### Investigation Steps

  - **Check outgoing network connections:** Review Windows Firewall logs (Event ID 5156) for outbound connections to `.parallels.com` and log any instances of unusual outbound traffic to this domain from non-administrative accounts.

  - **Identify the application making connections:** Investigate Process Creation logs (Event ID 4688) for processes linked to sessions connecting to `.parallels.com`. Malicious indicators may include connections made by unexpected or unusual processes (e.g., not listed in baseline environment).

  - **Review user behavior for legitimacy:** Query user account activity logs (Security Event ID 4624) for recent logins by privileged users to see if there’s a legitimate use case for Parallels Access, checking timestamps and locations against known patterns of administrative work.

  - **Assess host roles and criticality:** Ensure that the originating machine’s role is appropriate for using remote access tools. Any unexpected systems (e.g., non-admin workstations) initiating connections to this RMM tool should be flagged for further investigation.

  - **Monitor session re-connections:** Look into Sysmon logs (Event ID 1 for network connections) to verify if multiple connections are being re-established frequently in a short period, indicative of potential automated remote access software in use.

  ### Prioritization

  The alert should be considered medium severity due to the potential risk of compromising administrative tools that can provide attackers with elevated access to sensitive systems. While Parallels Access is a legitimate tool, its misuse is commonly weaponized in targeted attacks, heightening the potential impact of any unauthorized use.

  ### Blind Spots and Assumptions

  This detection may be circumvented by legitimate Parallels Access usage, which poses a challenge in distinguishing between benign and malicious behavior. Reliable detection requires consistent log collection from Windows Firewall, Sysmon, and process logs. Legitimate remote management activities, especially in a managed IT environment, may frequently trigger this alert. Related detections like monitoring unusual remote management tool usage can provide stronger contextual support for investigations.

