note: |
  ### Technical Context

  This Sigma rule detects potential unauthorized registry changes associated with the Freshservice Remote Monitoring and Management (RMM) tool. The behavior may indicate an adversary's attempt to control or manipulate assets within an enterprise environment, which aligns with the attack lifecycle's execution phase. The likely attacker objective is to deploy software that allows for remote management and monitoring of systems, potentially as part of a broader compromise or to facilitate data exfiltration.

  This detection corresponds to the MITRE ATT&CK tactic of Execution, specifically technique T1219 – Remote Access Software. The primary telemetry sources for this alert are Windows registry event logs that capture writes to specific registry paths associated with Freshservice components. If malicious, this behavior could lead to persistent access for the attacker, enabling them to execute arbitrary commands or extract sensitive information. Importantly, this detection does NOT confirm that the Freshservice RMM tool is malicious on its own; it simply indicates registry activity that may warrant further investigation.

  ### Investigation Steps

  - **Review registry changes:** Examine Windows registry logs for Event ID 4657 or Sysmon Event ID 13 corresponding to changes in target keys: 'HKLM\SYSTEM\CurrentControlSet\Services\FSAgentService' and 'HKLM\SOFTWARE\Freshdesk\FSAgent'. Look for changes initiated by non-administrative users.

  - **Identify process execution context:** Check for process creation events (Event ID 4688) that correlate with registry changes. Look for processes spawned by legitimate user accounts versus potentially adversarial ones. Validate timestamps to establish correlation.

  - **Cross-reference application installations:** Examine logs from Event ID 1033 (Windows installer logs) for legitimate installation of Freshservice software. Identify if proper installation procedures were followed, including expected application sources.

  - **Detect unauthorized remote access sessions:** Review network logs for connections (Windows Event ID 5156) targeting critical assets that could be associated with the Freshservice tool, indicating potentially malicious remote access.

  - **Verify expected usage patterns:** Establish a baseline of legitimate activity surrounding Freshservice usage within the organization. Identify typical user accounts and operational hours for expected use of the Remote Monitoring and Management tool.

  ### Prioritization

  This alert carries medium severity as it involves changes potentially related to a remote management tool. Given that these tools are often exploited for unauthorized access or manipulation, the likelihood of malicious use is significant. Additionally, remote access software activity is a common vector for attackers.

  ### Blind Spots and Assumptions

  This detection may miss instances where malicious actors employ alternate techniques to evade detection, such as using legitimate credentials or modifying log settings. It requires proper logging configuration to ensure all relevant registry actions are captured. Legitimate use of the Freshservice tool by authorized personnel may trigger this alert, complicating investigations. A companion detection to strengthen coverage could involve monitoring for unexpected outbound connections to Freshservice's servers that fall outside of normal operational patterns.

