note: |
  ### Technical Context

  This Sigma rule detects potentially malicious registry activity related to the Freshservice Remote Monitoring and Management (RMM) tool. Attackers may utilize this tool for Remote Access Trojan (RAT) capabilities, allowing covert control over compromised systems. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), specifically the technique "Remote Desktop Protocol" (T1219).

  Primary telemetry sources include Windows Registry Event logs, specifically monitoring for modifications to the services and software keys associated with Freshservice. If the detected activity is malicious, it may lead to unauthorized access or control over affected endpoints. It is essential to note that this detection does NOT confirm malicious intent on its own since legitimate installations of Freshservice may trigger similar alerts.

  ### Investigation Steps

  - **Check Registry Modifications:** Review Windows Registry Event logs (Event ID 4657) for changes to keys containing 'HKLM\SYSTEM\CurrentControlSet\Services\FSAgentService' or other related Freshservice entries. Legitimate installation will typically have consistent entries without abrupt changes.

  - **Inspect Event Logs for Process Creation:** Look for associated process creation (Event ID 4688 or Sysmon Event ID 1) linked to the Freshservice service binaries. Malicious indicators include unexpected process names or unusual command-line arguments at the time of registry changes.

  - **Verify Service Integrity:** Examine the Windows services list (using sc query) for 'FSAgentService' and 'FreshServiceScan.' Legitimate services should have a corresponding valid executable path, whereas anomalous paths may indicate a compromise.

  - **Identify Unauthorized Software Installation:** Check the Uninstall registry keys for unexpected entries related to Freshservice using Event ID 1033 from Windows Installer logs. Any installation not approved by IT may signal unauthorized software.

  - **Monitor Network Activity:** Analyze network traffic for any connections established from the Freshservice services to external IPs, particularly those not previously whitelisted. Look for unusual outbound connections, which can indicate exfiltration or C2 communication.

  ### Prioritization

  This alert is classified as medium severity. Freshservice tools can provide an attacker with significant control over systems, and since these tools can also be weaponized, it warrants immediate investigation. However, the likelihood of false positives from legitimate administrative use is a factor to consider.

  ### Blind Spots and Assumptions

  This detection may miss obfuscated or renamed service entries that attackers use to hide malicious activity. Reliable detection requires complete Windows Registry logging and event forwarding; otherwise, key activities may go undetected. Legitimate occurrences of Freshservice installations or updates could trigger the alert, making it critical to correlate with asset inventory data. An additional detection of unauthorized remote access tools would strengthen monitoring of potential threats in this area.

