note: |
  ### Technical Context

  This detection identifies file activity associated with the ShellHub RMM tool, specifically the creation or modification of its agent binary and configuration files. The likely attacker objective is to establish remote access to compromised systems for ongoing management and exploitation, typically indicating persistence through the ShellHub agent. Relevant MITRE ATT&CK tactic is "Execution" (TA0002) with the technique being "Remote Services" (T1219).

  Primary telemetry sources include Windows file event logs that capture changes to files specified in the rule. If malicious, this activity could allow an adversary to maintain control over the compromised host, potentially leading to further exploitation. However, this detection alone does NOT confirm that the activity is malicious; it only indicates that these specific files have been accessed or modified.

  ### Investigation Steps

  - **Review file activity logs for suspicious events**: Look for Security Event IDs 4663 (File Access) or Sysmon Event ID 11 (FileCreate) detailing modifications to `/usr/local/bin/shellhub-agent`, `/etc/shellhub-agent/agent.env`, or `/etc/systemd/system/shellhub-agent.service`. Benign activity might show frequent usage by known administrative accounts.

  - **Identify user accounts involved**: Check for the user account performing the file activity in the logs. If the activity is linked to non-administrative accounts or unknown service accounts, it may indicate malicious intent.

  - **Correlate with process execution logs**: Confirm if there are corresponding Security Event ID 4688 logs (Process Creation) that show the ShellHub agent being executed shortly after file activity. Unexpected execution time or command line arguments could be indicators of misuse.

  - **Examine the system for additional persistence mechanisms**: Investigate other startup directories (e.g., `C:\ProgramData`, `C:\Users\%username%\AppData\Local\Microsoft\Windows\Start Menu\Programs\Startup`) for additional ShellHub-related files or other persistence tactics. Legitimate deployments will usually be documented and centrally managed.

  - **Validate against known good deployments**: Reference your organization’s asset inventory for legitimate instances of ShellHub. Compare identified logs against expected usage patterns. Confirm that the version and file paths align with standard deployment configurations.

  ### Prioritization

  This alert should be treated with medium severity due to the moderate impact of the affected system, which is likely to be critical for operations. The likelihood of malicious abuse is significant given the tool's capabilities for remote management, which are commonly weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion techniques such as renaming the ShellHub files or hiding activity through directory obfuscation. Ensuring Windows file auditing is enabled for the necessary directories is crucial for reliable detection. Legitimate use of ShellHub in managed systems may trigger this alert, leading to false positives. A related detection to consider is monitoring for unauthorized modifications to other remote access tool configurations or suspicious network connections from the host.

