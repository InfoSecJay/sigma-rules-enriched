note: |
  ### Technical Context

  This rule detects potential file activity associated with the ShellHub Remote Management Tool (RMM), specifically targeting the creation or modification of critical files related to its agent and service configuration. The likely attacker objective could include establishing persistent access or remote control over a compromised system by leveraging ShellHub, which can facilitate command execution and data exfiltration. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), with the specific technique being **Non-Standard Port** (T1219).

  Primary telemetry sources include file event logs from Windows systems, particularly focused on changes to filenames such as `shellhub-agent`, `agent.env`, and `shellhub-agent.service`. If malicious, this activity can enable a threat actor to maintain control over affected systems, potentially leading to further exploitation or data breaches. Importantly, this detection alone does not confirm malicious intent, as legitimate use of ShellHub may also trigger these alerts.

  ### Investigation Steps

  - **Check File Event Logs:** Review Windows event logs (specifically Event ID 4663) for any create or modify operations related to `/usr/local/bin/shellhub-agent`, `/etc/shellhub-agent/agent.env`, or `/etc/systemd/system/shellhub-agent.service`. Look for unusual timestamps or user accounts not typical for your environment.

  - **Analyze User Context:** Identify the user account associated with the file changes. If the account is a standard user with no administrative privileges making these changes, this is a higher confidence indicator of malicious activity.

  - **Review Host Role:** Determine if the system where file activity was detected is a server designated for administration tasks. If so, the presence of ShellHub files could indicate an unauthorized installation.

  - **Confirm Legitimate Usage:** Validate if ShellHub is an approved tool within your organization by cross-referencing against existing application inventories. Authorized installations should be logged with appropriate documentation.

  - **Identify Process Creation Events:** Investigate if there are concurrent process creation events (Event ID 4688 or Sysmon Event ID 1) tied to the modified files. Look for any unusual command line arguments indicating remote access or suspicious behavior.

  - **Network Activity Review:** Utilize network logs to examine outbound connections from the affected host. If connections are made to known ShellHub IPs or unknown external networks, this is a strong indication of malicious behavior.

  ### Prioritization

  The alert is of medium severity as its confirmation requires contextualization with other evidence, such as user behavior and process actions. The likelihood of malicious abuse is moderate, considering that tools like ShellHub are sometimes weaponized for remote access by threat actors. However, legitimate administrative tasks may also trigger this alert, necessitating thorough investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of evasive techniques used by adversaries, such as renaming known process binaries or running ShellHub on legitimate user accounts. Required log sources include file system auditing logs and security event logs, which must be properly configured for comprehensive monitoring. Legitimate activities, such as authorized system administration or maintenance tasks, might trigger this alert. A related detection covering unauthorized remote access attempts (e.g., through unexpected tool usage) would strengthen overall coverage and detection effectiveness.

