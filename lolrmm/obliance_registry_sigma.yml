logsource:
  product: windows
  category: registry_event
detection:
  selection:
    TargetObject|contains:
    - 'HKLM\SOFTWARE\OblianceAgent'
    - 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\OblianceTray'
    - 'HKLM\SYSTEM\CurrentControlSet\Control\SafeBoot\Network\OblianceAgent'
    - 'HKLM\SYSTEM\CurrentControlSet\Services\OblianceAgent'
  condition: selection
falsepositives:
- Legitimate use of Obliance
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized registry modifications associated with the Obliance Remote Monitoring and Management (RMM) tool. Adversaries may use this tool to establish persistent access or to manage malware installations remotely. The relevant MITRE ATT&CK tactics and technique include **Command and Control (T1071)** and **Indicator Removal on Host (T1070)**. Primary telemetry sources include Windows Registry events that log changes made to specific registry keys related to the OblianceAgent. If identified as malicious, the presence of these registry keys indicates potential unauthorized remote access and control over the affected system. This detection does NOT confirm that the activity is indeed adversarial; it could represent legitimate usage of the Obliance tool by authorized personnel.

  ### Investigation Steps

  - **Check registry modifications: **Query recent changes to the registry using Event ID 4657 (Registry value modified) or Sysmon Event ID 13. Look for changes to 'HKLM\SOFTWARE\OblianceAgent' or related keys. Ensure there is no legitimate business case for the modifications.

  - **Review process creation events: **Examine Security Event ID 4688 for process creation events involving 'OblianceTray' or 'OblianceAgent'. Compare the parent process ID against known legitimate software installations to identify anomalous behavior.

  - **Investigate service configurations: **Check Windows Services using (Get-Service | Where-Object {$_.DisplayName -like "*Obliance*"}). Validate if the OblianceAgent service is configured to start automatically and ensure it's documented in your asset inventory.

  - **Determine asset criticality: **Identify the affected machine's role within the organization. Critical infrastructure systems requiring higher scrutiny may indicate increased risk if compromised by an RMM tool.

  - **Look for known Indicators of Compromise (IoCs): **Cross-reference discovered artifacts (e.g., registry keys, services) with threat intelligence sources for known instances of malicious use of the Obliance RMM tool.

  ### Prioritization

  This alert is assigned medium severity due to the potential for compromised systems hosting administrative access tools. The likelihood of malicious abuse is moderate, given the prevalence of RMM tools being weaponized in targeted attacks. Enterprise environments must closely monitor these activities to prevent unauthorized access.

  ### Blind Spots and Assumptions

  Detection may be limited by the frequency of legitimate use of the Obliance tool, resulting in noise from false positives. Ensure reliable detection by correctly configuring Windows registry logging and securing endpoints. Legitimate administrator activity could trigger the alert when performing routine maintenance. Related detection rules, such as monitoring for suspicious PowerShell commands or network connections associated with remote access tools, strengthen overall coverage against similar threats.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
