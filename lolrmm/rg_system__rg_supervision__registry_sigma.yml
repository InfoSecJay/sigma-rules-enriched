note: |
  ### Technical Context

  This Sigma rule detects modifications to system registry keys associated with the RG System (RG Supervision) Remote Monitoring and Management (RMM) tool. The likely attacker objective is to establish or maintain persistence and command-and-control capabilities on compromised systems. Relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071) and Registry Run Keys / Startup Folder (T1219). The primary telemetry sources are Windows registry event logs identifying access and modification attempts (Event ID 4657). If malicious, unauthorized use of this RMM tool could lead to system compromise and data exfiltration. This detection does NOT confirm that the identified activity is necessarily malicious, as legitimate use of RG Supervision exists.

  ### Investigation Steps

  - **Verify registry access events:** Examine Windows Security Event ID 4657 for specific entries indicating that HKLM\SOFTWARE\RG Systemes\RG Supervision has been accessed or modified. Look for user accounts lacking administrative privileges as a potential indicator of unauthorized activity.

  - **Check for known malicious behaviors:** Assess for simultaneous use of other Event IDs (e.g., 4688 for new process creation) to see if RG System processes (e.g., rgsvc.exe) are launched without proper context, such as from suspicious user accounts or unexpected service execution.

  - **Review historical usage patterns:** Check previous registry access logs to establish a baseline for normal behavior. Legitimate RG Supervision activities should show consistent access by administrative accounts, correlated with maintenance windows.

  - **Identify additional telemetry indicators:** Search for associated configuration and detection artifacts, such as Event ID 7045 (service installation) or Event ID 5145 (file share access), that may indicate suspicious service configurations related to RG Supervision.

  - **Analyze potential persistence mechanisms:** Investigate modifications to the registry keys in HKLM\SYSTEM\CurrentControlSet\Services\RG-Supervision for any recent changes, looking for non-standard or unauthorized values that deviate from the expected configuration for legitimate users.

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical systems using RG System for remote management, where exploitation could allow adversaries to gain control. While not every case may indicate malicious activity, the use of RMM tools is increasingly weaponized in attack scenarios, indicating a need for careful scrutiny.

  ### Blind Spots and Assumptions

  This detection may miss obfuscated or altered registry keys due to malicious actors attempting to evade detection through application whitelisting. It requires proper logging configurations in Windows Security to ensure comprehensive coverage and may be triggered by legitimate administrative updates. A companion detection to consider is monitoring for unusual outbound network connections correlated with these registry modifications to strengthen investigative accuracy.

