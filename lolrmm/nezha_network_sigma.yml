note: |
  ### Technical Context

  This detection identifies potential network activity associated with the Nezha Remote Management and Monitoring (RMM) tool. Attackers often utilize Nezha for remote access to compromised systems, exfiltrating data, or executing commands remotely. This behavior fits primarily within the MITRE ATT&CK framework under the tactic of Execution (TA0002) and the technique Command and Control (T1219).

  The primary telemetry sources for this detection include Windows network connection logs that capture outbound connections. If this activity is malicious, it can lead to the compromise of sensitive data or unauthorized control over affected systems. Importantly, this detection does not on its own confirm that malicious activity is occurring; it only indicates potential use of the Nezha tool, which may also be employed legitimately.

  ### Investigation Steps

  - **Check outbound connections to known hosts:** Review network connection logs for Event ID 5156, focusing on connections to domains like ‘github.com’ or ‘nezhahq.github.io’. Correlate timestamps with alerts for faster identification of malicious patterns.

  - **Verify if the activity originates from known trusted hosts:** Assess the asset inventory for the host triggering the alert. Identify whether the host is a server or workstation and if it typically should be making connections to these domains.

  - **Identify the process initiating the connection:** Investigate logs for Process ID, concurrent Event ID 4688, and Sysmon Event ID 1 to determine which application initiated the connection. Unexpected processes could be a high-confidence malicious indicator.

  - **Search for legitimate usage patterns within the organization:** Distinguish regular activity that may involve legitimate use of tools like Nezha. Look for prior whitelisting of domains or established business functions that access the detected endpoints.

  - **Confirm persistence mechanisms:** Identify any new services or scheduled tasks that may have been created in relation to Nezha activity using Event ID 4697 (Service Installation). Look for abnormal startup entries indicating potential persistence.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on enterprise systems from unauthorized access. The likelihood of malicious usage of Nezha is significant, particularly if it emanates from non-administrative hosts or unknown locations. Given its specific nature, the usage of Nezha in adversarial contexts is known to be weaponized in various attacks.

  ### Blind Spots and Assumptions

  Detection relies heavily on the correct configuration of Windows network logging; if logging is not enabled, detection will be ineffective. Legitimate administrative tasks may conceivably trigger this alert, particularly in environments with approved use of RMM tools. A related detection to consider is tracking Windows process creations (Event ID 4688), which could confirm the legitimacy of processes attempting outbound connections, providing further context to the alert.

