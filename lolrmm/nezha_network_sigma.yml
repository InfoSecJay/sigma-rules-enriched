note: |
  ### Technical Context

  This rule detects potentially malicious network activity associated with the Nezha Remote Management Tool (RMM). The likely goal of an attacker leveraging Nezha is to gain unauthorized remote access to systems, often for purposes such as system monitoring, data exfiltration, or further lateral movement within a network. The relevant MITRE ATT&CK tactics include Command and Control (TA0011) and the technique Cloud Services (T1219).

  Primary telemetry sources include Windows network connection logs, specifically monitoring Event IDs indicating outbound connections (e.g., Event ID 5156 for Windows Filtering Platform). If identified as malicious, this behavior could lead to unauthorized access, data breaches, or compromise of sensitive systems. However, this detection does not confirm that the traffic is inherently malicious, as Nezha may also be used legitimately by authorized users for remote management.

  ### Investigation Steps

  - **Review outbound network connections:** Examine Windows Event ID 5156 logs for connections to the following hostnames: `user_managed`, `github.com`, `nezha.wiki`. Connections to these hosts by unauthorized users could indicate malicious activity.

  - **Analyze process creation events:** Check for associated process creation linked to these network activities, specifically looking at Security Event ID 4688 or Sysmon Event ID 1. Malicious processes often exhibit unusual parent-child relationships not present in legitimate use cases.

  - **Validate legitimate usage patterns:** Investigate the context of users and assets making these connections. Authorized IT personnel may legitimately access these sites for legitimate purposes, unlike anomalous user accounts within sensitive systems.

  - **Correlate with internal asset roles:** Assess the criticality of the affected systems. Connections from hosts that are typically designated for sensitive or executive use warrant higher scrutiny compared to non-critical assets.

  - **Gather evidence of data exfiltration:** Look for file creation or upload activities to unusual locations during the same timeframe. Sysmon Event ID 11 (File Creation) or monitoring outbound file transfer logs may provide insights into potential data theft.

  ### Prioritization

  This alert has medium severity, particularly if the affected system is critical to operations or contains sensitive data. There is a reasonable likelihood that malicious actors may exploit Nezha due to its remote management capabilities, making it a relevant target for adversaries. The behavior is weaponized by various threat actors in targeting environments lacking stringent access controls.

  ### Blind Spots and Assumptions

  The detection may be limited by the presence of legitimate Nezha usage in the environment, leading to false positives. Comprehensive logging configuration is necessary to ensure complete visibility of network connections, particularly for outbound traffic. Additionally, authorized software use, such as legitimate administrative activities, may trigger this alert. A companion detection involving suspicious internal lateral movement (e.g., monitoring against the technique T1075 - Pass the Hash) would strengthen overall coverage against potential threats.

