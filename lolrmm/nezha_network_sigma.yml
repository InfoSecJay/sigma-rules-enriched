note: |
  ### Technical Context

  This rule detects network connections targeting domains associated with the Nezha remote management tool (RMM). Nezha is often utilized by threat actors to establish command and control (C2) channels, facilitating remote access to compromised systems. The likely attacker objective is to maintain persistence on networks by using Nezha for remote administration tasks, data exfiltration, or lateral movement within a target environment. The relevant MITRE ATT&CK tactic is Command and Control (TA0011) and the technique is Remote Access Tools (T1219).

  The primary telemetry source comes from Windows network connection logs that capture outbound traffic to specified domains. A potential security impact includes unauthorized access to sensitive systems and data maliciously manipulated or exfiltrated. It’s essential to recognize that this detection does NOT confirm malicious activity on its own, as legitimate implementations of Nezha for IT administration may exist.

  ### Investigation Steps

  - **Verify network connections to suspicious domains**: Check for outbound connections to identified Nezha domains (e.g., `*.nezha.wiki` or `*.razkh.github.io`) using Event ID 5156 (Windows Filtering Platform) or equivalent network logs. Legitimate connections should not typically establish a high frequency of communications to these domains.

  - **Review recent process creation events**: Investigate associated process creation (Event ID 4688) around the time of detected network connections. Look for processes that have command line arguments hinting at Nezha usage (e.g., references to `Nezha.exe`).

  - **Analyze DNS query history**: Check DNS query logs for requests related to the Nezha domains or subdomains. Unusual spikes in queries to these domains could indicate scanning or reconnaissance activity.

  - **Inspect network traffic for unusual patterns**: Use packet capture analysis (e.g., wireshark or equivalent) to assess if the traffic is consistent with typical Nezha operations, such as data transfer volumes or unusual handshake protocols. Benign usage may show typical standard patterns compared to anomalous connections.

  - **Cross-reference with asset inventory**: Identify the role and criticality of assets generating these alerts. Check whether the systems are authorized to utilize remote management tools.

  - **Check for known indicators of compromise (IOCs)**: Reference existing threat intelligence sources for IOCs related to Nezha activity, and establish if these indicators are present in the session’s events, such as unusual remote access IPs or hashes.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems that could allow attackers to maintain a foothold within the network. The likelihood of malicious abuse is notable, given that Nezha is commonly associated with unwanted remote access. This behavior is often exploited in targeted attacks, making it significant for further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by false positives from legitimate Nezha usage by internal teams or contractors. It requires robust logging configurations, particularly for DNS queries and network monitoring, to ensure accurate detection. Legitimate remote desktop software may also trigger similar alerts. A related detection that strengthens coverage includes monitoring for process spawning events associated with known RMM tools or script executions involving PowerShell and unusual command-line parameters.

