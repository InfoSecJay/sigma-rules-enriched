note: |
  ### Technical Context

  This rule detects file activity associated with the Rodex Remote Monitoring and Management (RMM) tool by monitoring for specific executable filenames, including `RodexAgent.exe`, dynamically named executables in `C:\Windows\`, and executables matching the pattern of `<impersonated-org>Agent.exe`. The likely objective of an attacker using this tool would be to gain unauthorized remote access and control over compromised systems, which can facilitate further exploitation, data exfiltration, or lateral movement within the network. This detection correlates with the MITRE ATT&CK technique T1219 (Remote Access Software).

  The primary telemetry source is Windows file event logs that report file creation and modification activities. If malicious, the presence of these executables could indicate unauthorized management capabilities being deployed in the environment. It is crucial to note that this detection does NOT confirm malicious intent on its own; legitimate use of the Rodex RMM tool can occur in many environments, particularly if proper asset inventory and management policies are not enforced.

  ### Investigation Steps

  - **Verify process creation logs:** Review Security Event ID 4688 for process creation events involving `RodexAgent.exe` or related executables. Check the parent process ID to determine if it originated from a legitimate management console or another suspicious source.

  - **Correlate with file activity:** Analyze file event logs for any recent creation or modification of executables in `C:\Windows\` (Event ID 4663 - File Access is a good point). Compare timestamps against the execution of `RodexAgent.exe` to identify unusual patterns.

  - **Assess user account activity:** Check for unusual logon events (Security Event ID 4624) from accounts that should not have access to RMM tools, especially looking for accounts that show signs of impersonation or lateral movement.

  - **Examine system criticality:** Identify if the affected system is a critical infrastructure asset or a non-critical endpoint. Focus on high-value targets like servers hosting sensitive data or administrative workstations.

  - **Identify legitimate agents:** In environments where Rodex RMM is deployed legitimately, document expected behaviors and user accounts typically associated with these tools. Compare any detected activity against these identifiers to gauge legitimacy.

  - **Look for file exfiltration attempts:** Investigate if `RodexAgent.exe` interacts with external URLs or uploads files that could indicate data exfiltration (monitor outbound connections or API calls if applicable).

  ### Prioritization

  This alert has medium severity due to the potential impact on compromise of management tools used across the enterprise. While the likelihood of malicious use is moderate, it is essential to assess the context of the alert as Rodex RMM is a legitimate tool that may frequently be present in IT environments.

  ### Blind Spots and Assumptions

  This detection may be evaded by renaming malicious executables or using legitimate pathways for RMM deployment. Reliable detection requires comprehensive logging configurations, especially for sensitive directories and executable processes. Legitimate activities may also cause this alert, such as authorized IT maintenance tasks using similar filenames. A related detection for remote access software not only identifies tools used but also monitors for command-and-control traffic indicative of compromised remote access tools, strengthening overall security posture.

