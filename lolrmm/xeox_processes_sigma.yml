note: |
  ### Technical Context

  This detection rule identifies the execution of specific Xeox RMM (Remote Monitoring and Management) tool processes on Windows systems. The likely attacker objective is to maintain persistent access to the environment for unauthorized control or reconnaissance, aligning with lateral movement tactics. This corresponds to the MITRE ATT&CK tactic of "Command and Control" (TA0011) and the technique "Remote Management Tools" (T1219). The primary telemetry sources are Windows process creation logs that include Event ID 4688 and Sysmon Event ID 1. Malicious use of the Xeox RMM tool can lead to the unauthorized monitoring or manipulation of the system. Importantly, this detection does not confirm malicious activity on its own as Xeox may be used legitimately within the organization.

  ### Investigation Steps

  - **Review process creation details**: Check Security Event ID 4688 and Sysmon Event ID 1 for instances of "xeox-agent_x64.exe" or "xeox_service_windows.exe." Investigate the command line parameters for unusual arguments, as benign uses typically show standard configurations.

  - **Correlate user accounts**: Identify the user account associated with the process execution. Legitimate use often involves specific service accounts or privileged administrative accounts. Unrecognized accounts or unusual users executing Xeox processes may indicate malicious behavior.

  - **Analyze parent process**: Investigate the ParentImage field for instances of “\xeox-agent_x64.exe” or “\xeox_service_windows.exe.” A non-standard parent process (e.g., a common user application) may suggest malicious activity.

  - **Check for service registration**: Validate whether the Xeox service is registered (look for Service Control Manager Event IDs 7045 and 7036). Legitimate installations may show expected registration details, while anomalies suggest unauthorized deployments.

  - **Monitor network connections**: Review network traffic from the affected host for connections to known malicious IPs or domains associated with RMM tools. Look for unusual outbound connections (e.g., those not associated with Windows updates or legitimate management tasks).

  - **Inspect logs for process execution metrics**: Check the log for timestamps, such as Event ID 4688 time fields, and establish a timeline of activity. Rapid or unexpected execution of the Xeox RMM tool without prior activity may indicate an emerging threat.

  ### Prioritization

  This alert carries medium severity due to the potential impact of unauthorized system control and monitoring. The likelihood of abuse is plausible given the prevalence of RMM tools in real-world attacks, particularly in cases involving lateral movement and persistence mechanisms.

  ### Blind Spots and Assumptions

  Evasion techniques could include renaming Xeox processes or disguising them within legitimate software. Reliable detection requires comprehensive logging from Windows Event Logs and Sysmon, as lack of these could result in blind spots. Legitimate administrative actions or routine IT maintenance activities may trigger this alert; therefore, context is critical. Companion detections, such as monitoring for unusual network traffic linked to these processes, could enhance overall coverage against misuse.

