  ### Technical Context

  This Sigma rule detects potential process activity related to the Xeox Remote Monitoring and Management (RMM) tool, specifically processes launched or spawned by its binaries. The likely attacker objective is remote system access for management or exploitation purposes, utilizing the RMM tool as a delivery mechanism to execute malicious payloads. This behavior corresponds to the MITRE ATT&CK technique "System Services" (T1219).

  Primary telemetry sources include Windows event logs for process creation, specifically looking for Security Event ID 4688 or Sysmon Event ID 1 that capture detailed process creation events. If this activity is confirmed as malicious, it could lead to unauthorized access and control over critical systems, potentially leading to data breaches or system compromise. Importantly, this detection does NOT confirm malicious intent on its own, as some organizations may use Xeox legitimately.

  ---

  ### Investigation Steps

  - **Check process hierarchy:** Investigate parent processes of detected Xeox binaries using Security Event ID 4688 or Sysmon Event ID 1. Legitimate Xeox activity typically originates from an administrative console or similar trusted application.

  - **Identify execution context:** Review the `CommandLine` field in the event logs for parameters passed during the execution of Xeox processes. Malicious instances often include additional flags or unexpected arguments compared to legitimate usage.

  - **Evaluate system criticality:** Determine the roles of affected hosts. Systems with elevated privileges or sensitive data exposure should be prioritized for further investigation.

  - **Analyze execution frequency:** Check for the frequency of these Xeox-related processes across the environment. Repeated executions with minimal time gaps may suggest malicious automation rather than legitimate administrative tasks.

  - **Review access patterns:** Correlate the detected process creation with user account activity to determine if it aligns with known users or administrators authorized to utilize Xeox tools, identifying any anomalous access behavior.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity. The impact can be significant if an unauthorized entity exploits the RMM tool to gain control over critical infrastructure. Given the growing trend of malicious actors using RMM tools for attacks, the likelihood of exploitation is plausible, warranting careful investigation.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion tactics such as using different process names or manipulating process creation to appear benign. Reliable detection depends on proper logging configurations to capture the necessary event types. Legitimate IT administrative activities may trigger this alert whenever authorized personnel use the Xeox tool. For comprehensive coverage, consider companion detections targeting abnormal network traffic generated by RMM tools, which can further clarify potentially malicious use cases.

