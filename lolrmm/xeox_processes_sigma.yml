note: |
  ### Technical Context
  This detection rule identifies potential process activity related to the Xeox Remote Monitoring and Management (RMM) tool. The Xeox RMM tool is designed for IT management, allowing administrators to monitor and manage systems remotely. However, malicious actors may exploit legitimate RMM tools like Xeox to remotely access compromised systems, facilitate unauthorized operations, and exfiltrate sensitive data, all while maintaining stealth.

  The relevant MITRE ATT&CK tactics include **Execution (TA0002)**, which covers adversarial techniques to execute their payloads, particularly under the technique **Remote Services (T1219)**. These techniques demonstrate how attackers can utilize remote tools to control systems and execute commands without raising immediate alarms.

  The primary data source for this detection includes Windows process creation logs, which document whenever a process is initiated, including details about the parent process. This data is crucial in identifying unusual or unauthorized usage patterns associated with the Xeox RMM tool.

  ### Investigation Steps
  - **Identify Processes:** Review Windows process creation logs to identify instances of `xeox-agent_x64.exe`, `xeox_service_windows.exe`, or other Xeox-related executables starting, especially focusing on unusual parent processes.
  - **Analyze Parent Processes:** Investigate the parent processes of the detected Xeox RMM executables to discern their origin and whether they stem from legitimate administrative actions or potentially malicious activity.
  - **Check for Anomalous Behavior:** Look for signs of suspicious behavior related to the Xeox tool, such as unexpected remote connections, unusual network traffic patterns, or execution of commands not typically associated with legitimate administrative tasks.
  - **Correlate with User Activity:** Cross-reference the detected Xeox activity with user logs to ensure that the access aligns with legitimate administrative users and activities, noting any anomalies that may suggest compromised credentials or unauthorized access.

  ### Prioritization
  This alert has a medium severity level due to the potential for unauthorized remote access and control of systems, which can lead to significant data breaches and operational impact if exploited by malicious actors.

  ### Blind Spots and Assumptions
  This detection rule may not cover all instances of RMM tool usage, particularly if attackers rename or modify the executables to evade detection. The detection logic assumes that all instances of the Xeox executables are suspicious unless verified otherwise. For the alert to function correctly, comprehensive process creation logging must be enabled, and the organization should have a visibility strategy for known RMM tools in use to differentiate between legitimate and malicious activities.

