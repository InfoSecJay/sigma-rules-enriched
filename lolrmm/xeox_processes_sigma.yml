note: |
  ### Technical Context

  This Sigma rule detects potential process activity related to the Xeox Remote Monitoring and Management (RMM) tool, specifically focusing on processes initiated by its agents. The likely attacker objective could be unauthorized remote access or administration of systems, potentially leading to information theft or system manipulation. This behavior aligns with the MITRE ATT&CK technique "Remote Template Injection" (T1219).

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log process creation events. If malicious, the security impact could range from unauthorized access to sensitive data to full control of the affected system. It is important to note that this detection does NOT confirm whether the Xeox tool is being used maliciously, as it may also be used legitimately by IT administrators.

  ### Investigation Steps

  - **Check process creation events**: Review Security Event ID 4688 or Sysmon Event ID 1 for process creation related to `xeox-agent_x64.exe`, `xeox_service_windows.exe`, and similar process names. Document the user context and the parent process to establish the origin of the execution.

  - **Analyze parent process origins**: Verify the parent process of any detected Xeox processes. A legitimate context would involve administrative tools. Malicious indicators include unknown or unexpected parent processes that could suggest unauthorized usage.

  - **Inspect execution paths**: Validate the file paths for any detected Xeox processes. Legitimate installations typically reside in `C:\Program Files\Xeox\` or similar, while unexpected paths or modifications could indicate a compromised installation.

  - **Review network activity**: Use network monitoring logs to check outbound connections initiated by the Xeox processes. Look for anomalous network behavior such as connections to known malicious IP addresses or unexpected domains supporting the suspicion of nefarious intent.

  - **Contextualize asset roles**: Identify the criticality of the affected system. Unauthorized Xeox usage on high-privilege servers (e.g., domain controllers, databases) significantly increases the risk profile compared to less critical systems.

  ### Prioritization

  The alert has medium severity due to the potential impact of the RMM tool on sensitive systems. While Xeox is often legitimately used, its functionality could be weaponized by attackers to gain unauthorized access. The likelihood of malicious abuse increases with its deployment in high-value assets.

  ### Blind Spots and Assumptions

  Detection may be limited if Xeox processes have legitimate operational roles, leading to potential false positives. It assumes that all necessary logging is enabled for process creation events, which is critical for reliable detection. Legitimate activities might include system maintenance or updates initiated by IT personnel. A related detection would be monitoring for unauthorized process creation from known RMM tools to strengthen coverage of potential abuse patterns.

