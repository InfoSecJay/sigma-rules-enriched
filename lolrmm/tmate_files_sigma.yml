note: |
  ### Technical Context

  This rule detects the creation or modification of files associated with the tmate remote management tool, which can be leveraged by attackers for reverse shell access or persistent command-and-control communication. The likely attacker objective is to establish a foothold and maintain communication with compromised hosts for remote administration or data exfiltration. The relevant MITRE ATT&CK tactics and techniques include Command and Control (TA0011) and Remote Services (T1219).

  Primary telemetry sources are Windows file event logs that capture file activity (Event ID 4663) related to specific target filenames. If malicious, the security impact includes unauthorized access to systems and potential data breaches. This detection does NOT confirm that an intrusion has occurred on its own, as legitimate use of tmate may trigger the same alert.

  ### Investigation Steps

  - **Identify the file creation events**: Review Windows Security Event ID 4663 for alterations involving the following filenames: `/tmp/tmate*`, `~/.tmate.conf`, `tmate.sock`, `tmate-ready`, `tmate.bashrc`. Pay close attention to unusual creation or write patterns.

  - **Check for remote connections**: Analyze network logs (firewall, proxy, or IDS) for any outbound connections to known command-and-control infrastructures during the time of the file activity, especially connections from tmate processes.

  - **Correlate with process creation**: Cross-reference with Sysmon Event ID 1 to identify processes that interact with the detected files. Look for unusual parent-child process relationships, especially if initiated by non-administrative accounts.

  - **Establish baseline behavior**: Gather historical data on software tools used within your environment. Document expected uses of tmate by legitimate personnel to help discern normal operational behavior from potential intrusions.

  - **Identify high-confidence malicious indicators**: Look for anomalous execution patterns of tmate that derive from unexpected user accounts, or any attempts to obfuscate its activity, such as unusual command structures or paths.

  ### Prioritization

  This alert is of medium severity due to the potential impact if tmate is used maliciously, particularly on sensitive systems. The likelihood of abuse remains moderate since tmate is legitimate software, but it can be weaponized by threat actors for covert operations.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate administrative users may trigger this alert if they use tmate appropriately. Required log sources include comprehensive file logging for Windows environments, and without proper configuration, detection may fail. Common legitimate activities that could trigger the alert include remote support or troubleshooting sessions by IT personnel. Related detections such as unusual outbound network connections or use of other remote tools would significantly strengthen coverage against abuse.

