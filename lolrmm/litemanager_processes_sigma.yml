note: |
  ### Technical Context
  This detection rule is designed to identify processes associated with the LiteManager Remote Management (RMM) tool. LiteManager is often used for remote control of systems, allowing an attacker to access systems without physical presence. The detection logic looks for specific processes spawned by known LiteManager executables, indicating potential unauthorized remote access or management activity within the enterprise's Windows environment.

  The threat scenario includes attackers leveraging the LiteManager RMM tool to gain unauthorized access to systems, either for reconnaissance, data exfiltration, or lateral movement within the network. Common attacker objectives include compromising sensitive information, maintaining long-term access, or deploying additional malware.

  Relevant MITRE ATT&CK tactics associated with this activity include:
  - Execution (TA0002) - the act of running code in the victim environment.
  - Remote Services (T1219) - utilizing remote management tools to interact with target systems.

  Primary data sources for this detection rule include process creation events from Windows systems, which provide the necessary context to identify unauthorized process executions related to LiteManager.

  ### Investigation Steps
  - **Review Process Details**: Look at the details of the processes being executed, particularly their command-line arguments and the parent processes that spawned them.

  - **Examine Parent Process Execution**: Investigate the parent processes (e.g., lmnoipserver.exe, ROMFUSClient.exe) to identify whether they were legitimately initiated or potentially spawned by an unauthorized user or script.

  - **Correlate with User Activities**: Cross-reference the identified LiteManager process activity with user login events and access logs to determine if the execution aligns with expected user behavior or if it suggests unauthorized access.

  - **Collect Network Activity Logs**: Analyze network connection logs to detect any external communications initiated by the identified LiteManager processes, focusing on unusual IP addresses or geographic locations.

  ### Prioritization
  This alert is considered medium in severity because, while the use of LiteManager can be legitimate, its presence may indicate unauthorized access or management control over critical systems, which could lead to significant impacts if exploited maliciously.

  ### Blind Spots and Assumptions
  The detection logic may not capture all instances of unauthorized Remote Management activities if attackers rename the executable files or if they utilize alternate remote access tools not covered by this detection. Additionally, this rule assumes that all instances of LiteManager are unauthorized, which may not account for legitimate administrative access. For effective operation, logging configurations for process creation must be enabled on target systems to capture and analyze the events accurately.

