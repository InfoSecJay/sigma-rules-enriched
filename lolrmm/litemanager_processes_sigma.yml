note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the LiteManager remote management tool, which can be used for legitimate remote support but could also indicate unauthorized remote access. The primary objective of attackers utilizing LiteManager would likely be to establish stealthy remote control of a compromised system. This behavior is associated with the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry sources required for this detection are Windows process creation events, specifically Security Event ID 4688 or Sysmon Event ID 1. If malicious, this activity could allow an adversary to manipulate systems or exfiltrate data stealthily. Importantly, this detection does NOT confirm malicious activity on its own, as LiteManager may be used for legitimate administration purposes.

  ### Investigation Steps

  - **Identify recent process creation events:**
    Review Windows Security Event ID 4688 or Sysmon Event ID 1 for processes like "lmnoipserver.exe" or "ROMFUSClient.exe" launched recently. Compare timestamps against other security events.

  - **Verify process parent-child relationships:**
    Check the parent process of detected LiteManager binaries in the process tree. Legitimate usage typically shows administrative tools or services as parent processes, while suspicious execution may originate from unusual or user-initiated processes.

  - **Correlate with user activity logs:**
    Analyze user logons from Windows Security Event ID 4624. Match timestamps of detected LiteManager process execution to confirm if a known user account performed the action or if there are indications of account compromise.

  - **Examine network connections:**
    Look for outbound connections from detected LiteManager processes by reviewing Windows Firewall logs (Traffic Event IDs) or Sysmon Network Connection events. Malicious indicators include connections to known malicious IPs or unusual external endpoints.

  - **Analyze installation artifacts:**
    Investigate for any recent installation or scripts that may have deployed LiteManager, focusing on file paths and creation timestamps. Legitimate installations should have clear documentation and change logs.

  ### Prioritization

  The alert severity is medium due to the impact potential of LiteManager on endpoints, particularly if deployed without proper authorization. While the likelihood of malicious abuse is moderate, LiteManager is often weaponized for unauthorized access, necessitating prompt investigation to verify legitimate usage.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of LiteManager in the environment, which could trigger false positives if not properly contextualized. Organizations should ensure reliable logging of process creation events and consider that sysadmins may employ such tools for remote support. A related detection for broader coverage would be monitoring for other remote access tools like TeamViewer or AnyDesk to identify potentially aggregated remote access tactics.

