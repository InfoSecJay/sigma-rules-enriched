note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the LiteManager Remote Management Tool (RMM). Attackers may utilize this tool to gain unauthorized access to and control over systems, facilitating data exfiltration or lateral movement across a network. The relevant MITRE ATT&CK tactic is Command and Control (T1071) with techniques T1219 (Remote Access Software).

  Primary telemetry sources include Windows process creation events, specifically Event ID 4688 (Process Creation) and potentially Sysmon Event ID 1. If malicious, the security impact can be significant, as LiteManager may enable external adversaries to manipulate system processes or access sensitive data. This detection does NOT confirm that the activity is malicious on its own; legitimate use cases for LiteManager exist, which require further investigation.

  ### Investigation Steps

  - **Review process creation events:** Check for Event ID 4688 in Windows Security logs where the Image field matches `\lmnoipserver.exe`, `\ROMFUSClient.exe`, `\romviewer.exe`, or `\romserver.exe`. Look for unusual process parents or command-line arguments indicating suspicious usage.

  - **Investigate parent-child relationships:** Analyze the ParentImage field in Event ID 4688 to determine the context of the LiteManager processes. A legitimate parent process (e.g., powershell.exe, explorer.exe) may indicate normal usage, while an unexpected parent could suggest malicious activity.

  - **Correlate with Sysmon data:** If Sysmon is deployed, verify Sysmon Event ID 1 for the same processes. Check for command-line arguments associated with known exploitation techniques, noting any suspicious modifications to parameters.

  - **Identify unauthorized modifications:** Examine the file creation timestamps and paths of the LiteManager executables. Valid installations usually reside in typical program directories (e.g., `C:\Program Files\LiteManager\`). Look for executables in unusual locations.

  - **Assess for additional C2 indicators:** Query network logs for known LiteManager command-and-control communication patterns. This may include IP addresses or domain names associated with such tools, recognizing them as potential indicators of compromise.

  ### Prioritization

  Given the impact of compromised systems in an enterprise environment and the potential for widespread unauthorized access, the severity of this alert is medium. Although LiteManager can be used legitimately, the risk of exploitation for malicious purposes makes this a concerning alert warranting prompt investigation.

  ### Blind Spots and Assumptions

  Evasion techniques include utilizing alternative remote access tools that mimic LiteManager's behavior or executing LiteManager in a way that circumvents detection. Reliable detection depends on having both Windows Security logs and Sysmon configured appropriately. Legitimate administrative activities may trigger this alert; therefore, context is crucial. Companion detections could include monitoring for unusual outbound network traffic that correlates with the behavior identified by this rule, enhancing threat detection coverage.

