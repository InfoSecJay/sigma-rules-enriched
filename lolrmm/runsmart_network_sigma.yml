  ### Technical Context

  This Sigma rule detects network connections to the domain "runsmart.io", which is associated with the RunSmart Remote Monitoring and Management (RMM) tool. The typical attacker objective may involve exfiltrating data, managing compromised systems, or deploying additional malicious tools through RMM platforms. This behavior aligns with the MITRE ATT&CK tactic of Execution and the technique T1219 (Remote Access Tools).

  The primary telemetry source is Windows network connection logs that contain DestinationHostname fields. If malicious, this activity may indicate an adversary leveraging RMM tools to maintain persistence or control over systems. However, this detection does NOT confirm whether the traffic is authorized or if it is explicitly malicious on its own, since legitimate administrative use of the RunSmart application may also trigger this alert.

  ---

  ### Investigation Steps

  - **Review network connections for anomalies:** Examine connections logged to DestinationHostname for "runsmart.io" using Security Event ID 5156 (Windows Filtering Platform) to distinguish between benign sessions and potential adversarial connections.

  - **Check for authorization of RMM tool usage:** Verify whether the detected connection is part of legitimate administrative practices by consulting internal documentation or asset management tools that list approved software.

  - **Cross-reference user activity:** Investigate which user account initiated the connection by checking Security Event ID 4624 (Logon) and compare with user privileges. Malicious logins from non-admin users for RMM activity could indicate compromise.

  - **Examine process creation linked to connections:** Review for parent processes that established the network connection using Sysmon Event ID 1 to determine if known administrative tools initiated the connection or if there are unknown processes.

  - **Collect evidence of data transfer:** Check for file creation or modifications potentially linked to the RMM service using Sysmon Event ID 11 (File Creation) or Event ID 10 (File Creation, Creation time) to see if there was unauthorized data exfiltration right after the connection to the RMM server.

  - **Investigate historical context of the host:** Assess the asset’s previous network activities and connections to investigate if there’s a pattern of connections to RMM services, noting legitimate operational periods to filter out noise.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact on administrative networks and systems tied to remote management. The likelihood of malicious use is significant, as RMM tools are commonly weaponized by attackers to gain control over compromised systems. Failure to investigate can lead to lateral movement or data loss.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of legitimate users who utilize the RunSmart RMM tool for administration, potentially leading to false positives. It assumes that network connection logs are comprehensive and that RMM tool usage is well documented within the enterprise. Related detections, such as looking for unauthorized process creation (Sysmon Event ID 1) following the connection, can enhance overall coverage against misuse of RMM tools.

