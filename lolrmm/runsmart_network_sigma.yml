note: |
  ### Technical Context

  This Sigma rule detects network connections to RunSmart RMM (Remote Monitoring and Management) domains, suggesting suspicious remote access activity potentially tied to an attacker’s command-and-control (C2) infrastructure. The likely objective is unauthorized remote management or reconnaissance of networked systems, which may facilitate further exploitation or data exfiltration. Relevant MITRE ATT&CK techniques include Command and Control (T1071) and Application Layer Protocol (T1219).

  The primary telemetry source for this detection is Windows network connection logs, specifically looking for connections to hostnames affiliated with RunSmart RMM. If malicious, it signifies a compromise where an attacker could gain persistent access or control over affected systems. It is important to note that the presence of logs indicating connections to these domains does NOT automatically confirm malicious intent, as legitimate usage of RunSmart may occur.

  ### Investigation Steps

  - **Verify outbound connections to RunSmart domains:** Check Security Event ID 5156 on Windows hosts for allowed network connections aiming at `*.runsmart.io`. Note the source and destination IP addresses to discern whether they are expected.

  - **Identify relevant processes initiating connections:** Review Process Creation logs (Security Event ID 4688 or Sysmon Event ID 1) for any suspicious processes linked to the outbound connections detected to RunSmart domains. Look for non-standard services starting with unusual parent processes.

  - **Assess the asset's role in the environment:** Determine if the host initiating the connection is deemed critical for business operations or if it typically interacts with remote management tools. Examples include servers or workstations managed by an IT team versus an isolated PC.

  - **Investigate user activities around connection times:** Correlate user activity logs to see if the connections to RunSmart domains align with expected administrative functions during maintenance or upgrades. Check for user accounts that should have legitimate access to RunSmart.

  - **Review firewall and proxy logs for additional indicators:** Examine firewall logs for any additional outbound traffic to suspected IP addresses corresponding to RunSmart infrastructure. Look for unusual or unexpected temporal patterns or traffic volume.

  - **Search for indicators of compromise (IoC):** Validate the creation of any unauthorized files or services related to RunSmart tool usage on the affected hosts. Check for known malicious hashes that could correlate with deployment scenarios seen in previous incidents.

  ### Prioritization

  Given that this behavior indicates potential remote management activity, the severity is rated medium. The impacted systems could be critical to operations, and the likelihood of malicious abuse is moderate, especially if RunSmart RMM is not employed in the environment or if it’s seen in unusual contexts. Similar behaviors may be weaponized in targeted attacks, warranting prompt investigation.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers employ DNS tunneling or encrypted protocols that bypass traditional detection measures. Logs from Windows Firewall and any intrusion detection/prevention systems must be properly configured to ensure comprehensive monitoring. Legitimate administrative use of remote management tools like RunSmart could also accidentally trigger this alert, emphasizing the importance of contextual investigation. Related detections include monitoring for commands sent through recognized remote management protocols, which can enhance the overall detection capability.

