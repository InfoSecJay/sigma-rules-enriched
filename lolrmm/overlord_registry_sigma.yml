note: |
  ### Technical Context

  This Sigma rule detects potential registry activity associated with the Overlord Remote Monitoring and Management (RMM) tool. Attackers may utilize this tool to maintain persistent access and control over compromised systems, enabling them to manage endpoints covertly. This activity relates to the MITRE ATT&CK technique of Remote Access Software (T1219). The primary telemetry source involves Windows registry event logs, specifically changes to the Run key under the current user's context. If malicious, the security impact includes unauthorized remote system management, leading to data exfiltration, lateral movement, or further attacks.

  However, this detection does NOT confirm malicious use on its own; the presence of Overlord RMM entries in the registry can also arise from legitimate use within an organization.

  ### Investigation Steps

  - **Check registry entries for OverlordAgent:**
    Examine the registry path `HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\` for any values starting with `OverlordAgent-*`. Legitimate behavior may include recognized internal tools or enterprise RMM solutions.

  - **Correlate with user activity:**
    Review Security Event ID 4624 (Logon) to determine if the login associated with the registry change is legitimate. Look for consistent login patterns and times that align with expected user behavior.

  - **Analyze running processes:**
    Confirm if the OverlordAgent processes are running by reviewing Sysmon Event ID 1 for process creation. Malicious instances may exhibit unusual parent-child process relationships or invoke shell commands that deviate from normal operations.

  - **Identify uncommon persistence methods:**
    Investigate for other unusual persistence techniques, such as entries in `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run` or task scheduler entries. Legitimate applications will generally use common and documented keys.

  - **Check communication patterns:**
    If possible, review network logs for connections to known Overlord command and control (C2) infrastructure. Look for external connections on non-standard ports that could indicate malicious activity.

  - **Assess asset criticality:**
    Determine the role of the affected host within the network (e.g., server, workstation) and evaluate the potential impact of a compromise. Higher risk systems warrant immediate escalation.

  ### Prioritization

  This alert has medium severity due to the potential for the Overlord RMM tool to facilitate unauthorized access, impacting sensitive systems. The likelihood of abuse is moderate, particularly in environments where the tool is not explicitly authorized or documented. Given that remote access tools are commonly weaponized, prompt analysis is warranted.

  ### Blind Spots and Assumptions

  Detection may miss the usage of modified or obscured registry keys that evade standard monitoring. It requires that Windows registry auditing is properly configured to ensure comprehensive visibility. Legitimate administrative actions or authorized remote access tools may trigger the alert, necessitating context-based analysis. Related detections for unauthorized remote access (e.g., TeamViewer or AnyDesk usage) would strengthen the overall coverage against remote tool abuse.

