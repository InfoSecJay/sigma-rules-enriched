note: |
  ### Technical Context

  This rule detects network connections originating from systems attempting to communicate with the RG System (RG Supervision) remote monitoring and management (RMM) tool. The likely objective of an attacker using this tool would be to establish command-and-control communication to manage compromised endpoints covertly. This activity is associated with the MITRE ATT&CK technique "Remote Access Software" (T1219).

  The primary telemetry source includes Windows network connection logs that capture destination hostnames relating to RG Supervision's domain. If malicious, this behavior can facilitate unauthorized access to and control over infrastructure, potentially leading to data exfiltration or further network compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative use of the RG Supervision tool can trigger similar alerts.

  ### Investigation Steps

  - **Review connection logs for RG Supervision domains**: Analyze network connection logs for Event ID 5156 or equivalent to identify any connections made to domains like `*.lisa.rg-supervision.com` and `*.api.rg-supervision.com`. Look for unusual timestamps or high-frequency connections indicative of unauthorized access.

  - **Correlate activity with known asset roles**: Identify the asset's role (e.g., administrative workstation vs. user workstation). Legitimate administrative connections to RG Supervision might occur during scheduled maintenance, typically at known intervals. Check for documented maintenance windows or approved remote management authorization.

  - **Examine process creation events**: Look at Security Event ID 4688 and/or Sysmon Event ID 1 for process creation linked to the RG Supervision binaries or scripts that would initiate the connection to the remote server. Focus on processes executed by accounts that are not typically associated with RG System administration.

  - **Identify anomalies in user behavior**: Cross-reference the identity of the user initiating the connection against previous behavior. A sudden spike in connections from a non-administrative user or attempts from unusual geographic locations may indicate credential compromise or misuse.

  - **Search for file creation or modification artifacts**: Look for new files or modifications in directories typically associated with RG System tools (for example, under `%ProgramFiles%` or `%APPDATA%`). This may indicate installation or configuration changes related to the remote management tool that lack proper authorization.

  ### Prioritization

  This alert is designated as medium severity due to the potential impact on critical infrastructure if malicious activity is confirmed. The likelihood of malicious abuse is moderate, as the RG Supervision tool is commonly used for legitimate purposes but can be leveraged for unauthorized access. This behavior is increasingly weaponized in attacks targeting remote management tools to maintain control over infiltrated networks.

  ### Blind Spots and Assumptions

  This detection may miss RMM tool usage that occurs over non-standard ports or uses DNS tunneling for covert communication. Reliable detection necessitates logging for all outbound connections and comprehensive monitoring of endpoints using RG Supervision. Legitimate instances, such as routine updates or maintenance, may also trigger this alert. A related detection for "Unusual network traffic to known remote administration tools" can enhance visibility into potentially malicious behavior associated with remote management services.

