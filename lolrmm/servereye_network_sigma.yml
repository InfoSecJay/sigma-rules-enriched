note: |
  ### Technical Context

  This Sigma rule detects network connections to domains associated with the ServerEye RMM tool, which can be used for remote monitoring and management of systems. The likely attacker objective is to establish command-and-control (C2) communication by leveraging managed services or legitimate tools to evade detection. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), with the associated technique being **Application Layer Protocol** (T1219). The primary telemetry source is Windows network connection logs, specifically targeting connections to any hostname ending with `*.server-eye.de`. If exploited, this detection can indicate a breach and unauthorized access to systems, posing a significant risk to enterprise security. However, this detection does NOT confirm malicious activity without further investigation into the context of the connection.

  ### Investigation Steps

  - **Verify connection details: **: Check Windows network connection logs (Event ID 5156) for the source IP and port to the destination hostname (`*.server-eye.de`). Determine if the traffic is unexpected for the involved host roles.

  - **Analyze running processes: **: Use Sysmon Event ID 1 to list processes running at the time of connection. Identify if any unauthorized or atypical applications (e.g., not previously documented) initiated the network call to ServerEye.

  - **Check for proxies and firewall logs: **: Review firewall (Event ID 5158) or proxy logs for any filtering or blocking actions related to ServerEye domain traffic. Benign activity may show regular traffic patterns consistent with expected management tools.

  - **Inspect system for previous alerts: **: Query the SIEM for prior alerts related to the involved asset or IP address to establish if there is a pattern of suspicious behavior indicating potential misuse.

  - **Evaluate user activity logs: **: Investigate user activity logs (Event ID 4672) for account usage near the time of the network connection. Legitimate activity might come from administrative accounts performing authorized tasks.

  - **Cross-reference with threat intelligence: **: Look for current threat intelligence feeds that list any blockers or malicious actors using the ServerEye tool for nefarious purposes, comparing with your organization's access lists.

  ### Prioritization

  The severity of this alert is medium due to the potential exposure of critical systems utilizing a remote management tool. While not inherently malicious, the use of ServerEye RMM can be weaponized by adversaries for unauthorized access to sensitive assets, making all observed instances warrant thorough investigation.

  ### Blind Spots and Assumptions

  This detection may miss instances of ServerEye being proxied or obscured via tunneling techniques. Ensuring consistent logging for all outgoing network connections is crucial for reliable detection. Legitimate system administrators may trigger this rule during authorized management tasks, such as remote maintenance or updates. A related detection would include monitoring for unusual processes initiating connections to known C2 domains, enhancing coverage against misuse of legitimate tools.

