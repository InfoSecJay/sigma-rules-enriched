  ---

  ### Technical Context

  This rule detects network activity directed towards the ServerEye Remote Management and Monitoring (RMM) service via hostnames ending in `.server-eye.de`. Such behavior could indicate an attacker using legitimate RMM tools to maintain control over compromised systems or to deploy additional payloads. The relevant MITRE ATT&CK tactic is **Execution**, specifically technique **T1219: Remote Access Software**.

  The primary telemetry source is network connection logs, specifically monitoring outbound connections. If this behavior is malicious, it can result in unauthorized access, data exfiltration, or system compromise. It is critical to understand that this detection does NOT inherently confirm malicious intent; legitimate use of ServerEye for valid administrative purposes can trigger this alert.

  ---

  ### Investigation Steps

  - **Review outbound connection logs:** Check for Event ID 5156 (Windows Filtering Platform) or Sysmon Event ID 3 logs that show connections to `.server-eye.de`. Look for the process initiating the connection and validate its legitimacy.

  - **Identify associated process behavior:** Investigate the parent process of the connection. Typically, legitimate ServerEye activity would involve known processes like `ServerEye.exe` running under expected user contexts. Look for any unusual parent processes indicating possible malicious behavior.

  - **Check for historical usage:** Analyze historical network activity to determine if the endpoint in question has regularly accessed ServerEye in the past. Review logs for repetitive connections over recent weeks for baselines, focusing on timestamps and frequency.

  - **Inspect for user accounts involved:** Validate the user accounts associated with the processes making outbound connections. If connections are executed from non-administrative accounts or those typically having no legitimate access to RMM tools, this could indicate malicious use.

  - **Correlate with additional telemetry:** Cross-reference with security events related to account logins (e.g., Event ID 4624) and look for unusual foreign IP addresses or anomalous authentication attempts that coincide with the network activity detected.

  ---

  ### Prioritization

  The alert is assigned a medium severity due to the impact it could have on compromised systems potentially allowing for unauthorized control and data manipulation. The likelihood of malicious abuse is moderate, as adversaries commonly leverage RMM tools for illegitimate purposes.

  ---

  ### Blind Spots and Assumptions

  Detection may miss scenarios where adversaries utilize VPNs or proxies to obfuscate their traffic, making it difficult to correlate with server-eye domains. Reliable detection requires specific network logging configurations to capture all outbound connections effectively. Legitimate administrative activities, such as valid interactions with ServerEye by IT personnel, could trigger this alert. Consider companion detections for abnormal administrative activity or lateral movement to enhance coverage.

