note: |
  ### Technical Context

  This rule detects file activity related to the Nezha RMM tool, specifically monitoring access to key files such as 'nezha-agent.exe' and 'config.yml'. The likely attacker objective is to establish remote access and control over a compromised system as part of a Command and Control (C2) operation. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique T1219 (Remote Access Software).

  Primary telemetry sources include Windows file event logs concerning activity specifically at 'C:\nezha\nezha-agent.exe' and 'C:\nezha\config.yml'. If malicious, such activity could allow an attacker to maintain persistence and execute further malicious commands remotely. It is important to note that this detection does NOT confirm that an attack is occurring; benign usage of Nezha for legitimate purposes can trigger this rule.

  ### Investigation Steps

  - **Verify the context of the file access:** Check for the timestamps and user accounts associated with access to 'C:\nezha\nezha-agent.exe' and 'C:\nezha\config.yml' in Windows Security Event ID 4663 (Object Access). Legitimate activity may show routine access in a predefined maintenance window by a specific administrative user.

  - **Identify unusual user behavior:** Investigate user accounts that accessed the Nezha files through Windows Security Event ID 4624 (Logon). Look for accounts that do not normally have access, or access outside of business hours, to identify potential unauthorized usage.

  - **Examine the process execution:** Review Sysmon Event ID 1 (Process Creation) for any instances where 'nezha-agent.exe' has been executed. Check command-line arguments for suspicious parameters that could indicate malicious activity.

  - **Correlate system configuration changes:** Look into Windows Event ID 5145 (File Share Access) and review related logs for any changes made to file permissions or shares associated with the Nezha files. Malicious actors might alter these settings to maintain access.

  - **Check for persistence mechanisms:** Investigate Windows Event ID 4698 (Scheduled Task Created) for any newly created scheduled tasks that involve the Nezha files, which may indicate efforts to establish persistence.

  ### Prioritization

  This alert has medium severity due to potential impacts on critical systems if compromised, especially if administrative privileges are leveraged. Given the functionality of Nezha as a remote management tool, malicious abuse is plausible, and this software is increasingly weaponized in cyber attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate usage of Nezha for remote support, which could lead to false positives. Required log sources include accurate logging configurations for access permissions and security events. Legitimate IT operations may trigger the alert if Nezha is used for authorized administrative tasks. A companion detection could be monitoring for atypical outbound traffic patterns to correlate with the presence of Nezha activity.

