note: |
  ### Technical Context

  This detection identifies file activities associated with the Nezha Remote Monitoring and Management (RMM) tool, including executable files and configuration files. The likely attacker objective is to use the Nezha tool for remote access and control over compromised systems, often for the purposes of data exfiltration or lateral movement within a network. The relevant MITRE ATT&CK techniques include "Command and Control" (T1071) and "Application Layer Protocol" (T1219).

  The primary telemetry sources for this detection are Windows file event logs, specifically monitoring the creation or modification of target file paths associated with Nezha. If the files are malicious, compromised systems can serve as launch points for further attacks or data theft. However, this detection does NOT confirm that the activity is malicious on its own, as Nezha might be legitimately used for remote management by authorized IT personnel.

  ### Investigation Steps

  - **Verify file creation events**: Check for Windows Event ID 4663 to confirm file creation or modification for 'C:\nezha\nezha-agent.exe' and 'C:\nezha\config.yml'. Look for suspicious parent process IDs that may indicate malicious origin.

  - **Review system process activity**: Investigate Sysmon Event ID 1 to assess whether 'nezha-agent.exe' is running. Cross-reference the process creation with timestamps of potential compromise or domain access.

  - **Examine configuration files**: For 'C:\nezha\config.yml' and '/etc/systemd/system/nezha-agent.service', review the file's content to identify any unauthorized settings or remote connections to unrecognized IP addresses.

  - **Identify legitimate usage patterns**: Confirm whether Nezha has been authorized software within your environment by checking asset inventories. If so, document the corresponding IT personnel responsible for its management.

  - **Investigate potential data exfiltration**: Look for network activity associated with 'nezha-agent.exe' in firewall logs, checking for outbound connections to unusual or unapproved IP addresses.

  ### Prioritization

  The alert should be treated as medium severity given the potential risk associated with RMM tools like Nezha. If misused, these tools can enable an adversary to gain significant control over affected systems. The behavior is not commonly observed in typical enterprise activity, increasing its likelihood of being malicious.

  ### Blind Spots and Assumptions

  This detection may miss instances where the Nezha tool is used from non-standard locations or with renamed executables, which can evade detection. Reliable detection relies on comprehensive logging configurations that capture file events and system activity. Legitimate administrative actions for system management may trigger this alert, such as when authorized personnel deploy Nezha for maintenance. Companion detections such as unauthorized remote session creation (Event ID 4624 with specific logon types) can enhance mitigation of potential threats.

