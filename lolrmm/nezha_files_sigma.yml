note: |
  ### Technical Context

  This Sigma rule detects file activity related to the Nezha Remote Management Tool by monitoring specific file paths associated with its installation and configuration. Adversaries utilizing Nezha aim to establish remote access and control over compromised systems, typically for data exfiltration, reconnaissance, or lateral movement. The relevant MITRE ATT&CK tactic is Execution, with the technique being T1219 (Script Execution).

  The primary telemetry source consists of Windows file event logs, specifically focusing on file creation, modification, or deletion events involving Nezha-related files. If found malicious, the presence of these files could indicate active remote access or management by an unauthorized user. However, this detection alone does not confirm that the activity is malicious, as Nezha may also be legitimately used for system maintenance or monitoring.

  ### Investigation Steps

  - **Validate the File Path**: Check for file creation or modification events for `C:\nezha\nezha-agent.exe` using Windows Security Event ID 4663. Confirm the file's timestamp and user context to distinguish between legitimate administration versus potential misuse.

  - **Check for Remote Activity**: Review network logs for outgoing connections to unusual or unauthorized IP addresses that may correlate with Nezha's activity. Known malicious indicators include connections to known command and control (C2) servers.

  - **Review System Service Configuration**: Investigate the presence of the service file located at `/etc/systemd/system/nezha-agent.service` or similar on Linux systems. Verify its startup configuration and assess whether it was added by an authorized administrator.

  - **Correlate with User Context**: Examine who created or modified the Nezha-related files, focusing on the `SubjectUserName` in Event ID 4663. If the user does not match routine administrative accounts, this raises suspicion.

  - **Identify Legitimate Use Cases**: Be aware that authorized IT staff may utilize Nezha for system monitoring; legitimate behavior often includes regular updates and limited network communication to internal addresses only.

  - **Cross-reference with Active Alerts**: Look at other detected behaviors linked to known remote access tools within your environment, such as unusual process executions or unexpected account logins (e.g., analyzing Event ID 4688 for suspicious process creation).

  ### Prioritization

  This alert has medium severity due to the potential impact on the affected systems, especially if they contain sensitive data. The likelihood of adversaries leveraging Nezha for malicious purposes is moderate, as the tool is increasingly used in both legitimate and nefarious contexts. However, it is less commonly weaponized compared to more established remote access tools.

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations do not capture file changes adequately. Adversaries may implement techniques to obfuscate their presence, such as mimicking legitimate administrative behaviors or modifying timestamps on Nezha-related files. Legitimate activities might trigger this alert if authorized personnel use Nezha for system management. A companion detection to consider is monitoring for associated process execution related to Nezha's agent, such as unusual script executions (T1219), to strengthen coverage.

