note: |
  ### Technical Context

  This rule detects network connections to Duet Display RMM tool domains, which may indicate unauthorized remote management activity. Attackers may leverage remote management tools like Duet Display to establish command and control (C2) channels or access compromised systems for data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1071.001).

  The primary telemetry sources for this detection are Windows network connection logs, specifically focusing on outbound connections to specified domains associated with Duet Display. If these connections are malicious, they may allow attackers to manipulate endpoints undetected, potentially leading to significant data breaches or operational disruptions. Importantly, this detection does NOT confirm that the activity is malicious without additional contextual evidence.

  ### Investigation Steps

  - **Verify network connections to suspicious domains:** Review network connection logs (Event ID 5156) for outbound connections to `*.duetdisplay.com` or `*.itagent.com`. Focus on timestamps and user accounts associated with these connections.

  - **Check for legitimate use cases:** Identify if the endpoints in question normally use Duet Display for remote work or display. Cross-reference with asset inventory and remote access logs to verify expected behavior.

  - **Analyze process creation logs:** Examine Security Event ID 4688 for processes spawned around the time of the connection. Look for instances of `duetdisplay.exe` or other related executables that may indicate the tool is actively being utilized.

  - **Investigate user accounts:** Assess user behavior by reviewing authentication logs (Event ID 4624) for any unusual access patterns or failed login attempts correlating with the network activity, especially from non-administrative accounts.

  - **Cross-reference with threat intelligence:** Check against known threat intelligence databases to verify if the observed behavior correlates with identified adversary tactics or indicators of compromise that utilize Duet Display for malicious activities.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of unauthorized access on critical systems. The likelihood of malicious abuse is moderate as remote access can be weaponized for further exploitation. However, this behavior is often used legitimately, so context is crucial for accurate assessment.

  ### Blind Spots and Assumptions

  The primary limitation of this detection is the potential for evasion through legitimate usage of Duet Display. Accurate and comprehensive logging of outbound network connections is required for reliable detection. Additionally, the alert may trigger during normal business operations for users who legitimately utilize remote display tools, which should be accounted for in analysis. A companion detection rule for monitoring remote desktop protocol (RDP) usage can enhance overall coverage of potential unauthorized access scenarios.

