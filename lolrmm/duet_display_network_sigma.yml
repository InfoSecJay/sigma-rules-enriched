note: |
  ### Technical Context

  This Sigma rule detects network connections to specific domains associated with the Duet Display remote monitoring and management (RMM) tool. Attackers may leverage such tools for remote access to compromised systems, often with the objective of maintaining persistence or exfiltrating data. The relevant MITRE ATT&CK tactics and techniques are Command and Control (T1071.001) and Remote Access Tools (RAT) (T1219). The primary telemetry sources include network connection logs, specifically those detailing outgoing connections and DNS queries.

  If detected, this behavior could indicate the presence of an unauthorized remote access session, potentially allowing an adversary to execute commands on the target system undetected. However, it is important to note that detection of traffic to these domains does NOT confirm malicious activity on its own, as legitimate use of the Duet Display application by authorized personnel is possible.

  ### Investigation Steps

  - **Review Network Connections:** Examine connections to domains related to Duet Display, specifically looking for telemetry in network logs (Event ID 5156 or network IDS alerts). Identify IP addresses and timestamps associated with this activity.

  - **Identify Malicious Indicators:** Check for unusual connections outside of normal business hours or from unexpected user accounts making outbound connections to *.duetdisplay.com or *.rdp.duetdisplay.com. Compare the observed IPs against known malicious threat intelligence feeds.

  - **Analyze User Context:** Validate the context of the user associated with the detected connections, focusing on their role and access level. If the user is not authorized to use remote access tools, this could indicate suspicious behavior.

  - **Baseline Legitimate Traffic:** Establish a baseline of normal traffic patterns, including expected connections to Duet Display domains for authorized users during business hours. Document these patterns for comparison against new alerts.

  - **Check Firewall and Proxy Logs:** Investigate firewall logs for any blocked connection attempts to the flagged domains. This can be indicative of aggressive behavior from the monitored endpoint and can serve to confirm legitimacy of intent.

  - **Capture and Analyze Artifacts:** If suspicious activity is confirmed, capture memory and disk artifacts from the affected system to determine if any additional malicious payloads were made or modified. Look for potential indicators of compromise indicative of tool-assisted access.

  ### Prioritization

  This alert is of medium severity due to the potential for exploitation of the Duet Display tool for unauthorized remote access. While legitimate usage can occur, the possibility for malicious abuse exists, especially if this traffic comes from unexpected user accounts or systems. Moreover, such tools are commonly weaponized for stealthy persistence in targeted environments.

  ### Blind Spots and Assumptions

  Detection is limited if logging configurations do not capture all outbound connections or if network filtering is in place that excludes certain legitimate traffic. Legitimate activities include authorized usage of Duet Display by employees for remote display purposes, which may inadvertently trigger this alert. Companion detections could include monitoring for persistence via behavior associated with known RMMs or common remote access tool traffic patterns to improve coverage of suspicious activities.

