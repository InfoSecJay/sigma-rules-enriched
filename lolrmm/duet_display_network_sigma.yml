note: |
  ### Technical Context

  This rule detects network activity associated with the Duet Display remote management tool, specifically targeting DNS resolutions to its domains. The likely objective of an attacker using this tool would be to establish unauthorized remote access to a system, enabling control over the environment. This detection correlates to the MITRE ATT&CK technique for Remote System Access (T1219). The primary telemetry sources are Windows network connection logs, particularly focusing on DNS queries and connections to specific destination hostnames.

  If an alert is triggered and the behavior is confirmed as malicious, it can lead to serious security impacts, including data exfiltration or control over an endpoint. It is important to note that this detection does NOT confirm a compromise on its own; legitimate usage of the Duet Display application in an enterprise can also trigger this detection.

  ### Investigation Steps

  - **Check DNS Query Logs: ** Search for DNS query logs related to the destination hostnames using Windows Event ID  DNS Client Events (Event ID 4013) or firewall logs. Look for resolutions to '*.duetdisplay.com', 'rdp.duetdisplay.com', or 'itagent.com'. Legitimate queries should come from users known to utilize this RMM tool.

  - **Review Network Connections: ** Analyze active network connections using Windows Event ID 5156 or firewall logs for outbound connections to the provided domains. Confirm if the process initiating the connection matches known legitimate applications. Malicious connections may have rare or unknown parent processes.

  - **Investigate Process Creation Events: ** Extract and examine process creation events using Sysmon Event ID 1 or Security Event ID 4688 to determine what process initiated the connection to Duet Display domains. Confirm whether the initiating process is a known application or a suspicious one.

  - **Evaluate User Account Activity: ** Review recent activity using Event ID 4624 to verify if the user account triggering the alert has legitimate access rights and historical usage of the Duet Display application. Unusual logins or actions from unfamiliar accounts may suggest malicious intent.

  - **Correlate with Other Indicators: ** Look for patterns of network activity using SIEM tools, considering if multiple endpoints show similar behavior with unusual internal or external traffic involving Duet Display. Consistent use by multiple machines could imply a legitimate deployment, while sporadic use on diverse systems may indicate potential abuse.

  ### Prioritization

  This alert has a medium severity level. The systems involved may have vital functions sensitive to unauthorized access, making it essential to promptly investigate. Although the Duet Display tool is commonly used for remote access, its misuse for malicious purposes is a growing concern, enhancing the necessity of immediate triage.

  ### Blind Spots and Assumptions

  The detection may miss cases where attackers use obfuscated domain names or replicate legitimate traffic to avoid detection. It is also reliant on complete and accurate logging of all network activity, which must be enabled for full visibility. Legitimate uses, such as remote work or IT support scenarios, could also generate similar alerts. Companion detections to consider include monitoring for unusual inbound traffic to educate the relevance of outbound connections to Duet Display servers and spotting signs of lateral movement.

