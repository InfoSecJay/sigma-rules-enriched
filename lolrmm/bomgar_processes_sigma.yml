note: |
  ### Technical Context
  This detection rule is designed to identify potential process activity associated with the Bomgar Remote Management and Monitoring (RMM) tool, specifically by observing the execution of processes that have a parent image matching **bomgar-scc.exe**. Bomgar is commonly used for remote support and system management, making its misuse a point of concern, particularly in cases of unauthorized access or insider threats.

  The threat scenario involves an attacker leveraging the Bomgar tool to gain unauthorized access to endpoints within the environment. Attackers may use this tool to facilitate lateral movement, execute commands remotely, and access sensitive data without raising suspicions. This aligns with the MITRE ATT&CK technique for Remote Services (T1219), which suggests attackers may exploit remote management tools to gain a foothold in a targeted network.

  Primary data sources for this detection include **Windows process creation logs**, as these logs will capture events detailing which processes are spawned and their parent-child relationships. This enables detection of potentially unauthorized use of Bomgar within the enterprise’s environment.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine recent Windows process creation logs for instances of **bomgar-scc.exe** as the parent process and identify any child processes spawned, especially those from unexpected users or on unusual endpoints.

  - **Analyze User Activity**: Cross-reference the identified processes with user activity logs to understand who initiated the Bomgar sessions. Look for patterns, such as usage from accounts not typically associated with remote support tasks.

  - **Investigate Network Connections**: Check for any outbound connections made from the machine running Bomgar to external IP addresses. This may indicate unauthorized communication sessions initiated by the attacker, suggesting data exfiltration or command and control activity.

  - **Assess System Change Logs**: Review system change logs to see if there were any recent modifications to user permissions or security settings which may have facilitated unauthorized Bomgar access. Look for unusual administrative actions or escalated privileges.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of unauthorized remote access, which could lead to data breaches and system compromise. The likelihood of exploitation is notable given the prevalence of remote management tools in enterprise environments.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if legitimate Bomgar usage is not recorded or if certain processes are obscured by security products. Additionally, this detection assumes that Bomgar has not been renamed or altered in a way that bypasses this rule. For the alert to function correctly, it's essential that Windows process creation logs are enabled and monitored within the logging infrastructure.

