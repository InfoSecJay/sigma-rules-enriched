  ---

  ### Technical Context

  This rule detects process creation activities initiated by Bomgar's remote management tool (`bomgar-scc.exe`). Attackers leveraging remote management tools like Bomgar can manipulate or exfiltrate sensitive data, potentially leading to unauthorized access to systems. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **Remote Management Software** (T1219).

  The primary telemetry source is Windows process creation logs, specifically monitoring Event ID 4688. If malicious, the security impact could lead to significant data breaches and the ability for attackers to move laterally within the environment. Importantly, this detection alone does not confirm malicious intent, as legitimate use within the organization may also generate similar process creation events.

  ---

  ### Investigation Steps

  - **Identify the originating user and timestamp**: Check Event ID 4688, focusing on the `SubjectUserName`, `NewProcessName`, and `ProcessCommandLine` fields for context on the activity. Confirm if the user is expected to use the Bomgar tool.

  - **Verify process lineage**: Analyze Event ID 4656 to trace the execution path of `bomgar-scc.exe`. Look specifically for suspicious parent processes or unusual command-line arguments that do not align with known legitimate usage (e.g., `-remote`, `-unattended`).

  - **Look for subsequent process creations**: After identifying a Bomgar process, review for related processes spawned by it using Event ID 4688. Malicious activity often initiates additional processes, such as remote shells or malware executables.

  - **Examine system alteration logs**: Review logs from sources like Sysmon (Event ID 1) to check for file creation/manipulation that follows the detected Bomgar activity. Look for unusual file paths or activities in sensitive directories (e.g., user profile directories, admin shares).

  - **Correlate with organizational usage policy**: Document whether Bomgar RMM usage aligns with your organization's remote access policies. If the user or asset role does not typically require such tools, raise the alert for further investigation.

  - **Identify high-confidence malicious indicators**: Look for known IOC patterns or correlations with past incidents related to unauthorized remote access, such as IP addresses, hostnames, or behavior indicating lateral movement.

  ---

  ### Prioritization

  This alert is of **medium severity** due to the potential for significant impact on sensitive systems through unauthorized access via remote management tools. While Bomgar is a legitimate application, its misuse is a common vector for attackers, making this behavior one that should be closely monitored.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments where legitimate use of Bomgar is frequent, leading to potential false positives. Ensure that logs from all endpoints where Bomgar is used are configured and collected effectively. Additionally, legitimate administrative activities may trigger this alert, hence analysts should confirm expected user behavior associated with Bomgar. A companion detection to consider is monitoring for outbound connection attempts to new or unrecognized external IPs immediately following Bomgar process activity.

