  ---

  ### Technical Context

  This rule detects the spawning of processes that have Bomgar RMM (Remote Management and Monitoring) as their parent. An attacker may leverage Bomgar RMM for unauthorized remote access to compromised systems, potentially enabling them to execute malicious commands or exfiltrate data without detection. This behavior aligns with the MITRE ATT&CK technique T1219 - Remote Access Software.

  The primary telemetry source is Windows process creation logs, specifically focusing on the process creation event where the parent image is bomgar-scc.exe. If this behavior is executed maliciously, it may allow attackers full control over a target system, resulting in data breaches or lateral movement within the environment. It is important to note that this detection does not confirm malicious activity without further investigation, as legitimate administrative use of Bomgar RMM may trigger this rule.

  ---

  ### Investigation Steps

  - **Check process lineage:** Examine the Process Creation logs (Event ID 4688 or Sysmon Event ID 1) for processes spawned by bomgar-scc.exe. Look for unusual child processes that may indicate unauthorized operations.

  - **Review user activity:** Connect the detected process to the user account in your logs. Locate User Logon events (Event ID 4624) during the period of activity to establish if an accountable user was using Bomgar legitimately.

  - **Assess asset criticality:** Identify the affected system's role (e.g., server, workstation) and any associated data sensitivity. Critical systems showing this activity should be prioritized for deeper investigation.

  - **Identify high-confidence indicators:** Search for known malicious command line arguments used within spawned processes (e.g., file transfers via command line, execution of PowerShell commands) that could hint at malicious use of the RMM tool.

  - **Validate expected usage patterns:** Determine legitimate activity by cross-referencing known approved usage times and administrators scheduled for remote support sessions with Bomgar RMM.

  ---

  ### Prioritization

  Alerts generated by this rule should be considered medium severity due to the potential for unauthorized access to sensitive systems and data. The likelihood of abuse is moderate, as Bomgar RMM is widely used for legitimate purposes but is also a common tool for adversaries in attacks.

  ---

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques if the attacker employs tactics like process injection or disguises their actions within legitimate usage patterns of Bomgar. Ensure that logging is enabled for all relevant process creation events (Event ID 4688) and that Sysmon is utilized for enhanced visibility on process activity. Legitimate administrative activities may trigger this alert, particularly during scheduled maintenance windows or remote support sessions. A companion detection to strengthen coverage could involve monitoring for unexpected outbound network connections from processes spawned by Bomgar, escalating potential concerns of unauthorized data exfiltration.

