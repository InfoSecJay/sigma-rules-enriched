note: |
  ### Technical Context

  This Sigma rule detects potential registry modifications related to the ManageEngine ServiceDesk Plus RMM tool by monitoring changes to specific keys associated with system uninstall information. An attacker may leverage this tool to manage endpoints or deploy unauthorized software, potentially leading to lateral movement or system compromise within the network. The relevant MITRE ATT&CK tactic is "Execution" (TA0002) with the technique "Command-Line Interface" (T1219).

  The primary telemetry source is the Windows registry events, specifically monitoring registry changes at the specified key path. If malicious, this could enable attackers to gain persistent access or misuse legitimate administrative functionalities for nefarious purposes. This detection does NOT confirm malicious intent or behavior on its own; it merely indicates that registry access occurred on the specified paths.

  ### Investigation Steps

  - **Review registry changes:** Examine Windows Security Event ID 4657 (Registry Value Modified) and filter for changes targeting `HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{*}`. Note the timestamp and user context.

  - **Identify installer source:** Check for installation logs and process creation events (Sysmon Event ID 1) related to `ManageEngine ServiceDesk Plus`. Valid installations will usually involve a known administrator account and installation from a legitimate source.

  - **Cross-verify authorized tools:** Confirm whether the ManageEngine ServiceDesk Plus RMM tool is an approved application within your environment by checking asset inventories and application whitelists.

  - **Detect abnormal user activity:** Look for unusual user behavior, such as administrative actions performed outside of normal working hours. This can be identified using Windows Event ID 4672 (Special Privileges Assigned to New Logon) in conjunction with process creation logs.

  - **Check for exfiltration indicators:** Investigate any related file creation or changes indicating data was being exported or altered significantly through endpoint monitoring solutions. Relevant telemetry to examine would be Sysmon Event ID 11 (FileCreate).

  ### Prioritization

  This alert is considered medium severity due to the possible impact on critical systems if the ManageEngine tool is exploited. As it is commonly used for administrative tasks, the likelihood of malicious abuse is moderate, especially in environments where the tool is not appropriately governed.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the legitimate use of the ManageEngine ServiceDesk Plus, which may trigger similar alerts without malicious intent. Reliable detection requires active monitoring of registry event logging on hosts running Windows. Activities like normal software installations or administrative management tasks may also generate alerts. A related detection that enhances coverage would be monitoring for command line arguments associated with suspicious installer processes or tool use (e.g., Sysmon Event ID 1 for PowerShell or CMD usage).

