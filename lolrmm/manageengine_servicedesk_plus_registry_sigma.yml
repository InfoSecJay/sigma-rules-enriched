note: |
  ### Technical Context

  This Sigma rule detects registry changes associated with the ManageEngine ServiceDesk Plus Remote Monitoring and Management (RMM) tool. The likely attacker objective is to manipulate the system registry for persistence or lateral movement by deploying or manipulating the ServiceDesk Plus software, which can be abused for command and control activities. This behavior aligns with the MITRE ATT&CK technique T1219 - Remote Access Software.

  Primary telemetry sources include Windows Registry events, particularly changes to the registry paths related to installed applications, indicated by the key `HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\`. If malicious, this could lead to unauthorized access or control over systems. Importantly, this detection alone does NOT confirm whether the behavior is benign or malicious without further context and investigation.

  ### Investigation Steps

  - **Check Registry Changes:** Inspect registry event logs for Event ID 4657 or Sysmon Event ID 13 with target object containing `HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\{*}`. Focus on timestamps and user account making the change.

  - **Verify Legitimate Activity:** Determine if ManageEngine ServiceDesk Plus is installed on the affected host. If installed, correlate the registry changes with normal operational schedules or maintenance windows in organizational logs.

  - **Cross-reference with User Accounts:** Investigate the user account associated with the registry modification. Benign changes typically occur under service accounts or IT administrators during installation or updates, while unexpected changes should be treated as potentially malicious.

  - **Analyze Recent Network Traffic:** Review network logs for communications to known Command and Control (C2) IPs or domains typical of RMM tools. Monitor for unusual outbound connections during the time of the registry activity.

  - **Review Related Events:** Examine additional Event IDs (e.g., 4688 for process creation) around the time of the registry modification for instances of suspicious processes starting or loading, particularly any associated with remote access tools.

  ### Prioritization

  This alert is of medium severity due to the potential security impact on systems associated with Remote Monitoring and Management activities. The likelihood of malicious use is moderate, especially in environments where the ManageEngine software is not explicitly sanctioned. Such registry manipulations may facilitate unauthorized access, making this behavior a possible precursor to more extensive compromise.

  ### Blind Spots and Assumptions

  Detections are limited by the presence of sobering activity from legitimate ManageEngine use; thus, invasive analysis may become necessary to discern context. Required log sources include Windows security and registry event logs, which need to be accurately configured for reliable detection. Legitimate software updates or installations may also trigger these alerts. A related detection would be monitoring for network connections originating from processes that leverage the ManageEngine software, enhancing visibility on potential misuse.

