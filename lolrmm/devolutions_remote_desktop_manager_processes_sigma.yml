note: |
  ### Technical Context
  This rule detects the execution of processes associated with the Devolutions Remote Desktop Manager (RDM) tool, which is commonly used for managing remote desktop connections. Attackers may leverage RDM for conducting unauthorized access or lateral movement within a network, particularly in environments where the tool is not widely used or is improperly configured. The objective of the attacker could be to establish a foothold, move laterally within the network, or exfiltrate sensitive information.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002), as the detection focuses on the process execution, and specifically, technique **T1219: Remote Access Software**. The primary data sources that provide evidence for this detection include **process creation events** generated by the operating system, which log details about newly initiated processes, including their parent processes, command-line arguments, and execution paths.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for `RemoteDesktopManager.exe` execution entries, focusing specifically on the parent process to identify any unusual initiators.
  - **Analyze Parent Process Relationships:** Investigate the parent-child process relationships to understand how the RDM tool was launched. Look for anomalous parent processes that may suggest exploitation or misuse.
  - **Cross-reference User Access Logs:** Check user access logs to determine if any accounts commonly associated with RDM usage executed the processes. Validate whether users have a legitimate reason to be utilizing RDM at the time of detection.
  - **Monitor for Lateral Movement Indicators:** Look for additional telemetry that might indicate lateral movement, such as unusual RDP connections, logins from unexpected geolocations, or attempts to access sensitive systems following RDM usage.

  ### Prioritization
  The alert's severity is considered medium in an enterprise environment as the legitimate use of Devolutions Remote Desktop Manager is prevalent, but anomalous activity could indicate a potential compromise or misuse. Understanding the context of its use is critical for an appropriate response.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate users who frequently utilize RDM, leading to potential false positives. The detection logic assumes that any instance of RDM is suspicious, without differentiating between legitimate and malicious use. Additionally, comprehensive process creation logging is required for this alert to function effectively, and any configurations that limit or exclude logging may reduce detection efficacy.

