note: |
  ### Technical Context

  This Sigma rule detects process activity related to Devolutions Remote Desktop Manager (RDM), identifying instances where the application is either launched directly or spawned by another instance. The likely attacker objective is to utilize RDM for unauthorized remote access to systems, possibly to facilitate lateral movement within a network. This behavior aligns with the MITRE ATT&CK technique Execution (T1219).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which provide details about newly spawned processes. If RDM is used maliciously, it could allow attackers to manage or exploit systems remotely, leading to significant breaches. However, the detection does NOT confirm malicious intent on its own, as the tool is often used legitimately within IT operations.

  ### Investigation Steps

  - **Review related process issuance:**
    Examine the Security Event ID 4688 logs for parent processes that launched `RemoteDesktopManager.exe`. Confirm whether any unexpected executables initiated the RDM process, indicating potential malicious behavior.

  - **Examine user context:**
    Identify user accounts associated with the use of `RemoteDesktopManager.exe` and assess their normal activity levels. If this application is launched by a user who typically does not utilize remote management tools, it warrants further scrutiny.

  - **Identify network connections:**
    Look for outbound network connections initiated by `RemoteDesktopManager.exe` using Windows Firewall logs (Event ID 5156) or network monitoring tools. Connections to suspicious or unauthorized IP addresses indicate possible malicious activity.

  - **Check execution patterns:**
    Compare frequency and times of RDM process executions against baseline user behavior. Anomalies such as high frequency or executions at odd hours may indicate compromise.

  - **Confirm legitimate use cases:**
    Document and confirm instances where `RemoteDesktopManager.exe` is used for standard remote administration tasks within the enterprise. Expected behavior may include designated IT personnel accessing specific servers during regular maintenance windows.

  ### Prioritization

  The alert is deemed medium severity due to its potential impact on critical systems, especially if used by unauthorized users to gain remote access. The likelihood of malicious abuse is moderate, given that remote management tools like RDM are often weaponized in credential theft and lateral movement tactics.

  ### Blind Spots and Assumptions

  This detection may miss cases where adversaries utilize process name obfuscation or alternative methods to execute remote connections. Reliable detection requires proper logging configurations, particularly for process creation events and network traffic. Legitimate administrative activities can trigger this alert when IT personnel use RDM as part of their normal duties. A related detection to consider is monitoring for known remote access tools or scripts (e.g., RDP or TeamViewer), which can provide additional context to this alert.

