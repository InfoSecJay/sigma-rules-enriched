note: |
  ### Technical Context

  This Sigma rule detects the execution of the Devolutions Remote Desktop Manager (RDM) tool by monitoring process creation events where the parent or the invoked image matches the RDM executable. The behavior is indicative of both legitimate remote management as well as potential misuse by an attacker to establish remote access, thereby facilitating command-and-control operations. The relevant MITRE ATT&CK tactics and techniques include "Command and Control" (TA0011) and "Remote Access Tools" (T1219).

  Primary telemetry sources include Windows Security Event ID 4688 for process creation. If malicious, the usage of RDM could allow an adversary to remotely control assets, gather sensitive information, or move laterally within the network. It is important to note that this detection does not confirm malicious activity on its own; RDM may also be used legitimately by system administrators for remote management tasks.

  ### Investigation Steps

  - **Verify the process creation event:** Examine Windows Security Event ID 4688 to confirm the creation of the process with Image: `\RemoteDesktopManager.exe`. Note the User and Source IP addresses for context.

  - **Check the parent process:** Look for the ParentImage in Event ID 4688 indicating which process spawned RDM; an unexpected parent could indicate malicious usage.

  - **Analyze user context:** Investigate the user account associated with the process. Legitimate usage typically involves accounts with administrative privileges performing maintenance, as opposed to standard user accounts or accounts exhibiting unusual activity.

  - **Identify network connections:** Review network logs (e.g., firewall logs or Sysmon Event ID 3) for outbound connections initiated by the RDM process. Look for connections to anomalous IP addresses or unusual ports that are not typical for remote administration.

  - **Review file activities:** Validate if any files were created or modified in directories commonly used for credential or data storage (e.g., Temp folders) shortly after RDM was launched. Look for unexpected file types or significant modifications.

  - **Assess asset criticality:** Contextualize detections against asset roles; RDM running on servers or sensitive systems poses a higher risk than running on a standard workstation used for administrative tasks.

  ### Prioritization

  This alert should be considered medium severity due to the potential for both legitimate administrative functions and its use in unauthorized remote access scenarios. The risk escalates if RDM is observed running on critical assets, as attackers frequently utilize tools like this to maintain persistence and control.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate administrative activities may frequently trigger this alert, leading to potential false positives. Logs from non-domain joined devices or from improperly configured systems may not include RDM activity, weakening detection effectiveness. Additionally, monitoring for related behaviors, such as common lateral movement tactics (e.g., other remote access tools), can enhance overall detection capabilities.

