  ---

  ### Technical Context

  This rule detects the execution of the MyGreenPC Remote Monitoring and Management (RMM) tool. The likely attacker objective includes unauthorized remote access to systems, facilitating persistence, and potentially executing malware deployments. Relevant MITRE ATT&CK tactic and technique includes Execution (T1203) and Remote Desktop Protocol (RDP) initiation (T1219). The primary telemetry source is Windows process creation logs, specifically focusing on Event ID 4688. If malicious, this tool could allow attackers to maintain control over compromised systems, leading to data exfiltration or lateral movement. However, this alert alone does not confirm malicious intent, as MyGreenPC may be legitimately used by internal IT teams.

  ---

  ### Investigation Steps

  - **Verify process execution:** Review Windows Security Event ID 4688 logs for the process creation of `mygreenpc.exe`. Check timestamps and user context. Expect legitimate instances from recognized IT personnel; look for unexpected user accounts or unusual execution times.

  - **Identify parent-child relationships:** Supplement analysis with Sysmon Event ID 1 to identify parent process using `mygreenpc.exe`. A legitimate invocation typically has system management or IT-related parent processes.

  - **Check system access logs:** Look for concurrent RDP connections from the same user account during the execution of `mygreenpc.exe`. RDP sessions involving unusual external IP addresses can indicate potential misuse.

  - **Collect and analyze network traffic:** Inspect network logs for unusual outbound connections made from the device running `mygreenpc.exe`. Utilize firewall logs to search for connections to known malicious IPs or unusual ports.

  - **Validate legitimate usage patterns:** Compare the activity against known legitimate usage patterns of MyGreenPC by the IT department. Document regular IT maintenance schedules involving the tool.

  - **Audit user permissions:** Review user account permissions who executed `mygreenpc.exe` against expected norm roles. Elevated permissions without proper justification may indicate a compromised account.

  ---

  ### Prioritization

  This alert holds medium severity due to the sensitive nature of remote management tools like MyGreenPC, which can be abused for unauthorized access. The risk of malicious exploitation is heightened if there is no proper justification for its usage within the environment, particularly in cases where it deviates from standard operating procedures.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for adversaries to rename or alter the legitimate executable to evade detection. Proper configuration of Security Event logging and Sysmon might be necessary for reliable detection of such activities. Legitimate software installations for remote management could falsely trigger this alert, particularly if the organization uses MyGreenPC routinely. A related detection for monitoring anomalous RDP usage would provide additional context and strengthen coverage.

