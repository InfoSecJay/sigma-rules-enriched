note: |
  ### Technical Context
  This detection rule identifies potential suspicious process activity associated with the Yandex.Disk RMM tool. Yandex.Disk has legitimate uses for file synchronization and storage, but it can also be repurposed for remote monitoring and management activities, which may be utilized by threat actors to maintain persistence or conduct unauthorized actions within an environment. Attackers leveraging this tool might aim to manipulate or exfiltrate data, conduct reconnaissance, or establish remote access to systems.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and specifically the technique **User Execution** (T1203). The detection focuses on identifying processes spawned by the Yandex.Disk RMM tool that appear nested under specific parent image files, suggesting potential misuse. Primary data sources helpful for this detection include **process creation event logs**, which capture details of executables launched within the system, providing critical insights into potentially malicious behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for any instances of `YandexDisk2.exe`. Look for anomalous timestamps, unexpected commands, or unusual parent processes that could indicate malicious activity.

  - **Analyze Parent Process Relationships**: Investigate the parent processes of the detected instance of `YandexDisk2.exe`. Establish context by identifying if these parent processes are legitimate or associated with known malicious activities.

  - **Check Network Activity**: Monitor associated network activity generated by the Yandex.Disk tool. Look for unusual outbound connections or communications to known malicious IPs, particularly during odd hours or from atypical endpoints.

  - **Assess System Modifications**: Review any modifications to files or system settings made by the `YandexDisk2.exe` process. Identify alterations that may suggest data exfiltration or unauthorized access attempts.

  ### Prioritization
  This alert carries a medium severity due to the moderate impact it may have on enterprise environments. The likelihood of Yandex.Disk being leveraged by attackers for malicious purposes warrants timely investigation, especially in organizations where this tool is not typically deployed.

  ### Blind Spots and Assumptions
  A potential gap in this detection coverage could arise from legitimate usage of Yandex.Disk in the environment, which may generate false positives if not appropriately contextualized. The detection logic assumes that the presence of `YandexDisk2.exe` running as a child process under specific known parent processes is indicative of malicious intent. For the detection to function properly, comprehensive logging of process creation events must be enabled across all Windows endpoints in the environment.

