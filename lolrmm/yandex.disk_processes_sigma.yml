note: |
  ### Technical Context

  This rule detects potential process activity related to the Yandex.Disk remote management tool, specifically instances where processes are spawned with a parent image of `YandexDisk2.exe`. The likely attacker objective behind this behavior is to establish command and control over infected systems, utilizing Yandex.Disk for remote management capabilities covertly. This detection aligns with the MITRE ATT&CK Tactic: Command and Control and Technique: Remote Management Tools (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1. If detected as malicious, the security impact can be significant as adversaries may exploit Yandex.Disk for unauthorized remote control, exfiltration, or lateral movement within the network. It is crucial to note that this detection does NOT confirm unauthorized activity on its own, as legitimate use of Yandex.Disk for file storage or collaboration is common in enterprise environments.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 (Process Creation) for instances where `Image` ends with `YandexDisk2.exe`, focusing on time stamps and user accounts associated with the process in `NewProcessName`.

  - **Evaluate parent process indicators:** Look for parent processes in logs where `ParentImage` ends with `YandexDisk2.exe`. Ensure that a typical user action correlates with these processes; suspicious invocation from unknown or system accounts is a red flag.

  - **Cross-reference user activity:** Identify the user account associated with the Yandex.Disk process. If the account normally does not use Yandex.Disk or is service-based, it may indicate malicious intent.

  - **Assess network activity:** Verify network logs for unusual connections or data transfers originating from a host running `YandexDisk2.exe`. Look specifically for unusual destinations or high-volume data transfers.

  - **Compare with known benign uses:** Document expected patterns of Yandex.Disk activity from legitimate business processes, such as regular file uploads/downloads from identified business workflows.

  ### Prioritization

  This alert has a medium severity. If the affected system holds sensitive data or is a critical asset, the potential for exploitation increases. While Yandex.Disk can be legitimately used within some environments, its usage as a remote management tool is frequently exploited by adversaries, warranting timely investigation.

  ### Blind Spots and Assumptions

  The detection may miss instances where Yandex.Disk is renamed or obfuscated to evade detection. Reliable detection also requires that process creation logs are enabled and properly configured. Legitimate activities may include authorized personnel using Yandex.Disk for standard file sharing. Companion detections, such as monitoring for anomalous user behavior or data egress, can enhance overall security posture against misuse of remote management tools like Yandex.Disk.

