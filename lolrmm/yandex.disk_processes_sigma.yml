  ### Technical Context

  This Sigma rule detects the execution of processes related to Yandex.Disk, particularly those spawned as a child process of `YandexDisk2.exe`. The likely attacker objective is to utilize the Yandex.Disk RMM tool for remote maintenance or data exfiltration, leveraging the software’s legitimate functionality for malicious purposes. This behavior is aligned with the MITRE ATT&CK technique for Remote Access Tools (RAT), specifically T1219.

  The primary telemetry sources include Windows process creation logs that capture Event ID 4688, which detail new process starts, including parent-child relationships. If detected maliciously, this activity may allow an adversary to perform unauthorized actions on the network or exfiltrate sensitive information. However, this detection does NOT confirm malicious intent exclusively; legitimate uses of Yandex.Disk occur frequently in organizations, which must be differentiated from unauthorized activities.

  ---

  ### Investigation Steps

  - **Check for process creation events:** Review Security Event ID 4688 logs for the creation of processes with the image name `YandexDisk2.exe`. Collect the corresponding parent process information to see if the activity correlates with known legitimate processes or behaviors.

  - **Identify benign users and roles:** Correlate the logged activity with users who typically engage with Yandex.Disk in your organization. Confirm whether these users have a legitimate business need for the process running.

  - **Examine process parentage:** Evaluate the parent process of any detected instances of `YandexDisk2.exe`. Investigate if the parent process is indeed a legitimate application or if its unexpected behavior suggests potential exploitation.

  - **Investigate file activity:** Search for file creation or modification timestamps in the directories used by Yandex.Disk. Look for unusual file exfiltration patterns or new files that could indicate unauthorized data transfer, reporting on relevant fields like `FileName` and `FileSize`.

  - **Correlate network activity:** Review firewall logs for outbound connections initiated by `YandexDisk2.exe`. Monitor the destination IP addresses and ports used. Identify if any connections are made to suspicious external interfaces known for data exfiltration.

  ---

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact on sensitive data if Yandex.Disk is misused. The likelihood of malicious abuse exists, especially if remote access or data exfiltration is confirmed. Similar tools are frequently weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include altering process names or path obfuscation, as well as the legitimate usage of Yandex.Disk, which can generate false positives. Reliable detection hinges on consistent logging configurations, particularly in environments where employees may use Yandex.Disk legitimately. Related detections to consider include unusual outbound network traffic (e.g., T1071 - Application Layer Protocol) to strengthen visibility of potential data exfiltration or remote access attempts.

