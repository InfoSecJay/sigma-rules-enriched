note: |
  ### Technical Context

  This Sigma rule detects process activity associated with the Yandex.Disk RMM tool via its executable `YandexDisk2.exe`. Malicious actors may leverage this tool for remote management and potentially unauthorized activities on compromised systems, such as data exfiltration and command execution. The relevant MITRE ATT&CK tactic is Execution (TA0040), with the technique being Remote System Manipulation (T1219).

  The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, focusing on fields such as `ParentImage` and `Image`. If malicious, the security impact could include unauthorized access and control over the system. However, this detection does not confirm whether the activity is indeed malicious, as Yandex.Disk may be used legitimately.

  ### Investigation Steps

  - **Identify process execution details:**
    Check Security Event ID 4688 or Sysmon Event ID 1 logs for `NewProcessName` containing `YandexDisk2.exe` and `ParentImage` related to legitimate applications. Compare against known service processes or installations.

  - **Examine execution context:**
    Review the `CommandLine` field in the process creation logs for any unusual parameters passed to `YandexDisk2.exe`, which may indicate malicious intent, such as remote commands or connections to unknown IPs.

  - **Check for related network activity:**
    Investigate for outgoing connections associated with `YandexDisk2.exe` within Windows Firewall logs (e.g., Event ID 5156) or Sysmon Network Connection events (Event ID 3). Look for suspicious destinations or unusual ports.

  - **Compare legitimate vs. malicious behavior:**
    Document known legitimate use cases for `YandexDisk2.exe`, such as authenticated users accessing the tool for file synchronization. Use this to rule out normal operational activity.

  - **Review for anomalies in user accounts:**
    Audit user account activity leading up to the `YandexDisk2.exe` execution. Look for any accounts that may have been compromised or unauthorized accounts initiating the process.

  ### Prioritization

  This alert has medium severity in an enterprise context due to the potential impact of remote management tools on sensitive systems. The likelihood of malicious abuse is moderate, as known adversaries have employed similar tools for lateral movement and data theft, but the activity may also be part of legitimate system operations.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques, such as renaming the executable or using legitimate accounts to execute the process, which may not trigger alerts. Reliable detection requires comprehensive logging of process creation and network activity. There might be legitimate use cases for `Yandex.Disk` that can not be easily distinguished from malicious intent. A companion detection is monitoring for unusual outbound traffic patterns from devices running `YandexDisk2.exe`, to reinforce context and reduce false positives.

