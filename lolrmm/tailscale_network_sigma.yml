note: |
  ### Technical Context

  This rule detects network connections to Tailscale-associated domains, which may indicate the use of the Tailscale RMM tool, a remote management solution. The likely attacker objective is to establish a covert communication channel to remotely access or control compromised systems, enabling further exploitation or data exfiltration. This detection aligns with the MITRE ATT&CK tactic of Execution (TA0002) and the technique Remote Services (T1219).

  The primary telemetry source is Windows network connection logs that capture connection attempts to specific hostnames associated with Tailscale. If these connections are made from unauthorized or unexpected systems, it indicates a potential security threat. However, it is critical to state that this detection does NOT confirm malicious activity on its own, as legitimate use of Tailscale in the environment may also trigger this alert.

  ### Investigation Steps

  - **Review destination hostnames**: Check for connections to `*.tailscale.com` or `*.tailscale.io`. Alert on any connections from systems not authorized to use Tailscale, as this could indicate potential misuse or an unauthorized RMM attempt.

  - **Validate source systems**: Identify the source of the network connection (Windows Event ID 5156 or Sysmon Network Connection Event ID 3) to determine if it originates from a known and legitimate asset. Legitimate Tailscale use typically comes from administrative workstations.

  - **Examine running processes**: Correlate detected connections with running processes using Sysmon Event ID 1 (Process Creation). If a non-standard application is initiating the connection, this may indicate malicious activity, especially if the process is obfuscated or non-signed.

  - **Check for anomalous user behavior**: Investigate user accounts associated with connection attempts. If the user context is associated with atypical or high-privilege accounts engaging with Tailscale, further scrutiny is warranted.

  - **Query firewall logs for rules**: Review firewall logs (e.g., Windows Firewall logs with Event ID 2004) for any rules permitting traffic to Tailscale domains. Confirm that such traffic aligns with known and allowed usage patterns.

  - **Analyze system role and context**: Understand the context of the host. Systems like servers or sensitive infrastructure should not initiate connections to Tailscale without clear justification.

  ### Prioritization

  This alert carries medium severity due to its implications for security, particularly if Tailscale is not sanctioned in the environment. The impacted system's role and the potential for adversaries to abuse such a tool make it a concern. While Tailscale can be used legitimately, its capabilities to facilitate remote access can be weaponized, which increases the need for investigation.

  ### Blind Spots and Assumptions

  Detection is limited by legitimate use cases of Tailscale within the enterprise, which may lead to false positives. A comprehensive set of logs capturing approved Tailscale use is necessary for reliable detection. Legitimate administrative tasks may trigger this alert, particularly if administrators use Tailscale for remote operations. A companion detection worth considering is monitoring for unusual outbound traffic patterns, which can provide additional context regarding unauthorized access attempts.

