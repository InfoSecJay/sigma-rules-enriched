  ---

  ### Technical Context

  This rule detects outbound network connections targeting Tailscale's domain, indicating potential usage of the Tailscale Remote Management Tool (RMM). The likely attacker objective is to establish a communication channel for remote access or management of compromised systems. This behavior aligns with the MITRE ATT&CK technique for Remote Services (T1219).

  The primary telemetry source for this rule is Windows network connection logs, focusing on the destination hostname fields. If the activity is confirmed as malicious, it can enable unauthorized remote access, leading to data exfiltration or lateral movement within an organization. It is important to note that this detection does NOT confirm malicious activity on its own, as it may include legitimate use of Tailscale for remote work purposes.

  ---

  ### Investigation Steps

  - **Review network connection logs:** Check for Event ID 5156 (Windows Filtering Platform - Allowed Connection) that shows connections to domains ending in `*.tailscale.com` or `*.tailscale.io`. Document any legitimate applications that might connect to these domains.

  - **Identify process origin:** Investigate the processes initiating these connections using Sysmon Event ID 3 (Network Connection). Look for non-standard applications that are not typically associated with Tailscale, which could indicate malicious usage.

  - **Assess active user accounts:** Confirm the logged-in user session at the time of the connection. Evaluate whether the user has legitimate reason to access remote management tools like Tailscale, which may indicate benign behavior.

  - **Validate DNS queries:** Review DNS query logs for lookups to Tailscale domains in your environment, using Windows Event ID DNS Client Event ID 408 to corroborate if the connections originated following a legitimate name resolution.

  - **Check for atypical patterns:** Analyze the frequency and timing of the connections to Tailscale domains. Unusual spikes or connections outside of business hours may suggest automated tools or external attackers.

  - **Verify file creations:** If applicable, inspect the file system for any artifacts or executables related to Tailscale, focusing on common installation paths or directories associated with remote management tools.

  ---

  ### Prioritization

  The alert is of medium severity due to the risk of compromising sensitive systems when Tailscale or similar RMM tools are used with malicious intent. The likelihood of ad hoc abuse exists, especially if an external attacker gains access to internal networks. Such behaviors are increasingly weaponized to facilitate unauthorized access and lateral movements.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate uses of Tailscale, which may trigger false positives. Reliable detection requires complete access to Windows network logs and accurate filtering configurations. Activities such as IT support leveraging Tailscale for remote assistance can also result in alerts. A companion detection to consider involves monitoring for unusual login activity (e.g., M365 user authentication logs), which may indicate compromised credentials preceding Tailscale use.

