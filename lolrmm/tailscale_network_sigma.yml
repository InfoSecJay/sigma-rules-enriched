note: |
  ### Technical Context

  This rule detects potential network connections to Tailscale's endpoints, which are associated with a remote management tool. Attackers may attempt to leverage Tailscale to establish remote connections for command and control, data exfiltration, or lateral movement within a network. This behavior aligns with the MITRE ATT&CK framework under the tactic of Execution and the technique of Custom Command and Control Protocols (T1219).

  The primary telemetry sources are Windows network connection logs, specifically looking at outbound DNS resolutions or established TCP connections to the domains associated with Tailscale (`*.tailscale.com`, `*.tailscale.io`). If malicious, this could lead to unauthorized access to systems or data leakage. Importantly, detection of traffic alone does not confirm malicious intent, as legitimate usage of Tailscale may also trigger this rule.

  ### Investigation Steps

  - **Review network connection logs**: Check Windows Security Logs, specifically Event ID 5156 (Windows Filtering Platform), for outbound connections to `*.tailscale.com` or `*.tailscale.io`. Investigate context around the process initiating the connection for any anomalous behavior.

  - **Correlate with user identity**: Inspect the user account associated with the connection. Validate whether the user is authorized to use Tailscale. Legitimate users typically operate it in known work environments.

  - **Identify high-confidence malicious indicators**: Look for processes related to `tailscale.exe` or similar executable names initiating the connection. Cross-reference with known threat intelligence sources for any known association with malicious activity.

  - **Examine the process tree**: Using Sysmon (Event ID 10), analyze the parent-child process relationships for the Tailscale connections. Legitimate usage typically has identifiable and expected parent processes (e.g., user-initiated applications).

  - **Check for accompanying data exfiltration artifacts**: Validate if there are logs of large outbound data transfers via tools like Windows Event Logs (Event ID 4656 for Resource Access) or network traffic analysis indicating unusual peak activity during the Tailscale activity timeframe.

  - **Document expected legitimate activity**: Establish a baseline for Tailscale usage, noting common user behaviors and expected network patterns. This may include known scheduled routines and approved use cases.

  ### Prioritization

  This alert has a medium severity due to the potential impact of enabling external remote access on critical systems. The risk is significant because Tailscale can be weaponized by adversaries for malicious purposes, such as bypassing network defenses and establishing persistence. If the behavior is indicative of unauthorized access, swift investigation is necessary.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use; authorized staff may frequently utilize Tailscale, creating noise in alerts. Ensure that all endpoints capture appropriate network logs, as missing data may compromise detection fidelity. Additionally, look out for legitimate administrative activities that may invoke Tailscale usage if remote support is part of operational procedures. Companion detections could include monitoring for unusual login attempts or user sessions coinciding with detected Tailscale traffic, enhancing context around the alert.

