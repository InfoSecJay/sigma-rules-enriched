note: |
  ### Technical Context

  This rule detects network connections to Tailscale domains, indicating potentially unauthorized usage of the Tailscale Remote Management Tool (RMM). Adversaries may utilize Tailscale to create secure tunnel connections for remote access to systems, aiding in lateral movement or command and control activities. Relevant MITRE ATT&CK tactic includes Command and Control (TA0011) and technique Remote Services (T1219).

  The primary telemetry sources include Windows network connection logs, particularly focusing on DNS queries and outbound connections. If malicious, this activity could facilitate unauthorized access to networked resources or bypassing security controls. However, this detection alone does not confirm that malicious intent is present, as Tailscale may be used legitimately.

  ### Investigation Steps

  - **Review network connection logs:** Check for Event ID 5156 from Windows Firewall with Advanced Security to identify outbound connections to Tailscale domains (e.g., *.tailscale.com). Look for unusual timestamps and non-admin users.

  - **Validate legitimate usage:** Determine whether there is documented approval or known legitimate use of Tailscale within your environment. Review previous access logs for similar connections from known assets to ensure they correlate with regular operational behavior.

  - **Analyze user context:** Identify the user accounts initiating connections to Tailscale domains. Check whether these accounts have administrative privileges; unexpected activity from non-admin users could signal malicious behavior.

  - **Inspect associated processes:** Use Sysmon Event ID 3 to track process creation linked to the outbound connections. Investigate any suspicious executables or processes that appear alongside Tailscale connections.

  - **Cross-reference with threat intelligence:** Utilize threat intelligence feeds to ascertain if the observed Tailscale connections match known malicious IPs or threat actor behavior involving Tailscale.

  - **Assess data exfiltration indicators:** If data exfiltration is suspected, review for large outbound data transfers after establishing a connection to Tailscale, validated against file access logs and timestamps to ensure alignment.

  ### Prioritization

  This alert should be treated with medium severity. Systems affected may hold critical data or services, and Tailscale is commonly weaponized by threat actors for stealth access. The likelihood of abuse increases significantly if the rule triggers unexpectedly on sensitive assets.

  ### Blind Spots and Assumptions

  Detection may miss encrypted traffic or if Tailscale’s operation is heavily obfuscated. The alert relies on accurate logging from Windows network source; ensure DNS logging and outbound connection monitoring are properly configured. Legitimate activities include authorized IT personnel using Tailscale for remote access. A companion detection rule monitoring for established connections leveraging non-Tailscale remote access solutions may strengthen overall detection coverage.

