  ### Technical Context

  This Sigma rule detects file activity associated with the Miradore Remote Management (RMM) tool, particularly focusing on files within its installation directory. The likely attacker objective is to leverage Miradore RMM for command and control (C2) operations or unauthorized administrative tasks, as it provides remote access capabilities. This behavior aligns with the MITRE ATT&CK technique for "Remote Access Software" (T1219).

  Primary telemetry sources include Windows file event logs, specifically monitoring file creations, modifications, or deletions in the Miradore installation path. If this activity is malicious, it may indicate unauthorized remote access or control over the affected system. It is crucial to note that this detection does NOT confirm malicious intent on its own; legitimate use of Miradore in an enterprise context can trigger this rule.

  ### Investigation Steps

  - **Check for active Miradore usage:** Review the business processes and asset inventory to confirm if the Miradore RMM tool is officially deployed on the affected system. Look for existing documentation or user logs related to Miradore configurations.

  - **Review Windows Security Events:** Examine Windows Security Event ID 4663 for file access attempts on the specified paths. Look for the specific account that accessed these files; legitimate accesses should involve known administrative accounts.

  - **Analyze file modification timestamps:** Investigate the last modified timestamps of files within "C:\Program Files\Miradore\OnlineClient\bin\". Compare recent activity against operational hours; unusual modifications during non-business hours could indicate malicious behavior.

  - **Identify specific created/modified files:** Focus on identifying recent file creations or modifications, particularly for the "7z.dll" file. Any modifications to this file that do not correspond with legitimate administrative access should raise suspicion.

  - **Collect artifact evidence:** If any unauthorized file activity is identified, confirm file-related actions such as exfiltration or lateral movement by checking for Network Event Logs (Event ID 5156) reflecting connections to external IPs from the affected host.

  ### Prioritization

  This alert holds medium severity in an enterprise context due to the potential impact of unauthorized remote access and the criticality of any affected system. While Miradore is a legitimate tool, its functionalities are commonly weaponized by adversaries for remote access, warranting a closer inspection.

  ### Blind Spots and Assumptions

  Detection accuracy may be limited by legitimate use of Miradore, requiring effective monitoring of the tool's authorized access patterns. Dependency on comprehensive Windows file event logging is essential for reliable detection. Legitimate administrative activities may frequently trigger this alert, especially in environments using Miradore. Companion detections such as monitoring for unusual user account activity (e.g., multiple login attempts or access at odd hours) can enhance overall security coverage against potential abuse.

