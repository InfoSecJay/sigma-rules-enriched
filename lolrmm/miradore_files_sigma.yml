note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Miradore Remote Management (RMM) tool, specifically targeting its installation directory and a known dynamic-link library (DLL). The likely attacker objective behind triggering this rule would be to misuse the RMM tool for unauthorized remote access or control over endpoint devices. This relates to the MITRE ATT&CK tactic of Execution (TA0002) and specifically to the technique of "User Execution" (T1203), where an adversary might execute malicious code under the guise of legitimate remote management software.

  The primary telemetry sources are Windows file event logs, specifically monitoring file activity related to the Miradore installation path and the `7z.dll` file. If this activity is malicious, it could result in unauthorized access and data compromise. However, it is important to note that this detection does NOT confirm malicious activity on its own; legitimate operational use of the Miradore tool can also result in similar file activity.

  ### Investigation Steps

  - **Examine file paths of activity:** Review Windows file event logs (Event ID 4663) for `C:\Program Files\Miradore\OnlineClient\bin\` and `7z.dll` access attempts. Confirm legitimate processes by checking for known user accounts or authorized management operations.

  - **Identify associated processes:** Use Sysmon Event ID 1 to track process creation linked to the Miradore tool's binary files and `7z.dll`. Look for unusual parent-child relationships that deviate from documented operational behavior.

  - **Correlate IP addresses for connections:** Check firewall logs for outbound connections initiated by Miradore binaries. Focus on unusual external IP addresses that do not match known management endpoints (e.g., 443 access to Miradore's cloud endpoint).

  - **Inspect user accounts involved:** Review User and Group logs (Event ID 4720, 4728) for any changes or anomalous activity related to accounts accessing the Miradore tool. Legitimate activity should predominantly be logged under specific administrative accounts.

  - **Verify scheduled tasks or scripts:** Check for Windows Task Scheduler logs (Event ID 106) for scheduled tasks that may have been created recently, which could indicate persistence mechanisms tied to the Miradore tool.

  ### Prioritization

  This alert should be considered medium severity due to the potential for impact on managed systems via unauthorized remote access. The likelihood of malicious abuse is moderate, as RMM tools are often misused by attackers. While Miradore has legitimate purposes, the behavior detected can be weaponized, hence the need for thorough investigation.

  ### Blind Spots and Assumptions

  Detection limitations include attackers potentially using alternate methods to hide malicious activity associated with Miradore or employing legitimate access credentials. Reliable detection requires complete auditing of file access logs and regular monitoring of system change logs. Common legitimate activities that may trigger this alert include scheduled maintenance or remote troubleshooting done by IT staff. A related detection to consider is monitoring for suspicious internet connections from managed devices to external IPs not documented in approved access lists.

