note: |
  ### Technical Context

  This rule detects the execution of processes by the Tactical RMM tool, which can be used by administrators for remote monitoring and management. However, adversaries may also leverage this tool for unauthorized remote access and control to further their objectives. The likely attacker objective is gaining persistent access to systems under the guise of legitimate administrative activities. The relevant MITRE ATT&CK tactic is Execution, and the technique is Remote Management Tools (T1219).

  The primary telemetry source comes from Windows process creation logs, specifically focusing on events where the process name ends with 'tacticalrmm.exe'. If this process is maliciously employed, it can lead to unauthorized access and potential data exfiltration. This detection does NOT confirm malicious intent or activity on its own, as Tactical RMM can be legitimately used by IT staff for system management.

  ### Investigation Steps

  - **Check process details in Security Event ID 4688:** Review Event ID 4688 for process creation involving 'tacticalrmm.exe' and note the parent process. Confirm if this aligns with expected administrative workflows.

  - **Correlate with user account:** Analyze associated user account activity for anomalies. Review logon events (Event ID 4624) around the same time to identify if a legitimate admin was logged in or if unauthorized access is indicated.

  - **Examine parent process trajectory:** Investigate the parent process of 'tacticalrmm.exe'. Legitimate instances will often originate from known administrative tools or services, while suspicious instances may have benign origins.

  - **Review related network connections:** Check for outbound network activity related to the Tactical RMM tool through firewall logs (e.g., Event ID 5156). High volumes of connections to external IPs post-process activation could indicate malicious activity.

  - **Validate installation and authorization:** Confirm via installed software lists (e.g., using PowerShell or MSI logs) whether Tactical RMM is officially deployed and configured for management purposes. Unauthorized installations are a red flag.

  ### Prioritization

  This alert carries medium severity due to the potential impact on systems managed by Tactical RMM, which are usually critical to business operations. The likelihood of abuse is moderate, as the tool is often weaponized by attackers who want to disguise their presence during remote sessions. The usage of such tools inappropriately can facilitate further compromises within the network.

  ### Blind Spots and Assumptions

  Detections can be evaded if attackers rename or obfuscate the 'tacticalrmm.exe' process. Reliable detection requires comprehensive monitoring of Windows process creation events across all enterprise systems where administrative tools are deployed. Legitimate administrative use of Tactical RMM is common and can trigger this alert, emphasizing the need for contextual investigation. Related detections, such as monitoring for unauthorized remote access tools (e.g., AnyDesk, TeamViewer) can enhance coverage against similar threats.

