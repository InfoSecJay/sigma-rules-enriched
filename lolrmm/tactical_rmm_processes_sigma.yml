  ---

  ### Technical Context

  This detection identifies process activity related to Tactical RMM (Remote Monitoring and Management) tools, specifically the execution of processes spawned by or directly using `tacticalrmm.exe`. The likely objective of an attacker using this tool is to gain unauthorized access and control over managed systems, potentially leading to further exploitation or lateral movement within the network. The relevant MITRE ATT&CK tactic is **Execution**, and the technique is **Remote System Manipulation (T1219)**.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process creation events and their parent-child relationships. If malicious, the use of Tactical RMM could facilitate persistent access and enable attackers to push additional malware or exfiltrate sensitive data. However, this detection does NOT confirm malicious intent on its own, as legitimate instances of Tactical RMM usage can occur.

  ---

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 or Sysmon Event ID 1 for process creations with the command line containing `tacticalrmm.exe`. Confirm the context of the process (e.g., executed as SYSTEM or a privileged user).

  - **Examine parent process relationships**: Identify the parent process of the `tacticalrmm.exe` instance. A legitimate parent would typically be a user-initiated process, while unexpected parent processes (e.g., `powershell.exe` or `cmd.exe`) should raise suspicion.

  - **Verify timestamps and user accounts**: Cross-reference the execution timestamp and the user account associated with the process. Legitimate use often aligns with maintenance windows for system updates, whereas unexpected execution during off-hours might indicate malicious activity.

  - **Identify concurrent processes and network activity**: Look for related processes or network activity. Check for abnormal outbound connections or unexpected command-and-control traffic linked to the same timestamp. Look for unexpected TCP connections on ports typically used by RMM tools.

  - **Document legitimate Tactical RMM usage**: Identify prior instances of legitimate use within the environment. Review documentation or asset management records to confirm if Tactical RMM is authorized for use on the affected host.

  ---

  ### Prioritization

  The alert severity is medium due to the potential for Tactical RMM tools to be leveraged maliciously, impacting critical systems, especially in managed IT environments. While Tactical RMM is primarily used for legitimate maintenance, its abuse is increasingly weaponized, making this detection essential for monitoring suspicious activity.

  ---

  ### Blind Spots and Assumptions

  Detection may miss cases where the Tactical RMM execution is obfuscated or where legitimate accounts have been compromised, allowing unauthorized access. Accurate detection relies on the presence of security logs from endpoints configured to record process creation events. Common benign activities such as authorized patch management or system maintenance might trigger this alert, complicating investigations. A companion detection rule monitoring for lateral movement (e.g., abnormal remote desktop connections) may enhance context around this detection.

