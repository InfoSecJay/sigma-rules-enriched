note: |
  ### Technical Context

  This Sigma rule detects the process activity associated with Tactical RMM (Remote Monitoring and Management), a tool often used for remote access and system maintenance. The likely attacker objective is to leverage this tool to gain unauthorized access to systems, execute commands, or perform other malicious actions under the guise of legitimate remote management. The relevant MITRE ATT&CK tactic is Execution (T1203), and the technique is Remote Access Software (T1219).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which capture process execution details. If the activity is malicious, it could lead to system compromise, data exfiltration, or persistence mechanisms. However, this detection alone does NOT confirm malicious intent; legitimate system administrators may also utilize Tactical RMM for maintenance purposes.

  ### Investigation Steps

  - **Check process creation logs:** Confirm the presence of Tactical RMM processes by reviewing Security Event ID 4688 and Sysmon Event ID 1 for timestamps, user accounts, and command-line arguments. Look for context to determine if the activity aligns with known maintenance windows or scheduled tasks.

  - **Review the parent process:** Investigate the parent process for the Tactical RMM instances. A legitimate process should typically be an administrative utility or a scheduled task; contrast with suspicious parent processes (such as cmd.exe or powershell.exe) which may indicate exploitation.

  - **Identify execution context:** Examine the user account associated with the Tactical RMM execution. System accounts or administrative accounts actively managing systems are benign, whereas unexpected accounts might indicate compromise.

  - **Analyze command-line parameters:** Review the command line executed alongside Tactical RMM in Sysmon Event ID 1. Looking for arguments that deviate from the standard operational use can indicate potential misuse or malicious behavior.

  - **Check asset criticality:** If Tactical RMM is running on critical infrastructure (e.g., domain controllers, database servers), prioritize further investigation due to its increased impact on security posture.

  - **Monitor for post-exploitation behavior:** Assess for subsequent actions that utilize Tactical RMM, such as suspicious file transfers or command executions, recorded in event logs such as PowerShell logs (Event ID 4104) or network logs (x22 TCP connections).

  ### Prioritization

  This alert has a medium severity due to the potential impact of Tactical RMM being used inappropriately on critical systems. The likelihood of malicious abuse is moderate, as the tool is commonly employed for legitimate remote management but can be leveraged by attackers for persistence and command execution following a breach.

  ### Blind Spots and Assumptions

  There are limitations to this detection; adversaries may rename or obfuscate Tactical RMM to evade detection. Reliable detection requires proper logging configurations to capture process creation events comprehensively. Legitimate activities include scheduled maintenance or updates performed using Tactical RMM. A related detection for RMM-related file modification (like File Integrity Monitoring logs) could strengthen overall coverage by tracking changes made once access is obtained.

