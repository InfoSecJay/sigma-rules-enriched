note: |
  ### Technical Context

  This Sigma rule detects process creation and parent-child relationships involving the Tactical RMM (Remote Monitoring and Management) tool. The behavior typically indicates potential unauthorized access to systems, as Tactical RMM is often used by adversaries for remote control and management of compromised environments. The relevant MITRE ATT&CK tactic is **Command and Control (T1071)**, with the technique identified as **Application Layer Protocol (T1219)**.

  The main telemetry source for detection is the Windows process creation logs, specifically capturing Event ID 4688. If this activity is malicious, it can lead to significant security impacts, such as unauthorized system manipulation and data exfiltration. However, detection by this rule does NOT confirm that an incident has occurred on its own; it merely identifies instances of potential Tactical RMM usage.

  ### Investigation Steps

  - **Verify process creation details: ** Examine Security Event ID 4688 to identify process creation events for Tactical RMM. Look for the `Image` field containing `\tacticalrmm.exe` and evaluate the `CommandLine` for unusual arguments suggesting malicious intent.

  - **Check parent processes: ** Analyze the parent process of Tactical RMM instances from Event ID 4688 records. Legitimate use typically has parent processes like system management tools (e.g., `powershell.exe` for legitimate administrative tasks) as opposed to malicious executables.

  - **Determine process execution context: ** Validate the account used to launch Tactical RMM; suspicious activity is indicated if executed under service accounts or accounts with elevated privileges that do not typically manage Remote Monitoring and Management.

  - **Identify unusual network connections: ** Inspect outbound connections from the host running Tactical RMM. Record any unexpected connections attempting to reach unrecognized IP addresses or domains, indicating potential C2 activity.

  - **Review for associated files: ** Validate the file creation and access patterns under Tactical RMM paths (e.g., `C:\Program Files\TacticalRMM`). Check for unexpected file modifications or newly created files that suggest misuse or credential harvesting.

  ### Prioritization

  The severity of this alert is marked as medium due to the potential risk posed by unauthorized use of RMM tools, which can facilitate lateral movement and extensive access in the environment. The likelihood of malicious abuse is moderate, given that RMM tools are often weaponized in intrusions but can also have legitimate administrative purposes.

  ### Blind Spots and Assumptions

  Detection may be limited if Tactical RMM is used legitimately by admins, which could cause false positives. Reliable detection relies on the availability of process creation logs (Event ID 4688) and a full understanding of the legitimate usage of RMM tools within the organization. Legitimate administrative tasks, especially during support sessions, may trigger this alert. Companion detections that could enhance coverage include monitoring for anomalous PowerShell commands or analyzing network communication patterns for known C2 indicators.

