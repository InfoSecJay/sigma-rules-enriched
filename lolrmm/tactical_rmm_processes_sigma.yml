note: |
  ### Technical Context
  This detection rule monitors for potential process activity associated with the Tactical RMM (Remote Monitoring and Management) tool. Tactical RMM is commonly utilized by IT service providers for remote management, monitoring, and automation tasks. The detection focuses on identifying instances where the Tactical RMM executable (`tacticalrmm.exe`) is launched, potentially indicating either legitimate operations or malicious use by threat actors attempting to exploit remote administration capabilities for unauthorized access.

  The primary threat scenario involves attackers leveraging Tactical RMM for lateral movement, establishing persistence, or executing remote commands to manipulate and exfiltrate sensitive data from compromised systems. This can occur in environments where attackers have gained initial access and seek to maximize their control over enterprise assets. The relevant MITRE ATT&CK tactics for this behavior include **Execution** (TA0002) and the technique **Remote Services** (T1219).

  The key telemetry sources for this detection include process creation events from Windows systems, where logs can reveal unusual behavior associated with the Tactical RMM executable. Investigating these logs can help determine if the activity is part of legitimate operations or indicative of malicious behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs for any instances of `tacticalrmm.exe`, specifically focusing on the context of the parent process. Look for unusual parent processes or execution paths that could indicate suspicious activity.

  - **Correlate with Network Activity**: Check network traffic logs (from EDR or NDR solutions) to identify any anomalous connections initiated by systems running Tactical RMM. Look for unexpected communication patterns or destinations that could signal data exfiltration or command-and-control efforts.

  - **Check User Accounts**: Investigate user accounts associated with the execution of Tactical RMM. Verify if these accounts have the appropriate level of access and if there is any unusual account behavior, such as logins from atypical locations or times.

  - **Investigate System Integrity**: Conduct a thorough examination of the system running Tactical RMM to check for other associated artifacts, such as other malicious processes, scheduled tasks, or changes to critical system files that could suggest further compromise.

  ### Prioritization
  The alert is rated as medium severity due to the potential risk Tactical RMM poses if exploited by an attacker to maintain persistence or conduct further malicious activities on an enterprise network. While tactical RMM can be used legitimately by IT support staff, any unauthorized use is likely to have a significant impact on security and operational integrity.

  ### Blind Spots and Assumptions
  This detection rule may miss cases where `tacticalrmm.exe` is invoked through alternate means, such as scripts or command line tools that do not display as direct process creation. Additionally, it assumes that Tactical RMM is not being used legitimately by in-scope personnel, which may lead to false positives. For the rule to function effectively, appropriate logging configurations must be in place for process creation events on the Windows endpoints being monitored.

