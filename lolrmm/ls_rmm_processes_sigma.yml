note: |
  ### Technical Context

  This rule detects process activity associated with the LS RMM (Remote Monitoring and Management) tool, particularly when it runs under the context of its parent process (`LS RMM.exe` or `LS RMM Worker.exe`). Attackers may leverage RMM tools for unauthorized remote access, data exfiltration, or lateral movement within an environment. The relevant MITRE ATT&CK technique for this activity is Remote Tool Access (T1219).

  The primary telemetry sources for this detection are Windows process creation events, primarily Security Event ID 4688 and Sysmon Event ID 1. If the detected activity is malicious, it may allow attackers to control, monitor, or manipulate endpoint devices stealthily. It is important to note that this detection does NOT confirm malicious behavior on its own, as the LS RMM tool is also used legitimately for system management.

  ### Investigation Steps

  - **Verify process creation details:** Investigate Security Event ID 4688 or Sysmon Event ID 1 for process creation events that include the `Image` field indicating the process name (`LS RMM.exe` or `LS RMM Worker.exe`). Look for unusual timestamps or non-standard execution paths.

  - **Check parent process lineage:** Analyze the `ParentImage` field in the process creation events to confirm that it ends with either `\\LS RMM.exe` or `\\LS RMM Worker.exe`. Legitimate instances will typically have a direct administrative context.

  - **Cross-reference user account activity:** Confirm the account associated with the process creation; legitimate LS RMM usage often involves known administrative accounts. Review event logs (Security Event ID 4624) for user login events that correspond with the suspicious process activity.

  - **Review recent software deployment or update logs:** Assess if the LS RMM had any recent updates or installations that explain its activity. Look through application logs or MSIEXEC logs to correlate installations or updates with the timestamps of the detected activity.

  - **Identify other suspicious activity on the host:** Utilize Sysmon or relevant Windows logs to look for concurrent suspicious network connections or file activity (Event ID 11 for file creation in unusual directories) that could indicate malicious intent.

  ### Prioritization

  This alert should be treated as medium priority within the enterprise context, as LS RMM tools can facilitate extensive remote access if used maliciously. The likelihood of adversarial abuse is moderate due to the increasing use of RMM tools in cyber incidents, and similar behaviors are frequently observed during targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be bypassed if adversaries rename legitimate tools or use custom binaries that mimic LS RMM processes. Consistent log collection from endpoints, including both process creation and user login events, is needed to ensure reliable detection. Legitimate administrative activities, such as routine maintenance or system updates, may also trigger this alert. A related detection to consider is monitoring for unusual outbound network connections associated with high-risk processes, which can further strengthen coverage against remote access abuses.

