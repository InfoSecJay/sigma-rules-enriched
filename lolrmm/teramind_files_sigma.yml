note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Teramind Remote Monitoring and Management (RMM) tool. The likely attacker objective is to install or utilize a remote monitoring solution for espionage or data exfiltration. The behavior falls under the MITRE ATT&CK techniques of Command and Control (T1071.001: Application Layer Protocol) and potentially Remote Access Tools (T1219). Primary telemetry sources include Windows file event logs, specifically monitoring for file creation, modification, or deletion events in specified directories relevant to Teramind. If malicious, this activity could facilitate unauthorized monitoring or data collection from user devices. This detection alone does not confirm malicious intent or activity without additional context, such as unusual processes or user behavior.

  ### Investigation Steps

  - **Check for unusual files in Teramind directories:** Review Windows Security Event ID 4663 for file access logs in the directories `C:\ProgramData\Teramind Agent\` and the GUID path. Verify whether these files were accessed by unrecognized or uncommon user accounts.

  - **Investigate Process Dependencies:** Utilize Sysmon Event ID 1 to check for parent-child relationships involving detected Teramind file activities, particularly if `rundll32.exe.config` is invoked by suspicious parent processes, indicating possible evasion tactics.

  - **Confirm legitimate use of Teramind:** Cross-reference the file activities against an inventory of approved applications and ensure that the Teramind tool is recognized and deployed under a legitimate user profile within your organization.

  - **Review Recent Installations and Updates:** Look for recent installations or updates in Windows Event ID 1033 (MsiInstaller log access), specifically for `teramind_agent_*_*.msi`. This activity must align with organizational change management records.

  - **Analyze the content of detected files:** If `tmdiag.zip` or similar files are flagged, assess their content for malintent using a sandbox environment, since they may contain scripts or payloads that trigger further malicious operations.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for sensitive data collection via unsolicited software if confirmed malicious. The likelihood of exploitation is moderate, especially in environments lacking stringent application controls. The use of RMM tools like Teramind is growing in adversarial tactics, increasing the relevance of this detection.

  ### Blind Spots and Assumptions

  The detection is limited by the potential for shortcut paths or renamed files to avoid alerting. Logs from other security solutions or endpoint detection and response (EDR) systems should be configured to enhance logging and context around program execution. Legitimate activities may also include authorized configuration updates and usage reporting. Related detections, such as monitoring for suspicious outbound network traffic to known command-and-control servers (T1071), can strengthen coverage around this threat vector.

