note: |
  ### Technical Context

  This rule detects file activity associated with the Teramind Remote Monitoring and Management (RMM) tool, which can be used for surveillance or monitoring within systems. Attackers might leverage such tools with the intent to covertly observe user activity, exfiltrate data, or even deploy additional malicious components. The relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071) and Application Layer Protocol (T1219).

  Primary telemetry sources include Windows file event logs, specifically capturing file access or modifications within targeted directories associated with Teramind installations. If malicious, the presence of these files or their modifications can indicate potential insider threats or external breaches utilizing RMM tools. However, this detection does NOT confirm malicious intent on its own, as Teramind's use can also be legitimate within corporate environments.

  ### Investigation Steps

  - **Review file creation and modification logs**: Check Windows Security Event ID 4663 for access to files in `C:\ProgramData\Teramind Agent\` or its associated directories, focusing on timestamps and user accounts.

  - **Identify scheduled tasks**: Inspect Task Scheduler for any tasks that reference Teramind executables, particularly `tmagentsvc.exe` and `Teramind.Setup.Updater.exe`. Benign usage typically involves scheduled updates or monitoring actions.

  - **Examine user accounts associated with activity**: Look for unusual accounts accessing files within `C:\ProgramData\{4CEC2908-5CE4-48F0-A717-8FC833D8017A}\`. Legitimate internal accounts should correlate with known employees.

  - **Scan for specific indicators of compromise (IoCs)**: Investigate the presence of `teramind_agent_*_bundle_noredist_setup.msi` files on endpoints. The presence of these installation packages on unauthorized machines is indicative of potential misuse.

  - **Validate network traffic**: Check for unusual outbound connections to command and control servers from the systems with file URL patterns. Use Firewall or IDS logs to inspect IPs associated with unexpected traffic.

  ### Prioritization

  This alert is medium severity due to the potential impact on security and privacy concerning the systems involved. The likelihood of malicious abuse is moderate, especially in environments lacking proper oversight of monitoring tools like Teramind. While RMM tools can be used for legitimate purposes, they are also commonly weaponized by threat actors for surveillance.

  ### Blind Spots and Assumptions

  One limitation is that malicious users may uninstall or deliberately disguise the presence of the Teramind tool, evading detection. Effective detection relies on comprehensive logging of file system events and accurate configurations that account for all potential user access points. Additionally, legitimate corporate monitoring activities can trigger these alerts, complicating investigation. A companion detection rule that monitors network exfiltration attempts can strengthen overall coverage against potential misuse of the Teramind application.

