note: |
  ### Technical Context

  This Sigma rule detects file activity associated with the Teramind Remote Monitoring and Management (RMM) tool, specifically targeting file paths typically used by the software. The likely attacker objective includes the use of Teramind as a means to maintain persistent monitoring or exfiltration of data within the enterprise environment. The relevant MITRE ATT&CK tactics include Command and Control (TA0011) and the technique Remote Access Tools (T1219). Primary telemetry sources include Windows file event logs, specifically those detailing access to the defined file paths.

  If this behavior is confirmed to be malicious, it poses significant risks, including unauthorized surveillance, data leakage, and compromise of endpoint security. This detection does NOT confirm on its own whether the activity is legitimate or malicious, as it may also capture benign actions by authorized users utilizing the Teramind software.

  ### Investigation Steps

  - **Review affected file paths:** Check for activity in paths such as `C:\ProgramData\Teramind Agent\*` (Event ID 4663) for file access events or modifications that could indicate misuse versus legitimate use.

  - **Correlate with user activity:** Examine user accounts accessing these files via Windows Security Event ID 4624 (Logon) to determine if the file access matches typical user behavior within the organization.

  - **Identify high-confidence malicious indicators:** Look for execution of binaries such as `tmagentsvc.exe` from unusual locations or instances that do not match expected deployment configurations, confirming potential unauthorized installation.

  - **Analyze configuration changes:** Look for modifications under `C:\ProgramData\{4CEC2908-5CE4-48F0-A717-8FC833D8017A}\config` reflecting suspicious settings indicative of evasion or monitoring outside typical processes.

  - **Document benign usage:** Cross-reference entries for known legitimate scheduling activities such as scheduled tasks or updates tied to the Teramind installation timeline, verifying expected operational behavior.

  - **Assess network communications:** Monitor network logs (e.g., firewall logs, NetFlow) for unusual outbound connections related to Teramind file activities, especially those initiating communications to unknown external IP addresses.

  ### Prioritization

  The alert severity is medium due to the essential role of file activities associated with Teramind in monitoring business operations. However, the likelihood of malicious abuse exists due to the increased adoption of such tools for surveillance by adversaries. This behavior is indeed weaponized by attackers who aim to misuse legitimate monitoring tools.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers who may hide their actions under legitimate use cases, such as authorized admin activities with the Teramind tool. Required log sources include comprehensive file system auditing settings and network traffic monitoring to provide context. Legitimate activities that might invoke the alert could include authorized installations, updates, or security assessments conducted during business operations. A companion detection that strengthens coverage is monitoring for unusual process creation related to the same file paths through monitoring Windows Security Event ID 4688.

