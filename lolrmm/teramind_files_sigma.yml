note: |
  ### Technical Context

  This Sigma rule detects file activity related to the Teramind Remote Monitoring and Management (RMM) tool. While the intent behind using Teramind may be legitimate, attackers could exploit similar software to monitor user activity, exfiltrate sensitive data, or manipulate systems stealthily. The relevant MITRE ATT&CK tactic is Execution (TA0002) and the technique is User Execution (T1219).

  Primary telemetry sources include Windows file event logs (notably Event IDs related to file creation or modification). Malicious activity may lead to unauthorized observation of users or data exfiltration. This detection does NOT confirm malicious intent on its own; it may encompass legitimate use cases of Teramind by authorized personnel.

  ### Investigation Steps

  - **Review file activity logs**: Examine Windows file event logs for Security Event ID 4663 focusing on access to files in `C:\ProgramData\{4CEC2908-5CE4-48F0-A717-8FC833D8017A}\` and `C:\ProgramData\Teramind Agent\`. Look for unusual timestamps or access patterns, particularly outside business hours.

  - **Analyze the process execution**: Validate if any suspicious parent processes are creating or modifying Teramind-related files. Check for indicators like Sysmon Event ID 1 that may show unusual process trees.

  - **Identify legitimate behavior**: Determine whether there are known scheduled tasks or legitimate applications that use Teramind, especially in organizations using RMM tools. Validate the presence of such tasks in Task Scheduler.

  - **Correlate with network activity**: Cross-reference file activity logs with network traffic captures if available. Look for outbound connections matching known Teramind remote communication, particularly to unexpected external endpoints.

  - **Flag unusual installation files**: Investigate installations of Teramind files like `teramind_agent_*_setup.msi` or `tmagent-i(__<hash>).pkg`. Legitimate installations should have accompanying documentation and should not be executed from temporary folders.

  - **Check for abnormal access to sensitive data**: Look for files related to sensitive user data accessed by Teramind, especially if the data is outside typical usage patterns. Create alerts for access attempts to files not usually monitored by Teramind.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact on system integrity and the likelihood of malicious activity represented by non-standard use of RMM tools like Teramind. The behavior demonstrated is not uncommon in organizations focused on workforce management, but it can also signal malicious surveillance or insider threats.

  ### Blind Spots and Assumptions

  Limitations include the possibility of legitimate Teramind users triggering false positives, as well as potential evasion through legitimate system tools that mimic file paths or behaviors. Reliable detection requires comprehensive logging from endpoints and potential monitoring of network traffic for Teramind communications. This detection could be strengthened by correlating it with alerts from endpoint protection platforms or suspicious behavior alerts in user activity monitoring systems.

