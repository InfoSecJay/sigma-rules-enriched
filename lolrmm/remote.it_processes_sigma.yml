note: |
  ### Technical Context

  This detection rule identifies the execution of processes associated with the Remote.it RMM (Remote Monitoring and Management) tool. The likely attacker objective is to utilize Remote.it for unauthorized access or persistence on targeted systems, potentially facilitating command and control (C2) operations. This behavior fits the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Application Layer Protocol (T1219) as it may leverage legitimate software for malicious purposes.

  The primary telemetry source is Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which capture details about processes being created and their parent-child relationships. If the identified Remote.it processes are malicious, they could allow an attacker to gain unauthorized controls over systems. It is important to note that this detection does NOT confirm malicious intent by itself, as Remote.it can be used legitimately.

  ### Investigation Steps

  - **Review process details:** Examine Security Event ID 4688 logs for any occurrences of `remote-it-installer.exe`, `remote.it.exe`, or `remoteit.exe` being executed. Check the parent process to determine how it was initiated. Legitimate instances might originate from known administrative activity, such as IT support tasks.

  - **Analyze command line arguments:** Look for Sysmon Event ID 1 to retrieve command line arguments for the detected processes. Malicious indicators could include unusual flags or parameters that are not typical for standard Remote.it deployments.

  - **Check for persistence mechanisms:** Investigate if the Remote.it process is being loaded from unusual directories or if there are registry entries under `HKLM\Software\Microsoft\Windows\CurrentVersion\Run` referencing Remote.it tools. Legitimate installations should be located in standard directories like `C:\Program Files`.

  - **Validate network connections:** Examine network connection logs, such as Windows Firewall logs or Sysmon Event ID 3, for any unusual outbound connections made by the Remote.it process, particularly to external IPs known for malicious activity.

  - **Correlate with user activity:** Review User Activity logs or Windows Event ID 4624 (logon events) to confirm authorized user credentials executing the Remote.it processes. Look for signs of unauthorized accounts being associated with Remote.it activity.

  - **Consult asset criticality:** Assess the impacted host's role (e.g., server vs. workstation) and its criticality to determine the immediate urgency for response actions. Critical systems should be prioritized for further investigation.

  ### Prioritization

  This alert is medium priority due to the potential impact of Remote.it on critical systems, enabling remote access for attackers. The likelihood of malicious usage is moderate, given that tools like Remote.it are commonly employed in both legitimate user scenarios and by threat actors for persistent access. This behavior has been associated with various C2 frameworks, emphasizing the need for careful investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist since attackers may disguise their activity using legitimate software, making it challenging to distinguish between benign and malicious use solely based on process execution. Additionally, if process logging is not enabled or configured correctly, there may be gaps in visibility. Legitimate activities that might trigger this alert include authorized remote management sessions by IT staff or system administrators. A companion detection, such as monitoring for unusual outbound connections from other common remote management tools, can bolster threat detection capabilities in this area.

