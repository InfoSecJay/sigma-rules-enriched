note: |
  ### Technical Context
  This detection rule identifies the execution of processes associated with the Remote.it Remote Management and Monitoring (RMM) tool. Remote.it is a legitimate software used for establishing secure connections to devices over the internet, often employed for remote support or administration. However, threat actors can exploit such tools for unauthorized access to systems, enabling them to carry out reconnaissance, lateral movement, and other malicious activities.

  The primary attacker objective in scenarios involving Remote.it is typically unauthorized remote access to sensitive systems, which can lead to data exfiltration or system compromise. The rule aligns with several MITRE ATT&CK tactics, specifically **Execution** (TA0002) and the technique **T1219 - Remote Access Tools**. Primary data sources providing valuable evidence include **Windows process creation events**, which can reveal the spawning of potentially abused tools.

  ### Investigation Steps
  - **Analyze Process Creation Logs**: Review Windows process creation logs around the time of the alert. Look for instances where `remote-it-installer.exe`, `remote.it.exe`, or `remoteit.exe` was executed, focusing on the users and context in which these processes were launched.

  - **Examine Parent Process Relationships**: Investigate the parent processes associated with the identified Remote.it executables. Determine if they were initiated by legitimate sources or potentially malicious processes that could indicate abuse.

  - **Check User Activity**: Audit user accounts that have executed the Remote.it processes. Pay special attention to high-privilege accounts or anomalous logins correlated with the activity to assess whether this behavior aligns with legitimate use cases.

  - **Network Traffic Review**: Analyze outbound network traffic related to the Remote.it tool. Check for unusual external connections or data transfers initiated from devices using this RMM tool that could indicate unauthorized access or data exfiltration.

  ### Prioritization
  Alerts generated by this detection rule should be taken seriously due to the potential for significant operational impact caused by unauthorized remote access to systems. The medium severity level indicates an elevated risk of misuse, necessitating prompt investigation.

  ### Blind Spots and Assumptions
  This detection logic may have gaps, particularly in environments where Remote.it is used legitimately, leading to false positives. An assumption made is that all instances of the Remote.it processes executed are for malicious purposes; therefore, context about user behavior and legitimate use cases is critical. Additionally, the rule requires comprehensive logging of Windows process creation events, which must be configured and maintained to ensure accurate detection.

