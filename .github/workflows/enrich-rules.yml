name: Enrich Sigma Rules

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout enriched rules repo
        uses: actions/checkout@v4

      - name: Clone SigmaHQ (shallow)
        run: git clone --depth 1 https://github.com/SigmaHQ/sigma.git /tmp/sigmahq

      - name: Clone LOLRMM (shallow)
        run: git clone --depth 1 https://github.com/magicsword-io/LOLRMM.git /tmp/lolrmm

      - name: Clone sigma_jayinfosec (shallow)
        run: git clone --depth 1 https://github.com/InfoSecJay/sigma_jayinfosec.git /tmp/sigma_jayinfosec

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sigma-llm-doc
        run: pip install git+https://github.com/InfoSecJay/sigma-llm-doc.git

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enrich SigmaHQ rules
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          sigma-llm-doc /tmp/sigmahq/rules/ \
            --output ./sigmahq/ \
            --concurrency 10

      - name: Remove orphaned SigmaHQ rules
        run: |
          removed=0
          for f in $(find ./sigmahq/ -name '*.yml' -type f); do
            rel="${f#./sigmahq/}"
            if [ ! -f "/tmp/sigmahq/rules/$rel" ]; then
              echo "Removing orphaned rule: $rel"
              rm "$f"
              removed=$((removed + 1))
            fi
          done
          echo "Removed $removed orphaned SigmaHQ rules"

      - name: Commit SigmaHQ progress
        run: |
          git add -A sigmahq/
          if git diff --cached --quiet; then
            echo "No SigmaHQ changes to commit"
          else
            git commit -m "Update enriched SigmaHQ rules ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Enrich SigmaHQ Emerging Threats rules
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          sigma-llm-doc /tmp/sigmahq/rules-emerging-threats/ \
            --output ./sigmahq-emerging-threats/ \
            --concurrency 10

      - name: Remove orphaned Emerging Threats rules
        run: |
          removed=0
          for f in $(find ./sigmahq-emerging-threats/ -name '*.yml' -type f); do
            rel="${f#./sigmahq-emerging-threats/}"
            if [ ! -f "/tmp/sigmahq/rules-emerging-threats/$rel" ]; then
              echo "Removing orphaned rule: $rel"
              rm "$f"
              removed=$((removed + 1))
            fi
          done
          echo "Removed $removed orphaned Emerging Threats rules"

      - name: Commit Emerging Threats progress
        run: |
          git add -A sigmahq-emerging-threats/
          if git diff --cached --quiet; then
            echo "No Emerging Threats changes to commit"
          else
            git commit -m "Update enriched Emerging Threats rules ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Preprocess LOLRMM rules (fix invalid YAML)
        run: |
          # Download the preprocessing script from sigma-llm-doc repo
          curl -sO https://raw.githubusercontent.com/InfoSecJay/sigma-llm-doc/master/scripts/fix_lolrmm_yaml.py
          python fix_lolrmm_yaml.py /tmp/lolrmm/detections/sigma/

      - name: Enrich LOLRMM rules
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          sigma-llm-doc /tmp/lolrmm/detections/sigma/ \
            --output ./lolrmm/ \
            --concurrency 10

      - name: Remove orphaned LOLRMM rules
        run: |
          removed=0
          for f in ./lolrmm/*.yml; do
            [ -f "$f" ] || continue
            basename=$(basename "$f")
            if [ ! -f "/tmp/lolrmm/detections/sigma/$basename" ]; then
              echo "Removing orphaned rule: $basename"
              rm "$f"
              removed=$((removed + 1))
            fi
          done
          echo "Removed $removed orphaned LOLRMM rules"

      - name: Commit LOLRMM progress
        run: |
          git add -A lolrmm/
          if git diff --cached --quiet; then
            echo "No LOLRMM changes to commit"
          else
            git commit -m "Update enriched LOLRMM rules ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Enrich sigma_jayinfosec rules
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          sigma-llm-doc /tmp/sigma_jayinfosec/rules/             --output ./jayinfosec/             --concurrency 10

      - name: Remove orphaned sigma_jayinfosec rules
        run: |
          removed=0
          for f in $(find ./jayinfosec/ -type f \( -name '*.yml' -o -name '*.yaml' \)); do
            rel="${f#./jayinfosec/}"
            if [ ! -f "/tmp/sigma_jayinfosec/rules/$rel" ]; then
              echo "Removing orphaned rule: $rel"
              rm "$f"
              removed=$((removed + 1))
            fi
          done
          echo "Removed $removed orphaned sigma_jayinfosec rules"

      - name: Commit sigma_jayinfosec progress
        run: |
          git add -A jayinfosec/
          if git diff --cached --quiet; then
            echo "No sigma_jayinfosec changes to commit"
          else
            git commit -m "Update enriched sigma_jayinfosec rules ($(date -u +%Y-%m-%d))"
            git push
          fi
